/* ============================================================================
   4) คลังแม่แบบโจทย์
   ทุกแม่แบบคืนค่า null ได้ถ้าตัวเลขที่สุ่มมาไม่สวย ระบบจะสุ่มใหม่ให้เอง
   ========================================================================== */
function T(o) { TPL.push(o); TPL_BY_ID[o.id] = o; }

/** ลงทะเบียน "โจทย์ทฤษฎี" — ปรนัย 4 ตัวเลือก เน้นความเข้าใจ ไม่ต้องคำนวณ
    o.gen(R) ต้องคืน { stem, choices, idea, why, figure? }
      choices : [{ text, correct?, why }] ต้องมี 4 ตัว และถูกเพียงตัวเดียว
                why ของแต่ละตัวเลือกคือคำอธิบายว่าถูก/ผิดเพราะอะไร
      idea    : แนวคิดหลักที่ใช้ตัดสิน
      why     : ข้อสรุปที่ต้องจำไปใช้ต่อ
    ระบบสับลำดับตัวเลือกตาม seed ให้เอง นักเรียนจึงจำตำแหน่งข้อถูกไม่ได้ */
function TQ(o) {
  T({
    id: o.id, topic: o.topic, sub: o.sub, level: THEORY_LEVEL, skills: o.skills || [],
    gen(R, c) {
      const q = o.gen(R, c);
      if (!q || !q.choices || q.choices.length !== 4) return null;
      q.choices = R.shuffle(q.choices);
      q.given = []; q.finds = [];
      return q;
    }
  });
}
/** ตัวช่วยเขียนตัวเลือก: ถูก = C('ข้อความ','เพราะ...') ผิด = X('ข้อความ','ที่ผิดคือ...') */
function C(text, why) { return { text: text, correct: true, why: why }; }
function X(text, why) { return { text: text, correct: false, why: why }; }
/** ตัวเลข+หน่วย สำหรับแทรกในเนื้อโจทย์ */
function U(v, u) { return M(fmt(v) + (u ? ' `' + u + '`' : '')); }
/** ตรวจว่าค่าที่จะเอาไปเป็น "สิ่งที่โจทย์กำหนด" สวยพอหรือไม่ */
function ok2(){ for (const v of arguments) { if (!isFinite(v) || dpOf(v, 4) > 2) return false; } return true; }
/** เศษส่วนสำหรับแทรกในเนื้อโจทย์ ตามรูปที่เขียนมา ไม่ย่อ เช่น FR(3,4) */
function FR(n, d) { return M(fracRaw(n, d)); }
/** เศษส่วนอย่างต่ำสำหรับแสดงคำตอบ เช่น FRL(6,8) ได้ 3/4 */
function FRL(n, d) { return M(fracTxt(n, d)); }
/** สร้าง find ของคำตอบชนิดเศษส่วน — ย่อให้อยู่ในรูปอย่างต่ำอัตโนมัติ
    ส่ง lowest = false ถ้าโจทย์ไม่ได้บังคับให้ตอบเป็นเศษส่วนอย่างต่ำ */
function FF(sym, n, d, desc, lowest) {
  const r = reduceFrac(n, d);
  return { s: sym, d: desc, value: r[0] / r[1], kind: 'frac', num: r[0], den: r[1],
           lowest: lowest !== false };
}
/** สุ่มเศษส่วนแท้ที่ย่ออย่างต่ำแล้ว ตัวส่วนอยู่ในช่วง [dmin, dmax] */
function randFrac(R, dmin, dmax) {
  for (let k = 0; k < 80; k++) {
    const d = R.int(dmin, dmax);
    if (d < 2) continue;
    const n = R.int(1, d - 1);
    if (gcd(n, d) === 1) return [n, d];
  }
  return [1, 2];
}

      given: [{ s: 'D', v: D, unit: 'g/cm³', d: 'ความหนาแน่นของสาร' },
              { s: 'V', v: V, unit: 'cm³', d: 'ปริมาตรที่ตวงมา' }],
      finds: [{ s: 'm', unit: 'g', d: 'มวลของสาร', value: m, positive: true }],
      distract: [r2(V / D), r2(V - D), r2(D + V), r2(m / 2)],
      sol: {
        analyze: 'ข้อนี้กลับกันกับข้อที่ให้มวลมาหาความหนาแน่น — คราวนี้<b>รู้ความหนาแน่นแล้ว</b> ต้องหามวล<br>' +
          'จึงย้ายข้างสูตรเดิมให้ ' + M('m') + ' อยู่โดด ๆ<br>' +
          '<b>กับดักของข้อนี้:</b> เอาปริมาตรหารด้วยความหนาแน่น ซึ่งจะได้หน่วยเพี้ยนทันที',
        eqs: [{ eq: 'D = frac(m,V)  ⇒  m = D × V', why: 'คูณ V ทั้งสองข้างเพื่อย้าย V ขึ้นมา' },
              { eq: 'ตรวจหน่วย: `g/cm^3` × `cm^3` = `g`', why: 'หน่วยลงตัวเป็นกรัม แปลว่าใช้สูตรถูกด้าน' }],
        solve: EQ('m = D × V'),
        subst: SEQ('m = {D} × {V}', { D: D, V: V }),
        calc: EQ('m = ' + fmtq(m) + ' `g`'),
        conclude: 'ดังนั้น <b>มวลเท่ากับ ' + M(fmtq(m) + ' `g`') + '</b><br>' +
          '<span class="hint">ตรวจย้อนกลับ: ' + M(fmtq(m) + ' ÷ ' + fmtq(V) + ' = ' + fmtq(D)) + ' ตรงกับความหนาแน่นที่โจทย์ให้ ✓</span>'
      }
    };
  }
});

T({

      given: [{ s: 'D_ก', v: Da, unit: 'g/cm³', d: 'ความหนาแน่นของสาร ก' },

      sol: {

          'ทำได้สองทาง: หามวลทีละสารแล้วลบกัน หรือใช้<b>ผลต่างความหนาแน่น</b>คูณปริมาตรทีเดียว<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบผลต่างความหนาแน่น (' + fmtq(Db - Da) + ') ทั้งที่โจทย์ถามมวลเป็นกรัม',
        eqs: [{ eq: 'm = D × V', why: 'มวลของแต่ละสารเมื่อรู้ความหนาแน่นและปริมาตร' },

        conclude: 'ดังนั้น <b>สาร ข หนักกว่าสาร ก อยู่ ' + M(fmtq(mb - ma) + ' `g`') + '</b><br>' +

      }
    };
  }
});

T({

      given: [{ s: 'มวลเกลือ', v: salt, unit: 'g', d: 'ตัวละลาย' },
              { s: 'มวลน้ำ', v: water, unit: 'g', d: 'ตัวทำละลาย' }],
      finds: [{ s: 'ร้อยละโดยมวล', unit: '%', d: 'สัดส่วนของเกลือในสารละลาย', value: pct, positive: true }],
      sol: {
        analyze: 'สารละลายเป็น<b>สารผสม</b> จึงบอกอัตราส่วนของส่วนประกอบได้<br>' +
          'ตัวหารต้องเป็น<b>มวลของสารละลายทั้งหมด</b> ไม่ใช่มวลน้ำอย่างเดียว<br>' +
          '<b>กับดักของข้อนี้:</b> หารด้วยมวลน้ำ (' + fmtq(water) + ' g) ซึ่งลืมนับมวลเกลือที่ละลายอยู่ในนั้น',
        eqs: [{ eq: 'มวลสารละลาย = มวลตัวละลาย + มวลตัวทำละลาย', why: 'เกลือไม่ได้หายไปไหน ยังอยู่ในสารละลายครบ' },
              { eq: 'ร้อยละโดยมวล = frac(มวลตัวละลาย,มวลสารละลาย) × 100', why: 'นิยามของความเข้มข้นร้อยละโดยมวล' }],
        solve: EQ('มวลสารละลาย = ' + salt + ' + ' + water + ' = ' + total + ' `g`'),
        subst: SEQ('ร้อยละ = frac({s},{t}) × 100', { s: salt, t: total }),
        calc: EQ('ร้อยละ = ' + fmtq(pct) + ' `%`'),
        conclude: 'ดังนั้น <b>สารละลายมีเกลืออยู่ร้อยละ ' + M(fmtq(pct)) + ' โดยมวล</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: เกลือน้อยกว่าน้ำมาก ค่าที่ได้จึงต้อง<b>น้อยกว่า 50%</b> ✓</span>'
      }
    };
  }
});

TQ({
  id: 's1c-t-mag', topic: 102, sub: 'กล้องจุลทรรศน์',
  skills: ['คำนวณกำลังขยายรวม', 'เข้าใจว่ากำลังขยายคูณกัน'],
  gen(R) {
    const a = R.pick([4, 10, 40]), b = R.pick([10, 15]);
    return {
      stem: 'ใช้กล้องจุลทรรศน์ที่มีเลนส์ใกล้วัตถุกำลังขยาย ' + U(a) + ' เท่า และเลนส์ใกล้ตา ' +
        U(b) + ' เท่า<br>กำลังขยายรวมของภาพที่เห็นเป็นเท่าใด และคิดอย่างไร',
      choices: [
        C(U(a * b) + ' เท่า เพราะเลนส์สองอันขยายภาพ<b>ต่อกัน</b> จึงเอากำลังขยายมา<b>คูณ</b>กัน',
          'ภาพจากเลนส์ใกล้วัตถุถูกเลนส์ใกล้ตาขยายซ้ำอีกชั้น ผลจึงเป็นการคูณ ไม่ใช่การบวก'),
        X(U(a + b) + ' เท่า เพราะเอากำลังขยายของสองเลนส์มาบวกกัน',
          'ถ้าบวกกัน กล้องที่มีเลนส์ 1 เท่าสองอันจะขยายได้ 2 เท่า ทั้งที่จริงต้องได้ภาพขนาดเดิม'),
        X(U(Math.max(a, b)) + ' เท่า เพราะใช้ค่าของเลนส์ที่ขยายได้มากกว่า',
          'เลนส์ที่เหลือก็ทำงานอยู่ด้วย ไม่ได้ถูกข้ามไป'),
        X(U(r2(Math.max(a, b) / Math.min(a, b))) + ' เท่า เพราะเอาค่ามากหารค่าน้อย',
          'การหารไม่มีความหมายในบริบทนี้ · การขยายภาพต่อกันเป็นการคูณเสมอ')
      ],
      idea: '<b>กำลังขยายรวม = กำลังขยายเลนส์ใกล้วัตถุ × กำลังขยายเลนส์ใกล้ตา</b><br>' +
        M(a + ' × ' + b + ' = ' + (a * b)) + ' เท่า',
      why: '<b>สิ่งที่ต้องจำ:</b> ขยายซ้อนกันเป็นชั้น ๆ ให้<b>คูณ</b>เสมอ ไม่ใช่บวก<br>' +
        'ขนาดจริงหาได้จาก ' + M('frac(ขนาดที่มองเห็น,กำลังขยายรวม)') + ' ซึ่งเป็นการทำงานย้อนกลับ'
    };
  }
});

T({

        U(b) + ' เท่า<br>จงหา<b>กำลังขยายรวม</b>',
      given: [{ s: 'เลนส์ใกล้วัตถุ', v: a, unit: 'เท่า', d: 'อยู่ใกล้สไลด์' },
              { s: 'เลนส์ใกล้ตา', v: b, unit: 'เท่า', d: 'อยู่ใกล้ตาผู้ส่อง' }],
      finds: [{ s: 'กำลังขยายรวม', unit: 'เท่า', d: 'ขนาดภาพเทียบกับของจริง', value: M2, positive: true, kind: 'int' }],
      distract: [a + b, r2(M2 / 2), Math.abs(a - b), M2 * 2],
      sol: {
        analyze: 'กล้องจุลทรรศน์มีเลนส์สองชุดทำงาน<b>ต่อกัน</b> — เลนส์ใกล้วัตถุขยายก่อน แล้วเลนส์ใกล้ตาขยายภาพนั้นซ้ำอีกที<br>' +
          'การขยายซ้อนกันเป็นชั้น ๆ ต้อง<b>คูณ</b>กัน<br>' +
          '<b>กับดักของข้อนี้:</b> เอามาบวกกันเป็น ' + (a + b) + ' เท่า ซึ่งจะทำให้กล้องที่ใช้เลนส์ 1 เท่าสองอัน กลายเป็นขยาย 2 เท่า',
        eqs: [{ eq: 'กำลังขยายรวม = กำลังขยายเลนส์ใกล้วัตถุ × กำลังขยายเลนส์ใกล้ตา',
                why: 'ภาพถูกขยายสองชั้นต่อกัน ผลจึงเป็นการคูณ' }],
        solve: EQ('กำลังขยายรวม = ' + a + ' × ' + b),
        subst: EQ('= ' + a + ' × ' + b),
        calc: EQ('= ' + M2 + ' เท่า'),
        conclude: 'ดังนั้น <b>กำลังขยายรวมเท่ากับ ' + M(M2 + ' เท่า') + '</b><br>' +
          '<span class="hint">ความหมาย: สิ่งที่ยาว 1 ไมโครเมตรจริง จะดูเหมือนยาว ' + M2 + ' ไมโครเมตรในภาพ</span>'
      }
    };
  }
});

T({
  id: 's1c-real', topic: 102, sub: 'กล้องจุลทรรศน์', level: 'ง่าย',
  skills: ['หาขนาดจริงจากขนาดภาพ', 'ทำงานย้อนกลับ'],
  gen(R) {
    const real = R.step(10, 60, 5);
    const mag = R.pick([40, 100, 150, 400]);
    const img = real * mag / 1000;             // มิลลิเมตร
    if (dpOf(img, 4) > 2) return null;
    return {
      stem: 'ส่องเซลล์ด้วยกล้องกำลังขยายรวม ' + U(mag) + ' เท่า วัดภาพที่เห็นได้ยาว ' + U(img, 'mm') + '<br>' +
        'เซลล์จริงยาวกี่<b>ไมโครเมตร</b> (1 mm = 1000 μm)',
      given: [{ s: 'กำลังขยายรวม', v: mag, unit: 'เท่า', d: '' },
              { s: 'ความยาวของภาพ', v: img, unit: 'mm', d: 'ที่วัดได้จากภาพที่มองเห็น' }],
      finds: [{ s: 'ความยาวจริง', unit: 'μm', d: 'ขนาดจริงของเซลล์', value: real, positive: true, kind: 'int' }],
      distract: [r2(img * mag), r2(img * 1000), mag, r2(real * 2)],
      sol: {
        analyze: 'กล้องทำให้ภาพ<b>ใหญ่ขึ้น</b> ' + mag + ' เท่า ดังนั้นของจริงต้อง<b>เล็กกว่า</b>ภาพ ' + mag + ' เท่า<br>' +
          'ต้องแปลงหน่วยด้วย เพราะภาพวัดเป็นมิลลิเมตร แต่โจทย์ถามเป็นไมโครเมตร<br>' +
          '<b>กับดักของข้อนี้:</b> เอาไปคูณแทนที่จะหาร ทำให้ได้เซลล์ใหญ่กว่าเมล็ดถั่ว ซึ่งเป็นไปไม่ได้',
        eqs: [{ eq: 'ขนาดจริง = frac(ขนาดที่มองเห็น,กำลังขยายรวม)', why: 'กลับสูตรของกำลังขยายมาใช้' },
              { eq: '`1 mm = 1000 μm`', why: 'แปลงหน่วยให้ตรงกับที่โจทย์ถาม' }],
        solve: EQ('ขนาดจริง = frac(ขนาดภาพ,กำลังขยาย)'),
        subst: SEQ('= frac({i} `mm`,{m}) = {r} `mm`', { i: img, m: mag, r: r2(img / mag) }),
        calc: EQ('= ' + fmtq(img / mag) + ' × 1000 = ' + real + ' `μm`'),
        conclude: 'ดังนั้น <b>เซลล์จริงยาว ' + M(real + ' `μm`') + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: เซลล์ทั่วไปยาวราว 10-100 ไมโครเมตร ค่านี้จึงอยู่ในช่วงที่ควรเป็น ✓</span>'
      }
    };
  }
});

T({
  id: 's1c-diff', topic: 102, sub: 'การแพร่', level: 'ง่าย',
  skills: ['คำนวณอัตราการแพร่', 'อ่านระยะทางต่อเวลา'],
  gen(R) {

    if (!ok2(d)) return null;
    return {
      stem: 'หยดสีผสมอาหารลงในน้ำนิ่ง สังเกตว่าสีแพร่ออกไปได้ ' + U(d, 'cm') + ' ในเวลา ' + U(t, 'นาที') + '<br>' +
        'จงหา<b>อัตราการแพร่</b> (เซนติเมตรต่อนาที)',
      given: [{ s: 'ระยะที่สีแพร่ได้', v: d, unit: 'cm', d: 'วัดจากจุดที่หยดสี' },
              { s: 'เวลา', v: t, unit: 'นาที', d: 'ตั้งแต่หยดสีจนสังเกต' }],
      finds: [{ s: 'อัตราการแพร่', unit: 'cm/นาที', d: 'ระยะที่แพร่ได้ต่อหนึ่งนาที', value: rate, positive: true }],
      distract: [r2(t / d), r2(d * t), r2(d + t), r2(rate * 2)],
      sol: {
        analyze: 'การแพร่คือการที่อนุภาคของสีกระจายจากที่<b>เข้มข้นสูง</b>ไปที่<b>เข้มข้นต่ำ</b>เอง โดยไม่ต้องคน<br>' +
          '"อัตรา" คำนี้แปลว่า<b>ต่อหนึ่งหน่วยเวลา</b>เสมอ จึงเอาระยะทางหารด้วยเวลา<br>' +
          '<b>กับดักของข้อนี้:</b> เอาเวลาหารระยะทาง ซึ่งจะได้ "นาทีต่อเซนติเมตร" ไม่ตรงกับที่โจทย์ถาม',
        eqs: [{ eq: 'อัตราการแพร่ = frac(ระยะทางที่แพร่ได้,เวลา)', why: 'นิยามของอัตรา — ปริมาณต่อหนึ่งหน่วยเวลา' }],
        solve: EQ('อัตราการแพร่ = frac(ระยะทาง,เวลา)'),
        subst: SEQ('= frac({d},{t})', { d: d, t: t }),
        calc: EQ('= ' + fmtq(rate) + ' `cm/นาที`'),
        conclude: 'ดังนั้น <b>อัตราการแพร่เท่ากับ ' + M(fmtq(rate) + ' `cm/นาที`') + '</b><br>' +
          '<span class="hint">ถ้าเปลี่ยนเป็นน้ำร้อน อัตรานี้จะ<b>มากขึ้น</b> เพราะอนุภาคเคลื่อนที่เร็วขึ้นเมื่ออุณหภูมิสูง</span>'
      }
    };
  }
});

T({
  id: 's1c-count', topic: 102, sub: 'การนับเซลล์', level: 'ง่าย',
  skills: ['คูณจำนวนต่อช่องด้วยจำนวนช่อง', 'ประมาณจำนวนทั้งหมด'],
  gen(R) {
    const per = R.int(6, 24), sq = R.pick([16, 20, 25]);
    return {
      stem: 'นับเซลล์ในช่องตารางของสไลด์ พบว่ามีเฉลี่ย ' + U(per) + ' เซลล์ต่อหนึ่งช่อง ' +
        'และมองเห็นทั้งหมด ' + U(sq) + ' ช่อง<br>ในพื้นที่ที่มองเห็นมีเซลล์ทั้งหมดประมาณกี่เซลล์',
      given: [{ s: 'เซลล์ต่อช่อง', v: per, unit: 'เซลล์', d: 'ค่าเฉลี่ยจากการนับ' },
              { s: 'จำนวนช่อง', v: sq, unit: 'ช่อง', d: 'ในพื้นที่ที่มองเห็น' }],
      finds: [{ s: 'จำนวนเซลล์ทั้งหมด', unit: 'เซลล์', d: 'ประมาณจากค่าเฉลี่ย', value: per * sq, positive: true, kind: 'int' }],
      distract: [per + sq, r2(sq / per), per * sq * 2, Math.abs(sq - per)],
      sol: {
        analyze: 'นับทีละเซลล์ทั้งสไลด์ทำไม่ไหว นักชีววิทยาจึงใช้วิธี<b>สุ่มนับตัวอย่างแล้วคูณ</b><br>' +
          'ค่าเฉลี่ยต่อช่อง × จำนวนช่อง = จำนวนทั้งหมดโดยประมาณ<br>' +
          '<b>กับดักของข้อนี้:</b> เอามาบวกกัน ทั้งที่ทุกช่องมีเซลล์อยู่ช่องละ ' + per + ' เซลล์',
        eqs: [{ eq: 'จำนวนทั้งหมด = จำนวนต่อช่อง × จำนวนช่อง',
                why: 'เป็นการนับซ้ำ ๆ เท่ากันทุกช่อง ซึ่งก็คือการคูณ' }],
        solve: EQ('จำนวนทั้งหมด = ' + per + ' × ' + sq),
        subst: EQ('= ' + per + ' × ' + sq),
        calc: EQ('= ' + (per * sq) + ' เซลล์'),
        conclude: 'ดังนั้น <b>มีเซลล์ประมาณ ' + M(String(per * sq)) + ' เซลล์</b><br>' +
          '<span class="hint">คำว่า "ประมาณ" สำคัญมาก เพราะแต่ละช่องมีเซลล์ไม่เท่ากันเป๊ะ ' +
          'ยิ่งนับหลายช่องมาเฉลี่ย ค่าที่ได้ยิ่งใกล้ความจริง</span>'
      }
    };
  }
});

/* ---------- ระดับปานกลาง (กรอกคำตอบ) ---------- */

T({
  id: 's1c-realmid', topic: 102, sub: 'กล้องจุลทรรศน์', level: 'ปานกลาง',
  skills: ['หากำลังขยายรวมแล้วหาขนาดจริงต่อ', 'ทำงานสองขั้น'],
  gen(R) {
    const a = R.pick([10, 40]), b = R.pick([10, 15]);
    const mag = a * b;
    const real = R.step(5, 40, 5);
    const img = r2(real * mag / 1000);
    if (!ok2(img) || img < 0.05) return null;
    return {
      stem: 'ส่องเซลล์ด้วยกล้องที่มีเลนส์ใกล้วัตถุ ' + U(a) + ' เท่า และเลนส์ใกล้ตา ' + U(b) + ' เท่า ' +
        'วัดภาพที่เห็นได้ยาว ' + U(img, 'mm') + '<br>เซลล์จริงยาวกี่<b>ไมโครเมตร</b> (1 mm = 1000 μm)',
      given: [{ s: 'เลนส์ใกล้วัตถุ', v: a, unit: 'เท่า', d: '' },
              { s: 'เลนส์ใกล้ตา', v: b, unit: 'เท่า', d: '' },
              { s: 'ความยาวของภาพ', v: img, unit: 'mm', d: '' }],
      finds: [{ s: 'ความยาวจริง', unit: 'μm', d: 'ขนาดจริงของเซลล์', value: real, positive: true, kind: 'int' }],
      sol: {
        analyze: 'โจทย์ไม่ได้ให้กำลังขยายรวมมาตรง ๆ ต้อง<b>หาเองก่อน</b> แล้วค่อยย้อนกลับไปหาขนาดจริง<br>' +
          'จบด้วยการแปลงหน่วยจากมิลลิเมตรเป็นไมโครเมตร<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมแปลงหน่วย แล้วตอบเป็น ' + fmtq(img / mag) + ' ซึ่งเป็นมิลลิเมตร ไม่ใช่ไมโครเมตร',
        eqs: [{ eq: 'กำลังขยายรวม = ' + a + ' × ' + b + ' = ' + mag + ' เท่า', why: 'เลนส์สองชั้นขยายต่อกัน' },
              { eq: 'ขนาดจริง = frac(ขนาดภาพ,กำลังขยายรวม)', why: 'กลับสูตรของกำลังขยาย' },
              { eq: '`1 mm = 1000 μm`', why: 'แปลงหน่วยเป็นตัวสุดท้าย' }],
        solve: EQ('กำลังขยายรวม = ' + a + ' × ' + b + ' = ' + mag, 'ขนาดจริง = frac(ขนาดภาพ,กำลังขยายรวม)'),
        subst: SEQ('ขนาดจริง = frac({i},{m}) `mm`', { i: img, m: mag }),
        calc: EQ('= ' + fmtq(img / mag) + ' `mm` = ' + fmtq(img / mag) + ' × 1000 `μm`', '= ' + real + ' `μm`'),
        conclude: 'ดังนั้น <b>เซลล์จริงยาว ' + M(real + ' `μm`') + '</b><br>' +
          '<span class="hint">ตรวจย้อนกลับ: ' + M(real + ' `μm` × ' + mag + ' = ' + fmtq(real * mag) + ' `μm` = ' + fmtq(img) + ' `mm`') +
          ' ตรงกับภาพที่วัดได้ ✓</span>'
      }
    };
  }
});

T({
  id: 's1c-osmomass', topic: 102, sub: 'ออสโมซิส', level: 'ปานกลาง',
  skills: ['คำนวณร้อยละการเปลี่ยนแปลงมวล', 'ตีความว่าน้ำเข้าหรือออก'],
  gen(R) {
    const m0 = R.step(10, 40, 5);
    const pct = R.pick([-20, -15, -10, 10, 15, 20, 25]);
    const m1 = r2(m0 * (100 + pct) / 100);
    if (!ok2(m1)) return null;
    return {
      stem: 'ชั่งชิ้นมันฝรั่งได้ ' + U(m0, 'g') + ' นำไปแช่ในสารละลายน้ำตาลนาน 30 นาที ' +
        'แล้วซับให้แห้งชั่งใหม่ได้ ' + U(m1, 'g') + '<br>' +
        'มวลเปลี่ยนไป<b>ร้อยละเท่าใด</b> (ตอบเป็นค่าบวกถ้าเพิ่ม เป็นค่าลบถ้าลด)',
      given: [{ s: 'มวลก่อนแช่', v: m0, unit: 'g', d: '' },
              { s: 'มวลหลังแช่', v: m1, unit: 'g', d: 'ซับให้แห้งก่อนชั่ง' }],
      finds: [{ s: 'ร้อยละการเปลี่ยนแปลงมวล', unit: '%', d: 'เทียบกับมวลเดิม', value: pct, kind: 'exact' }],
      sol: {
        analyze: 'มวลมันฝรั่งเปลี่ยนเพราะ<b>น้ำเคลื่อนที่เข้าหรือออก</b>โดยออสโมซิส ไม่ใช่เพราะน้ำตาลเข้าไป<br>' +
          'การเปรียบเทียบต้องคิดเป็น<b>ร้อยละของมวลเดิม</b> ไม่ใช่ผลต่างดิบ ๆ เพราะชิ้นมันฝรั่งแต่ละชิ้นหนักไม่เท่ากัน<br>' +
          '<b>กับดักของข้อนี้:</b> เอาผลต่างหารด้วยมวล<b>ใหม่</b> ซึ่งไม่ใช่ฐานที่ถูกต้อง',
        eqs: [{ eq: 'ร้อยละการเปลี่ยนแปลง = frac(มวลใหม่ - มวลเดิม,มวลเดิม) × 100',
                why: 'ฐานของการเทียบคือค่า<b>ก่อนการทดลอง</b>เสมอ' },
              { eq: 'ค่าเป็นบวก ⇒ น้ำเข้าเซลล์ · ค่าเป็นลบ ⇒ น้ำออกจากเซลล์',
                why: 'ใช้แปลผลว่าสารละลายเข้มข้นกว่าหรือเจือจางกว่าในเซลล์' }],
        solve: EQ('ร้อยละ = frac(m_2 - m_1,m_1) × 100'),
        subst: SEQ('= frac({b} - {a},{a}) × 100', { b: m1, a: m0 }),
        calc: EQ('= frac(' + fmtq(m1 - m0) + ',' + fmtq(m0) + ') × 100 = ' + fmtq(pct) + ' `%`'),
        conclude: 'ดังนั้น <b>มวลเปลี่ยนไปร้อยละ ' + M(fmtq(pct)) + '</b> ' +
          'แปลว่า<b>น้ำ' + (pct > 0 ? 'เข้าสู่' : 'ออกจาก') + 'เซลล์</b> ' +
          'สารละลายภายนอกจึง<b>' + (pct > 0 ? 'เจือจางกว่า' : 'เข้มข้นกว่า') + '</b>ภายในเซลล์<br>' +
          '<span class="hint">ถ้าอยากหาความเข้มข้นที่ทำให้มวลไม่เปลี่ยน ให้เขียนกราฟร้อยละการเปลี่ยนแปลงกับความเข้มข้น ' +
          'แล้วอ่านจุดที่กราฟตัดแกนศูนย์</span>'
      }
    };
  }
});

T({
  id: 's1c-divide', topic: 102, sub: 'การแบ่งเซลล์', level: 'ปานกลาง',
  skills: ['คำนวณการเพิ่มแบบทวีคูณ', 'ใช้เลขยกกำลัง'],
  gen(R) {
    const per = R.pick([20, 25, 30]);
    const n = R.int(3, 6);
    const total = n * per;
    const cells = Math.pow(2, n);
    return {
      stem: 'เซลล์แบคทีเรีย 1 เซลล์ แบ่งตัวเป็นสองเท่าทุก ' + U(per, 'นาที') + '<br>' +
        'เมื่อผ่านไป ' + U(total, 'นาที') + ' จะมีแบคทีเรียทั้งหมดกี่เซลล์',
      given: [{ s: 'เซลล์เริ่มต้น', v: 1, unit: 'เซลล์', d: '' },
              { s: 'เวลาต่อการแบ่งหนึ่งครั้ง', v: per, unit: 'นาที', d: '' },
              { s: 'เวลาทั้งหมด', v: total, unit: 'นาที', d: '' }],
      finds: [{ s: 'จำนวนเซลล์', unit: 'เซลล์', d: 'เมื่อครบเวลาที่กำหนด', value: cells, positive: true, kind: 'int' }],
      sol: {
        analyze: 'การแบ่งเซลล์ทำให้จำนวน<b>เพิ่มเป็นสองเท่าซ้ำ ๆ</b> ไม่ใช่เพิ่มทีละเท่ากัน<br>' +
          'ขั้นแรกหาว่าแบ่งไปกี่ครั้ง แล้วค่อยยกกำลังสอง<br>' +
          '<b>กับดักของข้อนี้:</b> เอาเวลาคูณสอง หรือเอา 2 คูณจำนวนครั้ง ซึ่งได้ ' + (2 * n) +
          ' เซลล์ น้อยกว่าความจริงมาก',
        eqs: [{ eq: 'จำนวนครั้งที่แบ่ง = frac(เวลาทั้งหมด,เวลาต่อครั้ง)', why: 'นับว่าครบรอบการแบ่งไปแล้วกี่รอบ' },
              { eq: 'จำนวนเซลล์ = 2^n', why: 'ทุกรอบจำนวนเพิ่มเป็นสองเท่า จึงเป็นการคูณ 2 ซ้ำ n ครั้ง' }],
        solve: SEQ('n = frac({t},{p}) = {n} ครั้ง', { t: total, p: per, n: n }),
        subst: EQ('จำนวนเซลล์ = 2^' + n),
        calc: EQ('= ' + Array(n).fill(2).join(' × ') + ' = ' + cells + ' เซลล์'),
        conclude: 'ดังนั้น <b>มีแบคทีเรีย ' + M(String(cells)) + ' เซลล์</b><br>' +
          '<span class="hint">นี่คือเหตุผลที่อาหารบูดเร็วมากเมื่อทิ้งไว้นอกตู้เย็น — ' +
          'ผ่านไปอีกแค่ ' + per + ' นาที จำนวนจะกลายเป็น ' + (cells * 2) + ' เซลล์ทันที</span>'
      }
    };
  }
});

T({
  id: 's1c-diffcmp', topic: 102, sub: 'การแพร่', level: 'ปานกลาง',
  skills: ['เปรียบเทียบอัตราการแพร่สองสภาวะ', 'หาเป็นจำนวนเท่า'],
  gen(R) {
    const r1 = R.pick([0.4, 0.5, 0.6, 0.8]);
    const k = R.pick([1.5, 2, 2.5, 3]);
    const r2v = r2(r1 * k);
    const t = R.step(5, 20, 5);
    const d1 = r2(r1 * t), d2 = r2(r2v * t);
    if (!ok2(d1, d2)) return null;
    return {
      stem: 'ทดลองหยดสีลงในน้ำเย็นและน้ำร้อน แล้ววัดระยะที่สีแพร่ได้ในเวลา ' + U(t, 'นาที') + ' เท่ากัน<br>' +
        'น้ำเย็นสีแพร่ได้ ' + U(d1, 'cm') + ' · น้ำร้อนสีแพร่ได้ ' + U(d2, 'cm') + '<br>' +
        'อัตราการแพร่ในน้ำร้อนเป็น<b>กี่เท่า</b>ของน้ำเย็น',
      given: [{ s: 'ระยะในน้ำเย็น', v: d1, unit: 'cm', d: 'เวลาเท่ากัน' },
              { s: 'ระยะในน้ำร้อน', v: d2, unit: 'cm', d: 'เวลาเท่ากัน' },
              { s: 'เวลา', v: t, unit: 'นาที', d: 'ใช้เวลาเท่ากันทั้งสองการทดลอง' }],
      finds: [{ s: 'จำนวนเท่า', d: 'อัตราในน้ำร้อนเทียบน้ำเย็น', value: k, positive: true }],
      sol: {
        analyze: 'เวลาที่ใช้<b>เท่ากันทั้งสองการทดลอง</b> อัตราส่วนของอัตราการแพร่จึงเท่ากับอัตราส่วนของระยะทางเลย ' +
          'ไม่ต้องหารด้วยเวลาก่อนก็ได้<br>' +
          '<b>กับดักของข้อนี้:</b> เอาระยะทางมาลบกันแล้วตอบผลต่าง ทั้งที่โจทย์ถามว่า "กี่เท่า" ซึ่งต้องหาร',
        eqs: [{ eq: 'อัตราการแพร่ = frac(ระยะทาง,เวลา)', why: 'นิยามของอัตรา' },
              { eq: 'frac(อัตราร้อน,อัตราเย็น) = frac(d_2/t,d_1/t) = frac(d_2,d_1)',
                why: 'เวลาเท่ากัน จึงตัดกันหมด เหลือแค่อัตราส่วนของระยะทาง' }],
        solve: EQ('จำนวนเท่า = frac(d_2,d_1)'),
        subst: SEQ('= frac({b},{a})', { b: d2, a: d1 }),
        calc: EQ('= ' + fmtq(k) + ' เท่า'),
        conclude: 'ดังนั้น <b>อัตราการแพร่ในน้ำร้อนเป็น ' + M(fmtq(k) + ' เท่า') + 'ของน้ำเย็น</b><br>' +
          '<span class="hint">อธิบายได้ว่า อุณหภูมิสูงทำให้อนุภาคมี<b>พลังงานจลน์มากขึ้น</b> ' +
          'จึงชนและกระจายตัวได้เร็วขึ้น</span>'
      }
    };
  }
});

/* ---------- ระดับยาก ---------- */

T({
  id: 's1c-magneed', topic: 102, sub: 'กล้องจุลทรรศน์', level: 'ยาก',
  skills: ['ทำงานย้อนกลับหากำลังขยายที่ต้องใช้', 'เลือกเลนส์ให้เหมาะ'],
  gen(R) {
    const real = R.step(5, 30, 5);                  // ไมโครเมตร
    const eye = R.pick([10, 15]);
    const obj = R.pick([4, 10, 40]);
    const mag = eye * obj;
    const img = r2(real * mag / 1000);              // มิลลิเมตร
    if (!ok2(img) || img < 0.05) return null;
    return {
      stem: 'ต้องการให้เซลล์ที่ยาวจริง ' + U(real, 'μm') + ' ปรากฏเป็นภาพยาว ' + U(img, 'mm') + ' ในกล้องจุลทรรศน์<br>' +
        'ถ้าเลนส์ใกล้ตามีกำลังขยาย ' + U(eye) + ' เท่า จะต้องใช้เลนส์ใกล้วัตถุ<b>กี่เท่า</b> (1 mm = 1000 μm)',
      given: [{ s: 'ความยาวจริง', v: real, unit: 'μm', d: 'ขนาดของเซลล์' },
              { s: 'ความยาวของภาพที่ต้องการ', v: img, unit: 'mm', d: '' },
              { s: 'เลนส์ใกล้ตา', v: eye, unit: 'เท่า', d: 'ค่าที่มีอยู่แล้ว' }],
      finds: [{ s: 'เลนส์ใกล้วัตถุ', unit: 'เท่า', d: 'กำลังขยายที่ต้องเลือกใช้', value: obj, positive: true, kind: 'int' }],
      sol: {
        analyze: 'ข้อนี้ทำงาน<b>ย้อนทาง</b> — ปกติรู้เลนส์แล้วหาขนาด แต่คราวนี้รู้ขนาดแล้วต้องหาเลนส์<br>' +
          'สามขั้น: แปลงหน่วยให้เหมือนกัน → หากำลังขยายรวมที่ต้องการ → หารด้วยเลนส์ใกล้ตา<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมแปลงหน่วย เอา ' + fmtq(img) + ' หารด้วย ' + real +
          ' ตรง ๆ ซึ่งผิดไป 1000 เท่า',
        eqs: [{ eq: '`1 mm = 1000 μm` ⇒ ภาพยาว ' + fmtq(img * 1000) + ' `μm`', why: 'ต้องเทียบสองค่าที่หน่วยเดียวกันเท่านั้น' },
              { eq: 'กำลังขยายรวม = frac(ขนาดภาพ,ขนาดจริง)', why: 'นิยามของกำลังขยาย' },
              { eq: 'เลนส์ใกล้วัตถุ = frac(กำลังขยายรวม,เลนส์ใกล้ตา)', why: 'กลับสูตรการคูณของเลนส์สองชั้น' }],

T({
  id: 's1c-scale', topic: 102, sub: 'กล้องจุลทรรศน์', level: 'ยาก',
  skills: ['ใช้มาตราส่วนของภาพ', 'แปลงหน่วยหลายชั้น'],
  gen(R) {
    const barMm = R.pick([10, 15, 20, 25]);        // ความยาวเส้นมาตราส่วนบนภาพ (mm)
    const barUm = R.pick([20, 50, 100]);           // แทนระยะจริงกี่ไมโครเมตร
    const cellMm = R.step(20, 60, 5);              // ความยาวเซลล์ที่วัดบนภาพ (mm)
    const real = r2(cellMm * barUm / barMm);
    if (!ok2(real) || real > 500) return null;
    return {
      stem: 'ภาพถ่ายจากกล้องจุลทรรศน์มี<b>เส้นมาตราส่วน</b>ยาว ' + U(barMm, 'mm') +
        ' กำกับไว้ว่าเท่ากับ ' + U(barUm, 'μm') + '<br>' +
        'วัดความยาวของเซลล์ในภาพเดียวกันได้ ' + U(cellMm, 'mm') + '<br>' +
        'เซลล์นี้ยาวจริงกี่<b>ไมโครเมตร</b>',
      given: [{ s: 'เส้นมาตราส่วนบนภาพ', v: barMm, unit: 'mm', d: 'ที่วัดได้ด้วยไม้บรรทัด' },
              { s: 'ระยะจริงที่เส้นแทน', v: barUm, unit: 'μm', d: 'ตามที่กำกับไว้' },
              { s: 'ความยาวเซลล์บนภาพ', v: cellMm, unit: 'mm', d: '' }],
      finds: [{ s: 'ความยาวจริงของเซลล์', unit: 'μm', d: 'ขนาดจริงหลังหารด้วยกำลังขยาย', value: real, positive: true }],
      sol: {
        analyze: 'ภาพจากตำราหรืองานวิจัยมักไม่บอกกำลังขยาย แต่ให้<b>เส้นมาตราส่วน</b>มาแทน ' +
          'ซึ่งใช้ง่ายกว่าเพราะไม่ต้องรู้ว่าภาพถูกย่อขยายมากี่รอบ<br>' +
          'ทุกอย่างในภาพเดียวกันถูกขยายด้วยอัตราส่วนเดียวกัน จึงเทียบสัดส่วนตรง ๆ ได้<br>' +
          '<b>กับดักของข้อนี้:</b> พยายามแปลง mm เป็น μm ของทั้งสองฝั่งก่อน ทั้งที่ไม่จำเป็น ' +
          'เพราะหน่วยจะตัดกันเองในอัตราส่วน',
        eqs: [{ eq: 'frac(ความยาวเซลล์บนภาพ,ความยาวเส้นมาตราส่วน) = frac(ความยาวจริงของเซลล์,ระยะจริงที่เส้นแทน)',
                why: 'ทุกส่วนของภาพเดียวกันถูกขยายเท่ากัน อัตราส่วนจึงเท่ากัน' },
              { eq: 'ความยาวจริง = frac(ความยาวบนภาพ,ความยาวเส้น) × ระยะจริงที่เส้นแทน',
                why: 'คูณไขว้ให้ตัวที่ต้องการอยู่โดด ๆ' }],
        solve: EQ('ความยาวจริง = frac(ความยาวเซลล์บนภาพ,ความยาวเส้นมาตราส่วน) × ระยะจริงที่เส้นแทน'),
        subst: SEQ('= frac({c},{b}) × {u}', { c: cellMm, b: barMm, u: barUm }),
        calc: EQ('= ' + fmtq(cellMm / barMm) + ' × ' + barUm, '= ' + fmtq(real) + ' `μm`'),
        conclude: 'ดังนั้น <b>เซลล์ยาวจริง ' + M(fmtq(real) + ' `μm`') + '</b><br>' +
          '<span class="hint">ข้อดีของเส้นมาตราส่วน: ต่อให้เอาภาพไปย่อหรือขยายพิมพ์ใหม่ ' +
          'เส้นก็ย่อขยายตามไปด้วย อัตราส่วนจึงยังถูกต้องเสมอ</span>'
      }
    };
  }
});

T({

              { s: 'เวลา', v: t, unit: 'นาที', d: 'ระยะเวลาที่นับ' }],
      finds: [{ s: 'อัตราการเกิดฟอง', unit: 'ฟอง/นาที', d: 'ใช้วัดอัตราการสังเคราะห์ด้วยแสง', value: rate, positive: true, kind: 'int' }],
      distract: [n, r2(t / n), n * t, n + t],

        analyze: 'ฟองแก๊สที่ลอยขึ้นคือ<b>แก๊สออกซิเจน</b> ซึ่งเป็นผลิตภัณฑ์ของการสังเคราะห์ด้วยแสง<br>' +
          'ยิ่งเกิดฟองเร็ว แปลว่าพืชสังเคราะห์ด้วยแสงได้เร็ว จึงใช้เป็นตัววัดอัตราได้<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบจำนวนฟองทั้งหมด (' + n + ' ฟอง) ทั้งที่โจทย์ถาม "ต่อนาที"',
        eqs: [{ eq: 'อัตรา = frac(จำนวนฟอง,เวลา)', why: 'คำว่า "อัตรา" หมายถึงปริมาณต่อหนึ่งหน่วยเวลาเสมอ' }],
        solve: EQ('อัตรา = frac(จำนวนฟอง,เวลา)'),

        conclude: 'ดังนั้น <b>อัตราการเกิดฟองแก๊สเท่ากับ ' + M(rate + ' `ฟอง/นาที`') + '</b><br>' +
          '<span class="hint">ถ้าเลื่อนหลอดไฟให้ใกล้ขึ้น อัตรานี้จะเพิ่ม เพราะความเข้มแสงมากขึ้น</span>'
      }
    };
  }
});

T({

        eqs: [{ eq: 'อัตราการคายน้ำ = frac(ปริมาตรน้ำที่หายไป,เวลา)', why: 'นิยามของอัตรา' }],

T({

      given: [{ s: 'โมเลกุลของ CO_2 ที่ใช้', v: co2, unit: 'โมเลกุล', d: '' },
              { s: 'อัตราส่วนในสมการ', v: '6 : 6', d: 'CO₂ ต่อ O₂' }],

      distract: [co2 * 6, r2(co2 / 6), co2 * 2, r2(co2 / 2)],
      sol: {
        analyze: 'ตัวเลขหน้าสูตรเคมีในสมการบอก<b>อัตราส่วนจำนวนโมเลกุล</b>ที่ทำปฏิกิริยากัน<br>' +

          '<b>กับดักของข้อนี้:</b> เอา 6 ไปคูณหรือหารซ้ำ ทั้งที่เลข 6 ทั้งสองฝั่งตัดกันไปแล้ว',
        eqs: [{ eq: 'frac(จำนวน O_2,จำนวน CO_2) = frac(6,6) = 1', why: 'อัตราส่วนจากตัวเลขหน้าสูตรในสมการที่ดุลแล้ว' },

        calc: EQ('O_2 = ' + o2 + ' โมเลกุล'),

          '<span class="hint">สังเกตว่าถ้าถามหาน้ำตาลกลูโคสแทน อัตราส่วนจะเป็น ' + M('frac(1,6)') +
          ' จึงได้ ' + M(fmtq(co2 / 6) + ' โมเลกุล') + ' ซึ่งน้อยกว่ามาก</span>'
      }
    };
  }
});

T({
  id: 's1p-light', topic: 103, sub: 'อัตราการสังเคราะห์ด้วยแสง', level: 'ง่าย',

    const xsat = R.pick([4, 5, 6]);              // ความเข้มแสงที่เริ่มอิ่มตัว

    return {
      stem: 'กราฟแสดงอัตราการเกิดฟองแก๊สของสาหร่ายเมื่อความเข้มแสงเปลี่ยนไป<br>' +
        'ที่ความเข้มแสงระดับ ' + U(ask) + ' อัตราการเกิดฟองแก๊สเป็นเท่าใด (ฟองต่อนาที)',
      given: [{ s: 'ความเข้มแสงที่ถาม', v: ask, unit: 'ระดับ', d: 'อ่านจากแกนนอน' },
              { s: 'อัตราสูงสุด', v: sat, unit: 'ฟอง/นาที', d: 'ช่วงที่กราฟราบแล้ว' }],
      finds: [{ s: 'อัตราการเกิดฟอง', unit: 'ฟอง/นาที', d: 'อ่านจากกราฟ', value: val, positive: true }],
      distract: [sat, ask, r2(val + sat / xsat), r2(val / 2)],
      figure: figXY({ xlab: 'ความเข้มแสง (ระดับ)', ylab: 'ฟอง/นาที', xmax: xsat + 3, ymax: sat + 10,
        xstep: xsat + 3, ystep: 5, dots: false,
        pts: [[0, 0], [xsat, sat], [xsat + 3, sat]],
        marks: [{ x: ask, y: val, label: 'จุดที่ถาม' }] }),
      sol: {
        analyze: 'กราฟแบ่งเป็นสองช่วงชัดเจน — ช่วงแรก<b>เพิ่มขึ้นเป็นเส้นตรง</b> เพราะแสงยังเป็นตัวจำกัด ' +
          'ช่วงหลัง<b>ราบคงที่</b> เพราะแสงพอแล้ว ตัวจำกัดเปลี่ยนไปเป็นอย่างอื่น<br>' +
          'ระดับ ' + ask + ' อยู่ในช่วงแรก จึงคิดตามสัดส่วนเส้นตรง<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบค่าสูงสุด (' + sat + ') ทั้งที่จุดที่ถามยังไม่ถึงช่วงอิ่มตัว',
        eqs: [{ eq: 'ในช่วงเส้นตรง: frac(อัตรา,ความเข้มแสง) = คงที่', why: 'กราฟผ่านจุดกำเนิดและเป็นเส้นตรง' },
              { eq: 'อัตรา = frac(อัตราสูงสุด,ความเข้มที่เริ่มอิ่มตัว) × ความเข้มที่ถาม', why: 'ใช้สัดส่วนคูณไขว้' }],
        solve: EQ('อัตรา = frac(' + sat + ',' + xsat + ') × ' + ask),
        subst: SEQ('= {k} × {a}', { k: r2(sat / xsat), a: ask }),
        calc: EQ('= ' + fmtq(val) + ' `ฟอง/นาที`'),
        conclude: 'ดังนั้น <b>อัตราการเกิดฟองเท่ากับ ' + M(fmtq(val) + ' `ฟอง/นาที`') + '</b><br>' +
          '<span class="hint">ช่วงที่กราฟราบแปลว่าเพิ่มแสงต่อไปก็ไม่ช่วยแล้ว ' +
          'ต้องไปเพิ่ม<b>คาร์บอนไดออกไซด์</b>หรือ<b>อุณหภูมิ</b>แทน จึงจะเร็วขึ้นได้อีก</span>'
      }
    };
  }
});

T({

        analyze: 'ที่ต้องใช้<b>มวลแห้ง</b>ไม่ใช่มวลสด เพราะมวลสดเปลี่ยนไปตามปริมาณน้ำในต้น ' +

        subst: SEQ('= frac({b} - {a},{a}) × 100', { b: m1, a: m0 }),

    };
  }

T({
  id: 's1p-transcmp', topic: 103, sub: 'การคายน้ำ', level: 'ปานกลาง',
  skills: ['เปรียบเทียบอัตราการคายน้ำสองสภาวะ', 'หาผลต่างต่อชั่วโมง'],
  gen(R) {
    const r1 = R.pick([2, 3, 4, 5]);
    const k = R.pick([1.5, 2, 2.5, 3]);
    const rate2 = r2(r1 * k);
    const h = R.pick([2, 3, 4]);
    const v1 = r2(r1 * h), v2 = r2(rate2 * h);
    if (!ok2(v1, v2)) return null;
    return {
      stem: 'ทดลองวัดการคายน้ำของพืชชนิดเดียวกันสองต้นเป็นเวลา ' + U(h, 'ชั่วโมง') + ' เท่ากัน<br>' +
        'ต้นที่วางในที่ร่มคายน้ำ ' + U(v1, 'cm³') + ' · ต้นที่วางกลางแดดคายน้ำ ' + U(v2, 'cm³') + '<br>' +
        'ต้นกลางแดดคายน้ำ<b>มากกว่า</b>ต้นในที่ร่มกี่ลูกบาศก์เซนติเมตร<b>ต่อชั่วโมง</b>',
      given: [{ s: 'ปริมาตรที่คายในที่ร่ม', v: v1, unit: 'cm³', d: '' },
              { s: 'ปริมาตรที่คายกลางแดด', v: v2, unit: 'cm³', d: '' },
              { s: 'เวลา', v: h, unit: 'ชั่วโมง', d: 'เท่ากันทั้งสองต้น' }],
      finds: [{ s: 'ผลต่างของอัตรา', unit: 'cm³/ชั่วโมง', d: 'กลางแดด ลบ ในที่ร่ม', value: r2(rate2 - r1), positive: true }],
      sol: {
        analyze: 'โจทย์ให้<b>ปริมาตร</b>มา แต่ถาม<b>อัตราต่อชั่วโมง</b> จึงต้องหารด้วยเวลาก่อนเสมอ<br>' +
          'หาอัตราของทั้งสองต้น แล้วค่อยลบกัน<br>' +
          '<b>กับดักของข้อนี้:</b> เอาปริมาตรมาลบกันตรง ๆ ได้ ' + fmtq(v2 - v1) +
          ' แล้วตอบเลย ซึ่งเป็นผลต่างของ ' + h + ' ชั่วโมง ไม่ใช่ต่อหนึ่งชั่วโมง',
        eqs: [{ eq: 'อัตรา = frac(ปริมาตร,เวลา)', why: 'แปลงปริมาตรรวมให้เป็นอัตราก่อน' },
              { eq: 'ผลต่างของอัตรา = frac(V_2 - V_1,t)', why: 'เวลาเท่ากัน จึงหารผลต่างด้วยเวลาทีเดียวได้' }],
        solve: EQ('อัตราในที่ร่ม = frac(' + fmtq(v1) + ',' + h + ') = ' + fmtq(r1) + ' `cm^3/ชั่วโมง`',
                  'อัตรากลางแดด = frac(' + fmtq(v2) + ',' + h + ') = ' + fmtq(rate2) + ' `cm^3/ชั่วโมง`'),
        subst: EQ('ผลต่าง = ' + fmtq(rate2) + ' - ' + fmtq(r1)),
        calc: EQ('= ' + fmtq(rate2 - r1) + ' `cm^3/ชั่วโมง`'),
        conclude: 'ดังนั้น <b>ต้นกลางแดดคายน้ำมากกว่า ' + M(fmtq(rate2 - r1) + ' `cm^3/ชั่วโมง`') + '</b><br>' +
          '<span class="hint">อธิบายได้ว่า แดดทำให้อุณหภูมิสูงขึ้นและปากใบเปิดกว้าง น้ำจึงระเหยออกได้เร็วกว่า</span>'
      }
    };
  }
});

T({
  id: 's1p-xylem', topic: 103, sub: 'การลำเลียงในพืช', level: 'ปานกลาง',
  skills: ['คำนวณอัตราการลำเลียงน้ำในลำต้น', 'แปลงหน่วยเวลา'],

    return {
      stem: 'แช่ก้านต้นเทียนในน้ำผสมสีแดง สังเกตว่าสีเคลื่อนขึ้นไปตามก้านได้ ' + U(cm, 'cm') +
        ' ในเวลา ' + U(min, 'นาที') + '<br>' +
        'น้ำถูกลำเลียงขึ้นด้วยอัตรากี่<b>เซนติเมตรต่อชั่วโมง</b>',
      given: [{ s: 'ระยะที่สีเคลื่อนขึ้น', v: cm, unit: 'cm', d: 'วัดตามความยาวก้าน' },
              { s: 'เวลา', v: min, unit: 'นาที', d: '' }],
      finds: [{ s: 'อัตราการลำเลียง', unit: 'cm/ชั่วโมง', d: 'ระยะที่น้ำเคลื่อนที่ขึ้นได้ต่อชั่วโมง', value: perH, positive: true }],
      sol: {
        analyze: 'สีแดงเคลื่อนไปกับน้ำในท่อ<b>ไซเล็ม</b> จึงใช้ติดตามการลำเลียงน้ำได้<br>' +
          'โจทย์ให้เวลาเป็นนาที แต่ถามเป็นชั่วโมง ต้อง<b>แปลงหน่วย</b>ด้วย<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบ ' + fmtq(cm / min) + ' ซึ่งเป็นเซนติเมตร<b>ต่อนาที</b> ' +
          'ไม่ตรงกับหน่วยที่โจทย์ขอ',
        eqs: [{ eq: 'อัตรา = frac(ระยะทาง,เวลา)', why: 'นิยามของอัตรา' },
              { eq: '`1 ชั่วโมง = 60 นาที` ⇒ คูณ 60 เมื่อเปลี่ยนจากต่อนาทีเป็นต่อชั่วโมง',
                why: 'หนึ่งชั่วโมงยาวกว่าหนึ่งนาที 60 เท่า ระยะที่ได้จึงมากขึ้น 60 เท่า' }],
        solve: EQ('อัตรา = frac(ระยะทาง,เวลา) × 60'),
        subst: SEQ('= frac({c},{m}) × 60', { c: cm, m: min }),
        calc: EQ('= ' + fmtq(cm / min) + ' × 60', '= ' + fmtq(perH) + ' `cm/ชั่วโมง`'),
        conclude: 'ดังนั้น <b>น้ำถูกลำเลียงขึ้นด้วยอัตรา ' + M(fmtq(perH) + ' `cm/ชั่วโมง`') + '</b><br>' +
          '<span class="hint">แรงที่ดันน้ำขึ้นไปได้มาจาก<b>การคายน้ำที่ใบ</b>เป็นหลัก ' +
          'ถ้าเด็ดใบออกหมด อัตรานี้จะลดลงอย่างชัดเจน</span>'
      }
    };
  }
});

T({
  id: 's1p-o2vol', topic: 103, sub: 'อัตราการสังเคราะห์ด้วยแสง', level: 'ยาก',
  skills: ['คำนวณปริมาตรแก๊สจากจำนวนฟอง', 'ทำงานหลายขั้นพร้อมแปลงหน่วยเวลา'],
  gen(R) {
    const perMin = R.int(5, 25);
    const volPer = R.pick([0.02, 0.04, 0.05, 0.1]);     // cm³ ต่อฟอง
    const h = R.pick([2, 3, 4, 5]);
    const total = r2(perMin * volPer * 60 * h);
    if (!ok2(total) || total > 500) return null;
    return {
      stem: 'สาหร่ายชุดหนึ่งปล่อยฟองแก๊สออกซิเจน ' + U(perMin, 'ฟอง/นาที') +
        ' โดยแต่ละฟองมีปริมาตรราว ' + U(volPer, 'cm³') + '<br>' +
        'ถ้าส่องไฟต่อเนื่อง ' + U(h, 'ชั่วโมง') + ' จะได้แก๊สออกซิเจนรวมกี่<b>ลูกบาศก์เซนติเมตร</b>',
      given: [{ s: 'อัตราการเกิดฟอง', v: perMin, unit: 'ฟอง/นาที', d: '' },
              { s: 'ปริมาตรต่อหนึ่งฟอง', v: volPer, unit: 'cm³', d: 'ค่าเฉลี่ยจากการวัด' },
              { s: 'เวลา', v: h, unit: 'ชั่วโมง', d: 'ส่องไฟต่อเนื่อง' }],
      finds: [{ s: 'ปริมาตรแก๊สรวม', unit: 'cm³', d: 'ออกซิเจนที่ปล่อยออกมาทั้งหมด', value: total, positive: true }],
      sol: {
        analyze: 'ข้อนี้ต้องต่อกันสามขั้น และจุดที่พลาดกันมากที่สุดคือ<b>หน่วยเวลา</b> ' +
          'เพราะอัตราเป็นต่อ<b>นาที</b> แต่โจทย์ให้เวลามาเป็น<b>ชั่วโมง</b><br>' +
          'ลำดับ: หาเวลาเป็นนาที → หาจำนวนฟองทั้งหมด → คูณด้วยปริมาตรต่อฟอง<br>' +
          '<b>กับดักของข้อนี้:</b> เอา ' + perMin + ' × ' + h + ' ตรง ๆ ซึ่งลืมคูณ 60 ทำให้คำตอบน้อยกว่าความจริง 60 เท่า',
        eqs: [{ eq: 'เวลา (นาที) = ชั่วโมง × 60', why: 'ทำหน่วยเวลาให้ตรงกับหน่วยของอัตราก่อนเสมอ' },
              { eq: 'จำนวนฟองทั้งหมด = อัตรา × เวลา (นาที)', why: 'อัตราคูณเวลาได้ปริมาณสะสม' },
              { eq: 'ปริมาตรรวม = จำนวนฟอง × ปริมาตรต่อฟอง', why: 'รวมปริมาตรของทุกฟองเข้าด้วยกัน' }],
        solve: EQ('เวลา = ' + h + ' × 60 = ' + (h * 60) + ' `นาที`',
                  'จำนวนฟอง = ' + perMin + ' × ' + (h * 60) + ' = ' + fmtq(perMin * h * 60) + ' `ฟอง`'),
        subst: SEQ('ปริมาตรรวม = {n} × {v}', { n: perMin * h * 60, v: volPer }),
        calc: EQ('= ' + fmtq(total) + ' `cm^3`'),
        conclude: 'ดังนั้น <b>ได้แก๊สออกซิเจนรวม ' + M(fmtq(total) + ' `cm^3`') + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผลด้วยการคิดคร่าว ๆ: ราว ' + perMin + ' ฟอง/นาที × 60 = ' +
          fmtq(perMin * 60) + ' ฟอง/ชั่วโมง ซึ่งได้แก๊สราว ' + fmtq(perMin * 60 * volPer) +
          ' cm³ ต่อชั่วโมง คูณ ' + h + ' ชั่วโมงก็ตรงกัน ✓</span>'
      }
    };
  }
});

T({
  id: 's1p-massbal', topic: 103, sub: 'สมการการสังเคราะห์ด้วยแสง', level: 'ยาก',
  skills: ['ใช้กฎทรงมวลกับการสังเคราะห์ด้วยแสง', 'หามวลสารที่หายไป'],
  gen(R) {
    const co2 = R.step(88, 440, 44);           // มวล CO2 (กรัม)
    const h2o = r2(co2 * 108 / 264);           // ตามอัตราส่วนมวลในสมการ
    const o2 = r2(co2 * 192 / 264);
    const glu = r2(co2 + h2o - o2);
    if (!ok2(h2o, o2, glu)) return null;
    return {
      stem: 'พืชต้นหนึ่งใช้แก๊สคาร์บอนไดออกไซด์ ' + U(co2, 'g') + ' กับน้ำ ' + U(h2o, 'g') +
        ' ในการสังเคราะห์ด้วยแสง แล้วปล่อยแก๊สออกซิเจนออกมา ' + U(o2, 'g') + '<br>' +
        'จะได้<b>น้ำตาลกลูโคส</b>กี่กรัม',
      given: [{ s: 'มวล CO_2 ที่ใช้', v: co2, unit: 'g', d: 'สารตั้งต้น' },
              { s: 'มวลน้ำที่ใช้', v: h2o, unit: 'g', d: 'สารตั้งต้น' },
              { s: 'มวล O_2 ที่ปล่อยออก', v: o2, unit: 'g', d: 'ผลิตภัณฑ์' }],
      finds: [{ s: 'มวลกลูโคส', unit: 'g', d: 'ผลิตภัณฑ์อีกตัวหนึ่ง', value: glu, positive: true }],
      sol: {
        analyze: 'ในปฏิกิริยาเคมีทุกชนิด <b>มวลรวมของสารตั้งต้นเท่ากับมวลรวมของผลิตภัณฑ์เสมอ</b> ' +
          'เพราะอะตอมไม่ได้หายไปไหน แค่ถูกจัดเรียงใหม่<br>' +
          'จึงเอามวลสารตั้งต้นรวมกัน แล้วลบด้วยผลิตภัณฑ์ที่รู้แล้ว<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมนับมวลน้ำเข้าไปด้วย เพราะน้ำถูกดูดจากรากจึงมองไม่เห็นว่ามีส่วนร่วม',

T({

      finds: [{ s: 'ปริมาตรน้ำที่คายทั้งวัน', unit: 'cm³', d: 'รวมทั้งกลางวันและกลางคืน', value: total, positive: true }],
      sol: {
        analyze: 'อัตราการคายน้ำ<b>ไม่คงที่ตลอดวัน</b> จึงคิดรวมเป็นอัตราเดียวทั้ง 24 ชั่วโมงไม่ได้<br>' +
          'ต้องแยกคิดทีละช่วงตามอัตราของช่วงนั้น แล้วค่อยเอามารวมกัน<br>' +
          '<b>กับดักที่พลาดกันบ่อยที่สุด:</b> เอาอัตราสองค่ามาเฉลี่ยแล้วคูณ 24 ' +

        eqs: [{ eq: 'ปริมาตร = อัตรา × เวลา', why: 'ใช้กับแต่ละช่วงที่อัตราคงที่' },
              { eq: 'V_{รวม} = (อัตรากลางวัน × ชั่วโมงกลางวัน) + (อัตรากลางคืน × ชั่วโมงกลางคืน)',
                why: 'รวมปริมาณของทั้งสองช่วงเข้าด้วยกัน' }],
        solve: EQ('V_{กลางวัน} = ' + fmtq(day) + ' × ' + hd + ' = ' + fmtq(day * hd) + ' `cm^3`',
                  'V_{กลางคืน} = ' + fmtq(night) + ' × ' + hn + ' = ' + fmtq(night * hn) + ' `cm^3`'),
        subst: EQ('V_{รวม} = ' + fmtq(day * hd) + ' + ' + fmtq(night * hn)),

        conclude: 'ดังนั้น <b>พืชคายน้ำทั้งวันรวม ' + M(fmtq(total) + ' `cm^3`') + '</b><br>' +
          '<span class="hint">ลองเทียบ: ถ้าเฉลี่ยอัตราสองค่าแล้วคูณ 24 จะได้ ' +
          M(fmtq(r2((day + night) / 2 * 24)) + ' `cm^3`') + ' ซึ่ง' +
          (r2((day + night) / 2 * 24) === total ? 'บังเอิญเท่ากันเพราะกลางวันกับกลางคืนยาวเท่ากันพอดี'

T({
  id: 's1h-expand', topic: 104, sub: 'การขยายตัวเมื่อได้รับความร้อน', level: 'ปานกลาง',
  skills: ['คำนวณความยาวที่เพิ่มขึ้น', 'ใช้สัดส่วนต่อความยาวเดิม'],
  gen(R) {
    const L = R.pick([10, 20, 25, 50]);          // เมตร
    // ใช้หน่วยไมโครเมตรต่อเมตรต่อองศา ซึ่งเป็นหน่วยจริงของสัมประสิทธิ์การขยายตัว
    // และทำให้ตัวเลขในโจทย์เป็นจำนวนเต็มสวย ๆ (เหล็ก 12 · อะลูมิเนียม 24)
    const perM = R.pick([10, 12, 20, 24]);
    const dT = R.step(10, 50, 10);

    if (!ok2(dL) || dL < 0.05) return null;
    return {
      stem: 'รางรถไฟเหล็กยาว ' + U(L, 'm') + ' ขยายตัวได้ ' + U(perM, 'μm') +

        'ถ้าอุณหภูมิสูงขึ้น ' + U(dT, '°C') + ' รางจะยาวขึ้นกี่<b>มิลลิเมตร</b> (1 mm = 1,000 μm)',
      given: [{ s: 'L', v: L, unit: 'm', d: 'ความยาวเดิมของราง' },
              { s: 'อัตราการขยายตัว', v: perM, unit: 'μm/m·°C', d: 'ต่อหนึ่งเมตรต่อหนึ่งองศา' },
              { s: 'ΔT', v: dT, unit: '°C', d: 'อุณหภูมิที่เพิ่มขึ้น' }],
      finds: [{ s: 'ΔL', unit: 'mm', d: 'ความยาวที่เพิ่มขึ้น', value: dL, positive: true }],
      sol: {
        analyze: 'การขยายตัวขึ้นกับ<b>สามอย่างพร้อมกัน</b> — ยาวเดิมเท่าไร ร้อนขึ้นกี่องศา และเป็นวัสดุอะไร<br>' +
          'อัตราที่โจทย์ให้เป็น "ต่อเมตร ต่อองศา" จึงต้องคูณด้วยทั้งความยาวและอุณหภูมิที่เปลี่ยน<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมคูณความยาวเดิม หรือลืมแปลงไมโครเมตรเป็นมิลลิเมตรตอนท้าย',
        eqs: [{ eq: 'ΔL = อัตราการขยายตัว × L × ΔT',
                why: 'รางยิ่งยาว ยิ่งขยายมาก · ร้อนยิ่งมาก ยิ่งขยายมาก' },
              { eq: 'ตรวจหน่วย: `μm/m·°C` × `m` × `°C` = `μm`', why: 'หน่วยตัดกันเหลือไมโครเมตร แล้วค่อยแปลงเป็นมิลลิเมตร' },
              { eq: '`1 mm = 1000 μm`', why: 'แปลงหน่วยเป็นขั้นสุดท้าย' }],
        solve: EQ('ΔL = อัตรา × L × ΔT'),
        subst: SEQ('= {p} × {L} × {d} = {u} `μm`', { p: perM, L: L, d: dT, u: perM * L * dT }),
        calc: EQ('= frac(' + fmtq(perM * L * dT) + ',1000) = ' + fmtq(dL) + ' `mm`'),
        conclude: 'ดังนั้น <b>รางยาวขึ้น ' + M(fmtq(dL) + ' `mm`') + '</b><br>' +
          '<span class="hint">นี่คือเหตุผลที่ต้อง<b>เว้นช่องว่างที่รอยต่อราง</b> ' +
          'ถ้าไม่เว้น รางจะดันกันจนโก่งงอในวันที่แดดจัด</span>'
      }
    };
  }
});

T({
  id: 's1h-metalwater', topic: 104, sub: 'สมดุลความร้อน', level: 'ยาก',

  gen(R) {
    const item = R.pick([{ n: 'อะลูมิเนียม', c: 900 }, { n: 'เหล็ก', c: 450 }, { n: 'ทองแดง', c: 390 }]);

    const mw = R.pick([0.5, 1]);
    const tw = R.step(20, 30, 5);
    // กำหนดอุณหภูมิผสมก่อน แล้วย้อนหาอุณหภูมิของโลหะ ตัวเลขในโจทย์จึงสวยทุกตัว

        ' อุณหภูมิ ' + U(tw, '°C') + '<br>เมื่อถึงสมดุลความร้อน อุณหภูมิรวมเป็น ' + U(T, '°C') + '<br>' +
        'จงหา<b>ความจุความร้อนจำเพาะของโลหะ</b> (น้ำมี c = 4200 J/kg·°C · ไม่มีความร้อนสูญเสีย)',
      given: [{ s: 'm_{โลหะ}', v: mm, unit: 'kg', d: '' },
              { s: 'T_{โลหะ}', v: tm, unit: '°C', d: 'ก่อนหย่อนลงน้ำ' },
              { s: 'm_{น้ำ}', v: mw, unit: 'kg', d: '' },
              { s: 'T_{น้ำ}', v: tw, unit: '°C', d: 'ก่อนหย่อนโลหะ' },
              { s: 'T', v: T, unit: '°C', d: 'อุณหภูมิเมื่อถึงสมดุล' }],
      finds: [{ s: 'c_{โลหะ}', unit: 'J/kg·°C', d: 'ความจุความร้อนจำเพาะของโลหะ', value: item.c, positive: true, kind: 'int' }],
      sol: {
        analyze: 'ข้อนี้ต่างจากการผสมน้ำกับน้ำ เพราะ<b>สองสารมี c ไม่เท่ากัน</b> จึงตัด c ทิ้งไม่ได้<br>' +
          'ตั้งสมการสมดุลความร้อนโดยมี ' + M('c_{โลหะ}') + ' เป็นตัวที่ยังไม่รู้ แล้วแก้สมการหาออกมา<br>' +
          '<b>กับดักของข้อนี้:</b> ใส่ ΔT กลับด้าน · ฝั่งที่<b>คาย</b>ใช้ ' + M('T_{โลหะ} - T') +
          ' ส่วนฝั่งที่<b>รับ</b>ใช้ ' + M('T - T_{น้ำ}') + ' ทั้งสองต้องเป็นค่าบวก',
        eqs: [{ eq: 'ความร้อนที่โลหะคาย = ความร้อนที่น้ำรับ', why: 'พลังงานไม่หายไปไหนในระบบที่ไม่มีการสูญเสีย' },
              { eq: 'm_{โลหะ}c_{โลหะ}(T_{โลหะ} - T) = m_{น้ำ}c_{น้ำ}(T - T_{น้ำ})', why: 'เขียน Q = mcΔT ทั้งสองฝั่ง' },
              { eq: 'c_{โลหะ} = frac(m_{น้ำ}c_{น้ำ}(T - T_{น้ำ}),m_{โลหะ}(T_{โลหะ} - T))', why: 'ย้ายข้างให้ตัวที่ต้องการอยู่โดด ๆ' }],
        solve: EQ('m_{โลหะ}c_{โลหะ}(T_{โลหะ} - T) = m_{น้ำ}c_{น้ำ}(T - T_{น้ำ})'),
        subst: SEQ('c_{โลหะ} = frac({mw} × 4200 × ({T} - {tw}),{mm} × ({tm} - {T}))',
                   { mw: mw, T: T, tw: tw, mm: mm, tm: tm }),
        calc: EQ('c_{โลหะ} = frac(' + fmtq(mw * 4200 * (T - tw)) + ',' + fmtq(mm * (tm - T)) + ')',
                 'c_{โลหะ} ≈ ' + item.c + ' `J/kg·°C`'),
        conclude: 'ดังนั้น <b>ความจุความร้อนจำเพาะของโลหะประมาณ ' + M(item.c + ' `J/kg·°C`') +

          ' สูงกว่าโลหะหลายเท่า จึงเปลี่ยนอุณหภูมิยากกว่ามาก</span>'

    };

T({
  id: 's1h-icewater', topic: 104, sub: 'ความร้อนแฝง', level: 'ยาก',

      finds: [{ s: 'Q', unit: 'J', d: 'ความร้อนรวมทั้งสองช่วง', value: Q, positive: true }],

        marks: [{ x: 3, y: 0, label: 'กำลังหลอมเหลว' }] }),
      sol: {
        analyze: 'กระบวนการนี้แบ่งเป็น<b>สองช่วงที่ใช้สูตรคนละตัว</b><br>' +
          'ช่วงที่ 1 น้ำแข็ง 0 °C → น้ำ 0 °C — <b>อุณหภูมิไม่เปลี่ยน</b> แต่ต้องใช้พลังงานตัดแรงยึดเหนี่ยว ใช้ ' +
          M('Q = mL') + '<br>' +

          '<b>กับดักที่พลาดกันมากที่สุด:</b> ลืมช่วงที่ 1 ไปเลย เพราะเห็นว่า "อุณหภูมิไม่เปลี่ยน" ' +
          'แล้วนึกว่าไม่ต้องใช้พลังงาน ทั้งที่ช่วงนี้กินพลังงานมากที่สุด',
        eqs: [{ eq: 'ช่วงเปลี่ยนสถานะ: Q_1 = mL', why: 'อุณหภูมิคงที่ พลังงานถูกใช้ตัดแรงยึดเหนี่ยวระหว่างโมเลกุล' },
              { eq: 'ช่วงเปลี่ยนอุณหภูมิ: Q_2 = mcΔT', why: 'สถานะคงเดิม พลังงานถูกใช้เพิ่มการเคลื่อนที่ของโมเลกุล' },
              { eq: 'Q = Q_1 + Q_2', why: 'พลังงานรวมของทั้งกระบวนการ' }],
        solve: EQ('Q_1 = mL', 'Q_2 = mcΔT', 'Q = Q_1 + Q_2'),
        subst: SEQ('Q_1 = {m} × 333000 = {q1} `J`', { m: m, q1: Q1 }) +
               SEQ('Q_2 = {m} × 4200 × {d} = {q2} `J`', { m: m, d: dT, q2: Q2 }),
        calc: EQ('Q = ' + fmtq(Q1) + ' + ' + fmtq(Q2), 'Q = ' + fmtq(Q) + ' `J`'),
        conclude: 'ดังนั้น <b>ต้องใช้ความร้อนรวม ' + M(fmtq(Q) + ' `J`') + '</b><br>' +
          '<span class="hint">สังเกตว่าช่วงหลอมเหลวอย่างเดียวใช้ไป ' + fmtq(Q1) + ' J ซึ่งคิดเป็น ' +
          fmtq(r2(Q1 * 100 / Q)) + '% ของทั้งหมด<br>' +
          'นี่คือเหตุผลที่น้ำแข็งทำให้เครื่องดื่มเย็นได้ดีกว่าน้ำเย็นธรรมดามาก</span>'

    };

});

T({
  id: 's1h-power', topic: 104, sub: 'ความร้อนกับกำลังของเครื่องใช้ไฟฟ้า', level: 'ยาก',
  skills: ['เชื่อมความร้อนกับกำลังและเวลา', 'คิดประสิทธิภาพของเครื่อง'],
  gen(R) {
    const m = R.pick([0.5, 1, 1.5, 2]);
    const dT = R.step(20, 70, 10);
    const P = R.pick([500, 800, 1000, 1500]);
    const eff = R.pick([50, 60, 75, 80]);
    const Q = m * 4200 * dT;
    const t = r2(Q * 100 / (P * eff));

        eqs: [{ eq: 'ค่าที่ลดลง = frac(ความสูง,11)', why: 'ลดลง 1 mmHg ต่อทุก ๆ 11 เมตร' },
              { eq: 'P = P_0 - ค่าที่ลดลง', why: 'ลบออกจากค่าที่ระดับน้ำทะเล' }],

        subst: SEQ('ค่าที่ลดลง = frac({h},11) = {d} `mmHg`', { h: h, d: drop }),

          '<span class="hint">เครื่องวัดความสูงในนาฬิกาเดินป่าใช้หลักนี้ตรง ๆ — ' +

      sol: {

          '<b>กับดักของข้อนี้:</b> ลบผิดทางแล้วได้ค่าติดลบ ซึ่งเป็นไปไม่ได้ · ' +

              { eq: 'ความสูง = frac(ΔT,อัตราการลดต่อกิโลเมตร)', why: 'ย้อนกลับจากสูตร ΔT = อัตรา × ความสูง' }],
        solve: EQ('ΔT = T_0 - T', 'ความสูง = frac(ΔT,6.5)'),
        subst: SEQ('ΔT = {t0} - {t} = {d} `°C`', { t0: t0, t: t, d: r2(t0 - t) }) +

T({

  gen(R) {

    return {
      stem: 'บันทึกอุณหภูมิสูงสุดประจำวันของสัปดาห์หนึ่งได้ดังนี้ (องศาเซลเซียส)<br>' +
        '<b>' + vals.map(v => fmtq(v)).join(' , ') + '</b><br>' +
        'จงหา<b>อุณหภูมิเฉลี่ย</b>ของช่วงนี้',
      given: [{ s: 'จำนวนวันที่บันทึก', v: n, unit: 'วัน', d: '' },
              { s: 'ผลรวมของอุณหภูมิ', v: sum, unit: '°C', d: 'จากการบวกทุกวัน' }],
      finds: [{ s: 'อุณหภูมิเฉลี่ย', unit: '°C', d: 'ค่าเฉลี่ยเลขคณิต', value: avg }],
      sol: {

T({

        solve: EQ('ความสูง = frac(' + mm + ',1000) = ' + fmtq(mm / 1000) + ' `m`',

        calc: EQ('= ' + fmtq(vol) + ' `m^3`'),
        conclude: 'ดังนั้น <b>ได้น้ำฝน ' + M(fmtq(vol) + ' `m^3`') + '</b> หรือราว ' +

T({
  id: 's1a-cloud', topic: 105, sub: 'ระดับการควบแน่น', level: 'ยาก',

  gen(R) {

    if (!ok2(km) || km <= 0) return null;
    return {
      stem: 'อากาศที่พื้นดินมีอุณหภูมิ ' + U(t0, '°C') + ' และมี<b>จุดน้ำค้าง</b> ' + U(dew, '°C') + '<br>' +
        'เมื่ออากาศลอยสูงขึ้น อุณหภูมิอากาศลดลง 10 °C ต่อกิโลเมตร ส่วนจุดน้ำค้างลดลง 2 °C ต่อกิโลเมตร<br>' +
        'ไอน้ำจะเริ่มควบแน่นเป็นเมฆที่ความสูงกี่<b>กิโลเมตร</b>',
      given: [{ s: 'อุณหภูมิอากาศที่พื้น', v: t0, unit: '°C', d: '' },
              { s: 'จุดน้ำค้างที่พื้น', v: dew, unit: '°C', d: 'อุณหภูมิที่ไอน้ำเริ่มควบแน่น' },
              { s: 'อัตราการลดของอุณหภูมิ', v: 10, unit: '°C/km', d: 'อากาศที่ยังไม่อิ่มตัว' },
              { s: 'อัตราการลดของจุดน้ำค้าง', v: 2, unit: '°C/km', d: '' }],
      finds: [{ s: 'ความสูงที่เกิดเมฆ', unit: 'km', d: 'ระดับที่สองค่ามาบรรจบกัน', value: km, positive: true }],
      sol: {
        analyze: 'เมฆเกิดตอนที่<b>อุณหภูมิอากาศลดลงมาเท่ากับจุดน้ำค้าง</b>พอดี — ตรงนั้นอากาศอิ่มตัว ' +
          'ไอน้ำจึงควบแน่นเป็นละอองน้ำ<br>' +
          'สองค่านี้ลดลงคนละอัตรา จึง<b>ไล่เข้าหากัน</b> ' +
          'ปิดช่องว่างได้ ' + M('10 - 2 = 8') + ' °C ทุกกิโลเมตรที่ลอยสูงขึ้น<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> หารด้วย 10 อย่างเดียวโดยลืมว่าจุดน้ำค้างก็ลดลงหนีไปด้วย ' +
          'คำตอบจะน้อยกว่าความจริง',
        eqs: [{ eq: 'ช่องว่างที่ต้องปิด = T_{อากาศ} - T_{จุดน้ำค้าง}', why: 'ระยะห่างของสองค่าที่พื้นดิน' },
              { eq: 'อัตราการเข้าใกล้กัน = 10 - 2 = 8 `°C/km`', why: 'ทั้งคู่ลดลง แต่คนละอัตรา ช่องว่างจึงแคบลงตามผลต่าง' },
              { eq: 'ความสูง = frac(ช่องว่าง,อัตราการเข้าใกล้กัน)', why: 'ระยะที่ต้องไต่ขึ้นจนสองค่าเท่ากัน' }],
        solve: EQ('ช่องว่าง = T_{อากาศ} - T_{จุดน้ำค้าง}', 'ความสูง = frac(ช่องว่าง,10 - 2)'),
        subst: SEQ('ช่องว่าง = {t0} - {d} = {g} `°C`', { t0: t0, d: dew, g: t0 - dew }) +
               SEQ('ความสูง = frac({g},8)', { g: t0 - dew }),
        calc: EQ('ความสูง = ' + fmtq(km) + ' `km`'),
        conclude: 'ดังนั้น <b>เมฆจะเริ่มก่อตัวที่ความสูง ' + M(fmtq(km) + ' `km`') + '</b> หรือราว ' +

          '<span class="hint">ตรวจย้อนกลับ: ที่ความสูงนี้ อุณหภูมิอากาศ = ' +
          fmtq(r2(t0 - 10 * km)) + ' °C และจุดน้ำค้าง = ' + fmtq(r2(dew - 2 * km)) + ' °C ' +
          'ซึ่งเท่ากันพอดี ✓<br>นี่คือเหตุผลที่ฐานเมฆในวันหนึ่ง ๆ อยู่ระดับเดียวกันเกือบทั้งท้องฟ้า</span>'
      }
    };
  }
});

T({
  id: 's1a-rhtemp', topic: 105, sub: 'ความชื้นสัมพัทธ์', level: 'ยาก',
  skills: ['คิดผลของอุณหภูมิที่มีต่อความชื้นสัมพัทธ์', 'ทำงานสองขั้นโดยมวลไอน้ำคงที่'],

        'พอตกกลางคืนอุณหภูมิลดลงจนอากาศรับไอน้ำได้เต็มที่เพียง ' + U(sat2, 'g/m³') +
        ' โดย<b>มวลไอน้ำในอากาศยังเท่าเดิม</b><br>' +
        'ตอนกลางคืนความชื้นสัมพัทธ์เป็น<b>ร้อยละเท่าใด</b>',
      given: [{ s: 'มวลไอน้ำอิ่มตัวตอนบ่าย', v: sat1, unit: 'g/m³', d: '' },
              { s: 'ความชื้นสัมพัทธ์ตอนบ่าย', v: rh1, unit: '%', d: '' },
              { s: 'มวลไอน้ำอิ่มตัวตอนกลางคืน', v: sat2, unit: 'g/m³', d: 'อุณหภูมิลดลงแล้ว' }],
      finds: [{ s: 'ความชื้นสัมพัทธ์ตอนกลางคืน', unit: '%', d: 'เมื่ออุณหภูมิลดแต่ไอน้ำเท่าเดิม', value: rh2, positive: true }],
      sol: {
        analyze: 'กุญแจของข้อนี้คือ <b>ไอน้ำในอากาศไม่ได้เพิ่มขึ้นเลย</b> แต่ความชื้นสัมพัทธ์กลับสูงขึ้น ' +
          'เพราะ<b>ฐานที่ใช้เทียบเล็กลง</b> — อากาศเย็นอุ้มไอน้ำได้น้อยกว่าอากาศร้อน<br>' +
          'สองขั้น: หามวลไอน้ำจริงจากตอนบ่าย → เอาไปหารด้วยปริมาณอิ่มตัวตอนกลางคืน<br>' +
          '<b>กับดักของข้อนี้:</b> นึกว่าความชื้นสัมพัทธ์เท่าเดิมเพราะไอน้ำเท่าเดิม ' +
          'ซึ่งลืมว่าตัวส่วนเปลี่ยนไปแล้ว',
        eqs: [{ eq: 'มวลไอน้ำจริง = frac(ความชื้นสัมพัทธ์,100) × มวลอิ่มตัว', why: 'หาไอน้ำที่มีอยู่จริงจากข้อมูลตอนบ่าย' },
              { eq: 'ความชื้นสัมพัทธ์ใหม่ = frac(มวลไอน้ำจริง,มวลอิ่มตัวใหม่) × 100',
                why: 'ไอน้ำเท่าเดิม แต่ฐานเปลี่ยนตามอุณหภูมิ' }],
        solve: SEQ('มวลไอน้ำจริง = frac({r},100) × {s} = {n} `g/m^3`', { r: rh1, s: sat1, n: now }),
        subst: SEQ('ความชื้นสัมพัทธ์ใหม่ = frac({n},{s2}) × 100', { n: now, s2: sat2 }),
        calc: EQ('= ' + fmtq(rh2) + ' `%`'),
        conclude: 'ดังนั้น <b>ตอนกลางคืนความชื้นสัมพัทธ์เท่ากับร้อยละ ' + M(fmtq(rh2)) + '</b><br>' +
          '<span class="hint">ถ้าอุณหภูมิลดต่อไปจนอากาศรับไอน้ำได้แค่ ' + fmtq(now) +
          ' g/m³ ความชื้นสัมพัทธ์จะถึง 100% พอดี ไอน้ำจะเริ่มควบแน่นเป็น<b>น้ำค้าง</b><br>' +
          'อุณหภูมิ ณ จุดนั้นเรียกว่า<b>จุดน้ำค้าง</b></span>'

T({

      finds: [{ s: 'ปริมาตรน้ำฝนรวม', unit: 'm³', d: 'น้ำทั้งหมดที่ตกลงบนแปลงนา', value: vol, positive: true }],
      sol: {
        analyze: 'ข้อนี้มีจุดที่ต้องระวัง<b>สองจุด</b> — แปลงพื้นที่จากไร่เป็นตารางเมตร ' +

        eqs: [{ eq: 'พื้นที่ (m^2) = ไร่ × 1600', why: 'แปลงหน่วยพื้นที่ให้เป็นระบบเมตริก' },
              { eq: 'ความสูง (m) = frac(มิลลิเมตร,1000)', why: 'แปลงหน่วยความยาวให้ตรงกับพื้นที่' },
              { eq: 'ปริมาตร = ความสูง × พื้นที่', why: 'ได้หน่วยลูกบาศก์เมตรพอดี' }],
        solve: SEQ('พื้นที่ = {r} × 1600 = {a} `m^2`', { r: rai, a: area }) +
               SEQ('ความสูง = frac({mm},1000) = {h} `m`', { mm: mm, h: r2(mm / 1000) }),
        subst: SEQ('ปริมาตร = {h} × {a}', { h: r2(mm / 1000), a: area }),
        calc: EQ('= ' + fmtq(vol) + ' `m^3`'),
        conclude: 'ดังนั้น <b>ได้น้ำฝนรวม ' + M(fmtq(vol) + ' `m^3`') + '</b> หรือราว ' +
          M(fmtq(r2(vol * 1000)) + ' `ลิตร`') + '<br>' +
          '<span class="hint">คิดคร่าว ๆ ไว้ตรวจ: ฝน 1 มม. บนพื้นที่ 1 ไร่ ได้น้ำ 1.6 ลูกบาศก์เมตร ' +
          'ข้อนี้จึงควรได้ราว ' + M(fmtq(mm) + ' × ' + fmtq(rai) + ' × 1.6 = ' + fmtq(vol)) + ' ✓</span>'
      }
    };
  }
});

T({
  id: 's2b-kcal', topic: 201, sub: 'สารอาหารและพลังงาน', level: 'ง่าย',
  skills: ['คำนวณพลังงานจากมวลสารอาหาร'],
  gen(R) {
    const kind = R.pick([{ n: 'คาร์โบไฮเดรต', k: 4 }, { n: 'โปรตีน', k: 4 }, { n: 'ไขมัน', k: 9 }]);
    const g = R.step(10, 90, 5);
    const E = g * kind.k;
    return {
      stem: 'อาหารจานหนึ่งมี' + esc(kind.n) + ' ' + U(g, 'g') + '<br>' +
        esc(kind.n) + 'ในจานนี้ให้พลังงานกี่<b>กิโลแคลอรี</b> (' + esc(kind.n) + ' ให้ ' +
        kind.k + ' kcal ต่อกรัม)',
      given: [{ s: 'มวลของ' + kind.n, v: g, unit: 'g', d: '' },
              { s: 'พลังงานต่อกรัม', v: kind.k, unit: 'kcal/g', d: 'ค่าประจำของสารอาหารชนิดนี้' }],
      finds: [{ s: 'พลังงาน', unit: 'kcal', d: 'ที่ได้จากสารอาหารชนิดนี้', value: E, positive: true, kind: 'int' }],
      distract: [g + kind.k, r2(g / kind.k), g * (kind.k === 9 ? 4 : 9), g],
      sol: {
        analyze: 'สารอาหารแต่ละชนิดให้พลังงาน<b>ต่อกรัม</b>ไม่เท่ากัน จึงต้องรู้ก่อนว่าเป็นชนิดใด<br>' +
          'พลังงานรวม = มวล × พลังงานต่อกรัม<br>' +
          '<b>กับดักของข้อนี้:</b> ใช้ค่าผิดชนิด — เอา 9 ไปคูณคาร์โบไฮเดรต หรือเอา 4 ไปคูณไขมัน',
        eqs: [{ eq: 'พลังงาน = มวล × พลังงานต่อกรัม', why: 'ทุกกรัมให้พลังงานเท่ากัน จึงคูณได้ตรง ๆ' },
              { eq: 'คาร์โบไฮเดรต 4 · โปรตีน 4 · ไขมัน 9 `kcal/g`', why: 'ค่าประจำที่ต้องจำ' }],
        solve: EQ('พลังงาน = มวล × ' + kind.k),
        subst: SEQ('= {g} × {k}', { g: g, k: kind.k }),
        calc: EQ('= ' + E + ' `kcal`'),
        conclude: 'ดังนั้น <b>ได้พลังงาน ' + M(E + ' `kcal`') + '</b><br>' +
          '<span class="hint">เทียบให้เห็นภาพ: คนทั่วไปต้องการพลังงานราว 2,000 kcal ต่อวัน ' +
          'จานนี้จึงคิดเป็นราวร้อยละ ' + fmtq(r2(E * 100 / 2000)) + ' ของทั้งวัน</span>'
      }
    };
  }
});

T({

T({

      sol: {
        analyze: 'สารอาหารแต่ละชนิดให้พลังงานต่อกรัมไม่เท่ากัน จึงต้อง<b>คิดแยกทีละชนิด</b>แล้วค่อยรวม<br>' +
          'จะเอามวลทั้งหมดมาบวกกันก่อนแล้วคูณค่าเดียวไม่ได้<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> เอา ' + M('(' + c + ' + ' + p + ' + ' + f + ') × 4') +
          ' ซึ่งคิดไขมันต่ำไปกว่าครึ่ง',
        eqs: [{ eq: 'พลังงาน = (คาร์โบไฮเดรต × 4) + (โปรตีน × 4) + (ไขมัน × 9)',
                why: 'รวมพลังงานจากทุกชนิด โดยใช้ค่าประจำของแต่ละชนิด' }],
        solve: EQ('E = (C × 4) + (P × 4) + (F × 9)'),
        subst: SEQ('= ({c} × 4) + ({p} × 4) + ({f} × 9)', { c: c, p: p, f: f }),
        calc: EQ('= ' + (c * 4) + ' + ' + (p * 4) + ' + ' + (f * 9), '= ' + E + ' `kcal`'),
        conclude: 'ดังนั้น <b>ขนมชิ้นนี้ให้พลังงานรวม ' + M(E + ' `kcal`') + '</b><br>' +
          '<span class="hint">สังเกตว่าไขมันมีมวลแค่ ' + f + ' g จากทั้งหมด ' + (c + p + f) +
          ' g แต่ให้พลังงานถึง ' + (f * 9) + ' kcal คิดเป็นร้อยละ ' + fmtq(r2(f * 900 / E)) +
          ' ของพลังงานทั้งชิ้น</span>'
      }
    };
  }
});

T({
  id: 's2b-fatpct', topic: 201, sub: 'สารอาหารและพลังงาน', level: 'ปานกลาง',
  skills: ['คำนวณร้อยละของพลังงานที่มาจากไขมัน', 'เทียบกับเกณฑ์แนะนำ'],
  gen(R) {
    const c = R.step(20, 60, 5), p = R.step(5, 25, 5), f = R.step(4, 24, 2);
    const E = c * 4 + p * 4 + f * 9;
    const pct = r2(f * 900 / E);
    if (!ok2(pct)) return null;
    return {
      stem: 'อาหารจานหนึ่งมีคาร์โบไฮเดรต ' + U(c, 'g') + ' โปรตีน ' + U(p, 'g') + ' และไขมัน ' +
        U(f, 'g') + '<br>' +
        'พลังงานที่มาจาก<b>ไขมัน</b>คิดเป็นร้อยละเท่าใดของพลังงานทั้งหมด',
      given: [{ s: 'คาร์โบไฮเดรต', v: c, unit: 'g', d: '4 kcal/g' },
              { s: 'โปรตีน', v: p, unit: 'g', d: '4 kcal/g' },
              { s: 'ไขมัน', v: f, unit: 'g', d: '9 kcal/g' }],
      finds: [{ s: 'ร้อยละพลังงานจากไขมัน', unit: '%', d: 'เทียบกับพลังงานทั้งหมด', value: pct, positive: true }],
      sol: {
        analyze: 'คำถามนี้เทียบ<b>พลังงาน</b>ต่อพลังงาน ไม่ใช่มวลต่อมวล<br>' +
          'จึงต้องแปลงมวลทุกชนิดเป็นพลังงานก่อน แล้วค่อยหาสัดส่วน<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> หา ' + M('frac(' + f + ',' + (c + p + f) + ') × 100') +
          ' ซึ่งเป็นร้อยละโดย<b>มวล</b> ไม่ใช่โดยพลังงาน และจะได้ค่าต่ำกว่าความจริงมาก',
        eqs: [{ eq: 'พลังงานจากไขมัน = มวลไขมัน × 9', why: 'ไขมันให้ 9 kcal ต่อกรัม' },
              { eq: 'พลังงานทั้งหมด = (C × 4) + (P × 4) + (F × 9)', why: 'รวมพลังงานจากทุกชนิด' },
              { eq: 'ร้อยละ = frac(พลังงานจากไขมัน,พลังงานทั้งหมด) × 100', why: 'สัดส่วนของพลังงาน' }],
        solve: EQ('พลังงานจากไขมัน = ' + f + ' × 9 = ' + (f * 9) + ' `kcal`',
                  'พลังงานทั้งหมด = ' + (c * 4) + ' + ' + (p * 4) + ' + ' + (f * 9) + ' = ' + E + ' `kcal`'),
        subst: SEQ('ร้อยละ = frac({a},{b}) × 100', { a: f * 9, b: E }),
        calc: EQ('= ' + fmtq(pct) + ' `%`'),
        conclude: 'ดังนั้น <b>พลังงานจากไขมันคิดเป็นร้อยละ ' + M(fmtq(pct)) + '</b><br>' +
          '<span class="hint">เกณฑ์แนะนำคือไม่ควรเกินร้อยละ 30 ของพลังงานทั้งหมด ' +
          'อาหารจานนี้จึง' + (pct > 30 ? '<b>เกินเกณฑ์</b>' : '<b>อยู่ในเกณฑ์</b>') + '</span>'
      }
    };
  }
});

T({
  id: 's2b-bmi', topic: 201, sub: 'ดัชนีมวลกาย', level: 'ปานกลาง',
  skills: ['คำนวณดัชนีมวลกาย', 'แปลผลตามเกณฑ์'],
  gen(R) {
    const h = R.pick([1.5, 1.55, 1.6, 1.65, 1.7, 1.75]);
    const bmi = R.pick([17, 18, 20, 21, 22, 24, 25, 27]);
    const w = r2(bmi * h * h);
    if (!ok2(w)) return null;
    const say = bmi < 18.5 ? 'น้ำหนักน้อยกว่าเกณฑ์' : bmi < 23 ? 'อยู่ในเกณฑ์ปกติ'
              : bmi < 25 ? 'ท้วม' : 'เกินเกณฑ์';
    return {
      stem: 'นักเรียนคนหนึ่งสูง ' + U(h, 'เมตร') + ' หนัก ' + U(w, 'กิโลกรัม') + '<br>' +
        'จงหา<b>ดัชนีมวลกาย (BMI)</b> ของนักเรียนคนนี้',
      given: [{ s: 'น้ำหนัก', v: w, unit: 'kg', d: '' },
              { s: 'ส่วนสูง', v: h, unit: 'm', d: 'ต้องเป็นเมตร ไม่ใช่เซนติเมตร' }],
      finds: [{ s: 'BMI', unit: 'kg/m²', d: 'ดัชนีมวลกาย', value: bmi, positive: true }],
      sol: {
        analyze: 'BMI เทียบน้ำหนักกับส่วนสูง เพื่อดูว่ารูปร่างสมส่วนหรือไม่ ' +
          'ใช้แทนการดูน้ำหนักอย่างเดียวซึ่งบอกอะไรไม่ได้ถ้าไม่รู้ส่วนสูง<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> ใส่ส่วนสูงเป็น<b>เซนติเมตร</b> ' +
          'ซึ่งจะทำให้คำตอบเล็กลง 10,000 เท่า · ต้องแปลงเป็นเมตรก่อนเสมอ<br>' +
          'กับดักรอง: ลืม<b>ยกกำลังสอง</b>ที่ส่วนสูง',
        eqs: [{ eq: 'BMI = frac(น้ำหนัก (kg),ส่วนสูง (m)^2)', why: 'นิยามของดัชนีมวลกาย' },
              { eq: 'เกณฑ์: < 18.5 ผอม · 18.5-22.9 ปกติ · 23-24.9 ท้วม · ≥ 25 อ้วน',
                why: 'เกณฑ์สำหรับคนเอเชีย ใช้แปลผลหลังคำนวณ' }],
        solve: EQ('BMI = frac(w,h^2)'),
        subst: SEQ('= frac({w},{h}^2)', { w: w, h: h }),
        calc: EQ('= frac(' + fmtq(w) + ',' + fmtq(r2(h * h)) + ') = ' + fmtq(bmi)),
        conclude: 'ดังนั้น <b>BMI เท่ากับ ' + M(fmtq(bmi)) + '</b> ซึ่งจัดอยู่ในกลุ่ม<b>' + say + '</b><br>' +
          '<span class="hint">ข้อจำกัดที่ควรรู้: BMI ไม่แยกระหว่างมวลกล้ามเนื้อกับไขมัน ' +
          'นักกีฬาที่กล้ามเนื้อเยอะจึงอาจได้ค่าสูงทั้งที่ไม่ได้อ้วน</span>'
      }
    };
  }
});

T({

T({
  id: 's2b-balance', topic: 201, sub: 'สารอาหารและพลังงาน', level: 'ยาก',
  skills: ['เทียบพลังงานที่กินกับที่ใช้', 'ประมาณการเปลี่ยนแปลงน้ำหนัก'],
  gen(R) {
    // เลือก "พลังงานส่วนเกินต่อวัน" กับ "จำนวนวัน" ให้ผลหารด้วย 7,700 ออกมาเป็นเลขสวย
    const use = R.step(1800, 2200, 100);
    const diff = R.pick([220, 385, 550, 770]);
    const days = R.pick([10, 14, 20, 21, 28, 30, 35]);
    const intake = use + diff;
    const extra = diff * days;
    const kg = r2(extra / 7700);                 // ไขมัน 1 กิโลกรัม ≈ 7,700 kcal
    if (!ok2(kg) || kg < 0.2 || kg > 5) return null;
    return {
      stem: 'คนคนหนึ่งได้รับพลังงานจากอาหารวันละ ' + U(intake, 'kcal') + ' แต่ใช้พลังงานวันละ ' +
        U(use, 'kcal') + '<br>' +
        'ถ้าเป็นแบบนี้ต่อเนื่อง ' + U(days, 'วัน') + ' น้ำหนักจะเพิ่มขึ้นประมาณกี่<b>กิโลกรัม</b> ' +
        '(ไขมัน 1 กิโลกรัม เก็บพลังงานได้ราว 7,700 kcal)',
      given: [{ s: 'พลังงานที่ได้รับ', v: intake, unit: 'kcal/วัน', d: 'จากอาหาร' },
              { s: 'พลังงานที่ใช้', v: use, unit: 'kcal/วัน', d: 'จากการดำรงชีวิตและกิจกรรม' },
              { s: 'จำนวนวัน', v: days, unit: 'วัน', d: '' },
              { s: 'พลังงานต่อไขมัน 1 kg', v: 7700, unit: 'kcal', d: 'ค่าประมาณ' }],
      finds: [{ s: 'น้ำหนักที่เพิ่มขึ้น', unit: 'kg', d: 'โดยประมาณ', value: kg, positive: true }],
      sol: {
        analyze: 'ร่างกายทำงานตาม<b>กฎการอนุรักษ์พลังงาน</b> — พลังงานส่วนที่กินเข้าไปแล้วไม่ได้ใช้ ' +
          'ไม่ได้หายไปไหน แต่ถูกเก็บสะสมไว้เป็นไขมัน<br>' +
          'สามขั้น: หาพลังงานส่วนเกินต่อวัน → คูณจำนวนวัน → หารด้วยพลังงานต่อไขมันหนึ่งกิโลกรัม<br>' +
          '<b>กับดักของข้อนี้:</b> เอาพลังงานที่<b>กินเข้าไปทั้งหมด</b>ไปหาร 7,700 ' +
          'ทั้งที่ส่วนที่ถูกใช้ไปแล้วไม่ได้กลายเป็นไขมัน',
        eqs: [{ eq: 'พลังงานส่วนเกินต่อวัน = พลังงานที่ได้รับ - พลังงานที่ใช้', why: 'เฉพาะส่วนที่เหลือเท่านั้นที่ถูกสะสม' },
              { eq: 'พลังงานส่วนเกินรวม = ส่วนเกินต่อวัน × จำนวนวัน', why: 'สะสมทบไปเรื่อย ๆ ทุกวัน' },
              { eq: 'น้ำหนักที่เพิ่ม = frac(พลังงานส่วนเกินรวม,7700)', why: 'ไขมันหนึ่งกิโลกรัมเก็บพลังงานได้ราว 7,700 kcal' }],
        solve: EQ('ส่วนเกินต่อวัน = ' + intake + ' - ' + use + ' = ' + (intake - use) + ' `kcal`',
                  'ส่วนเกินรวม = ' + (intake - use) + ' × ' + days + ' = ' + fmtq(extra) + ' `kcal`'),
        subst: SEQ('น้ำหนักที่เพิ่ม = frac({e},7700)', { e: extra }),
        calc: EQ('= ' + fmtq(kg) + ' `kg`'),
        conclude: 'ดังนั้น <b>น้ำหนักจะเพิ่มขึ้นประมาณ ' + M(fmtq(kg) + ' `kg`') + '</b><br>' +
          '<span class="hint">คิดกลับ: ถ้าอยากลดน้ำหนัก 1 กิโลกรัม ต้องทำให้ขาดพลังงานสะสม 7,700 kcal ' +
          'ซึ่งถ้าลดวันละ 500 kcal ก็ต้องใช้เวลาราว 15 วัน<br>' +
          'นี่คือเหตุผลที่การลดน้ำหนักอย่างปลอดภัยต้องค่อยเป็นค่อยไป</span>'
      }
    };
  }
});

T({
  id: 's2b-bmiback', topic: 201, sub: 'ดัชนีมวลกาย', level: 'ยาก',
  skills: ['ทำงานย้อนกลับจาก BMI ไปหาน้ำหนัก', 'คำนวณน้ำหนักที่ต้องลด'],
  gen(R) {
    const h = R.pick([1.5, 1.6, 1.7, 1.8]);
    const bmi0 = R.pick([26, 27, 28, 30]);
    const target = R.pick([22, 23]);
    const w0 = r2(bmi0 * h * h), wt = r2(target * h * h);
    const diff = r2(w0 - wt);
    if (!ok2(w0, wt, diff) || diff <= 0) return null;
    return {
      stem: 'ชายคนหนึ่งสูง ' + U(h, 'เมตร') + ' มีดัชนีมวลกาย ' + U(bmi0) + '<br>' +
        'ถ้าต้องการลดให้ BMI เหลือ ' + U(target) + ' เขาต้องลดน้ำหนักลงกี่<b>กิโลกรัม</b>',
      given: [{ s: 'ส่วนสูง', v: h, unit: 'm', d: 'ไม่เปลี่ยนแปลง' },
              { s: 'BMI ปัจจุบัน', v: bmi0, unit: 'kg/m²', d: '' },
              { s: 'BMI เป้าหมาย', v: target, unit: 'kg/m²', d: 'อยู่ในเกณฑ์ปกติ' }],
      finds: [{ s: 'น้ำหนักที่ต้องลด', unit: 'kg', d: 'ผลต่างของน้ำหนักสองค่า', value: diff, positive: true }],
      sol: {
        analyze: 'ข้อนี้ทำงาน<b>ย้อนทาง</b>สองรอบ — จาก BMI กลับไปหาน้ำหนัก ทั้งค่าปัจจุบันและค่าเป้าหมาย ' +
          'แล้วค่อยหาผลต่าง<br>' +
          'ส่วนสูงไม่เปลี่ยน จึงใช้ค่าเดียวกันได้ทั้งสองรอบ<br>' +
          '<b>กับดักของข้อนี้:</b> เอา ' + M(bmi0 + ' - ' + target + ' = ' + (bmi0 - target)) +
          ' แล้วตอบเป็นกิโลกรัม ทั้งที่นั่นเป็นผลต่างของ BMI ไม่ใช่ของน้ำหนัก',
        eqs: [{ eq: 'BMI = frac(w,h^2)  ⇒  w = BMI × h^2', why: 'ย้ายข้างให้น้ำหนักอยู่โดด ๆ' },
              { eq: 'น้ำหนักที่ต้องลด = w_{ปัจจุบัน} - w_{เป้าหมาย}', why: 'ผลต่างของน้ำหนักสองค่า' },
              { eq: 'รวบสูตรได้เป็น (BMI_1 - BMI_2) × h^2', why: 'ดึง h² ออกมาเป็นตัวประกอบร่วม คิดรวดเดียวได้เลย' }],
        solve: SEQ('w_{ปัจจุบัน} = {b} × {h}^2 = {w} `kg`', { b: bmi0, h: h, w: w0 }) +
               SEQ('w_{เป้าหมาย} = {t} × {h}^2 = {wt} `kg`', { t: target, h: h, wt: wt }),
        subst: EQ('น้ำหนักที่ต้องลด = ' + fmtq(w0) + ' - ' + fmtq(wt)),
        calc: EQ('= ' + fmtq(diff) + ' `kg`'),
        conclude: 'ดังนั้น <b>ต้องลดน้ำหนักลง ' + M(fmtq(diff) + ' `kg`') + '</b><br>' +
          '<span class="hint">ตรวจอีกทาง: ' + M('(' + bmi0 + ' - ' + target + ') × ' + fmtq(h) + '^2 = ' + fmtq(diff)) +
          ' ตรงกัน ✓<br>ถ้าลดอย่างปลอดภัยสัปดาห์ละ 0.5 กิโลกรัม จะใช้เวลาราว ' +
          fmtq(r2(diff / 0.5)) + ' สัปดาห์</span>'
      }
    };
  }
});

T({
  id: 's2b-airday', topic: 201, sub: 'ระบบหายใจ', level: 'ยาก',
  skills: ['คำนวณปริมาตรอากาศต่อวัน', 'หาปริมาณออกซิเจนที่ร่างกายใช้'],
  gen(R) {
    const tv = R.pick([400, 500, 600]);
    const rate = R.pick([12, 15, 20]);
    const pct = R.pick([4, 5]);                    // ร้อยละของอากาศที่ถูกใช้เป็นออกซิเจน
    const Lday = r2(tv * rate * 1440 / 1000);
    const o2 = r2(Lday * pct / 100);
    if (!ok2(Lday, o2)) return null;
    return {
      stem: 'คนคนหนึ่งหายใจครั้งละ ' + U(tv, 'mL') + ' อัตรา ' + U(rate, 'ครั้ง/นาที') + '<br>' +
        'ถ้าร่างกายดึงออกซิเจนจากอากาศที่หายใจเข้าไปได้ร้อยละ ' + U(pct) + ' ของปริมาตรอากาศ<br>' +
        'ในหนึ่งวันร่างกายใช้ออกซิเจนไปกี่<b>ลิตร</b> (1 วัน = 1,440 นาที)',
      given: [{ s: 'ปริมาตรอากาศต่อครั้ง', v: tv, unit: 'mL', d: '' },
              { s: 'อัตราการหายใจ', v: rate, unit: 'ครั้ง/นาที', d: '' },
              { s: 'สัดส่วนออกซิเจนที่ใช้', v: pct, unit: '%', d: 'ของปริมาตรอากาศที่หายใจเข้า' }],
      finds: [{ s: 'ปริมาตรออกซิเจนที่ใช้', unit: 'L', d: 'ต่อหนึ่งวัน', value: o2, positive: true }],
      sol: {
        analyze: 'ข้อนี้ต่อกัน<b>สี่ขั้น</b> — ต่อครั้ง → ต่อนาที → ต่อวัน → แปลงหน่วย → คิดร้อยละ<br>' +
          'เขียนหน่วยกำกับทุกขั้น จะไม่หลงว่าคูณอะไรไปแล้ว<br>' +
          '<b>กับดักของข้อนี้:</b> คิดร้อยละตั้งแต่ต้นแล้วลืมคูณต่อ หรือลืมว่าหนึ่งวันมี 1,440 นาที ' +
          'ไม่ใช่ 24',
        eqs: [{ eq: 'ปริมาตรอากาศต่อวัน = ปริมาตรต่อครั้ง × อัตรา × 1440', why: 'สะสมทั้งวัน' },
              { eq: '`1 L = 1000 mL`', why: 'แปลงหน่วยให้ตรงกับที่โจทย์ถาม' },
              { eq: 'ปริมาตรออกซิเจน = ปริมาตรอากาศ × frac(ร้อยละ,100)', why: 'ใช้เพียงบางส่วนของอากาศที่หายใจเข้าไป' }],
        solve: EQ('อากาศต่อวัน = ' + tv + ' × ' + rate + ' × 1440 = ' + fmtq(tv * rate * 1440) + ' `mL`',
                  '= ' + fmtq(Lday) + ' `L`'),
        subst: SEQ('ออกซิเจน = {L} × frac({p},100)', { L: Lday, p: pct }),
        calc: EQ('= ' + fmtq(o2) + ' `L`'),
        conclude: 'ดังนั้น <b>ร่างกายใช้ออกซิเจนวันละประมาณ ' + M(fmtq(o2) + ' `L`') + '</b><br>' +
          '<span class="hint">สังเกตว่าเราหายใจอากาศเข้าไปถึง ' + fmtq(Lday) + ' ลิตร ' +
          'แต่ใช้ออกซิเจนจริงแค่ ' + fmtq(o2) + ' ลิตร<br>' +
          'ที่เหลือหายใจออกไปเกือบหมด นี่คือเหตุผลที่การผายปอดช่วยชีวิตได้ ' +
          'เพราะลมหายใจออกยังมีออกซิเจนเหลืออยู่มาก</span>'
      }
    };
  }
});

T({
  id: 's2s-pctmass', topic: 202, sub: 'ความเข้มข้นร้อยละโดยมวล', level: 'ง่าย',
  skills: ['คำนวณร้อยละโดยมวล', 'รวมมวลสารละลายให้ถูก'],
  gen(R) {
    const pct = R.pick([5, 10, 20, 25, 40]);
    const total = R.step(100, 500, 20);
    const solute = r2(total * pct / 100);
    if (!ok2(solute)) return null;
    return {
      stem: 'สารละลายหนึ่งมีมวลรวม ' + U(total, 'g') + ' โดยมีตัวละลายอยู่ ' + U(solute, 'g') + '<br>' +
        'จงหา<b>ความเข้มข้นเป็นร้อยละโดยมวล</b>',
      given: [{ s: 'มวลตัวละลาย', v: solute, unit: 'g', d: '' },
              { s: 'มวลสารละลาย', v: total, unit: 'g', d: 'ตัวละลาย + ตัวทำละลาย' }],
      finds: [{ s: 'ความเข้มข้น', unit: '%', d: 'ร้อยละโดยมวล', value: pct, positive: true }],
      distract: [r2(total * 100 / solute), r2(total - solute), r2(solute * 100 / (total - solute)), r2(pct * 2)],
      sol: {
        analyze: 'ร้อยละโดยมวลบอกว่า "ในสารละลาย 100 กรัม มีตัวละลายอยู่กี่กรัม"<br>' +
          'ข้อนี้โจทย์ให้<b>มวลสารละลายรวม</b>มาแล้ว จึงใช้เป็นตัวส่วนได้เลย ไม่ต้องบวกอะไรเพิ่ม<br>' +
          '<b>กับดักของข้อนี้:</b> เอามวลตัวทำละลาย (' + fmtq(total - solute) + ' g) มาเป็นตัวส่วนแทน',
        eqs: [{ eq: 'ร้อยละโดยมวล = frac(มวลตัวละลาย,มวลสารละลาย) × 100',
                why: 'ตัวส่วนคือมวลของสารละลายทั้งหมด ไม่ใช่มวลตัวทำละลาย' }],
        solve: EQ('ร้อยละ = frac(มวลตัวละลาย,มวลสารละลาย) × 100'),
        subst: SEQ('= frac({s},{t}) × 100', { s: solute, t: total }),
        calc: EQ('= ' + fmtq(pct) + ' `%`'),
        conclude: 'ดังนั้น <b>สารละลายเข้มข้นร้อยละ ' + M(fmtq(pct)) + ' โดยมวล</b><br>' +
          '<span class="hint">ความหมาย: ในสารละลายทุก ๆ 100 กรัม จะมีตัวละลายอยู่ ' + fmtq(pct) + ' กรัม</span>'
      }
    };
  }
});

T({

        ' ส่วนสารตัวหนึ่งเคลื่อนที่ได้ ' + U(d, 'cm') + '<br>จงหาค่า ' + M('R_f') + ' ของสารนี้',
      given: [{ s: 'ระยะที่สารเคลื่อนที่', v: d, unit: 'cm', d: 'วัดจากเส้นเริ่มต้น' },

      finds: [{ s: 'R_f', d: 'ค่าที่ใช้ระบุชนิดสาร', value: rf, positive: true }],
      distract: [r2(solv / d), r2(solv - d), r2(d * solv), r2(rf * 10)],
      figure: figSepar({ kind: 'chroma', solvent: 0.85, spot: clamp(0.85 * rf, 0.08, 0.8),
                         solventLbl: 'ตัวทำละลาย ' + fmtq(solv) + ' cm',

          'สารเคลื่อนที่ไปกับตัวทำละลาย จึงเป็นไปไม่ได้ที่จะไปไกลกว่า ค่าจึงอยู่ระหว่าง 0 ถึง 1 เสมอ<br>' +

        eqs: [{ eq: 'R_f = frac(ระยะที่สารเคลื่อนที่ได้,ระยะที่ตัวทำละลายเคลื่อนที่ได้)', why: 'นิยามของค่า Rf' },
              { eq: '0 ≤ R_f ≤ 1 เสมอ', why: 'สารเคลื่อนที่ไปกับตัวทำละลาย จึงไปไกลกว่าไม่ได้' }],
        solve: EQ('R_f = frac(ระยะของสาร,ระยะของตัวทำละลาย)'),
        subst: SEQ('= frac({d},{s})', { d: d, s: solv }),
        calc: EQ('= ' + fmtq(rf)),
        conclude: 'ดังนั้น <b>ค่า ' + M('R_f = ' + fmtq(rf)) + '</b><br>' +
          '<span class="hint">ค่า Rf ไม่มีหน่วย เพราะเป็นความยาวหารความยาว · ' +
          'สารเดียวกันในระบบเดียวกันให้ค่าเท่าเดิมทุกครั้ง จึงใช้ระบุชนิดสารได้</span>'
      }
    };
  }
});

T({

          'หลักการเหมือนร้อยละทุกอย่าง เปลี่ยนแค่ตัวคูณจาก 100 เป็น 1,000,000<br>' +

              { eq: '`1 kg = 10^6 mg`', why: 'ทำหน่วยให้เหมือนกันก่อนหาร' },
              { eq: 'ทางลัด: `mg` ต่อ `kg` มีค่าเท่ากับ ppm พอดี', why: 'เพราะ 1 kg = 10⁶ mg ตัวคูณ 10⁶ จึงตัดกันไปเลย' }],
        solve: EQ('มวลน้ำ = ' + kg + ' `kg` = ' + fmtq(kg * 1e6) + ' `mg`',

      }

  }
});

          'จึงค่อยหาอัตราส่วนใหม่<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> เอา ' + M('frac(' + c1 + ' + ' + c2 + ',2) = ' + fmtq((c1 + c2) / 2)) +

        eqs: [{ eq: 'มวลตัวละลาย = frac(ความเข้มข้น,100) × มวลสารละลาย', why: 'แปลงร้อยละกลับเป็นมวลจริง' },
              { eq: 'C = frac(ตัวละลายรวม,มวลรวม) × 100', why: 'หาอัตราส่วนใหม่หลังผสม' }],
        solve: SEQ('ตัวละลายส่วนที่ 1 = frac({c1},100) × {m1} = {a} `g`', { c1: c1, m1: m1, a: r2(c1 * m1 / 100) }) +
               SEQ('ตัวละลายส่วนที่ 2 = frac({c2},100) × {m2} = {b} `g`', { c2: c2, m2: m2, b: r2(c2 * m2 / 100) }),
        subst: SEQ('C = frac({a} + {b},{m1} + {m2}) × 100',

        calc: EQ('C = frac(' + fmtq(r2((c1 * m1 + c2 * m2) / 100)) + ',' + (m1 + m2) + ') × 100',

          '<span class="hint">ตรวจความสมเหตุสมผล: ค่าต้องอยู่ระหว่าง ' + fmtq(c1) + ' กับ ' + fmtq(c2) +

T({

        'สารละลายสุดท้ายเข้มข้น<b>ร้อยละเท่าใด</b>',
      given: [{ s: 'C_1', v: c1, unit: '%', d: 'ความเข้มข้นเดิม' },

      finds: [{ s: 'C_3', unit: '%', d: 'ความเข้มข้นสุดท้าย', value: c3, positive: true }],
      sol: {
        analyze: 'กุญแจของข้อนี้คือ <b>ปริมาณตัวละลายไม่เปลี่ยนเลยตั้งแต่ต้นจนจบ</b> ' +
          'เติมน้ำกี่ครั้งก็ตาม ตัวละลายยังเท่าเดิมทุกมิลลิลิตร<br>' +
          'จึงข้ามการคิดทีละขั้นได้ — เอาปริมาตรสุดท้ายรวมทีเดียวแล้วใช้ ' + M('C_1V_1 = C_3V_3') + '<br>' +

          'ซึ่งทำได้แต่เสียเวลา และมีโอกาสปัดเศษพลาดสองรอบ',
        eqs: [{ eq: 'V_3 = V_1 + น้ำครั้งที่ 1 + น้ำครั้งที่ 2', why: 'ปริมาตรสุดท้ายคือทุกอย่างรวมกัน' },
              { eq: 'C_1V_1 = C_3V_3', why: 'ตัวละลายเท่าเดิมตลอด จึงจับสองสถานะมาเทียบกันตรง ๆ ได้' },
              { eq: 'C_3 = frac(C_1V_1,V_3)', why: 'ย้ายข้างหาความเข้มข้นสุดท้าย' }],
        solve: SEQ('V_3 = {v1} + {a1} + {a2} = {v3} `mL`', { v1: v1, a1: add1, a2: add2, v3: v3 }),
        subst: SEQ('C_3 = frac({c1} × {v1},{v3})', { c1: c1, v1: v1, v3: v3 }),

T({
  id: 's2s-ppmmass', topic: 202, sub: 'ความเข้มข้นหน่วย ppm', level: 'ยาก',
  skills: ['แปลง ppm กลับเป็นมวล', 'ทำงานกับปริมาตรน้ำขนาดใหญ่'],
  gen(R) {
    const ppm = R.pick([0.5, 1, 2, 5, 10]);
    const m3 = R.pick([10, 20, 50, 100, 500]);
    const g = r2(ppm * m3);                      // 1 m³ น้ำ = 1000 kg ⇒ 1 ppm = 1 g/m³
    if (!ok2(g)) return null;
    return {
      stem: 'สระเก็บน้ำแห่งหนึ่งมีน้ำ ' + U(m3, 'ลูกบาศก์เมตร') + ' ตรวจพบสารปนเปื้อนเข้มข้น ' +
        U(ppm, 'ppm') + '<br>' +
        'ในสระนี้มีสารปนเปื้อนอยู่ทั้งหมดกี่<b>กรัม</b> (น้ำ 1 ลูกบาศก์เมตร มีมวล 1,000 kg)',
      given: [{ s: 'ปริมาตรน้ำ', v: m3, unit: 'm³', d: '' },
              { s: 'ความเข้มข้น', v: ppm, unit: 'ppm', d: 'ส่วนในล้านส่วนโดยมวล' },
              { s: 'ความหนาแน่นของน้ำ', v: 1000, unit: 'kg/m³', d: '' }],
      finds: [{ s: 'มวลสารปนเปื้อน', unit: 'g', d: 'ในสระทั้งหมด', value: g, positive: true }],
      sol: {
        analyze: 'ข้อนี้ต้องแปลงหน่วยหลายชั้น จึงควรทำทีละขั้นแล้วเขียนหน่วยกำกับไว้ทุกครั้ง<br>' +
          'ลำดับ: ปริมาตรน้ำ → มวลน้ำเป็นกิโลกรัม → ใช้ทางลัด "mg ต่อ kg = ppm" → แปลงเป็นกรัม<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมว่า 1 ลูกบาศก์เมตรของน้ำหนักถึง 1,000 กิโลกรัม ' +
          'ทำให้คำตอบผิดไปหลักพันเท่า',
        eqs: [{ eq: 'มวลน้ำ (kg) = ปริมาตร (m^3) × 1000', why: 'น้ำมีความหนาแน่น 1000 kg/m³' },
              { eq: 'ppm ⇒ มวลตัวละลาย (mg) = ppm × มวลน้ำ (kg)', why: 'ทางลัดจากนิยาม เพราะ 1 kg = 10⁶ mg' },
              { eq: '`1 g = 1000 mg`', why: 'แปลงเป็นหน่วยที่โจทย์ถามเป็นขั้นสุดท้าย' }],
        solve: SEQ('มวลน้ำ = {m} × 1000 = {kg} `kg`', { m: m3, kg: m3 * 1000 }),
        subst: SEQ('มวลสารปนเปื้อน = {p} × {kg} = {mg} `mg`',
                   { p: ppm, kg: m3 * 1000, mg: r2(ppm * m3 * 1000) }),
        calc: EQ('= frac(' + fmtq(r2(ppm * m3 * 1000)) + ',1000) = ' + fmtq(g) + ' `g`'),
        conclude: 'ดังนั้น <b>มีสารปนเปื้อนอยู่ ' + M(fmtq(g) + ' `g`') + '</b><br>' +
          '<span class="hint">ทางลัดที่จำไว้ใช้ได้เลย: <b>1 ppm ในน้ำ 1 ลูกบาศก์เมตร = 1 กรัม</b><br>' +
          'ข้อนี้จึงคิดในใจได้ทันทีเป็น ' + M(fmtq(ppm) + ' × ' + fmtq(m3) + ' = ' + fmtq(g) + ' `g`') + ' ✓</span>'
      }
    };
  }
});

T({
  id: 's2f-net', topic: 203, sub: 'แรงลัพธ์', level: 'ง่าย',

  gen(R) {

    if (!ans) return null;
    return {
      stem: 'มีแรงสองแรงกระทำต่อวัตถุในแนวเดียวกัน ขนาด ' + U(a, 'N') + ' และ ' + U(b, 'N') +
        ' โดยมีทิศ<b>' + (same ? 'เดียวกัน' : 'ตรงข้ามกัน') + '</b><br>จงหา<b>ขนาดของแรงลัพธ์</b>',
      given: [{ s: 'F_1', v: a, unit: 'N', d: '' },
              { s: 'F_2', v: b, unit: 'N', d: '' },
              { s: 'ทิศทาง', v: same ? 'เดียวกัน' : 'ตรงข้ามกัน', d: '' }],
      finds: [{ s: 'F_{ลัพธ์}', unit: 'N', d: 'ขนาดของแรงลัพธ์', value: ans, positive: true }],
      distract: [same ? Math.abs(a - b) : a + b, r2(a * b), r2((a + b) / 2), Math.max(a, b)],
      figure: figForcesPoint({ body: 'box', forces: same
        ? [{ deg: 0, label: fmtq(a) + ' N', len: 56 }, { deg: 0, label: fmtq(b) + ' N', len: 76, ly: 24 }]
        : [{ deg: 0, label: fmtq(a) + ' N', len: 62 }, { deg: 180, label: fmtq(b) + ' N', len: 62 }] }),
      sol: {
        analyze: 'แรงเป็นปริมาณ<b>เวกเตอร์</b> ต้องดูทิศก่อนเสมอ<br>' +
          (same ? 'ข้อนี้ทิศเดียวกัน จึงช่วยกันดัน ให้<b>บวก</b>ขนาดกัน'
                : 'ข้อนี้ทิศตรงข้าม จึงหักล้างกันบางส่วน ให้<b>ลบ</b>ขนาดกัน') + '<br>' +
          '<b>กับดักของข้อนี้:</b> ' + (same ? 'เผลอลบทั้งที่ทิศเดียวกัน' : 'เผลอบวกทั้งที่ทิศตรงข้าม'),
        eqs: [{ eq: 'ทิศเดียวกัน: F_{ลัพธ์} = F_1 + F_2', why: 'แรงช่วยกัน ผลรวมจึงมากขึ้น' },
              { eq: 'ทิศตรงข้าม: F_{ลัพธ์} = |F_1 - F_2| ทิศตามแรงที่มากกว่า', why: 'แรงหักล้างกัน เหลือเท่ากับผลต่าง' }],
        solve: EQ('F_{ลัพธ์} = ' + a + (same ? ' + ' : ' - ') + b),
        subst: EQ('= ' + a + (same ? ' + ' : ' - ') + b),
        calc: EQ('= ' + fmtq(ans) + ' `N`'),
        conclude: 'ดังนั้น <b>แรงลัพธ์มีขนาด ' + M(fmtq(ans) + ' `N`') + '</b>' +
          (same ? ' มีทิศเดียวกับแรงทั้งสอง' : ' มีทิศตามแรงขนาด ' + M(Math.max(a, b) + ' `N`')) + '<br>' +
          '<span class="hint">ตอบแรงต้องบอก<b>ทั้งขนาดและทิศ</b> จึงจะครบถ้วน</span>'
      }
    };
  }
});

T({

              { s: 'L', v: L, unit: 'm', d: 'ระยะตั้งฉากจากจุดหมุน' }],

      distract: [r2(F / L), r2(F + L), r2(F - L), r2(M2 * 2)],

        loads: [{ x: 0.15, label: fmtq(F) + ' N' }],

      sol: {
        analyze: 'โมเมนต์คือ "ความสามารถในการทำให้หมุน" ซึ่งขึ้นกับทั้ง<b>แรง</b>และ<b>ระยะจากจุดหมุน</b><br>' +

          '<b>กับดักของข้อนี้:</b> เอาแรงหารระยะ ซึ่งได้หน่วยผิดทันที',
        eqs: [{ eq: 'M = F × L', why: 'โมเมนต์เท่ากับแรงคูณระยะตั้งฉากจากจุดหมุน' },

        solve: EQ('M = F × L'),

          '<span class="hint">ถ้าอยากได้โมเมนต์เท่าเดิมแต่ออกแรงน้อยลงครึ่งหนึ่ง ' +
          'ต้องใช้ด้ามที่ยาวเป็นสองเท่าคือ ' + fmtq(r2(L * 2)) + ' เมตร</span>'

T({

          'บนพื้นราบและไม่มีแรงกดเพิ่ม แรงกดตั้งฉากเท่ากับน้ำหนักของกล่องพอดี<br>' +
          '<b>กับดักของข้อนี้:</b> เอา μ คูณ<b>มวล</b>เลย ซึ่งลืมคูณ g จึงได้ค่าน้อยไป 10 เท่า',
        eqs: [{ eq: 'N = mg', why: 'บนพื้นราบ แรงกดตั้งฉากเท่ากับน้ำหนัก' },

        solve: EQ('N = mg', 'f = μN'),

        calc: EQ('f = ' + fmtq(f) + ' `N`'),

T({
  id: 's2f-lever', topic: 203, sub: 'คานและโมเมนต์', level: 'ปานกลาง',
  skills: ['ใช้หลักการสมดุลของโมเมนต์', 'หาแรงที่ทำให้คานสมดุล'],
  gen(R) {
    const F1 = R.step(20, 100, 10);
    const L1 = R.pick([0.4, 0.5, 0.6, 0.8, 1]);
    const L2 = R.pick([0.2, 0.25, 0.4, 0.5, 1, 1.2, 1.5, 2]);
    if (L1 === L2) return null;
    const F2 = r2(F1 * L1 / L2);
    if (!ok2(F2) || F2 < 5 || F2 > 500) return null;
    return {
      stem: 'คานอันหนึ่งวางบนจุดหมุน มีแรง ' + U(F1, 'N') + ' กดลงที่ระยะ ' + U(L1, 'm') +
        ' ทางซ้ายของจุดหมุน<br>' +
        'ต้องออกแรงกดลงทางขวาที่ระยะ ' + U(L2, 'm') + ' เท่าใด<b>คานจึงสมดุล</b>',
      given: [{ s: 'F_1', v: F1, unit: 'N', d: 'แรงทางซ้าย' },
              { s: 'L_1', v: L1, unit: 'm', d: 'ระยะจากจุดหมุนถึงแรงซ้าย' },
              { s: 'L_2', v: L2, unit: 'm', d: 'ระยะจากจุดหมุนถึงแรงขวา' }],
      finds: [{ s: 'F_2', unit: 'N', d: 'แรงทางขวาที่ทำให้สมดุล', value: F2, positive: true }],
      figure: figBeam({ supports: [{ x: 0.5, label: 'จุดหมุน' }],
        loads: [{ x: 0.16, label: fmtq(F1) + ' N' }, { x: 0.84, label: 'F₂ = ?' }],
        marks: [{ x0: 0.16, x1: 0.5, label: fmtq(L1) + ' m' }, { x0: 0.5, x1: 0.84, label: fmtq(L2) + ' m' }] }),
      sol: {
        analyze: 'คานสมดุลเมื่อ<b>โมเมนต์ตามเข็มเท่ากับโมเมนต์ทวนเข็ม</b><br>' +
          'แรงซ้ายพยายามหมุนคานไปทางหนึ่ง แรงขวาพยายามหมุนไปอีกทาง ต้องเท่ากันพอดีคานจึงนิ่ง<br>' +
          '<b>กับดักของข้อนี้:</b> คิดว่าแรงสองข้างต้องเท่ากัน ซึ่งจริงเฉพาะเมื่อ<b>ระยะเท่ากัน</b>เท่านั้น',
        eqs: [{ eq: 'โมเมนต์ตามเข็ม = โมเมนต์ทวนเข็ม', why: 'เงื่อนไขสมดุลของการหมุน' },
              { eq: 'F_1L_1 = F_2L_2', why: 'เขียนโมเมนต์ทั้งสองฝั่งด้วย M = F × L' },
              { eq: 'F_2 = frac(F_1L_1,L_2)', why: 'ย้ายข้างหาแรงที่ต้องการ' }],
        solve: EQ('F_1L_1 = F_2L_2', 'F_2 = frac(F_1L_1,L_2)'),
        subst: SEQ('F_2 = frac({F1} × {L1},{L2})', { F1: F1, L1: L1, L2: L2 }),
        calc: EQ('F_2 = frac(' + fmtq(F1 * L1) + ',' + fmtq(L2) + ') = ' + fmtq(F2) + ' `N`'),
        conclude: 'ดังนั้น <b>ต้องออกแรง ' + M(fmtq(F2) + ' `N`') + ' คานจึงสมดุล</b><br>' +
          '<span class="hint">สังเกต: ' + (L2 > L1 ? 'ระยะทางขวา<b>ยาวกว่า</b> จึงใช้แรง<b>น้อยกว่า</b>'
                                                    : 'ระยะทางขวา<b>สั้นกว่า</b> จึงต้องใช้แรง<b>มากกว่า</b>') +

T({

        eqs: [{ eq: 'F_B = W_{อากาศ} - W_{น้ำ}', why: 'น้ำหนักที่หายไปเมื่อจมน้ำ คือแรงพยุงพอดี' },

T({
  id: 's2f-perp', topic: 203, sub: 'แรงลัพธ์', level: 'ปานกลาง',
  skills: ['หาแรงลัพธ์ของแรงตั้งฉาก', 'ใช้ทฤษฎีบทพีทาโกรัส'],
  gen(R) {
