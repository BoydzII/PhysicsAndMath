    const k = R.pick([1, 2, 5, 10]);
    const a = set[0] * k, b = set[1] * k, c = set[2] * k;
    if (c > 500) return null;
    return {
      stem: 'มีแรงสองแรงกระทำต่อวัตถุที่จุดเดียวกัน ขนาด ' + U(a, 'N') + ' และ ' + U(b, 'N') +
        ' โดยทำมุม<b>ตั้งฉาก</b>กัน<br>จงหา<b>ขนาดของแรงลัพธ์</b>',
      given: [{ s: 'F_1', v: a, unit: 'N', d: 'แนวหนึ่ง' },
              { s: 'F_2', v: b, unit: 'N', d: 'ตั้งฉากกับแนวแรก' }],
      finds: [{ s: 'R', unit: 'N', d: 'ขนาดของแรงลัพธ์', value: c, positive: true, kind: 'int' }],
      figure: figForcesPoint({ forces: [
        { deg: 0, label: fmtq(a) + ' N', len: 62 }, { deg: 90, label: fmtq(b) + ' N', len: 62 }] }),
      sol: {
        analyze: 'แรงตั้งฉากกันจะบวกกันตรง ๆ ไม่ได้ เพราะคนละแนว<br>' +
          'ต้องวาดให้เป็น<b>สี่เหลี่ยมมุมฉาก</b> แล้วแรงลัพธ์คือเส้นทแยงมุม ซึ่งหาได้ด้วยทฤษฎีบทพีทาโกรัส<br>' +
          '<b>กับดักของข้อนี้:</b> เอา ' + a + ' + ' + b + ' = ' + (a + b) +
          ' ซึ่งใช้ได้เฉพาะเมื่อสองแรง<b>ทิศเดียวกัน</b>',
        eqs: [{ eq: 'R = sqrt(F_1^2 + F_2^2)', why: 'แรงสองแรงเป็นด้านประกอบมุมฉาก แรงลัพธ์คือด้านตรงข้ามมุมฉาก' },
              { eq: 'R ต้องมากกว่าแรงแต่ละตัว แต่น้อยกว่าผลบวก', why: 'ใช้ตรวจคำตอบได้เร็ว' }],
        solve: EQ('R = sqrt(F_1^2 + F_2^2)'),
        subst: SEQ('= sqrt({a}^2 + {b}^2)', { a: a, b: b }),
        calc: EQ('= sqrt(' + (a * a) + ' + ' + (b * b) + ') = sqrt(' + (a * a + b * b) + ')', '= ' + c + ' `N`'),
        conclude: 'ดังนั้น <b>แรงลัพธ์มีขนาด ' + M(c + ' `N`') + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: ค่าต้องอยู่ระหว่าง ' + Math.max(a, b) + ' กับ ' +
          (a + b) + ' N ✓ (มากกว่าแรงเดี่ยวที่ใหญ่ที่สุด แต่ไม่ถึงผลบวก)</span>'
      }
    };
  }
});

T({
  id: 's2f-fricnet', topic: 203, sub: 'แรงเสียดทาน', level: 'ปานกลาง',
  skills: ['หาแรงลัพธ์เมื่อมีแรงเสียดทาน', 'หาความเร่งจากแรงลัพธ์'],
  gen(R) {
    const m = R.pick([2, 4, 5, 10, 20]);
    const mu = R.pick([0.2, 0.25, 0.4, 0.5]);
    const f = r2(mu * m * 10);
    const a = R.pick([0.5, 1, 1.5, 2, 2.5, 3]);
    const F = r2(f + m * a);
    if (!ok2(F, f)) return null;
    return {
      stem: 'ลากกล่องมวล ' + U(m, 'kg') + ' บนพื้นราบด้วยแรง ' + U(F, 'N') +
        ' โดยมีสัมประสิทธิ์ความเสียดทาน ' + U(mu) + '<br>' +
        'จงหา<b>ความเร่ง</b>ของกล่อง (ใช้ ' + M('g = 10 `N/kg`') + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของกล่อง' },
              { s: 'F', v: F, unit: 'N', d: 'แรงที่ลาก' },
              { s: 'μ', v: mu, d: 'สัมประสิทธิ์ความเสียดทาน' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่งของกล่อง', value: a, positive: true }],
      figure: figWorkPull({ F: 'F = ' + fmtq(F) + ' N', label: fmtq(m) + ' kg' }),
      sol: {
        analyze: 'แรงที่ลากไม่ได้ทำให้เกิดความเร่งทั้งหมด เพราะต้อง<b>เอาชนะแรงเสียดทาน</b>ก่อน<br>' +
          'สามขั้น: หาแรงเสียดทาน → หาแรงลัพธ์ → หาความเร่ง<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> เอา ' + M('a = frac(F,m)') + ' ตรง ๆ โดยลืมหักแรงเสียดทาน ' +
          'ทำให้ความเร่งออกมามากเกินจริง',
        eqs: [{ eq: 'f = μmg', why: 'แรงเสียดทานบนพื้นราบ' },
              { eq: 'F_{ลัพธ์} = F - f', why: 'แรงเสียดทานมีทิศตรงข้ามกับการเคลื่อนที่ จึงหักออก' },
              { eq: 'a = frac(F_{ลัพธ์},m)', why: 'กฎข้อที่สองของนิวตัน — ความเร่งเกิดจากแรงลัพธ์เท่านั้น' }],
        solve: SEQ('f = {mu} × {m} × 10 = {f} `N`', { mu: mu, m: m, f: f }) +
               SEQ('F_{ลัพธ์} = {F} - {f} = {n} `N`', { F: F, f: f, n: r2(F - f) }),
        subst: SEQ('a = frac({n},{m})', { n: r2(F - f), m: m }),
        calc: EQ('a = ' + fmtq(a) + ' `m/s^2`'),
        conclude: 'ดังนั้น <b>กล่องเคลื่อนที่ด้วยความเร่ง ' + M(fmtq(a) + ' `m/s^2`') + '</b><br>' +
          '<span class="hint">ถ้าลดแรงลากลงเหลือ ' + fmtq(f) + ' N พอดี แรงลัพธ์จะเป็นศูนย์ ' +
          'กล่องจะเคลื่อนที่ด้วย<b>ความเร็วคงที่</b> ไม่เร่งขึ้นและไม่ช้าลง</span>'
      }
    };
  }
});

T({
  id: 's2f-lever3', topic: 203, sub: 'คานและโมเมนต์', level: 'ยาก',
  skills: ['สมดุลโมเมนต์เมื่อมีหลายแรง', 'จัดการโมเมนต์สองฝั่ง'],

    const L3 = R.pick([0.4, 0.5, 0.8, 1, 1.2]);
    const F3 = r2((F1 * L1 + F2 * L2) / L3);
    if (!ok2(F3) || F3 < 5 || F3 > 400) return null;
    return {
      stem: 'คานอันหนึ่งวางบนจุดหมุน มีแรงกดลง<b>ทางซ้าย</b>สองแรงคือ ' + U(F1, 'N') + ' ที่ระยะ ' +
        U(L1, 'm') + ' และ ' + U(F2, 'N') + ' ที่ระยะ ' + U(L2, 'm') + '<br>' +
        'ต้องออกแรงกดลง<b>ทางขวา</b>ที่ระยะ ' + U(L3, 'm') + ' เท่าใด คานจึงสมดุล',
      given: [{ s: 'F_1', v: F1, unit: 'N', d: 'แรงซ้ายตัวที่หนึ่ง' },
              { s: 'L_1', v: L1, unit: 'm', d: '' },
              { s: 'F_2', v: F2, unit: 'N', d: 'แรงซ้ายตัวที่สอง' },
              { s: 'L_2', v: L2, unit: 'm', d: '' },
              { s: 'L_3', v: L3, unit: 'm', d: 'ระยะของแรงทางขวา' }],
      finds: [{ s: 'F_3', unit: 'N', d: 'แรงทางขวาที่ทำให้สมดุล', value: F3, positive: true }],
      figure: figBeam({ supports: [{ x: 0.55, label: 'จุดหมุน' }],
        loads: [{ x: 0.1, label: fmtq(F1) + ' N' }, { x: 0.34, label: fmtq(F2) + ' N' },
                { x: 0.88, label: 'F₃ = ?' }] }),
      sol: {
        analyze: 'มีแรงทางซ้ายสองแรง ทั้งคู่พยายามหมุนคานไป<b>ทางเดียวกัน</b> ' +
          'จึงต้องเอาโมเมนต์ของทั้งสองมา<b>รวมกัน</b>ก่อน<br>' +
          'แล้วให้โมเมนต์ทางขวาเท่ากับผลรวมนั้น คานจึงสมดุล<br>' +
          '<b>กับดักของข้อนี้:</b> เอาแรงมารวมกันก่อน (' + F1 + ' + ' + F2 + ') แล้วคูณระยะเดียว ' +
          'ซึ่งผิดเพราะสองแรงอยู่คนละระยะจากจุดหมุน',
        eqs: [{ eq: 'โมเมนต์ทวนเข็มรวม = F_1L_1 + F_2L_2', why: 'รวมโมเมนต์ของทุกแรงที่หมุนไปทางเดียวกัน' },
              { eq: 'โมเมนต์ตามเข็ม = F_3L_3', why: 'แรงทางขวาหมุนไปอีกทาง' },
              { eq: 'F_3 = frac(F_1L_1 + F_2L_2,L_3)', why: 'ตั้งให้เท่ากันแล้วย้ายข้าง' }],
        solve: SEQ('โมเมนต์ซ้าย = ({F1} × {L1}) + ({F2} × {L2}) = {s} `N·m`',
                   { F1: F1, L1: L1, F2: F2, L2: L2, s: r2(F1 * L1 + F2 * L2) }),
        subst: SEQ('F_3 = frac({s},{L3})', { s: r2(F1 * L1 + F2 * L2), L3: L3 }),
        calc: EQ('F_3 = ' + fmtq(F3) + ' `N`'),
        conclude: 'ดังนั้น <b>ต้องออกแรง ' + M(fmtq(F3) + ' `N`') + ' คานจึงสมดุล</b><br>' +
          '<span class="hint">ตรวจย้อนกลับ: โมเมนต์ขวา = ' +
          M(fmtq(F3) + ' × ' + fmtq(L3) + ' = ' + fmtq(r2(F3 * L3))) + ' N·m ' +
          'เท่ากับโมเมนต์ซ้าย ' + fmtq(r2(F1 * L1 + F2 * L2)) + ' N·m ✓</span>'
      }
    };
  }
});

T({
  id: 's2f-floatpart', topic: 203, sub: 'แรงพยุง', level: 'ยาก',
  skills: ['หาสัดส่วนที่จมของวัตถุลอยน้ำ', 'ใช้เงื่อนไขสมดุลของวัตถุลอย'],
  gen(R) {
    const D = R.pick([0.4, 0.5, 0.6, 0.75, 0.8, 0.9]);
    const V = R.step(200, 1000, 100);
    const Vsub = r2(V * D);
    if (!ok2(Vsub)) return null;
    return {
      stem: 'ท่อนไม้ความหนาแน่น ' + U(D, 'g/cm³') + ' ปริมาตร ' + U(V, 'cm³') + ' ลอยนิ่งอยู่ในน้ำ ' +
        '(น้ำมีความหนาแน่น ' + U(1, 'g/cm³') + ')<br>' +
        'ส่วนที่<b>จมอยู่ใต้น้ำ</b>มีปริมาตรกี่ลูกบาศก์เซนติเมตร',
      given: [{ s: 'D_{ไม้}', v: D, unit: 'g/cm³', d: 'ความหนาแน่นของไม้' },
              { s: 'V', v: V, unit: 'cm³', d: 'ปริมาตรทั้งท่อน' },
              { s: 'D_{น้ำ}', v: 1, unit: 'g/cm³', d: '' }],
      finds: [{ s: 'V_{จม}', unit: 'cm³', d: 'ปริมาตรส่วนที่จมอยู่ใต้น้ำ', value: Vsub, positive: true }],
      figure: figFloat({ sink: D, label: 'ท่อนไม้' }),
      sol: {
        analyze: 'ท่อนไม้<b>ลอยนิ่ง</b> แปลว่าแรงลัพธ์เป็นศูนย์ ⇒ <b>แรงพยุง = น้ำหนักของไม้</b>พอดี<br>' +
          'แรงพยุงคิดจาก<b>เฉพาะส่วนที่จม</b> ส่วนน้ำหนักคิดจาก<b>ทั้งท่อน</b> — นี่คือหัวใจของข้อนี้<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> ใช้ปริมาตรทั้งท่อนในการคิดแรงพยุง ' +
          'ซึ่งจะได้ว่าไม้ต้องจมทั้งท่อนเสมอ ขัดกับที่เห็นในชีวิตจริง',
        eqs: [{ eq: 'ลอยนิ่ง ⇒ แรงพยุง = น้ำหนักของวัตถุ', why: 'แรงลัพธ์เป็นศูนย์เมื่อวัตถุอยู่นิ่ง' },
              { eq: 'D_{น้ำ} × V_{จม} × g = D_{ไม้} × V × g', why: 'เขียนทั้งสองฝั่งด้วยความหนาแน่นคูณปริมาตรคูณ g' },
              { eq: 'frac(V_{จม},V) = frac(D_{ไม้},D_{น้ำ})', why: 'ตัด g ทิ้ง ได้ว่าสัดส่วนที่จมเท่ากับอัตราส่วนความหนาแน่นพอดี' }],
        solve: EQ('frac(V_{จม},V) = frac(D_{ไม้},D_{น้ำ})', 'V_{จม} = frac(D_{ไม้},D_{น้ำ}) × V'),
        subst: SEQ('V_{จม} = frac({D},1) × {V}', { D: D, V: V }),
        calc: EQ('V_{จม} = ' + fmtq(Vsub) + ' `cm^3`'),
        conclude: 'ดังนั้น <b>ส่วนที่จมมีปริมาตร ' + M(fmtq(Vsub) + ' `cm^3`') + '</b> ' +
          'คิดเป็นร้อยละ ' + M(fmtq(r2(D * 100))) + ' ของทั้งท่อน<br>' +
          '<span class="hint">ผลนี้อธิบาย<b>ภูเขาน้ำแข็ง</b>ได้พอดี — น้ำแข็งมีความหนาแน่น 0.92 g/cm³ ' +
          'จึงจมอยู่ราวร้อยละ 92 โผล่พ้นน้ำเพียงร้อยละ 8 เท่านั้น</span>'
      }
    };
  }
});

T({
  id: 's2f-fricstop', topic: 203, sub: 'แรงเสียดทาน', level: 'ยาก',
  skills: ['หาความหน่วงจากแรงเสียดทาน', 'เชื่อมแรงกับการเปลี่ยนความเร็ว'],
  gen(R) {
    const m = R.pick([2, 4, 5, 10]);

              { eq: 'W_{ให้} = frac(W_{ได้} × 100,ประสิทธิภาพ)', why: 'ต้องใส่มากกว่าที่ได้ เพราะบางส่วนสูญเสียไป' },

      sol: {
        analyze: 'ถ้าไม่มีความเสียดทาน พลังงานศักย์ทั้งหมดต้องเปลี่ยนเป็นพลังงานจลน์พอดี<br>' +

          'พลังงานไม่หาย แค่<b>เปลี่ยนรูป</b>เป็นความร้อนที่วัดไม่เห็น',
        eqs: [{ eq: 'E_p = mgh', why: 'พลังงานตอนอยู่บนยอดสไลเดอร์' },
              { eq: 'E_k = frac(1,2)mv^2', why: 'พลังงานตอนถึงพื้น' },
              { eq: 'E_{สูญเสีย} = E_p - E_k', why: 'ส่วนที่หายไปกลายเป็นความร้อนจากความเสียดทาน' }],
        solve: SEQ('E_p = {m} × 10 × {h} = {Ep} `J`', { m: m, h: h, Ep: Ep }) +

        subst: EQ('E_{สูญเสีย} = ' + fmtq(Ep) + ' - ' + fmtq(Ek)),
        calc: EQ('= ' + fmtq(loss) + ' `J`'),
        conclude: 'ดังนั้น <b>มีพลังงานสูญเสียไป ' + M(fmtq(loss) + ' `J`') + '</b> ' +
          'คิดเป็นร้อยละ ' + M(fmtq(r2(loss * 100 / Ep))) + ' ของพลังงานตั้งต้น<br>' +
          '<span class="hint">ถ้าสไลเดอร์ลื่นสนิทไม่มีความเสียดทาน ความเร็วเมื่อถึงพื้นจะเป็น ' +
          M('sqrt(2 × 10 × ' + fmtq(h) + ') = ' + fmtq(r2(Math.sqrt(20 * h))) + ' `m/s`') +
          ' ซึ่งเร็วกว่าที่วัดได้จริง</span>'
      }
    };
  }
});

T({
  id: 's2e-age', topic: 205, sub: 'การลำดับชั้นหิน', level: 'ง่าย',
  skills: ['คำนวณอายุชั้นหินจากอัตราการทับถม'],
  gen(R) {
    const rate = R.pick([0.2, 0.5, 1, 2, 4, 5]);   // มิลลิเมตรต่อปี
    const yrs = R.step(200, 5000, 100);
    const mm = r2(rate * yrs);
    const cm = r2(mm / 10);
    if (!ok2(cm) || cm > 5000) return null;
    return {
      stem: 'ตะกอนในทะเลสาบแห่งหนึ่งทับถมด้วยอัตรา ' + U(rate, 'mm') + ' ต่อปี<br>' +
        'ถ้าพบชั้นตะกอนหนา ' + U(cm, 'cm') + ' ชั้นนี้ใช้เวลาทับถมกี่<b>ปี</b> (1 cm = 10 mm)',
      given: [{ s: 'อัตราการทับถม', v: rate, unit: 'mm/ปี', d: '' },
              { s: 'ความหนาของชั้นตะกอน', v: cm, unit: 'cm', d: '' }],
      finds: [{ s: 'เวลาที่ใช้ทับถม', unit: 'ปี', d: 'ความหนาทั้งหมดหารด้วยอัตราการทับถมต่อปี', value: yrs, positive: true, kind: 'int' }],
      distract: [r2(cm / rate), r2(cm * rate), r2(yrs / 10), r2(yrs * 10)],
      sol: {
        analyze: 'อัตราการทับถมบอกว่า "หนึ่งปีได้ตะกอนหนากี่มิลลิเมตร"<br>' +
          'ต้องแปลงหน่วยให้ตรงกันก่อน เพราะโจทย์ให้ความหนาเป็นเซนติเมตร แต่อัตราเป็นมิลลิเมตร<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมแปลงหน่วย แล้วหาร ' + fmtq(cm) + ' ด้วย ' + fmtq(rate) +
          ' ตรง ๆ ซึ่งได้คำตอบน้อยไป 10 เท่า',
        eqs: [{ eq: '`1 cm = 10 mm`', why: 'ทำหน่วยให้ตรงกันก่อนคำนวณเสมอ' },
              { eq: 'เวลา = frac(ความหนา,อัตราการทับถม)', why: 'ความหนาหารด้วยอัตราต่อปี ได้จำนวนปี' }],
        solve: EQ('ความหนา = ' + fmtq(cm) + ' × 10 = ' + fmtq(mm) + ' `mm`'),
        subst: SEQ('เวลา = frac({mm},{r})', { mm: mm, r: rate }),
        calc: EQ('= ' + fmtq(yrs) + ' ปี'),
        conclude: 'ดังนั้น <b>ชั้นตะกอนนี้ใช้เวลาทับถม ' + M(fmtq(yrs) + ' ปี') + '</b><br>' +
          '<span class="hint">นี่คือวิธีที่นักธรณีวิทยาใช้ประมาณอายุของชั้นหิน ' +
          'แต่ต้องระวังว่าอัตราการทับถมในอดีตอาจไม่คงที่เท่าปัจจุบัน</span>'
      }
    };
  }
});

        eqs: [{ eq: 'ความหนารวม = ผลบวกของทุกชั้น', why: 'ทับถมต่อเนื่องกันจากล่างขึ้นบน' },
              { eq: 'เวลา = frac(ความหนารวม (mm),อัตราการทับถม)', why: 'ความหนาหารอัตราได้จำนวนปี' }],
        solve: EQ('ความหนารวม = ' + a + ' + ' + b + ' + ' + c + ' = ' + total + ' `cm`',

          'ส่วนชั้นที่ 3 บนสุด<b>ใหม่ที่สุด</b> ตามหลักการวางซ้อนชั้น</span>'

T({

      stem: 'ชั้นตะกอนหนา ' + U(cm, 'cm') + ' ตรวจอายุแล้วพบว่าใช้เวลาทับถมนาน ' + U(yrs, 'ปี') + '<br>' +

      given: [{ s: 'ความหนาของชั้นตะกอน', v: cm, unit: 'cm', d: '' },
              { s: 'เวลาที่ใช้ทับถม', v: yrs, unit: 'ปี', d: 'จากการตรวจอายุ' }],
      finds: [{ s: 'อัตราการทับถม', unit: 'mm/ปี', d: 'ย้อนจากความหนาและอายุที่โจทย์ให้', value: rate, positive: true }],
      sol: {
        analyze: 'ข้อนี้ทำงาน<b>ย้อนทาง</b> — รู้ทั้งความหนาและเวลาแล้ว ต้องหาอัตรา<br>' +
          'แปลงหน่วยความหนาให้เป็นมิลลิเมตรก่อน แล้วหารด้วยจำนวนปี<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมแปลงหน่วย ทำให้อัตราออกมาน้อยไป 10 เท่า',
        eqs: [{ eq: '`1 cm = 10 mm`', why: 'ทำหน่วยให้ตรงกับที่โจทย์ถามก่อน' },
              { eq: 'อัตรา = frac(ความหนา (mm),เวลา (ปี))', why: 'ความหนาต่อหนึ่งปี' }],
        solve: EQ('ความหนา = ' + fmtq(cm) + ' × 10 = ' + fmtq(mm) + ' `mm`'),

        calc: EQ('= ' + fmtq(rate) + ' `mm/ปี`'),

          '<span class="hint">อัตราการทับถมในธรรมชาติต่างกันมาก — ' +
          'ทะเลลึกอาจไม่ถึง 0.01 มิลลิเมตรต่อปี ส่วนปากแม่น้ำอาจถึงหลายเซนติเมตรต่อปี</span>'
      }

T({

      given: [{ s: 'มวลหินตัวอย่าง', v: total, unit: 'g', d: '' },

              { s: 'ร้อยละของเฟลด์สปาร์', v: p2, unit: '%', d: '' }],
      finds: [{ s: 'มวลแร่อื่น ๆ', unit: 'g', d: 'ส่วนที่เหลือทั้งหมด', value: rest, positive: true }],
      sol: {
        analyze: 'องค์ประกอบทั้งหมดรวมกันต้องได้ร้อยละ 100 พอดี<br>' +
          'ทางลัดคือหา<b>ร้อยละที่เหลือ</b>ก่อน แล้วค่อยแปลงเป็นมวลทีเดียว ' +
          'เร็วกว่าการหามวลของแต่ละแร่แล้วเอาไปลบ<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมว่าต้องหักออกทั้งสองแร่ หักออกแค่ตัวเดียวแล้วตอบ',
        eqs: [{ eq: 'ร้อยละที่เหลือ = 100 - (ร้อยละของทุกแร่ที่ทราบ)', why: 'องค์ประกอบทั้งหมดรวมกันได้ 100%' },
              { eq: 'มวล = frac(ร้อยละ,100) × มวลทั้งหมด', why: 'แปลงร้อยละกลับเป็นมวลจริง' }],
        solve: EQ('ร้อยละที่เหลือ = 100 - ' + p1 + ' - ' + p2 + ' = ' + (100 - p1 - p2) + ' `%`'),
        subst: SEQ('มวล = frac({p},100) × {t}', { p: 100 - p1 - p2, t: total }),
        calc: EQ('= ' + fmtq(rest) + ' `g`'),

          '<span class="hint">ตรวจอีกทาง: ควอตซ์ ' + fmtq(r2(total * p1 / 100)) + ' g + เฟลด์สปาร์ ' +
          fmtq(r2(total * p2 / 100)) + ' g + แร่อื่น ' + fmtq(rest) + ' g = ' + fmtq(total) + ' g ✓</span>'

T({
  id: 's2e-multilayer', topic: 205, sub: 'การลำดับชั้นหิน', level: 'ยาก',
  skills: ['คิดอายุชั้นหินที่มีอัตราการทับถมต่างกัน', 'รวมเวลาหลายช่วง'],
  gen(R) {
    const r1 = R.pick([0.5, 1, 2]), r2v = R.pick([4, 5, 10]);
    if (r1 >= r2v) return null;
    const c1 = R.step(20, 80, 10), c2 = R.step(20, 80, 10);
    const y1 = r2(c1 * 10 / r1), y2 = r2(c2 * 10 / r2v);
    const total = r2(y1 + y2);
    if (!ok2(y1, y2, total)) return null;
    return {
      stem: 'หน้าผาแห่งหนึ่งมีชั้นตะกอนสองชั้น<br>' +
        'ชั้นล่างหนา ' + U(c1, 'cm') + ' ทับถมด้วยอัตรา ' + U(r1, 'mm/ปี') + '<br>' +
        'ชั้นบนหนา ' + U(c2, 'cm') + ' ทับถมด้วยอัตรา ' + U(r2v, 'mm/ปี') + '<br>' +
        'ชั้นตะกอนทั้งสองใช้เวลาทับถมรวมกี่<b>ปี</b>',
      given: [{ s: 'ชั้นล่าง', v: c1, unit: 'cm', d: 'อัตรา ' + fmtq(r1) + ' mm/ปี' },
              { s: 'ชั้นบน', v: c2, unit: 'cm', d: 'อัตรา ' + fmtq(r2v) + ' mm/ปี' }],
      finds: [{ s: 'เวลารวม', unit: 'ปี', d: 'ที่ใช้ทับถมทั้งสองชั้น', value: total, positive: true }],
      figure: figLayers({ title: 'ชั้นตะกอน (บนลงล่าง)', layers: [
        { name: 'ชั้นบน', note: fmtq(c2) + ' cm · ' + fmtq(r2v) + ' mm/ปี' },
        { name: 'ชั้นล่าง', note: fmtq(c1) + ' cm · ' + fmtq(r1) + ' mm/ปี' }] }),
      sol: {
        analyze: 'อัตราการทับถมของสองชั้น<b>ไม่เท่ากัน</b> จึงรวมความหนาแล้วหารทีเดียวไม่ได้<br>' +
          'ต้องคิดเวลาแยกทีละชั้นตามอัตราของชั้นนั้น แล้วค่อยเอามารวมกัน<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> เอาอัตราสองค่ามาเฉลี่ยแล้วใช้ค่าเดียว ' +
          'ซึ่งจะถูกก็ต่อเมื่อสองชั้นหนาเท่ากันพอดี และถึงอย่างนั้นก็ยังไม่ตรงเป๊ะ',
        eqs: [{ eq: 'เวลาของแต่ละชั้น = frac(ความหนา (mm),อัตราของชั้นนั้น)', why: 'ใช้อัตราที่ตรงกับชั้นนั้นเท่านั้น' },
              { eq: 'เวลารวม = เวลาชั้นล่าง + เวลาชั้นบน', why: 'ทับถมต่อเนื่องกัน เวลาจึงบวกกัน' }],
        solve: SEQ('เวลาชั้นล่าง = frac({m1},{r1}) = {y1} ปี', { m1: c1 * 10, r1: r1, y1: y1 }) +
               SEQ('เวลาชั้นบน = frac({m2},{r2}) = {y2} ปี', { m2: c2 * 10, r2: r2v, y2: y2 }),
        subst: EQ('เวลารวม = ' + fmtq(y1) + ' + ' + fmtq(y2)),
        calc: EQ('= ' + fmtq(total) + ' ปี'),
        conclude: 'ดังนั้น <b>ใช้เวลาทับถมรวม ' + M(fmtq(total) + ' ปี') + '</b><br>' +
          '<span class="hint">สังเกตว่าชั้นล่างใช้เวลานานกว่ามาก (' + fmtq(y1) + ' ปี เทียบกับ ' +
          fmtq(y2) + ' ปี) ทั้งที่หนาไม่ต่างกันนัก<br>' +
          '<b>ความหนาของชั้นหินจึงไม่ได้บอกอายุโดยตรง</b> ต้องรู้อัตราการทับถมด้วยเสมอ</span>'
      }
    };
  }
});

                why: 'ทำตามลำดับการดำเนินการจะไม่พลาด' }],
        solve: EQ('s = ut + frac(1,2)at^2'),

T({

              { s: 'ช่วงคงที่', v: t2, unit: 'วินาที', d: '' },

      figure: figXY({ xlab: 'เวลา (s)', ylab: 'v (m/s)', xmax: T, ymax: v + 4,
        xstep: T, ystep: 4, dots: false, area: true,
        pts: [[0, 0], [t1, v], [t1 + t2, v], [T, 0]] }),
      sol: {
        analyze: 'ความเร็วเฉลี่ย<b>ไม่ใช่</b>ค่าเฉลี่ยของความเร็วในแต่ละช่วง ' +
          'แต่คือ<b>ระยะทางรวมหารด้วยเวลารวม</b><br>' +
          'จึงต้องหาพื้นที่ใต้กราฟทั้งสามช่วงก่อน แล้วหารด้วยเวลาทั้งหมด<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> เอา ' + fmtq(v) + ' หารสอง แล้วตอบเลย ' +
          'ซึ่งจะถูกเฉพาะกรณีที่ไม่มีช่วงความเร็วคงที่คั่นอยู่',
        eqs: [{ eq: 'ระยะทาง = พื้นที่ใต้กราฟ v–t', why: 'ใช้ได้ทุกรูปแบบของกราฟ' },
              { eq: 'พื้นที่รวม = สามเหลี่ยม + สี่เหลี่ยม + สามเหลี่ยม', why: 'แบ่งรูปเป็นส่วนที่คำนวณง่าย' },
              { eq: 'v_{เฉลี่ย} = frac(ระยะทางรวม,เวลารวม)', why: 'นิยามของความเร็วเฉลี่ย' }],
        solve: EQ('ช่วงที่ 1 = frac(1,2) × ' + t1 + ' × ' + v + ' = ' + fmtq(r2(0.5 * v * t1)) + ' `m`',
                  'ช่วงที่ 2 = ' + v + ' × ' + t2 + ' = ' + fmtq(r2(v * t2)) + ' `m`',
                  'ช่วงที่ 3 = frac(1,2) × ' + t3 + ' × ' + v + ' = ' + fmtq(r2(0.5 * v * t3)) + ' `m`'),
        subst: SEQ('ระยะทางรวม = {s} `m`  ·  เวลารวม = {T} `s`', { s: s, T: T }),
        calc: EQ('v_{เฉลี่ย} = frac(' + fmtq(s) + ',' + T + ') = ' + fmtq(avg) + ' `m/s`'),

  }

T({

      sol: {
        analyze: 'วงจรผสมต้อง<b>ยุบทีละส่วน</b> โดยเริ่มจากส่วนที่อยู่ในสุดก่อน<br>' +

          'ทั้งที่ต่อกันคนละแบบ',
        eqs: [{ eq: 'ส่วนขนาน: R_p = frac(R_1R_2,R_1 + R_2)', why: 'ยุบสองตัวที่ขนานกันให้เหลือค่าเดียว' },
              { eq: 'ส่วนอนุกรม: R_{รวม} = R_p + R_3', why: 'ค่าที่ยุบแล้วต่ออนุกรมกับตัวที่เหลือ' },
              { eq: 'I = frac(V,R_{รวม})', why: 'กฎของโอห์มกับวงจรทั้งหมด' }],
        solve: SEQ('R_p = frac({a} × {b},{a} + {b}) = {rp} `Ω`', { a: pair[0], b: pair[1], rp: rp }) +
               SEQ('R_{รวม} = {rp} + {rs} = {t} `Ω`', { rp: rp, rs: rs, t: tot }),
        subst: SEQ('I = frac({V},{t})', { V: V, t: tot }),

          M(fmtq(I) + ' × ' + fmtq(rp) + ' = ' + fmtq(r2(I * rp)) + ' `V`') +
          ' ซึ่งเท่ากันทั้งสองสาขา นำไปหากระแสของแต่ละสาขาต่อได้</span>'
      }
    };
  }
});

T({
  id: 's3e-billmany', topic: 302, sub: 'ค่าไฟฟ้า', level: 'ยาก',
  skills: ['รวมค่าไฟจากเครื่องใช้หลายชิ้น', 'จัดการหลายอัตราการใช้งาน'],
  gen(R) {
    const items = [
      { n: 'หลอดไฟ', P: R.pick([20, 40, 60]), h: R.pick([5, 6, 8]) },
      { n: 'พัดลม', P: R.pick([50, 60, 75]), h: R.pick([6, 8, 10]) },
      { n: 'ตู้เย็น', P: R.pick([100, 150, 200]), h: 24 }
    ];
    const days = 30;
    const price = R.pick([4, 5]);
    const kwh = r2(items.reduce((s, x) => s + x.P * x.h, 0) * days / 1000);
    const cost = r2(kwh * price);
    if (!ok2(kwh, cost)) return null;
    return {
      stem: 'บ้านหลังหนึ่งใช้เครื่องใช้ไฟฟ้าดังนี้ทุกวันเป็นเวลา 30 วัน<br>' +
        items.map(x => '• ' + esc(x.n) + ' ' + fmtq(x.P) + ' W วันละ ' + fmtq(x.h) + ' ชั่วโมง').join('<br>') +
        '<br>ถ้าค่าไฟหน่วยละ ' + U(price, 'บาท') + ' จะเสียค่าไฟเดือนละกี่<b>บาท</b>',
      given: items.map(x => ({ s: x.n, v: x.P, unit: 'W', d: 'วันละ ' + fmtq(x.h) + ' ชั่วโมง' }))
        .concat([{ s: 'ราคาต่อหน่วย', v: price, unit: 'บาท', d: '' }]),
      finds: [{ s: 'ค่าไฟต่อเดือน', unit: 'บาท', d: 'รวมทุกเครื่อง', value: cost, positive: true }],
      sol: {
        analyze: 'เครื่องแต่ละชิ้นใช้เวลาต่างกัน จึงต้อง<b>คิดแยกทีละเครื่อง</b>แล้วค่อยรวม<br>' +
          'ทางที่เร็วกว่าคือรวม ' + M('P × ชั่วโมง') + ' ของทุกเครื่องก่อน แล้วค่อยคูณจำนวนวันและหาร 1,000 ทีเดียว<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> เอากำลังของทุกเครื่องมาบวกกันแล้วคูณชั่วโมงเดียว ' +
          'ทั้งที่แต่ละเครื่องเปิดไม่เท่ากัน · และตู้เย็นทำงาน 24 ชั่วโมง ไม่ใช่เท่ากับเครื่องอื่น',
        eqs: [{ eq: 'พลังงานของแต่ละเครื่อง (Wh) = P × ชั่วโมงต่อวัน', why: 'คิดต่อวันของเครื่องนั้น ๆ' },
              { eq: 'หน่วยต่อเดือน = frac(ผลรวม × จำนวนวัน,1000)', why: 'รวมทุกเครื่อง คูณจำนวนวัน แล้วแปลงเป็นกิโลวัตต์-ชั่วโมง' },
              { eq: 'ค่าไฟ = หน่วย × ราคาต่อหน่วย', why: 'คิดเงินตามจำนวนหน่วย' }],
        solve: EQ(items.map(x => esc(x.n) + ' = ' + x.P + ' × ' + x.h + ' = ' + fmtq(x.P * x.h) + ' `Wh/วัน`')
          .concat(['รวมต่อวัน = ' + fmtq(items.reduce((s, x) => s + x.P * x.h, 0)) + ' `Wh`'])),
        subst: SEQ('หน่วยต่อเดือน = frac({d} × 30,1000) = {k} หน่วย',
                   { d: items.reduce((s, x) => s + x.P * x.h, 0), k: kwh }),
        calc: EQ('ค่าไฟ = ' + fmtq(kwh) + ' × ' + fmtq(price) + ' = ' + fmtq(cost) + ' บาท'),
        conclude: 'ดังนั้น <b>เสียค่าไฟเดือนละ ' + M(fmtq(cost) + ' บาท') + '</b><br>' +
          '<span class="hint">สังเกตว่า<b>ตู้เย็น</b>กินไฟมากที่สุดถึง ' +
          fmtq(r2(items[2].P * 24 * 30 / 1000)) + ' หน่วย ทั้งที่กำลังไม่สูงนัก ' +
          'เพราะทำงานตลอด 24 ชั่วโมง<br>การประหยัดไฟจึงต้องดูทั้ง<b>กำลัง</b>และ<b>ชั่วโมงที่ใช้</b></span>'
      }
    };
  }
});

T({
  id: 's3e-branch', topic: 302, sub: 'วงจรผสม', level: 'ยาก',
  skills: ['หากระแสในแต่ละสาขาของวงจรขนาน', 'ใช้ความต่างศักย์ที่เท่ากันของสาขาขนาน'],
  gen(R) {
    const V = R.pick([6, 12, 18, 24]);
    const a = R.pick([3, 4, 6, 8, 12]);
    const b = R.pick([3, 4, 6, 8, 12, 24]);
    if (a === b) return null;
    const ia = r2(V / a), ib = r2(V / b);
    const tot = r2(ia + ib);
    if (!ok2(ia, ib, tot)) return null;
    return {
      stem: 'ตัวต้านทาน ' + U(a, 'Ω') + ' และ ' + U(b, 'Ω') + ' ต่อ<b>ขนาน</b>กันโดยตรงกับแบตเตอรี่ ' +
        U(V, 'V') + '<br>' +
        'จงหา<b>กระแสรวม</b>ที่ไหลออกจากแบตเตอรี่ (แอมแปร์)',
      given: [{ s: 'V', v: V, unit: 'V', d: 'ความต่างศักย์ของแบตเตอรี่' },
              { s: 'R_1', v: a, unit: 'Ω', d: 'สาขาที่หนึ่ง' },
              { s: 'R_2', v: b, unit: 'Ω', d: 'สาขาที่สอง' }],
      finds: [{ s: 'I_{รวม}', unit: 'A', d: 'กระแสรวมที่ออกจากแบตเตอรี่', value: tot, positive: true }],
      figure: figCircuit({ kind: 'parallel', emf: fmtq(V) + ' V', rs: [fmtq(a) + ' Ω', fmtq(b) + ' Ω'] }),
      sol: {
        analyze: 'กุญแจของวงจรขนานคือ <b>ทุกสาขาได้ความต่างศักย์เท่ากัน</b> คือ ' + fmtq(V) + ' V<br>' +
          'จึงหากระแสของแต่ละสาขาแยกกันได้ทันที แล้วบวกรวม<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> คิดว่าความต่างศักย์ต้องแบ่งกันระหว่างสองสาขา ' +
          'ซึ่งเป็นลักษณะของวงจร<b>อนุกรม</b> ไม่ใช่ขนาน',
        eqs: [{ eq: 'วงจรขนาน: V เท่ากันทุกสาขา', why: 'ทุกสาขาต่อคร่อมจุดเดียวกัน' },
              { eq: 'I_1 = frac(V,R_1)  ·  I_2 = frac(V,R_2)', why: 'ใช้กฎของโอห์มกับแต่ละสาขา' },
              { eq: 'I_{รวม} = I_1 + I_2', why: 'กระแสจากแบตเตอรี่แยกไหลไปตามสาขา แล้วมารวมกันอีกครั้ง' }],
        solve: SEQ('I_1 = frac({V},{a}) = {ia} `A`', { V: V, a: a, ia: ia }) +
               SEQ('I_2 = frac({V},{b}) = {ib} `A`', { V: V, b: b, ib: ib }),
        subst: EQ('I_{รวม} = ' + fmtq(ia) + ' + ' + fmtq(ib)),
        calc: EQ('I_{รวม} = ' + fmtq(tot) + ' `A`'),
        conclude: 'ดังนั้น <b>กระแสรวมเท่ากับ ' + M(fmtq(tot) + ' `A`') + '</b><br>' +
          '<span class="hint">ตรวจอีกทาง: ' +
          M('R_{รวม} = frac(' + a + ' × ' + b + ',' + a + ' + ' + b + ') = ' + fmtq(r2(a * b / (a + b))) + ' `Ω`') +
          ' แล้ว ' + M('I = frac(' + fmtq(V) + ',' + fmtq(r2(a * b / (a + b))) + ') = ' + fmtq(tot) + ' `A`') + ' ✓<br>' +
          'สังเกตว่าสาขาที่ความต้านทาน<b>น้อยกว่า</b>ได้กระแส<b>มากกว่า</b></span>'
      }
    };
  }
});

T({
  id: 's3c-mass', topic: 303, sub: 'กฎทรงมวล', level: 'ง่าย',
  skills: ['ใช้กฎทรงมวลหามวลที่ขาดหายไป'],
  gen(R) {
    const a = R.step(10, 90, 5), b = R.step(10, 90, 5);
    const c = R.step(10, Math.min(a + b - 5, 120), 5);
    const d = a + b - c;
    if (d <= 0) return null;
    return {
      stem: 'สาร ก มวล ' + U(a, 'g') + ' ทำปฏิกิริยาพอดีกับสาร ข มวล ' + U(b, 'g') + '<br>' +
        'ได้ผลิตภัณฑ์เป็นสาร ค มวล ' + U(c, 'g') + ' และสาร ง<br>' +
        'สาร ง มีมวลกี่<b>กรัม</b>',
      given: [{ s: 'มวลสาร ก', v: a, unit: 'g', d: 'สารตั้งต้น' },
              { s: 'มวลสาร ข', v: b, unit: 'g', d: 'สารตั้งต้น' },
              { s: 'มวลสาร ค', v: c, unit: 'g', d: 'ผลิตภัณฑ์' }],
      finds: [{ s: 'มวลสาร ง', unit: 'g', d: 'ผลิตภัณฑ์อีกตัวหนึ่ง', value: d, positive: true, kind: 'int' }],
      distract: [a + b + c, r2(c - a), r2(a + b), r2(Math.abs(a - b))],
      sol: {
        analyze: 'ปฏิกิริยาเคมีเป็นเพียงการ<b>จัดเรียงอะตอมใหม่</b> ไม่มีอะตอมเกิดใหม่หรือหายไป<br>' +
          'มวลรวมสองฝั่งจึงเท่ากันเสมอ<br>' +
          '<b>กับดักของข้อนี้:</b> เอามวลทั้งสามมาบวกกัน ทั้งที่สาร ค อยู่คนละฝั่งกับสาร ก และ ข',
        eqs: [{ eq: 'มวลสารตั้งต้นรวม = มวลผลิตภัณฑ์รวม', why: 'กฎทรงมวล' },
              { eq: 'มวลสาร ง = (ก + ข) - ค', why: 'ย้ายข้างให้ตัวที่ยังไม่รู้อยู่โดด ๆ' }],
        solve: EQ('ก + ข = ค + ง', 'ง = (ก + ข) - ค'),
        subst: SEQ('ง = ({a} + {b}) - {c}', { a: a, b: b, c: c }),
        calc: EQ('ง = ' + (a + b) + ' - ' + c + ' = ' + d + ' `g`'),
        conclude: 'ดังนั้น <b>สาร ง มีมวล ' + M(d + ' `g`') + '</b><br>' +
          '<span class="hint">ตรวจย้อนกลับ: ' + M(c + ' + ' + d + ' = ' + (c + d)) + ' g ' +
          'เท่ากับ ' + M(a + ' + ' + b + ' = ' + (a + b)) + ' g ✓</span>'
      }
    };
  }
});

T({
  id: 's3c-rate', topic: 303, sub: 'อัตราการเกิดปฏิกิริยา', level: 'ง่าย',
  skills: ['คำนวณอัตราการเกิดแก๊ส'],
  gen(R) {
    const rate = R.pick([1.5, 2, 2.5, 4, 5, 8, 10]);
    const t = R.pick([4, 5, 6, 8, 10, 20]);
    const V = r2(rate * t);
    if (!ok2(V)) return null;
    return {
      stem: 'หย่อนหินปูนลงในกรด เก็บแก๊สที่เกิดขึ้นได้ ' + U(V, 'cm³') + ' ในเวลา ' +
        U(t, 'วินาที') + '<br>จงหา<b>อัตราการเกิดแก๊ส</b> (ลูกบาศก์เซนติเมตรต่อวินาที)',
      given: [{ s: 'ปริมาตรแก๊สที่เกิด', v: V, unit: 'cm³', d: 'แก๊สคาร์บอนไดออกไซด์' },
              { s: 'เวลา', v: t, unit: 'วินาที', d: '' }],
      finds: [{ s: 'อัตราการเกิดแก๊ส', unit: 'cm³/s', d: 'ปริมาตรแก๊สที่เกิดต่อหนึ่งวินาที', value: rate, positive: true }],
      distract: [r2(t / V), r2(V * t), V, r2(rate * 2)],
      sol: {
        analyze: 'อัตราการเกิดปฏิกิริยาวัดจาก "ปริมาณสารที่เปลี่ยนไป<b>ต่อหนึ่งหน่วยเวลา</b>"<br>' +
          'ข้อนี้วัดจากแก๊สที่เกิดขึ้น ซึ่งเป็นวิธีที่นิยมเพราะเก็บและวัดปริมาตรได้ง่าย<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบปริมาตรทั้งหมด (' + fmtq(V) + ' cm³) ทั้งที่โจทย์ถามต่อวินาที',
        eqs: [{ eq: 'อัตรา = frac(ปริมาณสารที่เปลี่ยนไป,เวลา)', why: 'นิยามของอัตราการเกิดปฏิกิริยา' }],
        solve: EQ('อัตรา = frac(ปริมาตรแก๊ส,เวลา)'),
        subst: SEQ('= frac({V},{t})', { V: V, t: t }),
        calc: EQ('= ' + fmtq(rate) + ' `cm^3/s`'),
        conclude: 'ดังนั้น <b>อัตราการเกิดแก๊สเท่ากับ ' + M(fmtq(rate) + ' `cm^3/s`') + '</b><br>' +
          '<span class="hint">ถ้าบดหินปูนให้ละเอียดขึ้น หรือใช้กรดเข้มข้นขึ้น อัตรานี้จะเพิ่ม ' +
          'เพราะอนุภาคชนกันบ่อยขึ้น</span>'
      }
    };
  }
});

T({
  id: 's3c-ph', topic: 303, sub: 'กรด-เบสและค่า pH', level: 'ง่าย',
  skills: ['เทียบค่า pH กับเกณฑ์', 'ระบุความเป็นกรด-เบส'],
  gen(R) {
    const list = [{ n: 'น้ำมะนาว', p: 2 }, { n: 'น้ำอัดลม', p: 3 }, { n: 'นมสด', p: 6 },
                  { n: 'น้ำบริสุทธิ์', p: 7 }, { n: 'น้ำสบู่', p: 10 }, { n: 'น้ำยาล้างจาน', p: 9 },
                  { n: 'น้ำปูนใส', p: 12 }];
    const two = R.some(list, 2);
    const diff = Math.abs(two[0].p - two[1].p);
    if (!diff) return null;
    return {
      stem: esc(two[0].n) + ' มี pH เท่ากับ ' + U(two[0].p) + ' และ ' + esc(two[1].n) +
        ' มี pH เท่ากับ ' + U(two[1].p) + '<br>' +
        'ค่า pH ของทั้งสองต่างกันเท่าใด',
      given: [{ s: 'pH ของ' + two[0].n, v: two[0].p, d: '' },
              { s: 'pH ของ' + two[1].n, v: two[1].p, d: '' }],
      finds: [{ s: 'ผลต่างของ pH', d: 'ความต่างของค่า pH', value: diff, positive: true, kind: 'int' }],
      distract: [two[0].p + two[1].p, r2(two[0].p * two[1].p), 7, r2(diff * 2)],

      sol: {

T({

        'มีแก๊สคาร์บอนไดออกไซด์เกิดขึ้นและลอยออกไปกี่<b>กรัม</b>',
      given: [{ s: 'มวลก่อนทำปฏิกิริยา', v: before, unit: 'g', d: 'ทั้งบีกเกอร์และสาร' },

      finds: [{ s: 'มวลแก๊สที่หายไป', unit: 'g', d: 'คาร์บอนไดออกไซด์ที่ลอยออกไป', value: lost, positive: true, kind: 'int' }],
      sol: {
        analyze: 'กฎทรงมวลยังเป็นจริงเสมอ — มวลไม่ได้หายไปไหน แต่<b>ออกจากระบบที่เราชั่ง</b><br>' +
          'ภาชนะเปิด แก๊สจึงลอยออกไปสู่บรรยากาศ เครื่องชั่งจึงอ่านค่าได้น้อยลง<br>' +
          '<b>กับดักของข้อนี้:</b> สรุปว่ากฎทรงมวลใช้ไม่ได้ · ที่ถูกคือ<b>ระบบไม่ปิด</b>ต่างหาก',
        eqs: [{ eq: 'มวลก่อน = มวลหลัง + มวลแก๊สที่ออกไป', why: 'กฎทรงมวล เมื่อนับสารที่ออกจากระบบด้วย' },
              { eq: 'มวลแก๊ส = มวลก่อน - มวลหลัง', why: 'ย้ายข้าง' }],
        solve: EQ('มวลแก๊ส = มวลก่อน - มวลหลัง'),
        subst: SEQ('= {b} - {a}', { b: before, a: after }),
        calc: EQ('= ' + lost + ' `g`'),
        conclude: 'ดังนั้น <b>มีแก๊สเกิดขึ้นและลอยออกไป ' + M(lost + ' `g`') + '</b><br>' +
          '<span class="hint">ถ้าทำการทดลองนี้ใน<b>ภาชนะปิด</b> มวลก่อนกับหลังจะ<b>เท่ากันเป๊ะ</b> ' +

T({
  id: 's3c-massmulti', topic: 303, sub: 'กฎทรงมวล', level: 'ยาก',
  skills: ['ใช้กฎทรงมวลกับสารหลายชนิด', 'จัดการสารตั้งต้นและผลิตภัณฑ์หลายตัว'],
  gen(R) {
    const a = R.step(20, 100, 5), b = R.step(20, 100, 5), c = R.step(10, 60, 5);
    const p1 = R.step(10, Math.max(15, a + b + c - 30), 5);
    const p2 = R.step(10, Math.max(15, a + b + c - p1 - 10), 5);
    const p3 = a + b + c - p1 - p2;
    if (p3 <= 0) return null;
    return {
      stem: 'ปฏิกิริยาหนึ่งมีสารตั้งต้นสามชนิด มวล ' + U(a, 'g') + ' · ' + U(b, 'g') + ' · ' +
        U(c, 'g') + '<br>' +
        'เกิดผลิตภัณฑ์สามชนิด โดยสองชนิดแรกมีมวล ' + U(p1, 'g') + ' และ ' + U(p2, 'g') + '<br>' +
        'ผลิตภัณฑ์ชนิดที่สามมีมวลกี่<b>กรัม</b> (ทำในระบบปิด)',
      given: [{ s: 'สารตั้งต้นที่ 1', v: a, unit: 'g', d: '' },
              { s: 'สารตั้งต้นที่ 2', v: b, unit: 'g', d: '' },
              { s: 'สารตั้งต้นที่ 3', v: c, unit: 'g', d: '' },
              { s: 'ผลิตภัณฑ์ที่ 1', v: p1, unit: 'g', d: '' },
              { s: 'ผลิตภัณฑ์ที่ 2', v: p2, unit: 'g', d: '' }],
      finds: [{ s: 'ผลิตภัณฑ์ที่ 3', unit: 'g', d: 'มวลที่เหลือตามกฎทรงมวล', value: p3, positive: true, kind: 'int' }],
      sol: {
        analyze: 'สารเยอะจนดูซับซ้อน แต่หลักการยังเหมือนเดิมทุกอย่าง — ' +
          '<b>รวมทุกอย่างฝั่งซ้าย ต้องเท่ากับรวมทุกอย่างฝั่งขวา</b><br>' +
          'เคล็ดลับคือแยกให้ชัดว่าตัวไหนเป็น<b>สารตั้งต้น</b> ตัวไหนเป็น<b>ผลิตภัณฑ์</b> ก่อนลงมือคำนวณ<br>' +
          '<b>กับดักของข้อนี้:</b> จับสารผิดฝั่ง หรือลืมนับสารตั้งต้นตัวใดตัวหนึ่ง ' +
          'ทางกันพลาดคือเขียนสมการแบบคำก่อน แล้วค่อยแทนตัวเลข',
        eqs: [{ eq: 'มวลสารตั้งต้นรวม = มวลผลิตภัณฑ์รวม', why: 'กฎทรงมวลในระบบปิด' },
              { eq: 'ผลิตภัณฑ์ที่ 3 = (สารตั้งต้นทั้งหมด) - (ผลิตภัณฑ์ที่รู้แล้ว)', why: 'ย้ายข้างให้ตัวที่ยังไม่รู้อยู่โดด ๆ' }],
        solve: EQ('สารตั้งต้นรวม = ' + a + ' + ' + b + ' + ' + c + ' = ' + (a + b + c) + ' `g`',
                  'ผลิตภัณฑ์ที่รู้แล้ว = ' + p1 + ' + ' + p2 + ' = ' + (p1 + p2) + ' `g`'),
        subst: EQ('ผลิตภัณฑ์ที่ 3 = ' + (a + b + c) + ' - ' + (p1 + p2)),
        calc: EQ('= ' + p3 + ' `g`'),
        conclude: 'ดังนั้น <b>ผลิตภัณฑ์ชนิดที่สามมีมวล ' + M(p3 + ' `g`') + '</b><br>' +
          '<span class="hint">ตรวจย้อนกลับ: ' + M(p1 + ' + ' + p2 + ' + ' + p3 + ' = ' + (p1 + p2 + p3)) +
          ' g เท่ากับ ' + M(a + ' + ' + b + ' + ' + c + ' = ' + (a + b + c)) + ' g ✓</span>'
      }
    };

T({
  id: 's3c-yieldback', topic: 303, sub: 'ร้อยละผลได้', level: 'ยาก',
  skills: ['ทำงานย้อนกลับจากร้อยละผลได้', 'ต่อกับอัตราส่วนมวลตามสมการ'],
  gen(R) {
    const ratio = R.pick([2, 2.5, 4, 5]);        // ผลิตภัณฑ์ต่อสารตั้งต้น
    const pct = R.pick([50, 60, 75, 80]);
    const ma = R.step(10, 60, 5);
    const theo = r2(ma * ratio);
    const real = r2(theo * pct / 100);
    if (!ok2(theo, real)) return null;
    return {
      stem: 'ปฏิกิริยาหนึ่ง สารตั้งต้น 1 กรัม ควรให้ผลิตภัณฑ์ ' + U(ratio, 'กรัม') + ' ตามทฤษฎี<br>' +
        'ถ้าใช้สารตั้งต้น ' + U(ma, 'g') + ' และปฏิกิริยานี้มีร้อยละผลได้ ' + U(pct) + '<br>' +
        'จะได้ผลิตภัณฑ์<b>จริง</b>กี่กรัม',
      given: [{ s: 'อัตราส่วนตามทฤษฎี', v: ratio, unit: 'g/g', d: 'ผลิตภัณฑ์ต่อสารตั้งต้น 1 กรัม' },
              { s: 'มวลสารตั้งต้น', v: ma, unit: 'g', d: 'ที่ใช้จริง' },
              { s: 'ร้อยละผลได้', v: pct, unit: '%', d: 'ของปฏิกิริยานี้' }],
      finds: [{ s: 'ผลได้จริง', unit: 'g', d: 'ผลิตภัณฑ์ที่ได้จริงจากการทดลอง', value: real, positive: true }],
      sol: {
        analyze: 'ข้อนี้ต่อกัน<b>สองขั้น</b> — หาผลได้ตามทฤษฎีก่อน แล้วค่อยหักด้วยร้อยละผลได้<br>' +
          'ลำดับนี้สำคัญ เพราะร้อยละผลได้ต้องคิดจาก<b>ผลได้ตามทฤษฎี</b> ไม่ใช่จากมวลสารตั้งต้น<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> เอาร้อยละไปคูณกับมวลสารตั้งต้น (' + ma +
          ' g) ก่อน แล้วค่อยคูณอัตราส่วน — ได้คำตอบเท่ากันบังเอิญ แต่วิธีคิดผิดหลัก ' +
          'และจะพลาดทันทีเมื่อโจทย์ซับซ้อนขึ้น',
        eqs: [{ eq: 'ผลได้ตามทฤษฎี = มวลสารตั้งต้น × อัตราส่วน', why: 'คำนวณจากสมการเคมีในอุดมคติ' },
              { eq: 'ผลได้จริง = frac(ร้อยละผลได้,100) × ผลได้ตามทฤษฎี', why: 'ในทางปฏิบัติได้ไม่ครบตามทฤษฎี' }],
        solve: SEQ('ผลได้ตามทฤษฎี = {ma} × {r} = {t} `g`', { ma: ma, r: ratio, t: theo }),
        subst: SEQ('ผลได้จริง = frac({p},100) × {t}', { p: pct, t: theo }),
        calc: EQ('= ' + fmtq(real) + ' `g`'),
        conclude: 'ดังนั้น <b>ได้ผลิตภัณฑ์จริง ' + M(fmtq(real) + ' `g`') + '</b><br>' +
          '<span class="hint">ส่วนที่หายไป ' + M(fmtq(r2(theo - real)) + ' `g`') +
          ' มาจากสารที่ไม่ทำปฏิกิริยา สูญเสียระหว่างการกรอง หรือติดค้างในภาชนะ<br>' +
          'ในโรงงานจึงต้องเผื่อสารตั้งต้นไว้มากกว่าที่คำนวณตามทฤษฎีเสมอ</span>'
      }
    };
  }
});

T({

      given: [{ s: 'จำนวนลูกทั้งหมด', v: n, unit: 'ตัว', d: '' },

          '<b>กับดักของข้อนี้:</b> ใช้อัตราส่วน 1 : 2 : 1 ซึ่งเป็นของ<b>จีโนไทป์</b> ' +

              { eq: 'จำนวนที่คาดหวัง = frac(ส่วนของลักษณะนั้น,4) × จำนวนลูกทั้งหมด',
                why: 'อัตราส่วน 3 : 1 รวมกันเป็น 4 ส่วน' }],
        solve: EQ('จำนวน = frac(' + want + ',4) × ' + n),
        subst: SEQ('= frac({w},4) × {n}', { w: want, n: n }),
        calc: EQ('= ' + ans + ' ตัว'),

T({

        'คาดว่าจะมีต้นที่แสดงลักษณะ<b>' + esc(which.n) + '</b>กี่ต้น',

      finds: [{ s: 'จำนวนต้นที่ต้องการ', unit: 'ต้น', d: 'ค่าที่คาดหวัง', value: ans, positive: true, kind: 'int' }],
      sol: {
        analyze: 'การผสมสองลักษณะที่ถ่ายทอด<b>อย่างอิสระ</b> ให้ฟีโนไทป์ 4 แบบ ' +
          'ในอัตราส่วน <b>9 : 3 : 3 : 1</b> รวมทั้งหมด 16 ส่วน<br>' +
          'ที่มาของ 16 คือแต่ละลักษณะให้ 4 ช่อง สองลักษณะจึงได้ ' + M('4 × 4 = 16') + ' ช่อง<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> หารด้วย 4 แทนที่จะหารด้วย 16 ' +
          'เพราะเคยชินกับการผสมลักษณะเดียว',
        eqs: [{ eq: 'AaBb × AaBb ⇒ 9 : 3 : 3 : 1', why: 'อัตราส่วนฟีโนไทป์ของการผสมสองลักษณะแบบอิสระ' },
              { eq: 'ทั้งหมดรวมกัน = 9 + 3 + 3 + 1 = 16 ส่วน', why: 'ตัวส่วนของสัดส่วน' },
              { eq: 'จำนวน = frac(ส่วนของแบบนั้น,16) × จำนวนลูกทั้งหมด', why: 'คูณสัดส่วนกลับเข้ากับจำนวนจริง' }],
        solve: EQ('จำนวน = frac(' + which.k + ',16) × ' + n),
        subst: SEQ('= frac({k},16) × {n}', { k: which.k, n: n }),

          '<span class="hint">สรุปทั้งชุด: เด่น-เด่น ' + (n * 9 / 16) + ' · เด่น-ด้อย ' + (n * 3 / 16) +

          'ตรวจ: รวมกันได้ ' + n + ' ต้นพอดี ✓<br>' +
          'อัตราส่วน 9 : 3 : 3 : 1 ได้จาก (3 : 1) × (3 : 1) ของสองลักษณะที่เป็นอิสระต่อกัน</span>'
      }
    };
  }
});

  id: 's3n-ten', topic: 305, sub: 'การถ่ายทอดพลังงาน', level: 'ง่าย',
  skills: ['ใช้กฎร้อยละ 10 หนึ่งขั้น'],
  gen(R) {
    const E = R.pick([1000, 2000, 5000, 8000, 10000, 20000, 50000]);
    const ans = r2(E / 10);
    if (!ok2(ans)) return null;
    return {
      stem: 'ผู้ผลิตในระบบนิเวศหนึ่งมีพลังงานสะสม ' + U(E, 'kcal') + '<br>' +
        'ผู้บริโภคลำดับที่ 1 จะได้รับพลังงานประมาณกี่<b>กิโลแคลอรี</b> ' +
        '(ถ่ายทอดได้ร้อยละ 10)',
      given: [{ s: 'พลังงานของผู้ผลิต', v: E, unit: 'kcal', d: '' },
              { s: 'อัตราการถ่ายทอด', v: 10, unit: '%', d: 'ต่อหนึ่งลำดับขั้น' }],
      finds: [{ s: 'พลังงานของผู้บริโภคลำดับที่ 1', unit: 'kcal', d: 'พลังงานที่ส่งต่อได้ตามกฎสิบเปอร์เซ็นต์', value: ans, positive: true }],
      distract: [E, r2(E / 100), r2(E * 10), r2(E / 2)],
      figure: figFoodChain({ items: ['ผู้ผลิต', 'ผู้บริโภค 1'],
        energies: [fmtq(E) + ' kcal', fmtq(ans) + ' kcal'] }),
      sol: {
        analyze: 'พลังงานถ่ายทอดจากลำดับขั้นหนึ่งไปอีกขั้นได้เพียงราว<b>ร้อยละ 10</b><br>' +
          'ที่เหลืออีกร้อยละ 90 ถูกใช้ในการดำรงชีวิตและสูญเสียไปเป็นความร้อน<br>' +
          '<b>กับดักของข้อนี้:</b> หารด้วย 100 แทนที่จะหารด้วย 10 · ' +
          'ร้อยละ 10 คือ ' + M('frac(10,100) = frac(1,10)') + ' จึงหารด้วย 10',
        eqs: [{ eq: 'พลังงานขั้นถัดไป = frac(10,100) × พลังงานขั้นก่อนหน้า', why: 'กฎร้อยละ 10' },
              { eq: 'เท่ากับหารด้วย 10', why: 'ทางลัดที่ใช้ได้ทุกครั้ง' }],
        solve: EQ('พลังงาน = frac(10,100) × ' + E),
        subst: SEQ('= frac({E},10)', { E: E }),
        calc: EQ('= ' + fmtq(ans) + ' `kcal`'),
        conclude: 'ดังนั้น <b>ผู้บริโภคลำดับที่ 1 ได้รับพลังงานราว ' + M(fmtq(ans) + ' `kcal`') + '</b><br>' +
          '<span class="hint">พลังงานที่หายไป ' + M(fmtq(r2(E - ans)) + ' `kcal`') +
          ' ไม่ได้สูญเปล่า แต่ถูกใช้หายใจ เคลื่อนไหว และรักษาอุณหภูมิร่างกาย</span>'
      }
    };
  }
});

T({
  id: 's3n-dens', topic: 305, sub: 'ความหนาแน่นของประชากร', level: 'ง่าย',
  skills: ['คำนวณความหนาแน่นประชากร'],
  gen(R) {
    const d = R.pick([2, 2.5, 4, 5, 8, 10, 20, 25]);
    const area = R.pick([4, 5, 8, 10, 20, 40, 50]);
    const n = r2(d * area);
    if (!ok2(n)) return null;
    return {
      stem: 'สำรวจพบสัตว์ชนิดหนึ่งจำนวน ' + U(n, 'ตัว') + ' ในพื้นที่ ' + U(area, 'ตารางกิโลเมตร') + '<br>' +
        'จงหา<b>ความหนาแน่นของประชากร</b> (ตัวต่อตารางกิโลเมตร)',
      given: [{ s: 'จำนวนประชากร', v: n, unit: 'ตัว', d: '' },
              { s: 'พื้นที่', v: area, unit: 'km²', d: '' }],
      finds: [{ s: 'ความหนาแน่นประชากร', unit: 'ตัว/km²', d: 'จำนวนประชากรต่อพื้นที่หนึ่งตารางกิโลเมตร', value: d, positive: true }],
      distract: [r2(area / n), r2(n * area), n, r2(d * 2)],
      sol: {
        analyze: 'ความหนาแน่นบอกว่า "ในพื้นที่หนึ่งหน่วย มีสิ่งมีชีวิตอยู่กี่ตัว"<br>' +
          'ใช้เทียบความแออัดระหว่างพื้นที่ที่ขนาดไม่เท่ากันได้<br>' +
          '<b>กับดักของข้อนี้:</b> เอาพื้นที่หารจำนวนตัว ซึ่งได้หน่วยกลับหัวและตีความไม่ได้',
        eqs: [{ eq: 'ความหนาแน่นประชากร = frac(จำนวนประชากร,พื้นที่)', why: 'นิยามของความหนาแน่นประชากร' }],
        solve: EQ('ความหนาแน่น = frac(จำนวนประชากร,พื้นที่)'),
        subst: SEQ('= frac({n},{a})', { n: n, a: area }),
        calc: EQ('= ' + fmtq(d) + ' `ตัว/km^2`'),
        conclude: 'ดังนั้น <b>ความหนาแน่นเท่ากับ ' + M(fmtq(d) + ' `ตัว/km^2`') + '</b><br>' +
          '<span class="hint">ตัวเลขนี้ใช้เทียบกับพื้นที่อื่นได้ทันที แม้ขนาดพื้นที่จะต่างกัน ' +
          'ต่างจากการดูจำนวนตัวอย่างเดียวซึ่งเทียบกันไม่ได้</span>'
      }
    };
  }
});

T({
  id: 's3n-au', topic: 305, sub: 'ระยะทางในอวกาศ', level: 'ง่าย',
  skills: ['แปลงหน่วยดาราศาสตร์เป็นกิโลเมตร'],
  gen(R) {
    const au = R.pick([0.4, 0.7, 1, 1.5, 2, 5, 10]);
    const km = r2(au * 150);          // ล้านกิโลเมตร
    if (!ok2(km)) return null;
    return {
      stem: 'ดาวเคราะห์ดวงหนึ่งอยู่ห่างจากดวงอาทิตย์ ' + U(au, 'หน่วยดาราศาสตร์') + ' (AU)<br>' +
        'คิดเป็นระยะทางกี่<b>ล้านกิโลเมตร</b> (1 AU ≈ 150 ล้านกิโลเมตร)',
      given: [{ s: 'ระยะทาง', v: au, unit: 'AU', d: 'หน่วยดาราศาสตร์' },
              { s: '1 AU', v: 150, unit: 'ล้านกิโลเมตร', d: 'ระยะจากโลกถึงดวงอาทิตย์' }],
      finds: [{ s: 'ระยะทาง', unit: 'ล้านกิโลเมตร', d: 'ระยะทางหลังแปลงจากหน่วยดาราศาสตร์', value: km, positive: true }],
      distract: [r2(au / 150), r2(150 - au), au, r2(km * 2)],
      sol: {
        analyze: 'ระยะทางในอวกาศมีตัวเลขใหญ่มากจนอ่านยาก นักดาราศาสตร์จึงใช้<b>หน่วยดาราศาสตร์</b> ' +
          'โดยยึดระยะจากโลกถึงดวงอาทิตย์เป็น 1 หน่วย<br>' +
          '<b>กับดักของข้อนี้:</b> เอาไปหารแทนที่จะคูณ ทำให้ได้ค่าน้อยผิดปกติ',
        eqs: [{ eq: 'ระยะทาง (ล้าน `km`) = ระยะทาง (`AU`) × 150', why: 'นิยามของหน่วยดาราศาสตร์' }],
        solve: EQ('ระยะทาง = ' + fmtq(au) + ' × 150'),
        subst: SEQ('= {a} × 150', { a: au }),
        calc: EQ('= ' + fmtq(km) + ' ล้าน `km`'),
        conclude: 'ดังนั้น <b>ห่างจากดวงอาทิตย์ ' + M(fmtq(km) + ' ล้าน `km`') + '</b><br>' +
          '<span class="hint">เทียบให้เห็นภาพ: โลกอยู่ที่ 1 AU · ดาวอังคารราว 1.5 AU · ' +
          'ดาวพฤหัสบดีราว 5 AU · ดาวเนปจูนราว 30 AU</span>'
      }
    };
  }
});

T({
  id: 's3n-lightsec', topic: 305, sub: 'ระยะทางในอวกาศ', level: 'ง่าย',
  skills: ['คำนวณเวลาที่แสงเดินทาง'],
  gen(R) {
    const t = R.pick([1, 1.3, 2, 4, 8, 20, 40]);        // วินาที
    const km = r2(t * 300000);
    if (km > 1e7) return null;
    return {
      stem: 'แสงเดินทางด้วยอัตราเร็ว ' + U(300000, 'กิโลเมตรต่อวินาที') + '<br>' +
        'ในเวลา ' + U(t, 'วินาที') + ' แสงเดินทางได้กี่<b>กิโลเมตร</b>',
      given: [{ s: 'อัตราเร็วของแสง', v: 300000, unit: 'km/s', d: '' },
              { s: 'เวลา', v: t, unit: 'วินาที', d: '' }],
      finds: [{ s: 'ระยะทาง', unit: 'km', d: 'ที่แสงเดินทางได้', value: km, positive: true }],
      distract: [r2(300000 / t), r2(300000 + t), r2(km / 2), 300000],
      sol: {
        analyze: 'ใช้สูตรพื้นฐาน ระยะทาง = อัตราเร็ว × เวลา เหมือนการเคลื่อนที่ทั่วไป<br>' +
          'เพียงแต่ตัวเลขใหญ่มาก เพราะแสงเร็วที่สุดเท่าที่เป็นไปได้<br>' +
          '<b>กับดักของข้อนี้:</b> เอาอัตราเร็วหารเวลา แทนที่จะคูณ',
        eqs: [{ eq: 'ระยะทาง = อัตราเร็ว × เวลา', why: 'สูตรพื้นฐานของการเคลื่อนที่' }],
        solve: EQ('ระยะทาง = 300000 × ' + fmtq(t)),
        subst: SEQ('= 300000 × {t}', { t: t }),
        calc: EQ('= ' + fmtq(km) + ' `km`'),
        conclude: 'ดังนั้น <b>แสงเดินทางได้ ' + M(fmtq(km) + ' `km`') + '</b><br>' +
          '<span class="hint">เทียบให้เห็นภาพ: แสงจากดวงจันทร์ถึงโลกใช้เวลาราว 1.3 วินาที · ' +
          'จากดวงอาทิตย์ถึงโลกราว 500 วินาที (ราว 8 นาที)<br>' +
          'แปลว่าดวงอาทิตย์ที่เรามองเห็น คือภาพเมื่อ 8 นาทีที่แล้ว</span>'
      }
    };
  }
});

/* ---------- ระดับปานกลาง (กรอกคำตอบ) ---------- */

T({
  id: 's3n-tenmulti', topic: 305, sub: 'การถ่ายทอดพลังงาน', level: 'ปานกลาง',
  skills: ['ใช้กฎร้อยละ 10 หลายลำดับขั้น'],
  gen(R) {
    const E = R.pick([10000, 20000, 50000, 100000, 200000]);
    const k = R.pick([2, 3]);
    const ans = r2(E / Math.pow(10, k));
    if (!ok2(ans) || ans < 0.5) return null;
    return {
      stem: 'ผู้ผลิตมีพลังงานสะสม ' + U(E, 'kcal') + '<br>' +
        'ผู้บริโภคลำดับที่ ' + U(k) + ' จะได้รับพลังงานประมาณกี่<b>กิโลแคลอรี</b> ' +
        '(ถ่ายทอดได้ร้อยละ 10 ในแต่ละขั้น)',
      given: [{ s: 'พลังงานของผู้ผลิต', v: E, unit: 'kcal', d: '' },
              { s: 'ลำดับผู้บริโภคที่ถาม', v: k, unit: 'ลำดับ', d: 'นับจากผู้ผลิต' },
              { s: 'อัตราการถ่ายทอด', v: 10, unit: '%', d: 'ต่อหนึ่งขั้น' }],
      finds: [{ s: 'พลังงานที่ได้รับ', unit: 'kcal', d: 'ของผู้บริโภคลำดับที่ ' + k, value: ans, positive: true }],
      figure: figPyramidEco({ levels: k === 2
        ? [{ name: 'ผู้ผลิต', v: fmtq(E) }, { name: 'ผู้บริโภค 1', v: fmtq(r2(E / 10)) },
           { name: 'ผู้บริโภค 2', v: fmtq(ans) }]
        : [{ name: 'ผู้ผลิต', v: fmtq(E) }, { name: 'ผู้บริโภค 1', v: fmtq(r2(E / 10)) },
           { name: 'ผู้บริโภค 2', v: fmtq(r2(E / 100)) }, { name: 'ผู้บริโภค 3', v: fmtq(ans) }] }),
      sol: {
        analyze: 'ต้องนับให้ดีว่าพลังงานถ่ายทอด<b>กี่ครั้ง</b> — จากผู้ผลิตถึงผู้บริโภคลำดับที่ ' + k +
          ' คือถ่ายทอด ' + k + ' ครั้ง<br>' +
          'แต่ละครั้งเหลือหนึ่งในสิบ จึงหารด้วย 10 ทั้งหมด ' + k + ' ครั้ง<br>' +
          '<b>กับดักที่พลาดกันมากที่สุด:</b> หารด้วย 10 เพียงครั้งเดียว หรือคูณ ' + k +
          ' แทนที่จะยกกำลัง',
        eqs: [{ eq: 'พลังงานลำดับที่ n = frac(พลังงานผู้ผลิต,10^n)', why: 'ถ่ายทอด n ครั้ง แต่ละครั้งเหลือหนึ่งในสิบ' },
              { eq: 'นับจำนวนครั้ง = ลำดับของผู้บริโภคที่ถาม', why: 'ผู้ผลิตไม่นับเป็นลำดับผู้บริโภค' }],
        solve: EQ('พลังงาน = frac(' + fmtq(E) + ',10^' + k + ')'),
        subst: EQ('= frac(' + fmtq(E) + ',' + fmtq(Math.pow(10, k)) + ')'),
        calc: EQ('= ' + fmtq(ans) + ' `kcal`'),
        conclude: 'ดังนั้น <b>ผู้บริโภคลำดับที่ ' + k + ' ได้รับพลังงานราว ' +
          M(fmtq(ans) + ' `kcal`') + '</b><br>' +
          '<span class="hint">เหลือเพียงร้อยละ ' + fmtq(r2(ans * 100 / E)) + ' ของพลังงานตั้งต้น<br>' +
          'นี่คือเหตุผลที่โซ่อาหารยาวเกิน 4-5 ขั้นไม่ได้ — พลังงานเหลือน้อยเกินกว่าจะเลี้ยงประชากรได้</span>'
      }
    };
  }
});

T({
  id: 's3n-popgrow', topic: 305, sub: 'การเติบโตของประชากร', level: 'ปานกลาง',
  skills: ['คำนวณร้อยละการเพิ่มของประชากร'],
  gen(R) {
    const n0 = R.step(200, 2000, 100);
    const pct = R.pick([5, 10, 15, 20, 25, 40, 50]);
    const n1 = r2(n0 * (100 + pct) / 100);
    if (!ok2(n1)) return null;
    return {
      stem: 'ประชากรนกในเกาะแห่งหนึ่งเมื่อ 5 ปีก่อนมี ' + U(n0, 'ตัว') + ' ปัจจุบันสำรวจได้ ' +
        U(n1, 'ตัว') + '<br>ประชากรเพิ่มขึ้น<b>ร้อยละเท่าใด</b>',
      given: [{ s: 'ประชากรเมื่อ 5 ปีก่อน', v: n0, unit: 'ตัว', d: '' },
              { s: 'ประชากรปัจจุบัน', v: n1, unit: 'ตัว', d: '' }],
      finds: [{ s: 'ร้อยละที่เพิ่มขึ้น', unit: '%', d: 'เทียบกับประชากรเดิม', value: pct, positive: true }],
      sol: {
        analyze: 'การเปรียบเทียบประชากรต้องคิดเป็น<b>ร้อยละของค่าเดิม</b> ' +
          'ไม่ใช่ดูผลต่างดิบ ๆ เพราะเกาะแต่ละแห่งมีประชากรตั้งต้นไม่เท่ากัน<br>' +
          '<b>กับดักของข้อนี้:</b> เอาผลต่างหารด้วยประชากร<b>ปัจจุบัน</b> ' +
          'ซึ่งใช้ฐานผิด · ฐานต้องเป็นค่า<b>ก่อนการเปลี่ยนแปลง</b>เสมอ',
        eqs: [{ eq: 'ร้อยละที่เพิ่ม = frac(ประชากรใหม่ - ประชากรเดิม,ประชากรเดิม) × 100',
                why: 'ฐานของร้อยละคือค่าตั้งต้นเสมอ' }],
        solve: EQ('ร้อยละ = frac(N_2 - N_1,N_1) × 100'),
        subst: SEQ('= frac({b} - {a},{a}) × 100', { b: n1, a: n0 }),
        calc: EQ('= frac(' + fmtq(n1 - n0) + ',' + fmtq(n0) + ') × 100 = ' + fmtq(pct) + ' `%`'),
        conclude: 'ดังนั้น <b>ประชากรเพิ่มขึ้นร้อยละ ' + M(fmtq(pct)) + '</b><br>' +
          '<span class="hint">ประชากรจะเพิ่มขึ้นแบบนี้ต่อไปไม่ได้ตลอด ' +
          'เพราะเกาะมี<b>ขีดความสามารถในการรองรับ</b>จำกัด เมื่อถึงจุดนั้นประชากรจะคงที่</span>'
      }
    };
  }
});

T({
  id: 's3n-lighttime', topic: 305, sub: 'ระยะทางในอวกาศ', level: 'ปานกลาง',
  skills: ['หาเวลาที่แสงเดินทางจากระยะทาง', 'แปลงหน่วยเวลา'],
  gen(R) {
    const min = R.pick([2, 4, 5, 8, 10, 20, 40]);
    const km = r2(min * 60 * 300000 / 1e6);        // ล้านกิโลเมตร
    if (!ok2(km)) return null;
    return {
      stem: 'ดาวเคราะห์ดวงหนึ่งอยู่ห่างจากโลก ' + U(km, 'ล้านกิโลเมตร') + '<br>' +
        'แสงจากดาวดวงนี้ใช้เวลาเดินทางมาถึงโลกกี่<b>นาที</b> ' +
        '(แสงเร็ว 300,000 km/s)',
      given: [{ s: 'ระยะทาง', v: km, unit: 'ล้าน km', d: 'จากดาวถึงโลก' },
              { s: 'อัตราเร็วของแสง', v: 300000, unit: 'km/s', d: '' }],
      finds: [{ s: 'เวลา', unit: 'นาที', d: 'ที่แสงใช้เดินทาง', value: min, positive: true }],
      sol: {

function subsOf(topicId) {
  const seen = [];
  TPL.forEach(t => { if (t.topic === topicId && seen.indexOf(t.sub) < 0) seen.push(t.sub); });
  return seen;
}
function poolFor(topics, subs, level) {
  return TPL.filter(t => topics.indexOf(t.topic) >= 0 && t.level === level &&
    (!subs || !subs.length || subs.indexOf(t.sub) >= 0));
}
function mkCfg() {
  if (!DB.settings.make) {
    DB.settings.make = { topics: ALL_TOPIC_IDS.slice(), subs: [], mode: 'mix', n: 10,
                         counts: { 'ทฤษฎี': 2, 'ง่าย': 3, 'ปานกลาง': 3, 'ยาก': 2 } };
  }
  // ถ้ามีการเพิ่ม/ลบบทในโปรแกรมรุ่นใหม่ ให้ตัดเรื่องที่ไม่มีอยู่จริงทิ้ง กันหน้าจอพัง
  const c = DB.settings.make;
  c.topics = (c.topics || []).filter(t => ALL_TOPIC_IDS.indexOf(t) >= 0);
  if (!c.topics.length) c.topics = ALL_TOPIC_IDS.slice();
  return c;
}

/** สร้างชุดโจทย์ใหม่ — เก็บแค่ tplId กับ seed ทำให้สร้างโจทย์เดิมกลับมาได้เสมอ */
function createQuiz(o) {
  const R = rng(o.seed >>> 0);
  const items = [];
  const missing = [];
  LEVELS.forEach(lv => {
    const need = o.counts[lv] || 0;
    if (!need) return;
    const pool = poolFor(o.topics, o.subs, lv);
    if (!pool.length) { missing.push(lv); return; }
    // สับแม่แบบแล้วไล่หยิบวนไป เพื่อให้กระจายทั่วถึงก่อนจะเริ่มซ้ำ
    let bag = R.shuffle(pool);
    for (let k = 0; k < need; k++) {
      if (k % pool.length === 0 && k > 0) bag = R.shuffle(pool);
      const tpl = bag[k % pool.length];
      items.push({ tplId: tpl.id, seed: R.int(1, 2000000000), level: lv, topic: tpl.topic });
    }
  });
  if (missing.length) return { error: 'ไม่มีโจทย์ระดับ ' + missing.join(', ') + ' ในเรื่อง/หัวข้อที่เลือก' };
  // เรียงจากง่ายไปยาก แล้วเรียงตามเรื่อง เพื่อให้ใบงานไล่ระดับอย่างเป็นธรรมชาติ
  items.sort((a, b) => (LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level)) || (chOf(a.topic) - chOf(b.topic)));
  return {
    id: uid(), ts: Date.now(), title: o.title, seed: o.seed,
    topics: o.topics.slice(), subs: (o.subs || []).slice(), counts: Object.assign({}, o.counts),
    kind: o.kind === 'test' ? 'test' : 'practice',
    seedShift: o.kind === 'test' ? (Math.floor(Math.random() * 2000000000) + 1) : 0,
    piMode: DB.settings.piMode || '3.14',
    items: items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}

/* แคชโจทย์ที่สร้างแล้ว เพื่อไม่ต้องคำนวณซ้ำทุกครั้งที่วาดหน้าจอ */
const PCACHE = {};
/** seedShift ทำให้แบบทดสอบใช้แม่แบบและระดับความยากชุดเดิมเป๊ะ แต่ตัวเลขในโจทย์ต่างออกไป
    เก็บไว้ที่ตัวชุดโจทย์ ทุกที่ที่เรียก problemsOf() จึงได้โจทย์ชุดเดียวกันเสมอ
    ไม่มีทางที่หน้าทำข้อสอบกับตัวตรวจคำตอบจะใช้คนละเลข */
function problemsOf(quiz) {
  if (!quiz) return [];
  const sh = (quiz.seedShift || 0) >>> 0;
  const key = quiz.id + ':' + sh;
  if (PCACHE[key]) return PCACHE[key];
  const arr = quiz.items.map(it =>
    buildProblem(it.tplId, ((it.seed + sh) >>> 0), { piMode: quiz.piMode }));
  PCACHE[key] = arr;
  return arr;
}
function quizMaxScore(quiz) { return quiz.items.length; }

/** สร้างแบบทดสอบจากแบบฝึกหัดชุดหนึ่ง — แม่แบบ/หัวข้อ/ระดับเหมือนเดิมทุกข้อ แต่ตัวเลขคนละชุด */
function makeTestFrom(quiz, title) {
  let sh = 0;
  // กันกรณีสุ่มได้ 0 พอดี ซึ่งจะทำให้ตัวเลขซ้ำกับแบบฝึกหัดเป๊ะ
  while (!sh) sh = Math.floor(Math.random() * 2000000000) + 1;
  return {
    id: uid(), ts: Date.now(),
    title: title || ('แบบทดสอบ — ' + (quiz.title || '')),
    kind: 'test', seedShift: sh, fromQuizId: quiz.id,
    seed: quiz.seed, topics: (quiz.topics || []).slice(), subs: (quiz.subs || []).slice(),
    counts: Object.assign({}, quiz.counts),
    piMode: quiz.piMode,
    items: quiz.items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}

function bindMyAssignments() {
  const l = $('#myaLoad'); if (l) l.addEventListener('click', () => loadMyAssignments(true));

/** อ่านเฉพาะ id ของชุดโจทย์จากสเปก โดยไม่ต้องถอดทั้งชุด */
function decodeQuizId(spec) {
  const q = decodeQuiz(spec);
  return q ? q.id : null;
}

/** รับใบงานตามรหัสแล้วเริ่มทำทันที */
async function takeAssignment(code) {
  try {
    const a = await api('assignGet', { code: code });
    const q = decodeQuiz(a.spec);
    if (!q) { toast('อ่านใบงานนี้ไม่ได้ — แจ้งครูให้มอบหมายใหม่', 'bad'); return; }
    if (!DB.quizzes.some(x => x.id === q.id)) DB.quizzes.push(q);
    DB.cur.quizId = q.id;
    save(true);
    startQuiz(q.id, a.code);
  } catch (e) { toast(e.message, 'bad'); }
}

function takeByCode() {
  openModal({
    title: 'กรอกรหัสใบงาน',
    bodyHTML: '<div class="hint" style="margin-bottom:9px">กรอกรหัส 6 ตัวที่ครูให้มา</div>' +
      '<input type="text" id="tcCode" maxlength="6" autocapitalize="characters" ' +
      'style="width:100%;font-size:26px;text-align:center;letter-spacing:7px;text-transform:uppercase">' +
      '<div id="tcMsg" style="margin-top:10px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'รับใบงาน', cls: 'primary', act: async (close, root) => {
          const c = ($('#tcCode', root).value || '').trim().toUpperCase();
          if (c.length !== 6) { $('#tcMsg', root).innerHTML = '<div class="notice bad">รหัสต้องมี 6 ตัว</div>'; return; }
          try {
            const a = await api('assignGet', { code: c });
            const q = decodeQuiz(a.spec);
            if (!q) throw new Error('อ่านใบงานนี้ไม่ได้');
            if (!DB.quizzes.some(x => x.id === q.id)) DB.quizzes.push(q);
            save(true); close(); startQuiz(q.id, a.code);
          } catch (e) { $('#tcMsg', root).innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>'; }
        } }
    ],
    onMount: root => $('#tcCode', root).focus()
  });
}

/** ระดับชั้นที่ชุดลัดกำลังเล็งอยู่ — 'all' คือคละทุกชั้น
    เมื่อมีคลังโจทย์หลายระดับชั้น ปุ่ม "ฝึกเร็ว" ต้องรู้ว่าจะสุ่มจากชั้นไหน
    ไม่งั้นเด็ก ม.1 จะได้โจทย์ ม.3 ปนมาโดยไม่รู้ตัว */
function presetGrade() {
  const k = (DB.cur && DB.cur.pg) || 'all';
  if (k === 'all') return null;
  const g = GRADES.find(x => x.key === k && x.id);
  return g && TOPICS.some(t => gradeOf(t) === g.id) ? g : null;
}

function presetTopics(scope) {
  if (Array.isArray(scope)) return scope.slice();
  const gs = GRADES.find(x => x.key === scope);
  if (gs) return TOPICS.filter(t => gradeOf(t) === gs.id).map(t => t.id);
  let list = scope === 'core' ? TOPICS.filter(t => !t.exam) : TOPICS.slice();
  const pg = presetGrade();
  if (pg) list = list.filter(t => gradeOf(t) === pg.id);   // เล็งเฉพาะชั้นที่ครูเลือกไว้
  return list.map(t => t.id);
}
/** ชุดลัดที่ยังไม่มีเรื่องรองรับ ไม่ต้องขึ้นปุ่มให้กดแล้วเจอ error */
function presetsAvailable() { return PRESETS.filter(p => presetTopics(p.scope).length); }

function runPreset(key) {
  const ps = PRESETS.find(p => p.key === key);
  if (!ps) return;
  // ตรวจชื่อผู้เรียนก่อนสร้างชุด ไม่งั้นจะได้ชุดโจทย์ค้างไว้โดยที่ยังเริ่มทำไม่ได้
  if (needLearnerName()) return;
  const c = mkCfg();
  c.topics = presetTopics(ps.scope);
  c.subs = [];
  c.mode = 'mix';
  c.counts = Object.assign({}, ps.counts);
  c.kind = ps.kind;
  const pg = presetGrade();
  const title = ps.name.replace(/\s*\d+\s*ข้อ.*$/, '').trim() +
    (pg && ps.scope !== 'ex' ? ' ' + pg.label : '') + ' — ' + thDate(Date.now());
  c.lastTitle = title;
  const q = createQuiz({
    title: title, topics: c.topics, subs: [], counts: c.counts, kind: ps.kind,
    seed: Math.floor(Math.random() * 2000000000) + 1
  });
  if (q.error) { toast(q.error, 'bad'); return; }
  DB.quizzes.push(q);
  DB.cur.quizId = q.id;
  save(true);
  toast('สร้าง' + ps.name + 'แล้ว — กดเริ่มทำได้เลย', 'ok');
  startQuiz(q.id);
}

    '<div class="row" style="margin-bottom:11px"><button class="sm" id="btnPasteQuiz">รับใบงานจากรหัสที่ครูให้มา</button>' +

  }));
  $$('[data-fx]').forEach(b => b.addEventListener('click', () => showFormulas(Number(b.dataset.fx))));

  $('#btnAllTopic').addEventListener('click', () => setTopics(ALL_TOPIC_IDS.slice()));
  $$('[data-gsel]').forEach(b => b.addEventListener('click', () => {
    const g = Number(b.dataset.gsel);
    setTopics(TOPICS.filter(t => gradeOf(t) === g).map(t => t.id));
  }));
  $$('[data-topic]').forEach(cb => cb.addEventListener('change', e => {
    const id = Number(e.target.dataset.topic);
    const i = c.topics.indexOf(id);
    if (i >= 0) {
      c.topics.splice(i, 1);
      c.subs = c.subs.filter(s => subsOf(id).indexOf(s) < 0);   // เอาหัวข้อย่อยของเรื่องที่ปิดออกด้วย
    } else c.topics.push(id);
    save(); renderMake();
  }));
  $$('[data-sub]').forEach(cb => cb.addEventListener('change', e => {
    const s = e.target.dataset.sub, i = c.subs.indexOf(s);
    if (i >= 0) c.subs.splice(i, 1); else c.subs.push(s);
    save(); renderMake();
  }));
  $$('[data-mode]').forEach(b => b.addEventListener('click', () => {
    c.mode = b.dataset.mode; save(); renderMake();
  }));
  $$('[data-count]').forEach(inp => inp.addEventListener('change', e => {
    c.counts[e.target.dataset.count] = clamp(Math.round(Number(e.target.value) || 0), 0, 40);
    save(); renderMake();
  }));
  const nq = $('#nq');
  if (nq) nq.addEventListener('change', e => { c.n = clamp(Math.round(Number(e.target.value) || 1), 1, 40); save(); renderMake(); });
  $$('input[name=qk]').forEach(r => r.addEventListener('change', e => {
    c.kind = e.target.value; save(); renderMake();
  }));
  $('#btnGen').addEventListener('click', doGenerate);
  $$('[data-mktest]').forEach(b => b.addEventListener('click', () => makeTestDialog(b.dataset.mktest)));
  if (isStudent()) bindMyAssignments();
  $$('[data-start]').forEach(b => b.addEventListener('click', () => startQuiz(b.dataset.start)));
  $$('[data-print]').forEach(b => b.addEventListener('click', () => { DB.cur.quizId = b.dataset.print; save(); setTab('print'); }));
  $$('[data-delq]').forEach(b => b.addEventListener('click', async () => {
    const q = DB.quizzes.find(x => x.id === b.dataset.delq);
    const n = DB.attempts.filter(a => a.quizId === q.id).length;
    const ok = await confirmBox('ลบชุดโจทย์', 'ลบ "' + esc(q.title) + '" ?' +
      (n ? '<br><b>จะลบผลการทำ ' + n + ' ครั้งที่ผูกกับชุดนี้ไปด้วย</b>' : ''), 'ลบ');
    if (!ok) return;
    DB.quizzes = DB.quizzes.filter(x => x.id !== q.id);
    DB.attempts = DB.attempts.filter(a => a.quizId !== q.id);
    if (DB.cur.quizId === q.id) { DB.cur.quizId = null; DB.cur.attemptId = null; }
    delete PCACHE[q.id];
    save(true); renderMake(); toast('ลบแล้ว');
  }));
  $$('[data-share]').forEach(b => b.addEventListener('click', () => shareQuiz(b.dataset.share)));
  $$('[data-publish]').forEach(b => b.addEventListener('click', () => publishQuiz(b.dataset.publish)));
  $('#btnPasteQuiz').addEventListener('click', pasteQuiz);
}

/** แสดงรหัสใบงานให้ครูคัดลอกไปส่งนักเรียน */

  const q = DB.quizzes.find(x => x.id === quizId);

  const code = encodeQuiz(q);

    title: 'แชร์ใบงาน "' + (q.title || '') + '"',
    bodyHTML:
      '<div class="hint" style="margin-bottom:9px">ส่งรหัสนี้ให้นักเรียนทางไลน์กลุ่ม Google Classroom หรือช่องทางไหนก็ได้ ' +
      'นักเรียนกด <b>รับใบงานจากรหัสที่ครูให้มา</b> ในแท็บสร้างชุดโจทย์ แล้ววางรหัสลงไป<br>' +
      'จะได้โจทย์ <b>ตรงกันทุกตัวเลข</b> โดยไม่ต้องส่งไฟล์และไม่ต้องใช้อินเทอร์เน็ตหลังจากนั้น</div>' +
      '<textarea id="qShareBox" readonly style="width:100%;height:120px;font-family:ui-monospace,monospace;' +
      'font-size:12px;word-break:break-all">' + esc(code) + '</textarea>' +
      '<div class="hint" style="margin-top:7px">ความยาว ' + code.length + ' ตัวอักษร · ' +
      q.items.length + ' ข้อ</div>',
    buttons: [
      { label: 'ปิด' },
      { label: 'คัดลอกรหัส', cls: 'primary', act: async (close) => {
          const ok = await copyText(code);
          toast(ok ? 'คัดลอกรหัสใบงานแล้ว' : 'คัดลอกไม่สำเร็จ ให้เลือกข้อความในกล่องแล้วคัดลอกเอง', ok ? 'ok' : 'bad');
          if (ok) close();
        } }
    ],
    onMount: root => { const t = $('#qShareBox', root); if (t) { t.focus(); t.select(); } }

/** นักเรียนวางรหัสที่ครูให้มา แล้วสร้างชุดโจทย์เดียวกันขึ้นในเครื่อง */
function pasteQuiz() {
  openModal({
    title: 'รับใบงานจากรหัส',
    bodyHTML:
      '<div class="hint" style="margin-bottom:9px">วางรหัสที่ครูส่งมาลงในกล่องด้านล่าง แล้วกด <b>รับใบงาน</b></div>' +
      '<textarea id="qPasteBox" placeholder="PHYSQ1:..." style="width:100%;height:120px;' +
      'font-family:ui-monospace,monospace;font-size:12px;word-break:break-all"></textarea>' +
      '<div id="qPasteMsg" style="margin-top:8px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'รับใบงาน', cls: 'primary', act: (close, root) => {
          const val = $('#qPasteBox', root).value;
          const q = decodeQuiz(val);
          const msg = $('#qPasteMsg', root);
          if (!q) {
            msg.innerHTML = '<div class="notice bad">อ่านรหัสนี้ไม่ได้ — ตรวจว่าคัดลอกมาครบทั้งหมด ' +
              'และไม่มีตัวอักษรตกหล่น</div>';
            return;
          }
          const had = DB.quizzes.find(x => x.id === q.id);
          if (had) {
            DB.cur.quizId = had.id; save(true); close(); renderMake();
            toast('มีใบงานชุดนี้อยู่แล้ว — เลือกให้เป็นชุดปัจจุบันแล้ว', 'ok');
            return;
          }
          DB.quizzes.push(q);
          DB.cur.quizId = q.id;
          save(true); close(); renderMake();
          toast('รับใบงาน "' + q.title + '" (' + q.items.length + ' ข้อ) เรียบร้อย', 'ok');
        } }
    ],
    onMount: root => { const t = $('#qPasteBox', root); if (t) t.focus(); }
  });
}

/** สร้างแบบทดสอบจากแบบฝึกหัดที่มีอยู่ — หัวข้อและระดับเหมือนเดิม แต่ตัวเลขคนละชุด */
function makeTestDialog(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  openModal({
    title: 'สร้างแบบทดสอบจาก "' + (q.title || '') + '"',

      '<div class="hint" style="margin-bottom:10px">จะได้ชุดใหม่ที่ใช้<b>แม่แบบโจทย์ หัวข้อ และระดับความยากเดิมทุกข้อ</b> ' +
      'แต่<b>ตัวเลขในโจทย์ต่างออกไป</b> ทำแบบฝึกหัดมาก่อนแล้วก็ตอบข้อสอบทันทีไม่ได้<br>' +
      'ขณะทำจะไม่มีเฉลยและไม่บอกถูกผิด จนกว่าจะกดส่ง</div>' +
      '<label class="hint" for="mtTitle">ชื่อชุด</label>' +
      '<input type="text" id="mtTitle" style="width:100%" value="' +
      esc('แบบทดสอบ — ' + (q.title || '')) + '">',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'สร้างแบบทดสอบ', cls: 'primary', act: (close, root) => {
          const t = makeTestFrom(q, ($('#mtTitle', root).value || '').trim());
          DB.quizzes.push(t);
          DB.cur.quizId = t.id;
          save(true); close(); renderMake();
          toast('สร้างแบบทดสอบ ' + t.items.length + ' ข้อแล้ว — ตัวเลขต่างจากแบบฝึกหัด', 'ok');
        } }
    ]
  });
}

function doGenerate() {
  const c = mkCfg();
  if (!c.topics.length) { toast('เลือกอย่างน้อยหนึ่งเรื่องก่อน', 'bad'); return; }
  // ตรวจชื่อผู้เรียนก่อนสร้างชุด เหตุผลเดียวกับใน runPreset
  if (needLearnerName()) return;
  const counts = {};
  if (c.mode === 'mix') LEVELS.forEach(l => counts[l] = c.counts[l] || 0);
  else counts[c.mode] = c.n;
  const total = LEVELS.reduce((s, l) => s + (counts[l] || 0), 0);
  if (total < 1) { toast('ระบุจำนวนข้ออย่างน้อย 1 ข้อ', 'bad'); return; }
  if (total > 40) { toast('ชุดหนึ่งได้สูงสุด 40 ข้อ', 'bad'); return; }

  const kind = c.kind === 'test' ? 'test' : 'practice';
  const shortOf = t => { const x = TOPICS.find(v => v.id === t); return x ? x.short : ''; };
  const title = ($('#qtitle').value || '').trim() ||
    (QUIZ_KINDS[kind].name + ' ' + c.topics.map(shortOf).filter(Boolean).join(' + ') + ' ' + thDate(Date.now()));
  c.lastTitle = title;
  const q = createQuiz({
    title: title, topics: c.topics, subs: c.subs, counts: counts, kind: kind,
    seed: Math.floor(Math.random() * 2000000000) + 1
  });
  if (q.error) { toast(q.error, 'bad'); return; }
  DB.quizzes.push(q);
  DB.cur.quizId = q.id;
  save(true);
  toast('สร้าง' + QUIZ_KINDS[kind].name + ' ' + q.items.length + ' ข้อแล้ว', 'ok');
  renderMake();
}

/* --- 5.3 เริ่มทำแบบฝึกหัด ------------------------------------------------- */
function currentLearner() {
  if (DB.mode === 'solo') {
    const p = DB.profile;
    return { studentId: null, name: p.name || 'ผู้เรียน',
             no: String(p.no || ''), sid: String(p.sid || ''), room: String(p.room || '') };
  }
  const s = studentById(DB.cur.studentId);
  return s ? { studentId: s.id, name: s.name, no: String(s.no || ''), sid: String(s.sid || ''),
               room: (classById(s.classId) || {}).name || '' } : null;
}
/** ยังไม่ได้ใส่ชื่อผู้เรียน — บอกให้ชัดแล้วพาไปที่ช่องกรอกเลย
    เดิมแค่ขึ้นข้อความเตือนแวบเดียวแล้วเงียบ ผู้ใช้จึงเห็นเป็น "กดแล้วไม่มีอะไรเกิดขึ้น"
    เจอบ่อยเป็นพิเศษตอนเปิดวิชาใหม่ เพราะแต่ละวิชาเก็บชื่อแยกคนละที่ในเบราว์เซอร์
    ชื่อที่เคยกรอกไว้ในวิชาอื่นจึงไม่ตามมาให้ */
function needLearnerName() {
  if (DB.mode !== 'solo' || DB.profile.name.trim()) return false;
  toast('ใส่ชื่อผู้เรียนที่ช่องด้านบนก่อน แล้วจึงเริ่มทำได้', 'bad');
  const el = $('#soloName');
  if (el) {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.focus();
    el.style.borderColor = 'var(--bad)';
    el.style.background = 'var(--bad-bg)';
    setTimeout(() => { el.style.borderColor = ''; el.style.background = ''; }, 2600);
  }
  return true;
}

function startQuiz(quizId, assignCode) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  const who = currentLearner();
  if (!who) { toast('เลือกผู้เรียนที่แถบบนก่อน (หรือเพิ่มรายชื่อในแท็บตั้งค่า)', 'bad'); return; }
  if (needLearnerName()) return;
  const a = {
    id: uid(), quizId: q.id, studentId: who.studentId, soloName: who.name,
    // ติดเลขที่/เลขประจำตัว/ชั้นไปกับผลด้วย เพื่อให้ครูจับคู่ได้แม่นตอนรวมไฟล์จากเครื่องนักเรียน
    no: who.no || '', sid: who.sid || '', room: who.room || '',
    assignCode: assignCode || null,   // ผูกกับใบงานบนชีต ถ้ามาจากการมอบหมาย
    startedAt: Date.now(), finishedAt: null,
    answers: q.items.map(() => ({ raw: [], pick: null, checked: false, score: 0, tries: 0, revealed: false, sec: 0 }))
  };
  DB.attempts.push(a);
  DB.cur.quizId = q.id; DB.cur.attemptId = a.id; DB.cur.i = 0;
  QT.i = -1;
  save(true);
  setTab('do');
}

/* --- 5.4 แท็บทำแบบฝึกหัด -------------------------------------------------- */
const QT = { i: -1, t0: 0 };   // จับเวลาต่อข้อ
function stampTime() {
  const a = curAttempt();
  if (a && QT.i >= 0 && a.answers[QT.i]) a.answers[QT.i].sec += (Date.now() - QT.t0) / 1000;
  QT.i = -1;
}
function gotoQ(i) {
  const a = curAttempt(); if (!a) return;
  stampTime();
  DB.cur.i = clamp(i, 0, a.answers.length - 1);
  QT.i = DB.cur.i; QT.t0 = Date.now();
  save(); renderDo();
}

function renderDo() {
  const a = curAttempt(), q = curQuiz();
  if (!a || !q || a.quizId !== q.id) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ยังไม่ได้เริ่มทำแบบฝึกหัด</h3>' +
      '<div class="hint">ไปที่แท็บ <b>สร้างชุดโจทย์</b> เพื่อสร้างชุดใหม่ หรือเลือกชุดที่มีอยู่แล้วกด <b>เริ่มทำ</b></div>' +
      '<div class="row" style="margin-top:10px"><button class="primary" id="goMake">ไปสร้างชุดโจทย์</button></div></div>';
    const b = $('#goMake'); if (b) b.addEventListener('click', () => setTab('make'));
    return;
  }
  if (a.finishedAt) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ทำชุดนี้เสร็จแล้ว</h3>' +
      '<div class="hint">ชุด "' + esc(q.title) + '" ทำเสร็จเมื่อ ' + thDateTime(a.finishedAt) + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="primary" id="goRes">ดูผลและการวิเคราะห์</button>' +
      '<button id="goMake2">สร้าง / เลือกชุดใหม่</button></div></div>';
    $('#goRes').addEventListener('click', () => setTab('result'));
    $('#goMake2').addEventListener('click', () => setTab('make'));
    return;
  }

  const probs = problemsOf(q);
  const i = clamp(DB.cur.i, 0, probs.length - 1);
  const p = probs[i], it = a.answers[i];
  if (QT.i !== i) { QT.i = i; QT.t0 = Date.now(); }

  const done = a.answers.filter(x => x.checked).length;
  const gotScore = a.answers.reduce((s, x) => s + x.score, 0);
  const T = isTest(q);          // แบบทดสอบ: ไม่บอกถูกผิดและไม่มีเฉลยระหว่างทำ

  let h = '<div class="card noprint"><div class="row">' +
    '<div class="grow"><b>' + esc(q.title) + '</b> ' +
    '<span class="tag ' + QUIZ_KINDS[quizKind(q)].cls + '">' + QUIZ_KINDS[quizKind(q)].name + '</span>' +
    '<div class="hint">ผู้ทำ: ' + esc(attemptWho(a)) +
    ' · ข้อ ' + (i + 1) + ' จาก ' + probs.length +
    (T ? ' · ตอบแล้ว ' + done + ' ข้อ'
       : ' · ตรวจแล้ว ' + done + ' ข้อ · ได้ ' + fmt(gotScore) + ' คะแนน') + '</div></div>' +
    '<button class="sm" id="btnFinish">ส่งคำตอบ / จบชุดนี้</button></div>' +
    '<div class="bar" style="margin-top:9px"><i style="width:' + Math.round(done / probs.length * 100) + '%"></i></div>' +
    '<div class="qnav" style="margin-top:11px">' +
    a.answers.map((x, k) => {
      let cls = '';
      // ระหว่างทำข้อสอบ แสดงแค่ว่าตอบแล้วหรือยัง ไม่บอกว่าถูกหรือผิด
      if (x.checked) cls = T ? 'half' : (x.score >= 1 ? 'ok' : (x.score > 0 ? 'half' : 'bad'));
      if (k === i) cls += ' cur';
      return '<button class="' + cls + '" data-go="' + k + '">' + (k + 1) + '</button>';
    }).join('') + '</div>' +
    (T ? '<div class="hint" style="margin-top:9px">โหมดแบบทดสอบ — ไม่แสดงเฉลยและไม่บอกถูกผิดระหว่างทำ ' +
         'กลับไปแก้คำตอบข้อไหนก็ได้ก่อนกดส่ง</div>' : '') + '</div>';

  // ใบงานที่มาจากไฟล์รุ่นใหม่กว่าอาจอ้างแม่แบบที่เครื่องนี้ยังไม่มี (เช่น บทที่เพิ่มภายหลัง)
  // กรณีนี้สร้างโจทย์ไม่ได้ ต้องบอกให้ชัดว่าให้ไปโหลดไฟล์รุ่นใหม่ ไม่ใช่ปล่อยให้จอว่าง
  if (!p) {
    h += '<div class="card"><div class="notice bad"><b>เปิดข้อนี้ไม่ได้</b><br>' +
      'ข้อนี้ใช้โจทย์จากบทที่ไฟล์รุ่นนี้ยังไม่มี — แปลว่าครูสร้างใบงานด้วยโปรแกรมรุ่นใหม่กว่า</div>' +
      '<div class="hint">วิธีแก้: <b>รีเฟรชหน้านี้</b> (ดึงลงบนไอแพด) เพื่อโหลดโปรแกรมรุ่นล่าสุด ' +
      'ถ้ายังไม่หาย ให้แจ้งครูว่าต้องอัปโหลดไฟล์รุ่นใหม่ขึ้นเว็บก่อน</div>' +
      '<div class="row" style="margin-top:11px">' +
      '<button class="primary" onclick="location.reload(true)">รีเฟรชโปรแกรม</button>' +
      '<button id="skipBad">ข้ามไปข้อถัดไป</button></div></div>';
    $('#pane-do').innerHTML = h;
    $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
    $('#btnFinish').addEventListener('click', finishAttempt);
    const sb = $('#skipBad');
    if (sb) sb.addEventListener('click', () => gotoQ(Math.min(i + 1, probs.length - 1)));
    return;
  }

  h += '<div class="card">' + problemHead(p, i + 1) + problemBody(p);

  // --- ช่องตอบ ---
  h += '<div class="ansbox">';
  if (p.choices) {
    h += '<div style="margin-bottom:9px"><b>เลือกคำตอบที่ถูกต้อง</b> ' +
      (p.theory ? '<span class="hint">(ข้อสอบเชิงแนวคิด ไม่ต้องคำนวณ)</span>'
                : '<span class="hint">(' + esc(p.finds[0].d) + ' หน่วย ' + esc(p.finds[0].unit || '—') + ')</span>') +
      '</div><div class="choices' + (p.theory ? ' txt' : '') + '">';
    p.choices.forEach((ch, k) => {
      let cls = 'choice';
      if (it.pick === k) cls += ' sel';
      if (it.checked && !T) { if (ch.correct) cls += ' ok'; else if (it.pick === k) cls += ' bad'; }
      h += '<button class="' + cls + '" data-pick="' + k + '"' + (it.checked && !T ? ' disabled' : '') + '>' +
        '<span class="k">' + 'กขคง'[k] + '.</span><span>' +
        (p.theory ? ch.text
                  : M((ch.text != null ? ch.text : fmt(ch.value)) +
                      (p.finds[0].unit ? ' `' + p.finds[0].unit + '`' : ''))) +
        '</span></button>';
    });
    h += '</div>';
  } else {
    h += ansHintHTML(p);
    p.finds.forEach((f, k) => {
      const okc = (it.checked && !T) ? (checkAns(it.raw[k], f) ? ' ok' : ' bad') : '';
      h += '<div class="ansrow"><label class="lab" for="in' + k + '">' + M(f.s) + ' <span class="hint">' + esc(f.d) + '</span></label>' +
        '<input type="text" inputmode="' + (f.kind === 'frac' ? 'text' : 'decimal') + '" class="numin' + okc +
        '" id="in' + k + '" data-in="' + k + '" value="' +
        esc(it.raw[k] == null ? '' : it.raw[k]) + '"' + (it.checked && !T ? ' disabled' : '') + '>' +
        '<span class="unit">' + esc(f.unit || '') + '</span></div>';
    });
  }
  if (T) {
    h += '<div class="row" style="margin-top:11px"><button class="primary" id="btnCheck">' +
      (it.checked ? 'บันทึกคำตอบใหม่' : 'บันทึกคำตอบ') + '</button>' +
      (it.checked ? '<span class="hint" style="color:var(--ok)">บันทึกคำตอบข้อนี้แล้ว — แก้ได้จนกว่าจะกดส่ง</span>'
                  : '<span class="hint">ยังไม่ได้บันทึกคำตอบข้อนี้</span>') + '</div>';
  } else if (it.checked) {
    const full = it.score >= 1, part = it.score > 0 && it.score < 1;
    h += '<div class="verdict ' + (full ? 'ok' : 'bad') + '">' +
      (full ? '✓ ถูกต้อง' : part ? '◑ ถูกบางส่วน — ได้ ' + fmt(it.score) + ' คะแนน' : '✗ ยังไม่ถูก') +
      '</div><div class="hint">คำตอบที่ถูกคือ ' +
      (p.theory
        ? 'ข้อ ' + 'กขคง'[p.choices.findIndex(c => c.correct)] + '.'
        : p.finds.map(f => M(f.s + ' = ' + ansTxt(f) + (f.unit ? ' `' + f.unit + '`' : ''))).join(' , ')) +
      '</div>';
    h += '<div class="row" style="margin-top:10px"><button class="sm" id="btnRetry">ลองทำใหม่ (ไม่นับคะแนน)</button></div>';
  } else {
    h += '<div class="row" style="margin-top:11px"><button class="primary" id="btnCheck">ตรวจคำตอบ</button>' +
      '<button id="btnReveal">ยังไม่รู้ ขอดูวิธีทำ</button></div>';
  }
  h += '</div>';

  // --- วิธีทำ (แบบทดสอบไม่แสดง) ---
  if (!T && (it.checked || it.revealed)) {
    h += '<h3 style="margin:16px 0 6px">วิธีทำอย่างละเอียด</h3>' +
      '<div class="hint" style="margin-bottom:8px">แตะหัวข้อแต่ละขั้นเพื่อเปิด-ปิด</div>' + solutionHTML(p, false);
  }

  h += '<div class="row" style="margin-top:14px">' +
    '<button id="btnPrev"' + (i === 0 ? ' disabled' : '') + '>← ข้อก่อนหน้า</button>' +
    '<button id="btnNext"' + (i === probs.length - 1 ? ' disabled' : '') + '>ข้อถัดไป →</button>' +
    '<div class="grow"></div><span class="hint">ใช้เวลาข้อนี้ไปแล้ว ' + mmss(it.sec) + '</span></div>';
  h += '</div>';

  $('#pane-do').innerHTML = h;

  // --- ผูกเหตุการณ์ ---
  $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
  $('#btnPrev').addEventListener('click', () => gotoQ(i - 1));
  $('#btnNext').addEventListener('click', () => gotoQ(i + 1));
  $('#btnFinish').addEventListener('click', finishAttempt);
  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    it.pick = Number(b.dataset.pick); save(); renderDo();
  }));
  $$('[data-in]').forEach(inp => {
    inp.addEventListener('input', e => { it.raw[Number(e.target.dataset.in)] = e.target.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkCurrent(); } });
  });
  const bc = $('#btnCheck'); if (bc) bc.addEventListener('click', checkCurrent);
  const br = $('#btnReveal'); if (br) br.addEventListener('click', () => {
    it.revealed = true; save(); renderDo();
    toast('เปิดวิธีทำแล้ว — ข้อนี้ยังตรวจคำตอบได้ตามปกติ');
  });
  const bt = $('#btnRetry'); if (bt) bt.addEventListener('click', () => {
    it.checked = false; it.raw = []; it.pick = null; save(); renderDo();
  });
  bindSolutionToggle($('#pane-do'));
  const first = $('.numin:not([disabled])');
  if (first && (T || !it.checked)) first.focus();
}

/** ตรวจข้อปัจจุบัน — คะแนนจะถูกล็อกไว้ที่การตรวจครั้งแรกเพื่อให้สถิติสะท้อนความจริง */
function checkCurrent() {
  const a = curAttempt(), q = curQuiz(); if (!a || !q) return;
  const i = DB.cur.i, p = problemsOf(q)[i], it = a.answers[i];
  if (!p) { toast('ข้อนี้เปิดไม่ได้ในโปรแกรมรุ่นนี้ — ให้รีเฟรชหน้าเพื่อโหลดรุ่นล่าสุด', 'bad'); return; }
  const T = isTest(q);
  if (it.checked && !T) return;      // แบบทดสอบแก้คำตอบซ้ำได้จนกว่าจะส่ง
  let score = 0;
  if (p.choices) {
    if (it.pick == null) { toast('เลือกคำตอบก่อน', 'bad'); return; }
    score = p.choices[it.pick].correct ? 1 : 0;
  } else {
    let blank = 0, hit = 0;
    p.finds.forEach((f, k) => {
      if (parseNum(it.raw[k]) == null) blank++;
      else if (checkAns(it.raw[k], f)) hit++;
    });
    if (blank === p.finds.length) { toast('กรอกคำตอบก่อน', 'bad'); return; }
    score = hit / p.finds.length;
  }
  it.checked = true; it.tries++;
  // แบบฝึกหัดล็อกคะแนนที่การตรวจครั้งแรก · แบบทดสอบใช้คำตอบล่าสุดที่บันทึกไว้
  if (T || it.tries === 1) it.score = score;
  stampTime(); QT.i = i; QT.t0 = Date.now();
  save(true);
  renderDo();
  if (T) toast('บันทึกคำตอบข้อ ' + (i + 1) + ' แล้ว', 'ok');
  else toast(score >= 1 ? 'ถูกต้อง!' : score > 0 ? 'ถูกบางส่วน' : 'ยังไม่ถูก ลองดูวิธีทำ',
             score >= 1 ? 'ok' : score > 0 ? '' : 'bad');

  // ส่งความคืบหน้าขึ้นชีตทุก 3 ข้อ — ไอแพดแบตหมดกลางคันก็ไม่เสียของ
  if (isStudent() && a.assignCode && DB.settings.autoDraft) {
    const n = a.answers.filter(x => x.checked).length;
    if (n % 3 === 0) sendAttempt(a, 'draft');
  }
}

async function finishAttempt() {
  const a = curAttempt(); if (!a) return;
  const q0 = curQuiz();
  const left = a.answers.filter(x => !x.checked).length;
  if (left) {
    const ok = await confirmBox('ส่งคำตอบ', 'ยังเหลืออีก <b>' + left + ' ข้อ</b>ที่ยังไม่ได้' +
      (isTest(q0) ? 'บันทึกคำตอบ' : 'ตรวจ') + ' ข้อที่ไม่ได้ทำจะได้ 0 คะแนน ต้องการส่งเลยหรือไม่?', 'ส่งเลย');
    if (!ok) return;
  } else if (isTest(q0)) {
    // ข้อสอบส่งแล้วแก้ไม่ได้ ต้องยืนยันก่อนเสมอ
    if (!await confirmBox('ส่งแบบทดสอบ',
      'ตอบครบทุกข้อแล้ว — <b>ส่งแล้วจะแก้คำตอบไม่ได้อีก</b><br>ต้องการส่งเลยหรือไม่?', 'ส่งเลย')) return;
  }
  stampTime();
  a.finishedAt = Date.now();
  save(true);
  setTab('result');

  if (isStudent() && a.assignCode) {
    toast('กำลังส่งผลให้ครู…');
    const ok = await sendAttempt(a, 'final');
    if (ok) { MYA.list = null; toast('ส่งผลให้ครูเรียบร้อยแล้ว', 'ok'); }
    else toast('ส่งไม่สำเร็จ — เก็บไว้ในคิวแล้ว จะส่งให้เองเมื่อต่อเน็ตได้', 'warn');
    renderResult();
  }
}
