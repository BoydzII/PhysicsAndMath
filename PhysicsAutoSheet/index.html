      distract: [f, r2(n * t), r2(T * 2), r2(T / 2), r2(t + n), r2(f * 2)],
      sol: {
        analyze: 'การเคลื่อนที่เป็นวงกลมเป็นการเคลื่อนที่แบบ<b>ซ้ำรอบเดิม</b> ' +
          'จึงอธิบายด้วยสองปริมาณที่กลับกัน<br>' +
          '• <b>คาบ (' + M('T') + ')</b> = เวลาที่ใช้ครบ <b>1 รอบ</b> หน่วยเป็นวินาที<br>' +
          '• <b>ความถี่ (' + M('f') + ')</b> = จำนวนรอบใน <b>1 วินาที</b> หน่วยเป็นเฮิรตซ์ (Hz)<br>' +
          'ทั้งสองเป็น<b>ส่วนกลับของกันและกัน</b> ' + M('T = 1/f') + '<br>' +
          'ข้อนี้ถามคาบ จึงเอาเวลาทั้งหมดหารด้วยจำนวนรอบ',
        eqs: [{ eq: 'T = t / n', why: 'คาบ คือเวลาเฉลี่ยต่อหนึ่งรอบ = เวลาทั้งหมด หารด้วย จำนวนรอบ' },
               { eq: 'f = n / t = 1 / T', why: 'ความถี่ คือจำนวนรอบต่อวินาที ซึ่งเป็นส่วนกลับของคาบ' }],
        solve: EQ('T = t / n'),
        subst: SEQ('T = {t} / {n}', { t: t, n: n }),
        calc: EQ('T = ' + fmtq(T) + ' `s`'),
        conclude: 'ดังนั้น <b>คาบของการเคลื่อนที่ = ' + U(T, 's') + '</b> ต่อรอบ<br>' +
          '<span class="hint">ตรวจสอบด้วยความถี่: ' + M('f = ' + fmt(n) + '/' + fmt(t) + ' = ' + fmt(f)) +
          ' Hz และ ' + M('1/f = ' + fmt(T)) + ' s ✓ สอดคล้องกัน<br>' +
          '<b>ใช้ต่อ:</b> ถ้ารู้รัศมี ' + M('r') + ' จะหาอัตราเร็วเชิงเส้นได้จาก ' + M('v = 2πr / T') +
          ' และหาอัตราเร็วเชิงมุมได้จาก ' + M('ω = 2π / T') + '</span>'
      }
    };
  }
});

T({

      sol: {

          'ความเร่งนี้เรียกว่า<b>ความเร่งสู่ศูนย์กลาง</b> มีทิศ<b>ชี้เข้าหาจุดศูนย์กลาง</b>เสมอ ' +

          'เปลี่ยนแค่ทิศ ไม่เปลี่ยนอัตราเร็วและไม่เปลี่ยนพลังงานจลน์',
        eqs: [{ eq: 'a_c = v^2 / r', why: 'สูตรความเร่งสู่ศูนย์กลาง — เร็วขึ้นหรือวงแคบลง ความเร่งยิ่งมาก' }],
        solve: '<div>สมการหา ' + M('a_c') + ' ได้ทันที</div>' + EQ('a_c = v^2 / r'),
        subst: SEQ('a_c = ({v})^2 / {r}', { v: v, r: r }),
        calc: EQ('a_c = ' + fmtq(v * v) + ' / ' + fmtq(r), 'a_c = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>ความเร่งสู่ศูนย์กลาง = ' + U(a, 'm/s²') + '</b> มีทิศชี้เข้าหาจุดศูนย์กลาง<br>' +
          '<span class="hint"><b>ประสบการณ์ใกล้ตัว:</b> ตอนนั่งรถเลี้ยวโค้ง เรารู้สึกเหมือนถูก "เหวี่ยงออก" ' +

          'ส่วนรถต่างหากที่เลี้ยวเข้ามาหาเรา<br>' +
          '"แรงหนีศูนย์กลาง" จึง<b>ไม่ใช่แรงจริง</b> — แรงจริงที่มีคือ<b>แรงสู่ศูนย์กลาง</b>ที่ดึงเราให้เลี้ยวตามรถ<br>' +
          '<b>คิดต่อ:</b> ถ้าวัตถุมีมวล 2 kg แรงสู่ศูนย์กลางจะเท่ากับ ' + M('m a_c = ' + fmt(r2(2 * a))) + ' N</span>'
      }

  }

T({
  id: 'm-proj-ang', topic: 7, sub: 'โพรเจกไทล์ทำมุมกับแนวราบ', level: 'ปานกลาง',
  skills: ['แยกความเร็วต้นเป็นสองแนว', 'เวลาขึ้นเท่ากับเวลาลง'],
  gen(R, c) {
    const g = c.g, deg = R.pick([37, 53]), tup = R.pick([1, 2, 3]);
    const uy = r2(g * tup);
    const u = r2(uy / sinD(deg));
    const ux = r2(u * cosD(deg));
    const H = r2(0.5 * g * tup * tup);
    const Rg = r2(ux * 2 * tup);
    if (!ok2(u, ux, uy, H, Rg) || u > 120) return null;
    return {
      stem: 'ยิงวัตถุออกไปจากพื้นราบด้วยความเร็วต้น ' + U(u, 'm/s') + ' ทำมุม <b>' + fmt(deg) +
        '° กับแนวราบ</b> จงหา<b>เวลาที่ขึ้นถึงจุดสูงสุด</b> <b>ความสูงสูงสุด</b> ' +
        'และ<b>ระยะทางในแนวราบทั้งหมด</b> (ไม่คิดแรงต้านอากาศ กำหนด ' + GTXT(g) + ')',
      figure: figProj({ mode: 'a', deg: deg, u: 'u = ' + fmt(u) + ' m/s', hlab: 'H', rlab: 'R' }),
      given: [{ s: 'u', v: u, unit: 'm/s', d: 'ความเร็วต้น' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมยิงกับแนวราบ' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 't_{ขึ้น}', unit: 's', d: 'เวลาขึ้นถึงจุดสูงสุด', value: tup, positive: true },
              { s: 'H', unit: 'm', d: 'ความสูงสูงสุด', value: H, positive: true },
              { s: 'R', unit: 'm', d: 'ระยะทางในแนวราบทั้งหมด', value: Rg, positive: true }],
      sol: {
        analyze: '<b>ขั้นแรกที่ต้องทำเสมอ: แยกความเร็วต้นเป็นสองแนว</b><br>' +
          '• แนวราบ ' + M('u_x = u cos θ = ' + fmt(u) + ' × ' + fmtq(cosD(deg)) + ' = ' + fmt(ux)) + ' m/s → <b>คงที่ตลอด</b><br>' +
          '• แนวดิ่ง ' + M('u_y = u sin θ = ' + fmt(u) + ' × ' + fmtq(sinD(deg)) + ' = ' + fmt(uy)) + ' m/s → <b>ถูก g หน่วง</b><br>' +
          '<b>เงื่อนไขที่จุดสูงสุด:</b> ความเร็วใน<b>แนวดิ่ง</b>เป็นศูนย์ (' + M('v_y = 0') + ') ' +
          'แต่<b>แนวราบยังเคลื่อนที่อยู่</b> — วัตถุจึงไม่ได้หยุดนิ่ง<br>' +
          '<b>สมมาตรของพาราโบลา:</b> เวลาขึ้น = เวลาลง ดังนั้นเวลาลอยทั้งหมด = ' + M('2 t_{ขึ้น}') + '<br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg + '° = ' + fmtq(sinD(deg)) + ', cos ' + deg + '° = ' + fmtq(cosD(deg))),
        eqs: [{ eq: 'u_y = u sin θ ,  u_x = u cos θ', why: 'แยกความเร็วต้นเป็นองค์ประกอบสองแนวที่คิดแยกกันได้' },
               { eq: 't_{ขึ้น} = u_y / g', why: 'จาก v_y = u_y - g t โดยที่จุดสูงสุด v_y = 0' },
               { eq: 'H = u_y^2 / (2 g)', why: 'จาก v_y² = u_y² - 2gH โดยที่จุดสูงสุด v_y = 0' },
               { eq: 'R = u_x × 2 t_{ขึ้น}', why: 'แนวราบความเร็วคงที่ คูณด้วยเวลาลอยทั้งหมดซึ่งเป็นสองเท่าของเวลาขึ้น' }],
        solve: EQ('t_{ขึ้น} = u sin θ / g', 'H = (1/2) g t_{ขึ้น}^2', 'R = (u cos θ)(2 t_{ขึ้น})'),
        subst: SEQ('t_{ขึ้น} = {uy} / {g}', { uy: uy, g: g }) +
               SEQ('H = (1/2)({g})({t})^2', { g: g, t: tup }) +
               SEQ('R = ({ux})(2 × {t})', { ux: ux, t: tup }),
        calc: EQ('t_{ขึ้น} = ' + fmtq(tup) + ' `s`', 'H = ' + fmtq(H) + ' `m`',
                 'R = ' + fmtq(Rg) + ' `m`'),
        conclude: 'ดังนั้น <b>ขึ้นถึงจุดสูงสุดใน ' + U(tup, 's') + ' ที่ความสูง ' + U(H, 'm') +
          ' และตกลงพื้นห่างออกไป ' + U(Rg, 'm') + '</b><br>' +
          '<span class="hint"><b>สิ่งที่ต้องจำเรื่องระยะไกลสุด</b><br>' +
          '• มุมที่ทำให้ยิงได้<b>ไกลที่สุด</b>บนพื้นราบคือ <b>45°</b><br>' +
          '• มุมที่<b>บวกกันได้ 90°</b> (เช่น 37° กับ 53°) จะยิงได้<b>ไกลเท่ากัน</b> ' +
          'ต่างกันแค่มุมสูงจะลอยนานกว่าและสูงกว่า<br>' +
          '• ที่จุดสูงสุด ความเร็วไม่เป็นศูนย์ แต่เหลือ ' + U(ux, 'm/s') + ' ในแนวราบ — ' +
          'ข้อนี้เป็นกับดักที่ออกสอบบ่อยมาก</span>'
      }
    };
  }
});

T({
  id: 'm-circ-F', topic: 7, sub: 'แรงสู่ศูนย์กลาง', level: 'ปานกลาง',
  skills: ['F = mv²/r', 'ระบุว่าแรงใดทำหน้าที่เป็นแรงสู่ศูนย์กลาง'],
  gen(R) {
    const m = R.pick([0.2, 0.5, 1, 2, 4, 5]);

      stem: 'ผูกวัตถุมวล ' + U(m, 'kg') + ' ไว้ปลายเชือกยาว ' + U(r, 'm') +
        ' แล้วแกว่งเป็นวงกลมใน<b>แนวราบ</b>ด้วยอัตราเร็วคงที่ ' + U(v, 'm/s') +

      figure: figCircle({ r: 'r = ' + fmt(r) + ' m', v: 'v = ' + fmt(v) + ' m/s', fc: 'T', m: 'm' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'v', v: v, unit: 'm/s', d: 'อัตราเร็วเชิงเส้น' },
              { s: 'r', v: r, unit: 'm', d: 'ความยาวเชือก = รัศมีวงกลม' }],
      finds: [{ s: 'a_c', unit: 'm/s²', d: 'ความเร่งสู่ศูนย์กลาง', value: a, positive: true },
              { s: 'T', unit: 'N', d: 'แรงตึงเชือก', value: F, positive: true }],
      sol: {
        analyze: '<b>ความเข้าใจผิดที่พบบ่อยที่สุด:</b> คิดว่า "แรงสู่ศูนย์กลาง" เป็นแรงชนิดใหม่ ' +
          'ที่ต้องเขียนเพิ่มลงในแผนภาพแรง — <b>ไม่ใช่</b><br>' +
          '<b>ความจริง:</b> "แรงสู่ศูนย์กลาง" เป็นเพียง<b>ชื่อเรียกบทบาท</b> ' +
          'ของแรงจริงที่มีอยู่แล้วซึ่งทำหน้าที่ดึงวัตถุให้เลี้ยวเข้าหาศูนย์กลาง<br>' +
          '• แกว่งเชือก → <b>แรงตึงเชือก</b> ทำหน้าที่นี้<br>' +
          '• รถเลี้ยวโค้ง → <b>แรงเสียดทาน</b> ทำหน้าที่นี้<br>' +
          '• ดาวเทียมโคจร → <b>แรงโน้มถ่วง</b> ทำหน้าที่นี้<br>' +
          'ข้อนี้แกว่งในแนวราบ แรงเดียวที่ชี้เข้าศูนย์กลางคือ<b>แรงตึงเชือก</b> ⇒ ' + M('T = m v^2 / r'),
        eqs: [{ eq: 'a_c = v^2 / r', why: 'ความเร่งสู่ศูนย์กลาง เกิดจากทิศของความเร็วที่เปลี่ยนตลอดเวลา' },
               { eq: 'ΣF_{เข้าศูนย์กลาง} = m a_c', why: 'กฎข้อที่สองของนิวตัน ประยุกต์กับแนวที่ชี้เข้าหาจุดศูนย์กลาง' },
               { eq: 'T = m v^2 / r', why: 'แรงตึงเชือกเป็นแรงเดียวที่ชี้เข้าศูนย์กลาง จึงเป็นแรงสู่ศูนย์กลางทั้งหมด' }],
        solve: EQ('a_c = v^2 / r', 'T = m a_c = m v^2 / r'),
        subst: SEQ('a_c = ({v})^2 / {r}', { v: v, r: r }) + SEQ('T = ({m})({a})', { m: m, a: a }),

        conclude: 'ดังนั้น <b>ความเร่งสู่ศูนย์กลาง = ' + U(a, 'm/s²') + '</b> และ ' +
          '<b>แรงตึงในเชือก = ' + U(F, 'N') + '</b><br>' +
          '<span class="hint"><b>คิดต่อให้ลึก:</b> ถ้าแกว่ง<b>เร็วขึ้นเป็นสองเท่า</b> ' +
          'แรงตึงเชือกจะเพิ่มเป็น <b>4 เท่า</b> (' + U(r2(4 * F), 'N') + ') เพราะ ' + M('v') + ' อยู่ในรูปกำลังสอง<br>' +
          'ถ้าเชือกทนแรงได้ไม่พอ<b>เชือกจะขาด</b> และวัตถุจะ<b>พุ่งออกไปเป็นเส้นตรงในแนวสัมผัส</b> ' +
          'ตามกฎความเฉื่อย ไม่ใช่พุ่งออกไปตามแนวรัศมี — เป็นข้อที่ออกสอบบ่อยมาก</span>'
      }
    };
  }
});

T({
  id: 'm-vert-top', topic: 7, sub: 'วงกลมในแนวดิ่ง', level: 'ปานกลาง',
  skills: ['เงื่อนไขที่จุดสูงสุด', 'น้ำหนักเป็นแรงสู่ศูนย์กลางได้'],
  gen(R, c) {
    const g = c.g;
    const r = R.pick([1.25, 2.5, 5, 10, 20, 22.5, 40, 45]);
    const v = r2(Math.sqrt(g * r));
    const m = R.pick([0.2, 0.5, 1, 2]);
    if (!ok2(v, r) || dpOf(v, 4) > 2 || v < 1 || v > 30) return null;
    return {
      stem: 'แกว่งวัตถุมวล ' + U(m, 'kg') + ' ผูกปลายเชือกเป็นวงกลมใน<b>แนวดิ่ง</b> รัศมี ' + U(r, 'm') +
        ' จงหา<b>อัตราเร็วต่ำสุดที่จุดสูงสุด</b>ที่ทำให้วัตถุยังเคลื่อนที่ครบวงได้โดยเชือกไม่หย่อน ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figCircle({ vert: true, r: 'r = ' + fmt(r) + ' m', fc: 'mg', m: 'm' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'r', v: r, unit: 'm', d: 'รัศมีของวงกลม' },
              { s: 'T', v: 0, unit: 'N', d: 'แรงตึงเชือกที่จุดสูงสุด (กรณีเร็วต่ำสุด)' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v_{ต่ำสุด}', unit: 'm/s', d: 'อัตราเร็วต่ำสุดที่จุดสูงสุด', value: v, positive: true }],
      sol: {
        analyze: '<b>วิเคราะห์แรงที่จุดสูงสุด</b> — จุดนี้พิเศษเพราะทั้งน้ำหนักและแรงตึงเชือก' +
          '<b>ชี้ลงล่างซึ่งเป็นทิศเข้าหาจุดศูนย์กลางพอดี</b> ทั้งคู่จึงเป็นแรงสู่ศูนย์กลางด้วยกัน<br>' +
          M('m g + T = m v^2 / r') + '<br>' +
          '<b>เงื่อนไข "อัตราเร็วต่ำสุด" หมายความว่าอย่างไร?</b><br>' +
          'ยิ่งช้าลง เชือกยิ่งต้องออกแรงน้อยลง จนถึงจุดที่<b>เชือกหย่อนพอดี</b> ⇒ ' + M('T = 0') + '<br>' +
          'ถ้าช้ากว่านี้อีก แรงโน้มถ่วงจะมากเกินกว่าที่จำเป็น วัตถุจะ<b>ตกหลุดจากวงกลม</b>ก่อนถึงยอด<br>' +
          'ที่จุดวิกฤตนี้ <b>น้ำหนักเพียงอย่างเดียวทำหน้าที่เป็นแรงสู่ศูนย์กลางพอดี</b>',
        eqs: [{ eq: 'm g + T = m v^2 / r', why: 'ที่จุดสูงสุด ทั้งน้ำหนักและแรงตึงเชือกชี้ลงเข้าหาศูนย์กลาง จึงบวกกัน' },
               { eq: 'm g = m v^2 / r', why: 'แทนเงื่อนไขวิกฤต T = 0 ซึ่งเป็นกรณีที่ช้าที่สุดเท่าที่ยังครบวงได้' },
               { eq: 'v = √(g r)', why: 'ตัดมวลออกทั้งสองข้าง อัตราเร็วต่ำสุดจึงไม่ขึ้นกับมวลเลย' }],
        solve: EQ('m g + T = m v^2 / r', 'm g = m v^2 / r', 'v^2 = g r', 'v = √(g r)'),
        subst: SEQ('v = √( ({g})({r}) )', { g: g, r: r }),
        calc: EQ('v = √' + fmtq(r2(g * r)) + ' = ' + fmtq(v) + ' `m/s`'),
        conclude: 'ดังนั้น <b>อัตราเร็วต่ำสุดที่จุดสูงสุด = ' + U(v, 'm/s') + '</b><br>' +
          '<span class="hint"><b>สังเกต:</b> คำตอบ<b>ไม่ขึ้นกับมวล</b>เลย — โจทย์ให้มวลมาเพื่อลวง<br>' +
          '<b>เปรียบเทียบกับจุดต่ำสุด:</b> ที่จุดต่ำสุด แรงตึงเชือกชี้<b>ขึ้น</b> ส่วนน้ำหนักชี้<b>ลง</b> ' +
          'สมการจึงกลายเป็น ' + M('T - m g = m v^2 / r') + ' ⇒ ' + M('T = m v^2/r + m g') + '<br>' +
          'แรงตึงที่จุดต่ำสุดจึง<b>มากกว่า</b>ที่จุดสูงสุดเสมอ — เชือกมักขาดที่จุดต่ำสุด<br>' +
          '<b>ประยุกต์ใช้จริง:</b> รถไฟเหาะตีลังกาก็ใช้หลักการเดียวกัน ' +
          'ต้องออกแบบให้ความเร็วที่ยอดวงเกิน ' + M('√(gr)') + ' ผู้โดยสารจึงไม่ร่วงลงมา</span>'
      }
    };
  }
});

T({
  id: 'm-shm-max', topic: 7, sub: 'การเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย', level: 'ปานกลาง',
  skills: ['ความสัมพันธ์ของ ω A ใน SHM', 'ตำแหน่งที่เร็วสุดกับเร่งสุด'],
  gen(R) {
    const w = R.pick([2, 3, 4, 5, 6, 8, 10]);
    const A = R.pick([0.05, 0.1, 0.2, 0.25, 0.4, 0.5]);
    const vm = r2(w * A), am = r2(w * w * A);
    const T = r2(6.28 / w);
    if (!ok2(vm, am, T) || vm < 0.1 || am > 500) return null;
    return {
      stem: 'วัตถุเคลื่อนที่แบบ<b>ฮาร์มอนิกอย่างง่าย</b>ด้วยความถี่เชิงมุม ' + U(w, 'rad/s') +
        ' และแอมพลิจูด ' + U(A, 'm') + ' จงหา<b>อัตราเร็วสูงสุด</b> และ<b>ขนาดของความเร่งสูงสุด</b>',
      given: [{ s: 'ω', v: w, unit: 'rad/s', d: 'ความถี่เชิงมุม' },
              { s: 'A', v: A, unit: 'm', d: 'แอมพลิจูด (การกระจัดสูงสุดจากจุดสมดุล)' }],
      finds: [{ s: 'v_{สูงสุด}', unit: 'm/s', d: 'อัตราเร็วสูงสุด (ที่จุดสมดุล)', value: vm, positive: true },
              { s: 'a_{สูงสุด}', unit: 'm/s²', d: 'ความเร่งสูงสุด (ที่ตำแหน่งปลายทาง)', value: am, positive: true }],
      sol: {
        analyze: '<b>การเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย (SHM)</b> คือการสั่นกลับไปกลับมารอบจุดสมดุล ' +
          'โดยมีแรงดึงกลับแปรผันตรงกับการกระจัดและมีทิศเข้าหาจุดสมดุลเสมอ (' + M('F = -k x') + ')<br>' +
          '<b>ภาพรวมที่ต้องเห็นให้ชัด — ตำแหน่งไหนเร็วสุด ตำแหน่งไหนเร่งสุด</b><br>' +
          '• ที่<b>จุดสมดุล</b> (' + M('x = 0') + '): การกระจัดเป็นศูนย์ ⇒ แรงดึงกลับเป็นศูนย์ ⇒ ' +
          '<b>ความเร่งเป็นศูนย์</b> แต่<b>อัตราเร็วสูงสุด</b><br>' +
          '• ที่<b>ปลายทาง</b> (' + M('x = ±A') + '): การกระจัดมากสุด ⇒ แรงดึงกลับมากสุด ⇒ ' +
          '<b>ความเร่งสูงสุด</b> แต่<b>หยุดนิ่งชั่วขณะ ความเร็วเป็นศูนย์</b><br>' +
          '<b>สรุปสั้น ๆ: เร็วสุดตรงกลาง เร่งสุดตรงปลาย — ไม่เคยเกิดพร้อมกัน</b>',
        eqs: [{ eq: 'v_{สูงสุด} = ω A', why: 'เกิดที่จุดสมดุล ซึ่งพลังงานทั้งหมดอยู่ในรูปพลังงานจลน์' },
               { eq: 'a_{สูงสุด} = ω^2 A', why: 'เกิดที่ตำแหน่งปลายทาง ซึ่งการกระจัดและแรงดึงกลับมีค่ามากที่สุด' }],
        solve: EQ('v_{สูงสุด} = ω A', 'a_{สูงสุด} = ω^2 A'),
        subst: SEQ('v_{สูงสุด} = ({w})({A})', { w: w, A: A }) +
               SEQ('a_{สูงสุด} = ({w})^2({A})', { w: w, A: A }),
        calc: EQ('v_{สูงสุด} = ' + fmtq(vm) + ' `m/s`',
                 'a_{สูงสุด} = (' + fmtq(w * w) + ')(' + fmtq(A) + ') = ' + fmtq(am) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>อัตราเร็วสูงสุด = ' + U(vm, 'm/s') + '</b> (เกิดที่จุดสมดุล) และ ' +
          '<b>ความเร่งสูงสุด = ' + U(am, 'm/s²') + '</b> (เกิดที่ตำแหน่งปลายทาง)<br>' +
          '<span class="hint"><b>คาบของการสั่น:</b> ' + M('T = 2π/ω = ' + fmt(T)) + ' วินาที ' +
          'แปลว่าสั่นครบรอบทุก ๆ ' + fmt(T) + ' วินาที<br>' +
          '<b>เรื่องที่นักเรียนมักงง:</b> คาบของ SHM <b>ไม่ขึ้นกับแอมพลิจูด</b> — ' +
          'ดึงสปริงออกไปไกลขึ้น มันก็ยังสั่นครบรอบในเวลาเท่าเดิม เพราะแรงดึงกลับก็มากขึ้นตามไปด้วยพอดี<br>' +
          'คุณสมบัตินี้เองที่ทำให้ลูกตุ้มนาฬิกาบอกเวลาได้เที่ยงตรง</span>'
      }
    };
  }
});

T({
  id: 'm-turn', topic: 7, sub: 'รถเลี้ยวโค้งบนถนนราบ', level: 'ปานกลาง',
  skills: ['แรงเสียดทานเป็นแรงสู่ศูนย์กลาง', 'ความเร็วสูงสุดที่ไม่ไถล'],
  gen(R, c) {
    const g = c.g;
    const mu = R.pick([0.2, 0.25, 0.4, 0.5, 0.8]);
    const r = R.pick([10, 20, 40, 45, 50, 80, 90, 125, 160, 180]);
    const v = r2(Math.sqrt(mu * g * r));
    if (!ok2(v) || dpOf(v, 4) > 2 || v < 3 || v > 45) return null;
    const car = R.pick(CARS);
    return {
      stem: esc(car) + 'กำลังเลี้ยวโค้งบนถนน<b>ราบ</b>ที่มีรัศมีความโค้ง ' + U(r, 'm') +
        ' สัมประสิทธิ์ความเสียดทานสถิตระหว่างยางกับถนนเท่ากับ ' + fmt(mu) +
        ' จงหา<b>อัตราเร็วสูงสุดที่' + esc(car) + 'จะเลี้ยวได้โดยไม่ไถลออกนอกโค้ง</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'r', v: r, unit: 'm', d: 'รัศมีความโค้งของถนน' },
              { s: 'μ_s', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานสถิต' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v_{สูงสุด}', unit: 'm/s', d: 'อัตราเร็วสูงสุดที่ไม่ไถล', value: v, positive: true }],
      sol: {
        analyze: '<b>คำถามหลัก: อะไรทำหน้าที่เป็นแรงสู่ศูนย์กลางให้รถเลี้ยว?</b><br>' +
          'ถนนราบ ⇒ แรงตั้งฉากชี้ขึ้น น้ำหนักชี้ลง ทั้งสองอยู่ในแนวดิ่ง ไม่ช่วยให้เลี้ยว<br>' +
          'แรงเดียวที่อยู่ในแนวราบและชี้เข้าหาจุดศูนย์กลางของโค้ง คือ<b>แรงเสียดทานที่ยาง</b><br>' +
          '<b>ข้อควรรู้:</b> ที่ใช้คือ<b>ความเสียดทานสถิต</b> ไม่ใช่จลน์ ' +
          'เพราะยางที่<b>กลิ้ง</b>โดยไม่ไถล จุดสัมผัสหยุดนิ่งเทียบกับถนนชั่วขณะ<br>' +
          'แรงเสียดทานสถิตมี<b>ค่าสูงสุด</b>ที่ ' + M('f_{สูงสุด} = μ_s N = μ_s m g') + '<br>' +
          'ถ้าต้องการแรงสู่ศูนย์กลางเกินกว่านี้ (คือขับเร็วเกินไป) ยางจะเอาไม่อยู่และ<b>ไถลออกนอกโค้ง</b>',
        eqs: [{ eq: 'N = m g', why: 'สมดุลในแนวดิ่งบนถนนราบ แรงตั้งฉากจึงเท่ากับน้ำหนักพอดี' },
               { eq: 'f = m v^2 / r', why: 'แรงเสียดทานทำหน้าที่เป็นแรงสู่ศูนย์กลางทั้งหมด' },
               { eq: 'μ_s m g = m v^2 / r', why: 'ที่ความเร็วสูงสุด แรงเสียดทานถูกใช้จนถึงค่าสูงสุดพอดี' },
               { eq: 'v = √(μ_s g r)', why: 'ตัดมวลออกทั้งสองข้าง — ความเร็วสูงสุดไม่ขึ้นกับมวลรถ' }],
        solve: EQ('μ_s m g = m v^2 / r', 'v^2 = μ_s g r', 'v = √(μ_s g r)'),
        subst: SEQ('v = √( ({mu})({g})({r}) )', { mu: mu, g: g, r: r }),
        calc: EQ('v = √' + fmtq(r2(mu * g * r)) + ' = ' + fmtq(v) + ' `m/s`'),
        conclude: 'ดังนั้น <b>อัตราเร็วสูงสุดที่เลี้ยวได้อย่างปลอดภัย = ' + U(v, 'm/s') + '</b> ' +
          '(ประมาณ ' + fmt(r2(v * 3.6)) + ' km/h)<br>' +
          '<span class="hint"><b>ข้อสรุปที่สำคัญมาก:</b> คำตอบ<b>ไม่ขึ้นกับมวลของรถ</b> — ' +
          'รถบรรทุกกับรถเก๋งเลี้ยวโค้งเดียวกันได้เร็วเท่ากัน (ถ้ายางเหมือนกัน)<br>' +
          '<b>เมื่อถนนเปียก</b> ' + M('μ_s') + ' ลดลงมาก ความเร็วปลอดภัยจึงลดลงตามรากที่สอง — ' +
          'ถ้า ' + M('μ_s') + ' เหลือครึ่งเดียว ความเร็วปลอดภัยจะเหลือ ' + M('1/√2 ≈ 0.71') + ' เท่า<br>' +
          '<b>ทำไมถนนโค้งจริงจึงยกขอบด้านนอกให้สูง?</b> เพื่อให้องค์ประกอบของ<b>แรงตั้งฉาก</b> ' +
          'ช่วยเป็นแรงสู่ศูนย์กลางอีกแรง ทำให้เลี้ยวได้เร็วขึ้นโดยไม่ต้องพึ่งความเสียดทานอย่างเดียว</span>'
      }
    };
  }
});

T({
  id: 'm-proj-fall', topic: 7, sub: 'ความเร็วขณะกระทบพื้นของโพรเจกไทล์', level: 'ยาก',
  skills: ['รวมความเร็วสองแนวเป็นเวกเตอร์', 'หามุมตกกระทบ'],
  gen(R, c) {
    const g = c.g, t = R.pick([1, 2, 3]);
    const vy = r2(g * t);
    const ux = r2(0.75 * vy);          // จัดให้เป็นสามเหลี่ยม 3-4-5 พอดี
    const v = r2(1.25 * vy);
    const h = r2(0.5 * g * t * t), x = r2(ux * t);
    if (!ok2(vy, ux, v, h, x)) return null;
    return {
      stem: 'ยิงลูกกลมออกไปใน<b>แนวราบ</b>ด้วยความเร็ว ' + U(ux, 'm/s') + ' จากยอดหอสูง ' +
        U(h, 'm') + ' จงหา<b>ระยะในแนวราบถึงจุดตก</b> <b>ขนาดของความเร็วขณะกระทบพื้น</b> ' +
        'และ<b>มุมที่ความเร็วขณะกระทบพื้นทำกับแนวราบ</b> (ไม่คิดแรงต้านอากาศ กำหนด ' + GTXT(g) + ')',
      figure: figProj({ mode: 'h', u: 'u = ' + fmt(ux) + ' m/s',
                        hlab: 'h = ' + fmt(h) + ' m', xlab: 'x = ?' }),
      given: [{ s: 'u_x', v: ux, unit: 'm/s', d: 'ความเร็วต้นในแนวราบ' },
              { s: 'h', v: h, unit: 'm', d: 'ความสูงของหอ' },

              { s: 'θ', unit: '°', d: 'มุมที่ความเร็วทำกับแนวราบ', value: 53, positive: true }],
      sol: {

          'เพราะทั้งสองตั้งฉากกัน จึงใช้พีทาโกรัสหาขนาด และแทนเจนต์หามุม<br>' +
          '<b>ข้อผิดพลาดที่พบบ่อยที่สุด:</b> เอา ' + M('u_x') + ' กับ ' + M('v_y') +
          ' <b>บวกกันตรง ๆ</b> ซึ่งผิด เพราะความเร็วเป็นเวกเตอร์<br>' +

          U(ux, 'm/s') + ' ตอนกระทบพื้น',
        eqs: [{ eq: 'h = (1/2) g t^2', why: 'แนวดิ่ง — หาเวลาที่ลูกกลมลอยอยู่ในอากาศ' },
               { eq: 'x = u_x t', why: 'แนวราบ — ความเร็วคงที่ คูณด้วยเวลาลอย' },
               { eq: 'v_y = g t', why: 'แนวดิ่ง — ความเร็วปลายจากการตกอิสระ เพราะความเร็วต้นแนวดิ่งเป็นศูนย์' },
               { eq: 'v = √(u_x^2 + v_y^2)', why: 'รวมสองแนวที่ตั้งฉากกันด้วยพีทาโกรัส ได้ขนาดของความเร็วจริง' },
               { eq: 'tan θ = v_y / u_x', why: 'มุมที่ความเร็วลัพธ์ทำกับแนวราบ หาจากอัตราส่วนของสองแนว' }],
        solve: EQ('t = √(2h / g)', 'x = u_x t', 'v_y = g t',
                  'v = √(u_x^2 + v_y^2)', 'θ = tan^{-1} (v_y / u_x)'),

                 'v = √(' + fmtq(r2(ux * ux)) + ' + ' + fmtq(r2(vy * vy)) + ') = ' + fmtq(v) + ' `m/s`',
                 'tan θ = ' + fmtq(vy) + ' / ' + fmtq(ux) + ' = 1.33  ⇒  θ = 53°'),

          '<b>ด้วยความเร็ว ' + U(v, 'm/s') + '</b> และ<b>ทำมุม 53° กับแนวราบ</b> (ชี้ลงล่าง)<br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> ' + M('u_x : v_y : v = ' + fmt(ux) + ' : ' + fmt(vy) + ' : ' + fmt(v)) +
          ' ย่อได้ 3 : 4 : 5 ✓ สามเหลี่ยมมุมฉากชุดคุ้นเคย<br>' +
          '<b>ตรวจอีกทางด้วยพลังงาน:</b> ' + M('(1/2)v^2 = (1/2)u_x^2 + g h') + ' ⇒ ' +
          M('v = √(' + fmt(r2(ux * ux)) + ' + ' + fmt(r2(2 * g * h)) + ') = ' + fmt(v)) + ' m/s ✓<br>' +
          '<b>สังเกต:</b> มุมตกกระทบ<b>ชันกว่ามุมยิง</b>เสมอในการยิงแนวราบ ' +
          'เพราะแนวดิ่งเร่งขึ้นเรื่อย ๆ ขณะที่แนวราบคงที่ — ยิ่งตกนาน เส้นทางยิ่งชันขึ้น</span>'
      }
    };
  }
});

T({
  id: 'm-banking', topic: 7, sub: 'ทางโค้งเอียง', level: 'ยาก',
  skills: ['แยกแรงตั้งฉากบนทางเอียง', 'ความเร็วออกแบบของทางโค้ง'],
  gen(R, c) {
    const g = c.g, deg = R.pick([37, 45]);
    const r = R.pick([5, 10, 20, 45, 60, 80, 125, 180, 240]);
    const tn = tanD(deg);
    const v = r2(Math.sqrt(r * g * tn));
    const a = r2(v * v / r);
    if (!ok2(v, a) || dpOf(v, 4) > 2 || v < 3 || v > 60) return null;
    const car = R.pick(CARS);
    return {
      stem: 'ถนนโค้งรัศมี ' + U(r, 'm') + ' ถูกออกแบบให้<b>ยกขอบด้านนอกขึ้นทำมุม ' + fmt(deg) +
        '° กับแนวราบ</b> เพื่อให้' + esc(car) + 'เลี้ยวได้โดย<b>ไม่ต้องอาศัยแรงเสียดทานเลย</b> ' +
        'จงหา<b>อัตราเร็วที่ออกแบบไว้</b>สำหรับทางโค้งนี้ และ<b>ความเร่งสู่ศูนย์กลาง</b>ที่อัตราเร็วนั้น ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figIncline({ deg: deg, mass: 'm', down: 'mg', up: 'N' }),
      given: [{ s: 'r', v: r, unit: 'm', d: 'รัศมีความโค้งของถนน' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมที่ยกขอบถนน' },
              { s: 'f', v: 0, unit: 'N', d: 'ไม่ใช้แรงเสียดทาน (ตามเงื่อนไขโจทย์)' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v', unit: 'm/s', d: 'อัตราเร็วที่ออกแบบไว้', value: v, positive: true },
              { s: 'a_c', unit: 'm/s²', d: 'ความเร่งสู่ศูนย์กลาง', value: a, positive: true }],
      sol: {
        analyze: '<b>โจทย์นี้ต้องระวังเรื่องการเลือกแกนให้มาก</b><br>' +
          'ไม่มีแรงเสียดทาน ⇒ เหลือเพียง<b>สองแรง</b> คือ<b>น้ำหนัก</b> ' + M('mg') +
          ' (ชี้ลงในแนวดิ่ง) และ<b>แรงตั้งฉาก</b> ' + M('N') + ' (ตั้งฉากกับผิวถนนที่เอียงอยู่)<br>' +
          '<b>จุดสำคัญ:</b> รถวิ่งเป็นวงกลมใน<b>ระนาบราบ</b> ความเร่งสู่ศูนย์กลางจึงอยู่ใน<b>แนวราบ</b> ' +
          'ไม่ได้ขนานกับพื้นถนน<br>' +
          '<b>จึงต้องแยกแกนตามแนวราบ-แนวดิ่ง ไม่ใช่แยกตามพื้นเอียงแบบโจทย์พื้นเอียงทั่วไป</b><br>' +
          'แยกแรง ' + M('N') + ' ออกเป็นสองส่วน:<br>' +
          '• แนวดิ่ง ' + M('N cos θ') + ' → ต้องสมดุลกับน้ำหนัก เพราะรถไม่ได้ลอยขึ้นหรือจมลง<br>' +
          '• แนวราบ ' + M('N sin θ') + ' → <b>ส่วนนี้เองที่ทำหน้าที่เป็นแรงสู่ศูนย์กลาง</b><br>' +
          'ค่าที่ใช้: ' + M('tan ' + deg + '° = ' + fmtq(tn)),
        eqs: [{ eq: 'N cos θ = m g', why: 'สมดุลในแนวดิ่ง — รถไม่มีความเร่งขึ้นหรือลง' },
               { eq: 'N sin θ = m v^2 / r', why: 'องค์ประกอบแนวราบของแรงตั้งฉาก ทำหน้าที่เป็นแรงสู่ศูนย์กลางทั้งหมด' },
               { eq: 'tan θ = v^2 / (r g)', why: 'นำสองสมการมาหารกัน ทั้ง N และ m ตัดกันหมดในคราวเดียว' }],
        solve: EQ('(N sin θ) / (N cos θ) = (m v^2 / r) / (m g)', 'tan θ = v^2 / (r g)',
                  'v = √(r g tan θ)'),
        subst: SEQ('v = √( ({r})({g})({t}) )', { r: r, g: g, t: tn }) +
               SEQ('a_c = {v}^2 / {r}', { v: v, r: r }),
        calc: EQ('v = √' + fmtq(r2(r * g * tn)) + ' = ' + fmtq(v) + ' `m/s`',
                 'a_c = ' + fmtq(r2(v * v)) + ' / ' + fmtq(r) + ' = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>อัตราเร็วที่ออกแบบไว้ = ' + U(v, 'm/s') + '</b> ' +
          '(ประมาณ ' + fmt(r2(v * 3.6)) + ' km/h) และ<b>ความเร่งสู่ศูนย์กลาง = ' + U(a, 'm/s²') + '</b><br>' +
          '<span class="hint"><b>ความหมายของ "ความเร็วออกแบบ":</b> ที่ความเร็วนี้พอดี ' +
          'รถจะเลี้ยวได้โดยยาง<b>ไม่ต้องออกแรงเสียดทานเลย</b> — นุ่มนวลและปลอดภัยที่สุด<br>' +
          '• ขับ<b>ช้ากว่า</b>นี้ → รถมีแนวโน้ม<b>ไถลลงด้านใน</b> ต้องอาศัยแรงเสียดทานชี้ออกช่วย<br>' +
          '• ขับ<b>เร็วกว่า</b>นี้ → รถมีแนวโน้ม<b>ไถลออกด้านนอก</b> ต้องอาศัยแรงเสียดทานชี้เข้าช่วย<br>' +
          '<b>สังเกต:</b> คำตอบ<b>ไม่ขึ้นกับมวลของรถ</b> ทางโค้งเดียวกันจึงใช้ได้กับรถทุกขนาด ' +
          'ซึ่งเป็นเหตุผลที่วิศวกรออกแบบทางโค้งได้โดยไม่ต้องรู้ว่าจะมีรถอะไรมาวิ่งบ้าง</span>'
      }
    };
  }
});

T({
  id: 'm-loop', topic: 7, sub: 'รางวงกลมแนวดิ่งกับพลังงาน', level: 'ยาก',
  skills: ['ผสมอนุรักษ์พลังงานกับแรงสู่ศูนย์กลาง', 'หาความสูงต่ำสุดที่ผ่านห่วงได้'],
  gen(R, c) {
    const g = c.g;
    const r = R.pick([1.25, 2.5, 5, 10, 20, 22.5, 40]);
    const vt = r2(Math.sqrt(g * r));
    const h = r2(2.5 * r);
    const m = R.pick([0.2, 0.5, 1, 2]);
    if (!ok2(vt, h) || dpOf(vt, 4) > 2 || vt < 1 || h > 150) return null;
    return {
      stem: 'ปล่อยลูกกลมมวล ' + U(m, 'kg') + ' จากหยุดนิ่งบนราง<b>ลื่น</b> ให้ไถลลงมาแล้ววิ่งเข้า ' +
        '<b>ห่วงวงกลมแนวดิ่ง</b>รัศมี ' + U(r, 'm') +
        ' จงหา<b>อัตราเร็วต่ำสุดที่จุดสูงสุดของห่วง</b> และ<b>ความสูงต่ำสุดของจุดปล่อย</b> ' +
        'ที่ทำให้ลูกกลมวิ่งครบห่วงได้พอดี (กำหนด ' + GTXT(g) + ')',
      figure: figCircle({ vert: true, r: 'r = ' + fmt(r) + ' m', fc: 'mg', m: 'm' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของลูกกลม' },
              { s: 'r', v: r, unit: 'm', d: 'รัศมีของห่วงวงกลม' },
              { s: 'u', v: 0, unit: 'm/s', d: 'ปล่อยจากหยุดนิ่ง' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v_{ยอด}', unit: 'm/s', d: 'อัตราเร็วต่ำสุดที่จุดสูงสุดของห่วง', value: vt, positive: true },
              { s: 'h_{ต่ำสุด}', unit: 'm', d: 'ความสูงต่ำสุดของจุดปล่อย', value: h, positive: true }],
      sol: {
        analyze: '<b>โจทย์คลาสสิกที่รวมสองบทเข้าด้วยกัน</b> ต้องใช้ทั้งแรงสู่ศูนย์กลางและอนุรักษ์พลังงาน<br>' +
          '<b>ขั้นที่ 1 — หาเงื่อนไขที่จุดสูงสุดของห่วง (ใช้แรงสู่ศูนย์กลาง)</b><br>' +
          'ที่ยอดห่วง ทั้งน้ำหนักและแรงที่รางกดต่างชี้ลงเข้าหาศูนย์กลาง ⇒ ' + M('m g + N = m v^2/r') + '<br>' +
          'กรณี "พอดี" คือรางแทบไม่ต้องออกแรงเลย ⇒ ' + M('N = 0') + ' ⇒ ' + M('v_{ยอด} = √(g r)') + '<br>' +
          '<b>ขั้นที่ 2 — เชื่อมจุดปล่อยกับยอดห่วง (ใช้อนุรักษ์พลังงาน)</b><br>' +
          'รางลื่น พลังงานกลอนุรักษ์ โดยยอดห่วงอยู่สูงจากพื้น ' + M('2r') + ' (ไม่ใช่ ' + M('r') + ')<br>' +
          M('m g h = m g (2r) + (1/2) m v_{ยอด}^2') + '<br>' +
          '<b>จุดที่พลาดกันมากที่สุดคือลืมว่าความสูงของยอดห่วงเท่ากับ 2r</b>',
        eqs: [{ eq: 'm g = m v_{ยอด}^2 / r', why: 'เงื่อนไขวิกฤตที่ยอดห่วง เมื่อแรงจากรางเป็นศูนย์พอดี' },
               { eq: 'v_{ยอด} = √(g r)', why: 'ตัดมวลออก อัตราเร็วต่ำสุดที่ยอดจึงขึ้นกับรัศมีเท่านั้น' },
               { eq: 'm g h = m g (2r) + (1/2) m v_{ยอด}^2',
                 why: 'อนุรักษ์พลังงานกลจากจุดปล่อยถึงยอดห่วง — รางลื่นจึงไม่มีพลังงานสูญเสีย' },
               { eq: 'h = 2r + r/2 = 2.5 r', why: 'แทน v² = gr แล้วตัด m กับ g ออก ได้ผลลัพธ์ที่สวยงามและจำง่าย' }],
        solve: EQ('v_{ยอด} = √(g r)', 'g h = 2 g r + (1/2)(g r)', 'h = 2r + 0.5r = 2.5 r'),
        subst: SEQ('v_{ยอด} = √( ({g})({r}) )', { g: g, r: r }) +
               SEQ('h = 2.5 × {r}', { r: r }),
        calc: EQ('v_{ยอด} = √' + fmtq(r2(g * r)) + ' = ' + fmtq(vt) + ' `m/s`',
                 'h = ' + fmtq(h) + ' `m`'),
        conclude: 'ดังนั้น <b>อัตราเร็วต่ำสุดที่ยอดห่วง = ' + U(vt, 'm/s') + '</b> และ ' +
          '<b>ต้องปล่อยจากความสูงอย่างน้อย ' + U(h, 'm') + '</b><br>' +
          '<span class="hint"><b>ผลลัพธ์ที่ควรจำขึ้นใจ: ' + M('h_{ต่ำสุด} = 2.5 r') + '</b> ' +
          'ออกสอบบ่อยมากและใช้ได้กับทุกกรณีที่รางลื่น<br>' +
          '<b>ตรวจสอบด้วยพลังงาน:</b> ที่จุดปล่อย ' + M('E_p = m g h = ' + fmt(r2(m * g * h))) + ' J<br>' +
          'ที่ยอดห่วง ' + M('E_p = ' + fmt(r2(m * g * 2 * r))) + ' J และ ' +
          M('E_k = ' + fmt(r2(0.5 * m * vt * vt))) + ' J รวมได้ ' + fmt(r2(m * g * 2 * r + 0.5 * m * vt * vt)) +
          ' J เท่ากันพอดี ✓<br>' +
          '<b>คิดต่อ:</b> ถ้ารางมีความเสียดทาน ต้องปล่อยจากที่<b>สูงกว่านี้</b> ' +
          'เพื่อชดเชยพลังงานที่จะสูญเสียไปเป็นความร้อนระหว่างทาง</span>'
      }
    };
  }
});

T({
  id: 'm-shm-x', topic: 7, sub: 'ความเร็วและความเร่งที่ตำแหน่งใด ๆ ใน SHM', level: 'ยาก',
  skills: ['v = ω√(A²-x²)', 'พลังงานใน SHM'],
  gen(R) {
    const tri = R.pick([[5, 3, 4], [5, 4, 3], [10, 6, 8], [10, 8, 6], [13, 5, 12], [13, 12, 5], [25, 7, 24]]);
    const sc = R.pick([0.02, 0.04, 0.1]);
    const A = r2(tri[0] * sc), x = r2(tri[1] * sc), q = r2(tri[2] * sc);
    const w = R.pick([2, 4, 5, 10]);
    const v = r2(w * q), a = r2(w * w * x);
    const kk = R.pick([50, 100, 200, 400]);
    const E = r2(0.5 * kk * A * A);
    if (!ok2(A, x, v, a, E) || A < 0.05 || v < 0.05 || a > 300 || E < 0.05) return null;
    return {
      stem: 'วัตถุเคลื่อนที่แบบฮาร์มอนิกอย่างง่ายด้วยความถี่เชิงมุม ' + U(w, 'rad/s') +

/* ============================ พิเศษ : แนวข้อสอบเข้ามหาวิทยาลัย ============

   ทุกข้อมีหัวข้อ "กับดักของข้อนี้" อยู่ในขั้นวิเคราะห์โจทย์

T({
  id: 'x-graph', topic: 8, sub: 'อ่านกราฟความเร็ว-เวลา', level: 'ง่าย',
  skills: ['พื้นที่ใต้กราฟคือการกระจัด', 'ความชันของกราฟคือความเร่ง'],
  gen(R) {
    const v = R.pick([10, 12, 15, 20, 24, 30]);
    const t1 = R.pick([2, 4, 5]), t2 = t1 + R.pick([4, 6, 8, 10]), t3 = t2 + R.pick([2, 4, 5]);
    const s = r2(0.5 * (t3 + (t2 - t1)) * v);
    const a1 = r2(v / t1);
    if (!ok2(s, a1) || s > 5000) return null;
    return {
      stem: 'กราฟความเร็ว-เวลาของวัตถุที่เคลื่อนที่ในแนวตรงเป็นดังรูป ' +
        'จงหา<b>การกระจัดรวมตลอด ' + fmt(t3) + ' วินาที</b>',
      figure: figVT({ tmax: t3, vmax: v, vmin: 0, tstep: 4, vstep: 4,
                      pts: [[0, 0], [t1, v], [t2, v], [t3, 0]] }),
      given: [{ s: 'v_{สูงสุด}', v: v, unit: 'm/s', d: 'ความเร็วช่วงคงที่' },
              { s: 't_1', v: t1, unit: 's', d: 'สิ้นสุดช่วงเร่ง' },
              { s: 't_2', v: t2, unit: 's', d: 'สิ้นสุดช่วงความเร็วคงที่' },
              { s: 't_3', v: t3, unit: 's', d: 'หยุดนิ่ง' }],
      finds: [{ s: 's', unit: 'm', d: 'การกระจัดรวม', value: s, positive: true }],
      distract: [r2(v * t3), r2(s / 2), r2(s * 2), r2(v * (t2 - t1)), r2(0.5 * v * t3), a1],
      sol: {
        analyze: '<b>กับดักของข้อนี้:</b> หลายคนคูณ ' + M('v × t') +
          ' ตรง ๆ ซึ่งใช้ได้เฉพาะกรณีความเร็วคงที่ตลอดเท่านั้น<br>' +
          '<b>กฎทองของกราฟ v–t ที่ต้องจำ</b><br>' +
          '• <b>ความชัน</b>ของกราฟ = <b>ความเร่ง</b><br>' +
          '• <b>พื้นที่ใต้กราฟ</b> = <b>การกระจัด</b><br>' +
          'กราฟข้อนี้แบ่งได้ 3 ช่วง คือ เร่งขึ้น → ความเร็วคงที่ → ชะลอจนหยุด ' +
          'รวมกันเป็นรูป<b>สี่เหลี่ยมคางหมู</b><br>' +
          'ด้านคู่ขนานคือ ฐานยาว ' + M('t_3 = ' + fmt(t3)) + ' s และฐานสั้น ' +
          M('t_2 - t_1 = ' + fmt(t2 - t1)) + ' s ส่วนความสูงคือ ' + M('v = ' + fmt(v)) + ' m/s',
        eqs: [{ eq: 's = พื้นที่ใต้กราฟ', why: 'ความหมายทางเรขาคณิตของการกระจัดในกราฟความเร็ว-เวลา' },
               { eq: 's = (1/2)(ฐานยาว + ฐานสั้น) × สูง', why: 'สูตรพื้นที่สี่เหลี่ยมคางหมู ซึ่งเป็นรูปที่กราฟนี้สร้างขึ้น' }],
        solve: EQ('s = (1/2)(t_3 + (t_2 - t_1)) × v'),
        subst: SEQ('s = (1/2)({a} + {b}) × {v}', { a: t3, b: t2 - t1, v: v }),
        calc: EQ('s = (1/2)(' + fmtq(t3 + t2 - t1) + ')(' + fmtq(v) + ')', 's = ' + fmtq(s) + ' `m`'),
        conclude: 'ดังนั้น <b>การกระจัดรวม = ' + U(s, 'm') + '</b><br>' +
          '<span class="hint"><b>ข้อมูลเพิ่มที่อ่านได้จากกราฟเดียวกันนี้</b><br>' +
          '• ความเร่งช่วงแรก = ความชัน = ' + M(fmt(v) + '/' + fmt(t1) + ' = ' + fmt(a1)) + ' m/s²<br>' +
          '• ความเร่งช่วงสุดท้าย = ' + M('-' + fmt(v) + '/' + fmt(t3 - t2) + ' = ' + fmt(r2(-v / (t3 - t2)))) +
          ' m/s² (เป็นลบ เพราะชะลอลง)<br>' +
          '• อัตราเร็วเฉลี่ยตลอดการเดินทาง = ' + M(fmt(s) + '/' + fmt(t3) + ' = ' + fmt(r2(s / t3))) + ' m/s<br>' +
          '<b>เทคนิคห้องสอบ:</b> ข้อสอบชอบให้กราฟที่มีช่วงความเร็ว<b>ติดลบ</b>ด้วย ' +
          'ให้จำว่าพื้นที่ใต้แกนต้องคิดเป็น<b>ลบ</b>เมื่อถามการกระจัด แต่คิดเป็น<b>บวก</b>เมื่อถามระยะทาง</span>'
      }
    };
  }
});

T({

        ' จงหา<b>อัตราเร็วขณะกระทบพื้น</b> (ไม่คิดแรงต้านอากาศ กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'h', v: h, unit: 'm', d: 'ความสูงที่ปล่อย' },
              { s: 'u', v: 0, unit: 'm/s', d: 'ปล่อยจากหยุดนิ่ง' },

      finds: [{ s: 'v', unit: 'm/s', d: 'อัตราเร็วขณะกระทบพื้น', value: v, positive: true }],
      distract: [r2(2 * g * h), r2(g * h), r2(v / 2), r2(v * 2), round2(Math.sqrt(g * h)), h],
      sol: {
        analyze: '<b>กับดักของข้อนี้:</b> หลายคนตอบ ' + M('2gh') + ' โดยลืมถอดรากที่สอง<br>' +
          'ข้อนี้ทำได้<b>สองวิธี</b> และควรฝึกให้ทำได้ทั้งคู่ เพราะข้อสอบชอบวัดว่าเลือกวิธีที่เร็วกว่าเป็นไหม<br>' +
          '<b>วิธีที่ 1 — สมการการเคลื่อนที่ (บทที่ 2)</b><br>' +
          'มี ' + M('u = 0, a = g, s = h') + ' ต้องการ ' + M('v') + ' และ<b>ไม่เกี่ยวกับเวลา</b> ' +
          'จึงเลือกสมการที่ไม่มี ' + M('t') + ' คือ ' + M('v^2 = u^2 + 2as') + '<br>' +
          '<b>วิธีที่ 2 — อนุรักษ์พลังงานกล (บทที่ 5)</b><br>' +
          M('m g h = (1/2) m v^2') + ' ⇒ มวลตัดกัน ⇒ ' + M('v = √(2gh)') + '<br>' +

               { eq: 'v = √(2 g h)', why: 'แทน u = 0 แล้วถอดรากที่สอง — สูตรนี้ใช้บ่อยมากควรจำ' }],
        solve: EQ('v^2 = 0 + 2 g h', 'v = √(2 g h)'),

T({

        calc: EQ('E_k = ' + fmtq(p * p) + ' / ' + fmtq(2 * m), 'E_k = ' + fmtq(Ek) + ' `J`'),
        conclude: 'ดังนั้น <b>พลังงานจลน์ = ' + U(Ek, 'J') + '</b><br>' +
          '<span class="hint"><b>ข้อสรุปที่ใช้ตอบข้อสอบเชิงเปรียบเทียบได้ทันที</b><br>' +
          '• โมเมนตัม<b>เท่ากัน</b> ⇒ วัตถุที่<b>มวลน้อยกว่า</b>มีพลังงานจลน์<b>มากกว่า</b><br>' +
          '• พลังงานจลน์<b>เท่ากัน</b> ⇒ วัตถุที่<b>มวลมากกว่า</b>มีโมเมนตัม<b>มากกว่า</b> (' + M('p = √(2mE_k)') + ')<br>' +
          'สองข้อนี้อธิบายได้ว่าทำไมปืนถอยหลังเบา ๆ แต่กระสุนพุ่งด้วยพลังงานมหาศาล</span>'
      }
    };
  }
});

T({
  id: 'x-lift', topic: 8, sub: 'น้ำหนักที่ปรากฏในลิฟต์', level: 'ง่าย',
  skills: ['กฎข้อที่สองในกรอบเร่ง', 'แยกน้ำหนักจริงกับน้ำหนักที่ชั่งได้'],
  gen(R, c) {
    const g = c.g, m = R.pick([40, 50, 60, 70, 80]);
    const a = R.pick([1, 1.5, 2, 2.5, 3]);
    const up = R.f() < 0.5;
    const N = r2(m * (g + (up ? a : -a)));
    if (!ok2(N) || N < 10) return null;
    return {
      stem: 'คนมวล ' + U(m, 'kg') + ' ยืนบนตาชั่งในลิฟต์ ขณะที่ลิฟต์กำลังเคลื่อนที่โดยมี' +
        '<b>ความเร่ง ' + fmt(a) + ' m/s² มีทิศ' + (up ? 'ขึ้น' : 'ลง') + '</b> ' +
        'จงหา<b>แรงที่ตาชั่งอ่านได้</b> (กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของคน' },
              { s: 'a', v: a, unit: 'm/s²', d: 'ความเร่งของลิฟต์ ทิศ' + (up ? 'ขึ้น' : 'ลง') },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'N', unit: 'N', d: 'แรงที่ตาชั่งอ่านได้', value: N, positive: true }],
      distract: [r2(m * g), r2(m * (g - (up ? a : -a))), r2(m * a), r2(N / 2), r2(N * 2), r2(g + a)],
      sol: {
        analyze: '<b>กับดักของข้อนี้:</b> ตาชั่งไม่ได้อ่าน "น้ำหนัก" ของเรา ' +
          'แต่อ่าน<b>แรงที่พื้นตาชั่งดันเท้าเรา</b> ซึ่งก็คือ<b>แรงตั้งฉาก</b> ' + M('N') + '<br>' +
          '<b>น้ำหนักจริง</b> ' + M('mg = ' + fmt(r2(m * g))) + ' N <b>ไม่เคยเปลี่ยน</b>เลย ' +
          'สิ่งที่เปลี่ยนคือค่าที่ตาชั่งอ่านได้เท่านั้น<br>' +
          'เขียนสมการตามกฎข้อที่สอง โดยให้<b>ทิศของความเร่งเป็นบวก</b><br>' +
          (up ? 'ลิฟต์เร่งขึ้น ⇒ แรงลัพธ์ต้องชี้ขึ้น ⇒ ' + M('N > mg') + ' ⇒ ' + M('N - m g = m a')
              : 'ลิฟต์เร่งลง ⇒ แรงลัพธ์ต้องชี้ลง ⇒ ' + M('N < mg') + ' ⇒ ' + M('m g - N = m a')) + '<br>' +
          '<b>ตรวจสอบสามัญสำนึกก่อนคิดเลข:</b> ตอนลิฟต์ออกตัวขึ้น เรารู้สึก<b>ตัวหนัก</b> ' +
          'ตอนลิฟต์ออกตัวลง เรารู้สึก<b>ตัวเบา</b> — ข้อนี้คำตอบจึงต้อง' +
          (up ? '<b>มากกว่า</b>' : '<b>น้อยกว่า</b>') + ' ' + fmt(r2(m * g)) + ' N',
        eqs: [{ eq: up ? 'N - m g = m a' : 'm g - N = m a',
                why: 'กฎข้อที่สองของนิวตันในแนวดิ่ง โดยตั้งทิศของความเร่งเป็นบวก' },
               { eq: 'N = m (g ' + (up ? '+' : '-') + ' a)',
                 why: 'จัดรูปแก้หาแรงที่ตาชั่งอ่านได้ — เครื่องหมายบอกว่าตัวหนักขึ้นหรือเบาลง' }],
        solve: EQ('N = m (g ' + (up ? '+' : '-') + ' a)'),
        subst: SEQ('N = ({m})({g} ' + (up ? '+' : '-') + ' {a})', { m: m, g: g, a: a }),
        calc: EQ('N = (' + fmtq(m) + ')(' + fmtq(up ? g + a : g - a) + ')', 'N = ' + fmtq(N) + ' `N`'),
        conclude: 'ดังนั้น <b>ตาชั่งอ่านได้ ' + U(N, 'N') + '</b> ซึ่ง' +
          (up ? '<b>มากกว่า</b>' : '<b>น้อยกว่า</b>') + 'น้ำหนักจริง ' + U(r2(m * g), 'N') + '<br>' +
          '<span class="hint"><b>สี่กรณีที่ต้องแยกให้ออก</b><br>' +
          '1. ลิฟต์<b>อยู่นิ่ง</b>หรือ<b>ความเร็วคงที่</b> ⇒ ' + M('a = 0') + ' ⇒ ' + M('N = mg') +
          ' อ่านได้เท่าน้ำหนักจริง<br>' +
          '2. เร่ง<b>ขึ้น</b> ⇒ ' + M('N > mg') + ' รู้สึกตัวหนัก<br>' +
          '3. เร่ง<b>ลง</b> ⇒ ' + M('N < mg') + ' รู้สึกตัวเบา<br>' +
          '4. <b>สายลิฟต์ขาด</b> ⇒ ' + M('a = g') + ' ⇒ ' + M('N = 0') +
          ' คือสภาพ<b>ไร้น้ำหนัก</b> — เป็นสภาวะเดียวกับนักบินอวกาศบนสถานีอวกาศ ' +
          'ซึ่งกำลัง "ตกอิสระ" รอบโลกอยู่ตลอดเวลา</span>'
      }
    };
  }
});

T({
  id: 'x-atwood', topic: 8, sub: 'เครื่องแอตวูดกับพลังงาน', level: 'ปานกลาง',
  skills: ['ระบบสองมวลเชื่อมกัน', 'ผสมกฎการเคลื่อนที่กับสมการการเคลื่อนที่'],
  gen(R, c) {
    const g = c.g, pr = R.pick([[3, 1], [5, 3], [7, 1], [9, 3], [7, 3], [6, 2], [10, 6], [15, 5], [9, 1]]);
    const m1 = pr[0], m2 = pr[1];
    const a = r2((m1 - m2) * g / (m1 + m2));
    const Tn = r2(2 * m1 * m2 * g / (m1 + m2));
    const h = R.pick([2, 4, 5, 8, 10, 15, 20, 25, 30, 40, 45, 50, 60, 80]);
    const v = r2(Math.sqrt(2 * a * h));
    if (!ok2(a, Tn, v) || dpOf(v, 4) > 2 || v < 1) return null;
    return {
      stem: 'มวล ' + U(m1, 'kg') + ' และ ' + U(m2, 'kg') + ' ผูกด้วยเชือกเบาคล้องผ่าน<b>รอกลื่นมวลเบา</b> ' +
        'ปล่อยระบบจากหยุดนิ่ง จงหา<b>ความเร่งของระบบ</b> <b>แรงตึงเชือก</b> ' +
        'และ<b>อัตราเร็วของมวลที่หนักกว่าเมื่อเคลื่อนที่ลงมาได้ ' + fmt(h) + ' เมตร</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figPulley({ m1: 'm₂', m2: 'm₁' }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลก้อนหนัก (เคลื่อนที่ลง)' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลก้อนเบา (เคลื่อนที่ขึ้น)' },
              { s: 'h', v: h, unit: 'm', d: 'ระยะที่เคลื่อนที่' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่งของระบบ', value: a, positive: true },
              { s: 'T', unit: 'N', d: 'แรงตึงเชือก', value: Tn, positive: true },
              { s: 'v', unit: 'm/s', d: 'อัตราเร็วหลังเคลื่อนที่ h', value: v, positive: true }],
      sol: {
        analyze: '<b>กับดักของข้อนี้:</b> คิดว่าแรงตึงเชือกเท่ากับน้ำหนักของก้อนใดก้อนหนึ่ง — <b>ผิด</b> ' +
          'เพราะทั้งสองก้อนกำลัง<b>เร่ง</b> ไม่ได้อยู่ในสมดุล<br>' +
          '<b>กลยุทธ์ที่เร็วที่สุด: มองทั้งระบบเป็นก้อนเดียว</b><br>' +
          'เชือกเบาและรอกลื่น ⇒ ทั้งสองก้อนมี<b>ขนาดความเร่งเท่ากัน</b> (เชือกไม่ยืด)<br>' +
          '• แรงที่<b>ขับ</b>ระบบ = น้ำหนักก้อนหนัก ' + M('m_1 g') + '<br>' +
          '• แรงที่<b>ต้าน</b>ระบบ = น้ำหนักก้อนเบา ' + M('m_2 g') + '<br>' +
          '• มวลที่ถูกเร่งทั้งหมด = ' + M('m_1 + m_2') + '<br>' +
          '<b>แรงตึงเชือกเป็นแรงภายในระบบ จึงหักล้างกันไปเมื่อมองทั้งระบบ</b> ' +
          'ต้องแยกก้อนใดก้อนหนึ่งออกมาต่างหากจึงจะหาได้<br>' +
          'ส่วนอัตราเร็วหลังเคลื่อนที่ ' + M('h') + ' ใช้สมการการเคลื่อนที่ธรรมดา ' +
          'เพราะความเร่งคงที่ (หรือใช้อนุรักษ์พลังงานก็ได้ผลเท่ากัน)',
        eqs: [{ eq: 'a = (m_1 - m_2) g / (m_1 + m_2)',
                why: 'มองทั้งระบบ: แรงลัพธ์ (m₁-m₂)g หารด้วยมวลรวมที่ถูกเร่ง (m₁+m₂)' },
               { eq: 'T = m_2 (g + a)', why: 'แยกพิจารณาก้อนเบาที่เคลื่อนที่ขึ้น: T - m₂g = m₂a' },
               { eq: 'v^2 = u^2 + 2 a h', why: 'ความเร่งคงที่ จึงใช้สมการการเคลื่อนที่แนวตรงได้ โดย u = 0' }],
        solve: EQ('a = (m_1 - m_2) g / (m_1 + m_2)', 'T = m_2 (g + a)', 'v = √(2 a h)'),
        subst: SEQ('a = ({m1} - {m2})({g}) / ({m1} + {m2})', { m1: m1, m2: m2, g: g }) +
               SEQ('T = ({m2})({g} + {a})', { m2: m2, g: g, a: a }) +
               SEQ('v = √(2 × {a} × {h})', { a: a, h: h }),
        calc: EQ('a = ' + fmtq(r2((m1 - m2) * g)) + ' / ' + fmtq(m1 + m2) + ' = ' + fmtq(a) + ' `m/s`^2',
                 'T = ' + fmtq(Tn) + ' `N`',
                 'v = √' + fmtq(r2(2 * a * h)) + ' = ' + fmtq(v) + ' `m/s`'),
        conclude: 'ดังนั้น <b>ความเร่งของระบบ = ' + U(a, 'm/s²') + '</b> <b>แรงตึงเชือก = ' +
          U(Tn, 'N') + '</b> และ<b>อัตราเร็วหลังเคลื่อนที่ ' + fmt(h) + ' เมตร = ' + U(v, 'm/s') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบแรงตึงเชือกด้วยช่วงที่เป็นไปได้</b><br>' +
          'ต้องอยู่ระหว่างน้ำหนักก้อนเบา ' + U(r2(m2 * g), 'N') + ' กับน้ำหนักก้อนหนัก ' +
          U(r2(m1 * g), 'N') + ' — ค่า ' + fmt(Tn) + ' N อยู่ในช่วงนี้ ✓<br>' +
          '<b>ตรวจสอบด้วยพลังงาน (อีกวิธีที่ให้คำตอบเดียวกัน)</b><br>' +
          M('(m_1 - m_2) g h = (1/2)(m_1 + m_2) v^2') + ' ⇒ ' +
          M('v = √(2 a h) = ' + fmt(v)) + ' m/s ✓<br>' +
          '<b>กรณีสุดขั้วที่ควรลองคิด:</b> ถ้า ' + M('m_1 = m_2') + ' ⇒ ' + M('a = 0') +
          ' ระบบสมดุลไม่ขยับ · ถ้า ' + M('m_2 = 0') + ' ⇒ ' + M('a = g') + ' กลายเป็นการตกอิสระ</span>'
      }
    };
  }
});

T({
  id: 'x-incfric', topic: 8, sub: 'พื้นเอียงมีความเสียดทาน', level: 'ปานกลาง',
  skills: ['แรงเสียดทานบนพื้นเอียง', 'ความเร่งลงเนิน'],
  gen(R, c) {
    const g = c.g, deg = 37, mu = R.pick([0.25, 0.5]);
    const a = r2(g * (sinD(deg) - mu * cosD(deg)));
    const t = R.pick([2, 3, 4, 5]);
    const v = r2(a * t), s = r2(0.5 * a * t * t);
    const m = R.pick([2, 4, 5, 10]);
    const f = r2(mu * m * g * cosD(deg));
    if (!ok2(a, v, s, f) || a < 0.5) return null;
    const box = R.pick(BOXES);
    return {
      stem: 'ปล่อย' + esc(box) + 'มวล ' + U(m, 'kg') + ' จากหยุดนิ่งบนพื้นเอียงที่ทำมุม ' + fmt(deg) +
        '° กับแนวราบ โดยมีสัมประสิทธิ์ความเสียดทานจลน์ระหว่างผิวสัมผัสเท่ากับ ' + fmt(mu) +
        ' จงหา<b>ความเร่งของ' + esc(box) + '</b> <b>อัตราเร็วเมื่อผ่านไป ' + fmt(t) + ' วินาที</b> ' +
        'และ<b>ระยะที่ไถลลงมาได้ในช่วงเวลานั้น</b> (กำหนด ' + GTXT(g) + ')',
      figure: figIncline({ deg: deg, mass: 'm', down: 'mg', fric: 'f' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมเอียงของพื้น' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานจลน์' },
              { s: 't', v: t, unit: 's', d: 'ช่วงเวลาที่พิจารณา' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่งลงตามพื้นเอียง', value: a, positive: true },
              { s: 'v', unit: 'm/s', d: 'อัตราเร็วเมื่อครบ t วินาที', value: v, positive: true },
              { s: 's', unit: 'm', d: 'ระยะที่ไถลลงมาได้', value: s, positive: true }],
      sol: {
        analyze: '<b>กับดักของข้อนี้:</b> ใช้ ' + M('N = mg') + ' — <b>ผิด!</b> ' +
          'บนพื้นเอียง แรงตั้งฉากไม่ได้เท่ากับน้ำหนัก แต่เท่ากับ<b>องค์ประกอบของน้ำหนักที่ตั้งฉากพื้น</b> ' +
          'คือ ' + M('N = m g cos θ') + '<br>' +
          '<b>ขั้นตอนมาตรฐาน:</b> หมุนแกนอ้างอิงให้<b>ขนานและตั้งฉากกับพื้นเอียง</b> ' +
          'เพราะการเคลื่อนที่เกิดตามพื้นเอียงเท่านั้น<br>' +
          '• <b>แนวตั้งฉากพื้นเอียง</b> (สมดุล ไม่มีการเคลื่อนที่): ' + M('N = m g cos θ') + '<br>' +
          '• <b>แนวขนานพื้นเอียง</b> (มีความเร่ง): แรงฉุดลง ' + M('m g sin θ') +
          ' หักด้วยแรงเสียดทาน ' + M('f = μ_k N') + '<br>' +
          'ได้ ' + M('m g sin θ - μ_k m g cos θ = m a') + ' ⇒ <b>มวลตัดกันหมด</b> ⇒ ' +
          M('a = g(sin θ - μ_k cos θ)') + '<br>' +
          'ค่าที่ใช้: ' + M('sin 37° = 0.6, cos 37° = 0.8') + ' ⇒ ' +
          M('sin θ - μ_k cos θ = 0.6 - (' + fmt(mu) + ')(0.8) = ' + fmtq(r2(sinD(deg) - mu * cosD(deg)))),
        eqs: [{ eq: 'N = m g cos θ', why: 'สมดุลในแนวตั้งฉากพื้นเอียง — แรงตั้งฉากมาจากองค์ประกอบของน้ำหนักเท่านั้น' },
               { eq: 'f = μ_k N = μ_k m g cos θ', why: 'แรงเสียดทานจลน์ ทิศตรงข้ามการเคลื่อนที่ คือชี้ขึ้นเนิน' },
               { eq: 'm g sin θ - f = m a', why: 'กฎข้อที่สองตามแนวพื้นเอียง โดยให้ทิศลงเนินเป็นบวก' },
               { eq: 'a = g (sin θ - μ_k cos θ)', why: 'ตัดมวลออก — ความเร่งไม่ขึ้นกับมวลของวัตถุเลย' }],
        solve: EQ('a = g (sin θ - μ_k cos θ)', 'v = u + a t = a t', 's = (1/2) a t^2'),
        subst: SEQ('a = ({g})(0.6 - ({mu})(0.8))', { g: g, mu: mu }) +
               SEQ('v = ({a})({t})', { a: a, t: t }) + SEQ('s = (1/2)({a})({t})^2', { a: a, t: t }),
        calc: EQ('a = (' + fmtq(g) + ')(' + fmtq(r2(sinD(deg) - mu * cosD(deg))) + ') = ' + fmtq(a) + ' `m/s`^2',
                 'v = ' + fmtq(v) + ' `m/s`', 's = ' + fmtq(s) + ' `m`'),
        conclude: 'ดังนั้น <b>ความเร่ง = ' + U(a, 'm/s²') + '</b> <b>อัตราเร็วเมื่อครบ ' + fmt(t) +
          ' วินาที = ' + U(v, 'm/s') + '</b> และ<b>ไถลลงมาได้ ' + U(s, 'm') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยแรงจริง:</b> แรงฉุดลงเนิน ' +

          '<b>คำถามที่ออกสอบต่อเสมอ:</b> วัตถุจะเริ่มไถลลงเองหรือไม่? ' +
          'เงื่อนไขคือ ' + M('tan θ > μ_s') + ' — ข้อนี้ ' + M('tan 37° = 0.75 > ' + fmt(mu)) + ' ✓ จึงไถลลงเอง<br>' +
          '<b>ข้อสังเกต:</b> ความเร่ง<b>ไม่ขึ้นกับมวล</b> ' + esc(box) +
          'หนักหรือเบาก็ไถลลงด้วยความเร่งเท่ากัน ตราบใดที่ผิวสัมผัสเหมือนกัน</span>'
      }
    };
  }
});

T({
  id: 'x-projnrg', topic: 8, sub: 'โพรเจกไทล์กับพลังงาน', level: 'ปานกลาง',
  skills: ['ที่จุดสูงสุดความเร็วไม่เป็นศูนย์', 'อนุรักษ์พลังงานในโพรเจกไทล์'],
  gen(R, c) {
    const g = c.g, deg = R.pick([37, 53]), tup = R.pick([1, 2, 3]);
    const uy = r2(g * tup), u = r2(uy / sinD(deg)), ux = r2(u * cosD(deg));
    const H = r2(0.5 * g * tup * tup);
    const m = R.pick([0.2, 0.5, 1, 2]);
    const Ek0 = r2(0.5 * m * u * u), EkH = r2(0.5 * m * ux * ux);
    if (!ok2(u, ux, H, Ek0, EkH) || u > 120 || Ek0 > 5000) return null;
    return {
      stem: 'ยิงลูกกลมมวล ' + U(m, 'kg') + ' จากพื้นด้วยความเร็วต้น ' + U(u, 'm/s') + ' ทำมุม ' +
        fmt(deg) + '° กับแนวราบ จงหา<b>ความสูงสูงสุด</b> <b>อัตราเร็วที่จุดสูงสุด</b> ' +
        'และ<b>พลังงานจลน์ที่จุดสูงสุด</b> (ไม่คิดแรงต้านอากาศ กำหนด ' + GTXT(g) + ')',
      figure: figProj({ mode: 'a', deg: deg, u: 'u = ' + fmt(u) + ' m/s', hlab: 'H', rlab: 'R' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของลูกกลม' },
              { s: 'u', v: u, unit: 'm/s', d: 'ความเร็วต้น' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมยิงกับแนวราบ' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'H', unit: 'm', d: 'ความสูงสูงสุด', value: H, positive: true },
              { s: 'v_{ยอด}', unit: 'm/s', d: 'อัตราเร็วที่จุดสูงสุด', value: ux, positive: true },
              { s: 'E_{k,ยอด}', unit: 'J', d: 'พลังงานจลน์ที่จุดสูงสุด', value: EkH, positive: true }],
      sol: {
        analyze: '<b>กับดักของข้อนี้ (ออกสอบบ่อยที่สุดในเรื่องโพรเจกไทล์):</b> ' +
          'ตอบว่าที่จุดสูงสุดความเร็วเป็นศูนย์ และพลังงานจลน์เป็นศูนย์ — <b>ผิดทั้งคู่</b><br>' +
          'ที่จุดสูงสุด เป็นเพียงความเร็วใน<b>แนวดิ่ง</b>เท่านั้นที่เป็นศูนย์ ' +
          'ส่วนความเร็วใน<b>แนวราบยังคงเดิมไม่เคยเปลี่ยน</b> เพราะไม่มีแรงในแนวราบมากระทำ<br>' +
          'แยกความเร็วต้น: ' + M('u_x = u cos θ = ' + fmt(ux)) + ' m/s (คงที่ตลอด) และ ' +
          M('u_y = u sin θ = ' + fmt(uy)) + ' m/s (ลดลงจนเป็นศูนย์ที่ยอด)<br>' +
          'ดังนั้นที่จุดสูงสุด อัตราเร็วยังเหลือ ' + M('u_x = ' + fmt(ux)) + ' m/s ' +
          'และมีพลังงานจลน์ ' + M('(1/2) m u_x^2') + ' อยู่<br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg + '° = ' + fmtq(sinD(deg)) + ', cos ' + deg + '° = ' + fmtq(cosD(deg))),
        eqs: [{ eq: 'H = (u sin θ)^2 / (2 g)', why: 'จาก v_y² = u_y² - 2gH โดยที่จุดสูงสุด v_y = 0' },
               { eq: 'v_{ยอด} = u cos θ', why: 'ที่จุดสูงสุดเหลือเพียงความเร็วแนวราบ ซึ่งคงที่ตลอดการเคลื่อนที่' },
               { eq: 'E_{k,ยอด} = (1/2) m v_{ยอด}^2', why: 'พลังงานจลน์คำนวณจากอัตราเร็วจริงที่จุดนั้น ไม่ใช่ศูนย์' }],
        solve: EQ('H = u_y^2 / (2 g)', 'v_{ยอด} = u_x = u cos θ', 'E_{k,ยอด} = (1/2) m v_{ยอด}^2'),
        subst: SEQ('H = ({uy})^2 / (2 × {g})', { uy: uy, g: g }) +
               SEQ('v_{ยอด} = ({u})({c})', { u: u, c: cosD(deg) }) +
               SEQ('E_{k,ยอด} = (1/2)({m})({vx})^2', { m: m, vx: ux }),
        calc: EQ('H = ' + fmtq(H) + ' `m`', 'v_{ยอด} = ' + fmtq(ux) + ' `m/s`',
                 'E_{k,ยอด} = ' + fmtq(EkH) + ' `J`'),
        conclude: 'ดังนั้น <b>ความสูงสูงสุด = ' + U(H, 'm') + '</b> <b>อัตราเร็วที่จุดสูงสุด = ' +
          U(ux, 'm/s') + '</b> และ<b>พลังงานจลน์ที่จุดสูงสุด = ' + U(EkH, 'J') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยการอนุรักษ์พลังงาน</b><br>' +
          'พลังงานจลน์ตอนยิง ' + M('(1/2) m u^2 = ' + fmt(Ek0)) + ' J<br>' +
          'ที่จุดสูงสุด: ' + M('E_k = ' + fmt(EkH)) + ' J บวก ' + M('E_p = m g H = ' + fmt(r2(m * g * H))) + ' J ' +
          'รวมได้ ' + fmt(r2(EkH + m * g * H)) + ' J เท่ากับตอนยิงพอดี ✓<br>' +
          '<b>ข้อสังเกตที่มักออกเป็นตัวเลือกลวง:</b> พลังงานจลน์ที่จุดสูงสุด<b>ไม่เป็นศูนย์</b> ' +
          'และ<b>ไม่ใช่ครึ่งหนึ่ง</b>ของตอนยิงด้วย — คิดเป็น ' +
          fmt(r2(EkH / Ek0 * 100)) + '% ของพลังงานจลน์เริ่มต้น</span>'
      }
    };
  }
});

T({
  id: 'x-collideproj', topic: 8, sub: 'ชนกันบนโต๊ะแล้วตกจากขอบ', level: 'ปานกลาง',
  skills: ['ต่อการชนเข้ากับโพรเจกไทล์', 'ใช้ผลลัพธ์ของช่วงหนึ่งเป็นข้อมูลของอีกช่วง'],
  gen(R, c) {
    const g = c.g, t = R.pick([1, 2, 3]);
    const h = r2(0.5 * g * t * t);
    const m1 = R.pick([2, 3, 4, 5]), m2 = R.pick([1, 2, 3, 4]);
    const v = R.pick([2, 3, 4, 5, 6]);
    const u1 = r2((m1 + m2) * v / m1);
    const x = r2(v * t);
    if (!ok2(h, u1, x) || u1 > 40) return null;
    return {
      stem: 'ก้อนวัตถุมวล ' + U(m1, 'kg') + ' ไถลมาบนโต๊ะ<b>ลื่น</b>สูง ' + U(h, 'm') +
        ' เข้าชนก้อนมวล ' + U(m2, 'kg') + ' ที่วางนิ่งอยู่ หลังชน<b>ทั้งสองก้อนติดกัน</b> ' +
        'แล้วเคลื่อนที่ต่อจนหลุดออกจากขอบโต๊ะ พบว่า<b>ตกลงพื้นห่างจากขอบโต๊ะในแนวราบ ' + fmt(x) + ' เมตร</b> ' +
        'จงหา<b>ความเร็วร่วมหลังชน</b> และ<b>ความเร็วของก้อนแรกก่อนชน</b> (กำหนด ' + GTXT(g) + ')',
      figure: figProj({ mode: 'h', u: 'v ร่วม', hlab: 'h = ' + fmt(h) + ' m', xlab: 'x = ' + fmt(x) + ' m' }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลก้อนที่ชน' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลก้อนที่ถูกชน (อยู่นิ่ง)' },
              { s: 'h', v: h, unit: 'm', d: 'ความสูงของโต๊ะ' },
              { s: 'x', v: x, unit: 'm', d: 'ระยะในแนวราบถึงจุดตก' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v', unit: 'm/s', d: 'ความเร็วร่วมหลังชน', value: v, positive: true },
              { s: 'u_1', unit: 'm/s', d: 'ความเร็วก้อนแรกก่อนชน', value: u1, positive: true }],
      sol: {
        analyze: '<b>โจทย์ผสมสองบท ต้องเดินย้อนจากปลายมาหาต้น</b><br>' +
          '<b>กับดักของข้อนี้:</b> พยายามใช้อนุรักษ์พลังงานตลอดทั้งเหตุการณ์ ' +
          'ซึ่งใช้ไม่ได้ เพราะช่วงชนแล้วติดกันมีพลังงานจลน์สูญเสียไป<br>' +
          '<b>ไทม์ไลน์ของเหตุการณ์</b><br>' +
          '1. ก้อนแรกวิ่งมาด้วย ' + M('u_1') + ' → <b>ชน</b> (ใช้อนุรักษ์โมเมนตัม)<br>' +
          '2. ก้อนรวมวิ่งด้วย ' + M('v') + ' บนโต๊ะลื่น → <b>ความเร็วคงที่</b><br>' +
          '3. หลุดขอบโต๊ะ → <b>โพรเจกไทล์แนวราบ</b> (บทที่ 7)<br>' +
          '<b>ข้อมูลที่โจทย์ให้ครบคือช่วงที่ 3</b> จึงต้องเริ่มจากตรงนั้น<br>' +
          'ใช้แนวดิ่งหาเวลาลอย แล้วใช้แนวราบหาความเร็วขณะหลุดขอบโต๊ะ ' +
          'ซึ่งก็คือความเร็วร่วมหลังชนนั่นเอง จากนั้นค่อยย้อนไปหา ' + M('u_1'),
        eqs: [{ eq: 'h = (1/2) g t^2', why: 'ช่วงโพรเจกไทล์ — ใช้แนวดิ่งหาเวลาที่ลอยอยู่ในอากาศ' },
               { eq: 'v = x / t', why: 'ช่วงโพรเจกไทล์ — แนวราบความเร็วคงที่ ย้อนหาความเร็วขณะหลุดขอบโต๊ะ' },
               { eq: 'm_1 u_1 = (m_1 + m_2) v', why: 'ช่วงการชน — อนุรักษ์โมเมนตัม โดยก้อนที่สองเดิมอยู่นิ่ง' }],
        solve: EQ('t = √(2h / g)', 'v = x / t', 'u_1 = (m_1 + m_2) v / m_1'),
        subst: SEQ('t = √( (2)({h}) / {g} )', { h: h, g: g }) +
               SEQ('v = {x} / {t}', { x: x, t: t }) +
               SEQ('u_1 = ({m1} + {m2})({v}) / {m1}', { m1: m1, m2: m2, v: v }),
        calc: EQ('t = ' + fmtq(t) + ' `s`', 'v = ' + fmtq(x) + ' / ' + fmtq(t) + ' = ' + fmtq(v) + ' `m/s`',
                 'u_1 = ' + fmtq(r2((m1 + m2) * v)) + ' / ' + fmtq(m1) + ' = ' + fmtq(u1) + ' `m/s`'),
        conclude: 'ดังนั้น <b>ความเร็วร่วมหลังชน = ' + U(v, 'm/s') + '</b> และ ' +
          '<b>ก้อนแรกวิ่งมาด้วยความเร็ว ' + U(u1, 'm/s') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบพลังงานที่หายไปตอนชน</b><br>' +
          'ก่อนชน ' + M('(1/2)(' + fmt(m1) + ')(' + fmt(u1) + ')^2 = ' + fmt(r2(0.5 * m1 * u1 * u1))) +
          ' J · หลังชน ' +
          M('(1/2)(' + fmt(m1 + m2) + ')(' + fmt(v) + ')^2 = ' + fmt(r2(0.5 * (m1 + m2) * v * v))) + ' J<br>' +
          'หายไป ' + fmt(r2(0.5 * m1 * u1 * u1 - 0.5 * (m1 + m2) * v * v)) +
          ' J ⇒ ยืนยันว่าใช้อนุรักษ์พลังงานข้ามช่วงการชนไม่ได้ ✓<br>' +
          '<b>เทคนิคทำโจทย์ผสม:</b> เขียน<b>ไทม์ไลน์</b>ก่อนเสมอ แล้วดูว่า<b>ช่วงไหนที่โจทย์ให้ข้อมูลครบ</b> ' +
          'เริ่มคำนวณจากช่วงนั้น แล้วไล่ต่อไปทีละช่วง ไม่ว่าจะเดินหน้าหรือถอยหลัง</span>'
      }
    };
  }
});

T({
  id: 'x-springloop', topic: 8, sub: 'สปริง รางลื่น และห่วงวงกลม', level: 'ยาก',
  skills: ['เชื่อมพลังงานสามรูปกับแรงสู่ศูนย์กลาง', 'เงื่อนไขผ่านห่วงวงกลม'],
  gen(R, c) {
    const g = c.g, j = R.pick([1, 2, 3]), v = 7 * j;
    const m = R.pick([0.5, 1, 2]);
    const x = R.pick([0.1, 0.2, 0.25, 0.5]);
    const Ek = r2(0.5 * m * v * v);
    const kk = r2(2 * Ek / (x * x));
    const rmax = r2(v * v / (5 * g));
    if (!ok2(Ek, kk, rmax) || kk > 200000 || rmax < 0.2) return null;
    return {
      stem: 'อัดสปริงค่านิจ ' + U(kk, 'N/m') + ' เข้าไป ' + U(x, 'm') + ' แล้วปล่อยให้ดีดวัตถุมวล ' +
        U(m, 'kg') + ' ออกไปตามพื้นราบ<b>ลื่น</b> จากนั้นวัตถุวิ่งเข้าสู่<b>ห่วงวงกลมแนวดิ่งที่ลื่น</b> ' +
        'จงหา<b>อัตราเร็วของวัตถุบนพื้นราบ</b> และ<b>รัศมีของห่วงที่มากที่สุด</b>ที่ยังทำให้วัตถุ' +
        'วิ่งครบห่วงได้ (กำหนด ' + GTXT(g) + ')',
      figure: figCircle({ vert: true, r: 'r', fc: 'mg', m: 'm' }),
      given: [{ s: 'k', v: kk, unit: 'N/m', d: 'ค่านิจสปริง' },
              { s: 'x', v: x, unit: 'm', d: 'ระยะที่อัดสปริง' },
              { s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v', unit: 'm/s', d: 'อัตราเร็วบนพื้นราบ', value: v, positive: true },
              { s: 'r_{มากสุด}', unit: 'm', d: 'รัศมีห่วงที่มากที่สุดที่ยังผ่านได้', value: rmax, positive: true }],
      sol: {
        analyze: '<b>โจทย์ระดับข้อสอบเข้ามหาวิทยาลัยที่รวม 3 บทในข้อเดียว</b> ' +
          '(สปริง–พลังงาน–การเคลื่อนที่แบบวงกลม)<br>' +
          '<b>กับดักของข้อนี้:</b> คิดว่าแค่ให้พลังงานพอถึงยอดห่วงก็พอ (' + M('(1/2)mv^2 = m g (2r)') + ') ' +
          '— <b>ไม่พอ!</b> เพราะถ้าไปถึงยอดด้วยความเร็วเป็นศูนย์ วัตถุจะ<b>ร่วงหลุดจากราง</b>ก่อน<br>' +
          '<b>เงื่อนไขที่ถูกต้องต้องมีสองข้อพร้อมกัน</b><br>' +
          '1. <b>เงื่อนไขแรงที่ยอดห่วง:</b> ต้องมี ' + M('v_{ยอด}^2 ≥ g r') +
          ' ไม่งั้นรางเอาไว้ไม่อยู่<br>' +
          '2. <b>เงื่อนไขพลังงาน:</b> ' + M('(1/2) m v^2 = m g (2r) + (1/2) m v_{ยอด}^2') + '<br>' +
          'รวมสองข้อในกรณีวิกฤต (' + M('v_{ยอด}^2 = g r') + ') จะได้<br>' +
          M('(1/2) v^2 = 2 g r + (1/2) g r = (5/2) g r') + ' ⇒ ' + M('v^2 = 5 g r') + '<br>' +
          'นั่นคือ<b>ยิ่งห่วงใหญ่ยิ่งต้องเร็วมาก</b> เมื่อความเร็วถูกกำหนดไว้แล้ว ' +
          'จึงมีรัศมี<b>สูงสุด</b>ที่ยังผ่านได้',
        eqs: [{ eq: '(1/2) k x^2 = (1/2) m v^2', why: 'พลังงานสปริงเปลี่ยนเป็นพลังงานจลน์ทั้งหมด เพราะพื้นราบลื่น' },
               { eq: 'v_{ยอด}^2 = g r', why: 'เงื่อนไขวิกฤตที่ยอดห่วง — น้ำหนักทำหน้าที่เป็นแรงสู่ศูนย์กลางพอดี' },
               { eq: '(1/2) v^2 = 2 g r + (1/2) v_{ยอด}^2', why: 'อนุรักษ์พลังงานจากพื้นราบถึงยอดห่วง ซึ่งสูง 2r' },
               { eq: 'v^2 = 5 g r  ⇒  r_{มากสุด} = v^2 / (5 g)', why: 'รวมสองเงื่อนไขเข้าด้วยกัน ได้ผลลัพธ์สำเร็จรูปที่ควรจำ' }],
        solve: EQ('v = √(k x^2 / m)', 'r_{มากสุด} = v^2 / (5 g)'),
        subst: SEQ('v = √( ({k})({x})^2 / {m} )', { k: kk, x: x, m: m }) +
               SEQ('r_{มากสุด} = {v}^2 / (5 × {g})', { v: v, g: g }),
        calc: EQ('E_{สปริง} = (1/2)(' + fmtq(kk) + ')(' + fmtq(r2(x * x)) + ') = ' + fmtq(Ek) + ' `J`',
                 'v = ' + fmtq(v) + ' `m/s`',
                 'r_{มากสุด} = ' + fmtq(v * v) + ' / ' + fmtq(r2(5 * g)) + ' = ' + fmtq(rmax) + ' `m`'),
        conclude: 'ดังนั้น <b>อัตราเร็วบนพื้นราบ = ' + U(v, 'm/s') + '</b> และ ' +
          '<b>รัศมีห่วงมากที่สุดที่ยังผ่านได้ = ' + U(rmax, 'm') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> ที่ยอดห่วง ' +
          M('v_{ยอด} = √(g r) = √' + fmt(r2(g * rmax)) + ' = ' + fmt(r2(Math.sqrt(g * rmax)))) + ' m/s<br>' +
          'พลังงานที่ยอด ' + M('m g (2r) + (1/2) m v_{ยอด}^2 = ' +
            fmt(r2(m * g * 2 * rmax + 0.5 * m * g * rmax))) + ' J เท่ากับ ' + fmt(Ek) + ' J ✓<br>' +
          '<b>สองสูตรที่ต้องจำคู่กันเสมอ</b><br>' +
          '• ' + M('v_{ยอด} = √(g r)') + ' — อัตราเร็วต่ำสุดที่ยอดห่วง<br>' +
          '• ' + M('h_{ต่ำสุด} = 2.5 r') + ' หรือ ' + M('v_{พื้น}^2 = 5 g r') + ' — เงื่อนไขที่จุดเริ่มต้น<br>' +
          'สองสูตรนี้ครอบคลุมโจทย์ห่วงวงกลมแนวดิ่งเกือบทั้งหมดที่ออกสอบ</span>'
      }
    };
  }
});

T({
  id: 'x-ballfric', topic: 8, sub: 'กระสุนฝังแล้วไถลบนพื้นฝืด', level: 'ยาก',
  skills: ['อนุรักษ์โมเมนตัมต่อด้วยงาน-พลังงาน', 'รู้ว่าช่วงไหนใช้กฎใด'],
  gen(R, c) {
    const g = c.g, k = R.pick([1, 2]), v = 7 * k;
    const mu = R.pick([0.2, 0.25, 0.4, 0.5]);
    const d = r2(v * v / (2 * mu * g));
    const mb = R.pick([0.02, 0.05, 0.1]);
    const Mw = R.pick([0.98, 1.95, 2.9]);        // ห้ามตั้งชื่อว่า M เพราะชนกับฟังก์ชันจัดรูปสมการ M()
    const tot = r2(mb + Mw);
    const u = r2(tot * v / mb);
    if (!ok2(d, tot, u) || dpOf(tot, 4) > 2 || u > 3000 || d > 150) return null;
    return {
      stem: 'ยิงกระสุนมวล ' + U(mb, 'kg') + ' เข้าไป<b>ฝังในก้อนไม้</b>มวล ' + U(Mw, 'kg') +
        ' ที่วางนิ่งอยู่บนพื้นราบ หลังกระสุนฝังแล้ว ก้อนไม้พร้อมกระสุน<b>ไถลไปได้ ' + fmt(d) +
        ' เมตรจึงหยุด</b> ถ้าสัมประสิทธิ์ความเสียดทานจลน์ระหว่างไม้กับพื้นเท่ากับ ' + fmt(mu) +
        ' จงหา<b>ความเร็วร่วมทันทีหลังกระสุนฝัง</b> และ<b>ความเร็วของกระสุนก่อนชน</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figChain({ masses: ['M'], Fleft: 'กระสุน m →' }),
      given: [{ s: 'm', v: mb, unit: 'kg', d: 'มวลกระสุน' },
              { s: 'M', v: Mw, unit: 'kg', d: 'มวลก้อนไม้' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานจลน์' },
              { s: 'd', v: d, unit: 'm', d: 'ระยะไถลจนหยุด' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'V', unit: 'm/s', d: 'ความเร็วร่วมทันทีหลังชน', value: v, positive: true },
              { s: 'u', unit: 'm/s', d: 'ความเร็วกระสุนก่อนชน', value: u, positive: true }],
      sol: {
        analyze: '<b>กับดักของข้อนี้:</b> เขียนสมการเดียวว่า ' + M('(1/2) m u^2 = μ_k (m+M) g d') +
          ' แล้วแก้หา ' + M('u') + ' ทันที — <b>ผิดอย่างแรง</b> ' +
          'เพราะข้ามการสูญเสียพลังงานมหาศาลตอนกระสุนฝังเข้าเนื้อไม้ไป<br>' +
          '<b>ต้องแยกสองช่วงที่ใช้กฎคนละข้อเสมอ</b><br>' +
          '<b>ช่วงที่ 1 — ขณะกระสุนฝัง:</b> เกิดในเสี้ยววินาที แรงเสียดทานยังไม่ทันมีผล<br>' +
          '⇒ ใช้<b>อนุรักษ์โมเมนตัม</b> แต่<b>ห้ามใช้อนุรักษ์พลังงาน</b><br>' +
          '<b>ช่วงที่ 2 — ก้อนรวมไถลจนหยุด:</b> พลังงานจลน์ถูกแรงเสียดทานกินจนหมด<br>' +
          '⇒ ใช้<b>ทฤษฎีบทงาน-พลังงานจลน์</b><br>' +
          '<b>ลำดับการคิด:</b> โจทย์ให้ข้อมูลครบในช่วงที่ 2 จึงเริ่มจากช่วงที่ 2 หา ' + M('V') +
          ' ก่อน แล้วย้อนขึ้นไปช่วงที่ 1 หา ' + M('u') + '<br>' +
          'มวลรวม ' + M('m + M = ' + fmt(tot)) + ' kg',
        eqs: [{ eq: '(1/2)(m+M) V^2 = μ_k (m+M) g d',
                why: 'ช่วงที่ 2 — พลังงานจลน์หลังชนถูกงานของแรงเสียดทานเปลี่ยนเป็นความร้อนจนหมด' },
               { eq: 'V = √(2 μ_k g d)', why: 'มวลรวมตัดกันทั้งสองข้าง ความเร็วหลังชนจึงไม่ขึ้นกับมวล' },
               { eq: 'm u = (m + M) V', why: 'ช่วงที่ 1 — อนุรักษ์โมเมนตัม กระสุนฝังในไม้จึงเคลื่อนที่เป็นก้อนเดียว' }],
        solve: EQ('V = √(2 μ_k g d)', 'u = (m + M) V / m'),
        subst: SEQ('V = √(2 × {mu} × {g} × {d})', { mu: mu, g: g, d: d }) +
               SEQ('u = ({tot})({V}) / {m}', { tot: tot, V: v, m: mb }),
        calc: EQ('V = √' + fmtq(r2(2 * mu * g * d)) + ' = ' + fmtq(v) + ' `m/s`',
                 'u = ' + fmtq(r2(tot * v)) + ' / ' + fmtq(mb) + ' = ' + fmtq(u) + ' `m/s`'),
        conclude: 'ดังนั้น <b>ความเร็วร่วมหลังชน = ' + U(v, 'm/s') + '</b> และ ' +
          '<b>ความเร็วกระสุนก่อนชน = ' + U(u, 'm/s') + '</b><br>' +
          '<span class="hint"><b>ดูให้เห็นว่าพลังงานหายไปมากแค่ไหน</b><br>' +
          'พลังงานจลน์กระสุนก่อนชน ' +
          M('(1/2)(' + fmt(mb) + ')(' + fmt(u) + ')^2 ≈ ' + fmt(r2(0.5 * mb * u * u))) + ' J<br>' +
          'พลังงานจลน์ของก้อนรวมหลังชน ' + M('≈ ' + fmt(r2(0.5 * tot * v * v))) + ' J<br>' +
          'หายไปราว ' + fmt(r2((1 - (0.5 * tot * v * v) / (0.5 * mb * u * u)) * 100)) +
          '% ตอนที่กระสุนเจาะเนื้อไม้ (กลายเป็นความร้อนและงานที่ใช้ฉีกเนื้อไม้)<br>' +
          '<b>นี่คือหลักฐานชัดเจนว่าห้ามใช้อนุรักษ์พลังงานข้ามช่วงการชน</b><br>' +
          '<b>สรุปหลักการเลือกกฎ:</b> "<b>ชนเมื่อไร ใช้โมเมนตัม · ลื่นเมื่อไร ใช้พลังงาน</b>" — ' +
          'ท่องไว้แล้วจะไม่พลาดโจทย์แนวนี้อีกเลย</span>'
      }
    };
  }
});

T({
  id: 'x-tablepulley', topic: 8, sub: 'ระบบรอกกับพื้นฝืด', level: 'ยาก',
  skills: ['เขียนสมการแยกก้อน', 'แรงเสียดทานในระบบเชื่อมกัน'],
  gen(R, c) {
    const g = c.g;
    const m1 = R.pick([2, 4, 5, 10]), m2 = R.pick([2, 3, 4, 5, 6, 8]);
    const mu = R.pick([0.2, 0.25, 0.5]);
    const a = r2((m2 - mu * m1) * g / (m1 + m2));
    const Tn = r2(m2 * (g - a));
    const t = R.pick([2, 3, 4]);
    const v = r2(a * t);
    if (!ok2(a, Tn, v) || a < 0.5 || a > g) return null;
    return {
      stem: 'วางวัตถุมวล ' + U(m1, 'kg') + ' บนโต๊ะที่มี<b>ความเสียดทาน</b> (' + M('μ_k = ' + fmt(mu)) + ') ' +
        'ผูกเชือกเบาข้าม<b>รอกลื่นมวลเบา</b>ที่ขอบโต๊ะ ไปยังวัตถุมวล ' + U(m2, 'kg') + ' ที่ห้อยอยู่ ' +
        'ปล่อยระบบจากหยุดนิ่ง จงหา<b>ความเร่งของระบบ</b> <b>แรงตึงเชือก</b> ' +
        'และ<b>อัตราเร็วเมื่อผ่านไป ' + fmt(t) + ' วินาที</b> (กำหนด ' + GTXT(g) + ')',
      figure: figTablePulley({ m1: 'm₁', m2: 'm₂', fric: 'f' }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลบนโต๊ะ' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลที่ห้อยอยู่' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานบนโต๊ะ' },
              { s: 't', v: t, unit: 's', d: 'ช่วงเวลาที่พิจารณา' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่งของระบบ', value: a, positive: true },
              { s: 'T', unit: 'N', d: 'แรงตึงเชือก', value: Tn, positive: true },
              { s: 'v', unit: 'm/s', d: 'อัตราเร็วเมื่อครบ t วินาที', value: v, positive: true }],
      sol: {
        analyze: '<b>กับดักของข้อนี้ (พบบ่อยที่สุด):</b> คิดว่า ' + M('T = m_2 g') +
          ' — <b>ผิด</b> เพราะถ้าแรงตึงเท่ากับน้ำหนัก ก้อนที่ห้อยจะไม่มีความเร่งเลย<br>' +
          'ความจริงคือ ' + M('T < m_2 g') + ' เสมอ เมื่อก้อนที่ห้อยกำลังเร่งลง<br>' +
          '<b>ขั้นตอนที่ใช้ได้กับทุกโจทย์ระบบเชื่อมกัน</b><br>' +
          '<b>1) หาความเร่งจากภาพรวมทั้งระบบ</b> — แรงตึงเชือกเป็นแรงภายใน หักล้างกันไป<br>' +
          '• แรง<b>ขับ</b>: น้ำหนักก้อนที่ห้อย ' + M('m_2 g = ' + fmt(r2(m2 * g))) + ' N<br>' +
          '• แรง<b>ต้าน</b>: แรงเสียดทานบนโต๊ะ ' + M('f = μ_k m_1 g = ' + fmt(r2(mu * m1 * g))) + ' N<br>' +
          '• มวลที่ถูกเร่งทั้งหมด: ' + M('m_1 + m_2 = ' + fmt(m1 + m2)) + ' kg<br>' +
          '<b>2) หาแรงตึงเชือกโดยแยกก้อนใดก้อนหนึ่งออกมา</b><br>' +
          'ก้อนที่ห้อย: ' + M('m_2 g - T = m_2 a') + ' ⇒ ' + M('T = m_2 (g - a)') + '<br>' +
          '<b>ข้อควรระวังเรื่องแรงตั้งฉาก:</b> ก้อนบนโต๊ะอยู่บนพื้นราบ ⇒ ' + M('N = m_1 g') +
          ' (ต่างจากกรณีพื้นเอียงที่ต้องคูณ ' + M('cos θ') + ')',
        eqs: [{ eq: 'a = (m_2 g - μ_k m_1 g) / (m_1 + m_2)',
                why: 'มองทั้งระบบ — แรงลัพธ์คือน้ำหนักก้อนห้อยหักแรงเสียดทาน หารด้วยมวลรวม' },
               { eq: 'T = m_2 (g - a)', why: 'แยกพิจารณาก้อนที่ห้อย — แรงตึงต้องน้อยกว่าน้ำหนักจึงจะเร่งลงได้' },
               { eq: 'v = u + a t = a t', why: 'ความเร่งคงที่และเริ่มจากหยุดนิ่ง จึงใช้สมการการเคลื่อนที่ได้ตรง ๆ' }],
        solve: EQ('a = (m_2 - μ_k m_1) g / (m_1 + m_2)', 'T = m_2 (g - a)', 'v = a t'),
        subst: SEQ('a = ({m2} - ({mu})({m1}))({g}) / ({m1} + {m2})', { m2: m2, mu: mu, m1: m1, g: g }) +
               SEQ('T = ({m2})({g} - {a})', { m2: m2, g: g, a: a }) +
               SEQ('v = ({a})({t})', { a: a, t: t }),
        calc: EQ('a = ' + fmtq(r2((m2 - mu * m1) * g)) + ' / ' + fmtq(m1 + m2) + ' = ' + fmtq(a) + ' `m/s`^2',
                 'T = ' + fmtq(Tn) + ' `N`', 'v = ' + fmtq(v) + ' `m/s`'),
        conclude: 'ดังนั้น <b>ความเร่งของระบบ = ' + U(a, 'm/s²') + '</b> <b>แรงตึงเชือก = ' +
          U(Tn, 'N') + '</b> และ<b>อัตราเร็วเมื่อครบ ' + fmt(t) + ' วินาที = ' + U(v, 'm/s') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยก้อนบนโต๊ะ (อีกสมการที่ต้องสอดคล้องกัน)</b><br>' +
          M('T - f = m_1 a') + ' ⇒ ' + M(fmt(Tn) + ' - ' + fmt(r2(mu * m1 * g)) + ' = ' +
            fmt(r2(Tn - mu * m1 * g))) + ' N<br>' +
          'และ ' + M('m_1 a = ' + fmt(r2(m1 * a))) + ' N — เท่ากัน ✓<br>' +
          '<b>ตรวจสอบเชิงเหตุผล:</b> ' + M('T = ' + fmt(Tn)) + ' N ต้องน้อยกว่า ' +
          M('m_2 g = ' + fmt(r2(m2 * g))) + ' N ✓ ถูกต้องตามที่ควรเป็น<br>' +
          '<b>คำถามที่ออกต่อบ่อย:</b> ถ้าเพิ่มความเสียดทานจนกระทั่ง ' + M('μ_k m_1 ≥ m_2') +
          ' ระบบจะ<b>ไม่ขยับเลย</b> เพราะแรงเสียดทานเอาชนะน้ำหนักก้อนที่ห้อยได้</span>'
      }
    };
  }
});

T({
  id: 'x-incspring', topic: 8, sub: 'พื้นเอียงลื่นกับสปริง', level: 'ยาก',
  skills: ['อนุรักษ์พลังงานข้ามสามรูปแบบ', 'ระวังความสูงในแนวดิ่ง'],
  gen(R, c) {
    const g = c.g;
    const L = R.pick([5, 20, 45, 2.5, 10, 22.5, 1.25, 40, 80]);
    const v = r2(Math.sqrt(g * L));            // จาก mgL sin30 = ½mv² ⇒ v = √(gL)
    const m = R.pick([1, 2, 4, 8]);
    const kk = R.pick([50, 100, 200, 400, 800, 1600, 3200]);
    const Ek = r2(0.5 * m * v * v);
    const x = r2(Math.sqrt(2 * Ek / kk));
    if (!ok2(v, Ek, x) || dpOf(v, 4) > 2 || dpOf(x, 4) > 2 || x < 0.05 || x > 2) return null;
    return {
      stem: 'ปล่อยวัตถุมวล ' + U(m, 'kg') + ' จากหยุดนิ่งบนพื้นเอียง<b>ลื่น</b>ที่ทำมุม <b>30°</b> กับแนวราบ ' +
        'ให้ไถลลงมาตามพื้นเอียงเป็นระยะ ' + U(L, 'm') + ' แล้วชนกับสปริงค่านิจ ' + U(kk, 'N/m') +
        ' ที่วางรออยู่ปลายพื้นเอียง จงหา<b>อัตราเร็วก่อนชนสปริง</b> ' +
        'และ<b>ระยะที่สปริงถูกอัดมากที่สุด</b> (คิดว่าสปริงสั้นมากเทียบกับ ' + M('L') +
        ' และ ' + GTXT(g) + ')',
      figure: figIncline({ deg: 30, mass: 'm', down: 'mg' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'θ', v: 30, unit: '°', d: 'มุมเอียงของพื้น' },
              { s: 'L', v: L, unit: 'm', d: 'ระยะที่ไถลตามพื้นเอียง' },
              { s: 'k', v: kk, unit: 'N/m', d: 'ค่านิจสปริง' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v', unit: 'm/s', d: 'อัตราเร็วก่อนชนสปริง', value: v, positive: true },
              { s: 'x', unit: 'm', d: 'ระยะที่สปริงถูกอัดมากที่สุด', value: x, positive: true }],
      sol: {

        subst: SEQ('v = √( ({g})({L}) )', { g: g, L: L }) +
               SEQ('x = √( ({m})({v})^2 / {k} )', { m: m, v: v, k: kk }),

            fmt(r2(0.5 * kk * x * x))) + ' J — เท่ากันพอดี ✓<br>' +
          '<b>ประเด็นที่ข้อสอบชอบถามต่อ</b><br>' +

/* ---------- ชุดแปลงหน่วยกับคำอุปสรรค (คำนวณเองทั้งหมด) ----------
   ของเดิมมีข้อเดียวและเป็นข้อความตายตัว จึงได้เลขเดิมหน่วยเดิมทุกครั้ง
   ชุดนี้สุ่มทั้งตัวเลข คำอุปสรรค และหน่วย แล้วคำนวณคำตอบกับตัวลวงจากค่าจริง
   ตัวลวงทุกตัวมาจากความผิดพลาดที่เกิดขึ้นจริง ไม่ใช่เลขมั่ว */

/* คำอุปสรรคที่ใช้ในโจทย์ชุดนี้ */
const PFX = {
  p: { s: 'พิโก',  y: 'p', e: -12 }, n: { s: 'นาโน', y: 'n', e: -9 },
  u: { s: 'ไมโคร', y: 'μ', e: -6 },  m: { s: 'มิลลิ', y: 'm', e: -3 },
  c: { s: 'เซนติ', y: 'c', e: -2 },  k: { s: 'กิโล',  y: 'k', e: 3 },
  M: { s: 'เมกะ',  y: 'M', e: 6 },   G: { s: 'จิกะ',  y: 'G', e: 9 }
};
/* จับคู่หน่วยกับคำอุปสรรคที่ใช้กันจริง — กันไม่ให้ออกโจทย์แปลก ๆ อย่าง "เซนติวินาที" */
const PFXU = [
  { s: 'เมตร',    y: 'm',  ps: ['n', 'u', 'm', 'c', 'k'] },
  { s: 'วินาที',  y: 's',  ps: ['p', 'n', 'u', 'm'] },
  { s: 'กรัม',    y: 'g',  ps: ['u', 'm', 'k'] },
  { s: 'แอมแปร์', y: 'A',  ps: ['u', 'm'] },
  { s: 'เฮิรตซ์', y: 'Hz', ps: ['k', 'M', 'G'] },
  { s: 'จูล',     y: 'J',  ps: ['m', 'k', 'M'] },
  { s: 'วัตต์',   y: 'W',  ps: ['m', 'k', 'M'] },
  { s: 'ไบต์',    y: 'B',  ps: ['k', 'M', 'G'] }
];
/** สุ่มหน่วยหนึ่งตัวพร้อมคำอุปสรรคที่เข้าคู่กันได้จริง */
function pfxPick(R, only) {
  const list = only ? PFXU.filter(u => u.ps.some(k => only.indexOf(k) >= 0)) : PFXU;
  const u = R.pick(list);
  const ks = only ? u.ps.filter(k => only.indexOf(k) >= 0) : u.ps;
  return { u: u, p: PFX[R.pick(ks)] };
}
/** เขียนเป็นสัญกรณ์วิทยาศาสตร์ */
function sciTxt(mant, exp, unit) {
  return M(fmt(mant, 6) + ' × 10^{' + exp + '} `' + unit + '`');
}
/** แยกเลขออกเป็น [ตัวเลขหน้า, เลขชี้กำลัง] โดยตัวเลขหน้าอยู่ระหว่าง 1 ถึง 10 */
function norm10(v) {
  const k = Math.floor(Math.log10(Math.abs(v)) + 1e-9);
  return [Math.round(v / Math.pow(10, k) * 1e6) / 1e6, k];
}
/** เลขทศนิยมแบบเต็ม ไม่ใช้สัญกรณ์ เช่น 0.000045 */
function decTxt(v) { return fmt(v, 12); }
/** คัดตัวลวงสามตัวที่ไม่ซ้ำกันเองและไม่ซ้ำกับคำตอบ ไม่ครบสามก็คืน null ให้ระบบสุ่มใหม่
    จำเป็นเพราะโจทย์ชุดนี้คำนวณตัวลวงจากเลขชี้กำลัง บางค่าจึงบังเอิญตรงกันได้
    เช่นเลขชี้กำลังเป็นศูนย์ ค่าบวกกับค่าลบจะกลายเป็นข้อความเดียวกัน */
function pick3(ans, cands) {
  const seen = {}, out = [];
  seen[ans] = 1;
  for (let i = 0; i < cands.length && out.length < 3; i++) {
    const t = cands[i][0];
    if (!t || seen[t]) continue;
    seen[t] = 1; out.push(cands[i]);
  }
  return out.length === 3 ? out : null;
}
/* ค่าตั้งต้นที่หยิบมาใช้เป็นตัวเลขในโจทย์ — เลือกให้อ่านง่ายและกระจายหลายหลัก */
const PFXV = [1.5, 2, 2.5, 3, 4, 5, 6, 7.5, 8, 12, 15, 25, 40, 60, 120, 250, 400, 500, 750];

    if (!bad) return null;
    return {

        '2) จัดรูปให้เป็นสัญกรณ์วิทยาศาสตร์ คือให้ตัวเลขหน้าอยู่ระหว่าง 1 ถึง 10<br>' +
        '   ได้ ' + sciTxt(mant, exp, q.u.y),
      why: '<b>ตรวจคำตอบได้เร็ว ๆ ด้วยการดูทิศ</b> — คำอุปสรรคที่<b>เล็กกว่าหนึ่ง</b> ' +
        '(มิลลิ ไมโคร นาโน พิโก) ต้องได้เลขชี้กำลัง<b>ติดลบ</b> ส่วนกิโล เมกะ จิกะ ต้องได้<b>เลขบวก</b><br>' +

    };
  }
});

TQ({
  id: 'tq-u3k', topic: 4, sub: 'คำอุปสรรค',
  skills: ['หาอัตราส่วนระหว่างคำอุปสรรคสองตัว'],
  gen(R) {
    const u = R.pick(PFXU.filter(x => x.ps.length >= 2));
    const two = R.some(u.ps, 2);
    let a = PFX[two[0]], b = PFX[two[1]];
    if (a.e < b.e) { const t = a; a = b; b = t; }   // ให้ a ใหญ่กว่า b เสมอ
    const d = a.e - b.e;
    return {
      stem: '<b>1 ' + a.s + u.s + '</b> มีค่าเป็นกี่เท่าของ <b>1 ' + b.s + u.s + '</b>',
      choices: [
        C(M('10^{' + d + '}') + ' เท่า', 'ต่างกันเท่ากับผลต่างของเลขชี้กำลัง'),
        X(M('10^{' + (d + 1) + '}') + ' เท่า', 'นับผลต่างของเลขชี้กำลังเกินไปหนึ่ง'),
        X(M('10^{' + (d - 1) + '}') + ' เท่า', 'นับผลต่างของเลขชี้กำลังขาดไปหนึ่ง'),
        X(M('10^{' + (-d) + '}') + ' เท่า', 'กลับด้าน — นี่คือค่าของ 1 ' + b.s + u.s +
          ' เทียบกับ 1 ' + a.s + u.s + ' ต่างหาก')
      ],
      idea: '<b>อัตราส่วนของคำอุปสรรคหาได้จากผลต่างของเลขชี้กำลัง</b><br>' +
        a.s + ' = ' + M('10^{' + a.e + '}') + ' · ' + b.s + ' = ' + M('10^{' + b.e + '}') + '<br>' +
        M('10^{' + a.e + '}/10^{' + b.e + '} = 10^{' + a.e + ' - (' + b.e + ')} = 10^{' + d + '}'),
      why: '<b>ระวังการหารเลขยกกำลังที่ติดลบ</b> — ตัวส่วนติดลบแล้วต้อง<b>ลบด้วยจำนวนลบ</b> ' +
        'ซึ่งกลายเป็นบวก คนพลาดตรงนี้กันมาก<br>' +
        'เช่น ' + M('10^{-3}/10^{-6} = 10^{-3+6} = 10^3') + ' ไม่ใช่ ' + M('10^{-9}')
    };
  }
});

TQ({
  id: 'tq-u3l', topic: 4, sub: 'การแปลงหน่วยด้วยคำอุปสรรค',
  skills: ['บวกลบค่าที่มีคำอุปสรรคต่างกัน'],
  gen(R) {
    const u = R.pick([PFXU[0], PFXU[1], PFXU[2]]);   // เมตร วินาที กรัม
    const two = R.some(u.ps, 2);
    let a = PFX[two[0]], b = PFX[two[1]];
    if (a.e < b.e) { const t = a; a = b; b = t; }
    const d = a.e - b.e;
    if (d > 3) return null;                          // ต่างกันมากเกินไป ตัวเลขจะอ่านยาก
    const x = R.pick([1.5, 2, 2.5, 3, 4, 5]);
    const y = R.pick([200, 250, 300, 400, 500, 600, 750]);
    const sum = x + y / Math.pow(10, d);             // รวมในหน่วยของ a
    return {
      stem: '<b>' + fmt(x, 6) + ' ' + a.s + u.s + ' + ' + fmt(y, 6) + ' ' + b.s + u.s +
        '</b> รวมกันได้เท่ากับข้อใด (ตอบในหน่วย' + a.s + u.s + ')',
      choices: [
        C(fmt(sum, 6) + ' ' + a.s + u.s, 'แปลงให้เป็นหน่วยเดียวกันก่อนแล้วจึงบวก'),
        X(fmt(x + y, 6) + ' ' + a.s + u.s, 'บวกตัวเลขตรง ๆ ทั้งที่คนละหน่วย ซึ่งบวกกันไม่ได้'),
        X(fmt(x + y / Math.pow(10, d + 1), 6) + ' ' + a.s + u.s, 'แปลงหน่วยพลาดไปหนึ่งตำแหน่ง'),
        X(fmt(x * Math.pow(10, d) + y, 6) + ' ' + a.s + u.s, 'คำตอบนี้อยู่ในหน่วย' + b.s + u.s +
          ' ไม่ใช่หน่วยที่โจทย์ถาม')
      ],
      idea: '<b>ปริมาณที่หน่วยไม่ตรงกัน บวกกันตรง ๆ ไม่ได้</b><br>' +
        'ต้องแปลงให้เป็นหน่วยเดียวกันก่อนเสมอ<br>' +
        M(fmt(y, 6) + ' `' + b.y + u.y + '` = ' + fmt(y / Math.pow(10, d), 6) + ' `' + a.y + u.y + '`') + '<br>' +
        'แล้วจึงบวก ' + M(fmt(x, 6) + ' + ' + fmt(y / Math.pow(10, d), 6) + ' = ' + fmt(sum, 6) +
        ' `' + a.y + u.y + '`'),
      why: '<b>อย่าลืมดูว่าโจทย์ให้ตอบในหน่วยไหน</b> — คำนวณถูกแต่ตอบผิดหน่วยก็ไม่ได้คะแนน<br>' +
        'เทคนิคที่ปลอดภัยที่สุดคือ<b>แปลงทุกค่าเป็นหน่วยฐานก่อน</b> คำนวณให้เสร็จ ' +
        'แล้วค่อยแปลงกลับเป็นหน่วยที่โจทย์ต้องการเป็นขั้นตอนสุดท้าย'
    };
  }
});

});

  id: 'g3-t-compare', topic: 2, sub: 'สนามโน้มถ่วง',
  skills: ['เปรียบเทียบสนามโน้มถ่วงของดาวสองดวงในรูปสัญลักษณ์'],
  gen(R) {
    const km = R.pick([2, 4, 9]), kr = R.pick([2, 3]);
    const fac = km / (kr * kr);
    const txt = v => {
      const r = Math.round(v * 1000) / 1000;
      if (Math.abs(r - Math.round(r)) < 1e-9) return fmt(r) + ' เท่า';
      const den = Math.round(1 / r);
      return Math.abs(1 / r - den) < 1e-6 ? M('1/' + den) + ' เท่า' : fmt(r, 3) + ' เท่า';
    };
    return {
      stem: 'ดาว A มีมวลเป็น ' + fmt(km) + ' เท่าของโลก และมีรัศมีเป็น ' + fmt(kr) +
        ' เท่าของโลก <b>สนามโน้มถ่วงที่ผิวดาว A</b> เป็นกี่เท่าของที่ผิวโลก',
      choices: [
        C(txt(fac), 'มวลเข้าเป็นตัวคูณ รัศมีเข้าเป็นตัวหารกำลังสอง'),
        X(txt(km / kr), 'ลืมยกกำลังสองให้รัศมี'),
        X(txt(km * kr * kr), 'เอารัศมีไปคูณแทนที่จะหาร'),
        X(txt(km), 'คิดแต่มวล ไม่ได้คิดผลของรัศมีเลย')
      ],
      idea: '<b>เทียบเป็นอัตราส่วน ไม่ต้องรู้ค่าจริงของโลก</b><br>' +
        M('g = GM/R^2') + ' ⇒ ' + M('g_A/g_โลก = M_A/M_โลก × (R_โลก/R_A)^2') + '<br>' +
        'ข้อนี้ ' + M('g_A/g_โลก = (' + km + ')/(' + kr + '^2) = ' + fmt(fac, 3)),
      why: '<b>อย่าดูแต่มวล</b> — ดาวที่มวลมากกว่าอาจมีสนามที่ผิว<b>น้อยกว่า</b>ได้ ' +
        'ถ้ารัศมีใหญ่กว่ามาก เพราะรัศมีเข้าสูตรเป็นกำลังสอง<br>' +
        'ตัวอย่างจริง — ดาวเสาร์มีมวลราว 95 เท่าของโลก แต่สนามที่ผิวมากกว่าโลกเพียงเล็กน้อยเท่านั้น'
    };
  }
});

      X('เป็นบวกและมีค่ามาก เพราะรู้สึกเหนื่อยมาก', 'ความเหนื่อยเป็นเรื่องชีวภาพ ไม่ตรงกับนิยามงานทางฟิสิกส์'),
      X('เป็นลบ เพราะต้องต้านแรงโน้มถ่วง', 'งานเป็นลบเมื่อแรงมีทิศตรงข้ามการกระจัด ซึ่งไม่ใช่กรณีนี้')

    idea: 'งานนิยามว่า ' + M('W = F s cos θ') + ' โดย ' + M('θ') + ' คือมุมระหว่าง<b>แรง</b>กับ<b>การกระจัด</b><br>' +
      'ข้อนี้แรงยกอยู่ใน<b>แนวดิ่ง</b> แต่การกระจัดอยู่ใน<b>แนวราบ</b> ⇒ ' + M('θ = 90°') + '<br>' +
      M('cos 90° = 0') + ' ⇒ <b>' + M('W = 0') + '</b><br>' +
      'พูดง่าย ๆ คือ กระเป๋าไม่ได้ถูกยกขึ้นหรือลงเลย พลังงานศักย์จึงไม่เปลี่ยน ไม่มีงานเกิดขึ้น',
    why: '<b>"งาน" ทางฟิสิกส์ ต่างจาก "งาน" ในภาษาพูดอย่างสิ้นเชิง</b><br>' +
      'ที่เรารู้สึกเหนื่อยเพราะกล้ามเนื้อต้องหดตัวเกร็งค้างไว้ตลอดเวลา ซึ่งใช้พลังงานเคมีจริง ' +
      'แต่<b>ไม่มีงานทางกลเกิดขึ้นกับกระเป๋า</b><br>' +
      '<b>สามกรณีที่งานเป็นศูนย์</b><br>' +
      '1. ' + M('F = 0') + ' — ไม่มีแรง<br>' +
      '2. ' + M('s = 0') + ' — ไม่มีการกระจัด (เช่น ดันกำแพงจนเหนื่อยแต่กำแพงไม่ขยับ)<br>' +
      '3. ' + M('θ = 90°') + ' — แรงตั้งฉากกับการเคลื่อนที่ (เช่น แรงตั้งฉาก N และแรงสู่ศูนย์กลาง)'
  }; }
});

TQ({

TQ({
  id: 'tq-w3', topic: 5, sub: 'พลังงานศักย์และระดับอ้างอิง', skills: ['ค่าของ Ep ขึ้นกับจุดอ้างอิง'],

    ],
    idea: M('E_p = m g h') + ' โดย ' + M('h') + ' วัดจาก<b>ระดับอ้างอิงที่เราเลือกเอง</b><br>' +

      'เพราะสิ่งที่วัดได้จริงคือพลังงานที่<b>เปลี่ยนไป</b> เช่น ความเร็วที่เพิ่มขึ้นตอนตก<br>' +

});

TQ({

TQ({

      '• งานของแรงต้าน ⇒ <b>ลบ</b> (ขนาดเท่ากัน)<br>' +
      '• งานลัพธ์ ⇒ <b>ศูนย์</b><br>' +
      '<b>ข้อดีของทฤษฎีบทนี้:</b> ใช้ได้แม้แรงจะ<b>ไม่คงที่</b>หรือเส้นทาง<b>โค้งไปมา</b> ' +
      'ขอเพียงรู้พลังงานจลน์ต้นกับปลาย จึงมักแก้โจทย์ได้เร็วกว่าใช้สมการการเคลื่อนที่มาก'
  }; }
});

TQ({

        X('0 kg·m/s', 'ขนาดความเร็วเท่าเดิมก็จริง แต่ทิศเปลี่ยน โมเมนตัมซึ่งเป็นเวกเตอร์จึงเปลี่ยน'),
        X(fmt(r2(m * u)) + ' kg·m/s', 'ลืมคิดว่าลูกบอลย้อนทิศ จึงคิดแค่การหยุดอย่างเดียว'),
        X(fmt(r2(0.5 * m * u)) + ' kg·m/s', 'ไม่ตรงกับสูตรใดเลย')
      ],
      idea: '<b>นี่คือข้อที่ผิดกันมากที่สุดในบทโมเมนตัม</b><br>' +

        M('Δp = p_2 - p_1 = (-m u) - (+m u) = -2 m u') + '<br>' +
        '⇒ <b>ขนาดเท่ากับ ' + M('2 m u') + ' = ' + fmt(r2(2 * m * u)) + ' kg·m/s</b><br>' +
        '<b>คิดตามสามัญสำนึก:</b> กำแพงต้องทำสองอย่าง คือ<b>หยุด</b>ลูกบอลก่อน ' +

      why: '<b>เปรียบเทียบสองกรณีให้เห็นชัด</b><br>' +
        '• ลูกบอลชนแล้ว<b>ติดกำแพง</b> (ไม่สะท้อน) ⇒ ' + M('Δp = m u') + ' = ' + fmt(r2(m * u)) + ' kg·m/s<br>' +
        '• ลูกบอลชนแล้ว<b>สะท้อนกลับเต็มที่</b> ⇒ ' + M('Δp = 2 m u') + ' = ' + fmt(r2(2 * m * u)) + ' kg·m/s ' +
        '(<b>เป็นสองเท่า</b>)<br>' +

        '<b>ประยุกต์:</b> ความดันของแก๊สเกิดจากโมเลกุลชนผนังแล้วสะท้อนกลับ จึงใช้ ' + M('Δp = 2mv') + ' ในการคำนวณ'

  }

      'ต่างกันตรงที่<b>มุมสูงลอยนานกว่าและขึ้นสูงกว่า</b> ส่วนมุมต่ำถึงเป้าเร็วกว่า<br>' +
      '<b>ในโลกจริงมุมที่ไกลที่สุดน้อยกว่า 45°</b> เพราะแรงต้านอากาศ — ' +
      'นักกีฬาทุ่มน้ำหนักและพุ่งแหลนจึงใช้มุมราว 38–42°<br>' +

  }; }
});
