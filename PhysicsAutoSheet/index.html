        eqs: [{ eq: 's = (1/2)(u + v) t', why: 'เมื่อความเร่งคงที่ ความเร็วเฉลี่ยจะเท่ากับค่ากลางของความเร็วต้นกับปลายพอดี การกระจัดจึงเท่ากับความเร็วเฉลี่ยคูณเวลา' }],
        solve: '<div>' + M('s') + ' อยู่โดดเดี่ยวแล้ว แทนค่าได้เลย</div>' + EQ('s = (1/2)(u + v) t'),
        subst: SEQ('s = (1/2)({u} + {v})({t})', { u: u, v: v, t: t }),
        calc: EQ('s = (1/2)(' + fmtq(u + v) + ')(' + fmtq(t) + ')',
                 's = (' + fmtq((u + v) / 2) + ')(' + fmtq(t) + ')',
                 's = ' + fmtq(s) + ' `m`'),
        conclude: 'ดังนั้น <b>การกระจัดเท่ากับ ' + U(s, 'm') + '</b><br>' +
          '<span class="hint">ค่า ' + U((u + v) / 2, 'm/s') + ' คือความเร็วเฉลี่ย ใช้ได้เฉพาะกรณีความเร่งคงที่เท่านั้น</span>'
      }
    };
  }
});

T({
  id: 'k-freefall', topic: 1, sub: 'การตกอิสระ', level: 'ปานกลาง',
  skills: ['การตกอิสระ', 'เลือกสมการการเคลื่อนที่', 'เครื่องหมายทิศทาง'],
  gen(R, c) {
    const g = c.g, ball = R.pick(BALLS), t = R.pick([2, 3, 4, 5]);
    const h = r2(0.5 * g * t * t), v = r2(g * t);
    if (!ok2(h, v)) return null;
    return {
      stem: 'ปล่อย' + esc(ball) + 'ให้ตกลงมาอย่างอิสระจากยอดตึกสูง ' + U(h, 'm') +
        ' โดยไม่คิดแรงต้านอากาศ จงหา<b>เวลาที่' + esc(ball) + 'ใช้ในการตกถึงพื้น</b> (กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'u', v: 0, unit: 'm/s', d: 'ปล่อย แปลว่าความเร็วต้นเป็นศูนย์' },
              { s: 's', v: h, unit: 'm', d: 'ความสูงของตึก' },
              { s: 'a', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง ทิศเดียวกับการตก' }],
      finds: [{ s: 't', unit: 's', d: 'เวลาที่ใช้ตกถึงพื้น', value: t, positive: true }],
      sol: {
        analyze: 'การตกอิสระคือการเคลื่อนที่ด้วยความเร่งคงที่ ' + M('g') + ' ในแนวดิ่ง จึงใช้สมการการเคลื่อนที่ชุดเดิมได้<br>' +
          'คำว่า "<b>ปล่อย</b>" แปลว่าไม่มีการโยนหรือขว้าง ความเร็วต้น ' + M('u = 0') + '<br>' +
          'กำหนดให้<b>ทิศลงเป็นบวก</b> ทั้งการกระจัดและความเร่งจึงเป็นบวกทั้งคู่ ทำให้ไม่ต้องกังวลเรื่องเครื่องหมายลบ<br>' +
          'สิ่งที่รู้คือ ' + M('u') + ', ' + M('s') + ', ' + M('a') + ' และต้องการ ' + M('t'),
        eqs: [{ eq: 's = u t + (1/2) a t^2', why: 'เป็นสมการที่เชื่อม s, u, a และ t โดยไม่ต้องรู้ความเร็วปลาย' }],
        solve: '<div>เนื่องจาก ' + M('u = 0') + ' พจน์ ' + M('u t') + ' จึงหายไปทั้งพจน์ เหลือรูปที่ง่ายลงมาก</div>' +
          EQ('s = 0 + (1/2) a t^2', 's = (1/2) a t^2', 't^2 = 2 s / a', 't = √(2 s / a)'),
        subst: SEQ('t = √( (2)({s}) / {g} )', { s: h, g: g }),
        calc: EQ('t = √( ' + fmtq(2 * h) + ' / ' + fmtq(g) + ' )',
                 't = √' + fmtq(round2(2 * h / g)),
                 't = ' + fmtq(t) + ' `s`'),
        conclude: 'ดังนั้น <b>' + esc(ball) + 'ใช้เวลาตกถึงพื้น ' + U(t, 's') + '</b><br>' +
          '<span class="hint">ตรวจสอบ: ความเร็วขณะกระทบพื้นคือ ' + M('v = g t = ' + fmtq(g) + ' × ' + fmtq(t) + ' = ' + fmtq(v)) +
          ' m/s สมเหตุสมผลกับความสูงของตึก<br>' +
          'ข้อสังเกต: เวลาตกไม่ขึ้นกับมวลของวัตถุเลย ถ้าไม่คิดแรงต้านอากาศ</span>'
      }
    };
  }
});

T({
  id: 'k-vtgraph', topic: 1, sub: 'กราฟความเร็ว-เวลา', level: 'ปานกลาง',
  skills: ['อ่านกราฟ v-t', 'พื้นที่ใต้กราฟคือการกระจัด', 'ความชันคือความเร่ง'],
  gen(R) {
    const t3 = R.pick([16, 20, 24]), t1 = R.pick([4, 5]), t2 = t3 - R.pick([4, 5]);
    if (t2 <= t1 + 2) return null;
    const v1 = R.pick([10, 15, 20, 25, 30]);
    const askArea = R.f() < 0.6;
    const area = 0.5 * ((t3) + (t2 - t1)) * v1;
    const acc = r2(v1 / t1);
    if (!ok2(area, acc)) return null;
    return {
      stem: 'กราฟความเร็ว-เวลาของวัตถุหนึ่งเป็นดังรูป จงหา<b>' +
        (askArea ? 'ขนาดของการกระจัดทั้งหมด' : 'ความเร่งในช่วง ' + fmt(t1) + ' วินาทีแรก') + '</b>',
      figure: figVT({ tmax: t3, vmax: v1, tstep: 4, vstep: 5, pts: [[0, 0], [t1, v1], [t2, v1], [t3, 0]] }),
      given: [{ s: 'v_{สูงสุด}', v: v1, unit: 'm/s', d: 'ความเร็วช่วงคงที่' },
              { s: 't_1', v: t1, unit: 's', d: 'สิ้นสุดช่วงเร่ง' },
              { s: 't_2', v: t2, unit: 's', d: 'เริ่มชะลอ' },
              { s: 't_3', v: t3, unit: 's', d: 'หยุดนิ่ง' }],
      finds: askArea
        ? [{ s: 's', unit: 'm', d: 'การกระจัดทั้งหมด', value: area, positive: true }]
        : [{ s: 'a', unit: 'm/s²', d: 'ความเร่งช่วงแรก', value: acc, positive: true }],
      sol: {
        analyze: 'กราฟ ' + M('v-t') + ' อ่านได้สองอย่างที่สำคัญ:<br>' +
          '• <b>ความชัน</b>ของกราฟ = ความเร่ง<br>' +
          '• <b>พื้นที่ใต้กราฟ</b> = การกระจัด<br>' +
          'กราฟนี้แบ่งได้ 3 ช่วง: ช่วงแรกเส้นเฉียงขึ้น (เร่ง), ช่วงกลางเส้นราบ (ความเร็วคงที่ ความเร่งเป็นศูนย์), ' +
          'ช่วงท้ายเส้นเฉียงลง (ชะลอจนหยุด)<br>' +
          'ข้อนี้ถาม' + (askArea ? '<b>การกระจัด</b> จึงต้องหาพื้นที่ใต้กราฟ ซึ่งรูปทรงทั้งหมดเป็น<b>สี่เหลี่ยมคางหมู</b>'
                                : '<b>ความเร่งช่วงแรก</b> จึงต้องหาความชันของเส้นตรงช่วงแรก'),
        eqs: askArea
          ? [{ eq: 's = พื้นที่ใต้กราฟ = (1/2)(ผลบวกด้านคู่ขนาน) × สูง', why: 'ด้านคู่ขนานคือฐานล่าง (เวลาทั้งหมด) กับฐานบน (ช่วงที่ความเร็วคงที่) ส่วนความสูงคือความเร็วสูงสุด' }]
          : [{ eq: 'a = ความชัน = Δv / Δt', why: 'ความเร่งคือความชันของกราฟ v-t' }],
        solve: askArea
          ? EQ('ฐานล่าง = t_3', 'ฐานบน = t_2 - t_1', 's = (1/2)(ฐานล่าง + ฐานบน)(v_{สูงสุด})')
          : EQ('a = (v_{สูงสุด} - 0) / (t_1 - 0)'),
        subst: askArea
          ? SEQ('s = (1/2)({b1} + {b2})({v})', { b1: t3, b2: t2 - t1, v: v1 })
          : SEQ('a = {v} / {t}', { v: v1, t: t1 }),
        calc: askArea
          ? EQ('s = (1/2)(' + fmtq(t3 + t2 - t1) + ')(' + fmtq(v1) + ')', 's = ' + fmtq(area) + ' `m`')
          : EQ('a = ' + fmtq(acc) + ' `m/s`^2'),
        conclude: askArea
          ? 'ดังนั้น <b>การกระจัดทั้งหมดเท่ากับ ' + U(area, 'm') + '</b><br>' +
            '<span class="hint">กราฟอยู่เหนือแกนเวลาตลอด แสดงว่าวัตถุเคลื่อนที่ไปทางเดียวไม่ย้อนกลับ ' +
            'ระยะทางจึงเท่ากับการกระจัดพอดี</span>'
          : 'ดังนั้น <b>ความเร่งในช่วง ' + fmt(t1) + ' วินาทีแรกเท่ากับ ' + U(acc, 'm/s²') + '</b><br>' +
            '<span class="hint">ช่วงกลางกราฟราบ ความเร่งเป็นศูนย์ ส่วนช่วงท้ายกราฟลาดลง ความเร่งเป็นลบ (ความหน่วง)</span>'
      }
    };
  }
});

T({
  id: 'k-throwup', topic: 1, sub: 'การขว้างขึ้นในแนวดิ่ง', level: 'ยาก',
  skills: ['การตกอิสระ', 'เครื่องหมายทิศทาง', 'เงื่อนไขที่จุดสูงสุด'],
  gen(R, c) {
    const g = c.g, ball = R.pick(BALLS), tup = R.pick([2, 3, 4]);
    const u = r2(g * tup), h = r2(u * u / (2 * g)), ttot = r2(2 * tup);
    if (!ok2(u, h)) return null;
    const askH = R.f() < 0.55;
    return {
      stem: 'ขว้าง' + esc(ball) + 'ขึ้นไปในแนวดิ่งจากพื้นด้วยความเร็วต้น ' + U(u, 'm/s') +
        ' จงหา<b>' + (askH ? 'ความสูงสูงสุดที่' + esc(ball) + 'ขึ้นไปได้'
                           : 'เวลาทั้งหมดตั้งแต่ขว้างจนตกกลับถึงพื้น') + '</b> (กำหนด ' + GTXT(g) + ' ไม่คิดแรงต้านอากาศ)',
      given: [{ s: 'u', v: u, unit: 'm/s', d: 'ความเร็วต้น ทิศขึ้น' },
              { s: 'v', v: 0, unit: 'm/s', d: 'ความเร็วที่จุดสูงสุด' },
              { s: 'a', v: -g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง ทิศลง จึงเป็นลบ' }],
      finds: askH
        ? [{ s: 'h_{สูงสุด}', unit: 'm', d: 'ความสูงสูงสุด', value: h, positive: true }]
        : [{ s: 't_{ทั้งหมด}', unit: 's', d: 'เวลาไป-กลับทั้งหมด', value: ttot, positive: true }],
      sol: {
        analyze: 'กำหนดให้ <b>ทิศขึ้นเป็นบวก</b> ดังนั้นความเร่งโน้มถ่วงซึ่งชี้ลงต้องเป็น ' + M('a = -g') + '<br>' +
          'กุญแจสำคัญของโจทย์แนวนี้คือ <b>ที่จุดสูงสุด ความเร็วเป็นศูนย์</b> ' + M('v = 0') +
          ' (หยุดชั่วขณะก่อนจะตกกลับลงมา) แต่<b>ความเร่งไม่ได้เป็นศูนย์</b> ยังคงเป็น ' + M('g') + ' ชี้ลงตลอดเวลา<br>' +
          (askH ? 'ข้อนี้ถามความสูง จึงคิดเฉพาะ<b>ขาขึ้น</b> จากพื้นถึงจุดสูงสุด และไม่ต้องใช้เวลา จึงเลือกสมการที่ไม่มี ' + M('t')
                : 'ข้อนี้ถามเวลาไป-กลับ วิธีที่สั้นที่สุดคือหาเวลาขาขึ้นก่อน แล้วอาศัยความสมมาตร'),
        eqs: askH
          ? [{ eq: 'v^2 = u^2 + 2 a s', why: 'เชื่อม v, u, a, s โดยไม่ต้องรู้เวลา — ตรงกับสิ่งที่โจทย์ให้มาพอดี' }]
          : [{ eq: 'v = u + a t', why: 'ใช้หาเวลาขาขึ้น จากความเร็วต้นจนความเร็วเป็นศูนย์ที่จุดสูงสุด' },
             { eq: 't_{ทั้งหมด} = 2 t_{ขึ้น}', why: 'ขาขึ้นกับขาลงใช้เวลาเท่ากันพอดี เพราะเป็นการเคลื่อนที่ที่สมมาตร (ระยะเท่ากัน ความเร่งเท่ากัน)' }],
        solve: askH
          ? EQ('0 = u^2 + 2(-g) h_{สูงสุด}', '2 g h_{สูงสุด} = u^2', 'h_{สูงสุด} = u^2 / (2 g)')
          : EQ('0 = u + (-g) t_{ขึ้น}', 'g t_{ขึ้น} = u', 't_{ขึ้น} = u / g', 't_{ทั้งหมด} = 2 u / g'),
        subst: askH
          ? SEQ('h_{สูงสุด} = ({u})^2 / ( (2)({g}) )', { u: u, g: g })
          : SEQ('t_{ทั้งหมด} = (2)({u}) / {g}', { u: u, g: g }),
        calc: askH
          ? EQ('h_{สูงสุด} = ' + fmtq(u * u) + ' / ' + fmtq(2 * g), 'h_{สูงสุด} = ' + fmtq(h) + ' `m`')
          : EQ('t_{ทั้งหมด} = ' + fmtq(2 * u) + ' / ' + fmtq(g), 't_{ทั้งหมด} = ' + fmtq(ttot) + ' `s`'),
        conclude: askH
          ? 'ดังนั้น <b>' + esc(ball) + 'ขึ้นไปได้สูงสุด ' + U(h, 'm') + '</b><br>' +
            '<span class="hint">ข้อควรระวัง: ถ้าเผลอใช้ ' + M('a = +' + fmtq(g)) + ' จะได้ความสูงติดลบ ' +
            'ซึ่งเป็นสัญญาณว่ากำหนดทิศบวก-ลบผิด</span>'
          : 'ดังนั้น <b>เวลาทั้งหมดตั้งแต่ขว้างจนตกกลับถึงพื้นเท่ากับ ' + U(ttot, 's') + '</b><br>' +
            '<span class="hint">ตรวจสอบ: เวลาขาขึ้น ' + U(tup, 's') + ' และความเร็วขณะตกกลับถึงมือมีขนาดเท่าเดิมคือ ' +
            U(u, 'm/s') + ' แต่ทิศตรงข้าม</span>'
      }
    };
  }
});

T({
  id: 'k-multiphase', topic: 1, sub: 'การเคลื่อนที่หลายช่วง', level: 'ยาก',
  skills: ['แบ่งการเคลื่อนที่เป็นช่วง', 'เลือกสมการการเคลื่อนที่', 'รวมผลหลายช่วง'],
  gen(R) {
    const car = R.pick(CARS), a = R.pick([1.5, 2, 2.5]), t1 = R.pick([8, 10, 12]);
    const v = r2(a * t1), t2 = R.pick([10, 15, 20]), t3 = R.pick([4, 5, 6]);
    const s1 = r2(0.5 * a * t1 * t1), s2 = r2(v * t2), s3 = r2(0.5 * v * t3);
    const tot = r2(s1 + s2 + s3);
    if (!ok2(v, s1, s2, s3, tot)) return null;
    return {
      stem: esc(car) + 'ออกตัวจากหยุดนิ่ง เร่งด้วยความเร่งคงที่ ' + U(a, 'm/s²') + ' เป็นเวลา ' + U(t1, 's') +
        ' จากนั้นแล่นด้วยความเร็วคงที่อีก ' + U(t2, 's') +
        ' แล้วเบรกด้วยความหน่วงคงที่จนหยุดสนิทในเวลา ' + U(t3, 's') +
        ' จงหา<b>ระยะทางทั้งหมด</b>ที่' + esc(car) + 'เคลื่อนที่ได้',
      given: [{ s: 'a_1', v: a, unit: 'm/s²', d: 'ความเร่งช่วงที่ 1' },
              { s: 't_1', v: t1, unit: 's', d: 'เวลาช่วงเร่ง' },
              { s: 't_2', v: t2, unit: 's', d: 'เวลาช่วงความเร็วคงที่' },
              { s: 't_3', v: t3, unit: 's', d: 'เวลาช่วงเบรก' }],
      finds: [{ s: 's_{รวม}', unit: 'm', d: 'ระยะทางทั้งหมด', value: tot, positive: true }],
      sol: {
        analyze: 'การเคลื่อนที่นี้<b>ความเร่งไม่คงที่ตลอดเส้นทาง</b> จึงใช้สมการเดียวรวดเดียวไม่ได้ ' +
          'ต้อง<b>แบ่งเป็น 3 ช่วง</b> คิดทีละช่วงแล้วนำระยะมาบวกกัน<br>' +
          'ช่วงที่ 1 เร่งจากหยุดนิ่ง (' + M('u = 0') + ') · ช่วงที่ 2 ความเร็วคงที่ (' + M('a = 0') + ') · ' +
          'ช่วงที่ 3 ชะลอจนหยุด (' + M('v = 0') + ')<br>' +
          '<b>จุดเชื่อมสำคัญ:</b> ความเร็วปลายของช่วงที่ 1 คือความเร็วเดียวกับที่ใช้ตลอดช่วงที่ 2 ' +
          'และเป็นความเร็วต้นของช่วงที่ 3 ด้วย จึงต้องหาค่านี้ก่อนเป็นอันดับแรก',
        eqs: [{ eq: 'v = u + a_1 t_1', why: 'หาความเร็วเมื่อสิ้นสุดช่วงเร่ง ซึ่งเป็นตัวเชื่อมทั้งสามช่วง' },
               { eq: 's_1 = (1/2) a_1 t_1^2', why: 'ช่วงที่ 1 ออกตัวจากหยุดนิ่ง พจน์ u t จึงหายไป' },

function cosD(d) { return ANG[d][1]; }
function tanD(d) { return round2(ANG[d][0] / ANG[d][1]); }

      distract: askA ? [round2(F * m), round2(m / F), round2(F - m)] : [round2(F / m), round2(m + a), round2(F * 2)],
      sol: {

          '<b>ในทิศเดียวกับแรงลัพธ์</b> โดยแปรผันตรงกับแรง และแปรผกผันกับมวล<br>' +
          'ข้อนี้โจทย์ให้' + (askA ? 'แรงกับมวล ต้องการความเร่ง' : 'มวลกับความเร่ง ต้องการแรง'),
        eqs: [{ eq: 'ΣF = m a', why: 'กฎข้อที่ 2 ของนิวตัน — เชื่อมแรงลัพธ์ มวล และความเร่งเข้าด้วยกัน' }],
        solve: askA ? '<div>ย้าย ' + M('m') + ' มาหารทั้งสองข้าง</div>' + EQ('a = ΣF / m')
                    : '<div>' + M('ΣF') + ' อยู่โดดเดี่ยวแล้ว แทนค่าได้เลย</div>' + EQ('ΣF = m a'),
        subst: askA ? SEQ('a = {F} / {m}', { F: F, m: m }) : SEQ('ΣF = ({m})({a})', { m: m, a: a }),
        calc: askA ? EQ('a = ' + fmtq(a) + ' `m/s`^2') : EQ('ΣF = ' + fmtq(F) + ' `N`'),

          : 'ดังนั้น <b>ต้องออกแรงลัพธ์ ' + U(F, 'N') + '</b> ในทิศที่ต้องการให้' + esc(obj) + 'เคลื่อนที่'
      }
    };
  }
});

T({
  id: 'f-netline', topic: 2, sub: 'แรงลัพธ์ในแนวเดียวกัน', level: 'ง่าย',
  skills: ['รวมแรงในแนวเดียวกัน', 'สมการ F = ma', 'เครื่องหมายทิศทาง'],
  gen(R) {
    const m = R.pick([2, 4, 5, 8, 10]), F1 = R.step(20, 60, 5), F2 = R.step(5, F1 - 5, 5);
    const net = F1 - F2, a = r2(net / m);
    if (!ok2(a) || a < 0.5) return null;
    return {
      stem: 'กล่องมวล ' + U(m, 'kg') + ' วางบนพื้นลื่น มีแรงกระทำสองแรงในแนวราบ คือ ' +
        U(F1, 'N') + ' ไปทางขวา และ ' + U(F2, 'N') + ' ไปทางซ้าย จงหา<b>ความเร่ง</b>ของกล่อง',
      figure: figForcesPoint({ body: 'box', forces: [{ deg: 0, label: 'F₁', len: 74 }, { deg: 180, label: 'F₂', len: 52 }] }),
      given: [{ s: 'F_1', v: F1, unit: 'N', d: 'แรงไปทางขวา (บวก)' },
              { s: 'F_2', v: F2, unit: 'N', d: 'แรงไปทางซ้าย (ลบ)' },
              { s: 'm', v: m, unit: 'kg', d: 'มวลของกล่อง' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่ง', value: a, positive: true }],
      distract: [round2((F1 + F2) / m), round2(net), round2(m / net), round2(F1 / m)],
      sol: {
        analyze: 'แรงเป็นปริมาณ<b>เวกเตอร์</b> เมื่ออยู่ในแนวเดียวกันจะรวมกันได้โดยใส่เครื่องหมายบอกทิศ<br>' +
          'กำหนดให้ <b>ทิศขวาเป็นบวก</b> ดังนั้น ' + M('F_1') + ' เป็นบวก และ ' + M('F_2') + ' เป็นลบ<br>' +
          'เมื่อได้แรงลัพธ์แล้วจึงใช้กฎข้อที่ 2 ของนิวตันหาความเร่งต่อ',
        eqs: [{ eq: 'ΣF = F_1 - F_2', why: 'รวมแรงในแนวเดียวกัน โดยแรงที่มีทิศตรงข้ามกับทิศบวกต้องใส่เครื่องหมายลบ' },
               { eq: 'ΣF = m a', why: 'กฎข้อที่ 2 ของนิวตัน ใช้หาความเร่งจากแรงลัพธ์' }],
        solve: EQ('m a = F_1 - F_2', 'a = (F_1 - F_2) / m'),
        subst: SEQ('a = ({F1} - {F2}) / {m}', { F1: F1, F2: F2, m: m }),
        calc: EQ('a = ' + fmtq(net) + ' / ' + fmtq(m), 'a = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>กล่องมีความเร่ง ' + U(a, 'm/s²') + ' มีทิศไปทางขวา</b><br>' +
          '<span class="hint">ได้ค่าเป็นบวก แปลว่าความเร่งมีทิศเดียวกับที่กำหนดให้เป็นบวก คือไปทางขวา ' +
          'ตามแรงที่มากกว่า</span>'
      }
    };
  }
});

T({

        'ปรากฏว่า' + esc(obj) + 'เคลื่อนที่ด้วย<b>ความเร็วคงที่</b> จงหา<b>ขนาดของแรงเสียดทาน</b>ที่พื้นกระทำต่อ' + esc(obj),

        analyze: 'คำว่า "<b>ความเร็วคงที่</b>" เป็นกุญแจของข้อนี้ — ความเร็วไม่เปลี่ยน แปลว่า<b>ความเร่งเป็นศูนย์</b><br>' +
          'ตามกฎข้อที่ 1 ของนิวตัน วัตถุที่เคลื่อนที่ด้วยความเร็วคงที่ (หรือหยุดนิ่ง) ต้องมี<b>แรงลัพธ์เป็นศูนย์</b><br>' +
          'ในแนวราบมีแรงสองแรงคือ แรงลาก ' + M('F') + ' ไปข้างหน้า และแรงเสียดทาน ' + M('f') +
          ' ที่ต้านการเคลื่อนที่ ชี้ไปข้างหลัง<br>' +
          '<b>ข้อควรระวัง:</b> เคลื่อนที่อยู่ ไม่ได้แปลว่าต้องมีแรงลัพธ์ — แรงลัพธ์ทำให้ความเร็ว<b>เปลี่ยน</b> ไม่ใช่ทำให้เคลื่อนที่',
        eqs: [{ eq: 'ΣF = m a', why: 'กฎข้อที่ 2 ของนิวตัน' },
               { eq: 'ΣF = 0', why: 'เพราะความเร่งเป็นศูนย์ (a = 0) แรงลัพธ์จึงต้องเป็นศูนย์ด้วย — นี่คือสมดุลต่อการเลื่อนที่' }],
        solve: EQ('F - f = 0', 'f = F'),
        subst: SEQ('f = {F}', { F: F }),
        calc: EQ('f = ' + fmtq(F) + ' `N`'),
        conclude: 'ดังนั้น <b>แรงเสียดทานมีขนาด ' + U(F, 'N') + '</b> มีทิศตรงข้ามกับการเคลื่อนที่<br>' +
          '<span class="hint">แรงลากกับแรงเสียดทานมีขนาดเท่ากันแต่ทิศตรงข้าม จึงหักล้างกันหมดพอดี ' +
          '(สองแรงนี้<b>ไม่ใช่</b>คู่แรงกิริยา-ปฏิกิริยา เพราะกระทำต่อวัตถุก้อนเดียวกัน)</span>'

T({
  id: 'f-perp', topic: 2, sub: 'แรงลัพธ์ของแรงตั้งฉาก', level: 'ปานกลาง',
  skills: ['รวมแรงแบบเวกเตอร์', 'ทฤษฎีบทพีทาโกรัส', 'สมการ F = ma'],
  gen(R) {
    const k = R.pick([1, 2, 3, 4, 5, 10]);
    const tri = R.pick([[3, 4, 5], [5, 12, 13], [8, 15, 17]]);
    const F1 = tri[0] * k, F2 = tri[1] * k, Rr = tri[2] * k;
    const m = R.pick([2, 4, 5, 10]);
    const a = r2(Rr / m);
    if (!ok2(a) || F1 < 5 || Rr > 400) return null;
    return {
      stem: 'แรงสองแรงกระทำต่อวัตถุมวล ' + U(m, 'kg') + ' ที่จุดเดียวกัน โดยแรงแรกขนาด ' + U(F1, 'N') +
        ' มีทิศไปทางขวา และแรงที่สองขนาด ' + U(F2, 'N') + ' มีทิศขึ้นในแนวดิ่ง <b>ตั้งฉากกัน</b> ' +
        'จงหา<b>ขนาดของแรงลัพธ์</b> และ<b>ขนาดความเร่ง</b>ของวัตถุ',
      figure: figForcesPoint({ forces: [{ deg: 0, label: 'F₁', len: 66 }, { deg: 90, label: 'F₂', len: 66 }] }),
      given: [{ s: 'F_1', v: F1, unit: 'N', d: 'แรงในแนวราบ' },
              { s: 'F_2', v: F2, unit: 'N', d: 'แรงในแนวดิ่ง' },
              { s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' }],
      finds: [{ s: 'R', unit: 'N', d: 'ขนาดแรงลัพธ์', value: Rr, positive: true },
              { s: 'a', unit: 'm/s²', d: 'ขนาดความเร่ง', value: a, positive: true }],
      sol: {
        analyze: 'แรงสองแรงนี้<b>ไม่ได้อยู่ในแนวเดียวกัน</b> จึงบวกกันตรง ๆ ไม่ได้ ต้องรวมแบบเวกเตอร์<br>' +
          'เมื่อแรงทั้งสองตั้งฉากกันพอดี การรวมเวกเตอร์จะกลายเป็นการหาด้านตรงข้ามมุมฉากของสามเหลี่ยมมุมฉาก ' +
          'ใช้ทฤษฎีบทพีทาโกรัสได้ทันที<br>' +
          'เมื่อได้แรงลัพธ์แล้วจึงใช้กฎข้อที่ 2 ของนิวตันหาความเร่ง',
        eqs: [{ eq: 'R = √(F_1^2 + F_2^2)', why: 'ขนาดแรงลัพธ์ของแรงสองแรงที่ตั้งฉากกัน หาได้จากทฤษฎีบทพีทาโกรัส' },
               { eq: 'a = R / m', why: 'กฎข้อที่ 2 ของนิวตัน จัดรูปแล้วเพื่อหาความเร่ง' }],
        solve: EQ('R = √(F_1^2 + F_2^2)', 'a = R / m'),
        subst: SEQ('R = √( ({F1})^2 + ({F2})^2 )', { F1: F1, F2: F2 }) + SEQ('a = R / {m}', { m: m }),
        calc: EQ('R = √(' + fmtq(F1 * F1) + ' + ' + fmtq(F2 * F2) + ')', 'R = √' + fmtq(Rr * Rr),
                 'R = ' + fmtq(Rr) + ' `N`', 'a = ' + fmtq(Rr) + ' / ' + fmtq(m), 'a = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>แรงลัพธ์มีขนาด ' + U(Rr, 'N') + '</b> และ <b>วัตถุมีความเร่ง ' + U(a, 'm/s²') + '</b><br>' +
          '<span class="hint">ข้อควรระวัง: ห้ามบวกกันเป็น ' + U(F1 + F2, 'N') +
          ' แรงลัพธ์ของแรงตั้งฉากจะน้อยกว่าผลบวกตรง ๆ เสมอ<br>' +
          'ทิศของแรงลัพธ์เอียงทำมุม ' + M('θ') + ' กับแนวราบ โดย ' + M('tan θ = F_2/F_1 = ' + fmtq(round2(F2 / F1))) + '</span>'
      }
    };
  }
});

T({
  id: 'f-friction', topic: 2, sub: 'แรงเสียดทานบนพื้นราบ', level: 'ปานกลาง',
  skills: ['แรงเสียดทานจลน์', 'แรงตั้งฉาก', 'สมการ F = ma', 'วาดแผนภาพวัตถุอิสระ'],
  gen(R, c) {
    const g = c.g, obj = R.pick(BOXES), m = R.pick([4, 5, 8, 10, 20]);
    const mu = R.pick([0.2, 0.25, 0.3, 0.4, 0.5]), a = R.pick([1, 1.5, 2, 2.5, 3]);
    const N = r2(m * g), f = r2(mu * N), F = r2(m * a + f);
    if (!ok2(N, f, F)) return null;
    return {
      stem: 'ออกแรง ' + U(F, 'N') + ' ในแนวขนานกับพื้น ลาก' + esc(obj) + 'มวล ' + U(m, 'kg') +
        ' ไปตามพื้นราบที่มีสัมประสิทธิ์ความเสียดทานจลน์ ' + M('μ_k = ' + fmtq(mu)) +
        ' จงหา<b>ความเร่ง</b>ของ' + esc(obj) + ' (กำหนด ' + GTXT(g) + ')',
      figure: figChain({ masses: ['m'], F: 'F' }),
      given: [{ s: 'F', v: F, unit: 'N', d: 'แรงลาก ขนานพื้น' },
              { s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานจลน์' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่ง', value: a, positive: true }],
      sol: {
        analyze: 'เขียนแผนภาพวัตถุอิสระก่อน จะเห็นแรงกระทำต่อ' + esc(obj) + ' 4 แรง คือ ' +
          'น้ำหนัก ' + M('mg') + ' ชี้ลง, แรงตั้งฉาก ' + M('N') + ' ชี้ขึ้น, แรงลาก ' + M('F') +
          ' ไปข้างหน้า และแรงเสียดทาน ' + M('f') + ' ต้านไว้ข้างหลัง<br>' +
          '<b>แนวดิ่ง</b> ไม่มีการเคลื่อนที่ขึ้นหรือลง จึงสมดุล ได้ ' + M('N = mg') +
          ' — ต้องหา ' + M('N') + ' ก่อน เพราะแรงเสียดทานขึ้นกับแรงตั้งฉาก ไม่ได้ขึ้นกับแรงลาก<br>' +
          '<b>แนวราบ</b> มีการเคลื่อนที่ด้วยความเร่ง จึงใช้ ' + M('ΣF = ma'),
        eqs: [{ eq: 'N = m g', why: 'แนวดิ่งสมดุล แรงตั้งฉากจึงเท่ากับน้ำหนัก (กรณีพื้นราบและแรงลากขนานพื้นเท่านั้น)' },
               { eq: 'f = μ_k N', why: 'แรงเสียดทานจลน์แปรผันตรงกับแรงตั้งฉาก' },
               { eq: 'ΣF = F - f = m a', why: 'กฎข้อที่ 2 ในแนวราบ แรงเสียดทานมีทิศตรงข้ามการเคลื่อนที่จึงเป็นลบ' }],
        solve: EQ('F - μ_k m g = m a', 'a = (F - μ_k m g) / m'),
        subst: SEQ('N = ({m})({g})', { m: m, g: g }) +
               SEQ('f = ({mu})({N})', { mu: mu, N: N }) +
               SEQ('a = ({F} - {f}) / {m}', { F: F, f: f, m: m }),
        calc: EQ('N = ' + fmtq(N) + ' `N`', 'f = ' + fmtq(f) + ' `N`',
                 'a = ' + fmtq(round2(F - f)) + ' / ' + fmtq(m), 'a = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>' + esc(obj) + 'เคลื่อนที่ด้วยความเร่ง ' + U(a, 'm/s²') + '</b><br>' +
          '<span class="hint">แรงลาก ' + U(F, 'N') + ' ถูกใช้ไปเอาชนะแรงเสียดทาน ' + U(f, 'N') +
          ' ส่วนที่เหลือ ' + U(round2(F - f), 'N') + ' จึงเป็นแรงลัพธ์ที่ทำให้เกิดความเร่ง</span>'
      }
    };
  }
});

T({
  id: 'f-elevator', topic: 2, sub: 'น้ำหนักปรากฏในลิฟต์', level: 'ปานกลาง',
  skills: ['วาดแผนภาพวัตถุอิสระ', 'สมการ F = ma', 'เครื่องหมายทิศทาง'],
  gen(R, c) {
    const g = c.g, nm = R.pick(NAMES), m = R.pick([40, 50, 60, 70, 80]), a = R.pick([1, 1.5, 2, 2.5, 3]);
    const up = R.f() < 0.5;
    const N = r2(m * (g + (up ? a : -a)));
    if (!ok2(N) || N <= 0) return null;
    return {
      stem: esc(nm) + 'มวล ' + U(m, 'kg') + ' ยืนอยู่บนเครื่องชั่งในลิฟต์ ขณะที่ลิฟต์กำลัง<b>' +
        (up ? 'เคลื่อนที่ขึ้นด้วยความเร่ง' : 'เคลื่อนที่ลงด้วยความเร่ง') + ' ' + fmt(a) + ' m/s²</b> ' +
        'จงหา<b>แรงที่เครื่องชั่งดันตัว' + esc(nm) + '</b> (น้ำหนักที่เครื่องชั่งอ่านได้) (กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของ' + nm },
              { s: 'a', v: a, unit: 'm/s²', d: 'ความเร่งของลิฟต์ ทิศ' + (up ? 'ขึ้น' : 'ลง') },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'N', unit: 'N', d: 'แรงที่เครื่องชั่งดันขึ้น', value: N, positive: true }],
      sol: {
        analyze: 'สิ่งที่เครื่องชั่งอ่านได้ ไม่ใช่น้ำหนักจริง แต่คือ<b>แรงที่เครื่องชั่งดันตัวเราขึ้น</b> ' +
          '(แรงตั้งฉาก ' + M('N') + ') ตามกฎข้อที่ 3 ของนิวตัน<br>' +
          'เขียนแผนภาพวัตถุอิสระของ' + esc(nm) + ' มีแรงสองแรงคือ ' + M('N') + ' ชี้ขึ้น และ ' + M('mg') + ' ชี้ลง<br>' +
          'กำหนดให้ <b>ทิศขึ้นเป็นบวก</b> ลิฟต์เร่ง' + (up ? 'ขึ้น จึงได้ ' + M('a') + ' เป็นบวก'
            : 'ลง จึงได้ ' + M('a') + ' เป็นลบ') + '<br>' +
          'เมื่อมีความเร่ง แรงลัพธ์ต้อง<b>ไม่</b>เป็นศูนย์ ดังนั้น ' + M('N ≠ mg'),
        eqs: [{ eq: 'ΣF = m a', why: 'กฎข้อที่ 2 ของนิวตัน ใช้กับ' + nm + 'ในแนวดิ่ง' },
               { eq: 'N - m g = m a', why: 'แทนแรงลัพธ์ในแนวดิ่ง: แรงขึ้น N ลบด้วยแรงลง mg' }],
        solve: EQ('N = m g + m a', 'N = m (g + a)'),
        subst: SEQ('N = ({m})({g} + ({a}))', { m: m, g: g, a: up ? a : -a }),
        calc: EQ('N = (' + fmtq(m) + ')(' + fmtq(round2(g + (up ? a : -a))) + ')', 'N = ' + fmtq(N) + ' `N`'),
        conclude: 'ดังนั้น <b>เครื่องชั่งอ่านแรงได้ ' + U(N, 'N') + '</b><br>' +
          '<span class="hint">น้ำหนักจริงของ' + esc(nm) + 'คือ ' + U(round2(m * g), 'N') +
          ' แต่ขณะลิฟต์เร่ง' + (up ? 'ขึ้น เครื่องชั่งอ่านได้<b>มากกว่า</b>ปกติ — รู้สึกตัวหนักขึ้น'
            : 'ลง เครื่องชั่งอ่านได้<b>น้อยกว่า</b>ปกติ — รู้สึกตัวเบาลง') + '<br>' +
          'ถ้าลิฟต์เคลื่อนที่ด้วยความเร็วคงที่ ' + M('a = 0') + ' เครื่องชั่งจะอ่านได้เท่าน้ำหนักจริงพอดี</span>'
      }
    };
  }
});

T({
  id: 'f-angledpull', topic: 2, sub: 'แรงดึงทำมุมกับแนวราบ', level: 'ปานกลาง',
  skills: ['แยกองค์ประกอบของแรง', 'แรงตั้งฉาก', 'สมการ F = ma'],
  gen(R, c) {
    const g = c.g, obj = R.pick(BOXES), deg = R.pick([30, 37, 53, 60]);
    const m = R.pick([5, 10, 20]), F = R.step(20, 100, 10);
    const Fx = r2(F * cosD(deg)), Fy = r2(F * sinD(deg));
    const N = r2(m * g - Fy), a = r2(Fx / m);
    if (!ok2(Fx, Fy, N, a) || N <= 0 || a < 0.4) return null;
    return {
      stem: 'ออกแรง ' + U(F, 'N') + ' ดึง' + esc(obj) + 'มวล ' + U(m, 'kg') +
        ' บนพื้นราบลื่น โดยแรงทำมุม ' + fmt(deg) + '° กับแนวราบ (ดึงเฉียงขึ้น) ' +
        'จงหา<b>แรงที่พื้นดันวัตถุ</b> และ<b>ความเร่ง</b>ของ' + esc(obj) + ' (กำหนด ' + GTXT(g) + ')',
      figure: figForcesPoint({ body: 'box', forces: [{ deg: deg, label: 'F', len: 74 }, { deg: 270, label: 'mg', len: 56 }] }),
      given: [{ s: 'F', v: F, unit: 'N', d: 'แรงดึง ทำมุม ' + fmt(deg) + '° กับแนวราบ' },
              { s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมที่แรงทำกับแนวราบ' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'N', unit: 'N', d: 'แรงที่พื้นดันวัตถุ', value: N, positive: true },
              { s: 'a', unit: 'm/s²', d: 'ความเร่ง', value: a, positive: true }],
      sol: {
        analyze: 'แรงดึงเอียงทำมุมกับพื้น จึงต้อง<b>แยกแรงออกเป็นสององค์ประกอบที่ตั้งฉากกัน</b>ก่อน ' +
          'คือแนวราบกับแนวดิ่ง แล้วค่อยคิดแยกแกน<br>' +
          '• องค์ประกอบแนวราบ ' + M('F cos θ') + ' เป็นตัวลาก' + esc(obj) + 'ให้เคลื่อนที่<br>' +
          '• องค์ประกอบแนวดิ่ง ' + M('F sin θ') + ' ช่วย<b>ยก</b>' + esc(obj) + 'ขึ้น ทำให้พื้นดันน้อยลง<br>' +
          '<b>แนวดิ่ง</b> วัตถุไม่ลอยขึ้นและไม่จมลง จึงสมดุล · <b>แนวราบ</b> เกิดความเร่ง ใช้ ' + M('ΣF = ma') + '<br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg + '° = ' + fmtq(sinD(deg))) + ' และ ' + M('cos ' + deg + '° = ' + fmtq(cosD(deg))),
        eqs: [{ eq: 'ΣF_y = N + F sin θ - m g = 0', why: 'แนวดิ่งสมดุล — แรงดันพื้นและองค์ประกอบแนวดิ่งของแรงดึงช่วยกันรับน้ำหนัก' },
               { eq: 'ΣF_x = F cos θ = m a', why: 'แนวราบไม่มีเสียดทาน (พื้นลื่น) เหลือแรงลากอย่างเดียว' }],
        solve: EQ('N = m g - F sin θ', 'a = F cos θ / m'),
        subst: SEQ('N = ({m})({g}) - ({F})({sn})', { m: m, g: g, F: F, sn: sinD(deg) }) +
               SEQ('a = ({F})({cs}) / {m}', { F: F, cs: cosD(deg), m: m }),
        calc: EQ('N = ' + fmtq(round2(m * g)) + ' - ' + fmtq(Fy), 'N = ' + fmtq(N) + ' `N`',
                 'a = ' + fmtq(Fx) + ' / ' + fmtq(m), 'a = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>พื้นดัน' + esc(obj) + 'ด้วยแรง ' + U(N, 'N') + '</b> และ <b>' + esc(obj) +
          'มีความเร่ง ' + U(a, 'm/s²') + '</b><br>' +
          '<span class="hint">สังเกตว่า ' + M('N') + ' น้อยกว่าน้ำหนัก ' + U(round2(m * g), 'N') +
          ' เพราะแรงดึงเฉียงขึ้นช่วยรับน้ำหนักไว้บางส่วน — นี่คือเหตุผลที่ลากของแบบเฉียงขึ้นจะเบาแรงกว่าดันแบบเฉียงลง</span>'
      }
    };
  }
});

T({
  id: 'f-twoblocks', topic: 2, sub: 'วัตถุสองก้อนติดกัน', level: 'ปานกลาง',
  skills: ['กฎข้อที่ 3 ของนิวตัน', 'คิดระบบรวมแล้วแยกก้อน', 'สมการ F = ma'],
  gen(R) {
    const m1 = R.pick([2, 3, 4, 5]), m2 = R.pick([1, 2, 3, 6]);
    const a = R.pick([2, 2.5, 3, 4, 5]);
    const F = r2((m1 + m2) * a), C = r2(m2 * a);
    if (!ok2(F, C) || m1 === m2) return null;
    return {
      stem: 'กล่อง A มวล ' + U(m1, 'kg') + ' และกล่อง B มวล ' + U(m2, 'kg') +
        ' วางชิดติดกันบนพื้นลื่น ออกแรง ' + U(F, 'N') + ' ผลักกล่อง A ในแนวราบให้ดันกล่อง B ไปด้วยกัน ' +
        'จงหา<b>ความเร่งของระบบ</b> และ<b>ขนาดแรงที่กล่อง A ผลักกล่อง B</b>',
      figure: figChain({ masses: ['A', 'B'], Fleft: 'F' }),
      given: [{ s: 'm_A', v: m1, unit: 'kg', d: 'มวลกล่อง A' },
              { s: 'm_B', v: m2, unit: 'kg', d: 'มวลกล่อง B' },
              { s: 'F', v: F, unit: 'N', d: 'แรงผลักจากภายนอก' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่งของระบบ', value: a, positive: true },
              { s: 'F_{AB}', unit: 'N', d: 'แรงที่ A ผลัก B', value: C, positive: true }],
      sol: {
        analyze: 'กล่องสองใบชิดกันและเคลื่อนที่ไปด้วยกัน จึงมี<b>ความเร่งเท่ากัน</b><br>' +
          'เทคนิคของโจทย์แนวนี้คือทำ <b>2 ขั้น</b>:<br>' +
          '<b>ขั้นที่ 1</b> มองกล่องทั้งสองเป็น<b>ระบบเดียว</b> มวลรวม ' + M('m_A + m_B') +
          ' แรงที่กล่องดันกันเองเป็นแรงภายในระบบ หักล้างกันหมด เหลือแรง ' + M('F') + ' อย่างเดียว → หาความเร่งได้<br>' +
          '<b>ขั้นที่ 2</b> แยกมองเฉพาะ<b>กล่อง B ก้อนเดียว</b> แรงเดียวในแนวราบที่กระทำต่อ B คือแรงที่ A ผลัก ' +
          '→ หาแรงนั้นได้จาก ' + M('F_{AB} = m_B a') + '<br>' +
          '<span class="hint">อย่าใช้กล่อง A ในขั้นที่สอง เพราะ A มีสองแรงกระทำ ทำให้ซับซ้อนกว่าโดยไม่จำเป็น</span>',
        eqs: [{ eq: 'F = (m_A + m_B) a', why: 'ขั้นที่ 1 — กฎข้อที่ 2 กับระบบรวม แรงภายในระหว่างกล่องหักล้างกันเอง' },
               { eq: 'F_{AB} = m_B a', why: 'ขั้นที่ 2 — กฎข้อที่ 2 กับกล่อง B ก้อนเดียว ซึ่งถูกผลักด้วยแรงจาก A เท่านั้น' }],
        solve: EQ('a = F / (m_A + m_B)', 'F_{AB} = m_B a'),
        subst: SEQ('a = {F} / ({m1} + {m2})', { F: F, m1: m1, m2: m2 }) +
               SEQ('F_{AB} = ({m2})({a})', { m2: m2, a: a }),
        calc: EQ('a = ' + fmtq(F) + ' / ' + fmtq(m1 + m2), 'a = ' + fmtq(a) + ' `m/s`^2',
                 'F_{AB} = ' + fmtq(C) + ' `N`'),
        conclude: 'ดังนั้น <b>ระบบมีความเร่ง ' + U(a, 'm/s²') + '</b> และ <b>กล่อง A ผลักกล่อง B ด้วยแรง ' + U(C, 'N') + '</b><br>' +
          '<span class="hint">ตามกฎข้อที่ 3 ของนิวตัน กล่อง B ก็ผลักกลับกล่อง A ด้วยแรง ' + U(C, 'N') +
          ' เท่ากันแต่ทิศตรงข้าม — นี่คือคู่แรงกิริยา-ปฏิกิริยาที่แท้จริง เพราะกระทำต่อวัตถุ<b>คนละก้อน</b></span>'
      }
    };
  }
});

T({
  id: 'f-incline-smooth', topic: 2, sub: 'พื้นเอียงลื่น', level: 'ปานกลาง',
  skills: ['แยกองค์ประกอบของแรง', 'พื้นเอียง', 'สมการ F = ma'],
  gen(R, c) {
    const g = c.g, deg = R.pick([30, 37, 53]), m = R.pick([2, 4, 5, 10]);
    const a = r2(g * sinD(deg)), N = r2(m * g * cosD(deg));
    if (!ok2(a, N)) return null;
    return {
      stem: 'ปล่อยวัตถุมวล ' + U(m, 'kg') + ' ให้ไถลลงจากพื้นเอียง<b>ลื่น</b> (ไม่มีแรงเสียดทาน) ' +
        'ที่ทำมุม ' + fmt(deg) + '° กับแนวราบ จงหา<b>แรงที่พื้นเอียงดันวัตถุ</b> และ<b>ความเร่ง</b>ของวัตถุ ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figIncline({ deg: deg, mass: 'm', down: 'mg' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมเอียงของพื้น' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'N', unit: 'N', d: 'แรงตั้งฉากจากพื้นเอียง', value: N, positive: true },
              { s: 'a', unit: 'm/s²', d: 'ความเร่งตามพื้นเอียง', value: a, positive: true }],
      sol: {
        analyze: 'เทคนิคของโจทย์พื้นเอียงคือ <b>หมุนแกนอ้างอิง</b> ให้แกนหนึ่ง<b>ขนาน</b>กับพื้นเอียง ' +
          'และอีกแกน<b>ตั้งฉาก</b>กับพื้นเอียง เพราะวัตถุเคลื่อนที่ตามแนวพื้นเอียงเท่านั้น<br>' +
          'แรงที่กระทำมี 2 แรง คือ น้ำหนัก ' + M('mg') + ' ชี้ลงในแนวดิ่ง และแรงตั้งฉาก ' + M('N') + '<br>' +
          'แยกน้ำหนักออกเป็นสององค์ประกอบตามแกนใหม่:<br>' +
          '• ขนานพื้นเอียง ' + M('mg sin θ') + ' — ตัวนี้เท่านั้นที่ทำให้วัตถุไถลลง<br>' +
          '• ตั้งฉากพื้นเอียง ' + M('mg cos θ') + ' — ตัวนี้ถูกหักล้างด้วย ' + M('N') + ' พอดี<br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg + '° = ' + fmtq(sinD(deg))) + ', ' + M('cos ' + deg + '° = ' + fmtq(cosD(deg))),
        eqs: [{ eq: 'ΣF_{ตั้งฉาก} = N - m g cos θ = 0', why: 'ในแนวตั้งฉากกับพื้นเอียง วัตถุไม่ลอยขึ้นไม่จมลง จึงสมดุล' },
               { eq: 'ΣF_{ขนาน} = m g sin θ = m a', why: 'พื้นลื่นไม่มีเสียดทาน เหลือองค์ประกอบของน้ำหนักตามพื้นเอียงเป็นแรงลัพธ์' }],
        solve: EQ('N = m g cos θ', 'm a = m g sin θ', 'a = g sin θ'),
        subst: SEQ('N = ({m})({g})({cs})', { m: m, g: g, cs: cosD(deg) }) +
               SEQ('a = ({g})({sn})', { g: g, sn: sinD(deg) }),
        calc: EQ('N = ' + fmtq(N) + ' `N`', 'a = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>พื้นเอียงดันวัตถุด้วยแรง ' + U(N, 'N') + '</b> และ <b>วัตถุไถลลงด้วยความเร่ง ' +
          U(a, 'm/s²') + '</b><br>' +
          '<span class="hint">ผลลัพธ์ที่สำคัญ: ' + M('a = g sin θ') + ' <b>ไม่ขึ้นกับมวลเลย</b> ' +
          'วัตถุหนักหรือเบาก็ไถลลงพื้นเอียงลื่นด้วยความเร่งเท่ากัน<br>' +
          'และสังเกตว่า ' + M('N') + ' น้อยกว่าน้ำหนัก ' + U(round2(m * g), 'N') + ' เพราะพื้นเอียงรับน้ำหนักได้ไม่เต็มที่</span>'
      }
    };
  }
});

T({
  id: 'f-atwood', topic: 2, sub: 'เครื่องแอตวูด', level: 'ยาก',
  skills: ['ระบบที่มีเชือกและรอก', 'แยกสมการรายวัตถุ', 'แรงตึงเชือก'],
  gen(R, c) {
    const g = c.g, pairs = [[6, 4], [5, 3], [8, 2], [7, 3], [9, 6], [12, 8], [10, 6]];
    const pr = R.pick(pairs), m1 = pr[0], m2 = pr[1];
    const a = r2((m1 - m2) * g / (m1 + m2));
    const Tn = r2(2 * m1 * m2 * g / (m1 + m2));
    if (!ok2(a, Tn)) return null;
    return {
      stem: 'มวล ' + U(m1, 'kg') + ' และ ' + U(m2, 'kg') + ' ผูกปลายเชือกเบาที่คล้องผ่านรอกลื่นมวลเบา ' +
        'ดังรูป เมื่อปล่อยระบบให้เคลื่อนที่อย่างอิสระ จงหา<b>ความเร่งของระบบ</b> และ<b>แรงตึงในเส้นเชือก</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figPulley({ m1: 'm&#8321;', m2: 'm&#8322;' }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลก้อนหนัก (เคลื่อนลง)' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลก้อนเบา (เคลื่อนขึ้น)' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่งของระบบ', value: a, positive: true },
              { s: 'T', unit: 'N', d: 'แรงตึงเชือก', value: Tn, positive: true }],
      sol: {
        analyze: 'ข้อสมมติสำคัญของระบบนี้:<br>' +
          '• <b>เชือกเบาและไม่ยืด</b> ⇒ มวลทั้งสองมี<b>ขนาดความเร่งเท่ากัน</b> (แต่ทิศตรงข้าม)<br>' +
          '• <b>รอกลื่นและเบา</b> ⇒ แรงตึงเชือก ' + M('T') + ' <b>เท่ากันตลอดทั้งเส้น</b><br>' +
          'เนื่องจาก ' + M('m_1 > m_2') + ' ระบบจะเคลื่อนที่โดย ' + M('m_1') + ' ลง และ ' + M('m_2') + ' ขึ้น<br>' +
          '<b>เทคนิค:</b> กำหนดทิศบวกตาม<b>ทิศที่ระบบเคลื่อนที่จริง</b> คือ ก้อนหนักบวกลง ก้อนเบาบวกขึ้น ' +
          'แล้วเขียนสมการ ' + M('ΣF = ma') + ' แยกทีละก้อน จะได้ 2 สมการ 2 ตัวไม่ทราบค่า (' + M('a') + ' กับ ' + M('T') + ')',
        eqs: [{ eq: 'ก้อนที่ 1 :  m_1 g - T = m_1 a', why: 'ก้อนหนักเคลื่อนลง แรงลง (น้ำหนัก) มากกว่าแรงขึ้น (แรงตึง)' },
               { eq: 'ก้อนที่ 2 :  T - m_2 g = m_2 a', why: 'ก้อนเบาเคลื่อนขึ้น แรงตึงเชือกมากกว่าน้ำหนัก' }],
        solve: '<div>นำสองสมการมา<b>บวกกัน</b> ' + M('T') + ' จะตัดกันหายไปทันที เหลือตัวไม่ทราบค่าเดียวคือ ' + M('a') + '</div>' +
          EQ('m_1 g - m_2 g = m_1 a + m_2 a', '(m_1 - m_2) g = (m_1 + m_2) a',
             'a = (m_1 - m_2) g / (m_1 + m_2)') +
          '<div>แล้วนำ ' + M('a') + ' ที่ได้ไปแทนกลับในสมการก้อนที่ 2 เพื่อหา ' + M('T') + '</div>' +
          EQ('T = m_2 (g + a)'),
        subst: SEQ('a = ({m1} - {m2})({g}) / ({m1} + {m2})', { m1: m1, m2: m2, g: g }) +
               SEQ('T = ({m2})({g} + {a})', { m2: m2, g: g, a: a }),
        calc: EQ('a = (' + fmtq(m1 - m2) + ')(' + fmtq(g) + ') / ' + fmtq(m1 + m2),
                 'a = ' + fmtq(round2((m1 - m2) * g)) + ' / ' + fmtq(m1 + m2),
                 'a = ' + fmtq(a) + ' `m/s`^2',
                 'T = (' + fmtq(m2) + ')(' + fmtq(round2(g + a)) + ')',
                 'T = ' + fmtq(Tn) + ' `N`'),
        conclude: 'ดังนั้น <b>ระบบมีความเร่ง ' + U(a, 'm/s²') + '</b> (ก้อน ' + fmt(m1) + ' kg ลง, ก้อน ' + fmt(m2) +
          ' kg ขึ้น) และ <b>แรงตึงเชือก ' + U(Tn, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบความสมเหตุสมผล:</b> แรงตึง ' + U(Tn, 'N') +
          ' ต้องมีค่าอยู่<b>ระหว่าง</b>น้ำหนักของสองก้อน คือระหว่าง ' + U(round2(m2 * g), 'N') + ' กับ ' +
          U(round2(m1 * g), 'N') + ' ✓<br>' +
          'ถ้าคำนวณได้แรงตึงมากกว่าน้ำหนักก้อนหนัก หรือน้อยกว่าน้ำหนักก้อนเบา แสดงว่าคำนวณผิดแน่นอน</span>'
      }
    };
  }
});

T({
  id: 'f-tablepulley', topic: 2, sub: 'มวลบนโต๊ะผูกเชือกข้ามรอก', level: 'ยาก',
  skills: ['ระบบที่มีเชือกและรอก', 'แรงเสียดทานจลน์', 'แยกสมการรายวัตถุ'],
  gen(R, c) {
    const g = c.g, mu = R.pick([0.2, 0.25, 0.4, 0.5]), m1 = R.pick([2, 4, 5, 8, 10]);
    const k = R.pick([0.25, 0.4, 0.5, 0.6]);
    const m2 = r2(m1 * (k + mu) / (1 - k));
    if (!(m2 > 0.9 && m2 <= 20) || dpOf(m2, 4) > 0) return null;
    const a = r2(g * k), Tn = r2(m2 * (g - a));
    const N = r2(m1 * g), f = r2(mu * N);
    if (!ok2(a, Tn, N, f)) return null;
    return {
      stem: 'วัตถุ A มวล ' + U(m1, 'kg') + ' วางบนโต๊ะในแนวราบ ผูกเชือกเบาคล้องผ่านรอกลื่นที่ขอบโต๊ะ ' +
        'ปลายอีกข้างผูกวัตถุ B มวล ' + U(m2, 'kg') + ' ห้อยอยู่ ถ้าสัมประสิทธิ์ความเสียดทานจลน์ระหว่าง A กับโต๊ะเป็น ' +
        M('μ_k = ' + fmtq(mu)) + ' จงหา<b>ความเร่งของระบบ</b> และ<b>แรงตึงเชือก</b> (กำหนด ' + GTXT(g) + ')',
      figure: figTablePulley({ m1: 'A', m2: 'B', fric: 'f' }),
      given: [{ s: 'm_A', v: m1, unit: 'kg', d: 'มวลบนโต๊ะ' },
              { s: 'm_B', v: m2, unit: 'kg', d: 'มวลที่ห้อย' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานจลน์' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่งของระบบ', value: a, positive: true },
              { s: 'T', unit: 'N', d: 'แรงตึงเชือก', value: Tn, positive: true }],
      sol: {
        analyze: 'ระบบนี้มีวัตถุสองก้อนเคลื่อนที่ใน<b>แนวคนละแนว</b> — A ไปตามแนวราบ ส่วน B ตกลงในแนวดิ่ง<br>' +
          'แต่เชือกเบาไม่ยืดคล้องรอกลื่น ทำให้:<br>' +
          '• ทั้งสองก้อนมี<b>ขนาดความเร่งเท่ากัน</b> · • <b>แรงตึงเชือกเท่ากัน</b>ทั้งเส้น<br>' +
          'B ที่ห้อยอยู่จะดึงระบบให้เคลื่อนที่ กำหนดทิศบวกตามการเคลื่อนที่จริง คือ A ไปทางขวา และ B ลง<br>' +
          '<b>สำหรับ A</b> ต้องหาแรงตั้งฉากก่อน — A อยู่บนโต๊ะราบ ไม่มีแรงกดหรือยกในแนวดิ่ง จึงได้ ' + M('N = m_A g') +
          ' แล้วจึงหาแรงเสียดทาน ' + M('f = μ_k N') + ' ซึ่งต้านการเคลื่อนที่ ชี้ไปทางซ้าย',
        eqs: [{ eq: 'N = m_A g', why: 'แนวดิ่งของ A สมดุล เพราะ A ไม่ได้ลอยขึ้นหรือจมลงในโต๊ะ' },
               { eq: 'f = μ_k N = μ_k m_A g', why: 'แรงเสียดทานจลน์ ต้านการเคลื่อนที่ของ A' },
               { eq: 'วัตถุ A :  T - f = m_A a', why: 'แนวราบของ A — แรงตึงลากไปข้างหน้า แรงเสียดทานฉุดไว้' },
               { eq: 'วัตถุ B :  m_B g - T = m_B a', why: 'แนวดิ่งของ B — น้ำหนักดึงลง แรงตึงฉุดขึ้น' }],
        solve: '<div>บวกสองสมการสุดท้ายเข้าด้วยกัน ' + M('T') + ' จะตัดกันหายไป</div>' +
          EQ('m_B g - f = (m_A + m_B) a', 'm_B g - μ_k m_A g = (m_A + m_B) a',
             'a = (m_B - μ_k m_A) g / (m_A + m_B)') +
          '<div>แล้วแทน ' + M('a') + ' กลับในสมการของ B เพื่อหาแรงตึง</div>' + EQ('T = m_B (g - a)'),
        subst: SEQ('N = ({m1})({g})', { m1: m1, g: g }) +
               SEQ('f = ({mu})({N})', { mu: mu, N: N }) +
               SEQ('a = ({m2} - ({mu})({m1}))({g}) / ({m1} + {m2})', { m1: m1, m2: m2, mu: mu, g: g }) +
               SEQ('T = ({m2})({g} - {a})', { m2: m2, g: g, a: a }),
        calc: EQ('N = ' + fmtq(N) + ' `N`', 'f = ' + fmtq(f) + ' `N`',
                 'a = (' + fmtq(round2(m2 - mu * m1)) + ')(' + fmtq(g) + ') / ' + fmtq(m1 + m2),
                 'a = ' + fmtq(a) + ' `m/s`^2',
                 'T = (' + fmtq(m2) + ')(' + fmtq(round2(g - a)) + ')', 'T = ' + fmtq(Tn) + ' `N`'),
        conclude: 'ดังนั้น <b>ระบบมีความเร่ง ' + U(a, 'm/s²') + '</b> และ <b>แรงตึงเชือก ' + U(Tn, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> แรงตึง ' + U(Tn, 'N') + ' ต้องน้อยกว่าน้ำหนักของ B (' +
          U(round2(m2 * g), 'N') + ') ✓ ไม่เช่นนั้น B จะตกลงไม่ได้<br>' +
          'ข้อสังเกต: ถ้าแรงเสียดทานมากจนทำให้ ' + M('m_B g < μ_k m_A g') + ' ระบบจะไม่เคลื่อนที่เลย ' +
          'และต้องกลับไปคิดด้วยแรงเสียดทานสถิตแทน</span>'
      }
    };
  }
});

T({
  id: 'f-incline-fric', topic: 2, sub: 'พื้นเอียงมีแรงเสียดทาน', level: 'ยาก',
  skills: ['พื้นเอียง', 'แรงเสียดทานจลน์', 'แยกองค์ประกอบของแรง', 'วาดแผนภาพวัตถุอิสระ'],
  gen(R, c) {
    const g = c.g, deg = R.pick([30, 37, 53]), m = R.pick([2, 4, 5, 10]);
    const mu = R.pick([0.2, 0.25, 0.3, 0.5]);
    const a = r2(g * (sinD(deg) - mu * cosD(deg)));
    const N = r2(m * g * cosD(deg)), f = r2(mu * N);
    if (!ok2(a, N, f) || a < 0.5) return null;
    return {
      stem: 'ปล่อยวัตถุมวล ' + U(m, 'kg') + ' ให้ไถลลงจากพื้นเอียงที่ทำมุม ' + fmt(deg) + '° กับแนวราบ ' +
        'โดยระหว่างวัตถุกับพื้นเอียงมีสัมประสิทธิ์ความเสียดทานจลน์ ' + M('μ_k = ' + fmtq(mu)) + ' ' +
        'จงหา<b>แรงเสียดทาน</b>ที่กระทำต่อวัตถุ และ<b>ความเร่ง</b>ที่วัตถุไถลลง (กำหนด ' + GTXT(g) + ')',
      figure: figIncline({ deg: deg, mass: 'm', down: 'mg', fric: 'f' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมเอียง' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานจลน์' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'f', unit: 'N', d: 'แรงเสียดทาน', value: f, positive: true },
              { s: 'a', unit: 'm/s²', d: 'ความเร่งตามพื้นเอียง', value: a, positive: true }],
      sol: {
        analyze: 'หมุนแกนอ้างอิงให้ขนานและตั้งฉากกับพื้นเอียง แล้วเขียนแผนภาพวัตถุอิสระ จะมี 3 แรง:<br>' +
          '• น้ำหนัก ' + M('mg') + ' ชี้ลงในแนวดิ่ง — ต้องแยกเป็น ' + M('mg sin θ') + ' (ขนานพื้นเอียง ชี้ลงเนิน) และ ' +
          M('mg cos θ') + ' (ตั้งฉากพื้นเอียง กดเข้าหาพื้น)<br>' +
          '• แรงตั้งฉาก ' + M('N') + ' ตั้งฉากกับพื้นเอียง ชี้ออกจากพื้น<br>' +
          '• แรงเสียดทาน ' + M('f') + ' ขนานพื้นเอียง <b>ชี้ขึ้นเนิน</b> เพราะวัตถุไถลลง แรงเสียดทานต้านการเคลื่อนที่เสมอ<br>' +
          '<b>จุดที่พลาดบ่อยที่สุด:</b> แรงตั้งฉากบนพื้นเอียง<b>ไม่เท่ากับ</b> ' + M('mg') +
          ' แต่เท่ากับ ' + M('mg cos θ') + ' เท่านั้น ถ้าใช้ ' + M('mg') + ' แรงเสียดทานจะออกมามากเกินไป<br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg + '° = ' + fmtq(sinD(deg))) + ', ' + M('cos ' + deg + '° = ' + fmtq(cosD(deg))),
        eqs: [{ eq: 'ΣF_{ตั้งฉาก} = N - m g cos θ = 0', why: 'แนวตั้งฉากกับพื้นเอียงไม่มีการเคลื่อนที่ จึงสมดุล' },
               { eq: 'f = μ_k N', why: 'นิยามของแรงเสียดทานจลน์ ขึ้นกับแรงตั้งฉาก ไม่ใช่น้ำหนักทั้งก้อน' },
               { eq: 'ΣF_{ขนาน} = m g sin θ - f = m a', why: 'กฎข้อที่ 2 ตามแนวพื้นเอียง แรงเสียดทานมีทิศตรงข้ามการไถลจึงเป็นลบ' }],
        solve: EQ('N = m g cos θ', 'f = μ_k m g cos θ',
                  'm a = m g sin θ - μ_k m g cos θ', 'a = g (sin θ - μ_k cos θ)'),
        subst: SEQ('N = ({m})({g})({cs})', { m: m, g: g, cs: cosD(deg) }) +
               SEQ('f = ({mu})({N})', { mu: mu, N: N }) +
               SEQ('a = ({g})[ {sn} - ({mu})({cs}) ]', { g: g, sn: sinD(deg), mu: mu, cs: cosD(deg) }),
        calc: EQ('N = ' + fmtq(N) + ' `N`', 'f = ' + fmtq(f) + ' `N`',
                 'a = (' + fmtq(g) + ')[ ' + fmtq(sinD(deg)) + ' - ' + fmtq(round2(mu * cosD(deg))) + ' ]',
                 'a = (' + fmtq(g) + ')(' + fmtq(round2(sinD(deg) - mu * cosD(deg))) + ')',
                 'a = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>แรงเสียดทานมีขนาด ' + U(f, 'N') + '</b> (ทิศขึ้นเนิน) และ <b>วัตถุไถลลงด้วยความเร่ง ' +
          U(a, 'm/s²') + '</b><br>' +
          '<span class="hint">เทียบกับพื้นเอียงลื่นซึ่งจะได้ ' + U(round2(g * sinD(deg)), 'm/s²') +
          ' — แรงเสียดทานทำให้ความเร่งลดลง<br>' +
          '<b>เงื่อนไขที่วัตถุจะไถลลงได้:</b> ต้องมี ' + M('tan θ > μ_k') + ' ข้อนี้ ' +
          M('tan ' + deg + '° = ' + fmtq(tanD(deg)) + ' > ' + fmtq(mu)) + ' ✓ ถ้าไม่เป็นจริงวัตถุจะอยู่นิ่ง</span>'
      }
    };
  }
});

T({
  id: 'f-critangle', topic: 2, sub: 'มุมวิกฤตที่เริ่มไถล', level: 'ยาก',
  skills: ['แรงเสียดทานสถิต', 'พื้นเอียง', 'เงื่อนไขเริ่มเคลื่อนที่'],
  gen(R, c) {
    const g = c.g, deg = R.pick([37, 45, 53]), m = R.pick([2, 4, 5, 10]);
    const mu = tanD(deg);
    const N = r2(m * g * cosD(deg)), fmax = r2(mu * N);
    if (!ok2(mu, N, fmax)) return null;
    return {
      stem: 'วางวัตถุมวล ' + U(m, 'kg') + ' บนกระดานที่ปรับมุมเอียงได้ แล้วค่อย ๆ ยกปลายกระดานขึ้นทีละน้อย ' +
        'พบว่าวัตถุ<b>เริ่มไถล</b>เมื่อกระดานทำมุม ' + fmt(deg) + '° กับแนวราบพอดี ' +
        'จงหา<b>สัมประสิทธิ์ความเสียดทานสถิต</b>ระหว่างวัตถุกับกระดาน (กำหนด ' + GTXT(g) + ')',
      figure: figIncline({ deg: deg, mass: 'm', down: 'mg', fric: 'f&#8347;' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'θ_c', v: deg, unit: '°', d: 'มุมที่วัตถุเริ่มไถล (มุมวิกฤต)' },
              { s: 'a', v: 0, unit: 'm/s²', d: 'ยังไม่ไถล จึงยังสมดุลอยู่พอดี' }],
      finds: [{ s: 'μ_s', unit: '', d: 'สัมประสิทธิ์ความเสียดทานสถิต', value: mu, positive: true }],
      sol: {
        analyze: 'คำว่า "<b>เริ่มไถล</b>" คือหัวใจของข้อนี้ — เป็นจังหวะรอยต่อพอดี ณ ขณะนั้น:<br>' +
          '• วัตถุยัง<b>ไม่เคลื่อนที่</b> ดังนั้นยังคงสมดุล ' + M('ΣF = 0') + '<br>' +
          '• แต่แรงเสียดทานสถิตถูกใช้ไปจน<b>เต็มพิกัด</b>แล้ว คือ ' + M('f_s = f_{s,max} = μ_s N') + '<br>' +
          'ถ้ามุมมากกว่านี้อีกนิดเดียว องค์ประกอบของน้ำหนักตามพื้นเอียงจะชนะแรงเสียดทาน วัตถุจึงเริ่มไถล<br>' +
          'หมุนแกนอ้างอิงตามพื้นเอียงเช่นเดิม แล้วเขียนสมการสมดุลทั้งสองแนว',
        eqs: [{ eq: 'ΣF_{ตั้งฉาก} = N - m g cos θ_c = 0', why: 'แนวตั้งฉากกับพื้นเอียงสมดุล' },
               { eq: 'ΣF_{ขนาน} = m g sin θ_c - f_{s,max} = 0', why: 'ยังไม่ไถล แนวขนานพื้นเอียงจึงยังสมดุลพอดี' },
               { eq: 'f_{s,max} = μ_s N', why: 'ที่จังหวะกำลังจะไถล แรงเสียดทานสถิตมีค่าสูงสุด' }],

      }
    };
  }
});

T({

        'ถ้าแรงแรกขนาด ' + U(F1, 'N') + ' มีทิศไปทางขวา และแรงที่สองขนาด ' + U(F2, 'N') +
        ' มีทิศขึ้นในแนวดิ่ง จงหา<b>ขนาดของแรงที่สาม</b>',

      sol: {
        analyze: 'สมดุลแปลว่าแรงลัพธ์ของทั้งสามแรงเป็นศูนย์<br>' +
          'จัดกลุ่มใหม่: ให้ ' + M('R_{12}') + ' เป็นแรงลัพธ์ของ ' + M('F_1') + ' กับ ' + M('F_2') + ' ก่อน ' +
          'แล้วเงื่อนไขสมดุลจะเหลือ ' + M('R_{12} + F_3 = 0') + '<br>' +
          'แปลว่า <b>' + M('F_3') + ' ต้องมีขนาดเท่ากับ ' + M('R_{12}') + ' แต่มีทิศตรงข้ามพอดี</b> ' +
          'เพื่อหักล้างกันหมด<br>' +
          '' + M('F_1') + ' กับ ' + M('F_2') + ' ตั้งฉากกัน จึงรวมได้ด้วยทฤษฎีบทพีทาโกรัส',
        eqs: [{ eq: 'ΣF_x = 0  และ  ΣF_y = 0', why: 'เงื่อนไขสมดุลต่อการเลื่อนที่ ต้องเป็นจริงทั้งสองแกนพร้อมกัน' },
               { eq: 'R_{12} = √(F_1^2 + F_2^2)', why: 'รวมแรงสองแรงที่ตั้งฉากกัน' },
               { eq: 'F_3 = R_{12}', why: 'แรงที่สามต้องสมดุลกับแรงลัพธ์ของอีกสองแรง จึงมีขนาดเท่ากัน ทิศตรงข้าม' }],
        solve: EQ('F_3 = √(F_1^2 + F_2^2)'),
        subst: SEQ('F_3 = √( ({F1})^2 + ({F2})^2 )', { F1: F1, F2: F2 }),
        calc: EQ('F_3 = √(' + fmtq(F1 * F1) + ' + ' + fmtq(F2 * F2) + ')', 'F_3 = √' + fmtq(F3 * F3),
                 'F_3 = ' + fmtq(F3) + ' `N`'),
        conclude: 'ดังนั้น <b>แรงที่สามมีขนาด ' + U(F3, 'N') + '</b> ' +
          'มีทิศเฉียงลงไปทางซ้าย (ตรงข้ามกับแรงลัพธ์ของอีกสองแรง)<br>' +
          '<span class="hint">ตรวจสอบด้วยการแยกแกน: ' + M('ΣF_x = ' + fmtq(F1) + ' - ' + fmtq(F1) + ' = 0') + ' และ ' +
          M('ΣF_y = ' + fmtq(F2) + ' - ' + fmtq(F2) + ' = 0') + ' ✓<br>' +

      }
    };
  }
});

T({
  id: 'e-tworope', topic: 3, sub: 'วัตถุแขวนด้วยเชือกสองเส้น', level: 'ปานกลาง',
  skills: ['สมดุลต่อการเลื่อนที่', 'แยกองค์ประกอบของแรง', 'แรงตึงเชือก'],
  gen(R, c) {
    const g = c.g, m = R.pick([2, 5, 10, 20, 25, 50]);
    const swap = R.f() < 0.5;
    const d1 = swap ? 53 : 37, d2 = swap ? 37 : 53;
    const w = r2(m * g);
    const T1 = r2(w * sinD(d1)), T2 = r2(w * sinD(d2));
    if (!ok2(w, T1, T2)) return null;
    return {
      stem: 'แขวนวัตถุมวล ' + U(m, 'kg') + ' ไว้ที่จุดหนึ่ง โดยใช้เชือกเบาสองเส้นผูกกับเพดาน ' +
        'เชือกเส้นที่หนึ่งทำมุม ' + fmt(d1) + '° และเส้นที่สองทำมุม ' + fmt(d2) + '° กับ<b>แนวราบ</b> ' +
        '(เชือกทั้งสองตั้งฉากกันพอดี) จงหา<b>แรงตึงในเชือกทั้งสองเส้น</b> (กำหนด ' + GTXT(g) + ')',
      figure: figTwoRope({ deg1: d1, deg2: d2, t1: 'T₁', t2: 'T₂', w: 'm' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'θ_1', v: d1, unit: '°', d: 'มุมเชือกเส้นที่ 1 กับแนวราบ' },
              { s: 'θ_2', v: d2, unit: '°', d: 'มุมเชือกเส้นที่ 2 กับแนวราบ' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'T_1', unit: 'N', d: 'แรงตึงเชือกเส้นที่ 1', value: T1, positive: true },
              { s: 'T_2', unit: 'N', d: 'แรงตึงเชือกเส้นที่ 2', value: T2, positive: true }],
      sol: {
        analyze: 'พิจารณา<b>จุดที่เชือกทั้งสองมาบรรจบกัน</b> เป็นจุดสมดุล มีแรง 3 แรงกระทำ คือ ' +
          M('T_1') + ', ' + M('T_2') + ' และน้ำหนัก ' + M('W = mg') + ' ที่ดึงลง<br>' +
          'เชือกทั้งสองเอียงทำมุม จึงต้อง<b>แยกแรงตึงแต่ละเส้นออกเป็นองค์ประกอบแนวราบและแนวดิ่ง</b> ' +
          'แล้วเขียนสมการสมดุลแยกทีละแกน จะได้ 2 สมการ 2 ตัวไม่ทราบค่า<br>' +
          'หาน้ำหนักก่อน: ' + M('W = mg = ' + fmtq(m) + ' × ' + fmtq(g) + ' = ' + fmtq(w)) + ' N<br>' +
          'ค่าที่ใช้: ' + M('sin 37° = 0.6, cos 37° = 0.8, sin 53° = 0.8, cos 53° = 0.6'),
        eqs: [{ eq: 'ΣF_x = T_2 cos θ_2 - T_1 cos θ_1 = 0', why: 'แนวราบสมดุล — องค์ประกอบแนวราบของเชือกสองเส้นดึงกันคนละทางจึงหักล้างกัน' },
               { eq: 'ΣF_y = T_1 sin θ_1 + T_2 sin θ_2 - W = 0', why: 'แนวดิ่งสมดุล — องค์ประกอบแนวดิ่งของทั้งสองเส้นช่วยกันรับน้ำหนัก' }],
        solve: '<div>เนื่องจากเชือกสองเส้นตั้งฉากกัน (' + M('θ_1 + θ_2 = 90°') + ') แก้ระบบสมการแล้วจะย่อได้เป็นรูปสั้น ๆ</div>' +
          EQ('T_1 = W sin θ_1', 'T_2 = W sin θ_2'),
        subst: SEQ('W = ({m})({g})', { m: m, g: g }) +
               SEQ('T_1 = ({W})({s1})', { W: w, s1: sinD(d1) }) +
               SEQ('T_2 = ({W})({s2})', { W: w, s2: sinD(d2) }),
        calc: EQ('W = ' + fmtq(w) + ' `N`', 'T_1 = ' + fmtq(T1) + ' `N`', 'T_2 = ' + fmtq(T2) + ' `N`'),
        conclude: 'ดังนั้น <b>เชือกเส้นที่ 1 มีแรงตึง ' + U(T1, 'N') + ' และเชือกเส้นที่ 2 มีแรงตึง ' + U(T2, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบแนวดิ่ง:</b> ' +
          M(fmtq(T1) + '(' + fmtq(sinD(d1)) + ') + ' + fmtq(T2) + '(' + fmtq(sinD(d2)) + ') = ' + fmtq(w)) + ' N ✓<br>' +
          '<b>ตรวจสอบแนวราบ:</b> ' + M(fmtq(T1) + '(' + fmtq(cosD(d1)) + ') = ' + fmtq(T2) + '(' + fmtq(cosD(d2)) + ')') + ' ✓<br>' +
          'เชือกที่<b>ชันกว่า</b> (มุมกับแนวราบมากกว่า) จะรับแรงตึง<b>มากกว่า</b> เพราะรับน้ำหนักในแนวดิ่งได้มากกว่า<br>' +
          'ข้อสังเกต: ผลรวม ' + U(T1 + T2, 'N') + ' ไม่เท่ากับน้ำหนัก ' + U(w, 'N') +
          ' เพราะแรงตึงเป็นเวกเตอร์ที่คนละทิศ บวกกันตรง ๆ ไม่ได้</span>'
      }
    };
  }
});

T({
  id: 'e-beam2sup', topic: 3, sub: 'คานวางบนจุดรองรับสองจุด', level: 'ปานกลาง',
  skills: ['สมดุลต่อการหมุน', 'สมดุลต่อการเลื่อนที่', 'เลือกจุดหมุนที่ดี', 'น้ำหนักคานที่จุดกึ่งกลาง'],
  gen(R) {
    const L = R.pick([4, 5, 6, 8]), Wb = R.step(100, 400, 50), W = R.step(100, 600, 50);
    const d = R.pick([1, 1.5, 2, 2.5, 3]);
    if (d >= L - 0.5) return null;
    const R2 = r2((Wb * L / 2 + W * d) / L), R1 = r2(Wb + W - R2);
    if (!ok2(R1, R2) || R1 <= 0) return null;
    return {
      stem: 'คานสม่ำเสมอยาว ' + U(L, 'm') + ' หนัก ' + U(Wb, 'N') + ' วางพาดบนจุดรองรับสองจุดที่ปลายทั้งสองข้าง ' +
        'คือจุด A (ปลายซ้าย) และจุด B (ปลายขวา) มีวัตถุหนัก ' + U(W, 'N') + ' วางอยู่ห่างจากจุด A เป็นระยะ ' +
        U(d, 'm') + ' จงหา<b>แรงที่จุดรองรับ A และ B ดันคานขึ้น</b>',
      figure: figBeam({
        supports: [{ x: 0, label: 'A' }, { x: 1, label: 'B' }],
        loads: [{ x: d / L, label: 'W' }, { x: 0.5, label: 'W_คาน' }],
        marks: [{ x0: 0, x1: d / L, label: fmt(d) + ' m' }]
      }),
      given: [{ s: 'L', v: L, unit: 'm', d: 'ความยาวคาน' },
              { s: 'W_{คาน}', v: Wb, unit: 'N', d: 'น้ำหนักคาน อยู่ที่จุดกึ่งกลาง' },
              { s: 'W', v: W, unit: 'N', d: 'น้ำหนักวัตถุ' },
              { s: 'd', v: d, unit: 'm', d: 'ระยะจากจุด A ถึงวัตถุ' }],
      finds: [{ s: 'R_A', unit: 'N', d: 'แรงที่จุดรองรับ A', value: R1, positive: true },
              { s: 'R_B', unit: 'N', d: 'แรงที่จุดรองรับ B', value: R2, positive: true }],
      sol: {
        analyze: 'คานอยู่นิ่ง จึงอยู่ใน<b>สมดุลสมบูรณ์</b> ต้องใช้เงื่อนไข 2 ข้อพร้อมกัน คือ ' +
          M('ΣF = 0') + ' และ ' + M('ΣM = 0') + '<br>' +
          '<b>ประเด็นสำคัญ:</b> คาน "สม่ำเสมอ" แปลว่าเนื้อคานกระจายเท่ากันตลอด ' +
          'น้ำหนักคานจึงถือว่ากระทำที่<b>จุดกึ่งกลางคาน</b> คือที่ระยะ ' + M('L/2 = ' + fmtq(L / 2)) + ' m จากจุด A<br>' +
          '<b>เทคนิคเลือกจุดหมุน:</b> เลือกหมุนรอบจุด <b>A</b> เพราะแรง ' + M('R_A') +
          ' ผ่านจุดนั้นพอดี ระยะเป็นศูนย์ โมเมนต์จึงเป็นศูนย์ ทำให้สมการเหลือตัวไม่ทราบค่าเพียงตัวเดียวคือ ' + M('R_B'),
        eqs: [{ eq: 'ΣM_A = 0', why: 'สมดุลต่อการหมุนรอบจุด A — เลือกจุดนี้เพื่อกำจัด R_A ออกจากสมการ' },
               { eq: 'R_B L = W d + W_{คาน}(L/2)', why: 'โมเมนต์ทวนเข็มจาก R_B เท่ากับโมเมนต์ตามเข็มจากน้ำหนักทั้งสอง' },
               { eq: 'ΣF_y = R_A + R_B - W - W_{คาน} = 0', why: 'สมดุลต่อการเลื่อนที่ในแนวดิ่ง ใช้หา R_A ต่อ' }],
        solve: EQ('R_B = [ W d + W_{คาน}(L/2) ] / L', 'R_A = W + W_{คาน} - R_B'),
        subst: SEQ('R_B = [ ({W})({d}) + ({Wb})({half}) ] / {L}', { W: W, d: d, Wb: Wb, half: L / 2, L: L }) +
               SEQ('R_A = {W} + {Wb} - {RB}', { W: W, Wb: Wb, RB: R2 }),
        calc: EQ('R_B = [ ' + fmtq(W * d) + ' + ' + fmtq(Wb * L / 2) + ' ] / ' + fmtq(L),
                 'R_B = ' + fmtq(round2(W * d + Wb * L / 2)) + ' / ' + fmtq(L),
                 'R_B = ' + fmtq(R2) + ' `N`',
                 'R_A = ' + fmtq(R1) + ' `N`'),
        conclude: 'ดังนั้น <b>จุดรองรับ A ดันคานด้วยแรง ' + U(R1, 'N') + ' และจุดรองรับ B ดันด้วยแรง ' +
          U(R2, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> ' + M(fmtq(R1) + ' + ' + fmtq(R2) + ' = ' + fmtq(round2(R1 + R2))) +
          ' N เท่ากับน้ำหนักรวม ' + M(fmtq(W) + ' + ' + fmtq(Wb) + ' = ' + fmtq(W + Wb)) + ' N ✓<br>' +
          'วัตถุอยู่ใกล้จุด ' + (d < L / 2 ? 'A มากกว่า จุด A จึงรับแรงมากกว่า' : 'B มากกว่า จุด B จึงรับแรงมากกว่า') +
          ' — สมเหตุสมผล</span>'
      }
    };
  }
});

T({

T({
  id: 'e-cog', topic: 3, sub: 'จุดศูนย์ถ่วงของระบบมวล', level: 'ปานกลาง',
  skills: ['จุดศูนย์ถ่วง', 'ค่าเฉลี่ยถ่วงน้ำหนัก'],
  gen(R) {
    const m1 = R.pick([1, 2, 3, 4]), m2 = R.pick([2, 3, 4, 6]), m3 = R.pick([1, 2, 4, 5]);
    const x1 = 0, x2 = R.pick([2, 3, 4]), x3 = x2 + R.pick([2, 3, 4]);
    const tot = m1 + m2 + m3;

    if (!ok2(xc)) return null;
    return {
      stem: 'วางมวลสามก้อนบนแท่งเบาในแนวเส้นตรงเดียวกัน คือ มวล ' + U(m1, 'kg') + ' ที่ตำแหน่ง ' +
        M('x = 0') + ' m, มวล ' + U(m2, 'kg') + ' ที่ตำแหน่ง ' + M('x = ' + fmt(x2)) + ' m และมวล ' +
        U(m3, 'kg') + ' ที่ตำแหน่ง ' + M('x = ' + fmt(x3)) + ' m ' +
        'จงหา<b>ตำแหน่งจุดศูนย์ถ่วง</b>ของระบบนี้',
      figure: figBeam({
        supports: [],
        loads: [{ x: 0.04, label: 'm₁' }, { x: 0.04 + 0.92 * x2 / x3, label: 'm₂' }, { x: 0.96, label: 'm₃' }]
      }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'ที่ x = 0 m' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'ที่ x = ' + fmt(x2) + ' m' },
              { s: 'm_3', v: m3, unit: 'kg', d: 'ที่ x = ' + fmt(x3) + ' m' }],
      finds: [{ s: 'x_{cg}', unit: 'm', d: 'ตำแหน่งจุดศูนย์ถ่วง', value: xc, positive: true }],
      sol: {
        analyze: '<b>จุดศูนย์ถ่วง</b> คือจุดเสมือนที่ถือว่าน้ำหนักทั้งหมดของระบบรวมกันอยู่ ' +
          'ถ้าใช้นิ้วรองรับที่จุดนี้จุดเดียว ระบบจะสมดุลพอดี<br>' +
          'ที่มาของสูตร: ให้ ' + M('x_{cg}') + ' เป็นจุดที่ระบบสมดุล เมื่อคิดโมเมนต์รอบจุดกำเนิด (' + M('x = 0') + ') ' +
          'โมเมนต์ของน้ำหนักรวมที่จุดศูนย์ถ่วง ต้องเท่ากับผลรวมโมเมนต์ของน้ำหนักย่อยแต่ละก้อน<br>' +
          '<span class="hint">' + M('g') + ' ปรากฏทุกพจน์แล้วตัดกันหมด จึงใช้มวลแทนน้ำหนักได้เลย ' +
          'ผลลัพธ์คือ<b>ค่าเฉลี่ยของตำแหน่งโดยถ่วงน้ำหนักด้วยมวล</b></span>',
        eqs: [{ eq: '(Σm) x_{cg} = Σ(m x)', why: 'สมดุลโมเมนต์รอบจุดกำเนิด — โมเมนต์ของมวลรวมที่จุด cg เท่ากับผลรวมโมเมนต์ของมวลย่อย' },
               { eq: 'x_{cg} = (m_1 x_1 + m_2 x_2 + m_3 x_3) / (m_1 + m_2 + m_3)', why: 'จัดรูปแล้ว ได้เป็นค่าเฉลี่ยถ่วงน้ำหนัก' }],
        solve: EQ('x_{cg} = Σ(m x) / Σm'),
        subst: SEQ('x_{cg} = [ ({m1})({x1}) + ({m2})({x2}) + ({m3})({x3}) ] / ({m1} + {m2} + {m3})',
          { m1: m1, x1: x1, m2: m2, x2: x2, m3: m3, x3: x3 }),
        calc: EQ('x_{cg} = [ 0 + ' + fmtq(m2 * x2) + ' + ' + fmtq(m3 * x3) + ' ] / ' + fmtq(tot),
                 'x_{cg} = ' + fmtq(m2 * x2 + m3 * x3) + ' / ' + fmtq(tot),
                 'x_{cg} = ' + fmtq(xc) + ' `m`'),
        conclude: 'ดังนั้น <b>จุดศูนย์ถ่วงอยู่ที่ตำแหน่ง ' + M('x = ' + fmtq(xc)) + ' เมตร</b> จากมวลก้อนแรก<br>' +
          '<span class="hint">ตรวจสอบความสมเหตุสมผล: ค่าที่ได้ต้องอยู่<b>ระหว่าง</b>ตำแหน่งซ้ายสุด (0 m) ' +
          'กับขวาสุด (' + fmt(x3) + ' m) เสมอ ✓ และควรเอียงไปทางฝั่งที่มีมวลมากกว่า</span>'
      }
    };
  }
});

T({

          '<b>จุดที่พลาดบ่อย:</b> ต้องจับคู่ให้ถูก — แรง ' + M('T_1') + ' คู่กับมุม ' + M('α') +
          ' ซึ่งเป็นมุมระหว่าง<b>อีกสองแรงที่เหลือ</b> ไม่ใช่มุมที่ติดกับ ' + M('T_1') + '<br>' +

          'ค่าที่ใช้: ' + M('sin 90° = 1') + ', ' + M('sin 127° = sin 53° = 0.8') + ', ' + M('sin 143° = sin 37° = 0.6'),
        eqs: [{ eq: 'T_1 / sin α = T_2 / sin β = T_3 / sin γ', why: 'ทฤษฎีบทของลามี ใช้ได้เฉพาะกรณีแรงสามแรงที่จุดเดียวกันและอยู่ในสมดุลเท่านั้น' }],
        solve: EQ('T_2 = T_1 (sin β / sin α)', 'T_3 = T_1 (sin γ / sin α)'),

T({
  id: 'e-ladder', topic: 3, sub: 'บันไดพิงกำแพง', level: 'ยาก',
  skills: ['สมดุลสมบูรณ์', 'เลือกจุดหมุนที่ดี', 'แรงเสียดทานสถิต', 'น้ำหนักคานที่จุดกึ่งกลาง'],
  gen(R) {
    const deg = R.pick([37, 45, 53]), W = R.step(200, 800, 50);
    const tn = tanD(deg), Nw = r2(W / (2 * tn));
    if (!ok2(Nw)) return null;
    return {
      stem: 'บันไดสม่ำเสมอหนัก ' + U(W, 'N') + ' พิงอยู่กับกำแพง<b>ลื่น</b>ในแนวดิ่ง ' +
        'โดยปลายล่างวางบนพื้นที่<b>มีความฝืด</b> บันไดทำมุม ' + fmt(deg) + '° กับพื้นและอยู่ในสมดุล ' +
        'จงหา<b>แรงที่กำแพงดันบันได</b>',
      figure: figLadder({ deg: deg, w: 'W' }),
      given: [{ s: 'W', v: W, unit: 'N', d: 'น้ำหนักบันได อยู่ที่จุดกึ่งกลาง' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมที่บันไดทำกับพื้น' },
              { s: 'N_{กำแพง}', v: '?', unit: 'N', d: 'กำแพงลื่น จึงมีแรงตั้งฉากอย่างเดียว ไม่มีเสียดทาน' }],
      finds: [{ s: 'N_{กำแพง}', unit: 'N', d: 'แรงที่กำแพงดันบันได', value: Nw, positive: true }],
      sol: {
        analyze: 'บันไดอยู่นิ่ง จึงอยู่ใน<b>สมดุลสมบูรณ์</b> ใช้ทั้ง ' + M('ΣF = 0') + ' และ ' + M('ΣM = 0') + '<br>' +
          'แรงที่กระทำต่อบันไดมี 4 แรง:<br>' +
          '• น้ำหนัก ' + M('W') + ' ชี้ลง กระทำที่<b>จุดกึ่งกลางบันได</b> (เพราะบันไดสม่ำเสมอ)<br>' +
          '• แรงจากกำแพง ' + M('N_{กำแพง}') + ' — กำแพง<b>ลื่น</b> จึงมีแค่แรงตั้งฉาก ชี้ออกจากกำแพงในแนวราบ ' +
          '<b>ไม่มีแรงเสียดทานที่กำแพง</b> (จุดนี้สำคัญมาก)<br>' +
          '• แรงตั้งฉากจากพื้น ' + M('N_{พื้น}') + ' ชี้ขึ้น · • แรงเสียดทานที่พื้น ' + M('f') + ' ชี้เข้าหากำแพงในแนวราบ<br>' +
          '<b>เทคนิคเลือกจุดหมุน:</b> เลือกหมุนรอบ<b>ปลายล่างของบันได</b> เพราะทั้ง ' + M('N_{พื้น}') +
          ' และ ' + M('f') + ' ผ่านจุดนั้นทั้งคู่ โมเมนต์ของทั้งสองเป็นศูนย์ ' +
          'สมการจึงเหลือตัวไม่ทราบค่าเพียงตัวเดียว<br>' +
          '<b>ระยะตั้งฉาก</b> ถ้าบันไดยาว ' + M('L') + ' แล้ว:<br>' +
          '• แรง ' + M('N_{กำแพง}') + ' อยู่ในแนวราบ ระยะตั้งฉากคือความสูงของจุดสัมผัส = ' + M('L sin θ') + '<br>' +
          '• น้ำหนัก ' + M('W') + ' อยู่ในแนวดิ่ง ระยะตั้งฉากคือระยะราบจากปลายล่าง = ' + M('(L/2) cos θ'),
        eqs: [{ eq: 'ΣM_{ปลายล่าง} = 0', why: 'สมดุลต่อการหมุน เลือกจุดนี้เพื่อกำจัดแรงจากพื้นทั้งสองแรงออกจากสมการ' },
               { eq: 'N_{กำแพง}(L sin θ) = W (L/2) cos θ', why: 'โมเมนต์ทวนเข็มจากแรงกำแพง สมดุลกับโมเมนต์ตามเข็มจากน้ำหนักบันได' }],
        solve: '<div>ความยาว ' + M('L') + ' ปรากฏทั้งสองข้าง จึงตัดกันหายไป — <b>คำตอบไม่ขึ้นกับความยาวบันได</b></div>' +
          EQ('N_{กำแพง} sin θ = (W/2) cos θ',
             'N_{กำแพง} = (W/2)(cos θ / sin θ)', 'N_{กำแพง} = W / (2 tan θ)'),
        subst: SEQ('N_{กำแพง} = {W} / ( (2)({tn}) )', { W: W, tn: tn }),
        calc: EQ('N_{กำแพง} = ' + fmtq(W) + ' / ' + fmtq(round2(2 * tn)),
                 'N_{กำแพง} = ' + fmtq(Nw) + ' `N`'),
        conclude: 'ดังนั้น <b>กำแพงดันบันไดด้วยแรง ' + U(Nw, 'N') + '</b> ในแนวราบ<br>' +
          '<span class="hint">จากสมดุลในแนวราบ ' + M('ΣF_x = 0') + ' จะได้แรงเสียดทานที่พื้น ' +
          M('f = N_{กำแพง} = ' + fmtq(Nw)) + ' N ด้วย<br>' +
          'และจากแนวดิ่ง ' + M('N_{พื้น} = W = ' + fmtq(W)) + ' N<br>' +
          'ดังนั้นสัมประสิทธิ์ความเสียดทานสถิตของพื้นต้องมีอย่างน้อย ' +
          M('μ_s ≥ f / N_{พื้น} = ' + fmtq(round2(Nw / W))) + ' บันไดจึงจะไม่ไถล<br>' +
          '<b>ยิ่งบันไดพิงชัน (θ มาก) แรงที่กำแพงยิ่งน้อย</b> จึงปลอดภัยกว่า — นี่คือเหตุผลที่ไม่ควรพิงบันไดเอียงมากเกินไป</span>'
      }
    };
  }
});

T({
  id: 'e-boomrope', topic: 3, sub: 'คานยึดกำแพงกับเชือกค้ำ', level: 'ยาก',
  skills: ['สมดุลสมบูรณ์', 'เลือกจุดหมุนที่ดี', 'แยกองค์ประกอบของแรง', 'น้ำหนักคานที่จุดกึ่งกลาง'],
  gen(R) {
    const deg = R.pick([30, 37, 53]), Wb = R.step(100, 400, 50), P = R.step(50, 400, 50);
    const Tn = r2((Wb / 2 + P) / sinD(deg));
    if (!ok2(Tn) || Tn > 3000) return null;
    return {
      stem: 'คานสม่ำเสมอหนัก ' + U(Wb, 'N') + ' วางในแนวราบ ปลายด้านหนึ่งยึดกับกำแพงด้วยบานพับ ' +
        'ปลายอีกด้านผูกเชือกที่ทำมุม ' + fmt(deg) + '° กับคาน โดยเชือกโยงขึ้นไปยึดกับกำแพงด้านบน ' +
        'และมีวัตถุหนัก ' + U(P, 'N') + ' แขวนอยู่ที่ปลายคานด้านนอก ' +
        'จงหา<b>แรงตึงในเส้นเชือก</b>',
      figure: figBeam({
        supports: [{ x: 0, label: 'บานพับ' }],
        loads: [{ x: 0.5, label: 'W_คาน' }, { x: 1, label: 'P' }, { x: 1, up: true, label: 'T sin' + fmt(deg) + '°' }]
      }),
      given: [{ s: 'W_{คาน}', v: Wb, unit: 'N', d: 'น้ำหนักคาน อยู่ที่กึ่งกลาง' },
              { s: 'P', v: P, unit: 'N', d: 'น้ำหนักที่แขวนปลายคาน' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมที่เชือกทำกับคาน' }],
      finds: [{ s: 'T', unit: 'N', d: 'แรงตึงในเส้นเชือก', value: Tn, positive: true }],
      sol: {
        analyze: 'คานอยู่นิ่ง ใช้<b>สมดุลสมบูรณ์</b> แต่ที่บานพับมีแรงกระทำทั้งแนวราบและแนวดิ่งซึ่งเรายังไม่รู้ค่า<br>' +
          '<b>เทคนิคสำคัญ:</b> เลือกหมุนรอบ<b>บานพับ</b> แรงที่บานพับทั้งสองแนวจะผ่านจุดหมุนพอดี ' +
          'มีระยะตั้งฉากเป็นศูนย์ โมเมนต์จึงเป็นศูนย์ — กำจัดตัวไม่ทราบค่าไปได้ 2 ตัวในคราวเดียว ' +
          'เหลือแค่ ' + M('T') + ' ตัวเดียว<br>' +
          '<b>แรงตึงเชือกทำมุมกับคาน</b> จึงต้องแยกองค์ประกอบก่อน มีเพียงองค์ประกอบที่<b>ตั้งฉากกับคาน</b> คือ ' +
          M('T sin θ') + ' เท่านั้นที่ให้โมเมนต์ ส่วนองค์ประกอบตามแนวคาน ' + M('T cos θ') +
          ' พุ่งเข้าหาจุดหมุนพอดี จึงไม่ให้โมเมนต์เลย<br>' +
          'ให้คานยาว ' + M('L') + ' — จะเห็นว่า ' + M('L') + ' ตัดกันหมดในตอนท้าย<br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg + '° = ' + fmtq(sinD(deg))),
        eqs: [{ eq: 'ΣM_{บานพับ} = 0', why: 'สมดุลต่อการหมุน เลือกบานพับเพื่อกำจัดแรงที่บานพับออกจากสมการ' },
               { eq: '(T sin θ) L = W_{คาน}(L/2) + P L', why: 'โมเมนต์ทวนเข็มจากเชือก สมดุลกับโมเมนต์ตามเข็มจากน้ำหนักคานและวัตถุ' }],
        solve: '<div>ตัด ' + M('L') + ' ออกทั้งสองข้าง แล้วแก้หา ' + M('T') + '</div>' +
          EQ('T sin θ = W_{คาน}/2 + P', 'T = ( W_{คาน}/2 + P ) / sin θ'),
        subst: SEQ('T = ( {half} + {P} ) / {sn}', { half: Wb / 2, P: P, sn: sinD(deg) }),
        calc: EQ('T = ' + fmtq(round2(Wb / 2 + P)) + ' / ' + fmtq(sinD(deg)),
                 'T = ' + fmtq(Tn) + ' `N`'),
        conclude: 'ดังนั้น <b>แรงตึงในเส้นเชือกเท่ากับ ' + U(Tn, 'N') + '</b><br>' +
          '<span class="hint">สังเกตว่าแรงตึง ' + U(Tn, 'N') + ' <b>มากกว่า</b>น้ำหนักรวมที่ต้องรับ (' +
          U(round2(Wb / 2 + P), 'N') + ') เพราะเชือกเอียงทำมุม จึงใช้ได้แค่องค์ประกอบ ' + M('sin θ') +
          ' ในการยกคาน<br>' +
          '<b>ยิ่งมุม ' + M('θ') + ' เล็ก (เชือกยิ่งแบนราบ) แรงตึงยิ่งสูงขึ้นมาก</b> — ' +
          'นี่คือเหตุผลที่ไม่ควรขึงเชือกหรือสายไฟให้ตึงเป็นเส้นตรงเกินไป</span>'
      }
    };
  }
});

T({
  id: 'e-sign', topic: 3, sub: 'ป้ายแขวนปลายคานกับเชือกค้ำ', level: 'ยาก',
  skills: ['สมดุลสมบูรณ์', 'แรงที่บานพับ', 'แยกองค์ประกอบของแรง'],
  gen(R) {
    const deg = R.pick([37, 53]), W = R.step(100, 600, 50);
    const Tn = r2(W / sinD(deg)), H = r2(Tn * cosD(deg));
    if (!ok2(Tn, H)) return null;
    return {
      stem: 'คาน<b>เบา</b> (ไม่คิดน้ำหนักคาน) วางในแนวราบ ปลายด้านหนึ่งยึดกำแพงด้วยบานพับ ' +
        'ปลายอีกด้านแขวนป้ายหนัก ' + U(W, 'N') + ' และมีเชือกจากปลายคานโยงขึ้นไปยึดกำแพง ' +
        'ทำมุม ' + fmt(deg) + '° กับคาน จงหา<b>แรงตึงในเชือก</b> และ<b>แรงในแนวราบที่บานพับกระทำต่อคาน</b>',
      figure: figBeam({
        supports: [{ x: 0, label: 'บานพับ' }],
        loads: [{ x: 1, label: 'W' }, { x: 1, up: true, label: 'T sin' + fmt(deg) + '°' }]
      }),
      given: [{ s: 'W', v: W, unit: 'N', d: 'น้ำหนักป้ายที่ปลายคาน' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมที่เชือกทำกับคาน' },
              { s: 'W_{คาน}', v: 0, unit: 'N', d: 'คานเบา ไม่คิดน้ำหนัก' }],
      finds: [{ s: 'T', unit: 'N', d: 'แรงตึงในเชือก', value: Tn, positive: true },
              { s: 'H', unit: 'N', d: 'แรงแนวราบที่บานพับ', value: H, positive: true }],
      sol: {
        analyze: 'คานเบา จึงมีแรงกระทำเพียง 3 กลุ่ม คือ น้ำหนักป้าย ' + M('W') + ' ที่ปลายคาน, ' +
          'แรงตึงเชือก ' + M('T') + ' ที่ปลายคานเช่นกัน และแรงจากบานพับที่ปลายอีกด้าน ' +
          '(แยกเป็นแนวราบ ' + M('H') + ' และแนวดิ่ง ' + M('V') + ')<br>' +
          '<b>ขั้นที่ 1 หาแรงตึง</b> — หมุนรอบบานพับเพื่อกำจัด ' + M('H') + ' และ ' + M('V') +
          ' ออกไป เหลือ ' + M('T') + ' ตัวเดียว<br>' +
          '<b>ขั้นที่ 2 หาแรงแนวราบที่บานพับ</b> — ใช้ ' + M('ΣF_x = 0') + ' ' +
          'แนวราบมีเพียงสองแรงคือ ' + M('H') + ' กับองค์ประกอบแนวราบของแรงตึง ' + M('T cos θ') +
          ' (น้ำหนักป้ายอยู่ในแนวดิ่งล้วน ไม่มีองค์ประกอบแนวราบ)<br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg + '° = ' + fmtq(sinD(deg))) + ', ' + M('cos ' + deg + '° = ' + fmtq(cosD(deg))),
        eqs: [{ eq: 'ΣM_{บานพับ} = 0 :  (T sin θ) L = W L', why: 'ทั้งแรงตึงและน้ำหนักอยู่ที่ปลายคานเหมือนกัน ระยะ L จึงตัดกันหมด' },
               { eq: 'ΣF_x = 0 :  H = T cos θ', why: 'สมดุลแนวราบ — บานพับต้องดึงคานเข้าหากำแพงเพื่อต้านองค์ประกอบแนวราบของแรงตึง' }],
        solve: EQ('T sin θ = W', 'T = W / sin θ', 'H = T cos θ'),
        subst: SEQ('T = {W} / {sn}', { W: W, sn: sinD(deg) }) +
               SEQ('H = ({T})({cs})', { T: Tn, cs: cosD(deg) }),
        calc: EQ('T = ' + fmtq(W) + ' / ' + fmtq(sinD(deg)), 'T = ' + fmtq(Tn) + ' `N`',
                 'H = (' + fmtq(Tn) + ')(' + fmtq(cosD(deg)) + ')', 'H = ' + fmtq(H) + ' `N`'),
        conclude: 'ดังนั้น <b>แรงตึงในเชือกเท่ากับ ' + U(Tn, 'N') + '</b> และ <b>บานพับออกแรงในแนวราบ ' +
          U(H, 'N') + '</b><br>' +
          '<span class="hint">แรงตึง ' + U(Tn, 'N') + ' มากกว่าน้ำหนักป้าย ' + U(W, 'N') +
          ' เสมอ เพราะเชือกเอียง ใช้ยกได้แค่องค์ประกอบ ' + M('T sin θ') + '<br>' +
          'แรงแนวดิ่งที่บานพับคือ ' + M('V = W - T sin θ = 0') + ' — ในกรณีคานเบาและแรงทั้งสองอยู่ที่ปลายเดียวกัน ' +
          'บานพับจึงออกแรงเฉพาะแนวราบเท่านั้น</span>'
      }
    };
  }
});

T({
  id: 'e-cog2d', topic: 3, sub: 'จุดศูนย์ถ่วงของแผ่นวัตถุ', level: 'ยาก',
  skills: ['จุดศูนย์ถ่วง', 'แบ่งรูปเป็นส่วนย่อย', 'ค่าเฉลี่ยถ่วงน้ำหนัก'],
  gen(R) {
    const a = R.pick([6, 8]), b = R.pick([2, 3]);       // แผ่นล่าง กว้าง a สูง b
    const cc = R.pick([2, 3]), d = R.pick([4, 6]);      // แผ่นบน กว้าง cc สูง d
    const A1 = a * b, A2 = cc * d, tot = A1 + A2;
    const xc = r2((A1 * (a / 2) + A2 * (cc / 2)) / tot);
    const yc = r2((A1 * (b / 2) + A2 * (b + d / 2)) / tot);
    if (!ok2(xc, yc)) return null;
    // รูปสูงสุด 9 ช่อง กว้างสุด 8 ช่อง — ย่อมาตราส่วนลงให้ป้ายบน-ล่าง-ซ้าย-ขวาอยู่ในกรอบครบ
    const sc = 20, ox = 80, oy = 208;
    const px = v => ox + v * sc, py = v => oy - v * sc;
    let fig = '<polygon class="bdy" points="' +
      [[0, 0], [a, 0], [a, b], [cc, b], [cc, b + d], [0, b + d]].map(p => n1(px(p[0])) + ',' + n1(py(p[1]))).join(' ') + '"/>';
    fig += '<line class="dash" x1="' + n1(px(0)) + '" y1="' + n1(py(b)) + '" x2="' + n1(px(cc)) + '" y2="' + n1(py(b)) + '"/>';
    fig += svgTxt(px(a / 2), py(b / 2) + 4, '1', 'middle');
    fig += svgTxt(px(cc / 2), py(b + d / 2) + 4, '2', 'middle');
    fig += svgArrow(px(0), py(0) + 22, px(a), py(0) + 22, 'ln2', '', 0, 0);
    fig += svgTxt(px(a / 2), py(0) + 38, fmt(a) + ' cm', 'middle', true);
    fig += svgTxt(px(0) - 12, py((b + d) / 2), fmt(b + d) + ' cm', 'end', true);
    fig += svgTxt(px(cc / 2), py(b + d) - 8, fmt(cc) + ' cm', 'middle', true);
    fig += svgTxt(px(a) + 6, py(b / 2), fmt(b) + ' cm', 'start', true);
    return {
      stem: 'แผ่นวัตถุสม่ำเสมอรูปตัว L มีขนาดดังรูป (หน่วยเป็นเซนติเมตร) ' +
        'จงหา<b>ตำแหน่งจุดศูนย์ถ่วง</b> โดยวัดจากมุมล่างซ้ายของแผ่น',
      figure: svgWrap(360, 254, fig),
      given: [{ s: 'A_1', v: A1, unit: 'cm²', d: 'พื้นที่ส่วนที่ 1 (' + fmt(a) + '×' + fmt(b) + ')' },
              { s: 'A_2', v: A2, unit: 'cm²', d: 'พื้นที่ส่วนที่ 2 (' + fmt(cc) + '×' + fmt(d) + ')' }],
      finds: [{ s: 'x_{cg}', unit: 'cm', d: 'ระยะในแนวนอนจากมุมล่างซ้าย', value: xc, positive: true },
              { s: 'y_{cg}', unit: 'cm', d: 'ระยะในแนวตั้งจากมุมล่างซ้าย', value: yc, positive: true }],
      sol: {
        analyze: 'แผ่นวัตถุ<b>สม่ำเสมอ</b> แปลว่าเนื้อวัสดุกระจายเท่ากันทุกจุด ' +
          'มวลของแต่ละส่วนจึง<b>แปรผันตรงกับพื้นที่</b> — ใช้พื้นที่แทนมวลในสูตรได้เลย<br>' +
          '<b>วิธีคิด:</b> แบ่งรูปตัว L ออกเป็นสี่เหลี่ยมผืนผ้า 2 ส่วน ซึ่งแต่ละส่วนหาจุดศูนย์ถ่วงได้ง่าย ' +
          '(อยู่ที่จุดกึ่งกลางของสี่เหลี่ยมนั้น) แล้วจึงรวมกันแบบค่าเฉลี่ยถ่วงน้ำหนัก<br>' +
          'ตั้งแกนอ้างอิงที่<b>มุมล่างซ้าย</b> เป็นจุด (0, 0) แล้วคิดแยกทีละแกน<br>' +
          '<b>ส่วนที่ 1</b> (แผ่นล่าง ' + fmt(a) + '×' + fmt(b) + ') จุดศูนย์ถ่วงอยู่ที่ (' +
          fmt(a / 2) + ', ' + fmt(b / 2) + ')<br>' +
          '<b>ส่วนที่ 2</b> (แผ่นบน ' + fmt(cc) + '×' + fmt(d) + ') จุดศูนย์ถ่วงอยู่ที่ (' +
          fmt(cc / 2) + ', ' + fmt(b + d / 2) + ') — <b>อย่าลืมบวก ' + fmt(b) + ' ในแกน y</b> เพราะส่วนที่ 2 วางอยู่บนส่วนที่ 1',
        eqs: [{ eq: 'x_{cg} = (A_1 x_1 + A_2 x_2) / (A_1 + A_2)', why: 'ค่าเฉลี่ยถ่วงน้ำหนักในแกน x โดยใช้พื้นที่แทนมวล' },
               { eq: 'y_{cg} = (A_1 y_1 + A_2 y_2) / (A_1 + A_2)', why: 'ทำแบบเดียวกันในแกน y แยกกันคนละแกนอย่างอิสระ' }],
        solve: EQ('A_1 = ' + fmt(a) + ' × ' + fmt(b) + ' = ' + fmt(A1) + ' `cm`^2',
                  'A_2 = ' + fmt(cc) + ' × ' + fmt(d) + ' = ' + fmt(A2) + ' `cm`^2',
                  'x_{cg} = Σ(A x) / ΣA', 'y_{cg} = Σ(A y) / ΣA'),
        subst: SEQ('x_{cg} = [ ({A1})({x1}) + ({A2})({x2}) ] / ({A1} + {A2})',
                 { A1: A1, x1: a / 2, A2: A2, x2: cc / 2 }) +
               SEQ('y_{cg} = [ ({A1})({y1}) + ({A2})({y2}) ] / ({A1} + {A2})',
                 { A1: A1, y1: b / 2, A2: A2, y2: b + d / 2 }),
        calc: EQ('x_{cg} = [ ' + fmtq(A1 * a / 2) + ' + ' + fmtq(A2 * cc / 2) + ' ] / ' + fmtq(tot),
                 'x_{cg} = ' + fmtq(xc) + ' `cm`',
                 'y_{cg} = [ ' + fmtq(A1 * b / 2) + ' + ' + fmtq(A2 * (b + d / 2)) + ' ] / ' + fmtq(tot),
                 'y_{cg} = ' + fmtq(yc) + ' `cm`'),
        conclude: 'ดังนั้น <b>จุดศูนย์ถ่วงอยู่ที่ตำแหน่ง (' + fmt(xc) + ', ' + fmt(yc) + ') เซนติเมตร</b> ' +
          'จากมุมล่างซ้าย<br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> จุดนี้อยู่ในช่วง ' + M('0 < x < ' + fmt(a)) + ' และ ' +
          M('0 < y < ' + fmt(b + d)) + ' ✓<br>' +
          'ข้อสังเกต: จุดศูนย์ถ่วงของรูปตัว L อาจตกอยู่<b>นอกเนื้อวัตถุ</b>ก็ได้ ' +
          'ซึ่งไม่ผิด เพราะจุดศูนย์ถ่วงเป็นเพียงตำแหน่งเสมือนทางคณิตศาสตร์</span>'
      }
    };
  }
});

T({
  id: 'e-incline-eq', topic: 3, sub: 'สมดุลบนพื้นเอียง', level: 'ยาก',
  skills: ['สมดุลต่อการเลื่อนที่', 'พื้นเอียง', 'แยกองค์ประกอบของแรง'],
  gen(R, c) {
    const g = c.g, deg = 37, m = R.pick([2, 4, 5, 10, 20]);
    const w = r2(m * g);
    const F = r2(w * tanD(deg)), N = r2(w / cosD(deg));
    if (!ok2(w, F, N)) return null;
    return {
      stem: 'วางวัตถุมวล ' + U(m, 'kg') + ' บนพื้นเอียง<b>ลื่น</b>ที่ทำมุม ' + fmt(deg) + '° กับแนวราบ ' +
        'แล้วออกแรง ' + M('F') + ' ใน<b>แนวราบ</b> (ขนานกับพื้นโลก ไม่ใช่ขนานกับพื้นเอียง) ดันวัตถุไว้ให้<b>อยู่นิ่ง</b> ' +
        'จงหา<b>ขนาดของแรง</b> ' + M('F') + ' และ<b>แรงที่พื้นเอียงดันวัตถุ</b> (กำหนด ' + GTXT(g) + ')',
      figure: figIncline({ deg: deg, mass: 'm', down: 'mg', up: 'F (แนวราบ)' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมเอียงของพื้น' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' },

          (same ? 'ข้อนี้แรงทั้งสอง<b>ไปทางเดียวกัน</b> จึงเสริมกัน ลัพธ์ต้องมากกว่าแรงเดี่ยวแต่ละแรง'
