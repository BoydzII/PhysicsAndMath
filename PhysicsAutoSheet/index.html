T({
  id: 'p2-elastic2', topic: 6, sub: 'ชนยืดหยุ่นสมบูรณ์เมื่อทั้งคู่เคลื่อนที่', level: 'ยาก',
  skills: ['ใช้สูตรความเร็วสัมพัทธ์ในการชนยืดหยุ่น', 'ตรวจสอบด้วยกฎอนุรักษ์สองข้อ'],
  gen(R) {
    // มวลเท่ากันในการชนยืดหยุ่นสมบูรณ์จะ "แลกความเร็วกัน" ซึ่งพิสูจน์ได้ด้วยกฎอนุรักษ์สองข้อ
    const m = R.pick([1, 2, 3, 4, 5]);
    const u1 = R.pick([6, 8, 10, 12, 15]), u2 = R.pick([2, 3, 4, 5]);
    if (u2 >= u1) return null;
    const E = r2(0.5 * m * u1 * u1 + 0.5 * m * u2 * u2);
    const P = r2(m * u1 + m * u2);
    if (!ok2(E, P)) return null;
    return {
      stem: 'ลูกกลมสองลูก<b>มวลเท่ากัน</b>ลูกละ ' + U(m, 'kg') + ' เคลื่อนที่ไปทางเดียวกันบนพื้นราบลื่น ' +
        'ลูกหลังเร็ว ' + U(u1, 'm/s') + ' ไล่ตามลูกหน้าที่เร็ว ' + U(u2, 'm/s') +
        ' จนชนกันแบบ<b>ยืดหยุ่นสมบูรณ์</b> จงหา<b>ความเร็วของลูกทั้งสองหลังชน</b>',
      figure: figChain({ masses: ['m', 'm'], Fleft: 'u₁ = ' + fmt(u1) + ' m/s' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล (เท่ากันทั้งสองลูก)' },
              { s: 'u_1', v: u1, unit: 'm/s', d: 'ความเร็วลูกหลัง (ก่อนชน)' },
              { s: 'u_2', v: u2, unit: 'm/s', d: 'ความเร็วลูกหน้า (ก่อนชน)' }],
      finds: [{ s: 'v_1', unit: 'm/s', d: 'ความเร็วลูกหลัง (หลังชน)', value: u2, positive: true },
              { s: 'v_2', unit: 'm/s', d: 'ความเร็วลูกหน้า (หลังชน)', value: u1, positive: true }],
      sol: {
        analyze: '<b>การชนยืดหยุ่นสมบูรณ์มีสองสมการให้ใช้</b><br>' +
          '1. อนุรักษ์<b>โมเมนตัม</b> ' + M('m u_1 + m u_2 = m v_1 + m v_2') + ' ⇒ ตัด ' + M('m') +
          ' ⇒ ' + M('u_1 + u_2 = v_1 + v_2') + '<br>' +
          '2. อนุรักษ์<b>พลังงานจลน์</b> ' + M('u_1^2 + u_2^2 = v_1^2 + v_2^2') + '<br>' +
          '<b>สูตรลัดที่ควรจำ — ความเร็วสัมพัทธ์สลับทิศ</b><br>' +
          'ในการชนยืดหยุ่นสมบูรณ์ทุกกรณี ' + M('u_1 - u_2 = -(v_1 - v_2)') + '<br>' +
          'คือ "<b>ความเร็วที่เข้าหากัน เท่ากับ ความเร็วที่แยกจากกัน</b>"<br>' +
          'เมื่อมวล<b>เท่ากัน</b> แก้สองสมการพร้อมกันจะได้ผลลัพธ์ที่สวยงามคือ ' +
          '<b>' + M('v_1 = u_2') + ' และ ' + M('v_2 = u_1') + '</b> — <b>แลกความเร็วกันพอดี</b>',
        eqs: [{ eq: 'u_1 + u_2 = v_1 + v_2', why: 'อนุรักษ์โมเมนตัมเมื่อมวลเท่ากัน (m ตัดกันหมด)' },
               { eq: 'u_1 - u_2 = v_2 - v_1', why: 'ความเร็วสัมพัทธ์สลับทิศ — สมบัติเฉพาะของการชนยืดหยุ่นสมบูรณ์' },
               { eq: 'v_1 = u_2 ,  v_2 = u_1', why: 'แก้สองสมการข้างต้นพร้อมกัน ได้ผลว่ามวลเท่ากันจะแลกความเร็วกัน' }],
        solve: EQ('u_1 + u_2 = v_1 + v_2', 'u_1 - u_2 = v_2 - v_1') +
          '<div>นำสองสมการมาบวกกัน จะได้ ' + M('2 u_1 = 2 v_2') + ' ⇒ ' + M('v_2 = u_1') + '</div>' +
          '<div>แล้วแทนกลับ จะได้ ' + M('v_1 = u_2') + '</div>',
        subst: SEQ('v_1 = u_2 = {b}', { b: u2 }) + SEQ('v_2 = u_1 = {a}', { a: u1 }),
        calc: EQ('v_1 = ' + fmtq(u2) + ' `m/s`', 'v_2 = ' + fmtq(u1) + ' `m/s`'),
        conclude: 'ดังนั้น <b>ลูกหลังเหลือความเร็ว ' + U(u2, 'm/s') + '</b> และ ' +
          '<b>ลูกหน้าเร่งเป็น ' + U(u1, 'm/s') + '</b> — <b>ทั้งสองแลกความเร็วกันพอดี</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยกฎอนุรักษ์ทั้งสองข้อ</b><br>' +
          '• โมเมนตัม: ก่อน ' + M(fmt(m) + '(' + fmt(u1) + ' + ' + fmt(u2) + ') = ' + fmt(P)) + ' · ' +
          'หลัง ' + M(fmt(m) + '(' + fmt(u2) + ' + ' + fmt(u1) + ') = ' + fmt(P)) + ' ✓<br>' +
          '• พลังงานจลน์: ก่อนและหลังได้ ' + fmt(E) + ' J เท่ากัน ✓ (จึงยืดหยุ่นสมบูรณ์จริง)<br>' +
          '<b>ตรวจความสมเหตุสมผล:</b> หลังชน ลูกหลังต้อง<b>ช้ากว่า</b>ลูกหน้า ไม่งั้นจะทะลุผ่านกันไป ⇒ ' +
          fmt(u2) + ' < ' + fmt(u1) + ' ✓<br>' +
          '<b>เห็นได้จริงใน</b>ลูกตุ้มนิวตัน (Newton’s cradle) และการชนของลูกบิลเลียดในแนวตรง</span>'
      }
    };
  }
});

      finds: [{ s: 'f', unit: 'Hz', d: 'ความถี่ (จำนวนรอบต่อวินาที)', value: f, positive: true }],

          '<b>ตรวจสอบด้วยสามัญสำนึก:</b> ' +

                  : 'คาบมากกว่า 1 วินาที ⇒ ยังหมุนไม่ครบรอบใน 1 วินาที ⇒ ความถี่ต้อง<b>น้อยกว่า 1</b>'),
        eqs: [{ eq: 'f = 1 / T', why: 'ความถี่กับคาบเป็นส่วนกลับของกันและกันเสมอ' }],

T({
  id: 'm2-circF2', topic: 7, sub: 'หามวลจากแรงสู่ศูนย์กลาง', level: 'ง่าย',
  skills: ['จัดรูปสมการแรงสู่ศูนย์กลาง'],
  gen(R) {
    const m = R.pick([0.2, 0.5, 1, 2, 4, 5]);
    const v = R.pick([2, 3, 4, 5, 6, 10]);
    const r = R.pick([0.5, 1, 2, 4, 5]);
    const F = r2(m * v * v / r);
    if (!ok2(F) || F < 0.5 || F > 500) return null;
    return {
      stem: 'วัตถุเคลื่อนที่เป็นวงกลมรัศมี ' + U(r, 'm') + ' ด้วยอัตราเร็ว ' + U(v, 'm/s') +
        ' โดยมีแรงสู่ศูนย์กลางขนาด ' + U(F, 'N') + ' จงหา<b>มวลของวัตถุ</b>',
      figure: figCircle({ r: 'r = ' + fmt(r) + ' m', v: 'v = ' + fmt(v) + ' m/s', fc: 'F', m: 'm' }),
      given: [{ s: 'r', v: r, unit: 'm', d: 'รัศมีของวงกลม' },
              { s: 'v', v: v, unit: 'm/s', d: 'อัตราเร็วเชิงเส้น' },
              { s: 'F_c', v: F, unit: 'N', d: 'แรงสู่ศูนย์กลาง' }],
      finds: [{ s: 'm', unit: 'kg', d: 'มวลของวัตถุ', value: m, positive: true }],
      distract: [r2(F * r * v), r2(F / (v * r)), r2(m / 2), r2(m * 2), r2(F / v), r2(F * r / v)],
      sol: {
        analyze: 'แรงสู่ศูนย์กลางคำนวณจาก ' + M('F_c = m v^2 / r') + '<br>' +
          'ข้อนี้โจทย์ให้ ' + M('F_c') + ', ' + M('v') + ', ' + M('r') + ' แล้วถาม ' + M('m') +
          ' จึงต้อง<b>จัดรูปสมการย้อนกลับ</b><br>' +
          'คูณ ' + M('r') + ' ทั้งสองข้าง แล้วหารด้วย ' + M('v^2') + '<br>' +
          '<b>หาความเร่งสู่ศูนย์กลางก่อนก็ได้:</b> ' +
          M('a_c = v^2/r = ' + fmt(v * v) + '/' + fmt(r) + ' = ' + fmt(r2(v * v / r))) + ' m/s² ' +
          'แล้วใช้ ' + M('m = F/a_c'),
        eqs: [{ eq: 'F_c = m v^2 / r', why: 'แรงสู่ศูนย์กลางที่ทำให้วัตถุเคลื่อนที่เป็นวงกลม' },
               { eq: 'm = F_c r / v^2', why: 'จัดรูปโดยคูณ r และหารด้วย v² ทั้งสองข้าง' }],
        solve: EQ('F_c = m v^2 / r', 'm = F_c r / v^2'),
        subst: SEQ('m = ({F})({r}) / {v}^2', { F: F, r: r, v: v }),
        calc: EQ('m = ' + fmtq(r2(F * r)) + ' / ' + fmtq(v * v), 'm = ' + fmtq(m) + ' `kg`'),
        conclude: 'ดังนั้น <b>มวลของวัตถุ = ' + U(m, 'kg') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบย้อนกลับ:</b> ' +
          M('F = m v^2/r = ' + fmt(m) + ' × ' + fmt(v * v) + ' / ' + fmt(r) + ' = ' + fmt(F)) + ' N ✓<br>' +
          '<b>ตรวจหน่วย:</b> ' + M('(`N` × `m`) / (`m/s`)^2 = `N·m` / (`m`^2`/s`^2)') + ' ⇒ ' +
          'แทน ' + M('`N` = `kg·m/s`^2') + ' จะได้หน่วย ' + M('`kg`') + ' ✓<br>' +
          '<b>ข้อควรจำ:</b> "แรงสู่ศูนย์กลาง" ไม่ใช่แรงชนิดใหม่ แต่เป็น<b>บทบาท</b>ของแรงจริง ' +
          'ซึ่งอาจเป็นแรงตึงเชือก แรงเสียดทาน หรือแรงโน้มถ่วง แล้วแต่สถานการณ์</span>'
      }
    };
  }
});

T({
  id: 'm2-shmT', topic: 7, sub: 'คาบของมวลติดสปริง', level: 'ปานกลาง',
  skills: ['T = 2π√(m/k)', 'คาบไม่ขึ้นกับแอมพลิจูด'],
  gen(R) {
    const ratio = R.pick([0.0025, 0.01, 0.04, 0.0625, 0.09, 0.16, 0.25]);
    const k = R.pick([100, 200, 400, 800]);
    const m = r2(ratio * k);
    const root = r2(Math.sqrt(ratio));
    const T0 = round2(2 * Math.PI * root);
    const f = round2(1 / T0);
    if (!ok2(m, root) || m < 0.1 || m > 200 || T0 < 0.1) return null;
    return {
      stem: 'มวล ' + U(m, 'kg') + ' ติดกับสปริงที่มีค่านิจ ' + U(k, 'N/m') +
        ' แล้วปล่อยให้สั่นแบบฮาร์มอนิกอย่างง่ายบนพื้นลื่น ' +
        'จงหา<b>คาบของการสั่น</b> และ<b>ความถี่</b> (ใช้ ' + M('π ≈ 3.14') +
        ' และตอบเป็นทศนิยม 2 ตำแหน่ง)',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลที่ติดสปริง' },
              { s: 'k', v: k, unit: 'N/m', d: 'ค่านิจสปริง' }],
      finds: [{ s: 'T', unit: 's', d: 'คาบของการสั่น', value: T0, positive: true },
              { s: 'f', unit: 'Hz', d: 'ความถี่ของการสั่น', value: f, positive: true }],
      sol: {
        analyze: 'คาบของมวลติดสปริงคือ ' + M('T = 2π √(m/k)') + '<br>' +
          '<b>สังเกตว่าไม่มีแอมพลิจูดอยู่ในสูตรเลย</b> ⇒ ' +
          'ดึงออกไปไกลแค่ไหน คาบก็เท่าเดิม (เรียกว่า isochronism)<br>' +
          '<b>ขั้นตอน</b><br>' +
          '1. หาอัตราส่วน ' + M('m/k = ' + fmt(m) + '/' + fmt(k) + ' = ' + fmtq(ratio)) + '<br>' +
          '2. ถอดรากที่สอง ' + M('√' + fmtq(ratio) + ' = ' + fmtq(root)) + '<br>' +
          '3. คูณด้วย ' + M('2π ≈ 6.28') + '<br>' +
          'จากนั้นหาความถี่จาก ' + M('f = 1/T'),
        eqs: [{ eq: 'T = 2π √(m/k)', why: 'คาบของระบบมวล-สปริง ขึ้นกับมวลและค่านิจสปริงเท่านั้น' },
               { eq: 'f = 1 / T', why: 'ความถี่เป็นส่วนกลับของคาบเสมอ' }],
        solve: EQ('T = 2π √(m/k)', 'f = 1/T'),
        subst: SEQ('T = 2π √({m} / {k})', { m: m, k: k }),
        calc: EQ('m/k = ' + fmtq(ratio), '√(m/k) = ' + fmtq(root),
                 'T = (6.28)(' + fmtq(root) + ') = ' + fmtq(T0) + ' `s`',
                 'f = 1 / ' + fmtq(T0) + ' = ' + fmtq(f) + ' `Hz`'),
        conclude: 'ดังนั้น <b>คาบของการสั่น = ' + U(T0, 's') + '</b> และ ' +
          '<b>ความถี่ = ' + U(f, 'Hz') + '</b><br>' +
          '<span class="hint"><b>สิ่งที่มีผลและไม่มีผลต่อคาบ</b><br>' +
          '• <b>มีผล</b> — มวล (มากขึ้น คาบยาวขึ้น) และค่านิจสปริง (แข็งขึ้น คาบสั้นลง)<br>' +
          '• <b>ไม่มีผล</b> — แอมพลิจูด และค่า ' + M('g') + ' (ต่างจากลูกตุ้ม)<br>' +
          '<b>ผลของการเปลี่ยนมวล:</b> ถ้าเพิ่มมวลเป็น<b>สี่เท่า</b> คาบจะยาวขึ้นเพียง<b>สองเท่า</b> ' +
          'เพราะมวลอยู่ในเครื่องหมายราก<br>' +
          '<b>เปรียบเทียบกับลูกตุ้ม:</b> ' + M('T = 2π √(L/g)') + ' — <b>ไม่ขึ้นกับมวลเลย</b> ' +
          'ขึ้นกับความยาวเชือกและค่า ' + M('g') + ' เท่านั้น</span>'
      }
    };
  }
});

T({
  id: 'm2-conerange', topic: 7, sub: 'ระยะไกลสุดของโพรเจกไทล์', level: 'ปานกลาง',
  skills: ['R = u² sin 2θ / g', 'มุมที่บวกกันได้ 90° ยิงได้ไกลเท่ากัน'],
  gen(R, c) {
    const g = c.g, deg = R.pick([37, 53]), tup = R.pick([1, 2, 3]);
    const uy = r2(g * tup), u = r2(uy / sinD(deg)), ux = r2(u * cosD(deg));
    const Rg = r2(ux * 2 * tup);
    const Rmax = r2(u * u / g);
    if (!ok2(u, ux, Rg, Rmax) || u > 120) return null;
    return {
      stem: 'ยิงวัตถุจากพื้นราบด้วยความเร็วต้น ' + U(u, 'm/s') + ' ทำมุม ' + fmt(deg) +
        '° กับแนวราบ จงหา<b>ระยะทางในแนวราบที่วัตถุตกลงพื้น</b> ' +
        'และ<b>ระยะไกลที่สุดที่เป็นไปได้</b>ถ้าเปลี่ยนมุมยิงได้ (กำหนด ' + GTXT(g) + ')',
      figure: figProj({ mode: 'a', deg: deg, u: 'u = ' + fmt(u) + ' m/s', hlab: 'H', rlab: 'R' }),

              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'R', unit: 'm', d: 'ระยะทางในแนวราบที่มุม ' + fmt(deg) + '°', value: Rg, positive: true },
              { s: 'R_{ไกลสุด}', unit: 'm', d: 'ระยะไกลที่สุด (ที่มุม 45°)', value: Rmax, positive: true }],
      sol: {
        analyze: '<b>วิธีคิดพื้นฐาน</b> แยกความเร็วต้นเป็นสองแนว แล้วใช้เวลาเป็นตัวเชื่อม<br>' +
          '• ' + M('u_y = u sin θ = ' + fmt(uy)) + ' m/s → ใช้หาเวลาลอย<br>' +
          '• ' + M('u_x = u cos θ = ' + fmt(ux)) + ' m/s → <b>คงที่ตลอด</b> ใช้หาระยะ<br>' +

          M('R = u_x × 2t') + '<br>' +
          '<b>สูตรสำเร็จ</b> รวมทุกอย่างเข้าด้วยกันได้เป็น ' + M('R = u^2 sin 2θ / g') + '<br>' +
          'ระยะไกลสุดเกิดเมื่อ ' + M('sin 2θ = 1') + ' ⇒ ' + M('2θ = 90°') + ' ⇒ ' +
          M('θ = 45°') + ' ⇒ ' + M('R_{ไกลสุด} = u^2 / g'),
        eqs: [{ eq: 't_{ขึ้น} = u sin θ / g', why: 'ที่จุดสูงสุดความเร็วแนวดิ่งเป็นศูนย์' },
               { eq: 'R = (u cos θ)(2 t_{ขึ้น})', why: 'แนวราบความเร็วคงที่ คูณด้วยเวลาลอยทั้งหมด' },
               { eq: 'R = u^2 sin 2θ / g', why: 'สูตรสำเร็จที่ได้จากการรวมสองสมการข้างต้น' },
               { eq: 'R_{ไกลสุด} = u^2 / g', why: 'เกิดที่มุม 45° ซึ่งทำให้ sin 2θ มีค่ามากที่สุดคือ 1' }],
        solve: EQ('R = (u cos θ)(2 u sin θ / g)', 'R = u^2 sin 2θ / g', 'R_{ไกลสุด} = u^2 / g'),
        subst: SEQ('R = ({ux})(2 × {t})', { ux: ux, t: tup }) +
               SEQ('R_{ไกลสุด} = {u}^2 / {g}', { u: u, g: g }),
        calc: EQ('R = ' + fmtq(Rg) + ' `m`', 'R_{ไกลสุด} = ' + fmtq(r2(u * u)) + ' / ' + fmtq(g) +
                 ' = ' + fmtq(Rmax) + ' `m`'),
        conclude: 'ดังนั้น <b>ยิงที่มุม ' + fmt(deg) + '° ได้ระยะ ' + U(Rg, 'm') + '</b> และ ' +
          '<b>ระยะไกลที่สุดคือ ' + U(Rmax, 'm') + '</b> (ที่มุม 45°)<br>' +
          '<span class="hint"><b>ข้อสรุปเรื่องมุมที่ต้องจำ</b><br>' +
          '• มุม <b>45°</b> ยิงได้ไกลที่สุดบนพื้นราบเสมอ<br>' +
          '• มุมที่<b>บวกกันได้ 90°</b> ยิงได้<b>ไกลเท่ากัน</b> — ข้อนี้มุม ' + fmt(deg) +
          '° จะได้ระยะเท่ากับมุม ' + fmt(90 - deg) + '° พอดี<br>' +

T({
  id: 'm2-vertbottom', topic: 7, sub: 'แรงตึงเชือกที่จุดต่ำสุด', level: 'ยาก',
  skills: ['เปรียบเทียบสมการที่จุดสูงสุดกับจุดต่ำสุด', 'อนุรักษ์พลังงานในวงกลมแนวดิ่ง'],
  gen(R, c) {
    const g = c.g;
    const r = R.pick([1.25, 2.5, 5, 10, 20, 22.5, 40, 45]);
    const vt = r2(Math.sqrt(g * r));
    const m = R.pick([0.2, 0.5, 1, 2]);
    // อนุรักษ์พลังงานจากยอดถึงจุดต่ำสุด: v_ล่าง² = v_ยอด² + 4gr = 5gr
    const vb2 = r2(5 * g * r);
    const Ttop = 0;
    const Tbot = r2(m * vb2 / r + m * g);
    if (!ok2(vt, vb2, Tbot) || dpOf(vt, 4) > 2 || vt < 1) return null;
    return {
      stem: 'แกว่งวัตถุมวล ' + U(m, 'kg') + ' ผูกเชือกเป็นวงกลมใน<b>แนวดิ่ง</b> รัศมี ' + U(r, 'm') +
        ' โดยที่<b>จุดสูงสุดวัตถุมีอัตราเร็วต่ำสุดพอดี</b>ที่ยังครบวงได้ ' +
        'จงหา<b>อัตราเร็วที่จุดสูงสุด</b> <b>กำลังสองของอัตราเร็วที่จุดต่ำสุด</b> ' +
        'และ<b>แรงตึงเชือกที่จุดต่ำสุด</b> (เชือกลื่น ไม่คิดแรงต้าน กำหนด ' + GTXT(g) + ')',
      figure: figCircle({ vert: true, r: 'r = ' + fmt(r) + ' m', fc: 'mg', m: 'm' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'r', v: r, unit: 'm', d: 'รัศมีของวงกลม' },
              { s: 'T_{ยอด}', v: 0, unit: 'N', d: 'แรงตึงที่จุดสูงสุด (กรณีเร็วต่ำสุด)' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v_{ยอด}', unit: 'm/s', d: 'อัตราเร็วที่จุดสูงสุด', value: vt, positive: true },
              { s: 'v_{ล่าง}^2', unit: 'm²/s²', d: 'กำลังสองของอัตราเร็วที่จุดต่ำสุด', value: vb2, positive: true },
              { s: 'T_{ล่าง}', unit: 'N', d: 'แรงตึงเชือกที่จุดต่ำสุด', value: Tbot, positive: true }],
      sol: {
        analyze: '<b>ต้องเปรียบเทียบสมการที่สองตำแหน่ง โดยให้ทิศเข้าหาศูนย์กลางเป็นบวกเสมอ</b><br>' +
          '<b>ที่จุดสูงสุด</b> — ทั้งน้ำหนักและแรงตึงชี้<b>ลง</b> ซึ่งเข้าหาศูนย์กลางทั้งคู่<br>' +
          M('m g + T_{ยอด} = m v_{ยอด}^2 / r') + '<br>' +
          'กรณีเร็วต่ำสุด ' + M('T_{ยอด} = 0') + ' ⇒ ' + M('v_{ยอด} = √(g r)') + '<br>' +
          '<b>เชื่อมสองจุดด้วยอนุรักษ์พลังงาน</b> — จุดต่ำสุดอยู่ต่ำกว่าจุดสูงสุด ' + M('2r') + '<br>' +
          M('(1/2) v_{ล่าง}^2 = (1/2) v_{ยอด}^2 + g(2r)') + ' ⇒ ' +
          M('v_{ล่าง}^2 = v_{ยอด}^2 + 4 g r = g r + 4 g r = 5 g r') + '<br>' +
          '<b>ที่จุดต่ำสุด</b> — แรงตึงชี้<b>ขึ้น</b> (เข้าศูนย์กลาง) น้ำหนักชี้<b>ลง</b> (ออกจากศูนย์กลาง)<br>' +
          M('T_{ล่าง} - m g = m v_{ล่าง}^2 / r'),
        eqs: [{ eq: 'v_{ยอด} = √(g r)', why: 'เงื่อนไขวิกฤตที่ยอด เมื่อแรงตึงเชือกเป็นศูนย์พอดี' },
               { eq: 'v_{ล่าง}^2 = v_{ยอด}^2 + 4 g r = 5 g r',
                 why: 'อนุรักษ์พลังงานกล โดยจุดต่ำสุดอยู่ต่ำกว่าจุดสูงสุดเป็นระยะ 2r' },
               { eq: 'T_{ล่าง} = m v_{ล่าง}^2 / r + m g',
                 why: 'ที่จุดต่ำสุด เชือกต้องทั้งให้แรงสู่ศูนย์กลางและสู้กับน้ำหนักพร้อมกัน' }],
        solve: EQ('v_{ยอด} = √(g r)', 'v_{ล่าง}^2 = 5 g r', 'T_{ล่าง} = m v_{ล่าง}^2 / r + m g'),
        subst: SEQ('v_{ยอด} = √( ({g})({r}) )', { g: g, r: r }) +
               SEQ('v_{ล่าง}^2 = 5 × {g} × {r}', { g: g, r: r }) +
               SEQ('T_{ล่าง} = ({m})({vb}) / {r} + ({m})({g})', { m: m, vb: vb2, r: r, g: g }),
        calc: EQ('v_{ยอด} = √' + fmtq(r2(g * r)) + ' = ' + fmtq(vt) + ' `m/s`',
                 'v_{ล่าง}^2 = ' + fmtq(vb2) + ' `m`^2`/s`^2',
                 'T_{ล่าง} = ' + fmtq(r2(m * vb2 / r)) + ' + ' + fmtq(r2(m * g)) + ' = ' + fmtq(Tbot) + ' `N`'),
        conclude: 'ดังนั้น <b>อัตราเร็วที่ยอด ' + U(vt, 'm/s') + ' · ' + M('v_{ล่าง}^2') + ' = ' +
          fmt(vb2) + ' m²/s² · แรงตึงที่จุดต่ำสุด ' + U(Tbot, 'N') + '</b><br>' +
          '<span class="hint"><b>ผลลัพธ์ที่สวยงามและควรจำ</b><br>' +
          'แทน ' + M('v_{ล่าง}^2 = 5gr') + ' จะได้ ' + M('T_{ล่าง} = 5 m g + m g = 6 m g') + '<br>' +
          'ตรวจสอบ: ' + M('6 m g = 6 × ' + fmt(m) + ' × ' + fmtq(g) + ' = ' + fmt(r2(6 * m * g))) + ' N ✓<br>' +
          '<b>เทียบกับน้ำหนักวัตถุ</b> (' + U(r2(m * g), 'N') + ') ⇒ ' +
          'แรงตึงที่จุดต่ำสุด<b>มากถึง 6 เท่าของน้ำหนัก</b><br>' +
          '<b>นี่คือเหตุผลที่เชือกมักขาดที่จุดต่ำสุด</b> และทำไมโครงสร้างรางรถไฟเหาะ' +
          'ส่วนล่างของวงตีลังกาต้องแข็งแรงเป็นพิเศษ</span>'
      }
    };
  }
});

T({
  id: 'x2-kmh2', topic: 8, sub: 'แปลงหน่วยแล้วคำนวณต่อ', level: 'ง่าย',
  skills: ['แปลงหน่วยก่อนแทนค่าเสมอ'],
  gen(R) {
    const kmh = R.pick([36, 54, 72, 90, 108]);
    const ms = r2(kmh / 3.6);
    const t = R.pick([5, 10, 20, 30, 60]);
    const s = r2(ms * t);
    if (!ok2(ms, s)) return null;
    const car = R.pick(CARS);
    return {
      stem: esc(car) + 'แล่นด้วยอัตราเร็วคงที่ ' + U(kmh, 'km/h') + ' เป็นเวลา ' + U(t, 's') +
        ' จงหา<b>ระยะทางที่แล่นได้ในหน่วยเมตร</b>',
      given: [{ s: 'v', v: kmh, unit: 'km/h', d: 'อัตราเร็ว (หน่วยที่ต้องแปลงก่อน)' },
              { s: 't', v: t, unit: 's', d: 'เวลา' }],
      finds: [{ s: 's', unit: 'm', d: 'ระยะทางที่แล่นได้', value: s, positive: true }],
      distract: [r2(kmh * t), r2(kmh * t / 60), r2(s / 2), r2(s * 2), r2(kmh * t * 3.6), r2(ms * t / 3.6)],
      sol: {
        analyze: '<b>กับดักที่คลาสสิกที่สุดของข้อสอบ:</b> เอา ' + M('v') + ' คูณ ' + M('t') +
          ' ทันทีโดยไม่แปลงหน่วยก่อน<br>' +
          'อัตราเร็วอยู่ในหน่วย ' + M('`km/h`') + ' แต่เวลาอยู่ในหน่วย ' + M('`s`') +
          ' — <b>หน่วยไม่เข้ากัน</b> คูณกันตรง ๆ ไม่ได้<br>' +
          '<b>ขั้นที่ 1</b> แปลงเป็นหน่วยฐาน ' + M('`m/s`') + ' โดยหารด้วย 3.6<br>' +
          M(fmt(kmh) + ' ÷ 3.6 = ' + fmt(ms)) + ' m/s<br>' +
          '<b>ขั้นที่ 2</b> จึงคูณกับเวลาได้',
        eqs: [{ eq: 'v (`m/s`) = v (`km/h`) / 3.6', why: 'แปลงหน่วยให้เป็นหน่วยฐานก่อนแทนค่าเสมอ' },
               { eq: 's = v t', why: 'อัตราเร็วคงที่ จึงคูณกับเวลาได้ตรง ๆ เมื่อหน่วยเข้ากันแล้ว' }],
        solve: EQ('v = v (`km/h`) / 3.6', 's = v t'),
        subst: SEQ('v = {k} / 3.6', { k: kmh }) + SEQ('s = ({v})({t})', { v: ms, t: t }),
        calc: EQ('v = ' + fmtq(ms) + ' `m/s`', 's = ' + fmtq(s) + ' `m`'),
        conclude: 'ดังนั้น <b>ระยะทางที่แล่นได้ = ' + U(s, 'm') + '</b> ' +
          '(หรือ ' + U(r2(s / 1000), 'km') + ')<br>' +
          '<span class="hint"><b>ถ้าไม่แปลงหน่วยจะได้ ' + fmt(r2(kmh * t)) +
          ' ซึ่งผิดไปถึง 3.6 เท่า</b><br>' +
          '<b>นิสัยที่ควรสร้างก่อนสอบ:</b> พออ่านโจทย์จบ ให้<b>แปลงทุกค่าเป็นหน่วยฐาน</b> ' +
          '(เมตร กิโลกรัม วินาที) ก่อนลงมือคำนวณเสมอ<br>' +
          '<b>ค่าที่ควรจำติดตัว:</b> 36 km/h = 10 m/s · 72 km/h = 20 m/s · 90 km/h = 25 m/s<br>' +
          '<b>ตรวจอีกทาง:</b> ' + fmt(kmh) + ' km/h แปลว่าใน 1 ชั่วโมงไปได้ ' + fmt(kmh) + ' km ⇒ ' +
          'ใน ' + fmt(t) + ' วินาทีไปได้ ' + M(fmt(kmh) + ' × ' + fmt(t) + '/3600 = ' + fmt(r2(s / 1000))) + ' km ✓</span>'
      }
    };
  }
});

T({
  id: 'x2-graphacc', topic: 8, sub: 'หาความเร่งจากกราฟ', level: 'ง่าย',
  skills: ['ความชันของกราฟ v–t คือความเร่ง'],
  gen(R) {
    const v0 = R.pick([0, 4, 5, 8]);
    const v1 = v0 + R.pick([8, 10, 12, 16, 20]);
    const t1 = R.pick([2, 4, 5, 8, 10]);
    const a = r2((v1 - v0) / t1);
    if (!ok2(a) || a < 0.5) return null;
    return {
      stem: 'จากกราฟความเร็ว-เวลา วัตถุมีความเร็วเปลี่ยนจาก ' + U(v0, 'm/s') + ' เป็น ' + U(v1, 'm/s') +
        ' ในเวลา ' + U(t1, 's') + ' จงหา<b>ความเร่ง</b>ของวัตถุในช่วงนี้',
      figure: figVT({ tmax: t1, vmax: v1, vmin: 0, tstep: 4, vstep: 4,
                      pts: [[0, v0], [t1, v1]] }),
      given: [{ s: 'v_1', v: v0, unit: 'm/s', d: 'ความเร็วตอนเริ่ม' },
              { s: 'v_2', v: v1, unit: 'm/s', d: 'ความเร็วตอนจบ' },
              { s: 'Δt', v: t1, unit: 's', d: 'ช่วงเวลา' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่ง (ความชันของกราฟ)', value: a, positive: true }],
      distract: [r2(v1 / t1), r2((v1 + v0) / t1), r2(a / 2), r2(a * 2), r2(t1 / (v1 - v0)), r2(v1 - v0)],
      sol: {
        analyze: '<b>กฎทองของกราฟ ' + M('v') + '–' + M('t') + '</b><br>' +
          '• <b>ความชัน</b> = <b>ความเร่ง</b><br>' +
          '• <b>พื้นที่ใต้กราฟ</b> = <b>การกระจัด</b><br>' +
          'ความชัน = ' + M('Δv / Δt') + ' ⇒ หน่วย ' + M('`m/s` ÷ `s` = `m/s`^2') +
          ' ⇒ ตรงกับหน่วยของความเร่ง ✓<br>' +
          '<b>ข้อควรระวัง:</b> ต้องใช้<b>ผลต่าง</b>ของความเร็ว ' + M('v_2 - v_1') +
          ' ไม่ใช่ความเร็วปลายเพียงอย่างเดียว<br>' +
          M('Δv = ' + fmt(v1) + ' - ' + fmt(v0) + ' = ' + fmt(v1 - v0)) + ' m/s',
        eqs: [{ eq: 'a = ความชัน = Δv / Δt', why: 'ความเร่งคืออัตราการเปลี่ยนแปลงความเร็วต่อเวลา' }],
        solve: EQ('a = (v_2 - v_1) / Δt'),
        subst: SEQ('a = ({v2} - {v1}) / {t}', { v2: v1, v1: v0, t: t1 }),
        calc: EQ('a = ' + fmtq(v1 - v0) + ' / ' + fmtq(t1), 'a = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>ความเร่ง = ' + U(a, 'm/s²') + '</b> ' +
          '(กราฟเอียงขึ้น ⇒ ความเร่งเป็นบวก ⇒ วัตถุเร็วขึ้น)<br>' +
          '<span class="hint"><b>อ่านข้อมูลอื่นจากกราฟเดียวกันได้อีก</b><br>' +
          '• การกระจัด = พื้นที่ใต้กราฟ = ' +
          M('(1/2)(' + fmt(v0) + ' + ' + fmt(v1) + ')(' + fmt(t1) + ') = ' +
            fmt(r2(0.5 * (v0 + v1) * t1))) + ' m<br>' +
          '• ความเร็วเฉลี่ย = ' + M('(' + fmt(v0) + ' + ' + fmt(v1) + ')/2 = ' + fmt(r2((v0 + v1) / 2))) + ' m/s<br>' +
          '<b>รูปร่างกราฟที่ต้องแยกให้ออก</b><br>' +
          '• เส้นตรง<b>เอียงขึ้น</b> ⇒ ความเร่งคงที่เป็นบวก<br>' +
          '• เส้นตรง<b>แนวนอน</b> ⇒ ความเร่งเป็นศูนย์ (ความเร็วคงที่)<br>' +
          '• เส้นตรง<b>เอียงลง</b> ⇒ ความเร่งเป็นลบ (ชะลอลง)</span>'
      }
    };
  }
});

T({
  id: 'x2-effcalc', topic: 8, sub: 'ประสิทธิภาพจากพลังงาน', level: 'ง่าย',
  skills: ['เปรียบเทียบพลังงานที่ได้กับที่ให้', 'ประสิทธิภาพต้องน้อยกว่า 100%'],
  gen(R) {

    const Ein = r2(Eout / eff);
    if (!ok2(Ein)) return null;
    return {
      stem: 'เครื่องจักรได้รับพลังงาน ' + U(Ein, 'J') + ' แล้วทำงานที่เป็นประโยชน์ได้ ' + U(Eout, 'J') +
        ' จงหา<b>ประสิทธิภาพของเครื่องจักร</b>เป็นเปอร์เซ็นต์',

              { s: 'E_{ออก}', v: Eout, unit: 'J', d: 'งานที่เป็นประโยชน์' }],

                 r2(eff), r2(eff * 200)],
      sol: {
        analyze: '<b>ประสิทธิภาพ</b> คือสัดส่วนของพลังงานที่<b>ใช้ประโยชน์ได้จริง</b> ' +
          'เทียบกับพลังงานที่<b>ป้อนเข้าไปทั้งหมด</b><br>' +
          M('Eff = (E_{ออก} / E_{เข้า}) × 100%') + '<br>' +
          '<b>จุดที่ต้องระวังที่สุด: อย่าคิดกลับเศษกับส่วน</b> ' +
          'ตัวเศษต้องเป็นพลังงาน<b>ที่ได้</b> ตัวส่วนเป็นพลังงาน<b>ที่ให้</b><br>' +
          'ถ้าคิดกลับกันจะได้ค่าเกิน 100% ซึ่งเป็นไปไม่ได้ทางฟิสิกส์',
        eqs: [{ eq: 'Eff = (E_{ออก} / E_{เข้า}) × 100%',
                why: 'นิยามของประสิทธิภาพ — สัดส่วนของพลังงานที่ใช้ประโยชน์ได้' }],
        solve: EQ('Eff = (E_{ออก} / E_{เข้า}) × 100'),
        subst: SEQ('Eff = ({o} / {i}) × 100', { o: Eout, i: Ein }),
        calc: EQ('Eff = ' + fmtq(eff) + ' × 100 = ' + fmtq(r2(eff * 100)) + ' %'),
        conclude: 'ดังนั้น <b>ประสิทธิภาพ = ' + fmt(r2(eff * 100)) + ' %</b><br>' +
          '<span class="hint"><b>พลังงานที่สูญเสีย</b> = ' +
          M(fmt(Ein) + ' - ' + fmt(Eout) + ' = ' + fmt(r2(Ein - Eout))) + ' J ' +
          '(คิดเป็น ' + fmt(r2(100 - eff * 100)) + '%)<br>' +
          '<b>พลังงานส่วนนี้ไม่ได้หายไป</b> แต่เปลี่ยนเป็นความร้อน เสียง และการสั่นสะเทือน — ' +
          'กฎการอนุรักษ์พลังงานยังเป็นจริงเสมอ<br>' +
          '<b>ใช้เป็นจุดตรวจคำตอบ:</b> ประสิทธิภาพต้อง<b>น้อยกว่า 100% เสมอ</b> ' +

      }
    };
  }

T({
  id: 'x2-liftcable', topic: 8, sub: 'แรงตึงสายลิฟต์', level: 'ปานกลาง',
  skills: ['กฎข้อที่สองในแนวดิ่ง', 'แยกกรณีเร่งขึ้นกับเร่งลง'],
  gen(R, c) {
    const g = c.g, m = R.pick([200, 400, 500, 800, 1000]);
    const a = R.pick([1, 1.5, 2, 2.5]);
    const up = r2(m * (g + a)), down = r2(m * (g - a));
    if (!ok2(up, down) || down < 10) return null;
    return {
      stem: 'ลิฟต์พร้อมผู้โดยสารมีมวลรวม ' + U(m, 'kg') + ' แขวนด้วยสายเคเบิล ' +
        'จงหา<b>แรงตึงในสายเคเบิล</b>ในสองกรณี คือ ' +
        '<b>(1) ลิฟต์เร่งขึ้นด้วยความเร่ง ' + fmt(a) + ' m/s²</b> และ ' +
        '<b>(2) ลิฟต์เร่งลงด้วยความเร่ง ' + fmt(a) + ' m/s²</b> (กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลรวมของลิฟต์และผู้โดยสาร' },
              { s: 'a', v: a, unit: 'm/s²', d: 'ขนาดความเร่งของลิฟต์' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'T_{ขึ้น}', unit: 'N', d: 'แรงตึงเมื่อเร่งขึ้น', value: up, positive: true },
              { s: 'T_{ลง}', unit: 'N', d: 'แรงตึงเมื่อเร่งลง', value: down, positive: true }],
      sol: {
        analyze: 'วาดแผนภาพแรงของลิฟต์ จะเห็นสองแรงในแนวดิ่ง<br>' +
          '• <b>แรงตึงสาย</b> ' + M('T') + ' ชี้<b>ขึ้น</b><br>' +
          '• <b>น้ำหนัก</b> ' + M('mg = ' + fmt(r2(m * g))) + ' N ชี้<b>ลง</b><br>' +
          '<b>กฎเหล็ก: ให้ทิศของความเร่งเป็นบวกเสมอ</b> แล้วเขียน ' + M('ΣF = ma') + '<br>' +
          '<b>กรณีเร่งขึ้น</b> — แรงลัพธ์ต้องชี้ขึ้น ⇒ ' + M('T > mg') + '<br>' +
          M('T - m g = m a') + ' ⇒ ' + M('T = m(g + a)') + '<br>' +
          '<b>กรณีเร่งลง</b> — แรงลัพธ์ต้องชี้ลง ⇒ ' + M('T < mg') + '<br>' +
          M('m g - T = m a') + ' ⇒ ' + M('T = m(g - a)'),
        eqs: [{ eq: 'T = m (g + a)', why: 'เร่งขึ้น — สายต้องออกแรงมากกว่าน้ำหนักจึงจะเร่งขึ้นได้' },
               { eq: 'T = m (g - a)', why: 'เร่งลง — สายออกแรงน้อยกว่าน้ำหนัก ปล่อยให้ตกลงด้วยความเร่ง' }],
        solve: EQ('T_{ขึ้น} = m (g + a)', 'T_{ลง} = m (g - a)'),
        subst: SEQ('T_{ขึ้น} = ({m})({g} + {a})', { m: m, g: g, a: a }) +
               SEQ('T_{ลง} = ({m})({g} - {a})', { m: m, g: g, a: a }),
        calc: EQ('T_{ขึ้น} = (' + fmtq(m) + ')(' + fmtq(r2(g + a)) + ') = ' + fmtq(up) + ' `N`',
                 'T_{ลง} = (' + fmtq(m) + ')(' + fmtq(r2(g - a)) + ') = ' + fmtq(down) + ' `N`'),
        conclude: 'ดังนั้น <b>เร่งขึ้นสายรับแรง ' + U(up, 'N') + '</b> และ ' +
          '<b>เร่งลงสายรับแรง ' + U(down, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบเชิงเหตุผล:</b> น้ำหนักลิฟต์คือ ' + U(r2(m * g), 'N') + '<br>' +
          '• เร่งขึ้น ⇒ ' + fmt(up) + ' N <b>มากกว่า</b>น้ำหนัก ✓<br>' +
          '• เร่งลง ⇒ ' + fmt(down) + ' N <b>น้อยกว่า</b>น้ำหนัก ✓<br>' +
          '<b>สี่กรณีที่ต้องแยกให้ออก</b><br>' +
          '1. อยู่นิ่ง หรือความเร็วคงที่ ⇒ ' + M('T = mg = ' + fmt(r2(m * g))) + ' N<br>' +
          '2. เร่งขึ้น ⇒ ' + M('T > mg') + ' (รู้สึกตัวหนัก)<br>' +
          '3. เร่งลง ⇒ ' + M('T < mg') + ' (รู้สึกตัวเบา)<br>' +
          '4. สายขาด ⇒ ' + M('T = 0, a = g') + ' ⇒ <b>สภาพไร้น้ำหนัก</b><br>' +
          '<b>วิศวกรออกแบบสายลิฟต์ตามกรณีที่ 2</b> เพราะเป็นกรณีที่รับแรงมากที่สุด</span>'
      }
    };
  }
});

T({
  id: 'x2-projenergy2', topic: 8, sub: 'โพรเจกไทล์แนวราบกับพลังงาน', level: 'ปานกลาง',
  skills: ['ใช้พลังงานหาความเร็วขณะกระทบพื้น', 'เทียบสองวิธีให้ได้คำตอบเดียวกัน'],
  gen(R, c) {
    const g = c.g, t = R.pick([1, 2, 3]);
    const vy = r2(g * t), ux = r2(0.75 * vy), v = r2(1.25 * vy);
    const h = r2(0.5 * g * t * t);
    const m = R.pick([0.2, 0.5, 1, 2]);
    const Ek0 = r2(0.5 * m * ux * ux), Ek1 = r2(0.5 * m * v * v);
    if (!ok2(vy, ux, v, h, Ek0, Ek1)) return null;
    return {
      stem: 'ปาลูกบอลมวล ' + U(m, 'kg') + ' ออกไปใน<b>แนวราบ</b>ด้วยความเร็ว ' + U(ux, 'm/s') +
        ' จากยอดหน้าผาสูง ' + U(h, 'm') + ' จงหา<b>พลังงานจลน์ตอนเริ่มปา</b> ' +
        '<b>อัตราเร็วขณะกระทบพื้น</b> และ<b>พลังงานจลน์ขณะกระทบพื้น</b> ' +
        '(ไม่คิดแรงต้านอากาศ กำหนด ' + GTXT(g) + ')',
      figure: figProj({ mode: 'h', u: 'u = ' + fmt(ux) + ' m/s', hlab: 'h = ' + fmt(h) + ' m' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของลูกบอล' },
              { s: 'u_x', v: ux, unit: 'm/s', d: 'ความเร็วต้นในแนวราบ' },
              { s: 'h', v: h, unit: 'm', d: 'ความสูงของหน้าผา' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'E_{k,ต้น}', unit: 'J', d: 'พลังงานจลน์ตอนเริ่มปา', value: Ek0, positive: true },
              { s: 'v', unit: 'm/s', d: 'อัตราเร็วขณะกระทบพื้น', value: v, positive: true },
              { s: 'E_{k,ปลาย}', unit: 'J', d: 'พลังงานจลน์ขณะกระทบพื้น', value: Ek1, positive: true }],
      sol: {
        analyze: '<b>ข้อนี้ใช้วิธีพลังงานจะเร็วกว่าวิธีแยกแนวมาก</b><br>' +
          'ไม่คิดแรงต้านอากาศ ⇒ <b>พลังงานกลอนุรักษ์</b>ตลอดการเคลื่อนที่<br>' +
          M('E_{k,ต้น} + E_{p,ต้น} = E_{k,ปลาย} + E_{p,ปลาย}') + '<br>' +
          'ให้ระดับพื้นเป็นระดับอ้างอิง ⇒ ' + M('E_{p,ปลาย} = 0') + '<br>' +
          M('(1/2) m u_x^2 + m g h = (1/2) m v^2') + '<br>' +
          '<b>ตัด ' + M('m') + ' ออกได้ทั้งสมการ</b> ⇒ ' + M('v^2 = u_x^2 + 2 g h') + '<br>' +
          '<b>ข้อสังเกตสำคัญ:</b> วิธีพลังงาน<b>ไม่ต้องหาเวลาเลย</b> และไม่ต้องแยกแนวราบกับแนวดิ่ง',
        eqs: [{ eq: 'E_k = (1/2) m v^2', why: 'สูตรพลังงานจลน์' },
               { eq: '(1/2) m u_x^2 + m g h = (1/2) m v^2',
                 why: 'อนุรักษ์พลังงานกล ใช้ได้เพราะไม่มีแรงต้านอากาศ' },
               { eq: 'v = √(u_x^2 + 2 g h)', why: 'ตัดมวลออกทั้งสมการ — อัตราเร็วปลายไม่ขึ้นกับมวล' }],
        solve: EQ('E_{k,ต้น} = (1/2) m u_x^2', 'v = √(u_x^2 + 2 g h)', 'E_{k,ปลาย} = (1/2) m v^2'),
        subst: SEQ('E_{k,ต้น} = (1/2)({m})({u})^2', { m: m, u: ux }) +
               SEQ('v = √({u}^2 + 2 × {g} × {h})', { u: ux, g: g, h: h }) +
               SEQ('E_{k,ปลาย} = (1/2)({m})({v})^2', { m: m, v: v }),
        calc: EQ('E_{k,ต้น} = ' + fmtq(Ek0) + ' `J`',
                 'v = √(' + fmtq(r2(ux * ux)) + ' + ' + fmtq(r2(2 * g * h)) + ') = √' + fmtq(r2(v * v)),
                 'v = ' + fmtq(v) + ' `m/s`',
                 'E_{k,ปลาย} = ' + fmtq(Ek1) + ' `J`'),
        conclude: 'ดังนั้น <b>พลังงานจลน์ต้น ' + U(Ek0, 'J') + ' · อัตราเร็วขณะกระทบพื้น ' + U(v, 'm/s') +
          ' · พลังงานจลน์ปลาย ' + U(Ek1, 'J') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยวิธีแยกแนว (ได้คำตอบเดียวกัน)</b><br>' +
          'เวลาลอย ' + M('t = √(2h/g) = ' + fmt(t)) + ' s ⇒ ' + M('v_y = g t = ' + fmt(vy)) + ' m/s<br>' +
          M('v = √(u_x^2 + v_y^2) = √(' + fmt(r2(ux * ux)) + ' + ' + fmt(r2(vy * vy)) + ') = ' + fmt(v)) + ' m/s ✓<br>' +
          'สังเกตว่า ' + M(fmt(ux) + ' : ' + fmt(vy) + ' : ' + fmt(v)) + ' ย่อได้ <b>3 : 4 : 5</b><br>' +
          '<b>ตรวจสอบพลังงาน:</b> พลังงานที่เพิ่มขึ้น ' +
          M(fmt(Ek1) + ' - ' + fmt(Ek0) + ' = ' + fmt(r2(Ek1 - Ek0))) + ' J<br>' +
          'ซึ่งเท่ากับพลังงานศักย์ที่ลดลง ' + M('m g h = ' + fmt(r2(m * g * h))) + ' J พอดี ✓</span>'
      }
    };
  }
});

T({
  id: 'x2-pulley-energy', topic: 8, sub: 'ระบบรอกกับพลังงาน', level: 'ยาก',
  skills: ['เลือกใช้พลังงานแทนการเขียนสมการแรง', 'ตรวจคำตอบด้วยสองวิธี'],
  gen(R, c) {
    const g = c.g, pr = R.pick([[3, 1], [5, 3], [7, 1], [9, 3], [7, 3], [6, 2], [15, 5]]);
    const m1 = pr[0], m2 = pr[1];
    const a = r2((m1 - m2) * g / (m1 + m2));
    const h = R.pick([2, 4, 5, 8, 10, 20, 25, 40, 45, 50]);
    const v = r2(Math.sqrt(2 * a * h));
    const dEp = r2((m1 - m2) * g * h);
    const Ek = r2(0.5 * (m1 + m2) * v * v);
    if (!ok2(a, v, dEp, Ek) || dpOf(v, 4) > 2 || v < 1 || dEp > 8000) return null;
    return {
      stem: 'มวล ' + U(m1, 'kg') + ' และ ' + U(m2, 'kg') + ' ผูกด้วยเชือกเบาคล้องผ่าน<b>รอกลื่นมวลเบา</b> ' +
        'ปล่อยระบบจากหยุดนิ่ง เมื่อมวลที่หนักกว่าเคลื่อนที่ลงมาได้ ' + U(h, 'm') +
        ' จงหา<b>พลังงานศักย์รวมที่ลดลง</b> <b>อัตราเร็วของระบบ</b> และ<b>ความเร่งของระบบ</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figPulley({ m1: 'm₂', m2: 'm₁' }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลก้อนหนัก (เคลื่อนที่ลง h)' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลก้อนเบา (เคลื่อนที่ขึ้น h)' },
              { s: 'h', v: h, unit: 'm', d: 'ระยะที่แต่ละก้อนเคลื่อนที่' },
              { s: 'u', v: 0, unit: 'm/s', d: 'ปล่อยจากหยุดนิ่ง' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'ΔE_p', unit: 'J', d: 'พลังงานศักย์รวมที่ลดลง', value: dEp, positive: true },
              { s: 'v', unit: 'm/s', d: 'อัตราเร็วของทั้งสองก้อน', value: v, positive: true },
              { s: 'a', unit: 'm/s²', d: 'ความเร่งของระบบ', value: a, positive: true }],
      sol: {
        analyze: '<b>กุญแจของข้อนี้: เชือกไม่ยืด ⇒ ทั้งสองก้อนเคลื่อนที่ด้วยอัตราเร็วเท่ากันเสมอ</b><br>' +
          'เมื่อก้อนหนักลง ' + M('h') + ' ก้อนเบาก็ขึ้น ' + M('h') + ' พอดี<br>' +
          '<b>พลังงานศักย์ที่เปลี่ยนไป</b> ต้องคิด<b>ทั้งสองก้อนหักล้างกัน</b><br>' +
          '• ก้อนหนักลดลง ' + M('m_1 g h = ' + fmt(r2(m1 * g * h))) + ' J<br>' +
          '• ก้อนเบาเพิ่มขึ้น ' + M('m_2 g h = ' + fmt(r2(m2 * g * h))) + ' J<br>' +
          '• สุทธิลดลง ' + M('(m_1 - m_2) g h = ' + fmt(dEp)) + ' J<br>' +
          '<b>พลังงานที่ลดลงนี้กลายเป็นพลังงานจลน์ของทั้งสองก้อนรวมกัน</b><br>' +
          M('(m_1 - m_2) g h = (1/2)(m_1 + m_2) v^2') + '<br>' +
          '<b>ข้อดีของวิธีพลังงาน:</b> ไม่ต้องเขียนสมการแรงของแต่ละก้อนเลย ' +
          'และ<b>แรงตึงเชือกตัดหายไปเอง</b>เพราะเป็นแรงภายในระบบ',
        eqs: [{ eq: 'ΔE_p = (m_1 - m_2) g h',
                why: 'พลังงานศักย์สุทธิที่ลดลง — ก้อนหนักลดลง ก้อนเบาเพิ่มขึ้น หักกลบกัน' },
               { eq: 'ΔE_p = (1/2)(m_1 + m_2) v^2',
                 why: 'อนุรักษ์พลังงานกล — ทั้งสองก้อนเคลื่อนที่ด้วยอัตราเร็วเท่ากัน' },
               { eq: 'v^2 = 2 a h', why: 'ใช้ย้อนหาความเร่ง เพราะความเร่งคงที่และเริ่มจากหยุดนิ่ง' }],
        solve: EQ('ΔE_p = (m_1 - m_2) g h',
                  'v = √( 2 (m_1 - m_2) g h / (m_1 + m_2) )',
                  'a = v^2 / (2 h)'),
        subst: SEQ('ΔE_p = ({m1} - {m2})({g})({h})', { m1: m1, m2: m2, g: g, h: h }) +
               SEQ('v = √( 2 × {E} / {mt} )', { E: dEp, mt: m1 + m2 }) +
               SEQ('a = {v}^2 / (2 × {h})', { v: v, h: h }),
        calc: EQ('ΔE_p = ' + fmtq(dEp) + ' `J`',
                 'v = √( ' + fmtq(r2(2 * dEp)) + ' / ' + fmtq(m1 + m2) + ' ) = ' + fmtq(v) + ' `m/s`',
                 'a = ' + fmtq(r2(v * v)) + ' / ' + fmtq(r2(2 * h)) + ' = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>พลังงานศักย์ลดลง ' + U(dEp, 'J') + ' · อัตราเร็ว ' + U(v, 'm/s') +
          ' · ความเร่ง ' + U(a, 'm/s²') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยวิธีแรง (ได้คำตอบเดียวกัน)</b><br>' +
          M('a = (m_1 - m_2) g / (m_1 + m_2) = ' + fmt(r2((m1 - m2) * g)) + ' / ' + fmt(m1 + m2) +
            ' = ' + fmt(a)) + ' m/s² ✓<br>' +
          '<b>ตรวจสอบพลังงานจลน์:</b> ' +
          M('(1/2)(' + fmt(m1 + m2) + ')(' + fmt(v) + ')^2 = ' + fmt(Ek)) + ' J ' +
          'เท่ากับพลังงานศักย์ที่ลดลง ' + fmt(dEp) + ' J ✓<br>' +
          '<b>กรณีสุดขั้วที่ควรลองคิด</b><br>' +
          '• ถ้า ' + M('m_1 = m_2') + ' ⇒ ' + M('ΔE_p = 0') + ' ⇒ ระบบสมดุลไม่ขยับ<br>' +
          '• ถ้า ' + M('m_2 = 0') + ' ⇒ ' + M('a = g') + ' ⇒ กลายเป็นการตกอิสระ<br>' +

   5) แท็บสร้างชุดโจทย์ และแท็บทำแบบฝึกหัด
   ========================================================================== */

function subsOf(topicId) {
  const seen = [];
  TPL.forEach(t => { if (t.topic === topicId && seen.indexOf(t.sub) < 0) seen.push(t.sub); });
  return seen;
}
function poolFor(topics, subs, level) {
  return TPL.filter(t => topics.indexOf(t.topic) >= 0 && t.level === level &&
    (!subs || !subs.length || subs.indexOf(t.sub) >= 0));
}
function mkCfg() {
  if (!DB.settings.make) {
    DB.settings.make = { topics: ALL_TOPIC_IDS.slice(), subs: [], mode: 'mix', n: 10,
                         counts: { 'ทฤษฎี': 2, 'ง่าย': 3, 'ปานกลาง': 3, 'ยาก': 2 } };
  }
  // ถ้ามีการเพิ่ม/ลบบทในโปรแกรมรุ่นใหม่ ให้ตัดเรื่องที่ไม่มีอยู่จริงทิ้ง กันหน้าจอพัง
  const c = DB.settings.make;
  c.topics = (c.topics || []).filter(t => ALL_TOPIC_IDS.indexOf(t) >= 0);
  if (!c.topics.length) c.topics = ALL_TOPIC_IDS.slice();
  return c;
}

/** สร้างชุดโจทย์ใหม่ — เก็บแค่ tplId กับ seed ทำให้สร้างโจทย์เดิมกลับมาได้เสมอ */
function createQuiz(o) {
  const R = rng(o.seed >>> 0);
  const items = [];
  const missing = [];
  LEVELS.forEach(lv => {
    const need = o.counts[lv] || 0;
    if (!need) return;
    const pool = poolFor(o.topics, o.subs, lv);
    if (!pool.length) { missing.push(lv); return; }
    // สับแม่แบบแล้วไล่หยิบวนไป เพื่อให้กระจายทั่วถึงก่อนจะเริ่มซ้ำ
    let bag = R.shuffle(pool);
    for (let k = 0; k < need; k++) {
      if (k % pool.length === 0 && k > 0) bag = R.shuffle(pool);
      const tpl = bag[k % pool.length];
      items.push({ tplId: tpl.id, seed: R.int(1, 2000000000), level: lv, topic: tpl.topic });
    }
  });
  if (missing.length) return { error: 'ไม่มีโจทย์ระดับ ' + missing.join(', ') + ' ในเรื่อง/หัวข้อที่เลือก' };
  // เรียงจากง่ายไปยาก แล้วเรียงตามเรื่อง เพื่อให้ใบงานไล่ระดับอย่างเป็นธรรมชาติ
  items.sort((a, b) => (LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level)) || (chOf(a.topic) - chOf(b.topic)));
  return {
    id: uid(), ts: Date.now(), title: o.title, seed: o.seed,
    topics: o.topics.slice(), subs: (o.subs || []).slice(), counts: Object.assign({}, o.counts),
    kind: o.kind === 'test' ? 'test' : 'practice',
    seedShift: o.kind === 'test' ? (Math.floor(Math.random() * 2000000000) + 1) : 0,
    /* กติกาคุมสอบติดไปกับตัวชุดโจทย์เสมอ ไม่ใช่ให้ไปอ่านค่าตั้งตอนเริ่มทำ
       เพราะรหัสใบงานที่แจกนักเรียนพาไปได้แค่สิ่งที่อยู่ในตัวชุดเท่านั้น */
    limitSec: o.kind === 'test' ? Math.round((DB.settings.examMin || 0) * 60) : 0,
    maxOut: o.kind === 'test' ? Math.round(DB.settings.examMaxOut || 0) : 0,
    maxOutSec: o.kind === 'test' ? Math.round(DB.settings.examMaxOutSec || 0) : 0,
    g: DB.settings.g, easyG10: !!DB.settings.easyG10,
    items: items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}

/* ── ใบตอบสำหรับข้อสอบกระดาษ ────────────────────────────────────────────
   ครูมีข้อสอบเป็นกระดาษหรือ PDF อยู่แล้ว แอปเก็บแค่จำนวนข้อกับเฉลย
   ไม่เก็บตัวโจทย์ ไม่แกะไฟล์ นักเรียนอ่านโจทย์จากกระดาษแล้วมาแตะตอบในแอป

   ตั้งใจให้เป็น "แบบทดสอบ" เสมอ เพราะใบตอบที่เฉลยทันทีระหว่างทำไม่มีประโยชน์
   และจะกลายเป็นให้นักเรียนไล่กดจนถูก                                      */
const PAPER_KEYS = 'กขคงจ';
function isPaper(q) { return !!(q && q.paper); }
/** โจทย์เทียม — มีแค่ตัวเลือกกับเฉลย ตัวตรวจคำตอบเดิมใช้ได้ทันที
    ตั้ง paper: true ไว้ให้ที่อื่นแยกออกว่าข้อนี้ไม่มีเนื้อโจทย์ให้แสดง */
function paperProblems(quiz) {
  const ch = clamp(Number(quiz.paper.ch) || 4, 2, 5);
  return quiz.items.map(function (it, i) {
    const key = Number(it.ans);
    const cs = [];
    for (let k = 0; k < ch; k++) cs.push({ text: PAPER_KEYS[k], correct: k === key });
    return {
      paper: true, theory: true, no: i + 1,
      topic: quiz.paper.topic == null ? null : Number(quiz.paper.topic),
      sub: 'ข้อสอบกระดาษ', level: 'ทฤษฎี', skills: [],
      stem: 'ข้อ ' + (i + 1) + ' ของข้อสอบที่ครูแจก', given: [], finds: [], choices: cs
    };
  });
}
/** แปลงข้อความเฉลยเป็นรายการเลขตัวเลือก — รับได้ทั้ง "1.ก 2.ข" และ "กขคงข"
    ตัวเลข จุด ช่องว่าง ขึ้นบรรทัดใหม่ ถูกมองข้ามหมด ครูจะได้พิมพ์แบบไหนก็ได้ */
function parsePaperKeys(text) {
  const out = [];
  String(text || '').split('').forEach(function (c) {
    const k = PAPER_KEYS.indexOf(c);
    if (k >= 0) out.push(k);
  });
  return out;
}

/* แคชโจทย์ที่สร้างแล้ว เพื่อไม่ต้องคำนวณซ้ำทุกครั้งที่วาดหน้าจอ */
const PCACHE = {};
/** seedShift ทำให้แบบทดสอบใช้แม่แบบและระดับความยากชุดเดิมเป๊ะ แต่ตัวเลขในโจทย์ต่างออกไป
    เก็บไว้ที่ตัวชุดโจทย์ ทุกที่ที่เรียก problemsOf() จึงได้โจทย์ชุดเดียวกันเสมอ
    ไม่มีทางที่หน้าทำข้อสอบกับตัวตรวจคำตอบจะใช้คนละเลข */
function problemsOf(quiz) {
  if (!quiz) return [];
  if (isPaper(quiz)) {
    const pk = 'paper:' + quiz.id;
    if (!PCACHE[pk]) PCACHE[pk] = paperProblems(quiz);
    return PCACHE[pk];
  }
  const sh = (quiz.seedShift || 0) >>> 0;
  const key = quiz.id + ':' + sh;
  if (PCACHE[key]) return PCACHE[key];
  const arr = quiz.items.map(it =>
    buildProblem(it.tplId, ((it.seed + sh) >>> 0), { g: quiz.g, easyG10: quiz.easyG10 }));
  PCACHE[key] = arr;
  return arr;
}
function quizMaxScore(quiz) { return quiz.items.length; }

/** สร้างแบบทดสอบจากแบบฝึกหัดชุดหนึ่ง — แม่แบบ/หัวข้อ/ระดับเหมือนเดิมทุกข้อ แต่ตัวเลขคนละชุด */
function makeTestFrom(quiz, title) {
  let sh = 0;
  // กันกรณีสุ่มได้ 0 พอดี ซึ่งจะทำให้ตัวเลขซ้ำกับแบบฝึกหัดเป๊ะ
  while (!sh) sh = Math.floor(Math.random() * 2000000000) + 1;
  return {
    id: uid(), ts: Date.now(),
    title: title || ('แบบทดสอบ — ' + (quiz.title || '')),
    kind: 'test', seedShift: sh, fromQuizId: quiz.id,
    seed: quiz.seed, topics: (quiz.topics || []).slice(), subs: (quiz.subs || []).slice(),
    counts: Object.assign({}, quiz.counts),
    g: quiz.g, easyG10: !!quiz.easyG10,
    items: quiz.items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}

/** รับใบงานตามรหัสแล้วเริ่มทำทันที */
async function takeAssignment(code) {
  try {
    const a = await api('assignGet', { code: code });
    const q = decodeQuiz(a.spec);
    if (!q) { toast('อ่านใบงานนี้ไม่ได้ — แจ้งครูให้มอบหมายใหม่', 'bad'); return; }

    DB.cur.quizId = q.id;
    save(true);
    startQuiz(q.id, a.code);
  } catch (e) { toast(e.message, 'bad'); }
}

function formulaHTML(topicId) {
  const t = topicOf(topicId), list = FORMULAS[topicId] || [];
  if (!list.length) return '<div class="hint">ยังไม่มีสรุปสูตรของบทนี้</div>';
  return '<div class="fxlist">' + list.map(f =>
    '<div class="fxrow"><div class="fxe">' + M(f.e) + '</div>' +
    (f.d ? '<div class="fxd">' + f.d + '</div>' : '') + '</div>').join('') +
    '</div><div class="hint" style="margin-top:10px">' +
    (t && t.exam ? 'หมวดนี้เป็น<b>เทคนิคการทำข้อสอบ</b> ใช้ควบคู่กับสูตรของบทที่ 1–7'
                 : 'ทบทวนสูตรให้แม่นก่อนลงมือทำโจทย์ จะช่วยให้เลือกสมการได้เร็วขึ้นมาก') + '</div>';
}

function showFormulas(topicId) {
  const t = topicOf(topicId);
  openModal({
    title: (t ? (t.icon || '') + ' สรุปสูตร ' + chLabel(t) + ' ' + t.name : 'สรุปสูตร'),
    bodyHTML: formulaHTML(topicId),
    buttons: [{ label: 'ปิด' },
              { label: 'ดูสรุปสูตรทุกบท', act: (close) => { close(); showAllFormulas(); } }]
  });
}

function showAllFormulas() {
  openModal({
    title: '📘 สรุปสูตรฟิสิกส์ทุกบท',
    bodyHTML: TOPICS.map(t =>
      '<div class="fxhead">' + (t.icon || '') + ' ' + chLabel(t) + ' &nbsp;' + esc(t.name) + '</div>' +
      formulaHTML(t.id)).join('<div style="height:14px"></div>'),
    buttons: [{ label: 'ปิด' },
              { label: 'พิมพ์ใบสรุปสูตร', cls: 'primary', act: (close) => { close(); printFormulas(); } }]
  });
}

/** สร้างใบสรุปสูตรลงพื้นที่พิมพ์ แล้วเปิดกล่องพิมพ์ของเครื่อง */
function printFormulas() {
  const hd = DB.settings.header || {};
  let h = '<div class="phead">' +
    (DB.settings.logo ? '<img class="plogo" src="' + DB.settings.logo + '" alt="">' : '') +
    '<div class="t1">' + esc(hd.school || '') + '</div>' +
    '<div class="t2">ใบสรุปสูตรฟิสิกส์ ระดับชั้นมัธยมศึกษาปีที่ 4</div>' +
    '<div class="t3">' + esc(hd.term || '') + (hd.teacher ? ' &nbsp;·&nbsp; ครูผู้สอน ' + esc(hd.teacher) : '') + '</div>' +
    '</div><hr class="prule">';
  TOPICS.forEach(t => {
    h += '<div class="pitem"><div class="fxhead">' + chLabel(t) + ' &nbsp;' + esc(t.name) + '</div>' +
      formulaHTML(t.id) + '</div>';
  });
  if (DB.settings.showCredit) {
    const a = DB.settings.about || {};
    h += '<div class="credit-print">พัฒนาโดย ' + esc(a.dev || '') +
      (a.dept ? ' &nbsp;·&nbsp; ' + esc(a.dept) : '') + '</div>';
  }
  $('#printarea').innerHTML = h;
  setTimeout(() => window.print(), 60);
}

/* --- 5.2ข ใบตอบจากข้อสอบกระดาษ ------------------------------------------
   ครูกรอกแค่จำนวนข้อกับเฉลย แล้วได้ใบตอบที่ตรวจอัตโนมัติ
   ระบบคุมสอบ จับเวลา ส่งขึ้นชีต และรายงานชั้นเรียน ใช้ของเดิมทั้งหมด      */

/** กล่องสร้างหรือแก้ใบตอบ — ส่ง quiz มาถ้าเป็นการแก้เฉลยของชุดเดิม */
function paperDialog(quiz) {
  const cur = quiz && quiz.paper ? quiz.paper : { ch: 4, topic: null };
  const keyNow = quiz ? quiz.items.map(x => PAPER_KEYS[Number(x.ans)] || '?').join('') : '';
  openModal({
    title: quiz ? ('แก้เฉลย "' + esc(quiz.title) + '"') : 'ใบตอบจากข้อสอบกระดาษ',
    bodyHTML:
      '<div class="hint" style="margin-bottom:11px">ใช้กับข้อสอบที่ครูมีอยู่แล้วเป็นกระดาษหรือ PDF ' +
      '<b>แอปไม่เก็บตัวโจทย์</b> เก็บแค่จำนวนข้อกับเฉลย นักเรียนอ่านโจทย์จากกระดาษที่ครูแจก ' +
      'หรือจากจอที่ครูฉาย แล้วมาแตะตอบในแอป<br>' +
      '<b>อย่าให้นักเรียนเปิดไฟล์ PDF เอง</b> เพราะระบบคุมสอบจะนับว่าออกจากแอปทุกครั้งที่พลิกดูโจทย์</div>' +
      '<label class="hint" for="ppTitle">ชื่อชุด</label>' +
      '<input type="text" id="ppTitle" style="width:100%" value="' +
      esc(quiz ? quiz.title : '') + '" placeholder="เช่น ข้อสอบกลางภาค ภาคเรียนที่ 1">' +
      '<div class="row" style="margin-top:11px">' +
      '<div><label class="hint" for="ppCh">ตัวเลือกต่อข้อ</label><br>' +
      '<select id="ppCh">' + [4, 5].map(n => '<option value="' + n + '"' +
        (Number(cur.ch) === n ? ' selected' : '') + '>' + n + ' ตัวเลือก (' +
        PAPER_KEYS.slice(0, n).split('').join(' ') + ')</option>').join('') + '</select></div>' +
      '<div class="grow"><label class="hint" for="ppTopic">นับเข้าบท (ไม่ระบุก็ได้)</label><br>' +
      '<select id="ppTopic" style="max-width:100%"><option value="">ไม่ระบุ — ไม่แจกแจงตามบท</option>' +
      TOPICS.map(t => '<option value="' + t.id + '"' +
        (cur.topic != null && Number(cur.topic) === t.id ? ' selected' : '') + '>' +
        esc(t.icon + ' ' + t.name) + '</option>').join('') + '</select></div></div>' +
      '<label class="hint" for="ppKeys" style="display:block;margin-top:11px">เฉลย</label>' +
      '<textarea id="ppKeys" style="width:100%;min-height:96px;font-size:16px" ' +
      'placeholder="พิมพ์แบบไหนก็ได้ เช่น  1.ก 2.ข 3.ค  หรือ  กขคงข">' + esc(keyNow) + '</textarea>' +
      '<div class="hint" id="ppCount" style="margin-top:6px">ตัวเลข จุด ช่องว่าง และการขึ้นบรรทัดใหม่ ' +
      'ถูกมองข้ามทั้งหมด จำนวนข้อนับจากตัวอักษรเฉลยที่กรอก</div>' +
      '<div id="ppMsg" style="margin-top:10px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: quiz ? 'บันทึกเฉลย' : 'สร้างใบตอบ', cls: 'primary', act: (close, root) => {
          const msg = $('#ppMsg', root);
          const title = ($('#ppTitle', root).value || '').trim();
          const ch = Number($('#ppCh', root).value) || 4;
          const tpv = $('#ppTopic', root).value;
          const keys = parsePaperKeys($('#ppKeys', root).value);
          if (!title) { msg.innerHTML = '<div class="notice bad">ตั้งชื่อชุดก่อน</div>'; return; }
          if (!keys.length) { msg.innerHTML = '<div class="notice bad">ยังไม่ได้กรอกเฉลย</div>'; return; }
          if (keys.length > 200) { msg.innerHTML = '<div class="notice bad">เกิน 200 ข้อ</div>'; return; }
          const over = keys.filter(k => k >= ch);
          if (over.length) {
            msg.innerHTML = '<div class="notice bad">มีเฉลยเป็น <b>' +
              esc(over.map(k => PAPER_KEYS[k]).join(' ')) + '</b> แต่ตั้งไว้ ' + ch +
              ' ตัวเลือก — เปลี่ยนจำนวนตัวเลือกหรือแก้เฉลยให้ตรงกัน</div>';
            return;
          }
          const items = keys.map(k => ({ paper: 1, ans: k }));
          const pp = { ch: ch, topic: tpv === '' ? null : Number(tpv) };
          if (quiz) {
            quiz.title = title; quiz.paper = pp; quiz.items = items;
            delete PCACHE['paper:' + quiz.id];
            save(true); close(); renderMake();
            toast('บันทึกเฉลย ' + items.length + ' ข้อแล้ว', 'ok');
            return;
          }
          const q = createPaperQuiz(title, pp, items);
          DB.quizzes.push(q);
          DB.cur.quizId = q.id;
          save(true); close(); renderMake();
          toast('สร้างใบตอบ ' + items.length + ' ข้อแล้ว — กดเริ่มทำหรือมอบหมายได้เลย', 'ok');
        } }
    ],
    onMount: root => {
      const box = $('#ppKeys', root), out = $('#ppCount', root);
      const show = () => {
        const n = parsePaperKeys(box.value).length;
        out.innerHTML = n ? 'อ่านเฉลยได้ <b>' + n + ' ข้อ</b>' :
          'ตัวเลข จุด ช่องว่าง และการขึ้นบรรทัดใหม่ ถูกมองข้ามทั้งหมด';
      };
      box.addEventListener('input', show);
      show(); box.focus();
    }
  });
}

/** ใบตอบเป็นแบบทดสอบเสมอ และประทับกติกาคุมสอบเหมือนชุดที่สุ่มจากแม่แบบ */
function createPaperQuiz(title, pp, items) {
  return {
    id: uid(), ts: Date.now(), title: title, seed: 0,
    topics: pp.topic == null ? [] : [pp.topic], subs: [], counts: {},
    kind: 'test', seedShift: 0, paper: pp,
    limitSec: Math.round((DB.settings.examMin || 0) * 60),
    maxOut: Math.round(DB.settings.examMaxOut || 0),
    maxOutSec: Math.round(DB.settings.examMaxOutSec || 0),
    g: DB.settings.g, easyG10: !!DB.settings.easyG10,
    items: items
  };
}

function presetTopics(scope) {
  if (Array.isArray(scope)) return scope.slice();
  if (scope === 'core') return TOPICS.filter(t => !t.exam).map(t => t.id);
  return ALL_TOPIC_IDS.slice();
}

function runPreset(key) {
  const ps = PRESETS.find(p => p.key === key);
  if (!ps) return;
  // ตรวจชื่อผู้เรียนก่อนสร้างชุด ไม่งั้นจะได้ชุดโจทย์ค้างไว้โดยที่ยังเริ่มทำไม่ได้
  if (needLearnerName()) return;
  const c = mkCfg();
  c.topics = presetTopics(ps.scope);
  c.subs = [];
  c.mode = 'mix';
  c.counts = Object.assign({}, ps.counts);
  c.kind = ps.kind;
  const title = ps.name.replace(/\s*\d+\s*ข้อ.*$/, '').trim() + ' — ' + thDate(Date.now());
  c.lastTitle = title;
  const q = createQuiz({
    title: title, topics: c.topics, subs: [], counts: c.counts, kind: ps.kind,
    seed: Math.floor(Math.random() * 2000000000) + 1
  });
  if (q.error) { toast(q.error, 'bad'); return; }
  DB.quizzes.push(q);
  DB.cur.quizId = q.id;
  save(true);
  toast('สร้าง' + ps.name + 'แล้ว — กดเริ่มทำได้เลย', 'ok');
  startQuiz(q.id);
}

        '<span class="lvdot ' + LEVEL_CLS[l] + '">' + l + ' ' +
        TPL.filter(x => x.topic === t.id && x.level === l).length + '</span>').join('') +
      '</span>' +
      '<span class="d">รวม ' + nTpl + ' แม่แบบ · ' + subs.length + ' หัวข้อย่อย</span></span></label>' +

      }).join('') + '</div>' +

    }

  });
  h += '</div></div>';

  h += '<div class="card"><h3>2. เลือกระดับและจำนวนข้อ</h3>' +
    '<div class="segbtn" style="max-width:520px;margin-bottom:12px">' +
    LEVELS.map(l => '<button data-mode="' + l + '"' + (c.mode === l ? ' class="on"' : '') + '>' + l + '</button>').join('') +
    '<button data-mode="mix"' + (c.mode === 'mix' ? ' class="on"' : '') + '>รวมระดับ</button></div>';
  if (c.mode === 'mix') {
    h += '<div class="row">' + LEVELS.map(l =>
      '<div class="row" style="gap:6px"><span class="tag ' + LEVEL_CLS[l] + '">' + l + '</span>' +
      '<input type="number" min="0" max="40" value="' + (c.counts[l] || 0) + '" data-count="' + l +
      '" style="width:78px" inputmode="numeric"> ข้อ</div>').join('') + '</div>';
  } else {
    h += '<div class="row"><label for="nq">จำนวนข้อ</label>' +
      '<input type="number" id="nq" min="1" max="40" value="' + c.n + '" style="width:90px" inputmode="numeric"></div>';
  }
  h += '<div class="hint" style="margin-top:9px">รวมทั้งหมด <b>' + total + '</b> ข้อ (สูงสุด 40 ข้อต่อชุด)</div></div>';

  h += '<div class="card"><h3>3. เลือกประเภทแล้วสุ่ม</h3>' +
    '<div class="gridcards" style="margin-bottom:12px">' +

        '<span><span class="t">' + QUIZ_KINDS[k].name + '</span><br><span class="d">' +
        (k === 'practice' ? 'ตรวจทีละข้อทันที เปิดดูวิธีทำ 7 ขั้นได้'
                          : 'ไม่มีเฉลย ไม่บอกถูกผิดจนกว่าจะส่ง แก้คำตอบได้ก่อนส่ง') +

    esc(c.lastTitle || '') + '">' +
    '<button class="primary" id="btnGen">สุ่ม' + QUIZ_KINDS[c.kind || 'practice'].name + '</button>' +
    '<button id="btnPaper">ใบตอบจากข้อสอบกระดาษ</button></div>' +
    '<div class="hint" style="margin-top:8px">โจทย์แต่ละชุดผูกกับเลขสุ่ม (seed) จึงสร้างชุดเดิมกลับมาได้เสมอ — ' +

    '<div class="row" style="margin-bottom:11px"><button class="sm" id="btnPasteQuiz">รับใบงานจากรหัสที่ครูให้มา</button>' +
    '<span class="hint">ครูกด <b>แชร์</b> ที่ชุดโจทย์เพื่อคัดลอกรหัส แล้วส่งให้นักเรียนมาวางที่ปุ่มนี้</span></div>';
  if (!DB.quizzes.length) {
    h += '<div class="hint">ยังไม่มีชุดโจทย์ — ตั้งค่าด้านบนแล้วกด <b>สุ่มชุดโจทย์</b></div>';
  } else {
    h += '<div class="tablewrap"><table><thead><tr><th>ชื่อชุด</th><th class="num">ข้อ</th>' +
      '<th>ระดับ</th><th>สร้างเมื่อ</th><th>ครั้งที่ทำ</th><th></th></tr></thead><tbody>';
    DB.quizzes.slice().reverse().forEach(q => {
      const nAt = DB.attempts.filter(a => a.quizId === q.id).length;
      const lv = LEVELS.filter(l => q.counts[l]).map(l =>
        '<span class="tag ' + LEVEL_CLS[l] + '">' + l + ' ' + q.counts[l] + '</span>').join(' ');
      h += '<tr><td>' + esc(q.title || '(ไม่มีชื่อ)') +
        ' <span class="tag ' + QUIZ_KINDS[quizKind(q)].cls + '">' + QUIZ_KINDS[quizKind(q)].short + '</span>' +
        (q.id === DB.cur.quizId ? ' <b>← ชุดปัจจุบัน</b>' : '') +
        (isPaper(q) ? ' <span class="tag t">ใบตอบกระดาษ</span>' : '') +
        '</td><td class="num">' + q.items.length + '</td><td>' + lv + '</td>' +
        '<td>' + thDateTime(q.ts) + '</td><td class="num">' + nAt + '</td>' +
        '<td><button class="sm primary" data-start="' + q.id + '">เริ่มทำ</button> ' +
        '<button class="sm" data-print="' + q.id + '">พิมพ์</button> ' +
        '<button class="sm" data-share="' + q.id + '">แชร์</button> ' +
        (isPaper(q) ? '<button class="sm" data-editkey="' + q.id + '">แก้เฉลย</button> ' : '') +
        (isTest(q) ? '' : '<button class="sm" data-mktest="' + q.id + '">สร้างแบบทดสอบ</button> ') +
        (isAdmin() ? '<button class="sm" data-publish="' + q.id + '">มอบหมาย</button> ' : '') +
        '<button class="sm danger" data-delq="' + q.id + '">ลบ</button></td></tr>';

  $('#btnAllFx').addEventListener('click', showAllFormulas);
  const setTopics = ids => { c.topics = ids; c.subs = []; save(); renderMake(); };
  $('#btnAllTopic').addEventListener('click', () => setTopics(ALL_TOPIC_IDS.slice()));
  $('#btnCoreTopic').addEventListener('click', () => setTopics(TOPICS.filter(t => !t.exam).map(t => t.id)));
  $('#btnEntTopic').addEventListener('click', () => setTopics(TOPICS.filter(t => t.exam).map(t => t.id)));

    const i = c.topics.indexOf(id);

      c.topics.splice(i, 1);
      c.subs = c.subs.filter(s => subsOf(id).indexOf(s) < 0);   // เอาหัวข้อย่อยของเรื่องที่ปิดออกด้วย
    } else c.topics.push(id);
    save(); renderMake();
  }));
  $$('[data-sub]').forEach(cb => cb.addEventListener('change', e => {
    const s = e.target.dataset.sub, i = c.subs.indexOf(s);
    if (i >= 0) c.subs.splice(i, 1); else c.subs.push(s);
    save(); renderMake();
  }));

    c.mode = b.dataset.mode; save(); renderMake();
  }));
  $$('[data-count]').forEach(inp => inp.addEventListener('change', e => {
    c.counts[e.target.dataset.count] = clamp(Math.round(Number(e.target.value) || 0), 0, 40);

  }));
  const nq = $('#nq');
  if (nq) nq.addEventListener('change', e => { c.n = clamp(Math.round(Number(e.target.value) || 1), 1, 40); save(); renderMake(); });
  $$('input[name=qk]').forEach(r => r.addEventListener('change', e => {
    c.kind = e.target.value; save(); renderMake();
  }));
  $('#btnGen').addEventListener('click', doGenerate);
  const bp = $('#btnPaper');
  if (bp) bp.addEventListener('click', () => paperDialog(null));
  $$('[data-mktest]').forEach(b => b.addEventListener('click', () => makeTestDialog(b.dataset.mktest)));
  if (isStudent()) bindMyAssignments();
  $$('[data-start]').forEach(b => b.addEventListener('click', () => startQuiz(b.dataset.start)));
  $$('[data-print]').forEach(b => b.addEventListener('click', () => { DB.cur.quizId = b.dataset.print; save(); setTab('print'); }));
  $$('[data-delq]').forEach(b => b.addEventListener('click', async () => {
    const q = DB.quizzes.find(x => x.id === b.dataset.delq);
    const n = DB.attempts.filter(a => a.quizId === q.id).length;
    const ok = await confirmBox('ลบชุดโจทย์', 'ลบ "' + esc(q.title) + '" ?' +
      (n ? '<br><b>จะลบผลการทำ ' + n + ' ครั้งที่ผูกกับชุดนี้ไปด้วย</b>' : ''), 'ลบ');
    if (!ok) return;
    DB.quizzes = DB.quizzes.filter(x => x.id !== q.id);
    DB.attempts = DB.attempts.filter(a => a.quizId !== q.id);
    if (DB.cur.quizId === q.id) { DB.cur.quizId = null; DB.cur.attemptId = null; }
    delete PCACHE[q.id];
    save(true); renderMake(); toast('ลบแล้ว');
  }));
  $$('[data-share]').forEach(b => b.addEventListener('click', () => shareQuiz(b.dataset.share)));
  $$('[data-editkey]').forEach(b => b.addEventListener('click', () =>
    paperDialog(DB.quizzes.find(x => x.id === b.dataset.editkey))));
  $$('[data-publish]').forEach(b => b.addEventListener('click', () => publishQuiz(b.dataset.publish)));
  $('#btnPasteQuiz').addEventListener('click', pasteQuiz);
}

/** แสดงรหัสใบงานให้ครูคัดลอกไปส่งนักเรียน */
function shareQuiz(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  const code = encodeQuiz(q);
  openModal({
    title: 'แชร์ใบงาน "' + (q.title || '') + '"',
    bodyHTML:
      '<div class="hint" style="margin-bottom:9px">ส่งรหัสนี้ให้นักเรียนทางไลน์กลุ่ม Google Classroom หรือช่องทางไหนก็ได้ ' +
      'นักเรียนกด <b>รับใบงานจากรหัสที่ครูให้มา</b> ในแท็บสร้างชุดโจทย์ แล้ววางรหัสลงไป<br>' +
      'จะได้โจทย์ <b>ตรงกันทุกตัวเลข</b> โดยไม่ต้องส่งไฟล์และไม่ต้องใช้อินเทอร์เน็ตหลังจากนั้น</div>' +
      '<textarea id="qShareBox" readonly style="width:100%;height:120px;font-family:ui-monospace,monospace;' +
      'font-size:12px;word-break:break-all">' + esc(code) + '</textarea>' +
      '<div class="hint" style="margin-top:7px">ความยาว ' + code.length + ' ตัวอักษร · ' +
      q.items.length + ' ข้อ · g = ' + fmtq(q.g) + ' m/s²</div>',
    buttons: [
      { label: 'ปิด' },
      { label: 'คัดลอกรหัส', cls: 'primary', act: async (close) => {
          const ok = await copyText(code);
          toast(ok ? 'คัดลอกรหัสใบงานแล้ว' : 'คัดลอกไม่สำเร็จ ให้เลือกข้อความในกล่องแล้วคัดลอกเอง', ok ? 'ok' : 'bad');
          if (ok) close();
        } }
    ],
    onMount: root => { const t = $('#qShareBox', root); if (t) { t.focus(); t.select(); } }
  });
}

/** นักเรียนวางรหัสที่ครูให้มา แล้วสร้างชุดโจทย์เดียวกันขึ้นในเครื่อง */
function pasteQuiz() {
  openModal({
    title: 'รับใบงานจากรหัส',
    bodyHTML:
      '<div class="hint" style="margin-bottom:9px">วางรหัสที่ครูส่งมาลงในกล่องด้านล่าง แล้วกด <b>รับใบงาน</b></div>' +
      '<textarea id="qPasteBox" placeholder="PHYSQ1:..." style="width:100%;height:120px;' +
      'font-family:ui-monospace,monospace;font-size:12px;word-break:break-all"></textarea>' +
      '<div id="qPasteMsg" style="margin-top:8px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'รับใบงาน', cls: 'primary', act: (close, root) => {
          const val = $('#qPasteBox', root).value;
          const q = decodeQuiz(val);
          const msg = $('#qPasteMsg', root);
          if (!q) {
            msg.innerHTML = '<div class="notice bad">อ่านรหัสนี้ไม่ได้ — ตรวจว่าคัดลอกมาครบทั้งหมด ' +
              'และไม่มีตัวอักษรตกหล่น</div>';
            return;
          }
          const had = DB.quizzes.find(x => x.id === q.id);
          if (had) {
            DB.cur.quizId = had.id; save(true); close(); renderMake();
            toast('มีใบงานชุดนี้อยู่แล้ว — เลือกให้เป็นชุดปัจจุบันแล้ว', 'ok');
            return;
          }
          DB.quizzes.push(q);
          DB.cur.quizId = q.id;
          save(true); close(); renderMake();
          toast('รับใบงาน "' + q.title + '" (' + q.items.length + ' ข้อ) เรียบร้อย', 'ok');
        } }
    ],
    onMount: root => { const t = $('#qPasteBox', root); if (t) t.focus(); }
  });
}

/** สร้างแบบทดสอบจากแบบฝึกหัดที่มีอยู่ — หัวข้อและระดับเหมือนเดิม แต่ตัวเลขคนละชุด */
function makeTestDialog(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  openModal({
    title: 'สร้างแบบทดสอบจาก "' + (q.title || '') + '"',
    bodyHTML:
      '<div class="hint" style="margin-bottom:10px">จะได้ชุดใหม่ที่ใช้<b>แม่แบบโจทย์ หัวข้อ และระดับความยากเดิมทุกข้อ</b> ' +
      'แต่<b>ตัวเลขในโจทย์ต่างออกไป</b> ทำแบบฝึกหัดมาก่อนแล้วก็ตอบข้อสอบทันทีไม่ได้<br>' +
      'ขณะทำจะไม่มีเฉลยและไม่บอกถูกผิด จนกว่าจะกดส่ง</div>' +
      '<label class="hint" for="mtTitle">ชื่อชุด</label>' +
      '<input type="text" id="mtTitle" style="width:100%" value="' +
