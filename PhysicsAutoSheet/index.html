      'ระบบบันทึกการออกจากแอปให้เสมอแม้ไม่ได้ตั้งโควตา<br>' +
      'จับได้เฉพาะการสลับแอปหรือล็อกจอ<b>บนเครื่องเดียวกัน</b> ' +
      'เปิดอีกเครื่องหรือแคปหน้าจอ ระบบไม่รู้ — ใช้เป็นหลักฐานประกอบ ไม่ใช่คำตัดสิน</div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'สร้างแบบทดสอบ', cls: 'primary', act: (close, root) => {
          const t = makeTestFrom(q, ($('#mtTitle', root).value || '').trim());
          // กติกาคุมสอบติดไปกับตัวชุดโจทย์ เครื่องนักเรียนจึงรู้กติกาจากรหัสใบงานได้เลย
          t.limitSec = clamp(Math.round(Number($('#mtMin', root).value) || 0), 0, 300) * 60;
          t.maxOut = clamp(Math.round(Number($('#mtOut', root).value) || 0), 0, 20);
          t.maxOutSec = Math.max(0, Math.round(DB.settings.examMaxOutSec || 0));
          DB.quizzes.push(t);
          DB.cur.quizId = t.id;
          save(true); close(); renderMake();
          toast('สร้างแบบทดสอบ ' + t.items.length + ' ข้อแล้ว — ตัวเลขต่างจากแบบฝึกหัด', 'ok');
        } }
    ]
  });
}

function doGenerate() {
  const c = mkCfg();
  if (!c.topics.length) { toast('เลือกอย่างน้อยหนึ่งเรื่องก่อน', 'bad'); return; }
  // ตรวจชื่อผู้เรียนก่อนสร้างชุด เหตุผลเดียวกับใน runPreset
  if (needLearnerName()) return;
  const counts = {};
  if (c.mode === 'mix') LEVELS.forEach(l => counts[l] = c.counts[l] || 0);
  else counts[c.mode] = c.n;
  const total = LEVELS.reduce((s, l) => s + (counts[l] || 0), 0);
  if (total < 1) { toast('ระบุจำนวนข้ออย่างน้อย 1 ข้อ', 'bad'); return; }
  if (total > 40) { toast('ชุดหนึ่งได้สูงสุด 40 ข้อ', 'bad'); return; }

  const kind = c.kind === 'test' ? 'test' : 'practice';
  const shortOf = t => { const x = TOPICS.find(v => v.id === t); return x ? x.short : ''; };
  const title = ($('#qtitle').value || '').trim() ||
    (QUIZ_KINDS[kind].name + ' ' + c.topics.map(shortOf).filter(Boolean).join(' + ') + ' ' + thDate(Date.now()));
  c.lastTitle = title;
  const q = createQuiz({
    title: title, topics: c.topics, subs: c.subs, counts: counts, kind: kind,
    seed: Math.floor(Math.random() * 2000000000) + 1
  });
  if (q.error) { toast(q.error, 'bad'); return; }
  DB.quizzes.push(q);
  DB.cur.quizId = q.id;
  save(true);
  toast('สร้าง' + QUIZ_KINDS[kind].name + ' ' + q.items.length + ' ข้อแล้ว', 'ok');
  renderMake();
}

/* --- 5.3 เริ่มทำแบบฝึกหัด ------------------------------------------------- */
function currentLearner() {
  if (DB.mode === 'solo') {
    const p = DB.profile;
    return { studentId: null, name: p.name || 'ผู้เรียน',
             no: String(p.no || ''), sid: String(p.sid || ''), room: String(p.room || '') };
  }
  const s = studentById(DB.cur.studentId);
  return s ? { studentId: s.id, name: s.name, no: String(s.no || ''), sid: String(s.sid || ''),
               room: (classById(s.classId) || {}).name || '' } : null;
}
/** ยังไม่ได้ใส่ชื่อผู้เรียน — บอกให้ชัดแล้วพาไปที่ช่องกรอกเลย
    เดิมแค่ขึ้นข้อความเตือนแวบเดียวแล้วเงียบ ผู้ใช้จึงเห็นเป็น "กดแล้วไม่มีอะไรเกิดขึ้น"
    เจอบ่อยเป็นพิเศษตอนเปิดวิชาใหม่ เพราะแต่ละวิชาเก็บชื่อแยกคนละที่ในเบราว์เซอร์
    ชื่อที่เคยกรอกไว้ในวิชาอื่นจึงไม่ตามมาให้ */
function needLearnerName() {
  if (DB.mode !== 'solo' || DB.profile.name.trim()) return false;
  toast('ใส่ชื่อผู้เรียนที่ช่องด้านบนก่อน แล้วจึงเริ่มทำได้', 'bad');
  const el = $('#soloName');
  if (el) {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.focus();
    el.style.borderColor = 'var(--bad)';
    el.style.background = 'var(--bad-bg)';
    setTimeout(() => { el.style.borderColor = ''; el.style.background = ''; }, 2600);
  }
  return true;
}

async function startQuiz(quizId, assignCode) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  const who = currentLearner();
  if (!who) { toast('เลือกผู้เรียนที่แถบบนก่อน (หรือเพิ่มรายชื่อในแท็บตั้งค่า)', 'bad'); return; }
  if (needLearnerName()) return;
  /* แจ้งนักเรียนก่อนเสมอว่าชุดนี้มีการคุมสอบ — ทั้งเรื่องความเป็นธรรม
     และเพราะการรู้ล่วงหน้านี่แหละคือสิ่งที่ทำให้ระบบได้ผลจริง */
  if (isTest(q) && (q.limitSec || q.maxOut || q.maxOutSec)) {
    const bits = [];
    if (q.limitSec) bits.push('• <b>จำกัดเวลา ' + Math.round(q.limitSec / 60) + ' นาที</b> ' +
      'นาฬิกาเดินต่อแม้จะออกจากแอปไปแล้ว');
    bits.push('• <b>ระบบบันทึกทุกครั้งที่ออกจากแอป</b> ทั้งจำนวนครั้งและเวลา และครูเห็นข้อมูลนี้');
    if (q.maxOut) bits.push('• ออกจากแอปได้ไม่เกิน <b>' + q.maxOut + ' ครั้ง</b> เกินกว่านั้นระบบจะส่งข้อสอบให้เอง');
    if (!await confirmBox('เริ่มทำแบบทดสอบ',
      'ชุดนี้เป็นแบบทดสอบที่มีการคุมสอบ<br>' + bits.join('<br>') +
      '<br><br>เริ่มแล้วนาฬิกาเดินทันที ต้องการเริ่มเลยหรือไม่?', 'เริ่มทำ')) return;
  }
  const a = {
    id: uid(), quizId: q.id, studentId: who.studentId, soloName: who.name,
    // ติดเลขที่/เลขประจำตัว/ชั้นไปกับผลด้วย เพื่อให้ครูจับคู่ได้แม่นตอนรวมไฟล์จากเครื่องนักเรียน
    no: who.no || '', sid: who.sid || '', room: who.room || '',
    assignCode: assignCode || null,   // ผูกกับใบงานบนชีต ถ้ามาจากการมอบหมาย
    startedAt: Date.now(), finishedAt: null,
    answers: q.items.map(() => ({ raw: [], pick: null, checked: false, score: 0, tries: 0, revealed: false, sec: 0 }))
  };
  procInit(a, q);          // ตั้งกติกาคุมสอบและ snapshot ไว้กับครั้งนี้
  DB.attempts.push(a);
  DB.cur.quizId = q.id; DB.cur.attemptId = a.id; DB.cur.i = 0;
  QT.i = -1;
  save(true);
  setTab('do');
}

/* --- 5.4 แท็บทำแบบฝึกหัด -------------------------------------------------- */
const QT = { i: -1, t0: 0 };   // จับเวลาต่อข้อ
function stampTime() {
  const a = curAttempt();
  if (a && QT.i >= 0 && a.answers[QT.i]) a.answers[QT.i].sec += (Date.now() - QT.t0) / 1000;
  QT.i = -1;
}

/* --- 5.4ก คุมสอบ: จับการออกจากแอป และนาฬิกาสอบ ---------------------------
   ใช้กับชุด kind='test' เท่านั้น · เก็บทุกอย่างไว้กับ attempt จึงรีเฟรชแล้วไม่หาย
   และผสานไฟล์สำรองจากเครื่องนักเรียนแล้วยังครบ

   ใช้ visibilitychange กับ pagehide เท่านั้น ไม่ใช้ window.blur
   เพราะบนไอแพดแค่แป้นพิมพ์เด้งขึ้นหรือเปิดกล่องโมดัลก็ยิง blur แล้ว
   ถ้าใช้ตัวนั้นจะนับเกินจนตัวเลขใช้อ้างอิงอะไรไม่ได้เลย

   สิ่งที่ระบบนี้ทำไม่ได้ (ต้องบอกครูให้ชัด) — จับได้เฉพาะบนเครื่องเดียวกัน
   เปิดมือถืออีกเครื่อง แคปหน้าจอ หรือเพื่อนบอก จับไม่ได้ทั้งสิ้น
   -------------------------------------------------------------------------- */
const PROC_MIN_SEC = 1.5;     // ออกไปสั้นกว่านี้ไม่นับ (แถบแจ้งเตือน · สลับพลาด)
const PROC_MAX_EVENTS = 200;  // กันข้อมูลบวมเมื่อมีคนสลับแอปรัว ๆ

/** ตั้งกติกาคุมสอบให้ครั้งที่เพิ่งเริ่ม — snapshot ไว้กับ attempt เลย
    ครูเปลี่ยนค่าตั้งกลางคันแล้วต้องไม่กระทบคนที่กำลังสอบอยู่ */
function procInit(a, q) {
  if (!isTest(q)) return;
  const s = DB.settings;
  a.limitSec  = Math.round((q.limitSec  != null ? q.limitSec  : (s.examMin || 0) * 60) || 0);
  a.maxOut    = Math.round((q.maxOut    != null ? q.maxOut    : s.examMaxOut || 0) || 0);
  a.maxOutSec = Math.round((q.maxOutSec != null ? q.maxOutSec : s.examMaxOutSec || 0) || 0);
  a.proc = { nOut: 0, secOut: 0, openAt: 0, events: [], autoBy: '' };
}
/** ครั้งที่กำลังทำอยู่และอยู่ในโหมดคุมสอบเท่านั้น นอกนั้นคืน null */
function procCur() {
  const a = curAttempt();
  if (!a || a.finishedAt || !a.proc) return null;
  return a;
}
/** ออกจากแอป — บันทึกทันที เพราะเครื่องอาจดับตอนนี้พอดี */
function procLeave() {
  const a = procCur(); if (!a) return;
  if (a.proc.openAt) return;              // ออกซ้อนกัน ไม่เปิดเหตุการณ์ใหม่
  a.proc.openAt = Date.now();
  a.proc.openQi = DB.cur.i;               // จำไว้ว่าออกตอนกำลังทำข้อไหน
  save(true);
}
/** กลับเข้าแอป — คืนจำนวนวินาทีที่หายไป หรือ null ถ้าสั้นเกินกว่าจะนับ */
function procReturn() {
  const a = procCur(); if (!a) return null;
  const t0 = a.proc.openAt;
  if (!t0) return null;
  a.proc.openAt = 0;
  const sec = (Date.now() - t0) / 1000;
  if (sec < PROC_MIN_SEC) { save(true); return null; }
  a.proc.nOut++;
  a.proc.secOut += sec;
  a.proc.events.push({ at: t0, sec: Math.round(sec), qi: a.proc.openQi });
  if (a.proc.events.length > PROC_MAX_EVENTS) a.proc.events.shift();
  save(true);
  return sec;
}
/** เกินโควตาแล้วหรือยัง — คืนข้อความเหตุผล หรือ '' ถ้ายังไม่เกิน */
function procOverQuota(a) {
  if (!a || !a.proc) return '';
  if (a.maxOut && a.proc.nOut > a.maxOut)
    return 'ออกจากแอป ' + a.proc.nOut + ' ครั้ง เกินที่กำหนดไว้ ' + a.maxOut + ' ครั้ง';
  if (a.maxOutSec && a.proc.secOut > a.maxOutSec)
    return 'อยู่นอกแอปรวม ' + mmss(a.proc.secOut) + ' นาที เกินที่กำหนดไว้ ' + mmss(a.maxOutSec);
  return '';
}
/** ไทม์ไลน์การออกจากแอป — ออกตอนนาทีที่เท่าไรของการสอบ ขณะทำข้อไหน และนานเท่าไร
    ยอดรวมบอกแค่ว่าออกกี่ครั้ง แต่ไทม์ไลน์บอกรูปแบบ ซึ่งครูใช้ตัดสินได้จริงกว่ามาก
    เช่น ออกรัวตอนใกล้หมดเวลา กับ ออกครั้งเดียวตอนต้นชั่วโมง ความหมายคนละเรื่อง */
function procTimeline(a) {
  if (!a || !a.proc || !a.proc.events || !a.proc.events.length) return '';
  return a.proc.events.map(function (e, k) {
    const at = Math.max(0, (e.at - a.startedAt) / 1000);
    return (k + 1) + ') นาทีที่ ' + mmss(at) +
      (e.qi != null ? ' ขณะทำข้อ ' + (e.qi + 1) : '') + ' นาน ' + mmss(e.sec);
  }).join('  ·  ');
}
/** วินาทีที่เหลือของนาฬิกาสอบ — null = ชุดนี้ไม่จำกัดเวลา
    คิดจากเวลาเริ่มเสมอ ห้ามนับถอยหลังด้วยตัวแปรในหน่วยความจำ
    ไม่งั้นรีเฟรชหน้าทีเดียวได้เวลาคืนฟรี */
function procSecLeft(a) {
  if (!a || !a.limitSec) return null;
  return Math.max(0, a.limitSec - (Date.now() - a.startedAt) / 1000);
}
/** กลับเข้าแอปแล้วเตือนให้เห็นเต็ม ๆ — เตือนทุกครั้ง ไม่ใช่แค่ครั้งแรก */
function procBack() {
  const sec = procReturn();
  if (sec == null) return;
  const a = procCur(); if (!a) return;
  const why = procOverQuota(a);
  if (why) { doFinish('ออกจากแอปเกินกำหนด'); return; }
  const quota = [];
  if (a.maxOut) quota.push('ออกได้อีก <b>' + Math.max(0, a.maxOut - a.proc.nOut) + ' ครั้ง</b>');
  if (a.maxOutSec) quota.push('เหลือเวลานอกแอปอีก <b>' + mmss(Math.max(0, a.maxOutSec - a.proc.secOut)) + '</b>');
  openModal({
    title: 'ระบบบันทึกว่าคุณออกจากแอป',
    bodyHTML: '<div class="notice warn">ครั้งนี้ออกไป <b>' + mmss(sec) + '</b> นาที<br>' +
      'รวมทั้งหมด <b>' + a.proc.nOut + ' ครั้ง</b> เป็นเวลา <b>' + mmss(a.proc.secOut) + '</b> นาที</div>' +
      (quota.length ? '<div class="hint" style="margin-top:9px">' + quota.join(' · ') +
        ' — เกินกว่านี้ระบบจะส่งข้อสอบให้อัตโนมัติ</div>' : '') +
      '<div class="hint" style="margin-top:9px">ข้อมูลนี้จะแสดงในผลสอบที่ครูเห็น</div>',
    buttons: [{ label: 'รับทราบ กลับไปทำต่อ', cls: 'primary' }]
  });
  renderDo();
}
/** เดินทุกวินาที — มีตัวเดียวในแอป เริ่มตอนบูตแล้วตรวจเงื่อนไขเอง
    (ห้ามเปิด-ปิดตามการวาดหน้าจอ เดี๋ยวหลุดค้างซ้อนกันหลายตัว) */
function procTick() {
  const a = procCur(); if (!a) return;
  const left = procSecLeft(a);
  if (left == null) return;
  const el = $('#examClock');
  if (el) {
    el.textContent = mmss(left);
    el.className = 'tag ' + (left <= 60 ? 'l3' : left <= 300 ? 'l2' : 't');
  }
  /* เตือนล่วงหน้าเมื่อเหลือ 5 นาที และ 1 นาที
     ป้ายนาฬิกาเปลี่ยนสีอย่างเดียวไม่พอ เพราะนักเรียนที่กำลังก้มเขียนไม่ได้มองจอ
     ติดธงไว้กับ attempt เพื่อไม่ให้เตือนซ้ำทุกวินาที และรีเฟรชหน้าแล้วไม่เตือนใหม่
     เตือนเฉพาะชุดที่เวลายาวพอ ไม่งั้นชุดสั้น ๆ จะเด้งเตือนตั้งแต่วินาทีแรก */
  if (a.limitSec > 330 && left <= 300 && left > 60 && !a.proc.warn5) {
    a.proc.warn5 = 1; save(true);
    toast('เหลือเวลาอีก 5 นาที', 'warn');
  }
  if (a.limitSec > 90 && left <= 60 && left > 0 && !a.proc.warn1) {
    a.proc.warn1 = 1; save(true);
    toast('เหลือเวลาอีก 1 นาที — ตรวจคำตอบแล้วกดส่งได้เลย', 'warn');
  }
  if (left <= 0) doFinish('หมดเวลา');
}
function gotoQ(i) {
  const a = curAttempt(); if (!a) return;
  stampTime();
  DB.cur.i = clamp(i, 0, a.answers.length - 1);
  QT.i = DB.cur.i; QT.t0 = Date.now();
  save(); renderDo();
}

function renderDo() {
  const a = curAttempt(), q = curQuiz();
  if (!a || !q || a.quizId !== q.id) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ยังไม่ได้เริ่มทำแบบฝึกหัด</h3>' +
      '<div class="hint">ไปที่แท็บ <b>สร้างชุดโจทย์</b> เพื่อสร้างชุดใหม่ หรือเลือกชุดที่มีอยู่แล้วกด <b>เริ่มทำ</b></div>' +
      '<div class="row" style="margin-top:10px"><button class="primary" id="goMake">ไปสร้างชุดโจทย์</button></div></div>';
    const b = $('#goMake'); if (b) b.addEventListener('click', () => setTab('make'));
    return;
  }
  if (a.finishedAt) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ทำชุดนี้เสร็จแล้ว</h3>' +
      '<div class="hint">ชุด "' + esc(q.title) + '" ทำเสร็จเมื่อ ' + thDateTime(a.finishedAt) + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="primary" id="goRes">ดูผลและการวิเคราะห์</button>' +
      '<button id="goMake2">สร้าง / เลือกชุดใหม่</button></div></div>';
    $('#goRes').addEventListener('click', () => setTab('result'));
    $('#goMake2').addEventListener('click', () => setTab('make'));
    return;
  }

  const probs = problemsOf(q);
  const i = clamp(DB.cur.i, 0, probs.length - 1);
  const p = probs[i], it = a.answers[i];
  if (QT.i !== i) { QT.i = i; QT.t0 = Date.now(); }

  const done = a.answers.filter(x => x.checked).length;
  const gotScore = a.answers.reduce((s, x) => s + x.score, 0);
  const T = isTest(q);          // แบบทดสอบ: ไม่บอกถูกผิดและไม่มีเฉลยระหว่างทำ

  let h = '<div class="card noprint"><div class="row">' +
    '<div class="grow"><b>' + esc(q.title) + '</b> ' +
    '<span class="tag ' + QUIZ_KINDS[quizKind(q)].cls + '">' + QUIZ_KINDS[quizKind(q)].name + '</span>' +
    '<div class="hint">ผู้ทำ: ' + esc(attemptWho(a)) +
    ' · ข้อ ' + (i + 1) + ' จาก ' + probs.length +
    (T ? ' · ตอบแล้ว ' + done + ' ข้อ'
       : ' · ตรวจแล้ว ' + done + ' ข้อ · ได้ ' + fmt(gotScore) + ' คะแนน') +
    (T && a.limitSec ? ' · เหลือเวลา <span class="tag t" id="examClock">' + mmss(procSecLeft(a)) + '</span>' : '') +
    (T && a.proc && a.proc.nOut ? ' · <span class="tag l3">ออกจากแอป ' + a.proc.nOut + ' ครั้ง</span>' : '') +
    '</div></div>' +
    '<button class="sm" id="btnFinish">ส่งคำตอบ / จบชุดนี้</button></div>' +
    '<div class="bar" style="margin-top:9px"><i style="width:' + Math.round(done / probs.length * 100) + '%"></i></div>' +
    '<div class="qnav" style="margin-top:11px">' +
    a.answers.map((x, k) => {
      let cls = '';
      // ระหว่างทำข้อสอบ แสดงแค่ว่าตอบแล้วหรือยัง ไม่บอกว่าถูกหรือผิด
      if (x.checked) cls = T ? 'half' : (x.score >= 1 ? 'ok' : (x.score > 0 ? 'half' : 'bad'));
      if (k === i) cls += ' cur';
      return '<button class="' + cls + '" data-go="' + k + '">' + (k + 1) + '</button>';
    }).join('') + '</div>' +
    (T ? '<div class="hint" style="margin-top:9px">โหมดแบบทดสอบ — ไม่แสดงเฉลยและไม่บอกถูกผิดระหว่างทำ ' +
         'กลับไปแก้คำตอบข้อไหนก็ได้ก่อนกดส่ง</div>' : '') +
    (T && (a.limitSec || a.maxOut || a.maxOutSec)
      ? '<div class="notice warn" style="margin-top:9px">ชุดนี้มีการคุมสอบ — ' +
        '<b>ระบบบันทึกทุกครั้งที่ออกจากแอป</b>' +
        (a.limitSec ? ' · นาฬิกาเดินต่อแม้ออกจากแอปไปแล้ว' : '') +
        (a.maxOut ? ' · ออกได้ไม่เกิน ' + a.maxOut + ' ครั้ง เกินกว่านั้นระบบจะส่งให้เอง' : '') +
        '</div>' : '') + '</div>';

  // ใบงานที่มาจากไฟล์รุ่นใหม่กว่าอาจอ้างแม่แบบที่เครื่องนี้ยังไม่มี (เช่น บทที่เพิ่มภายหลัง)
  // กรณีนี้สร้างโจทย์ไม่ได้ ต้องบอกให้ชัดว่าให้ไปโหลดไฟล์รุ่นใหม่ ไม่ใช่ปล่อยให้จอว่าง
  if (!p) {
    h += '<div class="card"><div class="notice bad"><b>เปิดข้อนี้ไม่ได้</b><br>' +
      'ข้อนี้ใช้โจทย์จากบทที่ไฟล์รุ่นนี้ยังไม่มี — แปลว่าครูสร้างใบงานด้วยโปรแกรมรุ่นใหม่กว่า</div>' +
      '<div class="hint">วิธีแก้: <b>รีเฟรชหน้านี้</b> (ดึงลงบนไอแพด) เพื่อโหลดโปรแกรมรุ่นล่าสุด ' +
      'ถ้ายังไม่หาย ให้แจ้งครูว่าต้องอัปโหลดไฟล์รุ่นใหม่ขึ้นเว็บก่อน</div>' +
      '<div class="row" style="margin-top:11px">' +
      '<button class="primary" onclick="location.reload(true)">รีเฟรชโปรแกรม</button>' +
      '<button id="skipBad">ข้ามไปข้อถัดไป</button></div></div>';
    $('#pane-do').innerHTML = h;
    $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
    $('#btnFinish').addEventListener('click', finishAttempt);
    const sb = $('#skipBad');
    if (sb) sb.addEventListener('click', () => gotoQ(Math.min(i + 1, probs.length - 1)));
    return;
  }

  /* ใบตอบแสดงทุกข้อในหน้าเดียว ไม่ใช่ทีละข้อ
     เพราะนักเรียนอ่านโจทย์จากกระดาษ การบังคับกดเปลี่ยนหน้าทีละข้อมีแต่ทำให้ช้า */
  if (isPaper(q)) {
    h += '<div class="card"><h3>ใบตอบ<span class="sub">ข้อสอบอยู่บนกระดาษ ' +
      'อ่านโจทย์จากข้อสอบที่ครูแจก แล้วแตะตัวเลือกที่นี่</span></h3>' +
      '<div class="hint" style="margin-bottom:11px">แตะซ้ำที่ตัวเลือกเดิม = ยกเลิกคำตอบข้อนั้น · ' +
      'ตอบแล้ว <b>' + done + '</b> จาก ' + probs.length + ' ข้อ</div>' +
      '<div class="papersheet">' +
      probs.map(function (pp, k) {
        const x = a.answers[k];
        return '<div class="paperrow"><span class="pno">' + (k + 1) + '</span>' +
          pp.choices.map(function (c, ci) {
            return '<button class="pbub' + (x.pick === ci ? ' sel' : '') +
              '" data-pk="' + k + '" data-pc="' + ci + '">' + PAPER_KEYS[ci] + '</button>';
          }).join('') + '</div>';
      }).join('') + '</div></div>';
    h += '</div>';
    $('#pane-do').innerHTML = h;
    $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
    $('#btnFinish').addEventListener('click', finishAttempt);
    $$('[data-pk]').forEach(b => b.addEventListener('click', () =>
      setPaperAnswer(Number(b.dataset.pk), Number(b.dataset.pc))));
    return;
  }

  h += '<div class="card">' + problemHead(p, i + 1) + problemBody(p);

  // --- ช่องตอบ ---
  h += '<div class="ansbox">';
  if (p.choices) {
    h += '<div style="margin-bottom:9px"><b>เลือกคำตอบที่ถูกต้อง</b> ' +
      (p.theory ? '<span class="hint">(ข้อสอบเชิงแนวคิด ไม่ต้องคำนวณ)</span>'
                : '<span class="hint">(' + esc(p.finds[0].d) + ' หน่วย ' + esc(p.finds[0].unit || '—') + ')</span>') +
      '</div><div class="choices' + (p.theory ? ' txt' : '') + '">';
    p.choices.forEach((ch, k) => {
      let cls = 'choice';
      if (it.pick === k) cls += ' sel';
      if (it.checked && !T) { if (ch.correct) cls += ' ok'; else if (it.pick === k) cls += ' bad'; }
      h += '<button class="' + cls + '" data-pick="' + k + '"' + (it.checked && !T ? ' disabled' : '') + '>' +
        '<span class="k">' + 'กขคง'[k] + '.</span><span>' +
        (p.theory ? ch.text : M(fmt(ch.value) + (p.finds[0].unit ? ' `' + p.finds[0].unit + '`' : ''))) +
        '</span></button>';
    });
    h += '</div>';
  } else {
    h += '<div style="margin-bottom:9px"><b>กรอกคำตอบเป็นตัวเลข</b> ' +
      '<span class="hint">(ไม่ต้องพิมพ์หน่วย · ยอมคลาดเคลื่อนได้ ±' + fmt(DB.settings.tolPct) + '%)</span></div>';
    p.finds.forEach((f, k) => {
      const okc = (it.checked && !T) ? (checkNum(parseNum(it.raw[k]), f.value) ? ' ok' : ' bad') : '';
      h += '<div class="ansrow"><label class="lab" for="in' + k + '">' + M(f.s) + ' <span class="hint">' + esc(f.d) + '</span></label>' +
        '<input type="text" inputmode="decimal" class="numin' + okc + '" id="in' + k + '" data-in="' + k + '" value="' +
        esc(it.raw[k] == null ? '' : it.raw[k]) + '"' + (it.checked && !T ? ' disabled' : '') + '>' +
        '<span class="unit">' + esc(f.unit || '') + '</span></div>';
    });
  }
  if (T) {
    h += '<div class="row" style="margin-top:11px"><button class="primary" id="btnCheck">' +
      (it.checked ? 'บันทึกคำตอบใหม่' : 'บันทึกคำตอบ') + '</button>' +
      (it.checked ? '<span class="hint" style="color:var(--ok)">บันทึกคำตอบข้อนี้แล้ว — แก้ได้จนกว่าจะกดส่ง</span>'
                  : '<span class="hint">ยังไม่ได้บันทึกคำตอบข้อนี้</span>') + '</div>';
  } else if (it.checked) {
    const full = it.score >= 1, part = it.score > 0 && it.score < 1;
    h += '<div class="verdict ' + (full ? 'ok' : 'bad') + '">' +
      (full ? '✓ ถูกต้อง' : part ? '◑ ถูกบางส่วน — ได้ ' + fmt(it.score) + ' คะแนน' : '✗ ยังไม่ถูก') +
      '</div><div class="hint">คำตอบที่ถูกคือ ' +
      p.finds.map(f => M(f.s + ' = ' + fmtq(f.value) + (f.unit ? ' `' + f.unit + '`' : ''))).join(' , ') + '</div>';
    h += '<div class="row" style="margin-top:10px"><button class="sm" id="btnRetry">ลองทำใหม่ (ไม่นับคะแนน)</button></div>';
  } else {
    h += '<div class="row" style="margin-top:11px"><button class="primary" id="btnCheck">ตรวจคำตอบ</button>' +
      '<button id="btnReveal">ยังไม่รู้ ขอดูวิธีทำ</button></div>';
  }
  h += '</div>';

  // --- วิธีทำ (แบบทดสอบไม่แสดง) ---
  if (!T && (it.checked || it.revealed)) {
    h += '<h3 style="margin:16px 0 6px">วิธีทำอย่างละเอียด</h3>' +
      '<div class="hint" style="margin-bottom:8px">แตะหัวข้อแต่ละขั้นเพื่อเปิด-ปิด</div>' + solutionHTML(p, false);
  }

  h += '<div class="row" style="margin-top:14px">' +
    '<button id="btnPrev"' + (i === 0 ? ' disabled' : '') + '>← ข้อก่อนหน้า</button>' +
    '<button id="btnNext"' + (i === probs.length - 1 ? ' disabled' : '') + '>ข้อถัดไป →</button>' +
    '<div class="grow"></div><span class="hint">ใช้เวลาข้อนี้ไปแล้ว ' + mmss(it.sec) + '</span></div>';
  h += '</div>';

  $('#pane-do').innerHTML = h;

  // --- ผูกเหตุการณ์ ---
  $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
  $('#btnPrev').addEventListener('click', () => gotoQ(i - 1));
  $('#btnNext').addEventListener('click', () => gotoQ(i + 1));
  $('#btnFinish').addEventListener('click', finishAttempt);
  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    it.pick = Number(b.dataset.pick); save(); renderDo();
  }));
  $$('[data-in]').forEach(inp => {
    inp.addEventListener('input', e => { it.raw[Number(e.target.dataset.in)] = e.target.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkCurrent(); } });
  });
  const bc = $('#btnCheck'); if (bc) bc.addEventListener('click', checkCurrent);
  const br = $('#btnReveal'); if (br) br.addEventListener('click', () => {
    it.revealed = true; save(); renderDo();
    toast('เปิดวิธีทำแล้ว — ข้อนี้ยังตรวจคำตอบได้ตามปกติ');
  });
  const bt = $('#btnRetry'); if (bt) bt.addEventListener('click', () => {
    it.checked = false; it.raw = []; it.pick = null; save(); renderDo();
  });
  bindSolutionToggle($('#pane-do'));
  const first = $('.numin:not([disabled])');
  if (first && (T || !it.checked)) first.focus();
}

/** บันทึกคำตอบหนึ่งข้อบนใบตอบ — แตะซ้ำที่เดิมคือยกเลิกคำตอบ
    ให้คะแนนทันทีเหมือน checkCurrent เพื่อให้ทุกอย่างหลังจากนี้ทำงานเหมือนชุดปกติ
    ใบตอบเป็นแบบทดสอบเสมอ จึงไม่มีการล็อกคะแนนที่การตรวจครั้งแรก */
function setPaperAnswer(k, ci) {
  const a = curAttempt(), q = curQuiz(); if (!a || !q) return;
  const p = problemsOf(q)[k], it = a.answers[k]; if (!p || !it) return;
  // นับเวลาให้ข้อที่เพิ่งแตะ และบอกระบบคุมสอบว่ากำลังทำข้อไหนอยู่
  stampTime(); DB.cur.i = k; QT.i = k; QT.t0 = Date.now();
  if (it.pick === ci) { it.pick = null; it.checked = false; it.score = 0; }
  else { it.pick = ci; it.checked = true; it.tries++; it.score = p.choices[ci].correct ? 1 : 0; }
  save(true);
  renderDo();
  // ส่งความคืบหน้าขึ้นชีตเป็นระยะ — ไอแพดแบตหมดกลางคันก็ไม่เสียของ
  if (isStudent() && a.assignCode && DB.settings.autoDraft) {
    const n = a.answers.filter(x => x.checked).length;
    if (n % 5 === 0) sendAttempt(a, 'draft');
  }
}

/** ตรวจข้อปัจจุบัน — คะแนนจะถูกล็อกไว้ที่การตรวจครั้งแรกเพื่อให้สถิติสะท้อนความจริง */
function checkCurrent() {
  const a = curAttempt(), q = curQuiz(); if (!a || !q) return;
  const i = DB.cur.i, p = problemsOf(q)[i], it = a.answers[i];
  if (!p) { toast('ข้อนี้เปิดไม่ได้ในโปรแกรมรุ่นนี้ — ให้รีเฟรชหน้าเพื่อโหลดรุ่นล่าสุด', 'bad'); return; }
  const T = isTest(q);
  if (it.checked && !T) return;      // แบบทดสอบแก้คำตอบซ้ำได้จนกว่าจะส่ง
  let score = 0;
  if (p.choices) {
    if (it.pick == null) { toast('เลือกคำตอบก่อน', 'bad'); return; }
    score = p.choices[it.pick].correct ? 1 : 0;
  } else {
    let blank = 0, hit = 0;
    p.finds.forEach((f, k) => {
      const v = parseNum(it.raw[k]);
      if (v == null) blank++;
      else if (checkNum(v, f.value)) hit++;
    });
    if (blank === p.finds.length) { toast('กรอกคำตอบก่อน', 'bad'); return; }
    score = hit / p.finds.length;
  }
  it.checked = true; it.tries++;
  // แบบฝึกหัดล็อกคะแนนที่การตรวจครั้งแรก · แบบทดสอบใช้คำตอบล่าสุดที่บันทึกไว้
  if (T || it.tries === 1) it.score = score;
  stampTime(); QT.i = i; QT.t0 = Date.now();
  save(true);
  renderDo();
  if (T) toast('บันทึกคำตอบข้อ ' + (i + 1) + ' แล้ว', 'ok');
  else toast(score >= 1 ? 'ถูกต้อง!' : score > 0 ? 'ถูกบางส่วน' : 'ยังไม่ถูก ลองดูวิธีทำ',
             score >= 1 ? 'ok' : score > 0 ? '' : 'bad');

  // ส่งความคืบหน้าขึ้นชีตทุก 3 ข้อ — ไอแพดแบตหมดกลางคันก็ไม่เสียของ
  if (isStudent() && a.assignCode && DB.settings.autoDraft) {
    const n = a.answers.filter(x => x.checked).length;
    if (n % 3 === 0) sendAttempt(a, 'draft');
  }
}

async function finishAttempt() {
  const a = curAttempt(); if (!a) return;
  const q0 = curQuiz();
  const left = a.answers.filter(x => !x.checked).length;
  if (left) {
    const ok = await confirmBox('ส่งคำตอบ', 'ยังเหลืออีก <b>' + left + ' ข้อ</b>ที่ยังไม่ได้' +
      (isTest(q0) ? 'บันทึกคำตอบ' : 'ตรวจ') + ' ข้อที่ไม่ได้ทำจะได้ 0 คะแนน ต้องการส่งเลยหรือไม่?', 'ส่งเลย');
    if (!ok) return;
  } else if (isTest(q0)) {
    // ข้อสอบส่งแล้วแก้ไม่ได้ ต้องยืนยันก่อนเสมอ
    if (!await confirmBox('ส่งแบบทดสอบ',
      'ตอบครบทุกข้อแล้ว — <b>ส่งแล้วจะแก้คำตอบไม่ได้อีก</b><br>ต้องการส่งเลยหรือไม่?', 'ส่งเลย')) return;
  }
  doFinish('');
}

/** ปิดชุดจริง ๆ — why ว่าง = นักเรียนกดส่งเอง · มีข้อความ = ระบบส่งให้อัตโนมัติ
    ทั้งสองทางต้องผ่านฟังก์ชันนี้ตัวเดียว ไม่งั้นผลของการส่งอัตโนมัติจะไม่ขึ้นชีต
    แล้วกว่าครูจะรู้ก็สอบไปแล้ว */
async function doFinish(why) {
  const a = curAttempt();
  if (!a || a.finishedAt) return;   // กันส่งซ้ำเมื่อนาฬิกากับโควตายิงพร้อมกัน
  if (why && a.proc) a.proc.autoBy = why;
  if (a.proc && a.proc.openAt) procReturn();
  stampTime();
  a.finishedAt = Date.now();
  save(true);                       // บันทึกก่อนทำอย่างอื่นเสมอ คำตอบห้ามหาย
  setTab('result');
  if (why) toast('ระบบส่งข้อสอบให้อัตโนมัติ — ' + why, 'warn');

  if (isStudent() && a.assignCode) {
    toast('กำลังส่งผลให้ครู…');
    const ok = await sendAttempt(a, 'final');
    if (ok) { MYA.list = null; toast('ส่งผลให้ครูเรียบร้อยแล้ว', 'ok'); }
    else toast('ส่งไม่สำเร็จ — เก็บไว้ในคิวแล้ว จะส่งให้เองเมื่อต่อเน็ตได้', 'warn');
    renderResult();
  }
}

/* ============================================================================
   6) การวิเคราะห์ผู้เรียนและสถิติ
   ========================================================================== */

function mean(a) { return a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0; }
function median(a) {
  if (!a.length) return 0;
  const b = a.slice().sort((x, y) => x - y), n = b.length;
  return n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2;
}
function stdev(a) {
  if (a.length < 2) return 0;
  const m = mean(a);
  return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1));
}
function pctCls(p) { return p >= 80 ? 'ok' : p >= 60 ? '' : p >= 40 ? 'warn' : 'bad'; }

/** วิเคราะห์ผลการทำหนึ่งครั้ง แยกตามเรื่อง ระดับ และทักษะ */
function analyze(a) {
  const q = quizOf(a);
  const probs = problemsOf(q);
  const res = {
    quiz: q, n: probs.length, got: 0, max: probs.length, pct: 0,
    byTopic: {}, byLevel: {}, bySkill: {}, bySub: {},
    sec: 0, revealed: 0, items: [],
    nOut: (a.proc && a.proc.nOut) || 0, secOut: (a.proc && a.proc.secOut) || 0,
    autoBy: (a.proc && a.proc.autoBy) || ''
  };
  const add = (bag, key, sc) => {
    if (!bag[key]) bag[key] = { got: 0, max: 0 };
    bag[key].got += sc; bag[key].max += 1;
  };
  probs.forEach((p, i) => {
    const it = a.answers[i] || { score: 0, sec: 0, revealed: false };
    const sc = it.score || 0;
    res.got += sc; res.sec += it.sec || 0;
    if (it.revealed) res.revealed++;
    // ข้อที่สร้างไม่ได้ (ใบงานอ้างแม่แบบที่ไฟล์รุ่นนี้ยังไม่มี) — นับคะแนนแต่ไม่แจกแจงตามเรื่อง
    if (!p) { res.items.push({ i: i, p: null, it: it, score: sc }); return; }
    /* ข้อสอบกระดาษไม่มีหัวข้อย่อย ระดับ หรือทักษะให้แจกแจง
       ถ้าครูระบุบทไว้ตอนสร้าง ก็แจกแจงตามบทได้อย่างเดียว */
    if (p.paper) {
      if (p.topic != null) add(res.byTopic, p.topic, sc);
      res.items.push({ i: i, p: p, it: it, score: sc });
      return;
    }
    add(res.byTopic, p.topic, sc);
    add(res.byLevel, p.level, sc);
    add(res.bySub, p.sub, sc);
    (p.skills || []).forEach(sk => add(res.bySkill, sk, sc));
    res.items.push({ i: i, p: p, it: it, score: sc });
  });
  res.pct = res.max ? res.got / res.max * 100 : 0;
  Object.values(res.byTopic).concat(Object.values(res.byLevel), Object.values(res.bySkill), Object.values(res.bySub))
    .forEach(o => o.pct = o.max ? o.got / o.max * 100 : 0);
  return res;
}

/** รวมผลหลายครั้งของผู้เรียนคนเดียว ใช้ทำ "สรุปผลการเรียนสะสม" */
function analyzeMany(list) {
  const acc = { n: 0, got: 0, max: 0, byTopic: {}, byLevel: {}, bySkill: {}, bySub: {}, sec: 0 };
  const merge = (dst, src) => {
    Object.keys(src).forEach(k => {
      if (!dst[k]) dst[k] = { got: 0, max: 0 };
      dst[k].got += src[k].got; dst[k].max += src[k].max;
    });
  };
  list.forEach(a => {
    const r = analyze(a);
    acc.n++; acc.got += r.got; acc.max += r.max; acc.sec += r.sec;
    merge(acc.byTopic, r.byTopic); merge(acc.byLevel, r.byLevel);
    merge(acc.bySkill, r.bySkill); merge(acc.bySub, r.bySub);
  });
  acc.pct = acc.max ? acc.got / acc.max * 100 : 0;
  [acc.byTopic, acc.byLevel, acc.bySkill, acc.bySub].forEach(b =>
    Object.values(b).forEach(o => o.pct = o.max ? o.got / o.max * 100 : 0));
  return acc;
}

/** แถบเปอร์เซ็นต์แบบ HTML — พิมพ์ออกกระดาษได้ */
function barRows(bag, labelFn) {
  const keys = Object.keys(bag);
  if (!keys.length) return '<div class="hint">— ไม่มีข้อมูล —</div>';
  keys.sort((a, b) => bag[a].pct - bag[b].pct);
  return '<div>' + keys.map(k => {
    const o = bag[k];
    return '<div style="margin-bottom:9px"><div class="row" style="gap:6px;margin-bottom:3px">' +
      '<span class="grow">' + (labelFn ? labelFn(k) : esc(k)) + '</span>' +
      '<span style="font-variant-numeric:tabular-nums">' + fmt(o.got) + '/' + o.max + ' = <b>' + Math.round(o.pct) + '%</b></span></div>' +
      '<div class="bar ' + pctCls(o.pct) + '"><i style="width:' + Math.max(1, Math.round(o.pct)) + '%"></i></div></div>';
  }).join('') + '</div>';
}

/** ข้อเสนอแนะอัตโนมัติจากผลการวิเคราะห์ */
function advice(res) {
  const out = [];
  const pass = DB.settings.passPct;
  if (res.pct >= 80) out.push({ k: 'ok', t: 'ทำได้ดีมาก (' + Math.round(res.pct) + '%) เข้าใจเนื้อหาในระดับที่นำไปต่อยอดได้ ควรลองเพิ่มสัดส่วนโจทย์ระดับยากในชุดถัดไป' });
  else if (res.pct >= pass) out.push({ k: 'ok', t: 'ผ่านเกณฑ์ (' + Math.round(res.pct) + '% จากเกณฑ์ ' + pass + '%) พื้นฐานใช้ได้ แต่ยังมีจุดที่ควรเก็บให้แน่นตามรายการด้านล่าง' });
  else out.push({ k: 'bad', t: 'ยังไม่ผ่านเกณฑ์ (' + Math.round(res.pct) + '% จากเกณฑ์ ' + pass + '%) ควรทบทวนหัวข้อที่ระบุด้านล่างแล้วทำชุดโจทย์ระดับง่ายซ้ำก่อน' });

  const weakSkill = Object.keys(res.bySkill).filter(k => res.bySkill[k].max >= 2 && res.bySkill[k].pct < 50);
  weakSkill.sort((a, b) => res.bySkill[a].pct - res.bySkill[b].pct);
  weakSkill.slice(0, 4).forEach(sk =>
    out.push({ k: 'bad', t: 'ทักษะ "<b>' + esc(sk) + '</b>" ทำได้ ' + Math.round(res.bySkill[sk].pct) + '% — เป็นจุดที่ควรทบทวนก่อนเรื่องอื่น' }));

  const weakSub = Object.keys(res.bySub).filter(k => res.bySub[k].max >= 1 && res.bySub[k].pct < 50);
  if (weakSub.length) out.push({ k: 'warn', t: 'หัวข้อที่ควรกลับไปทบทวน: <b>' + weakSub.map(esc).join(', ') + '</b>' });

  const strong = Object.keys(res.bySkill).filter(k => res.bySkill[k].max >= 2 && res.bySkill[k].pct >= 80);
  if (strong.length) out.push({ k: 'ok', t: 'จุดแข็ง: <b>' + strong.slice(0, 5).map(esc).join(', ') + '</b>' });

  LEVELS.forEach(l => {
    const o = res.byLevel[l];
    if (o && o.max >= 2 && o.pct < 40)
      out.push({ k: 'warn', t: 'โจทย์ระดับ<b>' + l + '</b>ทำได้เพียง ' + Math.round(o.pct) + '% — ' +
        (l === 'ง่าย' ? 'ควรกลับไปทบทวนนิยามและสูตรพื้นฐานก่อน'
         : l === 'ปานกลาง' ? 'ควรฝึกการเลือกสมการให้ตรงกับสิ่งที่โจทย์ให้และสิ่งที่ถาม'
         : 'ควรฝึกโจทย์ที่ต้องแบ่งเป็นหลายขั้นตอนและตั้งระบบสมการ') });
  });

  if (res.revealed >= Math.ceil(res.n / 2))
    out.push({ k: 'warn', t: 'เปิดดูวิธีทำก่อนตอบไป ' + res.revealed + ' จาก ' + res.n + ' ข้อ — ' +
      'ครั้งหน้าลองเขียนสิ่งที่โจทย์กำหนดและเลือกสมการด้วยตัวเองก่อน แล้วค่อยเปิดเฉลยเทียบ' });

  const avg = res.n ? res.sec / res.n : 0;
  if (avg > 180) out.push({ k: 'warn', t: 'ใช้เวลาเฉลี่ยข้อละ ' + mmss(avg) + ' ซึ่งค่อนข้างนาน — ควรฝึกจนคุ้นกับการเลือกสมการให้เร็วขึ้น' });
  else if (avg > 0 && avg < 25 && res.pct < pass)
    out.push({ k: 'warn', t: 'ใช้เวลาเฉลี่ยเพียงข้อละ ' + mmss(avg) + ' และคะแนนยังไม่ผ่าน — ลองอ่านโจทย์ให้ละเอียดและเขียนสิ่งที่กำหนดให้ครบก่อนคำนวณ' });
  return out;
}

/* --- 6.1 แท็บผลและวิเคราะห์ ----------------------------------------------- */
function learnerAttempts() {
  const list = DB.attempts.filter(a => a.finishedAt);
  if (DB.mode === 'solo') return list.filter(a => !a.studentId);
  return list.filter(a => a.studentId === DB.cur.studentId);
}

    '<div class="statgrid">' +
    '<div class="stat"><div class="v">' + fmt(res.got) + ' / ' + res.max + '</div><div class="k">คะแนนที่ได้</div></div>' +
    '<div class="stat"><div class="v">' + Math.round(res.pct) + '%</div><div class="k">คิดเป็นร้อยละ</div></div>' +
    '<div class="stat"><div class="v">' + (res.pct >= DB.settings.passPct ? 'ผ่าน' : 'ไม่ผ่าน') +

    '<div class="stat"><div class="v">' + mmss(res.sec) + '</div><div class="k">เวลาที่ใช้ทั้งหมด</div></div>' +
    '<div class="stat"><div class="v">' + mmss(res.n ? res.sec / res.n : 0) + '</div><div class="k">เฉลี่ยต่อข้อ</div></div>' +
    '<div class="stat"><div class="v">' + res.revealed + '</div><div class="k">ข้อที่เปิดดูวิธีทำ</div></div>' +
    (res.nOut ? '<div class="stat"><div class="v" style="color:var(--bad)">' + res.nOut +
      '</div><div class="k">ออกจากแอป (รวม ' + mmss(res.secOut) + ')</div></div>' : '') +
    '</div>' +
    (res.autoBy ? '<div class="notice warn" style="margin-top:11px">ระบบส่งข้อสอบชุดนี้ให้อัตโนมัติ — ' +

    '</div>';

  h += '<div class="card"><h3>ผลแยกตามเรื่อง</h3>' +
    barRows(res.byTopic, k => esc(topicName(Number(k)))) + '</div>';
  h += '<div class="card"><h3>ผลแยกตามระดับความยาก</h3>' +

  h += '<div class="card"><h3>ผลแยกตามหัวข้อย่อย</h3>' + barRows(res.bySub) + '</div>';

    '<th class="num">เวลา</th>' + (showSol ? '<th>เปิดเฉลย</th><th></th>' : '') + '</tr></thead><tbody>';
  res.items.forEach(x => {

    if (x.p.paper) {
      // ใบตอบไม่มีหัวข้อย่อยและระดับ แต่บอกได้ว่าตอบอะไรไป และเฉลยคืออะไร
      const picked = x.it.pick == null ? '—' : PAPER_KEYS[x.it.pick];
      const key = (x.p.choices.findIndex(c => c.correct) + 1) || 0;
      const tpp = TOPICS.find(t => t.id === x.p.topic);
      h += '<tr><td class="num">' + (x.i + 1) + '</td><td>' + esc(tpp ? tpp.short : '—') + '</td>' +
        '<td>ตอบ ' + esc(picked) + (showSol && key ? ' · เฉลย ' + PAPER_KEYS[key - 1] : '') + '</td>' +
        '<td>—</td><td>' + mark + '</td><td class="num">' + mmss(x.it.sec) + '</td>' +
        (showSol ? '<td>—</td><td></td>' : '') + '</tr>';

    h += '<tr><td class="num">' + (x.i + 1) + '</td><td>' + esc(tp ? tp.short : '—') + '</td>' +

  h += '<div class="card"><h3>สรุปผลการเรียนสะสม<span class="sub">รวม ' + all.n + ' ครั้ง · ' +

  if (trend.length >= 2) {

    '<div class="grow" style="min-width:250px"><b>แยกตามระดับ</b>' +
      barRows(all.byLevel, k => '<span class="tag ' + LEVEL_CLS[k] + '">' + k + '</span>') + '</div></div>' +
    '<div style="margin-top:10px"><b>ทักษะที่ควรพัฒนามากที่สุด</b>' +
    (function () {
      const w = Object.keys(all.bySkill).filter(k => all.bySkill[k].max >= 3).sort((x, y) => all.bySkill[x].pct - all.bySkill[y].pct).slice(0, 5);
      if (!w.length) return '<div class="hint">ทำแบบฝึกหัดเพิ่มอีกสักหน่อยเพื่อให้ข้อมูลมากพอสำหรับสรุป</div>';
      const bag = {}; w.forEach(k => bag[k] = all.bySkill[k]);
      return barRows(bag);
    })() + '</div></div>';

  $('#pane-result').innerHTML = h;
  $('#selAt').addEventListener('change', e => { DB.cur.showAttemptId = e.target.value; save(); renderResult(); });
  $('#btnEvid').addEventListener('click', () => { DB.cur.printKind = 'evidence'; save(); setTab('print'); });
  $$('[data-sol]').forEach(b => b.addEventListener('click', () => {
    const x = res.items[Number(b.dataset.sol)];
    if (!x || !x.p) { toast('ข้อนี้เปิดไม่ได้ในโปรแกรมรุ่นนี้', 'bad'); return; }
    const m = openModal({
      title: 'ข้อ ' + (x.i + 1), wide: true,

        x.p.finds.map(f => M(f.s + ' = ' + fmtq(f.value) + (f.unit ? ' `' + f.unit + '`' : ''))).join(' , ') + '</div>' +
        solutionHTML(x.p, true)
    });
    bindSolutionToggle(m.root);
  }));
}

/** กราฟเส้นเล็ก ๆ แสดงแนวโน้มคะแนน */
function sparkline(pcts) {
  const W = 420, H = 90, ox = 30, oy = 72, w = W - ox - 14, h = 56;
  const n = pcts.length;
  const px = i => ox + (n === 1 ? w / 2 : w * i / (n - 1));
  const py = v => oy - h * (v / 100);
  let s = '';
  [0, 50, 100].forEach(v => {
    s += '<line class="dash" x1="' + ox + '" y1="' + n1(py(v)) + '" x2="' + (ox + w) + '" y2="' + n1(py(v)) + '"/>';
    s += svgTxt(ox - 5, py(v) + 4, v + '%', 'end', true);
  });
  s += '<polyline class="frc" points="' + pcts.map((v, i) => n1(px(i)) + ',' + n1(py(v))).join(' ') + '"/>';
  pcts.forEach((v, i) => { s += '<circle class="arh" cx="' + n1(px(i)) + '" cy="' + n1(py(v)) + '" r="3.5"/>'; });
  return svgWrap(W, H, s);
}

function renderStats() {
  const quizzes = DB.quizzes.filter(q => DB.attempts.some(a => a.quizId === q.id && a.finishedAt));
  if (!quizzes.length) {
    $('#pane-stats').innerHTML = '<div class="card"><h3>ยังไม่มีข้อมูลสถิติ</h3>' +
      '<div class="hint">ต้องมีผู้เรียนทำชุดโจทย์จนจบอย่างน้อยหนึ่งคนก่อน สถิติจึงจะแสดงที่นี่<br>' +
      'ในโหมดครู ให้สลับผู้เรียนที่แถบบนแล้วให้แต่ละคนทำชุดเดียวกัน ระบบจะเปรียบเทียบผลให้อัตโนมัติ</div></div>' +
      cloudPullCardHTML() + importCardHTML();
    bindCloudPullCard(); bindImportCard();
    return;
  }
  if (!DB.cur.statQuizId || !quizzes.some(q => q.id === DB.cur.statQuizId)) DB.cur.statQuizId = quizzes[quizzes.length - 1].id;
  const q = quizzes.find(x => x.id === DB.cur.statQuizId);
  const probs = problemsOf(q);

  // เอาผลครั้งล่าสุดของแต่ละคน (คนเดิมทำซ้ำได้ แต่ให้นับครั้งล่าสุด)
  const byWho = {};
  DB.attempts.filter(a => a.quizId === q.id && a.finishedAt).forEach(a => {
    const key = a.studentId || ('solo:' + (a.soloName || ''));
    if (!byWho[key] || a.finishedAt > byWho[key].finishedAt) byWho[key] = a;
  });
  const rows = Object.values(byWho).map(a => ({ a: a, r: analyze(a) }))
    .sort((x, y) => y.r.pct - x.r.pct);
  const pcts = rows.map(x => x.r.pct);

  let h = '<div class="card noprint"><div class="row"><label for="selQz">ชุดโจทย์</label>' +
    '<select id="selQz" class="grow" style="max-width:520px">' +
    quizzes.map(x => '<option value="' + x.id + '"' + (x.id === q.id ? ' selected' : '') + '>' +
      esc(x.title) + ' (' + x.items.length + ' ข้อ)</option>').join('') + '</select>' +
    '<button class="sm" id="btnStatPrint">พิมพ์รายงาน</button></div></div>';

  h += '<div class="card"><h3>ภาพรวมชั้นเรียน<span class="sub">' + esc(q.title) + '</span></h3><div class="statgrid">' +
    '<div class="stat"><div class="v">' + rows.length + '</div><div class="k">จำนวนผู้ทำ</div></div>' +
    '<div class="stat"><div class="v">' + fmt(mean(pcts), 1) + '%</div><div class="k">ค่าเฉลี่ย</div></div>' +
    '<div class="stat"><div class="v">' + fmt(median(pcts), 1) + '%</div><div class="k">มัธยฐาน</div></div>' +
    '<div class="stat"><div class="v">' + fmt(stdev(pcts), 1) + '</div><div class="k">ส่วนเบี่ยงเบนมาตรฐาน</div></div>' +
    '<div class="stat"><div class="v">' + fmt(Math.max.apply(null, pcts), 0) + '%</div><div class="k">สูงสุด</div></div>' +
    '<div class="stat"><div class="v">' + fmt(Math.min.apply(null, pcts), 0) + '%</div><div class="k">ต่ำสุด</div></div>' +
    '<div class="stat"><div class="v">' + rows.filter(x => x.r.pct >= DB.settings.passPct).length + '</div>' +
      '<div class="k">ผ่านเกณฑ์ ' + DB.settings.passPct + '%</div></div>' +
    '</div>';
  h += '<div style="margin-top:14px"><b>การกระจายของคะแนน</b>' + histogram(pcts) + '</div></div>';

  const showId = DB.mode === 'class';
  h += '<div class="card"><h3>ผลรายคน<span class="sub">เรียงตามคะแนน</span></h3><div class="tablewrap"><table><thead><tr>' +
    '<th class="num">อันดับ</th>' + (showId ? '<th class="num">เลขที่</th><th class="num">เลขประจำตัว</th>' : '') +
    '<th>ชื่อ</th><th class="num">คะแนน</th><th class="num">ร้อยละ</th>' +
    '<th>ผล</th><th class="num">เวลา</th>' +
    // คอลัมน์นี้ขึ้นเฉพาะเมื่อมีคนในชุดนี้ถูกคุมสอบจริง ไม่งั้นตารางจะรกขึ้นมาเปล่า ๆ
    (rows.some(x => x.r.nOut || x.r.autoBy) ? '<th class="num">ออกจากแอป</th>' : '') +
    '<th>จุดที่ต้องพัฒนา</th></tr></thead><tbody>';
  rows.forEach((x, k) => {
    const weak = Object.keys(x.r.bySub).filter(s => x.r.bySub[s].pct < 50);
    const wi = whoInfo(x.a);
    h += '<tr><td class="num">' + (k + 1) + '</td>' +
      (showId ? '<td class="num">' + esc(wi.no || '—') + '</td><td class="num">' + esc(wi.sid || '—') + '</td>' : '') +
      '<td>' + esc(wi.name) + '</td>' +
      '<td class="num">' + fmt(x.r.got) + '/' + x.r.max + '</td>' +
      '<td class="num">' + Math.round(x.r.pct) + '%</td>' +
      '<td>' + (x.r.pct >= DB.settings.passPct ? '<span style="color:var(--ok)">ผ่าน</span>'
        : '<span style="color:var(--bad)">ไม่ผ่าน</span>') + '</td>' +
      '<td class="num">' + mmss(x.r.sec) + '</td>' +
      (rows.some(y => y.r.nOut || y.r.autoBy)
        ? '<td class="num">' + (x.r.nOut ? '<b>' + x.r.nOut + '</b> (' + mmss(x.r.secOut) + ')' : '—') +
          (x.r.autoBy ? ' ⚠' : '') + '</td>' : '') +
      '<td style="white-space:normal">' + (weak.length ? esc(weak.join(', ')) : '—') + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  // วิเคราะห์รายข้อ
  h += '<div class="card"><h3>วิเคราะห์รายข้อ<span class="sub">ค่าความยาก (p) และอำนาจจำแนก (r)</span></h3>' +
    '<div class="hint" style="margin-bottom:9px">' +
    '<b>p</b> = สัดส่วนผู้ตอบถูก · ยิ่งใกล้ 1 ยิ่งง่าย (เหมาะสมประมาณ 0.20–0.80)<br>' +
    '<b>r</b> = ผลต่างระหว่างกลุ่มเก่ง 27% บนกับกลุ่มอ่อน 27% ล่าง · ยิ่งสูงยิ่งจำแนกคนเก่ง-อ่อนได้ดี (ควร ≥ 0.20)' +
    (rows.length < 6 ? '<br><b>หมายเหตุ:</b> มีผู้ทำเพียง ' + rows.length + ' คน ค่า r ยังเชื่อถือได้ไม่มาก ควรมีอย่างน้อย 6–10 คน' : '') +
    '</div><div class="tablewrap"><table><thead><tr><th class="num">ข้อ</th><th>หัวข้อ</th><th>ระดับ</th>' +
    '<th class="num">ตอบถูก</th><th class="num">p</th><th class="num">r</th><th>ตีความ</th></tr></thead><tbody>';
  const nG = Math.max(1, Math.round(rows.length * 0.27));
  const hi = rows.slice(0, nG), lo = rows.slice(-nG);
  probs.forEach((p, i) => {
    if (!p) {
      h += '<tr><td class="num">' + (i + 1) + '</td>' +
        '<td colspan="6" class="hint">ข้อนี้ใช้โจทย์จากบทที่โปรแกรมรุ่นนี้ยังไม่มี — อัปเดตไฟล์แล้วดูใหม่</td></tr>';
      return;
    }
    const sc = rows.map(x => (x.a.answers[i] || {}).score || 0);
    const pv = mean(sc);
    const rv = rows.length >= 2 ? mean(hi.map(x => (x.a.answers[i] || {}).score || 0)) - mean(lo.map(x => (x.a.answers[i] || {}).score || 0)) : 0;
    let note = [];
    if (pv < 0.2) note.push('ยากมาก ทั้งห้องพลาด');
    else if (pv > 0.85) note.push('ง่ายมาก');
    else note.push('ความยากเหมาะสม');
    if (rows.length >= 6) { if (rv < 0.2) note.push('จำแนกได้น้อย ควรทบทวนตัวโจทย์'); else note.push('จำแนกได้ดี'); }
    h += '<tr><td class="num">' + (i + 1) + '</td><td>' + esc(p.sub) + '</td>' +
      '<td><span class="tag ' + LEVEL_CLS[p.level] + '">' + p.level + '</span></td>' +
      '<td class="num">' + fmt(sc.reduce((s, v) => s + v, 0)) + '/' + rows.length + '</td>' +
      '<td class="num">' + fmt(pv, 2) + '</td><td class="num">' + fmt(rv, 2) + '</td>' +
      '<td style="white-space:normal">' + esc(note.join(' · ')) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  // ข้อที่พลาดบ่อย
  const missed = probs.map((p, i) => ({ p: p, i: i, pv: mean(rows.map(x => (x.a.answers[i] || {}).score || 0)) }))
    .filter(x => x.p && x.pv < 0.5).sort((a, b) => a.pv - b.pv);
  h += '<div class="card"><h3>ประเด็นที่ควรสอนซ่อมเสริม</h3>';
  if (!missed.length) h += '<div class="notice info">ไม่มีข้อใดที่ทั้งห้องทำได้ต่ำกว่าครึ่ง — ภาพรวมเข้าใจดี</div>';
  else {
    const subs = {};
    missed.forEach(x => { subs[x.p.sub] = (subs[x.p.sub] || 0) + 1; });
    h += '<div class="notice warn">หัวข้อที่ทั้งห้องทำได้ต่ำกว่า 50%: <b>' +
      Object.keys(subs).map(s => esc(s) + ' (' + subs[s] + ' ข้อ)').join(', ') + '</b></div>';
    h += '<ul style="margin:8px 0 0;padding-left:20px">' + missed.slice(0, 8).map(x =>
      '<li>ข้อ ' + (x.i + 1) + ' — ' + esc(x.p.sub) + ' (' + x.p.level + ') ตอบถูก ' + Math.round(x.pv * 100) + '%' +
      (x.p.skills.length ? ' · ทักษะ: ' + esc(x.p.skills.join(', ')) : '') + '</li>').join('') + '</ul>';
  }
  const need = rows.filter(x => x.r.pct < DB.settings.passPct);
  if (need.length) h += '<div class="notice bad" style="margin-top:10px">ผู้เรียนที่ควรได้รับการช่วยเหลือ (' +
    need.length + ' คน): <b>' + need.map(x => esc(attemptWho(x.a))).join(', ') + '</b></div>';
  h += '</div>';

  // ส่งออกคะแนนไปยังโปรแกรมบันทึกคะแนน
  const done = rows.length;
  const total = (DB.mode === 'class' && DB.cur.classId)
    ? DB.students.filter(s => s.classId === DB.cur.classId).length : done;
  h += '<div class="card noprint"><h3>ส่งออกคะแนน<span class="sub">' + esc(q.title) + '</span></h3>' +
    '<div class="hint" style="margin-bottom:11px">คัดลอกคะแนนเป็นคอลัมน์เดียวเรียงตามเลขที่ ' +
    'แล้วไปวางในช่องแรกของคอลัมน์คะแนนใน <b>gradebook.html</b> ได้ทันที' +
    (total > done ? '<br><span style="color:var(--warn)">ยังมี ' + (total - done) +
      ' คนที่ไม่ได้ทำ — แถวของคนเหล่านั้นจะเว้นว่างไว้ ตำแหน่งแถวจึงยังตรงกับสมุดคะแนน</span>' : '') +
    '</div><div class="row"><button class="primary" id="btnCopyScore">คัดลอกคอลัมน์คะแนน</button>' +
    '<button id="btnCsvScore">ดาวน์โหลด CSV แบบเต็ม</button></div></div>';

  h += cloudPullCardHTML() + importCardHTML();

  $('#pane-stats').innerHTML = h;
  $('#selQz').addEventListener('change', e => { DB.cur.statQuizId = e.target.value; save(); renderStats(); });
  $('#btnStatPrint').addEventListener('click', () => { DB.cur.printKind = 'classreport'; save(); setTab('print'); });
  $('#btnCopyScore').addEventListener('click', () => exportScoreColumn(q.id));
  $('#btnCsvScore').addEventListener('click', () => exportScoreCsv(q.id));
  bindCloudPullCard(); bindImportCard();
}

/** ฮิสโทแกรมการกระจายคะแนนเป็นช่วงละ 10% */
function histogram(pcts) {
  const bins = new Array(10).fill(0);
  pcts.forEach(p => bins[clamp(Math.floor(p / 10), 0, 9)]++);
  const maxB = Math.max(1, Math.max.apply(null, bins));
  const W = 440, H = 170, ox = 34, oy = 128, w = W - ox - 12, h = 100;
  const bw = w / 10;
  let s = '';
  s += '<line class="ln2" x1="' + ox + '" y1="' + oy + '" x2="' + (ox + w) + '" y2="' + oy + '"/>';
  s += '<line class="ln2" x1="' + ox + '" y1="' + oy + '" x2="' + ox + '" y2="' + (oy - h) + '"/>';
  bins.forEach((n, i) => {
    const bh = h * n / maxB;
    s += '<rect class="bdy" x="' + n1(ox + i * bw + 2) + '" y="' + n1(oy - bh) + '" width="' + n1(bw - 4) +
      '" height="' + n1(bh) + '" rx="2"/>';
    if (n) s += svgTxt(ox + i * bw + bw / 2, oy - bh - 4, String(n), 'middle');
    if (i % 2 === 0) s += svgTxt(ox + i * bw, oy + 15, String(i * 10), 'middle', true);
  });
  s += svgTxt(ox + w, oy + 15, '100', 'middle', true);
  s += svgTxt(ox + w / 2, oy + 32, 'ช่วงคะแนน (ร้อยละ)', 'middle', true);
  s += svgTxt(ox - 6, oy - h + 4, 'คน', 'end', true);
  return svgWrap(W, H, s);
}

function renderSetting() {
  // นักเรียนตั้งค่าได้ 4 อย่างเท่านั้น เรียงตามนี้
  if (isStudent()) {
    $('#pane-setting').innerHTML =
      cloudCardHTML() +        // 1. เชื่อมต่อ Google Sheet (เปลี่ยนรหัสผ่าน)
      workLinesCardHTML() +    // 2. กรอบเขียนวิธีทำในใบงาน
      constCardHTML() +        // 3. ค่าคงที่และเกณฑ์
      usageCardHTML();         // 4. สถิติการเข้าใช้งาน
    bindSettingHandlers();
    return;
  }
  return renderSettingFull();
}

/** ผูกเหตุการณ์ของทุกการ์ดในแท็บตั้งค่า
    ทุกอันตรวจก่อนว่ามีองค์ประกอบนั้นจริง เพราะหน้าของนักเรียนมีแค่ 4 การ์ด */
function bindSettingHandlers() {
  $$('[data-md]').forEach(b => b.addEventListener('click', () => {
    DB.mode = b.dataset.md;
    if (DB.mode === 'class' && DB.classes.length && !DB.cur.classId) {
      DB.cur.classId = DB.classes[0].id;
      const l = studentsOf(DB.cur.classId); DB.cur.studentId = l.length ? l[0].id : null;
    }
    DB.cur.attemptId = null;
    save(true); render();
  }));
  const bAdd = $('#btnAddCls');
  if (bAdd) bAdd.addEventListener('click', () => {
    const nm = ($('#newCls').value || '').trim();
    if (!nm) { toast('พิมพ์ชื่อชั้นก่อน', 'bad'); return; }
    const c = { id: uid(), name: nm };
    DB.classes.push(c); DB.cur.classId = c.id; DB.cur.studentId = null;
    save(true); render(); toast('เพิ่มชั้น ' + nm + ' แล้ว', 'ok');
  });
  $$('[data-addstd]').forEach(b => b.addEventListener('click', () => addStudents(b.dataset.addstd)));
  $$('[data-impstd]').forEach(b => b.addEventListener('click', () => importRosterFile(b.dataset.impstd)));
  $$('[data-delcls]').forEach(b => b.addEventListener('click', async () => {
    const c = classById(b.dataset.delcls), n = studentsOf(c.id).length;
    if (!await confirmBox('ลบชั้นเรียน', 'ลบ "' + esc(c.name) + '" พร้อมรายชื่อ ' + n + ' คน และผลการทำทั้งหมดของคนเหล่านี้?', 'ลบ')) return;
    const ids = studentsOf(c.id).map(s => s.id);
    DB.students = DB.students.filter(s => s.classId !== c.id);
    DB.attempts = DB.attempts.filter(a => ids.indexOf(a.studentId) < 0);
    DB.classes = DB.classes.filter(x => x.id !== c.id);
    if (DB.cur.classId === c.id) { DB.cur.classId = DB.classes.length ? DB.classes[0].id : null; DB.cur.studentId = null; }
    save(true); render();
  }));
  $$('[data-delstd]').forEach(b => b.addEventListener('click', async () => {
    const s = studentById(b.dataset.delstd);
    const n = DB.attempts.filter(a => a.studentId === s.id).length;
    if (!await confirmBox('ลบรายชื่อ', 'ลบ "' + esc(s.name) + '"' + (n ? ' และผลการทำ ' + n + ' ครั้ง' : '') + '?', 'ลบ')) return;
    DB.students = DB.students.filter(x => x.id !== s.id);
    DB.attempts = DB.attempts.filter(a => a.studentId !== s.id);
    if (DB.cur.studentId === s.id) DB.cur.studentId = null;
    save(true); render();
  }));
  // แก้ไขรายชื่อในตารางได้เลย ไม่ต้องลบแล้วเพิ่มใหม่
  $$('[data-fno]').forEach(inp => inp.addEventListener('change', e => {
    const s = studentById(e.target.dataset.fno); if (!s) return;
    const v = clamp(Math.round(Number(e.target.value) || 0), 0, 200);
    s.no = v || null;
    save(true); renderSetting(); renderWho();
  }));
  $$('[data-fsid]').forEach(inp => inp.addEventListener('change', e => {
    const s = studentById(e.target.dataset.fsid); if (!s) return;
    const v = normSid(e.target.value);
    if (String(e.target.value).trim() && !v) {
      e.target.value = s.sid || '';
      toast('เลขประจำตัวต้องเป็นตัวเลขล้วน ไม่เกิน ' + SID_MAX + ' หลัก', 'bad');
      return;
    }
    s.sid = v;
    e.target.value = v;
    save(true); renderSetting();
  }));
  $$('[data-fname]').forEach(inp => inp.addEventListener('change', e => {
    const s = studentById(e.target.dataset.fname); if (!s) return;
    const v = String(e.target.value || '').trim();
    if (!v) { e.target.value = s.name; toast('ชื่อว่างไม่ได้', 'bad'); return; }
    s.name = v;
    save(true); renderWho();
  }));
  bindCloudCard();
  bindTeacherCard();
  bindUsageCard();
  const bl = $('#btnLogo'); if (bl) bl.addEventListener('click', pickLogo);
  const bd = $('#btnLogoDel');
  if (bd) bd.addEventListener('click', async () => {
    if (!await confirmBox('เอาโลโก้ออก', 'เอาตราโรงเรียนออกจากระบบ?', 'เอาออก')) return;
    DB.settings.logo = ''; save(true); applyAppIcon(); renderSetting(); renderBrand();
  });
  buildAppIcon(180).then(u => { const p = $('#iconPrev'); if (p) p.src = u; });
  const ab = { abDev: 'dev', abDept: 'dept', abSchool: 'school' };
  Object.keys(ab).forEach(id => {
    const el = $('#' + id);
    if (el) el.addEventListener('input', e => { DB.settings.about[ab[id]] = e.target.value; save(); });
  });
  const as = $('#abShow');
  if (as) as.addEventListener('change', e => { DB.settings.showCredit = e.target.checked; save(true); });
  const pf = { pfName: 'name', pfNo: 'no', pfSid: 'sid', pfRoom: 'room' };
  Object.keys(pf).forEach(id => {
    const el = $('#' + id);
    if (el) el.addEventListener('input', e => {
      DB.profile[pf[id]] = String(e.target.value || '').trim();
      save();
      if (pf[id] === 'name') renderWho();
    });
  });
  const eG = $('#setg');
  if (eG) eG.addEventListener('change', e => { DB.settings.g = Number(e.target.value); save(true); });
  const eE = $('#setEasy');
  if (eE) eE.addEventListener('change', e => { DB.settings.easyG10 = e.target.checked; save(true); });
  const eT = $('#settol');
  if (eT) eT.addEventListener('change', e => { DB.settings.tolPct = clamp(Number(e.target.value) || 0, 0, 10); save(true); });
  const eXm = $('#setexmin');
  if (eXm) eXm.addEventListener('change', e => { DB.settings.examMin = clamp(Math.round(Number(e.target.value) || 0), 0, 300); save(true); });
  const eXo = $('#setexout');
  if (eXo) eXo.addEventListener('change', e => { DB.settings.examMaxOut = clamp(Math.round(Number(e.target.value) || 0), 0, 20); save(true); });
  const eXs = $('#setexsec');
  if (eXs) eXs.addEventListener('change', e => { DB.settings.examMaxOutSec = clamp(Math.round(Number(e.target.value) || 0), 0, 3600); save(true); });
  const eP = $('#setpass');
  if (eP) eP.addEventListener('change', e => { DB.settings.passPct = clamp(Math.round(Number(e.target.value) || 0), 0, 100); save(true); });
  $$('[data-wl]').forEach(inp => inp.addEventListener('change', e => {
    DB.settings.workLines[e.target.dataset.wl] = clamp(Math.round(Number(e.target.value) || 0), 0, WORK_MAX);
    save(true); renderSetting();
  }));
  const wR = $('#wlReset');
  if (wR) wR.addEventListener('click', () => {
    DB.settings.workLines = {};
    save(true); renderSetting(); toast('คืนค่าเริ่มต้นแล้ว', 'ok');
  });
  const wP = $('#wlPrint');
  if (wP) wP.addEventListener('click', () => { DB.cur.printKind = 'worksheet'; save(); setTab('print'); });
  ['hSchool:school', 'hTeacher:teacher', 'hTerm:term'].forEach(pair => {
    const [id, key] = pair.split(':');
    const el = $('#' + id);
    if (el) el.addEventListener('input', e => { DB.settings.header[key] = e.target.value; save(); });
  });
  const bk = $('#btnBk2'); if (bk) bk.addEventListener('click', backup);
  const rs = $('#btnRs2'); if (rs) rs.addEventListener('click', restore);
  const wp = $('#btnWipe');
  if (wp) wp.addEventListener('click', async () => {
    if (!await confirmBox('ล้างข้อมูลทั้งหมด',
      '<b>จะลบชุดโจทย์ ผลการทำ และรายชื่อทั้งหมด</b> การกระทำนี้ย้อนกลับไม่ได้<br>' +
      'แนะนำให้กด <b>สำรองข้อมูล</b> เก็บไฟล์ไว้ก่อน', 'ล้างทั้งหมด')) return;
    DB = defaultDB();
    Object.keys(PCACHE).forEach(k => delete PCACHE[k]);
    save(true); render(); toast('ล้างข้อมูลแล้ว');
  });
}

   อ่านไฟล์ตาราง — .xlsx / .csv / .txt  โดยไม่พึ่งไลบรารีภายนอก
   .xlsx คือไฟล์ ZIP ที่ข้างในเป็น XML จึงแกะ ZIP เองแล้วคลายบีบอัดด้วย
   DecompressionStream ที่มีมากับเบราว์เซอร์ (Safari 16.4+ / Chrome 80+)
   ========================================================================== */

/** แกะรายการไฟล์ใน ZIP — คืน Map(ชื่อไฟล์ → {method, bytes}) */
function unzipEntries(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  // มองหา End of Central Directory จากท้ายไฟล์ (ท้ายอาจมีคอมเมนต์ต่อท้ายได้ถึง 64KB)
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65558); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('ไม่ใช่ไฟล์ ZIP/xlsx ที่ถูกต้อง');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = new Map();
  const dec = new TextDecoder('utf-8');
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    // ความยาว extra ใน local header ต่างจากใน central directory ได้ ต้องอ่านซ้ำ
    if (dv.getUint32(lho, true) === 0x04034b50) {
      const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lelen;
      out.set(name, { method: method, bytes: u8.subarray(start, start + csize) });
    }
    p += 46 + nlen + elen + clen;
  }
  return out;
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream !== 'function') {
    throw new Error('เบราว์เซอร์รุ่นนี้เปิดไฟล์ .xlsx ไม่ได้ — ให้บันทึกเป็น .csv แล้วลองใหม่');
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function zipText(zip, name) {
  const e = zip.get(name);
  if (!e) return null;
  const raw = e.method === 0 ? e.bytes : await inflateRaw(e.bytes);
  return new TextDecoder('utf-8').decode(raw);
}

/** อ่านแอตทริบิวต์โดยดูจากชื่อท้าย (เลี่ยงปัญหา namespace เช่น r:id) */
function xmlAttr(el, localName) {
  for (let i = 0; i < el.attributes.length; i++) {
    const a = el.attributes[i];
    if (a.name === localName || a.name.endsWith(':' + localName)) return a.value;
  }
  return null;
}
function parseXML(text) {
  const d = new DOMParser().parseFromString(text, 'application/xml');
  if (d.getElementsByTagName('parsererror').length) throw new Error('อ่านไฟล์ไม่สำเร็จ (XML เสีย)');
  return d;
}
/** "AB12" → 27 (นับจาก 0) */
function colIndex(ref) {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c >= 65 && c <= 90) n = n * 26 + (c - 64); else break;
  }
  return n - 1;
}

/** รายชื่อชีตในไฟล์ xlsx ตามลำดับที่เห็นในโปรแกรม Excel */
async function xlsxSheets(zip) {
  const wbText = await zipText(zip, 'xl/workbook.xml');
  if (!wbText) throw new Error('ไม่พบข้อมูลสมุดงานในไฟล์นี้');
  const relText = await zipText(zip, 'xl/_rels/workbook.xml.rels');
  const rel = {};
  if (relText) {
    Array.from(parseXML(relText).getElementsByTagName('Relationship')).forEach(r => {
      let t = r.getAttribute('Target') || '';
      t = t.replace(/^\/xl\//, '').replace(/^\.\//, '');
      rel[r.getAttribute('Id')] = t.indexOf('xl/') === 0 ? t : 'xl/' + t;
    });
  }
  const list = [];
  Array.from(parseXML(wbText).getElementsByTagName('sheet')).forEach((s, i) => {
    const rid = xmlAttr(s, 'id');
    const path = (rid && rel[rid]) || ('xl/worksheets/sheet' + (i + 1) + '.xml');
    if (zip.has(path)) list.push({ name: s.getAttribute('name') || ('ชีต ' + (i + 1)), path: path });
  });
  if (!list.length) throw new Error('ไม่พบชีตข้อมูลในไฟล์นี้');
  return list;
}

/** อ่านชีตหนึ่งเป็นตาราง 2 มิติของข้อความ */
async function xlsxRows(zip, path) {
  const shText = await zipText(zip, 'xl/sharedStrings.xml');
  const shared = [];
  if (shText) {
    Array.from(parseXML(shText).getElementsByTagName('si')).forEach(si => {
      // ข้อความหนึ่งช่องอาจถูกซอยเป็นหลาย <t> เมื่อมีการจัดรูปแบบต่างกัน
      shared.push(Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join(''));
    });
  }
  const doc = parseXML(await zipText(zip, path));
  const rows = [];
  Array.from(doc.getElementsByTagName('row')).forEach(row => {
    const cells = [];
    Array.from(row.getElementsByTagName('c')).forEach(c => {
      const idx = colIndex(c.getAttribute('r') || '');
      const type = c.getAttribute('t');
      let v = '';
      if (type === 'inlineStr') {
        v = Array.from(c.getElementsByTagName('t')).map(t => t.textContent).join('');
      } else {
        const vn = c.getElementsByTagName('v')[0];
        const raw = vn ? vn.textContent : '';
        v = type === 's' ? (shared[Number(raw)] || '') : raw;
      }
      if (idx >= 0) { while (cells.length < idx) cells.push(''); cells[idx] = String(v).trim(); }
      else cells.push(String(v).trim());
    });
    rows.push(cells);
  });
  return rows;
}

/** อ่าน CSV/TSV — รองรับเครื่องหมายคำพูด คอมมาในชื่อ และ BOM */
function parseDelimited(text) {
  let s = String(text || '').replace(/^﻿/, '');
  // เดาตัวคั่นจากบรรทัดแรก
  const first = s.split(/\r?\n/)[0] || '';
  const tabs = (first.match(/\t/g) || []).length;
  const semis = (first.match(/;/g) || []).length;
  const commas = (first.match(/,/g) || []).length;
  const D = tabs >= commas && tabs >= semis ? '\t' : (semis > commas ? ';' : ',');
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === D) { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell.trim()); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}

/** อ่านไฟล์ที่ผู้ใช้เลือก คืน [{name, rows}] */
async function readTableFile(file) {
  const nm = String(file.name || '').toLowerCase();
  if (/\.(csv|txt|tsv)$/.test(nm)) {
    return [{ name: file.name, rows: parseDelimited(await file.text()) }];
  }
  if (/\.xls$/.test(nm)) {
    throw new Error('ไฟล์ .xls รุ่นเก่าอ่านไม่ได้ — เปิดใน Excel แล้วบันทึกเป็น .xlsx หรือ .csv ก่อน');
  }
  const zip = unzipEntries(await file.arrayBuffer());
  const sheets = await xlsxSheets(zip);
  const out = [];
  for (const s of sheets) out.push({ name: s.name, rows: await xlsxRows(zip, s.path) });
  return out;
}

/* --- จับคู่คอลัมน์อัตโนมัติ ---------------------------------------------- */
const COLKEYS = [
  { k: 'no',   label: 'เลขที่',        re: /^(เลขที่|ที่|ลำดับ(ที่)?|no\.?|number|order)$/i },
  { k: 'sid',  label: 'เลขประจำตัว',   re: /(เลขประจำตัว|รหัส|student\s*id|^sid$|^id$|^code$)/i },
  { k: 'name', label: 'ชื่อ-นามสกุล',  re: /(ชื่อ|นาม|name)/i },
  { k: 'cls',  label: 'ชั้น',          re: /(ชั้น|ห้อง|ระดับชั้น|class|room)/i }
];
/** เดาว่าแถวไหนคือหัวตาราง และคอลัมน์ไหนคืออะไร */
function guessLayout(rows) {
  let headRow = -1, map = { no: -1, sid: -1, name: -1, cls: -1 };
  let bestRow = -1, bestMap = null, bestHits = 0;
  for (let r = 0; r < Math.min(8, rows.length); r++) {
    const m = { no: -1, sid: -1, name: -1, cls: -1 };
    const used = {};
    let hits = 0;
    rows[r].forEach((cell, i) => {
      const t = String(cell || '').replace(/\s+/g, '');
      if (!t || used[i]) return;
      for (const ck of COLKEYS) {
        if (m[ck.k] < 0 && ck.re.test(t)) { m[ck.k] = i; used[i] = 1; hits++; break; }
      }
    });
    if (m.name >= 0 && hits >= 2) { headRow = r; map = m; break; }
    // จำแถวที่ใกล้เคียงที่สุดไว้ เผื่อไม่มีแถวไหนเข้าเกณฑ์เต็ม
    // แต่ต้องไม่มีช่องไหนเป็นตัวเลขล้วน ไม่งั้นแถวข้อมูลของนักเรียนที่ชื่อมีคำว่า
    // "นาม" หรือ "ชื่อ" จะถูกเข้าใจผิดว่าเป็นหัวตารางแล้วหายไปทั้งคน
    const hasBareNumber = rows[r].some(c => /^\d+(\.\d+)?$/.test(String(c == null ? '' : c).trim()));
    if (m.name >= 0 && hits > bestHits && !hasBareNumber) { bestHits = hits; bestRow = r; bestMap = m; }
  }
  // หัวตารางที่ใช้คำแปลก ๆ (เช่น "นาม", "รหัส") ก็ยังต้องถูกตัดออกจากรายชื่อ
  // ไม่งั้นหัวตารางจะกลายเป็นนักเรียนคนแรกไปเลย
  if (headRow < 0 && bestRow >= 0) { headRow = bestRow; map = bestMap; }
  if (headRow < 0) {
    // ไม่มีหัวตาราง — เดาจากรูปแบบข้อมูล: คอลัมน์ที่เป็นตัวอักษรยาวสุดคือชื่อ
    const width = rows.reduce((w, r) => Math.max(w, r.length), 0);
    let bestName = -1, bestScore = -1;
    for (let i = 0; i < width; i++) {
      const vals = rows.slice(0, 30).map(r => String(r[i] || '')).filter(Boolean);
      if (!vals.length) continue;
      const textish = vals.filter(v => /[^\d\s.\-]/.test(v)).length / vals.length;
      const avgLen = vals.reduce((s, v) => s + v.length, 0) / vals.length;
      const score = textish * 10 + Math.min(avgLen, 20) / 20;
      if (score > bestScore) { bestScore = score; bestName = i; }
    }
    map.name = bestName;
    // คอลัมน์ตัวเลขก่อนหน้าชื่อ: ค่าน้อย = เลขที่, ค่ามาก = เลขประจำตัว
    for (let i = 0; i < map.name; i++) {
      const nums = rows.slice(0, 30).map(r => Number(r[i])).filter(n => isFinite(n) && n > 0);
      if (nums.length < Math.min(3, rows.length)) continue;
      const mx = Math.max.apply(null, nums);
      if (mx <= 200 && map.no < 0) map.no = i;
      else if (map.sid < 0) map.sid = i;
    }
  }
  return { headRow: headRow, map: map };
}

/** อ่านรายชื่อหนึ่งบรรทัด คืน {no, sid, name} — รองรับทั้งที่วางจาก Excel และที่พิมพ์เอง */
function parseRosterLine(line) {
  const s = String(line == null ? '' : line).replace(/ /g, ' ').trim();
  if (!s) return null;

  // วางจาก Excel จะมาเป็นแท็บ ส่วนวางจาก PDF/Word มักได้เว้นวรรคหลายเคาะ
  let cols = null;
  if (s.indexOf('\t') >= 0) cols = s.split('\t');
  else if (/ {2,}/.test(s)) cols = s.split(/ {2,}/);
  if (cols) {
    cols = cols.map(c => c.trim()).filter(c => c !== '');
    if (!cols.length) return null;
    if (cols.length >= 3) return { no: /^\d+$/.test(cols[0]) ? Number(cols[0]) : null, sid: cols[1], name: cols.slice(2).join(' ') };
    if (cols.length === 2) {
      if (!/^\d+$/.test(cols[0])) return { no: null, sid: '', name: cols.join(' ') };
      // เลขนำหน้าที่ใหญ่เกินจำนวนคนในห้อง แปลว่าเป็นเลขประจำตัว ไม่ใช่เลขที่
      return Number(cols[0]) <= 200
        ? { no: Number(cols[0]), sid: '', name: cols[1] }
        : { no: null, sid: cols[0], name: cols[1] };
    }
    return { no: null, sid: '', name: cols[0] };
  }

  // เว้นวรรคเดียว:  "1 12345 สมชาย ใจดี"  /  "1 สมชาย ใจดี"  /  "12345 สมชาย ใจดี"  /  "สมชาย ใจดี"
  let m = s.match(/^(\d{1,3})[.)]?\s+(\d{3,})\s+(.+)$/);
  if (m) return { no: Number(m[1]), sid: m[2], name: m[3].trim() };
  m = s.match(/^(\d+)[.)]?\s+(.+)$/);
  if (m) {
    const n = Number(m[1]);
    return n <= 200 ? { no: n, sid: '', name: m[2].trim() } : { no: null, sid: m[1], name: m[2].trim() };
  }
  return { no: null, sid: '', name: s };
}

/** อ่านทั้งก้อน แล้วไล่เลขที่ให้บรรทัดที่ไม่ได้ระบุ */
function parseRoster(text, startNo) {
  let next = startNo || 0;
  const rows = [];
  String(text == null ? '' : text).split('\n').forEach(line => {
    const r = parseRosterLine(line);
    if (!r || !r.name) return;
    if (r.no == null) r.no = ++next; else if (r.no > next) next = r.no;
    rows.push(r);
  });
  return rows;
}

/** ผู้ดูแลมอบหมายชุดโจทย์ขึ้นชีต แล้วได้รหัส 6 ตัวไปบอกนักเรียน */
async function publishQuiz(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  /* ครูผู้สอนเลือกได้เฉพาะชั้นที่ดูแล และเลือก "ทุกห้อง" ไม่ได้
     ฝั่งชีตปฏิเสธอยู่แล้ว แต่ตัดตัวเลือกออกตั้งแต่ต้นดีกว่าให้กดแล้วเจอข้อความปฏิเสธ */
  const my = myClasses();
  const classes = my ? my.map(function (n) { return { name: n }; })
                     : DB.classes.slice();

    title: 'มอบหมายใบงาน "' + (q.title || '') + '"',

      'นักเรียนที่ลงชื่อเข้าใช้จะเห็นในรายการ <b>ใบงานของฉัน</b> ทันที ' +
      'หรือกรอกรหัสเองก็ได้</div>' +
      '<label class="hint" for="pbCls">มอบหมายให้</label><br>' +
      '<select id="pbCls" style="max-width:100%">' +
      (my ? '' : '<option value="">ทุกห้อง</option>') +
      classes.map(c => '<option value="' + esc(c.name) + '">' + esc(c.name) + '</option>').join('') +
      '</select>' +
      '<label class="hint" for="pbClose" style="display:block;margin-top:11px">ปิดรับเมื่อ (เว้นว่าง = ไม่กำหนด)</label>' +
      '<input type="datetime-local" id="pbClose" style="max-width:100%">' +
      '<div id="pbMsg" style="margin-top:11px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'มอบหมาย', cls: 'primary', act: async (close, root) => {
          const msg = $('#pbMsg', root);
          msg.innerHTML = '<div class="hint">กำลังส่งขึ้นชีต…</div>';
          const closeAt = $('#pbClose', root).value;
          try {
            const code = makeCode(6);
            await api('assignSave', { assignment: {
              code: code, title: q.title, cls: $('#pbCls', root).value || '',
              spec: encodeQuiz(q), baseSeed: q.seed || 0, perStudent: false,
              g: q.g, easyG10: !!q.easyG10, openAt: '',
              closeAt: closeAt ? new Date(closeAt).toISOString() : '', active: true
            } });
            close();
            openModal({ title: 'มอบหมายเรียบร้อย',
              bodyHTML: '<div style="text-align:center;padding:8px 0">' +
                '<div class="hint">รหัสใบงาน</div>' +

                '<div class="hint">นักเรียนที่ลงชื่อเข้าใช้แล้วจะเห็นใบงานนี้ในรายการเลย<br>' +
                'หรือบอกรหัสนี้ให้กรอกเองก็ได้</div></div>',
              buttons: [{ label: 'ปิด' }, { label: 'คัดลอกรหัส', cls: 'primary', act: async c => {
                await copyText(code); toast('คัดลอกรหัสแล้ว', 'ok'); c();
              } }] });
          } catch (e) {
            msg.innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>';
          }

}

/** รายการใบงานที่มอบหมายไว้ (ฝั่งผู้ดูแล) */
async function manageAssignments() {
  let list;
  try { list = await api('assignList', {}); }
  catch (e) { toast(e.message, 'bad'); return; }
  const body = () => list.length
    ? '<div class="tablewrap" style="max-height:340px"><table><thead><tr><th>รหัส</th><th>ชื่อใบงาน</th>' +
      '<th>ห้อง</th><th class="num">ส่งแล้ว</th><th>ปิดรับ</th><th></th></tr></thead><tbody>' +
      list.map(a => '<tr><td><b>' + esc(a.code) + '</b></td><td>' + esc(a.title) + '</td>' +
        '<td>' + esc(a.cls || 'ทุกห้อง') + '</td><td class="num">' + a.done + '</td>' +
        '<td class="hint">' + (a.closeAt ? esc(thDateTime(new Date(a.closeAt).getTime())) : '—') + '</td>' +
        '<td><button class="sm" data-pull="' + esc(a.code) + '">ดึงผล</button> ' +
        '<button class="sm danger" data-rm="' + esc(a.code) + '">ลบ</button></td></tr>').join('') +
      '</tbody></table></div>'
    : '<div class="hint">ยังไม่ได้มอบหมายใบงานใด</div>';
  openModal({
    title: 'ใบงานที่มอบหมายไว้', wide: true,
    bodyHTML: '<div id="maBody">' + body() + '</div>',
    onMount: root => {
      const bind = () => {
        $$('[data-pull]', root).forEach(b => b.addEventListener('click', () => pullResults(b.dataset.pull)));
        $$('[data-rm]', root).forEach(b => b.addEventListener('click', async () => {
          if (!await confirmBox('ลบใบงาน', 'ลบใบงานรหัส <b>' + esc(b.dataset.rm) +
            '</b> ออกจากชีต?<br>ผลที่นักเรียนส่งมาแล้วยังอยู่', 'ลบ')) return;
          try {
            await api('assignRemove', { code: b.dataset.rm });
            list = list.filter(a => a.code !== b.dataset.rm);
            $('#maBody', root).innerHTML = body(); bind();

/** ดึงผลจากชีตแล้วแปลงเป็น attempts เพื่อให้สถิติและเอกสารพิมพ์เดิมใช้ได้ทันที */
async function pullResults(code) {
  let rows, assigns;
  try {
    rows = await api('resultsList', code ? { code: code } : {});
    assigns = await api('assignList', {});
  } catch (e) { toast(e.message, 'bad'); return; }
  if (!rows.length) { toast('ยังไม่มีใครส่งผลของใบงานนี้', 'bad'); return; }

  // ถอดสเปกใบงานเป็นชุดโจทย์ในเครื่อง เพื่อให้ analyze() ทำงานได้
  const quizByCode = {};
  assigns.forEach(a => {
    const q = decodeQuiz(a.spec);
    if (!q) return;
    quizByCode[a.code] = q;
    if (!DB.quizzes.some(x => x.id === q.id)) DB.quizzes.push(q);
  });

  const st = { added: 0, dup: 0, skipped: 0, noQuiz: 0, unmatched: [] };
  rows.forEach(r => {
    const q = quizByCode[r.code];
    if (!q) { st.noQuiz++; return; }
    if (!Array.isArray(r.answers) || r.answers.length !== q.items.length) { st.skipped++; return; }
    const id = 'cloud:' + r.code + ':' + r.sid;
    if (DB.attempts.some(a => a.id === id)) { st.dup++; return; }
    const s = DB.students.find(x => String(x.sid || '').trim() === String(r.sid).trim());
    if (!s) st.unmatched.push(r.name || r.sid);
    DB.attempts.push({
      id: id, quizId: q.id, studentId: s ? s.id : null,
      soloName: s ? s.name : (r.name || String(r.sid)),
      sid: String(r.sid), no: String(r.no || ''), room: String(r.cls || ''),
      startedAt: new Date(r.ts).getTime() - (Number(r.sec) || 0) * 1000,
      finishedAt: new Date(r.ts).getTime(),
      answers: r.answers.map(a => ({
        raw: [], pick: null, checked: true,
        score: Number(a && a.s != null ? a.s : a) || 0,
        tries: Number(a && a.t) || 1, revealed: !!(a && a.r), sec: Number(a && a.c) || 0
      })),
      /* ข้อมูลคุมสอบที่ชีตเก็บไว้ ต้องพากลับมาด้วย ไม่งั้นรายงานชั้นเรียนของผลที่ดึงมา
         จะไม่ขึ้นคอลัมน์ออกจากแอปเลย ทั้งที่ในชีตมีข้อมูลอยู่ครบ
         ผลที่ดึงมาปิดจบไปแล้ว (มี finishedAt) จึงไม่ไปยุ่งกับการคุมสอบที่กำลังทำอยู่ */
      proc: { nOut: Number(r.out) || 0, secOut: Number(r.outSec) || 0,
              openAt: 0, events: [], autoBy: String(r.autoBy || '') }
    });
    st.added++;
  });
  Object.keys(PCACHE).forEach(k => delete PCACHE[k]);
  save(true); render();

  const uw = Array.from(new Set(st.unmatched));
  let m = '<b>ดึงผลเข้ามา ' + st.added + ' รายการ</b>';
  if (st.dup) m += '<br>ข้ามที่ดึงมาแล้ว ' + st.dup + ' รายการ';
  if (st.skipped) m += '<br><span style="color:var(--warn)">ข้าม ' + st.skipped +
    ' รายการ เพราะจำนวนข้อไม่ตรงกับใบงาน (อาจแก้ใบงานหลังมอบหมายไปแล้ว)</span>';
  if (st.noQuiz) m += '<br><span style="color:var(--bad)">ข้าม ' + st.noQuiz + ' รายการ เพราะอ่านสเปกใบงานไม่ได้</span>';
  if (uw.length) m += '<br><span style="color:var(--warn)">ไม่พบเลขประจำตัวเหล่านี้ในรายชื่อในเครื่อง: ' +
    esc(uw.slice(0, 10).join(', ')) + (uw.length > 10 ? ' …' : '') + '<br>' +
    'กด <b>ดึงรายชื่อจากชีต</b> ในแท็บตั้งค่าเพื่อให้ตรงกัน</span>';
  openModal({ title: 'ผลการดึงข้อมูล', bodyHTML: '<div style="line-height:1.9">' + m + '</div>' });
}

/* --- การส่งคำตอบขึ้นชีต พร้อมคิวสำรองเมื่อเน็ตหลุด ----------------------- */

function attemptPayload(a, status) {
  const r = analyze(a);
  return {
    code: a.assignCode, status: status,
    score: r.got, max: r.max, pct: Math.round(r.pct * 10) / 10, sec: Math.round(r.sec),
    revealed: a.answers.filter(x => x.revealed).length,
    answers: a.answers.map(x => ({ s: x.score, t: x.tries, r: x.revealed ? 1 : 0, c: Math.round(x.sec) })),
    out: (a.proc && a.proc.nOut) || 0,
    outSec: Math.round((a.proc && a.proc.secOut) || 0),
    autoBy: (a.proc && a.proc.autoBy) || '',
    device: deviceId()
  };
}

async function sendAttempt(a, status) {
  if (!isStudent() || !a || !a.assignCode) return false;
  const payload = attemptPayload(a, status);
  try {
    await api('submit', { payload: payload });
    if (status === 'final') { a.sentAt = Date.now(); save(true); }
    return true;
  } catch (e) {
    // เก็บเข้าคิวเฉพาะฉบับจริง ฉบับร่างปล่อยหายได้ เดี๋ยวรอบหน้าส่งใหม่อยู่แล้ว
    if (status === 'final') {
      DB.outbox = DB.outbox.filter(x => !(x.code === payload.code && x.status === 'final'));
      DB.outbox.push(payload);
      save(true);
      renderOutboxBadge();
    }
    return false;
  }
}

async function flushOutbox(loud) {
  if (!isStudent() || !DB.outbox.length) {
    if (loud) toast('ไม่มีผลค้างส่ง', 'ok');
    return;
  }
  const keep = [];
  let sent = 0;
  for (const p of DB.outbox.slice()) {
    try { await api('submit', { payload: p }); sent++; }
    catch (e) { keep.push(p); }
  }
  DB.outbox = keep;
  save(true);
  renderOutboxBadge();
  if (loud || sent) {
    toast(sent ? 'ส่งผลที่ค้างอยู่สำเร็จ ' + sent + ' รายการ' +
                 (keep.length ? ' · ยังค้างอีก ' + keep.length : '')
               : 'ยังส่งไม่ได้ ค้างอยู่ ' + keep.length + ' รายการ', sent ? 'ok' : 'bad');
  }
}

function renderOutboxBadge() {
  const el = $('#saveState');
  if (!el) return;
  if (isStudent() && DB.outbox.length) {
    el.textContent = 'ค้างส่ง ' + DB.outbox.length;
    el.className = 'savestate';
    el.style.color = 'var(--warn)';
  } else { el.style.color = ''; }
}

          '</b> ออกจากระบบใช่ไหม<br><span class="hint">ผลการทำของนักเรียนไม่ถูกลบ</span>', 'ลบ')) return;
      try { await api('teacherRemove', { user: b.dataset.tcrm }); toast('ลบแล้ว', 'ok'); loadTeachers(); }
      catch (e) { toast(e.message, 'bad'); }
    }));
  } catch (e) { box.innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>'; }
}
