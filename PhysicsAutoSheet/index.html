  }
});

T({
  id: 'u-vecperp', topic: 4, sub: 'การรวมเวกเตอร์ตั้งฉาก', level: 'ปานกลาง',
  skills: ['ทฤษฎีบทพีทาโกรัส', 'หาทิศของเวกเตอร์ลัพธ์'],
  gen(R) {
    const k = R.pick([1, 2, 3, 4, 5, 6]);
    const swap = R.f() < 0.5;
    const fx = (swap ? 3 : 4) * k, fy = (swap ? 4 : 3) * k, Rm = 5 * k;
    const deg = swap ? 53 : 37;                  // มุมที่ลัพธ์ทำกับแกน x
    return {
      stem: 'แรงสองแรงกระทำที่จุดเดียวกันและ<b>ตั้งฉากกัน</b> ' +
        'แรงแรกขนาด ' + U(fx, 'N') + ' อยู่ในแนวราบ (แกน ' + M('x') + ') ' +
        'แรงที่สองขนาด ' + U(fy, 'N') + ' อยู่ในแนวดิ่ง (แกน ' + M('y') + ') ' +
        'จงหา<b>ขนาดของแรงลัพธ์</b> และ<b>มุมที่แรงลัพธ์ทำกับแนวราบ</b>',
      figure: figForcesPoint({ maxLen: 104, axes: true,
        forces: [
          { deg: 0, label: 'F₁', mag: fx }, { deg: 90, label: 'F₂', mag: fy },
          { deg: deg, label: 'R', mag: Rm }],
        arcs: [{ to: deg, label: 'θ' }] }),
      given: [{ s: 'F_1', v: fx, unit: 'N', d: 'แรงในแนวแกน x' },
              { s: 'F_2', v: fy, unit: 'N', d: 'แรงในแนวแกน y' },
              { s: 'มุมระหว่างแรง', v: 90, unit: '°', d: 'ตั้งฉากกัน' }],
      finds: [{ s: 'R', unit: 'N', d: 'ขนาดของแรงลัพธ์', value: Rm, positive: true },
              { s: 'θ', unit: '°', d: 'มุมที่ลัพธ์ทำกับแกน x', value: deg, positive: true }],
      sol: {
        analyze: 'เมื่อเวกเตอร์สองตัว<b>ตั้งฉากกัน</b> การนำมาต่อแบบหัวต่อหางจะได้<b>สามเหลี่ยมมุมฉาก</b> ' +
          'โดยมีเวกเตอร์ลัพธ์เป็น<b>ด้านตรงข้ามมุมฉาก</b><br>' +
          'จึงหาขนาดได้ด้วยทฤษฎีบทพีทาโกรัส และหาทิศได้ด้วยฟังก์ชันแทนเจนต์<br>' +
          '<b>ย้ำ:</b> ห้ามบวกกันตรง ๆ เป็น ' + M(fmt(fx) + ' + ' + fmt(fy) + ' = ' + fmt(fx + fy)) +
          ' N เด็ดขาด นั่นเป็นวิธีของปริมาณสเกลาร์<br>' +
          'ค่าที่ใช้: ' + M('tan 37° = 0.75, tan 53° = 1.33'),
        eqs: [{ eq: 'R = √(F_1^2 + F_2^2)', why: 'ทฤษฎีบทพีทาโกรัส ใช้ได้เพราะแรงทั้งสองตั้งฉากกันพอดี' },
               { eq: 'tan θ = F_2 / F_1', why: 'มุมที่ลัพธ์ทำกับแกน x หาจากด้านตรงข้าม หารด้วยด้านประชิด' }],
        solve: EQ('R = √(F_1^2 + F_2^2)', 'θ = tan^{-1} (F_2 / F_1)'),
        subst: SEQ('R = √({a}^2 + {b}^2)', { a: fx, b: fy }) +
               SEQ('tan θ = {b} / {a}', { b: fy, a: fx }),
        calc: EQ('R = √(' + fmtq(fx * fx) + ' + ' + fmtq(fy * fy) + ')',
                 'R = √' + fmtq(fx * fx + fy * fy) + ' = ' + fmtq(Rm) + ' `N`',
                 'tan θ = ' + fmtq(r2(fy / fx)) + '  ⇒  θ = ' + fmt(deg) + '°'),
        conclude: 'ดังนั้น <b>แรงลัพธ์มีขนาด ' + U(Rm, 'N') + ' ทำมุม ' + fmt(deg) +
          '° กับแนวราบ</b><br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> ลัพธ์ต้องมากกว่าแรงที่ใหญ่ที่สุด (' +
          U(Math.max(fx, fy), 'N') + ') แต่น้อยกว่าผลบวก (' + U(fx + fy, 'N') + ') ✓<br>' +
          'สังเกตว่าอัตราส่วน ' + fmt(fx) + ' : ' + fmt(fy) + ' : ' + fmt(Rm) +
          ' ย่อได้เป็น <b>' + (swap ? '3 : 4 : 5' : '4 : 3 : 5') + '</b> — ' +
          'สามเหลี่ยมมุมฉากชุด 3-4-5 นี้พบบ่อยมากในข้อสอบ ควรจำไว้จะคิดได้เร็วขึ้น</span>'
      }
    };
  }
});

T({
  id: 'u-veccomp', topic: 4, sub: 'การแยกองค์ประกอบเวกเตอร์', level: 'ปานกลาง',
  skills: ['แยกเวกเตอร์เป็นแกน x และ y', 'ใช้ sin cos ให้ถูกแกน'],
  gen(R) {
    // เพิ่มมุมมาตรฐาน 30 45 60 เข้ามาด้วย ของเดิมมีแต่ 37 กับ 53 จึงเจอซ้ำเร็วมาก
    const deg = R.pick([30, 37, 45, 53, 60]);
    const F = R.step(10, 100, 5);
    const fx = r2(F * cosD(deg)), fy = r2(F * sinD(deg));
    if (!ok2(fx, fy) || fx < 0.01 || fy < 0.01) return null;
    const nm = R.pick(NAMES);
    return {
      stem: esc(nm) + 'ลากกระเป๋าเดินทางด้วยแรง ' + U(F, 'N') + ' โดยที่<b>คันชักทำมุม ' +
        fmt(deg) + '° กับพื้นราบ</b> จงหา<b>องค์ประกอบของแรงในแนวราบ</b> ' +
        '(ส่วนที่ทำให้กระเป๋าเคลื่อนที่ไปข้างหน้าจริง ๆ) และ<b>องค์ประกอบในแนวดิ่ง</b> ' +
        '(ส่วนที่ยกกระเป๋าขึ้น)',
      figure: figForcesPoint({ body: 'box', axes: true, maxLen: 100,
        drop: [{ deg: deg, mag: F }],
        forces: [
          { deg: deg, label: 'F = ' + fmt(F) + ' N', mag: F },
          { deg: 0, label: 'Fₓ', mag: fx },
          // ยูนิโคดไม่มีตัวห้อย y จึงต้องใช้ tspan ไม่งั้นจะขึ้นเป็นขีดล่างจริง ๆ ไม่เข้าคู่กับ Fₓ
          { deg: 90, label: 'F<tspan dy="4" font-size="11">y</tspan>', mag: fy }],
        arcs: [{ to: deg, label: fmt(deg) + '°' }] }),
      given: [{ s: 'F', v: F, unit: 'N', d: 'ขนาดของแรงที่ออก' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมที่แรงทำกับแนวราบ' }],
      finds: [{ s: 'F_x', unit: 'N', d: 'องค์ประกอบในแนวราบ', value: fx, positive: true },
              { s: 'F_y', unit: 'N', d: 'องค์ประกอบในแนวดิ่ง', value: fy, positive: true }],
      sol: {
        analyze: 'แรงที่ทำมุมกับแนวราบไม่ได้ทำงานในแนวราบทั้งหมด ' +
          'ต้อง<b>แยกออกเป็นสองส่วนที่ตั้งฉากกัน</b> เพื่อคิดผลในแต่ละแนวอย่างอิสระ<br>' +
          '<b>วิธีจำที่ไม่พลาด:</b> วาดสามเหลี่ยมมุมฉากโดยให้แรง ' + M('F') +
          ' เป็นด้านตรงข้ามมุมฉากเสมอ แล้วดูว่า<b>มุมอยู่ติดกับด้านไหน</b><br>' +
          '• ด้านที่<b>ติดกับมุม</b> (ด้านประชิด) → ใช้ ' + M('cos') + '<br>' +
          '• ด้านที่<b>อยู่ตรงข้ามมุม</b> → ใช้ ' + M('sin') + '<br>' +
          'ข้อนี้มุมวัดจากแนวราบ แนวราบจึงเป็นด้านประชิด ⇒ ' + M('F_x') + ' ใช้ ' + M('cos') + '<br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg + '° = ' + fmtq(sinD(deg)) + ', cos ' + deg + '° = ' + fmtq(cosD(deg))),
        eqs: [{ eq: 'F_x = F cos θ', why: 'แนวราบเป็นด้านประชิดมุม θ จึงใช้โคไซน์' },
               { eq: 'F_y = F sin θ', why: 'แนวดิ่งเป็นด้านตรงข้ามมุม θ จึงใช้ไซน์' }],
        solve: EQ('F_x = F cos θ', 'F_y = F sin θ'),
        subst: SEQ('F_x = ({F})({c})', { F: F, c: cosD(deg) }) +
               SEQ('F_y = ({F})({s})', { F: F, s: sinD(deg) }),
        calc: EQ('F_x = ' + fmtq(fx) + ' `N`', 'F_y = ' + fmtq(fy) + ' `N`'),
        conclude: 'ดังนั้น <b>องค์ประกอบในแนวราบ = ' + U(fx, 'N') + '</b> และ ' +
          '<b>องค์ประกอบในแนวดิ่ง = ' + U(fy, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยพีทาโกรัส:</b> ' +
          M('√(' + fmtq(fx) + '^2 + ' + fmtq(fy) + '^2) = ' + fmtq(r2(Math.sqrt(fx * fx + fy * fy)))) +
          ' ≈ ' + fmt(F) + ' N ✓ องค์ประกอบทั้งสองต้องรวมกลับเป็นแรงเดิมได้เสมอ<br>' +
          '<b>ความหมายเชิงฟิสิกส์:</b> จากแรงที่ออกไปทั้งหมด ' + U(F, 'N') +
          ' มีเพียง ' + U(fx, 'N') + ' ที่ดึงกระเป๋าไปข้างหน้า ส่วนอีก ' + U(fy, 'N') +
          ' ถูกใช้ยกกระเป๋าขึ้น — ยิ่งยกคันชักสูง ยิ่งเสียแรงไปกับการยกมาก</span>'
      }
    };
  }
});

T({
  id: 'u-avgmeas', topic: 4, sub: 'การวัดและความคลาดเคลื่อน', level: 'ปานกลาง',
  skills: ['ค่าเฉลี่ยจากการวัดซ้ำ', 'ความคลาดเคลื่อนสูงสุด'],
  gen(R) {
    const base = R.step(20, 60, 2), d = R.pick([1, 2, 3, 4]);
    const raw = [base - 2 * d, base - d, base, base + d, base + 2 * d];
    const arr = R.shuffle(raw);
    const mean = base, err = 2 * d;
    if (!ok2(mean, err) || base - 2 * d <= 0) return null;
    return {
      stem: 'นักเรียนใช้ไม้บรรทัดวัดความยาวของแท่งวัตถุอันเดียวกัน <b>5 ครั้ง</b> ได้ผลดังนี้<br>' +
        '<b>' + arr.map(x => fmt(x)).join(', ') + '</b> เซนติเมตร<br>' +
        'จงหา<b>ค่าเฉลี่ยของความยาว</b> และ<b>ความคลาดเคลื่อนสูงสุด</b>ของการวัดชุดนี้',
      given: [{ s: 'n', v: 5, unit: 'ครั้ง', d: 'จำนวนครั้งที่วัด' },
              { s: 'Σx', v: raw.reduce((s, x) => s + x, 0), unit: 'cm', d: 'ผลรวมของค่าที่วัดได้ทั้งหมด' }],
      finds: [{ s: 'x̄', unit: 'cm', d: 'ค่าเฉลี่ยของความยาว', value: mean, positive: true },
              { s: 'Δx', unit: 'cm', d: 'ความคลาดเคลื่อนสูงสุด', value: err, positive: true }],
      sol: {
        analyze: 'การวัดจริงย่อมมี<b>ความคลาดเคลื่อน</b>เสมอ วัดซ้ำหลายครั้งจึงได้ค่าไม่เท่ากันทุกครั้ง<br>' +
          'วิธีจัดการมาตรฐานคือ<b>วัดซ้ำหลาย ๆ ครั้งแล้วหาค่าเฉลี่ย</b> ' +
          'เพราะความคลาดเคลื่อนแบบสุ่มจะหักล้างกันไปเอง ทำให้ค่าเฉลี่ยใกล้ค่าจริงมากที่สุด<br>' +
          '<b>ความคลาดเคลื่อนสูงสุด</b> ดูจากค่าที่<b>เบี่ยงเบนจากค่าเฉลี่ยมากที่สุด</b><br>' +
          'ค่ามากสุดที่วัดได้ = ' + fmt(base + 2 * d) + ' cm และค่าน้อยสุด = ' + fmt(base - 2 * d) + ' cm',
        eqs: [{ eq: 'x̄ = Σx / n', why: 'ค่าเฉลี่ยเลขคณิต = ผลรวมของค่าที่วัดได้ หารด้วยจำนวนครั้งที่วัด' },
               { eq: 'Δx = |x_{มากสุด} - x̄|', why: 'ความคลาดเคลื่อนสูงสุด คือระยะห่างจากค่าเฉลี่ยที่ไกลที่สุด' }],
        solve: EQ('x̄ = Σx / n', 'Δx = x_{มากสุด} - x̄'),
        subst: SEQ('x̄ = {s} / 5', { s: raw.reduce((s, x) => s + x, 0) }) +
               SEQ('Δx = {mx} - {mn}', { mx: base + 2 * d, mn: mean }),
        calc: EQ('x̄ = ' + fmtq(mean) + ' `cm`', 'Δx = ' + fmtq(err) + ' `cm`'),
        conclude: 'ดังนั้นควรรายงานผลเป็น <b>(' + fmt(mean) + ' ± ' + fmt(err) + ') เซนติเมตร</b><br>' +
          '<span class="hint">อ่านความหมายว่า ความยาวจริงน่าจะอยู่ระหว่าง ' + fmt(mean - err) +
          ' ถึง ' + fmt(mean + err) + ' เซนติเมตร<br>' +
          '<b>ข้อคิด:</b> การเขียนคำตอบทางฟิสิกส์ที่สมบูรณ์ต้องมีครบ 3 ส่วน คือ ' +
          '<b>ตัวเลข ± ความคลาดเคลื่อน และหน่วย</b> การตอบแค่ตัวเลขเปล่า ๆ ถือว่ายังไม่สมบูรณ์</span>'
      }
    };
  }
});

T({
  id: 'u-density', topic: 4, sub: 'การวัดและความหนาแน่น', level: 'ปานกลาง',
  skills: ['ปริมาณอนุพัทธ์', 'การแปลงหน่วยผสม'],
  gen(R) {
    const rho = R.pick([0.8, 1.2, 2.5, 2.7, 7.8, 8.9, 11.3, 13.6]);
    const V = R.pick([20, 25, 40, 50, 80, 100, 200]);
    const m = r2(rho * V);
    const rhoSI = r2(rho * 1000);
    if (!ok2(m, rho, rhoSI) || m > 5000) return null;
    return {
      stem: 'ชั่งมวลของก้อนโลหะได้ ' + U(m, 'g') + ' และวัดปริมาตรโดยการแทนที่น้ำได้ ' +
        U(V, 'cm³') + ' จงหา<b>ความหนาแน่นของโลหะ</b>ในหน่วย ' + M('`g/cm`^3') +
        ' และเปลี่ยนให้อยู่ในหน่วยฐานของระบบ SI คือ ' + M('`kg/m`^3'),
      given: [{ s: 'm', v: m, unit: 'g', d: 'มวลที่ชั่งได้' },
              { s: 'V', v: V, unit: 'cm³', d: 'ปริมาตรที่วัดได้' }],
      finds: [{ s: 'ρ', unit: 'g/cm³', d: 'ความหนาแน่นในหน่วยที่ใช้ในห้องปฏิบัติการ', value: rho, positive: true },
              { s: 'ρ_{SI}', unit: 'kg/m³', d: 'ความหนาแน่นในหน่วยฐาน SI', value: rhoSI, positive: true }],
      sol: {
        analyze: '<b>ความหนาแน่น</b> เป็น<b>ปริมาณอนุพัทธ์</b> คือปริมาณที่นิยามขึ้นจากปริมาณฐานอื่น ' +
          '(มวลกับความยาว) ไม่ได้วัดได้โดยตรงจากเครื่องมือเดียว<br>' +
          'ความหมายคือ <b>มวลต่อหนึ่งหน่วยปริมาตร</b> บอกว่าเนื้อสารอัดกันแน่นแค่ไหน<br>' +
          '<b>จุดที่นักเรียนพลาดบ่อย:</b> การแปลงหน่วยปริมาตร เพราะเป็นหน่วยยกกำลังสาม<br>' +
          M('1 `m` = 100 `cm`') + ' ⇒ ' + M('1 `m`^3 = 100^3 `cm`^3 = 10^6 `cm`^3') +
          ' <b>ไม่ใช่ 100 เท่า</b>',
        eqs: [{ eq: 'ρ = m / V', why: 'นิยามของความหนาแน่น = มวล หารด้วย ปริมาตร' },
               { eq: '1 `g/cm`^3 = 1000 `kg/m`^3',
                 why: 'มาจาก (10^{-3} kg) / (10^{-6} m³) = 10^3 kg/m³ — กรัมหารด้วย 10³ แต่ cm³ หารด้วย 10⁶' }],
        solve: EQ('ρ = m / V', 'ρ_{SI} = ρ × 1000'),
        subst: SEQ('ρ = {m} / {V}', { m: m, V: V }) + SEQ('ρ_{SI} = ({r}) × 1000', { r: rho }),
        calc: EQ('ρ = ' + fmtq(rho) + ' `g/cm`^3', 'ρ_{SI} = ' + fmtq(rhoSI) + ' `kg/m`^3'),
        conclude: 'ดังนั้น <b>ความหนาแน่นของโลหะ = ' + U(rho, 'g/cm³') + ' หรือ ' +
          U(rhoSI, 'kg/m³') + '</b><br>' +
          '<span class="hint"><b>เทียบกับน้ำ:</b> น้ำมีความหนาแน่น 1 g/cm³ (= 1000 kg/m³) ' +
          'โลหะก้อนนี้จึงหนาแน่นเป็น ' + fmt(r2(rho)) + ' เท่าของน้ำ และย่อม<b>' +
          (rho > 1 ? 'จมน้ำ' : 'ลอยน้ำ') + '</b><br>' +
          'ค่าอ้างอิงที่ควรรู้: อะลูมิเนียม 2.7 · เหล็ก 7.8 · ตะกั่ว 11.3 · ปรอท 13.6 g/cm³</span>'
      }
    };
  }
});

T({
  id: 'u-dvel', topic: 4, sub: 'การลบเวกเตอร์', level: 'ปานกลาง',
  skills: ['การเปลี่ยนแปลงของเวกเตอร์', 'ความเร่งเฉลี่ยแบบเวกเตอร์'],
  gen(R) {
    const k = R.pick([1, 2, 3, 4, 5]);
    const v1 = 3 * k, v2 = 4 * k, dv = 5 * k;
    const t = R.pick([2, 4, 5, 10]);
    const a = r2(dv / t);
    if (!ok2(a) || a < 0.01) return null;
    const car = R.pick(CARS);
    return {
      stem: esc(car) + 'คันหนึ่งกำลังแล่นไปทาง<b>ทิศตะวันออก</b>ด้วยความเร็ว ' + U(v1, 'm/s') +
        ' ต่อมาเลี้ยวจนแล่นไปทาง<b>ทิศเหนือ</b>ด้วยความเร็ว ' + U(v2, 'm/s') +
        ' โดยใช้เวลาในการเลี้ยว ' + U(t, 's') +
        ' จงหา<b>ขนาดของความเร็วที่เปลี่ยนไป</b> และ<b>ขนาดของความเร่งเฉลี่ย</b>',
      figure: figForcesPoint({ forces: [
        { deg: 0, label: 'v₁ = ' + fmt(v1) + ' m/s', len: 56 },
        { deg: 90, label: 'v₂ = ' + fmt(v2) + ' m/s', len: 70 }] }),
      given: [{ s: 'v_1', v: v1, unit: 'm/s', d: 'ความเร็วต้น ทิศตะวันออก' },
              { s: 'v_2', v: v2, unit: 'm/s', d: 'ความเร็วปลาย ทิศเหนือ' },
              { s: 't', v: t, unit: 's', d: 'เวลาที่ใช้เลี้ยว' }],
      finds: [{ s: 'Δv', unit: 'm/s', d: 'ขนาดของความเร็วที่เปลี่ยนไป', value: dv, positive: true },
              { s: 'a', unit: 'm/s²', d: 'ขนาดของความเร่งเฉลี่ย', value: a, positive: true }],
      sol: {
        analyze: '<b>กับดักของข้อนี้</b> คือหลายคนตอบว่าความเร็วเปลี่ยนไป ' +
          M(fmt(v2) + ' - ' + fmt(v1) + ' = ' + fmt(v2 - v1)) + ' m/s ซึ่ง<b>ผิด</b> ' +
          'เพราะความเร็วเป็น<b>เวกเตอร์</b> และทิศทางเปลี่ยนไปด้วย<br>' +
          'ความเร็วที่เปลี่ยนไปนิยามว่า ' + M('Δv⃗ = v⃗_2 - v⃗_1') + ' ซึ่งคือการ<b>ลบเวกเตอร์</b><br>' +
          '<b>เทคนิคการลบเวกเตอร์:</b> ' + M('v⃗_2 - v⃗_1 = v⃗_2 + (-v⃗_1)') +
          ' คือกลับทิศของตัวลบแล้วนำมาบวกแบบเวกเตอร์ตามปกติ<br>' +
          'ข้อนี้ ' + M('v⃗_2') + ' ชี้ไปทางเหนือ ส่วน ' + M('-v⃗_1') +
          ' ชี้ไปทางตะวันตก ทั้งสองยัง<b>ตั้งฉากกัน</b> จึงใช้พีทาโกรัสได้',
        eqs: [{ eq: 'Δv = √(v_1^2 + v_2^2)', why: 'เวกเตอร์ทั้งสองตั้งฉากกัน ขนาดของผลลบจึงหาด้วยพีทาโกรัส' },
               { eq: 'a = Δv / t', why: 'นิยามความเร่งเฉลี่ย = ความเร็วที่เปลี่ยนไป (เวกเตอร์) หารด้วยเวลา' }],
        solve: EQ('Δv = √(v_1^2 + v_2^2)', 'a = Δv / t'),
        subst: SEQ('Δv = √({a}^2 + {b}^2)', { a: v1, b: v2 }) + SEQ('a = Δv / {t}', { t: t }),
        calc: EQ('Δv = √(' + fmtq(v1 * v1) + ' + ' + fmtq(v2 * v2) + ') = ' + fmtq(dv) + ' `m/s`',
                 'a = ' + fmtq(dv) + ' / ' + fmtq(t) + ' = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>ความเร็วเปลี่ยนไป ' + U(dv, 'm/s') + '</b> และ ' +
          '<b>ความเร่งเฉลี่ยมีขนาด ' + U(a, 'm/s²') + '</b><br>' +
          '<span class="hint"><b>บทเรียนสำคัญ:</b> วัตถุที่แล่นด้วย<b>อัตราเร็วคงที่</b>แต่<b>เลี้ยว</b> ' +
          'ก็ถือว่า<b>มีความเร่ง</b> เพราะทิศของความเร็วเปลี่ยน<br>' +
          'แนวคิดนี้เองที่นำไปสู่เรื่องความเร่งสู่ศูนย์กลางของการเคลื่อนที่แบบวงกลมในบทที่ 7</span>'
      }
    };
  }
});

/* สามเหลี่ยมที่มีมุม 60° หรือ 120° แล้วด้านเป็นจำนวนเต็ม — ใช้ฝึกกฎของโคไซน์ */
const VCOS = [
  { a: 3, b: 5,  deg: 60,  r: 7 },  { a: 7, b: 8,  deg: 60,  r: 13 },
  { a: 5, b: 16, deg: 60,  r: 19 }, { a: 3, b: 8,  deg: 120, r: 7 },
  { a: 5, b: 8,  deg: 120, r: 7 },  { a: 7, b: 15, deg: 120, r: 13 }
];

T({
  id: 'u-veccos', topic: 4, sub: 'กฎของโคไซน์กับเวกเตอร์', level: 'ยาก',
  skills: ['รวมเวกเตอร์ที่ทำมุมใด ๆ', 'กฎของโคไซน์'],
  gen(R) {
    const c = R.pick(VCOS), k = R.pick([1, 2, 3, 5, 10]);
    const a = c.a * k, b = c.b * k, Rm = c.r * k;
    const cosv = c.deg === 60 ? 0.5 : -0.5;
    return {
      stem: 'แรงสองแรงกระทำที่จุดเดียวกัน ขนาด ' + U(a, 'N') + ' และ ' + U(b, 'N') +
        ' โดย<b>ทำมุม ' + fmt(c.deg) + '° ต่อกัน</b> จงหา<b>ขนาดของแรงลัพธ์</b>',
      figure: figForcesPoint({ forces: [
        { deg: 0, label: 'F₁ = ' + fmt(a) + ' N', len: 60 },
        { deg: c.deg, label: 'F₂ = ' + fmt(b) + ' N', len: 78 }] }),
      given: [{ s: 'F_1', v: a, unit: 'N', d: 'แรงที่หนึ่ง' },
              { s: 'F_2', v: b, unit: 'N', d: 'แรงที่สอง' },
              { s: 'α', v: c.deg, unit: '°', d: 'มุมระหว่างแรงทั้งสอง' }],
      finds: [{ s: 'R', unit: 'N', d: 'ขนาดของแรงลัพธ์', value: Rm, positive: true }],
      sol: {
        analyze: 'แรงสองแรงทำมุมกันแบบไม่ตั้งฉาก จะใช้พีทาโกรัสไม่ได้ ต้องใช้<b>กฎของโคไซน์</b><br>' +
          'นำเวกเตอร์มาต่อแบบ<b>หัวต่อหาง</b> จะได้รูปสามเหลี่ยม โดยลัพธ์คือด้านปิดรูป<br>' +
          '<b>จุดที่ต้องระวังที่สุด:</b> มุม ' + M('α') + ' ในสูตรคือ<b>มุมระหว่างเวกเตอร์ทั้งสอง' +
          'เมื่อลากออกจากจุดเดียวกัน</b> (แบบหางต่อหาง) ไม่ใช่มุมภายในรูปสามเหลี่ยม<br>' +
          'ค่าที่ใช้: ' + M('cos ' + c.deg + '° = ' + fmtq(cosv)) +
          (c.deg === 120 ? ' — <b>ติดลบ</b> เพราะเป็นมุมป้าน ทำให้ลัพธ์เล็กลง' : ''),
        eqs: [{ eq: 'R = √(F_1^2 + F_2^2 + 2 F_1 F_2 cos α)',
                why: 'กฎของโคไซน์สำหรับการรวมเวกเตอร์ — ถ้า α = 90° พจน์สุดท้ายเป็นศูนย์ จะย้อนกลับเป็นพีทาโกรัสพอดี' }],
        solve: EQ('R^2 = F_1^2 + F_2^2 + 2 F_1 F_2 cos α', 'R = √(F_1^2 + F_2^2 + 2 F_1 F_2 cos α)'),
        subst: SEQ('R = √({a}^2 + {b}^2 + 2({a})({b})({c}))', { a: a, b: b, c: cosv }),
        calc: EQ('R = √(' + fmtq(a * a) + ' + ' + fmtq(b * b) + ' + ' + fmtq(r2(2 * a * b * cosv)) + ')',
                 'R = √' + fmtq(Rm * Rm) + ' = ' + fmtq(Rm) + ' `N`'),
        conclude: 'ดังนั้น <b>แรงลัพธ์มีขนาด ' + U(Rm, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยช่วงที่เป็นไปได้:</b> ลัพธ์ต้องอยู่ระหว่าง ' +
          U(Math.abs(a - b), 'N') + ' ถึง ' + U(a + b, 'N') + ' — ค่า ' + fmt(Rm) + ' N อยู่ในช่วงนี้ ✓<br>' +
          '<b>จำไว้ใช้ในห้องสอบ:</b> มุมแคบ (< 90°) ลัพธ์จะโตกว่าแนวตั้งฉาก · ' +
          'มุมป้าน (> 90°) ลัพธ์จะเล็กกว่า เพราะ cos ติดลบ</span>'
      }
    };
  }
});

T({
  id: 'u-vec3', topic: 4, sub: 'รวมเวกเตอร์หลายตัวด้วยองค์ประกอบ', level: 'ยาก',
  skills: ['แยกองค์ประกอบทุกเวกเตอร์', 'รวมทีละแกนแล้วหาลัพธ์'],
  gen(R) {
    const k = R.pick([1, 2, 3, 4]);
    const shapeA = R.f() < 0.5;
    // ออกแบบให้องค์ประกอบลัพธ์ลงตัวเป็นสามเหลี่ยม 3-4-5 เสมอ
    const F1 = (shapeA ? 5 : 20) * k;              // ตามแกน +x
    const F2 = 25 * k;                             // ทำมุมกับแกน +x
    const deg2 = shapeA ? 53 : 37;
    const F3 = (shapeA ? 5 : 15) * k;              // ตามแกน y
    const up3 = !shapeA;                           // shape A ชี้ลง, shape B ชี้ขึ้น
    const Rx = r2(F1 + F2 * cosD(deg2));
    const Ry = r2(F2 * sinD(deg2) + (up3 ? F3 : -F3));
    const Rm = r2(Math.sqrt(Rx * Rx + Ry * Ry));
    if (!ok2(Rx, Ry, Rm) || Ry <= 0 || Rx <= 0) return null;
    const deg = 37;                                // ลัพธ์ (4k,3k) ⇒ tanθ = 0.75
    return {
      stem: 'แรงสามแรงกระทำที่จุดเดียวกันบนวัตถุ ดังนี้<br>' +
        '• ' + M('F_1') + ' ขนาด ' + U(F1, 'N') + ' มีทิศไปตาม<b>แกน ' + M('x') + ' ทางบวก</b><br>' +
        '• ' + M('F_2') + ' ขนาด ' + U(F2, 'N') + ' ทำมุม <b>' + fmt(deg2) + '°</b> กับแกน ' + M('x') + ' ทางบวก<br>' +
        '• ' + M('F_3') + ' ขนาด ' + U(F3, 'N') + ' มีทิศ<b>' + (up3 ? 'ขึ้นตามแกน y ทางบวก' : 'ลงตามแกน y ทางลบ') + '</b><br>' +
        'จงหา<b>ขนาดของแรงลัพธ์</b> และ<b>มุมที่แรงลัพธ์ทำกับแกน ' + M('x') + '</b>',
      figure: figForcesPoint({ forces: [
        { deg: 0, label: 'F₁', len: 52 }, { deg: deg2, label: 'F₂', len: 78 },
        { deg: up3 ? 90 : 270, label: 'F₃', len: 52 }] }),
      given: [{ s: 'F_1', v: F1, unit: 'N', d: 'ตามแกน x ทางบวก' },
              { s: 'F_2', v: F2, unit: 'N', d: 'ทำมุม ' + fmt(deg2) + '° กับแกน x' },
              { s: 'F_3', v: F3, unit: 'N', d: up3 ? 'ตามแกน y ทางบวก' : 'ตามแกน y ทางลบ' }],
      finds: [{ s: 'R', unit: 'N', d: 'ขนาดของแรงลัพธ์', value: Rm, positive: true },
              { s: 'θ', unit: '°', d: 'มุมที่ลัพธ์ทำกับแกน x', value: deg, positive: true }],
      sol: {
        analyze: 'เวกเตอร์ตั้งแต่ 3 ตัวขึ้นไป การวาดรูปต่อกันจะยุ่งและอ่านค่ายาก ' +
          'วิธีมาตรฐานคือ<b>แยกทุกเวกเตอร์ลงบนแกน x และ y</b> แล้วรวมทีละแกน<br>' +
          '<b>ขั้นตอนที่ใช้ได้กับทุกข้อ</b><br>' +
          '1. แยกทุกแรงเป็น ' + M('F cos θ') + ' (แกน x) และ ' + M('F sin θ') + ' (แกน y)<br>' +
          '2. บวกแบบมีเครื่องหมาย ได้ ' + M('ΣF_x') + ' และ ' + M('ΣF_y') + '<br>' +
          '3. รวมสองแกนที่ตั้งฉากกันด้วยพีทาโกรัส และหาทิศด้วยแทนเจนต์<br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg2 + '° = ' + fmtq(sinD(deg2)) + ', cos ' + deg2 + '° = ' + fmtq(cosD(deg2))),
        eqs: [{ eq: 'ΣF_x = F_1 + F_2 cos θ_2', why: 'F₃ อยู่ในแนวแกน y ล้วน จึงไม่มีองค์ประกอบในแกน x' },
               { eq: 'ΣF_y = F_2 sin θ_2 ' + (up3 ? '+' : '-') + ' F_3',
                 why: 'F₁ อยู่ในแนวแกน x ล้วน จึงไม่มีองค์ประกอบในแกน y ส่วน F₃ ใส่เครื่องหมายตามทิศ' },
               { eq: 'R = √((ΣF_x)^2 + (ΣF_y)^2)', why: 'ผลรวมสองแกนตั้งฉากกันเสมอ จึงใช้พีทาโกรัสได้' }],
        solve: EQ('ΣF_x = F_1 + F_2 cos θ_2', 'ΣF_y = F_2 sin θ_2 ' + (up3 ? '+' : '-') + ' F_3',
                  'R = √((ΣF_x)^2 + (ΣF_y)^2)', 'tan θ = ΣF_y / ΣF_x'),
        subst: SEQ('ΣF_x = {a} + ({b})({c})', { a: F1, b: F2, c: cosD(deg2) }) +
               SEQ('ΣF_y = ({b})({s}) ' + (up3 ? '+' : '-') + ' {c}', { b: F2, s: sinD(deg2), c: F3 }) +
               SEQ('R = √({x}^2 + {y}^2)', { x: Rx, y: Ry }),
        calc: EQ('ΣF_x = ' + fmtq(Rx) + ' `N`', 'ΣF_y = ' + fmtq(Ry) + ' `N`',
                 'R = √(' + fmtq(r2(Rx * Rx)) + ' + ' + fmtq(r2(Ry * Ry)) + ') = ' + fmtq(Rm) + ' `N`',
                 'tan θ = ' + fmtq(r2(Ry / Rx)) + '  ⇒  θ = ' + fmt(deg) + '°'),
        conclude: 'ดังนั้น <b>แรงลัพธ์มีขนาด ' + U(Rm, 'N') + ' ทำมุม ' + fmt(deg) +

T({
  id: 'e-wet', topic: 5, sub: 'ทฤษฎีบทงาน-พลังงานจลน์', level: 'ปานกลาง',
  skills: ['งานลัพธ์เท่ากับพลังงานจลน์ที่เปลี่ยนไป', 'หาความเร็วปลายโดยไม่ใช้สมการการเคลื่อนที่'],
  gen(R) {
    const m = R.pick([2, 4, 5, 10]), u = R.pick([2, 3, 4, 5]), v = u + R.pick([2, 3, 4, 5]);
    const s = R.pick([2, 4, 5, 8, 10]);
    const dKE = r2(0.5 * m * (v * v - u * u));
    const F = r2(dKE / s);
    if (!ok2(dKE, F) || F < 0.1 || F > 500) return null;
    const car = R.pick(CARS);
    return {
      stem: esc(car) + 'มวล ' + U(m, 'kg') + ' กำลังเคลื่อนที่ด้วยความเร็ว ' + U(u, 'm/s') +
        ' บนพื้นราบ<b>ลื่น</b> ต่อมามีแรงคงที่ ' + U(F, 'N') +
        ' กระทำ<b>ในทิศเดียวกับการเคลื่อนที่</b>เป็นระยะ ' + U(s, 'm') +
        ' จงหา<b>งานที่แรงนี้ทำ</b> และ<b>ความเร็วปลาย</b>ของ' + esc(car),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'u', v: u, unit: 'm/s', d: 'ความเร็วต้น' },
              { s: 'F', v: F, unit: 'N', d: 'แรงที่กระทำ ทิศเดียวกับการเคลื่อนที่' },
              { s: 's', v: s, unit: 'm', d: 'ระยะที่แรงกระทำ' }],
      finds: [{ s: 'W', unit: 'J', d: 'งานของแรงลัพธ์', value: dKE, positive: true },
              { s: 'v', unit: 'm/s', d: 'ความเร็วปลาย', value: v, positive: true }],
      sol: {
        analyze: 'ข้อนี้แก้ได้สองทาง คือใช้สมการการเคลื่อนที่ (' + M('v^2 = u^2 + 2 a s') +
          ') หรือใช้<b>ทฤษฎีบทงาน-พลังงานจลน์</b><br>' +
          'ทางที่สองสั้นกว่า เพราะ<b>ไม่ต้องหาความเร่งเลย</b><br>' +
          '<b>ทฤษฎีบทงาน-พลังงานจลน์</b> กล่าวว่า งานของแรงลัพธ์ที่กระทำต่อวัตถุ ' +
          'จะเท่ากับ<b>พลังงานจลน์ที่เปลี่ยนไป</b>พอดี<br>' +
          'พื้นลื่นและแรงอยู่ในแนวเดียวกับการเคลื่อนที่ ' + M('F') + ' จึงเป็นแรงลัพธ์ในแนวราบ',
        eqs: [{ eq: 'W_{ลัพธ์} = F s', why: 'พื้นลื่น ไม่มีแรงเสียดทานมาหักออก งานของ F จึงเป็นงานลัพธ์ทั้งหมด' },
               { eq: 'W_{ลัพธ์} = ΔE_k = (1/2) m v^2 - (1/2) m u^2',
                 why: 'ทฤษฎีบทงาน-พลังงานจลน์ — งานลัพธ์ไปไหนไม่ได้ นอกจากเปลี่ยนเป็นพลังงานจลน์' }],
        solve: EQ('W = F s', '(1/2) m v^2 = W + (1/2) m u^2', 'v = √( (2W / m) + u^2 )'),
        subst: SEQ('W = ({F})({s})', { F: F, s: s }) +
               SEQ('v = √( (2 × {W}) / {m} + {u}^2 )', { W: dKE, m: m, u: u }),
        calc: EQ('W = ' + fmtq(dKE) + ' `J`',
                 'v = √( ' + fmtq(r2(2 * dKE / m)) + ' + ' + fmtq(u * u) + ' )',
                 'v = √' + fmtq(v * v) + ' = ' + fmtq(v) + ' `m/s`'),
        conclude: 'ดังนั้น <b>งานที่แรงทำ = ' + U(dKE, 'J') + '</b> และ ' +
          '<b>ความเร็วปลาย = ' + U(v, 'm/s') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยวิธีเดิม:</b> ' +
          M('a = F/m = ' + fmtq(r2(F / m))) + ' m/s² แล้วใช้ ' + M('v^2 = u^2 + 2as') +
          ' จะได้ ' + fmt(v) + ' m/s เท่ากัน ✓<br>' +
          '<b>ข้อดีของวิธีพลังงาน:</b> ใช้ได้แม้แรงจะไม่คงที่ หรือเส้นทางจะโค้งไปมา ' +
          'ขอเพียงรู้งานรวมกับพลังงานจลน์ต้น-ปลายเท่านั้น</span>'
      }
    };
  }
});

T({
  id: 'e-cons', topic: 5, sub: 'การอนุรักษ์พลังงานกล', level: 'ปานกลาง',
  skills: ['พลังงานกลรวมคงที่เมื่อไม่มีแรงเสียดทาน', 'แปลง Ep เป็น Ek'],
  gen(R, c) {
    const g = c.g, k = R.pick([1, 2, 3, 4]);
    const v = 7 * k;
    const h = r2(v * v / (2 * g));
    const m = R.pick([0.5, 1, 2, 4, 5]);
    const Ep = r2(m * g * h);
    if (!ok2(h, Ep) || h < 0.5 || Ep > 5000) return null;
    const ball = R.pick(BALLS);
    return {
      stem: 'ปล่อย' + esc(ball) + 'มวล ' + U(m, 'kg') + ' จาก<b>หยุดนิ่ง</b> ที่ยอดรางโค้ง<b>ลื่น</b> ' +
        'ซึ่งสูงจากพื้น ' + U(h, 'm') + ' จงหา<b>พลังงานศักย์ที่ยอดราง</b> และ<b>อัตราเร็วเมื่อถึงเชิงราง</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'h', v: h, unit: 'm', d: 'ความสูงของยอดราง' },
              { s: 'u', v: 0, unit: 'm/s', d: 'ปล่อยจากหยุดนิ่ง' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'E_p', unit: 'J', d: 'พลังงานศักย์ที่ยอดราง', value: Ep, positive: true },
              { s: 'v', unit: 'm/s', d: 'อัตราเร็วที่เชิงราง', value: v, positive: true }],
      sol: {
        analyze: 'รางโค้ง<b>ลื่น</b> แปลว่า<b>ไม่มีแรงเสียดทาน</b> จึงไม่มีพลังงานสูญเสียไปเป็นความร้อน<br>' +
          '<b>พลังงานกลรวม</b> (' + M('E_p + E_k') + ') จึง<b>คงที่ตลอดการเคลื่อนที่</b> ' +
          'นี่คือ<b>กฎการอนุรักษ์พลังงานกล</b><br>' +
          '• ที่<b>ยอดราง</b>: อยู่นิ่ง ⇒ ' + M('E_k = 0') + ' มีแต่ ' + M('E_p') + ' เต็มที่<br>' +
          '• ที่<b>เชิงราง</b>: ' + M('h = 0') + ' ⇒ ' + M('E_p = 0') + ' มีแต่ ' + M('E_k') + ' เต็มที่<br>' +
          '<b>ข้อสังเกตสำคัญ:</b> ' + M('m') + ' จะตัดกันทั้งสองข้าง — ' +
          'ความเร็วที่เชิงราง<b>ไม่ขึ้นกับมวล</b>เลย และ<b>ไม่ขึ้นกับรูปร่างของราง</b>ด้วย ' +
          'ขอเพียงรางลื่นและรู้ความสูงเท่านั้น',
        eqs: [{ eq: 'E_p = m g h', why: 'พลังงานศักย์ที่ยอดราง โดยใช้เชิงรางเป็นระดับอ้างอิง' },
               { eq: 'E_{p,ยอด} + E_{k,ยอด} = E_{p,เชิง} + E_{k,เชิง}',
                 why: 'กฎการอนุรักษ์พลังงานกล ใช้ได้เพราะไม่มีแรงเสียดทาน' },
               { eq: 'm g h = (1/2) m v^2', why: 'แทน Ek ที่ยอด = 0 และ Ep ที่เชิง = 0 ลงไป' }],
        solve: EQ('E_p = m g h', 'm g h = (1/2) m v^2', 'g h = (1/2) v^2', 'v = √(2 g h)'),
        subst: SEQ('E_p = ({m})({g})({h})', { m: m, g: g, h: h }) +
               SEQ('v = √(2 × {g} × {h})', { g: g, h: h }),
        calc: EQ('E_p = ' + fmtq(Ep) + ' `J`',
                 'v = √' + fmtq(r2(2 * g * h)) + ' = ' + fmtq(v) + ' `m/s`'),
        conclude: 'ดังนั้น <b>พลังงานศักย์ที่ยอดราง = ' + U(Ep, 'J') + '</b> และ ' +
          '<b>อัตราเร็วที่เชิงราง = ' + U(v, 'm/s') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> ' + M('E_k = (1/2)(' + fmt(m) + ')(' + fmt(v * v) + ') = ' + fmt(Ep)) +
          ' J ซึ่งเท่ากับ ' + M('E_p') + ' ที่ยอดพอดี ✓ พลังงานถูกแปลงครบไม่หายไปไหน<br>' +
          '<b>ประเด็นที่ออกสอบบ่อย:</b> สูตร ' + M('v = √(2gh)') +
          ' เหมือนกับการตกอิสระเป๊ะ ๆ — ปล่อยลงรางลื่นกับปล่อยตกตรง ๆ ได้อัตราเร็วปลายเท่ากัน ' +
          'ต่างกันแค่<b>ทิศทาง</b>และ<b>เวลาที่ใช้</b></span>'
      }
    };
  }
});

T({
  id: 'e-spring', topic: 5, sub: 'พลังงานศักย์ยืดหยุ่น', level: 'ปานกลาง',
  skills: ['กฎของฮุก', 'พลังงานสะสมในสปริง'],
  gen(R) {
    const k = R.pick([100, 200, 400, 500, 800, 1000]);
    const x = R.pick([0.1, 0.2, 0.25, 0.3, 0.4, 0.5]);
    const F = r2(k * x), Ep = r2(0.5 * k * x * x);
    if (!ok2(F, Ep) || Ep > 2000) return null;
    return {
      stem: 'สปริงตัวหนึ่งมี<b>ค่านิจสปริง</b> ' + U(k, 'N/m') + ' ถูก<b>กดให้สั้นลงจากความยาวธรรมชาติ</b> ' +
        U(x, 'm') + ' จงหา<b>แรงที่สปริงดันกลับ</b> และ<b>พลังงานศักย์ยืดหยุ่นที่สะสมไว้ในสปริง</b>',
      given: [{ s: 'k', v: k, unit: 'N/m', d: 'ค่านิจสปริง' },
              { s: 'x', v: x, unit: 'm', d: 'ระยะที่กดเข้าไปจากความยาวธรรมชาติ' }],
      finds: [{ s: 'F', unit: 'N', d: 'แรงที่สปริงดันกลับ', value: F, positive: true },
              { s: 'E_p', unit: 'J', d: 'พลังงานศักย์ยืดหยุ่น', value: Ep, positive: true }],
      sol: {
        analyze: '<b>ค่านิจสปริง</b> ' + M('k') + ' บอกความ "แข็ง" ของสปริง — ' +
          'ค่ายิ่งมาก ยิ่งต้องใช้แรงมากในการกดหรือดึงให้ยืดเท่าเดิม<br>' +
          '<b>กฎของฮุก:</b> แรงของสปริงแปรผันตรงกับระยะที่ผิดจากความยาวธรรมชาติ ' + M('F = k x') + '<br>' +
          '<b>จุดที่ต้องเข้าใจให้ลึก:</b> เพราะแรงสปริง<b>ไม่คงที่</b> (เริ่มจาก 0 แล้วค่อย ๆ เพิ่มถึง ' +
          M('kx') + ') จะใช้ ' + M('W = F x') + ' ตรง ๆ ไม่ได้<br>' +
          'ต้องใช้<b>แรงเฉลี่ย</b> ' + M('(0 + kx)/2 = kx/2') + ' คูณระยะ ' + M('x') + ' จึงได้ ' +
          M('(1/2) k x^2') + ' — ซึ่งก็คือ<b>พื้นที่ใต้กราฟ F กับ x</b> (รูปสามเหลี่ยม) นั่นเอง',
        eqs: [{ eq: 'F = k x', why: 'กฎของฮุก — แรงสปริงแปรผันตรงกับระยะยืดหรือหด' },
               { eq: 'E_p = (1/2) k x^2', why: 'พื้นที่ใต้กราฟ F–x ซึ่งเป็นสามเหลี่ยมฐาน x สูง kx' }],
        solve: EQ('F = k x', 'E_p = (1/2) k x^2'),
        subst: SEQ('F = ({k})({x})', { k: k, x: x }) + SEQ('E_p = (1/2)({k})({x})^2', { k: k, x: x }),
        calc: EQ('F = ' + fmtq(F) + ' `N`',
                 'E_p = (1/2)(' + fmtq(k) + ')(' + fmtq(r2(x * x)) + ') = ' + fmtq(Ep) + ' `J`'),
        conclude: 'ดังนั้น <b>สปริงดันกลับด้วยแรง ' + U(F, 'N') + '</b> และ ' +
          '<b>สะสมพลังงานศักย์ยืดหยุ่นไว้ ' + U(Ep, 'J') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยแรงเฉลี่ย:</b> ' +
          M('E_p = (F/2) × x = (' + fmt(F) + '/2)(' + fmt(x) + ') = ' + fmt(Ep)) + ' J ✓<br>' +
          '<b>กับดักข้อสอบ:</b> กดเข้าไป<b>สองเท่า</b> แรงเพิ่มเป็น 2 เท่า แต่<b>พลังงานเพิ่มเป็น 4 เท่า</b> ' +
          'เพราะ ' + M('x') + ' อยู่ในรูปกำลังสอง<br>' +
          'พลังงาน ' + U(Ep, 'J') + ' นี้พร้อมจะดีดวัตถุออกไปเป็นพลังงานจลน์ทั้งหมดเมื่อปล่อยมือ</span>'
      }
    };
  }
});

T({
  id: 'e-powerv', topic: 5, sub: 'กำลังกับความเร็ว', level: 'ปานกลาง',
  skills: ['P = Fv', 'ความเร็วคงที่แปลว่าแรงลัพธ์เป็นศูนย์'],
  gen(R) {
    const car = R.pick(CARS), f = R.step(200, 1200, 100), v = R.pick([5, 10, 12, 15, 20, 25]);
    const P = f * v, t = R.pick([10, 20, 30, 60]);
    const W = P * t;
    if (P > 40000 || W > 900000) return null;   // ค่าคำตอบต้องไม่เกิน 10⁶ ตามเกณฑ์เลขสวย
    return {
      stem: esc(car) + 'คันหนึ่งแล่นด้วย<b>ความเร็วคงที่</b> ' + U(v, 'm/s') +
        ' บนถนนราบ โดยมี<b>แรงต้านรวม</b> (แรงเสียดทานและแรงต้านอากาศ) เท่ากับ ' + U(f, 'N') +
        ' จงหา<b>กำลังของเครื่องยนต์</b> และ<b>งานที่เครื่องยนต์ทำในเวลา ' + fmt(t) + ' วินาที</b>',
      given: [{ s: 'f', v: f, unit: 'N', d: 'แรงต้านรวม' },
              { s: 'v', v: v, unit: 'm/s', d: 'ความเร็วคงที่' },
              { s: 't', v: t, unit: 's', d: 'ช่วงเวลาที่พิจารณา' }],
      finds: [{ s: 'P', unit: 'W', d: 'กำลังของเครื่องยนต์', value: P, positive: true },
              { s: 'W', unit: 'J', d: 'งานที่ทำในเวลา t', value: W, positive: true }],
      sol: {
        analyze: '<b>กุญแจของข้อนี้อยู่ที่คำว่า "ความเร็วคงที่"</b><br>' +
          'ความเร็วคงที่ ⇒ ' + M('a = 0') + ' ⇒ ' + M('ΣF = 0') +
          ' ⇒ <b>แรงขับจากเครื่องยนต์ต้องเท่ากับแรงต้านพอดี</b><br>' +
          'ดังนั้น ' + M('F_{ขับ} = f = ' + fmt(f)) + ' N<br>' +
          'ต่อมาหากำลัง — แทนที่จะหางานแล้วหารเวลา ใช้สูตรลัดที่ได้จากการแทน ' + M('W = Fs') +
          ' ลงใน ' + M('P = W/t') + ' แล้วมองว่า ' + M('s/t = v') + ' จะได้ ' + M('P = F v') + ' ทันที',
        eqs: [{ eq: 'F_{ขับ} = f', why: 'ความเร็วคงที่ ⇒ ความเร่งเป็นศูนย์ ⇒ แรงลัพธ์เป็นศูนย์' },
               { eq: 'P = F v', why: 'มาจาก P = W/t = Fs/t และ s/t คือความเร็ว v' },
               { eq: 'W = P t', why: 'ย้อนกลับจากนิยามของกำลัง เพื่อหางานในช่วงเวลาที่กำหนด' }],
        solve: EQ('P = F v', 'W = P t'),
        subst: SEQ('P = ({f})({v})', { f: f, v: v }) + SEQ('W = ({P})({t})', { P: P, t: t }),
        calc: EQ('P = ' + fmtq(P) + ' `W`', 'W = ' + fmtq(W) + ' `J`'),
        conclude: 'ดังนั้น <b>เครื่องยนต์ใช้กำลัง ' + U(P, 'W') + '</b> (≈ ' + fmt(r2(P / 1000)) +
          ' kW) และ<b>ทำงานได้ ' + U(W, 'J') + ' ในเวลา ' + fmt(t) + ' วินาที</b><br>' +
          '<span class="hint"><b>ประเด็นชวนคิด:</b> รถแล่นด้วยความเร็วคงที่ พลังงานจลน์<b>ไม่เปลี่ยน</b>เลย ' +
          'แล้วงาน ' + U(W, 'J') + ' หายไปไหน?<br>' +
          'คำตอบ: ถูกแรงเสียดทานและแรงต้านอากาศเปลี่ยนเป็น<b>ความร้อน</b>ไปหมดพอดี ' +
          'งานบวกของเครื่องยนต์กับงานลบของแรงต้านหักล้างกันสนิท งานลัพธ์จึงเป็นศูนย์ ' +
          'ซึ่งสอดคล้องกับทฤษฎีบทงาน-พลังงานจลน์ที่ว่า ' + M('ΔE_k = 0') + '</span>'
      }
    };
  }
});

T({
  id: 'e-inclinework', topic: 5, sub: 'งานบนพื้นเอียง', level: 'ปานกลาง',
  skills: ['งานต้านแรงโน้มถ่วง', 'พื้นเอียงช่วยผ่อนแรงแต่ไม่ผ่อนงาน'],
  gen(R, c) {
    const g = c.g, deg = 37, m = R.pick([2, 3, 4, 5, 10, 20]);
    const L = R.pick([5, 10, 15, 20]);
    const h = r2(L * sinD(deg));
    const F = r2(m * g * sinD(deg)), W = r2(F * L), Ep = r2(m * g * h);
    if (!ok2(h, F, W, Ep) || W > 5000) return null;
    const box = R.pick(BOXES);
    return {
      stem: 'ดัน' + esc(box) + 'มวล ' + U(m, 'kg') + ' ขึ้นพื้นเอียง<b>ลื่น</b>ที่ทำมุม ' + fmt(deg) +
        '° กับแนวราบ ด้วย<b>ความเร็วคงที่</b> โดยออกแรง<b>ขนานกับพื้นเอียง</b> ' +
        'ตลอดความยาวพื้นเอียง ' + U(L, 'm') + ' จงหา<b>แรงที่ต้องออก</b> และ<b>งานที่ทำ</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figIncline({ deg: deg, mass: 'm', down: 'mg', up: 'F' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมเอียงของพื้น' },
              { s: 'L', v: L, unit: 'm', d: 'ความยาวตามพื้นเอียง' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'F', unit: 'N', d: 'แรงที่ต้องออกขนานพื้นเอียง', value: F, positive: true },
              { s: 'W', unit: 'J', d: 'งานที่ทำ', value: W, positive: true }],
      sol: {
        analyze: 'ดันด้วย<b>ความเร็วคงที่</b> ⇒ ' + M('a = 0') + ' ⇒ แรงลัพธ์ตามพื้นเอียงเป็นศูนย์<br>' +
          'พื้นลื่น ไม่มีแรงเสียดทาน แรงที่ต้านการขึ้นเนินจึงมีเพียงองค์ประกอบของน้ำหนัก ' +
          M('m g sin θ') + '<br>' +
          'ดังนั้นแรงที่ต้องออกต้องเท่ากับ ' + M('m g sin θ') + ' พอดี<br>' +
          'ความสูงที่ยกขึ้นได้จริง ' + M('h = L sin θ = ' + fmt(L) + ' × ' + fmtq(sinD(deg)) + ' = ' + fmt(h)) + ' m<br>' +
          'ค่าที่ใช้: ' + M('sin 37° = 0.6, cos 37° = 0.8'),
        eqs: [{ eq: 'F = m g sin θ', why: 'สมดุลตามแนวพื้นเอียง เพราะดันด้วยความเร็วคงที่บนพื้นลื่น' },
               { eq: 'W = F L', why: 'แรงขนานกับพื้นเอียงและการกระจัดก็อยู่ตามพื้นเอียง จึงคูณกันได้ตรง ๆ' }],
        solve: EQ('F = m g sin θ', 'W = F L'),
        subst: SEQ('F = ({m})({g})({s})', { m: m, g: g, s: sinD(deg) }) +
               SEQ('W = ({F})({L})', { F: F, L: L }),
        calc: EQ('F = ' + fmtq(F) + ' `N`', 'W = ' + fmtq(W) + ' `J`'),
        conclude: 'ดังนั้น <b>ต้องออกแรง ' + U(F, 'N') + ' และทำงานทั้งสิ้น ' + U(W, 'J') + '</b><br>' +
          '<span class="hint"><b>บทสรุปสำคัญของพื้นเอียง — "ผ่อนแรง แต่ไม่ผ่อนงาน"</b><br>' +
          'ถ้ายกขึ้นตรง ๆ ในแนวดิ่งสูง ' + U(h, 'm') + ' ต้องออกแรงเท่ากับน้ำหนัก ' +
          U(r2(m * g), 'N') + ' ซึ่ง<b>มากกว่า</b> ' + U(F, 'N') + '<br>' +
          'แต่งานที่ทำ ' + M('m g h = ' + fmt(Ep)) + ' J ซึ่ง<b>เท่ากับ</b> ' + U(W, 'J') + ' พอดี ✓<br>' +
          'พื้นเอียงช่วยให้ออกแรงน้อยลง แลกกับการต้องดันไปเป็นระยะทางที่ยาวกว่า ' +
          'พลังงานที่ใช้จริงเท่าเดิมเสมอ</span>'
      }
    };
  }
});

T({
  id: 'e-fric', topic: 5, sub: 'พลังงานกับแรงเสียดทาน', level: 'ยาก',
  skills: ['งานของแรงเสียดทานเป็นลบ', 'พลังงานกลเปลี่ยนเป็นความร้อน'],
  gen(R, c) {
    const g = c.g, k = R.pick([1, 2]), v = 7 * k;
    const s = R.pick([5, 10, 20, 25, 40, 50]);
    const mu = r2(v * v / (2 * g * s));
    const m = R.pick([2, 4, 5, 10]);
    const Q = r2(0.5 * m * v * v), f = r2(mu * m * g);
    if (!ok2(mu, Q, f) || mu < 0.05 || mu > 0.9 || Q > 5000) return null;
    const box = R.pick(BOXES);
    return {
      stem: esc(box) + 'มวล ' + U(m, 'kg') + ' ไถลมาบนพื้นราบด้วยความเร็ว ' + U(v, 'm/s') +
        ' แล้ว<b>ค่อย ๆ ช้าลงจนหยุดสนิท</b>หลังจากไถลไปได้ ' + U(s, 'm') +
        ' จงหา<b>สัมประสิทธิ์ความเสียดทานจลน์</b>ระหว่าง' + esc(box) + 'กับพื้น ' +
        'และ<b>พลังงานที่เปลี่ยนเป็นความร้อน</b> (กำหนด ' + GTXT(g) + ')',
      figure: figChain({ masses: ['m'], Fleft: 'v = ' + fmt(v) + ' m/s' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'u', v: v, unit: 'm/s', d: 'ความเร็วต้น' },
              { s: 'v', v: 0, unit: 'm/s', d: 'ความเร็วปลาย (หยุดสนิท)' },
              { s: 's', v: s, unit: 'm', d: 'ระยะไถลจนหยุด' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'μ_k', unit: '', d: 'สัมประสิทธิ์ความเสียดทานจลน์', value: mu, positive: true },
              { s: 'Q', unit: 'J', d: 'พลังงานที่เปลี่ยนเป็นความร้อน', value: Q, positive: true }],
      sol: {
        analyze: 'มีแรงเสียดทานเข้ามาเกี่ยว <b>พลังงานกลจึงไม่คงที่</b> ' +
          'ใช้กฎการอนุรักษ์พลังงานกลตรง ๆ ไม่ได้ ต้องใช้<b>ทฤษฎีบทงาน-พลังงานจลน์</b>แทน<br>' +
          'พื้นราบ ⇒ ความสูงไม่เปลี่ยน ⇒ ' + M('ΔE_p = 0') + ' คิดเฉพาะพลังงานจลน์อย่างเดียว<br>' +
          'แรงเดียวที่ทำงานในแนวราบคือ<b>แรงเสียดทาน</b> ซึ่งมีทิศ<b>ตรงข้าม</b>การเคลื่อนที่ ' +
          'งานของมันจึง<b>เป็นลบ</b> (' + M('cos 180° = -1') + ')<br>' +
          'บนพื้นราบ แรงตั้งฉาก ' + M('N = m g') + ' ⇒ แรงเสียดทาน ' + M('f = μ_k m g') + '<br>' +
          '<b>ข้อสังเกต:</b> ' + M('m') + ' จะตัดกันหมดเมื่อหา ' + M('μ_k') +
          ' — ระยะไถลจนหยุด<b>ไม่ขึ้นกับมวล</b>',
        eqs: [{ eq: 'W_{เสียดทาน} = ΔE_k', why: 'ทฤษฎีบทงาน-พลังงานจลน์ โดยแรงเสียดทานเป็นแรงลัพธ์เพียงแรงเดียวในแนวราบ' },
               { eq: '-μ_k m g s = 0 - (1/2) m u^2', why: 'งานของแรงเสียดทานเป็นลบ ส่วนพลังงานจลน์ปลายเป็นศูนย์เพราะหยุดสนิท' },
               { eq: 'Q = f s = (1/2) m u^2', why: 'พลังงานจลน์ที่หายไปไม่ได้สูญหาย แต่กลายเป็นความร้อนที่ผิวสัมผัสทั้งหมด' }],
        solve: EQ('μ_k m g s = (1/2) m u^2', 'μ_k g s = (1/2) u^2', 'μ_k = u^2 / (2 g s)') +
          '<div>ส่วนความร้อนหาได้จากพลังงานจลน์ที่หายไปทั้งก้อน</div>' + EQ('Q = (1/2) m u^2'),
        subst: SEQ('μ_k = {u}^2 / (2 × {g} × {s})', { u: v, g: g, s: s }) +
               SEQ('Q = (1/2)({m})({u})^2', { m: m, u: v }),
        calc: EQ('μ_k = ' + fmtq(v * v) + ' / ' + fmtq(r2(2 * g * s)) + ' = ' + fmtq(mu),
                 'Q = ' + fmtq(Q) + ' `J`'),
        conclude: 'ดังนั้น <b>สัมประสิทธิ์ความเสียดทานจลน์ = ' + fmt(mu) + '</b> (ไม่มีหน่วย) และ ' +
          '<b>พลังงานที่กลายเป็นความร้อน = ' + U(Q, 'J') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> แรงเสียดทาน ' + M('f = μ_k m g = ' + fmt(f)) + ' N<br>' +
          'งานของแรงเสียดทาน ' + M('f s = ' + fmt(f) + ' × ' + fmt(s) + ' = ' + fmt(r2(f * s))) +
          ' J ซึ่งเท่ากับพลังงานจลน์ต้น ' + U(Q, 'J') + ' พอดี ✓<br>' +
          '<b>ข้อคิด:</b> พลังงานไม่เคยหายไป มันเพียง<b>เปลี่ยนรูป</b> — ' +
          'ในกรณีนี้เปลี่ยนเป็นความร้อนซึ่ง<b>เอากลับคืนมาเป็นพลังงานกลไม่ได้</b> ' +
          'แรงเสียดทานจึงเรียกว่า<b>แรงไม่อนุรักษ์</b></span>'
      }
    };
  }
});

T({
  id: 'e-slide-fric', topic: 5, sub: 'รางลื่นต่อพื้นฝืด', level: 'ยาก',
  skills: ['อนุรักษ์พลังงานช่วงลื่น', 'สมดุลพลังงานช่วงมีเสียดทาน'],
  gen(R, c) {
    const g = c.g, k = R.pick([1, 2, 3]), v = 7 * k;
    const h = r2(v * v / (2 * g));
    const mu = R.pick([0.2, 0.25, 0.4, 0.5]);
    const d = r2(h / mu);
    const m = R.pick([0.5, 1, 2, 4]);
    if (!ok2(h, d) || h < 1 || d > 300) return null;
    const ball = R.pick(BALLS);
    return {
      stem: 'ปล่อย' + esc(ball) + 'มวล ' + U(m, 'kg') + ' จากหยุดนิ่งที่ยอดรางโค้ง<b>ลื่น</b>สูง ' +
        U(h, 'm') + ' เมื่อลงถึงเชิงรางแล้วจะไถลต่อไปบน<b>พื้นราบที่มีความเสียดทาน</b> ' +
        'สัมประสิทธิ์ความเสียดทานจลน์ ' + fmt(mu) + ' จงหา<b>อัตราเร็วที่เชิงราง</b> ' +
        'และ<b>ระยะที่ไถลบนพื้นราบก่อนจะหยุด</b> (กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'h', v: h, unit: 'm', d: 'ความสูงของยอดราง' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานบนพื้นราบ' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v', unit: 'm/s', d: 'อัตราเร็วที่เชิงราง', value: v, positive: true },
              { s: 'd', unit: 'm', d: 'ระยะไถลบนพื้นราบจนหยุด', value: d, positive: true }],
      sol: {
        analyze: 'โจทย์ข้อนี้มี<b>สองช่วงที่ต้องคิดคนละแบบ</b> ต้องแยกให้ขาด<br>' +
          '<b>ช่วงที่ 1 — บนรางโค้งลื่น:</b> ไม่มีแรงเสียดทาน พลังงานกลอนุรักษ์ ' +

          '<b>ช่วงที่ 2 — บนพื้นราบมีเสียดทาน:</b> พลังงานกล<b>ไม่อนุรักษ์</b> ' +

               { eq: 'd = h / μ_k', why: 'รวมสองสมการแล้วตัด m และ g ออก เหลือความสัมพันธ์ที่สั้นที่สุด' }],
        solve: EQ('v = √(2 g h)', 'm g h = μ_k m g d', 'd = h / μ_k'),
        subst: SEQ('v = √(2 × {g} × {h})', { g: g, h: h }) + SEQ('d = {h} / {mu}', { h: h, mu: mu }),
        calc: EQ('v = √' + fmtq(r2(2 * g * h)) + ' = ' + fmtq(v) + ' `m/s`',

        conclude: 'ดังนั้น <b>อัตราเร็วที่เชิงราง = ' + U(v, 'm/s') + '</b> และ ' +
          '<b>ไถลไปได้อีก ' + U(d, 'm') + ' จึงหยุด</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยตัวเลข:</b> ' +
          M('E_p = m g h = ' + fmt(r2(m * g * h))) + ' J และงานของแรงเสียดทาน ' +
          M('μ_k m g d = ' + fmt(r2(mu * m * g * d))) + ' J เท่ากันพอดี ✓<br>' +
          '<b>สังเกตให้ดี:</b> ทั้ง ' + M('v') + ' และ ' + M('d') + ' <b>ไม่ขึ้นกับมวล</b>เลย ' +

      }
    };
  }
});

T({
  id: 'e-eff', topic: 5, sub: 'ประสิทธิภาพเครื่องกล', level: 'ยาก',
  skills: ['กำลังที่ได้ต่อกำลังที่ให้', 'พลังงานสูญเสียในเครื่องจักรจริง'],
  gen(R, c) {
    const g = c.g, m = R.pick([200, 300, 500, 600, 1000]);
    const h = R.pick([5, 10, 12, 20]), t = R.pick([10, 20, 25, 50]);
    const eff = R.pick([0.5, 0.6, 0.75, 0.8]);
    const Pout = r2(m * g * h / t), Pin = r2(Pout / eff);
    if (!ok2(Pout, Pin) || Pin > 200000) return null;
    return {
      stem: 'เครื่องสูบน้ำเครื่องหนึ่งสูบน้ำมวล ' + U(m, 'kg') + ' ขึ้นไปเก็บบนถังสูง ' + U(h, 'm') +
        ' ได้ภายในเวลา ' + U(t, 's') + ' โดยมอเตอร์รับกำลังไฟฟ้าเข้า ' + U(Pin, 'W') +
        ' จงหา<b>กำลังที่ใช้ยกน้ำจริง</b> และ<b>ประสิทธิภาพของเครื่องสูบน้ำ</b> (กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลน้ำที่สูบขึ้นไป' },
              { s: 'h', v: h, unit: 'm', d: 'ความสูงที่ยกขึ้น' },
              { s: 't', v: t, unit: 's', d: 'เวลาที่ใช้' },
              { s: 'P_{เข้า}', v: Pin, unit: 'W', d: 'กำลังไฟฟ้าที่ป้อนให้มอเตอร์' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'P_{ออก}', unit: 'W', d: 'กำลังที่ใช้ยกน้ำจริง', value: Pout, positive: true },
              { s: 'Eff', unit: '%', d: 'ประสิทธิภาพ', value: r2(eff * 100), positive: true }],
      sol: {
        analyze: '<b>เครื่องจักรในโลกจริงไม่มีทางมีประสิทธิภาพ 100%</b> ' +
          'พลังงานส่วนหนึ่งสูญเสียไปเป็นความร้อนที่ขดลวด เสียงดัง และแรงเสียดทานในแบริ่งเสมอ<br>' +
          '<b>กำลังที่ได้ (' + M('P_{ออก}') + ')</b> คือกำลังที่ใช้ทำงานที่ต้องการจริง ๆ ' +
          'ข้อนี้คืองานที่ใช้เพิ่มพลังงานศักย์ให้น้ำ<br>' +
          '<b>กำลังที่ให้ (' + M('P_{เข้า}') + ')</b> คือพลังงานไฟฟ้าที่จ่ายเข้าไปทั้งหมดต่อวินาที<br>' +
          'งานที่ใช้ยกน้ำ = พลังงานศักย์ที่เพิ่มขึ้น = ' + M('m g h') +
          ' (น้ำขึ้นไปด้วยความเร็วคงที่ จึงไม่มีพลังงานจลน์เหลือค้าง)',
        eqs: [{ eq: 'W_{ออก} = m g h', why: 'งานที่เป็นประโยชน์ คือพลังงานศักย์โน้มถ่วงที่เพิ่มให้น้ำ' },
               { eq: 'P_{ออก} = W_{ออก} / t', why: 'เปลี่ยนจากงานเป็นกำลัง โดยหารด้วยเวลาที่ใช้' },
               { eq: 'Eff = (P_{ออก} / P_{เข้า}) × 100%', why: 'ประสิทธิภาพ คือสัดส่วนของกำลังที่ใช้ประโยชน์ได้จริงเทียบกับที่ป้อนเข้าไป' }],
        solve: EQ('P_{ออก} = m g h / t', 'Eff = (P_{ออก} / P_{เข้า}) × 100'),
        subst: SEQ('P_{ออก} = ({m})({g})({h}) / {t}', { m: m, g: g, h: h, t: t }) +
               SEQ('Eff = ({po} / {pi}) × 100', { po: Pout, pi: Pin }),
        calc: EQ('P_{ออก} = ' + fmtq(r2(m * g * h)) + ' / ' + fmtq(t) + ' = ' + fmtq(Pout) + ' `W`',
                 'Eff = ' + fmtq(r2(eff * 100)) + ' %'),
        conclude: 'ดังนั้น <b>กำลังที่ใช้ยกน้ำจริง = ' + U(Pout, 'W') + '</b> และ ' +
          '<b>ประสิทธิภาพ = ' + fmt(r2(eff * 100)) + ' %</b><br>' +
          '<span class="hint"><b>พลังงานที่สูญเสีย:</b> ' +
          M('P_{เข้า} - P_{ออก} = ' + fmt(Pin) + ' - ' + fmt(Pout) + ' = ' + fmt(r2(Pin - Pout))) +
          ' W กลายเป็นความร้อนที่มอเตอร์และท่อ<br>' +
          '<b>เตือนความจำ:</b> ประสิทธิภาพต้อง<b>น้อยกว่า 100% เสมอ</b> ' +
          'ถ้าคำนวณแล้วได้เกิน 100% แสดงว่าคิดสลับตัวเศษกับตัวส่วน ให้กลับไปตรวจใหม่ทันที</span>'
      }
    };
  }
});

T({
  id: 'e-springlaunch', topic: 5, sub: 'สปริงดีดวัตถุขึ้นพื้นเอียง', level: 'ยาก',
  skills: ['เชื่อมพลังงานสามรูปแบบ', 'อนุรักษ์พลังงานหลายขั้นตอน'],
  gen(R, c) {
    const g = c.g, j = R.pick([1, 2]), v = 7 * j;
    const m = R.pick([2, 4]);
    const x = R.pick([0.2, 0.25, 0.5]);
    const Ek = r2(0.5 * m * v * v);
    const kk = r2(2 * Ek / (x * x));
    const h = r2(v * v / (2 * g));
    const L = r2(h / sinD(30));
    if (!ok2(Ek, kk, h, L) || kk > 100000 || L > 200) return null;
    return {
      stem: 'อัดสปริงที่มีค่านิจสปริง ' + U(kk, 'N/m') + ' เข้าไป ' + U(x, 'm') +
        ' แล้วปล่อยให้ดีดวัตถุมวล ' + U(m, 'kg') + ' ออกไปตามพื้นราบ<b>ลื่น</b> ' +
        'จากนั้นวัตถุวิ่งขึ้นพื้นเอียง<b>ลื่น</b>ที่ทำมุม 30° กับแนวราบ ' +
        'จงหา<b>อัตราเร็วของวัตถุขณะพ้นจากสปริง</b> และ<b>ระยะที่วัตถุขึ้นไปได้ตามพื้นเอียง</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figIncline({ deg: 30, mass: 'm', down: 'mg' }),
      given: [{ s: 'k', v: kk, unit: 'N/m', d: 'ค่านิจสปริง' },
              { s: 'x', v: x, unit: 'm', d: 'ระยะที่อัดสปริง' },
              { s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'θ', v: 30, unit: '°', d: 'มุมเอียงของพื้น' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'v', unit: 'm/s', d: 'อัตราเร็วขณะพ้นสปริง', value: v, positive: true },
              { s: 'L', unit: 'm', d: 'ระยะตามพื้นเอียงที่ขึ้นไปได้', value: L, positive: true }],
      sol: {
        analyze: 'ข้อนี้พลังงานเปลี่ยนรูป <b>3 ทอด</b> ต้องไล่ให้ครบ<br>' +
          '<b>ทอดที่ 1:</b> พลังงานศักย์ยืดหยุ่นในสปริง → พลังงานจลน์ (บนพื้นราบลื่น)<br>' +
          '<b>ทอดที่ 2:</b> พลังงานจลน์ → พลังงานศักย์โน้มถ่วง (ขณะวิ่งขึ้นพื้นเอียงลื่น)<br>' +
          'ทุกช่วงลื่นหมด <b>พลังงานกลรวมจึงคงที่ตลอดทั้งกระบวนการ</b><br>' +
          '<b>จุดที่พลาดกันมากที่สุด:</b> คำถามถามระยะ<b>ตามพื้นเอียง</b> (' + M('L') +
          ') ไม่ใช่ความสูงในแนวดิ่ง (' + M('h') + ') ต้องแปลงกลับด้วย ' + M('h = L sin θ') + ' เสมอ<br>' +
          'ค่าที่ใช้: ' + M('sin 30° = 0.5'),
        eqs: [{ eq: '(1/2) k x^2 = (1/2) m v^2', why: 'ทอดที่ 1 — พลังงานสปริงกลายเป็นพลังงานจลน์ทั้งหมด เพราะพื้นราบลื่น' },
               { eq: '(1/2) m v^2 = m g h', why: 'ทอดที่ 2 — พลังงานจลน์กลายเป็นพลังงานศักย์จนหยุดนิ่งที่จุดสูงสุด' },
               { eq: 'h = L sin θ', why: 'แปลงความสูงในแนวดิ่งกลับเป็นระยะตามแนวพื้นเอียงที่โจทย์ถาม' }],
        solve: EQ('v = √(k x^2 / m)', 'h = v^2 / (2 g)', 'L = h / sin θ'),
        subst: SEQ('v = √( ({k})({x})^2 / {m} )', { k: kk, x: x, m: m }) +
               SEQ('h = {v}^2 / (2 × {g})', { v: v, g: g }) +
               SEQ('L = {h} / 0.5', { h: h }),
        calc: EQ('E_{สปริง} = (1/2)(' + fmtq(kk) + ')(' + fmtq(r2(x * x)) + ') = ' + fmtq(Ek) + ' `J`',
                 'v = ' + fmtq(v) + ' `m/s`',
                 'h = ' + fmtq(h) + ' `m`',
                 'L = ' + fmtq(L) + ' `m`'),
        conclude: 'ดังนั้น <b>วัตถุพ้นสปริงด้วยอัตราเร็ว ' + U(v, 'm/s') + '</b> และ ' +
          '<b>ขึ้นไปตามพื้นเอียงได้ ' + U(L, 'm') + '</b> (สูงในแนวดิ่ง ' + U(h, 'm') + ')<br>' +
          '<span class="hint"><b>ตรวจสอบด้วยพลังงาน:</b> ' +
          M('E_{สปริง} = ' + fmt(Ek)) + ' J และ ' + M('m g h = ' + fmt(r2(m * g * h))) +
          ' J เท่ากันพอดี ✓ พลังงานถูกส่งต่อครบทุกทอด<br>' +
          '<b>ทางลัดสำหรับห้องสอบ:</b> ข้ามพลังงานจลน์ไปเลย เขียน ' + M('(1/2) k x^2 = m g L sin θ') +
          ' แล้วแก้หา ' + M('L') + ' ทีเดียวจบ — ประหยัดเวลาได้มาก<br>' +
          '<b>คิดต่อ:</b> ถ้าพื้นเอียง<b>มีความเสียดทาน</b> จะต้องเพิ่มพจน์ ' + M('μ m g cos θ × L') +
          ' เข้าไปทางขวามือ ทำให้วัตถุขึ้นไปได้ไม่สูงเท่านี้</span>'
      }
    };
  }
});

        subst: SEQ('p = ({m})({v})', { m: m, v: v }),

        conclude: 'ดังนั้น <b>โมเมนตัมมีขนาด ' + U(p, 'kg·m/s') + '</b> มีทิศเดียวกับการเคลื่อนที่<br>' +
          '<span class="hint">หน่วยของโมเมนตัมคือ ' + M('`kg·m/s`') + ' ซึ่งเท่ากับ ' + M('`N·s`') + ' ด้วย<br>' +

T({

T({

        eqs: [{ eq: 'F Δt = Δp = m v - m u', why: 'ทฤษฎีบทการดล-โมเมนตัม — การดลที่ให้ไปเท่ากับโมเมนตัมที่เปลี่ยนไป' },

T({
  id: 'p-inelastic', topic: 6, sub: 'การชนแบบไม่ยืดหยุ่น', level: 'ปานกลาง',
  skills: ['อนุรักษ์โมเมนตัม', 'พลังงานจลน์ไม่อนุรักษ์ในการชนแบบติดกัน'],
  gen(R) {
    const m1 = R.pick([1, 2, 3, 4, 5]), m2 = R.pick([1, 2, 3, 4, 5, 6]);
    const u1 = R.pick([4, 5, 6, 8, 10, 12]);
    const v = r2(m1 * u1 / (m1 + m2));
    const Ek1 = r2(0.5 * m1 * u1 * u1), Ek2 = r2(0.5 * (m1 + m2) * v * v);
    const loss = r2(Ek1 - Ek2);
    if (!ok2(v, Ek1, Ek2, loss) || loss < 0.5) return null;
    return {
      stem: 'รถทดลองคันที่หนึ่งมวล ' + U(m1, 'kg') + ' แล่นมาด้วยความเร็ว ' + U(u1, 'm/s') +
        ' เข้าชนรถคันที่สองมวล ' + U(m2, 'kg') + ' ซึ่ง<b>จอดอยู่นิ่ง</b>บนรางลื่น ' +
        'หลังชน<b>รถทั้งสองคันติดกันแล้วเคลื่อนที่ไปด้วยกัน</b> ' +
        'จงหา<b>ความเร็วร่วมหลังชน</b> และ<b>พลังงานจลน์ที่สูญเสียไป</b>',
      figure: figChain({ masses: ['m₁', 'm₂'], Fleft: 'u₁ = ' + fmt(u1) + ' m/s' }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลรถคันที่หนึ่ง' },
              { s: 'u_1', v: u1, unit: 'm/s', d: 'ความเร็วก่อนชนของคันที่หนึ่ง' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลรถคันที่สอง' },
              { s: 'u_2', v: 0, unit: 'm/s', d: 'คันที่สองจอดนิ่ง' }],
      finds: [{ s: 'v', unit: 'm/s', d: 'ความเร็วร่วมหลังชน', value: v, positive: true },
              { s: 'ΔE_k', unit: 'J', d: 'พลังงานจลน์ที่สูญเสียไป', value: loss, positive: true }],
      sol: {
        analyze: 'ระหว่างการชน แรงที่รถสองคันกระทำต่อกันเป็น<b>แรงภายในระบบ</b> ' +
          'และเป็นคู่แรงกิริยา-ปฏิกิริยาที่หักล้างกันพอดี<br>' +
          'เมื่อไม่มีแรงภายนอกในแนวการเคลื่อนที่ (รางลื่น) <b>โมเมนตัมรวมของระบบจึงคงที่</b> — ' +
          'นี่คือ<b>กฎการอนุรักษ์โมเมนตัม</b><br>' +
          'หลังชน<b>ติดกันไป</b> เรียกว่า<b>การชนแบบไม่ยืดหยุ่นสมบูรณ์</b> ' +
          'ทั้งสองก้อนจึงมีความเร็วเดียวกัน มองเป็นวัตถุก้อนเดียวมวล ' + M('m_1 + m_2') + '<br>' +
          '<b>ประเด็นสำคัญ:</b> โมเมนตัมอนุรักษ์ แต่<b>พลังงานจลน์ไม่อนุรักษ์</b> ' +
          'ส่วนที่หายไปกลายเป็นความร้อน เสียงดัง และการเปลี่ยนรูปของตัวถังรถ',
        eqs: [{ eq: 'm_1 u_1 + m_2 u_2 = (m_1 + m_2) v',
                why: 'กฎการอนุรักษ์โมเมนตัม — โมเมนตัมรวมก่อนชนเท่ากับหลังชน โดยหลังชนติดกันเป็นก้อนเดียว' },
               { eq: 'ΔE_k = E_{k,ก่อน} - E_{k,หลัง}',
                 why: 'พลังงานจลน์ที่หายไป หาได้จากผลต่างของพลังงานจลน์รวมก่อนและหลังชน' }],
        solve: EQ('m_1 u_1 = (m_1 + m_2) v', 'v = m_1 u_1 / (m_1 + m_2)') +
          '<div class="why">เพราะ ' + M('u_2 = 0') + ' พจน์ ' + M('m_2 u_2') + ' จึงหายไป</div>' +
          EQ('ΔE_k = (1/2) m_1 u_1^2 - (1/2)(m_1 + m_2) v^2'),
        subst: SEQ('v = ({m1})({u1}) / ({m1} + {m2})', { m1: m1, u1: u1, m2: m2 }) +
               SEQ('ΔE_k = (1/2)({m1})({u1})^2 - (1/2)({mt})({v})^2',
                   { m1: m1, u1: u1, mt: m1 + m2, v: v }),
        calc: EQ('v = ' + fmtq(m1 * u1) + ' / ' + fmtq(m1 + m2) + ' = ' + fmtq(v) + ' `m/s`',
                 'ΔE_k = ' + fmtq(Ek1) + ' - ' + fmtq(Ek2) + ' = ' + fmtq(loss) + ' `J`'),
        conclude: 'ดังนั้น <b>ความเร็วร่วมหลังชน = ' + U(v, 'm/s') + '</b> และ ' +
          '<b>พลังงานจลน์สูญเสียไป ' + U(loss, 'J') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบโมเมนตัม:</b> ก่อนชน ' + M(fmt(m1) + ' × ' + fmt(u1) + ' = ' + fmt(m1 * u1)) +
          ' และหลังชน ' + M(fmt(m1 + m2) + ' × ' + fmt(v) + ' = ' + fmt(r2((m1 + m2) * v))) + ' เท่ากัน ✓<br>' +
          '<b>เตือนความจำ:</b> ในการชนทุกแบบ <b>โมเมนตัมอนุรักษ์เสมอ</b> ' +
          'แต่<b>พลังงานจลน์อนุรักษ์เฉพาะการชนแบบยืดหยุ่นสมบูรณ์เท่านั้น</b> ' +
          'การชนแบบติดกันไปคือกรณีที่สูญเสียพลังงานจลน์<b>มากที่สุด</b>เท่าที่จะเป็นไปได้</span>'
      }
    };
  }

T({

      sol: {
        analyze: '<b>การระเบิดคือการชนย้อนกลับ</b> — เริ่มจากอยู่ด้วยกันแล้วแยกออก ' +
          'แต่ใช้กฎการอนุรักษ์โมเมนตัมได้เหมือนกันทุกประการ<br>' +
          '<b>กุญแจของข้อนี้:</b> ก่อนปล่อยสปริง ทุกอย่างอยู่นิ่ง ⇒ ' +
          '<b>โมเมนตัมรวมของระบบเท่ากับศูนย์</b><br>' +
          'เมื่อไม่มีแรงภายนอก โมเมนตัมรวม<b>หลัง</b>ดีดออกก็ต้องเป็น<b>ศูนย์</b>เช่นกัน<br>' +
          'แปลว่าโมเมนตัมของรถสองคันต้อง<b>ขนาดเท่ากันแต่ทิศตรงข้าม</b> เพื่อหักล้างกันพอดี<br>' +
          'กำหนดให้ทิศไปทางขวาเป็นบวก ⇒ คันแรกที่ไปทางซ้ายมีโมเมนตัมเป็นลบ',
        eqs: [{ eq: '0 = -m_1 v_1 + m_2 v_2', why: 'โมเมนตัมรวมก่อนดีดเป็นศูนย์ หลังดีดจึงต้องเป็นศูนย์ด้วย' },
               { eq: 'm_1 v_1 = m_2 v_2', why: 'จัดรูปแล้วได้ว่าขนาดโมเมนตัมของทั้งสองก้อนต้องเท่ากัน' },
               { eq: 'E = (1/2) m_1 v_1^2 + (1/2) m_2 v_2^2',
                 why: 'พลังงานศักย์ยืดหยุ่นในสปริงถูกเปลี่ยนเป็นพลังงานจลน์ของรถทั้งสองคัน' }],
        solve: EQ('v_2 = m_1 v_1 / m_2', 'E = (1/2) m_1 v_1^2 + (1/2) m_2 v_2^2'),
        subst: SEQ('v_2 = ({m1})({v1}) / {m2}', { m1: m1, v1: v1, m2: m2 }) +
               SEQ('E = (1/2)({m1})({v1})^2 + (1/2)({m2})({v2})^2',
                   { m1: m1, v1: v1, m2: m2, v2: v2 }),
        calc: EQ('v_2 = ' + fmtq(m1 * v1) + ' / ' + fmtq(m2) + ' = ' + fmtq(v2) + ' `m/s`',
                 'E = ' + fmtq(r2(0.5 * m1 * v1 * v1)) + ' + ' + fmtq(r2(0.5 * m2 * v2 * v2)),
                 'E = ' + fmtq(E) + ' `J`'),
        conclude: 'ดังนั้น <b>คันที่สองเคลื่อนที่ไปทางขวาด้วยความเร็ว ' + U(v2, 'm/s') + '</b> และ ' +
          '<b>สปริงปล่อยพลังงานออกมา ' + U(E, 'J') + '</b><br>' +
          '<span class="hint"><b>ข้อสังเกตที่ออกสอบบ่อย:</b> ' +
          'คันที่<b>มวลมากกว่าจะเคลื่อนที่ช้ากว่า</b> เพราะโมเมนตัมต้องเท่ากัน<br>' +
          'แต่<b>พลังงานจลน์กลับไม่เท่ากัน</b> — คันที่มวล<b>น้อยกว่า</b>ได้พลังงานจลน์<b>มากกว่า</b> ' +
          '(' + U(r2(0.5 * m1 * v1 * v1), 'J') + ' เทียบกับ ' + U(r2(0.5 * m2 * v2 * v2), 'J') + ')<br>' +
          'เพราะ ' + M('E_k = p^2 / (2m)') + ' เมื่อ ' + M('p') + ' เท่ากัน มวลน้อยจึงได้พลังงานมาก</span>'
      }
    };
  }
});

T({
  id: 'p-recoil', topic: 6, sub: 'การถอยหลังของปืน', level: 'ปานกลาง',
  skills: ['อนุรักษ์โมเมนตัมกรณีมวลต่างกันมาก', 'เปรียบเทียบพลังงานจลน์'],
  gen(R) {
    const mb = R.pick([0.01, 0.02, 0.04, 0.05]);
    const vb = R.step(200, 800, 100);
    const Mg = R.pick([2, 4, 5, 8, 10]);
    const V = r2(mb * vb / Mg);
    const Ekg = r2(0.5 * Mg * V * V);
    if (!ok2(V, Ekg) || V < 0.1 || V > 20) return null;
    return {
      stem: 'ปืนมวล ' + U(Mg, 'kg') + ' ยิงกระสุนมวล ' + U(mb, 'kg') + ' ออกไปด้วยความเร็ว ' +
        U(vb, 'm/s') + ' จงหา<b>ความเร็วถอยหลังของปืน</b> และ<b>พลังงานจลน์ของปืนขณะถอยหลัง</b>',
      given: [{ s: 'M', v: Mg, unit: 'kg', d: 'มวลของปืน' },
              { s: 'm', v: mb, unit: 'kg', d: 'มวลของกระสุน' },
              { s: 'v', v: vb, unit: 'm/s', d: 'ความเร็วกระสุนที่พุ่งออกไป' },
              { s: 'p_{ก่อน}', v: 0, unit: 'kg·m/s', d: 'ก่อนยิงทุกอย่างอยู่นิ่ง' }],
      finds: [{ s: 'V', unit: 'm/s', d: 'ความเร็วถอยหลังของปืน', value: V, positive: true },
              { s: 'E_{k,ปืน}', unit: 'J', d: 'พลังงานจลน์ของปืน', value: Ekg, positive: true }],
      sol: {
        analyze: 'ก่อนยิง ปืนกับกระสุนอยู่นิ่งด้วยกัน <b>โมเมนตัมรวมเป็นศูนย์</b><br>' +
          'แรงที่ดินปืนดันกระสุนไปข้างหน้า กับแรงที่กระสุนดันปืนไปข้างหลัง ' +
          'เป็น<b>คู่แรงกิริยา-ปฏิกิริยา</b> ซึ่งเป็นแรงภายในระบบ<br>' +
          'ดังนั้นหลังยิง โมเมนตัมรวมก็ยังต้องเป็นศูนย์ ⇒ ' +
          '<b>โมเมนตัมของปืนต้องเท่ากับโมเมนตัมของกระสุนแต่ทิศตรงข้าม</b><br>' +
          'กำหนดทิศที่กระสุนพุ่งออกไปเป็นบวก ปืนจึงถอยหลังในทิศลบ',
        eqs: [{ eq: '0 = m v + M (-V)', why: 'โมเมนตัมรวมหลังยิงต้องเท่ากับก่อนยิงซึ่งเป็นศูนย์' },
               { eq: 'M V = m v', why: 'ขนาดโมเมนตัมของปืนเท่ากับของกระสุน — เป็นสมการหลักของข้อนี้' },
               { eq: 'E_{k,ปืน} = (1/2) M V^2', why: 'พลังงานจลน์ของปืนที่ถอยหลัง คำนวณจากมวลและความเร็วถอยหลัง' }],
        solve: EQ('V = m v / M', 'E_{k,ปืน} = (1/2) M V^2'),
        subst: SEQ('V = ({m})({v}) / {M}', { m: mb, v: vb, M: Mg }) +
               SEQ('E_{k,ปืน} = (1/2)({M})({V})^2', { M: Mg, V: V }),
        calc: EQ('V = ' + fmtq(r2(mb * vb)) + ' / ' + fmtq(Mg) + ' = ' + fmtq(V) + ' `m/s`',
                 'E_{k,ปืน} = ' + fmtq(Ekg) + ' `J`'),
        conclude: 'ดังนั้น <b>ปืนถอยหลังด้วยความเร็ว ' + U(V, 'm/s') + '</b> และ ' +
          '<b>มีพลังงานจลน์ ' + U(Ekg, 'J') + '</b><br>' +
          '<span class="hint"><b>เปรียบเทียบกับกระสุน:</b> พลังงานจลน์ของกระสุน = ' +
          U(r2(0.5 * mb * vb * vb), 'J') + ' ซึ่ง<b>มากกว่า</b>ของปืนหลายเท่า<br>' +
          'ทั้งที่โมเมนตัมเท่ากันเป๊ะ! เพราะ ' + M('E_k = p^2/(2M)') +
          ' — มวลมากทำให้ได้พลังงานจลน์น้อย<br>' +
          '<b>นี่คือเหตุผลที่ยิงปืนแล้วไม่บาดเจ็บ</b> ปืนถอยหลังช้าและมีพลังงานน้อย ' +
          'อีกทั้งไหล่ของผู้ยิงยัง<b>ยืดเวลาชน</b>ช่วยลดแรงลงอีกด้วย</span>'
      }
    };
  }
});

T({
  id: 'p-headon', topic: 6, sub: 'การชนกันแล้วแยกจากกัน', level: 'ปานกลาง',
  skills: ['ตั้งแกนบวกลบให้ชัดก่อนคิด', 'อนุรักษ์โมเมนตัมกรณีวิ่งสวนกัน'],
  gen(R) {
    const m1 = R.pick([1, 2, 3, 4]), m2 = R.pick([2, 3, 4, 5, 6]);
    const u1 = R.pick([4, 6, 8, 10, 12]), u2 = R.pick([2, 3, 4, 5, 6]);
    const w1 = R.pick([1, 2, 3]);                       // คันแรกสะท้อนกลับด้วยความเร็วนี้
    const P = m1 * u1 - m2 * u2;
    const w2 = r2((P + m1 * w1) / m2);
    if (!ok2(w2) || w2 < 0.1 || w2 > 30) return null;
    return {
      stem: 'ลูกกลมมวล ' + U(m1, 'kg') + ' เคลื่อนที่ไปทาง<b>ขวา</b>ด้วยความเร็ว ' + U(u1, 'm/s') +
        ' เข้าชนลูกกลมมวล ' + U(m2, 'kg') + ' ที่เคลื่อนที่<b>สวนมาทางซ้าย</b>ด้วยความเร็ว ' +
        U(u2, 'm/s') + ' บนพื้นราบลื่น หลังชนพบว่าลูกแรก<b>สะท้อนกลับไปทางซ้าย</b>ด้วยความเร็ว ' +
        U(w1, 'm/s') + ' จงหา<b>ความเร็วของลูกที่สองหลังชน</b>',
      figure: figChain({ masses: ['m₁', 'm₂'], tlabels: ['ชนกัน'], Fleft: 'u₁ →' }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลลูกที่หนึ่ง' },
              { s: 'u_1', v: u1, unit: 'm/s', d: 'ก่อนชน ไปทางขวา (+)' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลลูกที่สอง' },
              { s: 'u_2', v: -u2, unit: 'm/s', d: 'ก่อนชน ไปทางซ้าย (−)' },
              { s: 'v_1', v: -w1, unit: 'm/s', d: 'หลังชน สะท้อนกลับไปทางซ้าย (−)' }],
      finds: [{ s: 'v_2', unit: 'm/s', d: 'ความเร็วลูกที่สองหลังชน ไปทางขวา', value: w2, positive: true }],
      sol: {
        analyze: '<b>ขั้นตอนที่ห้ามข้ามในโจทย์การชนทุกข้อ: กำหนดทิศบวกให้ชัดเจนก่อน</b><br>' +
          'กำหนดให้ <b>ทิศไปทางขวาเป็นบวก</b> ทิศไปทางซ้ายเป็นลบ แล้วใส่เครื่องหมายให้ครบทุกตัว<br>' +
          '• ก่อนชน: ลูกที่หนึ่ง ' + M('u_1 = +' + fmt(u1)) + ' m/s, ลูกที่สอง ' + M('u_2 = -' + fmt(u2)) + ' m/s<br>' +
          '• หลังชน: ลูกที่หนึ่งสะท้อนกลับ ' + M('v_1 = -' + fmt(w1)) + ' m/s, ลูกที่สอง ' + M('v_2') + ' = ?<br>' +
          'พื้นลื่นและไม่มีแรงภายนอกในแนวราบ ⇒ <b>โมเมนตัมรวมอนุรักษ์</b><br>' +
          '<b>หมายเหตุ:</b> ข้อนี้ไม่บอกว่าเป็นการชนแบบยืดหยุ่นหรือไม่ ซึ่ง<b>ไม่จำเป็นต้องรู้</b> ' +
          'เพราะกฎการอนุรักษ์โมเมนตัมใช้ได้กับการชนทุกแบบ',
        eqs: [{ eq: 'm_1 u_1 + m_2 u_2 = m_1 v_1 + m_2 v_2',
                why: 'กฎการอนุรักษ์โมเมนตัม ใช้ได้กับการชนทุกประเภทตราบใดที่ไม่มีแรงภายนอก' }],
        solve: EQ('m_2 v_2 = m_1 u_1 + m_2 u_2 - m_1 v_1', 'v_2 = (m_1 u_1 + m_2 u_2 - m_1 v_1) / m_2'),
        subst: SEQ('v_2 = [ ({m1})({u1}) + ({m2})({u2}) - ({m1})({v1}) ] / {m2}',
                   { m1: m1, u1: u1, m2: m2, u2: -u2, v1: -w1 }),
        calc: EQ('p_{ก่อน} = ' + fmtq(m1 * u1) + ' + (' + fmtq(-m2 * u2) + ') = ' + fmtq(P) + ' `kg·m/s`',
                 'v_2 = [ ' + fmtq(P) + ' + ' + fmtq(m1 * w1) + ' ] / ' + fmtq(m2),
                 'v_2 = ' + fmtq(w2) + ' `m/s`'),
        conclude: 'ดังนั้น <b>ลูกที่สองเคลื่อนที่ไปทางขวาด้วยความเร็ว ' + U(w2, 'm/s') + '</b> ' +
          '(ค่าออกมาเป็นบวก แปลว่าทิศไปทางขวาตามที่สมมติไว้)<br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> โมเมนตัมหลังชน = ' +
          M('(' + fmt(m1) + ')(-' + fmt(w1) + ') + (' + fmt(m2) + ')(' + fmt(w2) + ') = ' +
            fmt(r2(-m1 * w1 + m2 * w2))) + ' kg·m/s<br>' +
          'ซึ่งเท่ากับโมเมนตัมก่อนชน ' + fmt(P) + ' kg·m/s พอดี ✓<br>' +
          '<b>บทเรียน:</b> ถ้าคำนวณแล้วได้ค่า<b>ติดลบ</b> ไม่ได้แปลว่าทำผิด — ' +
          'เพียงแต่ทิศจริงตรงข้ามกับที่สมมติไว้เท่านั้น เครื่องหมายจะบอกทิศให้เราเอง</span>'
      }
    };
  }
});

T({
  id: 'p-bounce', topic: 6, sub: 'การกระทบและสะท้อนกลับ', level: 'ปานกลาง',
  skills: ['เครื่องหมายเมื่อวัตถุย้อนทิศ', 'แรงเฉลี่ยจากการชน'],
  gen(R) {
    const m = R.pick([0.1, 0.2, 0.4, 0.5, 1, 2]);
    const u = R.pick([5, 6, 8, 10, 12, 15]), v = R.pick([2, 3, 4, 5, 6]);
    if (v >= u) return null;
    const t = R.pick([0.02, 0.05, 0.1, 0.2]);
    const dp = r2(m * (u + v)), F = r2(dp / t);
    if (!ok2(dp, F) || F > 3000) return null;
    const ball = R.pick(BALLS);
    return {
      stem: esc(ball) + 'มวล ' + U(m, 'kg') + ' พุ่งเข้าชนกำแพงในแนวตั้งฉากด้วยความเร็ว ' +
        U(u, 'm/s') + ' แล้ว<b>สะท้อนกลับตามแนวเดิม</b>ด้วยความเร็ว ' + U(v, 'm/s') +
        ' โดยสัมผัสกำแพงนาน ' + U(t, 's') +
        ' จงหา<b>ขนาดของโมเมนตัมที่เปลี่ยนไป</b> และ<b>ขนาดของแรงเฉลี่ยที่กำแพงกระทำต่อ' + esc(ball) + '</b>',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'u', v: u, unit: 'm/s', d: 'ความเร็วก่อนชน (พุ่งเข้ากำแพง)' },
              { s: 'v', v: -v, unit: 'm/s', d: 'ความเร็วหลังชน (สะท้อนกลับ ⇒ ติดลบ)' },
              { s: 'Δt', v: t, unit: 's', d: 'เวลาที่สัมผัสกำแพง' }],
      finds: [{ s: 'Δp', unit: 'kg·m/s', d: 'ขนาดของโมเมนตัมที่เปลี่ยนไป', value: dp, positive: true },
              { s: 'F', unit: 'N', d: 'ขนาดของแรงเฉลี่ยจากกำแพง', value: F, positive: true }],
      sol: {
        analyze: '<b>นี่คือข้อที่นักเรียนพลาดมากที่สุดในบทโมเมนตัม</b> ' +
          'หลายคนคิดว่า ' + M('Δp = m(u - v) = ' + fmt(m) + '(' + fmt(u) + ' - ' + fmt(v) + ')') +
          ' ซึ่ง<b>ผิด</b><br>' +
          'สาเหตุ: ' + esc(ball) + '<b>ย้อนทิศ</b> ความเร็วหลังชนจึงต้องใส่<b>เครื่องหมายลบ</b><br>' +
          'กำหนดทิศพุ่งเข้ากำแพงเป็นบวก ⇒ ' + M('u = +' + fmt(u)) + ' m/s และ ' +
          M('v = -' + fmt(v)) + ' m/s<br>' +
          'ดังนั้น ' + M('Δp = mv - mu = m(-' + fmt(v) + ') - m(' + fmt(u) + ') = -m(' + fmt(u) + ' + ' + fmt(v) + ')') + '<br>' +
          'ขนาดของมันจึงเป็น ' + M('m(u + v)') + ' — <b>บวกกัน ไม่ใช่ลบกัน</b> ' +
          'เพราะต้องหยุดวัตถุก่อนแล้วผลักกลับไปอีกทาง',
        eqs: [{ eq: 'Δp = m v - m u', why: 'นิยามของโมเมนตัมที่เปลี่ยนไป ต้องใส่เครื่องหมายตามทิศเสมอ' },
               { eq: '|Δp| = m (u + v)', why: 'แทน v ด้วยค่าติดลบ เครื่องหมายลบสองตัวจึงกลายเป็นการบวกขนาด' },
               { eq: 'F = |Δp| / Δt', why: 'ทฤษฎีบทการดล-โมเมนตัม ใช้หาแรงเฉลี่ยตลอดช่วงที่สัมผัสกำแพง' }],
        solve: EQ('|Δp| = m (u + v)', 'F = |Δp| / Δt'),
        subst: SEQ('|Δp| = ({m})({u} + {v})', { m: m, u: u, v: v }) +
               SEQ('F = {dp} / {t}', { dp: dp, t: t }),
        calc: EQ('|Δp| = (' + fmtq(m) + ')(' + fmtq(u + v) + ') = ' + fmtq(dp) + ' `kg·m/s`',
                 'F = ' + fmtq(dp) + ' / ' + fmtq(t) + ' = ' + fmtq(F) + ' `N`'),
        conclude: 'ดังนั้น <b>โมเมนตัมเปลี่ยนไป ' + U(dp, 'kg·m/s') + '</b> และ ' +
          '<b>กำแพงกระทำต่อ' + esc(ball) + 'ด้วยแรงเฉลี่ย ' + U(F, 'N') + '</b> ' +
          'มีทิศออกจากกำแพง<br>' +
          '<span class="hint"><b>เทียบให้เห็นภาพ:</b> น้ำหนักของ' + esc(ball) + 'มีเพียง ' +
          U(r2(m * 9.8), 'N') + ' แต่แรงตอนชนสูงถึง ' + U(F, 'N') + ' — ' +
          'เพราะเวลาชนสั้นมากเพียง ' + fmt(t) + ' วินาที<br>' +
          '<b>เชื่อมโยงกับกฎข้อที่สาม:</b> ' + esc(ball) + 'ก็กระทำต่อกำแพงด้วยแรง ' + U(F, 'N') +
          ' เท่ากันแต่ทิศตรงข้าม — นี่คือที่มาของ<b>ความดันของแก๊ส</b>ที่เกิดจากโมเลกุลชนผนังภาชนะ</span>'

T({
  id: 'p-ballistic', topic: 6, sub: 'เครื่องวัดความเร็วกระสุน', level: 'ยาก',
  skills: ['ผสมอนุรักษ์โมเมนตัมกับอนุรักษ์พลังงาน', 'แยกสองช่วงของเหตุการณ์'],
  gen(R, c) {
    const g = c.g, k = R.pick([1, 2]), V = 7 * k;
    const h = r2(V * V / (2 * g));
    const mb = R.pick([0.02, 0.05, 0.1]);
    const Mw = R.pick([0.98, 1.95, 2.9, 3.9]);   // ห้ามตั้งชื่อว่า M เพราะชนกับฟังก์ชันจัดรูปสมการ M()
    const tot = r2(mb + Mw);
    const vb = r2(tot * V / mb);
    if (!ok2(h, tot, vb) || vb > 3000 || dpOf(tot, 4) > 2) return null;
    return {
      stem: 'ยิงกระสุนมวล ' + U(mb, 'kg') + ' เข้าไป<b>ฝังในแท่งไม้</b>มวล ' + U(Mw, 'kg') +
        ' ที่แขวนนิ่งอยู่กับเพดานด้วยเชือกยาว หลังกระสุนฝังแล้ว ' +
        'แท่งไม้พร้อมกระสุน<b>แกว่งขึ้นไปสูงจากตำแหน่งเดิม</b> ' + U(h, 'm') +
        ' จงหา<b>ความเร็วร่วมทันทีหลังกระสุนฝัง</b> และ<b>ความเร็วของกระสุนก่อนชน</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: mb, unit: 'kg', d: 'มวลกระสุน' },
              { s: 'M', v: Mw, unit: 'kg', d: 'มวลแท่งไม้' },
              { s: 'h', v: h, unit: 'm', d: 'ความสูงที่แกว่งขึ้นไปได้' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'V', unit: 'm/s', d: 'ความเร็วร่วมทันทีหลังชน', value: V, positive: true },
              { s: 'v', unit: 'm/s', d: 'ความเร็วกระสุนก่อนชน', value: vb, positive: true }],
      sol: {
        analyze: '<b>โจทย์คลาสสิกที่ต้องแยกให้ขาดเป็น 2 ช่วง เพราะใช้กฎคนละข้อกัน</b><br>' +
          '<b>ช่วงที่ 1 — ขณะกระสุนฝังเข้าไป (ใช้อนุรักษ์โมเมนตัม)</b><br>' +
          'เกิดขึ้นเร็วมาก แรงจากเชือกและน้ำหนักยังไม่ทันมีผล ⇒ โมเมนตัมอนุรักษ์<br>' +
          'แต่<b>พลังงานจลน์ไม่อนุรักษ์</b> เพราะกระสุนฝังเข้าเนื้อไม้ พลังงานส่วนใหญ่กลายเป็นความร้อน<br>' +
          '<b>ช่วงที่ 2 — ขณะแกว่งขึ้น (ใช้อนุรักษ์พลังงานกล)</b><br>' +
          'หลังกระสุนหยุดฝังแล้ว ไม่มีการสูญเสียพลังงานอีก ⇒ พลังงานจลน์แปลงเป็นพลังงานศักย์<br>' +
          '<b>ห้ามใช้อนุรักษ์พลังงานตลอดทั้งเหตุการณ์เด็ดขาด</b> — จะได้คำตอบผิดทันที<br>' +
          '<b>วิธีคิด:</b> ต้องทำ<b>ย้อนลำดับ</b> คือหาความเร็วร่วมจากช่วงที่ 2 ก่อน ' +
          'แล้วค่อยย้อนไปหาความเร็วกระสุนในช่วงที่ 1',
        eqs: [{ eq: '(1/2)(m + M) V^2 = (m + M) g h',
                why: 'ช่วงที่ 2 — อนุรักษ์พลังงานกล พลังงานจลน์หลังชนแปลงเป็นพลังงานศักย์จนหยุดที่จุดสูงสุด' },
               { eq: 'V = √(2 g h)', why: 'มวลรวมตัดกันทั้งสองข้าง ความเร็วร่วมจึงขึ้นกับความสูงที่แกว่งขึ้นเท่านั้น' },
               { eq: 'm v = (m + M) V',
                 why: 'ช่วงที่ 1 — อนุรักษ์โมเมนตัม กระสุนที่ฝังในไม้ทำให้เคลื่อนที่ไปด้วยกันเป็นก้อนเดียว' }],
        solve: EQ('V = √(2 g h)', 'v = (m + M) V / m'),
        subst: SEQ('V = √(2 × {g} × {h})', { g: g, h: h }) +
               SEQ('v = ({tot})({V}) / {m}', { tot: tot, V: V, m: mb }),
        calc: EQ('V = √' + fmtq(r2(2 * g * h)) + ' = ' + fmtq(V) + ' `m/s`',
                 'v = ' + fmtq(r2(tot * V)) + ' / ' + fmtq(mb) + ' = ' + fmtq(vb) + ' `m/s`'),
        conclude: 'ดังนั้น <b>ความเร็วร่วมหลังชน = ' + U(V, 'm/s') + '</b> และ ' +
          '<b>ความเร็วกระสุนก่อนชน = ' + U(vb, 'm/s') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบว่าพลังงานหายไปเท่าไร:</b><br>' +
          'ก่อนชน ' + M('E_k = (1/2)(' + fmt(mb) + ')(' + fmt(vb) + ')^2 ≈ ' +
            fmt(r2(0.5 * mb * vb * vb))) + ' J<br>' +
          'หลังชน ' + M('E_k = (1/2)(' + fmt(tot) + ')(' + fmt(V) + ')^2 = ' +
            fmt(r2(0.5 * tot * V * V))) + ' J<br>' +
          'หายไปเกือบทั้งหมด! นี่ยืนยันว่า<b>ห้ามใช้อนุรักษ์พลังงานในช่วงที่ 1</b> ✓<br>' +
          '<b>เกร็ดความรู้:</b> อุปกรณ์นี้เรียกว่า <b>ballistic pendulum</b> ' +
          'เป็นวิธีวัดความเร็วกระสุนที่ใช้จริงก่อนยุคอิเล็กทรอนิกส์ ' +
          'เพราะวัดความสูงที่แกว่งขึ้นง่ายกว่าวัดความเร็วกระสุนโดยตรงมาก</span>'
      }
    };
  }
});

T({
  id: 'p-2d', topic: 6, sub: 'การชนในสองมิติ', level: 'ยาก',
  skills: ['อนุรักษ์โมเมนตัมแยกแกน', 'รวมโมเมนตัมด้วยพีทาโกรัส'],
  gen(R) {
    const n = R.pick([2, 4, 5, 10, 20]);
    const m1 = R.pick([2, 3, 4]), m2 = R.pick([2, 3, 4]);
    const p1 = 3 * n, p2 = 4 * n, P = 5 * n;
    const u1 = r2(p1 / m1), u2 = r2(p2 / m2);
    const v = r2(P / (m1 + m2));
    if (!ok2(u1, u2, v) || u1 < 1 || u2 < 1 || u1 > 40 || u2 > 40) return null;
    return {
      stem: 'รถทดลองคันที่หนึ่งมวล ' + U(m1, 'kg') + ' แล่นไปทาง<b>ทิศตะวันออก</b>ด้วยความเร็ว ' +
        U(u1, 'm/s') + ' ชนกับคันที่สองมวล ' + U(m2, 'kg') + ' ที่แล่นมาทาง<b>ทิศเหนือ</b>ด้วยความเร็ว ' +
        U(u2, 'm/s') + ' <b>ตั้งฉากกัน</b> หลังชนรถทั้งสอง<b>ติดกันแล้วเคลื่อนที่ไปด้วยกัน</b> ' +
        'จงหา<b>อัตราเร็วร่วมหลังชน</b> และ<b>ทิศทางที่เคลื่อนที่ไป</b> (วัดเป็นมุมจากทิศตะวันออก)',
      figure: figForcesPoint({ forces: [
        { deg: 0, label: 'p₁ = ' + fmt(p1), len: 56 },
        { deg: 90, label: 'p₂ = ' + fmt(p2), len: 70 },
        { deg: 53, label: 'p รวม', len: 90 }] }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลคันที่หนึ่ง' },
              { s: 'u_1', v: u1, unit: 'm/s', d: 'ความเร็วคันที่หนึ่ง ไปทางตะวันออก' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลคันที่สอง' },
              { s: 'u_2', v: u2, unit: 'm/s', d: 'ความเร็วคันที่สอง ไปทางเหนือ' }],
      finds: [{ s: 'v', unit: 'm/s', d: 'อัตราเร็วร่วมหลังชน', value: v, positive: true },
              { s: 'θ', unit: '°', d: 'มุมที่ทำกับทิศตะวันออก', value: 53, positive: true }],
      sol: {
        analyze: '<b>หัวใจของการชนสองมิติ:</b> โมเมนตัมเป็น<b>เวกเตอร์</b> จึงอนุรักษ์<b>แยกกันในแต่ละแกน</b> ' +
          'อย่างเป็นอิสระต่อกัน<br>' +
          'ให้ทิศตะวันออกเป็นแกน ' + M('x') + ' และทิศเหนือเป็นแกน ' + M('y') + '<br>' +
          '• แกน ' + M('x') + ': มีแต่คันที่หนึ่งที่มีโมเมนตัม ⇒ ' + M('p_x = m_1 u_1 = ' + fmt(p1)) + ' kg·m/s<br>' +
          '• แกน ' + M('y') + ': มีแต่คันที่สองที่มีโมเมนตัม ⇒ ' + M('p_y = m_2 u_2 = ' + fmt(p2)) + ' kg·m/s<br>' +
          'หลังชนติดกัน ก้อนรวมมวล ' + M('m_1 + m_2 = ' + fmt(m1 + m2)) + ' kg ' +
          'ต้องมีโมเมนตัมในแต่ละแกนเท่าเดิมทุกประการ<br>' +
          '<b>ห้ามบวกความเร็วกันตรง ๆ</b> และ<b>ห้ามบวกโมเมนตัมสองแกนเป็นตัวเลขเดียว</b> ' +
          'ต้องรวมแบบเวกเตอร์เท่านั้น',
        eqs: [{ eq: 'p_x = m_1 u_1', why: 'อนุรักษ์โมเมนตัมแกน x — คันที่สองไม่มีองค์ประกอบในแกนนี้เลย' },
               { eq: 'p_y = m_2 u_2', why: 'อนุรักษ์โมเมนตัมแกน y — คันที่หนึ่งไม่มีองค์ประกอบในแกนนี้เลย' },
               { eq: 'p = √(p_x^2 + p_y^2)', why: 'สองแกนตั้งฉากกัน จึงรวมโมเมนตัมลัพธ์ด้วยพีทาโกรัส' },
               { eq: 'v = p / (m_1 + m_2)', why: 'หลังชนติดกันเป็นก้อนเดียว ความเร็วร่วมหาได้จากโมเมนตัมรวมหารมวลรวม' }],
        solve: EQ('p_x = m_1 u_1', 'p_y = m_2 u_2', 'p = √(p_x^2 + p_y^2)',
                  'v = p / (m_1 + m_2)', 'tan θ = p_y / p_x'),
        subst: SEQ('p_x = ({m1})({u1}) = {px}', { m1: m1, u1: u1, px: p1 }) +
               SEQ('p_y = ({m2})({u2}) = {py}', { m2: m2, u2: u2, py: p2 }) +
               SEQ('p = √({px}^2 + {py}^2)', { px: p1, py: p2 }) +
               SEQ('v = {P} / ({m1} + {m2})', { P: P, m1: m1, m2: m2 }),
        calc: EQ('p = √(' + fmtq(p1 * p1) + ' + ' + fmtq(p2 * p2) + ') = ' + fmtq(P) + ' `kg·m/s`',
                 'v = ' + fmtq(P) + ' / ' + fmtq(m1 + m2) + ' = ' + fmtq(v) + ' `m/s`',
                 'tan θ = ' + fmtq(p2) + ' / ' + fmtq(p1) + ' = 1.33  ⇒  θ = 53°'),
        conclude: 'ดังนั้น <b>อัตราเร็วร่วมหลังชน = ' + U(v, 'm/s') + '</b> ' +
          'เคลื่อนที่ไปในทิศ<b>ทำมุม 53° กับทิศตะวันออก</b> (คือไปทางทิศตะวันออกเฉียงเหนือ)<br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> ' + M('p_x : p_y = ' + fmt(p1) + ' : ' + fmt(p2)) +
          ' ย่อได้ 3 : 4 จึงเป็นสามเหลี่ยม 3-4-5 และได้ ' + M('tan θ = 4/3') + ' ⇒ 53° ✓<br>' +
          '<b>ข้อควรจำ:</b> ทิศหลังชนจะ<b>เอนไปทางฝั่งที่มีโมเมนตัมมากกว่า</b>เสมอ — ' +
          'ข้อนี้แกน y มีโมเมนตัมมากกว่า มุมจึงเกิน 45° ไปทางเหนือ ✓<br>' +
          'หลักการเดียวกันนี้ใช้วิเคราะห์<b>อุบัติเหตุรถชนกันที่สี่แยก</b>ในงานนิติวิทยาศาสตร์จริง</span>'
      }
    };
  }
});

/* คู่มวลสำหรับการชนแบบยืดหยุ่นสมบูรณ์ที่ให้คำตอบเป็นเลขสวย */
const ELP = [[3, 1], [1, 3], [5, 3], [3, 5], [2, 6], [6, 2], [9, 1], [7, 1]];

T({
  id: 'p-elastic', topic: 6, sub: 'การชนแบบยืดหยุ่นสมบูรณ์', level: 'ยาก',
  skills: ['ใช้สองสมการพร้อมกัน', 'ตีความเครื่องหมายของความเร็วหลังชน'],
  gen(R) {
    const pr = R.pick(ELP), m1 = pr[0], m2 = pr[1];
    const u1 = R.pick([4, 8, 12, 16, 20]);
    const v1 = r2((m1 - m2) / (m1 + m2) * u1);
    const v2 = r2(2 * m1 / (m1 + m2) * u1);
    if (!ok2(v1, v2) || Math.abs(v1) < 0.1) return null;
    const E1 = r2(0.5 * m1 * u1 * u1);
    const E2 = r2(0.5 * m1 * v1 * v1 + 0.5 * m2 * v2 * v2);
    if (!ok2(E1, E2)) return null;
    return {
      stem: 'ลูกกลมมวล ' + U(m1, 'kg') + ' เคลื่อนที่ด้วยความเร็ว ' + U(u1, 'm/s') +
        ' เข้าชนลูกกลมมวล ' + U(m2, 'kg') + ' ที่<b>อยู่นิ่ง</b>บนพื้นราบลื่น ' +
        'การชนเป็นแบบ<b>ยืดหยุ่นสมบูรณ์</b> จงหา<b>ความเร็วของลูกทั้งสองหลังชน</b>',
      figure: figChain({ masses: ['m₁', 'm₂'], Fleft: 'u₁ = ' + fmt(u1) + ' m/s' }),
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลลูกที่ชน' },
              { s: 'u_1', v: u1, unit: 'm/s', d: 'ความเร็วก่อนชน' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลลูกที่ถูกชน' },
              { s: 'u_2', v: 0, unit: 'm/s', d: 'อยู่นิ่งก่อนชน' }],
      finds: [{ s: 'v_1', unit: 'm/s', d: 'ความเร็วลูกที่หนึ่งหลังชน', value: v1, positive: false },
              { s: 'v_2', unit: 'm/s', d: 'ความเร็วลูกที่สองหลังชน', value: v2, positive: true }],
      sol: {
        analyze: '<b>การชนแบบยืดหยุ่นสมบูรณ์</b> คือการชนที่<b>พลังงานจลน์รวมไม่สูญเสียเลย</b> ' +
          'ไม่มีการเปลี่ยนรูปถาวร ไม่มีความร้อน (เช่น ลูกบิลเลียด หรือโมเลกุลของแก๊ส)<br>' +
          'จึงมี<b>สองสมการ</b>ให้ใช้ ต่างจากการชนแบบอื่นที่มีสมการเดียว:<br>' +
          '1. อนุรักษ์<b>โมเมนตัม</b> (ใช้ได้ทุกการชน)<br>' +
          '2. อนุรักษ์<b>พลังงานจลน์</b> (ใช้ได้เฉพาะการชนแบบยืดหยุ่นสมบูรณ์)<br>' +
          'สองสมการสองตัวแปร แก้ได้เสมอ แต่การแก้ตรง ๆ ยุ่งเพราะมีกำลังสอง ' +
          'นักฟิสิกส์จึงจัดรูปไว้ให้แล้วเป็น<b>สูตรสำเร็จ</b> ซึ่งใช้ได้เมื่อ ' + M('u_2 = 0') + '<br>' +
          'มวลรวม ' + M('m_1 + m_2 = ' + fmt(m1 + m2)) + ' kg',
        eqs: [{ eq: 'm_1 u_1 = m_1 v_1 + m_2 v_2', why: 'อนุรักษ์โมเมนตัม — สมการที่หนึ่ง' },
               { eq: '(1/2) m_1 u_1^2 = (1/2) m_1 v_1^2 + (1/2) m_2 v_2^2',
                 why: 'อนุรักษ์พลังงานจลน์ — สมการที่สอง ใช้ได้เพราะเป็นการชนแบบยืดหยุ่นสมบูรณ์' },

          'หายไป ' + fmt(r2(0.5 * m1 * u1 * u1 - 0.5 * (m1 + m2) * v * v)) +

          '<b>เทคนิคทำข้อสอบผสม:</b> อ่านโจทย์แล้ว<b>วาดไทม์ไลน์ของเหตุการณ์</b> ' +
          'จากนั้นถามตัวเองทุกช่วงว่า "ช่วงนี้มีการชนไหม" (ถ้ามี → โมเมนตัม) และ ' +
          '"ช่วงนี้มีเสียดทานไหม" (ถ้าไม่มี → พลังงานกลอนุรักษ์)</span>'

/* ============================ บทที่ 7 : การเคลื่อนที่แบบต่าง ๆ ============
   เนื้อหา: การเคลื่อนที่แบบโพรเจกไทล์ · การเคลื่อนที่แบบวงกลม ·
           แรงสู่ศูนย์กลาง · วงกลมแนวดิ่งและทางโค้ง · การเคลื่อนที่แบบฮาร์มอนิกอย่างง่าย

T({
  id: 'm-proj-t', topic: 7, sub: 'โพรเจกไทล์แนวราบ', level: 'ง่าย',
  skills: ['แนวดิ่งกับแนวราบเป็นอิสระต่อกัน', 'เวลาตกไม่ขึ้นกับความเร็วต้นแนวราบ'],
  gen(R, c) {
    const g = c.g, t = R.pick([1, 2, 3, 4]);
    const h = r2(0.5 * g * t * t);
    const u = R.pick([5, 10, 15, 20, 25]);
    if (!ok2(h)) return null;
    const ball = R.pick(BALLS);
    return {
      stem: 'ปา' + esc(ball) + 'ออกไปใน<b>แนวราบ</b>ด้วยความเร็ว ' + U(u, 'm/s') +
        ' จากยอดหน้าผาสูง ' + U(h, 'm') + ' จงหา<b>เวลาที่' + esc(ball) + 'ใช้ตกถึงพื้น</b> ' +
        '(ไม่คิดแรงต้านอากาศ กำหนด ' + GTXT(g) + ')',
      figure: figProj({ mode: 'h', u: 'u = ' + fmt(u) + ' m/s', hlab: 'h = ' + fmt(h) + ' m' }),
      given: [{ s: 'h', v: h, unit: 'm', d: 'ความสูงของหน้าผา' },
              { s: 'u_x', v: u, unit: 'm/s', d: 'ความเร็วต้นในแนวราบ' },
              { s: 'u_y', v: 0, unit: 'm/s', d: 'ความเร็วต้นในแนวดิ่ง (ปาในแนวราบ)' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 't', unit: 's', d: 'เวลาที่ใช้ตกถึงพื้น', value: t, positive: true }],
      distract: [r2(h / u), r2(2 * t), r2(t / 2), r2(h / g), r2(u / g), r2(t + 1)],
      sol: {
        analyze: '<b>หลักการสำคัญที่สุดของโพรเจกไทล์:</b> ' +
          'การเคลื่อนที่ใน<b>แนวราบ</b>และ<b>แนวดิ่ง</b>เป็น<b>อิสระต่อกันโดยสิ้นเชิง</b> ' +
          'คิดแยกกันได้เลย เชื่อมกันด้วย<b>เวลา</b>ตัวเดียวเท่านั้น<br>' +
          '• แนวราบ: ไม่มีแรงกระทำ ⇒ ความเร็วคงที่ตลอด<br>' +
          '• แนวดิ่ง: มีแรงโน้มถ่วง ⇒ เป็นการตกอิสระเหมือนปล่อยลงมาเฉย ๆ ทุกประการ<br>' +
          'โจทย์ถามเวลาตก ซึ่งเป็นเรื่องของ<b>แนวดิ่งล้วน ๆ</b> ' +
          'จึงไม่ต้องสนใจความเร็วในแนวราบเลย (โจทย์ให้มาเพื่อลวง)<br>' +
          'ปาในแนวราบ ⇒ ' + M('u_y = 0') + ' ⇒ ใช้ ' + M('h = (1/2) g t^2') + ' ได้ทันที',
        eqs: [{ eq: 'h = u_y t + (1/2) g t^2', why: 'สมการการเคลื่อนที่ในแนวดิ่ง ซึ่งมีความเร่ง g คงที่' },
               { eq: 'h = (1/2) g t^2', why: 'ปาในแนวราบทำให้ u_y = 0 พจน์แรกจึงหายไป เหลือรูปการตกอิสระ' }],
        solve: EQ('h = (1/2) g t^2', 't^2 = 2h / g', 't = √(2h / g)'),
        subst: SEQ('t = √( (2)({h}) / {g} )', { h: h, g: g }),
        calc: EQ('t = √(' + fmtq(r2(2 * h)) + ' / ' + fmtq(g) + ') = √' + fmtq(t * t),
                 't = ' + fmtq(t) + ' `s`'),
        conclude: 'ดังนั้น <b>' + esc(ball) + 'ใช้เวลาตกถึงพื้น ' + U(t, 's') + '</b><br>' +
          '<span class="hint"><b>ข้อสรุปที่ขัดสามัญสำนึกแต่ถูกต้อง:</b> ถ้าปล่อย' + esc(ball) +
          'อีกลูก<b>ตกลงตรง ๆ</b>จากยอดหน้าผาเดียวกันพร้อมกัน ทั้งสองลูกจะ<b>ถึงพื้นพร้อมกันเป๊ะ</b> ' +
          'แม้ลูกที่ปาจะไปได้ไกลกว่ามาก<br>' +
          'เพราะการเคลื่อนที่แนวราบไม่มีผลต่อการตกในแนวดิ่งเลย<br>' +
          '<b>คิดต่อ:</b> ระยะในแนวราบที่ไปได้ = ' + M('u t = ' + fmt(u) + ' × ' + fmt(t) + ' = ' + fmt(r2(u * t))) + ' m</span>'
      }
    };
  }
});

T({
  id: 'm-proj-x', topic: 7, sub: 'ระยะทางแนวราบของโพรเจกไทล์', level: 'ง่าย',
  skills: ['แนวราบเคลื่อนที่ด้วยความเร็วคงที่', 'ใช้เวลาเป็นตัวเชื่อมสองแนว'],
  gen(R, c) {
    const g = c.g, t = R.pick([1, 2, 3, 4]);
    const h = r2(0.5 * g * t * t);

      stem: 'ลูกกลมกลิ้งออกจากขอบโต๊ะสูง ' + U(h, 'm') + ' ด้วยความเร็วในแนวราบ ' + U(u, 'm/s') +
        ' จงหา<b>ระยะในแนวราบจากขอบโต๊ะถึงจุดตกกระทบพื้น</b> ' +

      finds: [{ s: 'x', unit: 'm', d: 'ระยะในแนวราบถึงจุดตก', value: x, positive: true }],
      distract: [r2(u * t * 2), r2(u * t / 2), r2(u + h), r2(h * u), r2(u * h / g), r2(2 * h)],
      sol: {
        analyze: 'โจทย์ถามระยะใน<b>แนวราบ</b> แต่ข้อมูลที่ให้มาโดยตรงคือความสูงในแนวดิ่ง ' +

          'ในแนวราบไม่มีแรงกระทำ ⇒ ความเร็วคงที่ ⇒ ใช้ ' + M('x = u t') + ' แบบง่ายที่สุด',
        eqs: [{ eq: 'h = (1/2) g t^2', why: 'แนวดิ่ง — ใช้หาเวลาลอยในอากาศ เพราะความเร็วต้นแนวดิ่งเป็นศูนย์' },

T({
