TQ({
  id: 'tq-m6', topic: 7, sub: 'วงกลมแนวดิ่ง', skills: ['เงื่อนไขที่จุดสูงสุดและจุดต่ำสุด'],
  gen(R) { return {
    stem: 'แกว่งวัตถุผูกเชือกเป็นวงกลมในแนวดิ่ง <b>เชือกมักจะขาดที่ตำแหน่งใด</b>',
    choices: [
      C('จุดต่ำสุด เพราะแรงตึงเชือกมากที่สุดที่นั่น',
        'ที่จุดต่ำสุดเชือกต้องทั้งรับน้ำหนักและให้แรงสู่ศูนย์กลางพร้อมกัน'),
      X('จุดสูงสุด เพราะวัตถุอยู่สูงที่สุด', 'ที่จุดสูงสุดน้ำหนักช่วยเป็นแรงสู่ศูนย์กลาง เชือกจึงออกแรงน้อยลง'),
      X('ตำแหน่งกึ่งกลางด้านข้าง', 'ที่ด้านข้างน้ำหนักตั้งฉากกับรัศมี ไม่ได้ช่วยและไม่ได้ขัด'),
      X('ขาดที่ตำแหน่งใดก็ได้เท่า ๆ กัน เพราะแรงตึงเท่ากันตลอด', 'แรงตึงเปลี่ยนตลอดรอบ ไม่ได้คงที่')
    ],
    idea: 'เปรียบเทียบสมการที่สองตำแหน่ง โดยให้ทิศเข้าหาศูนย์กลางเป็นบวกเสมอ<br>' +
      '<b>ที่จุดสูงสุด</b> — ทั้งน้ำหนักและแรงตึงชี้<b>ลง</b> ซึ่งเป็นทิศเข้าศูนย์กลางทั้งคู่<br>' +
      M('m g + T = m v^2 / r') + ' ⇒ ' + M('T = m v^2/r - m g') + ' ⇒ <b>น้อยลงเพราะน้ำหนักช่วย</b><br>' +
      '<b>ที่จุดต่ำสุด</b> — แรงตึงชี้<b>ขึ้น</b> (เข้าศูนย์กลาง) ส่วนน้ำหนักชี้<b>ลง</b> (ออกจากศูนย์กลาง)<br>' +
      M('T - m g = m v^2 / r') + ' ⇒ ' + M('T = m v^2/r + m g') + ' ⇒ <b>มากขึ้นเพราะต้องสู้กับน้ำหนักด้วย</b><br>' +
      'ผลต่างระหว่างสองจุดคือ ' + M('2 m g') + ' เสมอ',
    why: '<b>สรุปที่ต้องจำ</b><br>' +
      '• จุดสูงสุด: ' + M('T_{ยอด} = m v^2/r - m g') + ' (น้อยที่สุด)<br>' +
      '• จุดต่ำสุด: ' + M('T_{ล่าง} = m v^2/r + m g') + ' (<b>มากที่สุด</b>)<br>' +
      '<b>เงื่อนไขวิกฤตที่จุดสูงสุด:</b> ถ้าช้าเกินไปจน ' + M('T = 0') + ' ⇒ ' +
      M('v_{ต่ำสุด} = √(g r)') + ' ' +
      'ถ้าช้ากว่านี้วัตถุจะร่วงหลุดจากวงกลม<br>' +
      '<b>ประยุกต์:</b> รถไฟเหาะตีลังกาออกแบบให้ความเร็วที่ยอดวงเกิน ' + M('√(gr)') +
      ' เสมอ และโครงสร้างรางส่วนล่างต้องแข็งแรงเป็นพิเศษเพราะรับแรงมากที่สุด'
  }; }
});

TQ({

      X('ทั้งความเร็วและความเร่งเป็นศูนย์', 'ถ้าความเร่งเป็นศูนย์ด้วย วัตถุจะค้างอยู่ตรงนั้นไม่กลับมา'),

      X('ทั้งความเร็วและความเร่งมีค่ามากที่สุด', 'สองอย่างนี้ไม่มีทางมากที่สุดพร้อมกันใน SHM')

    idea: '<b>ภาพรวมของ SHM ที่ต้องเห็นให้ชัด</b><br>' +

      '• การกระจัด = 0 ⇒ แรงดึงกลับ = 0 ⇒ <b>ความเร่ง = 0</b><br>' +

T({

      figure: figForcesPoint({ maxLen: 96,
        forces: [
          { deg: 0, label: 'F₁ = ' + fmt(a) + ' N', mag: a },
          { deg: c.deg, label: 'F₂ = ' + fmt(b) + ' N', mag: b }],
        arcs: [{ to: c.deg, label: 'α = ?' }] }),
      given: [{ s: 'F_1', v: a, unit: 'N', d: 'แรงที่หนึ่ง' },
              { s: 'F_2', v: b, unit: 'N', d: 'แรงที่สอง' },
              { s: 'R', v: Rm, unit: 'N', d: 'ขนาดแรงลัพธ์ที่วัดได้' }],
      finds: [{ s: 'α', unit: '°', d: 'มุมระหว่างแรงทั้งสอง', value: c.deg, positive: true }],
      sol: {
        analyze: 'โจทย์ให้ขนาดครบทั้งสามค่าแล้วถามมุม จึงต้องใช้<b>กฎของโคไซน์ย้อนกลับ</b><br>' +
          'ตรวจก่อนว่าเป็นไปได้ไหม: ลัพธ์ต้องอยู่ระหว่าง ' + U(Math.abs(a - b), 'N') + ' ถึง ' +
          U(a + b, 'N') + ' — ค่า ' + fmt(Rm) + ' N อยู่ในช่วงนี้ ✓<br>' +
          '<b>วิธีคิด:</b> เริ่มจากสูตรรวมเวกเตอร์แล้วย้ายข้างจนเหลือ ' + M('cos α') +
          ' อยู่ตัวเดียว จากนั้นเทียบกับค่าโคไซน์ที่คุ้นเคย<br>' +
          'ค่าที่ควรจำ: ' + M('cos 60° = 0.5') + ' และ ' + M('cos 120° = -0.5'),
        eqs: [{ eq: 'R^2 = F_1^2 + F_2^2 + 2 F_1 F_2 cos α', why: 'กฎของโคไซน์สำหรับการรวมเวกเตอร์' },
               { eq: 'cos α = (R^2 - F_1^2 - F_2^2) / (2 F_1 F_2)',
                 why: 'ย้ายข้างแยก cos α ออกมา แล้วจึงเทียบหามุม' }],
        solve: EQ('2 F_1 F_2 cos α = R^2 - F_1^2 - F_2^2',
                  'cos α = (R^2 - F_1^2 - F_2^2) / (2 F_1 F_2)'),
        subst: SEQ('cos α = ({R}^2 - {a}^2 - {b}^2) / (2 × {a} × {b})', { R: Rm, a: a, b: b }),
        calc: EQ('cos α = (' + fmtq(Rm * Rm) + ' - ' + fmtq(a * a) + ' - ' + fmtq(b * b) + ') / ' + fmtq(2 * a * b),
                 'cos α = ' + fmtq(r2(Rm * Rm - a * a - b * b)) + ' / ' + fmtq(2 * a * b) + ' = ' + fmtq(cosv),
                 'α = ' + fmt(c.deg) + '°'),
        conclude: 'ดังนั้น <b>แรงทั้งสองทำมุมกัน ' + fmt(c.deg) + '°</b><br>' +
          '<span class="hint"><b>อ่านความหมายจากเครื่องหมายของโคไซน์</b><br>' +
          '• ' + M('cos α > 0') + ' ⇒ มุม<b>แหลม</b> แรงเสริมกัน ลัพธ์ใหญ่กว่ากรณีตั้งฉาก<br>' +
          '• ' + M('cos α = 0') + ' ⇒ <b>ตั้งฉาก</b>พอดี ลดรูปเป็นพีทาโกรัส<br>' +
          '• ' + M('cos α < 0') + ' ⇒ มุม<b>ป้าน</b> แรงเริ่มหักล้างกัน ลัพธ์เล็กลง<br>' +
          'ข้อนี้ได้ ' + M('cos α = ' + fmtq(cosv)) + ' ⇒ เป็นมุม' + (cosv > 0 ? 'แหลม' : 'ป้าน') +
          ' สอดคล้องกับที่ลัพธ์' + (cosv > 0 ? 'ค่อนข้างใหญ่' : 'ค่อนข้างเล็ก') + ' ✓</span>'
      }
    };
  }
});

      finds: [{ s: 'a', unit: 'm/s²', d: 'ขนาดของความเร่งในการเบรก', value: a, positive: true }],
      distract: [r2(u / s), r2(u * u / s), r2(a / 2), r2(a * 2), r2(s / u), r2(u / (2 * s))],
      sol: {
        analyze: 'โจทย์ให้ ' + M('u') + ', ' + M('v = 0') + ', ' + M('s') + ' แล้วถาม ' + M('a') +
          ' — <b>ไม่ให้เวลาและไม่ถามเวลา</b><br>' +

          '<b>เรื่องเครื่องหมาย:</b> ให้ทิศที่รถแล่นเป็นบวก รถชะลอลง ⇒ ' +
          'ความเร่งมีทิศ<b>ตรงข้าม</b>การเคลื่อนที่ ⇒ ค่าที่คำนวณได้จะ<b>ติดลบ</b><br>' +
          'แต่โจทย์ถาม "<b>ขนาด</b>" จึงตอบเป็นค่าบวก',
        eqs: [{ eq: 'v^2 = u^2 + 2 a s', why: 'สมการเดียวที่มี u, v, a, s ครบโดยไม่มีเวลา' }],
        solve: EQ('0 = u^2 + 2 a s', '2 a s = -u^2', 'a = -u^2 / (2 s)') +
          '<div class="why">เครื่องหมายลบบอกว่าความเร่งมีทิศตรงข้ามการเคลื่อนที่ ส่วนขนาดคือค่าสัมบูรณ์</div>',
        subst: SEQ('a = {u}^2 / (2 × {s})', { u: u, s: s }),
        calc: EQ('a = ' + fmtq(u * u) + ' / ' + fmtq(2 * s), 'a = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>ความเร่งในการเบรกมีขนาด ' + U(a, 'm/s²') + '</b> ' +
          'มีทิศตรงข้ามกับการเคลื่อนที่<br>' +
          '<span class="hint"><b>คิดต่อ:</b> เวลาที่ใช้เบรก = ' +
          M('u / a = ' + fmt(u) + ' / ' + fmt(a) + ' = ' + fmt(r2(u / a))) + ' วินาที<br>' +
          '<b>ข้อควรรู้เรื่องความปลอดภัย:</b> ระยะเบรกแปรผันกับ ' + M('u^2') + ' ⇒ ' +
          'ถ้าขับเร็วขึ้น<b>สองเท่า</b> ระยะเบรกจะยาวขึ้นถึง<b>สี่เท่า</b> ' +
          '(คือ ' + U(r2(4 * s), 'm') + ') ที่ความสามารถในการเบรกเท่าเดิม</span>'
      }
    };
  }
});

T({
  id: 'k2-brake', topic: 1, sub: 'ระยะและเวลาในการเบรก', level: 'ปานกลาง',
  skills: ['ใช้สมการการเคลื่อนที่สองสมการต่อกัน'],
  gen(R) {
    const u = R.pick([12, 16, 20, 24, 30, 36]);
    const a = R.pick([2, 3, 4, 5, 6]);
    const t = r2(u / a), s = r2(u * u / (2 * a));
    if (!ok2(t, s) || s > 400) return null;
    const car = R.pick(CARS);
    return {
      stem: esc(car) + 'แล่นด้วยความเร็ว ' + U(u, 'm/s') + ' คนขับเหยียบเบรกทำให้เกิดความเร่งขนาด ' +
        U(a, 'm/s²') + ' ในทิศตรงข้ามการเคลื่อนที่ จงหา<b>เวลาที่ใช้จนหยุดสนิท</b> ' +
        'และ<b>ระยะทางที่แล่นต่อไปได้ก่อนหยุด</b>',
      given: [{ s: 'u', v: u, unit: 'm/s', d: 'ความเร็วต้น' },
              { s: 'v', v: 0, unit: 'm/s', d: 'ความเร็วปลาย (หยุดสนิท)' },
              { s: 'a', v: -a, unit: 'm/s²', d: 'ความเร่ง (ทิศตรงข้ามการเคลื่อนที่)' }],
      finds: [{ s: 't', unit: 's', d: 'เวลาที่ใช้จนหยุด', value: t, positive: true },
              { s: 's', unit: 'm', d: 'ระยะเบรก', value: s, positive: true }],
      sol: {
        analyze: 'โจทย์ถามสองอย่าง จึงต้องใช้<b>สองสมการ</b><br>' +
          '<b>หาเวลา</b> — มี ' + M('u, v, a') + ' ต้องการ ' + M('t') + ' และไม่เกี่ยวกับ ' + M('s') +
          ' ⇒ ใช้ ' + M('v = u + a t') + '<br>' +
          '<b>หาระยะ</b> — มี ' + M('u, v, a') + ' ต้องการ ' + M('s') + ' และไม่เกี่ยวกับ ' + M('t') +
          ' ⇒ ใช้ ' + M('v^2 = u^2 + 2 a s') + '<br>' +
          '<b>เรื่องเครื่องหมาย:</b> ให้ทิศการเคลื่อนที่เป็นบวก ⇒ ' + M('a = -' + fmt(a)) + ' m/s²',
        eqs: [{ eq: 'v = u + a t', why: 'ใช้หาเวลา เพราะไม่มีการกระจัดเข้ามาเกี่ยว' },
               { eq: 'v^2 = u^2 + 2 a s', why: 'ใช้หาระยะเบรก เพราะไม่มีเวลาเข้ามาเกี่ยว' }],
        solve: EQ('0 = u - a t', 't = u / a') + EQ('0 = u^2 - 2 a s', 's = u^2 / (2 a)'),
        subst: SEQ('t = {u} / {a}', { u: u, a: a }) + SEQ('s = {u}^2 / (2 × {a})', { u: u, a: a }),
        calc: EQ('t = ' + fmtq(t) + ' `s`',
                 's = ' + fmtq(u * u) + ' / ' + fmtq(2 * a) + ' = ' + fmtq(s) + ' `m`'),
        conclude: 'ดังนั้น <b>ใช้เวลา ' + U(t, 's') + ' และแล่นต่อไปอีก ' + U(s, 'm') + ' จึงหยุด</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยวิธีที่สาม:</b> ความเร็วเฉลี่ยระหว่างเบรก = ' +
          M('(u + 0)/2 = ' + fmt(r2(u / 2))) + ' m/s<br>' +
          'ระยะ = ความเร็วเฉลี่ย × เวลา = ' + M(fmt(r2(u / 2)) + ' × ' + fmt(t) + ' = ' + fmt(s)) + ' m ✓<br>' +
          '<b>ข้อคิดเรื่องความปลอดภัย:</b> ระยะเบรกจริงยัง<b>ไม่รวมระยะคิด</b> ' +
          'ซึ่งคือระยะที่รถแล่นไประหว่างที่คนขับยังไม่ทันเหยียบเบรก (ราว 0.7–1.5 วินาที) ' +
          'คิดเป็นอีกราว ' + U(r2(u), 'm') + '</span>'
      }
    };
  }
});

T({
  id: 'k2-updown', topic: 1, sub: 'การขว้างขึ้นในแนวดิ่ง', level: 'ปานกลาง',
  skills: ['สมมาตรของการขึ้นและลง', 'เงื่อนไขที่จุดสูงสุด'],
  gen(R, c) {
    const g = c.g, k = R.pick([1, 2, 3, 4]);
    const u = r2(g * k);
    const H = r2(0.5 * g * k * k), tot = r2(2 * k);
    if (!ok2(u, H)) return null;
    const ball = R.pick(BALLS);
    return {
      stem: 'โยน' + esc(ball) + 'ขึ้นตรง ๆ ในแนวดิ่งด้วยความเร็วต้น ' + U(u, 'm/s') +
        ' จงหา<b>เวลาที่ขึ้นถึงจุดสูงสุด</b> <b>ความสูงสูงสุด</b> ' +
        'และ<b>เวลาทั้งหมดจนกลับมาถึงมือ</b> (ไม่คิดแรงต้านอากาศ กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'u', v: u, unit: 'm/s', d: 'ความเร็วต้น (ขึ้น)' },
              { s: 'v_{ยอด}', v: 0, unit: 'm/s', d: 'ความเร็วที่จุดสูงสุด' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง (ชี้ลง)' }],
      finds: [{ s: 't_{ขึ้น}', unit: 's', d: 'เวลาขึ้นถึงจุดสูงสุด', value: k, positive: true },
              { s: 'H', unit: 'm', d: 'ความสูงสูงสุด', value: H, positive: true },
              { s: 't_{รวม}', unit: 's', d: 'เวลาทั้งหมดจนกลับถึงมือ', value: tot, positive: true }],
      sol: {
        analyze: '<b>ข้อเท็จจริงสำคัญ:</b> ตลอดการเคลื่อนที่ทั้งขาขึ้นและขาลง ' +
          'ความเร่งเท่ากับ ' + M('g') + ' <b>ชี้ลงเสมอ ไม่เคยเปลี่ยน</b><br>' +
          '<b>เงื่อนไขที่จุดสูงสุด:</b> ' + M('v = 0') + ' (แต่ ' + M('a') + ' ยังเป็น ' + M('g') + ')<br>' +
          'ให้ทิศขึ้นเป็นบวก ⇒ ' + M('a = -g') + '<br>' +
          '<b>สมมาตรของการเคลื่อนที่:</b> เพราะความเร่งคงที่ตลอด ' +
          '<b>เวลาขึ้นจึงเท่ากับเวลาลงพอดี</b> ⇒ เวลารวม = ' + M('2 t_{ขึ้น}'),
        eqs: [{ eq: 'v = u - g t', why: 'ใช้หาเวลาขึ้น โดยที่จุดสูงสุด v = 0' },
               { eq: 'H = u^2 / (2 g)', why: 'จาก v² = u² - 2gH โดยที่จุดสูงสุด v = 0' },
               { eq: 't_{รวม} = 2 t_{ขึ้น}', why: 'สมมาตร — เวลาขึ้นเท่ากับเวลาลง' }],
        solve: EQ('0 = u - g t_{ขึ้น}', 't_{ขึ้น} = u / g', 'H = u^2 / (2 g)', 't_{รวม} = 2 t_{ขึ้น}'),
        subst: SEQ('t_{ขึ้น} = {u} / {g}', { u: u, g: g }) +
               SEQ('H = {u}^2 / (2 × {g})', { u: u, g: g }),
        calc: EQ('t_{ขึ้น} = ' + fmtq(k) + ' `s`',
                 'H = ' + fmtq(r2(u * u)) + ' / ' + fmtq(r2(2 * g)) + ' = ' + fmtq(H) + ' `m`',
                 't_{รวม} = ' + fmtq(tot) + ' `s`'),
        conclude: 'ดังนั้น <b>ขึ้นถึงจุดสูงสุดใน ' + U(k, 's') + ' ที่ความสูง ' + U(H, 'm') +
          ' และกลับถึงมือเมื่อครบ ' + U(tot, 's') + '</b><br>' +
          '<span class="hint"><b>สมบัติสมมาตรที่ควรจำ</b><br>' +
          '• เวลาขึ้น = เวลาลง<br>' +
          '• ความเร็วตอนกลับถึงมือ = ' + U(u, 'm/s') + ' <b>เท่าตอนโยน</b> (แต่ทิศลง)<br>' +
          '• ที่ระดับความสูงเดียวกัน ขนาดความเร็วขาขึ้นกับขาลงเท่ากันเสมอ<br>' +
          '<b>ข้อควรระวัง:</b> ที่จุดสูงสุด ' + M('v = 0') + ' แต่ ' + M('a = g') +
          ' <b>ไม่เป็นศูนย์</b> — ถ้าเป็นศูนย์จริง ลูกบอลจะลอยค้างอยู่ตรงนั้นตลอดไป</span>'
      }
    };
  }
});

T({
  id: 'k2-twostage', topic: 1, sub: 'การเคลื่อนที่สองช่วงต่อเนื่อง', level: 'ยาก',
  skills: ['แบ่งช่วงการเคลื่อนที่', 'ใช้ผลของช่วงแรกเป็นข้อมูลของช่วงหลัง'],
  gen(R) {
    const a1 = R.pick([1, 1.5, 2, 2.5, 3]);
    const t1 = R.pick([4, 6, 8, 10, 12]);
    const vmax = r2(a1 * t1);
    const a2 = R.pick([2, 3, 4, 5, 6]);
    const t2 = r2(vmax / a2);
    const s1 = r2(0.5 * a1 * t1 * t1), s2 = r2(vmax * vmax / (2 * a2));
    const tot = r2(s1 + s2);
    if (!ok2(vmax, t2, s1, s2, tot) || vmax > 60 || tot > 900) return null;
    const car = R.pick(CARS);
    return {
      stem: esc(car) + 'ออกตัวจากหยุดนิ่งด้วยความเร่งคงที่ ' + U(a1, 'm/s²') + ' เป็นเวลา ' +
        U(t1, 's') + ' จากนั้น<b>เบรกทันที</b>ด้วยความเร่งขนาด ' + U(a2, 'm/s²') +
        ' จนหยุดสนิท จงหา<b>ความเร็วสูงสุด</b> <b>เวลาที่ใช้เบรก</b> และ<b>ระยะทางรวมทั้งหมด</b>',
      given: [{ s: 'a_1', v: a1, unit: 'm/s²', d: 'ความเร่งช่วงออกตัว' },
              { s: 't_1', v: t1, unit: 's', d: 'เวลาช่วงออกตัว' },
              { s: 'a_2', v: a2, unit: 'm/s²', d: 'ขนาดความเร่งช่วงเบรก' },
              { s: 'u', v: 0, unit: 'm/s', d: 'เริ่มจากหยุดนิ่ง' }],
      finds: [{ s: 'v_{สูงสุด}', unit: 'm/s', d: 'ความเร็วสูงสุด (ตอนสิ้นสุดช่วงแรก)', value: vmax, positive: true },
              { s: 't_2', unit: 's', d: 'เวลาที่ใช้เบรกจนหยุด', value: t2, positive: true },
              { s: 's_{รวม}', unit: 'm', d: 'ระยะทางรวมทั้งสองช่วง', value: tot, positive: true }],
      sol: {
        analyze: '<b>โจทย์นี้มีความเร่งสองค่า จึงใช้สมการเดียวรวดเดียวไม่ได้</b> ' +
          'ต้องแบ่งเป็นสองช่วงแล้วคิดทีละช่วง<br>' +
          '<b>จุดเชื่อมของสองช่วง</b> คือความเร็วตอนสิ้นสุดช่วงแรก ' +
          'ซึ่งกลายเป็น<b>ความเร็วต้นของช่วงที่สอง</b> และเป็น<b>ความเร็วสูงสุด</b>ของทั้งการเดินทาง<br>' +
          '<b>ช่วงที่ 1 — เร่ง:</b> ' + M('u = 0') + ', ' + M('a_1') + ', ' + M('t_1') + ' ⇒ หา ' +
          M('v_{สูงสุด}') + ' และ ' + M('s_1') + '<br>' +
          '<b>ช่วงที่ 2 — เบรก:</b> ' + M('u = v_{สูงสุด}') + ', ' + M('v = 0') + ', ' + M('a_2') +
          ' ⇒ หา ' + M('t_2') + ' และ ' + M('s_2'),
        eqs: [{ eq: 'v_{สูงสุด} = a_1 t_1', why: 'ช่วงที่ 1 จาก v = u + at โดย u = 0' },
               { eq: 's_1 = (1/2) a_1 t_1^2', why: 'ช่วงที่ 1 ระยะทางจากการเร่งโดยเริ่มจากหยุดนิ่ง' },
               { eq: 't_2 = v_{สูงสุด} / a_2', why: 'ช่วงที่ 2 เวลาที่ใช้ลดความเร็วจาก vสูงสุด จนเป็นศูนย์' },
               { eq: 's_2 = v_{สูงสุด}^2 / (2 a_2)', why: 'ช่วงที่ 2 ระยะเบรก จาก v² = u² - 2as' }],
        solve: EQ('v_{สูงสุด} = a_1 t_1', 's_1 = (1/2) a_1 t_1^2',
                  't_2 = v_{สูงสุด} / a_2', 's_2 = v_{สูงสุด}^2 / (2 a_2)',
                  's_{รวม} = s_1 + s_2'),
        subst: SEQ('v_{สูงสุด} = ({a})({t})', { a: a1, t: t1 }) +
               SEQ('s_1 = (1/2)({a})({t})^2', { a: a1, t: t1 }) +
               SEQ('t_2 = {v} / {a}', { v: vmax, a: a2 }) +
               SEQ('s_2 = {v}^2 / (2 × {a})', { v: vmax, a: a2 }),
        calc: EQ('v_{สูงสุด} = ' + fmtq(vmax) + ' `m/s`',
                 's_1 = ' + fmtq(s1) + ' `m`',
                 't_2 = ' + fmtq(t2) + ' `s`',
                 's_2 = ' + fmtq(s2) + ' `m`',
                 's_{รวม} = ' + fmtq(s1) + ' + ' + fmtq(s2) + ' = ' + fmtq(tot) + ' `m`'),
        conclude: 'ดังนั้น <b>ความเร็วสูงสุด ' + U(vmax, 'm/s') + ' · ใช้เวลาเบรก ' + U(t2, 's') +
          ' · ระยะทางรวม ' + U(tot, 'm') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยกราฟ ' + M('v') + '–' + M('t') + '</b><br>' +
          'กราฟเป็น<b>รูปสามเหลี่ยม</b> ฐาน ' + M('t_1 + t_2 = ' + fmt(r2(t1 + t2))) +
          ' s สูง ' + M('v_{สูงสุด} = ' + fmt(vmax)) + ' m/s<br>' +
          'พื้นที่ = ' + M('(1/2)(' + fmt(r2(t1 + t2)) + ')(' + fmt(vmax) + ') = ' + fmt(tot)) +
          ' m ✓ ตรงกับระยะทางรวมพอดี<br>' +
          '<b>เทคนิคทำโจทย์หลายช่วง:</b> วาดกราฟ ' + M('v') + '–' + M('t') +
          ' คร่าว ๆ ก่อน แล้วหาพื้นที่ มักเร็วกว่าการแทนสูตรทีละช่วงมาก</span>'
      }
    };
  }
});

T({
  id: 'f2-netacc', topic: 2, sub: 'แรงลัพธ์กับความเร่ง', level: 'ง่าย',
  skills: ['หาแรงลัพธ์ก่อนแล้วจึงใช้ ΣF = ma'],
  gen(R) {
    const m = R.pick([2, 4, 5, 8, 10, 20]);
    const F1 = R.step(20, 100, 10), F2 = R.step(5, 40, 5);
    if (F2 >= F1) return null;
    const a = r2((F1 - F2) / m);
    if (!ok2(a) || a < 0.2) return null;
    const box = R.pick(BOXES);
    return {
      stem: esc(box) + 'มวล ' + U(m, 'kg') + ' วางบนพื้นราบ ถูกแรง ' + U(F1, 'N') +
        ' ผลักไปทางขวา และมีแรงต้าน ' + U(F2, 'N') + ' กระทำไปทางซ้าย ' +
        'จงหา<b>ความเร่ง</b>ของ' + esc(box),
      figure: figChain({ masses: ['m'], F: 'F₁ = ' + fmt(F1) + ' N', Fleft: 'F₂ = ' + fmt(F2) + ' N' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'F_1', v: F1, unit: 'N', d: 'แรงผลักไปทางขวา' },
              { s: 'F_2', v: F2, unit: 'N', d: 'แรงต้านไปทางซ้าย' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่ง', value: a, positive: true }],
      distract: [r2(F1 / m), r2((F1 + F2) / m), r2(F2 / m), r2(a * 2), r2(a / 2), r2(m / (F1 - F2))],
      sol: {
        analyze: '<b>กับดักของข้อนี้:</b> เอา ' + M('F_1') + ' หารมวลทันที โดยลืมหักแรงต้าน<br>' +
          'กฎข้อที่สองของนิวตันใช้กับ<b>แรงลัพธ์</b> ไม่ใช่แรงใดแรงหนึ่ง<br>' +

          '3. แทนใน ' + M('ΣF = m a') + '<br>' +

        eqs: [{ eq: 'ΣF = F_1 - F_2', why: 'รวมแรงในแนวราบโดยใส่เครื่องหมายตามทิศ' },
               { eq: 'a = ΣF / m', why: 'กฎข้อที่สองของนิวตัน จัดรูปเพื่อหาความเร่ง' }],
        solve: EQ('ΣF = F_1 - F_2', 'a = ΣF / m'),
        subst: SEQ('a = ({a} - {b}) / {m}', { a: F1, b: F2, m: m }),
        calc: EQ('a = ' + fmtq(F1 - F2) + ' / ' + fmtq(m), 'a = ' + fmtq(a) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>ความเร่ง = ' + U(a, 'm/s²') + '</b> มีทิศไปทางขวา (ตามแรงที่มากกว่า)<br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> ถ้าคิด ' + M('F_1') + ' อย่างเดียวจะได้ ' +
          U(r2(F1 / m), 'm/s²') + ' ซึ่ง<b>มากเกินจริง</b> เพราะไม่ได้หักแรงต้านออก<br>' +
          '<b>กรณีพิเศษที่ควรลองคิด:</b> ถ้า ' + M('F_2') + ' เพิ่มขึ้นจนเท่ากับ ' + M('F_1') +
          ' ⇒ ' + M('ΣF = 0') + ' ⇒ ' + M('a = 0') + ' ⇒ ' + esc(box) +
          'จะเคลื่อนที่ด้วย<b>ความเร็วคงที่</b> (ไม่ใช่หยุดนิ่ง ถ้าเดิมเคลื่อนที่อยู่)</span>'
      }
    };
  }
});

T({

              { s: 'g', v: p.g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วงของ' + p.n }],
      finds: [{ s: 'W', unit: 'N', d: 'น้ำหนักบน' + p.n, value: W, positive: true }],
      distract: [m, r2(m / p.g), r2(m * 9.8), r2(W / 2), r2(W * 2), r2(m + p.g)],
      sol: {
        analyze: '<b>ต้องแยกมวลกับน้ำหนักให้ขาด</b><br>' +
          '• <b>มวล</b> — ปริมาณเนื้อสาร หน่วยกิโลกรัม <b>ไม่เปลี่ยนตามสถานที่</b><br>' +
          '• <b>น้ำหนัก</b> — <b>แรง</b>ที่ดาวดึงวัตถุ หน่วยนิวตัน <b>เปลี่ยนตามค่า ' + M('g') + '</b><br>' +
          'ดังนั้นมวลบน' + p.n + 'ยังคงเป็น ' + U(m, 'kg') + ' เท่าเดิมทุกกรัม ' +
          'แต่ต้องคำนวณน้ำหนักใหม่โดยใช้ ' + M('g') + ' ของ' + p.n,
        eqs: [{ eq: 'W = m g', why: 'น้ำหนักคือแรงโน้มถ่วง = มวล คูณ ความเร่งโน้มถ่วงของดาวนั้น' }],
        solve: '<div>สมการหา ' + M('W') + ' ได้ทันที</div>' + EQ('W = m g'),
        subst: SEQ('W = ({m})({g})', { m: m, g: p.g }),
        calc: EQ('W = ' + fmtq(W) + ' `N`'),
        conclude: 'ดังนั้น <b>น้ำหนักบน' + p.n + ' = ' + U(W, 'N') + '</b><br>' +
          '<span class="hint"><b>เทียบกับบนโลก:</b> น้ำหนักบนโลกคือ ' +
          M(fmt(m) + ' × 9.8 = ' + fmt(r2(m * 9.8))) + ' N ⇒ ' +
          'บน' + p.n + '<b>' + (p.g > 9.8 ? 'หนักกว่า' : 'เบากว่า') + '</b>ราว ' +
          fmt(r2(p.g > 9.8 ? p.g / 9.8 : 9.8 / p.g)) + ' เท่า<br>' +
          '<b>ข้อสำคัญ:</b> แม้น้ำหนักจะเปลี่ยน แต่<b>ความเฉื่อยไม่เปลี่ยน</b> — ' +
          'การผลักวัตถุนี้ให้เคลื่อนที่ในแนวราบยังต้องใช้แรงเท่าเดิม เพราะมวลเท่าเดิม</span>'
      }
    };
  }
});

T({
  id: 'f2-fric-flat', topic: 2, sub: 'แรงเสียดทานบนพื้นราบ', level: 'ง่าย',
  skills: ['f = μN', 'บนพื้นราบ N = mg'],
  gen(R, c) {
    const g = c.g, m = R.pick([2, 4, 5, 10, 20, 40]);
    const mu = R.pick([0.1, 0.2, 0.25, 0.4, 0.5]);
    const N = r2(m * g), f = r2(mu * m * g);
    if (!ok2(N, f) || f < 0.5) return null;
    const box = R.pick(BOXES);
    return {
      stem: esc(box) + 'มวล ' + U(m, 'kg') + ' วางอยู่บนพื้นราบ สัมประสิทธิ์ความเสียดทานจลน์ระหว่างผิวสัมผัส' +
        'เท่ากับ ' + fmt(mu) + ' จงหา<b>ขนาดของแรงเสียดทานจลน์</b>ขณะที่' + esc(box) + 'กำลังไถล ' +
        '(กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานจลน์' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'f', unit: 'N', d: 'แรงเสียดทานจลน์', value: f, positive: true }],
      distract: [N, r2(mu * m), r2(m * g / mu), r2(f * 2), r2(f / 2), r2(mu + N)],
      sol: {
        analyze: 'แรงเสียดทานคำนวณจาก ' + M('f = μ N') + ' โดย ' + M('N') + ' คือ<b>แรงตั้งฉาก</b><br>' +
          '<b>ต้องหา ' + M('N') + ' ก่อนเสมอ อย่าเผลอใช้มวลแทน</b><br>' +
          'ข้อนี้วัตถุวางบน<b>พื้นราบ</b> และไม่มีแรงอื่นในแนวดิ่ง ⇒ สมดุลในแนวดิ่ง<br>' +
          M('N = m g = ' + fmt(m) + ' × ' + fmtq(g) + ' = ' + fmt(N)) + ' N<br>' +
          'จากนั้นจึงคูณด้วยสัมประสิทธิ์ความเสียดทาน',
        eqs: [{ eq: 'N = m g', why: 'สมดุลในแนวดิ่งบนพื้นราบ ไม่มีแรงอื่นมาเกี่ยว' },
               { eq: 'f = μ_k N', why: 'แรงเสียดทานจลน์แปรผันตรงกับแรงตั้งฉาก' }],
        solve: EQ('N = m g', 'f = μ_k N = μ_k m g'),
        subst: SEQ('N = ({m})({g})', { m: m, g: g }) + SEQ('f = ({mu})({N})', { mu: mu, N: N }),
        calc: EQ('N = ' + fmtq(N) + ' `N`', 'f = ' + fmtq(f) + ' `N`'),
        conclude: 'ดังนั้น <b>แรงเสียดทานจลน์ = ' + U(f, 'N') + '</b> มีทิศตรงข้ามการเคลื่อนที่<br>' +
          '<span class="hint"><b>ข้อควรจำเกี่ยวกับแรงเสียดทาน</b><br>' +
          '• <b>ไม่ขึ้นกับพื้นที่สัมผัส</b> — วางตะแคงหรือวางราบก็ได้แรงเสียดทานเท่ากัน<br>' +
          '• <b>ไม่ขึ้นกับความเร็ว</b> (สำหรับความเสียดทานจลน์)<br>' +
          '• ขึ้นกับ<b>ชนิดผิวสัมผัส</b> (' + M('μ') + ') และ<b>แรงกด</b> (' + M('N') + ') เท่านั้น<br>' +
          '<b>อย่าลืม:</b> ถ้าเป็น<b>พื้นเอียง</b> ต้องใช้ ' + M('N = m g cos θ') + ' ไม่ใช่ ' + M('mg') + '</span>'
      }
    };
  }
});

T({
  id: 'f2-stopforce', topic: 2, sub: 'แรงที่ทำให้วัตถุหยุด', level: 'ปานกลาง',
  skills: ['ต่อสมการการเคลื่อนที่เข้ากับกฎข้อที่สอง'],
  gen(R) {
    const m = R.pick([2, 4, 5, 10, 20]);
    const u = R.pick([10, 12, 16, 20, 24]);
    const s = R.pick([10, 20, 25, 40, 50]);
    const a = r2(u * u / (2 * s)), F = r2(m * a);
    if (!ok2(a, F) || F < 1 || F > 2000) return null;
    const box = R.pick(BOXES);
    return {
      stem: esc(box) + 'มวล ' + U(m, 'kg') + ' ไถลมาด้วยความเร็ว ' + U(u, 'm/s') +
        ' แล้วถูกแรงต้านคงที่ทำให้<b>หยุดสนิท</b>ในระยะ ' + U(s, 'm') +
        ' จงหา<b>ความเร่ง</b>และ<b>ขนาดของแรงต้าน</b>',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'u', v: u, unit: 'm/s', d: 'ความเร็วต้น' },
              { s: 'v', v: 0, unit: 'm/s', d: 'ความเร็วปลาย (หยุดสนิท)' },
              { s: 's', v: s, unit: 'm', d: 'ระยะที่ไถลก่อนหยุด' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ขนาดของความเร่ง', value: a, positive: true },
              { s: 'F', unit: 'N', d: 'ขนาดของแรงต้าน', value: F, positive: true }],
      sol: {
        analyze: '<b>โจทย์นี้ต่อสองบทเข้าด้วยกัน</b> — บทการเคลื่อนที่ กับ บทแรงและกฎการเคลื่อนที่<br>' +
          '<b>ขั้นที่ 1</b> ใช้สมการการเคลื่อนที่หา<b>ความเร่ง</b> จากข้อมูล ' +
          M('u, v, s') + ' (ไม่มีเวลา ⇒ ใช้ ' + M('v^2 = u^2 + 2as') + ')<br>' +
          '<b>ขั้นที่ 2</b> นำความเร่งที่ได้ไปแทนใน ' + M('ΣF = m a') + ' เพื่อหาแรง<br>' +
          '<b>ข้อสังเกต:</b> จะสังเกตได้ว่าโจทย์<b>ไม่ได้ให้เวลามา</b> ' +
          'จึงเป็นสัญญาณชัดเจนว่าให้ใช้สมการที่ไม่มี ' + M('t'),
        eqs: [{ eq: 'v^2 = u^2 - 2 a s', why: 'สมการการเคลื่อนที่ที่ไม่มีเวลา ใช้หาความเร่งจากระยะเบรก' },
               { eq: 'a = u^2 / (2 s)', why: 'จัดรูปโดยแทน v = 0 แล้วแยก a ออกมา' },
               { eq: 'F = m a', why: 'กฎข้อที่สองของนิวตัน — แรงต้านเป็นแรงลัพธ์เพียงแรงเดียวในแนวราบ' }],
        solve: EQ('a = u^2 / (2 s)', 'F = m a'),
        subst: SEQ('a = {u}^2 / (2 × {s})', { u: u, s: s }) + SEQ('F = ({m})({a})', { m: m, a: a }),
        calc: EQ('a = ' + fmtq(u * u) + ' / ' + fmtq(2 * s) + ' = ' + fmtq(a) + ' `m/s`^2',
                 'F = ' + fmtq(F) + ' `N`'),
        conclude: 'ดังนั้น <b>ความเร่งมีขนาด ' + U(a, 'm/s²') + '</b> และ ' +
          '<b>แรงต้านมีขนาด ' + U(F, 'N') + '</b> มีทิศตรงข้ามการเคลื่อนที่<br>' +
          '<span class="hint"><b>ตรวจสอบด้วยพลังงาน (อีกวิธีที่ให้คำตอบเดียวกัน)</b><br>' +
          'พลังงานจลน์ต้น ' + M('(1/2) m u^2 = ' + fmt(r2(0.5 * m * u * u))) + ' J<br>' +
          'งานของแรงต้าน ' + M('F s = ' + fmt(F) + ' × ' + fmt(s) + ' = ' + fmt(r2(F * s))) + ' J ⇒ เท่ากันพอดี ✓<br>' +
          '<b>คิดต่อ:</b> ถ้าแรงต้านนี้มาจากความเสียดทานล้วน สัมประสิทธิ์ความเสียดทานจะเป็น ' +
          M('μ = F/(m g) = ' + fmt(r2(F / (m * 9.8)))) + ' (เมื่อใช้ g = 9.8)</span>'
      }
    };
  }
});

T({
  id: 'f2-twoblock', topic: 2, sub: 'ผลักวัตถุสองก้อนติดกัน', level: 'ปานกลาง',
  skills: ['มองทั้งระบบหาความเร่ง', 'แยกก้อนหาแรงสัมผัส'],
  gen(R) {
    const m1 = R.pick([2, 3, 4, 5, 6]), m2 = R.pick([1, 2, 3, 4, 8]);
    const F = R.step(10, 90, 10);
    const a = r2(F / (m1 + m2)), Fc = r2(m2 * a);
    if (!ok2(a, Fc) || a < 0.5) return null;
    return {
      stem: 'วางกล่อง A มวล ' + U(m1, 'kg') + ' ติดกับกล่อง B มวล ' + U(m2, 'kg') +
        ' บนพื้นราบ<b>ลื่น</b> แล้วออกแรง ' + U(F, 'N') + ' ผลักที่กล่อง A ให้ดันกล่อง B ไปด้วยกัน ' +
        'จงหา<b>ความเร่งของระบบ</b> และ<b>แรงที่กล่อง A ดันกล่อง B</b>',
      figure: figChain({ masses: ['A', 'B'], Fleft: 'F = ' + fmt(F) + ' N' }),
      given: [{ s: 'm_A', v: m1, unit: 'kg', d: 'มวลกล่อง A (ถูกผลักโดยตรง)' },
              { s: 'm_B', v: m2, unit: 'kg', d: 'มวลกล่อง B' },
              { s: 'F', v: F, unit: 'N', d: 'แรงที่ออกผลัก' }],
      finds: [{ s: 'a', unit: 'm/s²', d: 'ความเร่งของระบบ', value: a, positive: true },
              { s: 'F_{AB}', unit: 'N', d: 'แรงที่ A ดัน B', value: Fc, positive: true }],
      sol: {
        analyze: '<b>กลยุทธ์สองขั้นที่ใช้ได้กับโจทย์ระบบหลายก้อนทุกข้อ</b><br>' +
          '<b>ขั้นที่ 1 — หาความเร่ง: มองทั้งระบบเป็นก้อนเดียว</b><br>' +
          'แรงที่ A กับ B ดันกันเป็น<b>แรงภายในระบบ</b> จึงหักล้างกันไป เหลือแค่แรง ' + M('F') + ' ที่ผลักจากภายนอก<br>' +
          M('a = F / (m_A + m_B)') + '<br>' +
          'ทั้งสองก้อนติดกันไป จึงมี<b>ความเร่งเท่ากัน</b><br>' +
          '<b>ขั้นที่ 2 — หาแรงสัมผัส: แยกพิจารณาก้อนเดียว</b><br>' +
          'เลือกดู<b>กล่อง B</b> เพราะมีแรงกระทำเพียงแรงเดียวคือแรงจาก A ⇒ ' + M('F_{AB} = m_B a'),
        eqs: [{ eq: 'a = F / (m_A + m_B)', why: 'มองทั้งระบบ แรงภายในหักล้างกันหมด เหลือแรงภายนอกหารมวลรวม' },
               { eq: 'F_{AB} = m_B a', why: 'แยกดูกล่อง B ซึ่งมีแรงจาก A เป็นแรงลัพธ์เพียงแรงเดียว' }],
        solve: EQ('a = F / (m_A + m_B)', 'F_{AB} = m_B a'),
        subst: SEQ('a = {F} / ({a} + {b})', { F: F, a: m1, b: m2 }) +
               SEQ('F_{AB} = ({b})({acc})', { b: m2, acc: a }),
        calc: EQ('a = ' + fmtq(F) + ' / ' + fmtq(m1 + m2) + ' = ' + fmtq(a) + ' `m/s`^2',
                 'F_{AB} = ' + fmtq(Fc) + ' `N`'),
        conclude: 'ดังนั้น <b>ความเร่งของระบบ = ' + U(a, 'm/s²') + '</b> และ ' +
          '<b>กล่อง A ดันกล่อง B ด้วยแรง ' + U(Fc, 'N') + '</b><br>' +

/* ---------- แรงดึงดูดระหว่างมวลและสนามโน้มถ่วง (เชิงตัวเลข) ----------
   ค่าคงตัว G = 6.67 × 10⁻¹¹ ทำให้คำตอบหลายแบบเล็กกว่าเกณฑ์เลขสวยของระบบ
   จึงออกแบบให้คำตอบอยู่ในสเกลที่อ่านรู้เรื่อง — สนามโน้มถ่วงและน้ำหนักเป็นตัวเลขปกติ
   ส่วนมวลดาวและแรงระหว่างมวลเล็ก ๆ ให้ตอบเป็น "ตัวเลขหน้า" โดยยกกำลังสิบไว้ในหน่วย
   หมายเหตุสำคัญ — ที่นี่ใช้ round2() ไม่ใช่ r2()
   เพราะ r2() จะปัดให้ก็ต่อเมื่อค่า "สวยอยู่แล้ว" ถ้าไม่สวยจะคืนค่าดิบเพื่อให้ระบบทิ้งแล้วสุ่มใหม่
   แต่ค่าคงตัว G = 6.67 × 10⁻¹¹ ทำให้คำตอบเป็นทศนิยมยาวแทบทุกกรณี ถ้าใช้ r2() จะสร้างโจทย์ไม่ได้เลย
   การปัดสองตำแหน่งตรงนี้จึงถูกต้องตามที่ตำราฟิสิกส์ทำจริง (เช่น g ≈ 9.81 m/s²)
   -------------------------------------------------------------------------- */

const GBIG = 6.67;                 // ตัวเลขหน้าของ G เมื่อเขียนเป็น 6.67 × 10⁻¹¹
const GTXT_ = M('G = 6.67 × 10^{-11} `N·m`^2`/kg`^2');

T({
  id: 'g3-gsurf', topic: 2, sub: 'สนามโน้มถ่วง', level: 'ง่าย',
  skills: ['ใช้สูตรสนามโน้มถ่วงที่ผิวดาว'],
  gen(R) {
    const a = R.pick([0.33, 0.64, 1.2, 2.4, 4.9, 5.97, 8.7]);   // มวล × 10²⁴ kg
    const b = R.pick([1.7, 2.4, 3.4, 6.0, 6.4, 7.1]);           // รัศมี × 10⁶ m
    const g = round2(66.7 * a / (b * b));
    if (!ok2(g) || g < 0.3 || g > 40) return null;
    return {
      stem: 'ดาวเคราะห์ดวงหนึ่งมีมวล ' + M(fmt(a, 2) + ' × 10^{24} `kg`') + ' และมีรัศมี ' +
        M(fmt(b, 2) + ' × 10^6 `m`') + ' จงหา<b>ความเข้มสนามโน้มถ่วงที่ผิวดาว</b> ' +
        '<span class="hint">(' + GTXT_ + ')</span>',
      given: [{ s: 'M', v: a, unit: '× 10²⁴ kg', d: 'มวลของดาว' },
              { s: 'R', v: b, unit: '× 10⁶ m', d: 'รัศมีของดาว' }],
      finds: [{ s: 'g', unit: 'm/s²', d: 'สนามโน้มถ่วงที่ผิวดาว', value: g, positive: true }],
      distract: [round2(66.7 * a / b), round2(a / (b * b)), round2(6.67 * a / (b * b))],
      sol: {
        analyze: 'สนามโน้มถ่วงที่ผิวดาวคิดจากมวลทั้งดวงที่รวมอยู่ที่ศูนย์กลาง ' +
          'โดยวัดระยะจาก<b>ศูนย์กลางถึงผิว</b> ซึ่งก็คือรัศมี<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมยกกำลังสองให้รัศมี จะได้ ' + fmt(round2(66.7 * a / b)) +
          ' ซึ่งผิดไปหลายเท่า',
        eqs: [{ eq: 'g = GM/R^2', why: 'สนามคือแรงต่อหนึ่งหน่วยมวล จึงไม่มีมวลของวัตถุที่นำไปวาง' }],
        solve: EQ('g = GM/R^2'),
        subst: EQ('g = (6.67 × 10^{-11})(' + fmt(a, 2) + ' × 10^{24})/(' + fmt(b, 2) + ' × 10^6)^2'),
        calc: EQ('g = (' + fmt(round2(GBIG * a), 3) + ' × 10^{13})/(' + fmt(round2(b * b), 2) + ' × 10^{12})',
                 'g = ' + fmtq(g) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>สนามโน้มถ่วงที่ผิวดาวเท่ากับ ' + U(g, 'm/s²') + '</b><br>' +
          '<span class="hint">เทียบกับโลกที่ ' + M('9.8 `m/s`^2') + ' ดาวดวงนี้จึงมีสนาม' +
          (g > 9.8 ? 'แรงกว่า' : 'อ่อนกว่า') + 'โลก ' + fmt(round2(g > 9.8 ? g / 9.8 : 9.8 / g)) + ' เท่า<br>' +
          '<b>เทคนิคคิดเร็ว:</b> จัดเลขยกกำลังก่อน ' + M('(10^{-11} × 10^{24})/10^{12} = 10^1') +
          ' แล้วค่อยคิดตัวเลขหน้า ' + M('(6.67 × ' + fmt(a, 2) + ')/(' + fmt(round2(b * b), 2) + ')') + '</span>'
      }
    };
  }
});

T({

        conclude: 'ดังนั้น <b>แรงดึงดูดใหม่เท่ากับ ' + U(F1, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจทิศก่อนเสมอ</b> — ระยะ' + (closer ? 'ลดลง แรงต้องมากขึ้น' : 'เพิ่มขึ้น แรงต้องน้อยลง') +
          ' ซึ่งตรงกับคำตอบ ถ้าได้ทิศตรงข้ามแปลว่ากลับเศษส่วนผิดแน่นอน</span>'
      }
    };
  }
});

T({
  id: 'g3-height-num', topic: 2, sub: 'สนามโน้มถ่วง', level: 'ปานกลาง',
  skills: ['หาสนามโน้มถ่วงที่ความสูงเหนือผิวดาว', 'วัดระยะจากศูนย์กลาง'],
  gen(R) {
    const gs = R.pick([3.7, 8.9, 9.8, 24.8, 1.6]);
    const Rk = R.pick([2, 3, 6]);                 // รัศมีดาว × 10⁶ m
    const nh = R.pick([1, 2, 3]);                 // สูงจากผิว = nh เท่าของรัศมี
    const g2 = round2(gs / ((1 + nh) * (1 + nh)));
    if (!ok2(g2) || g2 < 0.05) return null;
    return {
      stem: 'ดาวเคราะห์ดวงหนึ่งมีรัศมี ' + M(Rk + ' × 10^6 `m`') + ' และมีสนามโน้มถ่วงที่ผิวเท่ากับ ' +
        U(gs, 'm/s²') + ' จงหา<b>สนามโน้มถ่วงที่จุดซึ่งอยู่สูงจากผิวดาวเป็นระยะ ' +
        (nh === 1 ? 'เท่ากับรัศมีดาว' : fmt(nh) + ' เท่าของรัศมีดาว') + '</b>',
      given: [{ s: 'g_s', v: gs, unit: 'm/s²', d: 'สนามโน้มถ่วงที่ผิวดาว' },
              { s: 'R', v: Rk, unit: '× 10⁶ m', d: 'รัศมีของดาว' },
              { s: 'h', v: nh, unit: 'R', d: 'ความสูงจากผิวดาว' }],
      finds: [{ s: 'g_h', unit: 'm/s²', d: 'สนามโน้มถ่วงที่ความสูงนั้น', value: g2, positive: true }],
      distract: [round2(gs / (nh * nh)), round2(gs / (1 + nh)), round2(gs / ((1 + nh) * (1 + nh) * (1 + nh)))],
      sol: {
        analyze: 'สูตรสนามโน้มถ่วงใช้<b>ระยะจากศูนย์กลางดาว</b> ไม่ใช่ความสูงจากผิว ' +
          'จึงต้องบวกรัศมีเข้าไปก่อนเสมอ<br>' +
          '<b>กับดักของข้อนี้:</b> เอาความสูง ' + fmt(nh) + 'R ไปแทนตรง ๆ จะได้ ' +
          fmtq(round2(gs / (nh * nh))) + ' m/s² ซึ่งผิด เพราะระยะจริงจากศูนย์กลางคือ ' + fmt(1 + nh) + 'R',
        eqs: [{ eq: 'g = GM/r^2', why: 'r คือระยะจากศูนย์กลางดาวถึงจุดที่พิจารณา' },
               { eq: 'r = R + h', why: 'ความสูงวัดจากผิว ต้องบวกรัศมีเพื่อให้เป็นระยะจากศูนย์กลาง' }],
        solve: EQ('g_h/g_s = (R/(R + h))^2', 'g_h = g_s × (R/(' + (1 + nh) + 'R))^2'),
        subst: EQ('g_h = ' + fmtq(gs) + ' × (1/(' + (1 + nh) + '))^2 = (' + fmtq(gs) + ')/(' + ((1 + nh) * (1 + nh)) + ')'),
        calc: EQ('g_h = ' + fmtq(g2) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>สนามโน้มถ่วงที่ความสูงนั้นเท่ากับ ' + U(g2, 'm/s²') + '</b><br>' +
          '<span class="hint">สังเกตว่าระยะจากศูนย์กลางเพิ่มเป็น ' + fmt(1 + nh) +
          ' เท่า สนามจึงลดเหลือ ' + M('1/' + ((1 + nh) * (1 + nh))) + ' เท่าพอดี<br>' +
          'รัศมีที่โจทย์ให้มาเป็นตัวเลขไม่ได้ใช้ในการคำนวณเลย เพราะตัดกันไปในอัตราส่วน — ' +
          'โจทย์ใส่มาเพื่อดูว่าเราแยกออกไหมว่าอะไรจำเป็น</span>'
      }
    };
  }
});

T({
  id: 'g3-mass-planet', topic: 2, sub: 'แรงดึงดูดระหว่างมวล', level: 'ปานกลาง',
  skills: ['หามวลของดาวจากสนามโน้มถ่วงและรัศมี', 'จัดรูปสมการย้อนกลับ'],
  gen(R) {
    const gs = R.pick([1.6, 3.7, 8.9, 9.8, 11.2]);
    const b = R.pick([1.7, 2.4, 3.4, 6.0, 6.4, 7.1]);
    const Mm = round2(gs * b * b / 66.7);             // มวล × 10²⁴ kg
    if (!ok2(Mm) || Mm < 0.05 || Mm > 50) return null;
    return {
      stem: 'ดาวเคราะห์ดวงหนึ่งมีรัศมี ' + M(fmt(b, 2) + ' × 10^6 `m`') + ' และวัดสนามโน้มถ่วงที่ผิวได้ ' +
        U(gs, 'm/s²') + ' จงหา<b>มวลของดาวดวงนี้</b> (ตอบเป็นตัวเลขหน้าของ ' + M('× 10^{24} `kg`') + ') ' +
        '<span class="hint">(' + GTXT_ + ')</span>',
      given: [{ s: 'g', v: gs, unit: 'm/s²', d: 'สนามโน้มถ่วงที่ผิวดาว' },
              { s: 'R', v: b, unit: '× 10⁶ m', d: 'รัศมีของดาว' }],
      finds: [{ s: 'M', unit: '× 10²⁴ kg', d: 'มวลของดาว (ตอบเฉพาะตัวเลขหน้า)', value: Mm, positive: true }],
      distract: [round2(gs * b / 66.7), round2(gs * b * b / 6.67), round2(66.7 * gs / (b * b))],
      sol: {
        analyze: 'โจทย์ให้สนามกับรัศมี แล้วถามมวล จึงต้อง<b>จัดรูปสมการย้อนกลับ</b>ก่อนแทนค่า<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมยกกำลังสองให้รัศมี หรือสลับเอา ' + M('G') +
          ' ไปคูณแทนที่จะหาร ทั้งสองแบบทำให้เลขยกกำลังผิดไปหลายอันดับ',
        eqs: [{ eq: 'g = GM/R^2', why: 'สูตรสนามโน้มถ่วงที่ผิวดาว' },
               { eq: 'M = gR^2/G', why: 'คูณไขว้แล้วย้าย G มาเป็นตัวหาร' }],
        solve: EQ('M = gR^2/G'),
        subst: EQ('M = (' + fmtq(gs) + ')(' + fmt(b, 2) + ' × 10^6)^2/(6.67 × 10^{-11})'),
        calc: EQ('M = (' + fmt(round2(gs * b * b), 2) + ' × 10^{12})/(6.67 × 10^{-11})',
                 'M = ' + fmtq(Mm) + ' × 10^{24} `kg`'),
        conclude: 'ดังนั้น <b>ดาวดวงนี้มีมวล ' + M(fmtq(Mm) + ' × 10^{24} `kg`') + '</b><br>' +
          '<span class="hint">โลกมีมวลราว ' + M('5.97 × 10^{24} `kg`') + ' ดาวดวงนี้จึงมีมวล' +
          (Mm > 5.97 ? 'มากกว่า' : 'น้อยกว่า') + 'โลกราว ' +
          fmt(round2(Mm > 5.97 ? Mm / 5.97 : 5.97 / Mm)) + ' เท่า<br>' +
          '<b>นี่คือวิธีที่นักดาราศาสตร์ใช้ชั่งดาวจริง ๆ</b> — วัดสนามกับรัศมีแล้วคำนวณย้อนกลับ ' +
          'เพราะเอาดาวขึ้นตาชั่งไม่ได้</span>'
      }
    };
  }
});

T({
  id: 'g3-compare-num', topic: 2, sub: 'สนามโน้มถ่วง', level: 'ปานกลาง',
  skills: ['เปรียบเทียบสนามโน้มถ่วงของดาวสองดวง'],
  gen(R) {
    const km = R.pick([2, 4, 6, 8, 9, 16]);
    const kr = R.pick([2, 3, 4]);
    const g0 = R.pick([9.8, 3.7, 8.9]);
    const g1 = round2(g0 * km / (kr * kr));
    if (!ok2(g1) || g1 < 0.05 || g1 > 60) return null;
    return {
      stem: 'ดาว B มีมวลเป็น ' + fmt(km) + ' เท่าของดาว A และมีรัศมีเป็น ' + fmt(kr) +
        ' เท่าของดาว A ถ้าสนามโน้มถ่วงที่ผิวดาว A เท่ากับ ' + U(g0, 'm/s²') +
        ' จงหา<b>สนามโน้มถ่วงที่ผิวดาว B</b>',
      given: [{ s: 'g_A', v: g0, unit: 'm/s²', d: 'สนามที่ผิวดาว A' },
              { s: 'M_B/M_A', v: km, unit: 'เท่า', d: 'อัตราส่วนมวล' },
              { s: 'R_B/R_A', v: kr, unit: 'เท่า', d: 'อัตราส่วนรัศมี' }],
      finds: [{ s: 'g_B', unit: 'm/s²', d: 'สนามที่ผิวดาว B', value: g1, positive: true }],
      distract: [round2(g0 * km / kr), round2(g0 * km), round2(g0 * km * kr * kr)],
      sol: {
        analyze: 'ไม่ต้องรู้ค่ามวลหรือรัศมีจริงเลย เพราะโจทย์ให้มาเป็น<b>อัตราส่วน</b>อยู่แล้ว ' +
          'ค่า ' + M('G') + ' ตัดกันไปเองเมื่อหารสองสมการ<br>' +
          '<b>กับดักของข้อนี้:</b> คิดแต่มวล ได้ ' + fmt(round2(g0 * km)) +
          ' m/s² โดยลืมว่ารัศมีที่ใหญ่ขึ้นทำให้สนามอ่อนลง และลืมยกกำลังสองด้วย',
        eqs: [{ eq: 'g = GM/R^2', why: 'ใช้กับดาวทั้งสองดวงด้วยสูตรเดียวกัน' },
               { eq: 'g_B/g_A = M_B/M_A × (R_A/R_B)^2', why: 'หารสองสมการ G ตัดกันหมด' }],
        solve: EQ('g_B = g_A × M_B/M_A × (R_A/R_B)^2'),
        subst: EQ('g_B = ' + fmtq(g0) + ' × ' + fmt(km) + ' × (1/(' + fmt(kr) + '))^2',
                  'g_B = (' + fmtq(g0) + ' × ' + fmt(km) + ')/(' + fmt(kr * kr) + ')'),
        calc: EQ('g_B = ' + fmtq(g1) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>สนามโน้มถ่วงที่ผิวดาว B เท่ากับ ' + U(g1, 'm/s²') + '</b><br>' +
          '<span class="hint">มวลมากขึ้น ' + fmt(km) + ' เท่าดันสนามให้แรงขึ้น ' +
          'แต่รัศมีที่ใหญ่ขึ้น ' + fmt(kr) + ' เท่ากดสนามลง ' + fmt(kr * kr) + ' เท่า ' +
          'สุทธิแล้วจึง' + (g1 > g0 ? 'แรงกว่า' : 'อ่อนกว่า') + 'ดาว A</span>'
      }
    };
  }
});

T({
  id: 'g3-force-small', topic: 2, sub: 'แรงดึงดูดระหว่างมวล', level: 'ยาก',
  skills: ['ใช้กฎแรงดึงดูดระหว่างมวลกับวัตถุขนาดเล็ก', 'จัดการเลขยกกำลัง'],
  gen(R) {
    const m1 = R.pick([40, 50, 60, 80, 100]);
    const m2 = R.pick([30, 45, 60, 75, 90]);
    const r = R.pick([1, 2, 3, 5]);
    // หารด้วย 10⁴ เพื่อให้ตัวเลขหน้าอยู่ราวหลักหน่วย อ่านง่ายกว่าการตอบ 300.15 × 10⁻⁹
    const F = round2(GBIG * m1 * m2 / (r * r) / 10000);   // ตัวเลขหน้าของ × 10⁻⁷ N
    if (!ok2(F) || F < 0.05 || F > 500) return null;
    return {
      stem: 'คนสองคนมวล ' + U(m1, 'kg') + ' และ ' + U(m2, 'kg') + ' ยืนห่างกัน ' + U(r, 'm') +
        ' จงหา<b>แรงดึงดูดระหว่างมวล</b>ของคนทั้งสอง (ตอบเป็นตัวเลขหน้าของ ' + M('× 10^{-7} `N`') + ') ' +
        '<span class="hint">(' + GTXT_ + ')</span>',
      given: [{ s: 'm_1', v: m1, unit: 'kg', d: 'มวลคนที่หนึ่ง' },
              { s: 'm_2', v: m2, unit: 'kg', d: 'มวลคนที่สอง' },
              { s: 'r', v: r, unit: 'm', d: 'ระยะห่างระหว่างจุดศูนย์กลางมวล' }],
      finds: [{ s: 'F', unit: '× 10⁻⁷ N', d: 'แรงดึงดูดระหว่างมวล (ตอบเฉพาะตัวเลขหน้า)',
                value: F, positive: true }],
      distract: [round2(GBIG * m1 * m2 / r / 10000), round2(GBIG * (m1 + m2) / (r * r) / 10000), round2(F * 10)],
      sol: {
        analyze: 'แทนค่าลงกฎแรงดึงดูดระหว่างมวลตรง ๆ จุดยากอยู่ที่<b>การจัดเลขยกกำลัง</b> ' +
          'ให้อยู่ในรูปที่โจทย์ขอ<br>' +
          '<b>กับดักของข้อนี้:</b> เอามวลสองก้อนมา<b>บวก</b>กันแทนที่จะคูณ ' +
          'หรือลืมยกกำลังสองให้ระยะ',
        eqs: [{ eq: 'F = GMm/r^2', why: 'กฎแรงดึงดูดระหว่างมวลของนิวตัน ใช้ได้กับมวลทุกขนาด' }],
        solve: EQ('F = G m_1 m_2/r^2'),
        subst: EQ('F = (6.67 × 10^{-11})(' + fmt(m1) + ')(' + fmt(m2) + ')/(' + fmt(r) + ')^2'),
        calc: EQ('F = (' + fmt(round2(GBIG * m1 * m2), 2) + ' × 10^{-11})/(' + fmt(r * r) + ')',
                 'F = ' + fmtq(F) + ' × 10^{-7} `N`'),
        conclude: 'ดังนั้น <b>แรงดึงดูดระหว่างคนทั้งสองเท่ากับ ' + M(fmtq(F) + ' × 10^{-7} `N`') + '</b><br>' +
          '<span class="hint"><b>เล็กแค่ไหน</b> — น้ำหนักของคนคนหนึ่งบนโลกราว ' + U(round2(m1 * 9.8), 'N') +
          ' ซึ่งมากกว่าแรงนี้ราว ' + M('10^{' + (Math.round(Math.log10(m1 * 9.8 / (F * 1e-7)))) + '}') + ' เท่า<br>' +
          'นี่คือเหตุผลที่เราไม่รู้สึกถึงแรงดึงดูดระหว่างคนด้วยกัน — ' +
          'แรงโน้มถ่วงอ่อนมากจนจะสังเกตได้ก็ต่อเมื่อมวลก้อนหนึ่งใหญ่ระดับดาวเคราะห์</span>'
      }
    };
  }
});

T({
  id: 'g3-nullpoint', topic: 2, sub: 'แรงดึงดูดระหว่างมวล', level: 'ยาก',
  skills: ['หาจุดที่แรงลัพธ์เป็นศูนย์ระหว่างมวลสองก้อน', 'แก้สมการอัตราส่วน'],
  gen(R) {
    const n = R.pick([2, 3, 4]);                 // มวล B เป็น n² เท่าของ A ให้รากลงตัว
    const k = n * n;
    const d = R.pick([3, 6, 9, 12, 15]);
    const x = round2(d / (1 + n));                   // ระยะจากมวล A
    if (!ok2(x) || x < 0.05) return null;
    return {
      stem: 'มวล A ขนาด ' + M('m') + ' กับมวล B ขนาด ' + M(k + 'm') + ' วางห่างกัน ' + U(d, 'm') +
        ' จงหา<b>ระยะจากมวล A ถึงจุดบนเส้นตรงระหว่างมวลทั้งสองที่แรงลัพธ์เป็นศูนย์</b>',
      given: [{ s: 'm_A', v: 1, unit: 'm', d: 'มวลก้อนแรก' },
              { s: 'm_B', v: k, unit: 'm', d: 'มวลก้อนที่สอง (เป็น ' + k + ' เท่าของก้อนแรก)' },
              { s: 'd', v: d, unit: 'm', d: 'ระยะห่างระหว่างมวลทั้งสอง' }],
      finds: [{ s: 'x', unit: 'm', d: 'ระยะจากมวล A ถึงจุดที่แรงลัพธ์เป็นศูนย์', value: x, positive: true }],
      distract: [round2(d - x), round2(d / 2), round2(d / (1 + k))],
      sol: {
        analyze: 'จุดที่แรงลัพธ์เป็นศูนย์คือจุดที่<b>แรงจากมวลทั้งสองเท่ากันและทิศตรงข้าม</b> ' +
          'ต้องอยู่<b>ระหว่าง</b>มวลทั้งสอง และอยู่<b>ใกล้มวลที่เล็กกว่า</b>เสมอ<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบจุดกึ่งกลาง ' + fmt(round2(d / 2)) + ' m ซึ่งจะถูกก็ต่อเมื่อ' +
          'มวลทั้งสองเท่ากันเท่านั้น',
        eqs: [{ eq: 'Gm_A m/x^2 = Gm_B m/(d - x)^2', why: 'ให้แรงจากสองฝั่งเท่ากันที่จุดนั้น' },
               { eq: 'm_A/x^2 = m_B/(d - x)^2', why: 'G กับมวลที่นำไปวางตัดกันทั้งสองฝั่ง' }],
        solve: EQ('1/x^2 = (' + k + ')/(d - x)^2', '(d - x)^2 = ' + k + 'x^2',
                  'd - x = ' + n + 'x', 'x = d/(' + (1 + n) + ')'),
        subst: SEQ('x = {d}/(' + (1 + n) + ')', { d: d }),
        calc: EQ('x = ' + fmtq(x) + ' `m`'),
        conclude: 'ดังนั้น <b>จุดที่แรงลัพธ์เป็นศูนย์อยู่ห่างจากมวล A เป็นระยะ ' + U(x, 'm') + '</b> ' +
          'และห่างจากมวล B เป็นระยะ ' + U(round2(d - x), 'm') + '<br>' +
          '<span class="hint"><b>ตรวจด้วยสามัญสำนึก</b> — มวล B ใหญ่กว่า จุดสมดุลจึงต้องอยู่<b>ใกล้ A</b> ' +
          'ซึ่งตรงกับคำตอบ (' + fmt(x) + ' < ' + fmt(round2(d - x)) + ')<br>' +
          '<b>เคล็ดลับ:</b> ถอดรากทั้งสองข้างตั้งแต่ต้น จะได้สมการเชิงเส้นที่แก้ง่ายกว่าการกระจายกำลังสอง</span>'
      }
    };
  }
});

T({

        solve: EQ('g ∝ ρ R', 'ρ เท่ากัน ⇒ g ∝ R', 'g_Q/g_P = R_Q/R_P'),
        subst: SEQ('g_Q = ({g})({k})', { g: g0, k: kr }),
        calc: EQ('g_Q = ' + fmtq(g1) + ' `m/s`^2'),
        conclude: 'ดังนั้น <b>สนามโน้มถ่วงที่ผิวดาว Q เท่ากับ ' + U(g1, 'm/s²') + '</b><br>' +

T({

        eqs: [{ eq: 'M = F L', why: 'นิยามของโมเมนต์ เมื่อแรงตั้งฉากกับแขนของแรง' }],
        solve: '<div>สมการหา ' + M('M') + ' ได้ทันที</div>' + EQ('M = F L'),
        subst: SEQ('M = ({F})({L})', { F: F, L: L }),

T({
  id: 'e2-hang1', topic: 3, sub: 'แรงตึงเชือกแขวนวัตถุ', level: 'ง่าย',
  skills: ['สมดุลในแนวดิ่ง', 'แรงตึงเชือกเท่ากับน้ำหนักเมื่ออยู่นิ่ง'],
  gen(R, c) {
    const g = c.g, m = R.pick([2, 4, 5, 8, 10, 20, 25]);
    const W = r2(m * g);
    if (!ok2(W)) return null;
    return {
      stem: 'แขวนวัตถุมวล ' + U(m, 'kg') + ' ไว้นิ่ง ๆ ด้วยเชือกเส้นเดียวในแนวดิ่ง ' +
        'จงหา<b>แรงตึงในเส้นเชือก</b> (กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' },
              { s: 'a', v: 0, unit: 'm/s²', d: 'อยู่นิ่ง ⇒ สมดุล' }],
      finds: [{ s: 'T', unit: 'N', d: 'แรงตึงในเส้นเชือก', value: W, positive: true }],
      distract: [m, r2(W / 2), r2(W * 2), r2(m / g), r2(m + g), r2(W / g)],
      sol: {
        analyze: 'วัตถุ<b>อยู่นิ่ง</b> ⇒ ' + M('a = 0') + ' ⇒ <b>แรงลัพธ์เป็นศูนย์</b> (สมดุล)<br>' +
          'วาดแผนภาพแรง จะเห็นเพียงสองแรงในแนวดิ่ง<br>' +
          '• <b>แรงตึงเชือก</b> ' + M('T') + ' ชี้<b>ขึ้น</b><br>' +
          '• <b>น้ำหนัก</b> ' + M('mg') + ' ชี้<b>ลง</b><br>' +
          'ทั้งสองต้องหักล้างกันพอดี ⇒ ' + M('T = m g'),
        eqs: [{ eq: 'ΣF_y = T - m g = 0', why: 'สมดุลในแนวดิ่ง เพราะวัตถุอยู่นิ่งไม่มีความเร่ง' },
               { eq: 'T = m g', why: 'ย้ายข้าง — แรงตึงเชือกต้องเท่ากับน้ำหนักพอดี' }],
        solve: EQ('T - m g = 0', 'T = m g'),
        subst: SEQ('T = ({m})({g})', { m: m, g: g }),
        calc: EQ('T = ' + fmtq(W) + ' `N`'),
        conclude: 'ดังนั้น <b>แรงตึงในเส้นเชือก = ' + U(W, 'N') + '</b><br>' +
          '<span class="hint"><b>ข้อควรระวัง: ' + M('T = mg') + ' จริงเฉพาะกรณีนี้เท่านั้น</b><br>' +
          '• แขวนนิ่ง หรือเคลื่อนที่ด้วยความเร็วคงที่ ⇒ ' + M('T = m g') + ' ✓<br>' +
          '• ดึงขึ้นด้วยความเร่ง ' + M('a') + ' ⇒ ' + M('T = m(g + a)') + ' (<b>มากกว่า</b>)<br>' +
          '• หย่อนลงด้วยความเร่ง ' + M('a') + ' ⇒ ' + M('T = m(g - a)') + ' (<b>น้อยกว่า</b>)<br>' +
          '• แขวนด้วยเชือก<b>เอียง</b>สองเส้น ⇒ แรงตึงแต่ละเส้นอาจ<b>มากกว่า</b>น้ำหนักได้<br>' +
          '<b>นิสัยที่ควรสร้าง:</b> เขียนสมการสมดุลทุกครั้ง อย่าเผลอตอบ ' + M('mg') + ' โดยอัตโนมัติ</span>'
      }
    };
  }
});

T({

T({
  id: 'e2-beam2', topic: 3, sub: 'คานวางบนที่รองสองจุด', level: 'ปานกลาง',
  skills: ['เลือกจุดหมุนให้กำจัดตัวไม่รู้ค่า', 'ใช้สมดุลแรงร่วมกับสมดุลโมเมนต์'],

          'เหลือเพียง ' + M('R_2') + ' ตัวเดียว แก้ได้ในสมการเดียว<br>' +

               SEQ('R_1 = {W} - {R2}', { W: W, R2: R2 }),

        conclude: 'ดังนั้น <b>ที่รองด้านซ้ายรับแรง ' + U(R1, 'N') + '</b> และ ' +
          '<b>ที่รองด้านขวารับแรง ' + U(R2, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบสองชั้น</b><br>' +
          '1. ผลรวม ' + M(fmt(R1) + ' + ' + fmt(R2) + ' = ' + fmt(r2(R1 + R2))) + ' N ' +
          'ต้องเท่ากับน้ำหนัก ' + fmt(W) + ' N ✓<br>' +
          '2. วัตถุอยู่<b>ใกล้ที่รองซ้ายมากกว่า</b> (' + fmt(d) + ' m จาก ' + fmt(L) + ' m) ⇒ ' +

T({

      finds: [{ s: 'x_{cg}', unit: 'm', d: 'ตำแหน่งจุดศูนย์ถ่วงวัดจากจุดกำเนิด', value: xc, positive: true }],
      sol: {
        analyze: '<b>จุดศูนย์ถ่วง</b> คือตำแหน่งที่ถือว่ามวลทั้งระบบรวมกันอยู่จุดเดียว<br>' +

          M('x_{cg} = (m_1 x_1 + m_2 x_2 + m_3 x_3) / (m_1 + m_2 + m_3)') + '<br>' +

          'ข้อนี้ใช้ตำแหน่งของก้อนแรกเป็น ' + M('x = 0') + '<br>' +
          '<b>ความหมาย:</b> ก้อนที่มวลมากจะ<b>ดึงจุดศูนย์ถ่วงเข้าหาตัวเอง</b>มากกว่า',
        eqs: [{ eq: 'x_{cg} = Σ(m x) / Σm',
                why: 'ค่าเฉลี่ยถ่วงน้ำหนัก — คูณมวลกับตำแหน่งแล้วรวม หารด้วยมวลรวม' }],
        solve: EQ('x_{cg} = (m_1 x_1 + m_2 x_2 + m_3 x_3) / (m_1 + m_2 + m_3)'),
        subst: SEQ('x_{cg} = [({m1})({x1}) + ({m2})({x2}) + ({m3})({x3})] / {tot}',
                   { m1: m1, x1: x1, m2: m2, x2: x2, m3: m3, x3: x3, tot: tot }),
        calc: EQ('Σ(m x) = ' + fmtq(m1 * x1) + ' + ' + fmtq(m2 * x2) + ' + ' + fmtq(m3 * x3) +
                 ' = ' + fmtq(m1 * x1 + m2 * x2 + m3 * x3) + ' `kg·m`',
                 'x_{cg} = ' + fmtq(m1 * x1 + m2 * x2 + m3 * x3) + ' / ' + fmtq(tot),
                 'x_{cg} = ' + fmtq(xc) + ' `m`'),
        conclude: 'ดังนั้น <b>จุดศูนย์ถ่วงอยู่ที่ตำแหน่ง ' + U(xc, 'm') + '</b> จากก้อนแรก<br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> จุดศูนย์ถ่วงต้องอยู่<b>ระหว่าง</b>ก้อนซ้ายสุด (' +

          '<b>ข้อสังเกต:</b> ถ้าเราหนุนระบบนี้ที่ตำแหน่ง ' + U(xc, 'm') + ' พอดี ระบบจะ<b>สมดุล</b> ' +
          'ไม่เอียงไปข้างใดข้างหนึ่ง<br>' +
          '<b>ต่อยอด:</b> สำหรับวัตถุสองมิติ ให้คิดแยกทีละแกน — หา ' + M('x_{cg}') + ' และ ' +
          M('y_{cg}') + ' ด้วยสูตรเดียวกันอย่างอิสระ<br>' +
          'และถ้าวัตถุ<b>สม่ำเสมอ</b> สามารถใช้<b>พื้นที่แทนมวล</b>ได้เลย</span>'
      }
    };
  }
});

T({
  id: 'e2-hinge', topic: 3, sub: 'คานยึดบานพับกับเชือกทำมุม', level: 'ยาก',
  skills: ['สมดุลโมเมนต์กับคานยื่น', 'องค์ประกอบของแรงตึงเชือก'],
  gen(R, c) {
    const g = c.g, deg = R.pick([30, 37, 53]);
    const L = R.pick([2, 3, 4, 5]);
    const m = R.pick([10, 20, 30, 40, 50]);
    const W = r2(m * g);
    const Tn = r2(W / (2 * sinD(deg)));
    const Tx = r2(Tn * cosD(deg)), Ty = r2(Tn * sinD(deg));
    if (!ok2(W, Tn, Tx, Ty)) return null;
    return {
      stem: 'คานสม่ำเสมอมวล ' + U(m, 'kg') + ' ยาว ' + U(L, 'm') + ' ยึดปลายด้านหนึ่งไว้กับกำแพงด้วย<b>บานพับ</b> ' +
        'และมีเชือกผูกที่<b>ปลายอีกด้านหนึ่ง</b>ทำมุม ' + fmt(deg) + '° กับคาน โดยคานอยู่ในแนวราบ ' +
        'จงหา<b>แรงตึงเชือก</b> และ<b>องค์ประกอบของแรงตึงในแนวราบและแนวดิ่ง</b> (กำหนด ' + GTXT(g) + ')',
      figure: figBeam({ supports: [{ x: 0, type: 'pivot', label: 'บานพับ' }],
                        loads: [{ x: 0.5, label: 'W' }, { x: 1, up: true, label: 'T sin θ' }],
                        marks: [{ x0: 0, x1: 0.5, label: 'L/2' }] }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของคาน' },
              { s: 'L', v: L, unit: 'm', d: 'ความยาวคาน' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมที่เชือกทำกับคาน' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'T', unit: 'N', d: 'แรงตึงเชือก', value: Tn, positive: true },
              { s: 'T_x', unit: 'N', d: 'องค์ประกอบแนวราบของแรงตึง', value: Tx, positive: true },
              { s: 'T_y', unit: 'N', d: 'องค์ประกอบแนวดิ่งของแรงตึง', value: Ty, positive: true }],
      sol: {
        analyze: '<b>คานสม่ำเสมอ</b> ⇒ น้ำหนักกระทำที่<b>จุดกึ่งกลางคาน</b> คือระยะ ' + M('L/2') +
          ' จากบานพับ<br>' +
          '<b>กลยุทธ์:</b> ที่บานพับมีแรงปฏิกิริยาที่เราไม่รู้ทั้งขนาดและทิศ ' +
          'จึงเลือก<b>คิดโมเมนต์รอบบานพับ</b> เพื่อกำจัดแรงนั้นออกไปทั้งหมด<br>' +
          '<b>แรงที่ให้โมเมนต์รอบบานพับ</b><br>' +
          '• น้ำหนัก ' + M('W') + ' ที่ระยะ ' + M('L/2') + ' → หมุนคานลง<br>' +
          '• องค์ประกอบ<b>แนวดิ่ง</b>ของแรงตึง ' + M('T sin θ') + ' ที่ระยะ ' + M('L') + ' → หมุนคานขึ้น<br>' +
          '<b>สำคัญ:</b> องค์ประกอบแนวราบ ' + M('T cos θ') + ' อยู่ใน<b>แนวเดียวกับคาน</b> ' +
          'จึงผ่านบานพับพอดี ⇒ <b>ไม่ให้โมเมนต์</b><br>' +
          'ค่าที่ใช้: ' + M('sin ' + deg + '° = ' + fmtq(sinD(deg)) + ', cos ' + deg + '° = ' + fmtq(cosD(deg))),
        eqs: [{ eq: 'ΣM_{รอบบานพับ} = 0', why: 'สมดุลต่อการหมุน เลือกบานพับเพราะแรงที่บานพับหายไปทั้งหมด' },
               { eq: '(T sin θ)(L) = W (L/2)', why: 'โมเมนต์ทวนเข็มจากเชือก เท่ากับโมเมนต์ตามเข็มจากน้ำหนักคาน' },
               { eq: 'T = W / (2 sin θ)', why: 'ตัด L ออกทั้งสองข้าง — คำตอบไม่ขึ้นกับความยาวคาน' }],
        solve: EQ('(T sin θ)(L) = W (L/2)', 'T sin θ = W/2', 'T = W / (2 sin θ)') +
          '<div>แล้วแยกองค์ประกอบของแรงตึง</div>' + EQ('T_x = T cos θ', 'T_y = T sin θ'),
        subst: SEQ('W = ({m})({g})', { m: m, g: g }) +
               SEQ('T = {W} / (2 × {s})', { W: W, s: sinD(deg) }) +
               SEQ('T_x = ({T})({c})', { T: Tn, c: cosD(deg) }),
        calc: EQ('W = ' + fmtq(W) + ' `N`',
                 'T = ' + fmtq(W) + ' / ' + fmtq(r2(2 * sinD(deg))) + ' = ' + fmtq(Tn) + ' `N`',
                 'T_x = ' + fmtq(Tx) + ' `N`', 'T_y = ' + fmtq(Ty) + ' `N`'),
        conclude: 'ดังนั้น <b>แรงตึงเชือก ' + U(Tn, 'N') + ' · องค์ประกอบแนวราบ ' + U(Tx, 'N') +
          ' · องค์ประกอบแนวดิ่ง ' + U(Ty, 'N') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบ:</b> ' + M('T_y = ' + fmt(Ty)) + ' N ต้องเท่ากับ ' +
          M('W/2 = ' + fmt(r2(W / 2))) + ' N พอดี ✓ ' +
          '(เพราะเชือกอยู่ปลายคาน มีแขนยาวเป็นสองเท่าของน้ำหนัก จึงใช้แรงแค่ครึ่งเดียว)<br>' +
          '<b>ข้อสังเกตสำคัญ:</b> คำตอบ<b>ไม่ขึ้นกับความยาวคาน</b> เพราะ ' + M('L') + ' ตัดกันไป<br>' +
          '<b>ผลของมุม:</b> ถ้ามุม ' + M('θ') + ' <b>เล็กลง</b> (เชือกเกือบขนานคาน) ' + M('sin θ') +
          ' เล็กลง ⇒ <b>แรงตึงพุ่งสูงขึ้นมาก</b><br>' +
          'จึงเป็นเหตุผลที่การขึงเชือกให้เกือบขนานกับคานเป็นการออกแบบที่แย่ — เชือกจะขาดง่าย</span>'
      }
    };
  }
});

T({
  id: 'w2-fricwork', topic: 5, sub: 'งานของแรงเสียดทาน', level: 'ง่าย',
  skills: ['งานของแรงต้านเป็นลบ', 'พลังงานที่กลายเป็นความร้อน'],
  gen(R, c) {
    const g = c.g, m = R.pick([2, 4, 5, 10, 20]);
    const mu = R.pick([0.1, 0.2, 0.25, 0.4, 0.5]);
    const s = R.pick([2, 4, 5, 8, 10, 20]);
    const f = r2(mu * m * g), W = r2(f * s);
    if (!ok2(f, W) || W < 1 || W > 3000) return null;
    const box = R.pick(BOXES);
    return {
      stem: 'ลาก' + esc(box) + 'มวล ' + U(m, 'kg') + ' ไปบนพื้นราบเป็นระยะ ' + U(s, 'm') +
        ' โดยมีสัมประสิทธิ์ความเสียดทานจลน์ ' + fmt(mu) +
        ' จงหา<b>ขนาดของงานที่แรงเสียดทานทำ</b> (กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานจลน์' },
              { s: 's', v: s, unit: 'm', d: 'ระยะที่เคลื่อนที่' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: '|W_f|', unit: 'J', d: 'ขนาดของงานที่แรงเสียดทานทำ', value: W, positive: true }],
      distract: [f, r2(m * g * s), r2(W / 2), r2(W * 2), r2(mu * s), r2(W / mu)],
      sol: {
        analyze: 'ต้องหา<b>แรงเสียดทานก่อน</b> แล้วจึงคูณด้วยระยะทาง<br>' +
          'พื้นราบและไม่มีแรงกดเพิ่ม ⇒ ' + M('N = m g = ' + fmt(r2(m * g))) + ' N<br>' +
          M('f = μ_k N = ' + fmt(mu) + ' × ' + fmt(r2(m * g)) + ' = ' + fmt(f)) + ' N<br>' +
          '<b>เรื่องเครื่องหมาย:</b> แรงเสียดทานมีทิศ<b>ตรงข้าม</b>การเคลื่อนที่ ⇒ ' +
          M('θ = 180°') + ' ⇒ ' + M('cos 180° = -1') + '<br>' +
          'งานที่แรงเสียดทานทำจึงเป็น<b>ลบ</b> แต่โจทย์ถาม "<b>ขนาด</b>" จึงตอบค่าบวก',
        eqs: [{ eq: 'f = μ_k m g', why: 'แรงเสียดทานบนพื้นราบ โดยแรงตั้งฉากเท่ากับน้ำหนัก' },
               { eq: 'W_f = f s cos 180° = -f s', why: 'งานของแรงที่ต้านการเคลื่อนที่มีค่าเป็นลบเสมอ' }],
        solve: EQ('f = μ_k m g', '|W_f| = f s'),
        subst: SEQ('f = ({mu})({m})({g})', { mu: mu, m: m, g: g }) +
               SEQ('|W_f| = ({f})({s})', { f: f, s: s }),
        calc: EQ('f = ' + fmtq(f) + ' `N`', '|W_f| = ' + fmtq(W) + ' `J`'),
        conclude: 'ดังนั้น <b>แรงเสียดทานทำงาน ' + fmt(-W) + ' J</b> (ขนาด ' + U(W, 'J') + ')<br>' +
          '<span class="hint"><b>พลังงานหายไปไหน?</b> งานลบ ' + U(W, 'J') +
          ' นี้คือพลังงานที่ถูกเปลี่ยนเป็น<b>ความร้อน</b>ที่ผิวสัมผัสพอดี<br>' +
          '<b>สังเกตได้จริง:</b> ถูมือแรง ๆ จะรู้สึกอุ่น · เบรกรถลงเขานาน ๆ จานเบรกจะร้อนจัด<br>' +
          '<b>เหตุผลที่เรียกว่าแรงไม่อนุรักษ์:</b> ความร้อนที่เกิดขึ้นแล้ว ' +
          '<b>เอากลับคืนมาเป็นพลังงานกลไม่ได้</b> ต่างจากแรงโน้มถ่วงที่ยกขึ้นแล้วปล่อยลงก็ได้คืนครบ</span>'
      }
    };
  }
});

T({

      finds: [{ s: 'ΔE_p', unit: 'J', d: 'พลังงานศักย์ที่เพิ่มขึ้น', value: dEp, positive: true }],
      distract: [r2(m * g * h2), r2(m * g * h1), r2(dEp / 2), r2(dEp * 2), r2(m * (h2 - h1)), r2(g * (h2 - h1))],
      sol: {

          'พลังงานศักย์ที่<b>เปลี่ยนไป</b> ขึ้นกับ<b>ผลต่างของความสูง</b>เท่านั้น<br>' +
          M('Δh = h_2 - h_1 = ' + fmt(h2) + ' - ' + fmt(h1) + ' = ' + fmt(h2 - h1)) + ' m<br>' +

        eqs: [{ eq: 'ΔE_p = m g Δh', why: 'พลังงานศักย์ที่เปลี่ยนไป ขึ้นกับผลต่างของความสูง' },
               { eq: 'Δh = h_2 - h_1', why: 'ความสูงที่เพิ่มขึ้นจริง ไม่ใช่ความสูงสุดท้าย' }],
        solve: EQ('ΔE_p = m g (h_2 - h_1)'),
        subst: SEQ('ΔE_p = ({m})({g})({h2} - {h1})', { m: m, g: g, h2: h2, h1: h1 }),
        calc: EQ('ΔE_p = (' + fmtq(m) + ')(' + fmtq(g) + ')(' + fmtq(h2 - h1) + ')',
                 'ΔE_p = ' + fmtq(dEp) + ' `J`'),
        conclude: 'ดังนั้น <b>พลังงานศักย์เพิ่มขึ้น ' + U(dEp, 'J') + '</b><br>' +
          '<span class="hint"><b>ความหมาย:</b> ค่านี้คือ<b>งานที่เราต้องทำ</b>ในการยก' + esc(box) +
          'ขึ้นด้วยความเร็วคงที่<br>' +
          '<b>ทดสอบว่าระดับอ้างอิงไม่มีผลจริงไหม</b><br>' +
          '• อ้างอิงที่พื้น: ' + M(fmt(r2(m * g * h2)) + ' - ' + fmt(r2(m * g * h1)) + ' = ' + fmt(dEp)) + ' J<br>' +
          '• อ้างอิงที่ชั้นล่าง: ' + M(fmt(dEp) + ' - 0 = ' + fmt(dEp)) + ' J<br>' +

T({
  id: 'w2-powerlift', topic: 5, sub: 'กำลังในการยกของ', level: 'ง่าย',
  skills: ['P = W/t', 'งานในการยกเท่ากับพลังงานศักย์ที่เพิ่ม'],
  gen(R, c) {
    const g = c.g, m = R.pick([10, 20, 25, 40, 50, 100]);
    const h = R.pick([2, 3, 4, 5, 8, 10]);
    const t = R.pick([2, 4, 5, 8, 10, 20]);
    const W = r2(m * g * h), P = r2(W / t);
    if (!ok2(W, P) || P > 5000) return null;
    return {
      stem: 'เครื่องยกของยกวัตถุมวล ' + U(m, 'kg') + ' ขึ้นสูง ' + U(h, 'm') +
        ' ด้วยความเร็วคงที่ ใช้เวลา ' + U(t, 's') +
        ' จงหา<b>กำลังเฉลี่ยของเครื่องยก</b> (กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'h', v: h, unit: 'm', d: 'ความสูงที่ยกขึ้น' },
              { s: 't', v: t, unit: 's', d: 'เวลาที่ใช้' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'P', unit: 'W', d: 'กำลังเฉลี่ยของเครื่องยก', value: P, positive: true }],
      distract: [W, r2(m * g), r2(W * t), r2(P / 2), r2(P * 2), r2(m * h / t)],
      sol: {
        analyze: 'ยกด้วย<b>ความเร็วคงที่</b> ⇒ ' + M('a = 0') + ' ⇒ ' +
          'แรงยกต้องเท่ากับน้ำหนักพอดี ' + M('F = m g') + '<br>' +
          'งานที่ทำ = แรงยก × ความสูง = ' + M('m g h') + ' ' +
          'ซึ่งก็คือ<b>พลังงานศักย์ที่เพิ่มให้วัตถุ</b>นั่นเอง<br>' +
          M('W = ' + fmt(m) + ' × ' + fmtq(g) + ' × ' + fmt(h) + ' = ' + fmt(W)) + ' J<br>' +
          'จากนั้นหารด้วยเวลาเพื่อหากำลัง',
        eqs: [{ eq: 'W = m g h', why: 'งานในการยกด้วยความเร็วคงที่ เท่ากับพลังงานศักย์ที่เพิ่มขึ้น' },
               { eq: 'P = W / t', why: 'นิยามของกำลังเฉลี่ย — งานที่ทำได้หารด้วยเวลาที่ใช้' }],
        solve: EQ('W = m g h', 'P = W / t = m g h / t'),
        subst: SEQ('P = ({m})({g})({h}) / {t}', { m: m, g: g, h: h, t: t }),
        calc: EQ('W = ' + fmtq(W) + ' `J`', 'P = ' + fmtq(W) + ' / ' + fmtq(t) + ' = ' + fmtq(P) + ' `W`'),
        conclude: 'ดังนั้น <b>กำลังเฉลี่ยของเครื่องยก = ' + U(P, 'W') + '</b> ' +
          '(ประมาณ ' + fmt(r2(P / 1000)) + ' kW)<br>' +
          '<span class="hint"><b>ตรวจสอบด้วยสูตรลัด ' + M('P = F v') + '</b><br>' +
          'ความเร็วในการยก ' + M('v = h/t = ' + fmt(r2(h / t))) + ' m/s<br>' +
          M('P = F v = ' + fmt(r2(m * g)) + ' × ' + fmt(r2(h / t)) + ' = ' + fmt(P)) + ' W ✓<br>' +
          '<b>ข้อสังเกต:</b> ถ้ายกของเดิมขึ้นความสูงเดิมแต่<b>ใช้เวลาครึ่งเดียว</b> ' +
          '<b>งานเท่าเดิม</b> แต่ต้องใช้<b>กำลังเป็นสองเท่า</b> (' + U(r2(2 * P), 'W') + ')</span>'
      }
    };
  }
});

T({
  id: 'w2-stairs', topic: 5, sub: 'กำลังของคนขึ้นบันได', level: 'ปานกลาง',
  skills: ['แปลงจำนวนขั้นเป็นความสูง', 'กำลังเฉลี่ย'],
  gen(R, c) {
    const g = c.g, m = R.pick([40, 50, 60, 70]);
    const n = R.pick([20, 25, 30, 40, 50]);
    const hs = R.pick([0.15, 0.2, 0.25]);

    const nm = R.pick(NAMES);

      stem: esc(nm) + 'มวล ' + U(m, 'kg') + ' เดินขึ้นบันได <b>' + fmt(n) + ' ขั้น</b> ' +
        'โดยแต่ละขั้นสูง ' + U(hs, 'm') + ' ใช้เวลาทั้งหมด ' + U(t, 's') +

        '(กำหนด ' + GTXT(g) + ')',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของคน' },
              { s: 'n', v: n, unit: 'ขั้น', d: 'จำนวนขั้นบันได' },
              { s: 'h_{ขั้น}', v: hs, unit: 'm', d: 'ความสูงของแต่ละขั้น' },
              { s: 't', v: t, unit: 's', d: 'เวลาที่ใช้' },

      finds: [{ s: 'h', unit: 'm', d: 'ความสูงรวมในแนวดิ่ง', value: h, positive: true },
              { s: 'W', unit: 'J', d: 'งานที่ทำต้านแรงโน้มถ่วง', value: W, positive: true },
              { s: 'P', unit: 'W', d: 'กำลังเฉลี่ย', value: P, positive: true }],
      sol: {
        analyze: '<b>ข้อสำคัญ:</b> งานต้านแรงโน้มถ่วงคิดจาก<b>ความสูงในแนวดิ่งเท่านั้น</b> ' +
          'ไม่เกี่ยวกับระยะทางที่เดินจริงบนบันได<br>' +
          'เพราะแรงโน้มถ่วงอยู่ในแนวดิ่ง องค์ประกอบการเคลื่อนที่ในแนวราบจึงไม่ทำงาน<br>' +
          '<b>ขั้นที่ 1</b> หาความสูงรวม ' + M('h = n × h_{ขั้น} = ' + fmt(n) + ' × ' + fmt(hs) + ' = ' + fmt(h)) + ' m<br>' +
          '<b>ขั้นที่ 2</b> หางาน ' + M('W = m g h') + '<br>' +
          '<b>ขั้นที่ 3</b> หากำลัง ' + M('P = W / t'),
        eqs: [{ eq: 'h = n h_{ขั้น}', why: 'ความสูงรวมในแนวดิ่ง = จำนวนขั้น คูณ ความสูงต่อขั้น' },
               { eq: 'W = m g h', why: 'งานที่ทำต้านแรงโน้มถ่วง เท่ากับพลังงานศักย์ที่เพิ่มขึ้น' },
               { eq: 'P = W / t', why: 'กำลังเฉลี่ย คืองานที่ทำได้ต่อหน่วยเวลา' }],
        solve: EQ('h = n h_{ขั้น}', 'W = m g h', 'P = W / t'),
        subst: SEQ('h = ({n})({hs})', { n: n, hs: hs }) +
               SEQ('W = ({m})({g})({h})', { m: m, g: g, h: h }) +
               SEQ('P = {W} / {t}', { W: W, t: t }),
        calc: EQ('h = ' + fmtq(h) + ' `m`', 'W = ' + fmtq(W) + ' `J`', 'P = ' + fmtq(P) + ' `W`'),
        conclude: 'ดังนั้น <b>ขึ้นไปสูง ' + U(h, 'm') + ' · ทำงาน ' + U(W, 'J') +
          ' · ใช้กำลังเฉลี่ย ' + U(P, 'W') + '</b><br>' +
          '<span class="hint"><b>เทียบกับค่าจริง:</b> คนทั่วไปเดินขึ้นบันไดใช้กำลังราว 100–300 วัตต์ ' +

          '<b>ข้อควรรู้:</b> ค่านี้เป็นเพียง<b>กำลังทางกล</b> ' +

          '<b>อย่าสับสน:</b> ถ้าโจทย์ถามระยะทางที่เดินจริงบนบันได จะต้องใช้ความยาวตามแนวลาด ' +
          'ซึ่ง<b>ยาวกว่า</b>ความสูงในแนวดิ่งเสมอ</span>'
      }
    };
  }

T({
  id: 'w2-springwork', topic: 5, sub: 'งานในการดึงสปริง', level: 'ปานกลาง',
  skills: ['แรงสปริงไม่คงที่จึงต้องใช้แรงเฉลี่ย', 'พื้นที่ใต้กราฟ F–x'],
  gen(R) {
    const k = R.pick([100, 200, 400, 500, 800, 1000]);
    const x1 = R.pick([0.1, 0.2, 0.25, 0.3]);
    const x2 = r2(2 * x1);
    const F1 = r2(k * x1);
    const E1 = r2(0.5 * k * x1 * x1), E2 = r2(0.5 * k * x2 * x2);
    const dW = r2(E2 - E1);
    if (!ok2(F1, E1, E2, dW) || E2 > 2000) return null;
    return {
      stem: 'สปริงมีค่านิจ ' + U(k, 'N/m') + ' ถูกดึงให้ยืดออกจากความยาวธรรมชาติ ' + U(x1, 'm') +
        ' จงหา<b>แรงที่ต้องออกที่ระยะนั้น</b> <b>พลังงานที่สะสมไว้</b> ' +
        'และ<b>งานเพิ่มเติมที่ต้องทำเพื่อดึงต่อจนยืดเป็น ' + fmt(x2) + ' เมตร</b>',
      given: [{ s: 'k', v: k, unit: 'N/m', d: 'ค่านิจสปริง' },
              { s: 'x_1', v: x1, unit: 'm', d: 'ระยะยืดตอนแรก' },
              { s: 'x_2', v: x2, unit: 'm', d: 'ระยะยืดตอนหลัง' }],
      finds: [{ s: 'F_1', unit: 'N', d: 'แรงที่ระยะยืด x₁', value: F1, positive: true },
              { s: 'E_1', unit: 'J', d: 'พลังงานสะสมที่ระยะยืด x₁', value: E1, positive: true },
              { s: 'ΔW', unit: 'J', d: 'งานเพิ่มเติมในการดึงจาก x₁ ถึง x₂', value: dW, positive: true }],
      sol: {
        analyze: '<b>กับดักของข้อนี้:</b> ใช้ ' + M('W = F x') + ' ตรง ๆ — <b>ผิด</b> ' +
          'เพราะแรงสปริง<b>ไม่คงที่</b> เริ่มจากศูนย์แล้วค่อย ๆ เพิ่ม<br>' +
          '<b>กฎของฮุก</b> ' + M('F = k x') + ' ⇒ แรงแปรผันตรงกับระยะยืด<br>' +
          'งานจึงต้องใช้<b>แรงเฉลี่ย</b> ' + M('(0 + kx)/2') + ' คูณระยะ ' + M('x') + ' ⇒ ' +
          M('E_p = (1/2) k x^2') + ' ' +
          'ซึ่งก็คือ<b>พื้นที่ใต้กราฟ ' + M('F') + '–' + M('x') + '</b> (รูปสามเหลี่ยม)<br>' +
          '<b>งานเพิ่มเติม</b>ในการดึงจาก ' + M('x_1') + ' ถึง ' + M('x_2') +
          ' คือ<b>ผลต่างของพลังงานสะสม</b> ไม่ใช่คำนวณใหม่ทั้งก้อน',
        eqs: [{ eq: 'F = k x', why: 'กฎของฮุก — แรงสปริงแปรผันตรงกับระยะยืด' },
               { eq: 'E_p = (1/2) k x^2', why: 'พลังงานสะสม คือพื้นที่ใต้กราฟ F–x รูปสามเหลี่ยม' },
               { eq: 'ΔW = E_2 - E_1', why: 'งานเพิ่มเติม คือผลต่างของพลังงานที่สะสมไว้ทั้งสองสถานะ' }],
        solve: EQ('F_1 = k x_1', 'E_1 = (1/2) k x_1^2', 'E_2 = (1/2) k x_2^2', 'ΔW = E_2 - E_1'),
        subst: SEQ('F_1 = ({k})({x1})', { k: k, x1: x1 }) +
               SEQ('E_1 = (1/2)({k})({x1})^2', { k: k, x1: x1 }) +
               SEQ('E_2 = (1/2)({k})({x2})^2', { k: k, x2: x2 }),
        calc: EQ('F_1 = ' + fmtq(F1) + ' `N`',
                 'E_1 = ' + fmtq(E1) + ' `J`',
                 'E_2 = ' + fmtq(E2) + ' `J`',
                 'ΔW = ' + fmtq(E2) + ' - ' + fmtq(E1) + ' = ' + fmtq(dW) + ' `J`'),
        conclude: 'ดังนั้น <b>แรงที่ระยะยืดแรก ' + U(F1, 'N') + ' · พลังงานสะสม ' + U(E1, 'J') +
          ' · ต้องทำงานเพิ่มอีก ' + U(dW, 'J') + '</b><br>' +
          '<span class="hint"><b>ข้อสังเกตที่ออกสอบบ่อยมาก</b><br>' +
          'ดึงยืดเป็น<b>สองเท่า</b> ⇒ แรงเพิ่ม 2 เท่า แต่<b>พลังงานเพิ่ม 4 เท่า</b> ' +
          '(' + fmt(E1) + ' → ' + fmt(E2) + ' J)<br>' +
          'ดังนั้นงานที่ต้องทำ<b>ในช่วงหลัง</b> (' + fmt(dW) + ' J) ' +
          '<b>มากกว่า</b>งานในช่วงแรก (' + fmt(E1) + ' J) ถึง 3 เท่า<br>' +
          '<b>เหตุผล:</b> ยิ่งดึงไปไกล แรงยิ่งมาก จึงต้องออกแรงมากขึ้นเรื่อย ๆ ในระยะเท่ากัน<br>' +
          'นี่คือความรู้สึกจริงเวลาง้างธนู — ช่วงท้ายฝืดกว่าช่วงแรกมาก</span>'
      }
    };
  }
});

T({
  id: 'w2-inclinefric-w', topic: 5, sub: 'งานในการลากขึ้นพื้นเอียงมีเสียดทาน', level: 'ยาก',
  skills: ['แยกงานต้านโน้มถ่วงกับงานต้านเสียดทาน', 'ประสิทธิภาพของพื้นเอียง'],
  gen(R, c) {
    const g = c.g, deg = 37, mu = R.pick([0.25, 0.5]);
    const m = R.pick([2, 4, 5, 10, 20]);
    const L = R.pick([5, 10, 15, 20]);
    const h = r2(L * sinD(deg));
    const Wg = r2(m * g * h);
    const f = r2(mu * m * g * cosD(deg));
    const Wf = r2(f * L);
    const Wtot = r2(Wg + Wf);
    const eff = r2(Wg / Wtot * 100);
    if (!ok2(h, Wg, f, Wf, Wtot) || dpOf(eff, 4) > 2 || Wtot > 5000) return null;
    const box = R.pick(BOXES);
    return {
      stem: 'ลาก' + esc(box) + 'มวล ' + U(m, 'kg') + ' ขึ้นพื้นเอียงที่ทำมุม ' + fmt(deg) +
        '° กับแนวราบ ด้วย<b>ความเร็วคงที่</b> ตลอดความยาวพื้นเอียง ' + U(L, 'm') +
        ' โดยมีสัมประสิทธิ์ความเสียดทานจลน์ ' + fmt(mu) +
        ' จงหา<b>งานที่ทำต้านแรงโน้มถ่วง</b> <b>งานที่ทำต้านแรงเสียดทาน</b> และ<b>งานรวมที่ต้องทำ</b> ' +
        '(กำหนด ' + GTXT(g) + ')',
      figure: figIncline({ deg: deg, mass: 'm', down: 'mg', up: 'F', fric: 'f' }),
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวลของวัตถุ' },
              { s: 'θ', v: deg, unit: '°', d: 'มุมเอียงของพื้น' },
              { s: 'L', v: L, unit: 'm', d: 'ความยาวตามพื้นเอียง' },
              { s: 'μ_k', v: mu, unit: '', d: 'สัมประสิทธิ์ความเสียดทานจลน์' },
              { s: 'g', v: g, unit: 'm/s²', d: 'ความเร่งโน้มถ่วง' }],
      finds: [{ s: 'W_{โน้มถ่วง}', unit: 'J', d: 'งานที่ทำต้านแรงโน้มถ่วง', value: Wg, positive: true },
              { s: 'W_{เสียดทาน}', unit: 'J', d: 'งานที่ทำต้านแรงเสียดทาน', value: Wf, positive: true },
              { s: 'W_{รวม}', unit: 'J', d: 'งานรวมที่ต้องทำ', value: Wtot, positive: true }],
      sol: {
        analyze: 'ลากด้วย<b>ความเร็วคงที่</b> ⇒ ' + M('a = 0') + ' ⇒ ' +
          'แรงที่ออกต้องสู้กับ<b>สองแรงต้าน</b>พอดี<br>' +
          '1. องค์ประกอบของน้ำหนักที่ฉุดลงเนิน ' + M('m g sin θ') + '<br>' +
          '2. แรงเสียดทาน ' + M('f = μ_k N = μ_k m g cos θ') + '<br>' +
          '<b>จุดที่ต้องระวังที่สุด — ระยะทางที่ใช้คูณไม่เท่ากัน</b><br>' +
          '• งาน<b>ต้านโน้มถ่วง</b> ใช้<b>ความสูงในแนวดิ่ง</b> ' + M('h = L sin θ = ' + fmt(h)) + ' m<br>' +
          '• งาน<b>ต้านเสียดทาน</b> ใช้<b>ระยะตามพื้นเอียง</b> ' + M('L = ' + fmt(L)) + ' m<br>' +
          'ค่าที่ใช้: ' + M('sin 37° = 0.6, cos 37° = 0.8'),
        eqs: [{ eq: 'W_{โน้มถ่วง} = m g h = m g L sin θ',
                why: 'งานต้านแรงโน้มถ่วง ใช้ความสูงในแนวดิ่งเท่านั้น' },
               { eq: 'f = μ_k m g cos θ', why: 'แรงเสียดทานบนพื้นเอียง โดย N = mg cos θ ไม่ใช่ mg' },
               { eq: 'W_{เสียดทาน} = f L', why: 'งานต้านเสียดทาน ใช้ระยะทางที่ไถลจริงตามพื้นเอียง' },
               { eq: 'W_{รวม} = W_{โน้มถ่วง} + W_{เสียดทาน}',
                 why: 'ความเร็วคงที่ ⇒ พลังงานจลน์ไม่เปลี่ยน งานทั้งหมดจึงไปสู้กับสองแรงต้านนี้พอดี' }],
        solve: EQ('h = L sin θ', 'W_{โน้มถ่วง} = m g h',
                  'f = μ_k m g cos θ', 'W_{เสียดทาน} = f L',
                  'W_{รวม} = W_{โน้มถ่วง} + W_{เสียดทาน}'),
        subst: SEQ('h = ({L})({s})', { L: L, s: sinD(deg) }) +
               SEQ('W_{โน้มถ่วง} = ({m})({g})({h})', { m: m, g: g, h: h }) +
               SEQ('f = ({mu})({m})({g})({c})', { mu: mu, m: m, g: g, c: cosD(deg) }) +
               SEQ('W_{เสียดทาน} = ({f})({L})', { f: f, L: L }),
        calc: EQ('h = ' + fmtq(h) + ' `m`',
                 'W_{โน้มถ่วง} = ' + fmtq(Wg) + ' `J`',
                 'f = ' + fmtq(f) + ' `N`',
                 'W_{เสียดทาน} = ' + fmtq(Wf) + ' `J`',
                 'W_{รวม} = ' + fmtq(Wg) + ' + ' + fmtq(Wf) + ' = ' + fmtq(Wtot) + ' `J`'),
        conclude: 'ดังนั้น <b>งานต้านโน้มถ่วง ' + U(Wg, 'J') + ' · งานต้านเสียดทาน ' + U(Wf, 'J') +
          ' · งานรวม ' + U(Wtot, 'J') + '</b><br>' +
          '<span class="hint"><b>ประสิทธิภาพของพื้นเอียงนี้</b><br>' +
          M('(W_{โน้มถ่วง} / W_{รวม}) × 100 = ' + fmt(eff)) + ' %<br>' +
          'แปลว่ามีเพียง ' + fmt(eff) + '% ของงานที่ทำ ที่กลายเป็นพลังงานศักย์ที่ใช้ประโยชน์ได้จริง ' +
          'ส่วนที่เหลือ ' + fmt(r2(100 - eff)) + '% กลายเป็น<b>ความร้อน</b><br>' +
          '<b>เปรียบเทียบกับพื้นเอียงลื่น:</b> ถ้าไม่มีความเสียดทาน จะใช้งานเพียง ' + U(Wg, 'J') +
          ' เท่ากับการยกตรง ๆ พอดี (ผ่อนแรงแต่ไม่ผ่อนงาน)<br>' +
          '<b>บทเรียน:</b> ในโลกจริง เครื่องกลผ่อนแรงทุกชนิด<b>ต้องทำงานมากกว่า</b>ที่คำนวณตามทฤษฎีเสมอ ' +
          'เพราะมีความเสียดทานเข้ามาเกี่ยวข้อง</span>'
      }
    };
  }
});

/* ============ บทที่ 6 : โจทย์คำนวณเพิ่มเติม ============ */

T({
  id: 'p2-massfromp', topic: 6, sub: 'หามวลจากโมเมนตัม', level: 'ง่าย',
  skills: ['จัดรูปสมการโมเมนตัม'],
  gen(R) {
    const m = R.pick([0.5, 2, 4, 5, 8, 10, 20]);
    const v = R.pick([2, 3, 4, 5, 6, 8, 10, 12]);
    const p = r2(m * v);
    if (!ok2(p)) return null;
    return {
      stem: 'วัตถุเคลื่อนที่ด้วยความเร็ว ' + U(v, 'm/s') + ' มีโมเมนตัมขนาด ' + U(p, 'kg·m/s') +
        ' จงหา<b>มวลของวัตถุ</b>',
      given: [{ s: 'p', v: p, unit: 'kg·m/s', d: 'ขนาดของโมเมนตัม' },
              { s: 'v', v: v, unit: 'm/s', d: 'ความเร็ว' }],
      finds: [{ s: 'm', unit: 'kg', d: 'มวลของวัตถุ', value: m, positive: true }],
      distract: [r2(p * v), r2(v / p), r2(m / 2), r2(m * 2), r2(p + v), r2(p - v)],
      sol: {
        analyze: 'โมเมนตัมนิยามว่า ' + M('p = m v') + '<br>' +
          'ข้อนี้โจทย์ให้ ' + M('p') + ' กับ ' + M('v') + ' แล้วถาม ' + M('m') +
          ' จึงต้อง<b>จัดรูปสมการย้อนกลับ</b> ด้วยการหารทั้งสองข้างด้วย ' + M('v') + '<br>' +
          '<b>ตรวจหน่วยก่อน:</b> ' + M('`kg·m/s` ÷ `m/s` = `kg`') + ' ✓ ได้หน่วยของมวลถูกต้อง',
        eqs: [{ eq: 'p = m v', why: 'นิยามของโมเมนตัม' },
               { eq: 'm = p / v', why: 'หารด้วย v ทั้งสองข้าง เพื่อแยก m ออกมาอยู่ตัวเดียว' }],
        solve: EQ('p = m v', 'm = p / v'),
        subst: SEQ('m = {p} / {v}', { p: p, v: v }),
        calc: EQ('m = ' + fmtq(m) + ' `kg`'),
        conclude: 'ดังนั้น <b>มวลของวัตถุ = ' + U(m, 'kg') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบย้อนกลับ:</b> ' +
          M(fmt(m) + ' × ' + fmt(v) + ' = ' + fmt(p)) + ' kg·m/s ✓<br>' +
          '<b>คิดต่อ:</b> พลังงานจลน์ของวัตถุนี้เท่ากับ ' +
          M('p^2/(2m) = ' + fmt(p * p) + '/' + fmt(r2(2 * m)) + ' = ' + fmt(r2(p * p / (2 * m)))) + ' J<br>' +
          'ซึ่งตรงกับ ' + M('(1/2)mv^2 = ' + fmt(r2(0.5 * m * v * v))) + ' J เช่นกัน ✓</span>'
      }
    };
  }
});

T({
  id: 'p2-imptime', topic: 6, sub: 'หาเวลาจากการดล', level: 'ง่าย',
  skills: ['FΔt = Δp', 'จัดรูปหาเวลา'],
  gen(R) {
    const m = R.pick([0.2, 0.5, 1, 2, 4]);
    const v = R.pick([4, 5, 6, 8, 10, 20]);
    const F = R.step(10, 200, 10);
    const t = r2(m * v / F);
    if (!ok2(t) || t < 0.02 || t > 5) return null;
    const ball = R.pick(BALLS);
    return {
      stem: esc(ball) + 'มวล ' + U(m, 'kg') + ' ที่<b>เดิมอยู่นิ่ง</b> ถูกแรงคงที่ ' + U(F, 'N') +
        ' กระทำจนมีความเร็ว ' + U(v, 'm/s') + ' จงหา<b>เวลาที่แรงกระทำ</b>',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'u', v: 0, unit: 'm/s', d: 'ความเร็วต้น (อยู่นิ่ง)' },
              { s: 'v', v: v, unit: 'm/s', d: 'ความเร็วปลาย' },
              { s: 'F', v: F, unit: 'N', d: 'แรงที่กระทำ' }],
      finds: [{ s: 'Δt', unit: 's', d: 'เวลาที่แรงกระทำ', value: t, positive: true }],
      distract: [r2(F / (m * v)), r2(m * v * F), r2(t / 2), r2(t * 2), r2(F / m), r2(v / F)],
      sol: {
        analyze: 'ใช้<b>ทฤษฎีบทการดล-โมเมนตัม</b> ' + M('F Δt = Δp') + '<br>' +
          'โมเมนตัมที่เปลี่ยนไป ' + M('Δp = m v - m u') + '<br>' +
          'เริ่มจากหยุดนิ่ง ⇒ ' + M('u = 0') + ' ⇒ ' + M('Δp = m v = ' + fmt(m) + ' × ' + fmt(v) + ' = ' + fmt(r2(m * v))) +
          ' kg·m/s<br>' +
          'จากนั้นย้ายข้างเพื่อหาเวลา',
        eqs: [{ eq: 'F Δt = Δp = m v - m u', why: 'ทฤษฎีบทการดล-โมเมนตัม' },
               { eq: 'Δt = m v / F', why: 'แทน u = 0 แล้วย้าย F ไปหารอีกข้าง' }],
        solve: EQ('F Δt = m v', 'Δt = m v / F'),
        subst: SEQ('Δt = ({m})({v}) / {F}', { m: m, v: v, F: F }),
        calc: EQ('Δt = ' + fmtq(r2(m * v)) + ' / ' + fmtq(F), 'Δt = ' + fmtq(t) + ' `s`'),
        conclude: 'ดังนั้น <b>แรงกระทำเป็นเวลา ' + U(t, 's') + '</b><br>' +
          '<span class="hint"><b>ตรวจสอบด้วยกฎข้อที่สอง:</b> ' +
          M('a = F/m = ' + fmt(r2(F / m))) + ' m/s² แล้วใช้ ' + M('t = v/a = ' + fmt(t)) + ' s ✓<br>' +
          '<b>ความสัมพันธ์ที่ต้องเข้าใจ:</b> เมื่อ ' + M('Δp') + ' คงที่ ' +
          M('F') + ' กับ ' + M('Δt') + ' <b>แปรผกผันกัน</b><br>' +
          'ถ้าใช้แรง<b>ครึ่งเดียว</b> จะต้องใช้เวลา<b>สองเท่า</b> (' + U(r2(2 * t), 's') + ') ' +
          'จึงจะได้ความเร็วปลายเท่ากัน</span>'
      }
    };
  }
});

T({
  id: 'p2-reverse', topic: 6, sub: 'โมเมนตัมเมื่อวัตถุย้อนทิศ', level: 'ง่าย',
  skills: ['ใส่เครื่องหมายให้ความเร็วที่ย้อนทิศ'],
  gen(R) {
    const m = R.pick([0.2, 0.5, 1, 2, 4]);
    const u = R.pick([5, 6, 8, 10, 12]);
    const v = R.pick([2, 3, 4, 5]);
    if (v >= u) return null;
    const dp = r2(m * (u + v));
    if (!ok2(dp)) return null;
    const ball = R.pick(BALLS);
    return {
      stem: esc(ball) + 'มวล ' + U(m, 'kg') + ' พุ่งไปทางขวาด้วยความเร็ว ' + U(u, 'm/s') +
        ' ชนกำแพงแล้ว<b>สะท้อนกลับไปทางซ้าย</b>ด้วยความเร็ว ' + U(v, 'm/s') +
        ' จงหา<b>ขนาดของโมเมนตัมที่เปลี่ยนไป</b>',
      given: [{ s: 'm', v: m, unit: 'kg', d: 'มวล' },
              { s: 'u', v: u, unit: 'm/s', d: 'ความเร็วก่อนชน ไปทางขวา (+)' },
              { s: 'v', v: -v, unit: 'm/s', d: 'ความเร็วหลังชน ไปทางซ้าย (−)' }],
      finds: [{ s: '|Δp|', unit: 'kg·m/s', d: 'ขนาดของโมเมนตัมที่เปลี่ยนไป', value: dp, positive: true }],
      distract: [r2(m * (u - v)), r2(m * u), r2(m * v), r2(dp / 2), r2(dp * 2), r2(u + v)],
      sol: {
        analyze: '<b>กับดักของข้อนี้:</b> คิดว่า ' + M('Δp = m(u - v)') + ' — <b>ผิด</b> ' +
          'เพราะ' + esc(ball) + '<b>ย้อนทิศ</b><br>' +
          'กำหนดทิศไปทางขวาเป็นบวก ⇒ ' + M('u = +' + fmt(u)) + ' m/s และ ' +
          M('v = -' + fmt(v)) + ' m/s<br>' +
          M('Δp = m v - m u = m(-' + fmt(v) + ') - m(+' + fmt(u) + ') = -m(' + fmt(u) + ' + ' + fmt(v) + ')') + '<br>' +
          '⇒ ขนาดเท่ากับ ' + M('m(u + v)') + ' — <b>บวกกัน ไม่ใช่ลบกัน</b><br>' +
          '<b>คิดตามสามัญสำนึก:</b> กำแพงต้อง<b>หยุด</b>' + esc(ball) + 'ก่อน แล้ว<b>ผลักกลับ</b>อีก ' +
          'จึงต้องเปลี่ยนโมเมนตัมมากกว่าการหยุดเฉย ๆ',
        eqs: [{ eq: 'Δp = m v - m u', why: 'นิยามของโมเมนตัมที่เปลี่ยนไป ต้องใส่เครื่องหมายตามทิศเสมอ' },
               { eq: '|Δp| = m (u + v)', why: 'แทน v ด้วยค่าติดลบ เครื่องหมายลบสองตัวจึงกลายเป็นการบวกขนาด' }],
        solve: EQ('Δp = m v - m u', '|Δp| = m (u + v)'),
        subst: SEQ('|Δp| = ({m})({u} + {v})', { m: m, u: u, v: v }),
        calc: EQ('|Δp| = (' + fmtq(m) + ')(' + fmtq(u + v) + ')', '|Δp| = ' + fmtq(dp) + ' `kg·m/s`'),
        conclude: 'ดังนั้น <b>โมเมนตัมเปลี่ยนไป ' + U(dp, 'kg·m/s') + '</b> ' +
          'มีทิศไปทางซ้าย (ออกจากกำแพง)<br>' +
          '<span class="hint"><b>เปรียบเทียบสองกรณีให้เห็นชัด</b><br>' +
          '• ถ้า' + esc(ball) + 'ชนแล้ว<b>ติดกำแพง</b> (ไม่สะท้อน) ⇒ ' + M('Δp = m u = ' + fmt(r2(m * u))) + ' kg·m/s<br>' +
          '• ถ้า<b>สะท้อนกลับ</b> ⇒ ' + M('Δp = ' + fmt(dp)) + ' kg·m/s (<b>มากกว่า</b>)<br>' +
          'นี่คือเหตุผลที่<b>ลูกบอลที่เด้งกลับได้ทำให้เกิดแรงกระแทกมากกว่า</b>ลูกที่ชนแล้วแปะติด<br>' +
          '<b>ประยุกต์:</b> ความดันของแก๊สเกิดจากโมเลกุลชนผนังแล้วสะท้อนกลับ ' +
          'จึงใช้ ' + M('Δp = 2mv') + ' ในการคำนวณ</span>'
      }
    };
  }
});

T({
  id: 'p2-headon2', topic: 6, sub: 'ชนกันแล้วติดกันแบบวิ่งสวนทาง', level: 'ปานกลาง',
  skills: ['อนุรักษ์โมเมนตัมกรณีสวนทางกัน', 'ตีความเครื่องหมายของคำตอบ'],
  gen(R) {
    const m1 = R.pick([2, 3, 4, 5, 6]), m2 = R.pick([1, 2, 3, 4]);
    const u1 = R.pick([4, 6, 8, 10, 12]), u2 = R.pick([2, 3, 4, 6]);
    const P = m1 * u1 - m2 * u2;
    const v = r2(P / (m1 + m2));
    if (!ok2(v) || Math.abs(v) < 0.3) return null;
    return {
      stem: 'รถทดลองมวล ' + U(m1, 'kg') + ' แล่นไปทาง<b>ขวา</b>ด้วยความเร็ว ' + U(u1, 'm/s') +
        ' ชนกับรถมวล ' + U(m2, 'kg') + ' ที่แล่น<b>สวนมาทางซ้าย</b>ด้วยความเร็ว ' + U(u2, 'm/s') +
        ' หลังชน<b>รถทั้งสองติดกันแล้วเคลื่อนที่ไปด้วยกัน</b> จงหา<b>ความเร็วร่วมหลังชน</b>',

T({

        eqs: [{ eq: '0 = m_1 v_1 + m_2 v_2', why: 'โมเมนตัมรวมก่อนระเบิดเป็นศูนย์ หลังระเบิดจึงต้องเป็นศูนย์ด้วย' },

          'ชิ้นที่<b>เบากว่า</b> (' + fmt(m1) + ' kg) ได้พลังงานจลน์ ' + fmt(E1) + ' J ' +
          'ซึ่ง<b>มากกว่า</b>ชิ้นที่หนักกว่า (' + fmt(E2) + ' J)<br>' +
          'เพราะ ' + M('E_k = p^2/(2m)') + ' — เมื่อ ' + M('p') + ' เท่ากัน มวลน้อยจึงได้พลังงานมาก<br>' +
          '<b>พลังงานรวม</b> ' + fmt(r2(E1 + E2)) + ' J มาจาก<b>พลังงานเคมีในดินระเบิด</b> ' +
