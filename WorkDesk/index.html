}

/** บันทึกคะแนนคนเดียว แล้วอัปเดตแถวในหน่วยความจำ */
async function saveScore(sid, raw, comment, inp) {
  const w = T.subs.work;
  if (raw !== '' && (isNaN(Number(raw)) || Number(raw) < 0 || Number(raw) > Number(w.max))) {
    toast('คะแนนต้องอยู่ระหว่าง 0 ถึง ' + fmtN(w.max));
    if (inp) inp.focus();
    return false;
  }
  if (inp) inp.style.borderColor = 'var(--brand)';
  try {
    const item = { sid: sid, raw: raw === '' ? '' : Number(raw) };
    if (comment != null) item.comment = comment;
    const r = await api('workGrade', { code: w.code, items: [item] });
    applyGraded(r.rows);
    if (inp) { inp.style.borderColor = 'var(--ok)'; setTimeout(() => { inp.style.borderColor = ''; }, 900); }
    return true;
  } catch (e) {
    if (inp) inp.style.borderColor = 'var(--bad)';
    fail(e);
    return false;
  }
}
function applyGraded(list) {
  list.forEach(x => {
    const row = T.subs.rows.find(r => r.sid === x.sid);
    if (row) row.sub = x.sub;
    const cell = $('[data-final="' + x.sid + '"]');
    if (cell) cell.textContent = x.sub && x.sub.graded ? fmtN(x.sub.score) : '';
  });
  const w = T.works && T.works.find(x => x.code === T.subs.work.code);
  if (w) {
    const rows = T.subs.rows;
    w.stats.graded = rows.filter(r => r.sub && r.sub.graded).length;
    w.stats.toGrade = rows.filter(needsGrade).length;
  }
}

async function bulkGrade() {
  const w = T.subs.work, v = $('[data-bulk]').value, targets = scopedRows().filter(needsGrade);
  if (v === '' || isNaN(Number(v)) || Number(v) < 0 || Number(v) > Number(w.max)) return toast('คะแนนต้องอยู่ระหว่าง 0 ถึง ' + fmtN(w.max));
  const lateN = targets.filter(r => r.sub.lateMin > 0 && r.sub.penalty > 0).length;
  const yes = await confirmBox('ให้คะแนนเท่ากัน ' + targets.length + ' คน',
    '<p>ทุกคนที่ส่งแล้วแต่ยังไม่ตรวจ ได้คนละ <b>' + fmtN(v) + '</b> จาก ' + fmtN(w.max) + ' คะแนน</p>' +
    (lateN ? '<div class="notice warn">' + lateN + ' คนส่งช้า คะแนนจริงจะถูกหักตามเวลาที่ส่ง</div>' : '') +
    '<p class="muted small">แก้รายคนทีหลังได้ คนที่ยังไม่ส่งไม่ถูกแตะ</p>', 'ให้คะแนน');
  if (!yes) return;
  try {
    const r = await api('workGrade', { code: w.code, items: targets.map(t => ({ sid: t.sid, raw: Number(v) })) });
    applyGraded(r.rows);
    toast('ให้คะแนนแล้ว ' + r.rows.length + ' คน');
    gradeBody();
  } catch (e) { fail(e); }
}

async function copyScores() {
  const w = T.subs.work;
  const lines = [['เลขที่', 'เลขประจำตัว', 'ชื่อ', 'ชั้น', 'คะแนน (หลังหัก)', 'เต็ม', 'สถานะ'].join('\t')].concat(T.subs.rows.map(r => {
    const s = r.sub;
    const st = hasFiles(r) ? (s.lateMin > 0 ? 'ส่งช้า' : 'ส่งแล้ว') : (s && s.graded ? 'ไม่มีไฟล์' : 'ยังไม่ส่ง');
    return [r.no, r.sid, r.name, r.cls, s && s.graded ? s.score : '', w.max, st].join('\t');
  }));
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว วางใน Excel หรือ Google Sheets ได้เลย'); }
  catch (e) {
    const sh = openSheet('<h2>คัดลอกคะแนน</h2><p class="muted small">เครื่องนี้คัดลอกให้อัตโนมัติไม่ได้ กด Ctrl+A แล้ว Ctrl+C</p><textarea readonly style="height:240px;font-size:13px">' + esc(text) + '</textarea>');
    const ta = $('textarea', sh.root); ta.focus(); ta.select();
  }
}

/* ---- ตัวดูงาน: ดูรูปทีละคน ให้คะแนน กด Enter ไปคนถัดไป ----------------------- */
let VIEW = null;
async function openViewer(sid) {
  const w = T.subs.work;
  const order = T.subs.rows.filter(hasFiles);
  let i = order.findIndex(r => r.sid === sid);
  if (i < 0) return;
  const layer = $('#layer');
  layer.innerHTML = '<div class="viewer" role="dialog" aria-modal="true">' +
    '<div class="vtop"><button class="sm" data-vclose>ปิด</button><div class="who" data-vwho></div><span class="sp"></span>' +
    '<button class="sm primary" data-vink>✏️ เขียนตรวจ</button><button class="sm" data-vzoom>ขยาย</button><button class="sm" data-vprev>‹ ก่อนหน้า</button><button class="sm" data-vnext>ถัดไป ›</button></div>' +
    '<div class="vbody" data-vbody></div>' +
    '<div class="vbot"><div class="fld"><span>คะแนน (เต็ม ' + fmtN(w.max) + ')</span><input class="score" data-vscore type="number" min="0" max="' + esc(w.max) + '" step="0.5" inputmode="decimal"></div>' +
    '<button class="sm" data-vfull>เต็ม</button>' +
    '<div class="fld" style="flex:1"><span>ความเห็นถึงนักเรียน</span><input class="cm" data-vcm maxlength="1000" placeholder="ไม่บังคับ"></div>' +
    '<div class="fld"><span data-vpen>&nbsp;</span><button class="primary" data-vsave>บันทึก · คนถัดไป</button></div></div></div>';
  document.body.style.overflow = 'hidden';
  const root = $('.viewer', layer);
  const close = () => {
    document.removeEventListener('keydown', onKey);
    layer.innerHTML = ''; document.body.style.overflow = '';
    VIEW = null;
    gradeBody();
  };
  const score = $('[data-vscore]', root), cm = $('[data-vcm]', root);
  const paintPen = () => {
    const r = order[i], s = r.sub, v = score.value;
    $('[data-vpen]', root).textContent = s.penalty ? 'ช้า −' + s.penalty + '% → ' + (v === '' ? '—' : fmtN(finalOf(w, v, s.lateMin))) : ' ';
  };
  let orig = false;                   /* มีฉบับที่เขียนตรวจแล้ว ตัวดูงานแสดงฉบับนั้นก่อน กดดูต้นฉบับได้ */
  const show = async () => {
    const r = order[i], s = r.sub;
    if (!VIEW || VIEW.sid !== r.sid) orig = false;
    VIEW = { sid: r.sid };
    /* หน้าที่เพิ่งเขียนแต่ยังรอส่งในคิว แสดงจากเครื่องเลย ไม่ต้องรอชีต */
    const qj = !orig && obPagesOf(w.code, r.sid);
    const marked = qj || (s.marked && s.marked.length);
    const files = qj ? [] : marked && !orig ? s.marked : s.files;
    $('[data-vwho]', root).innerHTML = esc(r.name) + ' <span class="muted small">เลขที่ ' + esc(r.no) + ' · ' + esc(r.cls) + ' · ' + (i + 1) + '/' + order.length + '</span>' +
      '<div class="small" style="font-weight:400">ส่ง ' + thDate(s.ts, true) + (s.n > 1 ? ' (ครั้งที่ ' + s.n + ')' : '') +
      (s.lateMin > 0 ? ' <span class="chip warn">ช้า ' + spanText(s.lateMin) + '</span>' : ' <span class="chip ok">ทันเวลา</span>') +
      (s.resent ? ' <span class="chip brand">ส่งใหม่หลังตรวจ</span>' : '') +
      (marked ? ' <span class="chip brand">' + (qj ? 'เขียนตรวจแล้ว · กำลังส่ง' : 'เขียนตรวจแล้ว') + '</span> <button class="linkb" data-vorig>' + (orig ? 'ดูฉบับที่เขียนตรวจ' : 'ดูต้นฉบับ') + '</button>' : '') + '</div>';
    const vo = $('[data-vorig]', root);
    if (vo) vo.addEventListener('click', () => { orig = !orig; show(); });
    $('[data-vprev]', root).disabled = i === 0;
    $('[data-vnext]', root).disabled = i === order.length - 1;
    score.value = s.graded ? s.raw : '';
    cm.value = s.comment || '';
    paintPen();
    const body = $('[data-vbody]', root);
    body.innerHTML = (s.note ? '<div class="notice info" style="max-width:900px;width:100%"><b>ข้อความจากนักเรียน:</b> ' + esc(s.note) + '</div>' : '') +
      (qj ? obUrls(qj).map((u, k) => '<img alt="หน้า ' + (k + 1) + '" src="' + u + '">').join('') : '') +
      files.map((f, k) => '<div data-slot="' + k + '" class="empty" style="width:100%;max-width:900px">กำลังโหลดหน้า ' + (k + 1) + '…</div>').join('');
    body.scrollTop = 0;
    const mySid = r.sid;
    for (let k = 0; k < files.length; k++) {
      try {
        const f = await fileUrl(files[k].id);
        if (!VIEW || VIEW.sid !== mySid) return;           /* ครูกดไปคนอื่นแล้ว */
        const slot = $('[data-slot="' + k + '"]', body);
        if (!slot) return;
        slot.outerHTML = f.mime === 'application/pdf'
          ? '<div style="width:100%;max-width:900px;text-align:center"><iframe src="' + f.url + '" title="PDF"></iframe><div><a href="' + f.url + '" target="_blank" rel="noopener">เปิด PDF ในแท็บใหม่</a></div></div>'
          : '<img alt="หน้า ' + (k + 1) + '" src="' + f.url + '">';
      } catch (e) {
        if (e.auth) { close(); return fail(e); }
        const slot = $('[data-slot="' + k + '"]', body);
        if (slot) slot.innerHTML = '<span style="color:var(--bad)">เปิดหน้า ' + (k + 1) + ' ไม่ได้: ' + esc(e.message) + '</span>';
      }
    }
    /* โหลดคนถัดไปรอไว้ ครูกดถัดไปแล้วจะขึ้นทันที */
    const nx = order[i + 1];
    if (nx) nx.sub.files.forEach(f => fileUrl(f.id).catch(() => {}));
  };
  const go = d => { const j = i + d; if (j < 0 || j >= order.length) return; i = j; show(); if (window.innerWidth > 700) score.focus(); };
  /* บันทึกเข้าคิวส่งเบื้องหลัง แล้วไปคนถัดไปทันที ไม่รอชีต */
  const saveNext = () => {
    const r = order[i], s = r.sub, v = score.value.trim();
    if (v === '' && !s.graded) { toast('ใส่คะแนนก่อน'); score.focus(); return; }
    if (v !== '' && (isNaN(Number(v)) || Number(v) < 0 || Number(v) > Number(w.max))) { toast('คะแนนต้องอยู่ระหว่าง 0 ถึง ' + fmtN(w.max)); score.focus(); return; }
    const ch = {};
    if (v !== (s.graded ? String(s.raw) : '')) ch.raw = v === '' ? '' : Number(v);
    if (cm.value !== (s.comment || '')) ch.comment = cm.value;
    if (ch.raw != null || ch.comment != null) { queueSave(w, r, ch); toast('บันทึก ' + r.name + ' แล้ว — ส่งเบื้องหลัง', 1200); }
    /* ไปคนถัดไปที่ยังไม่ได้ตรวจ ถ้าไม่มีแล้วก็คนถัดไปตามลำดับ */
    let j = order.findIndex((x, k) => k > i && needsGrade(x));
    if (j < 0) j = i + 1;
    if (j >= order.length) { toast('ตรวจถึงคนสุดท้ายแล้ว'); close(); return; }
    i = j; show();
    if (window.innerWidth > 700) score.focus();
  };
  function onKey(e) {
    if (INK) return;                   /* หน้าต่างเขียนตรวจเปิดทับอยู่ */
    if (e.key === 'Escape') { close(); return; }
    if (e.target === cm || e.target === score) { if (e.key === 'Enter') { e.preventDefault(); saveNext(); } return; }
    if (e.key === 'ArrowRight') go(1);

  score.addEventListener('input', paintPen);
  $('[data-vclose]', root).addEventListener('click', close);
  $('[data-vprev]', root).addEventListener('click', () => go(-1));
  $('[data-vnext]', root).addEventListener('click', () => go(1));
  $('[data-vfull]', root).addEventListener('click', () => { score.value = w.max; paintPen(); });
  $('[data-vsave]', root).addEventListener('click', saveNext);
  $('[data-vink]', root).addEventListener('click', () => {
    openInk({ order: order, i: i, w: w, onClose: j => { i = j; orig = false; VIEW = null; show(); } });
  });
  $('[data-vzoom]', root).addEventListener('click', e => {
    const b = $('[data-vbody]', root);
    b.classList.toggle('zoom');
    e.currentTarget.textContent = b.classList.contains('zoom') ? 'พอดีจอ' : 'ขยาย';
  });
  show();
  if (window.innerWidth > 700) score.focus();
}

let PDFJS = null;

    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_URL + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
    s.onerror = () => { PDFJS = null; no(new Error('โหลดตัวเปิด PDF ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')); };

function loadImg(src) {

const canvasBlob = (cv, type, q) => new Promise(ok => cv.toBlob(ok, type, q));

/** แหล่งหน้า → หน้าที่เขียนได้ [{ url, own, img, W, H }]
    src.files = ไฟล์บนชีต (รูปหรือ PDF) · src.blobs = รูปที่เขียนแล้วแต่ยังรอส่งในคิว */
async function inkLoadPages(src, say) {
  const pages = [], files = src.files || [];
  const page = async (url, own) => {
    const im = await loadImg(url);
    const k = Math.min(1, INK_SIDE / Math.max(im.naturalWidth, im.naturalHeight));
    pages.push({ url: url, own: own, img: im, W: Math.round(im.naturalWidth * k), H: Math.round(im.naturalHeight * k) });
  };
  for (const bl of src.blobs || []) await page(URL.createObjectURL(bl), true);
  for (let i = 0; i < files.length && pages.length < INK_PAGE_MAX; i++) {
    say('กำลังเปิดไฟล์ ' + (i + 1) + ' จาก ' + files.length + '…');
    const f = await fileUrl(files[i].id);
    if (f.mime === 'application/pdf') {
      const lib = await loadPdfJs();
      const doc = await lib.getDocument({ data: new Uint8Array(await (await fetch(f.url)).arrayBuffer()) }).promise;
      for (let n = 1; n <= doc.numPages && pages.length < INK_PAGE_MAX; n++) {
        say('กำลังแปลง PDF หน้า ' + n + ' จาก ' + doc.numPages + '…');
        const pg = await doc.getPage(n);
        const vp = pg.getViewport({ scale: Math.min(3, 1400 / pg.getViewport({ scale: 1 }).width) });
        const cv = document.createElement('canvas');
        cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
        await pg.render({ canvasContext: cx, viewport: vp }).promise;
        const blob = await canvasBlob(cv, 'image/jpeg', 0.9);
        cv.width = cv.height = 0;
        await page(URL.createObjectURL(blob), true);
      }
      if (doc.destroy) doc.destroy();
    } else if (/^image\//.test(f.mime)) {
      await page(f.url, false);
    }
  }
  return pages;
}

function drawStroke(c, s) {
  const P = s.pts, n = P.length;
  if (!n) return;
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = c.fillStyle = s.color;
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (s.tool === 'hl') {
    /* ปากกาเน้นข้อความวาดเป็นเส้นเดียว สีจึงไม่ทับกันเข้มขึ้นตรงที่เส้นวกกลับ */
    c.globalAlpha = 0.33; c.lineWidth = s.size; c.lineCap = 'butt';
    c.beginPath(); c.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < n - 1; i++) { const m = mid(P[i], P[i + 1]); c.quadraticCurveTo(P[i][0], P[i][1], m[0], m[1]); }
    c.lineTo(P[n - 1][0], P[n - 1][1]);
    if (n === 1) c.lineTo(P[0][0] + 0.1, P[0][1]);
    c.stroke();
  } else {
    const wOf = p => s.pr ? s.size * (0.35 + 1.15 * Math.min(1, Math.max(0.05, p[2] || 0.5))) : s.size;
    if (n === 1) { c.beginPath(); c.arc(P[0][0], P[0][1], wOf(P[0]) / 2, 0, Math.PI * 2); c.fill(); }
    let from = P[0];
    for (let i = 1; i < n; i++) {
      const to = i < n - 1 ? mid(P[i], P[i + 1]) : P[i];
      c.lineWidth = wOf(P[i]);
      c.beginPath(); c.moveTo(from[0], from[1]); c.quadraticCurveTo(P[i][0], P[i][1], to[0], to[1]); c.stroke();
      from = to;
    }
  }
  c.restore();
}
function inkCanvas(p) {
  if (!p.ink) {
    p.ink = document.createElement('canvas');
    p.ink.className = 'inkc';
    p.ink.width = p.W; p.ink.height = p.H;

function segDist(q, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
  const t = L ? Math.max(0, Math.min(1, ((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / L)) : 0;
  return Math.hypot(q[0] - a[0] - t * dx, q[1] - a[1] - t * dy);
}
function strokeHit(s, q, R) {
  const r = R + s.size / 2, P = s.pts;
  if (P.length === 1) return Math.hypot(q[0] - P[0][0], q[1] - P[0][1]) < r;
  for (let i = 1; i < P.length; i++) if (segDist(q, P[i - 1], P[i]) < r) return true;
  return false;
}

  const cv = document.createElement('canvas'), c = cv.getContext('2d');
  const F = '700 64px Anuphan, "Leelawadee UI", Tahoma, sans-serif';
  c.font = F;
  if (kind === 'ok' || kind === 'no') {
    cv.width = cv.height = 160;
    c.strokeStyle = color; c.lineWidth = 20; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    if (kind === 'ok') { c.moveTo(22, 86); c.lineTo(64, 128); c.lineTo(140, 30); }
    else { c.moveTo(30, 30); c.lineTo(130, 130); c.moveTo(130, 30); c.lineTo(30, 130); }
    c.stroke();
  } else {
    const lines = String(text).split('\n').map(x => x.trim()).filter(Boolean).slice(0, 8);
    const pad = kind === 'score' ? 26 : 8, lh = 80;
    cv.width = Math.ceil(Math.max.apply(null, lines.map(l => c.measureText(l).width)) + pad * 2);
    cv.height = lines.length * lh + (kind === 'score' ? 28 : 10);
    c.font = F; c.fillStyle = color; c.textBaseline = 'middle';
    if (kind === 'score') {
      c.strokeStyle = color; c.lineWidth = 7;

      c.beginPath(); c.moveTo(4 + r, 4); c.arcTo(4 + W, 4, 4 + W, 4 + H, r); c.arcTo(4 + W, 4 + H, 4, 4 + H, r);
      c.arcTo(4, 4 + H, 4, 4, r); c.arcTo(4, 4, 4 + W, 4, r); c.closePath(); c.stroke();
      c.textAlign = 'center';
      lines.forEach((l, i) => c.fillText(l, cv.width / 2, 14 + lh / 2 + i * lh));
    } else {
      lines.forEach((l, i) => c.fillText(l, pad, 5 + lh / 2 + i * lh));

/** ลายเซ็น + วันที่ตรวจใต้ลายเซ็น (ถ้าเปิดไว้) */

    const p = popup('<h2 style="padding-right:56px">ลายเซ็นของครู</h2>' +
      '<div class="muted small">เซ็นในกรอบด้วยนิ้ว ปากกา หรือเมาส์ — บันทึกไว้ในชีต ใช้ได้ทุกเครื่องที่ลงชื่อด้วยบัญชีนี้</div>' +
      '<canvas class="signpad" width="900" height="320" data-pad></canvas>' +
      '<div class="row" style="margin-top:8px"><button class="sm" data-clr>ล้าง</button>' +

      '<label class="small row" style="gap:6px"><input type="checkbox" data-date style="width:auto;min-height:0"' + (withDate ? ' checked' : '') + '> ใส่วันที่ตรวจใต้ลายเซ็น</label></div>' +
      '<div class="row" style="margin-top:14px">' + (SIGN ? '<button class="danger sm" data-del>ลบลายเซ็นที่บันทึกไว้</button>' : '') +
      '<span class="sp"></span><button data-no>ยกเลิก</button><button class="primary" data-yes>บันทึกลายเซ็น</button></div>',
      () => resolve(saved));
    const cv = $('[data-pad]', p.root), c = cv.getContext('2d');
    let blank = true, cur = null;
    if (SIGN) loadImg(SIGN).then(im => {
      const k = Math.min(1, (cv.width - 40) / im.naturalWidth, (cv.height - 40) / im.naturalHeight);
      c.drawImage(im, (cv.width - im.naturalWidth * k) / 2, (cv.height - im.naturalHeight * k) / 2, im.naturalWidth * k, im.naturalHeight * k);
      blank = false;
    }).catch(() => {});
    const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height, e.pressure]; };
    cv.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      cur = { tool: 'pen', color: '#10141b', size: 5.5, pr: e.pointerType === 'pen', pts: [pt(e)] };
      blank = false;
    });
    cv.addEventListener('pointermove', e => {
      if (!cur) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      (evs.length ? evs : [e]).forEach(ev => cur.pts.push(pt(ev)));
      const n = cur.pts.length;
      drawStroke(c, Object.assign({}, cur, { pts: cur.pts.slice(Math.max(0, n - 4)) }));

    $('[data-file]', p.root).addEventListener('change', async e => {
      const f = e.target.files && e.target.files[0];

        c.clearRect(0, 0, cv.width, cv.height);
        c.drawImage(im, (cv.width - im.naturalWidth * k) / 2, (cv.height - im.naturalHeight * k) / 2, im.naturalWidth * k, im.naturalHeight * k);
        /* ตัดพื้นกระดาษออก — จุดที่สว่างกลายเป็นโปร่งใส ที่เหลือเข้มขึ้นให้คมเหมือนหมึก */
        const d = c.getImageData(0, 0, cv.width, cv.height), a = d.data;
        for (let i = 0; i < a.length; i += 4) {
          const L = 0.3 * a[i] + 0.59 * a[i + 1] + 0.11 * a[i + 2];
          if (L > 175) a[i + 3] = 0;
          else { a[i + 3] = Math.min(255, Math.round((175 - L) * 2.6)); a[i] = a[i] * 0.5; a[i + 1] = a[i + 1] * 0.5; a[i + 2] = a[i + 2] * 0.6; }
        }

    });
    $('[data-yes]', p.root).addEventListener('click', async e => {
      lsSet('wd.signDate', $('[data-date]', p.root).checked ? '1' : '0');

      const d = c.getImageData(0, 0, cv.width, cv.height).data;
      let x0 = cv.width, y0 = cv.height, x1 = -1, y1 = -1;
      for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++) {
        if (d[(y * cv.width + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      if (blank || x1 < 0) { toast('ยังไม่ได้เซ็น'); return; }
      const pad = 8, out = document.createElement('canvas');
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(cv.width - 1, x1 + pad); y1 = Math.min(cv.height - 1, y1 + pad);
      out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
      out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
      const url = out.toDataURL('image/png');
      const b = e.currentTarget;
      b.disabled = true; b.textContent = 'กำลังบันทึก…';
      try {
        await api('workSignSet', { mime: 'image/png', data: url.split(',')[1] });
        SIGN = url; saved = true; p.close();
      } catch (err) { b.disabled = false; b.textContent = 'บันทึกลายเซ็น'; toast(err.message, 4000); }
    });
  });
}

/* ---- คิวส่งเบื้องหลัง (ตรวจต่อเนื่อง · ชีตรุ่น 25) ---------------------------
   ครูกดบันทึกแล้วไปคนถัดไปได้ทันที งานเข้าคิวในเครื่อง (IndexedDB) แล้วทยอยส่งเบื้องหลังพร้อมกันสองคน
     · ปิดหน้า เน็ตหลุด หรือหมดเวลาเข้าใช้ งานยังอยู่ในเครื่อง เปิดหน้าส่งงานอีกครั้งจะส่งต่อให้เอง
     · คนเดียวกันกดบันทึกซ้ำก่อนส่งถึง = รวมเป็นงานเดียว ส่งครั้งเดียวด้วยของล่าสุด
     · ส่งไม่ผ่านลองใหม่เอง 3 ครั้ง (3 · 8 · 20 วินาที) แล้วขึ้นปุ่มให้ครูกดส่งใหม่
     · งานในคิวผูกกับบัญชีที่บันทึก ครูอีกคนลงชื่อเครื่องเดียวกันจะไม่ส่งงานของคนก่อนด้วยบัญชีตัวเอง
     · ชีตรุ่น 24 ยังใช้ได้ (ส่งทีละหน้าแบบเดิม) เจอครั้งแรกแล้วจำไว้ไม่ถามซ้ำ
   job: { id, code, sid, name, acct, pages: Blob[] | null, raw: '' | ตัวเลข | null, comment: ข้อความ | null }
        null = ไม่แตะส่วนนั้น · raw '' = ลบคะแนน */
const OB = { jobs: [], busy: new Set(), legacy: false, db: undefined, timer: 0, halt: '', doneAt: 0 };
const OB_PAR = 2;
const obKey = j => j.code + '|' + j.sid;
const obAcct = () => { const p = (ME.s && ME.s.profile) || {}; return String(p.user || p.name || '') + (p.sub ? '|sub' : '|main'); };
const obMine = j => j.acct === obAcct();
function obDb() {
  if (OB.db !== undefined) return Promise.resolve(OB.db);
  return new Promise(ok => {
    try {
      const rq = indexedDB.open('workdesk', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('outbox', { keyPath: 'id' });
      rq.onsuccess = () => { OB.db = rq.result; ok(OB.db); };
      rq.onerror = rq.onblocked = () => { OB.db = null; ok(null); };
    } catch (e) { OB.db = null; ok(null); }
  });
}
async function obStore(j, del) {
  const db = await obDb();
  if (!db) return;
  try {
    const os = db.transaction('outbox', 'readwrite').objectStore('outbox');
    if (del) os.delete(j.id);
    else os.put({ id: j.id, code: j.code, sid: j.sid, name: j.name, acct: j.acct, pages: j.pages, raw: j.raw, comment: j.comment, ts: j.ts });
  } catch (e) {}
}
async function obRestore() {
  const db = await obDb();
  if (!db) return;
  const all = await new Promise(ok => {
    try { const rq = db.transaction('outbox').objectStore('outbox').getAll(); rq.onsuccess = () => ok(rq.result || []); rq.onerror = () => ok([]); }
    catch (e) { ok([]); }
  });
  all.sort((a, b) => a.ts - b.ts).forEach(j => {
    if (!OB.jobs.some(x => x.id === j.id)) OB.jobs.push(Object.assign(j, { state: 'wait', tries: 0, nextAt: 0, err: '' }));
  });
  obPaint(); obKick();
}
/** งานล่าสุดในคิวที่มีหน้าที่เขียนตรวจของนักเรียนคนนี้ (ยังไม่ถึงชีต) */
function obPagesOf(code, sid) {
  for (let i = OB.jobs.length - 1; i >= 0; i--) { const j = OB.jobs[i]; if (j.code === code && j.sid === sid && j.pages) return j; }
  return null;
}
function obUrls(j) { if (!j._urls) j._urls = j.pages.map(b => URL.createObjectURL(b)); return j._urls; }
function obAdd(w, r, ch) {
  let j = OB.jobs.find(x => x.code === w.code && x.sid === r.sid && x.state !== 'send');
  if (!j) {
    j = { id: w.code + '|' + r.sid + '|' + Date.now(), code: w.code, sid: r.sid, name: r.name, acct: obAcct(), pages: null, raw: null, comment: null };
    OB.jobs.push(j);
  }
  if (ch.pages) { if (j._urls) j._urls.forEach(u => URL.revokeObjectURL(u)); j._urls = null; j.pages = ch.pages; }
  if (ch.raw != null) j.raw = ch.raw;
  if (ch.comment != null) j.comment = ch.comment;
  Object.assign(j, { ts: Date.now(), state: 'wait', tries: 0, nextAt: 0, err: '' });
  obStore(j); obPaint(); obKick();
}
function obKick() {
  clearTimeout(OB.timer);
  if (OB.halt) return;
  const now = Date.now();
  let wake = Infinity;
  for (const j of OB.jobs) {
    if (OB.busy.size >= OB_PAR) break;
    if (j.state !== 'wait' || !obMine(j) || OB.busy.has(obKey(j))) continue;
    if (j.nextAt > now) { wake = Math.min(wake, j.nextAt); continue; }
    obRun(j);
  }
  if (wake < Infinity) OB.timer = setTimeout(obKick, wake - now + 50);
}
async function obRun(j) {
  const key = obKey(j);
  OB.busy.add(key); j.state = 'send'; obPaint();
  try {
    const res = await obSend(j);
    OB.jobs.splice(OB.jobs.indexOf(j), 1);
    obStore(j, true);
    if (j._urls) j._urls.forEach(u => URL.revokeObjectURL(u));
    if (!OB.jobs.some(x => obMine(x))) OB.doneAt = Date.now();
    obDone(j, res && res.sub);
  } catch (e) {
    j.tries++; j.err = e.message || String(e);
    if (e.auth) {
      j.state = 'wait'; OB.halt = j.err;
      toast('การเข้าใช้หมดอายุ — งานที่ตรวจแล้วเก็บไว้ในเครื่อง ลงชื่อใหม่ที่หน้าหลักแล้วเปิดหน้านี้อีกครั้ง ระบบจะส่งต่อให้เอง', 7000);
    } else if (e.old || j.tries >= 4 || /ไม่อยู่ในชั้น|ไม่พบงาน|คะแนนต้อง|ยังไม่ได้ส่ง/.test(j.err)) {
      j.state = 'err';                                  /* ส่งซ้ำก็ไม่ผ่าน รอครูดู */
    } else {
      j.state = 'wait'; j.nextAt = Date.now() + [3, 8, 20][j.tries - 1] * 1000;
    }
  } finally {
    OB.busy.delete(key); obPaint(); obKick();
  }
}
async function obSend(j) {
  const data = j.pages ? await Promise.all(j.pages.map(blobToBase64)) : null;
  if (!OB.legacy) {
    try {
      const p = { code: j.code, sid: j.sid };
      if (data) p.pages = data.map(d => ({ mime: 'image/jpeg', data: d }));
      if (j.raw != null) p.raw = j.raw;
      if (j.comment != null) p.comment = j.comment;
      return await api('workMarkSave', p, 240000);
    } catch (e) { if (!e.old) throw e; OB.legacy = true; }
  }
  /* ชีตรุ่น 24 — อัปโหลดทีละหน้า ยืนยันชุด แล้วให้คะแนนแยก */
  let out = null;
  if (data) {
    const ids = [];
    for (const d of data) ids.push((await api('workMarkUp', { code: j.code, sid: j.sid, mime: 'image/jpeg', data: d }, 120000)).id);
    out = await api('workMark', { code: j.code, sid: j.sid, ids: ids }, 60000);
  }
  if (j.raw != null || j.comment != null) {
    let raw = j.raw;
    if (raw == null) {
      const s = (out && out.sub) || obRow(j) && obRow(j).sub;
      raw = s && s.graded ? s.raw : '';
    }
    const it = { sid: j.sid, raw: raw };
    if (j.comment != null) it.comment = j.comment;
    const g = await api('workGrade', { code: j.code, items: [it] });
    out = { sub: g.rows[0] && g.rows[0].sub };
  }
  return out;
}
const obRow = j => T.subs && T.subs.work.code === j.code ? T.subs.rows.find(r => r.sid === j.sid) : null;
/** ชีตตอบกลับแล้ว — เอาของจริงใส่แถว (ถ้ายังมีงานของคนนี้รอในคิว เก็บค่าที่ครูเพิ่งแก้ไว้ก่อน) */
function obDone(j, sub) {
  const row = obRow(j);
  if (!row || !sub) return;
  if (OB.jobs.some(x => obKey(x) === obKey(j))) {
    row.sub = Object.assign({}, row.sub, { marked: sub.marked, markedAt: sub.markedAt, gradedAt: sub.gradedAt });
  } else {
    row.sub = sub;
  }
  applyGraded([{ sid: row.sid, sub: row.sub }]);
}
/** ใส่ผลลงแถวทันที (ยังไม่รอชีต) ตารางและตัวนับรอตรวจจะได้ขยับตาม */
function queueSave(w, r, ch) {
  const s = Object.assign({}, r.sub || { files: [], lateMin: 0, marked: [] });
  if (ch.raw != null) {
    s.graded = ch.raw !== ''; s.raw = ch.raw;
    s.score = ch.raw === '' ? '' : finalOf(w, ch.raw, s.files && s.files.length ? s.lateMin : 0);
    s.gradedAt = new Date().toISOString(); s.resent = false;
  }
  if (ch.comment != null) s.comment = ch.comment;
  r.sub = s;
  applyGraded([{ sid: r.sid, sub: s }]);
  obAdd(w, r, ch);
}
function obPaint() {
  const el = $('#obfloat');
  if (!el) return;
  const mine = OB.jobs.filter(obMine);
  const bad = mine.filter(j => j.state === 'err'), n = mine.length - bad.length;
  let h = '';
  if (OB.halt && n) h += '<span class="obx bad">รอส่ง ' + n + ' คน · ลงชื่อใหม่ก่อน</span>';
  else if (n) h += '<span class="obx"><i class="spin"></i>กำลังส่ง ' + n + ' คน</span>';
  if (bad.length) h += '<button class="obx bad" data-obretry title="' + esc(bad.map(j => j.name + ': ' + j.err).join('\n')) + '">ส่งไม่ผ่าน ' + bad.length + ' คน · ลองใหม่</button>';
  if (!mine.length && Date.now() - OB.doneAt < 2500) { h = '<span class="obx ok">ส่งครบแล้ว ✓</span>'; setTimeout(obPaint, 2600); }
  el.innerHTML = h;
  const b = $('[data-obretry]', el);
  if (b) b.addEventListener('click', () => {
    const why = bad[0] && bad[0].err;
    bad.forEach(j => { j.state = 'wait'; j.tries = 0; j.nextAt = 0; });
    if (why) toast('ส่งใหม่ — ครั้งก่อน: ' + why, 4000);
    obPaint(); obKick();
  });
}
window.addEventListener('online', () => obKick());
window.addEventListener('beforeunload', e => {
  if (OB.jobs.some(j => obMine(j) && j.state !== 'err') && !OB.db) { e.preventDefault(); e.returnValue = ''; }
});

/* ---- หน้าต่างเขียนตรวจ: ตรวจต่อเนื่องทีละคน ----
   ใส่คะแนน ความเห็น แล้วกด "บันทึก · คนถัดไป" — งานเข้าคิวส่งเบื้องหลัง หน้าถัดไปขึ้นทันที
   ระหว่างตรวจคนนี้ ระบบโหลดและแปลงงานของอีกสองคนถัดไปรอไว้
   ctx: { order: นักเรียนที่ส่งไฟล์ เรียงตามตัวดูงาน, i, w, onClose(i) } */
/* แหล่งหน้าของนักเรียนหนึ่งคน: ที่เขียนแล้วแต่ยังรอส่งในคิว > ฉบับที่เขียนตรวจบนชีต > ต้นฉบับ */
function inkSource(w, r, orig) {
  const j = !orig && obPagesOf(w.code, r.sid);
  if (j) return { kind: 'queued', key: 'q' + j.id + '|' + j.ts, blobs: j.pages };
  const s = r.sub;
  if (!orig && s.marked && s.marked.length) return { kind: 'marked', key: 'm' + s.marked.map(f => f.id).join(','), files: s.marked };
  return { kind: 'orig', key: 'o' + s.files.map(f => f.id).join(','), files: s.files };
}
const PREP = new Map();
function prepPages(src, say) {
  if (!PREP.has(src.key)) {
    const pr = inkLoadPages(src, say || (() => {}));
    pr.catch(() => PREP.delete(src.key));
    PREP.set(src.key, pr);
  }
  return PREP.get(src.key);
}
function prepDrop(keep) {
  for (const [k, pr] of Array.from(PREP)) {
    if (keep && keep.has(k)) continue;
    PREP.delete(k);
    pr.then(list => list.forEach(p => { if (p.own) URL.revokeObjectURL(p.url); })).catch(() => {});
  }
}
const INK_OUT_SIDE = 1600;          /* ด้านยาวของหน้าที่ส่งให้นักเรียน — ลายมือยังคม ไฟล์เล็กส่งเร็ว */

  const box = document.createElement('div');
  box.className = 'ink';

    '<div class="inktop"><button class="sm" data-ik="close">ปิด</button>' +

      '<div class="grp">' + tool('pen', 'ปากกา') + tool('hl', 'ปากกาเน้นข้อความ') + tool('er', 'ยางลบ (ลบทีละเส้น)') + tool('text', 'ข้อความ — แตะตรงที่จะใส่') + tool('move', 'ย้าย/ย่อขยายของที่แปะ') + '</div>' +
      '<div class="grp" data-colors>' + INK_COLORS.map(c => '<button class="sw" data-color="' + c[0] + '" title="' + c[1] + '" aria-label="สี' + c[1] + '"><i style="background:' + c[0] + '"></i></button>').join('') + '</div>' +
      '<div class="grp" data-sizes>' + [0, 1, 2].map(i => '<button class="sz" data-size="' + i + '" aria-label="ขนาด ' + (i + 1) + '"><i style="width:' + (5 + i * 5) + 'px;height:' + (5 + i * 5) + 'px"></i></button>').join('') + '</div>' +
      '<div class="grp"><button class="tb" data-ik="undo" title="ย้อนกลับ (Ctrl+Z)" aria-label="ย้อนกลับ">' + inkIcon('undo') + '</button>' +

  document.body.appendChild(box);

  const nextAfter = i => { const j = order.findIndex((x, k) => k > i && needsGrade(x)); return j < 0 ? i + 1 : j; };

  B.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' && st.touches.has(e.pointerId)) {

        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        setZoom(st.pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / st.pinch.d, mx, my);
        B.scrollLeft -= mx - st.pinch.mx; B.scrollTop -= my - st.pinch.my;
        st.pinch.mx = mx; st.pinch.my = my;
        return;
      }
    }
    const c = st.cur;
    if (!c || c.id !== e.pointerId) return;
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    const evs = list.length ? list : [e];
    if (c.er) { evs.forEach(ev => erase(c.p, ptOf(c.p, ev))); return; }
    evs.forEach(ev => {
      const q = ptOf(c.p, ev), L = c.s.pts[c.s.pts.length - 1];
      if (Math.hypot(q[0] - L[0], q[1] - L[1]) > 0.7) c.s.pts.push(q);
    });
    liveDraw();
  });
  const up = (e, cancel) => {
    if (e.pointerType === 'touch') {
      st.touches.delete(e.pointerId);
      if (st.touches.size < 2) st.pinch = null;
    }
    const c = st.cur;
    if (!c || c.id !== e.pointerId) return;
    st.cur = null;
    if (c.er) { if (c.er.length) pushOp({ t: 'er', p: c.p, list: c.er }); return; }
    dropLive();
    if (cancel && c.s.pts.length < 3) return;
    c.p.strokes.push(c.s);
    drawStroke(inkCanvas(c.p).getContext('2d'), c.s);
    pushOp({ t: 'st', p: c.p, s: c.s });
  };
  B.addEventListener('pointerup', e => up(e, false));
  B.addEventListener('pointercancel', e => up(e, true));
  B.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    setZoom(st.zoom * Math.exp(-e.deltaY / 300), e.clientX, e.clientY);
  }, { passive: false });

  /* ---- ย้อนกลับ / ทำซ้ำ ---- */
  const apply = (op, back) => {
    const p = op.p;
    if (op.t === 'st') { if (back) p.strokes.splice(p.strokes.indexOf(op.s), 1); else p.strokes.push(op.s); inkRedraw(p); }
    else if (op.t === 'er') { if (back) op.list.forEach(x => p.strokes.push(x)); else op.list.forEach(x => { const i = p.strokes.indexOf(x); if (i >= 0) p.strokes.splice(i, 1); }); inkRedraw(p); }
    else if ((op.t === 'it') === back) { p.items.splice(p.items.indexOf(op.it), 1); op.it.el.remove(); }
    else { p.items.push(op.it); itemEl(p, op.it); }
  };
  const undo = () => { cancelStroke(); const op = st.undo.pop(); if (!op) return; apply(op, true); st.redo.push(op); st.dirty = true; paintTools(); };
  const redo = () => { const op = st.redo.pop(); if (!op) return; apply(op, false); st.undo.push(op); st.dirty = true; paintTools(); };

  /* ---- แปะของ ---- */
  const visiblePage = () => {
    const b = B.getBoundingClientRect(), cy = b.top + b.height / 2;
    let best = null, bd = Infinity;
    st.pages.forEach(p => {
      const q = p.el.getBoundingClientRect();
      const d = cy < q.top ? q.top - cy : cy > q.bottom ? cy - q.bottom : 0;
      if (d < bd) { bd = d; best = p; }
    });
    return best;
  };
  /* frac = ความกว้างเทียบหน้า (0 = ขนาดตามตัวอักษร) · cx, cy = จุดกึ่งกลาง (ไม่ใส่ = กลางส่วนที่เห็นของหน้า) */
  const addItem = (p, img, frac, cx, cy) => {
    if (!p) return;
    const w0 = frac ? p.W * frac : img.w * (26 * p.W / 1000) / 64;
    const h0 = w0 * img.h / img.w;
    if (cx == null) {
      const q = p.el.getBoundingClientRect(), b = B.getBoundingClientRect();
      const sy = (Math.max(q.top, b.top) + Math.min(q.bottom, b.bottom)) / 2, sx = (Math.max(q.left, b.left) + Math.min(q.right, b.right)) / 2;
      cx = (sx - q.left) / q.width * p.W; cy = (sy - q.top) / q.height * p.H;
    } else {
      cx += w0 / 2 - 4 * p.W / 1000;                  /* ข้อความเริ่มตรงจุดที่แตะ */
    }
    const it = { src: img.src, x: cx - w0 / 2, y: cy - h0 / 2, w: w0, h: h0 };
    p.items.push(it);
    itemEl(p, it);
    pushOp({ t: 'it', p: p, it: it });
  };
  $$('[data-stamp]', box).forEach(b => b.addEventListener('click', async () => {
    if (!st.pages.length) return;
    await inkFont();
    const k = b.dataset.stamp, col = st.color.pen;
    let img;
    if (k === 'score') {
      if (sc.value === '') { toast('ใส่คะแนนที่ช่องด้านล่างก่อน แล้วค่อยแปะ', 3000); sc.focus(); return; }
      img = stampImg('score', col, fmtN(sc.value) + '/' + fmtN(w.max));
    } else if (k === 'good') img = stampImg('text', col, 'ดีมาก');
    else img = stampImg(k, k === 'ok' ? '#11875d' : '#d7263d');
    addItem(visiblePage(), img, k === 'ok' || k === 'no' ? 0.09 : k === 'score' ? 0.2 : 0.16);
    setTool('move');
    toast('ลากเพื่อย้าย · ลากมุมขวาล่างเพื่อย่อขยาย · เลือกปากกาเพื่อเขียนต่อ', 2600);
  }));
  act('sign').addEventListener('click', async () => {
    if (!st.pages.length) return;
    try { await loadSign(); } catch (e) { if (e.auth) { shut(); return fail(e); } toast(e.message, 4000); return; }
    if (!SIGN && !(await signPad())) return;
    try {
      addItem(visiblePage(), await signImg(lsGet('wd.signDate') !== '0'), 0.26);
      setTool('move');
      toast('ลากลายเซ็นไปวางตรงที่ต้องการ', 2400);
    } catch (e) { toast(e.message, 4000); }
  });
  act('signset').addEventListener('click', async () => {
    try { await loadSign(); } catch (e) { if (e.auth) { shut(); return fail(e); } toast(e.message, 4000); return; }
    if (await signPad()) toast('บันทึกลายเซ็นแล้ว — กดปุ่มลายเซ็นเพื่อแปะ');
  });

  /* ---- ปุ่ม ---- */
  $$('[data-tool]', box).forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
  $$('[data-color]', box).forEach(b => b.addEventListener('click', () => {
    const k = st.tool === 'hl' ? 'hl' : 'pen';
    st.color[k] = b.dataset.color;
    if (k === 'pen') { st.color.text = b.dataset.color; lsSet('wd.inkPen', b.dataset.color); } else lsSet('wd.inkHl', b.dataset.color);
    if (st.tool === 'er' || st.tool === 'move') st.tool = 'pen';
    paintTools();
  }));
  $$('[data-size]', box).forEach(b => b.addEventListener('click', () => {
    const k = st.tool === 'hl' ? 'hl' : st.tool === 'er' ? 'er' : 'pen';
    st.size[k] = Number(b.dataset.size);
    if (k === 'pen') lsSet('wd.inkPenSize', b.dataset.size);
    paintTools();
  }));
  act('close').addEventListener('click', close);
  act('prev').addEventListener('click', () => go(st.i - 1));
  act('next').addEventListener('click', () => go(st.i + 1));
  act('savenext').addEventListener('click', saveNext);
  act('full').addEventListener('click', () => { sc.value = w.max; paintPen(); });
  sc.addEventListener('input', paintPen);
  act('undo').addEventListener('click', undo);
  act('redo').addEventListener('click', redo);
  act('zin').addEventListener('click', () => setZoom(st.zoom * 1.25));
  act('zout').addEventListener('click', () => setZoom(st.zoom / 1.25));
  act('zfit').addEventListener('click', () => setZoom(1));
  act('finger').addEventListener('click', () => {
    st.fingerDraw = !st.fingerDraw; paintTools();
    toast(st.fingerDraw ? 'นิ้วเขียนได้ · สองนิ้วซูมและเลื่อนหน้า' : 'นิ้วเลื่อนหน้า · เขียนด้วยปากกาหรือเมาส์', 2200);
  });
  function onKey(e) {
    if (document.querySelector('.overlay[style*="96"]')) return;      /* มีกล่องถามเปิดทับอยู่ */
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    e.stopPropagation();                                                /* ไม่ให้ตัวดูงานข้างใต้รับปุ่มไปด้วย */
    if (k === 'enter' && (mod || e.target === sc || e.target === cm)) { e.preventDefault(); saveNext(); return; }
    if (k === 'escape') { close(); return; }
    if (e.target.matches && e.target.matches('input,textarea')) return;
    if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    else if (mod && k === 's') { e.preventDefault(); commit(); }
    else if (!mod && k === 'p') setTool('pen');
    else if (!mod && k === 'h') setTool('hl');
    else if (!mod && k === 'e') setTool('er');
    else if (!mod && k === 'v') setTool('move');
    else if (!mod && k === 't') setTool('text');
    else if (!mod && k === 'pagedown') { e.preventDefault(); go(st.i + 1); }
    else if (!mod && k === 'pageup') { e.preventDefault(); go(st.i - 1); }
  }
  document.addEventListener('keydown', onKey, true);
  window.addEventListener('resize', onResize);
  paintTools();
  show(ctx.i);
}

/* ---- แจ้งเตือนนักเรียนของงานหนึ่ง ----------------------------------------------
   ครูเลือกกลุ่ม (ขาดส่ง · ส่งไม่ตรงกำหนด · ส่งตรงกำหนด) แก้ข้อความได้ แล้วกดส่ง
   นักเรียนเห็นข้อความบนสุดของหน้าส่งงานจนกว่าจะกดรับทราบ
   ชีตเลือกคนจากสถานะจริงตอนกดอีกรอบ รายชื่อที่ส่งไปจึงจำกัดให้แคบลงได้แต่เพิ่มคนนอกกลุ่มไม่ได้ */
const NOTIFY_KIND = {
  miss: { t: 'แจ้งคนที่ขาดส่ง', icon: '🔔', msg: w => 'ยังไม่ได้ส่งงาน “' + w.title + '” ซึ่งเลยกำหนดส่งแล้ว ระบบยังเปิดรับอยู่ ส่งได้ที่หน้าส่งงานออนไลน์ ' +
                              (w.mode === 'late' ? 'ยิ่งส่งเร็วยิ่งถูกหักคะแนนน้อย' : 'ส่งช้าไม่หักคะแนน รีบส่งนะ') },
  late: { t: 'แจ้งคนที่ส่งไม่ตรงกำหนด', icon: '⏰', msg: w => 'ครูได้รับงาน “' + w.title + '” แล้ว แต่ส่งช้ากว่ากำหนด งานต่อไปส่งให้ทันเวลานะ' },
  ontime: { t: 'ชมคนที่ส่งตรงกำหนด', icon: '🌟', msg: w => 'ส่งงาน “' + w.title + '” ตรงกำหนด เยี่ยมมาก รักษามาตรฐานนี้ไว้นะ' }
};
function notifyForm(w, kind, list) {
  const K = NOTIFY_KIND[kind];
  if (!list.length) return;
  const sh = openSheet('<h2 style="padding-right:56px">' + K.icon + ' ' + K.t + ' · ' + esc(w.title) + '</h2>' +
    '<div class="muted small">' + list.length + ' คน' + (T.gCls ? ' · เฉพาะ ' + esc(T.gCls) : '') + '</div>' +
    '<div class="detail small" style="margin-top:8px;max-height:150px;overflow:auto">' +
      list.map(r => esc(r.cls) + ' เลขที่ ' + esc(r.no) + ' ' + esc(r.name) +
        (kind === 'late' && r.sub ? ' (ช้า ' + spanText(r.sub.lateMin) + ')' : '')).join('\n') + '</div>' +
    '<label class="f">ข้อความถึงนักเรียน</label><textarea data-msg maxlength="500">' + esc(K.msg(w)) + '</textarea>' +
    '<p class="muted small">นักเรียนเห็นข้อความนี้บนสุดของหน้าส่งงานจนกว่าจะกด “รับทราบ”</p>' +
    '<div class="row"><button class="sm" data-cpy>คัดลอกรายชื่อ (ส่งต่อทาง LINE)</button><span class="sp"></span>' +
      '<button data-close>ยกเลิก</button><button class="primary" data-send>ส่งแจ้งเตือน ' + list.length + ' คน</button></div>');
  const root = sh.root;
  $('[data-cpy]', root).addEventListener('click', async () => {
    const text = K.icon + ' ' + w.title + ' — ' + K.t.replace('แจ้ง', '').replace('ชม', '') + '\n' +
      list.map(r => r.cls + ' เลขที่ ' + r.no + ' ' + r.name).join('\n');
    try { await navigator.clipboard.writeText(text); toast('คัดลอกรายชื่อแล้ว'); } catch (e) { toast('คัดลอกไม่สำเร็จ'); }
  });
  $('[data-send]', root).addEventListener('click', async e => {
    const btn = e.currentTarget, msg = $('[data-msg]', root).value.trim();
    if (!msg) return toast('ใส่ข้อความก่อน');
    btn.disabled = true;
    try {
      const r = await api('workNotify', { code: w.code, kind: kind, msg: msg, sids: list.map(x => x.sid) });
      sh.close();
      toast('ส่งแจ้งเตือนแล้ว ' + r.sent + ' คน', 3200);
    } catch (err) { btn.disabled = false; fail(err); }
  });
}

/* ---- แท็บคะแนนรวมรายวิชา --------------------------------------------------------
   เลือกวิชา (หรือทุกวิชา) กับห้อง แล้วเห็นทุกคนทุกงานในตารางเดียว
   ช่องแสดงคะแนนถ้าตรวจแล้ว ไม่งั้นแสดงสถานะ · รวม = คะแนนที่ได้ ÷ คะแนนเต็มของทุกงานที่สั่งให้คนนั้น (ขาดส่งนับ 0) */
async function paneScores() {
  $('#pane').innerHTML = '<div class="empty">กำลังรวมคะแนน…</div>';
  /* ดึงทุกห้องมาทีเดียว แล้วกรองห้องฝั่งหน้าเว็บ — สลับห้องจะได้ไม่ต้องรอชีตทุกครั้ง */
  try { T.scores = await api('workScores', T.sSubj == null ? {} : { subject: T.sSubj }, 60000); }
  catch (e) { if (e.auth) return fail(e); $('#pane').innerHTML = '<div class="notice ' + (e.old ? 'warn' : 'bad') + '">' + esc(e.message) + '</div>'; return; }
  scoresBody();
}
const ST_CHIP = {
  ontime: '<span class="chip ok">ตรง</span>', late: '<span class="chip warn">ช้า</span>', paper: '<span class="chip">กระดาษ</span>',
  miss: '<span class="chip bad">ขาด</span>', todo: '<span class="chip">ยังไม่ถึง</span>'
};
function scoresTotals(r, works) {
  let got = 0, full = 0, graded = 0;
  const c = { ontime: 0, late: 0, miss: 0 };
  works.forEach(w => {
    const x = r.cells[w.code];
    if (!x) return;
    if (c[x.st] != null) c[x.st]++;
    if (x.score !== '' && x.score != null) { got += Number(x.score); full += Number(w.max); graded++; }
    else if (x.st === 'miss') full += Number(w.max);
  });
  return { got: Math.round(got * 100) / 100, full: full, pct: full ? Math.round(got / full * 1000) / 10 : null, c: c, graded: graded };
}
function scoresBody() {
  const S = T.scores, works = S.works;
  if (T.sCls && S.classes.indexOf(T.sCls) < 0) T.sCls = '';
  const rows = T.sCls ? S.rows.filter(r => r.cls === T.sCls) : S.rows;
  let h = '<div class="panel"><div class="row">' +
    '<select data-ssubj style="width:auto;min-width:160px"><option value="*"' + (T.sSubj == null ? ' selected' : '') + '>ทุกวิชา</option>' +
      S.subjects.map(s => '<option value="' + esc(s) + '"' + (T.sSubj === s ? ' selected' : '') + '>' + esc(subjName(s)) + '</option>').join('') + '</select>' +
    '<select data-scls style="width:auto;min-width:120px">' + clsOptions(S.classes, T.sCls) + '</select>' +
    '<span class="sp"></span><button class="sm" data-scopy>คัดลอกไปวาง Excel</button><button class="sm" data-sreload>โหลดใหม่</button></div>' +
    '<div class="muted small" style="margin-top:6px">' + works.length + ' งาน · ' + rows.length + ' คน · ' +
    '<b>รวม</b> = คะแนนที่ได้ ÷ เต็มของงานที่ตรวจแล้วและงานที่ขาดส่ง (ขาดส่งนับ 0 · ส่งแล้วรอตรวจยังไม่นับ)</div></div>';
  if (!works.length) {
    h += '<div class="panel"><div class="empty">ยังไม่มีงานของวิชานี้</div></div>';
  } else {
    const avg = rows.map(r => scoresTotals(r, works).pct).filter(v => v != null);
    h += '<div class="panel" style="padding:0"><div class="tw" style="border:0;max-height:70vh"><table><thead><tr><th>เลขที่</th><th>ชื่อ</th>' +
      (T.sCls ? '' : '<th>ชั้น</th>') +
      works.map(w => '<th class="num" title="' + esc(w.title) + '">' + esc(w.title.length > 14 ? w.title.slice(0, 13) + '…' : w.title) +
        '<div class="small" style="font-weight:400">เต็ม ' + fmtN(w.max) + '</div></th>').join('') +
      '<th class="num">รวม</th><th class="num">%</th><th class="num">ตรง</th><th class="num">ช้า</th><th class="num">ขาด</th></tr></thead><tbody>' +
      rows.map(r => {
        const t = scoresTotals(r, works);
        return '<tr><td class="num">' + esc(r.no) + '</td><td class="nm">' + esc(r.name) + '</td>' + (T.sCls ? '' : '<td class="nw">' + esc(r.cls) + '</td>') +
          works.map(w => { const x = r.cells[w.code];
            if (!x) return '<td class="num muted">—</td>';
            if (x.score !== '' && x.score != null) return '<td class="num"><b>' + fmtN(x.score) + '</b>' + (x.st === 'late' ? ' <span class="chip warn">ช้า</span>' : '') + '</td>';
            return '<td class="num">' + (x.st === 'ontime' || x.st === 'late' ? '<span class="chip brand">รอตรวจ</span>' : ST_CHIP[x.st]) + '</td>'; }).join('') +
          '<td class="num"><b>' + fmtN(t.got) + '</b>/' + fmtN(t.full) + '</td>' +
          '<td class="num" style="color:' + (t.pct == null ? 'var(--muted)' : t.pct < 50 ? 'var(--bad)' : 'var(--ink)') + '">' + (t.pct == null ? '—' : t.pct) + '</td>' +
          '<td class="num">' + (t.c.ontime || '') + '</td><td class="num">' + (t.c.late || '') + '</td><td class="num" style="color:var(--bad)">' + (t.c.miss || '') + '</td></tr>';
      }).join('') +
      '<tr><td></td><td class="nm"><b>เฉลี่ยทั้งกลุ่ม</b></td>' + (T.sCls ? '' : '<td></td>') + works.map(w => {
        const v = rows.map(r => r.cells[w.code]).filter(x => x && x.score !== '' && x.score != null).map(x => Number(x.score));
        return '<td class="num small">' + (v.length ? fmtN(v.reduce((a, b) => a + b, 0) / v.length) : '—') + '</td>'; }).join('') +
      '<td></td><td class="num"><b>' + (avg.length ? fmtN(avg.reduce((a, b) => a + b, 0) / avg.length) : '—') + '</b></td><td colspan="3"></td></tr>' +
      '</tbody></table></div></div>';
  }
  $('#pane').innerHTML = h;
  $('[data-ssubj]').addEventListener('change', e => { T.sSubj = e.target.value === '*' ? null : e.target.value; paneScores(); });
  $('[data-scls]').addEventListener('change', e => { T.sCls = e.target.value; scoresBody(); });
  $('[data-sreload]').addEventListener('click', paneScores);
  $('[data-scopy]').addEventListener('click', async () => {
    const head = ['เลขที่', 'เลขประจำตัว', 'ชื่อ', 'ชั้น'].concat(works.map(w => w.title + ' (' + w.max + ')'), ['รวม', 'เต็ม', '%', 'ตรงกำหนด', 'ช้า', 'ขาดส่ง']);
    const text = [head.join('\t')].concat(rows.map(r => {
      const t = scoresTotals(r, works);
      return [r.no, r.sid, r.name, r.cls].concat(works.map(w => { const x = r.cells[w.code];
        return !x ? '' : x.score !== '' && x.score != null ? x.score : ({ miss: 'ขาด', todo: '', paper: '', ontime: 'รอตรวจ', late: 'รอตรวจ' })[x.st]; }),
        [t.got, t.full, t.pct == null ? '' : t.pct, t.c.ontime, t.c.late, t.c.miss]).join('\t');
    })).join('\n');
    try { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว วางใน Excel หรือ Google Sheets ได้เลย'); } catch (e) { toast('คัดลอกไม่สำเร็จ'); }
  });
}

/* ---- แท็บนักเรียนที่ต้องติดตาม ---------------------------------------------- */
async function paneWatch() {
  $('#pane').innerHTML = '<div class="empty">กำลังรวมข้อมูลทุกงาน…</div>';
  try { T.board = await api('workBoard', { cls: T.boardCls }); }

/* ---- แท็บปลดล็อกรหัส — ศูนย์กลางของทุกแอป ------------------------------------
   รวมสองเรื่องไว้ที่เดียว ครูไม่ต้องเข้าไปปลดทีละแอปอีก
     1) ถูกพักการเข้าใช้เพราะกรอกรหัสผิดหลายครั้ง — ตัวนับอยู่ในแคชของแต่ละชีตที่รับรหัสผ่าน (LOCK_BOOKS)
        ดึงจากทุกใบพร้อมกันแล้วรวมเป็นรายคน ปลดแล้วลบตัวนับในทุกใบที่คนนั้นติดอยู่
     2) คำขอตั้งรหัสใหม่ (ลืมรหัสผ่าน) และช่วงปลดทันที — อยู่ชีตศูนย์กลาง */
async function loadLocks() {
  const books = LOCK_BOOKS.filter(b => ME.tok[TEST_API || b.url]);
  const out = { rows: [], errs: [], missing: LOCK_BOOKS.filter(b => !ME.tok[TEST_API || b.url]).map(b => b.name) };
  const got = await Promise.all(books.map(b => apiAt(b.url, 'lockList', {}).then(list => ({ b: b, list: list }), e => ({ b: b, err: e }))));
  const by = {};
  got.forEach(g => {
    if (g.err) { if (!g.err.auth) out.errs.push(g.b.name + ': ' + g.err.message); return; }
    (g.list || []).forEach(x => {
      const k = String(x.sid);
      const r = by[k] || (by[k] = { sid: k, name: x.name, no: x.no, cls: x.cls, books: [], locked: false, fails: 0, left: 99 });
      r.books.push({ url: g.b.url, name: g.b.name, apps: g.b.apps, fails: x.fails, locked: x.locked });
      r.locked = r.locked || x.locked; r.fails = Math.max(r.fails, x.fails); r.left = Math.min(r.left, x.left);
    });
  });
  out.rows = Object.values(by).sort((a, b) => (b.locked - a.locked) || byTh(a.cls, b.cls) || (Number(a.no) || 0) - (Number(b.no) || 0));
  T.locks = out;
  return out;
}
/** ปลดคนที่ระบุ (หรือทุกคนเมื่อไม่ส่ง rows) ในทุกชีตที่ติดอยู่ */
async function unlockRows(rows) {
  const per = {};
  (rows || T.locks.rows).forEach(r => r.books.forEach(b => { (per[b.url] = per[b.url] || []).push(r.sid); }));
  let n = 0;
  const bad = [];
  await Promise.all(Object.keys(per).map(url => apiAt(url, 'unlock', rows ? { sids: per[url] } : {})
    .then(r => { n += r.unlocked || 0; }, e => bad.push(e.message))));
  return { n: n, bad: bad };
}
function resetTabBadge() {
  const wait = T.resets ? T.resets.rows.filter(r => r.status === 'wait').length : 0;
  const locked = T.locks ? T.locks.rows.filter(r => r.locked).length : 0;
  const tabBtn = $('[data-tab="reset"]');
  if (tabBtn) tabBtn.innerHTML = 'ปลดล็อกรหัส' + (wait + locked ? '<span class="n">' + (wait + locked) + '</span>' : '');

async function paneReset(silent) {
  if (T.resetBusy) return;
  if (!silent) $('#pane').innerHTML = '<div class="empty">กำลังรวมข้อมูลจากทุกแอป…</div>';
  T.resetBusy = true;
  let resetErr = null;
  const [rs] = await Promise.all([api('resetList', {}).catch(e => ({ err: e })), loadLocks().catch(() => null)]);
  T.resetBusy = false;
  if (rs && rs.err) {
    if (rs.err.auth) return fail(rs.err);
    resetErr = rs.err;
    T.resets = { rows: [], auto: { mine: null, others: [], now: Date.now() }, err: resetErr.message };
  } else T.resets = rs;
  if (T.tab !== 'reset') return;
  resetBody();
  /* ระหว่างเปิดแท็บนี้ ดึงคำขอใหม่ทุก 20 วินาที ครูจะเห็นเด็กที่เพิ่งยื่นโดยไม่ต้องกดโหลด */
  clearInterval(T.timer);
  let tick = 0;
  T.timer = setInterval(() => {
    if (T.tab !== 'reset' || !$('#pane [data-auto]')) { clearInterval(T.timer); return; }
    paintCountdown();
    if (++tick % 20 === 0 && !$('#layer').innerHTML) paneReset(true);
  }, 1000);
}
function paintCountdown() {
  const el = $('[data-left]');
  const a = T.resets && T.resets.auto;
  if (!el || !a || !a.mine) return;
  const skew = a.now - (T.resets.fetchedAt || a.now);
  const left = Math.max(0, a.mine.until - Date.now() - skew);
  el.textContent = Math.floor(left / 60000) + ':' + p2(Math.floor(left / 1000) % 60);
  if (!left && !T.resetBusy) paneReset(true);
}

    off.disabled = true;
    try { await api('resetAuto', { minutes: 0 }); toast('ปิดปลดทันทีแล้ว'); paneReset(true); }
    catch (e) { off.disabled = false; fail(e); }
  });
}

/* ============================================================================
   เริ่มทำงาน
   ========================================================================== */
function start() {
  $('#mark').innerHTML = icon('tray', 22);
  const s = readSession();
  if (!s) return showSignin();
  ME.s = s; ME.role = s.role;
  [HUB_URL, WORK_URL, PHYS_URL, TEST_API].filter(Boolean).forEach(u => { ME.tok[u] = tokenFor(s, u); });
  const hasWork = !!ME.tok[urlOf('workMine')], hasHub = !!ME.tok[urlOf('resetList')];
  if (!hasWork && !(s.role === 'admin' && hasHub)) {
    return showSignin('ยังเชื่อมกับชีตส่งงานไม่ได้ — กดออกจากระบบที่หน้าหลักแล้วลงชื่อใหม่อีกครั้ง' +
      (s.role === 'admin' ? ' (ถ้ายังไม่ได้ ผู้ดูแลหลักต้องกด “เชื่อมทุกชีต” ที่หน้าหลักก่อน)' : ''));
  }
  /* ครูที่ยังเชื่อมชีตส่งงานไม่ได้ ยังจัดการคำขอรหัสผ่านได้ เพราะคำขออยู่ชีตศูนย์กลาง */
  T.noWork = !hasWork;
  const p = s.profile || {};
  if (s.role === 'admin') {
    /* ลิงก์จากหน้าพอร์ทัล "เปิดดูคำขอ" พามาที่แท็บคำขอรหัสผ่านตรง ๆ */
    if (location.hash === '#reset') T.tab = 'reset';
    $('#who').textContent = (p.sub ? (p.name || 'ครูผู้สอน') + ' · ดูแล ' + (p.classes || []).join(', ') : 'ผู้ดูแลหลัก · ทุกชั้น');
    teacherLoad();
    if (!T.noWork) obRestore();
  } else {
    $('#who').textContent = [p.name, p.cls, p.no ? 'เลขที่ ' + p.no : ''].filter(Boolean).join(' · ');
    studentLoad();
  }
}
start();
</script>
