<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c4b8c">
<meta name="description" content="ส่งงานออนไลน์ โรงเรียนปากช่อง — ถ่ายรูปใบงานหรือแนบ PDF ส่งครู ครูตรวจและให้คะแนนในหน้าเดียว">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300..700&display=swap" rel="stylesheet">
<title>ส่งงานออนไลน์ · โรงเรียนปากช่อง</title>
<style>
/* ============================================================================
   ส่งงานออนไลน์ — หน้าตาเดียวกับหน้าพอร์ทัล (เส้นบาง สีเน้นสีเดียว ไม่มีเงา)
   นักเรียนใช้บนมือถือเป็นหลัก ครูใช้บนคอมพิวเตอร์หรือไอแพด จึงออกแบบจากจอแคบก่อน
   ========================================================================== */
:root{
  --bg:#fbfaf8; --panel:#ffffff; --ink:#14181f; --muted:#6b7480;
  --line:#e5e2db; --line2:#f1efea;
  --brand:#1c4b8c; --brand-ink:#ffffff; --brand-soft:rgba(28,75,140,.09);
  --ok:#0f6b46; --ok-bg:#eaf4ef; --bad:#9f2420; --bad-bg:#fbeeed; --warn:#8a5a00; --warn-bg:#fdf3e1;
  --r:10px;
  --font:'Anuphan',-apple-system,BlinkMacSystemFont,'Leelawadee UI','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1218; --panel:#141a22; --ink:#e8ecf2; --muted:#98a2b0;
    --line:#252d38; --line2:#1c232c;
    --brand:#8fb4e8; --brand-ink:#0e1218; --brand-soft:rgba(143,180,232,.14);
    --ok:#4cc38a; --ok-bg:#12271e; --bad:#f08a86; --bad-bg:#2c1917; --warn:#e7b35a; --warn-bg:#2a2112;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;
  line-height:1.7;-webkit-font-smoothing:antialiased;
  padding:28px 16px calc(48px + env(safe-area-inset-bottom))}
.wrap{max-width:980px;margin:0 auto}
.hide{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.mark{flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--brand)}
h1{font-size:25px;font-weight:300;margin:0;line-height:1.3}
h1 b{font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.hsp{flex:1}
a.back{color:var(--muted);text-decoration:none;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
@media (hover:hover){a.back:hover{color:var(--brand);border-color:var(--brand)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel+.panel{margin-top:14px}
h2{font-size:18px;margin:0 0 4px;font-weight:700;line-height:1.45}
h3{font-size:15.5px;margin:18px 0 8px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;min-height:40px;font-size:14.5px}
@media (hover:hover){button:hover{border-color:var(--brand)}}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button.danger{color:var(--bad)}
button.sm{min-height:32px;padding:4px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px 11px;font-size:16px;min-height:44px;width:100%}
textarea{min-height:84px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
label.f .muted{font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.notice{border-radius:8px;padding:10px 13px;font-size:14px;line-height:1.65;margin:10px 0}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.info{background:var(--brand-soft);color:var(--ink)}
.chip{display:inline-block;font-size:12px;line-height:1.5;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;vertical-align:middle}
.chip.ok{border-color:transparent;background:var(--ok-bg);color:var(--ok)}
.chip.bad{border-color:transparent;background:var(--bad-bg);color:var(--bad)}
.chip.warn{border-color:transparent;background:var(--warn-bg);color:var(--warn)}
.chip.brand{border-color:transparent;background:var(--brand-soft);color:var(--brand)}
/* ---------- แท็บครู ---------- */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:none;background:transparent;border-radius:0;color:var(--muted);padding:0 2px 10px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:40px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--brand)}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;line-height:1.6;text-align:center;font-weight:700}
/* ---------- รายการงาน ---------- */
.list{border-top:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;border-radius:0;width:100%;text-align:left;min-height:0}
@media (hover:hover){.item:hover{background:var(--brand-soft)}}
.item .bd{flex:1;min-width:0}
.item .tt{font-weight:700;line-height:1.5}
.item .ln{font-size:13px;color:var(--muted);line-height:1.6}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:6px;max-width:320px}
.bar i{display:block;height:100%;background:var(--brand)}
/* ---------- ตาราง ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--bg);position:sticky;top:0;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
tr.pick{cursor:pointer}
@media (hover:hover){tr.pick:hover td{background:var(--brand-soft)}}
td input.score{width:72px;min-height:36px;padding:4px 8px;text-align:right}
td.nm{white-space:nowrap}
.nw{white-space:nowrap}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg2 button{border:0;border-radius:0;min-height:32px;font-size:13px;padding:3px 12px;background:transparent}
.seg2 button.on{background:var(--brand);color:var(--brand-ink)}
/* ---------- แผ่นทับหน้า (รายละเอียดงาน / ฟอร์ม / ตัวดูงาน) ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 12px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:720px;padding:18px 18px 22px;position:relative}
.sheet .x{position:absolute;right:10px;top:10px;min-height:36px}
@media (max-width:560px){.overlay{padding:0}.sheet{border-radius:0;min-height:100%;border:0}}
.detail{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:14.5px}
/* ---------- ไฟล์ที่เตรียมส่ง ---------- */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:10px}
.fcard{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);position:relative}
.fcard .th{height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden}
.fcard .th img{width:100%;height:100%;object-fit:cover}
.fcard .ft{display:flex;align-items:center;gap:2px;padding:3px 4px;font-size:11.5px;color:var(--muted)}
.fcard .ft b{flex:1;padding-left:3px}
.fcard .ft button{min-height:28px;padding:0 7px;font-size:12px;border-radius:6px}
.pick-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick-btns label{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--brand);color:var(--brand);border-radius:10px;min-height:56px;cursor:pointer;font-weight:700;text-align:center;padding:6px}
.pick-btns input{display:none}
.prog{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
/* ---------- ตัวดูงานของครู ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.vtop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.vtop .who{font-weight:700;line-height:1.35}
.vbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.vbody img{max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.vbody.zoom img{max-width:none;width:180%}
.vbody iframe{width:100%;max-width:900px;height:78vh;border:1px solid var(--line);border-radius:6px;background:#fff}
.vbot{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.vbot .fld{display:flex;flex-direction:column;gap:3px}
.vbot .fld span{font-size:12px;color:var(--muted)}
.vbot input.score{width:92px;text-align:right;font-size:20px;font-weight:700}
.vbot input.cm{min-width:220px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:90;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.big{font-size:26px;font-weight:700;line-height:1.2}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 2px}
.stat div{font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.count{font-variant-numeric:tabular-nums}
/* ---------- ใบงานจากครู ---------- */
.shlist{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.shrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line2)}
.shrow:last-child{border-bottom:0}
.shrow .ic{flex:none;color:var(--brand);display:flex}
.shrow .nm{flex:1;min-width:0;line-height:1.45;word-break:break-word}
.shrow .nm small{display:block;color:var(--muted);font-size:12px}
.shrow.gone .nm{text-decoration:line-through;color:var(--muted)}
.shrow.new .ic{color:var(--ok)}
/* ---------- เลขที่เพื่อนร่วมชั้น (นักเรียน) ---------- */
.peers{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.peers span{min-width:36px;height:32px;padding:0 5px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.peers .y,.dot.y{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.peers .n,.dot.n{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.peers .me{outline:2px solid var(--ink);outline-offset:2px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin:0 3px 0 8px}
/* ---------- เขียนตรวจงาน (ครู) ---------- */
.ink{position:fixed;inset:0;z-index:80;background:#e8e6e1;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (prefers-color-scheme:dark){.ink{background:#07090d}}
.inktop{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.inktop .who{font-weight:700;line-height:1.35}
.inktools{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.inktools .grp{display:flex;gap:1px;align-items:center;padding-right:5px;border-right:1px solid var(--line);flex:none}
.inktools .grp:last-child{border-right:0}
.inktools .grp.off{opacity:.3;pointer-events:none}
button.tb{min-height:42px;min-width:42px;padding:0 8px;border:1px solid transparent;background:transparent;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
button.tb.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
button.tb.txt{font-size:13px;font-weight:700;white-space:nowrap}
button.tb.stamp{font-size:22px;font-weight:700}
button.sw,button.sz{min-height:42px;min-width:34px;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;border-radius:8px}
.sw i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.sw.on i{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.sz i{display:block;border-radius:50%;background:var(--muted)}
button.sz.on{background:var(--brand-soft)}
.sz.on i{background:var(--brand)}
.inknote{font-size:13px;background:var(--panel);color:var(--muted);flex:none}
.inknote:not(:empty){padding:6px 12px;border-bottom:1px solid var(--line)}
button.linkb{border:0;background:none;padding:0;min-height:0;color:var(--brand);text-decoration:underline;font-size:13px}
button.linkb.danger{color:var(--bad)}
.inkbody{flex:1;overflow:auto;padding:14px;overscroll-behavior:contain}
.inkbody .pg{position:relative;margin:0 auto 14px;background:#fff;border:1px solid #cfccc4;touch-action:none}
.pg>img,.pg>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pg .its{position:absolute;inset:0;pointer-events:none}
.pg .pn{position:absolute;right:6px;bottom:4px;font-size:11px;color:#6b7480;background:rgba(255,255,255,.85);padding:0 7px;border-radius:99px;pointer-events:none}
.ink.fscroll .pg,.ink.mv .pg{touch-action:pan-x pan-y pinch-zoom}
.pg .it{position:absolute;pointer-events:none}
.pg .it img{width:100%;height:100%;display:block;pointer-events:none}
.pg .it .del,.pg .it .rs{display:none}
.ink.mv .pg .it{pointer-events:auto;outline:1.5px dashed #1f5fd1;outline-offset:2px;cursor:move;touch-action:none}
.ink.mv .pg .it .del{display:flex;position:absolute;top:-15px;right:-15px;width:30px;height:30px;min-height:0;padding:0;border-radius:50%;background:#c0302b;color:#fff;border:0;align-items:center;justify-content:center;font-size:18px;line-height:1}
.ink.mv .pg .it .rs{display:block;position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;border-radius:5px;background:#1f5fd1;border:2px solid #fff;cursor:nwse-resize}
.ink.busy .inktools,.ink.busy .inkbody{pointer-events:none;opacity:.55}
.ink .vbot{flex:none}
.obfloat{position:fixed;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:95;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.obfloat:empty{display:none}
.obx{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;min-height:0;line-height:1.5;box-shadow:0 2px 10px rgba(0,0,0,.12)}
button.obx.bad,.obx.bad{color:var(--bad);border-color:var(--bad)}
.obx.ok{color:var(--ok);border-color:var(--ok)}
.obx .spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:obspin .8s linear infinite}
@keyframes obspin{to{transform:rotate(360deg)}}
.signpad{width:100%;height:auto;aspect-ratio:900/320;margin-top:10px;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none;display:block}
label.pickimg{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 10px;min-height:32px;font-size:13px;cursor:pointer}
a.dl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;min-height:48px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-weight:700;text-decoration:none}
.shpick{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--brand);color:var(--brand);border-radius:10px;min-height:48px;cursor:pointer;font-weight:700;margin-top:8px}
.shpick input{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" id="mark"></div>
    <div>
      <h1><b>ส่งงาน</b>ออนไลน์</h1>
      <p class="sub" id="who">โรงเรียนปากช่อง</p>
    </div>
    <div class="hsp"></div>
    <a class="back" href="../">หน้าหลัก</a>
  </header>
  <main id="view"><div class="empty">กำลังโหลด…</div></main>
</div>
<div id="layer"></div>
<div class="toast" id="toast"></div>
<div class="obfloat" id="obfloat" aria-live="polite"></div>

<script>
'use strict';
/* ────────────────────────────────────────────────────────────────────────────
   การเชื่อมต่อ
   ────────────────────────────────────────────────────────────────────────────
   ใช้การลงชื่อเข้าใช้ของหน้าพอร์ทัล (localStorage คีย์ pcportal.v1) ไม่มีหน้าลงชื่อของตัวเอง
   คุยกับสองชีต
     HUB_URL   ชีตศูนย์กลาง — รหัสผ่านอยู่ที่นี่ คำขอลืมรหัสผ่านจึงไปที่นี่ (BOOKS[0] ของหน้าพอร์ทัล)
     WORK_URL  ชีตส่งงาน — งานที่สั่ง การส่ง และไฟล์ แยกออกมาไม่ให้การอัปโหลดถ่วงการลงชื่อเข้าใช้
               (ใบที่มี autoRoster ใน BOOKS ของหน้าพอร์ทัล) ต้องเป็นที่อยู่เดียวกันเสมอ

   ?api= ใช้ได้เฉพาะตอนเปิดจากเครื่องตัวเอง (localhost) ไว้ทดสอบกับชีตจำลอง
   เปิดจากเว็บจริงพารามิเตอร์นี้ไม่มีผล ใครก็ส่งลิงก์หลอกให้ไปคุยกับที่อื่นไม่ได้
   ──────────────────────────────────────────────────────────────────────────── */
const HUB_URL = 'https://script.google.com/macros/s/AKfycbxVa8BYYQeIhBDmg85w2UBwsIqt6a2YudehUfCbyMny9T-5TTh1UfFxsJjTk9HLNuFc/exec';
const WORK_URL = 'https://script.google.com/macros/s/AKfycbyKZicAzLfUfc7UXPMrGsejrq9DyOU7w3AyinaueUsarp72UZD6w8gYbv_FtpUfasbDkw/exec';
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const TEST_API = LOCAL ? new URLSearchParams(location.search).get('api') : '';

function toast(text, ms) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('on'), ms || 2600);
}

function readSession() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
  if (!s || s.v !== 1 || !s.exp || s.exp < Date.now()) return null;
  return s;
}
/** โทเคนของชีตใบหนึ่ง — พอร์ทัลรุ่นเก่าเก็บโทเคนใบเดียวไว้ที่ s.token ก็ยังใช้ได้ถ้าเป็นใบเดียวกัน */
function tokenFor(s, url) {
  if (!s) return '';
  if (s.tokens && s.tokens[url]) return s.tokens[url];
  return s.url === url ? (s.token || '') : '';
}

const ME = { s: null, role: '', tok: {} };

/** ยิงคำสั่งไปที่ Apps Script — ต้องเป็น text/plain ไม่งั้นเบราว์เซอร์ยิง preflight ที่ Apps Script ตอบไม่ได้ */
async function api(action, params, timeoutMs) { return apiAt(urlOf(action), action, params, timeoutMs); }
/** ยิงคำสั่งไปชีตที่ระบุ — ใช้กับแท็บปลดล็อกรหัสที่ต้องคุยกับหลายชีต (ตอนทดสอบในเครื่อง ?api= ชนะเสมอ) */
async function apiAt(urlIn, action, params, timeoutMs) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs || 45000);
  let res;
  try {
    const url = TEST_API || urlIn;
    res = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action, token: ME.tok[url] || '' }, params || {})),
      redirect: 'follow', signal: ctl.signal
    });
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'เชื่อมต่อนานเกินไป — ตรวจสัญญาณอินเทอร์เน็ตแล้วลองใหม่'
                                            : 'ต่ออินเทอร์เน็ตไม่ได้ ลองเช็กสัญญาณแล้วลองใหม่');
  } finally { clearTimeout(timer); }
  let j;
  try { j = JSON.parse(await res.text()); } catch (e) { throw new Error('ระบบตอบกลับไม่ถูกรูปแบบ — ลองใหม่อีกครั้ง'); }
  if (!j.ok) {
    if (/ไม่รู้จักคำสั่ง/.test(j.error || '')) { const e0 = new Error('ชีตยังเป็นรุ่นเก่า — ครูต้องวางโค้ดชีตรุ่น ' + needVer(action) + ' แล้ว Deploy ใหม่ก่อน'); e0.old = true; throw e0; }
    const err = new Error(String(j.error || 'ทำรายการไม่สำเร็จ').replace(/^AUTH:\s*/, ''));
    err.auth = !!j.auth;
    throw err;
  }
  return j.data;
}
function fail(e) {
  if (e && e.auth) { showSignin('การเข้าใช้หมดอายุแล้ว'); return; }
  toast(e && e.message ? e.message : String(e), 4200);
}

/* ---- วันเวลา ------------------------------------------------------------- */
const TH_DAY = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const p2 = n => String(n).padStart(2, '0');
function thDate(iso, withDay) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return (withDay ? TH_DAY[d.getDay()] + ' ' : '') + d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
/** ระยะเวลาเป็นคำอ่าน เช่น 2 วัน 3 ชม. · 45 นาที */
function spanText(min) {
  min = Math.max(0, Math.round(min));
  const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
  /* บอกสองหน่วยที่ใหญ่ที่สุดที่ไม่เป็นศูนย์ — "4 วัน" เฉย ๆ ทั้งที่ช้า 4 วัน 1 นาที
     จะดูขัดกับการหักห้าวัน (เศษของวันนับเป็นหนึ่งวัน) */
  const parts = [[d, ' วัน'], [h, ' ชม.'], [m, ' นาที']].filter(x => x[0] > 0).slice(0, 2);
  return parts.length ? parts.map(x => x[0] + x[1]).join(' ') : '1 นาที';
}
const lateMinAt = (w, t) => { const due = new Date(w.dueAt).getTime(); return due && t > due ? Math.ceil((t - due) / 60000) : 0; };
/** ต้องตรงกับ workPenalty_ ในโค้ดชีต */
function penaltyOf(w, lateMin) {
  if (w.mode !== 'late' || !(lateMin > 0)) return 0;
  const cap = w.cap === '' || w.cap == null ? 100 : Number(w.cap);
  return Math.max(0, Math.min(Math.ceil(lateMin / 1440) * (Number(w.perDay) || 0), cap >= 0 ? cap : 100, 100));
}
const finalOf = (w, raw, lateMin) => raw === '' || raw == null || isNaN(Number(raw)) ? '' : Math.round(Number(raw) * (100 - penaltyOf(w, lateMin))) / 100;
const fmtN = n => n === '' || n == null ? '—' : String(Math.round(Number(n) * 100) / 100);
function ruleText(w) {
  if (w.mode !== 'late') return 'ส่งช้าไม่หักคะแนน';
  return 'ส่งช้าหักวันละ ' + w.perDay + '%' + (w.cap < 100 ? ' หักรวมไม่เกิน ' + w.cap + '%' : '');
}
function dueLine(w, now) {
  const due = new Date(w.dueAt).getTime(), left = (due - now) / 60000;
  if (left >= 0) return 'กำหนดส่ง ' + thDate(w.dueAt, true) + ' · เหลือ ' + spanText(left);
  return 'กำหนดส่ง ' + thDate(w.dueAt, true) + ' · <span class="nw" style="color:var(--bad)">เลยกำหนดมา ' + spanText(-left) + '</span>';
}

/* ---- ใบงานจากครู ----------------------------------------------------------- */
const fmtSize = n => n >= 1048576 ? (Math.round(n / 104857.6) / 10) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
function sheetKind(mime) {
  if (mime === 'application/pdf') return 'PDF';
  if (/^image\//.test(mime)) return 'รูป';
  if (/word/.test(mime)) return 'Word';
  if (/excel|spreadsheet/.test(mime)) return 'Excel';
  if (/powerpoint|presentation/.test(mime)) return 'PowerPoint';
  return 'ไฟล์';
}
/** ชนิดของไฟล์ที่ครูเลือก — Windows บางเครื่องไม่บอกชนิดของไฟล์ Word จึงดูจากนามสกุลด้วย */
function sheetMime(file) {
  if (/^image\//.test(file.type)) return file.type;       /* รูปชนิดอื่น (HEIC ฯลฯ) แปลงเป็น JPG ตอนส่ง */
  if (Object.values(SHEET_EXT).indexOf(file.type) >= 0) return file.type;
  const ext = (String(file.name).match(/\.([a-z0-9]+)$/i) || [])[1];
  return ext ? SHEET_EXT[ext.toLowerCase()] || '' : '';
}
function sheetRow(f, right, cls) {
  return '<div class="shrow' + (cls ? ' ' + cls : '') + '"><span class="ic">' + icon('doc', 22) + '</span>' +
    '<span class="nm">' + esc(f.name) + '<small>' + sheetKind(f.mime) + ' · ' + fmtSize(f.size) + '</small></span>' + right + '</div>';
}

/* ---- แผ่นทับหน้า ----------------------------------------------------------- */
function openSheet(html, onClose) {
  const layer = $('#layer');
  layer.innerHTML = '<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">' +
    '<button class="x sm" data-close>ปิด</button>' + html + '</div></div>';
  const ov = $('.overlay', layer);
  const close = () => { layer.innerHTML = ''; document.body.style.overflow = ''; if (onClose) onClose(); };
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  $$('[data-close]', ov).forEach(b => b.addEventListener('click', close));
  document.body.style.overflow = 'hidden';
  return { root: $('.sheet', layer), close: close };
}
function confirmBox(title, html, okLabel, danger) {
  return new Promise(resolve => {
    let done = false;
    const sh = openSheet('<h2>' + esc(title) + '</h2><div style="margin-top:8px">' + html + '</div>' +
      '<div class="row" style="margin-top:18px;justify-content:flex-end"><button data-no>ยกเลิก</button>' +
      '<button class="' + (danger ? 'danger' : 'primary') + '" data-yes>' + esc(okLabel || 'ตกลง') + '</button></div>',
      () => { if (!done) resolve(false); });
    $('[data-no]', sh.root).addEventListener('click', () => { done = true; sh.close(); resolve(false); });
    $('[data-yes]', sh.root).addEventListener('click', () => { done = true; sh.close(); resolve(true); });
  });
}

const STU = { data: null, loading: false };

async function studentLoad() {
  STU.loading = true;
  try { STU.data = await api('workMine', {}); }
  catch (e) { STU.loading = false; if (e.auth) return fail(e); $('#view').innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>'; return; }
  STU.loading = false;
  studentRender();
}

function stuStatus(w, now) {
  const s = w.sub;
  if (s && s.graded) {
    return '<span class="chip ok">ได้ ' + fmtN(s.score) + '/' + fmtN(w.max) + '</span>' +
      (s.files.length && s.lateMin > 0 ? ' <span class="chip warn">ส่งช้า</span>' : '');
  }
  if (s && s.files.length) {
    return s.lateMin > 0 ? '<span class="chip warn">ส่งช้า ' + spanText(s.lateMin) + '</span>'
                         : '<span class="chip ok">ส่งแล้ว รอตรวจ</span>';
  }
  return new Date(w.dueAt).getTime() < now ? '<span class="chip bad">ยังไม่ส่ง · เลยกำหนด</span>' : '<span class="chip">ยังไม่ส่ง</span>';
}

function studentRender() {
  const d = STU.data, now = Date.now();
  const todo = d.works.filter(w => !(w.sub && (w.sub.files.length || w.sub.graded)));
  const done = d.works.filter(w => w.sub && (w.sub.files.length || w.sub.graded)).reverse();
  const r = d.risk;
  let h = '';
  /* เตือนนักเรียนเองด้วย ไม่ใช่แค่ครูเห็น — เด็กส่วนใหญ่ไม่รู้ว่าตัวเองค้างกี่งานจนปลายภาค */
  if (r.level === 'high') {
    h += '<div class="notice bad"><b>ระวังติด 0</b> — ' +
      (r.missing ? 'มีงานที่เลยกำหนดแล้วแต่ยังไม่ส่ง ' + r.missing + ' งาน' : 'คะแนนงานที่ครูตรวจแล้วยังน้อย') +
      (r.pct != null ? ' · คะแนนงานตอนนี้ได้ร้อยละ ' + r.pct : '') +
      '<br>ส่งช้ายังดีกว่าไม่ส่ง รีบส่งงานที่ค้างอยู่ด้านล่างได้เลย</div>';
  } else if (r.level === 'mid') {
    h += '<div class="notice warn"><b>ค้างส่ง ' + r.missing + ' งาน</b> ที่เลยกำหนดแล้ว — ส่งช้าได้ ระบบไม่ปิดรับ</div>';
  }
  h += '<div class="panel"><div class="row"><h2 style="margin:0">งานที่ต้องส่ง</h2><span class="chip">' + todo.length + '</span>' +
    '<span class="sp"></span><button class="sm" data-reload>โหลดใหม่</button></div>';
  h += todo.length ? '<div class="list" style="margin-top:10px">' + todo.map(w => stuItem(w, now)).join('') + '</div>'
                   : '<div class="empty">ไม่มีงานค้าง เยี่ยมมาก</div>';
  h += '</div>';
  if (done.length) {
    h += '<div class="panel"><div class="row"><h2 style="margin:0">ส่งแล้ว</h2><span class="chip">' + done.length + '</span></div>' +
      '<div class="list" style="margin-top:10px">' + done.map(w => stuItem(w, now)).join('') + '</div></div>';
  }
  if (!d.works.length) {
    h = '<div class="panel"><div class="empty">ยังไม่มีงานที่ครูสั่งให้ชั้น <b>' + esc(d.cls || '—') + '</b><br>' +
      '<span class="small">ถ้าครูบอกว่าสั่งแล้วแต่ไม่ขึ้น ให้แจ้งครูว่าชั้นในระบบของคุณคือ ' + esc(d.cls || '(ว่าง)') + '</span></div></div>';
  }
  /* ข้อความแจ้งเตือนจากครู — อยู่บนสุดจนกว่านักเรียนจะกดรับทราบ (ชีตรุ่นเก่าไม่ส่ง notes มา ก็ไม่ขึ้นอะไร) */
  const notes = d.notes || [];
  if (notes.length) {
    const K = { miss: ['bad', '🔔', 'ยังไม่ส่งงาน'], late: ['warn', '⏰', 'ส่งไม่ตรงกำหนด'], ontime: ['ok', '🌟', 'ส่งตรงกำหนด'] };
    h = '<div class="panel"><div class="row"><h2 style="margin:0">ข้อความจากครู</h2><span class="chip bad">' + notes.length + '</span></div>' +
      notes.map(n => { const k = K[n.kind] || K.miss;
        return '<div class="notice ' + k[0] + '" style="display:flex;gap:10px;align-items:flex-start"><span style="font-size:20px;line-height:1.3">' + k[1] + '</span>' +
          '<div style="flex:1"><b>' + esc(n.title || 'งาน') + '</b> · ' + k[2] + '<br>' + esc(n.msg) +
          '<div class="small muted">' + esc(n.by) + ' · ' + thDate(n.ts, true) + '</div></div>' +
          '<button class="sm" data-ack="' + esc(n.id) + '">รับทราบ</button></div>'; }).join('') + '</div>' + h;
  }
  $('#view').innerHTML = h;
  $$('[data-ack]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    try {
      await api('workNoteRead', { ids: [b.dataset.ack] });
      d.notes = (d.notes || []).filter(n => n.id !== b.dataset.ack);
      studentRender();
    } catch (e) { b.disabled = false; fail(e); }
  }));
  $$('[data-open]').forEach(b => b.addEventListener('click', () => studentOpen(b.dataset.open)));
  const rl = $('[data-reload]'); if (rl) rl.addEventListener('click', studentLoad);
}
function stuItem(w, now) {
  return '<button class="item" data-open="' + esc(w.code) + '"><span class="mark" style="width:36px;height:36px">' + icon('tray', 19) + '</span>' +
    '<span class="bd"><span class="tt">' + esc(w.title) + '</span>' + (w.subject ? ' <span class="chip">' + esc(w.subject) + '</span>' : '') +
    ((w.sheets || []).length ? ' <span class="chip brand">มีใบงาน ' + w.sheets.length + ' ไฟล์</span>' : '') +
    '<br><span class="ln">' + dueLine(w, now) + peerLine(w) + '</span><br>' + stuStatus(w, now) +
    (w.sub && w.sub.marked && w.sub.marked.length ? ' <span class="chip brand">ครูเขียนตรวจแล้ว</span>' : '') + '</span></button>';
}
/** เพื่อนในห้องส่งแล้วกี่คน (ชีตรุ่น 24 ขึ้นไป — รุ่นเก่าไม่ส่ง peers มา ก็ไม่ขึ้น) */
function peerLine(w) {
  const p = w.peers || [];
  return p.length ? ' · ห้องส่งแล้ว ' + p.filter(x => x[1]).length + '/' + p.length : '';
}

/* ไฟล์ที่เลือกไว้แต่ยังไม่ส่ง — เก็บในหน่วยความจำเท่านั้น ปิดหน้าไปแล้วต้องเลือกใหม่ */
let PENDING = [];

function studentOpen(code) {
  const w = STU.data.works.find(x => x.code === code);
  if (!w) return;
  PENDING = [];
  const s = w.sub;
  const now = Date.now();
  let h = '<h2 style="padding-right:56px">' + esc(w.title) + '</h2>' +
    '<div class="muted small">' + (w.subject ? esc(w.subject) + ' · ' : '') + 'คะแนนเต็ม ' + fmtN(w.max) + ' · ' + ruleText(w) + '</div>' +
    '<div class="small" style="margin-top:4px">' + dueLine(w, now) + '</div>';
  if (w.detail) h += '<div class="detail" style="margin-top:10px">' + esc(w.detail) + '</div>';
  if ((w.sheets || []).length) {
    h += '<h3>ใบงานจากครู</h3><div class="shlist">' + w.sheets.map(f =>
      sheetRow(f, '<button class="sm" data-sheet="' + esc(f.id) + '">' + icon('down', 16) + ' เปิด / โหลด</button>')).join('') + '</div>' +
      '<div class="muted small" style="margin-top:4px">ทำในกระดาษหรือพิมพ์ออกมาทำ แล้วถ่ายรูปส่งด้านล่าง</div>';
  }

  if (s && s.graded) {
    h += '<div class="notice ok" style="margin-top:12px"><span class="big">' + fmtN(s.score) + '</span> / ' + fmtN(w.max) + ' คะแนน' +
      (s.penalty ? '<div class="small">ครูให้ ' + fmtN(s.raw) + ' · ส่งช้าหัก ' + s.penalty + '%</div>' : '') +
      (s.comment ? '<div style="margin-top:4px"><b>ครู:</b> ' + esc(s.comment) + '</div>' : '') + '</div>';
  }
  if (s && s.files.length) {
    h += '<div class="notice ' + (s.lateMin > 0 ? 'warn' : 'info') + '" style="margin-top:12px">' +
      'ส่งแล้วเมื่อ <b>' + thDate(s.ts, true) + '</b>' + (s.n > 1 ? ' (ส่งครั้งที่ ' + s.n + ')' : '') +
      (s.lateMin > 0 ? '<br><b>คุณส่งช้ากว่ากำหนด ' + spanText(s.lateMin) + '</b>' +
        (w.mode === 'late' ? ' · คะแนนงานนี้ถูกหัก ' + s.penalty + '%' : ' · งานนี้ไม่หักคะแนน') : '') +
      '<div class="row" style="margin-top:6px">' + s.files.map((f, i) =>
        '<button class="sm" data-see="' + esc(f.id) + '">' + (f.mime === 'application/pdf' ? 'PDF' : 'หน้า ' + (i + 1)) + '</button>').join('') + '</div></div>';
  }

  if (s && s.marked && s.marked.length) {
    h += '<h3>งานที่ครูเขียนตรวจ</h3><div class="notice info">ครูเขียนตรวจงานของคุณเมื่อ ' + thDate(s.markedAt, true) +
      (s.ts && s.markedAt && new Date(s.ts) > new Date(s.markedAt) ? ' <span class="small">(เป็นงานชุดก่อนที่คุณส่งใหม่)</span>' : '') +
      '<div class="row" style="margin-top:6px">' + s.marked.map((f, i) => '<button class="sm" data-mk="' + esc(f.id) + '">หน้า ' + (i + 1) + '</button>').join('') + '</div></div>';
  }
  /* เลขที่ของเพื่อนร่วมห้อง เขียว = ส่งแล้ว แดง = ยังไม่ส่ง ไม่มีชื่อ ให้ช่วยกันตามงาน */
  if ((w.peers || []).length) {
    const sent = w.peers.filter(p => p[1]).length;
    h += '<h3>เพื่อนในห้อง <span class="muted small" style="font-weight:400">ส่งแล้ว ' + sent + ' จาก ' + w.peers.length + ' คน</span></h3>' +
      '<div class="peers">' + w.peers.map(p => '<span class="' + (p[1] ? 'y' : 'n') + (p[2] ? ' me' : '') + '" title="เลขที่ ' + esc(p[0]) +
        (p[1] ? ' ส่งแล้ว' : ' ยังไม่ส่ง') + (p[2] ? ' (คุณ)' : '') + '">' + esc(p[0] || '?') + '</span>').join('') + '</div>' +
      '<div class="muted small" style="margin-top:6px"><span class="dot y" style="margin-left:0"></span>ส่งแล้ว<span class="dot n"></span>ยังไม่ส่ง · กรอบดำคือคุณ — ช่วยเตือนเพื่อนที่ยังไม่ส่งด้วยนะ</div>';
  }

  h += '<h3>' + (s && s.files.length ? 'ส่งใหม่ <span class="muted small">(แทนไฟล์ชุดเดิมทั้งหมด)</span>' : 'แนบงาน') + '</h3>' +
    '<div class="pick-btns">' +
      '<label>' + icon('camera', 22) + '<span>ถ่ายรูป / เลือกรูป</span><input type="file" accept="image/*" multiple data-img></label>' +
      '<label>' + icon('doc', 22) + '<span>แนบไฟล์ PDF</span><input type="file" accept="application/pdf" data-pdf></label>' +
    '</div>' +
    '<div class="muted small" style="margin-top:6px">ถ่ายทีละหน้า ให้เห็นทั้งแผ่นและอ่านออก · เรียงหน้าได้ด้วยลูกศร · ได้สูงสุด ' + FILES_MAX + ' ไฟล์</div>' +
    '<div class="files" data-files></div>' +
    '<label class="f">ข้อความถึงครู <span class="muted">(ไม่บังคับ)</span></label><textarea data-note maxlength="500" style="min-height:60px"></textarea>' +
    '<div data-latewarn></div>' +
    '<div class="prog hide" data-prog><i></i></div><div class="small muted" data-progtext></div>' +
    '<button class="primary" style="width:100%;margin-top:12px;min-height:50px" data-send disabled>ส่งงาน</button>';

  const sh = openSheet(h, () => { PENDING.forEach(p => p.url && URL.revokeObjectURL(p.url)); PENDING = []; });
  const root = sh.root;
  const paint = () => paintPending(root, w);
  $('[data-img]', root).addEventListener('change', e => { addFiles(Array.from(e.target.files || []), 'img').then(paint); e.target.value = ''; });
  $('[data-pdf]', root).addEventListener('change', e => { addFiles(Array.from(e.target.files || []), 'pdf').then(paint); e.target.value = ''; });
  $$('[data-see]', root).forEach(b => b.addEventListener('click', () => viewOwnFile(b.dataset.see, b)));
  $$('[data-mk]', root).forEach(b => b.addEventListener('click', () => viewOwnFile(b.dataset.mk, b, 'งานที่ครูเขียนตรวจ · ' + b.textContent, true)));
  $$('[data-sheet]', root).forEach(b => b.addEventListener('click', () =>
    viewOwnFile(b.dataset.sheet, b, (w.sheets.find(f => f.id === b.dataset.sheet) || {}).name, true)));
  $('[data-send]', root).addEventListener('click', () => studentSend(w, root, sh));
  paint();
  return sh;
}

async function addFiles(list, kind) {
  for (const f of list) {
    if (PENDING.length >= FILES_MAX) { toast('แนบได้ไม่เกิน ' + FILES_MAX + ' ไฟล์'); break; }
    if (kind === 'pdf' || f.type === 'application/pdf') {
      if (f.type !== 'application/pdf') { toast('ไฟล์ ' + f.name + ' ไม่ใช่ PDF'); continue; }
      if (f.size > PDF_MAX) { toast('PDF ใหญ่เกิน 10 MB — ลองบีบอัดหรือถ่ายรูปแทน', 4000); continue; }
      PENDING.push({ kind: 'pdf', file: f, name: f.name, size: f.size });
    } else {
      if (!/^image\//.test(f.type)) { toast('ไฟล์ ' + f.name + ' ไม่ใช่รูป'); continue; }
      PENDING.push({ kind: 'img', file: f, name: f.name, size: f.size, url: URL.createObjectURL(f) });
    }
  }
}

function paintPending(root, w) {
  const box = $('[data-files]', root);
  box.innerHTML = PENDING.map((p, i) =>
    '<div class="fcard"><div class="th">' + (p.kind === 'img' ? '<img alt="" src="' + p.url + '">' : icon('doc', 34) + '<br>PDF') + '</div>' +
    '<div class="ft"><b>' + (i + 1) + '</b>' +
      '<button data-mv="' + i + ':-1" ' + (i ? '' : 'disabled') + ' aria-label="เลื่อนขึ้น">‹</button>' +
      '<button data-mv="' + i + ':1" ' + (i < PENDING.length - 1 ? '' : 'disabled') + ' aria-label="เลื่อนลง">›</button>' +
      '<button data-rm="' + i + '" aria-label="เอาออก">×</button></div></div>').join('');
  $$('[data-mv]', box).forEach(b => b.addEventListener('click', () => {
    const [i, d] = b.dataset.mv.split(':').map(Number), j = i + d;
    [PENDING[i], PENDING[j]] = [PENDING[j], PENDING[i]];
    paintPending(root, w);
  }));
  $$('[data-rm]', box).forEach(b => b.addEventListener('click', () => {
    const p = PENDING.splice(Number(b.dataset.rm), 1)[0];
    if (p && p.url) URL.revokeObjectURL(p.url);
    paintPending(root, w);
  }));
  $('[data-send]', root).disabled = !PENDING.length;
  /* บอกล่วงหน้าตั้งแต่ก่อนกดส่ง ว่าตอนนี้ส่งไปจะช้าแค่ไหนและโดนหักเท่าไร */
  const late = lateMinAt(w, Date.now());
  $('[data-latewarn]', root).innerHTML = late > 0
    ? '<div class="notice warn">ตอนนี้เลยกำหนดส่งมา <b>' + spanText(late) + '</b> — ' +
      (w.mode === 'late' ? 'ส่งตอนนี้คะแนนงานนี้จะถูกหัก <b>' + penaltyOf(w, late) + '%</b>' : 'ส่งได้ งานนี้ไม่หักคะแนน') +
      (w.sub && w.sub.files.length && !(w.sub.lateMin > 0) ? '<br>คุณเคยส่งทันเวลาแล้ว ถ้าส่งใหม่ตอนนี้จะนับเป็น<b>ส่งช้า</b>' : '') + '</div>'
    : (w.sub && w.sub.files.length ? '<div class="notice info">ส่งใหม่ได้จนถึงกำหนดส่งโดยไม่ถือว่าช้า</div>' : '');
}

/** ย่อรูปก่อนส่ง — รูปจากกล้องมือถือ 3–6 MB ส่งช้าบนเน็ตโรงเรียน ย่อแล้วยังอ่านลายมือได้ชัด */
async function shrinkImage(file, maxSide) {
  let bmp = null, w, h;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    w = bmp.width; h = bmp.height;
  } catch (e) {
    bmp = await new Promise((ok, no) => {
      const im = new Image();
      im.onload = () => ok(im);
      im.onerror = () => no(new Error('เปิดรูป ' + file.name + ' ไม่ได้ — ลองถ่ายใหม่ หรือบันทึกเป็น JPG'));
      im.src = URL.createObjectURL(file);
    });
    w = bmp.naturalWidth; h = bmp.naturalHeight;
  }
  const k = Math.min(1, (maxSide || IMG_MAX_SIDE) / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  const cx = cv.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.drawImage(bmp, 0, 0, cv.width, cv.height);
  if (bmp.close) bmp.close();
  const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', IMG_QUALITY));
  if (!blob) throw new Error('ย่อรูป ' + file.name + ' ไม่สำเร็จ');
  /* รูปที่เล็กอยู่แล้วแต่ย่อแล้วกลับใหญ่ขึ้น ใช้ของเดิม */
  if (file.type === 'image/jpeg' && file.size <= blob.size && file.size < 1.5 * 1024 * 1024) return { blob: file, mime: 'image/jpeg' };
  return { blob: blob, mime: 'image/jpeg' };
}
function blobToBase64(blob) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(',')[1] || '');
    r.onerror = () => no(new Error('อ่านไฟล์ไม่ได้'));
    r.readAsDataURL(blob);
  });
}

let SENDING = false;
async function studentSend(w, root, sh) {
  if (SENDING || !PENDING.length) return;
  const late = lateMinAt(w, Date.now());
  if (late > 0) {
    /* กล่องยืนยันเปิดทับแผ่นเดิม พอปิดแล้วต้องเปิดแผ่นงานกลับมาพร้อมไฟล์ที่เลือกไว้ ไม่ว่าจะกดส่งหรือยกเลิก */
    const keep = PENDING.slice();
    const yes = await confirmBox('ส่งช้ากว่ากำหนด',
      '<div class="notice warn">คุณส่งช้ากว่ากำหนด <b>' + spanText(late) + '</b><br>' +
      (w.mode === 'late' ? 'คะแนนงานนี้จะถูกหัก <b>' + penaltyOf(w, late) + '%</b> (' + ruleText(w) + ')' : 'งานนี้ครูตั้งไว้ว่าไม่หักคะแนน') + '</div>' +
      '<div class="muted small">ส่งแล้วยังส่งใหม่ได้ แต่เวลาส่งจะนับจากครั้งล่าสุด</div>', 'ส่งงาน');
    sh = studentOpen(w.code);
    PENDING = keep;
    root = sh.root;
    paintPending(root, w);
    if (!yes) return;
  }
  SENDING = true;
  const btn = $('[data-send]', root), prog = $('[data-prog]', root), pt = $('[data-progtext]', root);
  btn.disabled = true; btn.textContent = 'กำลังส่ง…';
  $$('input,textarea,button', root).forEach(x => { if (!x.hasAttribute('data-close')) x.disabled = true; });
  prog.classList.remove('hide');
  const bar = $('i', prog);
  try {
    const ids = [];
    for (let i = 0; i < PENDING.length; i++) {
      const p = PENDING[i];
      pt.textContent = (p.kind === 'img' ? 'กำลังเตรียมรูปหน้า ' : 'กำลังเตรียมไฟล์ ') + (i + 1) + ' จาก ' + PENDING.length;
      let blob = p.file, mime = 'application/pdf';
      if (p.kind === 'img') { const s = await shrinkImage(p.file); blob = s.blob; mime = s.mime; }
      pt.textContent = 'กำลังอัปโหลด ' + (i + 1) + ' จาก ' + PENDING.length + ' (' + Math.round(blob.size / 1024) + ' KB)';
      const data = await blobToBase64(blob);
      let up = null, lastErr = null;
      /* เน็ตมือถือหลุดกลางทางบ่อย ลองซ้ำให้เองหนึ่งครั้งก่อนบอกนักเรียน */
      for (let k = 0; k < 2 && !up; k++) {
        try { up = await api('workUpload', { code: w.code, mime: mime, data: data }, 120000); }
        catch (e) { lastErr = e; if (e.auth) throw e; }
      }
      if (!up) throw lastErr;
      ids.push(up.id);
      bar.style.width = Math.round((i + 1) / (PENDING.length + 1) * 100) + '%';
    }
    pt.textContent = 'กำลังบันทึกการส่ง…';
    const note = $('[data-note]', root).value || '';
    const r = await api('workSubmit', { code: w.code, files: ids, note: note }, 60000);
    bar.style.width = '100%';
    const i = STU.data.works.findIndex(x => x.code === w.code);
    if (i >= 0) STU.data.works[i].sub = r.sub;
    SENDING = false;
    PENDING = [];
    sh.close();
    const s = r.sub;
    await confirmBoxOk(s.lateMin > 0 ? 'ส่งงานแล้ว · ส่งช้า' : 'ส่งงานเรียบร้อย',
      s.lateMin > 0
        ? '<div class="notice warn"><b>คุณส่งช้ากว่ากำหนด ' + spanText(s.lateMin) + '</b><br>' +
          (w.mode === 'late' ? 'คะแนนงานนี้ถูกหัก ' + s.penalty + '%' : 'งานนี้ไม่หักคะแนน') + '</div>'
        : '<div class="notice ok">ครูได้รับงาน “' + esc(w.title) + '” แล้ว เมื่อ ' + thDate(s.ts, true) + '</div>');
    studentLoad();
  } catch (e) {
    SENDING = false;
    if (e && e.auth) { sh.close(); return fail(e); }
    pt.textContent = '';
    prog.classList.add('hide');
    $$('input,textarea,button', root).forEach(x => { x.disabled = false; });
    btn.textContent = 'ลองส่งอีกครั้ง';
    toast(e.message || String(e), 5000);
  }
}
function confirmBoxOk(title, html) {
  return new Promise(resolve => {
    const sh = openSheet('<h2>' + esc(title) + '</h2>' + html +
      '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="primary" data-ok>ตกลง</button></div>', resolve);
    $('[data-ok]', sh.root).addEventListener('click', () => sh.close());
  });
}

/* ---- เปิดไฟล์ (ใช้ทั้งนักเรียนและครู) ---------------------------------------- */
const FILECACHE = new Map();
async function fileUrl(id) {
  if (FILECACHE.has(id)) return FILECACHE.get(id);
  const f = await api('workFile', { id: id }, 90000);
  const bin = atob(f.data), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const v = { url: URL.createObjectURL(new Blob([arr], { type: f.mime })), mime: f.mime, name: f.name };
  FILECACHE.set(id, v);
  return v;
}
/* ไม่ใช้ window.open เพราะ Safari บนไอแพดบล็อกหน้าต่างที่เปิดหลังรอโหลดเสร็จ จึงแสดงในแผ่นเล็กแทน
   withSave: มีปุ่มบันทึกลงเครื่อง (ใบงานจากครู) — เป็นลิงก์จริงที่ผู้ใช้แตะเอง ไม่สั่งคลิกจากสคริปต์
   ไฟล์ Word Excel PowerPoint แสดงในหน้าไม่ได้ จึงมีแต่ปุ่มบันทึก */
async function viewOwnFile(id, btn, title, withSave) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'กำลังเปิด…';
  try {
    const f = await fileUrl(id);
    const box = document.createElement('div');
    box.className = 'overlay';
    box.style.zIndex = 70;
    const save = withSave ? '<a class="dl" href="' + f.url + '" download="' + esc(f.name) + '">' + icon('down', 20) + 'ดาวน์โหลดลงเครื่อง</a>' : '';
    box.innerHTML = '<div class="sheet"><button class="x sm" data-x>ปิด</button><h2 style="padding-right:56px;word-break:break-word">' + esc(title || old) + '</h2>' +
      (f.mime === 'application/pdf'
        ? save + '<iframe src="' + f.url + '" title="PDF" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:6px;margin-top:10px"></iframe>' +
          '<p><a href="' + f.url + '" target="_blank" rel="noopener">เปิด PDF ในแท็บใหม่</a></p>'
        : /^image\//.test(f.mime)
          ? save + '<img alt="" src="' + f.url + '" style="max-width:100%;border:1px solid var(--line);border-radius:6px;margin-top:10px">'
          : '<div class="empty">' + icon('doc', 40) + '<br>' + esc(f.name) + '<br><span class="small">ไฟล์ชนิดนี้เปิดดูในหน้านี้ไม่ได้ ดาวน์โหลดแล้วเปิดด้วยแอปในเครื่อง</span></div>' + save) + '</div>';
    document.body.appendChild(box);
    const shut = () => box.remove();
    box.addEventListener('click', e => { if (e.target === box) shut(); });
    box.querySelector('[data-x]').addEventListener('click', shut);
  } catch (e) { fail(e); }
  finally { btn.disabled = false; btn.textContent = old; }
}

const T = { tab: 'works', works: null, resets: null, subs: null, board: null, gradeCode: '', filter: 'todo', boardCls: '', onlyRisk: true, timer: 0,
            fSubj: null, fCls: '', sel: new Set(), gCls: '', scores: null, sSubj: null, sCls: '', locks: null };

function teacherShell() {
  const pend = (T.resets ? T.resets.rows.filter(r => r.status === 'wait').length : 0) + (T.locks ? T.locks.rows.filter(r => r.locked).length : 0);
  const tabs = [['works', 'งานที่สั่ง'], ['grade', 'ตรวจงาน'], ['scores', 'คะแนนรวมรายวิชา'], ['watch', 'นักเรียนที่ต้องติดตาม'], ['reset', 'ปลดล็อกรหัส']];
  $('#view').innerHTML = '<div class="tabs" role="tablist">' + tabs.map(t =>
    '<button data-tab="' + t[0] + '" class="' + (T.tab === t[0] ? 'on' : '') + '">' + t[1] +
    (t[0] === 'reset' && pend ? '<span class="n">' + pend + '</span>' : '') + '</button>').join('') + '</div><div id="pane"></div>';
  $$('[data-tab]').forEach(b => b.addEventListener('click', () => { T.tab = b.dataset.tab; teacherShell(); }));
  clearInterval(T.timer);
  if (T.tab === 'works') paneWorks();
  else if (T.tab === 'grade') paneGrade();
  else if (T.tab === 'scores') paneScores();
  else if (T.tab === 'watch') paneWatch();
  else paneReset();
}

/** ชื่อวิชาที่แสดง — งานที่ไม่ได้ใส่วิชาไว้รวมกันเป็นกลุ่มเดียว */
const subjName = s => s ? s : 'ไม่ระบุวิชา';
/** ตัวเลือกวิชาและห้องจากรายการงาน — ใช้ทั้งแท็บงานที่สั่งและคะแนนรวม */
function subjOptions(list, cur) {
  const subs = Array.from(new Set(list.map(w => w.subject || ''))).sort((a, b) => a.localeCompare(b, 'th'));
  return '<option value="*"' + (cur == null ? ' selected' : '') + '>ทุกวิชา</option>' +
    subs.map(s => '<option value="' + esc(s) + '"' + (cur === s ? ' selected' : '') + '>' + esc(subjName(s)) + '</option>').join('');
}
function clsOptions(classes, cur) {
  return '<option value="">ทุกห้อง</option>' + classes.map(c => '<option' + (c === cur ? ' selected' : '') + '>' + esc(c) + '</option>').join('');
}
const byTh = (a, b) => String(a).localeCompare(String(b), 'th', { numeric: true });

async function teacherLoad() {
  if (T.noWork) {
    T.tab = 'reset'; T.works = [];
    try { T.resets = await api('resetList', {}); } catch (e) { T.resets = null; }
    teacherShell();
    $('#pane').insertAdjacentHTML('beforebegin', '<div class="notice warn">ยังเชื่อมกับชีตส่งงานไม่ได้ จึงเปิดได้เฉพาะคำขอรหัสผ่าน — ' +
      'ผู้ดูแลหลักกด “เชื่อมทุกชีต” ที่หน้าหลัก แล้วออกจากระบบและลงชื่อใหม่</div>');
    return;
  }
  try {
    const [works, resets] = await Promise.all([api('workList', {}), api('resetList', {}).catch(e => ({ err: e }))]);
    T.works = works;
    T.resets = resets && resets.err ? null : resets;
    teacherShell();
    /* ตัวเลขบนแท็บปลดล็อกรหัสรวมคนที่ถูกพักจากทุกแอป — ดึงเบื้องหลัง ไม่ให้หน้างานที่สั่งต้องรอ */
    if (T.tab !== 'reset') loadLocks().then(resetTabBadge, () => {});
  } catch (e) {
    if (e.auth) return fail(e);
    $('#view').innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>';
  }
}

/* ---- แท็บงานที่สั่ง ------------------------------------------------------- */
function paneWorks() {
  const now = Date.now();
  const classes = Array.from(new Set(T.works.flatMap(w => w.cls))).sort(byTh);
  if (T.fCls && classes.indexOf(T.fCls) < 0) T.fCls = '';
  const shown = T.works.filter(w => (T.fSubj == null || (w.subject || '') === T.fSubj) && (!T.fCls || w.cls.indexOf(T.fCls) >= 0));
  /* งานที่เลือกไว้แต่ถูกกรองหายไป ไม่นับรวม — ลบเฉพาะที่ครูมองเห็นอยู่ จะได้ไม่เผลอลบของที่ไม่ได้ดู */
  const codes = new Set(shown.map(w => w.code));
  Array.from(T.sel).forEach(c => { if (!codes.has(c)) T.sel.delete(c); });
  let h = '<div class="row" style="margin-bottom:12px"><button class="primary" data-new>+ สั่งงานใหม่</button>' +
    '<span class="sp"></span><button class="sm" data-reload>โหลดใหม่</button></div>';
  if (!T.works.length) {
    h += '<div class="panel"><div class="empty">ยังไม่มีงานที่สั่ง<br><span class="small">กด “สั่งงานใหม่” แล้วนักเรียนในชั้นนั้นจะเห็นงานทันทีที่เปิดหน้าส่งงาน</span></div></div>';
  } else {
    h += '<div class="panel" style="padding:12px 14px"><div class="row">' +
      '<select data-fsubj style="width:auto;min-width:150px">' + subjOptions(T.works, T.fSubj) + '</select>' +
      '<select data-fcls style="width:auto;min-width:120px">' + clsOptions(classes, T.fCls) + '</select>' +
      '<span class="small muted">แสดง ' + shown.length + ' จาก ' + T.works.length + ' งาน</span><span class="sp"></span>' +
      '<label class="small row" style="gap:6px"><input type="checkbox" data-selall style="width:18px;min-height:18px"' +
        (shown.length && shown.every(w => T.sel.has(w.code)) ? ' checked' : '') + '> เลือกทั้งหมด</label>' +
      '<button class="sm danger" data-delsel' + (T.sel.size ? '' : ' disabled') + '>ลบที่เลือก' + (T.sel.size ? ' (' + T.sel.size + ')' : '') + '</button></div></div>';
    h += '<div class="panel" style="padding:4px 14px"><div class="list" style="border-top:0">' + (shown.length ? shown.map(w => {
      const st = w.stats, pct = st.roster ? Math.round(st.sent / st.roster * 100) : 0;
      return '<div class="item" style="cursor:default"><input type="checkbox" data-sel="' + esc(w.code) + '" aria-label="เลือกงาน ' + esc(w.title) + '"' +
        (T.sel.has(w.code) ? ' checked' : '') + ' style="width:20px;min-height:20px;margin-top:3px;flex:none"><div class="bd">' +
        '<div class="tt">' + esc(w.title) + (w.subject ? ' <span class="chip">' + esc(w.subject) + '</span>' : '') + '</div>' +
        '<div class="ln">' + esc(w.cls.join(', ')) + ' · ' + dueLine(w, now) + '</div>' +
        '<div class="ln">เต็ม ' + fmtN(w.max) + ' · ' + ruleText(w) +
          ((w.sheets || []).length ? ' · <span style="color:var(--brand)">ใบงาน ' + w.sheets.length + ' ไฟล์</span>' : '') + '</div>' +
        '<div class="ln count">ส่งแล้ว <b style="color:var(--ink)">' + st.sent + '/' + st.roster + '</b>' +
          (st.late ? ' · ส่งช้า ' + st.late : '') + ' · ตรวจแล้ว ' + st.graded +
          (st.toGrade ? ' · <b style="color:var(--brand)">รอตรวจ ' + st.toGrade + '</b>' : '') + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<div class="row" style="flex-direction:column;align-items:stretch;gap:6px">' +
          '<button class="sm primary" data-grade="' + esc(w.code) + '">ตรวจงาน</button>' +
          '<button class="sm" data-edit="' + esc(w.code) + '">แก้ไข</button></div></div>';
    }).join('') : '<div class="empty">ไม่มีงานที่ตรงกับตัวกรอง</div>') + '</div></div>';
  }
  $('#pane').innerHTML = h;
  $('[data-new]').addEventListener('click', () => workForm(null));
  $('[data-reload]').addEventListener('click', teacherLoad);
  const fs = $('[data-fsubj]');
  if (fs) {
    fs.addEventListener('change', e => { T.fSubj = e.target.value === '*' ? null : e.target.value; paneWorks(); });
    $('[data-fcls]').addEventListener('change', e => { T.fCls = e.target.value; paneWorks(); });
    $('[data-selall]').addEventListener('change', e => { shown.forEach(w => e.target.checked ? T.sel.add(w.code) : T.sel.delete(w.code)); paneWorks(); });
    $$('[data-sel]').forEach(c => c.addEventListener('change', () => { c.checked ? T.sel.add(c.dataset.sel) : T.sel.delete(c.dataset.sel); paneWorks(); }));
    $('[data-delsel]').addEventListener('click', deleteSelected);
  }
  $$('[data-grade]').forEach(b => b.addEventListener('click', () => { T.gradeCode = b.dataset.grade; T.subs = null; T.tab = 'grade'; teacherShell(); }));
  $$('[data-edit]').forEach(b => b.addEventListener('click', () => workForm(T.works.find(w => w.code === b.dataset.edit))));
}

/** ลบงานที่ติ๊กไว้ทีละงาน — ชีตตรวจสิทธิ์ทุกงาน งานไหนลบไม่ได้ก็บอกชื่อ ส่วนที่เหลือยังลบต่อ */
async function deleteSelected() {
  const list = T.works.filter(w => T.sel.has(w.code));
  if (!list.length) return;
  const sent = list.reduce((n, w) => n + w.stats.sent, 0);
  const yes = await confirmBox('ลบงาน ' + list.length + ' งาน',
    '<div class="tw"><table><tbody>' + list.map(w => '<tr><td>' + esc(w.title) + '</td><td class="small muted">' + esc(subjName(w.subject)) +
      ' · ' + esc(w.cls.join(', ')) + '</td><td class="num small">ส่งแล้ว ' + w.stats.sent + '</td></tr>').join('') + '</tbody></table></div>' +
    '<p class="muted small">นักเรียนจะไม่เห็นงานเหล่านี้อีก' + (sent ? ' · งานที่ส่งมาแล้ว ' + sent + ' ชิ้น คะแนนและไฟล์ยังเก็บไว้ในชีตและ Drive ครบ' : '') +
    ' — กู้คืนได้ด้วยการแก้คอลัมน์ "เปิดใช้งาน" ในแผ่น works</p>', 'ลบ ' + list.length + ' งาน', true);
  if (!yes) return;
  const bad = [];
  let done = 0;
  for (const w of list) {
    try { await api('workRemove', { code: w.code }); done++; T.sel.delete(w.code); }
    catch (e) { if (e.auth) return fail(e); bad.push(w.title + ': ' + e.message); }
  }
  toast('ลบแล้ว ' + done + ' งาน' + (bad.length ? ' · ลบไม่ได้ ' + bad.length : ''), 3600);
  if (bad.length) confirmBoxOk('บางงานลบไม่ได้', '<div class="notice warn">' + bad.map(esc).join('<br>') + '</div>');
  teacherLoad();
}

/** ชั้นที่ครูน่าจะใช้ — ชั้นที่ดูแล (ครูผู้สอน) กับชั้นที่เคยสั่งงานไปแล้ว */
function knownClasses() {
  const set = new Set();
  const p = ME.s.profile || {};
  (p.classes || []).forEach(c => set.add(c));
  (T.works || []).forEach(w => w.cls.forEach(c => set.add(c)));
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'th', { numeric: true }));
}
const localInput = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());

function workForm(w) {
  const due = w ? new Date(w.dueAt) : (() => { const d = new Date(); d.setDate(d.getDate() + 7); d.setHours(16, 30, 0, 0); return d; })();
  const cls = knownClasses();
  const sh = openSheet('<h2>' + (w ? 'แก้ไขงาน' : 'สั่งงานใหม่') + '</h2>' +
    '<label class="f">ชื่องาน</label><input data-f="title" maxlength="120" placeholder="เช่น ใบงานที่ 3 กฎการเคลื่อนที่ของนิวตัน" value="' + esc(w ? w.title : '') + '">' +
    '<div class="grid2"><div><label class="f">วิชา <span class="muted">(ไม่บังคับ)</span></label><input data-f="subject" maxlength="60" placeholder="เช่น ฟิสิกส์ ม.4" value="' + esc(w ? w.subject : '') + '"></div>' +
    '<div><label class="f">คะแนนเต็ม</label><input data-f="max" type="number" min="0.5" max="1000" step="0.5" inputmode="decimal" value="' + esc(w ? w.max : 10) + '"></div></div>' +
    '<label class="f">ชั้นที่สั่ง <span class="muted">(คั่นด้วยจุลภาค)</span></label><input data-f="cls" placeholder="เช่น ม.4/1, ม.4/2" value="' + esc(w ? w.cls.join(', ') : '') + '">' +
    (cls.length ? '<div class="row" style="margin-top:6px;gap:6px">' + cls.map(c => '<button class="sm" data-addcls="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>' : '') +
    '<div class="grid2"><div><label class="f">กำหนดส่ง (วัน)</label><input data-f="date" type="date" value="' + localInput(due) + '"></div>' +
    '<div><label class="f">เวลา</label><input data-f="time" type="time" value="' + p2(due.getHours()) + ':' + p2(due.getMinutes()) + '"></div></div>' +
    '<label class="f">รายละเอียด / คำสั่ง <span class="muted">(ไม่บังคับ)</span></label><textarea data-f="detail" maxlength="2000" placeholder="เช่น ทำข้อ 1–10 ถ่ายรูปให้เห็นวิธีทำครบ">' + esc(w ? w.detail : '') + '</textarea>' +
    '<label class="f">ใบงานให้นักเรียนโหลด <span class="muted">(ไม่บังคับ · PDF รูป Word Excel PowerPoint ไม่เกิน 10 MB ต่อไฟล์)</span></label>' +
    '<div data-sheets></div>' +
    '<label class="shpick">' + icon('doc', 20) + '<span>แทรกใบงาน</span><input type="file" multiple accept="' + SHEET_ACCEPT + '" data-sheetpick></label>' +
    '<label class="f">การให้คะแนน</label>' +
    '<div class="seg2" data-mode><button data-m="same">คะแนนเท่ากัน ไม่ว่าส่งเมื่อไร</button><button data-m="late">ตามเวลาที่ส่ง</button></div>' +
    '<div data-lateopts class="grid2" style="margin-top:4px"><div><label class="f">หักต่อวันที่ช้า (%)</label><input data-f="perDay" type="number" min="1" max="100" inputmode="numeric" value="' + esc(w && w.mode === 'late' ? w.perDay : 10) + '"></div>' +
    '<div><label class="f">หักรวมไม่เกิน (%)</label><input data-f="cap" type="number" min="0" max="100" inputmode="numeric" value="' + esc(w && w.mode === 'late' ? w.cap : 50) + '"></div></div>' +
    '<div class="notice info small" data-ruleprev></div>' +
    '<div class="row" style="margin-top:16px">' + (w ? '<button class="danger" data-del>ลบงาน</button>' : '') +
    '<span class="sp"></span><button data-close>ยกเลิก</button><button class="primary" data-save>' + (w ? 'บันทึก' : 'สั่งงาน') + '</button></div>');
  const root = sh.root, f = k => $('[data-f="' + k + '"]', root);
  let mode = w ? w.mode : 'late';
  const paintMode = () => {
    $$('[data-m]', root).forEach(b => b.classList.toggle('on', b.dataset.m === mode));
    $('[data-lateopts]', root).classList.toggle('hide', mode !== 'late');
    const x = { mode: mode, perDay: Number(f('perDay').value) || 0, cap: f('cap').value === '' ? 100 : Number(f('cap').value) };
    $('[data-ruleprev]', root).innerHTML = '<b>ไม่มีปิดรับ</b> นักเรียนส่งได้ตลอด ส่งหลังกำหนดจะถูกแจ้งว่า “ส่งช้ากว่ากำหนด”<br>' +
      (mode === 'late'
        ? 'ส่งช้า 1 วัน หัก ' + penaltyOf(x, 1) + '% · 3 วัน หัก ' + penaltyOf(x, 3 * 1440) + '% · 7 วัน หัก ' + penaltyOf(x, 7 * 1440) + '%' +
          '<br><span class="muted">ช้าไม่ถึงวันนับเป็นหนึ่งวัน · เลื่อนกำหนดส่งทีหลัง คะแนนที่หักคิดใหม่ให้เอง</span>'
        : 'ทุกคนที่ส่งได้คะแนนตามที่ครูให้ ไม่หักตามเวลา');
  };
  $$('[data-m]', root).forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; paintMode(); }));
  ['perDay', 'cap'].forEach(k => f(k).addEventListener('input', paintMode));
  $$('[data-addcls]', root).forEach(b => b.addEventListener('click', () => {
    const cur = f('cls').value.split(/[,\s]+/).filter(Boolean);
    if (cur.indexOf(b.dataset.addcls) < 0) cur.push(b.dataset.addcls);
    f('cls').value = cur.join(', ');
  }));
  paintMode();

  /* ใบงาน — ของเดิมกดเอาออกได้ (ขีดฆ่าไว้ กดอีกครั้งเพื่อเก็บไว้) ของใหม่รอในเครื่อง
     ทั้งหมดเกิดจริงตอนกดบันทึก งานใหม่ยังไม่มีรหัสงานจนกว่าจะบันทึก จึงต้องบันทึกงานก่อนแล้วค่อยอัปโหลด */
  const oldSheets = w ? (w.sheets || []) : [], drop = new Set(), fresh = [];
  const paintSheets = () => {
    const box = $('[data-sheets]', root);
    const rows = oldSheets.map(x => sheetRow(x,
        (drop.has(x.id) ? '' : '<button class="sm" data-shopen="' + esc(x.id) + '">เปิด</button>') +
        '<button class="sm' + (drop.has(x.id) ? '' : ' danger') + '" data-shdrop="' + esc(x.id) + '">' + (drop.has(x.id) ? 'เก็บไว้' : 'เอาออก') + '</button>',
        drop.has(x.id) ? 'gone' : ''))
      .concat(fresh.map((x, i) => sheetRow(x, '<span class="chip ok">ใหม่</span><button class="sm" data-shrm="' + i + '" aria-label="เอาออก">×</button>', 'new')));
    box.innerHTML = rows.length ? '<div class="shlist">' + rows.join('') + '</div>' : '';
    $$('[data-shopen]', box).forEach(b => b.addEventListener('click', () =>
      viewOwnFile(b.dataset.shopen, b, (oldSheets.find(x => x.id === b.dataset.shopen) || {}).name, true)));
    $$('[data-shdrop]', box).forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.shdrop;
      if (drop.has(id)) drop.delete(id); else drop.add(id);
      paintSheets();
    }));
    $$('[data-shrm]', box).forEach(b => b.addEventListener('click', () => { fresh.splice(Number(b.dataset.shrm), 1); paintSheets(); }));
  };
  $('[data-sheetpick]', root).addEventListener('change', e => {
    for (const file of Array.from(e.target.files || [])) {
      const mime = sheetMime(file);
      if (oldSheets.length - drop.size + fresh.length >= SHEETS_MAX) { toast('แนบใบงานได้ไม่เกิน ' + SHEETS_MAX + ' ไฟล์ต่องาน'); break; }
      if (!mime) { toast(file.name + ' — แนบได้เฉพาะ PDF รูป Word Excel PowerPoint', 4000); continue; }
      /* รูปใหญ่ถูกย่อตอนส่งอยู่แล้ว ที่ต้องกันคือไฟล์เอกสาร */
      if (!/^image\//.test(mime) && file.size > SHEET_MAX) { toast(file.name + ' ใหญ่เกิน 10 MB — ลองบันทึกเป็น PDF หรือบีบอัดก่อน', 4500); continue; }
      fresh.push({ file: file, name: file.name, mime: mime, size: file.size });
    }
    e.target.value = '';
    paintSheets();
  });
  paintSheets();

  $('[data-save]', root).addEventListener('click', async e => {
    const btn = e.currentTarget;
    const [yy, mm, dd] = f('date').value.split('-').map(Number), [hh, mi] = (f('time').value || '16:30').split(':').map(Number);
    const dueAt = new Date(yy, (mm || 1) - 1, dd || 1, hh || 0, mi || 0);
    if (!f('date').value || isNaN(dueAt)) return toast('เลือกวันกำหนดส่งก่อน');
    btn.disabled = true;
    let saved = null;
    try {
      saved = await api('workSave', { work: {
        code: w ? w.code : '', title: f('title').value, subject: f('subject').value, detail: f('detail').value,
        cls: f('cls').value, dueAt: dueAt.toISOString(), max: f('max').value, mode: mode,
        perDay: f('perDay').value, cap: f('cap').value
      } });
    } catch (err) { btn.disabled = false; return fail(err); }
    if (drop.size || fresh.length) $$('button,input,textarea,label', root).forEach(x => { x.disabled = true; x.style.pointerEvents = 'none'; });
    /* งานบันทึกแล้ว ต่อจากนี้ถ้าไฟล์ไหนพลาด บอกครูว่าไฟล์ไหน แล้วกดแก้ไขเพื่อแนบใหม่ได้ */
    const failed = [];
    let authErr = null;
    for (const id of drop) {
      btn.textContent = 'กำลังเอาใบงานออก…';
      try { await api('workSheetDel', { code: saved.code, id: id }); }
      catch (err) { if (err.auth) { authErr = err; break; } failed.push('เอาออก ' + (oldSheets.find(x => x.id === id) || {}).name + ': ' + err.message); }
    }
    for (let i = 0; i < fresh.length && !authErr; i++) {
      const x = fresh[i];
      btn.textContent = 'กำลังอัปโหลดใบงาน ' + (i + 1) + '/' + fresh.length + '…';
      try {
        let blob = x.file, mime = x.mime;
        if (/^image\//.test(mime) && (x.size > 2 * 1024 * 1024 || !/^image\/(jpeg|png|webp)$/.test(mime))) {
          const s = await shrinkImage(x.file, SHEET_IMG_SIDE); blob = s.blob; mime = s.mime;
        }
        if (blob.size > SHEET_MAX) throw new Error('ใหญ่เกิน 10 MB');
        const data = await blobToBase64(blob);
        let ok = false, last = null;
        for (let k = 0; k < 2 && !ok; k++) {
          try { await api('workSheetAdd', { code: saved.code, name: x.name, mime: mime, data: data }, 180000); ok = true; }
          catch (err) { last = err; if (err.auth || /รุ่นเก่า|ไม่เกิน|เฉพาะ/.test(err.message)) break; }
        }
        if (!ok) throw last;
      } catch (err) {
        if (err.auth) { authErr = err; break; }
        failed.push(x.name + ': ' + err.message);
      }
    }
    sh.close();
    if (authErr) return fail(authErr);
    if (failed.length) {
      confirmBoxOk('บันทึกงานแล้ว แต่ใบงานบางไฟล์ไม่สำเร็จ',
        '<div class="notice warn">' + failed.map(esc).join('<br>') + '</div>' +
        '<p class="muted small">กด “แก้ไข” ที่งานนี้แล้วแทรกใบงานใหม่อีกครั้ง</p>');
    } else {
      toast(w ? 'บันทึกแล้ว' : 'สั่งงานแล้ว นักเรียนเห็นได้ทันที');
    }
    teacherLoad();
  });
  const del = $('[data-del]', root);
  if (del) del.addEventListener('click', async () => {
    sh.close();
    const yes = await confirmBox('ลบงาน “' + w.title + '”',
      '<p>นักเรียนจะไม่เห็นงานนี้อีก คะแนนและไฟล์ที่ส่งมายังเก็บไว้ในชีตและ Drive ครบ</p>', 'ลบงาน', true);
    if (!yes) return;
    try { await api('workRemove', { code: w.code }); toast('ลบงานแล้ว'); teacherLoad(); } catch (e) { fail(e); }
  });
}

/* ---- แท็บตรวจงาน ---------------------------------------------------------- */
async function paneGrade() {
  const works = T.works || [];
  if (!works.length) { $('#pane').innerHTML = '<div class="panel"><div class="empty">ยังไม่มีงานให้ตรวจ</div></div>'; return; }
  if (!T.gradeCode || !works.find(w => w.code === T.gradeCode)) {
    const todo = works.find(w => w.stats.toGrade);
    T.gradeCode = (todo || works[0]).code;
    T.subs = null;
  }
  $('#pane').innerHTML = '<div class="row" style="margin-bottom:10px"><select data-pickwork style="max-width:520px">' +
    works.map(w => '<option value="' + esc(w.code) + '"' + (w.code === T.gradeCode ? ' selected' : '') + '>' + esc(w.title) + ' · ' + esc(w.cls.join(', ')) +
      (w.stats.toGrade ? ' (รอตรวจ ' + w.stats.toGrade + ')' : '') + '</option>').join('') + '</select></div><div id="gbody"><div class="empty">กำลังโหลด…</div></div>';
  $('[data-pickwork]').addEventListener('change', e => { T.gradeCode = e.target.value; T.subs = null; paneGrade(); });
  if (!T.subs || T.subs.work.code !== T.gradeCode) {

  }
  gradeBody();
}

const hasFiles = r => !!(r.sub && r.sub.files.length);
const needsGrade = r => hasFiles(r) && (!r.sub.graded || r.sub.resent);
/** สถานะการส่ง — ต้องตรงกับ sendState_ ในโค้ดชีต (ontime · late · paper · miss · todo) */
function stateOf(r, w, now) {
  if (hasFiles(r)) return r.sub.lateMin > 0 ? 'late' : 'ontime';
  if (r.sub && r.sub.graded) return 'paper';
  const due = new Date(w.dueAt).getTime();
  return due && due <= now ? 'miss' : 'todo';
}
/** แถวของงานที่เปิดอยู่ หลังกรองห้อง (งานที่สั่งหลายห้อง) */
function scopedRows() {
  const rows = T.subs.rows;
  return T.gCls ? rows.filter(r => r.cls === T.gCls) : rows;
}
function gradeRows() {
  const rows = scopedRows(), w = T.subs.work, now = Date.now();
  if (T.filter === 'todo') return rows.filter(needsGrade);
  if (T.filter === 'late') return rows.filter(r => stateOf(r, w, now) === 'late');
  if (T.filter === 'ontime') return rows.filter(r => stateOf(r, w, now) === 'ontime');
  if (T.filter === 'none') return rows.filter(r => !hasFiles(r) && !(r.sub && r.sub.graded));
  return rows;
}

  const S = T.subs, w = S.work, now = Date.now();

  const rows = scopedRows();

      '<button class="sm" data-notify="late"' + (cnt.late ? '' : ' disabled') + '>⏰ ส่งไม่ตรงกำหนด (' + cnt.late + ')</button>' +
      '<button class="sm" data-notify="ontime"' + (cnt.ontime ? '' : ' disabled') + '>🌟 ส่งตรงกำหนด (' + cnt.ontime + ')</button></div>' +
    '<div class="row" style="margin-top:10px"><div class="seg2">' +
      [['todo', 'รอตรวจ'], ['all', 'ทั้งหมด'], ['ontime', 'ตรงกำหนด'], ['late', 'ส่งช้า'], ['none', 'ยังไม่ส่ง']].map(x =>
        '<button data-flt="' + x[0] + '" class="' + (T.filter === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>' +
      '<span class="sp"></span>' + (todo ? '<button class="primary" data-start>เริ่มตรวจ (' + todo + ')</button>' : '') +
      '<button class="sm" data-copy>คัดลอกคะแนน</button><button class="sm" data-reload>โหลดใหม่</button></div>' +
    (todo ? '<div class="row" style="margin-top:10px;gap:8px"><span class="small">ให้คะแนนเท่ากันทุกคนที่ส่งแล้วแต่ยังไม่ตรวจ</span>' +
      '<input data-bulk type="number" min="0" max="' + esc(w.max) + '" step="0.5" inputmode="decimal" style="width:90px;min-height:36px" value="' + esc(w.max) + '">' +
      '<button class="sm" data-bulkgo>ให้ ' + todo + ' คน</button>' +
      (w.mode === 'late' ? '<span class="small muted">คนที่ส่งช้าจะถูกหักตามเวลาให้เอง</span>' : '') + '</div>' : '') +
    '</div>';
  h += '<div class="panel" style="padding:0"><div class="tw" style="border:0">' + (list.length ? '<table><thead><tr><th>เลขที่</th><th>ชื่อ</th>' + (multi ? '<th>ชั้น</th>' : '') +
    '<th>ส่งเมื่อ</th><th class="num">ไฟล์</th><th class="num">คะแนน</th><th class="num">หลังหัก</th><th></th></tr></thead><tbody>' +
    list.map(r => {
      const s = r.sub;
      const when = hasFiles(r)
        ? thDate(s.ts) + (s.lateMin > 0 ? ' <span class="chip warn">ช้า ' + spanText(s.lateMin) + (s.penalty ? ' −' + s.penalty + '%' : '') + '</span>' : '') +
          (s.resent ? ' <span class="chip brand">ส่งใหม่</span>' : '')

      return '<tr class="pick" data-row="' + esc(r.sid) + '"><td class="num">' + esc(r.no) + '</td><td class="nm">' + esc(r.name) + '</td>' + (multi ? '<td>' + esc(r.cls) + '</td>' : '') +

  $$('[data-notify]').forEach(b => b.addEventListener('click', () =>
    notifyForm(w, b.dataset.notify, rows.filter(r => stateOf(r, w, Date.now()) === b.dataset.notify))));
  $('[data-reload]').addEventListener('click', () => { T.subs = null; paneGrade(); });
  $('[data-copy]').addEventListener('click', copyScores);
  const st = $('[data-start]'); if (st) st.addEventListener('click', () => openViewer(rows.find(needsGrade).sid));
  const bg = $('[data-bulkgo]'); if (bg) bg.addEventListener('click', bulkGrade);
  $$('[data-view]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openViewer(b.dataset.view); }));
  $$('tr[data-row]').forEach(tr => tr.addEventListener('click', e => {
    if (e.target.closest('input,button')) return;
    if (hasFiles(rows.find(r => r.sid === tr.dataset.row))) openViewer(tr.dataset.row);

  $$('[data-score]').forEach(inp => {
    inp.addEventListener('change', () => saveScore(inp.dataset.score, inp.value, null, inp));
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const all = $$('[data-score]'), i = all.indexOf(inp);
