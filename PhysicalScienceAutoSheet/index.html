      'โหลดหน้านี้ใหม่เพื่อลงชื่อเข้าใช้</div>';
  }
  return h + '</div>';
}

function bindCloudCard() {
  const test = $('#btnCloudTest');
  if (test) test.addEventListener('click', async () => {
    const url = ($('#cloudUrl').value || '').trim();
    const msg = $('#cloudMsg');
    if (!url) {
      DB.cloud.url = ''; clearAuth(); save(true); render();
      toast('ตัดการเชื่อมต่อแล้ว ใช้งานในเครื่องอย่างเดียว', 'ok');
      return;
    }
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(url)) {
      msg.innerHTML = '<div class="notice bad">URL ไม่ถูกรูปแบบ — ต้องลงท้ายด้วย <code>/exec</code> ' +
        'และขึ้นต้นด้วย <code>https://script.google.com/macros/s/</code></div>';
      return;
    }
    msg.innerHTML = '<div class="hint">กำลังทดสอบ… (วัดสองรอบเพื่อดูว่าช้าเพราะอะไร)</div>';
    const prev = DB.cloud.url;
    const t0 = Date.now();
    DB.cloud.url = url;
    try {
      const r = await api('ping', {}, { noToken: true });
      save(true);
      const ms = Date.now() - t0;
      // วัดซ้ำอีกรอบทันที เพื่อแยกสาเหตุความช้าให้ชัด
      //   รอบแรกช้า รอบสองเร็ว = เสียเวลาไปกับการ "ปลุก" สคริปต์ที่หลับอยู่ (cold start)
      //   ช้าทั้งสองรอบ         = ตัว ping เองอ่านข้อมูลในชีตมากเกินไป
      let ms2 = null;
      try { const t1 = Date.now(); await api('ping', {}, { noToken: true }); ms2 = Date.now() - t1; }
      catch (e2) { /* รอบสองล้มเหลวก็ไม่เป็นไร ใช้ผลรอบแรกรายงานต่อได้ */ }
      msg.innerHTML = '<div class="notice info">เชื่อมต่อสำเร็จใน <b>' + (ms / 1000).toFixed(1) + ' วินาที</b>' +
        (ms2 != null ? ' <span class="hint">(รอบสอง ' + (ms2 / 1000).toFixed(1) + ' วินาที)</span>' : '') +
        ' — พบรายชื่อในชีต <b>' + r.students + ' คน</b>' +
        (r.assignments != null ? ' · ใบงาน ' + r.assignments + ' ใบ · ผลที่ส่งแล้ว ' + r.submissions + ' รายการ' : '') +
        (r.version >= 4 ? '' : '<br><b>สคริปต์ในชีตยังเป็นรุ่นเก่า</b> — วางไฟล์ <code>appsscript-Code.gs</code> ' +
          'รุ่นล่าสุดแล้วกด <b>ทำให้ใช้งานได้ใหม่</b> เพื่อให้ส่งรายชื่อเร็วขึ้นและไม่เกิดรายชื่อซ้ำ') +
        (r.needRepair ? '<br><b style="color:var(--bad)">โครงสร้างชีตยังไม่ถูกต้อง</b> — ' +
          (r.layout === 'old' ? 'คอลัมน์เรียงแบบเก่า และ' : '') +
          'อาจไม่มีแถวหัวตาราง ทำให้อ่านเลขประจำตัวไม่ได้เลย<br>' +
          'กดปุ่ม <b>ซ่อมโครงสร้างชีต</b> ด้านล่างหนึ่งครั้ง' : '') +
        (r.sample && r.sample.length
          ? '<br><span class="hint">เลขประจำตัวที่อ่านได้จากชีต: ' +
            esc(r.sample.filter(Boolean).join(', ')) + (r.students > r.sample.length ? ' …' : '') + '</span>'
          : (r.students ? '<br><span style="color:var(--bad)">อ่านเลขประจำตัวจากชีตไม่ได้เลย ' +
             'ตรวจว่าคอลัมน์แรกของแผ่น students คือ <code>sid</code></span>' : '')) +
        (r.badSid ? '<br><span style="color:var(--warn)">มี ' + r.badSid + ' คนในชีตที่เลขประจำตัวผิดรูปแบบ ' +
          'จะเข้าระบบไม่ได้ — แก้รายชื่อในเครื่องแล้วส่งขึ้นใหม่</span>' : '') +
        (r.dupSid ? '<br><span style="color:var(--warn)">มีเลขประจำตัวซ้ำในชีต ' + r.dupSid +
          ' แถว — กด <b>ลบแถวซ้ำในชีต</b> เพื่อซ่อม</span>' : '') +
        (r.blankSid ? '<br><span style="color:var(--warn)">มี ' + r.blankSid +
          ' แถวที่ไม่มีเลขประจำตัว — คนเหล่านี้เข้าระบบไม่ได้</span>' : '') +
        (r.hasAdmin ? '' : '<br><b>ยังไม่ได้ตั้งรหัสผู้ดูแล</b> ให้ไปเรียกฟังก์ชัน ' +
        '<code>setupFirstTime</code> ในหน้า Apps Script ก่อน') +
        (ms > 6000 || (ms2 != null && ms2 > 6000) ? '<br>' + cloudSpeedNote(ms, ms2, r) : '') +
        '</div>';
      if (!authValid()) setTimeout(() => { GATE.mode = 'admin'; renderGate(); }, 900);
    } catch (e) {
      DB.cloud.url = prev;
      msg.innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>';
    }
  });

  const cp = $('#btnChgPass'); if (cp) cp.addEventListener('click', () => forceChangePass(true));
  const fl = $('#btnFlush');   if (fl) fl.addEventListener('click', () => flushOutbox(true));
  const pr = $('#btnPushRoster'); if (pr) pr.addEventListener('click', pushRoster);
  const gr = $('#btnPullRoster'); if (gr) gr.addEventListener('click', pullRoster);
  const dd = $('#btnDedupe'); if (dd) dd.addEventListener('click', dedupeRoster);
  const fx = $('#btnRepair'); if (fx) fx.addEventListener('click', () => repairSheet(false));
  const mk = $('#btnMakeStudentFile'); if (mk) mk.addEventListener('click', makeStudentFile);
  const rp = $('#btnResetPass');  if (rp) rp.addEventListener('click', resetStudentPass);
  const ap = $('#btnAdminPass');  if (ap) ap.addEventListener('click', changeAdminPass);
}

/** วินิจฉัยว่าการเชื่อมต่อที่ช้า เกิดจากอะไร แล้วบอกวิธีแก้ให้ตรงจุด
    แยกด้วยการเทียบเวลารอบแรกกับรอบสอง เพราะสองสาเหตุนี้แก้คนละวิธีกันโดยสิ้นเชิง */
function cloudSpeedNote(ms, ms2, r) {
  const nStu = (r && r.students) || 0, nAsg = (r && r.assignments) || 0, nSub = (r && r.submissions) || 0;
  // รอบสองเร็วกว่ารอบแรกมาก แปลว่าเวลาส่วนใหญ่หมดไปกับการปลุกสคริปต์ ไม่ใช่การอ่านข้อมูล
  const coldStart = ms2 != null && ms2 < ms * 0.5 && ms2 < 6000;
  let h = '<span style="color:var(--warn)"><b>การเชื่อมต่อช้ากว่าที่ควร</b> ' +
    '(รอบแรก ' + (ms / 1000).toFixed(1) + ' วิ' +
    (ms2 != null ? ' · รอบสอง ' + (ms2 / 1000).toFixed(1) + ' วิ' : '') + ')</span><br>';
  if (coldStart) {
    h += '<span class="hint">รอบสองเร็วขึ้นมาก แปลว่าเวลาส่วนใหญ่หมดไปกับการ<b>ปลุกสคริปต์ที่หลับอยู่</b> ' +
      'ซึ่งเป็นธรรมชาติของ Google Apps Script เมื่อไม่มีใครเรียกใช้สักพัก<br>' +
      '<b>ผลกับนักเรียน:</b> คนแรกของคาบจะรอนาน ที่เหลือจะเร็วปกติ<br>' +
      '<b>วิธีลดผล:</b> ครูกดปุ่มนี้หนึ่งครั้งก่อนเริ่มคาบ เพื่อปลุกสคริปต์ไว้ล่วงหน้า</span>';
  } else {
    h += '<span class="hint">ช้าทั้งสองรอบ แปลว่า<b>ไม่ใช่</b>เรื่องการปลุกสคริปต์ ' +
      'แต่เป็นเพราะฟังก์ชัน <code>ping</code> ในชีต<b>อ่านข้อมูลมากเกินไป</b><br>' +
      'ตอนนี้ในชีตมีข้อมูลรวมราว <b>' + fmt(nStu + nAsg + nSub) + ' แถว</b> ' +
      '(รายชื่อ ' + fmt(nStu) + ' · ใบงาน ' + fmt(nAsg) + ' · ผลที่ส่งแล้ว ' + fmt(nSub) + ')<br>' +
      '<b>วิธีแก้:</b> ในไฟล์ <code>appsscript-Code.gs</code> ให้ฟังก์ชัน <code>ping</code> ' +
      'นับจำนวนแถวด้วย <code>getLastRow()</code> แทนการดึงทั้งแผ่นด้วย ' +
      '<code>getDataRange().getValues()</code> และอ่านเฉพาะคอลัมน์ <code>sid</code> ' +
      'ไม่กี่แถวแรกก็พอสำหรับทำตัวอย่าง</span>';
  }
  return h;
}

/** ส่งรายชื่อในเครื่องขึ้นชีต — คนที่มีอยู่แล้วจะอัปเดตข้อมูล ไม่แตะรหัสผ่าน
    แบ่งส่งเป็นก้อนละ ROSTER_CHUNK คน เพื่อให้แต่ละรอบจบเร็วและไม่หมดเวลา */
const ROSTER_CHUNK = 60;
async function pushRoster() {
  const good = [], badSid = [], noSid = [];
  DB.students.forEach(s => {
    const sid = String(s.sid || '').trim();
    const row = { sid: sid, name: s.name, no: s.no || '',
                  cls: (classById(s.classId) || {}).name || '' };
    if (!sid) noSid.push(s.name);
    else if (!validSid(sid)) badSid.push(s.name + ' (' + sid + ')');
    else good.push(row);
  });

  if (!good.length) {
    openModal({ title: 'ส่งรายชื่อขึ้นชีตไม่ได้', bodyHTML:
      '<div class="notice bad">ยังไม่มีนักเรียนที่มี<b>เลขประจำตัวที่ใช้ได้</b><br>' +
      'เลขประจำตัวคือชื่อผู้ใช้ ต้องเป็น<b>ตัวเลขล้วน ไม่เกิน ' + SID_MAX + ' หลัก</b></div>' +
      (badSid.length ? '<div class="hint" style="margin-top:9px">รูปแบบไม่ถูกต้อง: ' +
        esc(badSid.slice(0, 15).join(', ')) + (badSid.length > 15 ? ' …' : '') + '</div>' : '') });
    return;
  }
  // ── ตรวจกับชีตก่อน แล้วส่งเฉพาะคนที่ยังไม่มี ─────────────────────────
  // เลขประจำตัวที่มีอยู่แล้วจะไม่ส่งซ้ำ จึงไม่เกิดรายชื่อซ้ำในชีตเด็ดขาด
  let chk;
  try { chk = await api('rosterCheck', { sids: good.map(r => r.sid) }); }
  catch (e) {
    openModal({ title: 'ตรวจสอบรายชื่อในชีตไม่สำเร็จ',
      bodyHTML: '<div class="notice bad">' + esc(e.message) + '</div>' +
        '<div class="hint" style="margin-top:9px">ถ้าขึ้นว่าไม่รู้จักคำสั่ง <code>rosterCheck</code> ' +
        'แปลว่าสคริปต์ในชีตยังเป็นรุ่นเก่า — วาง <code>appsscript-Code.gs</code> ใหม่ ' +
        'แล้วกด <b>ทำให้ใช้งานได้ใหม่</b></div>' });
    return;
  }

  const already = new Set(chk.existing.map(String));
  const fresh = good.filter(r => !already.has(String(r.sid)));

  // เลขซ้ำกันเองในเครื่อง — ต้องบอกให้แก้ ไม่ใช่ส่งขึ้นไปมั่ว
  const localDup = {};
  good.forEach(r => { localDup[r.sid] = (localDup[r.sid] || 0) + 1; });
  const dupHere = Object.keys(localDup).filter(k => localDup[k] > 1);

  let msg = '<div class="statgrid" style="margin-bottom:11px">' +
    '<div class="stat"><div class="v">' + chk.total + '</div><div class="k">มีในชีตแล้ว</div></div>' +
    '<div class="stat"><div class="v" style="color:var(--ok)">' + fresh.length + '</div>' +
      '<div class="k">จะเพิ่มใหม่</div></div>' +
    '<div class="stat"><div class="v" style="color:var(--muted)">' + already.size + '</div>' +
      '<div class="k">มีอยู่แล้ว ข้ามไป</div></div></div>';
  if (dupHere.length) msg += '<div class="notice bad">รายชื่อในเครื่องมี<b>เลขประจำตัวซ้ำกันเอง ' +
    dupHere.length + ' เลข</b>: ' + esc(dupHere.slice(0, 10).join(', ')) +
    '<br>แก้ให้ไม่ซ้ำก่อน ไม่งั้นจะมีคนเข้าระบบไม่ได้</div>';
  if (chk.dupInSheet && chk.dupInSheet.length) msg += '<div class="notice warn">ในชีตมีแถวซ้ำอยู่ <b>' +
    chk.dupInSheet.length + ' เลข</b> (' + esc(chk.dupInSheet.slice(0, 8).join(', ')) +
    ')<br>กด <b>ลบแถวซ้ำในชีต</b> ที่แท็บตั้งค่าเพื่อซ่อม</div>';
  if (chk.blank) msg += '<div class="notice warn">ในชีตมี <b>' + chk.blank +
    ' แถวที่ไม่มีเลขประจำตัว</b> ซึ่งเข้าระบบไม่ได้ — ลบแถวซ้ำจะเก็บกวาดให้ด้วย</div>';
  if (noSid.length) msg += '<div class="hint">ข้าม ' + noSid.length + ' คนที่ยังไม่มีเลขประจำตัว</div>';
  if (badSid.length) msg += '<div class="hint" style="color:var(--bad)">ข้าม ' + badSid.length +
    ' คนที่เลขประจำตัวผิดรูปแบบ</div>';

  if (!fresh.length) {
    openModal({ title: 'ทุกคนอยู่ในชีตแล้ว', bodyHTML: msg +
      '<div class="hint" style="margin-top:9px">ไม่มีใครต้องเพิ่มใหม่ — ' +
      'ถ้านักเรียนยังเข้าระบบไม่ได้ ให้กด <b>ทดสอบการเชื่อมต่อ</b> เพื่อดูว่าเลขประจำตัวในชีตถูกต้องไหม</div>' });
    return;
  }
  if (!await confirmBox('ยืนยันการส่งรายชื่อ',
    msg + '<div style="margin-top:6px">จะส่ง <b>' + fresh.length + ' คน</b>' +
    (fresh.length > ROSTER_CHUNK ? ' (แบ่งเป็น ' + Math.ceil(fresh.length / ROSTER_CHUNK) + ' รอบ)' : '') +
    ' ขึ้น Google Sheet<br>ทุกคนจะได้รหัสตั้งต้น <b>1111</b> และต้องตั้งรหัสใหม่ตอนเข้าครั้งแรก</div>',
    'ส่ง ' + fresh.length + ' คน')) return;
  good.length = 0;
  fresh.forEach(r => good.push(r));

  const m = openModal({ title: 'กำลังส่งรายชื่อ', bodyHTML:
    '<div id="prMsg" class="hint">กำลังเชื่อมต่อ…</div>' +
    '<div class="bar" style="margin-top:10px"><i id="prBar" style="width:0%"></i></div>', buttons: [] });
  const setMsg = (t, pct) => {
    const a = $('#prMsg', m.root), b = $('#prBar', m.root);
    if (a) a.innerHTML = t;
    if (b) b.style.width = Math.round(pct) + '%';
  };

  let added = 0, updated = 0, skipped = [], sent = 0;
  const t0 = Date.now();
  try {
    for (let i = 0; i < good.length; i += ROSTER_CHUNK) {
      const part = good.slice(i, i + ROSTER_CHUNK);
      setMsg('กำลังส่ง ' + (i + 1) + '–' + (i + part.length) + ' จาก ' + good.length + ' คน…',
             i / good.length * 100);
      const r = await api('rosterSave', { rows: part });
      added += r.added || 0; updated += r.updated || 0; sent += part.length;
      if (r.skipped && r.skipped.length) skipped = skipped.concat(r.skipped);
    }
    setMsg('เสร็จแล้ว', 100);
    m.close();
    const sec = ((Date.now() - t0) / 1000).toFixed(1);
    openModal({ title: 'ส่งรายชื่อเรียบร้อย', bodyHTML:
      '<div style="line-height:1.9"><b>เพิ่มบัญชีใหม่ ' + added + ' คน · อัปเดต ' + updated + ' คน</b>' +
      '<br>ใช้เวลา ' + sec + ' วินาที' +
      (skipped.length ? '<br><span style="color:var(--warn)">ชีตข้ามไป ' + skipped.length + ' รายการ: ' +
        esc(skipped.slice(0, 8).map(x => (x.name || x.sid) + ' — ' + x.why).join(' · ')) + '</span>' : '') +
      (added ? '<br><br>นักเรียนเข้าใช้ได้แล้วด้วย<b>เลขประจำตัว</b>ของตัวเอง รหัสตั้งต้น <b>1111</b>' : '') +
      '</div>' });
  } catch (e) {
    m.close();
    openModal({ title: 'ส่งรายชื่อไม่สำเร็จ', bodyHTML:
      '<div class="notice bad">' + esc(e.message) + '</div>' +
      '<div class="hint" style="margin-top:10px">ส่งสำเร็จไปแล้ว <b>' + sent + ' จาก ' + good.length +
      ' คน</b> — กดส่งใหม่ได้เลย ระบบจะข้ามคนที่ส่งไปแล้วให้เอง ไม่เกิดข้อมูลซ้ำ<br><br>' +
      'ถ้ายังไม่ผ่าน ให้ตรวจว่าได้กด <b>ทำให้ใช้งานได้ใหม่</b> ใน Apps Script ' +
      'หลังจากวางสคริปต์รุ่นล่าสุดแล้วหรือยัง</div>' });
  }
}

/** สร้างไฟล์สำหรับแจกนักเรียน — ฝัง URL/โลโก้/หัวกระดาษไว้ในตัวไฟล์ */
async function makeStudentFile() {
  if (!DB.cloud.url) {
    openModal({ title: 'ยังสร้างไฟล์ไม่ได้', bodyHTML:
      '<div class="notice bad">ยังไม่ได้เชื่อมต่อ Google Sheet<br>' +
      'ต้องใส่ URL เว็บแอปแล้วกด <b>ทดสอบการเชื่อมต่อ</b> ให้ผ่านก่อน ' +
      'ไม่งั้นไฟล์ที่แจกไปจะเชื่อมต่ออะไรไม่ได้เลย</div>' });
    return;
  }
  const h = DB.settings.header || {};
  const warn = [];
  if (!DB.settings.logo) warn.push('ยังไม่ได้ใส่<b>ตราโรงเรียน</b> — ไฟล์ที่แจกจะไม่มีโลโก้');
  if (!String(h.school || '').trim()) warn.push('ยังไม่ได้ใส่<b>ชื่อโรงเรียน</b>ในหัวกระดาษ');

  if (!await confirmBox('สร้างไฟล์สำหรับแจกนักเรียน',
    '<div style="line-height:1.9">ไฟล์ที่ได้จะ<b>ฝังสิ่งเหล่านี้ไว้ในตัวไฟล์</b><br>' +
    '• ที่อยู่ Google Sheet ที่เชื่อมอยู่ตอนนี้<br>' +
    '• ตราโรงเรียนและหัวกระดาษ<br>' +

    (s.layout === 'old' ? '• คอลัมน์ยังเรียงแบบเก่า จะจัดใหม่เป็น ' +

    '</div><div class="hint" style="margin-top:9px">การซ่อมจะ<b>เติมหัวตารางภาษาไทย</b>ให้ทุกแผ่น ' +
    'และจัดคอลัมน์ใหม่ <b>ข้อมูลเดิมไม่หาย</b> รหัสผ่านที่นักเรียนตั้งไว้ยังใช้ได้เหมือนเดิม<br>' +
    'แนะนำให้กด <b>สำรอง</b> ข้อมูลในเครื่องไว้ก่อน และเปิดชีตดูผลหลังซ่อมเสร็จ</div>',

async function pullRoster() {
  try {
    const list = await api('rosterList', {});
    if (!list.length) { toast('ยังไม่มีรายชื่อในชีต', 'bad'); return; }
    const byCls = {};
    list.forEach(s => { const k = String(s.cls || '(ไม่ระบุชั้น)'); byCls[k] = (byCls[k] || 0) + 1; });
    if (!await confirmBox('ดึงรายชื่อจากชีต',
      'พบ <b>' + list.length + ' คน</b> ในชีต<br>' +
      Object.keys(byCls).map(k => esc(k) + ' ' + byCls[k] + ' คน').join(' · ') +
      '<br><br>จะ<b>แทนที่รายชื่อในเครื่องทั้งหมด</b> (ผลการทำที่เก็บไว้ยังอยู่ครบ)', 'ดึงมาแทนที่')) return;
    DB.mode = 'class';
    DB.classes = []; DB.students = [];
    list.forEach(s => {
      const nm = String(s.cls || 'ไม่ระบุชั้น').trim();
      let c = DB.classes.find(x => x.name === nm);
      if (!c) { c = { id: uid(), name: nm }; DB.classes.push(c); }
      DB.students.push({ id: uid(), classId: c.id, no: Number(s.no) || null,
                         sid: String(s.sid), name: String(s.name || '') });
    });
    DB.cur.classId = DB.classes.length ? DB.classes[0].id : null;
    const l = studentsOf(DB.cur.classId);
    DB.cur.studentId = l.length ? l[0].id : null;
    save(true); render();
    toast('ดึงรายชื่อ ' + list.length + ' คนเรียบร้อย', 'ok');
  } catch (e) { toast(e.message, 'bad'); }
}

/** นำเข้ารายชื่อจากไฟล์ Excel (.xlsx) หรือ CSV พร้อมให้เลือกชีตและจับคู่คอลัมน์เอง */
async function importRosterFile(classId) {
  const f = await pickFile('.xlsx,.csv,.txt,.tsv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv');
  if (f) await importRosterFromFile(classId, f);
}

async function importRosterFromFile(classId, f) {
  let sheets;
  try { sheets = await readTableFile(f); }
  catch (e) { openModal({ title: 'เปิดไฟล์ไม่สำเร็จ', bodyHTML: '<div class="notice bad">' + esc(e.message || String(e)) + '</div>' }); return; }
  sheets = sheets.filter(s => s.rows.length);
  if (!sheets.length) { toast('ไฟล์นี้ไม่มีข้อมูล', 'bad'); return; }

  const S = { si: 0 };
  const applyGuess = () => {
    const g = guessLayout(sheets[S.si].rows);
    S.headRow = g.headRow; S.map = g.map;
  };
  applyGuess();

  const colOptions = (rows, sel) => {
    const width = rows.reduce((w, r) => Math.max(w, r.length), 0);
    let o = '<option value="-1"' + (sel < 0 ? ' selected' : '') + '>— ไม่มี —</option>';
    for (let i = 0; i < width; i++) {
      const sample = (S.headRow >= 0 ? String(rows[S.headRow][i] || '') : '')
        || String((rows[S.headRow + 1] || [])[i] || '');
      o += '<option value="' + i + '"' + (sel === i ? ' selected' : '') + '>' +
        String.fromCharCode(65 + (i % 26)) + (sample ? ' — ' + esc(sample.slice(0, 18)) : '') + '</option>';
    }
    return o;
  };

  const collect = () => {
    const rows = sheets[S.si].rows;
    const start = S.headRow >= 0 ? S.headRow + 1 : 0;
    const pick = (r, i) => i >= 0 ? String(r[i] == null ? '' : r[i]).replace(/\s+/g, ' ').trim() : '';
    const out = [];
    let auto = 0;
    for (let k = start; k < rows.length; k++) {
      const r = rows[k];
      const name = pick(r, S.map.name);
      if (!name) continue;
      const noRaw = pick(r, S.map.no);
      const no = /^\d+$/.test(noRaw) ? Number(noRaw) : ++auto;
      if (no > auto) auto = no;
      out.push({ no: no, sid: pick(r, S.map.sid), name: name, cls: pick(r, S.map.cls) });
    }
    return out;
  };

  const redraw = root => {
    const rows = sheets[S.si].rows;
    const items = collect();
    const byCls = {};
    items.forEach(x => { const k = x.cls || ''; byCls[k] = (byCls[k] || 0) + 1; });
    const clsList = Object.keys(byCls).filter(Boolean);
    const badSid = items.filter(x => x.sid && !validSid(x.sid));

    $('#impBody', root).innerHTML =
      (sheets.length > 1
        ? '<div class="row" style="margin-bottom:9px"><label for="impSheet">ชีต</label>' +
          '<select id="impSheet">' + sheets.map((s, i) =>
            '<option value="' + i + '"' + (i === S.si ? ' selected' : '') + '>' + esc(s.name) +
            ' (' + s.rows.length + ' แถว)</option>').join('') + '</select></div>'
        : '') +
      '<div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">' +
      COLKEYS.map(ck => '<div><label class="hint" for="impc_' + ck.k + '">' + ck.label +
        (ck.k === 'name' ? ' *' : '') + '</label><br><select id="impc_' + ck.k + '" data-ck="' + ck.k +
        '" style="max-width:190px">' + colOptions(rows, S.map[ck.k]) + '</select></div>').join('') +
      '<div><label class="hint" for="impHead">แถวหัวตาราง</label><br>' +
      '<input type="number" id="impHead" min="0" max="' + rows.length + '" value="' + (S.headRow + 1) +
      '" style="width:90px" inputmode="numeric"><br><span class="hint">0 = ไม่มีหัวตาราง</span></div>' +
      '</div>' +
      (S.map.name < 0
        ? '<div class="notice bad" style="margin-top:10px">ยังไม่ได้เลือกคอลัมน์ <b>ชื่อ-นามสกุล</b></div>'
        : '') +
      (badSid.length
        ? '<div class="notice warn" style="margin-top:10px">มี <b>' + badSid.length + ' คน</b> ' +
          'ที่เลขประจำตัวไม่ใช่ตัวเลขล้วนหรือยาวเกิน ' + SID_MAX + ' หลัก — ' +
          'คนเหล่านี้จะ<b>เข้าระบบไม่ได้</b> ตรวจว่าเลือกคอลัมน์ถูกหรือยัง<br>' +
          '<span class="hint">' + esc(badSid.slice(0, 6).map(x => x.name + ': ' + x.sid).join(' · ')) +
          (badSid.length > 6 ? ' …' : '') + '</span></div>'
        : '') +

/* --- 6.x แชร์ใบงาน / รวมผลจากนักเรียน / ส่งออกคะแนน ----------------------
   ชุดโจทย์เก็บแค่ {tplId, seed} ต่อข้อ ทั้งใบจึงเล็กพอที่จะส่งเป็นข้อความได้
   ครูคัดลอก "รหัสใบงาน" ไปวางในไลน์กลุ่มหรือ Google Classroom
   นักเรียนวางรหัสลงแอพ แล้วไอแพดสร้างโจทย์เองในเครื่อง — ไม่ต้องมีเซิร์ฟเวอร์
   ------------------------------------------------------------------------ */
const QCODE_PREFIX = 'PHYSQ1:';

function encodeQuiz(q) {
  const c = {
    i: q.id, t: q.title, s: q.seed, tp: q.topics, sb: q.subs || [],
    c: q.counts, g: q.g, e: q.easyG10 ? 1 : 0,
    k: quizKind(q), sh: (q.seedShift || 0),
    lm: q.limitSec || 0, mo: q.maxOut || 0, ms: q.maxOutSec || 0,
    it: q.items.map(x => x.tplId + '~' + x.seed)
  };
  return QCODE_PREFIX + b64enc(JSON.stringify(c));
}

function decodeQuiz(code) {
  const s = String(code || '').trim().replace(/\s+/g, '');
  if (!s) return null;
  const body = s.indexOf(QCODE_PREFIX) === 0 ? s.slice(QCODE_PREFIX.length) : s;
  let c;
  try { c = JSON.parse(b64dec(body)); } catch (e) { return null; }
  if (!c || !Array.isArray(c.it) || !c.it.length) return null;
  const items = [];
  for (const raw of c.it) {
    const p = String(raw).split('~');
    if (p.length !== 2) return null;
    if (!TPL.some(t => t.id === p[0])) return null;      // แม่แบบนี้ไม่มีในแอพรุ่นนี้
    const sd = Number(p[1]);
    if (!isFinite(sd)) return null;
    items.push({ tplId: p[0], seed: sd });
  }
  return {
    id: c.i || uid(), ts: Date.now(), title: c.t || 'ใบงาน', seed: Number(c.s) || 0,
    topics: Array.isArray(c.tp) ? c.tp : [], subs: Array.isArray(c.sb) ? c.sb : [],
    counts: c.c || {}, g: Number(c.g) || 9.8, easyG10: !!c.e,
    kind: c.k === 'test' ? 'test' : 'practice', seedShift: Number(c.sh) || 0,
    // รหัสที่สร้างก่อนมีระบบคุมสอบไม่มีคีย์พวกนี้ ได้ 0 = ไม่จำกัด ซึ่งถูกต้องแล้ว
    limitSec: Number(c.lm) || 0, maxOut: Number(c.mo) || 0, maxOutSec: Number(c.ms) || 0,
    items: items
  };
}

/** ผสานไฟล์สำรองของนักเรียนหนึ่งไฟล์เข้ากับข้อมูลในเครื่อง โดยไม่ทับของเดิม */
function mergeBackup(o, st) {
  if (!o || !Array.isArray(o.quizzes) || !Array.isArray(o.attempts)) { st.bad++; return; }
  o.quizzes.forEach(q => {
    if (q && q.id && !DB.quizzes.some(x => x.id === q.id)) { DB.quizzes.push(q); st.quizzes++; }
  });
  o.attempts.forEach(a => {
    if (!a || !a.finishedAt) { st.unfinished++; return; }
    if (DB.attempts.some(x => x.id === a.id)) { st.dup++; return; }
    if (!DB.quizzes.some(x => x.id === a.quizId)) { st.noQuiz++; return; }
    const copy = Object.assign({}, a);
    // studentId ของเครื่องนักเรียนใช้บนเครื่องครูไม่ได้ ต้องจับคู่ใหม่
    // ยุบช่องว่างซ้ำก่อนเทียบ เพราะนักเรียนมักเคาะวรรคเกินตอนพิมพ์ชื่อตัวเอง
    const norm = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
    const inCls = x => !DB.cur.classId || x.classId === DB.cur.classId;
    const nm = norm(copy.soloName), sid = norm(copy.sid);
    // เลขประจำตัวเชื่อถือได้กว่าชื่อ (ไม่มีปัญหาสะกดผิด) จึงลองจับคู่ด้วยเลขประจำตัวก่อน
    let s = sid && DB.students.find(x => norm(x.sid) === sid && inCls(x));
    if (!s) s = nm && DB.students.find(x => norm(x.name) === nm && inCls(x));
    if (s) { copy.studentId = s.id; copy.soloName = s.name; st.matched++; }
    else { copy.studentId = null; copy.soloName = nm || '(ไม่ระบุชื่อ)'; st.unmatched.push(copy.soloName); }
    DB.attempts.push(copy);
    st.attempts++;
  });
}

async function mergeStudentFiles() {
  const files = await pickFiles('.json,application/json');
  if (!files.length) return;
  const st = { quizzes: 0, attempts: 0, dup: 0, bad: 0, unfinished: 0, noQuiz: 0, matched: 0, unmatched: [] };
  for (const f of files) {
    let o = null;
    try { o = JSON.parse(await f.text()); } catch (e) { st.bad++; continue; }
    mergeBackup(o, st);
  }
  if (st.attempts) { Object.keys(PCACHE).forEach(k => delete PCACHE[k]); save(true); render(); }

  const uniqUn = Array.from(new Set(st.unmatched));
  let msg = '<b>เพิ่มผลการทำ ' + st.attempts + ' รายการ</b> จาก ' + files.length + ' ไฟล์';
  if (st.quizzes) msg += '<br>เพิ่มชุดโจทย์ใหม่ ' + st.quizzes + ' ชุด';
  if (st.matched) msg += '<br>จับคู่กับรายชื่อในเครื่องได้ ' + st.matched + ' รายการ';
  if (uniqUn.length) msg += '<br><span style="color:var(--warn)">จับคู่รายชื่อไม่ได้ ' + uniqUn.length +

    (uniqUn.length > 12 ? ' …' : '') + '</span>';
  if (st.dup) msg += '<br>ข้ามรายการซ้ำ ' + st.dup + ' รายการ';
  if (st.unfinished) msg += '<br>ข้ามรายการที่ยังทำไม่จบ ' + st.unfinished + ' รายการ';

  if (st.bad) msg += '<br><span style="color:var(--bad)">อ่านไม่ได้ ' + st.bad + ' ไฟล์</span>';
  openModal({ title: 'ผลการรวมไฟล์', bodyHTML: '<div style="line-height:1.9">' + msg + '</div>' });

/** แถวคะแนนของชุดโจทย์หนึ่ง เรียงตามเลขที่ เพื่อส่งออกไปยังโปรแกรมบันทึกคะแนน */
function scoreRows(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return { q: null, rows: [] };
  const best = {};
  DB.attempts.filter(a => a.quizId === quizId && a.finishedAt).forEach(a => {
    const key = a.studentId || ('solo:' + (a.soloName || ''));
    if (!best[key] || a.finishedAt > best[key].finishedAt) best[key] = a;
  });
  const rows = [];
  const roster = DB.students.filter(s => !DB.cur.classId || s.classId === DB.cur.classId);
  if (DB.mode === 'class' && roster.length) {
    // ยึดรายชื่อในห้องเป็นหลัก คนที่ยังไม่ได้ทำให้เว้นว่างไว้ ตำแหน่งแถวจะได้ตรงกับสมุดคะแนน
    roster.slice().sort((a, b) => (a.no || 0) - (b.no || 0)).forEach(s => {
      const a = best[s.id];
      const r = a ? analyze(a) : null;
      rows.push({ no: s.no, sid: s.sid || '', name: s.name, got: r ? r.got : '', max: q.items.length,
                  pct: r ? Math.round(r.pct) : '', sec: r ? r.sec : '', done: !!a });
    });
    // ผลที่จับคู่กับรายชื่อไม่ได้ (เช่น นักเรียนพิมพ์ชื่อไม่ตรง หรือย้ายเข้าใหม่)
    // ต่อท้ายไว้เสมอ ไม่ปล่อยให้หายไปเงียบ ๆ ครูจะได้เห็นแล้วแก้รายชื่อได้
    Object.keys(best).filter(k => k.indexOf('solo:') === 0).forEach(k => {
      const a = best[k], r = analyze(a);
      rows.push({ no: '', sid: '', name: a.soloName || '', got: r.got, max: q.items.length,
                  pct: Math.round(r.pct), sec: r.sec, done: true, orphan: true });
    });
  } else {
    Object.values(best).sort((x, y) => String(x.soloName || '').localeCompare(String(y.soloName || ''), 'th'))
      .forEach((a, i) => {
        const r = analyze(a);
        rows.push({ no: i + 1, sid: '', name: a.soloName || '', got: r.got, max: q.items.length,
                    pct: Math.round(r.pct), sec: r.sec, done: true });
      });
  }
  return { q: q, rows: rows };
}

async function exportScoreColumn(quizId) {
  const { q, rows } = scoreRows(quizId);
  if (!q) return;
  // คอลัมน์ที่คัดลอกต้องมีเฉพาะคนในรายชื่อ ไม่งั้นแถวจะเลื่อนไม่ตรงกับสมุดคะแนน
  const inList = rows.filter(r => !r.orphan);
  const orphans = rows.filter(r => r.orphan);
  const txt = inList.map(r => (r.done ? fmt(r.got) : '')).join('\n');
  const ok = await copyText(txt);
  if (!ok) { toast('คัดลอกไม่สำเร็จ ให้ใช้ปุ่มดาวน์โหลด CSV แทน', 'bad'); return; }
  if (orphans.length) {
    toast('คัดลอก ' + inList.length + ' แถวแล้ว — แต่มี ' + orphans.length +
      ' คนที่ไม่อยู่ในรายชื่อและไม่ถูกคัดลอก ดูรายละเอียดในไฟล์ CSV', 'warn');
  } else {
    toast('คัดลอกคะแนน ' + inList.length + ' แถวแล้ว — ไปวางในช่องแรกของคอลัมน์คะแนนได้เลย', 'ok');
  }
}

function exportScoreCsv(quizId) {
  const { q, rows } = scoreRows(quizId);
  if (!q) return;
  const esc2 = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const clsName = (DB.mode === 'class' && DB.cur.classId) ? (classById(DB.cur.classId) || {}).name || '' : '';
  const lines = [['ชั้น', 'เลขที่', 'เลขประจำตัว', 'ชื่อ-นามสกุล', 'คะแนน', 'คะแนนเต็ม', 'ร้อยละ',
    'เวลาที่ใช้(วินาที)', 'สถานะ'].map(esc2).join(',')];
  rows.forEach(r => lines.push([r.orphan ? '' : clsName, r.no, r.sid || '', r.name,

  download(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }),

}

const DOCS = [
  { k: 'worksheet',   n: 'ใบงาน',                 d: 'โจทย์อย่างเดียว มีที่ว่างให้แสดงวิธีทำ', stu: true },
  { k: 'answerkey',   n: 'ใบเฉลย',                d: 'แสดงวิธีทำครบทั้ง 7 ขั้นทุกข้อ' },
  { k: 'evidence',    n: 'หลักฐานการเรียนรู้',     d: 'สรุปผลรายคน พร้อมช่องลงนาม สำหรับแฟ้ม ปพ.' },
  { k: 'classreport', n: 'รายงานสถิติชั้นเรียน',   d: 'ผลรายคน การกระจายคะแนน และข้อที่พลาดบ่อย' }
];
/** เอกสารที่บทบาทปัจจุบันพิมพ์ได้ — ผู้เรียนพิมพ์ได้เฉพาะใบงาน */
function docsAllowed() { return canManage() ? DOCS : DOCS.filter(d => d.stu); }
function docAllowed(k) { return docsAllowed().some(d => d.k === k); }

function docHead(title, sub2, sub3) {
  const hd = DB.settings.header;
  let h = '<div class="phead">';
  if (DB.settings.logo) h += '<img class="plogo" src="' + DB.settings.logo + '" alt="">';
  if (hd.school) h += '<div class="t2">' + esc(hd.school) + '</div>';
  h += '<div class="t1">' + esc(title) + '</div>';
  if (sub2) h += '<div class="t2">' + sub2 + '</div>';
  const bits = [];
  if (hd.teacher) bits.push('ครูผู้สอน: ' + esc(hd.teacher));
  if (hd.term) bits.push(esc(hd.term));
  if (sub3) bits.push(sub3);
  if (bits.length) h += '<div class="t3">' + bits.join(' &nbsp;·&nbsp; ') + '</div>';
  return h + '</div><hr class="prule">';
}
/** บรรทัดเครดิตผู้พัฒนา ท้ายเอกสารที่พิมพ์ */
function docCredit() {

    .filter(Boolean);

}
function nameFields() {
  return '<div class="pfields"><div>ชื่อ-นามสกุล ..............................................</div>' +
    '<div>เลขที่ ............</div><div>เลขประจำตัว ......................</div>' +
    '<div>ชั้น ..................</div>' +
    '<div>วันที่ ......... / ......... / .........</div></div>';
}
/* ช่องเขียนวิธีทำในใบงาน — ยุบขั้นที่ทำต่อเนื่องกันเข้าเป็นช่องเดียว
   เพื่อให้นักเรียนเขียนได้ลื่นขึ้นและใบงานไม่ยาวเกินไป
   (ใบเฉลยและหน้าจอในแอพยังแยกครบทั้ง 7 ขั้นตามเดิม) */
const WORK_BLOCKS = [
  { id: 'analyze',  t: 'วิเคราะห์โจทย์ / โจทย์กำหนด', n: 3, d: 'รวมขั้นที่ 1-2' },
  { id: 'equation', t: 'สมการที่ใช้ / การแก้สมการ',   n: 4, d: 'รวมขั้นที่ 3-4' },
  { id: 'subst',    t: 'แทนค่าลงในสมการ',            n: 1, d: 'ขั้นที่ 5' },
  { id: 'calc',     t: 'คำนวณ',                      n: 3, d: 'ขั้นที่ 6' },
  { id: 'conclude', t: 'สรุปคำตอบ',                  n: 1, d: 'ขั้นที่ 7' }
];
const WORK_MAX = 12;
/* ความหนาแน่นของเอกสารที่พิมพ์ — คุมสามอย่างให้ไปทางเดียวกัน
     plain = จำนวนข้อ "ปรนัย" ที่ตั้งใจให้ลงได้ในหนึ่งหน้า
     work  = จำนวนข้อ "แสดงวิธีทำ" (มีกรอบเขียน) ที่ตั้งใจให้ลงได้ในหนึ่งหน้า
     ws    = ตัวคูณจำนวนบรรทัดในกรอบเขียนวิธีทำ — ยิ่งอัดหลายข้อต่อหน้า บรรทัดยิ่งต้องน้อยลง
   ส่วนขนาดรูปประกอบและความสูงบรรทัดคุมด้วยคลาส dn-* ในส่วน CSS */
const DENSITY = [
  { k: 'airy',   n: 'โปร่ง',   ws: 1.5, caps: true,
    d: 'รูปใหญ่ ช่องเขียนกว้าง · ปรนัยราว 2-4 ข้อ/หน้า · ข้อแสดงวิธีทำ 1 ข้อ/หน้า' },
  { k: 'normal', n: 'ปานกลาง', ws: 0.55, caps: true,
    d: 'ปรนัยราว 3-4 ข้อ/หน้า · ข้อแสดงวิธีทำ 2 ข้อ/หน้า' },
  { k: 'tight',  n: 'แน่น',    ws: 0.75, caps: false,
    d: 'รูปเล็ก ช่องเขียนเป็นบรรทัดเปล่า · ปรนัยราว 3-5 ข้อ/หน้า · ข้อแสดงวิธีทำ 3 ข้อ/หน้า' }
];
function densityOf(k) { return DENSITY.find(d => d.k === k) || DENSITY[1]; }

/** จำนวนบรรทัดของแต่ละช่องตามที่ครูตั้งไว้ (ยังไม่เคยตั้ง = ใช้ค่าเริ่มต้น)
    ส่ง scale มาเพื่อย่อ-ขยายตามความหนาแน่นที่เลือก — ช่องที่ครูตั้งไว้ว่า "ไม่ต้องมี" (0)
    ยังคงเป็น 0 เสมอ ไม่ว่าจะย่อขยายเท่าไร */
function workLines(scale) {
  const s = DB.settings.workLines || (DB.settings.workLines = {});
  const k = scale == null ? 1 : scale;
  const out = {};
  WORK_BLOCKS.forEach(b => {
    const base = s[b.id] == null ? b.n : clamp(Math.round(Number(s[b.id]) || 0), 0, WORK_MAX);
    out[b.id] = base ? clamp(Math.round(base * k), 1, WORK_MAX) : 0;
  });
  return out;
}
function workTotal(scale) { const L = workLines(scale); return WORK_BLOCKS.reduce((s, b) => s + L[b.id], 0); }
function workBox(steps, scale) {
  const L = workLines(scale);
  const on = WORK_BLOCKS.filter(b => L[b.id] > 0);          // ตั้ง 0 = ไม่ต้องมีช่องนั้น
  const total = Math.max(1, on.reduce((s, b) => s + L[b.id], 0));
  if (!steps || !on.length) {
    return '<div class="work">' + new Array(total + 1).join('<div class="wl"></div>') + '</div>';
  }
  let k = 0;
  return '<div class="work">' + on.map(b =>
    '<div class="wcap">' + (++k) + '. ' + b.t + '</div>' +
    new Array(L[b.id] + 1).join('<div class="wl"></div>')
  ).join('') + '</div>';
}

/* กระดาษ A4 แนวตั้ง ขอบ 15mm บน-ล่าง และ 14mm ซ้าย-ขวา (ตรงกับ @page ในส่วน CSS)
   จึงเหลือพื้นที่พิมพ์จริง 182 × 267 มิลลิเมตร */
const PAGE_W_MM = 182, PAGE_H_MM = 267;
const PX_PER_MM = 96 / 25.4;

/** จัดหน้าใบงานจาก<b>ความสูงจริง</b>ของแต่ละข้อ แทนการเดาจากจำนวนตัวอักษร
    ต้องเรียกหลังจากใส่ HTML ลง #printarea แล้ว เพราะต้องให้เบราว์เซอร์จัดวางก่อนจึงวัดได้

    วิธีทำงาน
      1) ตั้งความกว้างของกล่องให้เท่ากระดาษจริงชั่วคราว ข้อความจึงตัดบรรทัดเหมือนตอนพิมพ์
      2) วัดความสูงของทุกชิ้นในหน้า
      3) ไล่ใส่ทีละข้อ พอจะเกินความสูงหน้ากระดาษก็ขึ้นหน้าใหม่
    ผลคือแต่ละหน้าเต็มพอดี ไม่เหลือที่ว่างครึ่งหน้าเหมือนตอนปล่อยให้เบราว์เซอร์ตัดเอง */
function paginatePrint(area, onePer) {
  const pg = $('.pg', area);
  if (!pg) return;
  const prevW = area.style.width;
  area.style.width = PAGE_W_MM + 'mm';
  const rows = Array.from(pg.children).map(el => ({
    el: el, h: el.getBoundingClientRect().height, item: el.classList.contains('pitem')
  }));
  area.style.width = prevW;
  if (!rows.some(r => r.item)) return;

  const limit = PAGE_H_MM * PX_PER_MM;
  const pages = [[]];
  let acc = 0, hasItem = false;
  rows.forEach(r => {
    // ขึ้นหน้าใหม่เมื่อข้อนี้ทำให้ล้น — แต่หน้าที่<b>ยังไม่มีข้อใดเลย</b>ต้องรับข้อนั้นไว้เสมอ
    // เงื่อนไขนี้กันสองอย่างพร้อมกัน: หน้าแรกที่มีแต่หัวกระดาษจะไม่กลายเป็นหน้าเปล่า
    // และข้อที่สูงเกินหนึ่งหน้าจะไม่วนสร้างหน้าเปล่าไม่รู้จบ
    if (r.item && hasItem && (onePer || acc + r.h > limit)) { pages.push([]); acc = 0; hasItem = false; }
    pages[pages.length - 1].push(r.el);
    acc += r.h;
    if (r.item) hasItem = true;
  });

  const frag = document.createDocumentFragment();
  pages.forEach(list => {
    const d = document.createElement('div');
    d.className = 'pg';
    list.forEach(el => d.appendChild(el));
    frag.appendChild(d);
  });
  pg.replaceWith(frag);
}

function buildDoc(kind, opt) {
  const o = opt || {};
  // กันไว้อีกชั้น เผื่อมีทางเข้าถึงเอกสารที่ไม่ได้ผ่านหน้าจอเลือก
  if (!docAllowed(kind)) return '<div class="hint">เอกสารนี้เป็นสิทธิ์ของครูผู้ดูแล</div>';
  if (kind === 'worksheet' || kind === 'answerkey') {
    const q = DB.quizzes.find(x => x.id === o.quizId);
    if (!q) return '<div class="hint">ยังไม่ได้เลือกชุดโจทย์</div>';
    const probs = problemsOf(q);
    const key = kind === 'answerkey';
    const dens = densityOf(o.density);
    // การตัดหน้าทำทีหลังใน paginatePrint() ซึ่งวัดความสูงจริงของแต่ละข้อ
    // ตรงนี้จึงวางทุกข้อไว้ในกล่องเดียวก่อน
    let h = '<div class="pg">' + docHead(q.title, key ? '<b>เฉลยอย่างละเอียด</b>' : '',
      'จำนวน ' + probs.length + ' ข้อ');
    if (!key) h += nameFields();
    if (key) h += '<div class="t3" style="text-align:center;margin-bottom:10px">' +
      'ชุดนี้สร้างจากเลขสุ่ม (seed) ' + q.seed + ' — สร้างใบงานชุดเดิมซ้ำได้เสมอ</div>';
    probs.forEach((p, i) => {
      if (!p) {
        h += '<div class="pitem"><div class="pq"><span class="pn">' + (i + 1) + '.</span>' +
          '<span>— ข้อนี้ใช้โจทย์จากบทที่โปรแกรมรุ่นนี้ยังไม่มี กรุณาอัปเดตไฟล์ก่อนพิมพ์ —</span></div></div>';
        return;
      }
      h += '<div class="pitem"><div class="pq"><span class="pn">' + (i + 1) + '.</span><span>' +
        p.stem + ' &nbsp;<span class="tag">' + p.level + '</span></span></div>';
      if (p.figure) h += '<div class="fig">' + p.figure + '</div>';
      if (key) {
        if (p.theory) {
          const ci = p.choices.findIndex(c => c.correct);
          h += '<div style="margin:5px 0 3px"><b>คำตอบ:</b> ข้อ ' + 'กขคง'[ci] + '. ' + p.choices[ci].text + '</div>';
        } else {
          h += '<div style="margin:5px 0 3px"><b>คำตอบ:</b> ' +
            p.finds.map(f => M(f.s + ' = ' + fmtq(f.value) + (f.unit ? ' `' + f.unit + '`' : ''))).join(' , ') + '</div>';
        }
        h += solutionHTML(p, true);
      } else {
        if (p.choices && p.theory) {
          // ตัวเลือกเป็นข้อความยาว จึงขึ้นบรรทัดใหม่ทีละข้อ และไม่ต้องมีกรอบเขียนวิธีทำ
          h += '<div style="margin:4px 0 0 18px">' + p.choices.map((c, k) =>
            '<div>' + 'ก.ข.ค.ง.'.substr(k * 2, 2) + ' ' + c.text + '</div>').join('') + '</div>';
        } else if (p.choices) {
          h += '<div style="margin:4px 0 0 18px">' + p.choices.map((c, k) =>
            'ก.ข.ค.ง.'.substr(k * 2, 2) + ' ' + fmt(c.value) + (p.finds[0].unit ? ' ' + p.finds[0].unit : '')
          ).join(' &nbsp;&nbsp; ') + '</div>';
        }
        // ระดับ "แน่น" ตัดหัวข้อของแต่ละขั้นออก เหลือเป็นบรรทัดเปล่า จะได้ลงได้ 3 ข้อต่อหน้า
        if (!p.theory) h += workBox(o.withSteps && dens.caps, dens.ws);
      }
      h += '</div>';
    });
    return h + docCredit() + '</div>';
  }

  if (kind === 'evidence') {
    const a = DB.attempts.find(x => x.id === o.attemptId);
    if (!a || !a.finishedAt) return '<div class="hint">ยังไม่ได้เลือกผลการทำที่เสร็จแล้ว</div>';
    const r = analyze(a);
    const who = attemptWho(a);
    const mine = DB.attempts.filter(x => x.finishedAt &&
      (a.studentId ? x.studentId === a.studentId : (!x.studentId && x.soloName === a.soloName)));
    const all = analyzeMany(mine);
    const wi = whoInfo(a);
    const idBits = [];
    if (wi.cls) idBits.push('ชั้น ' + esc(wi.cls));
    if (wi.no) idBits.push('เลขที่ ' + esc(wi.no));
    if (wi.sid) idBits.push('เลขประจำตัว ' + esc(wi.sid));
    let h = '<div class="pg">' + docHead('หลักฐานการเรียนรู้ รายวิชาวิทยาศาสตร์กายภาพ',
      '<b>' + esc(who) + '</b>' + (idBits.length ? ' &nbsp; ' + idBits.join(' &nbsp;·&nbsp; ') : ''),
      'วันที่ทำ ' + thDateTime(a.finishedAt));
    h += '<table style="margin-bottom:10px"><tbody>' +
      '<tr><th style="width:34%">ชุดแบบฝึกหัด</th><td>' + esc(r.quiz.title) + '</td></tr>' +
      '<tr><th>เรื่องที่ประเมิน</th><td>' + r.quiz.topics.map(t => esc(topicName(t))).join(' · ') + '</td></tr>' +
      '<tr><th>จำนวนข้อ</th><td>' + r.n + ' ข้อ (' +
        LEVELS.filter(l => r.byLevel[l]).map(l => l + ' ' + r.byLevel[l].max + ' ข้อ').join(', ') + ')</td></tr>' +
      '<tr><th>คะแนนที่ได้</th><td><b>' + fmt(r.got) + ' จาก ' + r.max + ' คะแนน คิดเป็นร้อยละ ' +
        Math.round(r.pct) + '</b></td></tr>' +
      '<tr><th>ผลการประเมิน</th><td><b>' + (r.pct >= DB.settings.passPct ? 'ผ่านเกณฑ์' : 'ไม่ผ่านเกณฑ์') +
        '</b> (เกณฑ์ร้อยละ ' + DB.settings.passPct + ')</td></tr>' +
      '<tr><th>เวลาที่ใช้</th><td>' + mmss(r.sec) + ' นาที (เฉลี่ยข้อละ ' + mmss(r.n ? r.sec / r.n : 0) + ')</td></tr>' +
      // แถวนี้ขึ้นเฉพาะชุดที่คุมสอบ ใบงานปกติจะไม่มีแถวนี้มารก
      (r.nOut || r.autoBy ? '<tr><th>การคุมสอบ</th><td>' +
        (r.nOut ? 'ออกจากแอป <b>' + r.nOut + ' ครั้ง</b> รวม ' + mmss(r.secOut) + ' นาที' : 'ไม่พบการออกจากแอป') +
        (r.autoBy ? ' · <b>ระบบส่งให้อัตโนมัติ</b> (' + esc(r.autoBy) + ')' : '') +
        (procTimeline(a) ? '<br><span style="font-size:9.5pt">' + procTimeline(a) + '</span>' : '') +
        '</td></tr>' : '') +
      '</tbody></table>';

    h += '<b>ผลแยกตามเรื่องและระดับความยาก</b>' +
      '<table style="margin:5px 0 10px"><thead><tr><th>รายการ</th><th>ได้</th><th>เต็ม</th><th>ร้อยละ</th></tr></thead><tbody>' +
      Object.keys(r.byTopic).map(k => '<tr><td>' + esc(topicName(Number(k))) + '</td><td>' + fmt(r.byTopic[k].got) +
        '</td><td>' + r.byTopic[k].max + '</td><td>' + Math.round(r.byTopic[k].pct) + '</td></tr>').join('') +
      LEVELS.filter(l => r.byLevel[l]).map(l => '<tr><td>ระดับ' + l + '</td><td>' + fmt(r.byLevel[l].got) +
        '</td><td>' + r.byLevel[l].max + '</td><td>' + Math.round(r.byLevel[l].pct) + '</td></tr>').join('') +
      '</tbody></table>';

    const strong = Object.keys(r.bySub).filter(k => r.bySub[k].pct >= 80);
    const weak = Object.keys(r.bySub).filter(k => r.bySub[k].pct < 50);
    const wskill = Object.keys(r.bySkill).filter(k => r.bySkill[k].max >= 2 && r.bySkill[k].pct < 50);
    h += '<b>สรุปจุดแข็งและจุดที่ต้องพัฒนา</b><table style="margin:5px 0 10px"><tbody>' +
      '<tr><th style="width:30%">จุดแข็ง</th><td>' + (strong.length ? strong.map(esc).join(', ') : '—') + '</td></tr>' +
      '<tr><th>จุดที่ต้องพัฒนา</th><td>' + (weak.length ? weak.map(esc).join(', ') : 'ไม่มีหัวข้อที่ต่ำกว่าเกณฑ์') + '</td></tr>' +
      '<tr><th>ทักษะที่ควรทบทวน</th><td>' + (wskill.length ? wskill.map(esc).join(', ') : '—') + '</td></tr>' +
      '</tbody></table>';

    h += '<b>ผลรายข้อ</b><table style="margin:5px 0 10px"><thead><tr><th>ข้อ</th><th>หัวข้อ</th><th>ระดับ</th>' +
      '<th>ผล</th><th>เวลา</th></tr></thead><tbody>' +
      r.items.filter(x => x.p).map(x => '<tr><td>' + (x.i + 1) + '</td><td>' + esc(x.p.sub) + '</td><td>' + x.p.level + '</td>' +
        '<td>' + (x.score >= 1 ? 'ถูก' : x.score > 0 ? 'ถูกบางส่วน' : 'ผิด') + '</td>' +
        '<td>' + mmss(x.it.sec) + '</td></tr>').join('') + '</tbody></table>';

    if (mine.length > 1) {
      h += '<b>สรุปผลสะสมของผู้เรียน</b> (ทำมาแล้ว ' + all.n + ' ครั้ง)' +
        '<table style="margin:5px 0 10px"><thead><tr><th>ครั้งที่</th><th>วันที่</th><th>ชุด</th><th>ร้อยละ</th></tr></thead><tbody>' +
        mine.slice().sort((x, y) => x.finishedAt - y.finishedAt).map((x, k) => {
          const rr = analyze(x);
          return '<tr><td>' + (k + 1) + '</td><td>' + thDate(x.finishedAt) + '</td><td>' +
            esc((quizOf(x) || {}).title || '') + '</td><td>' + Math.round(rr.pct) + '</td></tr>';
        }).join('') +
        '<tr><th>รวมทุกครั้ง</th><td colspan="2"><b>' + fmt(all.got) + ' / ' + all.max + '</b></td><th>' +
        Math.round(all.pct) + '</th></tr></tbody></table>';
    }

    h += '<b>ข้อเสนอแนะ</b><div style="margin:4px 0 0 4px">' +
      advice(r).map(x => '• ' + x.t.replace(/<\/?b>/g, '')).join('<br>') + '</div>';
    h += '<div class="sign"><div><div class="sl"></div>ลงชื่อผู้เรียน</div>' +
      '<div><div class="sl"></div>ลงชื่อครูผู้สอน</div></div>';
    return h + docCredit() + '</div>';
  }

  if (kind === 'classreport') {
    const q = DB.quizzes.find(x => x.id === o.quizId);
    if (!q) return '<div class="hint">ยังไม่ได้เลือกชุดโจทย์</div>';
    const probs = problemsOf(q);
    const byWho = {};
    DB.attempts.filter(a => a.quizId === q.id && a.finishedAt).forEach(a => {
      const key = a.studentId || ('solo:' + (a.soloName || ''));
      if (!byWho[key] || a.finishedAt > byWho[key].finishedAt) byWho[key] = a;
    });
    const rows = Object.values(byWho).map(a => ({ a: a, r: analyze(a) })).sort((x, y) => y.r.pct - x.r.pct);
    if (!rows.length) return '<div class="hint">ยังไม่มีผู้ทำชุดนี้จนจบ</div>';
    const pcts = rows.map(x => x.r.pct);
    const cls = DB.mode === 'class' && DB.cur.classId ? (classById(DB.cur.classId) || {}).name : '';

    let h = '<div class="pg">' + docHead('รายงานผลการทำแบบฝึกหัด', '<b>' + esc(q.title) + '</b>',
      (cls ? 'ชั้น ' + esc(cls) + ' · ' : '') + 'ผู้ทำ ' + rows.length + ' คน · ออกรายงาน ' + thDate(Date.now()));
    h += '<b>สถิติภาพรวม</b><table style="margin:5px 0 10px"><tbody><tr>' +
      '<th>จำนวนผู้ทำ</th><td>' + rows.length + ' คน</td>' +
      '<th>คะแนนเต็ม</th><td>' + q.items.length + ' คะแนน</td></tr><tr>' +
      '<th>ค่าเฉลี่ย</th><td>' + fmt(mean(pcts), 1) + ' %</td>' +
      '<th>มัธยฐาน</th><td>' + fmt(median(pcts), 1) + ' %</td></tr><tr>' +
      '<th>ส่วนเบี่ยงเบนมาตรฐาน</th><td>' + fmt(stdev(pcts), 2) + '</td>' +
      '<th>สูงสุด / ต่ำสุด</th><td>' + fmt(Math.max.apply(null, pcts), 0) + ' % / ' + fmt(Math.min.apply(null, pcts), 0) + ' %</td></tr><tr>' +
      '<th>ผ่านเกณฑ์ (' + DB.settings.passPct + '%)</th><td>' + rows.filter(x => x.r.pct >= DB.settings.passPct).length + ' คน</td>' +
      '<th>ไม่ผ่านเกณฑ์</th><td>' + rows.filter(x => x.r.pct < DB.settings.passPct).length + ' คน</td></tr></tbody></table>';
    h += '<div style="text-align:center;margin:8px 0 12px">' + histogram(pcts) + '</div>';

    // เรียงตามเลขที่ในเอกสารทางการ จะได้เทียบกับ ปพ. ได้ง่าย
    const byNo = rows.slice().sort((x, y) => {
      const a1 = Number(whoInfo(x.a).no) || 999, b1 = Number(whoInfo(y.a).no) || 999;
      return a1 - b1 || String(whoInfo(x.a).name).localeCompare(String(whoInfo(y.a).name), 'th');
    });
    // คอลัมน์คุมสอบขึ้นเฉพาะเมื่อมีคนในชุดนี้ถูกคุมสอบจริง ไม่งั้นรายงานปกติจะรกขึ้นมาเปล่า ๆ
    const showOut = rows.some(x => x.r.nOut || x.r.autoBy);
    h += '<b>ผลรายคน</b><table style="margin:5px 0 10px"><thead><tr><th>เลขที่</th><th>เลขประจำตัว</th>' +
      '<th>ชื่อ-นามสกุล</th><th>คะแนน</th><th>ร้อยละ</th><th>ผล</th>' +
      (showOut ? '<th>ออกจากแอป</th>' : '') +
      '<th>หัวข้อที่ต่ำกว่าเกณฑ์</th></tr></thead><tbody>' +
      byNo.map(x => {
        const weak = Object.keys(x.r.bySub).filter(s => x.r.bySub[s].pct < 50);
        const wi = whoInfo(x.a);
        return '<tr><td>' + esc(wi.no || '—') + '</td><td>' + esc(wi.sid || '—') + '</td>' +
          '<td>' + esc(wi.name) + '</td>' +
          '<td>' + fmt(x.r.got) + '/' + x.r.max + '</td><td>' + Math.round(x.r.pct) + '</td>' +
          '<td>' + (x.r.pct >= DB.settings.passPct ? 'ผ่าน' : 'ไม่ผ่าน') + '</td>' +
          (showOut ? '<td>' + (x.r.nOut ? x.r.nOut + ' ครั้ง (' + mmss(x.r.secOut) + ')' : '—') +
            (x.r.autoBy ? ' · ระบบส่งให้ (' + esc(x.r.autoBy) + ')' : '') + '</td>' : '') +
          '<td>' + (weak.length ? esc(weak.join(', ')) : '—') + '</td></tr>';
      }).join('') + '</tbody></table>';

    const nG = Math.max(1, Math.round(rows.length * 0.27));
    const hi = rows.slice(0, nG), lo = rows.slice(-nG);
    h += '<b>วิเคราะห์รายข้อ</b> <span style="font-size:9.5pt">(p = ค่าความยาก, r = อำนาจจำแนก)</span>' +
      '<table style="margin:5px 0 10px"><thead><tr><th>ข้อ</th><th>หัวข้อ</th><th>ระดับ</th>' +
      '<th>ตอบถูก</th><th>p</th><th>r</th></tr></thead><tbody>' +
      probs.map((p, i) => {
        if (!p) return '<tr><td>' + (i + 1) + '</td><td colspan="5">— ข้อนี้ใช้โจทย์จากบทที่โปรแกรมรุ่นนี้ยังไม่มี —</td></tr>';
        const sc = rows.map(x => (x.a.answers[i] || {}).score || 0);
        const pv = mean(sc);
        const rv = mean(hi.map(x => (x.a.answers[i] || {}).score || 0)) - mean(lo.map(x => (x.a.answers[i] || {}).score || 0));
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(p.sub) + '</td><td>' + p.level + '</td>' +
          '<td>' + fmt(sc.reduce((s, v) => s + v, 0)) + '/' + rows.length + '</td>' +
          '<td>' + fmt(pv, 2) + '</td><td>' + fmt(rv, 2) + '</td></tr>';
      }).join('') + '</tbody></table>';

    const missed = probs.map((p, i) => ({ p: p, i: i, pv: mean(rows.map(x => (x.a.answers[i] || {}).score || 0)) }))
      .filter(x => x.p && x.pv < 0.5).sort((a, b) => a.pv - b.pv);
    h += '<b>ประเด็นที่ควรสอนซ่อมเสริม</b><div style="margin:4px 0 0 4px">';
    h += missed.length
      ? missed.map(x => '• ข้อ ' + (x.i + 1) + ' ' + esc(x.p.sub) + ' (' + x.p.level + ') — ตอบถูก ' +
          Math.round(x.pv * 100) + '%' + (x.p.skills.length ? ' · ทักษะ ' + esc(x.p.skills.join(', ')) : '')).join('<br>')
      : 'ไม่มีข้อใดที่ทั้งห้องทำได้ต่ำกว่าครึ่ง';
    const need = rows.filter(x => x.r.pct < DB.settings.passPct);
    if (need.length) h += '<br><br>• ผู้เรียนที่ควรได้รับการช่วยเหลือ: ' + need.map(x => esc(attemptWho(x.a))).join(', ');
    h += '</div><div class="sign"><div><div class="sl"></div>ลงชื่อครูผู้สอน</div></div>';
    return h + docCredit() + '</div>';
  }
  return '';
}

function renderPrint() {
  // ผู้เรียนพิมพ์ได้เฉพาะใบงาน ถ้าเผลอค้างอยู่ที่เอกสารอื่นให้ดึงกลับมา
  if (!docAllowed(DB.cur.printKind || 'worksheet')) DB.cur.printKind = 'worksheet';
  const kind = DB.cur.printKind || 'worksheet';
  const doneAt = DB.attempts.filter(a => a.finishedAt).sort((x, y) => y.finishedAt - x.finishedAt);
  if (!DB.cur.printQuizId || !DB.quizzes.some(q => q.id === DB.cur.printQuizId))
    DB.cur.printQuizId = DB.cur.quizId || (DB.quizzes.length ? DB.quizzes[DB.quizzes.length - 1].id : null);
  if (!DB.cur.printAtId || !doneAt.some(a => a.id === DB.cur.printAtId))
    DB.cur.printAtId = DB.cur.showAttemptId || (doneAt.length ? doneAt[0].id : null);
  if (DB.cur.wsSteps == null) DB.cur.wsSteps = true;
  if (!DENSITY.some(d => d.k === DB.cur.printDens)) DB.cur.printDens = 'normal';
  const dens = densityOf(DB.cur.printDens);

  const docs = docsAllowed();
  let h = '<div class="card noprint"><h3>1. เลือกเอกสารที่ต้องการพิมพ์</h3><div class="gridcards">' +
    docs.map(d => '<label class="chk' + (kind === d.k ? ' on' : '') + '">' +
      '<input type="radio" name="dk" value="' + d.k + '"' + (kind === d.k ? ' checked' : '') + '>' +
      '<span><span class="t">' + d.n + '</span><br><span class="d">' + d.d + '</span></span></label>').join('') +
    '</div>' +
    (docs.length < DOCS.length
      ? '<div class="hint" style="margin-top:9px">ผู้เรียนพิมพ์ได้เฉพาะ<b>ใบงาน</b> ' +
        'ส่วนใบเฉลย หลักฐานการเรียนรู้ และรายงานชั้นเรียน เป็นสิทธิ์ของครูผู้ดูแล</div>' : '') +
    '</div>';

  h += '<div class="card noprint"><h3>2. ตั้งค่าเอกสาร</h3>';
  if (kind === 'worksheet' || kind === 'answerkey' || kind === 'classreport') {
    if (!DB.quizzes.length) h += '<div class="notice warn">ยังไม่มีชุดโจทย์ — ไปสร้างที่แท็บ <b>สร้างชุดโจทย์</b> ก่อน</div>';
    else h += '<div class="row"><label for="pQuiz">ชุดโจทย์</label><select id="pQuiz" class="grow" style="max-width:520px">' +
      DB.quizzes.slice().reverse().map(q => '<option value="' + q.id + '"' +
        (q.id === DB.cur.printQuizId ? ' selected' : '') + '>' + esc(q.title) + ' (' + q.items.length + ' ข้อ)</option>').join('') +
      '</select></div>';
  }
  if (kind === 'worksheet' || kind === 'answerkey') {
    h += '<div class="row" style="margin-top:11px"><label>ความหนาแน่น</label>' +
      '<div class="segbtn" style="max-width:300px">' + DENSITY.map(d =>
        '<button data-dens="' + d.k + '"' + (d.k === dens.k ? ' class="on"' : '') + '>' + d.n + '</button>').join('') +
      '</div><span class="hint">' + dens.d + '</span></div>' +
      '<div class="hint" style="margin-top:7px">ยิ่งแน่น รูปประกอบยิ่งย่อลงและช่องเขียนวิธีทำยิ่งสั้นลง<br>' +
      'ระบบวัดความสูงจริงของแต่ละข้อแล้วจัดหน้าให้เต็มพอดี จำนวนข้อต่อหน้าจึงต่างกันได้ ' +
      'ตามความยาวของโจทย์และขนาดรูปในหน้านั้น</div>';
  }
  if (kind === 'worksheet') {
    h += '<div class="row" style="margin-top:11px">' +
      '<label class="chk" style="min-height:auto"><input type="checkbox" id="wsSteps"' + (DB.cur.wsSteps ? ' checked' : '') + '>' +
      '<span><span class="t">มีกรอบขั้นตอนในใบงาน</span><span class="d">' +
      (function () {
        const L = workLines(dens.ws), on = WORK_BLOCKS.filter(b => L[b.id] > 0);
        if (!on.length) return 'ยังไม่ได้ตั้งบรรทัดช่องใดเลย';
        return dens.caps ? on.map(b => b.t + ' ' + L[b.id]).join(' · ') + ' บรรทัด'
                         : 'ระดับแน่นตัดหัวข้อออก เหลือบรรทัดเปล่า ' +
                           on.reduce((s, b) => s + L[b.id], 0) + ' บรรทัด';
      })() + '</span></span></label>' +
      '<label class="chk" style="min-height:auto"><input type="checkbox" id="wsOne"' + (DB.cur.wsOne ? ' checked' : '') + '>' +
      '<span><span class="t">ขึ้นหน้าใหม่ทุกข้อ</span><span class="d">เว้นที่ทำได้เต็มหน้า</span></span></label></div>' +
      '<div class="hint" style="margin-top:9px">ปรับจำนวนบรรทัดของแต่ละช่องได้ที่แท็บ <b>ตั้งค่า</b> ' +
      '(ตอนนี้รวม ' + workTotal(dens.ws) + ' บรรทัดต่อข้อ หลังย่อตามความหนาแน่นแล้ว) ' +
      '<button class="sm ghost" id="goSetWork">ไปตั้งค่า</button></div>';
  }
  if (kind === 'evidence') {
    if (!doneAt.length) h += '<div class="notice warn">ยังไม่มีผลการทำที่เสร็จแล้ว — ทำแบบฝึกหัดให้จบอย่างน้อยหนึ่งชุดก่อน</div>';
    else h += '<div class="row"><label for="pAt">ผลการทำ</label><select id="pAt" class="grow" style="max-width:560px">' +
      doneAt.map(a => '<option value="' + a.id + '"' + (a.id === DB.cur.printAtId ? ' selected' : '') + '>' +
        esc(attemptWho(a)) + ' · ' + esc((quizOf(a) || {}).title || '') + ' · ' + thDateTime(a.finishedAt) +
        ' · ' + Math.round(analyze(a).pct) + '%</option>').join('') + '</select></div>' +
      '<div class="hint" style="margin-top:8px">ต้องการพิมพ์ทั้งห้อง? เลือกทีละคนแล้วสั่งพิมพ์ หรือใช้ ' +
      '<b>รายงานสถิติชั้นเรียน</b> ซึ่งรวมทุกคนไว้ในเอกสารเดียว</div>';
  }
  if (!DB.settings.header.school && !DB.settings.header.teacher)
    h += '<div class="notice info" style="margin-top:10px">ยังไม่ได้ตั้งหัวกระดาษ (โรงเรียน / ครูผู้สอน / ภาคเรียน) — ' +
      'ตั้งได้ที่แท็บ <b>ตั้งค่า</b> แล้วจะขึ้นบนเอกสารทุกฉบับ</div>';
  h += '</div>';

  h += '<div class="card noprint"><h3>3. สั่งพิมพ์หรือบันทึกเป็น PDF</h3>' +
    '<div class="row"><button class="primary" id="btnDoPrint">พิมพ์ / บันทึกเป็น PDF</button>' +
    '<span class="hint">เอกสารตัวอย่างอยู่ด้านล่าง — เลื่อนดูก่อนพิมพ์ได้</span></div>' +
    '<div class="notice info" style="margin-top:11px">' +
    '<b>บนไอแพด:</b> กดปุ่มด้านบน → ในหน้าต่างที่ขึ้นมาเลือก <b>แชร์</b> หรือ <b>บันทึกลงในไฟล์</b> ' +
    'จะได้ไฟล์ PDF เก็บไว้ในแอพไฟล์<br>' +
    '<b>บนคอมพิวเตอร์:</b> ในช่อง “เครื่องพิมพ์” เลือก <b>บันทึกเป็น PDF</b> หรือ <b>Microsoft Print to PDF</b> แล้วกดบันทึก<br>' +
    'แนะนำให้ตั้งขนาดกระดาษ A4 และปิด “หัวกระดาษและท้ายกระดาษ” ของเบราว์เซอร์</div></div>';

  h += '<h3 style="margin:18px 0 8px" class="noprint">ตัวอย่างเอกสาร</h3>';
  $('#pane-print').innerHTML = h;
  $('#printarea').innerHTML = buildDoc(kind, {
    quizId: DB.cur.printQuizId, attemptId: DB.cur.printAtId,
    withSteps: DB.cur.wsSteps, onePer: DB.cur.wsOne, density: DB.cur.printDens
  });
  // คลาสความหนาแน่นคุมขนาดรูปและความสูงบรรทัด · keydoc ปล่อยให้ใบเฉลยแบ่งกลางข้อได้
  $('#printarea').className = 'dn-' + dens.k + (kind === 'answerkey' ? ' keydoc' : '');
  document.body.classList.add('docpreview');
  // ใบงานตัดหน้าเองจากความสูงจริง · ใบเฉลยและรายงานปล่อยให้ไหลไปตามเนื้อหา
  if (kind === 'worksheet') paginatePrint($('#printarea'), DB.cur.wsOne);

  $$('input[name=dk]').forEach(r => r.addEventListener('change', e => {
    DB.cur.printKind = e.target.value; save(); renderPrint();
  }));
  const pq = $('#pQuiz'); if (pq) pq.addEventListener('change', e => { DB.cur.printQuizId = e.target.value; save(); renderPrint(); });
  const pa = $('#pAt'); if (pa) pa.addEventListener('change', e => { DB.cur.printAtId = e.target.value; save(); renderPrint(); });
  const ws = $('#wsSteps'); if (ws) ws.addEventListener('change', e => { DB.cur.wsSteps = e.target.checked; save(); renderPrint(); });
  const gw = $('#goSetWork'); if (gw) gw.addEventListener('click', () => setTab('setting'));
  const wo = $('#wsOne'); if (wo) wo.addEventListener('change', e => { DB.cur.wsOne = e.target.checked; save(); renderPrint(); });
  $$('[data-dens]').forEach(b => b.addEventListener('click', () => {
    DB.cur.printDens = b.getAttribute('data-dens'); save(); renderPrint();
  }));
  $('#btnDoPrint').addEventListener('click', () => window.print());
}

/* ============================================================================
   8) ชุดทดสอบตัวเอง — เปิดด้วย physci.html?selftest=1
   วนสร้างทุกแม่แบบหลาย seed แล้วตรวจว่าโจทย์และเฉลยไม่มีอะไรพัง
   ========================================================================== */
function runSelfTest(seeds) {
  const N = seeds || 200, fails = [];
  const bad = s => typeof s === 'string' && /undefined|NaN|Infinity|\{[a-zA-Z_]\w*\}/.test(s);
  TPL.forEach(tpl => {
    for (let s = 1; s <= N; s++) {
      const p = buildProblem(tpl.id, s * 104729, { g: DB.settings.g, easyG10: DB.settings.easyG10 });
      if (!p) { fails.push(tpl.id + ' seed=' + s + ': สร้างโจทย์ไม่ได้'); continue; }
      p.finds.forEach((f, k) => {
        if (typeof f.value !== 'number' || !isFinite(f.value)) fails.push(tpl.id + ' seed=' + s + ': คำตอบ[' + k + '] ไม่ใช่ตัวเลข');
        else if (dpOf(f.value, 4) > 2) fails.push(tpl.id + ' seed=' + s + ': คำตอบ[' + k + '] ทศนิยมเกิน 2 (' + f.value + ')');
        else if (f.positive && f.value <= 0) fails.push(tpl.id + ' seed=' + s + ': คำตอบ[' + k + '] ควรเป็นบวก (' + f.value + ')');
      });
      p.given.forEach((g, k) => {
        if (typeof g.v === 'number' && (!isFinite(g.v) || dpOf(g.v, 4) > 2))
          fails.push(tpl.id + ' seed=' + s + ': ค่าที่กำหนดให้[' + k + '] ไม่สวย (' + g.v + ')');
      });
      if (bad(p.stem)) fails.push(tpl.id + ' seed=' + s + ': ข้อความโจทย์ผิดปกติ');
      const b = stepBodies(p);
      if (b.length !== (p.theory ? 3 : 7)) fails.push(tpl.id + ' seed=' + s + ': จำนวนขั้นอธิบายไม่ถูกต้อง');
      b.forEach((x, k) => {
        if (!x || !String(x).trim()) fails.push(tpl.id + ' seed=' + s + ': ขั้นที่ ' + (k + 1) + ' ว่าง');
        if (bad(x)) fails.push(tpl.id + ' seed=' + s + ': ขั้นที่ ' + (k + 1) + ' มีข้อความผิดปกติ');
      });
      if (tpl.level === 'ง่าย' || p.theory) {
        if (!p.choices || p.choices.length !== 4) fails.push(tpl.id + ' seed=' + s + ': ตัวเลือกไม่ครบ 4');
        else {
          if (p.choices.filter(c => c.correct).length !== 1) fails.push(tpl.id + ' seed=' + s + ': ตัวเลือกที่ถูกไม่ใช่ 1 ตัว');
          const v = p.theory ? p.choices.map(c => c.text) : p.choices.map(c => c.value.toFixed(2));
          if (new Set(v).size !== 4) fails.push(tpl.id + ' seed=' + s + ': ตัวเลือกซ้ำกัน');
        }
        if (p.theory && (!p.idea || !p.why)) fails.push(tpl.id + ' seed=' + s + ': ขาดคำอธิบายแนวคิดหรือข้อสรุป');
      }
    }
  });
  // ตรวจว่าทุกบทมีแม่แบบครบทุกระดับ — สำคัญมากตอนเพิ่มบทใหม่ จะได้รู้ว่ายังขาดตรงไหน
  TOPICS.forEach(t => LEVELS.forEach(l => {
    const n = TPL.filter(x => x.topic === t.id && x.level === l).length;
    if (!n) fails.push('เรื่อง "' + t.name + '" ยังไม่มีแม่แบบระดับ' + l + ' เลย');
    else if (n < 3) fails.push('เรื่อง "' + t.name + '" ระดับ' + l + ' มีแค่ ' + n +
      ' แม่แบบ (ควรมีอย่างน้อย 3 เพื่อไม่ให้โจทย์ซ้ำเร็วเกินไป)');
  }));
  const orphan = TPL.filter(x => ALL_TOPIC_IDS.indexOf(x.topic) < 0);
  orphan.forEach(x => fails.push('แม่แบบ ' + x.id + ' อ้างเรื่อง id=' + x.topic + ' ที่ไม่มีในสารบัญ TOPICS'));

  const uniq = Array.from(new Set(fails));
  const counts = {};
  TOPICS.forEach(t => LEVELS.forEach(l => {
    counts[t.id + '|' + l] = TPL.filter(x => x.topic === t.id && x.level === l).length;
  }));
  document.body.classList.remove('docpreview');
  $('#printarea').innerHTML = '';
  $('#pane-make').innerHTML =
    '<div class="card"><h3>ผลการทดสอบคลังโจทย์</h3>' +
    '<div class="statgrid"><div class="stat"><div class="v">' + TPL.length + '</div><div class="k">แม่แบบทั้งหมด</div></div>' +
    '<div class="stat"><div class="v">' + (TPL.length * N).toLocaleString() + '</div><div class="k">โจทย์ที่สร้างทดสอบ</div></div>' +
    '<div class="stat"><div class="v" style="color:' + (uniq.length ? 'var(--bad)' : 'var(--ok)') + '">' +
      uniq.length + '</div><div class="k">ข้อผิดพลาด</div></div></div>' +
    '<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>เรื่อง</th>' +
    LEVELS.map(l => '<th class="num">' + l + '</th>').join('') + '<th class="num">รวม</th></tr></thead><tbody>' +
    TOPICS.map(t => '<tr><td>' + esc(t.name) + '</td>' +
      LEVELS.map(l => '<td class="num">' + counts[t.id + '|' + l] + '</td>').join('') +
      '<td class="num"><b>' + LEVELS.reduce((s, l) => s + counts[t.id + '|' + l], 0) + '</b></td></tr>').join('') +
    '</tbody></table></div>' +
    (uniq.length
      ? '<div class="notice bad" style="margin-top:12px"><b>พบข้อผิดพลาด</b><br>' +
        uniq.slice(0, 50).map(esc).join('<br>') + (uniq.length > 50 ? '<br>… อีก ' + (uniq.length - 50) + ' รายการ' : '') + '</div>'
      : '<div class="notice info" style="margin-top:12px">ผ่านทั้งหมด — ทุกแม่แบบสร้างโจทย์ได้ ' +
        'คำตอบเป็นตัวเลขที่มีทศนิยมไม่เกิน 2 ตำแหน่ง วิธีทำครบ 7 ขั้น และตัวเลือกปรนัยถูกต้อง</div>') +
    '<div class="row" style="margin-top:12px"><button class="primary" id="stBack">กลับสู่หน้าปกติ</button></div></div>';
  $('#stBack').addEventListener('click', () => { location.href = location.pathname; });
  return uniq;
}

/* ============================================================================
   9) เริ่มต้นโปรแกรม
   ========================================================================== */
loadDB();
applyBuiltin();
adoptPortalSession();
$$('#tabs button').forEach(b => b.addEventListener('click', () => {
  if (TAB === 'do') stampTime();
  setTab(b.dataset.tab);
}));
$('#btnBackup').addEventListener('click', backup);
$('#btnRestore').addEventListener('click', restore);
$('#btnLogout').addEventListener('click', doLogout);
// ต่อเน็ตได้เมื่อไร ส่งผลที่ค้างอยู่ให้เองทันที
window.addEventListener('online', () => flushOutbox(false));
// บันทึกเวลาของข้อที่กำลังทำอยู่ก่อนปิดหน้า
window.addEventListener('beforeunload', () => { if (TAB === 'do') { stampTime(); save(true); } });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (TAB === 'do') { stampTime(); save(true); }
    procLeave();
  } else procBack();
});
window.addEventListener('pagehide', () => {
  if (TAB === 'do') { stampTime(); save(true); }
  procLeave();
});
setInterval(procTick, 1000);
/* เปิดแอปกลับมาแล้วพบว่าเลยเส้นตายไปแล้ว — ส่งให้ตั้งแต่ตอนโหลด
   เกิดเมื่อนักเรียนปิดแอปทิ้งไว้แล้วเปิดใหม่ทีหลัง หรือเครื่องดับกลางคัน */
(function () {
  const a = procCur();
  if (!a) return;
  if (a.proc.openAt) procReturn();          // ปิดเหตุการณ์ที่ค้างจากตอนเครื่องดับ
  const left = procSecLeft(a);
  if (left != null && left <= 0) doFinish('หมดเวลา');
})();

if (/[?&]selftest=1/.test(location.search)) {
  setTab('make');
  runSelfTest(200);
} else {
  // เริ่มที่แท็บที่เหมาะกับสถานะปัจจุบัน
  const a = curAttempt();
  setTab(a && !a.finishedAt ? 'do' : 'make');
  renderGate();
  if (isStudent()) {
    flushOutbox(false);
    loadMyAssignments(true);
  }
}
$('#saveState').textContent = storageOK ? 'พร้อมใช้งาน' : 'บันทึกไม่ได้';
renderOutboxBadge();
markSession();
renderBrand();
applyAppIcon();
</script>
