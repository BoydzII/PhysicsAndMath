<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="คณิต ม.ต้น">
<meta name="application-name" content="คณิต ม.ต้น">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="คลังโจทย์ชีววิทยา ม.4 — สุ่มโจทย์ แสดงวิธีคิดเป็นขั้น ตรวจคำตอบ วิเคราะห์ผู้เรียน และพิมพ์เป็น PDF">
<!-- ไอคอนหน้าจอโฮม: ใส่ค่าจริงตอนโหลดด้วย applyAppIcon() ซึ่งจะใช้โลโก้โรงเรียนถ้ามี -->
<link rel="apple-touch-icon" id="linkAppIcon">
<link rel="icon" id="linkFavicon">
<title>คลังโจทย์ชีววิทยา ม.4</title>
<style>
/* ============================================================
   ธีมและตัวแปรสี — ชุดเดียวกับ gradebook.html
   ============================================================ */
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel2:#f9fafc; --ink:#16202e; --muted:#67748a;
  --line:#dde3ec; --line2:#eef2f7; --brand:#1f6feb; --brand-ink:#ffffff;
  --ok:#0f8a53; --ok-bg:#e6f6ee; --bad:#c62828; --bad-bg:#fdecec;
  --warn:#a05a00; --warn-bg:#fff5e2; --group:#6b3fd4; --group-bg:#f1ecfd;
  --lv1:#0f8a53; --lv2:#a05a00; --lv3:#c62828;   /* ง่าย / ปานกลาง / ยาก */
  --shadow:0 1px 2px rgba(16,30,54,.06),0 8px 24px rgba(16,30,54,.08);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11151c; --panel:#181e27; --panel2:#1e2530; --ink:#e6ecf5; --muted:#95a3b8;
    --line:#2b3441; --line2:#232b36; --brand:#4d8dfb; --brand-ink:#0b1220;
    --ok:#4bd08b; --ok-bg:#123024; --bad:#ff7b7b; --bad-bg:#3a1c1c;
    --warn:#ffc46b; --warn-bg:#3a2c12; --group:#b79bff; --group-bg:#2a2340;
    --lv1:#4bd08b; --lv2:#ffc46b; --lv3:#ff7b7b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Sarabun","Leelawadee UI","Noto Sans Thai","Segoe UI",Tahoma,sans-serif;
  font-size:16px; line-height:1.6;
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;touch-action:manipulation}

/* ---------- แถบบนสุด ---------- */
.stickytop{position:sticky; top:0; z-index:40; background:var(--bg); padding-top:env(safe-area-inset-top)}
.topbar{
  background:var(--panel); border-bottom:1px solid var(--line); padding:8px 14px;
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; box-shadow:var(--shadow);
}
.brand{font-weight:700; font-size:17px; white-space:nowrap; display:flex; align-items:center; gap:7px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--brand);display:inline-block}
.who{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.spacer{flex:1 1 auto}
.savestate{font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:80px;text-align:right}
.savestate.on{color:var(--ok)}

select,input[type=text],input[type=number],textarea{
  background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; outline:none; max-width:100%; min-height:40px;
}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
button{
  background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:9px 14px; cursor:pointer; white-space:nowrap; min-height:44px;
}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button.danger{color:var(--bad);border-color:var(--line)}
button.ghost{background:transparent}
button.sm{padding:5px 10px;font-size:14px;border-radius:7px;min-height:36px}
button.sm.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){
  button:hover{border-color:var(--brand)}
  button.primary:hover{filter:brightness(1.08)}
  button.danger:hover{border-color:var(--bad);background:var(--bad-bg)}
}

/* ---------- แท็บ ---------- */
.tabs{
  display:flex; gap:2px; padding:0 10px;
  background:var(--bg); border-bottom:1px solid var(--line);
  overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  border:none;background:none;border-radius:0;border-bottom:3px solid transparent;
  padding:11px 13px;color:var(--muted);font-weight:600;min-height:46px;font-size:15px;
}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}

main{padding:16px 14px 60px; max-width:1180px; margin:0 auto}
section.tabpane{display:none}
section.tabpane.active{display:block}

/* ---------- การ์ด ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
      padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.card>h3{margin:0 0 10px;font-size:16px}
.card>h3 .sub{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.hint{font-size:13.5px;color:var(--muted)}
.notice{border-radius:var(--r);padding:10px 13px;margin-bottom:12px;font-size:14.5px}
.notice.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.notice.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.notice.info{background:var(--panel2);border:1px solid var(--line);color:var(--muted)}

/* ---------- ตาราง ---------- */
.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{background:var(--panel2);position:sticky;top:0;font-weight:600;font-size:13.5px;color:var(--muted);z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}

/* ---------- สถิติ / แถบ ---------- */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--muted)}
.bar{height:9px;border-radius:5px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);transition:width .25s}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}

/* ---------- ป้ายระดับ / เรื่อง ---------- */
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12.5px;font-weight:600;
     border:1px solid currentColor;white-space:nowrap}
.tag.l0{color:var(--group)}
.tag.l1{color:var(--lv1)} .tag.l2{color:var(--lv2)} .tag.l3{color:var(--lv3)}
.tag.t{color:var(--muted);font-weight:400}

/* ---------- โมดัล ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,26,.5);display:flex;
          align-items:center;justify-content:center;z-index:100;padding:14px}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);
       width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column}
.modal header{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center}
.modal .body{padding:16px;overflow:auto;flex:1 1 auto}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .x{margin-left:auto;background:none;border:none;font-size:24px;line-height:1;padding:0 4px;color:var(--muted);min-height:auto}

/* ---------- toast ---------- */
/* หน้าเข้าใช้งาน — คลุมทั้งจอเมื่อเชื่อมชีตแล้วแต่ยังไม่ได้ลงชื่อเข้าใช้ */
.gate{display:none;position:fixed;inset:0;z-index:150;background:var(--bg);
  overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.gate .box{max-width:430px;margin:6vh auto;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:22px;box-shadow:0 6px 26px rgba(0,0,0,.09)}
.gate .glogo{display:block;margin:0 auto 12px;max-height:110px;max-width:150px;object-fit:contain}
.gate .credit{margin-top:16px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.brandlogo{height:30px;width:auto;max-width:44px;object-fit:contain;margin-right:8px;vertical-align:middle;flex:none}
.logopick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logobox{width:96px;height:96px;border:1px dashed var(--line);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;background:var(--bg);flex:none;overflow:hidden}
.logobox img{max-width:88px;max-height:88px;object-fit:contain}
.credit-print{margin-top:14px;padding-top:8px;border-top:1px solid #ccc;
  font-size:9pt;color:#555;text-align:center;line-height:1.6}
.gate h2{margin:0 0 4px;font-size:20px}
.gate .lead{color:var(--muted);font-size:13.5px;margin-bottom:16px;line-height:1.7}
.gate label.f{display:block;font-size:13px;color:var(--muted);margin:11px 0 4px}
.gate input{width:100%;font-size:16px}
.gate .actions{margin-top:16px;display:flex;gap:9px;flex-wrap:wrap}
.gate .alt{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);
  font-size:13px;color:var(--muted)}
.gate .msg{margin-top:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;
       display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1e2732;color:#fff;padding:10px 18px;border-radius:22px;
       box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14.5px;animation:tin .2s ease;max-width:88vw;text-align:center}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)} .toast.warn{background:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================
   ส่วนของโจทย์และวิธีทำ
   ============================================================ */
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qno{font-weight:700;font-size:17px}
.stem{font-size:17px;line-height:1.75;margin:8px 0}
.fig{margin:14px 0;text-align:center}
.fig svg{max-width:100%;height:auto;display:inline-block}
svg .ln{stroke:var(--ink);fill:none;stroke-width:1.6}
svg .ln2{stroke:var(--muted);fill:none;stroke-width:1.2}
svg .dash{stroke:var(--muted);fill:none;stroke-width:1.2;stroke-dasharray:4 3}
svg .frc{stroke:var(--brand);fill:none;stroke-width:2}
svg .bdy{fill:var(--line2);stroke:var(--ink);stroke-width:1.6}
svg .hat{fill:var(--muted)}
/* paint-order ทำให้วาดเส้นขอบก่อนแล้วค่อยทับด้วยตัวอักษร
   ได้ผลเป็น "ขอบสีพื้นหลัง" รอบตัวเลข ทำให้อ่านออกเสมอแม้ตัวเลขจะพาดทับเส้นแรง */
svg text{fill:var(--ink);font-size:14.5px;font-family:inherit;
  paint-order:stroke fill;stroke:var(--panel);stroke-width:3.4px;stroke-linejoin:round;
  stroke-linecap:round;font-weight:500}
svg text.mut{fill:var(--muted);font-size:13px;stroke-width:3px}
svg .arh{fill:var(--brand);stroke:none}
svg .arh2{fill:var(--ink);stroke:none}
/* คลาสของรูปคณิตศาสตร์ — ขึ้นต้นด้วย f ทุกตัวเพื่อไม่ให้ชนกับคลาสของหน้าเว็บ
   (เบราว์เซอร์ถือ width/height ของ SVG เป็นสมบัติ CSS ด้วย ถ้าชนกับ .bar ของ
   แถบสถิติ ความสูงของแท่งกราฟจะถูกทับจนกลายเป็นขีดสั้น ๆ ลอยอยู่กลางอากาศ) */
svg .fbox{fill:none;stroke:var(--ink);stroke-width:1.5}
svg .ffil{fill:var(--brand);opacity:.3;stroke:none}
svg .fgrd{stroke:var(--line);fill:none;stroke-width:1}
svg .fbar{fill:var(--brand);opacity:.72;stroke:none}
svg .fpt{fill:var(--brand);stroke:var(--panel);stroke-width:1.8}

/* สมการ */
.eq{font-family:"Cambria Math","Times New Roman",Georgia,serif;font-size:18px;
    font-style:italic;white-space:nowrap;display:inline-block}
.eq .u{font-style:normal}            /* หน่วยและตัวเลข ไม่เอียง */
.eqblk{margin:5px 0 5px 8px}
.eqblk .eq{font-size:18.5px}
/* เศษส่วนซ้อนสองชั้น — เขียนแบบเดียวกับที่นักเรียนเขียนในสมุด */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
      margin:0 2px;font-style:normal;font-size:.9em;line-height:1.1}
.frac .fn{padding:0 4px 1px}
.frac .fd{padding:1px 4px 0;border-top:1.4px solid currentColor}
/* รากที่สองและรากที่สาม */
.sqrt{display:inline-block;font-style:normal;white-space:nowrap}
.sqrt .sg{margin-right:0}
.sqrt .sr{border-top:1.3px solid currentColor;padding:0 3px 0 1px;margin-left:-1px}
.sqrt .si{font-size:.62em;vertical-align:.55em;margin-right:-3px}

/* กล่องวิธีทำ 7 ขั้น */
.sol{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.solstep{border-bottom:1px solid var(--line2)}
.solstep:last-child{border-bottom:none}
.solstep>.h{display:flex;gap:9px;align-items:center;padding:9px 12px;background:var(--panel2);
            cursor:pointer;font-weight:600;font-size:14.5px;user-select:none}
.solstep>.h .n{background:var(--brand);color:var(--brand-ink);width:23px;height:23px;border-radius:50%;
               display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.solstep>.h .cv{margin-left:auto;color:var(--muted);font-size:13px;font-weight:400}
.solstep>.b{padding:11px 13px 13px 44px}
.solstep.closed>.b{display:none}
.solstep .why{color:var(--muted);font-size:14px;margin-top:3px}

/* ตารางสิ่งที่กำหนดให้ */
table.given{width:auto;font-size:15px;border:1px solid var(--line);border-radius:8px}
table.given td{border-bottom:1px solid var(--line2);padding:5px 11px;white-space:nowrap}
table.given td.s{font-family:"Cambria Math","Times New Roman",Georgia,serif;font-style:italic;
                 font-size:17px;text-align:right;padding-right:2px}
table.given td.e{padding:0 3px;color:var(--muted)}
table.given td.v{font-variant-numeric:tabular-nums;font-weight:600}
table.given td.d{color:var(--muted);font-size:13.5px}

/* ---------- ช่องตอบ ---------- */
.ansbox{margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2)}
.ansrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ansrow label{font-size:15px;min-width:150px}
.ansrow .lab .eq{font-size:17px}
input.numin{width:150px;text-align:right;font-variant-numeric:tabular-nums;font-size:17px}
input.numin.ok{border-color:var(--ok);background:var(--ok-bg)}
input.numin.bad{border-color:var(--bad);background:var(--bad-bg)}
.unit{color:var(--muted);font-size:15px;min-width:64px}
.choices{display:grid;gap:9px;grid-template-columns:1fr 1fr}
@media (max-width:620px){.choices{grid-template-columns:1fr}}
.choices.txt{grid-template-columns:1fr}
.choices.txt .choice{align-items:flex-start}
.choices.txt .choice>span:last-child{white-space:normal;line-height:1.6}
.whylist{display:flex;flex-direction:column;gap:7px}
.whyrow{border-left:3px solid var(--line);padding:4px 0 4px 10px;font-size:14.5px}
.whyrow.ok{border-left-color:var(--ok)}
.whyrow.no{border-left-color:var(--bad)}
.whyrow .wk{font-weight:700;color:var(--muted);margin-right:5px}
.whyrow .wm{font-weight:700;margin-left:6px;font-size:13px}
.whyrow.ok .wm{color:var(--ok)} .whyrow.no .wm{color:var(--bad)}
.whyrow .wd{color:var(--muted);font-size:13.5px;line-height:1.6;margin-top:2px}
#printarea .whyrow{border-left:2px solid #666} #printarea .whyrow .wd{color:#444}
.choice{display:flex;gap:10px;align-items:center;padding:11px 13px;border:1px solid var(--line);
        border-radius:var(--r);background:var(--panel);cursor:pointer;text-align:left;min-height:52px;width:100%}
.choice .k{font-weight:700;color:var(--muted);flex:0 0 auto}
.choice.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.bad{border-color:var(--bad);background:var(--bad-bg)}
.verdict{font-weight:700;margin-top:9px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

/* ---------- แถบความคืบหน้าข้อ ---------- */
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qnav button{width:40px;height:40px;min-height:40px;padding:0;border-radius:9px;font-weight:600;font-size:14px}
.qnav button.cur{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
.qnav button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.qnav button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.qnav button.half{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}

/* ---------- ตัวเลือกในแท็บสร้างชุด ---------- */
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);
     border-radius:var(--r);background:var(--panel2);cursor:pointer;min-height:44px}
.chk.on{border-color:var(--brand);background:rgba(31,111,235,.07)}
.chk input{margin:3px 0 0;width:19px;height:19px;flex:0 0 auto;min-height:auto}
.chk .t{font-weight:600;font-size:15px}
.chk .d{font-size:13px;color:var(--muted)}
.gridcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;
         margin:9px 0 0 6px;padding-left:12px;border-left:2px solid var(--line)}
.subchk{display:flex;gap:7px;align-items:center;font-size:14px;padding:5px 0;cursor:pointer;min-height:34px}
.subchk input{width:17px;height:17px;min-height:auto}

/* ---------- การ์ดเลือกบท ---------- */
.topiccard{align-self:start}
.topiccard .chk{position:relative;flex-direction:column;align-items:stretch;padding-right:38px}
.topiccard .chk>span{display:block}
.topiccard .chk input{position:absolute;top:11px;right:11px;margin:0}
.chk .ch{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.3px;
  color:var(--brand);background:rgba(31,111,235,.12);border-radius:5px;padding:1px 7px;margin-bottom:5px}
.topiccard.exam .chk{border-color:var(--group)}
.topiccard.exam .chk.on{background:var(--group-bg)}
.topiccard.exam .ch{color:var(--group);background:var(--group-bg)}

<script>
/* กันหน้าขาว — ถ้าสคริปต์หลักตายกลางคัน หน้าจอจะไม่มีอะไรขึ้นเลยและไม่มีทางรู้สาเหตุ
   สคริปต์ก้อนนี้จึงต้องอยู่ "ก่อน" สคริปต์หลัก เพื่อดักข้อผิดพลาดได้ตั้งแต่บรรทัดแรก

   แยกความรุนแรงเป็นสองระดับ เพราะไม่ใช่ทุกข้อผิดพลาดที่ทำให้ใช้งานต่อไม่ได้
     error                → โปรแกรมหยุดจริง แสดงเต็มจอพร้อมปุ่มล้างข้อมูล
     unhandledrejection   → คำสั่งที่รอผลล้มเหลว ส่วนใหญ่หน้ายังใช้งานได้
                            จึงขึ้นเป็นแถบด้านบนที่ปิดได้ ไม่บังเนื้อหา */
(function () {
  var fatalShown = false, barShown = false;

  function detail(msg, err) {
    var s = String(msg || 'เกิดข้อผิดพลาด');
    if (err && err.stack) s += '\n\n' + String(err.stack).split('\n').slice(0, 6).join('\n');
    return s;
  }

  function fatal(text) {
    if (fatalShown || !document.body) return;
    fatalShown = true;
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;overflow:auto;padding:22px;' +
      'background:#fff;color:#111;font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif');
    d.innerHTML =
      '<h2 style="margin:0 0 10px;font-size:20px">เปิดแอปไม่สำเร็จ</h2>' +
      '<p style="margin:0 0 14px">ตัวโปรแกรมหยุดทำงานกลางคัน ' +
      'ส่วนใหญ่เกิดจากข้อมูลเก่าที่ค้างอยู่ในเครื่อง กดปุ่มด้านล่างเพื่อล้างข้อมูล' +
      '<b>เฉพาะวิชานี้</b>แล้วเปิดใหม่ได้เลย วิชาอื่นไม่กระทบ</p>' +
      '<pre id="__errbox" style="white-space:pre-wrap;word-break:break-word;background:#f5f5f5;' +
      'border:1px solid #ddd;border-radius:8px;padding:10px;font-size:12.5px;margin:0"></pre>' +
      '<button id="__wipe" style="margin-top:14px;padding:11px 18px;font-size:15px;border-radius:9px;' +
      'border:1px solid #999;background:#fff;cursor:pointer">ล้างข้อมูลของวิชานี้แล้วเปิดใหม่</button>' +
      '<p style="margin:14px 0 0;font-size:13px;color:#666">ถ้ายังไม่หาย ' +
      'ช่วยถ่ายภาพข้อความในกรอบเทาส่งให้ผู้ดูแลด้วย</p>';
    document.body.appendChild(d);
    d.querySelector('#__errbox').textContent = text;
    d.querySelector('#__wipe').onclick = function () {
      try { if (window.__LSKEY) localStorage.removeItem(window.__LSKEY); } catch (e) {}
      location.reload();
    };
  }

  function bar(text) {
    if (barShown || !document.body) return;
    barShown = true;
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:99998;max-height:45vh;overflow:auto;' +
      'padding:10px 14px;background:#fff3f3;border-bottom:2px solid #d33;color:#111;' +
      'font:13px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif');
    d.innerHTML =
      '<b>มีคำสั่งเบื้องหลังทำงานไม่สำเร็จ</b> — หน้าจอยังใช้งานได้ตามปกติ ' +
      '<button id="__barx" style="float:right;border:1px solid #b00;background:#fff;border-radius:7px;' +
      'padding:3px 10px;cursor:pointer">ปิด</button>' +
      '<pre id="__errbox" style="white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font-size:12px"></pre>';
    document.body.appendChild(d);
    d.querySelector('#__errbox').textContent = text;
    d.querySelector('#__barx').onclick = function () { d.remove(); };
  }

  window.addEventListener('error', function (e) {
    fatal(detail((e.message || 'เกิดข้อผิดพลาด') + '\n' + (e.filename || '') +
      ' บรรทัดที่ ' + (e.lineno || '?') + ' คอลัมน์ ' + (e.colno || '?'), e.error));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    bar(detail(r && r.message ? r.message : String(r), r));
  });
})();
</script>
<script>
"use strict";

/* ============================================================================
   ค่าที่ฝังมากับตัวไฟล์
   ----------------------------------------------------------------------------
   ปกติการเชื่อมต่อ Google Sheet เก็บอยู่ใน localStorage ซึ่งเป็นของแต่ละเครื่อง
   ก๊อปไฟล์ไปเครื่องอื่นจึงเหมือนเครื่องใหม่ ต้องกรอก URL เองทุกครั้ง
   บล็อกนี้จึงมีไว้ให้ "ฝัง" ค่าตั้งต้นลงในตัวไฟล์ได้เลย
   ครูกดปุ่ม "สร้างไฟล์สำหรับแจกนักเรียน" ในแท็บตั้งค่า แล้วแอพจะเขียนบล็อกนี้
   ทับด้วยค่าปัจจุบัน แล้วให้ดาวน์โหลดออกมาเป็นไฟล์ใหม่
   *** ห้ามลบบรรทัดเครื่องหมาย @@BUILTIN@@ ทั้งสองอัน ตัวสร้างไฟล์ใช้หาตำแหน่ง ***
   ========================================================================== */
/* @@BUILTIN@@ */
const BUILTIN = {"url":"","studentOnly":false,"lockCloud":false,"logo":"","header":null,"about":null};
/* @@BUILTIN-END@@ */

/* ถ่ายภาพซอร์สของหน้านี้ไว้ตั้งแต่สคริปต์เพิ่งเริ่มทำงาน
   ตอนนี้ทุก <section> ยังว่างและยังไม่มีไอคอนถูกใส่เข้าไป จึงได้ไฟล์สะอาดตรงต้นฉบับ
   ใช้เป็นทางสำรองเวลาเปิดจากไฟล์ในเครื่อง (file://) ซึ่ง fetch ตัวเองไม่ได้ */
const PRISTINE_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;

/* ============================================================================
   0) UTIL — ตัวช่วยทั่วไป (ยกมาจาก gradebook.html)
   ========================================================================== */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function clamp(n, lo, hi) { return n < lo ? lo : n > hi ? hi : n; }

/** จัดรูปตัวเลขให้อ่านง่าย ตัดศูนย์ท้ายทศนิยม ใส่จุลภาคคั่นหลักพัน */
function fmt(n, dp) {
  if (n == null || !isFinite(n)) return '—';
  const d = dp == null ? 2 : dp;
  let s = Math.abs(n - Math.round(n)) < 1e-9 ? String(Math.round(n)) : n.toFixed(d).replace(/0+$/, '').replace(/\.$/, '');
  const neg = s[0] === '-'; if (neg) s = s.slice(1);
  const [i, f] = s.split('.');
  s = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (f ? '.' + f : '');
  return (neg ? '-' : '') + s;
}
/** เหมือน fmt แต่ไม่ใส่จุลภาค — ใช้ในสมการเพื่อไม่ให้สับสนกับเครื่องหมายคั่น */
function fmtq(n, dp) {
  if (n == null || !isFinite(n)) return '—';
  const d = dp == null ? 2 : dp;
  if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
  return n.toFixed(d).replace(/0+$/, '').replace(/\.$/, '');
}
function round2(n) { return Math.round(n * 100) / 100; }
/** ใช้กับค่าคำตอบในแม่แบบโจทย์: ปัดเศษให้ก็ต่อเมื่อค่านั้น "สวย" อยู่แล้ว
    ถ้าไม่สวยจะคืนค่าดิบไว้ เพื่อให้ตัวคัดกรองปฏิเสธแล้วสุ่มพารามิเตอร์ใหม่
    (ถ้าปัดทิ้งไปเลย ค่าอย่าง 245.8333 จะกลายเป็น 245.83 แล้วผ่านการตรวจไปเงียบ ๆ) */
function r2(n) { return dpOf(n, 4) <= 2 ? Math.round(n * 100) / 100 : n; }
/** จำนวนตำแหน่งทศนิยมที่จำเป็นจริง ๆ (ใช้คุมให้โจทย์ออกเลขสวย) */
function dpOf(n, max) {
  const m = max == null ? 6 : max;
  for (let d = 0; d <= m; d++) if (Math.abs(n - Number(n.toFixed(d))) < 1e-9) return d;
  return m + 1;
}
const THDATE = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const THMON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(ts) {
  const d = new Date(ts);
  return d.getDate() + ' ' + THMON[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}
function thDateTime(ts) {
  const d = new Date(ts);
  return thDate(ts) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function mmss(sec) {
  const s = Math.max(0, Math.round(sec));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function toast(msg, kind) {
  const t = document.createElement('div');

/** คัดลอกลงคลิปบอร์ด — Safari บนไอแพดบางรุ่นไม่มี navigator.clipboard จึงต้องมีทางสำรอง */
async function copyText(str) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(str); return true; }
  } catch (e) { /* ตกไปใช้ทางสำรองด้านล่าง */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = str;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, str.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* Base64 ที่รองรับภาษาไทย — btoa รับได้แค่ไบต์ ต้องแปลงผ่าน UTF-8 ก่อน */
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64dec(s) {
  const bin = atob(String(s).trim());
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

let modalStack = [];
function openModal(opts) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML =
    '<div class="modal"' + (opts.wide ? ' style="max-width:1000px"' : '') + '>' +
      '<header>' + esc(opts.title) + '<button class="x" data-close>&times;</button></header>' +
      '<div class="body">' + (opts.bodyHTML || '') + '</div>' +
      '<footer></footer>' +
    '</div>';
  const foot = $('footer', bg);
  const close = () => { bg.remove(); modalStack = modalStack.filter(x => x !== bg); };
  (opts.buttons || [{ label: 'ปิด' }]).forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (b.cls) btn.className = b.cls;
    btn.addEventListener('click', () => { if (b.act) b.act(close, bg); else close(); });
    foot.appendChild(btn);
  });
  bg.addEventListener('click', e => {
    if (e.target === bg || e.target.hasAttribute('data-close')) close();
  });
  $('#modal-root').appendChild(bg);
  modalStack.push(bg);
  if (opts.onMount) opts.onMount(bg, close);
  return { root: bg, close };
}
function confirmBox(title, msg, okLabel) {
  return new Promise(res => {
    openModal({
      title: title,
      bodyHTML: '<div>' + msg + '</div>',
      buttons: [
        { label: 'ยกเลิก', act: c => { c(); res(false); } },
        { label: okLabel || 'ตกลง', cls: 'primary', act: c => { c(); res(true); } }
      ]
    });
  });
}
document.addEventListener('keydown', e => {

});

/** อ่านไฟล์รูปแล้วย่อลงให้พอดี เพื่อไม่ให้พื้นที่เก็บข้อมูลของเบราว์เซอร์เต็ม */
function shrinkImage(file, maxSide) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const m = maxSide || 320;
      const sc = Math.min(1, m / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * sc));
      const h = Math.max(1, Math.round(img.height * sc));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      // เก็บเป็น PNG เพื่อรักษาพื้นหลังโปร่งใสของตราโรงเรียน
      res({ url: cv.toDataURL('image/png'), w: img.width, h: img.height });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('เปิดไฟล์รูปนี้ไม่ได้')); };
    img.src = url;
  });
}

/** สร้างไอคอนสี่เหลี่ยมจัตุรัสสำหรับหน้าจอโฮม — ไอคอนโปร่งใสจะดูแปลกบนไอแพด จึงใส่พื้นหลังให้ */
function buildAppIcon(size) {
  const S = size || 180;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const g = cv.getContext('2d');

  const grad = g.createLinearGradient(0, 0, S, S);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, '#eef2fb');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);

  return new Promise(res => {
    const done = () => {
      // แถบชื่อวิชาด้านล่าง ให้ดูออกว่าเป็นแอพอะไรตั้งแต่ยังไม่เปิด
      const bh = Math.round(S * 0.24);
      g.fillStyle = '#2563eb';
      g.fillRect(0, S - bh, S, bh);
      g.fillStyle = '#fff';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '600 ' + Math.round(bh * 0.52) + 'px "Noto Sans Thai","Sarabun",system-ui,sans-serif';
      g.fillText('คณิต ม.ต้น', S / 2, S - bh / 2 + 1);
      res(cv.toDataURL('image/png'));
    };
    if (DB.settings.logo) {
      const img = new Image();
      img.onload = () => {
        const area = S * 0.72;
        const sc = Math.min(area / img.width, area / img.height);
        const w = img.width * sc, h = img.height * sc;
        g.drawImage(img, (S - w) / 2, (S * 0.74 - h) / 2 + S * 0.02, w, h);
        done();
      };
      img.onerror = done;
      img.src = DB.settings.logo;
    } else {
      // ไม่มีโลโก้ ใช้สัญลักษณ์แทน
      g.fillStyle = '#2563eb';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '700 ' + Math.round(S * 0.42) + 'px "Noto Sans Thai","Sarabun",system-ui,sans-serif';
      g.fillText('ฟ', S / 2, S * 0.37);
      g.strokeStyle = '#94a3b8'; g.lineWidth = Math.max(2, S * 0.014);
      g.beginPath(); g.arc(S / 2, S * 0.37, S * 0.29, -0.5, Math.PI + 0.9); g.stroke();
      done();
    }
  });
}

/* --- สถิติการเข้าใช้งาน --------------------------------------------------- */
function dayKey(ts) {
  const d = new Date(ts == null ? Date.now() : ts);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/** นับการเปิดใช้งานหนึ่งครั้ง เรียกตอนโหลดแอพ */
function markSession() {
  const u = DB.usage;
  const now = Date.now();
  if (!u.first) u.first = now;
  u.last = now;
  u.sessions = (u.sessions || 0) + 1;
  const k = dayKey(now);
  u.days[k] = (u.days[k] || 0) + 1;
  // เก็บย้อนหลัง 400 วันพอ ไม่ให้ข้อมูลบวมไปเรื่อย ๆ
  const keys = Object.keys(u.days).sort();
  while (keys.length > 400) delete u.days[keys.shift()];
  save();
}
function usageStats() {
  const u = DB.usage, done = DB.attempts.filter(a => a.finishedAt);
  const sec = done.reduce((s, a) => s + a.answers.reduce((t, x) => t + (x.sec || 0), 0), 0);
  const items = done.reduce((s, a) => s + a.answers.length, 0);
  const correct = done.reduce((s, a) => s + a.answers.reduce((t, x) => t + (x.score || 0), 0), 0);
  return {
    first: u.first, last: u.last, sessions: u.sessions || 0,
    activeDays: Object.keys(u.days || {}).length,
    quizzes: done.length, items: items, correct: correct,
    pct: items ? correct / items * 100 : 0,
    sec: sec, days: u.days || {}
  };
}
/** กราฟแท่งจำนวนครั้งที่เปิดใช้ ย้อนหลัง N วัน */
function usageChart(days, n) {
  const N = n || 30;
  const arr = [];
  for (let i = N - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    arr.push({ k: dayKey(d.getTime()), d: d, v: days[dayKey(d.getTime())] || 0 });
  }
  const mx = Math.max(1, Math.max.apply(null, arr.map(x => x.v)));
  const W = 460, H = 150, ox = 26, oy = 112, w = W - ox - 10, h = 88;
  const bw = w / N;
  let s = '<line class="ln2" x1="' + ox + '" y1="' + oy + '" x2="' + (ox + w) + '" y2="' + oy + '"/>';
  s += '<line class="ln2" x1="' + ox + '" y1="' + oy + '" x2="' + ox + '" y2="' + (oy - h) + '"/>';
  arr.forEach((x, i) => {
    if (!x.v) return;
    const bh = Math.max(2, h * x.v / mx);
    s += '<rect class="bdy" x="' + n1(ox + i * bw + 1) + '" y="' + n1(oy - bh) + '" width="' +
      n1(Math.max(2, bw - 2)) + '" height="' + n1(bh) + '" rx="1.5"/>';
  });
  s += svgTxt(ox - 5, oy - h + 5, String(mx), 'end', true);
  s += svgTxt(ox - 5, oy, '0', 'end', true);
  s += svgTxt(ox, oy + 15, thDate(arr[0].d.getTime()), 'start', true);
  s += svgTxt(ox + w, oy + 15, 'วันนี้', 'end', true);
  s += svgTxt(ox + w / 2, oy + 32, 'จำนวนครั้งที่เปิดใช้งานย้อนหลัง ' + N + ' วัน', 'middle', true);
  return svgWrap(W, H, s);
}

/* ============================================================================
   1.5) เชื่อมต่อ Google Sheet ผ่าน Apps Script
   ส่งเป็น text/plain เพื่อให้เบราว์เซอร์ไม่ต้องถาม preflight ก่อน
   (สำคัญมาก เพราะแอพเปิดจากไฟล์ในเครื่อง ซึ่งไม่มี origin)
   ========================================================================== */
const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // ตัด I O 0 1 ออกกันอ่านสับสน
function makeCode(n) {
  let s = '';
  const a = new Uint32Array(n || 6);
  (crypto && crypto.getRandomValues) ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 1e9);
  for (let i = 0; i < a.length; i++) s += CODE_ALPHABET[a[i] % CODE_ALPHABET.length];
  return s;
}

/** ออฟไลน์ล้วน = ยังไม่ได้เชื่อมชีต ให้ใช้งานได้ทุกอย่างเหมือนเดิม */

class ApiError extends Error {
  constructor(msg, isAuth) { super(msg); this.isAuth = !!isAuth; }
}

async function api(action, params, opt) {
  const o = opt || {};
  if (!cloudOn()) throw new ApiError('ยังไม่ได้เชื่อมต่อ Google Sheet');
  const body = Object.assign({ action: action, subject: SUBJECT }, params || {});
  if (!o.noToken && DB.auth.token) body.token = DB.auth.token;

  const ctl = new AbortController();
  // งานที่แตะข้อมูลทั้งก้อนใช้เวลานานกว่าปกติ จึงให้เวลามากขึ้น
  const SLOW = { rosterSave: 90000, rosterList: 60000, rosterReset: 60000, rosterRemove: 60000,
                 resultsList: 90000, assignList: 60000, myAssignments: 45000 };
  const timer = setTimeout(() => ctl.abort(), o.timeout || SLOW[action] || 30000);
  let res;
  try {
    res = await fetch(DB.cloud.url, {
      method: 'POST',
      // ต้องเป็น text/plain เท่านั้น ถ้าใช้ application/json เบราว์เซอร์จะยิง preflight
      // ซึ่ง Apps Script ตอบไม่ได้ แล้วจะเจอ CORS error ทันที
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow',
      signal: ctl.signal
    });
  } catch (e) {
    throw new ApiError(e.name === 'AbortError'
      ? 'เชื่อมต่อนานเกินไป — ตรวจสัญญาณอินเทอร์เน็ตแล้วลองใหม่'
      : 'ต่ออินเทอร์เน็ตไม่ได้ หรือ URL ไม่ถูกต้อง');
  } finally { clearTimeout(timer); }

  const text = await res.text();
  let j;
  try { j = JSON.parse(text); }
  catch (e) {
    throw new ApiError('ชีตตอบกลับมาไม่ถูกรูปแบบ — ตรวจว่าเผยแพร่เว็บแอปแบบ ' +
      '"ดำเนินการในชื่อ: ฉัน" และ "ผู้ที่มีสิทธิ์เข้าถึง: ทุกคน" แล้วหรือยัง');
  }
  if (!j.ok) {
    if (j.auth) { clearAuth(); renderGate(); }
    throw new ApiError(j.error || 'ชีตแจ้งข้อผิดพลาด', j.auth);
  }
  return j.data;
}

/** รับช่วงการลงชื่อเข้าใช้จากหน้าพอร์ทัล (index.html หน้าแรกของเว็บ)
    พอร์ทัลกับแอพวางอยู่โดเมนเดียวกัน จึงอ่าน localStorage ก้อนเดียวกันได้
    นักเรียนลงชื่อที่พอร์ทัลครั้งเดียว เข้ามาที่นี่แล้วไม่ต้องลงชื่อซ้ำ
    และได้ทั้งชื่อ ชั้น เลขที่ มาเติมให้เอง ไม่ต้องพิมพ์ตอนพิมพ์เอกสาร

    จุดสำคัญ: ถ้า "ไม่มี" การลงชื่อเข้าใช้ที่ยังไม่หมดอายุ จะตัดการเชื่อมต่อชีตทิ้ง
    เพื่อให้แอพกลับไปเป็นออฟไลน์ล้วน หน้าเข้าใช้จะได้ไม่โผล่มาขวางนักเรียน
    ที่แค่กดปุ่ม "เข้าชีววิทยาเลย" จากหน้าแรกโดยไม่ลงชื่อ */
function adoptPortalSession() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem('pcportal.v1') || 'null'); } catch (e) { s = null; }
  const live = s && s.v === 1 && s.token && s.exp && s.exp > Date.now();

  if (!live) {
    // ไม่ได้มาจากพอร์ทัล หรือหมดอายุแล้ว — คืนแอพกลับเป็นออฟไลน์
    // (ยกเว้นคนที่ลงชื่อเข้าใช้ในแอพนี้เองไว้ และยังไม่หมดอายุ)
    if (DB.cloud.url && !authValid()) { DB.cloud.url = ''; clearAuth(); save(true); }
    return;
  }
  // ไฟล์ที่แจกนักเรียนไม่รับสิทธิ์ผู้ดูแลจากพอร์ทัล กันการเข้าถึงส่วนของครูโดยไม่ตั้งใจ
  if (studentOnlyBuild() && s.role === 'admin') return;

  let touched = false;
  if (s.url && DB.cloud.url !== s.url) { DB.cloud.url = s.url; touched = true; }
  if (!authValid()) {
    DB.auth = { role: s.role, token: s.token, profile: s.profile || null, exp: s.exp };
    touched = true;
    const p = s.profile || {};
    if (s.role === 'student' && p.sid) {
      DB.mode = 'solo';
      DB.profile = { name: p.name || '', room: String(p.cls || ''),
                     no: String(p.no || ''), sid: String(p.sid || '') };
    }
  }
  if (touched) save(true);
}

/** เอาค่าที่ฝังมากับไฟล์มาใช้ตอนเปิดแอพ — เติมเฉพาะช่องที่ยังว่าง ไม่ทับของที่ผู้ใช้ตั้งเอง */
function applyBuiltin() {
  let touched = false;
  // ไฟล์ที่แจกนักเรียนต้องไม่ยอมรับ session ของผู้ดูแลที่ค้างอยู่ในเครื่องเดิม
  // (เกิดได้เวลาครูเปิดทดสอบบนเครื่องตัวเองซึ่งใช้พื้นที่เก็บข้อมูลร่วมกัน)
  if (studentOnlyBuild() && DB.auth && DB.auth.role === 'admin') {
    DB.auth = { role: '', token: '', profile: null, exp: 0 };
    touched = true;
  }
  if (BUILTIN.url && !DB.cloud.url) { DB.cloud.url = BUILTIN.url; touched = true; }
  if (BUILTIN.logo && !DB.settings.logo) { DB.settings.logo = BUILTIN.logo; touched = true; }
  if (BUILTIN.header) {
    Object.keys(BUILTIN.header).forEach(k => {
      if (BUILTIN.header[k] && !String(DB.settings.header[k] || '').trim()) {
        DB.settings.header[k] = BUILTIN.header[k]; touched = true;
      }
    });
  }
  if (BUILTIN.about) {
    Object.keys(BUILTIN.about).forEach(k => {
      if (BUILTIN.about[k] && !String(DB.settings.about[k] || '').trim()) {
        DB.settings.about[k] = BUILTIN.about[k]; touched = true;
      }
    });
  }
  if (touched) save(true);
}

/** ดึงซอร์สของหน้านี้ — เปิดผ่านเว็บใช้ fetch ได้ตรง ๆ ถ้าเปิดจากไฟล์ในเครื่องใช้ภาพถ่ายที่เก็บไว้ */
async function ownSource() {
  try {
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      const r = await fetch(location.href, { cache: 'no-store' });
      const t = await r.text();
      if (t && t.indexOf('@@BUILTIN@@') >= 0) return t;
    }
  } catch (e) { /* ตกไปใช้ภาพถ่ายด้านล่าง */ }
  return PRISTINE_HTML;
}

/** สร้างไฟล์สำหรับแจกนักเรียน โดยเขียนบล็อก BUILTIN ทับด้วยค่าปัจจุบัน */
async function buildStudentFile() {
  const src = await ownSource();
  const a = DB.settings.about || {}, h = DB.settings.header || {};
  const cfg = {
    url: DB.cloud.url || '',
    // ไม่ล็อกเป็น studentOnly เพราะครูต้องเข้าหน้าผู้ดูแลจากลิงก์เว็บได้ด้วย
    // ความปลอดภัยมาจาก lockCloud (ตัดการเชื่อมต่อไม่ได้) + การที่นักเรียนไม่ใช่ผู้ดูแล
    // จึงได้ canManage() = false อยู่แล้วเมื่อเชื่อมชีตอยู่
    studentOnly: false,
    lockCloud: true,
    logo: DB.settings.logo || '',
    header: { school: h.school || '', teacher: h.teacher || '', term: h.term || '' },
    about: { dev: a.dev || '', dept: a.dept || '', school: a.school || '' }
  };
  // '<' ในข้อมูลอาจไปปิดแท็ก script กลางคัน จึงเขียนเป็นรหัสหนีแทน
  const json = JSON.stringify(cfg).replace(/</g, '\\u003c');
  const block = '/* @@BUILTIN@@ */\nconst BUILTIN = ' + json + ';\n/* @@BUILTIN-END@@ */';
  const re = /\/\* @@BUILTIN@@ \*\/[\s\S]*?\/\* @@BUILTIN-END@@ \*\//;
  if (!re.test(src)) throw new Error('หาบล็อกค่าที่ฝังไว้ในไฟล์ไม่เจอ — ไฟล์อาจถูกแก้ไขจนเครื่องหมายหาย');
  return src.replace(re, block);
}

/* --- 3.1 ตัวสุ่มที่ควบคุมได้ (seed เดิม → โจทย์เดิมเป๊ะ) ------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rng(seed) {
  const f = mulberry32(seed >>> 0);
  const R = {
    f: f,
    int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    /** สุ่มจำนวนเต็มที่หารด้วย step ลงตัว */
    step: (a, b, st) => a + st * Math.floor(f() * (Math.floor((b - a) / st) + 1)),
    pick: arr => arr[Math.floor(f() * arr.length)],
    /** สุ่มหยิบ n ตัวไม่ซ้ำ */
    some: (arr, n) => R.shuffle(arr.slice()).slice(0, n),
    shuffle: arr => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    },
    sign: () => (f() < 0.5 ? -1 : 1)
  };
  return R;
}

/* --- 3.2 การจัดรูปสมการ ---------------------------------------------------
   เขียนสมการเป็นข้อความธรรมดา แล้วให้ M() จัดรูปให้:
     ตัวแปรภาษาอังกฤษ → ตัวเอียง   ตัวเลข/ภาษาไทย/หน่วยใน `...` → ตัวตรง
     _1 หรือ _{max} → ตัวห้อย       ^2 หรือ ^{-2} → ตัวยก
   -------------------------------------------------------------------------- */
function M(s) {
  return '<span class="eq">' + mInner(String(s)) + '</span>';
}
/** แปลงข้อความสมการหนึ่งชิ้น (ยังไม่ห่อ .eq) — เรียกซ้อนตัวเองได้ จึงใส่เศษส่วนในรากได้
    เขียนได้ว่า  frac(3,4)  ·  sqrt(2)  ·  sqrt3(27) รากที่สาม  ·  pi
    วิธีทำงาน: แปลงเศษส่วน/รากบนข้อความ "ดิบ" ก่อน แล้วพักผลลัพธ์ HTML ไว้ในกล่อง
    โดยทิ้งโทเคนตัวอักษรพิเศษไว้แทน จากนั้นค่อย esc() และจัดรูปตัวห้อย-ตัวยกตามเดิม
    แล้วเอา HTML ในกล่องแทนกลับตอนท้าย — HTML ที่สร้างไว้จึงไม่ถูก esc() ทำลาย */
function mInner(raw, box) {
  const top = !box;
  box = box || [];
  const stash = html => '\u0001' + String.fromCharCode(0xE000 + (box.push(html) - 1)) + '\u0002';
  // อนุญาตแท็กเน้นข้อความไม่กี่ตัว โดยซ่อนไว้ก่อน esc() แล้วคืนกลับตอนท้าย
  // ทำให้เขียน M('เส้นขนาน ⇒ <b>มุมแย้งเท่ากัน</b>') ได้ โดยแท็กไม่หลุดออกมาเป็นตัวหนังสือ
  let t = String(raw).replace(/<\/?(?:b|i|em|strong|br)\s*\/?>/gi, m => stash(m))
                     .replace(/\bpi\b/g, 'π');
  // แปลงรากและเศษส่วนสลับกันไปเรื่อย ๆ จนไม่มีอะไรเปลี่ยน
  // ทั้งสองแบบรับเฉพาะเนื้อในที่ไม่มีวงเล็บซ้อน การวนแบบนี้จึงแปลงชั้นในสุดก่อนเสมอ
  // ทำให้เขียนซ้อนกันได้ เช่น frac(-b ± sqrt(b^2 - 4ac),2a)
  for (let k = 0; k < 12; k++) {
    const before = t;
    // รากที่ n เช่น sqrt3(27) และรากที่สอง sqrt(2)
    t = t.replace(/sqrt(\d*)\(([^()]*)\)/g, (m, n, a) =>
      stash('<span class="sqrt">' + (n ? '<span class="si">' + n + '</span>' : '') +
            '<span class="sg">√</span><span class="sr">' + mInner(a, box) + '</span></span>'));
    // เศษส่วน frac(เศษ,ส่วน)
    t = t.replace(/frac\(([^(),]*),([^(),]*)\)/g, (m, a, b) =>
      stash('<span class="frac"><span class="fn">' + mInner(a, box) + '</span>' +
            '<span class="fd">' + mInner(b, box) + '</span></span>'));
    if (t === before) break;
  }
  let h = esc(t);
  h = h.replace(/\^\{([^}]*)\}/g, (m, a) => '<sup>' + a + '</sup>')
       .replace(/\^(-?[\w°]+)/g, (m, a) => '<sup>' + a + '</sup>');
  h = h.replace(/_\{([^}]*)\}/g, (m, a) => '<sub>' + a + '</sub>')
       .replace(/_(-?\w)/g, (m, a) => '<sub>' + a + '</sub>');
  h = h.replace(/`([^`]*)`/g, (m, a) => '<span class="u">' + a + '</span>');
  // ข้อความไทยเป็นตัวตรง — รวมคำย่อที่มีจุดคั่นอย่าง ห.ร.ม. และ ค.ร.น. ไว้เป็นก้อนเดียว
  h = h.replace(/([฀-๿]+(?:\.[฀-๿]+)*\.?)/g, '<span class="u">$1</span>');
  // ชื่อฟังก์ชันตรีโกณมิติเขียนด้วยตัวตรงตามหลักสากล ไม่ใช่ตัวเอียงแบบตัวแปร
  h = h.replace(/\b(sin|cos|tan|log|ln)\b/g, '<span class="u">$1</span>');
  // ให้องศาติดไปกับตัวเลข ไม่งั้นจะมีช่องว่างแปลก ๆ คั่น
  h = h.replace(/(\d[\d,]*\.?\d*°?)/g, '<span class="u">$1</span>');
  // เครื่องหมายดำเนินการเขียนตัวตรง — ฟอนต์คณิตตัวเอียงทำให้ + และ = เอียงจนดูเหมือนถูกขีดทับ
  // แยกส่วนที่เป็นแท็กออกก่อน ไม่งั้นจะไปโดน = ใน class="u" ที่ใส่ไว้ข้างบน
  h = h.split(/(<[^>]*>)/).map(function (seg, i) {
    return i % 2 ? seg : seg.replace(/(^|\s)([+\-−×÷=≠≤≥±≈⇒])(?=\s|$)/g,
      '$1<span class="u">$2</span>');
  }).join('');
  // ชั้นในคืน HTML ที่ยังมีโทเคนอยู่ ให้ชั้นนอกสุดเป็นคนแทนกลับทีเดียว
  if (!top) return h;
  for (let k = 0; k < 20 && h.indexOf('\u0001') >= 0; k++)
    h = h.replace(/\u0001([\uE000-\uF8FF])\u0002/g, (m, c) => box[c.charCodeAt(0) - 0xE000]);
  return h;
}
/** บรรทัดสมการแบบบล็อก */
function EQ() {
  return Array.from(arguments).filter(Boolean).map(s => '<div class="eqblk">' + M(s) + '</div>').join('');
}
/** แทนค่าลงในแม่แบบสมการ: S('v = {u} + ({a})({t})', {u:0,a:9.8,t:2.5}) */
function S(tmpl, vals, dp) {
  return String(tmpl).replace(/\{(\w+)\}/g, (m, k) => {
    if (!(k in vals)) return m;
    const v = vals[k];
    return typeof v === 'number' ? fmtq(v, dp == null ? 3 : dp) : String(v);
  });
}
/** แทนค่าแล้วคืนเป็นบรรทัดสมการเลย */
function SEQ(tmpl, vals, dp) { return EQ(S(tmpl, vals, dp)); }

/* --- 3.3 ตัวช่วยวาดรูป SVG ------------------------------------------------ */
function n1(x) { return (Math.round(x * 10) / 10).toString(); }
/** ครอบ SVG ให้ยืดตามความกว้างที่มี แต่ไม่โตเกินจนดูเทอะทะ
    เดิมตรึงไว้ที่ความกว้างพิกเซลของ viewBox ทำให้รูปเล็กเกินไปบนจอกว้าง */
function svgWrap(w, h, inner) {
  // ขยายรูปบนหน้าจอขึ้นอีก 30% จากเดิม (1.55 → 2.0 และเพดาน 640 → 830 พิกเซล)
  // ครูแจ้งว่ารูปเดิมเล็กเกินไปจนดูรายละเอียดยาก
  const maxw = Math.min(Math.round(w * 2.0), 830);
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:' + maxw + 'px" ' +
    'preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img">' + inner + '</svg>';
}
/** ลูกศรแรง จาก (x1,y1) ไป (x2,y2) พร้อมป้ายกำกับ */
function svgArrow(x1, y1, x2, y2, cls, lbl, lox, loy) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 10, W = 4.6;
  const bx = x2 - Math.cos(a) * L, by = y2 - Math.sin(a) * L;
  const px = -Math.sin(a), py = Math.cos(a);
  const c = cls || 'frc', ah = (c === 'frc') ? 'arh' : 'arh2';
  let s = '<line class="' + c + '" x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(bx) + '" y2="' + n1(by) + '"/>' +
    '<polygon class="' + ah + '" points="' + n1(x2) + ',' + n1(y2) + ' ' +
    n1(bx + px * W) + ',' + n1(by + py * W) + ' ' + n1(bx - px * W) + ',' + n1(by - py * W) + '"/>';
  if (lbl) s += '<text x="' + n1(x2 + (lox || 0)) + '" y="' + n1(y2 + (loy || 0)) + '" text-anchor="middle">' + lbl + '</text>';
  return s;
}
function svgTxt(x, y, t, anchor, mut) {
  return '<text x="' + n1(x) + '" y="' + n1(y) + '"' + (anchor ? ' text-anchor="' + anchor + '"' : '') +
    (mut ? ' class="mut"' : '') + '>' + t + '</text>';
}
/** พื้นแบบขีดเฉียง (hatch) ใต้เส้นตรงจาก (x1,y1) ถึง (x2,y2) */
function svgHatch(x1, y1, x2, y2, n, len) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const L = len || 7; let s = '';
  const N = n || 12;
  for (let i = 0; i <= N; i++) {
    const t = i / N, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    s += '<line class="ln2" x1="' + n1(x) + '" y1="' + n1(y) + '" x2="' + n1(x - Math.cos(a - 0.9) * L) +
      '" y2="' + n1(y - Math.sin(a - 0.9) * L) + '"/>';
  }
  return s;
}

/* --- 3.3ข รูปประกอบโจทย์ชีววิทยา ------------------------------------------------
   ทุกฟังก์ชันคืนสตริง SVG ที่ยืดตามความกว้างของกล่องที่ใส่ลงไป
   ใช้สีจากตัวแปรธีม จึงอ่านออกทั้งโหมดสว่างและโหมดมืด

   *** ข้อควรระวังที่เคยทำให้รูปเพี้ยนมาแล้ว ***
   ชื่อคลาสใน SVG ต้องขึ้นต้นด้วย f หรือใช้ชื่อที่มีอยู่แล้ว (ln ln2 frc dash bdy
   fpt fgrd fbar ffil arh arh2 mut) ห้ามตั้งชื่ออย่าง .bar .box .fill เพราะเบราว์เซอร์
   ถือว่า width/height ของ SVG เป็นสมบัติ CSS ด้วย ถ้าไปชนกับคลาสของหน้าเว็บ
   รูปจะถูกบีบจนผิดรูปโดยไม่มี error ให้เห็น
   -------------------------------------------------------------------------- */

/** ความกว้างโดยประมาณของข้อความในรูป ใช้กันไม่ให้ป้ายยาว ๆ ล้นออกนอกกรอบ
    สระบน-ล่างและวรรณยุกต์ไทยไม่กินความกว้าง จึงไม่นับ */
function txtW(t) {
  const s = String(t == null ? '' : t).replace(/<[^>]+>/g, '');
  let w = 0;
  for (const ch of s) {
    if (/[ัิ-ฺ็-๎]/.test(ch)) continue;
    w += /[฀-๿]/.test(ch) ? 9 : /[ .,]/.test(ch) ? 4 : 8;
  }
  return w;
}

/** แผนภูมิแท่ง  o:{ labels:[], values:[], step, unit } */
function figBar(o) {
  const vals = o.values || [], n = vals.length;
  if (!n) return '';
  const W = 360, H = 224, padR = 12, padT = 30, padB = 38;
  const maxV = Math.max.apply(null, vals);
  const step = o.step || Math.max(1, Math.ceil(maxV / 5));
  const top = Math.max(step, Math.ceil(maxV / step) * step);
  // ขอบซ้ายต้องกว้างพอสำหรับตัวเลขบนสเกลและชื่อหน่วย ไม่งั้นข้อความจะล้นออกนอกกรอบ
  // โจทย์เคมีเดิมใช้ค่าหลักหมื่น (kJ/mol) ขอบคงที่ 42 จึงไม่พอ
  const padL = Math.max(42, txtW(String(top)) + 12, txtW(o.unit || '') + 10);
  const Y = v => H - padB - (H - padB - padT) * v / top;
  const bw = (W - padL - padR) / n;
  let s = '';
  for (let v = 0; v <= top; v += step) {
    s += '<line class="fgrd" x1="' + padL + '" y1="' + n1(Y(v)) + '" x2="' + (W - padR) + '" y2="' + n1(Y(v)) + '"/>';
    s += svgTxt(padL - 6, Y(v) + 5, String(v), 'end', true);
  }
  vals.forEach((v, i) => {
    const x = padL + i * bw + bw * 0.2, w = bw * 0.6;
    s += '<rect class="fbar" x="' + n1(x) + '" y="' + n1(Y(v)) + '" width="' + n1(w) +
      '" height="' + n1(H - padB - Y(v)) + '"/>';
    s += svgTxt(x + w / 2, H - padB + 18, esc(String((o.labels || [])[i] == null ? i + 1 : o.labels[i])), 'middle', true);
  });
  s += '<line class="ln" x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '"/>';
  s += '<line class="ln" x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (H - padB) + '"/>';
  if (o.unit) s += svgTxt(padL - 6, padT - 14, esc(o.unit), 'end', true);
  return svgWrap(W, H, s);
}

/** อุปกรณ์วัดปริมาตรพร้อมสเกล ใช้กับเรื่องเลขนัยสำคัญและการอ่านค่า
    o:{ cap:ความจุ, minor:ค่าต่อขีดเล็ก, read:ระดับของเหลว, unit, name } */
function figLabGlass(o) {
  const W = 260, H = 300;
  const cap = o.cap, minor = o.minor, read = o.read;
  const x0 = 92, wBody = 76, yTop = 46, yBot = 250;
  const Y = v => yBot - (yBot - yTop) * v / cap;
  let s = '';
  // ตัวกระบอกตวง — วาดเป็นสี่เหลี่ยมเปิดด้านบน มีฐานกว้างกันล้ม
  s += '<line class="ln" x1="' + x0 + '" y1="' + yTop + '" x2="' + x0 + '" y2="' + yBot + '"/>';
  s += '<line class="ln" x1="' + (x0 + wBody) + '" y1="' + yTop + '" x2="' + (x0 + wBody) + '" y2="' + yBot + '"/>';
  s += '<line class="ln" x1="' + x0 + '" y1="' + yBot + '" x2="' + (x0 + wBody) + '" y2="' + yBot + '"/>';
  s += '<line class="ln" x1="' + (x0 - 14) + '" y1="' + (yBot + 16) + '" x2="' + (x0 + wBody + 14) +
    '" y2="' + (yBot + 16) + '"/>';
  s += '<line class="ln2" x1="' + (x0 + 8) + '" y1="' + yBot + '" x2="' + (x0 - 14) + '" y2="' + (yBot + 16) + '"/>';
  s += '<line class="ln2" x1="' + (x0 + wBody - 8) + '" y1="' + yBot + '" x2="' + (x0 + wBody + 14) +
    '" y2="' + (yBot + 16) + '"/>';
  // ของเหลวในกระบอก
  s += '<rect class="ffil" x="' + (x0 + 1) + '" y="' + n1(Y(read)) + '" width="' + (wBody - 2) +
    '" height="' + n1(yBot - Y(read)) + '"/>';
  // ผิวของเหลวโค้งเว้า — จุดที่ต้องอ่านค่าคือ "ก้นโค้ง"
  s += '<path class="frc" d="M' + (x0 + 1) + ' ' + n1(Y(read) - 5) + ' Q ' + (x0 + wBody / 2) + ' ' +
    n1(Y(read) + 7) + ' ' + (x0 + wBody - 1) + ' ' + n1(Y(read) - 5) + '"/>';
  // ขีดสเกล — ขีดใหญ่ทุก 5 ขีดเล็ก พร้อมตัวเลขกำกับ
  const nTick = Math.round(cap / minor);
  for (let i = 0; i <= nTick; i++) {
    const v = i * minor, big = i % 5 === 0;
    s += '<line class="' + (big ? 'ln' : 'ln2') + '" x1="' + x0 + '" y1="' + n1(Y(v)) +
      '" x2="' + (x0 + (big ? 18 : 10)) + '" y2="' + n1(Y(v)) + '"/>';
    if (big) s += svgTxt(x0 - 7, Y(v) + 5, fmt(v), 'end', true);
  }
  s += svgTxt(x0 + wBody / 2, 26, esc(o.name || 'กระบอกตวง'), 'middle');
  s += svgTxt(x0 + wBody + 20, Y(read) + 5, 'อ่านตรงนี้', 'start');
  s += svgTxt(x0 + wBody / 2, yBot + 38, 'ขีดเล็กละ ' + fmt(minor) + ' ' + esc(o.unit || 'mL'), 'middle', true);
  return svgWrap(W, H, s);
}

/** แบบจำลองอะตอมแบบวงโคจร  o:{ sym, p, n, shells:[2,8,1] } */
function figAtomShell(o) {
  const sh = o.shells || [];
  const W = 340, H = 300, cx = 150, cy = 150;
  const rMax = 118, rNuc = 26;
  let s = '';
  // วงอิเล็กตรอนวาดจากวงนอกเข้ามา จะได้ไม่ทับนิวเคลียส
  sh.forEach(function (cnt, i) {
    const r = rNuc + 16 + (rMax - rNuc - 16) * (i + 1) / sh.length;
    s += '<circle class="dash" cx="' + cx + '" cy="' + cy + '" r="' + n1(r) + '" fill="none"/>';
    for (let k = 0; k < cnt; k++) {
      const th = -Math.PI / 2 + 2 * Math.PI * k / cnt;
      s += '<circle class="fpt" cx="' + n1(cx + r * Math.cos(th)) + '" cy="' + n1(cy + r * Math.sin(th)) + '" r="4.6"/>';
    }
    // จำนวนอิเล็กตรอนของวงนั้น เขียนไว้ทางขวาของวง ไม่ทับตัวอิเล็กตรอนที่วางเริ่มจากด้านบน
    s += svgTxt(cx + r + 8, cy + 5, String(cnt), 'start');
  });
  s += '<circle class="bdy" cx="' + cx + '" cy="' + cy + '" r="' + rNuc + '"/>';
  s += svgTxt(cx, cy + 6, esc(o.sym || ''), 'middle');
  // จำนวนอนุภาคในนิวเคลียสเขียนไว้ใต้รูป ไม่ยัดลงในวงกลมซึ่งแคบเกินไปจนตัวอักษรทับกัน
  const nuc = [];
  if (o.p != null) nuc.push('โปรตอน ' + o.p);
  if (o.n != null) nuc.push('นิวตรอน ' + o.n);
  if (nuc.length) s += svgTxt(cx, H - 12, nuc.join(' · '), 'middle', true);
  s += svgTxt(W - 10, 24, 'การจัดเรียงอิเล็กตรอน', 'end', true);
  s += svgTxt(W - 10, 42, sh.join(' , '), 'end');
  return svgWrap(W, H, s);
}

/** ตารางธาตุย่อ 20 ธาตุแรก  o:{ mark:['Na','Cl'], trend:'ขนาดอะตอมเพิ่ม' , arrow:'right'|'down' } */
const PT20 = [
  ['H', 1, 1], ['He', 18, 1],
  ['Li', 1, 2], ['Be', 2, 2], ['B', 13, 2], ['C', 14, 2], ['N', 15, 2], ['O', 16, 2], ['F', 17, 2], ['Ne', 18, 2],
  ['Na', 1, 3], ['Mg', 2, 3], ['Al', 13, 3], ['Si', 14, 3], ['P', 15, 3], ['S', 16, 3], ['Cl', 17, 3], ['Ar', 18, 3],
  ['K', 1, 4], ['Ca', 2, 4]
];
function figPeriodicMini(o) {
  const cw = 21, chh = 22, x0 = 16, y0 = 46;
  // ลูกศรแนวตั้งต้องมีที่ว่างทางขวาสำหรับป้าย ไม่งั้นตัวหนังสือจะพาดทับตารางธาตุ
  const down = o.arrow === 'down' && o.trend;
  const W = x0 * 2 + cw * 18 + (down ? txtW(o.trend) + 44 : 0), H = y0 + chh * 4 + 34;
  const mark = o.mark || [];
  let s = '';
  // หัวหมู่และหมายเลขคาบ ช่วยให้อ่านตำแหน่งธาตุได้โดยไม่ต้องนับช่อง
  [1, 2, 13, 14, 15, 16, 17, 18].forEach(function (g) {
    s += svgTxt(x0 + (g - 1) * cw + cw / 2, y0 - 6, String(g), 'middle', true);
  });
  for (let p = 1; p <= 4; p++) s += svgTxt(x0 - 6, y0 + (p - 1) * chh + chh / 2 + 4, String(p), 'end', true);
  PT20.forEach(function (e) {
    const x = x0 + (e[1] - 1) * cw, y = y0 + (e[2] - 1) * chh;
    const on = mark.indexOf(e[0]) >= 0;
    s += '<rect class="' + (on ? 'ffil' : 'bdy') + '" x="' + x + '" y="' + y + '" width="' + (cw - 2) +
      '" height="' + (chh - 2) + '"/>';
    if (on) s += '<rect class="frc" fill="none" x="' + x + '" y="' + y + '" width="' + (cw - 2) +
      '" height="' + (chh - 2) + '"/>';
    s += svgTxt(x + (cw - 2) / 2, y + chh / 2 + 4, e[0], 'middle');
  });
  s += svgTxt(x0 + cw * 9, 20, 'ตารางธาตุ 20 ธาตุแรก', 'middle', true);
  // ลูกศรบอกทิศของแนวโน้มที่โจทย์พูดถึง
  if (o.trend) {
    const yA = y0 + chh * 4 + 20;
    if (down) {
      const xa = x0 + cw * 18 + 18;
      s += svgArrow(xa, y0 - 2, xa, y0 + chh * 4 - 4, 'frc');
      s += svgTxt(xa + 10, y0 + chh * 2, esc(o.trend), 'start');
    } else {
      s += svgArrow(x0 + 4, yA, x0 + cw * 18 - 8, yA, 'frc');
      s += svgTxt(x0 + cw * 9, yA - 8, esc(o.trend), 'middle');
    }
  }
  return svgWrap(W, H, s);
}

/** โครงสร้างลิวอิสอย่างง่าย — อะตอมกลางหนึ่งตัว ล้อมด้วยอะตอมรอบ ๆ ไม่เกิน 4 ตัว
    o:{ center, lone:จำนวนคู่โดดเดี่ยวของอะตอมกลาง,
        around:[{ sym, order:1|2|3, lone }] , dirs:['up','down','left','right'] } */
function figLewis(o) {
  const W = 320, H = 260, cx = 160, cy = 130, R = 62;
  const dirMap = { right: [1, 0], left: [-1, 0], up: [0, -1], down: [0, 1] };
  const around = o.around || [];
  const dirs = o.dirs || ['right', 'left', 'up', 'down'];
  let s = '';
  around.forEach(function (a, i) {
    const d = dirMap[dirs[i % dirs.length]] || [1, 0];
    const bx = cx + d[0] * R, by = cy + d[1] * R;
    // พันธะเดี่ยว-คู่-สาม วาดเป็นเส้นขนาน 1-3 เส้น เยื้องกันตามแนวตั้งฉาก
    const px = -d[1], py = d[0];
    const k = a.order || 1;
    for (let j = 0; j < k; j++) {
      const off = (j - (k - 1) / 2) * 6;
      s += '<line class="ln" x1="' + n1(cx + d[0] * 20 + px * off) + '" y1="' + n1(cy + d[1] * 20 + py * off) +
        '" x2="' + n1(bx - d[0] * 18 + px * off) + '" y2="' + n1(by - d[1] * 18 + py * off) + '"/>';
    }
    s += svgTxt(bx, by + 6, esc(a.sym), 'middle');
    // คู่โดดเดี่ยวของอะตอมรอบ วางออกไปด้านนอกของอะตอมนั้น
    for (let j = 0; j < (a.lone || 0); j++) {
      const ang = Math.atan2(d[1], d[0]) + (j - ((a.lone || 1) - 1) / 2) * 0.7;
      const ex = bx + 20 * Math.cos(ang), ey = by + 20 * Math.sin(ang);
      s += '<circle class="fpt" cx="' + n1(ex - 3) + '" cy="' + n1(ey) + '" r="2.6"/>';
      s += '<circle class="fpt" cx="' + n1(ex + 3) + '" cy="' + n1(ey) + '" r="2.6"/>';
    }
  });
  s += svgTxt(cx, cy + 6, esc(o.center || ''), 'middle');
  for (let j = 0; j < (o.lone || 0); j++) {
    const ang = -Math.PI / 2 + (j - ((o.lone || 1) - 1) / 2) * 0.8;
    const ex = cx + 26 * Math.cos(ang), ey = cy + 26 * Math.sin(ang);
    s += '<circle class="fpt" cx="' + n1(ex - 3) + '" cy="' + n1(ey) + '" r="2.6"/>';
    s += '<circle class="fpt" cx="' + n1(ex + 3) + '" cy="' + n1(ey) + '" r="2.6"/>';
  }
  if (o.caption) s += svgTxt(W / 2, H - 14, esc(o.caption), 'middle', true);
  return svgWrap(W, H, s);
}

/** รูปร่างโมเลกุลตามทฤษฎี VSEPR
    o:{ shape:'linear'|'bent'|'trigonal'|'pyramid'|'tetra', center, outer, deg, caption } */
const VSEPR_DIR = {
  linear:   [180, 0],
  bent:     [155, 25],
  trigonal: [210, 330, 90],
  pyramid:  [200, 340, 90],
  tetra:    [200, 340, 75, 105]
};
function figShape(o) {
  const W = 320, H = 250, cx = 160, cy = 132, R = 66;
  const angs = VSEPR_DIR[o.shape] || VSEPR_DIR.linear;
  let s = '';
  angs.forEach(function (a) {
    const th = a * Math.PI / 180;
    const bx = cx + R * Math.cos(th), by = cy - R * Math.sin(th);
    s += '<line class="ln" x1="' + n1(cx + 18 * Math.cos(th)) + '" y1="' + n1(cy - 18 * Math.sin(th)) +
      '" x2="' + n1(bx - 16 * Math.cos(th)) + '" y2="' + n1(by + 16 * Math.sin(th)) + '"/>';
    s += '<circle class="bdy" cx="' + n1(bx) + '" cy="' + n1(by) + '" r="16"/>';
    s += svgTxt(bx, by + 5, esc(o.outer || ''), 'middle');
  });
  // คู่โดดเดี่ยวบนอะตอมกลาง วาดเป็นก้อนเมฆด้านบน ทำให้เห็นว่าทำไมมุมถึงหุบ
  if (o.lone) {
    for (let j = 0; j < o.lone; j++) {
      const ex = cx + (j - (o.lone - 1) / 2) * 14, ey = cy - 34;
      s += '<circle class="fpt" cx="' + n1(ex - 4) + '" cy="' + ey + '" r="3"/>';
      s += '<circle class="fpt" cx="' + n1(ex + 4) + '" cy="' + ey + '" r="3"/>';
    }
  }
  s += '<circle class="bdy" cx="' + cx + '" cy="' + cy + '" r="20"/>';
  s += svgTxt(cx, cy + 6, esc(o.center || ''), 'middle');
  if (o.deg != null) {
    // ส่วนโค้งของมุมพันธะ วาดระหว่างสองแขนแรก
    const a1 = angs[0] * Math.PI / 180, a2 = angs[1] * Math.PI / 180;
    const r = 34;
    s += '<path class="frc" fill="none" d="M' + n1(cx + r * Math.cos(a1)) + ' ' + n1(cy - r * Math.sin(a1)) +
      ' A ' + r + ' ' + r + ' 0 0 1 ' + n1(cx + r * Math.cos(a2)) + ' ' + n1(cy - r * Math.sin(a2)) + '"/>';
    const mid = (a1 + a2) / 2;
    s += svgTxt(cx + (r + 16) * Math.cos(mid), cy - (r + 16) * Math.sin(mid) + 5, fmt(o.deg) + '°', 'middle');
  }
  if (o.caption) s += svgTxt(W / 2, H - 14, esc(o.caption), 'middle', true);
  return svgWrap(W, H, s);
}

/** การถ่ายโอนอิเล็กตรอนของพันธะไอออนิก
    o:{ a:{sym, shells}, b:{sym, shells}, moved, ionA, ionB } */
function figIonic(o) {
  const W = 400, H = 230;
  const box = function (x, sym, shells, ion) {
    const cy = 108, rN = 18;
    let g = '';
    (shells || []).forEach(function (cnt, i) {
      const r = rN + 12 + i * 17;
      g += '<circle class="dash" cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="none"/>';
      for (let k = 0; k < cnt; k++) {
        const th = -Math.PI / 2 + 2 * Math.PI * k / cnt;
        g += '<circle class="fpt" cx="' + n1(x + r * Math.cos(th)) + '" cy="' + n1(cy + r * Math.sin(th)) + '" r="3.4"/>';
      }
    });
    g += '<circle class="bdy" cx="' + x + '" cy="' + cy + '" r="' + rN + '"/>';
    g += svgTxt(x, cy + 6, esc(sym), 'middle');
    g += svgTxt(x, 34, esc(ion || sym), 'middle');
    return g;
  };
  let s = box(84, o.a.sym, o.a.shells, o.ionA) + box(316, o.b.sym, o.b.shells, o.ionB);
  s += svgArrow(146, 108, 254, 108, 'frc');
  s += svgTxt(200, 92, 'ให้ ' + fmt(o.moved) + ' e', 'middle');
  s += svgTxt(200, H - 16, esc(o.caption || 'โลหะให้อิเล็กตรอน อโลหะรับอิเล็กตรอน'), 'middle', true);
  return svgWrap(W, H, s);
}
/* --- 3.4 สร้างโจทย์จากแม่แบบ ---------------------------------------------
   ตรวจว่าตัวเลขที่สุ่มออกมา "สวย" พอจะให้นักเรียนคิดได้ ถ้าไม่สวยจะสุ่มใหม่
   -------------------------------------------------------------------------- */
const TPL = [];                 // คลังแม่แบบ เติมในส่วนถัดไป
const TPL_BY_ID = {};

function niceProblem(p) {
  if (!p || !p.finds || !p.finds.length) return false;
  for (const f of p.finds) {
    if (typeof f.value !== 'number' || !isFinite(f.value)) return false;
    if (Math.abs(f.value) > 1e6) return false;
    const kind = f.kind || 'num';
    // เศษส่วน: ตัวส่วนต้องไม่ใหญ่จนนักเรียนอ่านและพิมพ์ไม่ไหว และต้องย่ออย่างต่ำมาแล้ว
    if (kind === 'frac') {
      if (!f.den || f.den < 1 || f.den > 24) return false;
      if (typeof f.num !== 'number' || !isFinite(f.num)) return false;
      const rd = reduceFrac(f.num, f.den);
      if (rd[0] !== f.num || rd[1] !== f.den) return false;
      continue;
    }
    if (kind === 'int') { if (Math.abs(f.value - Math.round(f.value)) > 1e-9) return false; continue; }
    if (kind === 'exact') continue;
    if (f.value !== 0 && Math.abs(f.value) < 0.01) return false;
    if (dpOf(f.value, 4) > 2) return false;
  }
  return true;
}

/** สร้างโจทย์หนึ่งข้อจาก tplId + seed — ผลลัพธ์เหมือนเดิมทุกครั้งที่เรียกด้วยค่าเดิม */
function buildProblem(tplId, seed, cfg) {
  const tpl = TPL_BY_ID[tplId];
  if (!tpl) return null;
  const c = cfg || {};
  const piMode = c.piMode || '3.14';
  const pi = piVal(piMode);
  let last = null;
  // แม่แบบที่เงื่อนไขเลขสวยรัดกุมมาก (เช่น ต้องได้รากที่สองลงตัว) อาจต้องสุ่มหลายรอบ
  // ลูปนี้ออกทันทีที่เจอชุดตัวเลขที่ใช้ได้ จำนวนรอบสูงสุดจึงไม่มีผลกับความเร็วในกรณีปกติ
  for (let k = 0; k < 400; k++) {
    const R = rng((seed >>> 0) + k * 7919);
    let p = null;
    try { p = tpl.gen(R, { pi: pi, piMode: piMode }); } catch (e) { continue; }
    if (!p) continue;
    last = p;
    // โจทย์ทฤษฎีไม่มีคำตอบเป็นตัวเลข จึงข้ามการคัดกรองเลขสวยไปได้เลย
    if (tpl.level === THEORY_LEVEL || niceProblem(p)) { return finishProblem(p, tpl, seed, piMode); }
  }
  // สุ่มจนครบแล้วยังไม่ได้เลขสวย — ยอมรับรอบสุดท้ายแล้วปัดเป็นทศนิยม 2 ตำแหน่ง
  if (last) { last.rough = true; return finishProblem(last, tpl, seed, piMode); }
  return null;
}

function finishProblem(p, tpl, seed, piMode) {
  p.tplId = tpl.id; p.seed = seed; p.topic = tpl.topic; p.level = tpl.level;
  p.sub = tpl.sub; p.skills = tpl.skills || []; p.piMode = piMode;
  if (tpl.level === THEORY_LEVEL) {
    // โจทย์ทฤษฎี: ตัวเลือกเป็นข้อความ แม่แบบสร้างมาให้ครบแล้ว ไม่มีตารางกำหนดให้/สิ่งที่ต้องหา
    p.theory = true; p.given = p.given || []; p.finds = p.finds || [];
    return p;
  }
  // ปัดเศษเฉพาะคำตอบชนิดทศนิยม — เศษส่วนและคำตอบที่ต้องตรงเป๊ะห้ามแตะ
  p.finds.forEach(f => { if (!f.kind || f.kind === 'num') f.value = round2(f.value); });
  // ระดับง่ายตอบแบบปรนัย — สร้างตัวเลือกจากตัวลวงที่แม่แบบให้มา
  if (tpl.level === 'ง่าย' && p.finds.length === 1) {
    p.choices = makeChoices(p, rng(((seed >>> 0) ^ 0x5bf03635) >>> 0));
  }
  return p;
}

/** สร้างตัวเลือก 4 ตัว: คำตอบถูก + ตัวลวงจากความเข้าใจผิด (เติมด้วยตัวลวงทั่วไปถ้าไม่พอ) */
function makeChoices(p, R) {
  if ((p.finds[0].kind || 'num') === 'frac') return makeFracChoices(p, R);
  const ans = round2(p.finds[0].value);
  const pool = [];
  const push = v => {
    if (typeof v !== 'number' || !isFinite(v)) return;
    const r = round2(v);
    if (Math.abs(r - ans) < 0.005) return;                 // ซ้ำกับคำตอบถูก
    if (r < 0 && ans > 0 && p.finds[0].positive) return;   // ค่าที่เป็นไปไม่ได้ในบริบทของโจทย์
    if (pool.some(x => Math.abs(x - r) < 0.005)) return;   // ซ้ำกันเอง
    if (dpOf(r, 4) > 2) return;
    pool.push(r);
  };
  (p.distract || []).forEach(push);
  // แม่แบบที่คำตอบมีค่าได้จำกัด (เช่น จตุภาคที่ 1-4) ตั้ง exactDistract ไว้
  // จะได้ไม่มีตัวลวงอัตโนมัติที่เป็นไปไม่ได้โผล่มา เช่น "จตุภาคที่ 8"
  if (!p.exactDistract) {
    const gen = [ans * 2, ans / 2, ans + Math.max(1, Math.round(Math.abs(ans) * 0.2)),
                 ans - Math.max(1, Math.round(Math.abs(ans) * 0.2)), ans * 1.5, ans / 4, ans * 10];
    for (const v of gen) { if (pool.length >= 6) break; push(v); }
  }
  const picked = R.shuffle(pool).slice(0, 3);
  const all = R.shuffle(picked.concat([ans]));
  return all.map(v => ({ value: v, correct: Math.abs(v - ans) < 0.005 }));
}

/** ตัวเลือกปรนัยที่คำตอบเป็นเศษส่วน — ตัวลวงมาจาก p.distractFrac ซึ่งเป็นคู่ [เศษ, ส่วน]
    เทียบกันด้วยรูปอย่างต่ำ ตัวเลือกจึงไม่มีทางเป็นค่าเดียวกัน เช่น 3/4 กับ 6/8 */
function makeFracChoices(p, R) {
  const f0 = p.finds[0];
  const an = f0.num, ad = f0.den;
  const key = (n, d) => { const r = reduceFrac(n, d); return r[0] + '/' + r[1]; };
  const seen = {};
  seen[key(an, ad)] = 1;
  const pool = [];
  const push = pr => {
    if (!pr || !pr[1] || !isFinite(pr[0]) || !isFinite(pr[1])) return;
    const r = reduceFrac(pr[0], pr[1]);
    if (Math.abs(r[1]) > 40 || seen[key(r[0], r[1])]) return;
    seen[key(r[0], r[1])] = 1;
    pool.push(r);
  };
  (p.distractFrac || []).forEach(push);
  // ตัวลวงสำรอง ใช้ต่อเมื่อของที่แม่แบบตั้งใจใส่มายังไม่พอ 6 ตัว
  // (เรียงตามความพลาดที่พบบ่อย: บวกผิดที่ · กลับเศษกับส่วน · ลืมย่อ)
  for (const pr of [[an + 1, ad], [an, ad + 1], [ad, an], [an * 2, ad], [an, ad * 2], [an - 1, ad]]) {
    if (pool.length >= 6) break;
    if (pr[0] === 0) continue;                       // 0 เป็นตัวลวงที่ตัดทิ้งได้ง่ายเกินไป
    push(pr);
  }
  const picked = R.shuffle(pool).slice(0, 3);
  const all = R.shuffle(picked.concat([[an, ad]]));
  return all.map(pr => ({
    value: pr[0] / pr[1], text: fracTxt(pr[0], pr[1]),
    correct: pr[0] === an && pr[1] === ad
  }));
}

/* --- 3.5 การตรวจคำตอบ -----------------------------------------------------
   คณิตต่างจากฟิสิกส์ตรงที่คำตอบไม่ได้เป็นทศนิยมเสมอไป แม่แบบจึงระบุชนิดคำตอบไว้ที่
   finds[].kind ได้ 4 แบบ
     'num'   (ค่าเริ่มต้น) ทศนิยมทั่วไป ยอมคลาดเคลื่อนตาม tolPct
     'int'   จำนวนเต็ม ต้องตรงเป๊ะ
     'frac'  เศษส่วน ต้องส่ง num/den มาคู่กัน · ถ้า lowest:true ต้องตอบเป็นเศษส่วนอย่างต่ำ
     'exact' ต้องตรงเป๊ะ ไม่ยอมคลาดเคลื่อน
   -------------------------------------------------------------------------- */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }

/** ย่อเศษส่วนให้อยู่ในรูปอย่างต่ำ ตัวส่วนเป็นบวกเสมอ คืน [เศษ, ส่วน] */
function reduceFrac(n, d) {
  if (!d) return [n, d];
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d);
  return [n / g, d / g];
}

/** เขียนเศษส่วนเป็นข้อความสำหรับส่งให้ M() โดย<b>ย่ออย่างต่ำ</b>ก่อน
    ใช้กับคำตอบและตัวเลือก ซึ่งต้องอยู่ในรูปอย่างต่ำเสมอ */
function fracTxt(n, d) { const r = reduceFrac(n, d); return fracRaw(r[0], r[1]); }
/** เขียนเศษส่วน <b>ตามที่ให้มา</b> ไม่ย่อ — ใช้กับตัวเลขในโจทย์ เพราะบางข้อ
    ตั้งใจให้เห็นรูปที่ยังไม่ย่อ เช่น เทียบ 3/6 กับ 3/12 ที่ตัวเศษเท่ากัน */
function fracRaw(n, d) {
  if (d < 0) { n = -n; d = -d; }
  if (d === 1) return String(n);
  return (n < 0 ? '-' : '') + 'frac(' + Math.abs(n) + ',' + d + ')';
}

/** คำแนะนำเหนือช่องกรอกคำตอบ — เปลี่ยนตามชนิดคำตอบที่แม่แบบกำหนด
    เพราะโจทย์เศษส่วน โจทย์จำนวนเต็ม และโจทย์ทศนิยม มีกติกาการตอบคนละแบบ */
function ansHintHTML(p) {
  const kinds = p.finds.map(f => f.kind || 'num');
  let tip;
  if (kinds.indexOf('frac') >= 0)
    tip = 'พิมพ์เศษส่วนได้เลย เช่น <b>3/4</b> หรือจำนวนคละ <b>1 1/2</b>' +
      (p.finds.some(f => f.lowest) ? ' · ข้อนี้ต้องตอบเป็น<b>เศษส่วนอย่างต่ำ</b>' : '');
  else if (kinds.every(k => k === 'int' || k === 'exact'))
    tip = 'ตอบให้ตรงเป๊ะ ไม่มีการปัดเศษ · ใส่เครื่องหมายลบด้วยถ้าคำตอบเป็นจำนวนลบ';
  else
    tip = 'ไม่ต้องพิมพ์หน่วย · ยอมคลาดเคลื่อนได้ ±' + fmt(DB.settings.tolPct) + '%';
  return '<div style="margin-bottom:9px"><b>กรอกคำตอบ</b> <span class="hint">(' + tip + ')</span></div>';
}

/** ข้อความคำตอบสำหรับแสดงผล — เศษส่วนแสดงเป็นเศษส่วน ไม่ใช่ทศนิยมยาว ๆ */
function ansTxt(f) {
  return (f.kind === 'frac' && f.den) ? fracTxt(f.num, f.den) : fmtq(f.value);
}

/** อ่านคำตอบที่นักเรียนพิมพ์ รองรับ 1,200 · +5 · 2.5x10^3 · 3/4 · -2/5 · 1 1/2
    คืน { v, n, d } โดย n/d มีค่าเฉพาะเมื่อพิมพ์มาเป็นเศษส่วน (ใช้ตรวจว่าย่ออย่างต่ำหรือยัง) */
function parseAns(raw) {
  if (raw == null) return null;
  let s = String(raw).trim().replace(/,/g, '').replace(/^\+/, '');
  if (s === '') return null;
  // จำนวนคละ เช่น 1 1/2 หรือ -2 3/4
  let m = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (m) {
    const w = Number(m[1]), n = Number(m[2]), d = Number(m[3]);
    if (!d) return null;
    const sign = m[1].charAt(0) === '-' ? -1 : 1;
    const num = Math.abs(w) * d + n;
    return { v: sign * num / d, n: sign * num, d: d };
  }
  // เศษส่วนล้วน เช่น 3/4 หรือ -2/5
  m = s.replace(/\s+/g, '').match(/^(-?\d+)\/(-?\d+)$/);
  if (m) {
    const n = Number(m[1]), d = Number(m[2]);
    if (!d) return null;
    return { v: n / d, n: n, d: d };
  }
  s = s.replace(/\s+/g, '').replace(/[×xX]10\^?/, 'e').replace(/E/, 'e');
  if (!/^-?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/.test(s)) return null;
  const v = Number(s);
  return isFinite(v) ? { v: v, n: null, d: null } : null;
}
/** เอาเฉพาะค่าตัวเลข — ใช้ตรวจว่านักเรียนกรอกช่องนี้แล้วหรือยัง */
function parseNum(raw) { const a = parseAns(raw); return a ? a.v : null; }

/** เทียบคำตอบตามชนิดที่แม่แบบกำหนดไว้ใน find */
function checkAns(raw, f, tolPct) {
  const a = parseAns(raw);
  if (!a) return false;
  const kind = (f && f.kind) || 'num';
  const target = f.value;
  if (kind === 'frac') {
    if (Math.abs(a.v - target) > 1e-9) return false;
    if (!f.lowest) return true;
    // โจทย์สั่ง "ตอบเป็นเศษส่วนอย่างต่ำ" — พิมพ์ทศนิยมมาถือว่ายังไม่ตรงรูปที่โจทย์ขอ
    if (a.d == null) return Math.abs(target - Math.round(target)) < 1e-9;
    const r = reduceFrac(a.n, a.d);
    return r[0] === a.n && r[1] === a.d;
  }
  if (kind === 'int' || kind === 'exact') return Math.abs(a.v - target) < 1e-9;
  const pct = (tolPct == null ? DB.settings.tolPct : tolPct) / 100;
  const tol = Math.max(Math.abs(target) * pct, 0.005);
  return Math.abs(a.v - target) <= tol + 1e-9;
}
/** ของเดิม เก็บไว้ให้โค้ดส่วนที่เทียบตัวเลขล้วนยังเรียกได้ */
function checkNum(user, target, tolPct) { return checkAns(user, { value: target, kind: 'num' }, tolPct); }

/* --- 3.6 วาดวิธีทำ 7 ขั้น ------------------------------------------------- */
const STEP_TITLES = ['วิเคราะห์โจทย์', 'สิ่งที่โจทย์กำหนด', 'หลักการและสูตรที่ใช้',
                     'ตั้งสมการและจัดรูป', 'แทนค่า / ดำเนินการ', 'คำนวณ', 'สรุปคำตอบและตรวจสอบ'];

/** ตารางสิ่งที่โจทย์กำหนดให้ + สิ่งที่ต้องหา (สร้างอัตโนมัติจากข้อมูลโจทย์) */
function givenTable(p) {
  let h = '<table class="given"><tbody>';
  p.given.forEach(gv => {
    h += '<tr><td class="s">' + M(gv.s) + '</td><td class="e">=</td>' +
      '<td class="v">' + (typeof gv.v === 'number' ? fmt(gv.v) : gv.v) + '</td>' +
      '<td class="d">' + (gv.unit ? esc(gv.unit) : '') + (gv.d ? ' &nbsp;(' + esc(gv.d) + ')' : '') + '</td></tr>';
  });
  p.finds.forEach(f => {
    h += '<tr><td class="s">' + M(f.s) + '</td><td class="e">=</td>' +
      '<td class="v" style="color:var(--muted)">?</td>' +
      '<td class="d">' + (f.unit ? esc(f.unit) : '') + (f.d ? ' &nbsp;(' + esc(f.d) + ')' : '') + '</td></tr>';
  });
  return h + '</tbody></table>';
}

function stepBodies(p) {
  if (p.theory) return [p.idea, choiceWhyHTML(p), p.why];
  const s = p.sol;
  const eqHtml = (s.eqs || []).map(e =>
    '<div>' + EQ(e.eq) + (e.why ? '<div class="why">' + e.why + '</div>' : '') + '</div>').join('');
  const lines = a => (Array.isArray(a) ? a : [a]).filter(Boolean).join('');
  return [
    s.analyze,
    givenTable(p),
    eqHtml,
    lines(s.solve),
    lines(s.subst),
    lines(s.calc),
    s.conclude
  ];
}

/** กล่องอธิบายของโจทย์ทฤษฎี — แนวคิดหลัก + เหตุผลรายตัวเลือก + ข้อสรุปที่ต้องจำ */
function theorySolutionHTML(p, open) {
  const rows = [
    { n: 1, t: 'แนวคิดที่ใช้ตอบ', b: p.idea },
    { n: 2, t: 'ทำไมข้อนี้ถูก และข้ออื่นผิดตรงไหน', b: choiceWhyHTML(p) },
    { n: 3, t: 'สิ่งที่ต้องจำไปใช้ต่อ', b: p.why }
  ];
  let h = '<div class="sol">';
  rows.forEach(r => {
    h += '<div class="solstep' + (open ? '' : ' closed') + '" data-step="' + (r.n - 1) + '">' +
      '<div class="h"><span class="n">' + r.n + '</span>' + r.t +
      (open ? '' : '<span class="cv">แตะเพื่อดู</span>') + '</div>' +
      '<div class="b">' + (r.b || '<span class="hint">—</span>') + '</div></div>';
  });
  return h + '</div>';
}
/** ไล่อธิบายทีละตัวเลือกว่าถูกหรือผิดเพราะอะไร */
function choiceWhyHTML(p) {
  return '<div class="whylist">' + (p.choices || []).map((c, k) =>
    '<div class="whyrow ' + (c.correct ? 'ok' : 'no') + '">' +
    '<span class="wk">' + 'กขคง'[k] + '.</span>' +
    '<span class="wt">' + c.text + '</span>' +
    '<span class="wm">' + (c.correct ? '✓ ถูก' : '✗ ผิด') + '</span>' +
    (c.why ? '<div class="wd">' + c.why + '</div>' : '') + '</div>').join('') + '</div>';
}

/** โหมด open=true จะกางทุกขั้น (ใช้ตอนพิมพ์) */
function solutionHTML(p, open) {
  if (p.theory) return theorySolutionHTML(p, open);
  const b = stepBodies(p);
  let h = '<div class="sol">';
  for (let i = 0; i < 7; i++) {
    h += '<div class="solstep' + (open ? '' : ' closed') + '" data-step="' + i + '">' +
      '<div class="h"><span class="n">' + (i + 1) + '</span>' + STEP_TITLES[i] +
      (open ? '' : '<span class="cv">แตะเพื่อดู</span>') + '</div>' +
      '<div class="b">' + (b[i] || '<span class="hint">—</span>') + '</div></div>';
  }
  return h + '</div>';
}

/** ผูกให้แตะหัวข้อแล้วพับ/กางได้ */
function bindSolutionToggle(root) {
  $$('.solstep>.h', root).forEach(h => {
    h.addEventListener('click', () => {
      const st = h.parentElement;
      st.classList.toggle('closed');
      const cv = $('.cv', h);
      if (cv) cv.textContent = st.classList.contains('closed') ? 'แตะเพื่อดู' : 'แตะเพื่อซ่อน';
    });
  });
}

   4) คลังแม่แบบโจทย์
   ทุกแม่แบบคืนค่า null ได้ถ้าตัวเลขที่สุ่มมาไม่สวย ระบบจะสุ่มใหม่ให้เอง
   ========================================================================== */
function T(o) { TPL.push(o); TPL_BY_ID[o.id] = o; }

/** ลงทะเบียน "โจทย์ทฤษฎี" — ปรนัย 4 ตัวเลือก เน้นความเข้าใจ ไม่ต้องคำนวณ
    o.gen(R) ต้องคืน { stem, choices, idea, why, figure? }
      choices : [{ text, correct?, why }] ต้องมี 4 ตัว และถูกเพียงตัวเดียว
                why ของแต่ละตัวเลือกคือคำอธิบายว่าถูก/ผิดเพราะอะไร
      idea    : แนวคิดหลักที่ใช้ตัดสิน
      why     : ข้อสรุปที่ต้องจำไปใช้ต่อ
    ระบบสับลำดับตัวเลือกตาม seed ให้เอง นักเรียนจึงจำตำแหน่งข้อถูกไม่ได้ */
function TQ(o) {
  T({
    id: o.id, topic: o.topic, sub: o.sub, level: THEORY_LEVEL, skills: o.skills || [],
    gen(R, c) {
      const q = o.gen(R, c);
      if (!q || !q.choices || q.choices.length !== 4) return null;
      q.choices = R.shuffle(q.choices);
      q.given = []; q.finds = [];
      return q;
    }
  });
}
/** ตัวช่วยเขียนตัวเลือก: ถูก = C('ข้อความ','เพราะ...') ผิด = X('ข้อความ','ที่ผิดคือ...') */
function C(text, why) { return { text: text, correct: true, why: why }; }
function X(text, why) { return { text: text, correct: false, why: why }; }
/** ตัวเลข+หน่วย สำหรับแทรกในเนื้อโจทย์ */
function U(v, u) { return M(fmt(v) + (u ? ' `' + u + '`' : '')); }
/** ตรวจว่าค่าที่จะเอาไปเป็น "สิ่งที่โจทย์กำหนด" สวยพอหรือไม่ */
function ok2(){ for (const v of arguments) { if (!isFinite(v) || dpOf(v, 4) > 2) return false; } return true; }
/** เศษส่วนสำหรับแทรกในเนื้อโจทย์ ตามรูปที่เขียนมา ไม่ย่อ เช่น FR(3,4) */
function FR(n, d) { return M(fracRaw(n, d)); }
/** เศษส่วนอย่างต่ำสำหรับแสดงคำตอบ เช่น FRL(6,8) ได้ 3/4 */
function FRL(n, d) { return M(fracTxt(n, d)); }
/** สร้าง find ของคำตอบชนิดเศษส่วน — ย่อให้อยู่ในรูปอย่างต่ำอัตโนมัติ
    ส่ง lowest = false ถ้าโจทย์ไม่ได้บังคับให้ตอบเป็นเศษส่วนอย่างต่ำ */
function FF(sym, n, d, desc, lowest) {
  const r = reduceFrac(n, d);
  return { s: sym, d: desc, value: r[0] / r[1], kind: 'frac', num: r[0], den: r[1],
           lowest: lowest !== false };
}
/** สุ่มเศษส่วนแท้ที่ย่ออย่างต่ำแล้ว ตัวส่วนอยู่ในช่วง [dmin, dmax] */
function randFrac(R, dmin, dmax) {
  for (let k = 0; k < 80; k++) {
    const d = R.int(dmin, dmax);
    if (d < 2) continue;
    const n = R.int(1, d - 1);
    if (gcd(n, d) === 1) return [n, d];
  }
  return [1, 2];
}



/* ============ คลังแม่แบบโจทย์ชีววิทยา ม.4 ภาคเรียนที่ 1 ============ */

/** เลือกตัวลวง 3 ตัวที่ไม่ซ้ำกันเองและไม่ตรงกับคำตอบ
    ใช้กับข้อที่ค่าคำตอบมีได้จำกัด (เช่น จำนวนเต็มน้อย ๆ) ซึ่งตัวลวงอัตโนมัติของเอนจินอาจชนกัน */
function D3(ans, cands) {
  const out = [];
  (cands || []).forEach(v => {
    if (typeof v !== 'number' || !isFinite(v) || v <= 0) return;
    const r = Math.round(v * 100) / 100;
    if (Math.abs(r - ans) < 0.005 || out.some(x => Math.abs(x - r) < 0.005)) return;
    if (out.length < 3) out.push(r);
  });
  let k = 2;
  while (out.length < 3 && k < 12) {
    const r = Math.round(ans * k * 100) / 100;
    if (Math.abs(r - ans) > 0.005 && !out.some(x => Math.abs(x - r) < 0.005)) out.push(r);
    k += 0.5;
  }
  return out;
}
