T({
  id: 'm2v-slide', topic: 204, sub: 'การแปลงทางเรขาคณิต', level: 'ง่าย',
  skills: ['เลื่อนขนานบนระนาบพิกัด'],
  gen(R) {
    const x = R.int(-5, 5), y = R.int(-5, 5);
    const a = R.int(-5, 5), b = R.int(-5, 5);
    if (!a || !b || !x) return null;
    const nx = x + a;
    if (Math.abs(nx) > 8 || Math.abs(y + b) > 8) return null;
    return {
      stem: 'จุด ' + M('A(' + x + ', ' + y + ')') + ' ถูก<b>เลื่อนขนาน</b>ไปทางแกน ' + M('x') + ' อีก ' +
        M(String(a)) + ' หน่วย และทางแกน ' + M('y') + ' อีก ' + M(String(b)) + ' หน่วย<br>' +
        'จงหา<b>พิกัด ' + M('x') + ' ของจุดใหม่</b>',
      figure: figTransform({ xmin: -8, xmax: 8, ymin: -8, ymax: 8,
                             before: [[x, y], [x + 1, y], [x, y + 1]],
                             after: [[nx, y + b], [nx + 1, y + b], [nx, y + b + 1]],
                             labelA: 'A', labelB: "A'" }),
      given: [{ s: 'จุดเดิม', v: '(' + x + ', ' + y + ')', d: '' },
              { s: 'เลื่อนตามแกน x', v: a, unit: 'หน่วย', d: a > 0 ? 'ไปทางขวา' : 'ไปทางซ้าย' },
              { s: 'เลื่อนตามแกน y', v: b, unit: 'หน่วย', d: b > 0 ? 'ขึ้นบน' : 'ลงล่าง' }],
      finds: [{ s: "พิกัด x ของ A'", d: 'พิกัดแนวนอนของจุดใหม่', value: nx, kind: 'int' }],
      distract: [x - a, y + b, x * a, -nx],
      sol: {
        analyze: 'การเลื่อนขนานคือการย้ายทุกจุด<b>ไปในทิศทางเดียวกันและระยะเท่ากัน</b> ' +
          'รูปไม่หมุนและไม่เปลี่ยนขนาด<br>' +
          'แกน ' + M('x') + ' กับแกน ' + M('y') + ' คิดแยกกันได้เลย ไม่กวนกัน<br>' +
          '<b>กับดักของข้อนี้:</b> เอาระยะเลื่อนไป<b>ลบ</b>แทนบวก · ระยะเลื่อนที่เป็นบวกแปลว่าไปทางขวา ' +
          'ส่วนที่เป็นลบก็บวกด้วยจำนวนลบ ซึ่งได้ผลเป็นการเลื่อนไปทางซ้ายอยู่แล้ว',
        eqs: [{ eq: '(x, y)  →  (x + a, y + b)', why: 'กฎของการเลื่อนขนานด้วยเวกเตอร์ (a, b)' }],
        solve: EQ("พิกัด x ของ A' = x + a"),
        subst: SEQ("= ({x}) + ({a})", { x: x, a: a }),
        calc: EQ("= " + nx),
        conclude: 'ดังนั้น <b>พิกัด ' + M('x') + " ของจุดใหม่คือ " + M(String(nx)) + '</b><br>' +
          '<span class="hint">จุดใหม่เต็ม ๆ คือ ' + M("A'(" + nx + ', ' + (y + b) + ')') +
          ' · ระยะห่างระหว่าง A กับ A′ เท่ากันทุกจุดของรูป นั่นคือลักษณะของการเลื่อนขนาน</span>'
      }
    };
  }
});

T({

T({
  id: 'm2v-prismsurf', topic: 204, sub: 'พื้นที่ผิว', level: 'ปานกลาง',
  skills: ['พื้นที่ผิวปริซึมสามเหลี่ยม', 'แยกหน้าตัดกับผิวข้าง'],
  gen(R) {
    const t = R.pick(PYT), k = R.pick([1, 1, 2]);
    const a = t[0] * k, b = t[1] * k, c = t[2] * k;
    if (c > 60) return null;
    const len = R.int(6, 20);
    const base = a * b / 2;
    const side = (a + b + c) * len;
    const S = 2 * base + side, V = base * len;
    if (!ok2(base, S, V) || S > 9000) return null;
    return {
      stem: 'ปริซึมมีหน้าตัดเป็น<b>สามเหลี่ยมมุมฉาก</b> ด้านประกอบมุมฉากยาว ' + U(a, 'ซม.') + ' และ ' +
        U(b, 'ซม.') + ' ด้านตรงข้ามมุมฉากยาว ' + U(c, 'ซม.') + ' ปริซึมยาว ' + U(len, 'ซม.') + '<br>' +
        'จงหา<b>พื้นที่ผิวทั้งหมด</b> และ<b>ปริมาตร</b>',
      figure: figPrismTri({ b: b, h: a, len: len, unit: 'ซม.' }),
      given: [{ s: 'ด้านประกอบมุมฉาก', v: a + ' และ ' + b, unit: 'ซม.', d: 'ของหน้าตัด' },
              { s: 'ด้านตรงข้ามมุมฉาก', v: c, unit: 'ซม.', d: 'ของหน้าตัด' },
              { s: 'ความยาวปริซึม', v: len, unit: 'ซม.', d: '' }],
      finds: [{ s: 'พื้นที่ผิวทั้งหมด', unit: 'ตร.ซม.', d: 'หน้าตัดสองหน้าบวกผิวข้าง', value: S, positive: true },
              { s: 'ปริมาตร', unit: 'ลบ.ซม.', d: 'ปริมาตรของปริซึม', value: V, positive: true }],
      sol: {
        analyze: 'พื้นที่ผิวของปริซึมมาจากสองส่วน<br>' +
          '• <b>หน้าตัดสองหน้า</b> (หัวและท้าย) เป็นสามเหลี่ยมที่เท่ากัน<br>' +
          '• <b>ผิวข้าง</b> ถ้าคลี่ออกจะได้สี่เหลี่ยมผืนผ้าที่ยาวเท่า<b>ความยาวรอบรูปของหน้าตัด</b> ' +
          'และกว้างเท่าความยาวปริซึม<br>' +
          '<b>กับดักของข้อนี้:</b> นับหน้าตัดแค่หน้าเดียว หรือลืมด้านตรงข้ามมุมฉากตอนคิดความยาวรอบรูป ' +
          'ทำให้ผิวข้างขาดไปหนึ่งแผ่น',
        eqs: [{ eq: 'พื้นที่หน้าตัด = frac(1,2) × ' + a + ' × ' + b,
                why: 'สามเหลี่ยมมุมฉาก ด้านประกอบมุมฉากเป็นฐานและสูงพอดี' },
              { eq: 'ผิวข้าง = ความยาวรอบรูปหน้าตัด × ความยาวปริซึม', why: 'คลี่ผิวข้างออกได้สี่เหลี่ยมผืนผ้า' },
              { eq: 'พื้นที่ผิวทั้งหมด = 2 × หน้าตัด + ผิวข้าง', why: 'หัวและท้ายอย่างละหน้า' }],
        solve: EQ('หน้าตัด = frac(1,2) × ' + a + ' × ' + b + ' = ' + fmtq(base),
                  'ความยาวรอบรูปหน้าตัด = ' + a + ' + ' + b + ' + ' + c + ' = ' + (a + b + c),
                  'ผิวข้าง = ' + (a + b + c) + ' × ' + len),
        subst: SEQ('ผิวข้าง = {s} `ตร.ซม.`', { s: side }),
        calc: EQ('พื้นที่ผิวทั้งหมด = 2(' + fmtq(base) + ') + ' + fmtq(side) + ' = ' + fmtq(S) + ' `ตร.ซม.`',
                 'ปริมาตร = ' + fmtq(base) + ' × ' + len + ' = ' + fmtq(V) + ' `ลบ.ซม.`'),
        conclude: 'ดังนั้น <b>พื้นที่ผิวทั้งหมด ' + U(S, 'ตร.ซม.') + ' และปริมาตร ' + U(V, 'ลบ.ซม.') + '</b><br>' +
          '<span class="hint">ตรวจว่านับครบไหม: ปริซึมสามเหลี่ยมมี 5 หน้า — สามเหลี่ยม 2 หน้า ' +
          'และสี่เหลี่ยมผืนผ้า 3 หน้า ✓</span>'
      }
    };
  }
});

T({
  id: 'm2v-reflect', topic: 204, sub: 'การแปลงทางเรขาคณิต', level: 'ปานกลาง',
  skills: ['สะท้อนข้ามแกน', 'อ่านพิกัดของภาพที่ได้'],
  gen(R) {
    const x = R.int(-6, 6), y = R.int(-6, 6);
    if (!x || !y) return null;
    const overY = R.f() < 0.5;
    const nx = overY ? -x : x, ny = overY ? y : -y;
    return {
      stem: 'จุด ' + M('P(' + x + ', ' + y + ')') + ' ถูก<b>สะท้อนข้ามแกน ' + (overY ? M('y') : M('x')) + '</b><br>' +
        'จงหา<b>พิกัด ' + M('x') + '</b> และ<b>พิกัด ' + M('y') + '</b> ของจุดใหม่',
      figure: figTransform({ xmin: -8, xmax: 8, ymin: -8, ymax: 8,
                             before: [[x, y], [x + 1, y], [x, y + 1]],
                             after: [[nx, ny], [nx + (overY ? -1 : 1), ny], [nx, ny + (overY ? 1 : -1)]],
                             labelA: 'P', labelB: "P'" }),
      given: [{ s: 'จุดเดิม', v: '(' + x + ', ' + y + ')', d: '' },
              { s: 'เส้นสะท้อน', v: 'แกน ' + (overY ? 'y' : 'x'), d: overY ? 'เส้นแนวตั้ง' : 'เส้นแนวนอน' }],
      finds: [{ s: "พิกัด x ของ P'", d: 'พิกัดแนวนอน', value: nx, kind: 'int' },
              { s: "พิกัด y ของ P'", d: 'พิกัดแนวตั้ง', value: ny, kind: 'int' }],
      sol: {
        analyze: 'การสะท้อนคือการพลิกข้ามเส้น จุดใหม่ต้องอยู่<b>ห่างจากเส้นเท่าเดิมแต่คนละฝั่ง</b><br>' +
          'ข้อนี้สะท้อนข้าม<b>แกน ' + (overY ? 'y' : 'x') + '</b> ซึ่งเป็นเส้น' +
          (overY ? 'แนวตั้ง จึงพลิกซ้าย-ขวา' : 'แนวนอน จึงพลิกบน-ล่าง') + '<br>' +
          'พิกัดที่วัดตามแนว' + (overY ? 'นอน คือ x จึงเปลี่ยนเครื่องหมาย ส่วน y คงเดิม'
                                        : 'ตั้ง คือ y จึงเปลี่ยนเครื่องหมาย ส่วน x คงเดิม') + '<br>' +
          '<b>กับดักของข้อนี้:</b> สลับกัน — เปลี่ยนเครื่องหมายผิดตัว ซึ่งจะได้จุดที่อยู่คนละที่เลย',
        eqs: [{ eq: 'สะท้อนข้ามแกน y :  (x, y) → (-x, y)', why: 'แกน y เป็นเส้นตั้ง พลิกซ้าย-ขวา' },
              { eq: 'สะท้อนข้ามแกน x :  (x, y) → (x, -y)', why: 'แกน x เป็นเส้นนอน พลิกบน-ล่าง' }],
        solve: EQ('สะท้อนข้ามแกน ' + (overY ? 'y' : 'x') + ' : (' + x + ', ' + y + ') → (' +
                  (overY ? '-(' + x + ')' : x) + ', ' + (overY ? y : '-(' + y + ')') + ')'),
        subst: EQ("P'(" + nx + ', ' + ny + ')'),
        calc: EQ("พิกัด x = " + nx, "พิกัด y = " + ny),
        conclude: 'ดังนั้น <b>' + M("P'(" + nx + ', ' + ny + ')') + '</b><br>' +
          '<span class="hint">ตรวจด้วยระยะห่าง: จุดเดิมห่างจากแกน ' + (overY ? 'y' : 'x') + ' อยู่ ' +
          Math.abs(overY ? x : y) + ' หน่วย · จุดใหม่ก็ห่างเท่ากันแต่อยู่คนละฝั่ง ✓</span>'
      }
    };
  }
});

T({
  id: 'm2v-rotate', topic: 204, sub: 'การแปลงทางเรขาคณิต', level: 'ปานกลาง',
  skills: ['หมุนรอบจุดกำเนิด', 'กฎการหมุน 90 และ 180 องศา'],
  gen(R) {

    if (!x || !y) return null;
    const half = R.f() < 0.5;
    const nx = half ? -x : -y, ny = half ? -y : x;
    if (Math.abs(nx) > 7 || Math.abs(ny) > 7) return null;
    return {
      stem: 'จุด ' + M('Q(' + x + ', ' + y + ')') + ' ถูก<b>หมุนทวนเข็มนาฬิกา ' +
        (half ? '180°' : '90°') + ' รอบจุดกำเนิด</b><br>' +
        'จงหา<b>พิกัด ' + M('x') + '</b> และ<b>พิกัด ' + M('y') + '</b> ของจุดใหม่',
      figure: figTransform({ xmin: -8, xmax: 8, ymin: -8, ymax: 8,
                             before: [[x, y], [x, 0], [0, 0]],
                             after: [[nx, ny], half ? [-x, 0] : [0, x], [0, 0]],
                             labelA: 'Q', labelB: "Q'" }),
      given: [{ s: 'จุดเดิม', v: '(' + x + ', ' + y + ')', d: '' },
              { s: 'มุมที่หมุน', v: (half ? 180 : 90) + '°', d: 'ทวนเข็มนาฬิกา รอบจุดกำเนิด' }],
      finds: [{ s: "พิกัด x ของ Q'", d: 'พิกัดแนวนอน', value: nx, kind: 'int' },
              { s: "พิกัด y ของ Q'", d: 'พิกัดแนวตั้ง', value: ny, kind: 'int' }],
      sol: {
        analyze: 'การหมุนรอบจุดกำเนิดทำให้จุด<b>อยู่ห่างจากจุดกำเนิดเท่าเดิม</b> แต่เปลี่ยนทิศ<br>' +
          (half
            ? 'หมุน 180° คือหมุนครึ่งรอบ จุดจะไปอยู่ฝั่งตรงข้ามพอดี พิกัด<b>เปลี่ยนเครื่องหมายทั้งคู่</b>'
            : 'หมุน 90° ทวนเข็ม จุดจะย้ายไปอีกจตุภาค พิกัดทั้งสอง<b>สลับที่กัน</b> ' +
              'และตัวที่มาอยู่หน้าเปลี่ยนเครื่องหมาย') + '<br>' +
          '<b>กับดักของข้อนี้:</b> ' + (half
            ? 'เปลี่ยนเครื่องหมายแค่ตัวเดียว ซึ่งจะกลายเป็นการสะท้อนแทนการหมุน'
            : 'สลับพิกัดแล้วลืมเปลี่ยนเครื่องหมาย จะกลายเป็นการสะท้อนข้ามเส้น ' + M('y = x')),
        eqs: [{ eq: 'หมุน 90° ทวนเข็ม :  (x, y) → (-y, x)', why: 'สลับที่แล้วเปลี่ยนเครื่องหมายของตัวที่มาอยู่หน้า' },
              { eq: 'หมุน 180° :  (x, y) → (-x, -y)', why: 'ครึ่งรอบพอดี ไปอยู่ฝั่งตรงข้ามจุดกำเนิด' }],
        solve: EQ(half ? '(' + x + ', ' + y + ') → (-(' + x + '), -(' + y + '))'
                       : '(' + x + ', ' + y + ') → (-(' + y + '), ' + x + ')'),
        subst: EQ("Q'(" + nx + ', ' + ny + ')'),
        calc: EQ('พิกัด x = ' + nx, 'พิกัด y = ' + ny),
        conclude: 'ดังนั้น <b>' + M("Q'(" + nx + ', ' + ny + ')') + '</b><br>' +
          '<span class="hint">ตรวจด้วยระยะจากจุดกำเนิด: จุดเดิมและจุดใหม่ต้องห่างจากจุดกำเนิดเท่ากัน · ' +
          M('sqrt(' + (x * x) + ' + ' + (y * y) + ')') + ' เท่ากันทั้งสองจุด ✓ ' +
          'เพราะการหมุนไม่เปลี่ยนระยะทาง</span>'
      }
    };
  }
});

T({
  id: 'm2v-cylback', topic: 204, sub: 'ทรงกระบอก', level: 'ยาก',
  skills: ['ย้อนสูตรปริมาตรหาความสูง', 'คิดพื้นที่ผิวต่อจากค่าที่ได้'],
  gen(R, c) {
    const r = niceR(R, c), h = R.int(5, 20);
    const V = c.pi * r * r * h;
    const S = 2 * c.pi * r * h + 2 * c.pi * r * r;
    if (!ok2(V, S) || V > 40000) return null;
    return {
      stem: 'ถังน้ำทรงกระบอกมี<b>ปริมาตร ' + U(V, 'ลบ.ซม.') + '</b> และรัศมีฐาน ' + U(r, 'ซม.') + '<br>' +
        'จงหา<b>ความสูง</b>ของถัง และ<b>พื้นที่ผิวทั้งหมด</b> (กำหนดให้ ' + M('pi = ' + piTxt(c.piMode)) + ')',
      figure: figCylinder({ r: r, h: h, unit: 'ซม.' }),
      given: [{ s: 'ปริมาตร', v: V, unit: 'ลบ.ซม.', d: 'ความจุของถัง' },
              { s: 'รัศมีฐาน', v: r, unit: 'ซม.', d: '' },
              { s: 'π', v: piTxt(c.piMode), d: '' }],
      finds: [{ s: 'ความสูง', unit: 'ซม.', d: 'ความสูงของถัง', value: h, positive: true, kind: 'int' },
              { s: 'พื้นที่ผิวทั้งหมด', unit: 'ตร.ซม.', d: 'ผิวข้างบวกฝาสองด้าน', value: S, positive: true }],
      sol: {
        analyze: 'โจทย์ให้ปริมาตรมาแทนความสูง จึงต้องย้อนสูตรหาความสูงก่อน แล้วจึงคิดพื้นที่ผิวต่อ<br>' +
          'มองว่า <b>ปริมาตร = พื้นที่ฐาน × สูง</b> จะจัดรูปได้ง่ายที่สุด — หาพื้นที่ฐานก่อน แล้วหาร<br>' +
          '<b>กับดักของข้อนี้:</b> เอาปริมาตรหารด้วย ' + M('pi r') + ' แทนที่จะหารด้วย ' + M('pi r^2') +
          ' · พื้นที่ฐานต้องมีรัศมี<b>ยกกำลังสอง</b>',
        eqs: [{ eq: 'V = pi r^2 h  ⇒  h = frac(V,pi r^2)', why: 'จัดรูปย้อนกลับเพื่อหาความสูง' },
              { eq: 'พื้นที่ผิวทั้งหมด = 2 pi r h + 2 pi r^2', why: 'ผิวข้างบวกฝาสองใบ ใช้ความสูงที่เพิ่งหาได้' }],
        solve: EQ('พื้นที่ฐาน = ' + piTxt(c.piMode) + ' × ' + r + '^2 = ' + fmtq(c.pi * r * r),
                  'h = frac(' + fmtq(V) + ',' + fmtq(c.pi * r * r) + ')'),
        subst: SEQ('h = {H} `ซม.`', { H: h }),
        calc: EQ('ผิวข้าง = 2 × ' + piTxt(c.piMode) + ' × ' + r + ' × ' + h + ' = ' + fmtq(2 * c.pi * r * h),

/* ==== ม.2 บทที่ 5 : เส้นขนาน ความเท่ากันทุกประการ และสถิติ (id 205) ==== */

/** มัธยฐานของชุดข้อมูล (เรียงให้เองก่อน) */
function medianOf(arr) {
  const a = arr.slice().sort((x, y) => x - y), n = a.length;
  return n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2;
}
/** ฐานนิยม — คืน null ถ้ามีมากกว่าหนึ่งค่าหรือไม่มีเลย จะได้ไม่ออกโจทย์กำกวม */
function modeOf(arr) {
  const c = {};
  arr.forEach(v => { c[v] = (c[v] || 0) + 1; });
  const mx = Math.max.apply(null, Object.keys(c).map(k => c[k]));
  if (mx < 2) return null;
  const win = Object.keys(c).filter(k => c[k] === mx);
  return win.length === 1 ? Number(win[0]) : null;
}

T({

T({
  id: 'm2g-mode', topic: 205, sub: 'ค่ากลางของข้อมูล', level: 'ง่าย',
  skills: ['หาฐานนิยม'],
  gen(R) {
    const v = R.some([2, 3, 4, 5, 6, 7, 8], 4);
    const hot = R.pick(v);
    const data = v.concat([hot, hot]);
    const mode = modeOf(data);
    if (mode === null) return null;
    const all = R.shuffle(data);
    const mean = all.reduce((a, b) => a + b, 0) / all.length;
    return {
      stem: 'สำรวจจำนวนพี่น้องของนักเรียน ' + U(all.length, 'คน') + ' ได้ข้อมูลดังนี้<br><b>' +
        all.join(' , ') + '</b><br>จงหา<b>ฐานนิยม</b>ของข้อมูลชุดนี้',
      given: [{ s: 'จำนวนข้อมูล', v: all.length, unit: 'คน', d: '' },
              { s: 'ข้อมูล', v: all.join(' , '), d: 'จำนวนพี่น้องของแต่ละคน' }],
      finds: [{ s: 'ฐานนิยม', d: 'ค่าที่พบบ่อยที่สุด', value: mode, positive: true, kind: 'int' }],
      distract: [r2(mean), medianOf(all), Math.max.apply(null, all), Math.min.apply(null, all)],
      sol: {
        analyze: '<b>ฐานนิยม</b> คือค่าที่ปรากฏ<b>บ่อยที่สุด</b>ในชุดข้อมูล<br>' +
          'ไม่ต้องบวกและไม่ต้องเรียง แค่<b>นับความถี่</b>ของแต่ละค่าแล้วดูว่าค่าไหนซ้ำมากที่สุด<br>' +
          '<b>กับดักของข้อนี้:</b> ไปหาค่าเฉลี่ยหรือมัธยฐานแทน · ค่ากลางสามแบบใช้วิธีคนละอย่างสิ้นเชิง',
        eqs: [{ eq: 'ฐานนิยม = ค่าที่มีความถี่สูงสุด', why: 'นับว่าค่าใดปรากฏกี่ครั้ง แล้วเลือกค่าที่มากที่สุด' }],
        solve: '<div>นับความถี่ของแต่ละค่า</div>' +
          EQ(Array.from(new Set(all.slice().sort((a, b) => a - b)))
            .map(x => x + ' ปรากฏ ' + all.filter(y => y === x).length + ' ครั้ง').join('  ,  ')),
        subst: EQ('ค่าที่ปรากฏบ่อยที่สุดคือ ' + mode),
        calc: EQ('ฐานนิยม = ' + mode),
        conclude: 'ดังนั้น <b>ฐานนิยมเท่ากับ ' + M(String(mode)) + '</b><br>' +
          '<span class="hint">ข้อสังเกต: ค่าเฉลี่ยของชุดนี้คือ ' + fmtq(mean) +
          ' และมัธยฐานคือ ' + fmtq(medianOf(all)) + ' · ค่ากลางสามแบบให้คำตอบต่างกันได้ ' +
          'จึงต้องอ่านโจทย์ให้ชัดว่าถามแบบไหน</span>'
      }
    };
  }
});

T({
  id: 'm2g-three', topic: 205, sub: 'ค่ากลางของข้อมูล', level: 'ปานกลาง',
  skills: ['หาค่ากลางสามแบบจากชุดเดียวกัน', 'เปรียบเทียบความหมายของค่ากลาง'],
  gen(R) {
    const hot = R.int(4, 9);
    const rest = R.some([2, 3, 5, 6, 7, 8, 10, 11, 12], 5).filter(v => v !== hot).slice(0, 4);
    if (rest.length < 4) return null;
    const data = rest.concat([hot, hot, hot]);
    const mode = modeOf(data);
    if (mode === null) return null;
    const sum = data.reduce((a, b) => a + b, 0);
    const mean = sum / data.length, med = medianOf(data);
    if (!ok2(mean, med)) return null;
    const all = R.shuffle(data);
    return {
      stem: 'จำนวนเล่มหนังสือที่นักเรียน ' + U(all.length, 'คน') + ' อ่านในหนึ่งเดือน คือ<br><b>' +
        all.join(' , ') + '</b><br>' +
        'จงหา<b>ค่าเฉลี่ย</b> · <b>มัธยฐาน</b> · <b>ฐานนิยม</b>',
      given: [{ s: 'จำนวนข้อมูล', v: all.length, unit: 'คน', d: '' },
              { s: 'ผลรวม', v: sum, unit: 'เล่ม', d: 'ของข้อมูลทั้งหมด' }],
      finds: [{ s: 'ค่าเฉลี่ย', unit: 'เล่ม', d: 'ผลรวมหารจำนวนข้อมูล', value: mean, positive: true },
              { s: 'มัธยฐาน', unit: 'เล่ม', d: 'ค่าตรงกลางเมื่อเรียงแล้ว', value: med, positive: true },
              { s: 'ฐานนิยม', unit: 'เล่ม', d: 'ค่าที่พบบ่อยที่สุด', value: mode, positive: true, kind: 'int' }],
      sol: {
        analyze: 'ค่ากลางสามแบบใช้<b>วิธีคำนวณคนละอย่าง</b> ต้องแยกให้ชัด<br>' +
          '• <b>ค่าเฉลี่ย</b> — บวกทุกตัวแล้วหารด้วยจำนวนข้อมูล<br>' +
          '• <b>มัธยฐาน</b> — เรียงก่อน แล้วดูตัวกลาง<br>' +
          '• <b>ฐานนิยม</b> — นับความถี่ ดูตัวที่ซ้ำมากที่สุด<br>' +
          '<b>กับดักของข้อนี้:</b> ใช้ข้อมูลที่ยังไม่เรียงในการหามัธยฐาน',
        eqs: [{ eq: 'ค่าเฉลี่ย = frac(ผลรวม,จำนวนข้อมูล)', why: 'เกลี่ยให้ทุกคนเท่ากัน' },
              { eq: 'มัธยฐาน = ค่าตรงกลางหลังเรียงจากน้อยไปมาก', why: 'แบ่งข้อมูลเป็นครึ่งบนครึ่งล่าง' },
              { eq: 'ฐานนิยม = ค่าที่มีความถี่สูงสุด', why: 'ค่าที่พบบ่อยที่สุด' }],
        solve: '<div>เรียงข้อมูล: ' + M(data.slice().sort((a, b) => a - b).join(' , ')) + '</div>' +
          EQ('ค่าเฉลี่ย = frac(' + sum + ',' + all.length + ')'),
        subst: SEQ('ค่าเฉลี่ย = {m}', { m: mean }),
        calc: EQ('ค่าเฉลี่ย = ' + fmtq(mean) + ' `เล่ม`', 'มัธยฐาน = ' + fmtq(med) + ' `เล่ม`',
                 'ฐานนิยม = ' + mode + ' `เล่ม`'),
        conclude: 'ดังนั้น <b>ค่าเฉลี่ย ' + fmt(mean) + ' · มัธยฐาน ' + fmt(med) + ' · ฐานนิยม ' +
          mode + ' เล่ม</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: ค่ากลางทั้งสามต้องอยู่ระหว่างค่าน้อยสุด (' +
          Math.min.apply(null, all) + ') กับมากสุด (' + Math.max.apply(null, all) + ') ✓</span>'
      }
    };
  }
});

T({
  id: 'm2g-outlier', topic: 205, sub: 'ค่ากลางของข้อมูล', level: 'ปานกลาง',
  skills: ['ผลของค่าผิดปกติต่อค่าเฉลี่ย', 'เทียบค่าเฉลี่ยก่อนและหลัง'],
  gen(R) {

    const base = [];
    for (let i = 0; i < n; i++) base.push(R.int(20, 30));
    const s1 = base.reduce((a, b) => a + b, 0);
    const m1 = s1 / n;
    const big = R.pick([120, 150, 200, 240]);
    const m2 = (s1 + big) / (n + 1);
    if (!ok2(m1, m2)) return null;
    const rise = round2(m2 - m1);
    if (!ok2(rise)) return null;
    return {
      stem: 'ข้อมูลชุดหนึ่งมี ' + U(n) + ' จำนวน ผลรวมเท่ากับ ' + U(s1) + '<br>' +
        'ต่อมาพบว่ามีข้อมูลตกหล่นไปหนึ่งจำนวนซึ่งมีค่า ' + U(big) + ' จึงนำมาเพิ่มเข้าไป<br>' +
        'จงหา<b>ค่าเฉลี่ยเดิม</b> และ<b>ค่าเฉลี่ยใหม่</b>',
      given: [{ s: 'จำนวนข้อมูลเดิม', v: n, d: '' }, { s: 'ผลรวมเดิม', v: s1, d: '' },
              { s: 'ข้อมูลที่เพิ่ม', v: big, d: 'ค่าสูงผิดปกติ' }],
      finds: [{ s: 'ค่าเฉลี่ยเดิม', d: 'ของข้อมูล ' + n + ' จำนวน', value: m1, positive: true },
              { s: 'ค่าเฉลี่ยใหม่', d: 'ของข้อมูล ' + (n + 1) + ' จำนวน', value: m2, positive: true }],
      sol: {
        analyze: 'ค่าเฉลี่ยขึ้นกับทั้ง<b>ผลรวม</b>และ<b>จำนวนข้อมูล</b> เมื่อเพิ่มข้อมูลหนึ่งตัว ' +
          'ทั้งสองอย่างเปลี่ยนพร้อมกัน<br>' +
          'ข้อมูลใหม่มีค่า ' + big + ' ซึ่งสูงกว่าค่าเฉลี่ยเดิมมาก จึงดึงค่าเฉลี่ยขึ้นอย่างชัดเจน<br>' +
          '<b>กับดักของข้อนี้:</b> หารด้วย ' + n + ' เหมือนเดิมทั้งที่ข้อมูลเพิ่มเป็น ' + (n + 1) + ' จำนวนแล้ว',
        eqs: [{ eq: 'ค่าเฉลี่ย = frac(ผลรวม,จำนวนข้อมูล)', why: 'นิยามของค่าเฉลี่ยเลขคณิต' },
              { eq: 'เพิ่มข้อมูล 1 ตัว ⇒ ผลรวมเพิ่ม และตัวหารเพิ่ม 1', why: 'ต้องเปลี่ยนทั้งสองอย่าง ไม่ใช่แค่ผลรวม' }],
        solve: EQ('ค่าเฉลี่ยเดิม = frac(' + s1 + ',' + n + ')',
                  'ค่าเฉลี่ยใหม่ = frac(' + s1 + ' + ' + big + ',' + (n + 1) + ')'),
        subst: SEQ('ค่าเฉลี่ยใหม่ = frac({s},{k})', { s: s1 + big, k: n + 1 }),
        calc: EQ('ค่าเฉลี่ยเดิม = ' + fmtq(m1), 'ค่าเฉลี่ยใหม่ = ' + fmtq(m2)),
        conclude: 'ดังนั้น <b>ค่าเฉลี่ยเดิม ' + fmt(m1) + ' และค่าเฉลี่ยใหม่ ' + fmt(m2) + '</b><br>' +
          '<span class="hint">ข้อสังเกตสำคัญ: ค่าเฉลี่ยกระโดดขึ้น ' + fmt(rise) +
          ' หน่วยเพราะข้อมูลตัวเดียว · นี่คือเหตุผลที่เมื่อข้อมูลมีค่าผิดปกติ ' +
          'ควรใช้<b>มัธยฐาน</b>เป็นตัวแทนแทนค่าเฉลี่ย</span>'
      }
    };
  }
});

T({
  id: 'm2g-anglealg', topic: 205, sub: 'มุมจากเส้นตัด', level: 'ยาก',
  skills: ['ตั้งสมการจากสมบัติเส้นขนาน', 'แก้สมการแล้วหาขนาดมุมจริง'],
  gen(R) {
    const x = R.int(8, 30);
    const a = R.int(2, 6), b = R.int(5, 40);
    const c = R.int(2, 6);
    if (a <= c) return null;   // ให้สัมประสิทธิ์ที่เหลือเป็นบวกเสมอ จะได้ไม่ต้องคูณ -1 ทั้งสมการ
    const d = a * x + b - c * x;
    const ang = a * x + b;
    // เลี่ยงมุมใกล้ 90° เพราะเส้นตัดจะเกือบตั้งฉาก ดูไม่ออกว่ามุมไหนคู่กับมุมไหน
    if (ang <= 25 || ang >= 155 || Math.abs(ang - 90) < 15 || d <= 0) return null;
    return {
      stem: 'เส้นตรงตัดเส้นขนานสองเส้น เกิด<b>มุมแย้ง</b>สองมุมที่มีขนาด ' +
        M(a + 'x + ' + b) + ' องศา และ ' + M(c + 'x + ' + d) + ' องศา<br>' +
        'จงหาค่าของ ' + M('x') + ' และ<b>ขนาดของมุมนั้นเป็นองศา</b>',
      figure: figParallelLines({ deg: ang, labels: { 3: a + 'x + ' + b, 6: c + 'x + ' + d } }),
      given: [{ s: 'มุมที่ 1', v: a + 'x + ' + b, unit: '°', d: 'มุมแย้ง' },
              { s: 'มุมที่ 2', v: c + 'x + ' + d, unit: '°', d: 'มุมแย้ง' }],
      finds: [{ s: 'x', d: 'ค่าของตัวแปร', value: x, positive: true, kind: 'int' },
              { s: 'ขนาดของมุม', unit: '°', d: 'ขนาดจริงเป็นองศา', value: ang, positive: true, kind: 'int' }],
      sol: {
        analyze: 'ข้อนี้รวมสองเรื่องเข้าด้วยกัน คือ<b>สมบัติเส้นขนาน</b>กับ<b>การแก้สมการ</b><br>' +
          'มุมแย้งเท่ากัน จึงตั้งสมการให้สองนิพจน์เท่ากันได้ทันที<br>' +
          '<b>กับดักของข้อนี้:</b> หาค่า ' + M('x') + ' ได้แล้วตอบเลย ทั้งที่โจทย์ถาม<b>ขนาดของมุม</b>ด้วย · ' +
          M('x') + ' เป็นแค่ตัวแปรกลาง ไม่ใช่ขนาดมุม',
        eqs: [{ eq: 'มุมแย้งเท่ากัน  ⇒  ' + a + 'x + ' + b + ' = ' + c + 'x + ' + d,
                why: 'สมบัติของเส้นขนานทำให้ตั้งสมการได้' },
              { eq: 'รวมตัวแปรไว้ข้างเดียว แล้วแก้หา x', why: 'เป็นสมการเชิงเส้นตัวแปรเดียวธรรมดา' }],
        solve: a - c === 1
          ? EQ(a + 'x + ' + b + ' = ' + c + 'x + ' + d, 'x = ' + (d - b))
          : EQ(a + 'x + ' + b + ' = ' + c + 'x + ' + d,
               (a - c) + 'x = ' + (d - b),
               'x = frac(' + (d - b) + ',' + (a - c) + ')'),
        subst: SEQ('x = {x}', { x: x }),
        calc: EQ('ขนาดของมุม = ' + a + '(' + x + ') + ' + b + ' = ' + ang + '°'),
        conclude: 'ดังนั้น <b>' + M('x = ' + x) + ' และมุมมีขนาด ' + U(ang, '°') + '</b><br>' +
          '<span class="hint">ตรวจคำตอบด้วยนิพจน์อีกอัน: ' +
          M(c + '(' + x + ') + ' + d + ' = ' + (c * x + d) + '°') + ' ✓ เท่ากันพอดี ' +
          'แสดงว่าแก้สมการถูกต้อง</span>'
      }
    };
  }
});

T({
  id: 'm2g-medianfind', topic: 205, sub: 'ค่ากลางของข้อมูล', level: 'ยาก',
  skills: ['ย้อนหาข้อมูลที่หายไปจากค่าเฉลี่ย', 'หามัธยฐานของข้อมูลจำนวนคู่'],
  gen(R) {
    const known = R.some([12, 14, 16, 18, 20, 22, 24, 26], 5);
    const mean = R.int(16, 24);
    const total = mean * 6;
    const miss = total - known.reduce((a, b) => a + b, 0);
    if (miss < 8 || miss > 40) return null;
    const full = known.concat([miss]);
    const med = medianOf(full);
    if (!ok2(med)) return null;
    const sorted = full.slice().sort((a, b) => a - b);
    return {
      stem: 'ข้อมูลชุดหนึ่งมี 6 จำนวน มี<b>ค่าเฉลี่ยเท่ากับ ' + U(mean) + '</b><br>' +
        'ทราบข้อมูล 5 จำนวนคือ <b>' + known.join(' , ') + '</b><br>' +
        'จงหา<b>ข้อมูลที่หายไป</b> และ<b>มัธยฐาน</b>ของข้อมูลทั้ง 6 จำนวน',
      given: [{ s: 'จำนวนข้อมูล', v: 6, d: 'เป็นจำนวนคู่' },
              { s: 'ค่าเฉลี่ย', v: mean, d: 'ของทั้ง 6 จำนวน' },
              { s: 'ข้อมูลที่ทราบ', v: known.join(' , '), d: '5 จำนวน' }],
      finds: [{ s: 'ข้อมูลที่หายไป', d: 'จำนวนที่ 6', value: miss, positive: true, kind: 'int' },
              { s: 'มัธยฐาน', d: 'ค่ากลางของทั้ง 6 จำนวน', value: med, positive: true }],

T({

      finds: [{ s: 'จำนวนเต็มมากที่สุด', d: 'ค่าสูงสุดที่ทำให้อสมการเป็นจริง',

      sol: {

          'ย้าย ' + M(c + 'x') + ' ไปข้างซ้ายและย้าย ' + M(String(b)) + ' ไปข้างขวา<br>' +
          'สัมประสิทธิ์ที่เหลือคือ ' + M(a + ' - ' + c + ' = ' + (a - c)) + ' ซึ่งเป็น<b>จำนวนบวก</b> ' +
          'จึง<b>ไม่ต้องกลับเครื่องหมาย</b><br>' +
          '<b>กับดักของข้อนี้:</b> ตอบ ' + M(String(x - 1)) + ' โดยลืมว่า ' + M('≤') + ' <b>รวม</b>ค่าขอบ',
        eqs: [{ eq: 'รวมตัวแปรไว้ข้างเดียว รวมค่าคงที่ไว้อีกข้าง', why: 'ทำแบบเดียวกับสมการทุกประการ' },
              { eq: 'หารด้วยสัมประสิทธิ์บวก ⇒ เครื่องหมายคงเดิม', why: (a - c) + ' เป็นจำนวนบวก' }],
        solve: EQ(a + 'x + ' + b + ' ≤ ' + c + 'x + ' + d,

        subst: SEQ('x ≤ {v}', { v: x }),
        calc: EQ('จำนวนเต็มที่มากที่สุด = ' + x),
        conclude: 'ดังนั้น <b>คำตอบคือ ' + M(String(x)) + '</b><br>' +

      }
    };

T({

T({

      finds: [{ s: 'ค่าน้อยที่สุดของ x', d: 'ขอบเขตล่าง', value: lo, positive: true, kind: 'int' },
              { s: 'ค่ามากที่สุดของ x', d: 'ขอบเขตบน', value: hi, positive: true, kind: 'int' }],

          'แก้ได้โดยทำกับ<b>ทั้งสามส่วนพร้อมกัน</b> — ลบ ' + M(String(b)) + ' ทั้งสามส่วน ' +
          'แล้วหารด้วย ' + M(String(a)) + ' ทั้งสามส่วน<br>' +
          'เนื่องจาก ' + M(String(a)) + ' เป็นบวก เครื่องหมาย ' + M('≤') + ' ทั้งสองตัวจึงคงเดิม<br>' +
          '<b>กับดักของข้อนี้:</b> แยกแก้ทีละอสมการแล้วลืมส่วนใดส่วนหนึ่ง หรือลบ ' + b +
          ' เฉพาะสองส่วนแล้วลืมส่วนกลาง',
        eqs: [{ eq: 'อสมการสองชั้น ทำเหมือนกันทั้งสามส่วน', why: 'ความสัมพันธ์ระหว่างสามค่ายังคงเดิม' },
              { eq: 'หารด้วยจำนวนบวก ⇒ เครื่องหมายทั้งสองตัวคงเดิม', why: 'ถ้าหารด้วยจำนวนลบต้องกลับทั้งสองตัวและสลับปลาย' }],
        solve: EQ(L + ' ≤ ' + a + 'x + ' + b + ' ≤ ' + Hh,
                  (L - b) + ' ≤ ' + a + 'x ≤ ' + (Hh - b),
                  'frac(' + (L - b) + ',' + a + ') ≤ x ≤ frac(' + (Hh - b) + ',' + a + ')'),
        subst: SEQ('{lo} ≤ x ≤ {hi}', { lo: lo, hi: hi }),
        calc: EQ('ค่าน้อยที่สุดของ x = ' + lo, 'ค่ามากที่สุดของ x = ' + hi),
        conclude: 'ดังนั้น <b>' + M('x') + ' มีค่าตั้งแต่ ' + M(String(lo)) + ' ถึง ' + M(String(hi)) +
          '</b><br>' +
          '<span class="hint">ตรวจคำตอบทั้งสองปลาย: ' + M(a + '(' + lo + ') + ' + b + ' = ' + L) +
          ' ✓ และ ' + M(a + '(' + hi + ') + ' + b + ' = ' + Hh) + ' ✓ ตรงกับขอบทั้งสองพอดี</span>'
      }
    };
  }
});

T({
  id: 'm3i-negword', topic: 301, sub: 'สมบัติของอสมการ', level: 'ยาก',
  skills: ['อสมการที่สัมประสิทธิ์ติดลบ', 'ตรวจคำตอบด้วยการแทนค่า'],
  gen(R) {
    const a = R.int(2, 7), c = R.int(2, 6);
    if (a <= c) return null;
    const x = R.int(2, 12), b = R.int(1, 15);
    // จัดให้สัมประสิทธิ์รวมเป็นลบ เพื่อบังคับให้ต้องกลับเครื่องหมาย
    const d = b + (a - c) * x;
    if (d > 130) return null;
    return {
      stem: 'จงแก้อสมการ ' + M(c + 'x + ' + d + ' ≥ ' + a + 'x + ' + b) + '<br>' +
        'แล้วตอบว่า<b>จำนวนเต็มบวกที่มากที่สุด</b>ที่สอดคล้องคือจำนวนใด',
      given: [{ s: 'อสมการ', v: c + 'x + ' + d + ' ≥ ' + a + 'x + ' + b, d: 'ตัวแปรอยู่สองข้าง' }],
      finds: [{ s: 'จำนวนเต็มบวกมากที่สุด', d: 'ที่ทำให้อสมการเป็นจริง',
                value: x, positive: true, kind: 'int' }],
      distract: [x - 1, x + 1, a - c, d - b],
      exactDistract: true,
      sol: {
        analyze: 'ข้อนี้ตั้งใจให้<b>เลือกทางเดิน</b> ถ้ารวมตัวแปรไว้ข้างซ้ายจะได้สัมประสิทธิ์<b>ติดลบ</b><br>' +
          M(c + 'x - ' + a + 'x = ' + (c - a) + 'x') + ' ซึ่งเป็นลบ · เมื่อหารด้วยจำนวนลบ ' +
          '<b>ต้องกลับเครื่องหมาย</b>จาก ' + M('≥') + ' เป็น ' + M('≤') + '<br>' +
          '<b>ทางลัดที่ปลอดภัยกว่า:</b> ย้ายตัวแปรไปข้าง<b>ขวา</b>แทน จะได้สัมประสิทธิ์บวก ไม่ต้องกลับเครื่องหมายเลย<br>' +
          '<b>กับดักของข้อนี้:</b> รวมตัวแปรไว้ข้างซ้ายแล้วลืมกลับเครื่องหมาย จะได้ ' + M('x ≥ ' + x) +
          ' ซึ่งกลับด้านจากคำตอบจริง',
        eqs: [{ eq: 'ย้ายตัวแปรไปฝั่งที่ทำให้สัมประสิทธิ์เป็นบวก', why: 'เลี่ยงการหารด้วยจำนวนลบ ลดโอกาสลืมกลับเครื่องหมาย' },
              { eq: 'ถ้าจำเป็นต้องหารด้วยจำนวนลบ ⇒ กลับเครื่องหมายอสมการ', why: 'จำนวนลบสลับลำดับมาก-น้อย' }],
        solve: EQ(c + 'x + ' + d + ' ≥ ' + a + 'x + ' + b,
                  d + ' - ' + b + ' ≥ ' + a + 'x - ' + c + 'x',
                  (d - b) + ' ≥ ' + (a - c) + 'x',
                  'x ≤ frac(' + (d - b) + ',' + (a - c) + ')'),
        subst: SEQ('x ≤ {v}', { v: x }),
        calc: EQ('จำนวนเต็มบวกที่มากที่สุด = ' + x),
        conclude: 'ดังนั้น <b>คำตอบคือ ' + M(String(x)) + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: แทน ' + M('x = ' + x) + ' ได้ ' +
          M((c * x + d) + ' ≥ ' + (a * x + b)) + ' ✓ เท่ากันพอดีซึ่ง ' + M('≥') + ' ยอมรับ · ' +
          'ลอง ' + M('x = ' + (x + 1)) + ' จะได้ ' + M((c * (x + 1) + d) + ' ≥ ' + (a * (x + 1) + b)) +
          ' ✗ ไม่จริง</span>'
      }
    };
  }
});

T({
  id: 'm3i-budget', topic: 301, sub: 'โจทย์ปัญหาอสมการ', level: 'ยาก',
  skills: ['ตั้งอสมการจากสถานการณ์สองเงื่อนไข', 'ตอบทั้งอสมการและค่าที่เป็นไปได้'],
  gen(R) {
    const fix = R.pick([200, 250, 300, 350, 400, 500]);
    const per = R.pick([25, 30, 35, 40, 45, 50]);
    const n = R.int(6, 20);
    const budget = fix + per * n + R.int(0, per - 1);
    const item = R.pick(['ค่าเช่าห้องประชุม', 'ค่าเช่ารถ', 'ค่าจัดสถานที่']);
    const unit = item === 'ค่าเช่ารถ' ? 'คน' : 'ชุด';
    return {
      stem: 'ชุมนุมคณิตศาสตร์มีงบประมาณ ' + U(budget, 'บาท') + '<br>' +
        'ต้องจ่าย' + item + 'คงที่ ' + U(fix, 'บาท') + ' และค่าอาหาร' + U(per, 'บาท') + ' ต่อ' + unit + '<br>' +
        'จงหา<b>เงินที่เหลือสำหรับค่าอาหาร</b> และ<b>จำนวน' + unit + 'มากที่สุด</b>ที่จัดได้',
      given: [{ s: 'งบประมาณ', v: budget, unit: 'บาท', d: '' },
              { s: item, v: fix, unit: 'บาท', d: 'จ่ายครั้งเดียว' },
              { s: 'ค่าอาหาร', v: per, unit: 'บาท/' + unit, d: 'แปรตามจำนวน' }],
      finds: [{ s: 'เงินสำหรับค่าอาหาร', unit: 'บาท', d: 'งบที่เหลือหลังหัก' + item,
                value: budget - fix, positive: true, kind: 'int' },
              { s: 'จำนวน' + unit + 'มากที่สุด', unit: unit, d: 'ที่งบพอ',
                value: n, positive: true, kind: 'int' }],
      sol: {
        analyze: 'โจทย์นี้มีค่าใช้จ่ายสองแบบ ต้องแยกให้ชัด<br>' +
          '• <b>คงที่</b> — ' + item + ' จ่ายเท่าเดิมไม่ว่าจะมีกี่' + unit + '<br>' +
          '• <b>แปรผัน</b> — ค่าอาหาร เพิ่มขึ้นตามจำนวน' + unit + '<br>' +
          'ตั้งให้ ' + M('x') + ' เป็นจำนวน' + unit + ' แล้วเขียนว่าค่าใช้จ่ายรวม<b>ไม่เกิน</b>งบประมาณ<br>' +
          '<b>กับดักของข้อนี้:</b> เอางบทั้งหมดหารด้วยค่าอาหารต่อ' + unit + ' โดยลืมหัก' + item + 'ออกก่อน · ' +
          'หรือปัด<b>ขึ้น</b>ตอนท้ายทั้งที่งบไม่พอ',
        eqs: [{ eq: 'ค่าคงที่ + ค่าแปรผัน × จำนวน ≤ งบประมาณ', why: 'แปลคำว่า "งบไม่เกิน" เป็นอสมการ' },
              { eq: 'เงินเหลือสำหรับค่าแปรผัน = งบประมาณ - ค่าคงที่', why: 'หักส่วนที่ต้องจ่ายแน่นอนออกก่อน' },
              { eq: 'จำนวนมากที่สุด = ปัดลงของผลหาร', why: 'จัดครึ่ง' + unit + 'ไม่ได้ และปัดขึ้นจะทำให้งบเกิน' }],
        solve: EQ(fix + ' + ' + per + 'x ≤ ' + budget,
                  per + 'x ≤ ' + budget + ' - ' + fix,
                  'x ≤ frac(' + (budget - fix) + ',' + per + ')'),
        subst: SEQ('เงินเหลือ = {m} `บาท`  ,  x ≤ {v}',
                   { m: budget - fix, v: round2((budget - fix) / per) }),
        calc: EQ('เงินสำหรับค่าอาหาร = ' + (budget - fix) + ' `บาท`',
                 'จำนวน' + unit + 'มากที่สุด = ' + n + ' `' + unit + '`'),
        conclude: 'ดังนั้น <b>เหลือเงินค่าอาหาร ' + U(budget - fix, 'บาท') + ' และจัดได้มากที่สุด ' +
          U(n, unit) + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ' + M(fix + ' + ' + per + ' × ' + n + ' = ' + (fix + per * n)) +
          ' บาท ไม่เกิน ' + budget + ' ✓ · ถ้าเพิ่มอีกหนึ่ง' + unit + 'จะเป็น ' + (fix + per * (n + 1)) +
          ' บาท ซึ่งเกินงบ ✗</span>'
      }
    };
  }
});

T({

      sol: {

          'ลองรูป ' + M('(' + a + 'x - ?)(x - ?)') + ' แล้วหาคู่ที่คูณกลับได้ตรงกับโจทย์<br>' +
          'ได้ ' + M('(' + a + 'x - ' + p + ')(x - ' + q + ')') + '<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบเฉพาะรากที่เป็นจำนวนเต็ม แล้วลืมว่ามีอีกรากที่เป็น<b>เศษส่วน</b> ' +

        solve: EQ(a + 'x^2 - ' + b + 'x + ' + c + ' = 0', '(' + a + 'x - ' + p + ')(x - ' + q + ') = 0'),
        subst: SEQ('x = frac({p},{a})  `หรือ`  x = {q}', { p: p, a: a, q: q }),

                 'ผลบวกของคำตอบ = frac(' + p + ',' + a + ') + ' + q + ' = ' + fmtq(b / a)),
        conclude: 'ดังนั้น <b>รากที่เป็นจำนวนเต็มคือ ' + M(String(q)) + ' และผลบวกของรากคือ ' +

T({
  id: 'm3q-formula', topic: 302, sub: 'สูตรกำลังสอง', level: 'ปานกลาง',
  skills: ['ใช้สูตรกำลังสอง', 'คำนวณค่าในเครื่องหมายราก'],
  gen(R) {
    const p = R.int(1, 9), q = R.int(1, 9);

    const rt = Math.round(Math.sqrt(disc));
    if (rt * rt !== disc || disc === 0) return null;
    const bt = b < 0 ? ' - ' + (-b) + 'x' : ' + ' + b + 'x';
    return {
      stem: 'จงแก้สมการ ' + M('x^2' + bt + ' + ' + c + ' = 0') + ' โดยใช้<b>สูตรกำลังสอง</b><br>' +
        'จงหาค่าใน<b>เครื่องหมายราก</b> (' + M('b^2 - 4ac') + ') และ<b>คำตอบที่มากกว่า</b>',
      given: [{ s: 'a', v: 1, d: 'สัมประสิทธิ์ของ x²' },
              { s: 'b', v: b, d: 'สัมประสิทธิ์ของ x' },
              { s: 'c', v: c, d: 'พจน์คงที่' }],
      finds: [{ s: 'b² - 4ac', d: 'ค่าในเครื่องหมายราก', value: disc, positive: true, kind: 'int' },
              { s: 'คำตอบที่มากกว่า', d: 'รากที่มีค่ามากกว่า', value: Math.max(p, q), positive: true, kind: 'int' }],
      sol: {
        analyze: '<b>สูตรกำลังสอง</b> ใช้ได้กับสมการกำลังสองทุกสมการ แม้แยกตัวประกอบไม่ออก<br>' +
          M('x = frac(-b ± sqrt(b^2 - 4ac),2a)') + '<br>' +
          'ค่า ' + M('b^2 - 4ac') + ' เรียกว่า<b>ดิสคริมิแนนต์</b> บอกจำนวนคำตอบก่อนคำนวณเสร็จ<br>' +
          '<b>กับดักของข้อนี้:</b> แทน ' + M('b') + ' โดยลืมเครื่องหมายลบ · ' + M('b = ' + b) +
          ' ไม่ใช่ ' + (-b) + ' และ ' + M('-b = ' + (-b)),
        eqs: [{ eq: 'x = frac(-b ± sqrt(b^2 - 4ac),2a)', why: 'สูตรกำลังสอง ใช้ได้เสมอเมื่อ a ≠ 0' },
              { eq: 'b^2 - 4ac > 0 ⇒ สองคำตอบ  ·  = 0 ⇒ คำตอบเดียว  ·  < 0 ⇒ ไม่มีคำตอบจริง',
                why: 'ตรวจได้ตั้งแต่ยังไม่คำนวณจบ' }],
        solve: EQ('b^2 - 4ac = (' + b + ')^2 - 4(1)(' + c + ')',
                  'x = frac(' + (-b) + ' ± sqrt(b^2 - 4ac),2)'),
        subst: SEQ('b^2 - 4ac = {d}', { d: disc }),
        calc: EQ('sqrt(' + disc + ') = ' + rt,
                 'x = frac(' + (-b) + ' ± ' + rt + ',2) = ' + Math.max(p, q) + '  `หรือ`  ' + Math.min(p, q)),
        conclude: 'ดังนั้น <b>' + M('b^2 - 4ac = ' + disc) + ' และคำตอบที่มากกว่าคือ ' +
          M(String(Math.max(p, q))) + '</b><br>' +
          '<span class="hint">ตรวจคำตอบด้วยการแยกตัวประกอบ: ' +
          M('(x - ' + p + ')(x - ' + q + ') = 0') + ' ให้รากเดียวกัน ✓ · ' +
          'ดิสคริมิแนนต์เป็นบวกและถอดรากลงตัว จึงรู้ล่วงหน้าว่ารากเป็นจำนวนเต็ม</span>'
      }
    };
  }
});

T({
  id: 'm3q-sumprod', topic: 302, sub: 'สมการกำลังสอง', level: 'ยาก',
  skills: ['ความสัมพันธ์ระหว่างรากกับสัมประสิทธิ์', 'สร้างสมการจากรากที่กำหนด'],
  gen(R) {
    const p = R.int(2, 12), q = R.int(2, 12);
    if (p === q) return null;
    const sum = p + q, prod = p * q;
    return {
      stem: 'สมการกำลังสองสมการหนึ่งมีราก 2 ราก คือ ' + M(p + ' `และ` ' + q) + '<br>' +
        'จงหา<b>ผลบวกของราก</b> · <b>ผลคูณของราก</b> และ<b>สัมประสิทธิ์ของ ' + M('x') +
        '</b> ในสมการรูป ' + M('x^2 + bx + c = 0'),
      given: [{ s: 'รากที่ 1', v: p, d: '' }, { s: 'รากที่ 2', v: q, d: '' }],
      finds: [{ s: 'ผลบวกของราก', d: 'เท่ากับ -b', value: sum, positive: true, kind: 'int' },
              { s: 'ผลคูณของราก', d: 'เท่ากับ c', value: prod, positive: true, kind: 'int' },
              { s: 'b', d: 'สัมประสิทธิ์ของ x', value: -sum, kind: 'int' }],
      sol: {
        analyze: 'ถ้ารากคือ ' + M('α') + ' และ ' + M('β') + ' สมการเขียนได้เป็น ' +
          M('(x - α)(x - β) = 0') + '<br>' +
          'กระจายออกได้ ' + M('x^2 - (α + β)x + αβ = 0') + '<br>' +
          'เทียบกับรูปมาตรฐาน ' + M('x^2 + bx + c = 0') + ' จะเห็นว่า ' +
          M('b = -(α + β)') + ' และ ' + M('c = αβ') + '<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบ ' + M('b = ' + sum) + ' โดยลืมเครื่องหมายลบ · ' +
          'สัมประสิทธิ์ของ ' + M('x') + ' เป็น<b>ค่าตรงข้าม</b>ของผลบวกของราก',
        eqs: [{ eq: '(x - α)(x - β) = x² - (α + β)x + αβ', why: 'กระจายวงเล็บสองอันแล้วรวมพจน์คล้าย' },
              { eq: 'ผลบวกของราก = -b  ·  ผลคูณของราก = c  (เมื่อสัมประสิทธิ์หน้า x² เป็น 1)',
                why: 'ใช้ตรวจคำตอบของสมการกำลังสองได้เร็วมาก โดยไม่ต้องแทนค่ากลับ' }],
        solve: EQ('ผลบวกของราก = ' + p + ' + ' + q, 'ผลคูณของราก = ' + p + ' × ' + q,
                  'b = -(ผลบวกของราก)'),
        subst: SEQ('ผลบวก = {s}  ,  ผลคูณ = {t}', { s: sum, t: prod }),
        calc: EQ('ผลบวกของราก = ' + sum, 'ผลคูณของราก = ' + prod, 'b = -' + sum),
        conclude: 'ดังนั้น <b>ผลบวกของราก ' + M(String(sum)) + ' · ผลคูณของราก ' + M(String(prod)) +
          ' · ' + M('b = -' + sum) + '</b><br>' +
          '<span class="hint">สมการที่ได้คือ ' + M('x^2 - ' + sum + 'x + ' + prod + ' = 0') + ' · ' +
          'ตรวจด้วยการแยกตัวประกอบ: ' + M('(x - ' + p + ')(x - ' + q + ') = 0') + ' ให้รากตรงตามโจทย์ ✓</span>'
      }
    };
  }
});

T({

    return {

      figure: figParabola({ a: 1, b: b, c: c, roots: [p, q], vertex: true,
                            xmin: -6, xmax: 6, ymin: -10, ymax: 12 }),
      given: [{ s: 'สมการพาราโบลา', v: 'y = x²' + bt + ct, d: '' }],
      finds: [{ s: 'จุดตัดแกน x จุดซ้าย', d: 'ค่า x ที่น้อยกว่า', value: p, kind: 'int' },
              { s: 'จุดตัดแกน x จุดขวา', d: 'ค่า x ที่มากกว่า', value: q, kind: 'int' }],
      sol: {
        analyze: 'จุดที่กราฟตัดแกน ' + M('x') + ' คือจุดที่ ' + M('y = 0') + '<br>' +

          'นี่คือความเชื่อมโยงสำคัญ: <b>รากของสมการกำลังสอง = จุดตัดแกน ' + M('x') + ' ของกราฟ</b><br>' +
          '<b>กับดักของข้อนี้:</b> ตอบเป็นคู่อันดับ ' + M('(' + p + ' , ' + q + ')') +

        eqs: [{ eq: 'จุดตัดแกน x ⇒ แทน y = 0', why: 'ทุกจุดบนแกน x มีพิกัด y เป็นศูนย์' },
              { eq: 'แยกตัวประกอบแล้วใช้สมบัติผลคูณเป็นศูนย์', why: 'ได้รากทั้งสองพร้อมกัน' }],
        solve: EQ('0 = x^2' + bt + ct, '(x - ' + p + ')(x - ' + q + ') = 0'),
        subst: SEQ('x = {p}  `หรือ`  x = {q}', { p: p, q: q }),
        calc: EQ('จุดตัดแกน x: x = ' + p + '  `และ`  x = ' + q),
        conclude: 'ดังนั้น <b>กราฟตัดแกน ' + M('x') + ' ที่ ' + M(p + ' `และ` ' + q) + '</b><br>' +

T({

      finds: [{ s: 'อายุลูกปัจจุบัน', unit: 'ปี', d: 'อายุของลูกในวันนี้', value: son, positive: true, kind: 'int' },
              { s: 'อายุพ่อปัจจุบัน', unit: 'ปี', d: 'อายุของพ่อในวันนี้', value: dad, positive: true, kind: 'int' }],
      sol: {
        analyze: 'ให้ ' + M('x') + ' = อายุลูกปัจจุบัน และ ' + M('y') + ' = อายุพ่อปัจจุบัน<br>' +
          '<b>เงื่อนไขที่ 1 (ปัจจุบัน)</b> ' + M('x + y = ' + sum) + '<br>' +
          '<b>เงื่อนไขที่ 2 (อีก ' + yr + ' ปี)</b> ทั้งสองคนแก่ขึ้น<b>คนละ ' + yr + ' ปีเท่ากัน</b> ' +
          'จึงได้ ' + M('y + ' + yr + ' = ' + k + '(x + ' + yr + ')') + '<br>' +
          '<b>กับดักของข้อนี้:</b> บวก ' + yr + ' ให้เฉพาะคนเดียว · เวลาผ่านไปเท่ากันทุกคน ' +
          'ต้องบวกให้ทั้งสองฝั่ง',
        eqs: [{ eq: 'อายุปัจจุบันรวมกัน: x + y = ผลรวมที่โจทย์ให้', why: 'เงื่อนไขแรกจากโจทย์' },
              { eq: 'อีก n ปี: (y + n) = k(x + n)', why: 'ทุกคนอายุเพิ่มขึ้นเท่ากัน จึงบวก n ทั้งสองฝั่ง' },
              { eq: 'แทน y = ผลรวม - x ลงในสมการที่สอง', why: 'ลดเหลือตัวแปรเดียว' }],
        solve: EQ('x + y = ' + sum, 'y + ' + yr + ' = ' + k + '(x + ' + yr + ')',

        calc: EQ((k + 1) + 'x = ' + (sum + yr - k * yr), 'x = ' + son + ' `ปี`',
                 'y = ' + sum + ' - ' + son + ' = ' + dad + ' `ปี`'),
        conclude: 'ดังนั้น <b>ลูกอายุ ' + U(son, 'ปี') + ' และพ่ออายุ ' + U(dad, 'ปี') + '</b><br>' +
          '<span class="hint">ตรวจคำตอบกับเงื่อนไขอนาคต: อีก ' + yr + ' ปี ลูกอายุ ' + (son + yr) +
          ' พ่ออายุ ' + (dad + yr) + ' · ' + M((dad + yr) + ' = ' + k + ' × ' + (son + yr)) + ' ✓ ' +

T({

          '<b>กับดักของข้อนี้:</b> เอา ' + (2 * per) + ' หาร 4 ทันที · บังเอิญข้อนี้ได้เท่ากัน ' +

        eqs: [{ eq: 'เส้นรอบรูป = 2(กว้าง + ยาว)', why: 'แปลงความยาวรั้วเป็นเงื่อนไขของสองด้าน' },

        subst: SEQ('x = {w}   ⇒   A = {w} × ({h} - {w})', { w: w, h: half }),

        conclude: 'ดังนั้น <b>กว้าง ' + U(w, 'ม.') + ' ได้พื้นที่มากที่สุด ' + U(area, 'ตร.ม.') + '</b><br>' +

T({
  id: 'm3s-mixfrac', topic: 303, sub: 'กำจัดตัวแปร', level: 'ยาก',

  gen(R) {
    const x = R.int(2, 12), y = R.int(2, 12);
    const k1 = R.pick([2, 3, 4]), k2 = R.pick([2, 3, 5]);
    if (k1 === k2) return null;                       // ต้องต่างกัน ไม่งั้นกำจัดตัวแปรไม่ได้
    if (x % k1 !== 0 || y % k2 !== 0) return null;
    const s1 = x / k1 + y / k2;
    const s2 = x + y;
    const L = k1 * k2 / gcd(k1, k2);                  // ค.ร.น. ของตัวส่วน
    if (!Number.isInteger(s1)) return null;

      stem: 'จงแก้ระบบสมการต่อไปนี้<br>' +
        M('frac(x,' + k1 + ') + frac(y,' + k2 + ') = ' + s1) + '<br>' + M('x + y = ' + s2),
      given: [{ s: 'สมการที่ 1', v: 'x/' + k1 + ' + y/' + k2 + ' = ' + s1, d: 'มีเศษส่วน' },
              { s: 'สมการที่ 2', v: 'x + y = ' + s2, d: '' }],
      finds: [{ s: 'x', d: 'ค่าของตัวแปร x', value: x, positive: true, kind: 'int' },
              { s: 'y', d: 'ค่าของตัวแปร y', value: y, positive: true, kind: 'int' }],
      sol: {
        analyze: 'สมการที่มีเศษส่วนควร<b>กำจัดตัวส่วนก่อน</b> ด้วยการคูณทั้งสมการด้วย ' +
          '<b>ค.ร.น. ของตัวส่วน</b> คือ ' + M(String(L)) + '<br>' +
          'จะได้สมการที่มีแต่จำนวนเต็ม ทำให้ลดข้อผิดพลาดตอนกำจัดตัวแปร<br>' +
          '<b>กับดักของข้อนี้:</b> คูณ ค.ร.น. เข้าเฉพาะพจน์ที่มีเศษส่วน ลืมคูณพจน์ทางขวา · ' +
          'ต้องคูณ<b>ทุกพจน์ทั้งสองข้าง</b>',
        eqs: [{ eq: 'คูณทั้งสมการด้วย ค.ร.น. ของตัวส่วน เพื่อกำจัดเศษส่วน',
                why: 'ทำให้เหลือแต่จำนวนเต็ม คิดง่ายและพลาดน้อยลง' },
              { eq: 'จากนั้นใช้วิธีกำจัดตัวแปรตามปกติ', why: 'ระบบสมการเชิงเส้นสองตัวแปรมาตรฐาน' }],
        solve: EQ('(1) × ' + L + ':  ' + (L / k1) + 'x + ' +
                    (L / k2) + 'y = ' + (s1 * L),
                  '(2) × ' + (L / k2) + ':  ' + (L / k2) + 'x + ' +
                    (L / k2) + 'y = ' + (s2 * L / k2),
                  'ลบกัน:  ' + (L / k1 - L / k2) + 'x = ' +
                    (s1 * L - s2 * L / k2)),
        subst: SEQ('x = {x}   ⇒   y = {s} - {x}', { x: x, s: s2 }),
        calc: EQ('x = ' + x, 'y = ' + y),
        conclude: 'ดังนั้น <b>' + M('x = ' + x) + ' และ ' + M('y = ' + y) + '</b><br>' +
          '<span class="hint">ตรวจคำตอบในสมการที่มีเศษส่วน: ' +
          M('frac(' + x + ',' + k1 + ') + frac(' + y + ',' + k2 + ') = ' + (x / k1) + ' + ' + (y / k2) +
            ' = ' + s1) + ' ✓</span>'
      }
    };
  }
});

T({
  id: 'm3c-pyramid', topic: 304, sub: 'พีระมิด', level: 'ปานกลาง',
  skills: ['ปริมาตรพีระมิดฐานสี่เหลี่ยมจัตุรัส', 'พื้นที่ผิวข้าง'],
  gen(R) {
    const b = R.pick([6, 8, 10, 12, 14, 16, 18]);
    const h = R.pick([6, 9, 12, 15, 18, 24]);
    const V = b * b * h / 3;
    const slant = Math.sqrt(h * h + (b / 2) * (b / 2));
    if (!Number.isInteger(slant)) return null;
    const side = 4 * (b * slant / 2);
    if (!ok2(V, side)) return null;
    return {
      stem: 'พีระมิดฐานสี่เหลี่ยมจัตุรัส ยาวด้านละ ' + U(b, 'ซม.') + ' สูงตรง ' + U(h, 'ซม.') + '<br>' +
        'จงหา<b>ปริมาตร</b> และ<b>พื้นที่ผิวข้าง</b>',
      figure: figPyramid({ b: b, h: h, slant: slant, unit: 'ซม.' }),
      given: [{ s: 'ด้านฐาน', v: b, unit: 'ซม.', d: 'ฐานเป็นสี่เหลี่ยมจัตุรัส' },
              { s: 'สูงตรง', v: h, unit: 'ซม.', d: 'จากยอดตั้งฉากลงกลางฐาน' }],
      finds: [{ s: 'V', unit: 'ลบ.ซม.', d: 'ปริมาตรของพีระมิด', value: V, positive: true },
              { s: 'พื้นที่ผิวข้าง', unit: 'ตร.ซม.', d: 'สามเหลี่ยมสี่หน้ารวมกัน', value: side, positive: true }],
      sol: {
        analyze: 'พีระมิดก็เหมือนกรวย คือมีปริมาตรเป็น ' + M('frac(1,3)') +
          ' ของทรงตันที่ฐานและสูงเท่ากัน<br>' +
          'ส่วน<b>พื้นที่ผิวข้าง</b>ต้องใช้<b>สูงเอียง</b> ไม่ใช่สูงตรง<br>' +
          'หาสูงเอียงด้วยพีทาโกรัสจากสามเหลี่ยมมุมฉากที่มีด้านคือ สูงตรง กับ<b>ครึ่งหนึ่งของด้านฐาน</b><br>' +
          '<b>กับดักของข้อนี้:</b> เอาสูงตรง ' + U(h, 'ซม.') +
          ' ไปคำนวณพื้นที่หน้าสามเหลี่ยม · หน้าสามเหลี่ยมเอียงออกไป จึงยาวกว่าสูงตรงเสมอ',
        eqs: [{ eq: 'V = frac(1,3) × พื้นที่ฐาน × สูงตรง', why: 'เช่นเดียวกับกรวย พีระมิดเป็นหนึ่งในสามของปริซึม' },
              { eq: 'สูงเอียง = sqrt(สูงตรง^2 + (frac(ด้านฐาน,2))^2)',
                why: 'พีทาโกรัสในสามเหลี่ยมมุมฉากที่ตั้งจากกลางฐานไปยังกึ่งกลางขอบฐาน' },
              { eq: 'พื้นที่ผิวข้าง = 4 × frac(1,2) × ด้านฐาน × สูงเอียง', why: 'หน้าข้างเป็นสามเหลี่ยมสี่รูปเท่ากัน' }],
        solve: EQ('V = frac(1,3) × ' + b + '^2 × ' + h,
                  'สูงเอียง = sqrt(' + h + '^2 + ' + (b / 2) + '^2)'),
        subst: SEQ('V = {v}   ,   สูงเอียง = {l} `ซม.`', { v: V, l: slant }),
        calc: EQ('V = ' + fmtq(V) + ' `ลบ.ซม.`',
                 'พื้นที่ผิวข้าง = 4 × frac(1,2) × ' + b + ' × ' + slant + ' = ' + fmtq(side) + ' `ตร.ซม.`'),
        conclude: 'ดังนั้น <b>ปริมาตร ' + U(V, 'ลบ.ซม.') + ' และพื้นที่ผิวข้าง ' + U(side, 'ตร.ซม.') +
          '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: สูงเอียง ' + U(slant, 'ซม.') +
          ' ต้องมากกว่าสูงตรง ' + U(h, 'ซม.') + ' ✓ เพราะเป็นด้านตรงข้ามมุมฉาก</span>'
      }
    };
  }
});

T({

      sol: {

          '<b>กับดักของข้อนี้:</b> เอา ' + M('h') + ' ไปแทนใน ' + M('pi r l') + ' ตรง ๆ · ' +
          'สังเกตในรูปว่าสูงเอียงลาดออกไป จึงยาวกว่าสูงตรงเสมอ',
        eqs: [{ eq: 'l = sqrt(r^2 + h^2)', why: 'พีทาโกรัสในสามเหลี่ยมมุมฉากที่เกิดจากรัศมี สูงตรง และสูงเอียง' },
              { eq: 'พื้นที่ผิวข้างของกรวย = pi r l', why: 'ได้จากการคลี่ผิวข้างออกเป็นรูปพัด' },

        solve: EQ('l = sqrt(' + r + '^2 + ' + h + '^2)', 'พื้นที่ผิวข้าง = pi r l'),
        subst: SEQ('l = sqrt({s}) = {l}   ⇒   พื้นที่ผิวข้าง = {pi} × {r} × {l}',
                   { s: r * r + h * h, l: l, pi: c.pi, r: r }),
        calc: EQ('l = ' + l + ' `ซม.`', 'พื้นที่ผิวข้าง = ' + fmtq(side) + ' `ตร.ซม.`'),
        conclude: 'ดังนั้น <b>สูงเอียง ' + U(l, 'ซม.') + ' และพื้นที่ผิวข้าง ' + U(side, 'ตร.ซม.') +
          '</b><br>' +
          '<span class="hint">ถ้าโจทย์ถามพื้นที่ผิว<b>ทั้งหมด</b> ต้องบวกพื้นที่ฐาน ' +
          U(round2(base), 'ตร.ซม.') + ' เข้าไปด้วย รวมเป็น ' + U(round2(side + base), 'ตร.ซม.') + '</span>'
      }
    };
  }
});

/** คู่ (มุม , ค่า tan) ที่ค่า tan เป็นการปัดของมุมนั้นจริง ๆ
    ต้องจับคู่กันแบบนี้ ไม่งั้นรูปที่วาดจะทำมุมไม่ตรงกับค่าที่โจทย์กำหนดให้
    นักเรียนที่เอาไม้โปรแทรกเตอร์ไปวัดรูปจะเจอว่าไม่ตรง */
const TAN_TAB = [[27, 0.5], [31, 0.6], [37, 0.75], [39, 0.8], [45, 1],
                 [51, 1.25], [53, 1.33], [56, 1.5], [63, 2]];

/** มุมจริงของสามเหลี่ยมมุมฉากที่มีด้านข้าม opp และด้านชิด adj
    ใช้วาดรูปให้ทำมุมตรงกับความยาวด้านที่ระบุไว้ในโจทย์ */
function degOf(opp, adj) { return Math.round(Math.atan2(opp, adj) * 180 / Math.PI); }

/** ควอไทล์แบบที่ใช้ในหลักสูตร ม.3 — แบ่งครึ่งข้อมูลแล้วหามัธยฐานของแต่ละครึ่ง
    ใช้กับจำนวนข้อมูลที่เป็นคี่ (7 หรือ 11) จึงได้ค่าที่เป็นสมาชิกจริงทุกตัว */
function quartiles(sorted) {
  const n = sorted.length, h = (n - 1) / 2;
  return { q1: sorted[Math.floor((h - 1) / 2)], q2: sorted[h],
           q3: sorted[h + 1 + Math.floor((h - 1) / 2)] };
}

T({
  id: 'm3t-elev', topic: 305, sub: 'มุมก้มมุมเงย', level: 'ปานกลาง',
  skills: ['ใช้ tan กับโจทย์มุมเงย', 'บวกความสูงของผู้สังเกต'],
  gen(R) {
    const tp = R.pick(TAN_TAB);
    const ang = tp[0], tanv = tp[1];
    const d = R.pick([20, 24, 30, 40, 50, 60]);
    const rise = tanv * d;
    const eye = R.pick([120, 140, 150, 160]) / 100;
    const total = rise + eye;
    if (!ok2(rise, total) || rise < 5) return null;
    const nm = R.pick(NAMES);
    return {
      stem: nm + 'ยืนห่างจากตึกเป็นระยะทางราบ ' + U(d, 'ม.') + '<br>' +
        'มองยอดตึกด้วย<b>มุมเงย</b> ' + U(ang, '°') + ' โดยระดับตาสูงจากพื้น ' + U(eye, 'ม.') + '<br>' +
        'กำหนดให้ ' + M('tan ' + ang + '° = ' + fmt(tanv)) + '<br>' +
        'จงหา<b>ความสูงจากระดับตาถึงยอดตึก</b> และ<b>ความสูงของตึก</b>',
      figure: figTrig({ deg: ang, adj: d, opp: null, hyp: null, unit: 'ม.' }),
      given: [{ s: 'ระยะทางราบ', v: d, unit: 'ม.', d: 'ด้านประชิดมุมเงย' },
              { s: 'tan ' + ang + '°', v: tanv, d: 'ตามที่โจทย์กำหนด' },
              { s: 'ระดับตา', v: eye, unit: 'ม.', d: 'สูงจากพื้น' }],
      finds: [{ s: 'ความสูงจากระดับตา', unit: 'ม.', d: 'ด้านตรงข้ามมุมเงย', value: rise, positive: true },
              { s: 'ความสูงของตึก', unit: 'ม.', d: 'วัดจากพื้นถึงยอด', value: total, positive: true }],
      sol: {
        analyze: '<b>มุมเงย</b>วัดจาก<b>แนวระดับสายตา</b>ขึ้นไปหาวัตถุ ' +
          'จึงเกิดสามเหลี่ยมมุมฉากที่มีระยะทางราบเป็นด้าน<b>ประชิด</b> ' +
          'และความสูงจากระดับตาขึ้นไปเป็นด้าน<b>ตรงข้าม</b><br>' +
          'มีด้านชิดและต้องการด้านข้าม จึงใช้ ' + M('tan') + '<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบ ' + U(rise, 'ม.') + ' เป็นความสูงของตึกเลย · ' +
          'สามเหลี่ยมเริ่มที่<b>ระดับตา</b>ไม่ใช่ที่พื้น ต้องบวกความสูงระดับตากลับเข้าไปด้วย',
        eqs: [{ eq: 'tan θ = frac(ด้านตรงข้าม,ด้านประชิด)', why: 'รู้ด้านชิดและต้องการด้านข้าม จึงเลือก tan' },
              { eq: 'ด้านตรงข้าม = ด้านประชิด × tan θ', why: 'ย้ายข้างเพื่อหาความสูง' },
              { eq: 'ความสูงจริง = ความสูงจากระดับตา + ความสูงระดับตา', why: 'สามเหลี่ยมเริ่มที่ระดับตาไม่ใช่พื้นดิน' }],
        solve: EQ('tan ' + ang + '° = frac(h,' + d + ')', 'h = ' + d + ' × tan ' + ang + '°'),
        subst: SEQ('h = {d} × {t}', { d: d, t: tanv }),
        calc: EQ('h = ' + fmtq(rise) + ' `ม.`',
                 'ความสูงของตึก = ' + fmtq(rise) + ' + ' + fmtq(eye) + ' = ' + fmtq(total) + ' `ม.`'),
        conclude: 'ดังนั้น <b>สูงจากระดับตา ' + U(rise, 'ม.') + ' และตึกสูง ' + U(total, 'ม.') + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: ' + (tanv > 1
            ? 'ค่า tan มากกว่า 1 แปลว่ามุมเงยเกิน 45° ความสูงจึงควรมากกว่าระยะทางราบ ' + fmt(d) + ' ม. ✓'
            : 'ค่า tan น้อยกว่า 1 แปลว่ามุมเงยไม่ถึง 45° ความสูงจึงควรน้อยกว่าระยะทางราบ ' + fmt(d) + ' ม. ✓') +
          '</span>'
      }
    };
  }
});

          'ตรงกับ ' + M('tan 45° = frac(ข้าม,ชิด) = 1') + ' ซึ่งแปลว่าข้ามเท่ากับชิดพอดี<br>' +

T({
  id: 'm3t-dice', topic: 305, sub: 'ความน่าจะเป็น', level: 'ปานกลาง',

    return {

              FF('P', cnt, 36, 'ความน่าจะเป็นที่ผลรวมเป็น ' + s)],

          'ผลลัพธ์ทั้งหมดจึงเป็น ' + M('6 × 6 = 36') + ' แบบ<br>' +
          'จากนั้น<b>ไล่นับ</b>คู่ที่บวกกันได้ ' + M(String(s)) + ' โดยถือว่าลูกเต๋าสองลูก<b>แยกกันได้</b><br>' +
          'คู่ที่ได้: ' + Array.from({ length: cnt }, (_, i) => {

          }).join(' , ') + ' รวม ' + cnt + ' แบบ<br>' +

          ' เป็นแบบเดียวกัน ทำให้นับขาด · ลูกเต๋าสองลูกแยกกันได้ จึงต้องนับทั้งสองแบบ',
        eqs: [{ eq: 'n(S) = 6 × 6 = 36', why: 'แต่ละลูกมี 6 ผลลัพธ์ และเป็นอิสระต่อกัน' },
              { eq: 'P(E) = frac(n(E),n(S))', why: 'ทุกผลลัพธ์มีโอกาสเท่ากัน' }],
        solve: EQ('n(S) = 6 × 6', 'n(E) = จำนวนคู่ที่ผลรวมเป็น ' + s),
        subst: SEQ('n(S) = 36  ,  n(E) = {c}', { c: cnt }),
        calc: EQ('P = frac(' + cnt + ',36) = ' + fracTxt(cnt, 36)),
        conclude: 'ดังนั้น <b>ผลลัพธ์ทั้งหมด ' + U(36, 'แบบ') + ' และ ' + M('P = ' + fracTxt(cnt, 36)) +
          '</b><br>' +
          '<span class="hint">ข้อสังเกต: ผลรวมที่มีโอกาสมากที่สุดคือ <b>7</b> (6 แบบ) ' +
          'เพราะอยู่ตรงกลาง · ยิ่งห่างจาก 7 โอกาสยิ่งน้อยลง</span>'
      }
    };
  }
});

T({

function subsOf(topicId) {
  const seen = [];
  TPL.forEach(t => { if (t.topic === topicId && seen.indexOf(t.sub) < 0) seen.push(t.sub); });
  return seen;
}
function poolFor(topics, subs, level) {
  return TPL.filter(t => topics.indexOf(t.topic) >= 0 && t.level === level &&
    (!subs || !subs.length || subs.indexOf(t.sub) >= 0));
}
function mkCfg() {
  if (!DB.settings.make) {
    DB.settings.make = { topics: ALL_TOPIC_IDS.slice(), subs: [], mode: 'mix', n: 10,
                         counts: { 'ทฤษฎี': 2, 'ง่าย': 3, 'ปานกลาง': 3, 'ยาก': 2 } };
  }
  // ถ้ามีการเพิ่ม/ลบบทในโปรแกรมรุ่นใหม่ ให้ตัดเรื่องที่ไม่มีอยู่จริงทิ้ง กันหน้าจอพัง
  const c = DB.settings.make;
  c.topics = (c.topics || []).filter(t => ALL_TOPIC_IDS.indexOf(t) >= 0);
  if (!c.topics.length) c.topics = ALL_TOPIC_IDS.slice();
  return c;
}

/** สร้างชุดโจทย์ใหม่ — เก็บแค่ tplId กับ seed ทำให้สร้างโจทย์เดิมกลับมาได้เสมอ */
function createQuiz(o) {
  const R = rng(o.seed >>> 0);
  const items = [];
  const missing = [];
  LEVELS.forEach(lv => {
    const need = o.counts[lv] || 0;
    if (!need) return;
    const pool = poolFor(o.topics, o.subs, lv);
    if (!pool.length) { missing.push(lv); return; }
    // สับแม่แบบแล้วไล่หยิบวนไป เพื่อให้กระจายทั่วถึงก่อนจะเริ่มซ้ำ
    let bag = R.shuffle(pool);
    for (let k = 0; k < need; k++) {
      if (k % pool.length === 0 && k > 0) bag = R.shuffle(pool);
      const tpl = bag[k % pool.length];
      items.push({ tplId: tpl.id, seed: R.int(1, 2000000000), level: lv, topic: tpl.topic });
    }
  });
  if (missing.length) return { error: 'ไม่มีโจทย์ระดับ ' + missing.join(', ') + ' ในเรื่อง/หัวข้อที่เลือก' };
  // เรียงจากง่ายไปยาก แล้วเรียงตามเรื่อง เพื่อให้ใบงานไล่ระดับอย่างเป็นธรรมชาติ
  items.sort((a, b) => (LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level)) || (chOf(a.topic) - chOf(b.topic)));
  return {
    id: uid(), ts: Date.now(), title: o.title, seed: o.seed,
    topics: o.topics.slice(), subs: (o.subs || []).slice(), counts: Object.assign({}, o.counts),
    kind: o.kind === 'test' ? 'test' : 'practice',
    seedShift: o.kind === 'test' ? (Math.floor(Math.random() * 2000000000) + 1) : 0,
    piMode: DB.settings.piMode || '3.14',
    items: items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}

/* แคชโจทย์ที่สร้างแล้ว เพื่อไม่ต้องคำนวณซ้ำทุกครั้งที่วาดหน้าจอ */
const PCACHE = {};
/** seedShift ทำให้แบบทดสอบใช้แม่แบบและระดับความยากชุดเดิมเป๊ะ แต่ตัวเลขในโจทย์ต่างออกไป
    เก็บไว้ที่ตัวชุดโจทย์ ทุกที่ที่เรียก problemsOf() จึงได้โจทย์ชุดเดียวกันเสมอ
    ไม่มีทางที่หน้าทำข้อสอบกับตัวตรวจคำตอบจะใช้คนละเลข */
function problemsOf(quiz) {
  if (!quiz) return [];
  const sh = (quiz.seedShift || 0) >>> 0;
  const key = quiz.id + ':' + sh;
  if (PCACHE[key]) return PCACHE[key];
  const arr = quiz.items.map(it =>
    buildProblem(it.tplId, ((it.seed + sh) >>> 0), { piMode: quiz.piMode }));
  PCACHE[key] = arr;
  return arr;
}
function quizMaxScore(quiz) { return quiz.items.length; }

/** สร้างแบบทดสอบจากแบบฝึกหัดชุดหนึ่ง — แม่แบบ/หัวข้อ/ระดับเหมือนเดิมทุกข้อ แต่ตัวเลขคนละชุด */
function makeTestFrom(quiz, title) {
  let sh = 0;
  // กันกรณีสุ่มได้ 0 พอดี ซึ่งจะทำให้ตัวเลขซ้ำกับแบบฝึกหัดเป๊ะ
  while (!sh) sh = Math.floor(Math.random() * 2000000000) + 1;
  return {
    id: uid(), ts: Date.now(),
    title: title || ('แบบทดสอบ — ' + (quiz.title || '')),
    kind: 'test', seedShift: sh, fromQuizId: quiz.id,
    seed: quiz.seed, topics: (quiz.topics || []).slice(), subs: (quiz.subs || []).slice(),
    counts: Object.assign({}, quiz.counts),
    piMode: quiz.piMode,
    items: quiz.items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}

/** อ่านเฉพาะ id ของชุดโจทย์จากสเปก โดยไม่ต้องถอดทั้งชุด */
function decodeQuizId(spec) {
  const q = decodeQuiz(spec);
  return q ? q.id : null;
}

/** รับใบงานตามรหัสแล้วเริ่มทำทันที */
async function takeAssignment(code) {
  try {
    const a = await api('assignGet', { code: code });
    const q = decodeQuiz(a.spec);
    if (!q) { toast('อ่านใบงานนี้ไม่ได้ — แจ้งครูให้มอบหมายใหม่', 'bad'); return; }
    if (!DB.quizzes.some(x => x.id === q.id)) DB.quizzes.push(q);
    DB.cur.quizId = q.id;
    save(true);
    startQuiz(q.id, a.code);
  } catch (e) { toast(e.message, 'bad'); }
}

function takeByCode() {
  openModal({
    title: 'กรอกรหัสใบงาน',
    bodyHTML: '<div class="hint" style="margin-bottom:9px">กรอกรหัส 6 ตัวที่ครูให้มา</div>' +
      '<input type="text" id="tcCode" maxlength="6" autocapitalize="characters" ' +
      'style="width:100%;font-size:26px;text-align:center;letter-spacing:7px;text-transform:uppercase">' +
      '<div id="tcMsg" style="margin-top:10px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'รับใบงาน', cls: 'primary', act: async (close, root) => {
          const c = ($('#tcCode', root).value || '').trim().toUpperCase();
          if (c.length !== 6) { $('#tcMsg', root).innerHTML = '<div class="notice bad">รหัสต้องมี 6 ตัว</div>'; return; }
          try {
            const a = await api('assignGet', { code: c });
            const q = decodeQuiz(a.spec);
            if (!q) throw new Error('อ่านใบงานนี้ไม่ได้');
            if (!DB.quizzes.some(x => x.id === q.id)) DB.quizzes.push(q);
            save(true); close(); startQuiz(q.id, a.code);
          } catch (e) { $('#tcMsg', root).innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>'; }
        } }
    ],
    onMount: root => $('#tcCode', root).focus()
  });
}

function formulaHTML(topicId) {
  const t = topicOf(topicId), list = FORMULAS[topicId] || [];
  if (!list.length) return '<div class="hint">ยังไม่มีสรุปสูตรของบทนี้</div>';
  return '<div class="fxlist">' + list.map(f =>
    '<div class="fxrow"><div class="fxe">' + M(f.e) + '</div>' +

function gradeSpanText() {
  const gs = gradesInUse().filter(g => g.id).map(g => g.id);
  if (!gs.length) return 'ระดับมัธยมศึกษาตอนต้น';
  if (gs.length === 1) return 'ชั้นมัธยมศึกษาปีที่ ' + gs[0];
  return 'ชั้นมัธยมศึกษาปีที่ ' + gs[0] + '–' + gs[gs.length - 1];
}

  $('#printarea').innerHTML = h;

/** ระดับชั้นที่ชุดลัดกำลังเล็งอยู่ — 'all' คือคละทุกชั้น
    เมื่อมีคลังโจทย์หลายระดับชั้น ปุ่ม "ฝึกเร็ว" ต้องรู้ว่าจะสุ่มจากชั้นไหน
    ไม่งั้นเด็ก ม.1 จะได้โจทย์ ม.3 ปนมาโดยไม่รู้ตัว */
function presetGrade() {
  const k = (DB.cur && DB.cur.pg) || 'all';
  if (k === 'all') return null;
  const g = GRADES.find(x => x.key === k && x.id);
  return g && TOPICS.some(t => gradeOf(t) === g.id) ? g : null;
}

function presetTopics(scope) {
  if (Array.isArray(scope)) return scope.slice();
  const gs = GRADES.find(x => x.key === scope);
  if (gs) return TOPICS.filter(t => gradeOf(t) === gs.id).map(t => t.id);
  let list = scope === 'core' ? TOPICS.filter(t => !t.exam) : TOPICS.slice();
  const pg = presetGrade();
  if (pg) list = list.filter(t => gradeOf(t) === pg.id);   // เล็งเฉพาะชั้นที่ครูเลือกไว้
  return list.map(t => t.id);
}
/** ชุดลัดที่ยังไม่มีเรื่องรองรับ ไม่ต้องขึ้นปุ่มให้กดแล้วเจอ error */
function presetsAvailable() { return PRESETS.filter(p => presetTopics(p.scope).length); }

function runPreset(key) {
  const ps = PRESETS.find(p => p.key === key);
  if (!ps) return;
  // ตรวจชื่อผู้เรียนก่อนสร้างชุด ไม่งั้นจะได้ชุดโจทย์ค้างไว้โดยที่ยังเริ่มทำไม่ได้
  if (needLearnerName()) return;
  const c = mkCfg();
  c.topics = presetTopics(ps.scope);
  c.subs = [];
  c.mode = 'mix';
  c.counts = Object.assign({}, ps.counts);
  c.kind = ps.kind;
  const pg = presetGrade();
  const title = ps.name.replace(/\s*\d+\s*ข้อ.*$/, '').trim() +
    (pg && ps.scope !== 'ex' ? ' ' + pg.label : '') + ' — ' + thDate(Date.now());
  c.lastTitle = title;
  const q = createQuiz({
    title: title, topics: c.topics, subs: [], counts: c.counts, kind: ps.kind,
    seed: Math.floor(Math.random() * 2000000000) + 1
  });
  if (q.error) { toast(q.error, 'bad'); return; }
  DB.quizzes.push(q);
  DB.cur.quizId = q.id;
  save(true);
  toast('สร้าง' + ps.name + 'แล้ว — กดเริ่มทำได้เลย', 'ok');
  startQuiz(q.id);
}

  });

    DB.quizzes.slice().reverse().forEach(q => {

      const lv = LEVELS.filter(l => q.counts[l]).map(l =>

    DB.cur.pg = b.dataset.pg; save(); renderMake();
  }));
  $$('[data-fx]').forEach(b => b.addEventListener('click', () => showFormulas(Number(b.dataset.fx))));
  $('#btnAllFx').addEventListener('click', showAllFormulas);

      c.subs = c.subs.filter(s => subsOf(id).indexOf(s) < 0);   // เอาหัวข้อย่อยของเรื่องที่ปิดออกด้วย
    } else c.topics.push(id);
    save(); renderMake();
  }));

    const q = DB.quizzes.find(x => x.id === b.dataset.delq);

    if (!ok) return;
    DB.quizzes = DB.quizzes.filter(x => x.id !== q.id);
    DB.attempts = DB.attempts.filter(a => a.quizId !== q.id);
    if (DB.cur.quizId === q.id) { DB.cur.quizId = null; DB.cur.attemptId = null; }
    delete PCACHE[q.id];
    save(true); renderMake(); toast('ลบแล้ว');
  }));
  $$('[data-share]').forEach(b => b.addEventListener('click', () => shareQuiz(b.dataset.share)));
  $$('[data-publish]').forEach(b => b.addEventListener('click', () => publishQuiz(b.dataset.publish)));
  $('#btnPasteQuiz').addEventListener('click', pasteQuiz);
}

/** แสดงรหัสใบงานให้ครูคัดลอกไปส่งนักเรียน */
function shareQuiz(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);

  const code = encodeQuiz(q);
  openModal({
    title: 'แชร์ใบงาน "' + (q.title || '') + '"',
    bodyHTML:
      '<div class="hint" style="margin-bottom:9px">ส่งรหัสนี้ให้นักเรียนทางไลน์กลุ่ม Google Classroom หรือช่องทางไหนก็ได้ ' +
      'นักเรียนกด <b>รับใบงานจากรหัสที่ครูให้มา</b> ในแท็บสร้างชุดโจทย์ แล้ววางรหัสลงไป<br>' +
      'จะได้โจทย์ <b>ตรงกันทุกตัวเลข</b> โดยไม่ต้องส่งไฟล์และไม่ต้องใช้อินเทอร์เน็ตหลังจากนั้น</div>' +
      '<textarea id="qShareBox" readonly style="width:100%;height:120px;font-family:ui-monospace,monospace;' +
      'font-size:12px;word-break:break-all">' + esc(code) + '</textarea>' +
      '<div class="hint" style="margin-top:7px">ความยาว ' + code.length + ' ตัวอักษร · ' +
      q.items.length + ' ข้อ · π = ' + piTxt(q.piMode) + '</div>',
    buttons: [
      { label: 'ปิด' },
      { label: 'คัดลอกรหัส', cls: 'primary', act: async (close) => {
          const ok = await copyText(code);
          toast(ok ? 'คัดลอกรหัสใบงานแล้ว' : 'คัดลอกไม่สำเร็จ ให้เลือกข้อความในกล่องแล้วคัดลอกเอง', ok ? 'ok' : 'bad');
          if (ok) close();
        } }
    ],
    onMount: root => { const t = $('#qShareBox', root); if (t) { t.focus(); t.select(); } }
  });
}

/** นักเรียนวางรหัสที่ครูให้มา แล้วสร้างชุดโจทย์เดียวกันขึ้นในเครื่อง */
function pasteQuiz() {
  openModal({
    title: 'รับใบงานจากรหัส',
    bodyHTML:
      '<div class="hint" style="margin-bottom:9px">วางรหัสที่ครูส่งมาลงในกล่องด้านล่าง แล้วกด <b>รับใบงาน</b></div>' +
      '<textarea id="qPasteBox" placeholder="PHYSQ1:..." style="width:100%;height:120px;' +
      'font-family:ui-monospace,monospace;font-size:12px;word-break:break-all"></textarea>' +
      '<div id="qPasteMsg" style="margin-top:8px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'รับใบงาน', cls: 'primary', act: (close, root) => {
          const val = $('#qPasteBox', root).value;
          const q = decodeQuiz(val);
          const msg = $('#qPasteMsg', root);
          if (!q) {
            msg.innerHTML = '<div class="notice bad">อ่านรหัสนี้ไม่ได้ — ตรวจว่าคัดลอกมาครบทั้งหมด ' +
              'และไม่มีตัวอักษรตกหล่น</div>';
            return;
          }
          const had = DB.quizzes.find(x => x.id === q.id);
          if (had) {
            DB.cur.quizId = had.id; save(true); close(); renderMake();
            toast('มีใบงานชุดนี้อยู่แล้ว — เลือกให้เป็นชุดปัจจุบันแล้ว', 'ok');
            return;
          }
          DB.quizzes.push(q);
          DB.cur.quizId = q.id;
          save(true); close(); renderMake();
          toast('รับใบงาน "' + q.title + '" (' + q.items.length + ' ข้อ) เรียบร้อย', 'ok');
        } }
    ],
    onMount: root => { const t = $('#qPasteBox', root); if (t) t.focus(); }
  });
}

          toast('สร้างแบบทดสอบ ' + t.items.length + ' ข้อแล้ว — ตัวเลขต่างจากแบบฝึกหัด', 'ok');

function doGenerate() {
  const c = mkCfg();
  if (!c.topics.length) { toast('เลือกอย่างน้อยหนึ่งเรื่องก่อน', 'bad'); return; }
  // ตรวจชื่อผู้เรียนก่อนสร้างชุด เหตุผลเดียวกับใน runPreset
  if (needLearnerName()) return;
  const counts = {};
  if (c.mode === 'mix') LEVELS.forEach(l => counts[l] = c.counts[l] || 0);
  else counts[c.mode] = c.n;
  const total = LEVELS.reduce((s, l) => s + (counts[l] || 0), 0);
  if (total < 1) { toast('ระบุจำนวนข้ออย่างน้อย 1 ข้อ', 'bad'); return; }
  if (total > 40) { toast('ชุดหนึ่งได้สูงสุด 40 ข้อ', 'bad'); return; }

  const kind = c.kind === 'test' ? 'test' : 'practice';
  const shortOf = t => { const x = TOPICS.find(v => v.id === t); return x ? x.short : ''; };
  const title = ($('#qtitle').value || '').trim() ||
    (QUIZ_KINDS[kind].name + ' ' + c.topics.map(shortOf).filter(Boolean).join(' + ') + ' ' + thDate(Date.now()));
  c.lastTitle = title;
  const q = createQuiz({
    title: title, topics: c.topics, subs: c.subs, counts: counts, kind: kind,
    seed: Math.floor(Math.random() * 2000000000) + 1
  });
  if (q.error) { toast(q.error, 'bad'); return; }
  DB.quizzes.push(q);
  DB.cur.quizId = q.id;
  save(true);
  toast('สร้าง' + QUIZ_KINDS[kind].name + ' ' + q.items.length + ' ข้อแล้ว', 'ok');
  renderMake();
}

             no: String(p.no || ''), sid: String(p.sid || ''), room: String(p.room || '') };
  }
  const s = studentById(DB.cur.studentId);
  return s ? { studentId: s.id, name: s.name, no: String(s.no || ''), sid: String(s.sid || ''),
               room: (classById(s.classId) || {}).name || '' } : null;
}
/** ยังไม่ได้ใส่ชื่อผู้เรียน — บอกให้ชัดแล้วพาไปที่ช่องกรอกเลย
    เดิมแค่ขึ้นข้อความเตือนแวบเดียวแล้วเงียบ ผู้ใช้จึงเห็นเป็น "กดแล้วไม่มีอะไรเกิดขึ้น"
    เจอบ่อยเป็นพิเศษตอนเปิดวิชาใหม่ เพราะแต่ละวิชาเก็บชื่อแยกคนละที่ในเบราว์เซอร์
    ชื่อที่เคยกรอกไว้ในวิชาอื่นจึงไม่ตามมาให้ */
function needLearnerName() {
  if (DB.mode !== 'solo' || DB.profile.name.trim()) return false;
  toast('ใส่ชื่อผู้เรียนที่ช่องด้านบนก่อน แล้วจึงเริ่มทำได้', 'bad');
  const el = $('#soloName');
  if (el) {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.focus();
    el.style.borderColor = 'var(--bad)';
    el.style.background = 'var(--bad-bg)';
    setTimeout(() => { el.style.borderColor = ''; el.style.background = ''; }, 2600);
  }
  return true;
}

function startQuiz(quizId, assignCode) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  const who = currentLearner();
  if (!who) { toast('เลือกผู้เรียนที่แถบบนก่อน (หรือเพิ่มรายชื่อในแท็บตั้งค่า)', 'bad'); return; }
  if (needLearnerName()) return;
  const a = {
    id: uid(), quizId: q.id, studentId: who.studentId, soloName: who.name,
    // ติดเลขที่/เลขประจำตัว/ชั้นไปกับผลด้วย เพื่อให้ครูจับคู่ได้แม่นตอนรวมไฟล์จากเครื่องนักเรียน
    no: who.no || '', sid: who.sid || '', room: who.room || '',
    assignCode: assignCode || null,   // ผูกกับใบงานบนชีต ถ้ามาจากการมอบหมาย
    startedAt: Date.now(), finishedAt: null,
    answers: q.items.map(() => ({ raw: [], pick: null, checked: false, score: 0, tries: 0, revealed: false, sec: 0 }))
  };
  DB.attempts.push(a);
  DB.cur.quizId = q.id; DB.cur.attemptId = a.id; DB.cur.i = 0;
  QT.i = -1;
  save(true);
  setTab('do');
}

/* --- 5.4 แท็บทำแบบฝึกหัด -------------------------------------------------- */
const QT = { i: -1, t0: 0 };   // จับเวลาต่อข้อ
function stampTime() {
  const a = curAttempt();
  if (a && QT.i >= 0 && a.answers[QT.i]) a.answers[QT.i].sec += (Date.now() - QT.t0) / 1000;
  QT.i = -1;
}
function gotoQ(i) {
  const a = curAttempt(); if (!a) return;
  stampTime();
  DB.cur.i = clamp(i, 0, a.answers.length - 1);
  QT.i = DB.cur.i; QT.t0 = Date.now();
  save(); renderDo();
}

function renderDo() {
  const a = curAttempt(), q = curQuiz();
  if (!a || !q || a.quizId !== q.id) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ยังไม่ได้เริ่มทำแบบฝึกหัด</h3>' +
      '<div class="hint">ไปที่แท็บ <b>สร้างชุดโจทย์</b> เพื่อสร้างชุดใหม่ หรือเลือกชุดที่มีอยู่แล้วกด <b>เริ่มทำ</b></div>' +
      '<div class="row" style="margin-top:10px"><button class="primary" id="goMake">ไปสร้างชุดโจทย์</button></div></div>';
    const b = $('#goMake'); if (b) b.addEventListener('click', () => setTab('make'));
    return;
  }
  if (a.finishedAt) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ทำชุดนี้เสร็จแล้ว</h3>' +
      '<div class="hint">ชุด "' + esc(q.title) + '" ทำเสร็จเมื่อ ' + thDateTime(a.finishedAt) + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="primary" id="goRes">ดูผลและการวิเคราะห์</button>' +
      '<button id="goMake2">สร้าง / เลือกชุดใหม่</button></div></div>';
    $('#goRes').addEventListener('click', () => setTab('result'));
    $('#goMake2').addEventListener('click', () => setTab('make'));
    return;
  }

  const probs = problemsOf(q);
  const i = clamp(DB.cur.i, 0, probs.length - 1);
  const p = probs[i], it = a.answers[i];
  if (QT.i !== i) { QT.i = i; QT.t0 = Date.now(); }

  const done = a.answers.filter(x => x.checked).length;
  const gotScore = a.answers.reduce((s, x) => s + x.score, 0);
  const T = isTest(q);          // แบบทดสอบ: ไม่บอกถูกผิดและไม่มีเฉลยระหว่างทำ

  let h = '<div class="card noprint"><div class="row">' +
    '<div class="grow"><b>' + esc(q.title) + '</b> ' +
    '<span class="tag ' + QUIZ_KINDS[quizKind(q)].cls + '">' + QUIZ_KINDS[quizKind(q)].name + '</span>' +
    '<div class="hint">ผู้ทำ: ' + esc(attemptWho(a)) +
    ' · ข้อ ' + (i + 1) + ' จาก ' + probs.length +
    (T ? ' · ตอบแล้ว ' + done + ' ข้อ'
       : ' · ตรวจแล้ว ' + done + ' ข้อ · ได้ ' + fmt(gotScore) + ' คะแนน') + '</div></div>' +
    '<button class="sm" id="btnFinish">ส่งคำตอบ / จบชุดนี้</button></div>' +
    '<div class="bar" style="margin-top:9px"><i style="width:' + Math.round(done / probs.length * 100) + '%"></i></div>' +
    '<div class="qnav" style="margin-top:11px">' +
    a.answers.map((x, k) => {
      let cls = '';
      // ระหว่างทำข้อสอบ แสดงแค่ว่าตอบแล้วหรือยัง ไม่บอกว่าถูกหรือผิด
      if (x.checked) cls = T ? 'half' : (x.score >= 1 ? 'ok' : (x.score > 0 ? 'half' : 'bad'));
      if (k === i) cls += ' cur';
      return '<button class="' + cls + '" data-go="' + k + '">' + (k + 1) + '</button>';
    }).join('') + '</div>' +
    (T ? '<div class="hint" style="margin-top:9px">โหมดแบบทดสอบ — ไม่แสดงเฉลยและไม่บอกถูกผิดระหว่างทำ ' +
         'กลับไปแก้คำตอบข้อไหนก็ได้ก่อนกดส่ง</div>' : '') + '</div>';

  // ใบงานที่มาจากไฟล์รุ่นใหม่กว่าอาจอ้างแม่แบบที่เครื่องนี้ยังไม่มี (เช่น บทที่เพิ่มภายหลัง)
  // กรณีนี้สร้างโจทย์ไม่ได้ ต้องบอกให้ชัดว่าให้ไปโหลดไฟล์รุ่นใหม่ ไม่ใช่ปล่อยให้จอว่าง
  if (!p) {
    h += '<div class="card"><div class="notice bad"><b>เปิดข้อนี้ไม่ได้</b><br>' +
      'ข้อนี้ใช้โจทย์จากบทที่ไฟล์รุ่นนี้ยังไม่มี — แปลว่าครูสร้างใบงานด้วยโปรแกรมรุ่นใหม่กว่า</div>' +
      '<div class="hint">วิธีแก้: <b>รีเฟรชหน้านี้</b> (ดึงลงบนไอแพด) เพื่อโหลดโปรแกรมรุ่นล่าสุด ' +
      'ถ้ายังไม่หาย ให้แจ้งครูว่าต้องอัปโหลดไฟล์รุ่นใหม่ขึ้นเว็บก่อน</div>' +
      '<div class="row" style="margin-top:11px">' +
      '<button class="primary" onclick="location.reload(true)">รีเฟรชโปรแกรม</button>' +
      '<button id="skipBad">ข้ามไปข้อถัดไป</button></div></div>';
    $('#pane-do').innerHTML = h;
    $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));

  h += '<div class="card">' + problemHead(p, i + 1) + problemBody(p);

  // --- ช่องตอบ ---

                : '<span class="hint">(' + esc(p.finds[0].d) + ' หน่วย ' + esc(p.finds[0].unit || '—') + ')</span>') +
      '</div><div class="choices' + (p.theory ? ' txt' : '') + '">';
    p.choices.forEach((ch, k) => {
      let cls = 'choice';
      if (it.pick === k) cls += ' sel';
      if (it.checked && !T) { if (ch.correct) cls += ' ok'; else if (it.pick === k) cls += ' bad'; }
      h += '<button class="' + cls + '" data-pick="' + k + '"' + (it.checked && !T ? ' disabled' : '') + '>' +
        '<span class="k">' + 'กขคง'[k] + '.</span><span>' +
        (p.theory ? ch.text
                  : M((ch.text != null ? ch.text : fmt(ch.value)) +
                      (p.finds[0].unit ? ' `' + p.finds[0].unit + '`' : ''))) +
        '</span></button>';
    });
    h += '</div>';
  } else {
    h += ansHintHTML(p);
    p.finds.forEach((f, k) => {
      const okc = (it.checked && !T) ? (checkAns(it.raw[k], f) ? ' ok' : ' bad') : '';
      h += '<div class="ansrow"><label class="lab" for="in' + k + '">' + M(f.s) + ' <span class="hint">' + esc(f.d) + '</span></label>' +
        '<input type="text" inputmode="' + (f.kind === 'frac' ? 'text' : 'decimal') + '" class="numin' + okc +
        '" id="in' + k + '" data-in="' + k + '" value="' +
        esc(it.raw[k] == null ? '' : it.raw[k]) + '"' + (it.checked && !T ? ' disabled' : '') + '>' +
        '<span class="unit">' + esc(f.unit || '') + '</span></div>';
    });
  }
  if (T) {
    h += '<div class="row" style="margin-top:11px"><button class="primary" id="btnCheck">' +
      (it.checked ? 'บันทึกคำตอบใหม่' : 'บันทึกคำตอบ') + '</button>' +
      (it.checked ? '<span class="hint" style="color:var(--ok)">บันทึกคำตอบข้อนี้แล้ว — แก้ได้จนกว่าจะกดส่ง</span>'
                  : '<span class="hint">ยังไม่ได้บันทึกคำตอบข้อนี้</span>') + '</div>';
  } else if (it.checked) {
    const full = it.score >= 1, part = it.score > 0 && it.score < 1;
    h += '<div class="verdict ' + (full ? 'ok' : 'bad') + '">' +
      (full ? '✓ ถูกต้อง' : part ? '◑ ถูกบางส่วน — ได้ ' + fmt(it.score) + ' คะแนน' : '✗ ยังไม่ถูก') +
      '</div><div class="hint">คำตอบที่ถูกคือ ' +
      (p.theory
        ? 'ข้อ ' + 'กขคง'[p.choices.findIndex(c => c.correct)] + '.'
        : p.finds.map(f => M(f.s + ' = ' + ansTxt(f) + (f.unit ? ' `' + f.unit + '`' : ''))).join(' , ')) +

  // --- วิธีทำ (แบบทดสอบไม่แสดง) ---
  if (!T && (it.checked || it.revealed)) {
    h += '<h3 style="margin:16px 0 6px">วิธีทำอย่างละเอียด</h3>' +
      '<div class="hint" style="margin-bottom:8px">แตะหัวข้อแต่ละขั้นเพื่อเปิด-ปิด</div>' + solutionHTML(p, false);
  }

  h += '<div class="row" style="margin-top:14px">' +
    '<button id="btnPrev"' + (i === 0 ? ' disabled' : '') + '>← ข้อก่อนหน้า</button>' +
    '<button id="btnNext"' + (i === probs.length - 1 ? ' disabled' : '') + '>ข้อถัดไป →</button>' +
    '<div class="grow"></div><span class="hint">ใช้เวลาข้อนี้ไปแล้ว ' + mmss(it.sec) + '</span></div>';
  h += '</div>';

  $('#pane-do').innerHTML = h;

  // --- ผูกเหตุการณ์ ---
  $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));

  $('#btnFinish').addEventListener('click', finishAttempt);
  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    it.pick = Number(b.dataset.pick); save(); renderDo();
  }));
  $$('[data-in]').forEach(inp => {
    inp.addEventListener('input', e => { it.raw[Number(e.target.dataset.in)] = e.target.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkCurrent(); } });
  });
  const bc = $('#btnCheck'); if (bc) bc.addEventListener('click', checkCurrent);
  const br = $('#btnReveal'); if (br) br.addEventListener('click', () => {
    it.revealed = true; save(); renderDo();
    toast('เปิดวิธีทำแล้ว — ข้อนี้ยังตรวจคำตอบได้ตามปกติ');
  });
  const bt = $('#btnRetry'); if (bt) bt.addEventListener('click', () => {
    it.checked = false; it.raw = []; it.pick = null; save(); renderDo();
  });
  bindSolutionToggle($('#pane-do'));
  const first = $('.numin:not([disabled])');
  if (first && (T || !it.checked)) first.focus();
}

/** ตรวจข้อปัจจุบัน — คะแนนจะถูกล็อกไว้ที่การตรวจครั้งแรกเพื่อให้สถิติสะท้อนความจริง */
function checkCurrent() {
  const a = curAttempt(), q = curQuiz(); if (!a || !q) return;
  const i = DB.cur.i, p = problemsOf(q)[i], it = a.answers[i];
  if (!p) { toast('ข้อนี้เปิดไม่ได้ในโปรแกรมรุ่นนี้ — ให้รีเฟรชหน้าเพื่อโหลดรุ่นล่าสุด', 'bad'); return; }
  const T = isTest(q);
  if (it.checked && !T) return;      // แบบทดสอบแก้คำตอบซ้ำได้จนกว่าจะส่ง
  let score = 0;
  if (p.choices) {
    if (it.pick == null) { toast('เลือกคำตอบก่อน', 'bad'); return; }
    score = p.choices[it.pick].correct ? 1 : 0;
  } else {
    let blank = 0, hit = 0;
    p.finds.forEach((f, k) => {
      if (parseNum(it.raw[k]) == null) blank++;
      else if (checkAns(it.raw[k], f)) hit++;
    });
    if (blank === p.finds.length) { toast('กรอกคำตอบก่อน', 'bad'); return; }
    score = hit / p.finds.length;
  }
  it.checked = true; it.tries++;
  // แบบฝึกหัดล็อกคะแนนที่การตรวจครั้งแรก · แบบทดสอบใช้คำตอบล่าสุดที่บันทึกไว้
  if (T || it.tries === 1) it.score = score;
  stampTime(); QT.i = i; QT.t0 = Date.now();
  save(true);
  renderDo();
  if (T) toast('บันทึกคำตอบข้อ ' + (i + 1) + ' แล้ว', 'ok');
  else toast(score >= 1 ? 'ถูกต้อง!' : score > 0 ? 'ถูกบางส่วน' : 'ยังไม่ถูก ลองดูวิธีทำ',
             score >= 1 ? 'ok' : score > 0 ? '' : 'bad');

  // ส่งความคืบหน้าขึ้นชีตทุก 3 ข้อ — ไอแพดแบตหมดกลางคันก็ไม่เสียของ
  if (isStudent() && a.assignCode && DB.settings.autoDraft) {
    const n = a.answers.filter(x => x.checked).length;
    if (n % 3 === 0) sendAttempt(a, 'draft');
  }
}

async function finishAttempt() {
  const a = curAttempt(); if (!a) return;
  const q0 = curQuiz();
  const left = a.answers.filter(x => !x.checked).length;
  if (left) {
    const ok = await confirmBox('ส่งคำตอบ', 'ยังเหลืออีก <b>' + left + ' ข้อ</b>ที่ยังไม่ได้' +
      (isTest(q0) ? 'บันทึกคำตอบ' : 'ตรวจ') + ' ข้อที่ไม่ได้ทำจะได้ 0 คะแนน ต้องการส่งเลยหรือไม่?', 'ส่งเลย');
    if (!ok) return;
  } else if (isTest(q0)) {
    // ข้อสอบส่งแล้วแก้ไม่ได้ ต้องยืนยันก่อนเสมอ
    if (!await confirmBox('ส่งแบบทดสอบ',
      'ตอบครบทุกข้อแล้ว — <b>ส่งแล้วจะแก้คำตอบไม่ได้อีก</b><br>ต้องการส่งเลยหรือไม่?', 'ส่งเลย')) return;
  }
  stampTime();
  a.finishedAt = Date.now();
  save(true);
  setTab('result');

  if (isStudent() && a.assignCode) {
    toast('กำลังส่งผลให้ครู…');
    const ok = await sendAttempt(a, 'final');
    if (ok) { MYA.list = null; toast('ส่งผลให้ครูเรียบร้อยแล้ว', 'ok'); }
    else toast('ส่งไม่สำเร็จ — เก็บไว้ในคิวแล้ว จะส่งให้เองเมื่อต่อเน็ตได้', 'warn');
    renderResult();
  }
}
