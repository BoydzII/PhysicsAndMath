/* ช่องเขียนวิธีทำในใบงาน — ยุบขั้นที่ทำต่อเนื่องกันเข้าเป็นช่องเดียว
   เพื่อให้นักเรียนเขียนได้ลื่นขึ้นและใบงานไม่ยาวเกินไป
   (ใบเฉลยและหน้าจอในแอพยังแยกครบทั้ง 7 ขั้นตามเดิม) */
const WORK_BLOCKS = [
  { id: 'analyze',  t: 'วิเคราะห์โจทย์ / สิ่งที่กำหนด',  n: 3, d: 'รวมขั้นที่ 1-2' },
  { id: 'equation', t: 'หลักการที่ใช้ / ตั้งสมการ',      n: 4, d: 'รวมขั้นที่ 3-4' },
  { id: 'subst',    t: 'แทนค่า / ดำเนินการ',            n: 1, d: 'ขั้นที่ 5' },
  { id: 'calc',     t: 'คำนวณ',                        n: 3, d: 'ขั้นที่ 6' },
  { id: 'conclude', t: 'สรุปคำตอบและตรวจสอบ',           n: 1, d: 'ขั้นที่ 7' }
];
const WORK_MAX = 12;
/* ความหนาแน่นของเอกสารที่พิมพ์ — คุมสามอย่างให้ไปทางเดียวกัน
     plain = จำนวนข้อ "ปรนัย" ที่ตั้งใจให้ลงได้ในหนึ่งหน้า
     work  = จำนวนข้อ "แสดงวิธีทำ" (มีกรอบเขียน) ที่ตั้งใจให้ลงได้ในหนึ่งหน้า
     ws    = ตัวคูณจำนวนบรรทัดในกรอบเขียนวิธีทำ — ยิ่งอัดหลายข้อต่อหน้า บรรทัดยิ่งต้องน้อยลง
   ส่วนขนาดรูปประกอบและความสูงบรรทัดคุมด้วยคลาส dn-* ในส่วน CSS */
const DENSITY = [
  { k: 'airy',   n: 'โปร่ง',   ws: 1.5, caps: true,
    d: 'รูปใหญ่ ช่องเขียนกว้าง · ปรนัยราว 2-4 ข้อ/หน้า · ข้อแสดงวิธีทำ 1 ข้อ/หน้า' },
  { k: 'normal', n: 'ปานกลาง', ws: 0.55, caps: true,
    d: 'ปรนัยราว 3-4 ข้อ/หน้า · ข้อแสดงวิธีทำ 2 ข้อ/หน้า' },
  { k: 'tight',  n: 'แน่น',    ws: 0.75, caps: false,
    d: 'รูปเล็ก ช่องเขียนเป็นบรรทัดเปล่า · ปรนัยราว 3-5 ข้อ/หน้า · ข้อแสดงวิธีทำ 3 ข้อ/หน้า' }
];
function densityOf(k) { return DENSITY.find(d => d.k === k) || DENSITY[1]; }

/** จำนวนบรรทัดของแต่ละช่องตามที่ครูตั้งไว้ (ยังไม่เคยตั้ง = ใช้ค่าเริ่มต้น)
    ส่ง scale มาเพื่อย่อ-ขยายตามความหนาแน่นที่เลือก — ช่องที่ครูตั้งไว้ว่า "ไม่ต้องมี" (0)
    ยังคงเป็น 0 เสมอ ไม่ว่าจะย่อขยายเท่าไร */
function workLines(scale) {
  const s = DB.settings.workLines || (DB.settings.workLines = {});
  const k = scale == null ? 1 : scale;
  const out = {};
  WORK_BLOCKS.forEach(b => {
    const base = s[b.id] == null ? b.n : clamp(Math.round(Number(s[b.id]) || 0), 0, WORK_MAX);
    out[b.id] = base ? clamp(Math.round(base * k), 1, WORK_MAX) : 0;
  });
  return out;
}
function workTotal(scale) { const L = workLines(scale); return WORK_BLOCKS.reduce((s, b) => s + L[b.id], 0); }
function workBox(steps, scale) {
  const L = workLines(scale);
  const on = WORK_BLOCKS.filter(b => L[b.id] > 0);          // ตั้ง 0 = ไม่ต้องมีช่องนั้น
  const total = Math.max(1, on.reduce((s, b) => s + L[b.id], 0));
  if (!steps || !on.length) {
    return '<div class="work">' + new Array(total + 1).join('<div class="wl"></div>') + '</div>';
  }
  let k = 0;
  return '<div class="work">' + on.map(b =>
    '<div class="wcap">' + (++k) + '. ' + b.t + '</div>' +
    new Array(L[b.id] + 1).join('<div class="wl"></div>')
  ).join('') + '</div>';
}

/* กระดาษ A4 แนวตั้ง ขอบ 15mm บน-ล่าง และ 14mm ซ้าย-ขวา (ตรงกับ @page ในส่วน CSS)
   จึงเหลือพื้นที่พิมพ์จริง 182 × 267 มิลลิเมตร */
const PAGE_W_MM = 182, PAGE_H_MM = 267;
const PX_PER_MM = 96 / 25.4;

/** จัดหน้าใบงานจาก<b>ความสูงจริง</b>ของแต่ละข้อ แทนการเดาจากจำนวนตัวอักษร
    ต้องเรียกหลังจากใส่ HTML ลง #printarea แล้ว เพราะต้องให้เบราว์เซอร์จัดวางก่อนจึงวัดได้

    วิธีทำงาน
      1) ตั้งความกว้างของกล่องให้เท่ากระดาษจริงชั่วคราว ข้อความจึงตัดบรรทัดเหมือนตอนพิมพ์
      2) วัดความสูงของทุกชิ้นในหน้า
      3) ไล่ใส่ทีละข้อ พอจะเกินความสูงหน้ากระดาษก็ขึ้นหน้าใหม่
    ผลคือแต่ละหน้าเต็มพอดี ไม่เหลือที่ว่างครึ่งหน้าเหมือนตอนปล่อยให้เบราว์เซอร์ตัดเอง */
function paginatePrint(area, onePer) {
  const pg = $('.pg', area);
  if (!pg) return;
  const prevW = area.style.width;
  area.style.width = PAGE_W_MM + 'mm';
  const rows = Array.from(pg.children).map(el => ({
    el: el, h: el.getBoundingClientRect().height, item: el.classList.contains('pitem')
  }));
  area.style.width = prevW;
  if (!rows.some(r => r.item)) return;

  const limit = PAGE_H_MM * PX_PER_MM;
  const pages = [[]];
  let acc = 0, hasItem = false;
  rows.forEach(r => {
    // ขึ้นหน้าใหม่เมื่อข้อนี้ทำให้ล้น — แต่หน้าที่<b>ยังไม่มีข้อใดเลย</b>ต้องรับข้อนั้นไว้เสมอ
    // เงื่อนไขนี้กันสองอย่างพร้อมกัน: หน้าแรกที่มีแต่หัวกระดาษจะไม่กลายเป็นหน้าเปล่า
    // และข้อที่สูงเกินหนึ่งหน้าจะไม่วนสร้างหน้าเปล่าไม่รู้จบ
    if (r.item && hasItem && (onePer || acc + r.h > limit)) { pages.push([]); acc = 0; hasItem = false; }
    pages[pages.length - 1].push(r.el);
    acc += r.h;
    if (r.item) hasItem = true;
  });

  const frag = document.createDocumentFragment();
  pages.forEach(list => {
    const d = document.createElement('div');
    d.className = 'pg';
    list.forEach(el => d.appendChild(el));
    frag.appendChild(d);
  });
  pg.replaceWith(frag);
}

function buildDoc(kind, opt) {
  const o = opt || {};
  // กันไว้อีกชั้น เผื่อมีทางเข้าถึงเอกสารที่ไม่ได้ผ่านหน้าจอเลือก
  if (!docAllowed(kind)) return '<div class="hint">เอกสารนี้เป็นสิทธิ์ของครูผู้ดูแล</div>';
  if (kind === 'worksheet' || kind === 'answerkey') {
    const q = DB.quizzes.find(x => x.id === o.quizId);
    if (!q) return '<div class="hint">ยังไม่ได้เลือกชุดโจทย์</div>';
    const probs = problemsOf(q);
    const key = kind === 'answerkey';
    const dens = densityOf(o.density);
    // การตัดหน้าทำทีหลังใน paginatePrint() ซึ่งวัดความสูงจริงของแต่ละข้อ
    // ตรงนี้จึงวางทุกข้อไว้ในกล่องเดียวก่อน
    let h = '<div class="pg">' + docHead(q.title, key ? '<b>เฉลยอย่างละเอียด</b>' : '',
      'จำนวน ' + probs.length + ' ข้อ');
    if (!key) h += nameFields();
    if (key) h += '<div class="t3" style="text-align:center;margin-bottom:10px">' +
      'ชุดนี้สร้างจากเลขสุ่ม (seed) ' + q.seed + ' — สร้างใบงานชุดเดิมซ้ำได้เสมอ</div>';
    probs.forEach((p, i) => {
      if (!p) {
        h += '<div class="pitem"><div class="pq"><span class="pn">' + (i + 1) + '.</span>' +
          '<span>— ข้อนี้ใช้โจทย์จากบทที่โปรแกรมรุ่นนี้ยังไม่มี กรุณาอัปเดตไฟล์ก่อนพิมพ์ —</span></div></div>';
        return;
      }
      h += '<div class="pitem"><div class="pq"><span class="pn">' + (i + 1) + '.</span><span>' +
        p.stem + ' &nbsp;<span class="tag">' + p.level + '</span></span></div>';
      if (p.figure) h += '<div class="fig">' + p.figure + '</div>';
      if (key) {
        if (p.theory) {
          const ci = p.choices.findIndex(c => c.correct);
          h += '<div style="margin:5px 0 3px"><b>คำตอบ:</b> ข้อ ' + 'กขคง'[ci] + '. ' + p.choices[ci].text + '</div>';
        } else {
          h += '<div style="margin:5px 0 3px"><b>คำตอบ:</b> ' +
            p.finds.map(f => M(f.s + ' = ' + ansTxt(f) + (f.unit ? ' `' + f.unit + '`' : ''))).join(' , ') + '</div>';
        }
        h += solutionHTML(p, true);
      } else {
        if (p.choices && p.theory) {
          // ตัวเลือกเป็นข้อความยาว จึงขึ้นบรรทัดใหม่ทีละข้อ และไม่ต้องมีกรอบเขียนวิธีทำ
          h += '<div style="margin:4px 0 0 18px">' + p.choices.map((c, k) =>
            '<div>' + 'ก.ข.ค.ง.'.substr(k * 2, 2) + ' ' + c.text + '</div>').join('') + '</div>';
        } else if (p.choices) {
          h += '<div style="margin:4px 0 0 18px">' + p.choices.map((c, k) =>
            'ก.ข.ค.ง.'.substr(k * 2, 2) + ' ' + M(c.text != null ? c.text : fmt(c.value)) +
            (p.finds[0].unit ? ' ' + p.finds[0].unit : '')
          ).join(' &nbsp;&nbsp; ') + '</div>';
        }
        // ระดับ "แน่น" ตัดหัวข้อของแต่ละขั้นออก เหลือเป็นบรรทัดเปล่า จะได้ลงได้ 3 ข้อต่อหน้า
        if (!p.theory) h += workBox(o.withSteps && dens.caps, dens.ws);
      }
      h += '</div>';
    });
    return h + docCredit() + '</div>';
  }

  if (kind === 'evidence') {
    const a = DB.attempts.find(x => x.id === o.attemptId);
    if (!a || !a.finishedAt) return '<div class="hint">ยังไม่ได้เลือกผลการทำที่เสร็จแล้ว</div>';
    const r = analyze(a);
    const who = attemptWho(a);
    const mine = DB.attempts.filter(x => x.finishedAt &&
      (a.studentId ? x.studentId === a.studentId : (!x.studentId && x.soloName === a.soloName)));
    const all = analyzeMany(mine);
    const wi = whoInfo(a);
    const idBits = [];
    if (wi.cls) idBits.push('ชั้น ' + esc(wi.cls));
    if (wi.no) idBits.push('เลขที่ ' + esc(wi.no));
    if (wi.sid) idBits.push('เลขประจำตัว ' + esc(wi.sid));
    let h = '<div class="pg">' + docHead('หลักฐานการเรียนรู้ รายวิชาคณิตศาสตร์',
      '<b>' + esc(who) + '</b>' + (idBits.length ? ' &nbsp; ' + idBits.join(' &nbsp;·&nbsp; ') : ''),
      'วันที่ทำ ' + thDateTime(a.finishedAt));
    h += '<table style="margin-bottom:10px"><tbody>' +
      '<tr><th style="width:34%">ชุดแบบฝึกหัด</th><td>' + esc(r.quiz.title) + '</td></tr>' +
      '<tr><th>เรื่องที่ประเมิน</th><td>' + r.quiz.topics.map(t => esc(topicName(t))).join(' · ') + '</td></tr>' +
      '<tr><th>จำนวนข้อ</th><td>' + r.n + ' ข้อ (' +
        LEVELS.filter(l => r.byLevel[l]).map(l => l + ' ' + r.byLevel[l].max + ' ข้อ').join(', ') + ')</td></tr>' +
      '<tr><th>คะแนนที่ได้</th><td><b>' + fmt(r.got) + ' จาก ' + r.max + ' คะแนน คิดเป็นร้อยละ ' +
        Math.round(r.pct) + '</b></td></tr>' +
      '<tr><th>ผลการประเมิน</th><td><b>' + (r.pct >= DB.settings.passPct ? 'ผ่านเกณฑ์' : 'ไม่ผ่านเกณฑ์') +
        '</b> (เกณฑ์ร้อยละ ' + DB.settings.passPct + ')</td></tr>' +
      '<tr><th>เวลาที่ใช้</th><td>' + mmss(r.sec) + ' นาที (เฉลี่ยข้อละ ' + mmss(r.n ? r.sec / r.n : 0) + ')</td></tr>' +
      '</tbody></table>';

    h += '<b>ผลแยกตามเรื่องและระดับความยาก</b>' +
      '<table style="margin:5px 0 10px"><thead><tr><th>รายการ</th><th>ได้</th><th>เต็ม</th><th>ร้อยละ</th></tr></thead><tbody>' +
      Object.keys(r.byTopic).map(k => '<tr><td>' + esc(topicName(Number(k))) + '</td><td>' + fmt(r.byTopic[k].got) +
        '</td><td>' + r.byTopic[k].max + '</td><td>' + Math.round(r.byTopic[k].pct) + '</td></tr>').join('') +
      LEVELS.filter(l => r.byLevel[l]).map(l => '<tr><td>ระดับ' + l + '</td><td>' + fmt(r.byLevel[l].got) +
        '</td><td>' + r.byLevel[l].max + '</td><td>' + Math.round(r.byLevel[l].pct) + '</td></tr>').join('') +
      '</tbody></table>';

    const strong = Object.keys(r.bySub).filter(k => r.bySub[k].pct >= 80);
    const weak = Object.keys(r.bySub).filter(k => r.bySub[k].pct < 50);
    const wskill = Object.keys(r.bySkill).filter(k => r.bySkill[k].max >= 2 && r.bySkill[k].pct < 50);
    h += '<b>สรุปจุดแข็งและจุดที่ต้องพัฒนา</b><table style="margin:5px 0 10px"><tbody>' +
      '<tr><th style="width:30%">จุดแข็ง</th><td>' + (strong.length ? strong.map(esc).join(', ') : '—') + '</td></tr>' +
      '<tr><th>จุดที่ต้องพัฒนา</th><td>' + (weak.length ? weak.map(esc).join(', ') : 'ไม่มีหัวข้อที่ต่ำกว่าเกณฑ์') + '</td></tr>' +
      '<tr><th>ทักษะที่ควรทบทวน</th><td>' + (wskill.length ? wskill.map(esc).join(', ') : '—') + '</td></tr>' +
      '</tbody></table>';

    h += '<b>ผลรายข้อ</b><table style="margin:5px 0 10px"><thead><tr><th>ข้อ</th><th>หัวข้อ</th><th>ระดับ</th>' +
      '<th>ผล</th><th>เวลา</th></tr></thead><tbody>' +
      r.items.filter(x => x.p).map(x => '<tr><td>' + (x.i + 1) + '</td><td>' + esc(x.p.sub) + '</td><td>' + x.p.level + '</td>' +
        '<td>' + (x.score >= 1 ? 'ถูก' : x.score > 0 ? 'ถูกบางส่วน' : 'ผิด') + '</td>' +
        '<td>' + mmss(x.it.sec) + '</td></tr>').join('') + '</tbody></table>';

    if (mine.length > 1) {
      h += '<b>สรุปผลสะสมของผู้เรียน</b> (ทำมาแล้ว ' + all.n + ' ครั้ง)' +
        '<table style="margin:5px 0 10px"><thead><tr><th>ครั้งที่</th><th>วันที่</th><th>ชุด</th><th>ร้อยละ</th></tr></thead><tbody>' +
        mine.slice().sort((x, y) => x.finishedAt - y.finishedAt).map((x, k) => {
          const rr = analyze(x);
          return '<tr><td>' + (k + 1) + '</td><td>' + thDate(x.finishedAt) + '</td><td>' +
            esc((quizOf(x) || {}).title || '') + '</td><td>' + Math.round(rr.pct) + '</td></tr>';
        }).join('') +
        '<tr><th>รวมทุกครั้ง</th><td colspan="2"><b>' + fmt(all.got) + ' / ' + all.max + '</b></td><th>' +
        Math.round(all.pct) + '</th></tr></tbody></table>';
    }

    h += '<b>ข้อเสนอแนะ</b><div style="margin:4px 0 0 4px">' +
      advice(r).map(x => '• ' + x.t.replace(/<\/?b>/g, '')).join('<br>') + '</div>';
    h += '<div class="sign"><div><div class="sl"></div>ลงชื่อผู้เรียน</div>' +
      '<div><div class="sl"></div>ลงชื่อครูผู้สอน</div></div>';
    return h + docCredit() + '</div>';
  }

  if (kind === 'classreport') {
    const q = DB.quizzes.find(x => x.id === o.quizId);
    if (!q) return '<div class="hint">ยังไม่ได้เลือกชุดโจทย์</div>';
    const probs = problemsOf(q);
    const byWho = {};
    DB.attempts.filter(a => a.quizId === q.id && a.finishedAt).forEach(a => {
      const key = a.studentId || ('solo:' + (a.soloName || ''));
      if (!byWho[key] || a.finishedAt > byWho[key].finishedAt) byWho[key] = a;
    });
    const rows = Object.values(byWho).map(a => ({ a: a, r: analyze(a) })).sort((x, y) => y.r.pct - x.r.pct);
    if (!rows.length) return '<div class="hint">ยังไม่มีผู้ทำชุดนี้จนจบ</div>';
    const pcts = rows.map(x => x.r.pct);
    const cls = DB.mode === 'class' && DB.cur.classId ? (classById(DB.cur.classId) || {}).name : '';

    let h = '<div class="pg">' + docHead('รายงานผลการทำแบบฝึกหัด', '<b>' + esc(q.title) + '</b>',
      (cls ? 'ชั้น ' + esc(cls) + ' · ' : '') + 'ผู้ทำ ' + rows.length + ' คน · ออกรายงาน ' + thDate(Date.now()));
    h += '<b>สถิติภาพรวม</b><table style="margin:5px 0 10px"><tbody><tr>' +
      '<th>จำนวนผู้ทำ</th><td>' + rows.length + ' คน</td>' +
      '<th>คะแนนเต็ม</th><td>' + q.items.length + ' คะแนน</td></tr><tr>' +
      '<th>ค่าเฉลี่ย</th><td>' + fmt(mean(pcts), 1) + ' %</td>' +
      '<th>มัธยฐาน</th><td>' + fmt(median(pcts), 1) + ' %</td></tr><tr>' +
      '<th>ส่วนเบี่ยงเบนมาตรฐาน</th><td>' + fmt(stdev(pcts), 2) + '</td>' +
      '<th>สูงสุด / ต่ำสุด</th><td>' + fmt(Math.max.apply(null, pcts), 0) + ' % / ' + fmt(Math.min.apply(null, pcts), 0) + ' %</td></tr><tr>' +
      '<th>ผ่านเกณฑ์ (' + DB.settings.passPct + '%)</th><td>' + rows.filter(x => x.r.pct >= DB.settings.passPct).length + ' คน</td>' +
      '<th>ไม่ผ่านเกณฑ์</th><td>' + rows.filter(x => x.r.pct < DB.settings.passPct).length + ' คน</td></tr></tbody></table>';
    h += '<div style="text-align:center;margin:8px 0 12px">' + histogram(pcts) + '</div>';

    // เรียงตามเลขที่ในเอกสารทางการ จะได้เทียบกับ ปพ. ได้ง่าย
    const byNo = rows.slice().sort((x, y) => {
      const a1 = Number(whoInfo(x.a).no) || 999, b1 = Number(whoInfo(y.a).no) || 999;
      return a1 - b1 || String(whoInfo(x.a).name).localeCompare(String(whoInfo(y.a).name), 'th');
    });
    h += '<b>ผลรายคน</b><table style="margin:5px 0 10px"><thead><tr><th>เลขที่</th><th>เลขประจำตัว</th>' +
      '<th>ชื่อ-นามสกุล</th><th>คะแนน</th><th>ร้อยละ</th><th>ผล</th>' +
      '<th>หัวข้อที่ต่ำกว่าเกณฑ์</th></tr></thead><tbody>' +
      byNo.map(x => {
        const weak = Object.keys(x.r.bySub).filter(s => x.r.bySub[s].pct < 50);
        const wi = whoInfo(x.a);
        return '<tr><td>' + esc(wi.no || '—') + '</td><td>' + esc(wi.sid || '—') + '</td>' +
          '<td>' + esc(wi.name) + '</td>' +
          '<td>' + fmt(x.r.got) + '/' + x.r.max + '</td><td>' + Math.round(x.r.pct) + '</td>' +
          '<td>' + (x.r.pct >= DB.settings.passPct ? 'ผ่าน' : 'ไม่ผ่าน') + '</td>' +
          '<td>' + (weak.length ? esc(weak.join(', ')) : '—') + '</td></tr>';
      }).join('') + '</tbody></table>';

    const nG = Math.max(1, Math.round(rows.length * 0.27));
    const hi = rows.slice(0, nG), lo = rows.slice(-nG);
    h += '<b>วิเคราะห์รายข้อ</b> <span style="font-size:9.5pt">(p = ค่าความยาก, r = อำนาจจำแนก)</span>' +
      '<table style="margin:5px 0 10px"><thead><tr><th>ข้อ</th><th>หัวข้อ</th><th>ระดับ</th>' +
      '<th>ตอบถูก</th><th>p</th><th>r</th></tr></thead><tbody>' +
      probs.map((p, i) => {
        if (!p) return '<tr><td>' + (i + 1) + '</td><td colspan="5">— ข้อนี้ใช้โจทย์จากบทที่โปรแกรมรุ่นนี้ยังไม่มี —</td></tr>';
        const sc = rows.map(x => (x.a.answers[i] || {}).score || 0);
        const pv = mean(sc);
        const rv = mean(hi.map(x => (x.a.answers[i] || {}).score || 0)) - mean(lo.map(x => (x.a.answers[i] || {}).score || 0));
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(p.sub) + '</td><td>' + p.level + '</td>' +
          '<td>' + fmt(sc.reduce((s, v) => s + v, 0)) + '/' + rows.length + '</td>' +
          '<td>' + fmt(pv, 2) + '</td><td>' + fmt(rv, 2) + '</td></tr>';
      }).join('') + '</tbody></table>';

    const missed = probs.map((p, i) => ({ p: p, i: i, pv: mean(rows.map(x => (x.a.answers[i] || {}).score || 0)) }))
      .filter(x => x.p && x.pv < 0.5).sort((a, b) => a.pv - b.pv);
    h += '<b>ประเด็นที่ควรสอนซ่อมเสริม</b><div style="margin:4px 0 0 4px">';
    h += missed.length
      ? missed.map(x => '• ข้อ ' + (x.i + 1) + ' ' + esc(x.p.sub) + ' (' + x.p.level + ') — ตอบถูก ' +
          Math.round(x.pv * 100) + '%' + (x.p.skills.length ? ' · ทักษะ ' + esc(x.p.skills.join(', ')) : '')).join('<br>')
      : 'ไม่มีข้อใดที่ทั้งห้องทำได้ต่ำกว่าครึ่ง';
    const need = rows.filter(x => x.r.pct < DB.settings.passPct);
    if (need.length) h += '<br><br>• ผู้เรียนที่ควรได้รับการช่วยเหลือ: ' + need.map(x => esc(attemptWho(x.a))).join(', ');
    h += '</div><div class="sign"><div><div class="sl"></div>ลงชื่อครูผู้สอน</div></div>';
    return h + docCredit() + '</div>';
  }
  return '';
}

function renderPrint() {
  // ผู้เรียนพิมพ์ได้เฉพาะใบงาน ถ้าเผลอค้างอยู่ที่เอกสารอื่นให้ดึงกลับมา
  if (!docAllowed(DB.cur.printKind || 'worksheet')) DB.cur.printKind = 'worksheet';
  const kind = DB.cur.printKind || 'worksheet';
  const doneAt = DB.attempts.filter(a => a.finishedAt).sort((x, y) => y.finishedAt - x.finishedAt);
  if (!DB.cur.printQuizId || !DB.quizzes.some(q => q.id === DB.cur.printQuizId))
    DB.cur.printQuizId = DB.cur.quizId || (DB.quizzes.length ? DB.quizzes[DB.quizzes.length - 1].id : null);
  if (!DB.cur.printAtId || !doneAt.some(a => a.id === DB.cur.printAtId))
    DB.cur.printAtId = DB.cur.showAttemptId || (doneAt.length ? doneAt[0].id : null);
  if (DB.cur.wsSteps == null) DB.cur.wsSteps = true;
  if (!DENSITY.some(d => d.k === DB.cur.printDens)) DB.cur.printDens = 'normal';
  const dens = densityOf(DB.cur.printDens);

  const docs = docsAllowed();
  let h = '<div class="card noprint"><h3>1. เลือกเอกสารที่ต้องการพิมพ์</h3><div class="gridcards">' +
    docs.map(d => '<label class="chk' + (kind === d.k ? ' on' : '') + '">' +
      '<input type="radio" name="dk" value="' + d.k + '"' + (kind === d.k ? ' checked' : '') + '>' +
      '<span><span class="t">' + d.n + '</span><br><span class="d">' + d.d + '</span></span></label>').join('') +
    '</div>' +
    (docs.length < DOCS.length
      ? '<div class="hint" style="margin-top:9px">ผู้เรียนพิมพ์ได้เฉพาะ<b>ใบงาน</b> ' +
        'ส่วนใบเฉลย หลักฐานการเรียนรู้ และรายงานชั้นเรียน เป็นสิทธิ์ของครูผู้ดูแล</div>' : '') +
    '</div>';

  h += '<div class="card noprint"><h3>2. ตั้งค่าเอกสาร</h3>';
  if (kind === 'worksheet' || kind === 'answerkey' || kind === 'classreport') {
    if (!DB.quizzes.length) h += '<div class="notice warn">ยังไม่มีชุดโจทย์ — ไปสร้างที่แท็บ <b>สร้างชุดโจทย์</b> ก่อน</div>';
    else h += '<div class="row"><label for="pQuiz">ชุดโจทย์</label><select id="pQuiz" class="grow" style="max-width:520px">' +
      DB.quizzes.slice().reverse().map(q => '<option value="' + q.id + '"' +
        (q.id === DB.cur.printQuizId ? ' selected' : '') + '>' + esc(q.title) + ' (' + q.items.length + ' ข้อ)</option>').join('') +
      '</select></div>';
  }
  if (kind === 'worksheet' || kind === 'answerkey') {
    h += '<div class="row" style="margin-top:11px"><label>ความหนาแน่น</label>' +
      '<div class="segbtn" style="max-width:300px">' + DENSITY.map(d =>
        '<button data-dens="' + d.k + '"' + (d.k === dens.k ? ' class="on"' : '') + '>' + d.n + '</button>').join('') +

    else h += '<div class="row"><label for="pAt">ผลการทำ</label><select id="pAt" class="grow" style="max-width:560px">' +
      doneAt.map(a => '<option value="' + a.id + '"' + (a.id === DB.cur.printAtId ? ' selected' : '') + '>' +
        esc(attemptWho(a)) + ' · ' + esc((quizOf(a) || {}).title || '') + ' · ' + thDateTime(a.finishedAt) +
        ' · ' + Math.round(analyze(a).pct) + '%</option>').join('') + '</select></div>' +

      '<b>รายงานสถิติชั้นเรียน</b> ซึ่งรวมทุกคนไว้ในเอกสารเดียว</div>';
  }
  if (!DB.settings.header.school && !DB.settings.header.teacher)
    h += '<div class="notice info" style="margin-top:10px">ยังไม่ได้ตั้งหัวกระดาษ (โรงเรียน / ครูผู้สอน / ภาคเรียน) — ' +

/* ============================================================================
   8) ชุดทดสอบตัวเอง — เปิดด้วย physics.html?selftest=1
   วนสร้างทุกแม่แบบหลาย seed แล้วตรวจว่าโจทย์และเฉลยไม่มีอะไรพัง
   ========================================================================== */
function runSelfTest(seeds) {
  const N = seeds || 200, fails = [];
  // ใช้ขอบเขตคำ ไม่งั้นสูตรเคมีอย่าง NaNO3 หรือ NaCl จะถูกฟ้องว่าเป็น NaN
  const bad = s => typeof s === 'string' && /\bundefined\b|\bNaN\b|\bInfinity\b|\{[a-zA-Z_]\w*\}/.test(s);
  TPL.forEach(tpl => {
    for (let s = 1; s <= N; s++) {
      const p = buildProblem(tpl.id, s * 104729, { piMode: DB.settings.piMode });
      if (!p) { fails.push(tpl.id + ' seed=' + s + ': สร้างโจทย์ไม่ได้'); continue; }
      p.finds.forEach((f, k) => {
        const kd = f.kind || 'num';
        if (typeof f.value !== 'number' || !isFinite(f.value)) fails.push(tpl.id + ' seed=' + s + ': คำตอบ[' + k + '] ไม่ใช่ตัวเลข');
        else if (kd === 'frac' && (!f.den || f.den > 24 || reduceFrac(f.num, f.den)[1] !== f.den))
          fails.push(tpl.id + ' seed=' + s + ': คำตอบ[' + k + '] เป็นเศษส่วนที่ยังไม่อย่างต่ำ หรือตัวส่วนเกิน 24 (' + f.num + '/' + f.den + ')');
        else if (kd === 'int' && Math.abs(f.value - Math.round(f.value)) > 1e-9)
          fails.push(tpl.id + ' seed=' + s + ': คำตอบ[' + k + '] ควรเป็นจำนวนเต็ม (' + f.value + ')');
        else if (kd === 'num' && dpOf(f.value, 4) > 2) fails.push(tpl.id + ' seed=' + s + ': คำตอบ[' + k + '] ทศนิยมเกิน 2 (' + f.value + ')');
        else if (f.positive && f.value <= 0) fails.push(tpl.id + ' seed=' + s + ': คำตอบ[' + k + '] ควรเป็นบวก (' + f.value + ')');
      });
      p.given.forEach((g, k) => {
        if (typeof g.v === 'number' && (!isFinite(g.v) || dpOf(g.v, 4) > 2))
          fails.push(tpl.id + ' seed=' + s + ': ค่าที่กำหนดให้[' + k + '] ไม่สวย (' + g.v + ')');
      });
      if (bad(p.stem)) fails.push(tpl.id + ' seed=' + s + ': ข้อความโจทย์ผิดปกติ');
      const b = stepBodies(p);
      if (b.length !== (p.theory ? 3 : 7)) fails.push(tpl.id + ' seed=' + s + ': จำนวนขั้นอธิบายไม่ถูกต้อง');
      b.forEach((x, k) => {
        if (!x || !String(x).trim()) fails.push(tpl.id + ' seed=' + s + ': ขั้นที่ ' + (k + 1) + ' ว่าง');
        if (bad(x)) fails.push(tpl.id + ' seed=' + s + ': ขั้นที่ ' + (k + 1) + ' มีข้อความผิดปกติ');
      });
      if (tpl.level === 'ง่าย' || p.theory) {
        if (!p.choices || p.choices.length !== 4) fails.push(tpl.id + ' seed=' + s + ': ตัวเลือกไม่ครบ 4');
        else {
          if (p.choices.filter(c => c.correct).length !== 1) fails.push(tpl.id + ' seed=' + s + ': ตัวเลือกที่ถูกไม่ใช่ 1 ตัว');
          // ตัวเลือกที่เป็นเศษส่วนมี text มาด้วย ต้องเทียบด้วยข้อความ
          // ถ้าเทียบด้วยทศนิยม 2 ตำแหน่ง เศษส่วนคนละตัวอย่าง 2/13 กับ 3/20 จะถูกนับว่าซ้ำกัน
          const v = p.theory ? p.choices.map(c => c.text)
                            : p.choices.map(c => (c.text != null ? c.text : c.value.toFixed(2)));
          if (new Set(v).size !== 4) fails.push(tpl.id + ' seed=' + s + ': ตัวเลือกซ้ำกัน');
        }
        if (p.theory && (!p.idea || !p.why)) fails.push(tpl.id + ' seed=' + s + ': ขาดคำอธิบายแนวคิดหรือข้อสรุป');
      }
    }
  });
  // ตรวจว่าทุกบทมีแม่แบบครบทุกระดับ — สำคัญมากตอนเพิ่มบทใหม่ จะได้รู้ว่ายังขาดตรงไหน
  TOPICS.forEach(t => LEVELS.forEach(l => {
    const n = TPL.filter(x => x.topic === t.id && x.level === l).length;
    if (!n) fails.push('เรื่อง "' + t.name + '" ยังไม่มีแม่แบบระดับ' + l + ' เลย');
    else if (n < 3) fails.push('เรื่อง "' + t.name + '" ระดับ' + l + ' มีแค่ ' + n +
      ' แม่แบบ (ควรมีอย่างน้อย 3 เพื่อไม่ให้โจทย์ซ้ำเร็วเกินไป)');
  }));
  const orphan = TPL.filter(x => ALL_TOPIC_IDS.indexOf(x.topic) < 0);
  orphan.forEach(x => fails.push('แม่แบบ ' + x.id + ' อ้างเรื่อง id=' + x.topic + ' ที่ไม่มีในสารบัญ TOPICS'));

  const uniq = Array.from(new Set(fails));
  const counts = {};
  TOPICS.forEach(t => LEVELS.forEach(l => {
    counts[t.id + '|' + l] = TPL.filter(x => x.topic === t.id && x.level === l).length;
  }));
  document.body.classList.remove('docpreview');
  $('#printarea').innerHTML = '';
  $('#pane-make').innerHTML =
    '<div class="card"><h3>ผลการทดสอบคลังโจทย์</h3>' +
    '<div class="statgrid"><div class="stat"><div class="v">' + TPL.length + '</div><div class="k">แม่แบบทั้งหมด</div></div>' +
    '<div class="stat"><div class="v">' + (TPL.length * N).toLocaleString() + '</div><div class="k">โจทย์ที่สร้างทดสอบ</div></div>' +
    '<div class="stat"><div class="v" style="color:' + (uniq.length ? 'var(--bad)' : 'var(--ok)') + '">' +
      uniq.length + '</div><div class="k">ข้อผิดพลาด</div></div></div>' +
    '<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>เรื่อง</th>' +
    LEVELS.map(l => '<th class="num">' + l + '</th>').join('') + '<th class="num">รวม</th></tr></thead><tbody>' +
    TOPICS.map(t => '<tr><td>' + esc(t.name) + '</td>' +
      LEVELS.map(l => '<td class="num">' + counts[t.id + '|' + l] + '</td>').join('') +
      '<td class="num"><b>' + LEVELS.reduce((s, l) => s + counts[t.id + '|' + l], 0) + '</b></td></tr>').join('') +
    '</tbody></table></div>' +
    (uniq.length
      ? '<div class="notice bad" style="margin-top:12px"><b>พบข้อผิดพลาด</b><br>' +
        uniq.slice(0, 50).map(esc).join('<br>') + (uniq.length > 50 ? '<br>… อีก ' + (uniq.length - 50) + ' รายการ' : '') + '</div>'
      : '<div class="notice info" style="margin-top:12px">ผ่านทั้งหมด — ทุกแม่แบบสร้างโจทย์ได้ ' +
        'คำตอบอยู่ในรูปที่กำหนดไว้ (จำนวนเต็ม ทศนิยมไม่เกิน 2 ตำแหน่ง หรือเศษส่วนอย่างต่ำ) ' +
        'วิธีทำครบ 7 ขั้น และตัวเลือกปรนัยถูกต้อง</div>') +
    '<div class="row" style="margin-top:12px"><button class="primary" id="stBack">กลับสู่หน้าปกติ</button></div></div>';
  $('#stBack').addEventListener('click', () => { location.href = location.pathname; });
  return uniq;
}

}
