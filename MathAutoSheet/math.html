T({
  id: 'm1n-fracmul', topic: 101, sub: 'เศษส่วน', level: 'ปานกลาง',
  skills: ['คูณหารเศษส่วน', 'ย่อเศษส่วนอย่างต่ำ'],
  gen(R) {
    const f1 = randFrac(R, 2, 9), f2 = randFrac(R, 2, 9);
    const div = R.f() < 0.45;
    const num = div ? f1[0] * f2[1] : f1[0] * f2[0];
    const den = div ? f1[1] * f2[0] : f1[1] * f2[1];
    const r = reduceFrac(num, den);
    if (r[1] === 1 || r[1] > 24 || r[0] === r[1]) return null;
    const op = div ? ' ÷ ' : ' × ';
    return {
      stem: 'จงหาผลลัพธ์ของ ' + FR(f1[0], f1[1]) + M(op) + FR(f2[0], f2[1]) +
        ' โดยตอบเป็น<b>เศษส่วนอย่างต่ำ</b>',
      given: [{ s: 'เศษส่วนที่ 1', v: f1[0] + '/' + f1[1], d: '' },
              { s: 'เศษส่วนที่ 2', v: f2[0] + '/' + f2[1], d: '' }],
      finds: [FF('ผลลัพธ์', num, den, 'ผลลัพธ์ในรูปเศษส่วนอย่างต่ำ')],
      sol: {
        analyze: 'โจทย์ให้' + (div ? 'หาร' : 'คูณ') + 'เศษส่วนสองจำนวน<br>' +
          (div
            ? 'การหารด้วยเศษส่วน ให้เปลี่ยนเป็น<b>คูณด้วยส่วนกลับ</b>ของตัวหารก่อน แล้วจึงคูณตามปกติ'
            : 'การคูณเศษส่วนทำได้ตรง ๆ คือ<b>เศษคูณเศษ ส่วนคูณส่วน</b> ไม่ต้องทำส่วนให้เท่ากัน') + '<br>' +
          '<b>กับดักของข้อนี้:</b> ' + (div
            ? 'กลับเศษส่วนผิดตัว — ต้องกลับ<b>ตัวหาร</b> ไม่ใช่ตัวตั้ง'
            : 'เผลอไปทำส่วนให้เท่ากันเหมือนตอนบวกลบ ซึ่งไม่ต้องทำเลย'),
        eqs: div
          ? [{ eq: 'frac(a,b) ÷ frac(c,d) = frac(a,b) × frac(d,c)', why: 'หารด้วยเศษส่วน = คูณด้วยส่วนกลับ' }]
          : [{ eq: 'frac(a,b) × frac(c,d) = frac(a × c,b × d)', why: 'เศษคูณเศษ ส่วนคูณส่วน' }],
        solve: EQ(div
          ? fracTxt(f1[0], f1[1]) + ' ÷ ' + fracTxt(f2[0], f2[1]) + ' = ' +
            fracTxt(f1[0], f1[1]) + ' × frac(' + f2[1] + ',' + f2[0] + ')'
          : fracTxt(f1[0], f1[1]) + ' × ' + fracTxt(f2[0], f2[1])),
        subst: EQ('= frac(' + (div ? f1[0] + ' × ' + f2[1] : f1[0] + ' × ' + f2[0]) + ',' +
          (div ? f1[1] + ' × ' + f2[0] : f1[1] + ' × ' + f2[1]) + ')'),
        calc: EQ('= frac(' + num + ',' + den + ')',
                 '= ' + fracTxt(num, den) + '   (ย่อด้วย ห.ร.ม. = ' + gcd(num, den) + ')'),
        conclude: 'ดังนั้น <b>ผลลัพธ์เท่ากับ ' + FRL(num, den) + '</b><br>' +
          '<span class="hint">ตรวจด้วยทศนิยม: ' + fmtq(f1[0] / f1[1], 3) + (div ? ' ÷ ' : ' × ') +
          fmtq(f2[0] / f2[1], 3) + ' ≈ ' + fmtq(num / den, 3) + ' ✓</span>'
      }
    };
  }
});

T({
  id: 'm1n-fracword', topic: 101, sub: 'เศษส่วน', level: 'ยาก',
  skills: ['เศษส่วนของจำนวน', 'คิดเป็นขั้นตอนต่อเนื่อง', 'ระบุฐานของเศษส่วนให้ถูก'],
  gen(R) {
    const f1 = randFrac(R, 3, 6), f2 = randFrac(R, 3, 6);
    const a = f1[0], b = f1[1], c = f2[0], d = f2[1];
    const k = R.pick([10, 20, 25, 50, 100]);
    const total = b * d * k;
    if (total > 6000 || total < 200) return null;
    const spend1 = total * a / b;
    const rem1 = total - spend1;
    const spend2 = rem1 * c / d;
    const left = rem1 - spend2;
    if (!ok2(spend1, rem1, spend2, left) || left <= 0) return null;
    const nm = R.pick(NAMES);
    return {
      stem: esc(nm) + 'มีเงินเก็บ ' + U(total, 'บาท') + ' นำไปซื้อหนังสือเป็นเงิน ' + FR(a, b) +
        ' ของเงินเก็บทั้งหมด<br>จากนั้นนำเงิน<b>ที่เหลือ</b>ไปบริจาคอีก ' + FR(c, d) +
        ' ของเงินที่เหลือ<br>จงหาว่า<b>บริจาคไปกี่บาท</b> และ<b>เหลือเงินกี่บาท</b>',
      given: [{ s: 'เงินเก็บ', v: total, unit: 'บาท', d: 'เงินตั้งต้นทั้งหมด' },

TQ({

  skills: ['แปลประโยคเป็นสมการ', 'ตีความคำว่ามากกว่า-น้อยกว่า'],
  gen(R) {
    const k = R.int(3, 9), b = R.int(4, 20), more = R.f() < 0.5;

    const right = more ? k + 'x - ' + b + ' = ' + c : b + ' - ' + k + 'x = ' + c;
    const flip = more ? k + 'x + ' + b + ' = ' + c : k + 'x - ' + b + ' = ' + c;
    return {
      stem: 'ประโยค “' + k + ' เท่าของจำนวนหนึ่ง <b>' + word + '</b> ' + b + ' อยู่ ' + c +
        '” เขียนเป็นสมการได้ตรงกับข้อใด',
      choices: [
        C(M(right), more
          ? '“' + k + ' เท่าของจำนวนหนึ่งมากกว่า ' + b + ' อยู่ ' + c + '” แปลว่า ' +
            M(k + 'x') + ' ลบด้วย ' + b + ' เหลือ ' + c
          : '“' + k + ' เท่าของจำนวนหนึ่งน้อยกว่า ' + b + ' อยู่ ' + c + '” แปลว่า ' + b +
            ' ลบด้วย ' + M(k + 'x') + ' เหลือ ' + c),
        X(M(flip), 'สลับเครื่องหมายหรือสลับตัวตั้งกับตัวลบ ทำให้ความหมายกลับด้านไปเลย'),
        X(M(k + '(x ' + (more ? '-' : '+') + ' ' + b + ') = ' + c),
          'ใส่วงเล็บผิดตำแหน่ง ทำให้ ' + k + ' ไปคูณกับ ' + b + ' ด้วย ทั้งที่โจทย์บอกว่า ' + k +
          ' เท่าของ<b>จำนวนนั้น</b>เท่านั้น'),
        X(M('x ' + (more ? '-' : '+') + ' ' + b + ' = ' + k + ' × ' + c),
          'ลืมคูณ ' + k + ' กับจำนวนที่ต้องหา แล้วเอาไปคูณกับผลลัพธ์แทน')

        '• “A มากกว่า B อยู่ C” → ' + M('A - B = C') + '<br>' +
        '• “A น้อยกว่า B อยู่ C” → ' + M('B - A = C'),
      why: '<b>จุดพลาดที่พบบ่อยที่สุด:</b> สลับตัวตั้งกับตัวลบเมื่อเจอคำว่า “น้อยกว่า” ' +
        'ให้จำว่า<b>ตัวที่มากกว่าอยู่หน้าเครื่องหมายลบเสมอ</b>'
    };
  }
});

T({
  id: 'm1e-solve1', topic: 102, sub: 'การแก้สมการ', level: 'ง่าย',
  skills: ['แก้สมการขั้นเดียว', 'ย้ายข้างเปลี่ยนเครื่องหมาย'],
  gen(R) {
    const a = R.int(2, 9), x = R.int(-12, 12), b = R.int(-20, 20);

    const c = a * x + b;
    const sgn = b < 0 ? ' - ' + (-b) : ' + ' + b;
    return {
      stem: 'จงแก้สมการ ' + M(a + 'x' + sgn + ' = ' + c) + ' เพื่อหาค่าของ ' + M('x'),
      given: [{ s: 'สมการ', v: a + 'x' + sgn + ' = ' + c, d: 'สมการที่ต้องแก้' }],
      finds: [{ s: 'x', d: 'คำตอบของสมการ', value: x, kind: 'int' }],
      distract: [r2((c + b) / a), c - b, r2((c - b) * a), -x],
      sol: {
        analyze: 'สมการนี้มีตัวแปรอยู่ข้างเดียว จึงแก้ได้ด้วยการ<b>ปอกทีละชั้น</b><br>' +
          'ข้าง ' + M('x') + ' มีสองสิ่งติดอยู่ คือ ' + M(String(b)) + ' ที่บวกลบอยู่ และ ' + M(String(a)) +
          ' ที่คูณอยู่ ต้องกำจัดตัวที่<b>บวกลบก่อน</b> แล้วค่อยกำจัดตัวที่คูณ<br>' +
          '<b>กับดักของข้อนี้:</b> หารด้วย ' + a + ' ตั้งแต่ยังไม่ย้าย ' + Math.abs(b) + ' ออก',
        eqs: [{ eq: 'สมบัติการเท่ากัน: ทำอะไรกับข้างหนึ่ง ต้องทำกับอีกข้างเสมอ',
                why: 'เป็นเหตุผลเบื้องหลังการ "ย้ายข้างแล้วเปลี่ยนเครื่องหมาย"' },
              { eq: 'ax + b = c  ⇒  x = frac(c - b,a)', why: 'ย้ายค่าคงที่ก่อน แล้วจึงหารด้วยสัมประสิทธิ์' }],
        solve: EQ(a + 'x' + sgn + ' = ' + c, a + 'x = ' + c + (b < 0 ? ' - ' + (-b) : ' - ' + b),
                  'x = frac(' + (c - b) + ',' + a + ')'),
        subst: SEQ('x = frac({p},{a})', { p: c - b, a: a }),
        calc: EQ('x = ' + x),
        conclude: 'ดังนั้น <b>' + M('x = ' + x) + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: แทนกลับเข้าสมการเดิมได้ ' +
          M(a + '(' + x + ')' + sgn + ' = ' + (a * x) + (b < 0 ? ' - ' + (-b) : ' + ' + b) + ' = ' + c) +
          ' ✓ ตรงกับข้างขวาพอดี</span>'
      }
    };
  }
});

T({
  id: 'm1e-solve2', topic: 102, sub: 'การแก้สมการ', level: 'ง่าย',
  skills: ['แก้สมการที่มีการหาร', 'ลำดับการกำจัดพจน์'],
  gen(R) {
    const a = R.int(2, 8), x = R.int(-9, 12) * a, b = R.int(-15, 15);
    if (!x || !b) return null;
    const insideBracket = R.f() < 0.5;
    const sgn = b < 0 ? ' - ' + (-b) : ' + ' + b;
    // แบบ 1: frac(x,a) + b = c        แบบ 2: frac(x + b,a) = c
    const c = insideBracket ? (x + b) / a : x / a + b;
    if (!Number.isInteger(c) || !c) return null;
    const eq = insideBracket ? 'frac(x' + sgn + ',' + a + ') = ' + c : 'frac(x,' + a + ')' + sgn + ' = ' + c;
    return {
      stem: 'จงแก้สมการ ' + M(eq) + ' เพื่อหาค่าของ ' + M('x'),
      given: [{ s: 'สมการ', v: insideBracket ? '(x' + sgn + ')/' + a + ' = ' + c : 'x/' + a + sgn + ' = ' + c,
                d: 'สมการที่ต้องแก้' }],
      finds: [{ s: 'x', d: 'คำตอบของสมการ', value: x, kind: 'int' }],
      distract: [insideBracket ? a * c + b : (c + b) * a, c - b, r2(c / a - b), -x],
      sol: {
        analyze: 'สมการนี้มี ' + M('x') + ' ถูก<b>หาร</b>อยู่ จึงต้องคูณเพื่อกำจัดตัวหารออก<br>' +
          (insideBracket
            ? 'ข้อนี้ ' + M('x' + sgn) + ' อยู่<b>ทั้งก้อน</b>บนตัวเศษ จึงต้องคูณ ' + a +
              ' ทั้งสองข้างก่อน แล้วค่อยย้าย ' + Math.abs(b)
            : 'ข้อนี้มีเฉพาะ ' + M('x') + ' ที่ถูกหาร ส่วน ' + Math.abs(b) +
              ' อยู่นอกเศษส่วน จึงต้องย้าย ' + Math.abs(b) + ' ออกก่อน แล้วค่อยคูณ ' + a) + '<br>' +
          '<b>กับดักของข้อนี้:</b> ทำสลับลำดับ จะได้คนละคำตอบทันที',
        eqs: [{ eq: 'คูณทั้งสองข้างด้วยตัวส่วน เพื่อกำจัดเศษส่วนออกจากสมการ',
                why: 'สมการที่ไม่มีเศษส่วนแก้ง่ายกว่ามาก' },
              { eq: insideBracket ? 'frac(x + b,a) = c  ⇒  x + b = a c' : 'frac(x,a) + b = c  ⇒  frac(x,a) = c - b',
                why: insideBracket ? 'ทั้งก้อนบนเศษถูกคูณด้วย a พร้อมกัน' : 'กำจัดพจน์ที่บวกลบก่อนเสมอ' }],
        solve: insideBracket
          ? EQ('x' + sgn + ' = ' + a + ' × ' + c, 'x = ' + (a * c) + (b < 0 ? ' + ' + (-b) : ' - ' + b))
          : EQ('frac(x,' + a + ') = ' + c + (b < 0 ? ' + ' + (-b) : ' - ' + b),
               'frac(x,' + a + ') = ' + (c - b), 'x = ' + a + ' × ' + (c - b)),
        subst: insideBracket ? SEQ('x = {p} - {b}', { p: a * c, b: b }) : SEQ('x = {a} × {q}', { a: a, q: c - b }),
        calc: EQ('x = ' + x),
        conclude: 'ดังนั้น <b>' + M('x = ' + x) + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: แทน ' + M('x = ' + x) + ' กลับเข้าสมการเดิม ได้ข้างซ้ายเท่ากับ ' +
          M(String(c)) + ' ✓</span>'
      }
    };
  }
});

T({

      finds: [{ s: 'x', d: 'คำตอบของสมการ', value: x, kind: 'int' }],
      distract: [r2((d + b) / (a - cc)), r2((d - b) / (a + cc)), -x, d - b],
      sol: {
        analyze: 'สมการนี้มี ' + M('x') + ' อยู่<b>ทั้งสองข้าง</b> จึงยังหาค่าไม่ได้ทันที<br>' +
          'ต้องจัดใหม่ให้ <b>ตัวแปรรวมอยู่ข้างเดียว</b> และ <b>ตัวเลขรวมอยู่อีกข้าง</b> ก่อน<br>' +
          '<b>กับดักของข้อนี้:</b> ย้าย ' + M(cc + 'x') + ' ข้ามไปโดยไม่เปลี่ยนเครื่องหมาย ทำให้ได้สัมประสิทธิ์ผิด',
        eqs: [{ eq: 'ax + b = cx + d  ⇒  ax - cx = d - b', why: 'ย้ายตัวแปรไปข้างหนึ่ง ตัวเลขไปอีกข้าง เปลี่ยนเครื่องหมายทั้งคู่' },
              { eq: '(a - c)x = d - b  ⇒  x = frac(d - b,a - c)', why: 'ดึงตัวแปรร่วมออกมา แล้วหารด้วยสัมประสิทธิ์' }],
        solve: EQ(a + 'x - ' + cc + 'x = ' + d + (b < 0 ? ' + ' + (-b) : ' - ' + b),
                  (a - cc) + 'x = ' + (d - b), 'x = frac(' + (d - b) + ',' + (a - cc) + ')'),
        subst: SEQ('x = frac({p},{q})', { p: d - b, q: a - cc }),
        calc: EQ('x = ' + x),
        conclude: 'ดังนั้น <b>' + M('x = ' + x) + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ข้างซ้าย = ' + M(String(a * x + b)) + ' และข้างขวา = ' +
          M(String(cc * x + d)) + ' ✓ เท่ากันพอดี</span>'
      }
    };
  }
});

T({
  id: 'm1e-bracket', topic: 102, sub: 'การแก้สมการ', level: 'ปานกลาง',
  skills: ['กระจายวงเล็บ', 'รวมพจน์ที่คล้ายกัน', 'จัดการเครื่องหมายลบหน้าวงเล็บ'],
  gen(R) {
    const a = R.int(2, 8), cc = R.int(2, 8);
    if (a === cc) return null;
    const b = R.int(1, 12), dd = R.int(1, 12), x = R.int(-8, 10);
    if (!x) return null;
    const e = a * (x + b) - cc * (x - dd);
    if (Math.abs(e) > 300) return null;
    return {
      stem: 'จงแก้สมการ ' + M(a + '(x + ' + b + ') - ' + cc + '(x - ' + dd + ') = ' + e) +
        ' เพื่อหาค่าของ ' + M('x'),
      given: [{ s: 'สมการ', v: a + '(x + ' + b + ') - ' + cc + '(x - ' + dd + ') = ' + e, d: 'สมการที่ต้องแก้' }],
      finds: [{ s: 'x', d: 'คำตอบของสมการ', value: x, kind: 'int' }],
      sol: {
        analyze: 'สมการนี้มีวงเล็บสองก้อน และก้อนหลังมี<b>เครื่องหมายลบนำหน้า</b><br>' +
          'ต้องกระจายวงเล็บให้หมดก่อน แล้วจึงรวมพจน์ที่คล้ายกัน<br>' +
          '<b>กับดักของข้อนี้:</b> กระจาย ' + M('-' + cc + '(x - ' + dd + ')') + ' แล้วได้ ' +
          M('-' + cc + 'x - ' + (cc * dd)) + ' ซึ่งผิด เพราะลบคูณลบต้องได้บวก คำตอบที่ถูกคือ ' +
          M('-' + cc + 'x + ' + (cc * dd)),
        eqs: [{ eq: 'a(x + b) = a x + a b', why: 'สมบัติการแจกแจง — ตัวหน้าวงเล็บคูณเข้าไปทุกพจน์' },

T({
  id: 'm1e-fraceq', topic: 102, sub: 'การแก้สมการ', level: 'ปานกลาง',
  skills: ['กำจัดเศษส่วนในสมการ', 'ใช้ ค.ร.น. ของตัวส่วน'],
  gen(R) {
    const a = R.pick([2, 3, 4, 5, 6]), b = R.pick([2, 3, 4, 6, 8, 10, 12]);
    if (a === b) return null;
    const L = a * b / gcd(a, b);
    const k = R.int(1, 9);
    const x = L * k;
    if (x > 240) return null;
    const c = x / a + x / b;
    if (!Number.isInteger(c) || c > 400) return null;
    return {
      stem: 'จงแก้สมการ ' + M('frac(x,' + a + ') + frac(x,' + b + ') = ' + c) + ' เพื่อหาค่าของ ' + M('x'),
      given: [{ s: 'สมการ', v: 'x/' + a + ' + x/' + b + ' = ' + c, d: 'สมการที่มีเศษส่วน' }],
      finds: [{ s: 'x', d: 'คำตอบของสมการ', value: x, positive: true, kind: 'int' }],
      sol: {
        analyze: 'สมการนี้มีเศษส่วนสองตัวที่ตัวส่วนไม่เท่ากัน<br>' +
          'วิธีที่เร็วที่สุดคือ<b>คูณทั้งสมการด้วย ค.ร.น. ของตัวส่วน</b> เพื่อกำจัดเศษส่วนออกให้หมดในครั้งเดียว<br>' +
          '<b>กับดักของข้อนี้:</b> คูณเฉพาะพจน์ที่เป็นเศษส่วน แต่ลืมคูณ ' + M(String(c)) + ' ที่อยู่ข้างขวาด้วย',
        eqs: [{ eq: 'ค.ร.น. ของ ' + a + ' กับ ' + b + ' คือ ' + L,
                why: 'ตัวคูณร่วมที่เล็กที่สุดที่ทำให้ทั้งสองเศษส่วนกลายเป็นจำนวนเต็ม' },
              { eq: 'คูณ<b>ทุกพจน์</b>ของสมการด้วย ' + L,
                why: 'ถ้าคูณไม่ครบทุกพจน์ สมการจะไม่สมดุลและได้คำตอบผิด' }],
        solve: EQ('frac(x,' + a + ') + frac(x,' + b + ') = ' + c,
                  L + ' × frac(x,' + a + ') + ' + L + ' × frac(x,' + b + ') = ' + L + ' × ' + c,
                  (L / a) + 'x + ' + (L / b) + 'x = ' + (L * c)),
        subst: SEQ('{s}x = {t}', { s: L / a + L / b, t: L * c }),
        calc: EQ('x = frac(' + (L * c) + ',' + (L / a + L / b) + ')', 'x = ' + x),
        conclude: 'ดังนั้น <b>' + M('x = ' + x) + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ' + M('frac(' + x + ',' + a + ') = ' + (x / a)) + ' และ ' +
          M('frac(' + x + ',' + b + ') = ' + (x / b)) + ' · รวมกันได้ ' + M(String(c)) + ' ✓</span>'
      }
    };
  }
});

    const unit = it === 'เงินเก็บ' ? 'บาท' : (it === 'ผลผลิตข้าวทั้งหมด' ? 'กิโลกรัม' : 'หน่วย');
    return {
      stem: esc(it) + 'มี ' + U(A, unit) + ' จงหาว่า <b>' + p + '% ของจำนวนนี้</b> เท่ากับเท่าไร',
      given: [{ s: 'จำนวนทั้งหมด', v: A, unit: unit, d: 'ฐานที่ใช้คิดร้อยละ' },

      sol: {
        analyze: 'คำว่า “ร้อยละ ' + p + '” แปลว่า “' + p + ' ส่วนจากทั้งหมด 100 ส่วน”<br>' +
          'และคำว่า <b>“ของ”</b> ในภาษาไทยแปลเป็นเครื่องหมาย<b>คูณ</b>เสมอ<br>' +
          '<b>กับดักของข้อนี้:</b> คูณ ' + p + ' เข้าไปแล้วลืมหารด้วย 100 จะได้ค่ามากเกินจริงถึง 100 เท่า',
        eqs: [{ eq: 'p% ของ A = frac(p,100) × A', why: 'เปลี่ยนร้อยละเป็นเศษส่วนส่วน 100 ก่อนเสมอ' }],
        solve: EQ('ผลลัพธ์ = frac(' + p + ',100) × ' + A),
        subst: SEQ('ผลลัพธ์ = frac({p} × {A},100)', { p: p, A: A }),
        calc: EQ('ผลลัพธ์ = frac(' + (A * p) + ',100)', 'ผลลัพธ์ = ' + fmtq(v) + ' ' + unit),
        conclude: 'ดังนั้น <b>' + p + '% ของ ' + U(A, unit) + ' เท่ากับ ' + U(v, unit) + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: ' + p + '% ' + (p < 50 ? 'น้อยกว่า' : 'มากกว่า') +
          'ครึ่งหนึ่ง คำตอบจึงควร' + (p < 50 ? 'น้อยกว่า' : 'มากกว่า') + ' ' + fmtq(A / 2) + ' ✓</span>'
      }
    };
  }
});

T({

              { eq: 'ราคาที่จ่ายจริง = ราคาป้าย × frac(100 - r,100)', why: 'จ่ายเท่ากับส่วนที่เหลือหลังหักส่วนลด' }],
        solve: EQ('ราคาที่จ่ายจริง = ' + P + ' × frac(' + (100 - r) + ',100)'),
        subst: SEQ('ราคาที่จ่ายจริง = frac({P} × {q},100)', { P: P, q: 100 - r }),
        calc: EQ('ส่วนลด = ' + fmtq(cut) + ' บาท', 'ราคาที่จ่ายจริง = ' + fmtq(pay) + ' บาท'),
        conclude: 'ดังนั้น <b>ต้องจ่ายเงินจริง ' + U(pay, 'บาท') + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ' + fmtq(pay) + ' + ' + fmtq(cut) + ' = ' + fmtq(P) +

      }
    };
  }
});

        calc: EQ('ระยะจริง = frac(' + realCm + ',100)', 'ระยะจริง = ' + fmtq(realM) + ' เมตร'),

T({

      stem: 'แบ่งเงิน ' + U(T, 'บาท') + ' ให้' + esc(nm[0]) + ' ' + esc(nm[1]) + ' และ' + esc(nm[2]) +

        'จงหาว่า<b>หนึ่งส่วนเท่ากับกี่บาท</b> และ<b>คนที่ได้มากที่สุดได้กี่บาท</b>',

      finds: [{ s: 'หนึ่งส่วน', unit: 'บาท', d: 'มูลค่าของหนึ่งส่วน', value: unit, positive: true, kind: 'int' },
              { s: 'ส่วนที่มากที่สุด', unit: 'บาท', d: 'เงินของคนที่ได้มากที่สุด', value: mx * unit, positive: true, kind: 'int' }],
      sol: {
        analyze: 'อัตราส่วน ' + M(p.join(' : ')) + ' หมายความว่าเงินถูกแบ่งออกเป็น<b>ส่วนเท่า ๆ กัน</b> ' +
          'รวม ' + M(p.join(' + ') + ' = ' + (p[0] + p[1] + p[2])) + ' ส่วน<br>' +
          'กุญแจของโจทย์แบบนี้คือหา<b>ค่าของหนึ่งส่วน</b>ให้ได้ก่อน แล้วทุกอย่างจะตามมาเอง<br>' +
          '<b>กับดักของข้อนี้:</b> เอาเงินทั้งหมดหารด้วย 3 (จำนวนคน) แทนที่จะหารด้วยจำนวนส่วนทั้งหมด',
        eqs: [{ eq: 'จำนวนส่วนทั้งหมด = ' + p.join(' + ') + ' = ' + (p[0] + p[1] + p[2]),
                why: 'ต้องรู้ว่าเงินถูกแบ่งเป็นกี่ส่วนก่อน' },
              { eq: 'หนึ่งส่วน = frac(เงินทั้งหมด,จำนวนส่วนทั้งหมด)',
                why: 'ทุกส่วนมีค่าเท่ากัน จึงหารได้ตรง ๆ' }],
        solve: EQ('หนึ่งส่วน = frac(' + T + ',' + (p[0] + p[1] + p[2]) + ')'),
        subst: SEQ('หนึ่งส่วน = frac({T},{n})', { T: T, n: p[0] + p[1] + p[2] }),
        calc: EQ('หนึ่งส่วน = ' + unit + ' บาท',
                 'ส่วนที่มากที่สุด = ' + mx + ' × ' + unit + ' = ' + (mx * unit) + ' บาท',
                 'ส่วนที่น้อยที่สุด = ' + mn + ' × ' + unit + ' = ' + (mn * unit) + ' บาท'),
        conclude: 'ดังนั้น <b>หนึ่งส่วนเท่ากับ ' + U(unit, 'บาท') + ' และคนที่ได้มากที่สุดได้ ' +
          U(mx * unit, 'บาท') + '</b><br>' +
          '<span class="hint">ตรวจยอดรวม: ' + p.map(x => x * unit).join(' + ') + ' = ' + T +
          ' ✓ ตรงกับเงินที่นำมาแบ่ง</span>'
      }
    };
  }
});

T({
  id: 'm1r-prop2', topic: 103, sub: 'สัดส่วน', level: 'ปานกลาง',
  skills: ['ตั้งสัดส่วนจากโจทย์ปัญหา', 'ใช้สัดส่วนย้อนกลับ'],
  gen(R) {
    const a = R.int(2, 8), b = R.int(2, 8);

    const k1 = R.int(3, 12), k2 = R.int(3, 12);

    const S = b * k2, F = a * k2;
    if (A > 90 || S > 90) return null;
    return {
      stem: 'สูตรขนมชนิดหนึ่งใช้<b>แป้ง ' + a + ' ถ้วยต่อน้ำตาล ' + b + ' ถ้วย</b> เสมอ<br>' +
        '1) ถ้าใช้แป้ง ' + U(A, 'ถ้วย') + ' ต้องใช้<b>น้ำตาลกี่ถ้วย</b><br>' +
        '2) ถ้ามีน้ำตาลอยู่ ' + U(S, 'ถ้วย') + ' จะใช้<b>แป้งได้กี่ถ้วย</b>',
      given: [{ s: 'อัตราส่วนตามสูตร', v: a + ' : ' + b, d: 'แป้ง : น้ำตาล' },
              { s: 'แป้งที่ใช้ (ข้อ 1)', v: A, unit: 'ถ้วย', d: '' },
              { s: 'น้ำตาลที่มี (ข้อ 2)', v: S, unit: 'ถ้วย', d: '' }],
      finds: [{ s: 'น้ำตาล', unit: 'ถ้วย', d: 'น้ำตาลที่ต้องใช้ในข้อ 1', value: B, positive: true, kind: 'int' },
              { s: 'แป้ง', unit: 'ถ้วย', d: 'แป้งที่ใช้ได้ในข้อ 2', value: F, positive: true, kind: 'int' }],
      sol: {
        analyze: 'สูตรอาหารคือ<b>อัตราส่วนที่คงที่</b> ไม่ว่าจะทำมากหรือน้อย อัตราส่วนต้องเท่าเดิมเสมอ<br>' +
          'จึงตั้งสัดส่วนได้ทั้งสองข้อ โดยระวังให้<b>วางแป้งไว้ตำแหน่งเดียวกันทั้งสองอัตราส่วน</b><br>' +
          '<b>กับดักของข้อนี้:</b> ข้อ 2 โจทย์ให้<b>น้ำตาล</b>มา แต่หลายคนเผลอวางเลขไว้ตำแหน่งของแป้ง ' +
          'ทำให้ได้คำตอบกลับด้าน',
        eqs: [{ eq: 'frac(แป้ง,น้ำตาล) = frac(' + a + ',' + b + ')', why: 'อัตราส่วนตามสูตร คงที่เสมอ' },
              { eq: 'คูณไขว้แล้วแก้หาพจน์ที่ไม่รู้ค่า', why: 'ทำได้ทั้งสองทิศทาง ไม่ว่าจะรู้แป้งหรือรู้น้ำตาล' }],
        solve: EQ('ข้อ 1:  frac(' + A + ',x) = frac(' + a + ',' + b + ')  ⇒  x = frac(' + b + ' × ' + A + ',' + a + ')',
                  'ข้อ 2:  frac(y,' + S + ') = frac(' + a + ',' + b + ')  ⇒  y = frac(' + a + ' × ' + S + ',' + b + ')'),
        subst: SEQ('x = frac({p},{a})', { p: b * A, a: a }) + SEQ('y = frac({q},{b})', { q: a * S, b: b }),
        calc: EQ('x = ' + B + ' ถ้วย  (น้ำตาล)', 'y = ' + F + ' ถ้วย  (แป้ง)'),
        conclude: 'ดังนั้น <b>ข้อ 1 ใช้น้ำตาล ' + U(B, 'ถ้วย') + ' และข้อ 2 ใช้แป้งได้ ' + U(F, 'ถ้วย') + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ' + M(A + ' : ' + B) + ' ย่อได้ ' + M(a + ' : ' + b) +
          ' ✓ และ ' + M(F + ' : ' + S) + ' ย่อได้ ' + M(a + ' : ' + b) + ' ✓</span>'
      }
    };
  }
});

      sol: {

        eqs: [{ eq: 'ราคาหลังลดครั้งที่ 1 = P × frac(100 - r_1,100)', why: 'จ่ายเท่ากับส่วนที่เหลือหลังลดครั้งแรก' },
              { eq: 'ราคาสุดท้าย = ราคาหลังลดครั้งที่ 1 × frac(100 - r_2,100)',
                why: 'ครั้งที่สองใช้ฐานใหม่ ต้องคำนวณจากราคาที่เหลือเท่านั้น' },
              { eq: 'ร้อยละที่ลดจริง = frac(P - ราคาสุดท้าย,P) × 100', why: 'เทียบส่วนที่ลดไปทั้งหมดกับราคาป้ายเดิม' }],

T({
  id: 'm1g-anglepair', topic: 104, sub: 'มุมและชนิดของมุม', level: 'ง่าย',
  skills: ['มุมประกอบมุมฉากและสองมุมฉาก', 'ลบมุม'],
  gen(R) {
    const right = R.f() < 0.5;
    const base = right ? 90 : 180;
    const a = right ? R.int(15, 75) : R.int(25, 155);
    const ans = base - a;
    if (ans < 10) return null;
    return {
      stem: 'มุมสองมุมรวมกันได้ ' + U(base, '°') + ' (เรียกว่ามุมประกอบ' + (right ? 'มุมฉาก' : 'สองมุมฉาก') +
        ') ถ้ามุมหนึ่งมีขนาด ' + U(a, '°') + ' จงหา<b>ขนาดของอีกมุมหนึ่ง</b>',
      figure: figAngle({ deg: a }),
      given: [{ s: 'ผลรวมของสองมุม', v: base, unit: '°', d: 'มุมประกอบ' + (right ? 'มุมฉาก' : 'สองมุมฉาก') },
              { s: 'มุมที่ทราบ', v: a, unit: '°', d: 'มุมที่โจทย์ให้มา' }],
      finds: [{ s: 'มุมที่ต้องหา', unit: '°', d: 'ขนาดของอีกมุมหนึ่ง', value: ans, positive: true, kind: 'int' }],
      distract: [(right ? 180 : 90) - a < 0 ? a - 90 : (right ? 180 : 90) - a, 360 - a, a, r2(base / 2)],
      sol: {
        analyze: 'โจทย์บอกว่าสองมุมนี้รวมกันได้ ' + U(base, '°') + ' พอดี<br>' +
          'เมื่อรู้มุมหนึ่งแล้ว อีกมุมหนึ่งจึงหาได้ด้วยการ<b>ลบออกจากผลรวม</b><br>' +
          '<b>กับดักของข้อนี้:</b> สับสนระหว่างมุมประกอบมุมฉาก (รวมกันได้ 90°) ' +
          'กับมุมประกอบสองมุมฉาก (รวมกันได้ 180°) ข้อนี้ใช้ ' + U(base, '°'),
        eqs: [{ eq: 'มุมที่ 1 + มุมที่ 2 = ' + base + '°',
                why: 'นิยามของมุมประกอบ' + (right ? 'มุมฉาก' : 'สองมุมฉาก') },
              { eq: 'มุมที่ 2 = ' + base + '° - มุมที่ 1', why: 'ย้ายข้างเพื่อหามุมที่ยังไม่รู้' }],
        solve: EQ('มุมที่ต้องหา = ' + base + '° - ' + a + '°'),
        subst: SEQ('มุมที่ต้องหา = {b}° - {a}°', { b: base, a: a }),
        calc: EQ('มุมที่ต้องหา = ' + ans + '°'),
        conclude: 'ดังนั้น <b>อีกมุมหนึ่งมีขนาด ' + U(ans, '°') + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ' + a + '° + ' + ans + '° = ' + base + '° ✓ · ' +
          'มุมนี้เป็น' + (ans < 90 ? 'มุมแหลม' : ans === 90 ? 'มุมฉาก' : 'มุมป้าน') + '</span>'
      }
    };
  }
});

          'สี่เหลี่ยมผืนผ้าเรียงตารางได้พอดี ' + M(w + ' ช่องต่อแถว × ' + h + ' แถว') + ' จึงคูณกันได้เลย<br>' +

          '<span class="hint">สังเกตหน่วย: ' + M('`ซม.` × `ซม.` = `ตร.ซม.`') +
          ' · ถ้าคำตอบมีหน่วยเป็น ซม. เฉย ๆ แสดงว่าหาความยาวรอบรูปมาแทน</span>'
      }

T({
  id: 'm1g-path', topic: 104, sub: 'ความยาวรอบรูป', level: 'ยาก',
  skills: ['พื้นที่รูปประกอบที่มีขอบล้อมรอบ', 'คิดค่าใช้จ่ายต่อหน่วยพื้นที่'],
  gen(R) {
    const w = R.int(6, 20), l = R.int(8, 26), p = R.int(1, 3);
    const inner = w * l;
    const outer = (w + 2 * p) * (l + 2 * p);
    const path = outer - inner;
    const rate = R.pick([120, 150, 180, 200, 250]);
    const cost = path * rate;
    if (cost > 200000) return null;
    return {
      stem: 'สวนหย่อมรูปสี่เหลี่ยมผืนผ้ากว้าง ' + U(w, 'เมตร') + ' ยาว ' + U(l, 'เมตร') +
        ' มี<b>ทางเดินกว้าง ' + U(p, 'เมตร') + ' ล้อมรอบด้านนอก</b>ของสวน<br>' +
        'จงหา<b>พื้นที่ของทางเดิน</b> และถ้าปูกระเบื้องราคาตารางเมตรละ ' + U(rate, 'บาท') +
        ' จะเสีย<b>ค่ากระเบื้องกี่บาท</b>',
      given: [{ s: 'สวนกว้าง', v: w, unit: 'ม.', d: '' }, { s: 'สวนยาว', v: l, unit: 'ม.', d: '' },
              { s: 'ทางเดินกว้าง', v: p, unit: 'ม.', d: 'ล้อมรอบทุกด้าน' },
              { s: 'ราคากระเบื้อง', v: rate, unit: 'บาท/ตร.ม.', d: '' }],
      finds: [{ s: 'พื้นที่ทางเดิน', unit: 'ตร.ม.', d: 'เฉพาะส่วนทางเดิน', value: path, positive: true, kind: 'int' },
              { s: 'ค่ากระเบื้อง', unit: 'บาท', d: 'ค่าใช้จ่ายทั้งหมด', value: cost, positive: true, kind: 'int' }],
      sol: {
        analyze: 'ทางเดินเป็นกรอบล้อมรอบสวน ไม่ใช่รูปสี่เหลี่ยมเดี่ยว ๆ จึงไม่มีสูตรตรง ๆ<br>' +
          'วิธีที่ปลอดภัยที่สุดคือคิด<b>พื้นที่รูปใหญ่ (สวน + ทางเดิน) ลบด้วยพื้นที่สวน</b><br>' +
          'จุดสำคัญ: ทางเดินอยู่<b>ทั้งสองข้าง</b>ของแต่ละด้าน ' +
          'ด้านกว้างจึงเพิ่มขึ้น ' + M('2 × ' + p + ' = ' + (2 * p)) + ' เมตร ไม่ใช่ ' + p + ' เมตร<br>' +
          '<b>กับดักของข้อนี้:</b> บวก ' + p + ' เข้าไปด้านละครั้งเดียว จะได้พื้นที่ทางเดินน้อยกว่าความจริง',
        eqs: [{ eq: 'ขนาดรูปใหญ่ = (w + 2p) × (l + 2p)', why: 'ทางเดินเพิ่มความยาวทั้งสองฝั่งของแต่ละด้าน' },
              { eq: 'พื้นที่ทางเดิน = พื้นที่รูปใหญ่ - พื้นที่สวน', why: 'สิ่งที่เหลือหลังหักสวนออกคือทางเดินพอดี' },
              { eq: 'ค่ากระเบื้อง = พื้นที่ทางเดิน × ราคาต่อตารางเมตร', why: 'ราคาคิดตามพื้นที่ที่ต้องปูจริง' }],
        solve: EQ('รูปใหญ่ = (' + w + ' + 2×' + p + ') × (' + l + ' + 2×' + p + ')',
                  'พื้นที่ทางเดิน = รูปใหญ่ - (' + w + ' × ' + l + ')'),
        subst: SEQ('รูปใหญ่ = {a} × {b}', { a: w + 2 * p, b: l + 2 * p }),
        calc: EQ('รูปใหญ่ = ' + outer + ' `ตร.ม.`', 'สวน = ' + inner + ' `ตร.ม.`',
                 'ทางเดิน = ' + outer + ' - ' + inner + ' = ' + path + ' `ตร.ม.`',
                 'ค่ากระเบื้อง = ' + path + ' × ' + rate + ' = ' + cost + ' `บาท`'),
        conclude: 'ดังนั้น <b>ทางเดินมีพื้นที่ ' + U(path, 'ตร.ม.') + ' และเสียค่ากระเบื้อง ' +
          U(cost, 'บาท') + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: ทางเดินเป็นกรอบบาง ๆ พื้นที่จึงควรน้อยกว่าสวน (' +
          U(inner, 'ตร.ม.') + ') ' + (path < inner ? '✓' : '— ข้อนี้ทางเดินกว้างพอสมควรจึงใกล้เคียงกัน') +
          '</span>'
      }
    };
  }
});

T({
  id: 'm1g-tank', topic: 104, sub: 'ปริมาตรและพื้นที่ผิว', level: 'ยาก',
  skills: ['ปริมาตรกับการแปลงหน่วยลิตร', 'หาระดับน้ำที่เปลี่ยนไป'],
  gen(R) {
    const w = R.step(20, 60, 10), l = R.step(20, 50, 10), H = R.step(20, 60, 10);
    const frac = R.pick([[1, 2], [3, 4], [2, 5], [3, 5]]);
    const hw = H * frac[0] / frac[1];
    if (!Number.isInteger(hw)) return null;
    const base = w * l;                       // ตร.ซม.
    const Vw = base * hw / 1000;              // ลิตร
    const add = R.pick([2, 3, 4, 5, 6, 8, 10]);
    const rise = add * 1000 / base;           // ซม.
    if (!ok2(Vw, rise) || hw + rise > H) return null;
    return {
      stem: 'ตู้ปลาทรงสี่เหลี่ยมมุมฉาก ฐานกว้าง ' + U(w, 'ซม.') + ' ยาว ' + U(l, 'ซม.') +
        ' สูง ' + U(H, 'ซม.') + ' มีน้ำอยู่ ' + FR(frac[0], frac[1]) + ' ของความสูงตู้<br>' +
        '(กำหนดให้ ' + M('1,000 `ลบ.ซม.` = 1 `ลิตร`') + ')<br>' +
        'จงหา<b>ปริมาตรน้ำเป็นลิตร</b> และถ้าเติมน้ำอีก ' + U(add, 'ลิตร') +
        ' <b>ระดับน้ำจะสูงขึ้นกี่เซนติเมตร</b>',
      figure: figBox3D({ w: w, l: l, h: H, unit: 'ซม.' }),
      given: [{ s: 'ฐานกว้าง', v: w, unit: 'ซม.', d: '' }, { s: 'ฐานยาว', v: l, unit: 'ซม.', d: '' },
              { s: 'ความสูงตู้', v: H, unit: 'ซม.', d: '' },
              { s: 'ระดับน้ำ', v: frac[0] + '/' + frac[1], d: 'ของความสูงตู้ = ' + fmt(hw) + ' ซม.' },
              { s: 'น้ำที่เติม', v: add, unit: 'ลิตร', d: '' }],
      finds: [{ s: 'ปริมาตรน้ำ', unit: 'ลิตร', d: 'น้ำที่มีอยู่เดิม', value: Vw, positive: true },
              { s: 'ระดับที่สูงขึ้น', unit: 'ซม.', d: 'ระดับน้ำเพิ่มขึ้นเท่าไร', value: rise, positive: true }],
      sol: {
        analyze: 'โจทย์นี้มีสามเรื่องพันกัน คือ เศษส่วน ปริมาตร และการแปลงหน่วย<br>' +
          '1) หาระดับน้ำเป็นเซนติเมตรจากเศษส่วนของความสูงตู้<br>' +
          '2) หาปริมาตรน้ำเป็น ลบ.ซม. แล้วแปลงเป็นลิตร<br>' +
          '3) น้ำที่เติมเข้าไปกระจายเต็มฐานเท่าเดิม ระดับที่สูงขึ้นจึงเท่ากับปริมาตรที่เติมหารด้วยพื้นที่ฐาน<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมแปลง ลบ.ซม. เป็นลิตร จะได้ตัวเลขใหญ่กว่าความจริง 1,000 เท่า',
        eqs: [{ eq: 'ระดับน้ำ = frac(' + frac[0] + ',' + frac[1] + ') × ความสูงตู้',
                why: 'เศษส่วนของจำนวน คือเศษส่วนคูณจำนวนนั้น' },
              { eq: 'ปริมาตรน้ำ = พื้นที่ฐาน × ระดับน้ำ', why: 'น้ำในตู้เป็นทรงสี่เหลี่ยมมุมฉากเช่นกัน' },
              { eq: 'ระดับที่สูงขึ้น = frac(ปริมาตรที่เติม,พื้นที่ฐาน)',
                why: 'พื้นที่ฐานไม่เปลี่ยน น้ำที่เติมจึงไปเพิ่มที่ความสูงอย่างเดียว' }],
        solve: EQ('ระดับน้ำ = frac(' + frac[0] + ',' + frac[1] + ') × ' + H + ' = ' + fmtq(hw) + ' `ซม.`',
                  'พื้นที่ฐาน = ' + w + ' × ' + l + ' = ' + base + ' `ตร.ซม.`',

        subst: SEQ('ปริมาตรน้ำ = {a} × {b} `ลบ.ซม.`', { a: base, b: hw }) +
               SEQ('ระดับที่สูงขึ้น = frac({v} × 1000,{a})', { v: add, a: base }),
        calc: EQ('ปริมาตรน้ำ = ' + (base * hw) + ' `ลบ.ซม.` = ' + fmtq(Vw) + ' `ลิตร`',
                 'ระดับที่สูงขึ้น = frac(' + (add * 1000) + ',' + base + ') = ' + fmtq(rise) + ' `ซม.`'),
        conclude: 'ดังนั้น <b>มีน้ำอยู่ ' + U(Vw, 'ลิตร') + ' และเมื่อเติมอีก ' + U(add, 'ลิตร') +
          ' ระดับน้ำจะสูงขึ้น ' + U(rise, 'ซม.') + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: ระดับใหม่ = ' + fmtq(hw) + ' + ' + fmtq(rise) +
          ' = ' + fmtq(hw + rise) + ' ซม. ซึ่งยังไม่เกินความสูงตู้ ' + U(H, 'ซม.') + ' ✓ น้ำจึงไม่ล้น</span>'
      }
    };
  }
});

T({
  id: 'm1s-mean', topic: 105, sub: 'ค่าเฉลี่ยเลขคณิต', level: 'ง่าย',
  skills: ['หาค่าเฉลี่ยเลขคณิต', 'รวมข้อมูลก่อนหาร'],
  gen(R) {
    const n = R.pick([5, 6, 8, 10]);
    const avg = R.int(6, 25);
    const data = [];
    let sum = 0;
    for (let i = 0; i < n - 1; i++) { const v = avg + R.int(-4, 4); data.push(v); sum += v; }
    const last = avg * n - sum;
    if (last < 1 || last > 40) return null;
    data.push(last);
    const all = R.shuffle(data);
    return {
      stem: 'คะแนนสอบย่อยของนักเรียน ' + U(n, 'คน') + ' เป็นดังนี้<br><b>' + all.join(' , ') + '</b><br>' +
        'จงหา<b>ค่าเฉลี่ยเลขคณิต</b>ของคะแนนชุดนี้',
      given: [{ s: 'จำนวนข้อมูล', v: n, unit: 'คน', d: 'จำนวนคะแนนทั้งหมด' },
              { s: 'ผลรวม', v: avg * n, unit: 'คะแนน', d: 'ผลบวกของคะแนนทุกคน' }],
      finds: [{ s: 'ค่าเฉลี่ย', unit: 'คะแนน', d: 'ค่าเฉลี่ยเลขคณิต', value: avg, positive: true, kind: 'int' }],
      distract: [avg * n, r2(avg * n / (n - 1)), Math.max.apply(null, all), Math.min.apply(null, all)],
      sol: {
        analyze: 'ค่าเฉลี่ยเลขคณิตคือ “ถ้าเกลี่ยคะแนนให้ทุกคนเท่ากันหมด แต่ละคนจะได้เท่าไร”<br>' +
          'จึงต้องรวมคะแนนทุกคนก่อน แล้วหารด้วยจำนวนคน<br>' +
          '<b>กับดักของข้อนี้:</b> หารด้วยจำนวนที่ไม่ใช่ ' + n + ' หรือลืมนับข้อมูลบางตัวตอนบวก',
        eqs: [{ eq: 'ค่าเฉลี่ย = frac(ผลรวมของข้อมูลทั้งหมด,จำนวนข้อมูล)',
                why: 'นิยามของค่าเฉลี่ยเลขคณิต' }],
        solve: EQ('ผลรวม = ' + all.join(' + '), 'ค่าเฉลี่ย = frac(ผลรวม,' + n + ')'),
        subst: SEQ('ค่าเฉลี่ย = frac({s},{n})', { s: avg * n, n: n }),
        calc: EQ('ผลรวม = ' + (avg * n), 'ค่าเฉลี่ย = ' + avg + ' `คะแนน`'),
        conclude: 'ดังนั้น <b>ค่าเฉลี่ยเท่ากับ ' + U(avg, 'คะแนน') + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: ค่าเฉลี่ยต้องอยู่ระหว่างคะแนนต่ำสุด (' +
          Math.min.apply(null, all) + ') กับสูงสุด (' + Math.max.apply(null, all) + ') ✓</span>'
      }
    };
  }
});

T({
  id: 'm1s-readbar', topic: 105, sub: 'การอ่านแผนภูมิ', level: 'ง่าย',
  skills: ['อ่านค่าจากแผนภูมิแท่ง', 'หาผลต่างจากกราฟ'],
  gen(R) {
    const step = R.pick([2, 5, 10]);
    const lbl = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัส', 'ศุกร์'];
    const v = lbl.map(() => step * R.int(2, 9));
    const mx = Math.max.apply(null, v), mi = Math.min.apply(null, v);
    if (mx === mi) return null;
    const iM = v.indexOf(mx), im = v.indexOf(mi);
    if (v.filter(x => x === mx).length > 1 || v.filter(x => x === mi).length > 1) return null;

T({

              { eq: 'y = mx + c  ⇒  c = y - mx', why: 'แทนจุดที่รู้ค่าเข้าไป แล้วแก้หา c' }],
        solve: EQ('m = frac(' + y2 + ' - (' + y1 + '),' + x2 + ' - (' + x1 + '))',

T({
  id: 'm1s-meanback', topic: 105, sub: 'ค่าเฉลี่ยเลขคณิต', level: 'ปานกลาง',
  skills: ['ย้อนหาผลรวมจากค่าเฉลี่ย', 'หาข้อมูลที่ขาดหายไป'],
  gen(R) {
    const n = R.pick([5, 6, 7, 8]);
    const avg = R.int(50, 85);
    const known = [];
    let sum = 0;
    for (let i = 0; i < n - 1; i++) { const v = avg + R.int(-12, 12); known.push(v); sum += v; }
    const miss = avg * n - sum;
    if (miss < 20 || miss > 100) return null;
    return {
      stem: 'คะแนนสอบของนักเรียน ' + U(n, 'คน') + ' มี<b>ค่าเฉลี่ยเท่ากับ ' + U(avg, 'คะแนน') + '</b><br>' +
        'ทราบคะแนนของ ' + (n - 1) + ' คนแรกคือ <b>' + known.join(' , ') + '</b><br>' +
        'จงหา<b>ผลรวมของคะแนนทั้งหมด</b> และ<b>คะแนนของคนที่เหลือ</b>',
      given: [{ s: 'จำนวนคน', v: n, unit: 'คน', d: 'จำนวนข้อมูลทั้งหมด' },
              { s: 'ค่าเฉลี่ย', v: avg, unit: 'คะแนน', d: 'ค่าเฉลี่ยของทั้งกลุ่ม' },
              { s: 'ผลรวมที่ทราบ', v: sum, unit: 'คะแนน', d: 'ของ ' + (n - 1) + ' คนแรก' }],
      finds: [{ s: 'ผลรวมทั้งหมด', unit: 'คะแนน', d: 'ผลรวมของทุกคน', value: avg * n, positive: true, kind: 'int' },
              { s: 'คะแนนที่หายไป', unit: 'คะแนน', d: 'คะแนนของคนสุดท้าย', value: miss, positive: true, kind: 'int' }],
      sol: {
        analyze: 'ปกติเราใช้ผลรวมหาค่าเฉลี่ย แต่ข้อนี้<b>ให้ค่าเฉลี่ยมาแล้วย้อนหาผลรวม</b><br>' +
          'เมื่อได้ผลรวมทั้งหมดแล้ว ลบด้วยผลรวมของคนที่รู้คะแนน ก็จะเหลือคะแนนของคนที่หายไปพอดี<br>' +
          '<b>กับดักของข้อนี้:</b> เอาค่าเฉลี่ยไปลบกับคะแนนที่รู้ทีละตัว ซึ่งไม่ได้ตอบคำถาม',
        eqs: [{ eq: 'ผลรวม = ค่าเฉลี่ย × จำนวนข้อมูล',
                why: 'จัดรูปจากนิยามค่าเฉลี่ย — เป็นขั้นที่ปลดล็อกโจทย์ทั้งข้อ' },
              { eq: 'ข้อมูลที่หายไป = ผลรวมทั้งหมด - ผลรวมที่ทราบ',
                why: 'ส่วนที่เหลือจากผลรวมคือค่าที่ยังไม่รู้' }],
        solve: EQ('ผลรวมทั้งหมด = ' + avg + ' × ' + n, 'คะแนนที่หายไป = ผลรวมทั้งหมด - ' + sum),
        subst: SEQ('ผลรวมทั้งหมด = {a} × {n}', { a: avg, n: n }),
        calc: EQ('ผลรวมทั้งหมด = ' + (avg * n) + ' `คะแนน`',
                 'คะแนนที่หายไป = ' + (avg * n) + ' - ' + sum + ' = ' + miss + ' `คะแนน`'),
        conclude: 'ดังนั้น <b>ผลรวมทั้งหมดคือ ' + U(avg * n, 'คะแนน') + ' และคนที่เหลือได้ ' +
          U(miss, 'คะแนน') + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ' + known.join(' + ') + ' + ' + miss + ' = ' + (avg * n) +
          ' และ ' + M('frac(' + (avg * n) + ',' + n + ') = ' + avg) + ' ✓</span>'
      }
    };
  }
});

T({
  id: 'm1s-linear', topic: 105, sub: 'ความสัมพันธ์เชิงเส้น', level: 'ปานกลาง',
  skills: ['สร้างความสัมพันธ์เชิงเส้นจากสถานการณ์', 'ตีความค่าคงที่และความชัน'],

        'แล้วบวก<b>กิโลเมตรละ ' + U(rate, 'บาท') + '</b><br>' +
        '1) ถ้าเดินทาง ' + U(km, 'กิโลเมตร') + ' ต้องจ่าย<b>กี่บาท</b><br>' +
        '2) ถ้ามีเงิน ' + U(budget, 'บาท') + ' จะเดินทางได้<b>ไกลที่สุดกี่กิโลเมตร</b>',
      given: [{ s: 'ค่าแรกเข้า', v: base, unit: 'บาท', d: 'จ่ายครั้งเดียวไม่ว่าไปไกลแค่ไหน' },
              { s: 'อัตราต่อระยะทาง', v: rate, unit: 'บาท/กม.', d: 'ความชันของความสัมพันธ์' },
              { s: 'ระยะทาง (ข้อ 1)', v: km, unit: 'กม.', d: '' },
              { s: 'เงินที่มี (ข้อ 2)', v: budget, unit: 'บาท', d: '' }],
      finds: [{ s: 'ค่าโดยสาร', unit: 'บาท', d: 'ค่าโดยสารในข้อ 1', value: fare, positive: true, kind: 'int' },
              { s: 'ระยะทางไกลสุด', unit: 'กม.', d: 'ระยะทางในข้อ 2', value: maxKm, positive: true, kind: 'int' }],
      sol: {
        analyze: 'สถานการณ์นี้เป็น<b>ความสัมพันธ์เชิงเส้น</b> เพราะค่าโดยสารเพิ่มขึ้นในอัตราคงที่<br>' +
          'ให้ ' + M('y') + ' = ค่าโดยสาร และ ' + M('x') + ' = ระยะทาง จะได้ ' +

          '• ค่าแรกเข้า ' + U(base, 'บาท') + ' คือ<b>ค่าคงที่</b> (จุดตัดแกน ' + M('y') + ')<br>' +
          '• อัตรา ' + U(rate, 'บาท/กม.') + ' คือ<b>ความชัน</b><br>' +
          '<b>กับดักของข้อนี้:</b> ข้อ 2 เอาเงินทั้งหมดหารด้วย ' + rate + ' เลย โดยลืมหักค่าแรกเข้าออกก่อน',
        eqs: [{ eq: 'y = ' + rate + 'x + ' + base, why: 'ค่าโดยสาร = อัตราต่อกิโลเมตร × ระยะทาง + ค่าแรกเข้า' },
              { eq: 'x = frac(y - ' + base + ',' + rate + ')', why: 'จัดรูปย้อนกลับเมื่อรู้เงินแล้วอยากรู้ระยะทาง' }],
        solve: EQ('ข้อ 1:  y = ' + rate + '(' + km + ') + ' + base,
                  'ข้อ 2:  x = frac(' + budget + ' - ' + base + ',' + rate + ')'),
        subst: SEQ('y = {a} + {b}', { a: rate * km, b: base }) +
               SEQ('x = frac({p},{r})', { p: budget - base, r: rate }),
        calc: EQ('y = ' + fare + ' `บาท`', 'x = ' + maxKm + ' `กม.`'),
        conclude: 'ดังนั้น <b>ข้อ 1 จ่าย ' + U(fare, 'บาท') + ' และข้อ 2 เดินทางได้ไกลสุด ' +
          U(maxKm, 'กม.') + '</b><br>' +
          '<span class="hint">ตรวจข้อ 2: ' + rate + ' × ' + maxKm + ' + ' + base + ' = ' + budget +
          ' ✓ ใช้เงินพอดี</span>'
      }
    };
  }

T({
  id: 'm1s-barcalc', topic: 105, sub: 'การอ่านแผนภูมิ', level: 'ปานกลาง',
  skills: ['อ่านค่าจากแผนภูมิแล้วคำนวณต่อ', 'หาค่าเฉลี่ยและร้อยละจากกราฟ'],
  gen(R) {
    const step = R.pick([5, 10]);
    const lbl = ['ป.1', 'ป.2', 'ป.3', 'ป.4'];
    const v = lbl.map(() => step * R.int(2, 8));
    const total = v.reduce((a, b) => a + b, 0);
    const avg = total / v.length;
    const mx = Math.max.apply(null, v);
    if (v.filter(x => x === mx).length > 1) return null;
    const pct = mx / total * 100;
    if (!ok2(avg, pct)) return null;
    return {
      stem: 'แผนภูมิแสดงจำนวนต้นไม้ที่นักเรียนแต่ละชั้นปลูกในกิจกรรมวันสิ่งแวดล้อม<br>' +
        'จงหา<b>ค่าเฉลี่ยของจำนวนต้นไม้ต่อชั้น</b> และชั้นที่ปลูกมากที่สุดปลูกคิดเป็น<b>ร้อยละเท่าไรของทั้งหมด</b>',
      figure: figBar({ labels: lbl, values: v, step: step, unit: 'ต้น' }),
      given: [{ s: 'จำนวนชั้น', v: v.length, unit: 'ชั้น', d: 'จำนวนกลุ่มข้อมูล' },
              { s: 'ผลรวมทั้งหมด', v: total, unit: 'ต้น', d: 'ทุกชั้นรวมกัน' },
              { s: 'มากที่สุด', v: mx, unit: 'ต้น', d: 'ชั้น' + lbl[v.indexOf(mx)] }],
      finds: [{ s: 'ค่าเฉลี่ย', unit: 'ต้น', d: 'เฉลี่ยต่อหนึ่งชั้น', value: avg, positive: true },
              { s: 'ร้อยละ', unit: '%', d: 'ส่วนแบ่งของชั้นที่ปลูกมากที่สุด', value: pct, positive: true }],
      sol: {
        analyze: 'ข้อนี้ต้องอ่านค่าจากกราฟให้ครบทุกแท่งก่อน แล้วจึงคำนวณสองเรื่องที่ต่างกัน<br>' +
          '• <b>ค่าเฉลี่ย</b> ใช้ผลรวมหารด้วย<b>จำนวนชั้น</b> (' + v.length + ' ชั้น)<br>' +
          '• <b>ร้อยละ</b> ใช้ค่าของชั้นนั้นเทียบกับ<b>ผลรวมทั้งหมด</b> (' + total + ' ต้น)<br>' +
          '<b>กับดักของข้อนี้:</b> ใช้ฐานสลับกัน เช่น เอาค่ามากที่สุดหารด้วยจำนวนชั้น ' +
          'หรือเอาผลรวมหารด้วยค่ามากที่สุด',
        eqs: [{ eq: 'ค่าเฉลี่ย = frac(ผลรวม,จำนวนกลุ่ม)', why: 'เกลี่ยจำนวนต้นไม้ให้ทุกชั้นเท่ากัน' },
              { eq: 'ร้อยละ = frac(ส่วนที่สนใจ,ทั้งหมด) × 100', why: 'ฐานคือผลรวมของทุกชั้น' }],
        solve: EQ('ผลรวม = ' + v.join(' + ') + ' = ' + total,
                  'ค่าเฉลี่ย = frac(' + total + ',' + v.length + ')',
                  'ร้อยละ = frac(' + mx + ',' + total + ') × 100'),
        subst: SEQ('ค่าเฉลี่ย = frac({t},{n})', { t: total, n: v.length }) +
               SEQ('ร้อยละ = frac({m} × 100,{t})', { m: mx, t: total }),
        calc: EQ('ค่าเฉลี่ย = ' + fmtq(avg) + ' `ต้น`', 'ร้อยละ = ' + fmtq(pct) + '%'),
        conclude: 'ดังนั้น <b>เฉลี่ยชั้นละ ' + U(avg, 'ต้น') + ' และชั้น' + lbl[v.indexOf(mx)] +
          'ปลูกคิดเป็นร้อยละ ' + fmt(pct) + ' ของทั้งหมด</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: มี 4 ชั้น ถ้าปลูกเท่ากันหมดแต่ละชั้นจะได้ 25% ' +
          'ชั้นที่มากที่สุดจึงต้องได้มากกว่า 25% ✓</span>'
      }
    };
  }
});

T({
  id: 'm1s-meanmix', topic: 105, sub: 'ค่าเฉลี่ยเลขคณิต', level: 'ยาก',
  skills: ['ค่าเฉลี่ยรวมของสองกลุ่ม', 'ถ่วงน้ำหนักตามจำนวนสมาชิก'],
  gen(R) {
    const n1 = R.int(10, 30), n2 = R.int(10, 30);
    if (n1 === n2) return null;
    const a1 = R.int(55, 80), a2 = R.int(55, 80);
    if (a1 === a2) return null;
    const total = n1 * a1 + n2 * a2;
    const avg = total / (n1 + n2);
    if (!ok2(avg)) return null;

T({

  gen(R) {

      finds: [{ s: M('sqrt3(' + inside + ')'), d: 'รากที่สาม', value: ans, kind: 'int' }],
      distract: [-ans, r2(inside / 3), k * k, k + 1],
      sol: {
        analyze: 'ถอดรากที่สามคือหาจำนวนที่<b>คูณตัวเองสามครั้ง</b>แล้วได้ตัวเลขในกรณฑ์<br>' +
          (neg

              'เพราะลบยกกำลังคี่ยังคงเป็นลบ'

          '<b>กับดักของข้อนี้:</b> เอา ' + inside + ' หารสาม จะได้ ' + fmtq(inside / 3) +
          ' ซึ่งไม่ใช่ราก · การถอดรากไม่ใช่การหาร',
        eqs: [{ eq: 'sqrt3(a) = b  ก็ต่อเมื่อ  b^3 = a', why: 'นิยามของรากที่สาม' },
              { eq: 'รากที่สามคงเครื่องหมายเดิมของตัวเลขในกรณฑ์', why: 'ยกกำลังคี่ไม่ทำให้เครื่องหมายหาย' }],
        solve: EQ(k + '^3 = ' + k + ' × ' + k + ' × ' + k + ' = ' + cu),
        subst: EQ('sqrt3(' + inside + ') = sqrt3((' + ans + ')^3)'),
        calc: EQ('sqrt3(' + inside + ') = ' + ans),
        conclude: 'ดังนั้น <b>' + M('sqrt3(' + inside + ') = ' + ans) + '</b><br>' +

          (neg ? ' · เครื่องหมายลบยังอยู่ครบ เพราะยกกำลังสามเป็นกำลังคี่' : '') + '</span>'
      }
    };
  }
});

T({
  id: 'm2r-sqmul', topic: 201, sub: 'รากที่สอง', level: 'ง่าย',
  skills: ['สมบัติ sqrt(a)×sqrt(b) = sqrt(ab)'],
  gen(R) {
    const a = R.pick([2, 3, 5, 6, 8, 12, 18, 20, 27, 32, 50]);
    const b = R.pick([2, 3, 5, 6, 8, 12, 18, 20, 27, 32, 50]);
    const prod = a * b, root = Math.sqrt(prod);
    if (Math.abs(root - Math.round(root)) > 1e-9) return null;
    if (Math.abs(Math.sqrt(a) - Math.round(Math.sqrt(a))) < 1e-9) return null;   // ให้แต่ละตัวถอดเดี่ยวไม่ลงตัว
    const ans = Math.round(root);
    if (ans > 60) return null;
    return {
      stem: 'จงหาค่าของ ' + M('sqrt(' + a + ') × sqrt(' + b + ')'),
      given: [{ s: 'กรณฑ์ที่ 1', v: a, d: '' }, { s: 'กรณฑ์ที่ 2', v: b, d: '' }],
      finds: [{ s: 'ผลคูณ', d: 'ค่าของนิพจน์', value: ans, positive: true, kind: 'int' }],
      distract: [prod, a + b, r2(Math.sqrt(a + b)), ans * 2],
      sol: {
        analyze: 'ทั้ง ' + M('sqrt(' + a + ')') + ' และ ' + M('sqrt(' + b + ')') +
          ' ต่างถอดรากเดี่ยว ๆ ไม่ลงตัว จึงคิดทีละตัวไม่ได้<br>' +
          'แต่<b>ผลคูณของสองราก รวมเข้าไปอยู่ในกรณฑ์เดียวกันได้</b> แล้วค่อยถอดทีเดียว ซึ่งจะลงตัวพอดี<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบ ' + prod + ' โดยลืมถอดรากในขั้นสุดท้าย',
        eqs: [{ eq: 'sqrt(a) × sqrt(b) = sqrt(a × b)',
                why: 'สมบัติของรากที่สอง ใช้ได้เมื่อทั้ง a และ b ไม่เป็นลบ' }],
        solve: EQ('sqrt(' + a + ') × sqrt(' + b + ') = sqrt(' + a + ' × ' + b + ')'),
        subst: EQ('= sqrt(' + prod + ')'),
        calc: EQ('= ' + ans + '   (เพราะ ' + ans + '^2 = ' + prod + ')'),
        conclude: 'ดังนั้น <b>ผลคูณเท่ากับ ' + M(String(ans)) + '</b><br>' +
          '<span class="hint">ตรวจด้วยค่าประมาณ: ' + M('sqrt(' + a + ') ≈ ' + fmtq(Math.sqrt(a), 3)) +
          ' และ ' + M('sqrt(' + b + ') ≈ ' + fmtq(Math.sqrt(b), 3)) + ' · คูณกันได้ประมาณ ' + ans + ' ✓</span>'
      }
    };
  }
});

T({

      sol: {

          'แต่<b>แยกตัวประกอบให้มีกำลังสองสมบูรณ์อยู่ข้างใน</b>แล้วดึงออกมาได้<br>' +
          '<b>กับดักของข้อนี้:</b> ดึงออกมาโดยไม่ถอดราก เช่น ตอบ ' + M(String(k * k)) +
          ' ทั้งที่สิ่งที่ออกมานอกกรณฑ์คือ ' + M('sqrt(' + (k * k) + ') = ' + k),
        eqs: [{ eq: 'sqrt(a × b) = sqrt(a) × sqrt(b)', why: 'แยกกรณฑ์ออกเป็นสองส่วนได้' },

T({

      sol: {
        analyze: 'ตัวเลขในกรณฑ์ตัวเศษใหญ่มาก ถอดรากตรง ๆ ลำบาก<br>' +

T({
  id: 'm2r-mixroot', topic: 201, sub: 'จำนวนตรรกยะและอตรรกยะ', level: 'ยาก',
  skills: ['รวมพจน์ที่มีกรณฑ์เหมือนกัน', 'ทำรากให้อยู่ในรูปอย่างง่ายก่อนรวม'],
  gen(R) {
    const m = R.pick([2, 3, 5, 6, 7]);
    const k1 = R.int(2, 6), k2 = R.int(2, 6);
    if (k1 === k2) return null;
    const n1v = k1 * k1 * m, n2v = k2 * k2 * m;
    if (n1v > 900 || n2v > 900) return null;
    const ans = k1 + k2;
    return {
      stem: 'จงเขียน ' + M('sqrt(' + n1v + ') + sqrt(' + n2v + ')') + ' ให้อยู่ในรูป ' +
        M('k sqrt(' + m + ')') + '<br>จงหาค่าของ ' + M('k'),
      given: [{ s: 'พจน์ที่ 1', v: '√' + n1v, d: '' }, { s: 'พจน์ที่ 2', v: '√' + n2v, d: '' }],
      finds: [{ s: 'k', d: 'สัมประสิทธิ์หน้ากรณฑ์', value: ans, positive: true, kind: 'int' }],
      sol: {
        analyze: 'รากสองตัวนี้<b>บวกกันตรง ๆ ไม่ได้</b> เพราะตัวเลขในกรณฑ์ไม่เท่ากัน<br>' +
          'ต้องทำแต่ละตัวให้อยู่ในรูปอย่างง่ายก่อน ถ้าเหลือกรณฑ์ตัวเดียวกันจึงจะรวมกันได้ ' +
          'เหมือนรวมพจน์ที่คล้ายกันในพหุนาม<br>' +
          '<b>กับดักของข้อนี้:</b> บวกตัวเลขในกรณฑ์เข้าด้วยกันเป็น ' + M('sqrt(' + (n1v + n2v) + ')') +
          ' ซึ่งผิด เพราะ ' + M('sqrt(a) + sqrt(b) ≠ sqrt(a + b)'),
        eqs: [{ eq: 'sqrt(k^2 × m) = k sqrt(m)', why: 'ดึงกำลังสองสมบูรณ์ออกมานอกกรณฑ์' },
              { eq: 'a sqrt(m) + b sqrt(m) = (a + b) sqrt(m)',
                why: 'กรณฑ์เดียวกันถือเป็นพจน์ที่คล้ายกัน รวมสัมประสิทธิ์ได้เลย' }],
        solve: EQ('sqrt(' + n1v + ') = sqrt(' + (k1 * k1) + ' × ' + m + ') = ' + k1 + ' sqrt(' + m + ')',
                  'sqrt(' + n2v + ') = sqrt(' + (k2 * k2) + ' × ' + m + ') = ' + k2 + ' sqrt(' + m + ')'),
        subst: EQ(k1 + ' sqrt(' + m + ') + ' + k2 + ' sqrt(' + m + ')'),
        calc: EQ('= (' + k1 + ' + ' + k2 + ') sqrt(' + m + ')', '= ' + ans + ' sqrt(' + m + ')', 'k = ' + ans),
        conclude: 'ดังนั้น <b>' + M('k = ' + ans) + '</b> นั่นคือ ' +
          M('sqrt(' + n1v + ') + sqrt(' + n2v + ') = ' + ans + ' sqrt(' + m + ')') + '<br>' +
          '<span class="hint">ตรวจด้วยค่าประมาณ: ' + fmtq(Math.sqrt(n1v), 3) + ' + ' + fmtq(Math.sqrt(n2v), 3) +
          ' ≈ ' + fmtq(Math.sqrt(n1v) + Math.sqrt(n2v), 3) + ' และ ' + ans + ' × ' + fmtq(Math.sqrt(m), 3) +
          ' ≈ ' + fmtq(ans * Math.sqrt(m), 3) + ' ✓ · ถ้าบวกในกรณฑ์จะได้ ' +
          fmtq(Math.sqrt(n1v + n2v), 3) + ' ซึ่งไม่ตรง</span>'
      }
    };
  }
});

/* ============ ม.2 บทที่ 2 : พหุนามและเลขยกกำลัง (id 202) ============ */

/** เขียนพหุนามดีกรีสองจากสัมประสิทธิ์ ให้เครื่องหมายอ่านสวย เช่น 2x^2 - 3x + 5 */
function polyTxt(a, b, c) {
  let s = '';
  if (a) s += (a === 1 ? '' : a === -1 ? '-' : a) + 'x^2';
  if (b) s += (s ? (b > 0 ? ' + ' : ' - ') : (b > 0 ? '' : '-')) +
              (Math.abs(b) === 1 ? '' : Math.abs(b)) + 'x';
  if (c) s += (s ? (c > 0 ? ' + ' : ' - ') : String(c)) + (s ? Math.abs(c) : '');
  return s || '0';
}

/* ---------- ระดับทฤษฎี ---------- */

TQ({
  id: 'm2p-t-pow', topic: 202, sub: 'สมบัติเลขยกกำลัง',
  skills: ['บวกเลขชี้กำลังเมื่อคูณฐานเดียวกัน'],
  gen(R) {
    // ฐาน 2 ใช้ไม่ได้ เพราะตัวลวง a×a กับ a+a จะกลายเป็นตัวเลขเดียวกัน
    const a = R.pick([3, 5, 7]), m = R.int(2, 6), n = R.int(2, 6);
    // m = n = 2 ทำให้ผลบวกกับผลคูณของเลขชี้กำลังเท่ากัน ตัวเลือกจะซ้ำ
    if (m + n === m * n) return null;
    return {
      stem: M(a + '^' + m + ' × ' + a + '^' + n) + ' เท่ากับข้อใด',
      choices: [
        C(M(a + '^' + (m + n)), 'ฐานเดียวกันคูณกัน ให้<b>บวก</b>เลขชี้กำลัง เพราะเป็นการเอา ' + a +
          ' มาคูณกัน ' + m + ' ตัว แล้วต่อด้วยอีก ' + n + ' ตัว รวมเป็น ' + (m + n) + ' ตัว'),
        X(M(a + '^' + (m * n)), 'คูณเลขชี้กำลังแทนการบวก · การคูณเลขชี้กำลังใช้ตอน<b>ยกกำลังซ้อนกัน</b> ' +
          'คือ ' + M('(' + a + '^' + m + ')^' + n)),
        X(M((a * a) + '^' + (m + n)), 'ไปคูณฐานเข้าด้วยกันด้วย · ฐานต้องคงเดิม เปลี่ยนแค่เลขชี้กำลัง'),
        X(M((a + a) + '^' + (m + n)), 'บวกฐานเข้าด้วยกัน ซึ่งไม่มีกฎข้อไหนอนุญาต')
      ],
      idea: '<b>ฐานเดียวกัน คูณกัน → บวกเลขชี้กำลัง</b><br>' +
        M(a + '^' + m + ' × ' + a + '^' + n + ' = ' + a + '^{' + m + ' + ' + n + '} = ' + a + '^' + (m + n)) + '<br>' +
        'เห็นภาพได้จากการกระจาย: มี ' + a + ' อยู่ ' + m + ' ตัว คูณกับอีก ' + n + ' ตัว จึงมีทั้งหมด ' +
        (m + n) + ' ตัว',
      why: '<b>สรุปกฎที่ต้องแยกให้ออก</b><br>' +
        M('a^m × a^n = a^{m+n}') + ' (คูณ → บวกกำลัง)<br>' +
        M('a^m ÷ a^n = a^{m-n}') + ' (หาร → ลบกำลัง)<br>' +
        M('(a^m)^n = a^{mn}') + ' (ยกกำลังซ้อน → คูณกำลัง)'
    };
  }
});

TQ({

      stem: 'ข้อใดกล่าวถูกต้องเกี่ยวกับ ' + M(a + '^0') + ' และ ' + M(a + '^{-' + n + '}'),

          'ส่วนเลขชี้กำลังลบหมายถึงส่วนกลับ ไม่ได้แปลว่าค่าติดลบ'),

        'ตัวอย่าง: ' + M(a + '^{-' + n + '} = frac(1,' + Math.pow(a, n) + ')') +
        ' ซึ่งเป็นจำนวนบวกที่น้อยกว่า 1',
      why: '<b>ที่มาของกฎ:</b> ' + M('a^3 ÷ a^3 = a^{3-3} = a^0') + ' และเรารู้ว่าอะไรหารตัวเองได้ 1 ' +
        'จึงต้องนิยาม ' + M('a^0 = 1') + ' เพื่อให้กฎการหารใช้ได้ทุกกรณีโดยไม่ขัดกันเอง'
    };
  }
});

TQ({

  skills: ['ระบุพจน์ที่คล้ายกัน'],

    return {
      stem: 'ในการรวมพจน์ของ ' + M(a + 'x^2 + ' + b + 'x') + ' ข้อใดถูกต้อง',
      choices: [
        C('รวมกันไม่ได้ เพราะ ' + M('x^2') + ' กับ ' + M('x') + ' <b>ไม่ใช่พจน์ที่คล้ายกัน</b>',
          'พจน์จะคล้ายกันได้ต้องมีตัวแปรเดียวกันและ<b>เลขชี้กำลังเท่ากัน</b>ด้วย · ' +
          M('x^2') + ' กับ ' + M('x') + ' มีกำลังต่างกัน จึงรวมเป็นพจน์เดียวไม่ได้'),
        X('รวมได้เป็น ' + M((a + b) + 'x^2'), 'บวกสัมประสิทธิ์แล้วเลือกกำลังที่สูงกว่ามาใช้ ซึ่งไม่มีกฎรองรับ'),
        X('รวมได้เป็น ' + M((a + b) + 'x^3'), 'บวกทั้งสัมประสิทธิ์และบวกเลขชี้กำลัง · การบวกไม่ได้ทำแบบนั้น ' +
          'การบวกเลขชี้กำลังใช้ตอน<b>คูณ</b>เท่านั้น'),
        X('รวมได้เป็น ' + M((a * b) + 'x^3'), 'นี่คือผลของการ<b>คูณ</b> ' + M(a + 'x^2 × ' + b + 'x') +
          ' ไม่ใช่การบวก')
      ],
      idea: '<b>พจน์ที่คล้ายกัน</b> = ตัวแปรเหมือนกัน และเลขชี้กำลังของตัวแปรนั้นเท่ากัน<br>' +
        'รวมได้: ' + M(a + 'x^2 + ' + b + 'x^2 = ' + (a + b) + 'x^2') + '<br>' +
        'รวมไม่ได้: ' + M(a + 'x^2 + ' + b + 'x') + ' — ต้องปล่อยไว้แบบนั้น',
      why: '<b>วิธีคิดให้เห็นภาพ:</b> ' + M('x^2') + ' เปรียบเหมือน "ตารางเมตร" ส่วน ' + M('x') +
        ' เหมือน "เมตร" · เอาพื้นที่มาบวกกับความยาวไม่ได้ ต้องเป็นหน่วยเดียวกันเท่านั้น'
    };
  }
});

TQ({
  id: 'm2p-t-expand', topic: 202, sub: 'การคูณพหุนาม',
  skills: ['กระจายกำลังสองของผลบวก', 'ระวังพจน์กลาง'],
  gen(R) {
    // a = 2 ทำให้ a² กับ 2a เท่ากัน ตัวเลือกที่หนึ่งกับที่สี่จะซ้ำกันพอดี
    const a = R.int(3, 9);
    return {
      stem: M('(x + ' + a + ')^2') + ' กระจายแล้วได้ข้อใด',
      choices: [
        C(M('x^2 + ' + (2 * a) + 'x + ' + (a * a)),
          M('(x + ' + a + ')^2 = (x + ' + a + ')(x + ' + a + ')') + ' · กระจายครบทุกคู่จะได้ ' +
          M('x^2 + ' + a + 'x + ' + a + 'x + ' + (a * a)) + ' แล้วรวมพจน์กลางเป็น ' + M((2 * a) + 'x')),
        X(M('x^2 + ' + (a * a)),
          'ยกกำลังสองแยกทีละพจน์ ซึ่งเป็นความเข้าใจผิดที่พบบ่อยที่สุด · ' +
          M('(a + b)^2 ≠ a^2 + b^2') + ' เพราะขาดพจน์กลาง'),
        X(M('x^2 + ' + a + 'x + ' + (a * a)),
          'ได้พจน์กลางมาแค่ครั้งเดียว · เวลากระจายจะเกิดพจน์ ' + M(a + 'x') + ' ขึ้น<b>สองครั้ง</b> จึงต้องรวมเป็น ' +
          M((2 * a) + 'x')),
        X(M('x^2 + ' + (2 * a) + 'x + ' + (2 * a)),
          'พจน์ท้ายต้องเป็น ' + M(a + ' × ' + a + ' = ' + (a * a)) + ' ไม่ใช่ ' + M('2 × ' + a))
      ],
      idea: M('(a + b)^2 = a^2 + 2ab + b^2') + ' — ต้องมี<b>พจน์กลาง</b> ' + M('2ab') + ' เสมอ<br>' +
        'ในข้อนี้ ' + M('(x + ' + a + ')^2 = x^2 + ' + (2 * a) + 'x + ' + (a * a)),
      why: '<b>ตรวจง่าย ๆ ด้วยการแทนตัวเลข:</b> ให้ ' + M('x = 1') + ' จะได้ ' +
        M('(1 + ' + a + ')^2 = ' + Math.pow(1 + a, 2)) + '<br>' +
        'คำตอบที่ถูกให้ ' + M('1 + ' + (2 * a) + ' + ' + (a * a) + ' = ' + (1 + 2 * a + a * a)) + ' ✓ ' +
        'ส่วนข้อที่ลืมพจน์กลางให้ ' + M(String(1 + a * a)) + ' ซึ่งไม่ตรง'
    };
  }
});

T({
  id: 'm2p-powmul', topic: 202, sub: 'สมบัติเลขยกกำลัง', level: 'ง่าย',
  skills: ['คูณเลขยกกำลังฐานเดียวกัน'],
  gen(R) {
    const a = R.pick([2, 3, 5]), m = R.int(2, 5), n = R.int(2, 5);
    const e = m + n, v = Math.pow(a, e);
    if (v > 100000) return null;
    return {
      stem: 'จงหาค่าของ ' + M(a + '^' + m + ' × ' + a + '^' + n),
      given: [{ s: 'ฐาน', v: a, d: 'เหมือนกันทั้งสองตัว' },
              { s: 'เลขชี้กำลัง', v: m + ' และ ' + n, d: '' }],
      finds: [{ s: 'ผลลัพธ์', d: 'ค่าของนิพจน์', value: v, positive: true, kind: 'int' }],
      distract: [Math.pow(a, m * n), Math.pow(a, m) + Math.pow(a, n), Math.pow(a, e + 1), a * (m + n)],
      sol: {
        analyze: 'ฐานของทั้งสองตัวเป็น ' + M(String(a)) + ' เหมือนกัน จึงใช้กฎการคูณเลขยกกำลังได้<br>' +
          'กฎบอกว่าให้<b>บวก</b>เลขชี้กำลัง ไม่ใช่คูณ<br>' +
          '<b>กับดักของข้อนี้:</b> คูณเลขชี้กำลังเป็น ' + M(a + '^' + (m * n)) +
          ' ซึ่งเป็นกฎของการยกกำลังซ้อน ไม่ใช่การคูณ',
        eqs: [{ eq: 'a^m × a^n = a^{m+n}', why: 'ฐานเดียวกันคูณกัน ให้บวกเลขชี้กำลัง' }],
        solve: EQ(a + '^' + m + ' × ' + a + '^' + n + ' = ' + a + '^{' + m + ' + ' + n + '}'),
        subst: EQ('= ' + a + '^' + e),
        calc: EQ('= ' + v),
        conclude: 'ดังนั้น <b>ผลลัพธ์เท่ากับ ' + M(a + '^' + e + ' = ' + v) + '</b><br>' +
          '<span class="hint">ตรวจอีกทาง: ' + M(a + '^' + m + ' = ' + Math.pow(a, m)) + ' และ ' +
          M(a + '^' + n + ' = ' + Math.pow(a, n)) + ' · คูณกันได้ ' + M(String(v)) + ' ✓</span>'
      }
    };
  }
});

T({
  id: 'm2p-powdiv', topic: 202, sub: 'สมบัติเลขยกกำลัง', level: 'ง่าย',
  skills: ['หารเลขยกกำลังฐานเดียวกัน'],
  gen(R) {
    const a = R.pick([2, 3, 5, 10]), n = R.int(2, 4), m = n + R.int(1, 4);
    const e = m - n, v = Math.pow(a, e);
    if (Math.pow(a, m) > 1e7) return null;
    return {
      stem: 'จงหาค่าของ ' + M('frac(' + a + '^' + m + ',' + a + '^' + n + ')'),
      given: [{ s: 'เลขชี้กำลังตัวเศษ', v: m, d: '' }, { s: 'เลขชี้กำลังตัวส่วน', v: n, d: '' }],
      finds: [{ s: 'ผลลัพธ์', d: 'ค่าของนิพจน์', value: v, positive: true, kind: 'int' }],
      distract: [Math.pow(a, m + n), Math.pow(a, m * n), r2(m / n), Math.pow(a, n - m)],
      sol: {
        analyze: 'ฐานเหมือนกัน จึงใช้กฎการหารเลขยกกำลังได้ทันที โดยไม่ต้องคูณออกมาให้ยาว<br>' +
          'กฎบอกว่าให้<b>ลบ</b>เลขชี้กำลัง (บนลบล่าง)<br>' +
          '<b>กับดักของข้อนี้:</b> เอาเลขชี้กำลังมาหารกันเป็น ' + M(fmtq(m / n, 3)) + ' ซึ่งไม่ใช่กฎของเรื่องนี้',
        eqs: [{ eq: 'frac(a^m,a^n) = a^{m-n}', why: 'ตัวที่ซ้ำกันบนล่างตัดกันไป เหลือส่วนต่างของจำนวนตัว' }],
        solve: EQ('frac(' + a + '^' + m + ',' + a + '^' + n + ') = ' + a + '^{' + m + ' - ' + n + '}'),
        subst: EQ('= ' + a + '^' + e),
        calc: EQ('= ' + v),
        conclude: 'ดังนั้น <b>ผลลัพธ์เท่ากับ ' + M(a + '^' + e + ' = ' + v) + '</b><br>' +
          '<span class="hint">ตรวจอีกทาง: ' + M(a + '^' + m + ' = ' + Math.pow(a, m)) + ' หารด้วย ' +
          M(a + '^' + n + ' = ' + Math.pow(a, n)) + ' ได้ ' + M(String(v)) + ' ✓</span>'
      }
    };
  }
});

T({
  id: 'm2p-addpoly', topic: 202, sub: 'การบวกลบพหุนาม', level: 'ง่าย',
  skills: ['รวมพจน์ที่คล้ายกัน', 'จัดการเครื่องหมายลบหน้าวงเล็บ'],
  gen(R) {
    const a1 = R.int(2, 9), b1 = R.int(-9, 9), c1 = R.int(-9, 9);
    const a2 = R.int(2, 9), b2 = R.int(-9, 9), c2 = R.int(-9, 9);
    if (!b1 || !c1 || !b2 || !c2) return null;
    const sub = R.f() < 0.45;
    const A = sub ? a1 - a2 : a1 + a2;
    const B = sub ? b1 - b2 : b1 + b2;
    const C = sub ? c1 - c2 : c1 + c2;
    if (!A || !B) return null;
    const op = sub ? ' - ' : ' + ';
    return {
      stem: 'จงหาผลลัพธ์ของ ' + M('(' + polyTxt(a1, b1, c1) + ')' + op + '(' + polyTxt(a2, b2, c2) + ')') +
        '<br>แล้วตอบ<b>สัมประสิทธิ์ของ ' + M('x^2') + '</b>',
      given: [{ s: 'พหุนามที่ 1', v: polyTxt(a1, b1, c1).replace(/\^2/g, '²'), d: '' },
              { s: 'พหุนามที่ 2', v: polyTxt(a2, b2, c2).replace(/\^2/g, '²'), d: '' }],
      finds: [{ s: 'สัมประสิทธิ์ของ x²', d: 'ในผลลัพธ์', value: A, kind: 'int' }],
      distract: [sub ? a1 + a2 : a1 - a2, B, a1 * a2, C],
      sol: {
        analyze: 'การบวกลบพหุนามคือการ<b>รวมพจน์ที่คล้ายกัน</b> — พจน์ ' + M('x^2') + ' รวมกับ ' +
          M('x^2') + ' · พจน์ ' + M('x') + ' รวมกับ ' + M('x') + ' · ตัวเลขรวมกับตัวเลข<br>' +
          (sub
            ? 'ข้อนี้เป็นการ<b>ลบ</b> เครื่องหมายลบหน้าวงเล็บต้องกระจายเข้าไปทุกพจน์ในวงเล็บหลัง'
            : 'ข้อนี้เป็นการบวก จึงถอดวงเล็บออกได้ตรง ๆ') + '<br>' +
          '<b>กับดักของข้อนี้:</b> ' + (sub
            ? 'ลบเฉพาะพจน์แรกแล้วลืมเปลี่ยนเครื่องหมายของพจน์ที่เหลือในวงเล็บ'

T({

      sol: {

          '<b>กับดักของข้อนี้:</b> ใช้กฎสลับกัน เช่นเอา ' + M('(' + a + '^' + m + ')^' + n) +

              { eq: 'frac(a^q,a^d) = a^{q-d}', why: 'หารฐานเดียวกัน — ลบเลขชี้กำลัง' }],
        solve: EQ('(' + a + '^' + m + ')^' + n + ' = ' + a + '^' + (m * n),
                  a + '^' + (m * n) + ' × ' + a + '^' + k + ' = ' + a + '^' + (m * n + k),
                  'frac(' + a + '^' + (m * n + k) + ',' + a + '^' + d + ') = ' + a + '^{' + (m * n + k) + ' - ' + d + '}'),
        subst: SEQ('n = {p} - {d}', { p: m * n + k, d: d }),
        calc: EQ('n = ' + e, 'ค่าของนิพจน์ = ' + a + '^' + e + ' = ' + Math.pow(a, e)),

          '<span class="hint">ทางลัดที่ใช้ตรวจ: เลขชี้กำลังสุดท้าย = ' +
          M('(' + m + ' × ' + n + ') + ' + k + ' - ' + d + ' = ' + e) + ' — คิดที่เลขชี้กำลังอย่างเดียว ' +
          'ไม่ต้องคูณตัวเลขจริงเลย</span>'

T({
  id: 'm2p-mulpoly', topic: 202, sub: 'การคูณพหุนาม', level: 'ปานกลาง',
  skills: ['คูณพหุนามสองวงเล็บ', 'รวมพจน์กลาง'],
  gen(R) {
    const a = R.int(-9, 9), b = R.int(-9, 9);
    if (!a || !b || a === b) return null;
    const mid = a + b, last = a * b;
    if (!mid) return null;
    const sa = a < 0 ? ' - ' + (-a) : ' + ' + a;
    const sb = b < 0 ? ' - ' + (-b) : ' + ' + b;
    return {
      stem: 'จงกระจาย ' + M('(x' + sa + ')(x' + sb + ')') + '<br>' +
        'แล้วตอบ<b>สัมประสิทธิ์ของ ' + M('x') + '</b> และ<b>พจน์ที่เป็นตัวเลข</b>',
      given: [{ s: 'วงเล็บที่ 1', v: 'x' + sa, d: '' }, { s: 'วงเล็บที่ 2', v: 'x' + sb, d: '' }],
      finds: [{ s: 'สัมประสิทธิ์ของ x', d: 'พจน์กลาง', value: mid, kind: 'int' },
              { s: 'พจน์ตัวเลข', d: 'พจน์ท้าย', value: last, kind: 'int' }],
      sol: {
        analyze: 'การคูณสองวงเล็บต้องกระจายให้ครบ<b>ทุกคู่</b> รวม 4 คู่ แล้วจึงรวมพจน์ที่คล้ายกัน<br>' +
          'สังเกตรูปแบบที่จะใช้ได้ตลอดไป: พจน์กลางคือ<b>ผลบวก</b>ของสองจำนวน ' +
          'ส่วนพจน์ท้ายคือ<b>ผลคูณ</b>ของสองจำนวน<br>' +
          '<b>กับดักของข้อนี้:</b> คูณเฉพาะหน้ากับหน้าและหลังกับหลัง จะได้ ' +
          M('x^2 + ' + last) + ' โดยหายพจน์กลางไปทั้งพจน์',
        eqs: [{ eq: '(x + a)(x + b) = x^2 + (a + b)x + ab',
                why: 'กระจายครบสี่คู่แล้วรวมพจน์กลางสองพจน์เข้าด้วยกัน' }],
        solve: EQ('(x' + sa + ')(x' + sb + ')',
                  '= x·x + x·(' + b + ') + (' + a + ')·x + (' + a + ')(' + b + ')'),
        subst: SEQ('= x^2 + ({a} + {b})x + ({a})({b})', { a: a, b: b }),
        calc: EQ('= ' + polyTxt(1, mid, last)),
        conclude: 'ดังนั้น <b>สัมประสิทธิ์ของ ' + M('x') + ' คือ ' + M(String(mid)) + ' และพจน์ตัวเลขคือ ' +
          M(String(last)) + '</b><br>' +
          '<span class="hint">ตรวจโดยแทน ' + M('x = 1') + ': ข้างซ้าย ' +
          M('(1' + sa + ')(1' + sb + ') = ' + ((1 + a) * (1 + b))) + ' · ข้างขวา ' +
          M('1 + ' + mid + ' + ' + last + ' = ' + (1 + mid + last)) + ' ✓</span>'
      }
    };
  }
});

T({
  id: 'm2p-value', topic: 202, sub: 'การบวกลบพหุนาม', level: 'ปานกลาง',
  skills: ['แทนค่าในพหุนาม', 'ลำดับการดำเนินการกับเลขยกกำลัง'],
  gen(R) {
    const a = R.int(2, 6), b = R.int(-9, 9), c = R.int(-12, 12), x = R.int(-5, 5);
    if (!b || !c || !x) return null;
    const v = a * x * x + b * x + c;

    return {
      stem: 'กำหนดให้ ' + M('P(x) = ' + polyTxt(a, b, c)) + '<br>จงหาค่าของ ' + M('P(' + x + ')'),
      given: [{ s: 'พหุนาม', v: polyTxt(a, b, c).replace(/\^2/g, '²'), d: '' },
              { s: 'x', v: x, d: 'ค่าที่นำไปแทน' }],
      finds: [{ s: 'P(' + x + ')', d: 'ค่าของพหุนาม', value: v, kind: 'int' }],
      sol: {
        analyze: 'แทนค่า ' + M('x = ' + x) + ' ลงไปทุกที่ที่มี ' + M('x') + ' แล้วคิดตามลำดับการดำเนินการ<br>' +
          '<b>ยกกำลังก่อน แล้วจึงคูณ สุดท้ายค่อยบวกลบ</b><br>' +
          '<b>กับดักของข้อนี้:</b> ' + (x < 0
            ? 'แทน ' + M('x = ' + x) + ' แล้วคิด ' + M(a + 'x^2') + ' เป็นจำนวนลบ · ' +
              'ความจริง ' + M('(' + x + ')^2 = ' + (x * x)) + ' เป็นบวก เพราะยกกำลังคู่'
            : 'คูณก่อนยกกำลัง เช่นคิด ' + M(a + 'x^2') + ' เป็น ' + M('(' + a + 'x)^2') + ' ซึ่งไม่เท่ากัน'),
        eqs: [{ eq: 'ลำดับ: ยกกำลัง → คูณหาร → บวกลบ', why: 'เลขชี้กำลังผูกกับ x เท่านั้น ไม่ได้ผูกกับสัมประสิทธิ์' }],
        solve: EQ('P(' + x + ') = ' + a + '(' + x + ')^2 ' + (b < 0 ? '- ' + (-b) : '+ ' + b) + '(' + x + ') ' +
                  (c < 0 ? '- ' + (-c) : '+ ' + c)),
        subst: SEQ('= {a}({sq}) + ({bx}) + ({c})', { a: a, sq: x * x, bx: b * x, c: c }),
        calc: EQ('= ' + (a * x * x) + ' + (' + (b * x) + ') + (' + c + ')', '= ' + v),
        conclude: 'ดังนั้น <b>' + M('P(' + x + ') = ' + v) + '</b><br>' +
          '<span class="hint">ข้อสังเกต: ' + M('(' + x + ')^2 = ' + (x * x)) +
          (x < 0 ? ' เป็นบวกแม้ x จะติดลบ เพราะยกกำลังคู่' : '') + '</span>'
      }
    };
  }
});

T({

        '<br>จงหาค่าของ ' + M('k') + ' (ตัวประกอบร่วมที่มากที่สุดที่ดึงออกมาได้)',
      given: [{ s: 'พจน์ที่ 1', v: a + 'x²', d: '' }, { s: 'พจน์ที่ 2', v: b + 'x', d: '' }],
      finds: [{ s: 'k', d: 'ตัวเลขที่ดึงออกมา', value: g, positive: true, kind: 'int' },
              { s: 'สัมประสิทธิ์ในวงเล็บ', d: 'ตัวหน้าของ x ในวงเล็บ', value: p, positive: true, kind: 'int' }],
      sol: {

          '• ตัวเลข: ห.ร.ม. ของ ' + a + ' กับ ' + b + ' คือ ' + M(String(g)) + '<br>' +
          '• ตัวแปร: ทั้ง ' + M('x^2') + ' และ ' + M('x') + ' มี ' + M('x') + ' อยู่ จึงดึง ' + M('x') + ' ออกได้<br>' +
          '<b>กับดักของข้อนี้:</b> ดึงออกไม่หมด เช่นดึงแค่ ' + M('x') + ' โดยลืมตัวเลข ' +
          'หรือดึงตัวเลขที่ไม่ใช่ ห.ร.ม. ทำให้ในวงเล็บยังมีตัวประกอบร่วมเหลืออยู่',
        eqs: [{ eq: 'ตัวประกอบร่วมของตัวเลข = ห.ร.ม. ของสัมประสิทธิ์', why: 'ดึงให้มากที่สุดในครั้งเดียว จะได้ไม่ต้องแยกซ้ำ' },
              { eq: 'ตัวประกอบร่วมของตัวแปร = ตัวแปรที่มีกำลังต่ำสุด', why: 'x² กับ x มี x เป็นตัวร่วม กำลังต่ำสุดคือ 1' }],
        solve: EQ('ห.ร.ม. ของ ' + a + ' กับ ' + b + ' = ' + g,
                  a + 'x^2 + ' + b + 'x = ' + g + 'x(' + p + 'x + ' + q + ')'),
        subst: SEQ('{a}x^2 ÷ {g}x = {p}x   ,   {b}x ÷ {g}x = {q}', { a: a, g: g, p: p, b: b, q: q }),
        calc: EQ('k = ' + g + '  ,  สัมประสิทธิ์ในวงเล็บ = ' + p),
        conclude: 'ดังนั้น <b>' + M(a + 'x^2 + ' + b + 'x = ' + g + 'x(' + p + 'x + ' + q + ')') + '</b><br>' +
          '<span class="hint">ตรวจโดยกระจายกลับ: ' + M(g + 'x × ' + p + 'x = ' + a + 'x^2') + ' และ ' +
          M(g + 'x × ' + q + ' = ' + b + 'x') + ' ✓ · ในวงเล็บ ' + p + ' กับ ' + q +
          ' ไม่มีตัวประกอบร่วมแล้ว แปลว่าดึงออกมาหมดจริง</span>'
      }
    };

});

T({
  id: 'm2p-square', topic: 202, sub: 'การคูณพหุนาม', level: 'ยาก',
  skills: ['กำลังสองของผลบวกและผลต่าง', 'เทียบสัมประสิทธิ์'],
  gen(R) {
    const a = R.int(2, 9), b = R.int(2, 12), neg = R.f() < 0.45;

    return {

T({

        'จงหา<b>ระยะทางเป็นเส้นตรงจากบ้านถึงโรงเรียน</b> และถ้าเดินเส้นตรงได้จะ<b>ประหยัดระยะทางกี่เมตร</b>',
      figure: figRightTri({ a: t[0], b: t[1], c: t[2], unit: '', aLbl: fmt(e) + ' ม.', bLbl: fmt(n) + ' ม.', cLbl: '?' }),
      given: [{ s: 'ไปทางตะวันออก', v: e, unit: 'ม.', d: 'ช่วงแรก' },

              { s: 'ระยะที่ประหยัดได้', unit: 'เมตร', d: 'เทียบกับการเดินสองช่วง', value: save, positive: true, kind: 'int' }],
      sol: {
        analyze: 'ทิศตะวันออกกับทิศเหนือ<b>ตั้งฉากกัน</b> เส้นทางเดินสองช่วงกับเส้นตรงจึงประกอบเป็น' +
          'สามเหลี่ยมมุมฉากพอดี<br>' +
          'เส้นตรงจากบ้านถึงโรงเรียนคือ<b>ด้านตรงข้ามมุมฉาก</b><br>' +
          '<b>กับดักของข้อนี้:</b> คิดว่าระยะทางตรงเท่ากับผลบวก ' + U(e + n, 'เมตร') +
          ' · เส้นตรงต้องสั้นกว่าการเดินอ้อมเสมอ',
        eqs: [{ eq: 'd^2 = e^2 + n^2', why: 'สองทิศตั้งฉากกัน จึงเป็นด้านประกอบมุมฉาก' },
              { eq: 'ระยะที่ประหยัด = (e + n) - d', why: 'ระยะเดินจริงลบด้วยระยะทางเส้นตรง' }],
        solve: EQ('d^2 = ' + e + '^2 + ' + n + '^2'),
        subst: SEQ('d^2 = {p} + {q}', { p: e * e, q: n * n }),
        calc: EQ('d = ' + d + ' `เมตร`',

          '<span class="hint">ข้อสังเกต: เดินอ้อมสองช่วงรวม ' + U(e + n, 'เมตร') +
          ' แต่เส้นตรงแค่ ' + U(d, 'เมตร') + ' · นี่คือเหตุผลที่คนมักเดินลัดสนามแทนการเดินตามทางเท้า</span>'
      }
    };

});

T({
  id: 'm2py-isos', topic: 203, sub: 'หาด้านที่หายไป', level: 'ปานกลาง',
  skills: ['แบ่งสามเหลี่ยมหน้าจั่วเป็นสองมุมฉาก', 'หาความสูงแล้วคิดพื้นที่'],
  gen(R) {
    const t = R.pick(PYT), k = R.pick([1, 1, 2]);
    const half = t[0] * k, h = t[1] * k, side = t[2] * k;
    if (side > 90) return null;
    const base = half * 2, A = base * h / 2;
    if (!ok2(A)) return null;
    return {
      stem: 'สามเหลี่ยมหน้าจั่วมีด้านประกอบยาวด้านละ ' + U(side, 'ซม.') + ' และฐานยาว ' + U(base, 'ซม.') +
        '<br>จงหา<b>ความสูง</b> และ<b>พื้นที่</b>ของสามเหลี่ยมรูปนี้',
      figure: figTri({ b: base, h: h, unit: 'ซม.', apex: 0.5, hLbl: '?' }),
      given: [{ s: 'ด้านประกอบ', v: side, unit: 'ซม.', d: 'ยาวเท่ากันสองด้าน' },
              { s: 'ฐาน', v: base, unit: 'ซม.', d: '' }],
      finds: [{ s: 'ความสูง', unit: 'ซม.', d: 'จากยอดลงมาตั้งฉากกับฐาน', value: h, positive: true, kind: 'int' },
              { s: 'พื้นที่', unit: 'ตร.ซม.', d: 'พื้นที่ของสามเหลี่ยม', value: A, positive: true }],
      sol: {
        analyze: 'สามเหลี่ยมหน้าจั่วไม่ใช่สามเหลี่ยมมุมฉาก ใช้พีทาโกรัสตรง ๆ ไม่ได้<br>' +
          'แต่<b>เส้นสูงจากยอดจะแบ่งฐานออกเป็นสองส่วนเท่า ๆ กันพอดี</b> ' +
          'ได้สามเหลี่ยมมุมฉากสองรูปที่เหมือนกัน แล้วจึงใช้พีทาโกรัสกับรูปใดรูปหนึ่ง<br>' +
          'ครึ่งฐาน = ' + M(base + ' ÷ 2 = ' + half) + ' ซม.<br>' +
          '<b>กับดักของข้อนี้:</b> ใช้ฐานเต็ม ' + base + ' แทนครึ่งฐาน ทำให้คำนวณความสูงผิด',
        eqs: [{ eq: 'เส้นสูงของสามเหลี่ยมหน้าจั่วแบ่งครึ่งฐานพอดี',
                why: 'เพราะรูปสมมาตรซ้ายขวา จึงได้สามเหลี่ยมมุมฉากสองรูปที่เท่ากันทุกประการ' },
              { eq: 'ความสูง = sqrt(ด้านประกอบ^2 - (frac(ฐาน,2))^2)', why: 'ใช้พีทาโกรัสกับสามเหลี่ยมมุมฉากครึ่งซ้ายหรือครึ่งขวา' },
              { eq: 'พื้นที่ = frac(1,2) × ฐาน × สูง', why: 'สูตรพื้นที่สามเหลี่ยมตามปกติ' }],
        solve: EQ('ครึ่งฐาน = frac(' + base + ',2) = ' + half,
                  'ความสูง^2 = ' + side + '^2 - ' + half + '^2'),
        subst: SEQ('ความสูง^2 = {p} - {q}', { p: side * side, q: half * half }),
        calc: EQ('ความสูง = ' + h + ' `ซม.`',
                 'พื้นที่ = frac(1,2) × ' + base + ' × ' + h + ' = ' + fmtq(A) + ' `ตร.ซม.`'),
        conclude: 'ดังนั้น <b>ความสูงเท่ากับ ' + U(h, 'ซม.') + ' และพื้นที่เท่ากับ ' + U(A, 'ตร.ซม.') + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ' + M(half + '^2 + ' + h + '^2 = ' + (side * side)) +
          ' ซึ่งเท่ากับ ' + M(side + '^2') + ' ✓ · ความสูงต้องสั้นกว่าด้านประกอบเสมอ</span>'
      }
    };
  }
});

T({
  id: 'm2py-para', topic: 203, sub: 'โจทย์ปัญหาพีทาโกรัส', level: 'ปานกลาง',
  skills: ['หาด้านเอียงของสี่เหลี่ยมด้านขนาน', 'แยกความสูงออกจากด้านเอียง'],
  gen(R) {
    const t = R.pick(PYT), k = R.pick([1, 1, 2]);
    const run = t[0] * k, h = t[1] * k, side = t[2] * k;
    if (side > 90) return null;
    const b = R.int(side, side + 30);
    const A = b * h, P = 2 * (b + side);
    return {
      stem: 'สี่เหลี่ยมด้านขนานมีฐานยาว ' + U(b, 'ซม.') + ' สูง ' + U(h, 'ซม.') +
        ' และเชิงของเส้นสูงห่างจากมุมล่างซ้ายไปตามฐาน ' + U(run, 'ซม.') + '<br>' +
        'จงหา<b>ความยาวของด้านเอียง</b> และ<b>ความยาวรอบรูป</b>',
      figure: figPara({ b: b, h: h, unit: 'ซม.' }),
      given: [{ s: 'ฐาน', v: b, unit: 'ซม.', d: '' },
              { s: 'สูง', v: h, unit: 'ซม.', d: 'ตั้งฉากกับฐาน' },
              { s: 'ระยะตามฐาน', v: run, unit: 'ซม.', d: 'จากมุมถึงเชิงของเส้นสูง' }],
      finds: [{ s: 'ด้านเอียง', unit: 'ซม.', d: 'ด้านที่ไม่ตั้งฉาก', value: side, positive: true, kind: 'int' },
              { s: 'ความยาวรอบรูป', unit: 'ซม.', d: 'ผลรวมทั้งสี่ด้าน', value: P, positive: true, kind: 'int' }],
      sol: {
        analyze: 'เส้นสูงที่ลากลงมาตั้งฉากกับฐาน จะสร้าง<b>สามเหลี่ยมมุมฉาก</b>ขึ้นที่มุมของรูป<br>' +
          '• ด้านประกอบมุมฉาก = ระยะตามฐาน ' + U(run, 'ซม.') + ' และความสูง ' + U(h, 'ซม.') + '<br>' +
          '• ด้านตรงข้ามมุมฉาก = <b>ด้านเอียง</b>ที่โจทย์ถาม<br>' +
          '<b>กับดักของข้อนี้:</b> คิดว่าด้านเอียงเท่ากับความสูง · ด้านเอียงต้องยาวกว่าความสูงเสมอ ' +
          'เพราะเป็นด้านตรงข้ามมุมฉาก',
        eqs: [{ eq: 'ด้านเอียง^2 = ระยะตามฐาน^2 + ความสูง^2', why: 'สามเหลี่ยมมุมฉากที่เกิดจากการลากเส้นสูง' },
              { eq: 'ความยาวรอบรูป = 2 × (ฐาน + ด้านเอียง)', why: 'ด้านตรงข้ามของด้านขนานยาวเท่ากันเป็นคู่' }],
        solve: EQ('ด้านเอียง^2 = ' + run + '^2 + ' + h + '^2'),
        subst: SEQ('= {p} + {q}', { p: run * run, q: h * h }),
        calc: EQ('ด้านเอียง = ' + side + ' `ซม.`',
                 'ความยาวรอบรูป = 2(' + b + ' + ' + side + ') = ' + P + ' `ซม.`'),
        conclude: 'ดังนั้น <b>ด้านเอียงยาว ' + U(side, 'ซม.') + ' และความยาวรอบรูปเท่ากับ ' +
          U(P, 'ซม.') + '</b><br>' +
          '<span class="hint">ข้อสังเกต: พื้นที่ของรูปนี้คือ ' + M(b + ' × ' + h + ' = ' + A) +
          ' ตร.ซม. ซึ่งใช้<b>ความสูง</b> ไม่ใช่ด้านเอียง · สองค่านี้ใช้คนละที่กัน</span>'
      }
    };
  }
});

T({
  id: 'm2py-ladder2', topic: 203, sub: 'โจทย์ปัญหาพีทาโกรัส', level: 'ยาก',
  skills: ['ใช้พีทาโกรัสสองรอบในสถานการณ์เดียว', 'เปรียบเทียบก่อนและหลัง'],
  gen(R) {
    const p = R.pick(PYT_PAIR);
    const len = p[2];
    const [f1, h1] = p[0], [f2, h2] = p[1];
    if (f2 <= f1) return null;
    const move = f2 - f1, drop = h1 - h2;
    return {
      stem: 'บันไดยาว ' + U(len, 'เมตร') + ' พิงกำแพง โดยปลายล่างห่างจากกำแพง ' + U(f1, 'เมตร') + '<br>' +
        'ต่อมามีคนดันปลายล่างออกจากกำแพงอีก ' + U(move, 'เมตร') + '<br>' +
        'จงหา<b>ความสูงใหม่ของปลายบน</b> และ<b>ปลายบนเลื่อนลงมากี่เมตร</b>',
      figure: figRightTri({ a: f2, b: h2, c: len, unit: 'ม.', bLbl: '?' }),
      given: [{ s: 'ความยาวบันได', v: len, unit: 'ม.', d: 'ไม่เปลี่ยน' },
              { s: 'ระยะเดิมจากกำแพง', v: f1, unit: 'ม.', d: '' },
              { s: 'ดันออกไปอีก', v: move, unit: 'ม.', d: '' }],
      finds: [{ s: 'ความสูงใหม่', unit: 'เมตร', d: 'หลังดันบันไดออก', value: h2, positive: true, kind: 'int' },
              { s: 'ระยะที่เลื่อนลง', unit: 'เมตร', d: 'ปลายบนลดลงเท่าไร', value: drop, positive: true, kind: 'int' }],
      sol: {
        analyze: 'จุดสำคัญคือ <b>ความยาวบันไดไม่เปลี่ยน</b> ไม่ว่าจะดันไปเท่าไร ' +
          'ด้านตรงข้ามมุมฉากจึงคงที่ที่ ' + U(len, 'เมตร') + ' ตลอด<br>' +
          'ต้องใช้พีทาโกรัสสองรอบ — รอบแรกหาความสูงเดิม รอบสองหาความสูงใหม่ แล้วจึงเทียบกัน<br>' +
          '<b>กับดักของข้อนี้:</b> คิดว่าดันฐานออก ' + move + ' เมตร ปลายบนก็จะลดลง ' + move +
          ' เมตรเท่ากัน · ความจริงลดลง ' + drop + ' เมตร ไม่เท่ากันเลย เพราะความสัมพันธ์ไม่ใช่เส้นตรง',
        eqs: [{ eq: 'ความสูง = sqrt(ความยาวบันได^2 - ระยะจากกำแพง^2)',
                why: 'ใช้ได้ทั้งก่อนและหลัง เพราะบันไดยาวเท่าเดิม' },
              { eq: 'ระยะที่เลื่อนลง = ความสูงเดิม - ความสูงใหม่', why: 'เทียบสองสถานการณ์' }],
        solve: EQ('ความสูงเดิม = sqrt(' + len + '^2 - ' + f1 + '^2) = sqrt(' + (len * len - f1 * f1) + ') = ' + h1,
                  'ระยะใหม่จากกำแพง = ' + f1 + ' + ' + move + ' = ' + f2,
                  'ความสูงใหม่ = sqrt(' + len + '^2 - ' + f2 + '^2)'),
        subst: SEQ('ความสูงใหม่ = sqrt({p} - {q})', { p: len * len, q: f2 * f2 }),

T({
  id: 'm2py-check', topic: 203, sub: 'บทกลับของพีทาโกรัส', level: 'ยาก',
  skills: ['ใช้บทกลับจำแนกชนิดของมุม', 'เทียบกำลังสองของด้าน'],
  gen(R) {
    const t = R.pick(PYT);
    const off = R.pick([-3, -2, -1, 1, 2, 3]);
    const c = t[2] + off;
    if (c <= t[1] || c >= t[0] + t[1]) return null;
    const lhs = t[0] * t[0] + t[1] * t[1], rhs = c * c;
    const diff = lhs - rhs;
    if (!diff) return null;
    const kind = diff > 0 ? 1 : 2;   // 1 = มุมแหลม · 2 = มุมป้าน
    return {
      stem: 'สามเหลี่ยมรูปหนึ่งมีด้านยาว ' + M(t[0] + ' , ' + t[1] + ' , ' + c) + ' เซนติเมตร<br>' +
        'จงหา<b>ผลต่างของ ' + M('a^2 + b^2') + ' กับ ' + M('c^2') + '</b> (เอาตัวแรกลบตัวหลัง) ' +
        'และ<b>มุมที่ใหญ่ที่สุดเป็นมุมชนิดใด</b> (ตอบ 1 = มุมแหลม · 2 = มุมป้าน · 3 = มุมฉาก)',
      given: [{ s: 'ด้านที่ 1', v: t[0], unit: 'ซม.', d: '' },
              { s: 'ด้านที่ 2', v: t[1], unit: 'ซม.', d: '' },
              { s: 'ด้านที่ยาวที่สุด', v: c, unit: 'ซม.', d: 'ใช้เป็น c' }],
      finds: [{ s: 'ผลต่าง', d: M('(a^2 + b^2) - c^2'), value: diff, kind: 'int' },
              { s: 'ชนิดของมุม', d: '1 แหลม · 2 ป้าน · 3 ฉาก', value: kind, positive: true, kind: 'int' }],
      sol: {
        analyze: 'บทกลับของพีทาโกรัสใช้<b>จำแนกชนิดของมุมที่ใหญ่ที่สุด</b>ได้ โดยไม่ต้องวัดมุมเลย<br>' +
          'ต้องเลือก ' + M('c') + ' เป็น<b>ด้านที่ยาวที่สุด</b>ก่อนเสมอ เพราะมุมที่ใหญ่ที่สุดอยู่ตรงข้ามด้านที่ยาวที่สุด<br>' +
          'ข้อนี้ด้านยาวที่สุดคือ ' + U(c, 'ซม.') + '<br>' +
          '<b>กับดักของข้อนี้:</b> หยิบด้านไหนมาเป็น ' + M('c') + ' ก็ได้ · ถ้าเลือกผิด ผลสรุปจะกลับด้านทันที',
        eqs: [{ eq: 'a^2 + b^2 = c^2  ⇒  มุมฉาก', why: 'บทกลับของทฤษฎีบทพีทาโกรัส' },
              { eq: 'a^2 + b^2 > c^2  ⇒  มุมแหลม', why: 'ด้านตรงข้ามสั้นกว่าที่ควรเป็นถ้าเป็นมุมฉาก มุมจึงแคบกว่า' },
              { eq: 'a^2 + b^2 < c^2  ⇒  มุมป้าน', why: 'ด้านตรงข้ามยาวกว่าที่ควรเป็น มุมจึงกางกว่า' }],
        solve: EQ('a^2 + b^2 = ' + t[0] + '^2 + ' + t[1] + '^2 = ' + lhs, 'c^2 = ' + c + '^2 = ' + rhs),
        subst: SEQ('ผลต่าง = {l} - {r}', { l: lhs, r: rhs }),
        calc: EQ('ผลต่าง = ' + diff,
                 'เนื่องจาก ' + lhs + (diff > 0 ? ' > ' : ' < ') + rhs + ' ⇒ มุมที่ใหญ่ที่สุดเป็น' +
                 (diff > 0 ? 'มุมแหลม' : 'มุมป้าน')),
        conclude: 'ดังนั้น <b>ผลต่างเท่ากับ ' + M(String(diff)) + ' และมุมที่ใหญ่ที่สุดเป็น' +
          (diff > 0 ? 'มุมแหลม (ตอบ 1)' : 'มุมป้าน (ตอบ 2)') + '</b><br>' +
          '<span class="hint">เทียบให้เห็นภาพ: ถ้าด้านที่สามยาว ' + U(t[2], 'ซม.') +
          ' พอดี จะได้มุมฉากเป๊ะ · ข้อนี้ยาว ' + U(c, 'ซม.') + ' ซึ่ง' +
          (c > t[2] ? 'ยาวกว่า มุมจึงกางออกเป็นมุมป้าน' : 'สั้นกว่า มุมจึงหุบเข้าเป็นมุมแหลม') + '</span>'
      }
    };
  }
});

/* ==== ม.2 บทที่ 4 : ปริซึม ทรงกระบอก และการแปลงทางเรขาคณิต (id 204) ==== */

/** รัศมีที่ทำให้คำตอบลงตัวสวย ขึ้นกับค่า π ที่ครูตั้งไว้
    ใช้ 22/7 เมื่อไร รัศมีต้องเป็นพหุคูณของ 7 ไม่งั้นได้ทศนิยมยาว */
function niceR(R, c) {
  return c.piMode === '22/7' ? R.pick([7, 14, 21]) : R.pick([5, 7, 10, 12, 14, 15, 20]);
}

T({

  skills: ['ปริมาตรปริซึมสามเหลี่ยม', 'แยกความสูงของฐานกับความยาวปริซึม'],
  gen(R) {
    const b = R.step(4, 20, 2), h = R.int(3, 12), len = R.int(5, 20);
    const base = b * h / 2, V = base * len;
    if (!ok2(base, V) || V > 2000) return null;
    return {
      stem: 'ปริซึมสามเหลี่ยมมีหน้าตัดเป็นสามเหลี่ยมฐาน ' + U(b, 'ซม.') + ' สูง ' + U(h, 'ซม.') +
        ' และปริซึมยาว ' + U(len, 'ซม.') + '<br>จงหา<b>ปริมาตร</b>',
      figure: figPrismTri({ b: b, h: h, len: len, unit: 'ซม.' }),
      given: [{ s: 'ฐานของหน้าตัด', v: b, unit: 'ซม.', d: '' },
              { s: 'สูงของหน้าตัด', v: h, unit: 'ซม.', d: 'ตั้งฉากกับฐาน' },
              { s: 'ความยาวปริซึม', v: len, unit: 'ซม.', d: 'ระยะระหว่างสองหน้าตัด' }],
      finds: [{ s: 'ปริมาตร', unit: 'ลบ.ซม.', d: 'ปริมาตรของปริซึม', value: V, positive: true }],
      distract: [r2(b * h * len), r2(base), b + h + len, r2(V / 2)],
      sol: {
        analyze: 'ปริซึมมีหน้าตัดเหมือนกันตลอดความยาว ปริมาตรจึงเป็น<b>พื้นที่หน้าตัด × ความยาว</b><br>' +
          'ข้อนี้มีคำว่า "สูง" อยู่สองที่ ต้องแยกให้ออก<br>' +
          '• <b>สูงของหน้าตัด</b> ' + U(h, 'ซม.') + ' ใช้หาพื้นที่สามเหลี่ยม<br>' +
          '• <b>ความยาวปริซึม</b> ' + U(len, 'ซม.') + ' ใช้คูณกับพื้นที่ฐาน<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมคูณ ' + M('frac(1,2)') + ' ตอนหาพื้นที่สามเหลี่ยม ' +
          'จะได้ ' + U(round2(b * h * len), 'ลบ.ซม.') + ' ซึ่งมากเป็นสองเท่า',
        eqs: [{ eq: 'พื้นที่ฐาน = frac(1,2) × ฐาน × สูง', why: 'หน้าตัดเป็นสามเหลี่ยม' },
              { eq: 'ปริมาตรปริซึม = พื้นที่ฐาน × ความยาว', why: 'หน้าตัดเท่ากันตลอด จึงคูณได้ตรง ๆ' }],
        solve: EQ('พื้นที่ฐาน = frac(1,2) × ' + b + ' × ' + h, 'ปริมาตร = พื้นที่ฐาน × ' + len),
        subst: SEQ('พื้นที่ฐาน = frac({p},2) = {A}', { p: b * h, A: base }) +
               SEQ('ปริมาตร = {A} × {L}', { A: base, L: len }),
        calc: EQ('ปริมาตร = ' + fmtq(V) + ' `ลบ.ซม.`'),
        conclude: 'ดังนั้น <b>ปริมาตรเท่ากับ ' + U(V, 'ลบ.ซม.') + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: ถ้าหน้าตัดเป็นสี่เหลี่ยม ' + b + '×' + h +
          ' จะได้ ' + U(b * h * len, 'ลบ.ซม.') + ' · สามเหลี่ยมเป็นครึ่งหนึ่ง จึงได้ ' +
          U(V, 'ลบ.ซม.') + ' ✓</span>'
      }
    };
  }
});

T({
  id: 'm2v-cylvol', topic: 204, sub: 'ทรงกระบอก', level: 'ง่าย',
  skills: ['ปริมาตรทรงกระบอก', 'ใช้ค่า π ที่กำหนด'],
  gen(R, c) {

    return {
      stem: 'ถังทรงกระบอกมีรัศมีฐาน ' + U(r, 'ซม.') + ' และสูง ' + U(h, 'ซม.') + '<br>' +
        'จงหา<b>ปริมาตร</b> (กำหนดให้ ' + M('pi = ' + piTxt(c.piMode)) + ')',
      figure: figCylinder({ r: r, h: h, unit: 'ซม.' }),
      given: [{ s: 'รัศมีฐาน', v: r, unit: 'ซม.', d: '' },
              { s: 'ความสูง', v: h, unit: 'ซม.', d: '' },
              { s: 'π', v: piTxt(c.piMode), d: 'ค่าที่กำหนดให้ใช้' }],
      finds: [{ s: 'ปริมาตร', unit: 'ลบ.ซม.', d: 'ปริมาตรของทรงกระบอก', value: V, positive: true }],
      distract: [r2(c.pi * r * h), r2(2 * c.pi * r * h), r2(c.pi * r * r), r2(V * 2)],
      sol: {
        analyze: 'ทรงกระบอกคือ<b>ปริซึมที่ฐานเป็นวงกลม</b> จึงใช้สูตรเดียวกับปริซึม คือพื้นที่ฐาน × สูง<br>' +
          'พื้นที่ฐานของวงกลมคือ ' + M('pi r^2') + ' — สังเกตว่า<b>รัศมีต้องยกกำลังสอง</b><br>' +
          '<b>กับดักของข้อนี้:</b> ลืมยกกำลังสองรัศมี จะได้ ' + U(round2(c.pi * r * h), 'ลบ.ซม.') +
          ' ซึ่งน้อยกว่าความจริงมาก',
        eqs: [{ eq: 'พื้นที่ฐาน = pi r^2', why: 'ฐานเป็นวงกลมรัศมี r' },
              { eq: 'ปริมาตรทรงกระบอก = pi r^2 h', why: 'พื้นที่ฐานคูณความสูง ตามหลักของปริซึม' }],
        solve: EQ('V = pi r^2 h'),
        subst: SEQ('V = {pi} × {r}^2 × {h}', { pi: piTxt(c.piMode), r: r, h: h }),
        calc: EQ('V = ' + piTxt(c.piMode) + ' × ' + (r * r) + ' × ' + h, 'V = ' + fmtq(V) + ' `ลบ.ซม.`'),
        conclude: 'ดังนั้น <b>ปริมาตรเท่ากับ ' + U(V, 'ลบ.ซม.') + '</b><br>' +
          '<span class="hint">แปลงเป็นลิตรได้ด้วย: ' + M('1,000 `ลบ.ซม.` = 1 `ลิตร`') + ' ดังนั้นถังนี้จุได้ประมาณ ' +
          fmtq(V / 1000, 3) + ' ลิตร</span>'
      }
    };
  }
});

              { eq: 'พื้นที่ผิวข้าง = เส้นรอบวง × สูง = 2 pi r h', why: 'พื้นที่สี่เหลี่ยมผืนผ้าที่คลี่ออกมา' }],
        solve: EQ('เส้นรอบวง = 2 × ' + piTxt(c.piMode) + ' × ' + r, 'พื้นที่ผิวข้าง = เส้นรอบวง × ' + h),

          'ถ้าโจทย์ถามพื้นที่ผิวทั้งหมด ต้องบวกวงกลมสองวงเข้าไปอีก ' +
