/* ============================================================================
   6) การวิเคราะห์ผู้เรียนและสถิติ
   ========================================================================== */

function mean(a) { return a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0; }
function median(a) {
  if (!a.length) return 0;
  const b = a.slice().sort((x, y) => x - y), n = b.length;
  return n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2;
}
function stdev(a) {
  if (a.length < 2) return 0;
  const m = mean(a);
  return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1));
}
function pctCls(p) { return p >= 80 ? 'ok' : p >= 60 ? '' : p >= 40 ? 'warn' : 'bad'; }

/** วิเคราะห์ผลการทำหนึ่งครั้ง แยกตามเรื่อง ระดับ และทักษะ */
function analyze(a) {
  const q = quizOf(a);
  const probs = problemsOf(q);
  const res = {
    quiz: q, n: probs.length, got: 0, max: probs.length, pct: 0,
    byTopic: {}, byLevel: {}, bySkill: {}, bySub: {},
    sec: 0, revealed: 0, items: []
  };
  const add = (bag, key, sc) => {
    if (!bag[key]) bag[key] = { got: 0, max: 0 };
    bag[key].got += sc; bag[key].max += 1;
  };
  probs.forEach((p, i) => {
    const it = a.answers[i] || { score: 0, sec: 0, revealed: false };
    const sc = it.score || 0;
    res.got += sc; res.sec += it.sec || 0;
    if (it.revealed) res.revealed++;
    // ข้อที่สร้างไม่ได้ (ใบงานอ้างแม่แบบที่ไฟล์รุ่นนี้ยังไม่มี) — นับคะแนนแต่ไม่แจกแจงตามเรื่อง
    if (!p) { res.items.push({ i: i, p: null, it: it, score: sc }); return; }
    add(res.byTopic, p.topic, sc);
    add(res.byLevel, p.level, sc);
    add(res.bySub, p.sub, sc);
    (p.skills || []).forEach(sk => add(res.bySkill, sk, sc));
    res.items.push({ i: i, p: p, it: it, score: sc });
  });
  res.pct = res.max ? res.got / res.max * 100 : 0;
  Object.values(res.byTopic).concat(Object.values(res.byLevel), Object.values(res.bySkill), Object.values(res.bySub))
    .forEach(o => o.pct = o.max ? o.got / o.max * 100 : 0);
  return res;
}

/** รวมผลหลายครั้งของผู้เรียนคนเดียว ใช้ทำ "สรุปผลการเรียนสะสม" */
function analyzeMany(list) {
  const acc = { n: 0, got: 0, max: 0, byTopic: {}, byLevel: {}, bySkill: {}, bySub: {}, sec: 0 };
  const merge = (dst, src) => {
    Object.keys(src).forEach(k => {
      if (!dst[k]) dst[k] = { got: 0, max: 0 };
      dst[k].got += src[k].got; dst[k].max += src[k].max;
    });
  };
  list.forEach(a => {
    const r = analyze(a);
    acc.n++; acc.got += r.got; acc.max += r.max; acc.sec += r.sec;
    merge(acc.byTopic, r.byTopic); merge(acc.byLevel, r.byLevel);
    merge(acc.bySkill, r.bySkill); merge(acc.bySub, r.bySub);
  });
  acc.pct = acc.max ? acc.got / acc.max * 100 : 0;
  [acc.byTopic, acc.byLevel, acc.bySkill, acc.bySub].forEach(b =>
    Object.values(b).forEach(o => o.pct = o.max ? o.got / o.max * 100 : 0));
  return acc;
}

/** แถบเปอร์เซ็นต์แบบ HTML — พิมพ์ออกกระดาษได้ */
function barRows(bag, labelFn) {
  const keys = Object.keys(bag);
  if (!keys.length) return '<div class="hint">— ไม่มีข้อมูล —</div>';
  keys.sort((a, b) => bag[a].pct - bag[b].pct);
  return '<div>' + keys.map(k => {
    const o = bag[k];
    return '<div style="margin-bottom:9px"><div class="row" style="gap:6px;margin-bottom:3px">' +
      '<span class="grow">' + (labelFn ? labelFn(k) : esc(k)) + '</span>' +
      '<span style="font-variant-numeric:tabular-nums">' + fmt(o.got) + '/' + o.max + ' = <b>' + Math.round(o.pct) + '%</b></span></div>' +
      '<div class="bar ' + pctCls(o.pct) + '"><i style="width:' + Math.max(1, Math.round(o.pct)) + '%"></i></div></div>';
  }).join('') + '</div>';
}

/** ข้อเสนอแนะอัตโนมัติจากผลการวิเคราะห์ */
function advice(res) {
  const out = [];
  const pass = DB.settings.passPct;
  if (res.pct >= 80) out.push({ k: 'ok', t: 'ทำได้ดีมาก (' + Math.round(res.pct) + '%) เข้าใจเนื้อหาในระดับที่นำไปต่อยอดได้ ควรลองเพิ่มสัดส่วนโจทย์ระดับยากในชุดถัดไป' });
  else if (res.pct >= pass) out.push({ k: 'ok', t: 'ผ่านเกณฑ์ (' + Math.round(res.pct) + '% จากเกณฑ์ ' + pass + '%) พื้นฐานใช้ได้ แต่ยังมีจุดที่ควรเก็บให้แน่นตามรายการด้านล่าง' });
  else out.push({ k: 'bad', t: 'ยังไม่ผ่านเกณฑ์ (' + Math.round(res.pct) + '% จากเกณฑ์ ' + pass + '%) ควรทบทวนหัวข้อที่ระบุด้านล่างแล้วทำชุดโจทย์ระดับง่ายซ้ำก่อน' });

  const weakSkill = Object.keys(res.bySkill).filter(k => res.bySkill[k].max >= 2 && res.bySkill[k].pct < 50);
  weakSkill.sort((a, b) => res.bySkill[a].pct - res.bySkill[b].pct);
  weakSkill.slice(0, 4).forEach(sk =>
    out.push({ k: 'bad', t: 'ทักษะ "<b>' + esc(sk) + '</b>" ทำได้ ' + Math.round(res.bySkill[sk].pct) + '% — เป็นจุดที่ควรทบทวนก่อนเรื่องอื่น' }));

  const weakSub = Object.keys(res.bySub).filter(k => res.bySub[k].max >= 1 && res.bySub[k].pct < 50);
  if (weakSub.length) out.push({ k: 'warn', t: 'หัวข้อที่ควรกลับไปทบทวน: <b>' + weakSub.map(esc).join(', ') + '</b>' });

  const strong = Object.keys(res.bySkill).filter(k => res.bySkill[k].max >= 2 && res.bySkill[k].pct >= 80);
  if (strong.length) out.push({ k: 'ok', t: 'จุดแข็ง: <b>' + strong.slice(0, 5).map(esc).join(', ') + '</b>' });

  LEVELS.forEach(l => {
    const o = res.byLevel[l];
    if (o && o.max >= 2 && o.pct < 40)
      out.push({ k: 'warn', t: 'โจทย์ระดับ<b>' + l + '</b>ทำได้เพียง ' + Math.round(o.pct) + '% — ' +
        (l === 'ง่าย' ? 'ควรกลับไปทบทวนนิยามและสูตรพื้นฐานก่อน'
         : l === 'ปานกลาง' ? 'ควรฝึกการเลือกสมการให้ตรงกับสิ่งที่โจทย์ให้และสิ่งที่ถาม'
         : 'ควรฝึกโจทย์ที่ต้องแบ่งเป็นหลายขั้นตอนและตั้งระบบสมการ') });
  });

  if (res.revealed >= Math.ceil(res.n / 2))
    out.push({ k: 'warn', t: 'เปิดดูวิธีทำก่อนตอบไป ' + res.revealed + ' จาก ' + res.n + ' ข้อ — ' +
      'ครั้งหน้าลองเขียนสิ่งที่โจทย์กำหนดและเลือกสมการด้วยตัวเองก่อน แล้วค่อยเปิดเฉลยเทียบ' });

  const avg = res.n ? res.sec / res.n : 0;
  if (avg > 180) out.push({ k: 'warn', t: 'ใช้เวลาเฉลี่ยข้อละ ' + mmss(avg) + ' ซึ่งค่อนข้างนาน — ควรฝึกจนคุ้นกับการเลือกสมการให้เร็วขึ้น' });
  else if (avg > 0 && avg < 25 && res.pct < pass)
    out.push({ k: 'warn', t: 'ใช้เวลาเฉลี่ยเพียงข้อละ ' + mmss(avg) + ' และคะแนนยังไม่ผ่าน — ลองอ่านโจทย์ให้ละเอียดและเขียนสิ่งที่กำหนดให้ครบก่อนคำนวณ' });
  return out;
}

  h += '<div class="card"><h3>สรุปผลการเรียนสะสม<span class="sub">รวม ' + all.n + ' ครั้ง · ' +

    });

}

/** กราฟเส้นเล็ก ๆ แสดงแนวโน้มคะแนน */
function sparkline(pcts) {
  const W = 420, H = 90, ox = 30, oy = 72, w = W - ox - 14, h = 56;
  const n = pcts.length;
  const px = i => ox + (n === 1 ? w / 2 : w * i / (n - 1));
  const py = v => oy - h * (v / 100);
  let s = '';
  [0, 50, 100].forEach(v => {
    s += '<line class="dash" x1="' + ox + '" y1="' + n1(py(v)) + '" x2="' + (ox + w) + '" y2="' + n1(py(v)) + '"/>';
    s += svgTxt(ox - 5, py(v) + 4, v + '%', 'end', true);
  });
  s += '<polyline class="frc" points="' + pcts.map((v, i) => n1(px(i)) + ',' + n1(py(v))).join(' ') + '"/>';
  pcts.forEach((v, i) => { s += '<circle class="arh" cx="' + n1(px(i)) + '" cy="' + n1(py(v)) + '" r="3.5"/>'; });
  return svgWrap(W, H, s);
}

function renderStats() {
  const quizzes = DB.quizzes.filter(q => DB.attempts.some(a => a.quizId === q.id && a.finishedAt));
  if (!quizzes.length) {
    $('#pane-stats').innerHTML = '<div class="card"><h3>ยังไม่มีข้อมูลสถิติ</h3>' +
      '<div class="hint">ต้องมีผู้เรียนทำชุดโจทย์จนจบอย่างน้อยหนึ่งคนก่อน สถิติจึงจะแสดงที่นี่<br>' +
      'ในโหมดครู ให้สลับผู้เรียนที่แถบบนแล้วให้แต่ละคนทำชุดเดียวกัน ระบบจะเปรียบเทียบผลให้อัตโนมัติ</div></div>' +
      cloudPullCardHTML() + importCardHTML();
    bindCloudPullCard(); bindImportCard();
    return;
  }
  if (!DB.cur.statQuizId || !quizzes.some(q => q.id === DB.cur.statQuizId)) DB.cur.statQuizId = quizzes[quizzes.length - 1].id;
  const q = quizzes.find(x => x.id === DB.cur.statQuizId);
  const probs = problemsOf(q);

  // เอาผลครั้งล่าสุดของแต่ละคน (คนเดิมทำซ้ำได้ แต่ให้นับครั้งล่าสุด)
  const byWho = {};
  DB.attempts.filter(a => a.quizId === q.id && a.finishedAt).forEach(a => {
    const key = a.studentId || ('solo:' + (a.soloName || ''));
    if (!byWho[key] || a.finishedAt > byWho[key].finishedAt) byWho[key] = a;
  });
  const rows = Object.values(byWho).map(a => ({ a: a, r: analyze(a) }))
    .sort((x, y) => y.r.pct - x.r.pct);
  const pcts = rows.map(x => x.r.pct);

  let h = '<div class="card noprint"><div class="row"><label for="selQz">ชุดโจทย์</label>' +
    '<select id="selQz" class="grow" style="max-width:520px">' +
    quizzes.map(x => '<option value="' + x.id + '"' + (x.id === q.id ? ' selected' : '') + '>' +
      esc(x.title) + ' (' + x.items.length + ' ข้อ)</option>').join('') + '</select>' +
    '<button class="sm" id="btnStatPrint">พิมพ์รายงาน</button></div></div>';

  h += '<div class="card"><h3>ภาพรวมชั้นเรียน<span class="sub">' + esc(q.title) + '</span></h3><div class="statgrid">' +
    '<div class="stat"><div class="v">' + rows.length + '</div><div class="k">จำนวนผู้ทำ</div></div>' +
    '<div class="stat"><div class="v">' + fmt(mean(pcts), 1) + '%</div><div class="k">ค่าเฉลี่ย</div></div>' +
    '<div class="stat"><div class="v">' + fmt(median(pcts), 1) + '%</div><div class="k">มัธยฐาน</div></div>' +
    '<div class="stat"><div class="v">' + fmt(stdev(pcts), 1) + '</div><div class="k">ส่วนเบี่ยงเบนมาตรฐาน</div></div>' +
    '<div class="stat"><div class="v">' + fmt(Math.max.apply(null, pcts), 0) + '%</div><div class="k">สูงสุด</div></div>' +
    '<div class="stat"><div class="v">' + fmt(Math.min.apply(null, pcts), 0) + '%</div><div class="k">ต่ำสุด</div></div>' +
    '<div class="stat"><div class="v">' + rows.filter(x => x.r.pct >= DB.settings.passPct).length + '</div>' +
      '<div class="k">ผ่านเกณฑ์ ' + DB.settings.passPct + '%</div></div>' +
    '</div>';
  h += '<div style="margin-top:14px"><b>การกระจายของคะแนน</b>' + histogram(pcts) + '</div></div>';

  const showId = DB.mode === 'class';
  h += '<div class="card"><h3>ผลรายคน<span class="sub">เรียงตามคะแนน</span></h3><div class="tablewrap"><table><thead><tr>' +
    '<th class="num">อันดับ</th>' + (showId ? '<th class="num">เลขที่</th><th class="num">เลขประจำตัว</th>' : '') +
    '<th>ชื่อ</th><th class="num">คะแนน</th><th class="num">ร้อยละ</th>' +
    '<th>ผล</th><th class="num">เวลา</th><th>จุดที่ต้องพัฒนา</th></tr></thead><tbody>';
  rows.forEach((x, k) => {
    const weak = Object.keys(x.r.bySub).filter(s => x.r.bySub[s].pct < 50);
    const wi = whoInfo(x.a);
    h += '<tr><td class="num">' + (k + 1) + '</td>' +
      (showId ? '<td class="num">' + esc(wi.no || '—') + '</td><td class="num">' + esc(wi.sid || '—') + '</td>' : '') +
      '<td>' + esc(wi.name) + '</td>' +
      '<td class="num">' + fmt(x.r.got) + '/' + x.r.max + '</td>' +
      '<td class="num">' + Math.round(x.r.pct) + '%</td>' +
      '<td>' + (x.r.pct >= DB.settings.passPct ? '<span style="color:var(--ok)">ผ่าน</span>'
        : '<span style="color:var(--bad)">ไม่ผ่าน</span>') + '</td>' +
      '<td class="num">' + mmss(x.r.sec) + '</td>' +
      '<td style="white-space:normal">' + (weak.length ? esc(weak.join(', ')) : '—') + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  // วิเคราะห์รายข้อ
  h += '<div class="card"><h3>วิเคราะห์รายข้อ<span class="sub">ค่าความยาก (p) และอำนาจจำแนก (r)</span></h3>' +
    '<div class="hint" style="margin-bottom:9px">' +
    '<b>p</b> = สัดส่วนผู้ตอบถูก · ยิ่งใกล้ 1 ยิ่งง่าย (เหมาะสมประมาณ 0.20–0.80)<br>' +
    '<b>r</b> = ผลต่างระหว่างกลุ่มเก่ง 27% บนกับกลุ่มอ่อน 27% ล่าง · ยิ่งสูงยิ่งจำแนกคนเก่ง-อ่อนได้ดี (ควร ≥ 0.20)' +
    (rows.length < 6 ? '<br><b>หมายเหตุ:</b> มีผู้ทำเพียง ' + rows.length + ' คน ค่า r ยังเชื่อถือได้ไม่มาก ควรมีอย่างน้อย 6–10 คน' : '') +
    '</div><div class="tablewrap"><table><thead><tr><th class="num">ข้อ</th><th>หัวข้อ</th><th>ระดับ</th>' +
    '<th class="num">ตอบถูก</th><th class="num">p</th><th class="num">r</th><th>ตีความ</th></tr></thead><tbody>';
  const nG = Math.max(1, Math.round(rows.length * 0.27));
  const hi = rows.slice(0, nG), lo = rows.slice(-nG);
  probs.forEach((p, i) => {
    if (!p) {
      h += '<tr><td class="num">' + (i + 1) + '</td>' +
        '<td colspan="6" class="hint">ข้อนี้ใช้โจทย์จากบทที่โปรแกรมรุ่นนี้ยังไม่มี — อัปเดตไฟล์แล้วดูใหม่</td></tr>';
      return;
    }
    const sc = rows.map(x => (x.a.answers[i] || {}).score || 0);
    const pv = mean(sc);
    const rv = rows.length >= 2 ? mean(hi.map(x => (x.a.answers[i] || {}).score || 0)) - mean(lo.map(x => (x.a.answers[i] || {}).score || 0)) : 0;
    let note = [];
    if (pv < 0.2) note.push('ยากมาก ทั้งห้องพลาด');
    else if (pv > 0.85) note.push('ง่ายมาก');
    else note.push('ความยากเหมาะสม');
    if (rows.length >= 6) { if (rv < 0.2) note.push('จำแนกได้น้อย ควรทบทวนตัวโจทย์'); else note.push('จำแนกได้ดี'); }
    h += '<tr><td class="num">' + (i + 1) + '</td><td>' + esc(p.sub) + '</td>' +
      '<td><span class="tag ' + LEVEL_CLS[p.level] + '">' + p.level + '</span></td>' +
      '<td class="num">' + fmt(sc.reduce((s, v) => s + v, 0)) + '/' + rows.length + '</td>' +
      '<td class="num">' + fmt(pv, 2) + '</td><td class="num">' + fmt(rv, 2) + '</td>' +
      '<td style="white-space:normal">' + esc(note.join(' · ')) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';

  // ข้อที่พลาดบ่อย
  const missed = probs.map((p, i) => ({ p: p, i: i, pv: mean(rows.map(x => (x.a.answers[i] || {}).score || 0)) }))
    .filter(x => x.p && x.pv < 0.5).sort((a, b) => a.pv - b.pv);
  h += '<div class="card"><h3>ประเด็นที่ควรสอนซ่อมเสริม</h3>';
  if (!missed.length) h += '<div class="notice info">ไม่มีข้อใดที่ทั้งห้องทำได้ต่ำกว่าครึ่ง — ภาพรวมเข้าใจดี</div>';
  else {
    const subs = {};
    missed.forEach(x => { subs[x.p.sub] = (subs[x.p.sub] || 0) + 1; });
    h += '<div class="notice warn">หัวข้อที่ทั้งห้องทำได้ต่ำกว่า 50%: <b>' +
      Object.keys(subs).map(s => esc(s) + ' (' + subs[s] + ' ข้อ)').join(', ') + '</b></div>';
    h += '<ul style="margin:8px 0 0;padding-left:20px">' + missed.slice(0, 8).map(x =>
      '<li>ข้อ ' + (x.i + 1) + ' — ' + esc(x.p.sub) + ' (' + x.p.level + ') ตอบถูก ' + Math.round(x.pv * 100) + '%' +
      (x.p.skills.length ? ' · ทักษะ: ' + esc(x.p.skills.join(', ')) : '') + '</li>').join('') + '</ul>';
  }
  const need = rows.filter(x => x.r.pct < DB.settings.passPct);
  if (need.length) h += '<div class="notice bad" style="margin-top:10px">ผู้เรียนที่ควรได้รับการช่วยเหลือ (' +
    need.length + ' คน): <b>' + need.map(x => esc(attemptWho(x.a))).join(', ') + '</b></div>';
  h += '</div>';

  // ส่งออกคะแนนไปยังโปรแกรมบันทึกคะแนน
  const done = rows.length;
  const total = (DB.mode === 'class' && DB.cur.classId)
    ? DB.students.filter(s => s.classId === DB.cur.classId).length : done;
  h += '<div class="card noprint"><h3>ส่งออกคะแนน<span class="sub">' + esc(q.title) + '</span></h3>' +
    '<div class="hint" style="margin-bottom:11px">คัดลอกคะแนนเป็นคอลัมน์เดียวเรียงตามเลขที่ ' +
    'แล้วไปวางในช่องแรกของคอลัมน์คะแนนใน <b>gradebook.html</b> ได้ทันที' +
    (total > done ? '<br><span style="color:var(--warn)">ยังมี ' + (total - done) +
      ' คนที่ไม่ได้ทำ — แถวของคนเหล่านั้นจะเว้นว่างไว้ ตำแหน่งแถวจึงยังตรงกับสมุดคะแนน</span>' : '') +
    '</div><div class="row"><button class="primary" id="btnCopyScore">คัดลอกคอลัมน์คะแนน</button>' +
    '<button id="btnCsvScore">ดาวน์โหลด CSV แบบเต็ม</button></div></div>';

  h += cloudPullCardHTML() + importCardHTML();

  $('#pane-stats').innerHTML = h;
  $('#selQz').addEventListener('change', e => { DB.cur.statQuizId = e.target.value; save(); renderStats(); });
  $('#btnStatPrint').addEventListener('click', () => { DB.cur.printKind = 'classreport'; save(); setTab('print'); });
  $('#btnCopyScore').addEventListener('click', () => exportScoreColumn(q.id));
  $('#btnCsvScore').addEventListener('click', () => exportScoreCsv(q.id));
  bindCloudPullCard(); bindImportCard();
}

/** ฮิสโทแกรมการกระจายคะแนนเป็นช่วงละ 10% */
function histogram(pcts) {
  const bins = new Array(10).fill(0);
  pcts.forEach(p => bins[clamp(Math.floor(p / 10), 0, 9)]++);
  const maxB = Math.max(1, Math.max.apply(null, bins));
  const W = 440, H = 170, ox = 34, oy = 128, w = W - ox - 12, h = 100;
  const bw = w / 10;
  let s = '';
  s += '<line class="ln2" x1="' + ox + '" y1="' + oy + '" x2="' + (ox + w) + '" y2="' + oy + '"/>';
  s += '<line class="ln2" x1="' + ox + '" y1="' + oy + '" x2="' + ox + '" y2="' + (oy - h) + '"/>';
  bins.forEach((n, i) => {
    const bh = h * n / maxB;
    s += '<rect class="bdy" x="' + n1(ox + i * bw + 2) + '" y="' + n1(oy - bh) + '" width="' + n1(bw - 4) +
      '" height="' + n1(bh) + '" rx="2"/>';
    if (n) s += svgTxt(ox + i * bw + bw / 2, oy - bh - 4, String(n), 'middle');
    if (i % 2 === 0) s += svgTxt(ox + i * bw, oy + 15, String(i * 10), 'middle', true);
  });
  s += svgTxt(ox + w, oy + 15, '100', 'middle', true);
  s += svgTxt(ox + w / 2, oy + 32, 'ช่วงคะแนน (ร้อยละ)', 'middle', true);
  s += svgTxt(ox - 6, oy - h + 4, 'คน', 'end', true);
  return svgWrap(W, H, s);
}

    const ids = studentsOf(c.id).map(s => s.id);

  const rs = $('#btnRs2'); if (rs) rs.addEventListener('click', restore);

    DB = defaultDB();

  });

/* ============================================================================
   อ่านไฟล์ตาราง — .xlsx / .csv / .txt  โดยไม่พึ่งไลบรารีภายนอก
   .xlsx คือไฟล์ ZIP ที่ข้างในเป็น XML จึงแกะ ZIP เองแล้วคลายบีบอัดด้วย
   DecompressionStream ที่มีมากับเบราว์เซอร์ (Safari 16.4+ / Chrome 80+)
   ========================================================================== */

/** แกะรายการไฟล์ใน ZIP — คืน Map(ชื่อไฟล์ → {method, bytes}) */
function unzipEntries(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  // มองหา End of Central Directory จากท้ายไฟล์ (ท้ายอาจมีคอมเมนต์ต่อท้ายได้ถึง 64KB)
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65558); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('ไม่ใช่ไฟล์ ZIP/xlsx ที่ถูกต้อง');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = new Map();
  const dec = new TextDecoder('utf-8');
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    // ความยาว extra ใน local header ต่างจากใน central directory ได้ ต้องอ่านซ้ำ
    if (dv.getUint32(lho, true) === 0x04034b50) {
      const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lelen;
      out.set(name, { method: method, bytes: u8.subarray(start, start + csize) });
    }
    p += 46 + nlen + elen + clen;
  }
  return out;
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream !== 'function') {
    throw new Error('เบราว์เซอร์รุ่นนี้เปิดไฟล์ .xlsx ไม่ได้ — ให้บันทึกเป็น .csv แล้วลองใหม่');
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function zipText(zip, name) {
  const e = zip.get(name);
  if (!e) return null;
  const raw = e.method === 0 ? e.bytes : await inflateRaw(e.bytes);
  return new TextDecoder('utf-8').decode(raw);
}

/** อ่านแอตทริบิวต์โดยดูจากชื่อท้าย (เลี่ยงปัญหา namespace เช่น r:id) */
function xmlAttr(el, localName) {
  for (let i = 0; i < el.attributes.length; i++) {
    const a = el.attributes[i];
    if (a.name === localName || a.name.endsWith(':' + localName)) return a.value;
  }
  return null;
}
function parseXML(text) {
  const d = new DOMParser().parseFromString(text, 'application/xml');
  if (d.getElementsByTagName('parsererror').length) throw new Error('อ่านไฟล์ไม่สำเร็จ (XML เสีย)');
  return d;
}
/** "AB12" → 27 (นับจาก 0) */
function colIndex(ref) {
  let n = 0;
  for (let i = 0; i < ref.length; i++) {
    const c = ref.charCodeAt(i);
    if (c >= 65 && c <= 90) n = n * 26 + (c - 64); else break;
  }
  return n - 1;
}

/** รายชื่อชีตในไฟล์ xlsx ตามลำดับที่เห็นในโปรแกรม Excel */
async function xlsxSheets(zip) {
  const wbText = await zipText(zip, 'xl/workbook.xml');
  if (!wbText) throw new Error('ไม่พบข้อมูลสมุดงานในไฟล์นี้');
  const relText = await zipText(zip, 'xl/_rels/workbook.xml.rels');
  const rel = {};
  if (relText) {
    Array.from(parseXML(relText).getElementsByTagName('Relationship')).forEach(r => {
      let t = r.getAttribute('Target') || '';
      t = t.replace(/^\/xl\//, '').replace(/^\.\//, '');
      rel[r.getAttribute('Id')] = t.indexOf('xl/') === 0 ? t : 'xl/' + t;
    });
  }
  const list = [];
  Array.from(parseXML(wbText).getElementsByTagName('sheet')).forEach((s, i) => {
    const rid = xmlAttr(s, 'id');
    const path = (rid && rel[rid]) || ('xl/worksheets/sheet' + (i + 1) + '.xml');
    if (zip.has(path)) list.push({ name: s.getAttribute('name') || ('ชีต ' + (i + 1)), path: path });
  });
  if (!list.length) throw new Error('ไม่พบชีตข้อมูลในไฟล์นี้');
  return list;
}

/** อ่านชีตหนึ่งเป็นตาราง 2 มิติของข้อความ */
async function xlsxRows(zip, path) {
  const shText = await zipText(zip, 'xl/sharedStrings.xml');
  const shared = [];
  if (shText) {
    Array.from(parseXML(shText).getElementsByTagName('si')).forEach(si => {
      // ข้อความหนึ่งช่องอาจถูกซอยเป็นหลาย <t> เมื่อมีการจัดรูปแบบต่างกัน
      shared.push(Array.from(si.getElementsByTagName('t')).map(t => t.textContent).join(''));
    });
  }
  const doc = parseXML(await zipText(zip, path));
  const rows = [];
  Array.from(doc.getElementsByTagName('row')).forEach(row => {
    const cells = [];
    Array.from(row.getElementsByTagName('c')).forEach(c => {
      const idx = colIndex(c.getAttribute('r') || '');
      const type = c.getAttribute('t');
      let v = '';
      if (type === 'inlineStr') {
        v = Array.from(c.getElementsByTagName('t')).map(t => t.textContent).join('');
      } else {
        const vn = c.getElementsByTagName('v')[0];
        const raw = vn ? vn.textContent : '';
        v = type === 's' ? (shared[Number(raw)] || '') : raw;
      }
      if (idx >= 0) { while (cells.length < idx) cells.push(''); cells[idx] = String(v).trim(); }
      else cells.push(String(v).trim());
    });
    rows.push(cells);
  });
  return rows;
}

/** อ่าน CSV/TSV — รองรับเครื่องหมายคำพูด คอมมาในชื่อ และ BOM */
function parseDelimited(text) {
  let s = String(text || '').replace(/^﻿/, '');
  // เดาตัวคั่นจากบรรทัดแรก
  const first = s.split(/\r?\n/)[0] || '';
  const tabs = (first.match(/\t/g) || []).length;
  const semis = (first.match(/;/g) || []).length;
  const commas = (first.match(/,/g) || []).length;
  const D = tabs >= commas && tabs >= semis ? '\t' : (semis > commas ? ';' : ',');
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === D) { row.push(cell.trim()); cell = ''; }
    else if (ch === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell.trim()); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}

/** อ่านไฟล์ที่ผู้ใช้เลือก คืน [{name, rows}] */
async function readTableFile(file) {
  const nm = String(file.name || '').toLowerCase();
  if (/\.(csv|txt|tsv)$/.test(nm)) {
    return [{ name: file.name, rows: parseDelimited(await file.text()) }];
  }
  if (/\.xls$/.test(nm)) {
    throw new Error('ไฟล์ .xls รุ่นเก่าอ่านไม่ได้ — เปิดใน Excel แล้วบันทึกเป็น .xlsx หรือ .csv ก่อน');
  }
  const zip = unzipEntries(await file.arrayBuffer());
  const sheets = await xlsxSheets(zip);
  const out = [];
  for (const s of sheets) out.push({ name: s.name, rows: await xlsxRows(zip, s.path) });
  return out;
}

/* --- จับคู่คอลัมน์อัตโนมัติ ---------------------------------------------- */
const COLKEYS = [
  { k: 'no',   label: 'เลขที่',        re: /^(เลขที่|ที่|ลำดับ(ที่)?|no\.?|number|order)$/i },
  { k: 'sid',  label: 'เลขประจำตัว',   re: /(เลขประจำตัว|รหัส|student\s*id|^sid$|^id$|^code$)/i },
  { k: 'name', label: 'ชื่อ-นามสกุล',  re: /(ชื่อ|นาม|name)/i },
  { k: 'cls',  label: 'ชั้น',          re: /(ชั้น|ห้อง|ระดับชั้น|class|room)/i }
];
/** เดาว่าแถวไหนคือหัวตาราง และคอลัมน์ไหนคืออะไร */
function guessLayout(rows) {
  let headRow = -1, map = { no: -1, sid: -1, name: -1, cls: -1 };
  let bestRow = -1, bestMap = null, bestHits = 0;
  for (let r = 0; r < Math.min(8, rows.length); r++) {
    const m = { no: -1, sid: -1, name: -1, cls: -1 };
    const used = {};
    let hits = 0;
    rows[r].forEach((cell, i) => {
      const t = String(cell || '').replace(/\s+/g, '');
      if (!t || used[i]) return;
      for (const ck of COLKEYS) {
        if (m[ck.k] < 0 && ck.re.test(t)) { m[ck.k] = i; used[i] = 1; hits++; break; }
      }
    });
    if (m.name >= 0 && hits >= 2) { headRow = r; map = m; break; }
    // จำแถวที่ใกล้เคียงที่สุดไว้ เผื่อไม่มีแถวไหนเข้าเกณฑ์เต็ม
    // แต่ต้องไม่มีช่องไหนเป็นตัวเลขล้วน ไม่งั้นแถวข้อมูลของนักเรียนที่ชื่อมีคำว่า
    // "นาม" หรือ "ชื่อ" จะถูกเข้าใจผิดว่าเป็นหัวตารางแล้วหายไปทั้งคน
    const hasBareNumber = rows[r].some(c => /^\d+(\.\d+)?$/.test(String(c == null ? '' : c).trim()));
    if (m.name >= 0 && hits > bestHits && !hasBareNumber) { bestHits = hits; bestRow = r; bestMap = m; }
  }
  // หัวตารางที่ใช้คำแปลก ๆ (เช่น "นาม", "รหัส") ก็ยังต้องถูกตัดออกจากรายชื่อ
  // ไม่งั้นหัวตารางจะกลายเป็นนักเรียนคนแรกไปเลย
  if (headRow < 0 && bestRow >= 0) { headRow = bestRow; map = bestMap; }
  if (headRow < 0) {
    // ไม่มีหัวตาราง — เดาจากรูปแบบข้อมูล: คอลัมน์ที่เป็นตัวอักษรยาวสุดคือชื่อ
    const width = rows.reduce((w, r) => Math.max(w, r.length), 0);
    let bestName = -1, bestScore = -1;
    for (let i = 0; i < width; i++) {
      const vals = rows.slice(0, 30).map(r => String(r[i] || '')).filter(Boolean);
      if (!vals.length) continue;
      const textish = vals.filter(v => /[^\d\s.\-]/.test(v)).length / vals.length;
      const avgLen = vals.reduce((s, v) => s + v.length, 0) / vals.length;
      const score = textish * 10 + Math.min(avgLen, 20) / 20;
      if (score > bestScore) { bestScore = score; bestName = i; }
    }
    map.name = bestName;
    // คอลัมน์ตัวเลขก่อนหน้าชื่อ: ค่าน้อย = เลขที่, ค่ามาก = เลขประจำตัว
    for (let i = 0; i < map.name; i++) {
      const nums = rows.slice(0, 30).map(r => Number(r[i])).filter(n => isFinite(n) && n > 0);
      if (nums.length < Math.min(3, rows.length)) continue;
      const mx = Math.max.apply(null, nums);
      if (mx <= 200 && map.no < 0) map.no = i;
      else if (map.sid < 0) map.sid = i;
    }
  }
  return { headRow: headRow, map: map };
}

/** อ่านรายชื่อหนึ่งบรรทัด คืน {no, sid, name} — รองรับทั้งที่วางจาก Excel และที่พิมพ์เอง */
function parseRosterLine(line) {
  const s = String(line == null ? '' : line).replace(/ /g, ' ').trim();
  if (!s) return null;

  // วางจาก Excel จะมาเป็นแท็บ ส่วนวางจาก PDF/Word มักได้เว้นวรรคหลายเคาะ
  let cols = null;
  if (s.indexOf('\t') >= 0) cols = s.split('\t');
  else if (/ {2,}/.test(s)) cols = s.split(/ {2,}/);
  if (cols) {
    cols = cols.map(c => c.trim()).filter(c => c !== '');
    if (!cols.length) return null;
    if (cols.length >= 3) return { no: /^\d+$/.test(cols[0]) ? Number(cols[0]) : null, sid: cols[1], name: cols.slice(2).join(' ') };
    if (cols.length === 2) {
      if (!/^\d+$/.test(cols[0])) return { no: null, sid: '', name: cols.join(' ') };
      // เลขนำหน้าที่ใหญ่เกินจำนวนคนในห้อง แปลว่าเป็นเลขประจำตัว ไม่ใช่เลขที่
      return Number(cols[0]) <= 200
        ? { no: Number(cols[0]), sid: '', name: cols[1] }
        : { no: null, sid: cols[0], name: cols[1] };
    }
    return { no: null, sid: '', name: cols[0] };
  }

  // เว้นวรรคเดียว:  "1 12345 สมชาย ใจดี"  /  "1 สมชาย ใจดี"  /  "12345 สมชาย ใจดี"  /  "สมชาย ใจดี"
  let m = s.match(/^(\d{1,3})[.)]?\s+(\d{3,})\s+(.+)$/);
  if (m) return { no: Number(m[1]), sid: m[2], name: m[3].trim() };
  m = s.match(/^(\d+)[.)]?\s+(.+)$/);
  if (m) {
    const n = Number(m[1]);
    return n <= 200 ? { no: n, sid: '', name: m[2].trim() } : { no: null, sid: m[1], name: m[2].trim() };
  }
  return { no: null, sid: '', name: s };
}

/** อ่านทั้งก้อน แล้วไล่เลขที่ให้บรรทัดที่ไม่ได้ระบุ */
function parseRoster(text, startNo) {
  let next = startNo || 0;
  const rows = [];
  String(text == null ? '' : text).split('\n').forEach(line => {
    const r = parseRosterLine(line);
    if (!r || !r.name) return;
    if (r.no == null) r.no = ++next; else if (r.no > next) next = r.no;
    rows.push(r);
  });
  return rows;
}

/** ดึงผลจากชีตแล้วแปลงเป็น attempts เพื่อให้สถิติและเอกสารพิมพ์เดิมใช้ได้ทันที */
async function pullResults(code) {
  let rows, assigns;
  try {
    rows = await api('resultsList', code ? { code: code } : {});
    assigns = await api('assignList', {});
  } catch (e) { toast(e.message, 'bad'); return; }
  if (!rows.length) { toast('ยังไม่มีใครส่งผลของใบงานนี้', 'bad'); return; }

  // ถอดสเปกใบงานเป็นชุดโจทย์ในเครื่อง เพื่อให้ analyze() ทำงานได้
  const quizByCode = {};
  assigns.forEach(a => {
    const q = decodeQuiz(a.spec);
    if (!q) return;
    quizByCode[a.code] = q;
    if (!DB.quizzes.some(x => x.id === q.id)) DB.quizzes.push(q);
  });

  const st = { added: 0, dup: 0, skipped: 0, noQuiz: 0, unmatched: [] };
  rows.forEach(r => {
    const q = quizByCode[r.code];
    if (!q) { st.noQuiz++; return; }
    if (!Array.isArray(r.answers) || r.answers.length !== q.items.length) { st.skipped++; return; }
    const id = 'cloud:' + r.code + ':' + r.sid;
    if (DB.attempts.some(a => a.id === id)) { st.dup++; return; }
    const s = DB.students.find(x => String(x.sid || '').trim() === String(r.sid).trim());
    if (!s) st.unmatched.push(r.name || r.sid);
    DB.attempts.push({
      id: id, quizId: q.id, studentId: s ? s.id : null,
      soloName: s ? s.name : (r.name || String(r.sid)),
      sid: String(r.sid), no: String(r.no || ''), room: String(r.cls || ''),
      startedAt: new Date(r.ts).getTime() - (Number(r.sec) || 0) * 1000,
      finishedAt: new Date(r.ts).getTime(),
      answers: r.answers.map(a => ({
        raw: [], pick: null, checked: true,
        score: Number(a && a.s != null ? a.s : a) || 0,
        tries: Number(a && a.t) || 1, revealed: !!(a && a.r), sec: Number(a && a.c) || 0
      }))
    });
    st.added++;
  });
  Object.keys(PCACHE).forEach(k => delete PCACHE[k]);
  save(true); render();

  const uw = Array.from(new Set(st.unmatched));
  let m = '<b>ดึงผลเข้ามา ' + st.added + ' รายการ</b>';
  if (st.dup) m += '<br>ข้ามที่ดึงมาแล้ว ' + st.dup + ' รายการ';
  if (st.skipped) m += '<br><span style="color:var(--warn)">ข้าม ' + st.skipped +
    ' รายการ เพราะจำนวนข้อไม่ตรงกับใบงาน (อาจแก้ใบงานหลังมอบหมายไปแล้ว)</span>';
  if (st.noQuiz) m += '<br><span style="color:var(--bad)">ข้าม ' + st.noQuiz + ' รายการ เพราะอ่านสเปกใบงานไม่ได้</span>';
  if (uw.length) m += '<br><span style="color:var(--warn)">ไม่พบเลขประจำตัวเหล่านี้ในรายชื่อในเครื่อง: ' +
    esc(uw.slice(0, 10).join(', ')) + (uw.length > 10 ? ' …' : '') + '<br>' +
    'กด <b>ดึงรายชื่อจากชีต</b> ในแท็บตั้งค่าเพื่อให้ตรงกัน</span>';
  openModal({ title: 'ผลการดึงข้อมูล', bodyHTML: '<div style="line-height:1.9">' + m + '</div>' });
}

/* --- การส่งคำตอบขึ้นชีต พร้อมคิวสำรองเมื่อเน็ตหลุด ----------------------- */

function attemptPayload(a, status) {
  const r = analyze(a);
  return {
    code: a.assignCode, status: status,
    score: r.got, max: r.max, pct: Math.round(r.pct * 10) / 10, sec: Math.round(r.sec),
    revealed: a.answers.filter(x => x.revealed).length,
    answers: a.answers.map(x => ({ s: x.score, t: x.tries, r: x.revealed ? 1 : 0, c: Math.round(x.sec) })),
    device: deviceId()
  };
}

async function sendAttempt(a, status) {
  if (!isStudent() || !a || !a.assignCode) return false;
  const payload = attemptPayload(a, status);
  try {
    await api('submit', { payload: payload });
    if (status === 'final') { a.sentAt = Date.now(); save(true); }
    return true;
  } catch (e) {
    // เก็บเข้าคิวเฉพาะฉบับจริง ฉบับร่างปล่อยหายได้ เดี๋ยวรอบหน้าส่งใหม่อยู่แล้ว
    if (status === 'final') {
      DB.outbox = DB.outbox.filter(x => !(x.code === payload.code && x.status === 'final'));
      DB.outbox.push(payload);
      save(true);
      renderOutboxBadge();
    }
    return false;
  }
}

async function flushOutbox(loud) {
  if (!isStudent() || !DB.outbox.length) {
    if (loud) toast('ไม่มีผลค้างส่ง', 'ok');
    return;
  }
  const keep = [];
  let sent = 0;
  for (const p of DB.outbox.slice()) {
    try { await api('submit', { payload: p }); sent++; }
    catch (e) { keep.push(p); }
  }
  DB.outbox = keep;
  save(true);
  renderOutboxBadge();
  if (loud || sent) {
    toast(sent ? 'ส่งผลที่ค้างอยู่สำเร็จ ' + sent + ' รายการ' +
                 (keep.length ? ' · ยังค้างอีก ' + keep.length : '')
               : 'ยังส่งไม่ได้ ค้างอยู่ ' + keep.length + ' รายการ', sent ? 'ok' : 'bad');
  }
}

function renderOutboxBadge() {
  const el = $('#saveState');
  if (!el) return;
  if (isStudent() && DB.outbox.length) {
    el.textContent = 'ค้างส่ง ' + DB.outbox.length;
    el.className = 'savestate';
    el.style.color = 'var(--warn)';
  } else { el.style.color = ''; }
}

  let h = '<div class="card"><h3>สถิติการเข้าใช้งาน' +
    '<span class="sub">' + (isStudent() ? 'ของฉัน' : 'ของเครื่องนี้') + '</span></h3>' +
    '<div class="statgrid">' +
    '<div class="stat"><div class="v">' + u.sessions + '</div><div class="k">ครั้งที่เปิดใช้งาน</div></div>' +
    '<div class="stat"><div class="v">' + u.activeDays + '</div><div class="k">จำนวนวันที่เข้าใช้</div></div>' +
    '<div class="stat"><div class="v">' + u.quizzes + '</div><div class="k">ชุดที่ทำเสร็จ</div></div>' +
    '<div class="stat"><div class="v">' + u.items + '</div><div class="k">ข้อที่ทำไปแล้ว</div></div>' +
    '<div class="stat"><div class="v">' + (u.items ? Math.round(u.pct) + '%' : '—') + '</div>' +
      '<div class="k">ความถูกต้องเฉลี่ย</div></div>' +
    '<div class="stat"><div class="v">' + (hrs >= 1 ? fmt(hrs, 1) + ' ชม.' : Math.round(u.sec / 60) + ' นาที') +
      '</div><div class="k">เวลาที่ใช้ทำโจทย์</div></div>' +
    '</div>';
  if (u.first) {
    h += '<div class="hint" style="margin-top:11px">เริ่มใช้งานครั้งแรก ' + thDateTime(u.first) +
      ' &nbsp;·&nbsp; ใช้งานล่าสุด ' + thDateTime(u.last) + '</div>';
  }
  if (u.activeDays > 1) h += '<div style="margin-top:10px">' + usageChart(u.days, 30) + '</div>';
  h += '<div class="row" style="margin-top:11px"><button class="sm" id="btnUsageReset">ล้างสถิติการเข้าใช้งาน</button>' +
    (canManage() && cloudOn() && isAdmin()

    '</div></div>';
  return h;
}

/** ผู้ดูแลดูว่าใครเข้าใช้ระบบแล้วบ้าง ใครยังไม่เคยเข้าเลย */
async function showClassUsage() {
  let list;
  try { list = await api('rosterList', {}); }
  catch (e) { toast(e.message, 'bad'); return; }
  if (!list.length) { toast('ยังไม่มีรายชื่อในชีต', 'bad'); return; }
  const never = list.filter(s => !s.lastLogin);
  const notChanged = list.filter(s => s.lastLogin && s.mustChange);
  const rows = list.slice().sort((a, b) =>
    (Number(a.no) || 999) - (Number(b.no) || 999) || String(a.name).localeCompare(String(b.name), 'th'));
  openModal({
    title: 'การเข้าใช้ระบบของนักเรียน', wide: true,
    bodyHTML:
      '<div class="statgrid" style="margin-bottom:12px">' +
      '<div class="stat"><div class="v">' + list.length + '</div><div class="k">บัญชีทั้งหมด</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--ok)">' + (list.length - never.length) + '</div>' +
        '<div class="k">เคยเข้าใช้แล้ว</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--bad)">' + never.length + '</div>' +
        '<div class="k">ยังไม่เคยเข้าเลย</div></div>' +
      '<div class="stat"><div class="v" style="color:var(--warn)">' + notChanged.length + '</div>' +
        '<div class="k">ยังใช้รหัสตั้งต้น</div></div></div>' +
      (never.length ? '<div class="notice warn" style="margin-bottom:10px">ยังไม่เคยเข้าใช้: <b>' +
        never.slice(0, 20).map(s => esc(s.name)).join(', ') +
        (never.length > 20 ? ' … อีก ' + (never.length - 20) + ' คน' : '') + '</b></div>' : '') +
      '<div class="tablewrap" style="max-height:330px"><table><thead><tr><th class="num">เลขที่</th>' +
      '<th>เลขประจำตัว</th><th>ชื่อ-นามสกุล</th><th>ชั้น</th><th>เข้าใช้ล่าสุด</th></tr></thead><tbody>' +
      rows.map(s => '<tr><td class="num">' + esc(s.no || '—') + '</td><td>' + esc(s.sid) + '</td>' +
        '<td>' + esc(s.name) + '</td><td>' + esc(s.cls || '—') + '</td>' +
        '<td>' + (s.lastLogin
          ? '<span style="color:var(--ok)">' + esc(String(s.lastLogin).slice(0, 16)) + '</span>'
          : '<span style="color:var(--bad)">ยังไม่เคยเข้า</span>') +
        (s.mustChange && s.lastLogin ? ' <span class="tag l1">ยังใช้รหัสตั้งต้น</span>' : '') +
        '</td></tr>').join('') + '</tbody></table></div>'
  });
}

          'รุ่นล่าสุดแล้วกด <b>ทำให้ใช้งานได้ใหม่</b> เพื่อให้ส่งรายชื่อเร็วขึ้นและไม่เกิดรายชื่อซ้ำ') +

/** วินิจฉัยว่าการเชื่อมต่อที่ช้า เกิดจากอะไร แล้วบอกวิธีแก้ให้ตรงจุด
    แยกด้วยการเทียบเวลารอบแรกกับรอบสอง เพราะสองสาเหตุนี้แก้คนละวิธีกันโดยสิ้นเชิง */
function cloudSpeedNote(ms, ms2, r) {
  const nStu = (r && r.students) || 0, nAsg = (r && r.assignments) || 0, nSub = (r && r.submissions) || 0;
  // รอบสองเร็วกว่ารอบแรกมาก แปลว่าเวลาส่วนใหญ่หมดไปกับการปลุกสคริปต์ ไม่ใช่การอ่านข้อมูล
  const coldStart = ms2 != null && ms2 < ms * 0.5 && ms2 < 6000;
  let h = '<span style="color:var(--warn)"><b>การเชื่อมต่อช้ากว่าที่ควร</b> ' +
    '(รอบแรก ' + (ms / 1000).toFixed(1) + ' วิ' +
    (ms2 != null ? ' · รอบสอง ' + (ms2 / 1000).toFixed(1) + ' วิ' : '') + ')</span><br>';
  if (coldStart) {
    h += '<span class="hint">รอบสองเร็วขึ้นมาก แปลว่าเวลาส่วนใหญ่หมดไปกับการ<b>ปลุกสคริปต์ที่หลับอยู่</b> ' +
      'ซึ่งเป็นธรรมชาติของ Google Apps Script เมื่อไม่มีใครเรียกใช้สักพัก<br>' +
      '<b>ผลกับนักเรียน:</b> คนแรกของคาบจะรอนาน ที่เหลือจะเร็วปกติ<br>' +
      '<b>วิธีลดผล:</b> ครูกดปุ่มนี้หนึ่งครั้งก่อนเริ่มคาบ เพื่อปลุกสคริปต์ไว้ล่วงหน้า</span>';
  } else {
    h += '<span class="hint">ช้าทั้งสองรอบ แปลว่า<b>ไม่ใช่</b>เรื่องการปลุกสคริปต์ ' +
      'แต่เป็นเพราะฟังก์ชัน <code>ping</code> ในชีต<b>อ่านข้อมูลมากเกินไป</b><br>' +
      'ตอนนี้ในชีตมีข้อมูลรวมราว <b>' + fmt(nStu + nAsg + nSub) + ' แถว</b> ' +
      '(รายชื่อ ' + fmt(nStu) + ' · ใบงาน ' + fmt(nAsg) + ' · ผลที่ส่งแล้ว ' + fmt(nSub) + ')<br>' +
      '<b>วิธีแก้:</b> ในไฟล์ <code>appsscript-Code.gs</code> ให้ฟังก์ชัน <code>ping</code> ' +
      'นับจำนวนแถวด้วย <code>getLastRow()</code> แทนการดึงทั้งแผ่นด้วย ' +
      '<code>getDataRange().getValues()</code> และอ่านเฉพาะคอลัมน์ <code>sid</code> ' +
      'ไม่กี่แถวแรกก็พอสำหรับทำตัวอย่าง</span>';
  }
  return h;
}

/** ส่งรายชื่อในเครื่องขึ้นชีต — คนที่มีอยู่แล้วจะอัปเดตข้อมูล ไม่แตะรหัสผ่าน
    แบ่งส่งเป็นก้อนละ ROSTER_CHUNK คน เพื่อให้แต่ละรอบจบเร็วและไม่หมดเวลา */
const ROSTER_CHUNK = 60;
async function pushRoster() {
  const good = [], badSid = [], noSid = [];
  DB.students.forEach(s => {
    const sid = String(s.sid || '').trim();
    const row = { sid: sid, name: s.name, no: s.no || '',
                  cls: (classById(s.classId) || {}).name || '' };
    if (!sid) noSid.push(s.name);
    else if (!validSid(sid)) badSid.push(s.name + ' (' + sid + ')');
    else good.push(row);
  });

  if (!good.length) {
    openModal({ title: 'ส่งรายชื่อขึ้นชีตไม่ได้', bodyHTML:
      '<div class="notice bad">ยังไม่มีนักเรียนที่มี<b>เลขประจำตัวที่ใช้ได้</b><br>' +
      'เลขประจำตัวคือชื่อผู้ใช้ ต้องเป็น<b>ตัวเลขล้วน ไม่เกิน ' + SID_MAX + ' หลัก</b></div>' +
      (badSid.length ? '<div class="hint" style="margin-top:9px">รูปแบบไม่ถูกต้อง: ' +
        esc(badSid.slice(0, 15).join(', ')) + (badSid.length > 15 ? ' …' : '') + '</div>' : '') });
    return;
  }
  // ── ตรวจกับชีตก่อน แล้วส่งเฉพาะคนที่ยังไม่มี ─────────────────────────
  // เลขประจำตัวที่มีอยู่แล้วจะไม่ส่งซ้ำ จึงไม่เกิดรายชื่อซ้ำในชีตเด็ดขาด
  let chk;
  try { chk = await api('rosterCheck', { sids: good.map(r => r.sid) }); }
  catch (e) {
    openModal({ title: 'ตรวจสอบรายชื่อในชีตไม่สำเร็จ',
      bodyHTML: '<div class="notice bad">' + esc(e.message) + '</div>' +
        '<div class="hint" style="margin-top:9px">ถ้าขึ้นว่าไม่รู้จักคำสั่ง <code>rosterCheck</code> ' +
        'แปลว่าสคริปต์ในชีตยังเป็นรุ่นเก่า — วาง <code>appsscript-Code.gs</code> ใหม่ ' +
        'แล้วกด <b>ทำให้ใช้งานได้ใหม่</b></div>' });
    return;
  }

  const already = new Set(chk.existing.map(String));
  const fresh = good.filter(r => !already.has(String(r.sid)));

  // เลขซ้ำกันเองในเครื่อง — ต้องบอกให้แก้ ไม่ใช่ส่งขึ้นไปมั่ว
  const localDup = {};
  good.forEach(r => { localDup[r.sid] = (localDup[r.sid] || 0) + 1; });
  const dupHere = Object.keys(localDup).filter(k => localDup[k] > 1);

  let msg = '<div class="statgrid" style="margin-bottom:11px">' +
    '<div class="stat"><div class="v">' + chk.total + '</div><div class="k">มีในชีตแล้ว</div></div>' +
    '<div class="stat"><div class="v" style="color:var(--ok)">' + fresh.length + '</div>' +
      '<div class="k">จะเพิ่มใหม่</div></div>' +
    '<div class="stat"><div class="v" style="color:var(--muted)">' + already.size + '</div>' +
      '<div class="k">มีอยู่แล้ว ข้ามไป</div></div></div>';
  if (dupHere.length) msg += '<div class="notice bad">รายชื่อในเครื่องมี<b>เลขประจำตัวซ้ำกันเอง ' +
    dupHere.length + ' เลข</b>: ' + esc(dupHere.slice(0, 10).join(', ')) +
    '<br>แก้ให้ไม่ซ้ำก่อน ไม่งั้นจะมีคนเข้าระบบไม่ได้</div>';
  if (chk.dupInSheet && chk.dupInSheet.length) msg += '<div class="notice warn">ในชีตมีแถวซ้ำอยู่ <b>' +
    chk.dupInSheet.length + ' เลข</b> (' + esc(chk.dupInSheet.slice(0, 8).join(', ')) +
    ')<br>กด <b>ลบแถวซ้ำในชีต</b> ที่แท็บตั้งค่าเพื่อซ่อม</div>';
  if (chk.blank) msg += '<div class="notice warn">ในชีตมี <b>' + chk.blank +
    ' แถวที่ไม่มีเลขประจำตัว</b> ซึ่งเข้าระบบไม่ได้ — ลบแถวซ้ำจะเก็บกวาดให้ด้วย</div>';
  if (noSid.length) msg += '<div class="hint">ข้าม ' + noSid.length + ' คนที่ยังไม่มีเลขประจำตัว</div>';
  if (badSid.length) msg += '<div class="hint" style="color:var(--bad)">ข้าม ' + badSid.length +
    ' คนที่เลขประจำตัวผิดรูปแบบ</div>';

  if (!fresh.length) {
    openModal({ title: 'ทุกคนอยู่ในชีตแล้ว', bodyHTML: msg +
      '<div class="hint" style="margin-top:9px">ไม่มีใครต้องเพิ่มใหม่ — ' +
      'ถ้านักเรียนยังเข้าระบบไม่ได้ ให้กด <b>ทดสอบการเชื่อมต่อ</b> เพื่อดูว่าเลขประจำตัวในชีตถูกต้องไหม</div>' });
    return;
  }
  if (!await confirmBox('ยืนยันการส่งรายชื่อ',
    msg + '<div style="margin-top:6px">จะส่ง <b>' + fresh.length + ' คน</b>' +
    (fresh.length > ROSTER_CHUNK ? ' (แบ่งเป็น ' + Math.ceil(fresh.length / ROSTER_CHUNK) + ' รอบ)' : '') +
    ' ขึ้น Google Sheet<br>ทุกคนจะได้รหัสตั้งต้น <b>1111</b> และต้องตั้งรหัสใหม่ตอนเข้าครั้งแรก</div>',
    'ส่ง ' + fresh.length + ' คน')) return;
  good.length = 0;
  fresh.forEach(r => good.push(r));

  const m = openModal({ title: 'กำลังส่งรายชื่อ', bodyHTML:
    '<div id="prMsg" class="hint">กำลังเชื่อมต่อ…</div>' +
    '<div class="bar" style="margin-top:10px"><i id="prBar" style="width:0%"></i></div>', buttons: [] });
  const setMsg = (t, pct) => {
    const a = $('#prMsg', m.root), b = $('#prBar', m.root);
    if (a) a.innerHTML = t;
    if (b) b.style.width = Math.round(pct) + '%';
  };

  let added = 0, updated = 0, skipped = [], sent = 0;
  const t0 = Date.now();
  try {
    for (let i = 0; i < good.length; i += ROSTER_CHUNK) {
      const part = good.slice(i, i + ROSTER_CHUNK);
      setMsg('กำลังส่ง ' + (i + 1) + '–' + (i + part.length) + ' จาก ' + good.length + ' คน…',
             i / good.length * 100);
      const r = await api('rosterSave', { rows: part });
      added += r.added || 0; updated += r.updated || 0; sent += part.length;
      if (r.skipped && r.skipped.length) skipped = skipped.concat(r.skipped);
    }
    setMsg('เสร็จแล้ว', 100);
    m.close();
    const sec = ((Date.now() - t0) / 1000).toFixed(1);
    openModal({ title: 'ส่งรายชื่อเรียบร้อย', bodyHTML:
      '<div style="line-height:1.9"><b>เพิ่มบัญชีใหม่ ' + added + ' คน · อัปเดต ' + updated + ' คน</b>' +
      '<br>ใช้เวลา ' + sec + ' วินาที' +
      (skipped.length ? '<br><span style="color:var(--warn)">ชีตข้ามไป ' + skipped.length + ' รายการ: ' +
        esc(skipped.slice(0, 8).map(x => (x.name || x.sid) + ' — ' + x.why).join(' · ')) + '</span>' : '') +
      (added ? '<br><br>นักเรียนเข้าใช้ได้แล้วด้วย<b>เลขประจำตัว</b>ของตัวเอง รหัสตั้งต้น <b>1111</b>' : '') +
      '</div>' });
  } catch (e) {
    m.close();
    openModal({ title: 'ส่งรายชื่อไม่สำเร็จ', bodyHTML:
      '<div class="notice bad">' + esc(e.message) + '</div>' +
      '<div class="hint" style="margin-top:10px">ส่งสำเร็จไปแล้ว <b>' + sent + ' จาก ' + good.length +
      ' คน</b> — กดส่งใหม่ได้เลย ระบบจะข้ามคนที่ส่งไปแล้วให้เอง ไม่เกิดข้อมูลซ้ำ<br><br>' +
      'ถ้ายังไม่ผ่าน ให้ตรวจว่าได้กด <b>ทำให้ใช้งานได้ใหม่</b> ใน Apps Script ' +
      'หลังจากวางสคริปต์รุ่นล่าสุดแล้วหรือยัง</div>' });
  }
}

/** สร้างไฟล์สำหรับแจกนักเรียน — ฝัง URL/โลโก้/หัวกระดาษไว้ในตัวไฟล์ */
async function makeStudentFile() {
  if (!DB.cloud.url) {
    openModal({ title: 'ยังสร้างไฟล์ไม่ได้', bodyHTML:
      '<div class="notice bad">ยังไม่ได้เชื่อมต่อ Google Sheet<br>' +
      'ต้องใส่ URL เว็บแอปแล้วกด <b>ทดสอบการเชื่อมต่อ</b> ให้ผ่านก่อน ' +
      'ไม่งั้นไฟล์ที่แจกไปจะเชื่อมต่ออะไรไม่ได้เลย</div>' });
    return;
  }
  const h = DB.settings.header || {};
  const warn = [];
  if (!DB.settings.logo) warn.push('ยังไม่ได้ใส่<b>ตราโรงเรียน</b> — ไฟล์ที่แจกจะไม่มีโลโก้');
  if (!String(h.school || '').trim()) warn.push('ยังไม่ได้ใส่<b>ชื่อโรงเรียน</b>ในหัวกระดาษ');

  if (!await confirmBox('สร้างไฟล์สำหรับแจกนักเรียน',
    '<div style="line-height:1.9">ไฟล์ที่ได้จะ<b>ฝังสิ่งเหล่านี้ไว้ในตัวไฟล์</b><br>' +
    '• ที่อยู่ Google Sheet ที่เชื่อมอยู่ตอนนี้<br>' +
    '• ตราโรงเรียนและหัวกระดาษ<br>' +
    '• ชื่อผู้พัฒนาระบบ</div>' +
    '<div class="notice info" style="margin-top:10px">เปิดมาแล้ว<b>ขึ้นหน้าลงชื่อเข้าใช้ของนักเรียนทันที</b> ' +
    'ไม่ต้องตั้งค่าอะไร<br>' +
    'ครู<b>ยังลงชื่อเข้าใช้เป็นผู้ดูแลจากลิงก์เว็บได้</b> โดยกด <b>เข้าใช้ในฐานะผู้ดูแล</b> ที่ท้ายหน้า ' +
    '(ต้องใส่รหัสผู้ดูแล) จึงจัดการรายชื่อและดูผลจากมือถือหรือแท็บเล็ตได้เลย<br>' +
    'ส่วนนักเรียน<b>ตัดการเชื่อมต่อชีตไม่ได้</b> ผลที่ทำจึงถูกส่งขึ้นชีตเสมอ</div>' +
    (warn.length ? '<div class="notice warn" style="margin-top:9px">' + warn.join('<br>') + '</div>' : '') +
    '<div class="hint" style="margin-top:9px"><b>ไม่มี</b>ข้อมูลนักเรียน ชุดโจทย์ หรือคะแนนติดไปกับไฟล์ ' +
    '(ข้อมูลพวกนั้นอยู่ในเครื่องแต่ละคน)</div>',
    'สร้างไฟล์')) return;

  let html;
  try { html = await buildStudentFile(); }
  catch (e) { toast(e.message || 'สร้างไฟล์ไม่สำเร็จ', 'bad'); return; }

  download(new Blob([html], { type: 'text/html;charset=utf-8' }), 'index.html');
  const kb = Math.round(html.length / 1024);
  openModal({ title: 'สร้างไฟล์เรียบร้อย', bodyHTML:
    '<div style="line-height:1.9">ดาวน์โหลด <b>index.html</b> แล้ว (ขนาดราว ' + kb + ' KB)</div>' +
    '<div class="hint" style="margin-top:10px"><b>ขั้นต่อไป — เอาขึ้น Netlify</b><br>' +
    '1. เปิด <code>app.netlify.com/drop</code><br>' +
    '2. ลากไฟล์ <b>index.html</b> ไปวาง<br>' +
    '3. ได้ลิงก์มาแล้วส่งให้นักเรียน<br>' +
    '4. บอกให้นักเรียนกด <b>แชร์ → เพิ่มไปยังหน้าจอโฮม</b> จะได้ใช้เหมือนแอพจริง</div>' +
    '<div class="notice warn" style="margin-top:10px">ถ้าวันหลังกด <b>ทำให้ใช้งานได้ใหม่</b> ' +
    'ใน Apps Script แล้ว<b>ที่อยู่เปลี่ยน</b> ต้องสร้างไฟล์นี้ใหม่แล้วอัปโหลดทับ ' +
    'ไม่งั้นเครื่องนักเรียนจะเชื่อมต่อไม่ได้</div>' });
}

/** ซ่อมโครงสร้างชีต — เติมหัวตารางที่หายไป และจัดคอลัมน์เป็น เลขที่ · เลขประจำตัว · ชื่อ */
async function repairSheet(silent) {
  let ins;
  try { ins = await api('sheetInspect', {}); }
  catch (e) {
    if (!silent) openModal({ title: 'ตรวจโครงสร้างชีตไม่สำเร็จ',
      bodyHTML: '<div class="notice bad">' + esc(e.message) + '</div>' +
        '<div class="hint" style="margin-top:9px">ถ้าขึ้นว่าไม่รู้จักคำสั่ง <code>sheetInspect</code> ' +
        'แปลว่าสคริปต์ในชีตยังเป็นรุ่นเก่า — วาง <code>appsscript-Code.gs</code> ใหม่ ' +
        'แล้วกด <b>ทำให้ใช้งานได้ใหม่</b><br><br>' +
        'หรือจะซ่อมจากหน้า Apps Script โดยตรงก็ได้ — เลือกฟังก์ชัน <code>repairSheets</code> แล้วกดเรียกใช้</div>' });
    return false;
  }
  const bad = Object.keys(ins).filter(k => ins[k].needFix);
  if (!bad.length) {
    if (!silent) openModal({ title: 'โครงสร้างชีตถูกต้องแล้ว', bodyHTML:
      '<div class="notice info">ทุกแผ่นมีหัวตารางครบ และคอลัมน์เรียงถูกต้อง<br>' +
      Object.keys(ins).map(k => k + ': ' + ins[k].rows + ' แถว').join(' · ') + '</div>' });
    return true;
  }
  const s = ins.students || {};
  if (!await confirmBox('ซ่อมโครงสร้างชีต',
    '<div class="notice warn">พบว่าชีตยังไม่ถูกโครงสร้าง ระบบจึงอ่านข้อมูลไม่ออก</div>' +
    '<div style="line-height:1.9;margin-top:8px">' +
    (s.hasHeader === false ? '• แผ่น <b>students</b> <b>ไม่มีแถวหัวตาราง</b> — ' +
      'แถวแรกเป็นข้อมูลนักเรียนเลย ทำให้ระบบอ่านชื่อคนนั้นเป็นชื่อคอลัมน์<br>' : '') +
    (s.layout === 'old' ? '• คอลัมน์ยังเรียงแบบเก่า จะจัดใหม่เป็น ' +
      '<b>เลขที่ · เลขประจำตัว · ชื่อ-นามสกุล · ชั้น</b><br>' : '') +
    '</div><div class="hint" style="margin-top:9px">การซ่อมจะ<b>เติมหัวตารางภาษาไทย</b>ให้ทุกแผ่น ' +
    'และจัดคอลัมน์ใหม่ <b>ข้อมูลเดิมไม่หาย</b> รหัสผ่านที่นักเรียนตั้งไว้ยังใช้ได้เหมือนเดิม<br>' +
    'แนะนำให้กด <b>สำรอง</b> ข้อมูลในเครื่องไว้ก่อน และเปิดชีตดูผลหลังซ่อมเสร็จ</div>',
    'ซ่อมเลย')) return false;
  try {
    const r = await api('sheetRepair', {});
    openModal({ title: 'ซ่อมโครงสร้างชีตเรียบร้อย', bodyHTML:
      '<div style="line-height:1.9">' + Object.keys(r).map(k =>
        '<b>' + k + '</b> — ' + r[k].rows + ' แถว' +
        (r[k].addedHeader ? ' · เติมหัวตารางแล้ว' : '') +
        (r[k].reordered ? ' · จัดคอลัมน์เป็น เลขที่/เลขประจำตัว/ชื่อ แล้ว' : '')).join('<br>') +
      '</div><div class="hint" style="margin-top:10px">ลองกด <b>ดึงรายชื่อจากชีต</b> ' +
      'เพื่อตรวจว่าเลขประจำตัวขึ้นครบแล้ว จากนั้นให้นักเรียนลองเข้าระบบอีกครั้ง</div>' });
    return true;
  } catch (e) { toast(e.message, 'bad'); return false; }
}

/** ซ่อมชีตที่เคยอัพซ้ำ — เก็บแถวแรกของแต่ละเลขประจำตัว ที่เหลือลบทิ้ง */
async function dedupeRoster() {
  let chk;
  try { chk = await api('rosterCheck', { sids: [] }); }
  catch (e) { toast(e.message, 'bad'); return; }
  const nDup = (chk.dupInSheet || []).length;
  if (!nDup && !chk.blank) {
    openModal({ title: 'ชีตสะอาดดีอยู่แล้ว', bodyHTML:
      '<div class="notice info">ในชีตมี <b>' + chk.total + ' แถว</b> ' +
      'ไม่มีเลขประจำตัวซ้ำและไม่มีแถวว่าง ไม่ต้องซ่อมอะไร</div>' });
    return;
  }
  if (!await confirmBox('ลบแถวซ้ำในชีต',
    'พบ<b>เลขประจำตัวซ้ำ ' + nDup + ' เลข</b>' +
    (chk.blank ? ' และ<b>แถวที่ไม่มีเลขประจำตัว ' + chk.blank + ' แถว</b>' : '') + '<br>' +
    (nDup ? 'ตัวอย่าง: ' + esc(chk.dupInSheet.slice(0, 10).join(', ')) + '<br>' : '') +
    '<br>จะเก็บ<b>แถวแรก</b>ของแต่ละเลขไว้ ที่เหลือลบทิ้ง<br>' +
    '<span style="color:var(--warn)">แถวที่ถูกลบจะเสียรหัสผ่านที่ตั้งไว้ในแถวนั้นไปด้วย ' +
    'ถ้ามีใครเข้าไม่ได้หลังจากนี้ ให้รีเซ็ตรหัสให้เขา</span>', 'ลบแถวซ้ำ')) return;
  try {
    const r = await api('rosterDedupe', {});
    openModal({ title: 'ซ่อมชีตเรียบร้อย', bodyHTML:
      '<div class="notice info">ลบไป <b>' + r.removed + ' แถว</b> · เหลือรายชื่อ <b>' + r.left + ' คน</b></div>' });
  } catch (e) { toast(e.message, 'bad'); }
}

async function pullRoster() {
  try {
    const list = await api('rosterList', {});
    if (!list.length) { toast('ยังไม่มีรายชื่อในชีต', 'bad'); return; }
    const byCls = {};
    list.forEach(s => { const k = String(s.cls || '(ไม่ระบุชั้น)'); byCls[k] = (byCls[k] || 0) + 1; });
    if (!await confirmBox('ดึงรายชื่อจากชีต',
      'พบ <b>' + list.length + ' คน</b> ในชีต<br>' +
      Object.keys(byCls).map(k => esc(k) + ' ' + byCls[k] + ' คน').join(' · ') +
      '<br><br>จะ<b>แทนที่รายชื่อในเครื่องทั้งหมด</b> (ผลการทำที่เก็บไว้ยังอยู่ครบ)', 'ดึงมาแทนที่')) return;
    DB.mode = 'class';
    DB.classes = []; DB.students = [];
    list.forEach(s => {
      const nm = String(s.cls || 'ไม่ระบุชั้น').trim();
      let c = DB.classes.find(x => x.name === nm);
      if (!c) { c = { id: uid(), name: nm }; DB.classes.push(c); }
      DB.students.push({ id: uid(), classId: c.id, no: Number(s.no) || null,
                         sid: String(s.sid), name: String(s.name || '') });
    });
    DB.cur.classId = DB.classes.length ? DB.classes[0].id : null;
    const l = studentsOf(DB.cur.classId);
    DB.cur.studentId = l.length ? l[0].id : null;
    save(true); render();
    toast('ดึงรายชื่อ ' + list.length + ' คนเรียบร้อย', 'ok');

/** นำเข้ารายชื่อจากไฟล์ Excel (.xlsx) หรือ CSV พร้อมให้เลือกชีตและจับคู่คอลัมน์เอง */
async function importRosterFile(classId) {
  const f = await pickFile('.xlsx,.csv,.txt,.tsv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv');
  if (f) await importRosterFromFile(classId, f);
}

async function importRosterFromFile(classId, f) {
  let sheets;
  try { sheets = await readTableFile(f); }
  catch (e) { openModal({ title: 'เปิดไฟล์ไม่สำเร็จ', bodyHTML: '<div class="notice bad">' + esc(e.message || String(e)) + '</div>' }); return; }
  sheets = sheets.filter(s => s.rows.length);
  if (!sheets.length) { toast('ไฟล์นี้ไม่มีข้อมูล', 'bad'); return; }

  const S = { si: 0 };
  const applyGuess = () => {
    const g = guessLayout(sheets[S.si].rows);
    S.headRow = g.headRow; S.map = g.map;
  };
  applyGuess();

  const colOptions = (rows, sel) => {
    const width = rows.reduce((w, r) => Math.max(w, r.length), 0);
    let o = '<option value="-1"' + (sel < 0 ? ' selected' : '') + '>— ไม่มี —</option>';
    for (let i = 0; i < width; i++) {
      const sample = (S.headRow >= 0 ? String(rows[S.headRow][i] || '') : '')
        || String((rows[S.headRow + 1] || [])[i] || '');
      o += '<option value="' + i + '"' + (sel === i ? ' selected' : '') + '>' +
        String.fromCharCode(65 + (i % 26)) + (sample ? ' — ' + esc(sample.slice(0, 18)) : '') + '</option>';
    }
    return o;
  };

  const collect = () => {
    const rows = sheets[S.si].rows;
    const start = S.headRow >= 0 ? S.headRow + 1 : 0;
    const pick = (r, i) => i >= 0 ? String(r[i] == null ? '' : r[i]).replace(/\s+/g, ' ').trim() : '';
    const out = [];
    let auto = 0;
    for (let k = start; k < rows.length; k++) {
      const r = rows[k];
      const name = pick(r, S.map.name);
      if (!name) continue;
      const noRaw = pick(r, S.map.no);
      const no = /^\d+$/.test(noRaw) ? Number(noRaw) : ++auto;
      if (no > auto) auto = no;
      out.push({ no: no, sid: pick(r, S.map.sid), name: name, cls: pick(r, S.map.cls) });
    }
    return out;
  };

  const redraw = root => {
    const rows = sheets[S.si].rows;
    const items = collect();
    const byCls = {};
    items.forEach(x => { const k = x.cls || ''; byCls[k] = (byCls[k] || 0) + 1; });
    const clsList = Object.keys(byCls).filter(Boolean);
    const badSid = items.filter(x => x.sid && !validSid(x.sid));

    $('#impBody', root).innerHTML =
      (sheets.length > 1
        ? '<div class="row" style="margin-bottom:9px"><label for="impSheet">ชีต</label>' +
          '<select id="impSheet">' + sheets.map((s, i) =>
            '<option value="' + i + '"' + (i === S.si ? ' selected' : '') + '>' + esc(s.name) +
            ' (' + s.rows.length + ' แถว)</option>').join('') + '</select></div>'
        : '') +
      '<div class="row" style="gap:12px;flex-wrap:wrap;align-items:flex-end">' +
      COLKEYS.map(ck => '<div><label class="hint" for="impc_' + ck.k + '">' + ck.label +
        (ck.k === 'name' ? ' *' : '') + '</label><br><select id="impc_' + ck.k + '" data-ck="' + ck.k +
        '" style="max-width:190px">' + colOptions(rows, S.map[ck.k]) + '</select></div>').join('') +
      '<div><label class="hint" for="impHead">แถวหัวตาราง</label><br>' +
      '<input type="number" id="impHead" min="0" max="' + rows.length + '" value="' + (S.headRow + 1) +
      '" style="width:90px" inputmode="numeric"><br><span class="hint">0 = ไม่มีหัวตาราง</span></div>' +
      '</div>' +
      (S.map.name < 0
        ? '<div class="notice bad" style="margin-top:10px">ยังไม่ได้เลือกคอลัมน์ <b>ชื่อ-นามสกุล</b></div>'
        : '') +
      (badSid.length
        ? '<div class="notice warn" style="margin-top:10px">มี <b>' + badSid.length + ' คน</b> ' +
          'ที่เลขประจำตัวไม่ใช่ตัวเลขล้วนหรือยาวเกิน ' + SID_MAX + ' หลัก — ' +
          'คนเหล่านี้จะ<b>เข้าระบบไม่ได้</b> ตรวจว่าเลือกคอลัมน์ถูกหรือยัง<br>' +
          '<span class="hint">' + esc(badSid.slice(0, 6).map(x => x.name + ': ' + x.sid).join(' · ')) +
          (badSid.length > 6 ? ' …' : '') + '</span></div>'
        : '') +
      (clsList.length
        ? '<div class="notice info" style="margin-top:10px">พบคอลัมน์ชั้น ' + clsList.length + ' ห้อง: <b>' +
          clsList.map(esc).join(', ') + '</b> — ระบบจะแยกนักเรียนเข้าห้องตามนี้ และสร้างห้องที่ยังไม่มีให้เอง</div>'
        : '') +
      '<div class="hint" style="margin:10px 0 5px">ตัวอย่าง 10 แถวแรก จากทั้งหมด <b>' + items.length + ' คน</b></div>' +
      '<div class="tablewrap" style="max-height:200px"><table><thead><tr><th class="num">เลขที่</th>' +
      '<th class="num">เลขประจำตัว</th><th>ชื่อ-นามสกุล</th>' + (clsList.length ? '<th>ชั้น</th>' : '') +
      '</tr></thead><tbody>' +
      items.slice(0, 10).map(x => '<tr><td class="num">' + x.no + '</td>' +
        '<td class="num">' + (x.sid ? esc(x.sid) : '<span class="hint">—</span>') + '</td>' +
        '<td>' + esc(x.name) + '</td>' +
        (clsList.length ? '<td>' + esc(x.cls || '—') + '</td>' : '') + '</tr>').join('') +
      '</tbody></table></div>';

    const sh = $('#impSheet', root);
    if (sh) sh.addEventListener('change', e => { S.si = Number(e.target.value); applyGuess(); redraw(root); });
    $$('[data-ck]', root).forEach(sel => sel.addEventListener('change', e => {
      S.map[e.target.dataset.ck] = Number(e.target.value); redraw(root);
    }));
    $('#impHead', root).addEventListener('change', e => {
      S.headRow = clamp(Math.round(Number(e.target.value) || 0), 0, rows.length) - 1; redraw(root);
    });
  };

  openModal({
    title: 'นำเข้ารายชื่อจากไฟล์ — ' + f.name,
    wide: true,
    bodyHTML: '<div class="hint" style="margin-bottom:9px">ระบบเดาคอลัมน์ให้แล้ว ' +
      'ถ้าไม่ตรงให้เลือกใหม่ได้ที่ช่องด้านล่าง</div><div id="impBody"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'เพิ่มรายชื่อ', cls: 'primary', act: (close) => {
          const items = collect();
          if (!items.length) { toast('ไม่พบรายชื่อ — ตรวจการเลือกคอลัมน์ชื่ออีกครั้ง', 'bad'); return; }
          let added = 0, newCls = 0;
          const clsCache = {};
          items.forEach(x => {
            let cid = classId;
            if (x.cls) {
              if (!clsCache[x.cls]) {
                let c = DB.classes.find(v => String(v.name).trim() === x.cls);
                if (!c) { c = { id: uid(), name: x.cls }; DB.classes.push(c); newCls++; }
                clsCache[x.cls] = c.id;
              }
              cid = clsCache[x.cls];
            }
            DB.students.push({ id: uid(), classId: cid, no: x.no, sid: String(x.sid || ''), name: x.name });
            added++;
          });
          if (!DB.cur.classId) DB.cur.classId = classId;
          if (!DB.cur.studentId) { const l = studentsOf(DB.cur.classId); DB.cur.studentId = l.length ? l[0].id : null; }
          save(true); close(); render();
          toast('เพิ่มรายชื่อ ' + added + ' คน' + (newCls ? ' และสร้างห้องใหม่ ' + newCls + ' ห้อง' : ''), 'ok');
        } }
    ],
    onMount: root => redraw(root)
  });
}

function addStudents(classId) {
  const cls = classById(classId);
  const startNo = studentsOf(classId).reduce((m, s) => Math.max(m, s.no || 0), 0);
  const existing = studentsOf(classId);

  const preview = root => {
    const rows = parseRoster($('#stdList', root).value, startNo);
    const box = $('#stdPrev', root);
    if (!rows.length) {
      box.innerHTML = '<div class="hint">ยังไม่มีรายชื่อ — พิมพ์หรือวางในกล่องด้านบน</div>';
      return;
    }
    const warn = [];
    const seenNo = {}, seenSid = {};
    rows.forEach(r => {
      if (seenNo[r.no]) warn.push('เลขที่ ' + r.no + ' ซ้ำกันในรายการที่วาง');
      seenNo[r.no] = 1;
      if (r.sid && !validSid(r.sid))
        warn.push('เลขประจำตัว "' + r.sid + '" ใช้ไม่ได้ — ต้องเป็นตัวเลขล้วนไม่เกิน ' + SID_MAX + ' หลัก');
      if (r.sid) { if (seenSid[r.sid]) warn.push('เลขประจำตัว ' + r.sid + ' ซ้ำกันในรายการที่วาง'); seenSid[r.sid] = 1; }
      if (existing.some(s => s.no === r.no)) warn.push('เลขที่ ' + r.no + ' มีอยู่แล้วในห้องนี้');
      if (r.sid && existing.some(s => String(s.sid || '') === String(r.sid))) warn.push('เลขประจำตัว ' + r.sid + ' มีอยู่แล้วในห้องนี้');
    });
    const uw = Array.from(new Set(warn));
    box.innerHTML =
      '<div class="hint" style="margin-bottom:6px">ตรวจดูก่อนเพิ่ม — จะเพิ่ม <b>' + rows.length + ' คน</b></div>' +
      (uw.length ? '<div class="notice warn" style="margin-bottom:7px">' + uw.slice(0, 6).map(esc).join('<br>') +
        (uw.length > 6 ? '<br>… และอีก ' + (uw.length - 6) + ' รายการ' : '') + '</div>' : '') +
      '<div class="tablewrap" style="max-height:190px"><table><thead><tr><th class="num">เลขที่</th>' +
      '<th class="num">เลขประจำตัว</th><th>ชื่อ-นามสกุล</th></tr></thead><tbody>' +
      rows.map(r => '<tr><td class="num">' + r.no + '</td>' +
        '<td class="num">' + (r.sid
          ? (validSid(r.sid) ? esc(r.sid) : '<span style="color:var(--bad)">' + esc(r.sid) + '</span>')
          : '<span class="hint">—</span>') + '</td>' +
        '<td>' + esc(r.name) + '</td></tr>').join('') + '</tbody></table></div>';
  };

  openModal({
    title: 'เพิ่มรายชื่อผู้เรียน' + (cls ? ' — ' + cls.name : ''),
    bodyHTML:
      '<div class="hint" style="margin-bottom:8px">พิมพ์หรือวางรายชื่อ <b>บรรทัดละหนึ่งคน</b> ' +
      'ลำดับคอลัมน์คือ <b>เลขที่ · เลขประจำตัว · ชื่อ-นามสกุล</b><br>' +
      'วางจาก Excel ได้เลย (คั่นด้วยแท็บ) หรือพิมพ์เอง เช่น <code>1 12345 สมชาย ใจดี</code><br>' +
      'ไม่มีเลขประจำตัวก็ได้ เช่น <code>1 สมชาย ใจดี</code> · ไม่ใส่เลขที่ ระบบจะไล่เลขต่อจาก ' + startNo + ' ให้เอง</div>' +
      '<textarea id="stdList" style="width:100%;height:150px" ' +
      'placeholder="1&#9;12345&#9;สมชาย ใจดี&#10;2&#9;12346&#9;มานี รักเรียน"></textarea>' +
      '<div id="stdPrev" style="margin-top:10px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      {
        label: 'เพิ่ม', cls: 'primary', act: (close, root) => {
          const rows = parseRoster($('#stdList', root).value, startNo);
          if (!rows.length) { toast('ยังไม่ได้พิมพ์รายชื่อ', 'bad'); return; }
          rows.forEach(r => DB.students.push({
            id: uid(), classId: classId, no: r.no, sid: String(r.sid || ''), name: r.name
          }));
          DB.cur.classId = classId;
          if (!DB.cur.studentId) { const l = studentsOf(classId); DB.cur.studentId = l.length ? l[0].id : null; }
          save(true); close(); render();
          toast('เพิ่มรายชื่อ ' + rows.length + ' คนแล้ว', 'ok');
        }
      }
    ],
    onMount: root => {
      const ta = $('#stdList', root);
      ta.addEventListener('input', () => preview(root));
      preview(root);
      ta.focus();
    }
  });
}

async function restore() {
  const f = await pickFile('.json,application/json');
  if (!f) return;
  let o;
  try { o = JSON.parse(await f.text()); } catch (e) { toast('ไฟล์นี้อ่านไม่ได้ (ไม่ใช่ JSON ที่ถูกต้อง)', 'bad'); return; }
  if (!o || !Array.isArray(o.quizzes) || !Array.isArray(o.attempts)) { toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของโปรแกรมนี้', 'bad'); return; }

    'ในไฟล์มีชุดโจทย์ ' + o.quizzes.length + ' ชุด และผลการทำ ' + o.attempts.length + ' ครั้ง', 'กู้คืน')) return;
  DB = Object.assign(defaultDB(), o);
  DB.settings = Object.assign(defaultDB().settings, o.settings || {});
  DB.settings.header = Object.assign({ school: '', teacher: '', term: '' }, (o.settings || {}).header || {});
  DB.cur = Object.assign(defaultDB().cur, o.cur || {});

  save(true); render(); toast('กู้คืนข้อมูลเรียบร้อย', 'ok');
}

/* --- 6.x แชร์ใบงาน / รวมผลจากนักเรียน / ส่งออกคะแนน ----------------------
   ชุดโจทย์เก็บแค่ {tplId, seed} ต่อข้อ ทั้งใบจึงเล็กพอที่จะส่งเป็นข้อความได้
   ครูคัดลอก "รหัสใบงาน" ไปวางในไลน์กลุ่มหรือ Google Classroom
   นักเรียนวางรหัสลงแอพ แล้วไอแพดสร้างโจทย์เองในเครื่อง — ไม่ต้องมีเซิร์ฟเวอร์
   ------------------------------------------------------------------------ */
const QCODE_PREFIX = 'MATHQ1:';

function encodeQuiz(q) {
  const c = {
    i: q.id, t: q.title, s: q.seed, tp: q.topics, sb: q.subs || [],
    c: q.counts, pm: q.piMode || '3.14',
    k: quizKind(q), sh: (q.seedShift || 0),
    it: q.items.map(x => x.tplId + '~' + x.seed)
  };
  return QCODE_PREFIX + b64enc(JSON.stringify(c));
}

function decodeQuiz(code) {
  const s = String(code || '').trim().replace(/\s+/g, '');
  if (!s) return null;
  const body = s.indexOf(QCODE_PREFIX) === 0 ? s.slice(QCODE_PREFIX.length) : s;
  let c;
  try { c = JSON.parse(b64dec(body)); } catch (e) { return null; }
  if (!c || !Array.isArray(c.it) || !c.it.length) return null;
  const items = [];
  for (const raw of c.it) {
    const p = String(raw).split('~');
    if (p.length !== 2) return null;
    if (!TPL.some(t => t.id === p[0])) return null;      // แม่แบบนี้ไม่มีในแอพรุ่นนี้
    const sd = Number(p[1]);
    if (!isFinite(sd)) return null;
    items.push({ tplId: p[0], seed: sd });
  }
  return {
    id: c.i || uid(), ts: Date.now(), title: c.t || 'ใบงาน', seed: Number(c.s) || 0,
    topics: Array.isArray(c.tp) ? c.tp : [], subs: Array.isArray(c.sb) ? c.sb : [],
    counts: c.c || {}, piMode: PI_MODES[c.pm] ? c.pm : '3.14',
    kind: c.k === 'test' ? 'test' : 'practice', seedShift: Number(c.sh) || 0,
    items: items
  };
}

/** ผสานไฟล์สำรองของนักเรียนหนึ่งไฟล์เข้ากับข้อมูลในเครื่อง โดยไม่ทับของเดิม */
function mergeBackup(o, st) {
  if (!o || !Array.isArray(o.quizzes) || !Array.isArray(o.attempts)) { st.bad++; return; }
  o.quizzes.forEach(q => {
    if (q && q.id && !DB.quizzes.some(x => x.id === q.id)) { DB.quizzes.push(q); st.quizzes++; }
  });
  o.attempts.forEach(a => {
    if (!a || !a.finishedAt) { st.unfinished++; return; }
    if (DB.attempts.some(x => x.id === a.id)) { st.dup++; return; }
    if (!DB.quizzes.some(x => x.id === a.quizId)) { st.noQuiz++; return; }
    const copy = Object.assign({}, a);
    // studentId ของเครื่องนักเรียนใช้บนเครื่องครูไม่ได้ ต้องจับคู่ใหม่
    // ยุบช่องว่างซ้ำก่อนเทียบ เพราะนักเรียนมักเคาะวรรคเกินตอนพิมพ์ชื่อตัวเอง
    const norm = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
    const inCls = x => !DB.cur.classId || x.classId === DB.cur.classId;
    const nm = norm(copy.soloName), sid = norm(copy.sid);
    // เลขประจำตัวเชื่อถือได้กว่าชื่อ (ไม่มีปัญหาสะกดผิด) จึงลองจับคู่ด้วยเลขประจำตัวก่อน
    let s = sid && DB.students.find(x => norm(x.sid) === sid && inCls(x));
    if (!s) s = nm && DB.students.find(x => norm(x.name) === nm && inCls(x));
    if (s) { copy.studentId = s.id; copy.soloName = s.name; st.matched++; }
    else { copy.studentId = null; copy.soloName = nm || '(ไม่ระบุชื่อ)'; st.unmatched.push(copy.soloName); }
    DB.attempts.push(copy);
    st.attempts++;
  });
}

async function mergeStudentFiles() {
  const files = await pickFiles('.json,application/json');
  if (!files.length) return;
  const st = { quizzes: 0, attempts: 0, dup: 0, bad: 0, unfinished: 0, noQuiz: 0, matched: 0, unmatched: [] };
  for (const f of files) {
    let o = null;
    try { o = JSON.parse(await f.text()); } catch (e) { st.bad++; continue; }
    mergeBackup(o, st);
  }
  if (st.attempts) { Object.keys(PCACHE).forEach(k => delete PCACHE[k]); save(true); render(); }

  const uniqUn = Array.from(new Set(st.unmatched));
  let msg = '<b>เพิ่มผลการทำ ' + st.attempts + ' รายการ</b> จาก ' + files.length + ' ไฟล์';
  if (st.quizzes) msg += '<br>เพิ่มชุดโจทย์ใหม่ ' + st.quizzes + ' ชุด';
  if (st.matched) msg += '<br>จับคู่กับรายชื่อในเครื่องได้ ' + st.matched + ' รายการ';
  if (uniqUn.length) msg += '<br><span style="color:var(--warn)">จับคู่รายชื่อไม่ได้ ' + uniqUn.length +
    ' คน — จะแสดงตามชื่อที่นักเรียนพิมพ์เอง: ' + esc(uniqUn.slice(0, 12).join(', ')) +
    (uniqUn.length > 12 ? ' …' : '') + '</span>';
  if (st.dup) msg += '<br>ข้ามรายการซ้ำ ' + st.dup + ' รายการ';
  if (st.unfinished) msg += '<br>ข้ามรายการที่ยังทำไม่จบ ' + st.unfinished + ' รายการ';
  if (st.noQuiz) msg += '<br><span style="color:var(--bad)">ข้าม ' + st.noQuiz +
    ' รายการ เพราะไม่พบชุดโจทย์ที่อ้างถึง (ให้รวมไฟล์ของครูที่มีชุดโจทย์นั้นก่อน)</span>';
  if (st.bad) msg += '<br><span style="color:var(--bad)">อ่านไม่ได้ ' + st.bad + ' ไฟล์</span>';
  openModal({ title: 'ผลการรวมไฟล์', bodyHTML: '<div style="line-height:1.9">' + msg + '</div>' });
}

/** แถวคะแนนของชุดโจทย์หนึ่ง เรียงตามเลขที่ เพื่อส่งออกไปยังโปรแกรมบันทึกคะแนน */
function scoreRows(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return { q: null, rows: [] };
  const best = {};
  DB.attempts.filter(a => a.quizId === quizId && a.finishedAt).forEach(a => {
    const key = a.studentId || ('solo:' + (a.soloName || ''));
    if (!best[key] || a.finishedAt > best[key].finishedAt) best[key] = a;
  });
  const rows = [];
  const roster = DB.students.filter(s => !DB.cur.classId || s.classId === DB.cur.classId);
  if (DB.mode === 'class' && roster.length) {
    // ยึดรายชื่อในห้องเป็นหลัก คนที่ยังไม่ได้ทำให้เว้นว่างไว้ ตำแหน่งแถวจะได้ตรงกับสมุดคะแนน
    roster.slice().sort((a, b) => (a.no || 0) - (b.no || 0)).forEach(s => {
      const a = best[s.id];
      const r = a ? analyze(a) : null;
      rows.push({ no: s.no, sid: s.sid || '', name: s.name, got: r ? r.got : '', max: q.items.length,
                  pct: r ? Math.round(r.pct) : '', sec: r ? r.sec : '', done: !!a });
    });
    // ผลที่จับคู่กับรายชื่อไม่ได้ (เช่น นักเรียนพิมพ์ชื่อไม่ตรง หรือย้ายเข้าใหม่)
    // ต่อท้ายไว้เสมอ ไม่ปล่อยให้หายไปเงียบ ๆ ครูจะได้เห็นแล้วแก้รายชื่อได้
    Object.keys(best).filter(k => k.indexOf('solo:') === 0).forEach(k => {
      const a = best[k], r = analyze(a);
      rows.push({ no: '', sid: '', name: a.soloName || '', got: r.got, max: q.items.length,
                  pct: Math.round(r.pct), sec: r.sec, done: true, orphan: true });
    });
  } else {
    Object.values(best).sort((x, y) => String(x.soloName || '').localeCompare(String(y.soloName || ''), 'th'))
      .forEach((a, i) => {
        const r = analyze(a);
        rows.push({ no: i + 1, sid: '', name: a.soloName || '', got: r.got, max: q.items.length,
                    pct: Math.round(r.pct), sec: r.sec, done: true });
      });
  }
  return { q: q, rows: rows };
}

async function exportScoreColumn(quizId) {
  const { q, rows } = scoreRows(quizId);
  if (!q) return;
  // คอลัมน์ที่คัดลอกต้องมีเฉพาะคนในรายชื่อ ไม่งั้นแถวจะเลื่อนไม่ตรงกับสมุดคะแนน
  const inList = rows.filter(r => !r.orphan);
  const orphans = rows.filter(r => r.orphan);
  const txt = inList.map(r => (r.done ? fmt(r.got) : '')).join('\n');
  const ok = await copyText(txt);
  if (!ok) { toast('คัดลอกไม่สำเร็จ ให้ใช้ปุ่มดาวน์โหลด CSV แทน', 'bad'); return; }
  if (orphans.length) {
    toast('คัดลอก ' + inList.length + ' แถวแล้ว — แต่มี ' + orphans.length +
      ' คนที่ไม่อยู่ในรายชื่อและไม่ถูกคัดลอก ดูรายละเอียดในไฟล์ CSV', 'warn');
  } else {
    toast('คัดลอกคะแนน ' + inList.length + ' แถวแล้ว — ไปวางในช่องแรกของคอลัมน์คะแนนได้เลย', 'ok');
  }
}

function exportScoreCsv(quizId) {
  const { q, rows } = scoreRows(quizId);
  if (!q) return;
  const esc2 = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const clsName = (DB.mode === 'class' && DB.cur.classId) ? (classById(DB.cur.classId) || {}).name || '' : '';
  const lines = [['ชั้น', 'เลขที่', 'เลขประจำตัว', 'ชื่อ-นามสกุล', 'คะแนน', 'คะแนนเต็ม', 'ร้อยละ',
    'เวลาที่ใช้(วินาที)', 'สถานะ'].map(esc2).join(',')];
  rows.forEach(r => lines.push([r.orphan ? '' : clsName, r.no, r.sid || '', r.name,
    r.done ? fmt(r.got) : '', r.max, r.done ? r.pct : '', r.done ? Math.round(r.sec) : '',
    r.orphan ? 'ไม่พบชื่อนี้ในรายชื่อห้อง' : (r.done ? 'ทำแล้ว' : 'ยังไม่ได้ทำ')].map(esc2).join(',')));

  download(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }),
    'คะแนน_' + String(q.title).replace(/[\\/:*?"<>|]/g, '') + '.csv');

}
