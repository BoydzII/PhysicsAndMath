   ครูพิมพ์โจทย์และเฉลยเองทีละข้อ ไม่เกี่ยวกับคลังแม่แบบ
   ให้คะแนนด้วยเกณฑ์ 5 ขั้น ขั้นละ 20% ของคะแนนเต็มข้อนั้น
   เกณฑ์นี้คือวิธีทำที่แอปแสดงให้นักเรียนดูอยู่แล้ว จึงไม่ใช่ของใหม่ที่ต้องมาสอนเพิ่ม */
const ESSAY_STEPS = [
  'วิเคราะห์โจทย์ — บอกได้ว่าโจทย์กำหนดอะไรมา และให้หาอะไร',
  'เลือกสมการที่ใช้ได้ถูกต้อง',
  'แทนค่าลงในสมการได้ถูกต้อง',
  'คำนวณได้คำตอบถูกต้อง',
  'สรุปคำตอบพร้อมหน่วย'
];
const ESSAY_SHORT = ['วิเคราะห์', 'สมการ', 'แทนค่า', 'คำนวณ', 'สรุป'];
function isEssayItem(it) { return !!(it && it.essay); }
function hasEssay(q) { return !!(q && q.items && q.items.some(isEssayItem)); }
/** คะแนนเต็มของข้อหนึ่ง — ปรนัยข้อละ 1 · อัตนัยตามที่ครูตั้ง */
function itemMax(it) { return isEssayItem(it) ? Math.max(0, Number(it.max) || 0) : 1; }
/** คะแนนที่ได้จากเกณฑ์ 5 ขั้น — ติ๊กกี่ขั้นก็ได้สัดส่วนนั้นของคะแนนเต็มข้อ */
function essayScore(max, rub) {
  const n = (rub || []).filter(Boolean).length;
  return Math.max(0, Number(max) || 0) * n / ESSAY_STEPS.length;
}
function isPaper(q) { return !!(q && (q.paper || hasEssay(q))); }
/** โจทย์เทียม — มีแค่ตัวเลือกกับเฉลย ตัวตรวจคำตอบเดิมใช้ได้ทันที
    ตั้ง paper: true ไว้ให้ที่อื่นแยกออกว่าข้อนี้ไม่มีเนื้อโจทย์ให้แสดง */
function paperProblems(quiz) {
  const ch = clamp(Number((quiz.paper || {}).ch) || 4, 2, 5);
  return quiz.items.map(function (it, i) {
    if (isEssayItem(it)) {
      // ข้ออัตนัยไม่มีตัวเลือกและไม่มีคำตอบที่เครื่องตรวจได้ ครูให้คะแนนเอง
      return {
        paper: true, essay: true, no: i + 1, max: itemMax(it),
        topic: (quiz.paper && quiz.paper.topic != null) ? Number(quiz.paper.topic) : null,
        sub: 'อัตนัย', level: 'ทฤษฎี', skills: [],
        stem: String(it.stem || ''), keyText: String(it.key || ''), typed: !!it.typed,
        given: [], finds: [], choices: null
      };
    }
    const key = Number(it.ans);
    const cs = [];
    const st = paperStyle(quiz);
    for (let k = 0; k < ch; k++) cs.push({ text: paperLabel(st, k), correct: k === key });
    return {
      paper: true, theory: true, no: i + 1,
      topic: quiz.paper.topic == null ? null : Number(quiz.paper.topic),
      sub: 'ข้อสอบกระดาษ', level: 'ทฤษฎี', skills: [],
      stem: 'ข้อ ' + (i + 1) + ' ของข้อสอบที่ครูแจก', given: [], finds: [], choices: cs
    };
  });
}
/* รูปแบบตัวเลือกที่แสดงบนกระดาษคำตอบ ต้องตรงกับข้อสอบที่ครูแจก
   ไม่งั้นนักเรียนอ่านข้อสอบเห็น "3" แต่ในแอปมีให้กด ก ข ค ง แล้วต้องมาแปลงเอง */
const PAPER_STYLES = { th: 'กขคงจ', en: 'ABCDE', num: '12345' };
function paperStyle(q) {
  const st = q && q.paper ? q.paper.st : '';
  return PAPER_STYLES[st] ? st : 'th';
}
function paperLabel(style, k) { return (PAPER_STYLES[style] || PAPER_STYLES.th)[k] || '?'; }

/** แปลงข้อความเฉลยเป็นรายการเลขตัวเลือก พร้อมเดารูปแบบที่ครูใช้
    รับได้ทั้ง "1.ก 2.ข" · "กขคงข" · "334122342" · "1) 3" ทีละบรรทัด · a b c d
    คืน { keys, style } — style คือรูปแบบที่จะเอาไปแสดงบนกระดาษคำตอบ */
function parsePaperKeys(text) {
  const s = String(text || '');
  const TH = 'กขคงจ', EN = 'abcde';
  /* ตัวอักษรไม่มีทางกำกวม ถ้ามีอยู่แม้แต่ตัวเดียวก็ถือว่าตัวอักษรคือคำตอบ
     ตัวเลขที่ปนมาจึงเป็นเลขลำดับข้อ ไม่ใช่คำตอบ */
  const letters = [];
  let thai = false;
  s.split('').forEach(function (c) {
    let k = TH.indexOf(c);
    if (k >= 0) thai = true;
    else k = EN.indexOf(c.toLowerCase());
    if (k >= 0) letters.push(k);
  });
  if (letters.length) return { keys: letters, style: thai ? 'th' : 'en' };

  /* ไม่มีตัวอักษรเลย = ครูใช้ตัวเลขเป็นตัวเลือก
     รูปแบบ "1. 3" หรือ "1) 3" คือเลขลำดับข้อตามด้วยคำตอบ ต้องเอาเฉพาะตัวหลัง
     ต้องเจอตั้งแต่สองคู่ขึ้นไปถึงจะเชื่อ กันไม่ให้ "3.4" ที่เป็นเลขทศนิยมหลอกเอาได้ */
  const pairs = s.match(/\d+\s*[.)\-:]\s*[1-5](?![0-9])/g) || [];
  if (pairs.length >= 2) {
    return { keys: pairs.map(function (x) { return Number(x[x.length - 1]) - 1; }), style: 'num' };
  }

  const nums = [];
  s.split('').forEach(function (c) {
    const k = '12345'.indexOf(c);
    if (k >= 0) nums.push(k);
  });
  return { keys: nums, style: 'num' };
}

/* แคชโจทย์ที่สร้างแล้ว เพื่อไม่ต้องคำนวณซ้ำทุกครั้งที่วาดหน้าจอ */
const PCACHE = {};
/** seedShift ทำให้แบบทดสอบใช้แม่แบบและระดับความยากชุดเดิมเป๊ะ แต่ตัวเลขในโจทย์ต่างออกไป
    เก็บไว้ที่ตัวชุดโจทย์ ทุกที่ที่เรียก problemsOf() จึงได้โจทย์ชุดเดียวกันเสมอ
    ไม่มีทางที่หน้าทำข้อสอบกับตัวตรวจคำตอบจะใช้คนละเลข */
function problemsOf(quiz) {
  if (!quiz) return [];
  if (isPaper(quiz)) {
    const pk = 'paper:' + quiz.id;
    if (!PCACHE[pk]) PCACHE[pk] = paperProblems(quiz);
    return PCACHE[pk];
  }
  const sh = (quiz.seedShift || 0) >>> 0;
  const key = quiz.id + ':' + sh;
  if (PCACHE[key]) return PCACHE[key];
  const arr = quiz.items.map(it =>
    buildProblem(it.tplId, ((it.seed + sh) >>> 0), { piMode: quiz.piMode }));
  PCACHE[key] = arr;
  return arr;
}
/** คะแนนเต็มของชุด — ไม่ใช่จำนวนข้อ เพราะข้ออัตนัยข้อเดียวอาจ 10 คะแนน */
function quizMaxScore(quiz) {
  return ((quiz && quiz.items) || []).reduce(function (s, it) { return s + itemMax(it); }, 0);
}

/** สร้างแบบทดสอบจากแบบฝึกหัดชุดหนึ่ง — แม่แบบ/หัวข้อ/ระดับเหมือนเดิมทุกข้อ แต่ตัวเลขคนละชุด */
function makeTestFrom(quiz, title) {
  let sh = 0;
  // กันกรณีสุ่มได้ 0 พอดี ซึ่งจะทำให้ตัวเลขซ้ำกับแบบฝึกหัดเป๊ะ
  while (!sh) sh = Math.floor(Math.random() * 2000000000) + 1;
  return {
    id: uid(), ts: Date.now(),
    title: title || ('แบบทดสอบ — ' + (quiz.title || '')),
    kind: 'test', seedShift: sh, fromQuizId: quiz.id,
    seed: quiz.seed, topics: (quiz.topics || []).slice(), subs: (quiz.subs || []).slice(),
    counts: Object.assign({}, quiz.counts),
    piMode: quiz.piMode,
    items: quiz.items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}

let MYA = { list: null, loading: false, err: '' };

async function loadMyAssignments(force) {
  if (MYA.loading) return;
  if (MYA.list && !force) return;
  MYA.loading = true; MYA.err = '';
  renderMyAssignments();
  try { MYA.list = await api('myAssignments', {}); }
  catch (e) { MYA.err = e.message; }
  finally { MYA.loading = false; renderMyAssignments(); }
}

function renderMyAssignments() { renderMake(); }

  else {
    h += '<div class="tablewrap"><table><thead><tr><th>รหัส</th><th>ชื่อใบงาน</th>' +

        const mine = done[a.code];

        return '<tr><td><b>' + esc(a.code) + '</b></td><td>' + esc(a.title) + '</td>' +
          '<td class="hint">' + (a.closeAt ? esc(thDateTime(new Date(a.closeAt).getTime())) : '—') + '</td>' +

      }).join('') + '</tbody></table></div>';

function bindMyAssignments() {
  const l = $('#myaLoad'); if (l) l.addEventListener('click', () => loadMyAssignments(true));
  const c = $('#myaCode'); if (c) c.addEventListener('click', takeByCode);
  const fb = $('#myaFlush'); if (fb) fb.addEventListener('click', () => flushOutbox(true));
  $$('[data-take]').forEach(b => b.addEventListener('click', () => takeAssignment(b.dataset.take)));
}

/** อ่านเฉพาะ id ของชุดโจทย์จากสเปก โดยไม่ต้องถอดทั้งชุด */
function decodeQuizId(spec) {
  const q = decodeQuiz(spec);
  return q ? q.id : null;
}

/** รับใบงานตามรหัสแล้วเริ่มทำทันที */
async function takeAssignment(code) {
  try {
    const a = await api('assignGet', { code: code });
    const q = decodeQuiz(a.spec);
    if (!q) { toast('อ่านใบงานนี้ไม่ได้ — แจ้งครูให้มอบหมายใหม่', 'bad'); return; }
    if (!DB.quizzes.some(x => x.id === q.id)) DB.quizzes.push(q);
    DB.cur.quizId = q.id;
    save(true);
    startQuiz(q.id, a.code);
  } catch (e) { toast(e.message, 'bad'); }
}

function takeByCode() {
  openModal({
    title: 'กรอกรหัสใบงาน',
    bodyHTML: '<div class="hint" style="margin-bottom:9px">กรอกรหัส 6 ตัวที่ครูให้มา</div>' +
      '<input type="text" id="tcCode" maxlength="6" autocapitalize="characters" ' +
      'style="width:100%;font-size:26px;text-align:center;letter-spacing:7px;text-transform:uppercase">' +
      '<div id="tcMsg" style="margin-top:10px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'รับใบงาน', cls: 'primary', act: async (close, root) => {
          const c = ($('#tcCode', root).value || '').trim().toUpperCase();
          if (c.length !== 6) { $('#tcMsg', root).innerHTML = '<div class="notice bad">รหัสต้องมี 6 ตัว</div>'; return; }
          try {
            const a = await api('assignGet', { code: c });
            const q = decodeQuiz(a.spec);
            if (!q) throw new Error('อ่านใบงานนี้ไม่ได้');
            if (!DB.quizzes.some(x => x.id === q.id)) DB.quizzes.push(q);
            save(true); close(); startQuiz(q.id, a.code);
          } catch (e) { $('#tcMsg', root).innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>'; }
        } }
    ],
    onMount: root => $('#tcCode', root).focus()
  });
}

function formulaHTML(topicId) {
  const t = topicOf(topicId), list = FORMULAS[topicId] || [];
  if (!list.length) return '<div class="hint">ยังไม่มีสรุปสูตรของบทนี้</div>';
  return '<div class="fxlist">' + list.map(f =>
    '<div class="fxrow"><div class="fxe">' + M(f.e) + '</div>' +
    (f.d ? '<div class="fxd">' + f.d + '</div>' : '') + '</div>').join('') +
    '</div><div class="hint" style="margin-top:10px">' +
    (t && t.exam ? 'หมวดนี้เป็น<b>เทคนิคการทำข้อสอบ</b> ใช้ควบคู่กับสูตรของบทเรียนปกติ'
                 : 'ทบทวนสูตรให้แม่นก่อนลงมือทำโจทย์ จะช่วยให้เลือกวิธีได้เร็วขึ้นมาก') + '</div>';
}

function showFormulas(topicId) {
  const t = topicOf(topicId);
  openModal({
    title: (t ? (t.icon || '') + ' สรุปสูตร ' + chLabel(t) + ' ' + t.name : 'สรุปสูตร'),
    bodyHTML: formulaHTML(topicId),
    buttons: [{ label: 'ปิด' },
              { label: 'ดูสรุปสูตรทุกบท', act: (close) => { close(); showAllFormulas(); } }]
  });
}

function showAllFormulas() {
  openModal({
    title: '📘 สรุปหลักการและสูตรเคมีทุกบท',
    bodyHTML: TOPICS.map(t =>
      '<div class="fxhead">' + (t.icon || '') + ' ' + chLabel(t) + ' &nbsp;' + esc(t.name) + '</div>' +
      formulaHTML(t.id)).join('<div style="height:14px"></div>'),
    buttons: [{ label: 'ปิด' },
              { label: 'พิมพ์ใบสรุปสูตร', cls: 'primary', act: (close) => { close(); printFormulas(); } }]
  });
}

/** ข้อความช่วงชั้นบนหัวเอกสาร — เปลี่ยนตามระดับชั้นที่มีเรื่องอยู่จริงในไฟล์นี้
    ไฟล์ที่มีแค่ ม.1 จะขึ้นว่า "ชั้นมัธยมศึกษาปีที่ 1" ไม่ใช่ ม.1–ม.3 ลอย ๆ */
function gradeSpanText() {
  const gs = gradesInUse().filter(g => g.id).map(g => g.id);
  if (!gs.length) return 'ระดับมัธยมศึกษาตอนต้น';
  if (gs.length === 1) return 'ชั้นมัธยมศึกษาปีที่ ' + gs[0];
  return 'ชั้นมัธยมศึกษาปีที่ ' + gs[0] + '–' + gs[gs.length - 1];
}

/** สร้างใบสรุปสูตรลงพื้นที่พิมพ์ แล้วเปิดกล่องพิมพ์ของเครื่อง */
function printFormulas() {
  const hd = DB.settings.header || {};
  let h = '<div class="phead">' +
    (DB.settings.logo ? '<img class="plogo" src="' + DB.settings.logo + '" alt="">' : '') +
    '<div class="t1">' + esc(hd.school || '') + '</div>' +
    '<div class="t2">ใบสรุปหลักการและสูตรเคมี ' + gradeSpanText() + '</div>' +
    '<div class="t3">' + esc(hd.term || '') + (hd.teacher ? ' &nbsp;·&nbsp; ครูผู้สอน ' + esc(hd.teacher) : '') + '</div>' +
    '</div><hr class="prule">';
  TOPICS.forEach(t => {
    h += '<div class="pitem"><div class="fxhead">' + chLabel(t) + ' &nbsp;' + esc(t.name) + '</div>' +
      formulaHTML(t.id) + '</div>';
  });
  if (DB.settings.showCredit) {
    const a = DB.settings.about || {};
    h += '<div class="credit-print">พัฒนาโดย ' + esc(a.dev || '') +
      (a.dept ? ' &nbsp;·&nbsp; ' + esc(a.dept) : '') + '</div>';
  }
  $('#printarea').innerHTML = h;
  setTimeout(() => window.print(), 60);
}

        : Math.round(DB.settings.examMin || 0)) + '"></div>' +
      '<div><label class="hint" for="ppOut">ออกจากแอปได้ (ครั้ง)</label><br>' +
      '<input type="number" id="ppOut" min="0" max="99" style="width:96px" inputmode="numeric" value="' +
      (quiz ? (quiz.maxOut || 0) : Math.round(DB.settings.examMaxOut || 0)) + '"></div>' +
      '<div><label class="hint" for="ppOutSec">รวมเวลานอกแอป (วินาที)</label><br>' +
      '<input type="number" id="ppOutSec" min="0" max="3600" step="10" style="width:110px" ' +
      'inputmode="numeric" value="' +
      (quiz ? (quiz.maxOutSec || 0) : Math.round(DB.settings.examMaxOutSec || 0)) + '"></div></div>' +
      '<div class="hint" style="margin-top:5px">ใส่ 0 = ไม่จำกัด · ' +
      'ค่านี้ติดไปกับชุดนี้ชุดเดียว แก้ทีหลังได้ แต่ไม่กระทบคนที่เริ่มสอบไปแล้ว</div>' +
      '<label class="hint" for="ppKeys" style="display:block;margin-top:11px">เฉลย</label>' +
      '<textarea id="ppKeys" style="width:100%;min-height:96px;font-size:16px" ' +
      'placeholder="พิมพ์แบบไหนก็ได้ เช่น  กขคงข  ·  ABCDB  ·  33412234  ·  1.ก 2.ข  ·  1) 3">' +
      esc(keyNow) + '</textarea>' +
      '<div class="hint" id="ppCount" style="margin-top:6px">กรอกเป็น ก ข ค ง · A B C D · ' +
      'หรือ 1 2 3 4 ก็ได้ ระบบดูให้เองว่าเลขไหนคือลำดับข้อ เลขไหนคือคำตอบ</div>' +
      '<div id="ppMsg" style="margin-top:10px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: quiz ? 'บันทึกเฉลย' : 'สร้างกระดาษคำตอบ', cls: 'primary', act: (close, root) => {
          const msg = $('#ppMsg', root);
          const title = ($('#ppTitle', root).value || '').trim();
          const ch = Number($('#ppCh', root).value) || 4;
          const tpv = $('#ppTopic', root).value;
          const raw = $('#ppKeys', root).value;
          const keys = parsePaperKeys(raw).keys;
          const st = PAPER_STYLES[$('#ppStyle', root).value] ? $('#ppStyle', root).value : 'th';
          if (!title) { msg.innerHTML = '<div class="notice bad">ตั้งชื่อชุดก่อน</div>'; return; }
          if (!keys.length) {
            msg.innerHTML = '<div class="notice bad">' +
              (raw.trim() ? 'อ่านเฉลยจากที่กรอกไม่ออก — ใช้ได้เฉพาะ ก ข ค ง จ · A B C D E · หรือเลข 1 ถึง 5'
                          : 'ยังไม่ได้กรอกเฉลย') + '</div>';
            return;
          }
          if (keys.length > 200) { msg.innerHTML = '<div class="notice bad">เกิน 200 ข้อ</div>'; return; }
          const over = keys.filter(k => k >= ch);
          if (over.length) {
            msg.innerHTML = '<div class="notice bad">มีเฉลยเป็น <b>' +
              esc(over.map(k => paperLabel(st, k)).join(' ')) + '</b> แต่ตั้งไว้ ' + ch +
              ' ตัวเลือก — เปลี่ยนจำนวนตัวเลือกหรือแก้เฉลยให้ตรงกัน</div>';
            return;
          }
          const num = (sel, max) => clamp(Math.round(Number($(sel, root).value) || 0), 0, max);
          const lim = { limitSec: num('#ppMin', 300) * 60, maxOut: num('#ppOut', 99),
                        maxOutSec: num('#ppOutSec', 3600) };
          const items = keys.map(k => ({ paper: 1, ans: k }));
          const pp = { ch: ch, topic: tpv === '' ? null : Number(tpv), st: st };
          if (quiz) {
            quiz.title = title; quiz.paper = pp; quiz.items = items;
            quiz.limitSec = lim.limitSec; quiz.maxOut = lim.maxOut; quiz.maxOutSec = lim.maxOutSec;
            delete PCACHE['paper:' + quiz.id];
            save(true); close(); renderMake();
            toast('บันทึกเฉลย ' + items.length + ' ข้อแล้ว', 'ok');
            return;
          }
          const q = createPaperQuiz(title, pp, items, lim);
          DB.quizzes.push(q);
          DB.cur.quizId = q.id;
          save(true); close(); renderMake();
          toast('สร้างกระดาษคำตอบ ' + items.length + ' ข้อแล้ว — กด "เปิดให้นักเรียนสอบ" ได้เลย', 'ok');
        } }
    ],
    onMount: root => {
      const box = $('#ppKeys', root), out = $('#ppCount', root);
      const styleSel = $('#ppStyle', root);
      const show = () => {
        const r = parsePaperKeys(box.value);
        if (!r.keys.length) {
          out.innerHTML = 'กรอกเป็น ก ข ค ง · A B C D · หรือ 1 2 3 4 ก็ได้';
          return;
        }
        // ปรับรูปแบบที่จะแสดงให้ตรงกับที่ครูกรอกมา เปลี่ยนเองทีหลังได้
        if (styleSel) styleSel.value = r.style;
        out.innerHTML = 'อ่านเฉลยได้ <b>' + r.keys.length + ' ข้อ</b> · ' +
          'ข้อแรก ๆ คือ <b>' +
          esc(r.keys.slice(0, 8).map(k => paperLabel(r.style, k)).join(' ')) +
          (r.keys.length > 8 ? ' …' : '') + '</b>';
      };
      box.addEventListener('input', show);
      show(); box.focus();
    }
  });
}

/* --- 5.2ง ข้อสอบอัตนัย ---------------------------------------------------
   ครูพิมพ์โจทย์และเฉลยเองทีละข้อ แล้วให้คะแนนด้วยเกณฑ์ 5 ขั้น          */

/** กรอบเขียนคำตอบของข้ออัตนัยในใบที่พิมพ์ — หัวข้อตามเกณฑ์ 5 ขั้นที่ใช้ตรวจ
    นักเรียนจึงเห็นตั้งแต่บนกระดาษว่าต้องเขียนอะไรถึงจะได้คะแนนแต่ละส่วน
    จำนวนบรรทัดผันตามคะแนนเต็ม ข้อ 10 คะแนนต้องมีที่มากกว่าข้อ 5 คะแนน */
function essayWorkBox(max) {
  const per = clamp(Math.round((Number(max) || 5) / 5), 1, 6);
  return '<div class="work">' + ESSAY_SHORT.map(function (s, i) {
    return '<div class="wcap">' + (i + 1) + '. ' + s + '</div>' +
      new Array(per + 1).join('<div class="wl"></div>');
  }).join('') + '</div>';
}

/** วาดรายการข้อในกล่องพิมพ์ข้อสอบใหม่ทุกครั้งที่เพิ่มหรือลบข้อ */
function essayRows(list, root) {
  const box = $('#esList', root);
  if (!box) return;
  box.innerHTML = list.map(function (it, i) {
    return '<div class="card" style="margin:0 0 10px">' +
      '<div class="row" style="margin-bottom:7px"><b class="grow">ข้อ ' + (i + 1) + '</b>' +
      '<label class="hint">คะแนนเต็ม <input type="number" data-esmax="' + i + '" min="1" max="100" ' +
      'style="width:70px" inputmode="numeric" value="' + (Number(it.max) || 10) + '"></label>' +
      '<label class="chk" style="margin:0"><input type="checkbox" data-estyped="' + i + '"' +
      (it.typed ? ' checked' : '') + '><span><span class="t">พิมพ์ตอบในแอป</span></span></label>' +
      '<button class="sm danger" data-esdel="' + i + '">ลบข้อนี้</button></div>' +
      '<textarea data-esstem="' + i + '" rows="3" style="width:100%" ' +
      'placeholder="โจทย์ข้อนี้">' + esc(it.stem || '') + '</textarea>' +
      '<textarea data-eskey="' + i + '" rows="3" style="width:100%;margin-top:7px" ' +
      'placeholder="เฉลย / แนวคำตอบที่ครูใช้ตรวจ (นักเรียนไม่เห็น)">' + esc(it.key || '') + '</textarea>' +
      '</div>';
  }).join('') || '<div class="hint">ยังไม่มีข้อ — กด "เพิ่มข้อ" ด้านล่าง</div>';

  // เก็บค่าลงอาเรย์ทันทีที่พิมพ์ เพื่อไม่ให้หายตอนกดเพิ่มหรือลบข้อ
  $$('[data-esstem]', box).forEach(function (t) {
    t.addEventListener('input', function (e) { list[Number(e.target.dataset.esstem)].stem = e.target.value; });
  });
  $$('[data-eskey]', box).forEach(function (t) {
    t.addEventListener('input', function (e) { list[Number(e.target.dataset.eskey)].key = e.target.value; });
  });
  $$('[data-esmax]', box).forEach(function (t) {
    t.addEventListener('input', function (e) {
      list[Number(e.target.dataset.esmax)].max = clamp(Math.round(Number(e.target.value) || 0), 1, 100);
    });
  });
  $$('[data-estyped]', box).forEach(function (t) {
    t.addEventListener('change', function (e) { list[Number(e.target.dataset.estyped)].typed = e.target.checked; });
  });
  $$('[data-esdel]', box).forEach(function (b) {
    b.addEventListener('click', function (e) {
      list.splice(Number(e.target.dataset.esdel), 1);
      essayRows(list, root);
    });
  });
}

/** กล่องสร้างหรือแก้ข้อสอบอัตนัย — ส่ง quiz มาถ้าเป็นการแก้ของเดิม */
function essayDialog(quiz) {
  const list = quiz ? quiz.items.filter(isEssayItem).map(function (it) {
    return { stem: it.stem || '', key: it.key || '', max: itemMax(it), typed: !!it.typed };
  }) : [{ stem: '', key: '', max: 10, typed: false }];
  openModal({
    wide: true,
    title: quiz ? ('แก้ข้อสอบอัตนัย ' + (quiz.title || '')) : 'สร้างข้อสอบอัตนัย',
    bodyHTML:
      '<div class="hint" style="margin-bottom:11px">ครูพิมพ์โจทย์เองทีละข้อ ' +
      '<b>ไม่เกี่ยวกับคลังโจทย์ที่สุ่มได้</b> · เฉลยที่กรอกไว้ใช้ตอนครูตรวจและตอนพิมพ์ใบเฉลย ' +
      'นักเรียนไม่เห็น<br>' +
      'ให้คะแนนด้วย<b>เกณฑ์ 5 ขั้น ขั้นละ 20%</b> ของคะแนนเต็มข้อนั้น — ' +
      esc(ESSAY_SHORT.join(' · ')) + '</div>' +
      '<label class="hint" for="esTitle">ชื่อชุด</label>' +
      '<input type="text" id="esTitle" style="width:100%" value="' + esc(quiz ? quiz.title : '') +
      '" placeholder="เช่น ข้อสอบอัตนัย บทที่ 2 การเคลื่อนที่">' +
      '<div class="row" style="margin-top:11px">' +
      '<div><label class="hint" for="esMin">เวลาสอบ (นาที)</label><br>' +
      '<input type="number" id="esMin" min="0" max="300" step="5" style="width:96px" inputmode="numeric" value="' +
      (quiz ? Math.round((quiz.limitSec || 0) / 60) : Math.round(DB.settings.examMin || 0)) + '"></div>' +
      '<div class="grow"><label class="hint" for="esTopic">นับเข้าบท (ไม่ระบุก็ได้)</label><br>' +
      '<select id="esTopic" style="max-width:100%"><option value="">ไม่ระบุ</option>' +
      TOPICS.map(t => '<option value="' + t.id + '"' +
        (quiz && quiz.paper && quiz.paper.topic != null && Number(quiz.paper.topic) === t.id ? ' selected' : '') +
        '>' + esc(t.icon + ' ' + t.name) + '</option>').join('') + '</select></div></div>' +
      '<div id="esList" style="margin-top:13px"></div>' +
      '<div class="row"><button class="sm" id="esAdd">+ เพิ่มข้อ</button>' +
      '<span class="hint grow" id="esSum"></span></div>' +
      '<div id="esMsg" style="margin-top:10px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: quiz ? 'บันทึก' : 'สร้างข้อสอบ', cls: 'primary', act: (close, root) => {
          const msg = $('#esMsg', root);
          const title = ($('#esTitle', root).value || '').trim();
          const good = list.filter(function (x) { return String(x.stem || '').trim(); });
          if (!title) { msg.innerHTML = '<div class="notice bad">ตั้งชื่อชุดก่อน</div>'; return; }
          if (!good.length) { msg.innerHTML = '<div class="notice bad">ยังไม่มีข้อที่พิมพ์โจทย์ไว้</div>'; return; }
          const items = good.map(function (x) {
            return { essay: 1, stem: String(x.stem).trim(), key: String(x.key || '').trim(),
                     max: clamp(Math.round(Number(x.max) || 10), 1, 100), typed: x.typed ? 1 : 0 };
          });
          const tpv = $('#esTopic', root).value;
          const lim = clamp(Math.round(Number($('#esMin', root).value) || 0), 0, 300) * 60;
          if (quiz) {
            quiz.title = title; quiz.items = items; quiz.limitSec = lim;
            quiz.paper = { ch: 4, topic: tpv === '' ? null : Number(tpv), st: 'th' };
            delete PCACHE['paper:' + quiz.id];
            save(true); close(); renderMake();
            toast('บันทึกข้อสอบ ' + items.length + ' ข้อแล้ว', 'ok');
            return;
          }
          const q = createPaperQuiz(title, { ch: 4, topic: tpv === '' ? null : Number(tpv), st: 'th' },
            items, { limitSec: lim, maxOut: Math.round(DB.settings.examMaxOut || 0),
                     maxOutSec: Math.round(DB.settings.examMaxOutSec || 0) });
          DB.quizzes.push(q); DB.cur.quizId = q.id;
          save(true); close(); renderMake();
          toast('สร้างข้อสอบอัตนัย ' + items.length + ' ข้อ รวม ' + quizMaxScore(q) + ' คะแนน', 'ok');
        } }
    ],
    onMount: root => {
      const sum = () => {
        const el = $('#esSum', root);
        const tot = list.reduce(function (s, x) { return s + (Number(x.max) || 0); }, 0);
        if (el) el.innerHTML = list.length + ' ข้อ · รวม <b>' + tot + ' คะแนน</b>';
      };
      const draw = () => { essayRows(list, root); sum(); };
      $('#esAdd', root).addEventListener('click', () => {
        list.push({ stem: '', key: '', max: 10, typed: false }); draw();
      });
      // ยอดคะแนนต้องขยับตามตอนพิมพ์ด้วย ไม่ใช่เฉพาะตอนเพิ่มหรือลบข้อ
      $('#esList', root).addEventListener('input', sum);
      draw();
      $('#esTitle', root).focus();
    }
  });
}

/** หน้าให้คะแนนอัตนัย — ครูติ๊กเกณฑ์ 5 ขั้นต่อข้อ ทีละคน */
function essayGradeBox(quizId) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  const list = DB.attempts.filter(a => a.quizId === quizId && a.finishedAt)
    .sort((a, b) => String(attemptWho(a)).localeCompare(String(attemptWho(b)), 'th'));
  if (!list.length) {
    openModal({ title: 'ให้คะแนนอัตนัย',
      bodyHTML: '<div class="notice info">ยังไม่มีใครส่งชุดนี้<br>' +
        'ถ้านักเรียนทำบนเครื่องตัวเองแล้ว ให้กด <b>ดึงผลจากชีต</b> ที่แท็บสถิติชั้นเรียนก่อน</div>',
      buttons: [{ label: 'ปิด' }] });
    return;
  }
  const probs = problemsOf(q);
  const es = probs.map((p, i) => ({ p: p, i: i })).filter(x => x.p.essay);
  let at = 0;

  const draw = root => {
    const a = list[at];
    const box = $('#egBody', root);
    box.innerHTML =
      '<div class="row" style="margin-bottom:11px"><b class="grow">' + esc(attemptWho(a)) + '</b>' +
      '<span class="hint">คนที่ ' + (at + 1) + ' จาก ' + list.length + '</span></div>' +
      es.map(function (x) {
        const it = a.answers[x.i] || {};
        const rub = it.rub || [];
        return '<div class="card" style="margin:0 0 11px"><h3>ข้อ ' + (x.i + 1) +
          '<span class="sub">' + fmt(x.p.max) + ' คะแนน · ขั้นละ ' +
          fmt(x.p.max / ESSAY_STEPS.length) + '</span></h3>' +
          '<div class="hint" style="margin-bottom:8px">' + M(x.p.stem) + '</div>' +
          (x.p.keyText ? '<div class="notice info" style="margin-bottom:8px"><b>เฉลย</b> ' +
            M(x.p.keyText) + '</div>' : '') +
          (x.p.typed ? '<div class="notice" style="margin-bottom:8px;white-space:pre-wrap">' +
            (String(it.text || '').trim() ? esc(it.text) :
              '<span class="hint">นักเรียนไม่ได้พิมพ์คำตอบ</span>') + '</div>' : '') +
          '<div>' + ESSAY_STEPS.map(function (s, si) {
            return '<label class="chk"><input type="checkbox" data-eg="' + x.i + '" data-egs="' + si + '"' +
              (rub[si] ? ' checked' : '') + '><span><span class="t">' + (si + 1) + '. ' + esc(s) +
              '</span></span></label>';
          }).join('') + '</div>' +
          '<div class="hint" style="margin-top:7px">ได้ <b data-egsum="' + x.i + '">' +
          fmt(essayScore(x.p.max, rub)) + '</b> จาก ' + fmt(x.p.max) + ' คะแนน</div></div>';
      }).join('');

    $$('[data-eg]', box).forEach(function (c) {
      c.addEventListener('change', function (e) {
        const k = Number(e.target.dataset.eg), si = Number(e.target.dataset.egs);
        const it = a.answers[k];
        if (!it.rub) it.rub = [false, false, false, false, false];
        it.rub[si] = e.target.checked;
        const pp = probs[k];
        it.score = essayScore(pp.max, it.rub);
        const sumEl = $('[data-egsum="' + k + '"]', box);
        if (sumEl) sumEl.textContent = fmt(it.score);
        save(true);
      });
    });
  };

  openModal({
    wide: true,
    title: 'ให้คะแนนอัตนัย · ' + (q.title || ''),
    bodyHTML: '<div class="hint" style="margin-bottom:11px">ติ๊กขั้นที่นักเรียนทำได้ ' +
      'คะแนนคิดให้อัตโนมัติขั้นละ 20% ของคะแนนเต็มข้อนั้น · บันทึกทันทีทุกครั้งที่ติ๊ก</div>' +
      '<div id="egBody"></div>',
    buttons: [
      { label: 'คนก่อนหน้า', act: (c, root) => { at = (at + list.length - 1) % list.length; draw(root); } },
      { label: 'คนถัดไป', act: (c, root) => { at = (at + 1) % list.length; draw(root); } },
      { label: 'เสร็จแล้ว', cls: 'primary', act: c => { c(); renderMake(); toast('บันทึกคะแนนแล้ว', 'ok'); } }
    ],
    onMount: root => draw(root)
  });
}

/** ใบตอบเป็นแบบทดสอบเสมอ และประทับกติกาคุมสอบเหมือนชุดที่สุ่มจากแม่แบบ */
function createPaperQuiz(title, pp, items, lim) {
  return {
    id: uid(), ts: Date.now(), title: title, seed: 0,
    topics: pp.topic == null ? [] : [pp.topic], subs: [], counts: {},
    kind: 'test', seedShift: 0, paper: pp,
    limitSec: lim.limitSec, maxOut: lim.maxOut, maxOutSec: lim.maxOutSec,
    g: DB.settings.g, easyG10: !!DB.settings.easyG10,
    items: items
  };
}

/* --- 5.2ค ชุดลัด — กดปุ่มเดียวได้ชุดโจทย์พร้อมใช้ ------------------------ */
/* scope เขียนได้ 4 แบบ
     'all'   ทุกเรื่องในไฟล์นี้        'core'  ทุกเรื่องยกเว้นหมวดแนวข้อสอบ
     'g1' 'g2' 'g3' 'ex'  เฉพาะระดับชั้นนั้น   หรือใส่เป็นอาเรย์ของ id เรื่องตรง ๆ
   ปุ่มที่ไม่มีเรื่องรองรับ (เช่น ม.2 ที่ยังไม่มีคลังโจทย์) จะถูกซ่อนอัตโนมัติ */
const PRESETS = [
  { key: 'concept', icon: '💡', name: 'เช็กความเข้าใจ 15 ข้อ', scope: 'core', kind: 'practice',
    counts: { 'ทฤษฎี': 15 },
    desc: 'ปรนัยเชิงแนวคิดล้วน ไม่ต้องคำนวณ เฉลยบอกด้วยว่าตัวเลือกอื่นผิดตรงไหน' },

/** ระดับชั้นที่ชุดลัดกำลังเล็งอยู่ — 'all' คือคละทุกชั้น
    เมื่อมีคลังโจทย์หลายภาคเรียน ปุ่ม "ฝึกเร็ว" ต้องรู้ว่าจะสุ่มจากเทอมไหน
    ไม่งั้นเด็กที่เพิ่งเรียนเทอม 1 จะได้โจทย์เทอม 2 ปนมาโดยไม่รู้ตัว */
function presetGrade() {
  const k = (DB.cur && DB.cur.pg) || 'all';
  if (k === 'all') return null;
  const g = GRADES.find(x => x.key === k && x.id);
  return g && TOPICS.some(t => gradeOf(t) === g.id) ? g : null;
}

function presetTopics(scope) {
  if (Array.isArray(scope)) return scope.slice();
  const gs = GRADES.find(x => x.key === scope);
  if (gs) return TOPICS.filter(t => gradeOf(t) === gs.id).map(t => t.id);
  let list = scope === 'core' ? TOPICS.filter(t => !t.exam) : TOPICS.slice();
  const pg = presetGrade();
  if (pg) list = list.filter(t => gradeOf(t) === pg.id);   // เล็งเฉพาะชั้นที่ครูเลือกไว้
  return list.map(t => t.id);
}
/** ชุดลัดที่ยังไม่มีเรื่องรองรับ ไม่ต้องขึ้นปุ่มให้กดแล้วเจอ error */
function presetsAvailable() { return PRESETS.filter(p => presetTopics(p.scope).length); }

function runPreset(key) {
  const ps = PRESETS.find(p => p.key === key);
  if (!ps) return;
  // ตรวจชื่อผู้เรียนก่อนสร้างชุด ไม่งั้นจะได้ชุดโจทย์ค้างไว้โดยที่ยังเริ่มทำไม่ได้
  if (needLearnerName()) return;
  const c = mkCfg();
  c.topics = presetTopics(ps.scope);
  c.subs = [];
  c.mode = 'mix';
  c.counts = Object.assign({}, ps.counts);
  c.kind = ps.kind;
  const pg = presetGrade();
  const title = ps.name.replace(/\s*\d+\s*ข้อ.*$/, '').trim() +
    (pg && ps.scope !== 'ex' ? ' ' + pg.label : '') + ' — ' + thDate(Date.now());
  c.lastTitle = title;
  const q = createQuiz({
    title: title, topics: c.topics, subs: [], counts: c.counts, kind: ps.kind,
    seed: Math.floor(Math.random() * 2000000000) + 1
  });
  if (q.error) { toast(q.error, 'bad'); return; }
  DB.quizzes.push(q);
  DB.cur.quizId = q.id;
  save(true);
  toast('สร้าง' + ps.name + 'แล้ว — กดเริ่มทำได้เลย', 'ok');
  startQuiz(q.id);
}

        '</td><td class="num">' + q.items.length + '</td><td>' + lv + '</td>' +
        '<td>' + thDateTime(q.ts) + '</td><td class="num">' + nAt + '</td>' +
        '<td><button class="sm primary" data-start="' + q.id + '">เริ่มทำ</button> ' +
        '<button class="sm" data-print="' + q.id + '">พิมพ์</button> ' +
        '<button class="sm" data-share="' + q.id + '">แชร์</button> ' +
        (isTest(q) ? '' : '<button class="sm" data-mktest="' + q.id + '">สร้างแบบทดสอบ</button> ') +
        (isAdmin() ? '<button class="sm" data-publish="' + q.id + '">มอบหมาย</button> ' : '') +
        '<button class="sm danger" data-delq="' + q.id + '">ลบ</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  $('#pane-make').innerHTML = h;

  // --- ผูกเหตุการณ์ ---
  $$('[data-preset]').forEach(b => b.addEventListener('click', () => runPreset(b.dataset.preset)));
  $$('[data-pg]').forEach(b => b.addEventListener('click', () => {
    DB.cur.pg = b.dataset.pg; save(); renderMake();
  }));
  $$('[data-fx]').forEach(b => b.addEventListener('click', () => showFormulas(Number(b.dataset.fx))));
  $('#btnAllFx').addEventListener('click', showAllFormulas);
  const setTopics = ids => { c.topics = ids; c.subs = []; save(); renderMake(); };
  $('#btnAllTopic').addEventListener('click', () => setTopics(ALL_TOPIC_IDS.slice()));
  $$('[data-gsel]').forEach(b => b.addEventListener('click', () => {
    const g = Number(b.dataset.gsel);
    setTopics(TOPICS.filter(t => gradeOf(t) === g).map(t => t.id));
  }));
  $$('[data-topic]').forEach(cb => cb.addEventListener('change', e => {
    const id = Number(e.target.dataset.topic);
    const i = c.topics.indexOf(id);
    if (i >= 0) {
      c.topics.splice(i, 1);
      c.subs = c.subs.filter(s => subsOf(id).indexOf(s) < 0);   // เอาหัวข้อย่อยของเรื่องที่ปิดออกด้วย
    } else c.topics.push(id);
    save(); renderMake();
  }));
  $$('[data-sub]').forEach(cb => cb.addEventListener('change', e => {
    const s = e.target.dataset.sub, i = c.subs.indexOf(s);
    if (i >= 0) c.subs.splice(i, 1); else c.subs.push(s);
    save(); renderMake();
  }));
  $$('[data-mode]').forEach(b => b.addEventListener('click', () => {
    c.mode = b.dataset.mode; save(); renderMake();
  }));
  $$('[data-count]').forEach(inp => inp.addEventListener('change', e => {
    c.counts[e.target.dataset.count] = clamp(Math.round(Number(e.target.value) || 0), 0, 40);
    save(); renderMake();
  }));
  const nq = $('#nq');
  if (nq) nq.addEventListener('change', e => { c.n = clamp(Math.round(Number(e.target.value) || 1), 1, 40); save(); renderMake(); });
  $$('input[name=qk]').forEach(r => r.addEventListener('change', e => {
    c.kind = e.target.value; save(); renderMake();
  }));
  $('#btnGen').addEventListener('click', doGenerate);
  const bp = $('#btnPaper');
  if (bp) bp.addEventListener('click', () => paperDialog(null));
  const be = $('#btnEssay');
  if (be) be.addEventListener('click', () => essayDialog(null));
  $$('[data-editkey]').forEach(b => b.addEventListener('click', () =>
    paperDialog(DB.quizzes.find(x => x.id === b.dataset.editkey))));
  $$('[data-esedit]').forEach(b => b.addEventListener('click', () =>
    essayDialog(DB.quizzes.find(x => x.id === b.dataset.esedit))));
  $$('[data-esgrade]').forEach(b => b.addEventListener('click', () => essayGradeBox(b.dataset.esgrade)));
  $$('[data-mktest]').forEach(b => b.addEventListener('click', () => makeTestDialog(b.dataset.mktest)));
  if (isStudent()) bindMyAssignments();
  $$('[data-start]').forEach(b => b.addEventListener('click', () => startQuiz(b.dataset.start)));
  $$('[data-print]').forEach(b => b.addEventListener('click', () => { DB.cur.quizId = b.dataset.print; save(); setTab('print'); }));
  $$('[data-delq]').forEach(b => b.addEventListener('click', async () => {
    const q = DB.quizzes.find(x => x.id === b.dataset.delq);
    const n = DB.attempts.filter(a => a.quizId === q.id).length;
    const ok = await confirmBox('ลบชุดโจทย์', 'ลบ "' + esc(q.title) + '" ?' +
      (n ? '<br><b>จะลบผลการทำ ' + n + ' ครั้งที่ผูกกับชุดนี้ไปด้วย</b>' : ''), 'ลบ');
    if (!ok) return;
    DB.quizzes = DB.quizzes.filter(x => x.id !== q.id);
    DB.attempts = DB.attempts.filter(a => a.quizId !== q.id);
    if (DB.cur.quizId === q.id) { DB.cur.quizId = null; DB.cur.attemptId = null; }
    delete PCACHE[q.id];
    save(true); renderMake(); toast('ลบแล้ว');
  }));
  $$('[data-share]').forEach(b => b.addEventListener('click', () => shareQuiz(b.dataset.share)));
  $$('[data-publish]').forEach(b => b.addEventListener('click', () => publishQuiz(b.dataset.publish)));
  $('#btnPasteQuiz').addEventListener('click', pasteQuiz);
}

      '<div id="qPasteMsg" style="margin-top:8px"></div>',
    buttons: [
      { label: 'ยกเลิก' },
      { label: 'รับใบงาน', cls: 'primary', act: (close, root) => {

          const q = decodeQuiz(val);

function doGenerate() {
  const c = mkCfg();
  if (!c.topics.length) { toast('เลือกอย่างน้อยหนึ่งเรื่องก่อน', 'bad'); return; }
  // ตรวจชื่อผู้เรียนก่อนสร้างชุด เหตุผลเดียวกับใน runPreset
  if (needLearnerName()) return;
  const counts = {};
  if (c.mode === 'mix') LEVELS.forEach(l => counts[l] = c.counts[l] || 0);
  else counts[c.mode] = c.n;
  const total = LEVELS.reduce((s, l) => s + (counts[l] || 0), 0);
  if (total < 1) { toast('ระบุจำนวนข้ออย่างน้อย 1 ข้อ', 'bad'); return; }
  if (total > 40) { toast('ชุดหนึ่งได้สูงสุด 40 ข้อ', 'bad'); return; }

  const kind = c.kind === 'test' ? 'test' : 'practice';
  const shortOf = t => { const x = TOPICS.find(v => v.id === t); return x ? x.short : ''; };
  const title = ($('#qtitle').value || '').trim() ||
    (QUIZ_KINDS[kind].name + ' ' + c.topics.map(shortOf).filter(Boolean).join(' + ') + ' ' + thDate(Date.now()));
  c.lastTitle = title;
  const q = createQuiz({
    title: title, topics: c.topics, subs: c.subs, counts: counts, kind: kind,
    seed: Math.floor(Math.random() * 2000000000) + 1
  });
  if (q.error) { toast(q.error, 'bad'); return; }
  DB.quizzes.push(q);
  DB.cur.quizId = q.id;
  save(true);
  toast('สร้าง' + QUIZ_KINDS[kind].name + ' ' + q.items.length + ' ข้อแล้ว', 'ok');
  renderMake();
}

/* --- 5.3 เริ่มทำแบบฝึกหัด ------------------------------------------------- */
function currentLearner() {
  if (DB.mode === 'solo') {
    const p = DB.profile;
    return { studentId: null, name: p.name || 'ผู้เรียน',
             no: String(p.no || ''), sid: String(p.sid || ''), room: String(p.room || '') };
  }
  const s = studentById(DB.cur.studentId);
  return s ? { studentId: s.id, name: s.name, no: String(s.no || ''), sid: String(s.sid || ''),
               room: (classById(s.classId) || {}).name || '' } : null;
}
/** ยังไม่ได้ใส่ชื่อผู้เรียน — บอกให้ชัดแล้วพาไปที่ช่องกรอกเลย
    เดิมแค่ขึ้นข้อความเตือนแวบเดียวแล้วเงียบ ผู้ใช้จึงเห็นเป็น "กดแล้วไม่มีอะไรเกิดขึ้น"
    เจอบ่อยเป็นพิเศษตอนเปิดวิชาใหม่ เพราะแต่ละวิชาเก็บชื่อแยกคนละที่ในเบราว์เซอร์
    ชื่อที่เคยกรอกไว้ในวิชาอื่นจึงไม่ตามมาให้ */
function needLearnerName() {
  if (DB.mode !== 'solo' || DB.profile.name.trim()) return false;
  toast('ใส่ชื่อผู้เรียนที่ช่องด้านบนก่อน แล้วจึงเริ่มทำได้', 'bad');
  const el = $('#soloName');
  if (el) {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    el.focus();
    el.style.borderColor = 'var(--bad)';
    el.style.background = 'var(--bad-bg)';
    setTimeout(() => { el.style.borderColor = ''; el.style.background = ''; }, 2600);
  }
  return true;
}

async function startQuiz(quizId, assignCode) {
  const q = DB.quizzes.find(x => x.id === quizId);
  if (!q) return;
  const who = currentLearner();
  if (!who) { toast('เลือกผู้เรียนที่แถบบนก่อน (หรือเพิ่มรายชื่อในแท็บตั้งค่า)', 'bad'); return; }
  if (needLearnerName()) return;
  /* แจ้งนักเรียนก่อนเสมอว่าชุดนี้มีการคุมสอบ — ทั้งเรื่องความเป็นธรรม
     และเพราะการรู้ล่วงหน้านี่แหละคือสิ่งที่ทำให้ระบบได้ผลจริง */
  if (isTest(q) && (q.limitSec || q.maxOut || q.maxOutSec)) {
    const bits = [];
    if (q.limitSec) bits.push('• <b>จำกัดเวลา ' + Math.round(q.limitSec / 60) + ' นาที</b> ' +
      'นาฬิกาเดินต่อแม้จะออกจากแอปไปแล้ว');
    bits.push('• <b>ระบบบันทึกทุกครั้งที่ออกจากแอป</b> ทั้งจำนวนครั้งและเวลา และครูเห็นข้อมูลนี้');
    if (q.maxOut) bits.push('• ออกจากแอปได้ไม่เกิน <b>' + q.maxOut + ' ครั้ง</b> เกินกว่านั้นระบบจะส่งข้อสอบให้เอง');
    if (!await confirmBox('เริ่มทำแบบทดสอบ',
      'ชุดนี้เป็นแบบทดสอบที่มีการคุมสอบ<br>' + bits.join('<br>') +
      '<br><br>เริ่มแล้วนาฬิกาเดินทันที ต้องการเริ่มเลยหรือไม่?', 'เริ่มทำ')) return;
  }
  const a = {
    id: uid(), quizId: q.id, studentId: who.studentId, soloName: who.name,
    // ติดเลขที่/เลขประจำตัว/ชั้นไปกับผลด้วย เพื่อให้ครูจับคู่ได้แม่นตอนรวมไฟล์จากเครื่องนักเรียน
    no: who.no || '', sid: who.sid || '', room: who.room || '',
    assignCode: assignCode || null,   // ผูกกับใบงานบนชีต ถ้ามาจากการมอบหมาย
    startedAt: Date.now(), finishedAt: null,
    answers: q.items.map(it => ({ raw: [], pick: null, checked: !!(it.essay && !it.typed),
      score: 0, tries: 0, revealed: false, sec: 0, text: '', rub: null }))
  };
  procInit(a, q);          // ตั้งกติกาคุมสอบและ snapshot ไว้กับครั้งนี้
  DB.attempts.push(a);
  DB.cur.quizId = q.id; DB.cur.attemptId = a.id; DB.cur.i = 0;
  QT.i = -1;
  save(true);
  setTab('do');
}

/* --- 5.4 แท็บทำแบบฝึกหัด -------------------------------------------------- */
const QT = { i: -1, t0: 0 };   // จับเวลาต่อข้อ
function stampTime() {
  const a = curAttempt();
  if (a && QT.i >= 0 && a.answers[QT.i]) a.answers[QT.i].sec += (Date.now() - QT.t0) / 1000;
  QT.i = -1;
}

/* --- 5.4ก คุมสอบ: จับการออกจากแอป และนาฬิกาสอบ ---------------------------
   ใช้กับชุด kind='test' เท่านั้น · เก็บทุกอย่างไว้กับ attempt จึงรีเฟรชแล้วไม่หาย
   และผสานไฟล์สำรองจากเครื่องนักเรียนแล้วยังครบ

   ใช้ visibilitychange กับ pagehide เท่านั้น ไม่ใช้ window.blur
   เพราะบนไอแพดแค่แป้นพิมพ์เด้งขึ้นหรือเปิดกล่องโมดัลก็ยิง blur แล้ว
   ถ้าใช้ตัวนั้นจะนับเกินจนตัวเลขใช้อ้างอิงอะไรไม่ได้เลย

   สิ่งที่ระบบนี้ทำไม่ได้ (ต้องบอกครูให้ชัด) — จับได้เฉพาะบนเครื่องเดียวกัน
   เปิดมือถืออีกเครื่อง แคปหน้าจอ หรือเพื่อนบอก จับไม่ได้ทั้งสิ้น
   -------------------------------------------------------------------------- */
const PROC_MIN_SEC = 1.5;     // ออกไปสั้นกว่านี้ไม่นับ (แถบแจ้งเตือน · สลับพลาด)
const PROC_MAX_EVENTS = 200;  // กันข้อมูลบวมเมื่อมีคนสลับแอปรัว ๆ

/** ตั้งกติกาคุมสอบให้ครั้งที่เพิ่งเริ่ม — snapshot ไว้กับ attempt เลย
    ครูเปลี่ยนค่าตั้งกลางคันแล้วต้องไม่กระทบคนที่กำลังสอบอยู่ */
function procInit(a, q) {
  if (!isTest(q)) return;
  const s = DB.settings;
  a.limitSec  = Math.round((q.limitSec  != null ? q.limitSec  : (s.examMin || 0) * 60) || 0);
  a.maxOut    = Math.round((q.maxOut    != null ? q.maxOut    : s.examMaxOut || 0) || 0);
  a.maxOutSec = Math.round((q.maxOutSec != null ? q.maxOutSec : s.examMaxOutSec || 0) || 0);
  a.proc = { nOut: 0, secOut: 0, openAt: 0, events: [], autoBy: '' };
}
/** ครั้งที่กำลังทำอยู่และอยู่ในโหมดคุมสอบเท่านั้น นอกนั้นคืน null */
function procCur() {
  const a = curAttempt();
  if (!a || a.finishedAt || !a.proc) return null;
  return a;
}
/** ออกจากแอป — บันทึกทันที เพราะเครื่องอาจดับตอนนี้พอดี */
function procLeave() {
  const a = procCur(); if (!a) return;
  if (a.proc.openAt) return;              // ออกซ้อนกัน ไม่เปิดเหตุการณ์ใหม่
  a.proc.openAt = Date.now();
  a.proc.openQi = DB.cur.i;               // จำไว้ว่าออกตอนกำลังทำข้อไหน
  save(true);
}
/** กลับเข้าแอป — คืนจำนวนวินาทีที่หายไป หรือ null ถ้าสั้นเกินกว่าจะนับ */
function procReturn() {
  const a = procCur(); if (!a) return null;
  const t0 = a.proc.openAt;
  if (!t0) return null;
  a.proc.openAt = 0;
  const sec = (Date.now() - t0) / 1000;
  if (sec < PROC_MIN_SEC) { save(true); return null; }
  a.proc.nOut++;
  a.proc.secOut += sec;
  a.proc.events.push({ at: t0, sec: Math.round(sec), qi: a.proc.openQi });
  if (a.proc.events.length > PROC_MAX_EVENTS) a.proc.events.shift();
  save(true);
  return sec;
}
/** เกินโควตาแล้วหรือยัง — คืนข้อความเหตุผล หรือ '' ถ้ายังไม่เกิน */
function procOverQuota(a) {
  if (!a || !a.proc) return '';
  if (a.maxOut && a.proc.nOut > a.maxOut)
    return 'ออกจากแอป ' + a.proc.nOut + ' ครั้ง เกินที่กำหนดไว้ ' + a.maxOut + ' ครั้ง';
  if (a.maxOutSec && a.proc.secOut > a.maxOutSec)
    return 'อยู่นอกแอปรวม ' + mmss(a.proc.secOut) + ' นาที เกินที่กำหนดไว้ ' + mmss(a.maxOutSec);
  return '';
}
/** ไทม์ไลน์การออกจากแอป — ออกตอนนาทีที่เท่าไรของการสอบ ขณะทำข้อไหน และนานเท่าไร
    ยอดรวมบอกแค่ว่าออกกี่ครั้ง แต่ไทม์ไลน์บอกรูปแบบ ซึ่งครูใช้ตัดสินได้จริงกว่ามาก
    เช่น ออกรัวตอนใกล้หมดเวลา กับ ออกครั้งเดียวตอนต้นชั่วโมง ความหมายคนละเรื่อง */
function procTimeline(a) {
  if (!a || !a.proc || !a.proc.events || !a.proc.events.length) return '';
  return a.proc.events.map(function (e, k) {
    const at = Math.max(0, (e.at - a.startedAt) / 1000);
    return (k + 1) + ') นาทีที่ ' + mmss(at) +
      (e.qi != null ? ' ขณะทำข้อ ' + (e.qi + 1) : '') + ' นาน ' + mmss(e.sec);
  }).join('  ·  ');
}
/** วินาทีที่เหลือของนาฬิกาสอบ — null = ชุดนี้ไม่จำกัดเวลา
    คิดจากเวลาเริ่มเสมอ ห้ามนับถอยหลังด้วยตัวแปรในหน่วยความจำ
    ไม่งั้นรีเฟรชหน้าทีเดียวได้เวลาคืนฟรี */
function procSecLeft(a) {
  if (!a || !a.limitSec) return null;
  return Math.max(0, a.limitSec - (Date.now() - a.startedAt) / 1000);
}
/** กลับเข้าแอปแล้วเตือนให้เห็นเต็ม ๆ — เตือนทุกครั้ง ไม่ใช่แค่ครั้งแรก */
function procBack() {
  const sec = procReturn();
  if (sec == null) return;
  const a = procCur(); if (!a) return;
  const why = procOverQuota(a);
  if (why) { doFinish('ออกจากแอปเกินกำหนด'); return; }
  const quota = [];
  if (a.maxOut) quota.push('ออกได้อีก <b>' + Math.max(0, a.maxOut - a.proc.nOut) + ' ครั้ง</b>');
  if (a.maxOutSec) quota.push('เหลือเวลานอกแอปอีก <b>' + mmss(Math.max(0, a.maxOutSec - a.proc.secOut)) + '</b>');
  openModal({
    title: 'ระบบบันทึกว่าคุณออกจากแอป',
    bodyHTML: '<div class="notice warn">ครั้งนี้ออกไป <b>' + mmss(sec) + '</b> นาที<br>' +
      'รวมทั้งหมด <b>' + a.proc.nOut + ' ครั้ง</b> เป็นเวลา <b>' + mmss(a.proc.secOut) + '</b> นาที</div>' +
      (quota.length ? '<div class="hint" style="margin-top:9px">' + quota.join(' · ') +
        ' — เกินกว่านี้ระบบจะส่งข้อสอบให้อัตโนมัติ</div>' : '') +
      '<div class="hint" style="margin-top:9px">ข้อมูลนี้จะแสดงในผลสอบที่ครูเห็น</div>',
    buttons: [{ label: 'รับทราบ กลับไปทำต่อ', cls: 'primary' }]
  });
  renderDo();
}
/** เดินทุกวินาที — มีตัวเดียวในแอป เริ่มตอนบูตแล้วตรวจเงื่อนไขเอง
    (ห้ามเปิด-ปิดตามการวาดหน้าจอ เดี๋ยวหลุดค้างซ้อนกันหลายตัว) */
function procTick() {
  const a = procCur(); if (!a) return;
  const left = procSecLeft(a);
  if (left == null) return;
  const el = $('#examClock');
  if (el) {
    el.textContent = mmss(left);
    el.className = 'tag ' + (left <= 60 ? 'l3' : left <= 300 ? 'l2' : 't');
  }
  /* เตือนล่วงหน้าเมื่อเหลือ 5 นาที และ 1 นาที
     ป้ายนาฬิกาเปลี่ยนสีอย่างเดียวไม่พอ เพราะนักเรียนที่กำลังก้มเขียนไม่ได้มองจอ
     ติดธงไว้กับ attempt เพื่อไม่ให้เตือนซ้ำทุกวินาที และรีเฟรชหน้าแล้วไม่เตือนใหม่
     เตือนเฉพาะชุดที่เวลายาวพอ ไม่งั้นชุดสั้น ๆ จะเด้งเตือนตั้งแต่วินาทีแรก */
  if (a.limitSec > 330 && left <= 300 && left > 60 && !a.proc.warn5) {
    a.proc.warn5 = 1; save(true);
    toast('เหลือเวลาอีก 5 นาที', 'warn');
  }
  if (a.limitSec > 90 && left <= 60 && left > 0 && !a.proc.warn1) {
    a.proc.warn1 = 1; save(true);
    toast('เหลือเวลาอีก 1 นาที — ตรวจคำตอบแล้วกดส่งได้เลย', 'warn');
  }
  if (left <= 0) doFinish('หมดเวลา');
}
function gotoQ(i) {
  const a = curAttempt(); if (!a) return;
  stampTime();
  DB.cur.i = clamp(i, 0, a.answers.length - 1);
  QT.i = DB.cur.i; QT.t0 = Date.now();
  save(); renderDo();
}

function renderDo() {
  const a = curAttempt(), q = curQuiz();
  if (!a || !q || a.quizId !== q.id) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ยังไม่ได้เริ่มทำแบบฝึกหัด</h3>' +
      '<div class="hint">ไปที่แท็บ <b>สร้างชุดโจทย์</b> เพื่อสร้างชุดใหม่ หรือเลือกชุดที่มีอยู่แล้วกด <b>เริ่มทำ</b></div>' +
      '<div class="row" style="margin-top:10px"><button class="primary" id="goMake">ไปสร้างชุดโจทย์</button></div></div>';
    const b = $('#goMake'); if (b) b.addEventListener('click', () => setTab('make'));
    return;
  }
  if (a.finishedAt) {
    $('#pane-do').innerHTML = '<div class="card"><h3>ทำชุดนี้เสร็จแล้ว</h3>' +
      '<div class="hint">ชุด "' + esc(q.title) + '" ทำเสร็จเมื่อ ' + thDateTime(a.finishedAt) + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="primary" id="goRes">ดูผลและการวิเคราะห์</button>' +
      '<button id="goMake2">สร้าง / เลือกชุดใหม่</button></div></div>';
    $('#goRes').addEventListener('click', () => setTab('result'));
    $('#goMake2').addEventListener('click', () => setTab('make'));
    return;
  }

  const probs = problemsOf(q);
  const i = clamp(DB.cur.i, 0, probs.length - 1);
  const p = probs[i], it = a.answers[i];
  if (QT.i !== i) { QT.i = i; QT.t0 = Date.now(); }

  const done = a.answers.filter(x => x.checked).length;
  const gotScore = a.answers.reduce((s, x) => s + x.score, 0);
  const T = isTest(q);          // แบบทดสอบ: ไม่บอกถูกผิดและไม่มีเฉลยระหว่างทำ

  let h = '<div class="card noprint"><div class="row">' +
    '<div class="grow"><b>' + esc(q.title) + '</b> ' +
    '<span class="tag ' + QUIZ_KINDS[quizKind(q)].cls + '">' + QUIZ_KINDS[quizKind(q)].name + '</span>' +
    '<div class="hint">ผู้ทำ: ' + esc(attemptWho(a)) +
    ' · ข้อ ' + (i + 1) + ' จาก ' + probs.length +
    (T ? ' · ตอบแล้ว ' + done + ' ข้อ'
       : ' · ตรวจแล้ว ' + done + ' ข้อ · ได้ ' + fmt(gotScore) + ' คะแนน') +
    (T && a.limitSec ? ' · เหลือเวลา <span class="tag t" id="examClock">' + mmss(procSecLeft(a)) + '</span>' : '') +
    (T && a.proc && a.proc.nOut ? ' · <span class="tag l3">ออกจากแอป ' + a.proc.nOut + ' ครั้ง</span>' : '') +
    '</div></div>' +
    '<button class="sm" id="btnFinish">ส่งคำตอบ / จบชุดนี้</button></div>' +
    '<div class="bar" style="margin-top:9px"><i style="width:' + Math.round(done / probs.length * 100) + '%"></i></div>' +
    '<div class="qnav" style="margin-top:11px">' +
    a.answers.map((x, k) => {
      let cls = '';
      // ระหว่างทำข้อสอบ แสดงแค่ว่าตอบแล้วหรือยัง ไม่บอกว่าถูกหรือผิด
      if (x.checked) cls = T ? 'half' : (x.score >= 1 ? 'ok' : (x.score > 0 ? 'half' : 'bad'));
      if (k === i) cls += ' cur';
      return '<button class="' + cls + '" data-go="' + k + '">' + (k + 1) + '</button>';
    }).join('') + '</div>' +
    (T ? '<div class="hint" style="margin-top:9px">โหมดแบบทดสอบ — ไม่แสดงเฉลยและไม่บอกถูกผิดระหว่างทำ ' +
         'กลับไปแก้คำตอบข้อไหนก็ได้ก่อนกดส่ง</div>' : '') +
    (T && (a.limitSec || a.maxOut || a.maxOutSec)
      ? '<div class="notice warn" style="margin-top:9px">ชุดนี้มีการคุมสอบ — ' +
        '<b>ระบบบันทึกทุกครั้งที่ออกจากแอป</b>' +
        (a.limitSec ? ' · นาฬิกาเดินต่อแม้ออกจากแอปไปแล้ว' : '') +
        (a.maxOut ? ' · ออกได้ไม่เกิน ' + a.maxOut + ' ครั้ง เกินกว่านั้นระบบจะส่งให้เอง' : '') +
        '</div>' : '') + '</div>';

  // ใบงานที่มาจากไฟล์รุ่นใหม่กว่าอาจอ้างแม่แบบที่เครื่องนี้ยังไม่มี (เช่น บทที่เพิ่มภายหลัง)
  // กรณีนี้สร้างโจทย์ไม่ได้ ต้องบอกให้ชัดว่าให้ไปโหลดไฟล์รุ่นใหม่ ไม่ใช่ปล่อยให้จอว่าง
  if (!p) {
    h += '<div class="card"><div class="notice bad"><b>เปิดข้อนี้ไม่ได้</b><br>' +
      'ข้อนี้ใช้โจทย์จากบทที่ไฟล์รุ่นนี้ยังไม่มี — แปลว่าครูสร้างใบงานด้วยโปรแกรมรุ่นใหม่กว่า</div>' +
      '<div class="hint">วิธีแก้: <b>รีเฟรชหน้านี้</b> (ดึงลงบนไอแพด) เพื่อโหลดโปรแกรมรุ่นล่าสุด ' +
      'ถ้ายังไม่หาย ให้แจ้งครูว่าต้องอัปโหลดไฟล์รุ่นใหม่ขึ้นเว็บก่อน</div>' +
      '<div class="row" style="margin-top:11px">' +
      '<button class="primary" onclick="location.reload(true)">รีเฟรชโปรแกรม</button>' +
      '<button id="skipBad">ข้ามไปข้อถัดไป</button></div></div>';
    $('#pane-do').innerHTML = h;
    $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
    $('#btnFinish').addEventListener('click', finishAttempt);
    const sb = $('#skipBad');
    if (sb) sb.addEventListener('click', () => gotoQ(Math.min(i + 1, probs.length - 1)));
    return;
  }

  /* ใบตอบแสดงทุกข้อในหน้าเดียว ไม่ใช่ทีละข้อ
     เพราะนักเรียนอ่านโจทย์จากกระดาษ การบังคับกดเปลี่ยนหน้าทีละข้อมีแต่ทำให้ช้า */
  if (isPaper(q)) {
    h += '<div class="card"><h3>กระดาษคำตอบ<span class="sub">ข้อสอบอยู่บนกระดาษ ' +
      'อ่านโจทย์จากข้อสอบที่ครูแจก แล้วแตะตัวเลือกที่นี่</span></h3>' +
      '<div class="hint" style="margin-bottom:11px">แตะซ้ำที่ตัวเลือกเดิม = ยกเลิกคำตอบข้อนั้น · ' +
      'ตอบแล้ว <b>' + done + '</b> จาก ' + probs.length + ' ข้อ</div>' +
      '<div class="papersheet">' +
      probs.map(function (pp, k) {
        if (pp.essay) return '';
        const x = a.answers[k];
        return '<div class="paperrow"><span class="pno">' + (k + 1) + '</span>' +
          pp.choices.map(function (c, ci) {
            return '<button class="pbub' + (x.pick === ci ? ' sel' : '') +
              '" data-pk="' + k + '" data-pc="' + ci + '">' + esc(c.text) + '</button>';
          }).join('') + '</div>';
      }).join('') + '</div></div>';

    /* ข้ออัตนัยแสดงเป็นการ์ดเต็มความกว้าง เพราะมีโจทย์ให้อ่านจริง
       ข้อที่ครูให้เขียนลงกระดาษ จะไม่มีช่องพิมพ์ แต่ต้องบอกเกณฑ์ให้ครบ
       นักเรียนจะได้รู้ว่าต้องเขียนอะไรถึงจะได้คะแนนแต่ละส่วน */
    probs.forEach(function (pp, k) {
      if (!pp.essay) return;
      const x = a.answers[k];
      h += '<div class="card"><h3>ข้อ ' + (k + 1) +
        '<span class="sub">อัตนัย · ' + fmt(pp.max) + ' คะแนน</span></h3>' +
        '<div style="margin-bottom:10px;font-size:16px">' + M(pp.stem) + '</div>' +
        '<div class="hint"><b>เกณฑ์ให้คะแนน</b> ขั้นละ ' + fmt(pp.max / ESSAY_STEPS.length) +
        ' คะแนน<br>' + ESSAY_STEPS.map(function (s, si) {
          return (si + 1) + ') ' + esc(s);
        }).join('<br>') + '</div>';
      if (pp.typed) {
        h += '<textarea class="esin" data-es="' + k + '" rows="6" ' +
          'style="width:100%;margin-top:10px;font-size:16px" ' +
          'placeholder="พิมพ์วิธีทำตามลำดับห้าขั้น">' + esc(x.text || '') + '</textarea>';
      } else {
        h += '<div class="notice info" style="margin-top:10px">' +
          '<b>เขียนคำตอบข้อนี้ลงในกระดาษคำตอบ</b> — ครูจะตรวจและกรอกคะแนนให้ภายหลัง</div>';
      }
      h += '</div>';
    });
    h += '</div>';
    $('#pane-do').innerHTML = h;
    $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
    $('#btnFinish').addEventListener('click', finishAttempt);
    $$('[data-pk]').forEach(b => b.addEventListener('click', () =>
      setPaperAnswer(Number(b.dataset.pk), Number(b.dataset.pc))));
    $$('[data-es]').forEach(function (t) {
      t.addEventListener('input', function (e) {
        const k = Number(e.target.dataset.es), it = a.answers[k];
        it.text = e.target.value;
        it.checked = !!it.text.trim();
        save();
      });
    });
    return;
  }

  h += '<div class="card">' + problemHead(p, i + 1) + problemBody(p);

  // --- ช่องตอบ ---
  h += '<div class="ansbox">';
  if (p.choices) {
    h += '<div style="margin-bottom:9px"><b>เลือกคำตอบที่ถูกต้อง</b> ' +
      (p.theory ? '<span class="hint">(ข้อสอบเชิงแนวคิด ไม่ต้องคำนวณ)</span>'
                : '<span class="hint">(' + esc(p.finds[0].d) + ' หน่วย ' + esc(p.finds[0].unit || '—') + ')</span>') +
      '</div><div class="choices' + (p.theory ? ' txt' : '') + '">';
    p.choices.forEach((ch, k) => {
      let cls = 'choice';
      if (it.pick === k) cls += ' sel';
      if (it.checked && !T) { if (ch.correct) cls += ' ok'; else if (it.pick === k) cls += ' bad'; }
      h += '<button class="' + cls + '" data-pick="' + k + '"' + (it.checked && !T ? ' disabled' : '') + '>' +
        '<span class="k">' + 'กขคง'[k] + '.</span><span>' +
        (p.theory ? ch.text
                  : M((ch.text != null ? ch.text : fmt(ch.value)) +
                      (p.finds[0].unit ? ' `' + p.finds[0].unit + '`' : ''))) +
        '</span></button>';
    });
    h += '</div>';
  } else {
    h += ansHintHTML(p);
    p.finds.forEach((f, k) => {
      const okc = (it.checked && !T) ? (checkAns(it.raw[k], f) ? ' ok' : ' bad') : '';
      h += '<div class="ansrow"><label class="lab" for="in' + k + '">' + M(f.s) + ' <span class="hint">' + esc(f.d) + '</span></label>' +
        '<input type="text" inputmode="' + (f.kind === 'frac' ? 'text' : 'decimal') + '" class="numin' + okc +
        '" id="in' + k + '" data-in="' + k + '" value="' +
        esc(it.raw[k] == null ? '' : it.raw[k]) + '"' + (it.checked && !T ? ' disabled' : '') + '>' +
        '<span class="unit">' + esc(f.unit || '') + '</span></div>';
    });
  }
  if (T) {
    h += '<div class="row" style="margin-top:11px"><button class="primary" id="btnCheck">' +
      (it.checked ? 'บันทึกคำตอบใหม่' : 'บันทึกคำตอบ') + '</button>' +
      (it.checked ? '<span class="hint" style="color:var(--ok)">บันทึกคำตอบข้อนี้แล้ว — แก้ได้จนกว่าจะกดส่ง</span>'
                  : '<span class="hint">ยังไม่ได้บันทึกคำตอบข้อนี้</span>') + '</div>';
  } else if (it.checked) {
    const full = it.score >= 1, part = it.score > 0 && it.score < 1;
    h += '<div class="verdict ' + (full ? 'ok' : 'bad') + '">' +
      (full ? '✓ ถูกต้อง' : part ? '◑ ถูกบางส่วน — ได้ ' + fmt(it.score) + ' คะแนน' : '✗ ยังไม่ถูก') +
      '</div><div class="hint">คำตอบที่ถูกคือ ' +
      (p.theory
        ? 'ข้อ ' + 'กขคง'[p.choices.findIndex(c => c.correct)] + '.'
        : p.finds.map(f => M(f.s + ' = ' + ansTxt(f) + (f.unit ? ' `' + f.unit + '`' : ''))).join(' , ')) +
      '</div>';
    h += '<div class="row" style="margin-top:10px"><button class="sm" id="btnRetry">ลองทำใหม่ (ไม่นับคะแนน)</button></div>';
  } else {
    h += '<div class="row" style="margin-top:11px"><button class="primary" id="btnCheck">ตรวจคำตอบ</button>' +
      '<button id="btnReveal">ยังไม่รู้ ขอดูวิธีทำ</button></div>';
  }
  h += '</div>';

  // --- วิธีทำ (แบบทดสอบไม่แสดง) ---
  if (!T && (it.checked || it.revealed)) {
    h += '<h3 style="margin:16px 0 6px">วิธีทำอย่างละเอียด</h3>' +
      '<div class="hint" style="margin-bottom:8px">แตะหัวข้อแต่ละขั้นเพื่อเปิด-ปิด</div>' + solutionHTML(p, false);
  }

  h += '<div class="row" style="margin-top:14px">' +
    '<button id="btnPrev"' + (i === 0 ? ' disabled' : '') + '>← ข้อก่อนหน้า</button>' +
    '<button id="btnNext"' + (i === probs.length - 1 ? ' disabled' : '') + '>ข้อถัดไป →</button>' +
    '<div class="grow"></div><span class="hint">ใช้เวลาข้อนี้ไปแล้ว ' + mmss(it.sec) + '</span></div>';
  h += '</div>';

  $('#pane-do').innerHTML = h;

  // --- ผูกเหตุการณ์ ---
  $$('[data-go]').forEach(b => b.addEventListener('click', () => gotoQ(Number(b.dataset.go))));
  $('#btnPrev').addEventListener('click', () => gotoQ(i - 1));
  $('#btnNext').addEventListener('click', () => gotoQ(i + 1));
  $('#btnFinish').addEventListener('click', finishAttempt);
  $$('[data-pick]').forEach(b => b.addEventListener('click', () => {
    it.pick = Number(b.dataset.pick); save(); renderDo();
  }));
  $$('[data-in]').forEach(inp => {
    inp.addEventListener('input', e => { it.raw[Number(e.target.dataset.in)] = e.target.value; save(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkCurrent(); } });
  });
  const bc = $('#btnCheck'); if (bc) bc.addEventListener('click', checkCurrent);
  const br = $('#btnReveal'); if (br) br.addEventListener('click', () => {
    it.revealed = true; save(); renderDo();
    toast('เปิดวิธีทำแล้ว — ข้อนี้ยังตรวจคำตอบได้ตามปกติ');
  });
  const bt = $('#btnRetry'); if (bt) bt.addEventListener('click', () => {
    it.checked = false; it.raw = []; it.pick = null; save(); renderDo();
  });
  bindSolutionToggle($('#pane-do'));
  const first = $('.numin:not([disabled])');
  if (first && (T || !it.checked)) first.focus();
}

/** บันทึกคำตอบหนึ่งข้อบนใบตอบ — แตะซ้ำที่เดิมคือยกเลิกคำตอบ
    ให้คะแนนทันทีเหมือน checkCurrent เพื่อให้ทุกอย่างหลังจากนี้ทำงานเหมือนชุดปกติ
    ใบตอบเป็นแบบทดสอบเสมอ จึงไม่มีการล็อกคะแนนที่การตรวจครั้งแรก */
function setPaperAnswer(k, ci) {
  const a = curAttempt(), q = curQuiz(); if (!a || !q) return;
  const p = problemsOf(q)[k], it = a.answers[k]; if (!p || !it) return;
  // นับเวลาให้ข้อที่เพิ่งแตะ และบอกระบบคุมสอบว่ากำลังทำข้อไหนอยู่
  stampTime(); DB.cur.i = k; QT.i = k; QT.t0 = Date.now();
  if (it.pick === ci) { it.pick = null; it.checked = false; it.score = 0; }
  else { it.pick = ci; it.checked = true; it.tries++; it.score = p.choices[ci].correct ? 1 : 0; }
  save(true);
  renderDo();
  // ส่งความคืบหน้าขึ้นชีตเป็นระยะ — ไอแพดแบตหมดกลางคันก็ไม่เสียของ
  if (isStudent() && a.assignCode && DB.settings.autoDraft) {
    const n = a.answers.filter(x => x.checked).length;
    if (n % 5 === 0) sendAttempt(a, 'draft');
  }
}

/** ตรวจข้อปัจจุบัน — คะแนนจะถูกล็อกไว้ที่การตรวจครั้งแรกเพื่อให้สถิติสะท้อนความจริง */
function checkCurrent() {
  const a = curAttempt(), q = curQuiz(); if (!a || !q) return;
  const i = DB.cur.i, p = problemsOf(q)[i], it = a.answers[i];
  if (!p) { toast('ข้อนี้เปิดไม่ได้ในโปรแกรมรุ่นนี้ — ให้รีเฟรชหน้าเพื่อโหลดรุ่นล่าสุด', 'bad'); return; }
  const T = isTest(q);
  if (it.checked && !T) return;      // แบบทดสอบแก้คำตอบซ้ำได้จนกว่าจะส่ง
  let score = 0;
  if (p.choices) {
    if (it.pick == null) { toast('เลือกคำตอบก่อน', 'bad'); return; }
    score = p.choices[it.pick].correct ? 1 : 0;
  } else {
    let blank = 0, hit = 0;
    p.finds.forEach((f, k) => {
      if (parseNum(it.raw[k]) == null) blank++;
      else if (checkAns(it.raw[k], f)) hit++;
    });
    if (blank === p.finds.length) { toast('กรอกคำตอบก่อน', 'bad'); return; }
    score = hit / p.finds.length;
  }
  it.checked = true; it.tries++;
  // แบบฝึกหัดล็อกคะแนนที่การตรวจครั้งแรก · แบบทดสอบใช้คำตอบล่าสุดที่บันทึกไว้
  if (T || it.tries === 1) it.score = score;
  stampTime(); QT.i = i; QT.t0 = Date.now();
  save(true);
  renderDo();
  if (T) toast('บันทึกคำตอบข้อ ' + (i + 1) + ' แล้ว', 'ok');
  else toast(score >= 1 ? 'ถูกต้อง!' : score > 0 ? 'ถูกบางส่วน' : 'ยังไม่ถูก ลองดูวิธีทำ',
             score >= 1 ? 'ok' : score > 0 ? '' : 'bad');

  // ส่งความคืบหน้าขึ้นชีตทุก 3 ข้อ — ไอแพดแบตหมดกลางคันก็ไม่เสียของ
  if (isStudent() && a.assignCode && DB.settings.autoDraft) {
    const n = a.answers.filter(x => x.checked).length;
    if (n % 3 === 0) sendAttempt(a, 'draft');
  }
}

async function finishAttempt() {
  const a = curAttempt(); if (!a) return;
  const q0 = curQuiz();
  const left = a.answers.filter(x => !x.checked).length;
  if (left) {
    const ok = await confirmBox('ส่งคำตอบ', 'ยังเหลืออีก <b>' + left + ' ข้อ</b>ที่ยังไม่ได้' +
      (isTest(q0) ? 'บันทึกคำตอบ' : 'ตรวจ') + ' ข้อที่ไม่ได้ทำจะได้ 0 คะแนน ต้องการส่งเลยหรือไม่?', 'ส่งเลย');
    if (!ok) return;
  } else if (isTest(q0)) {
    // ข้อสอบส่งแล้วแก้ไม่ได้ ต้องยืนยันก่อนเสมอ
    if (!await confirmBox('ส่งแบบทดสอบ',
      'ตอบครบทุกข้อแล้ว — <b>ส่งแล้วจะแก้คำตอบไม่ได้อีก</b><br>ต้องการส่งเลยหรือไม่?', 'ส่งเลย')) return;
  }
  doFinish('');
}

/** ปิดชุดจริง ๆ — why ว่าง = นักเรียนกดส่งเอง · มีข้อความ = ระบบส่งให้อัตโนมัติ
    ทั้งสองทางต้องผ่านฟังก์ชันนี้ตัวเดียว ไม่งั้นผลของการส่งอัตโนมัติจะไม่ขึ้นชีต
    แล้วกว่าครูจะรู้ก็สอบไปแล้ว */
async function doFinish(why) {
  const a = curAttempt();
  if (!a || a.finishedAt) return;   // กันส่งซ้ำเมื่อนาฬิกากับโควตายิงพร้อมกัน
  if (why && a.proc) a.proc.autoBy = why;
  if (a.proc && a.proc.openAt) procReturn();
  stampTime();
  a.finishedAt = Date.now();
  save(true);                       // บันทึกก่อนทำอย่างอื่นเสมอ คำตอบห้ามหาย
  setTab('result');
  if (why) toast('ระบบส่งข้อสอบให้อัตโนมัติ — ' + why, 'warn');

  if (isStudent() && a.assignCode) {
    toast('กำลังส่งผลให้ครู…');
    const ok = await sendAttempt(a, 'final');
    if (ok) { MYA.list = null; toast('ส่งผลให้ครูเรียบร้อยแล้ว', 'ok'); }
    else toast('ส่งไม่สำเร็จ — เก็บไว้ในคิวแล้ว จะส่งให้เองเมื่อต่อเน็ตได้', 'warn');
    renderResult();
  }
}

/* ============================================================================
   6) การวิเคราะห์ผู้เรียนและสถิติ
   ========================================================================== */

function mean(a) { return a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0; }
function median(a) {
  if (!a.length) return 0;
  const b = a.slice().sort((x, y) => x - y), n = b.length;
  return n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2;
}
function stdev(a) {
  if (a.length < 2) return 0;
  const m = mean(a);
  return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1));
}
function pctCls(p) { return p >= 80 ? 'ok' : p >= 60 ? '' : p >= 40 ? 'warn' : 'bad'; }

/** วิเคราะห์ผลการทำหนึ่งครั้ง แยกตามเรื่อง ระดับ และทักษะ */
function analyze(a) {
  const q = quizOf(a);
  const probs = problemsOf(q);
  const res = {
    quiz: q, n: probs.length, got: 0,
    max: probs.reduce(function (s, p) { return s + (p && p.max ? p.max : 1); }, 0), pct: 0,
    byTopic: {}, byLevel: {}, bySkill: {}, bySub: {},
    sec: 0, revealed: 0, items: [],
    nOut: (a.proc && a.proc.nOut) || 0, secOut: (a.proc && a.proc.secOut) || 0,
    autoBy: (a.proc && a.proc.autoBy) || ''
  };
  const add = (bag, key, sc) => {
    if (!bag[key]) bag[key] = { got: 0, max: 0 };
    bag[key].got += sc; bag[key].max += 1;
  };
  probs.forEach((p, i) => {
    const it = a.answers[i] || { score: 0, sec: 0, revealed: false };
    const sc = (p && p.essay) ? essayScore(p.max, it.rub) : (it.score || 0);
    res.got += sc; res.sec += it.sec || 0;
    if (it.revealed) res.revealed++;
    // ข้อที่สร้างไม่ได้ (ใบงานอ้างแม่แบบที่ไฟล์รุ่นนี้ยังไม่มี) — นับคะแนนแต่ไม่แจกแจงตามเรื่อง
    if (!p) { res.items.push({ i: i, p: null, it: it, score: sc }); return; }
    if (p.paper) {
      if (p.topic != null) add(res.byTopic, p.topic, sc);
      res.items.push({ i: i, p: p, it: it, score: sc });
      return;
    }
    add(res.byTopic, p.topic, sc);
    add(res.byLevel, p.level, sc);
    add(res.bySub, p.sub, sc);
    (p.skills || []).forEach(sk => add(res.bySkill, sk, sc));
    res.items.push({ i: i, p: p, it: it, score: sc });
  });
  res.pct = res.max ? res.got / res.max * 100 : 0;
  Object.values(res.byTopic).concat(Object.values(res.byLevel), Object.values(res.bySkill), Object.values(res.bySub))
    .forEach(o => o.pct = o.max ? o.got / o.max * 100 : 0);
  return res;
}

/** รวมผลหลายครั้งของผู้เรียนคนเดียว ใช้ทำ "สรุปผลการเรียนสะสม" */
function analyzeMany(list) {
  const acc = { n: 0, got: 0, max: 0, byTopic: {}, byLevel: {}, bySkill: {}, bySub: {}, sec: 0 };
  const merge = (dst, src) => {
    Object.keys(src).forEach(k => {
      if (!dst[k]) dst[k] = { got: 0, max: 0 };
      dst[k].got += src[k].got; dst[k].max += src[k].max;
    });
  };
  list.forEach(a => {
    const r = analyze(a);
    acc.n++; acc.got += r.got; acc.max += r.max; acc.sec += r.sec;
    merge(acc.byTopic, r.byTopic); merge(acc.byLevel, r.byLevel);
    merge(acc.bySkill, r.bySkill); merge(acc.bySub, r.bySub);
  });
  acc.pct = acc.max ? acc.got / acc.max * 100 : 0;
  [acc.byTopic, acc.byLevel, acc.bySkill, acc.bySub].forEach(b =>
    Object.values(b).forEach(o => o.pct = o.max ? o.got / o.max * 100 : 0));
  return acc;
}

/** แถบเปอร์เซ็นต์แบบ HTML — พิมพ์ออกกระดาษได้ */
function barRows(bag, labelFn) {
  const keys = Object.keys(bag);
  if (!keys.length) return '<div class="hint">— ไม่มีข้อมูล —</div>';
  keys.sort((a, b) => bag[a].pct - bag[b].pct);
  return '<div>' + keys.map(k => {
    const o = bag[k];
    return '<div style="margin-bottom:9px"><div class="row" style="gap:6px;margin-bottom:3px">' +
      '<span class="grow">' + (labelFn ? labelFn(k) : esc(k)) + '</span>' +
      '<span style="font-variant-numeric:tabular-nums">' + fmt(o.got) + '/' + o.max + ' = <b>' + Math.round(o.pct) + '%</b></span></div>' +
      '<div class="bar ' + pctCls(o.pct) + '"><i style="width:' + Math.max(1, Math.round(o.pct)) + '%"></i></div></div>';
  }).join('') + '</div>';
}

/** ข้อเสนอแนะอัตโนมัติจากผลการวิเคราะห์ */
function advice(res) {
  const out = [];
  const pass = DB.settings.passPct;
  if (res.pct >= 80) out.push({ k: 'ok', t: 'ทำได้ดีมาก (' + Math.round(res.pct) + '%) เข้าใจเนื้อหาในระดับที่นำไปต่อยอดได้ ควรลองเพิ่มสัดส่วนโจทย์ระดับยากในชุดถัดไป' });
  else if (res.pct >= pass) out.push({ k: 'ok', t: 'ผ่านเกณฑ์ (' + Math.round(res.pct) + '% จากเกณฑ์ ' + pass + '%) พื้นฐานใช้ได้ แต่ยังมีจุดที่ควรเก็บให้แน่นตามรายการด้านล่าง' });
  else out.push({ k: 'bad', t: 'ยังไม่ผ่านเกณฑ์ (' + Math.round(res.pct) + '% จากเกณฑ์ ' + pass + '%) ควรทบทวนหัวข้อที่ระบุด้านล่างแล้วทำชุดโจทย์ระดับง่ายซ้ำก่อน' });

  const weakSkill = Object.keys(res.bySkill).filter(k => res.bySkill[k].max >= 2 && res.bySkill[k].pct < 50);
  weakSkill.sort((a, b) => res.bySkill[a].pct - res.bySkill[b].pct);
  weakSkill.slice(0, 4).forEach(sk =>
    out.push({ k: 'bad', t: 'ทักษะ "<b>' + esc(sk) + '</b>" ทำได้ ' + Math.round(res.bySkill[sk].pct) + '% — เป็นจุดที่ควรทบทวนก่อนเรื่องอื่น' }));

  const weakSub = Object.keys(res.bySub).filter(k => res.bySub[k].max >= 1 && res.bySub[k].pct < 50);
  if (weakSub.length) out.push({ k: 'warn', t: 'หัวข้อที่ควรกลับไปทบทวน: <b>' + weakSub.map(esc).join(', ') + '</b>' });

  const strong = Object.keys(res.bySkill).filter(k => res.bySkill[k].max >= 2 && res.bySkill[k].pct >= 80);
  if (strong.length) out.push({ k: 'ok', t: 'จุดแข็ง: <b>' + strong.slice(0, 5).map(esc).join(', ') + '</b>' });

  LEVELS.forEach(l => {
    const o = res.byLevel[l];
    if (o && o.max >= 2 && o.pct < 40)
      out.push({ k: 'warn', t: 'โจทย์ระดับ<b>' + l + '</b>ทำได้เพียง ' + Math.round(o.pct) + '% — ' +
        (l === 'ง่าย' ? 'ควรกลับไปทบทวนนิยามและสูตรพื้นฐานก่อน'
         : l === 'ปานกลาง' ? 'ควรฝึกการเลือกสมการให้ตรงกับสิ่งที่โจทย์ให้และสิ่งที่ถาม'
         : 'ควรฝึกโจทย์ที่ต้องแบ่งเป็นหลายขั้นตอนและตั้งระบบสมการ') });
  });

  if (res.revealed >= Math.ceil(res.n / 2))
    out.push({ k: 'warn', t: 'เปิดดูวิธีทำก่อนตอบไป ' + res.revealed + ' จาก ' + res.n + ' ข้อ — ' +
      'ครั้งหน้าลองเขียนสิ่งที่โจทย์กำหนดและเลือกสมการด้วยตัวเองก่อน แล้วค่อยเปิดเฉลยเทียบ' });

  const avg = res.n ? res.sec / res.n : 0;
  if (avg > 180) out.push({ k: 'warn', t: 'ใช้เวลาเฉลี่ยข้อละ ' + mmss(avg) + ' ซึ่งค่อนข้างนาน — ควรฝึกจนคุ้นกับการเลือกสมการให้เร็วขึ้น' });
  else if (avg > 0 && avg < 25 && res.pct < pass)
    out.push({ k: 'warn', t: 'ใช้เวลาเฉลี่ยเพียงข้อละ ' + mmss(avg) + ' และคะแนนยังไม่ผ่าน — ลองอ่านโจทย์ให้ละเอียดและเขียนสิ่งที่กำหนดให้ครบก่อนคำนวณ' });
  return out;
}

/* --- 6.1 แท็บผลและวิเคราะห์ ----------------------------------------------- */
function learnerAttempts() {
  const list = DB.attempts.filter(a => a.finishedAt);
  if (DB.mode === 'solo') return list.filter(a => !a.studentId);
  return list.filter(a => a.studentId === DB.cur.studentId);
}

function renderResult() {
  const mine = learnerAttempts().sort((x, y) => y.finishedAt - x.finishedAt);
  if (!mine.length) {
    $('#pane-result').innerHTML = '<div class="card"><h3>ยังไม่มีผลการทำแบบฝึกหัด</h3>' +
      '<div class="hint">ทำแบบฝึกหัดให้จบอย่างน้อยหนึ่งชุด (กด <b>ส่งคำตอบ / จบชุดนี้</b>) แล้วผลจะมาแสดงที่นี่</div></div>';
    return;
  }
  if (!DB.cur.showAttemptId || !mine.some(a => a.id === DB.cur.showAttemptId)) DB.cur.showAttemptId = mine[0].id;
  const a = mine.find(x => x.id === DB.cur.showAttemptId);
  const res = analyze(a);
  const all = analyzeMany(mine);

  let h = '<div class="card noprint"><div class="row"><label for="selAt">ดูผลครั้งที่</label>' +
    '<select id="selAt" class="grow" style="max-width:520px">' +
    mine.map((x, k) => {
      const r = analyze(x);
      return '<option value="' + x.id + '"' + (x.id === a.id ? ' selected' : '') + '>' +
        thDateTime(x.finishedAt) + ' · ' + esc((quizOf(x) || {}).title || '') + ' · ' + Math.round(r.pct) + '%</option>';
    }).join('') + '</select>' +
    '<button class="sm" id="btnEvid">พิมพ์หลักฐานการเรียนรู้</button></div></div>';

  // สรุปคะแนนครั้งนี้
  h += '<div class="card"><h3>ผลการทำครั้งนี้<span class="sub">' + esc(res.quiz.title) + '</span></h3>' +
    '<div class="statgrid">' +
    '<div class="stat"><div class="v">' + fmt(res.got) + ' / ' + res.max + '</div><div class="k">คะแนนที่ได้</div></div>' +
    '<div class="stat"><div class="v">' + Math.round(res.pct) + '%</div><div class="k">คิดเป็นร้อยละ</div></div>' +
    '<div class="stat"><div class="v">' + (res.pct >= DB.settings.passPct ? 'ผ่าน' : 'ไม่ผ่าน') +
      '</div><div class="k">เกณฑ์ ' + DB.settings.passPct + '%</div></div>' +
    '<div class="stat"><div class="v">' + mmss(res.sec) + '</div><div class="k">เวลาที่ใช้ทั้งหมด</div></div>' +
    '<div class="stat"><div class="v">' + mmss(res.n ? res.sec / res.n : 0) + '</div><div class="k">เฉลี่ยต่อข้อ</div></div>' +
    '<div class="stat"><div class="v">' + res.revealed + '</div><div class="k">ข้อที่เปิดดูวิธีทำ</div></div>' +
    (res.nOut ? '<div class="stat"><div class="v" style="color:var(--bad)">' + res.nOut +
      '</div><div class="k">ออกจากแอป (รวม ' + mmss(res.secOut) + ')</div></div>' : '') +
    '</div>' +
    (res.autoBy ? '<div class="notice warn" style="margin-top:11px">ระบบส่งข้อสอบชุดนี้ให้อัตโนมัติ — ' +
      esc(res.autoBy) + '</div>' : '') +
    (procTimeline(a) ? '<div style="margin-top:11px"><b>ช่วงที่ออกจากแอป</b>' +
      '<div class="hint" style="margin-top:4px;line-height:1.9">' + procTimeline(a) + '</div></div>' : '') +
    '</div>';

  h += '<div class="card"><h3>ผลแยกตามเรื่อง</h3>' +
    barRows(res.byTopic, k => esc(topicName(Number(k)))) + '</div>';
  h += '<div class="card"><h3>ผลแยกตามระดับความยาก</h3>' +
    barRows(res.byLevel, k => '<span class="tag ' + LEVEL_CLS[k] + '">' + k + '</span>') + '</div>';
  h += '<div class="card"><h3>ผลแยกตามหัวข้อย่อย</h3>' + barRows(res.bySub) + '</div>';
  h += '<div class="card"><h3>วิเคราะห์รายทักษะ<span class="sub">ทักษะที่โจทย์แต่ละข้อใช้</span></h3>' +
    barRows(res.bySkill) + '</div>';

  // ข้อเสนอแนะ
  h += '<div class="card"><h3>ข้อเสนอแนะ</h3>' +
    advice(res).map(x => '<div class="notice ' + (x.k === 'ok' ? 'info' : x.k) + '">' + x.t + '</div>').join('') + '</div>';

  // รายข้อ — แบบทดสอบไม่เปิดเฉลยให้ผู้เรียน (ผู้ดูแลยังดูได้)
  const showSol = canSeeSolution(res.quiz);
  h += '<div class="card"><h3>ผลรายข้อ</h3>' +
    (showSol ? '' : '<div class="notice info" style="margin-bottom:9px">ชุดนี้เป็น<b>แบบทดสอบ</b> ' +
      'จึงไม่แสดงเฉลย — ดูได้ว่าข้อไหนถูกหรือผิด เพื่อกลับไปทบทวนหัวข้อนั้นเอง</div>') +
    '<div class="tablewrap"><table><thead><tr>' +
    '<th class="num">ข้อ</th><th>เรื่อง</th><th>หัวข้อ</th><th>ระดับ</th><th>ผล</th>' +
    '<th class="num">เวลา</th>' + (showSol ? '<th>เปิดเฉลย</th><th></th>' : '') + '</tr></thead><tbody>';
  res.items.forEach(x => {
    const mark = x.score >= 1 ? '<span style="color:var(--ok)">✓ ถูก</span>'
      : x.score > 0 ? '<span style="color:var(--warn)">◑ ถูกบางส่วน</span>'
      : '<span style="color:var(--bad)">✗ ผิด</span>';
    if (!x.p) {
      h += '<tr><td class="num">' + (x.i + 1) + '</td><td colspan="5" class="hint">' +
        'ข้อนี้ใช้โจทย์จากบทที่โปรแกรมรุ่นนี้ยังไม่มี — อัปเดตไฟล์แล้วดูใหม่' +
        '</td>' + (showSol ? '<td></td><td></td>' : '') + '</tr>';
      return;
    }
    if (x.p.essay) {
      const n = (x.it.rub || []).filter(Boolean).length;
      h += '<tr><td class="num">' + (x.i + 1) + '</td><td>อัตนัย</td>' +
        '<td>' + (x.it.rub ? ESSAY_SHORT.filter(function (s, si) { return x.it.rub[si]; }).join(' · ') || '—'
                           : '<span class="hint">ครูยังไม่ได้ตรวจ</span>') + '</td>' +
        '<td>' + fmt(x.score) + '/' + fmt(x.p.max) + '</td>' +
        '<td>' + (x.it.rub ? n + ' ใน 5 ขั้น' : '—') + '</td>' +
        '<td class="num">' + mmss(x.it.sec) + '</td>' +
        (showSol ? '<td>—</td><td></td>' : '') + '</tr>';
      return;
    }
    if (x.p.paper) {
      // ใบตอบไม่มีหัวข้อย่อยและระดับ แต่บอกได้ว่าตอบอะไรไป และเฉลยคืออะไร
      const picked = x.it.pick == null ? '—' : x.p.choices[x.it.pick].text;
      const keyIdx = x.p.choices.findIndex(c => c.correct);
      const tpp = TOPICS.find(t => t.id === x.p.topic);
      h += '<tr><td class="num">' + (x.i + 1) + '</td><td>' + esc(tpp ? tpp.short : '—') + '</td>' +
        '<td>ตอบ ' + esc(picked) +
        (showSol && keyIdx >= 0 ? ' · เฉลย ' + esc(x.p.choices[keyIdx].text) : '') + '</td>' +
        '<td>—</td><td>' + mark + '</td><td class="num">' + mmss(x.it.sec) + '</td>' +
        (showSol ? '<td>—</td><td></td>' : '') + '</tr>';
      return;
    }
    const tp = TOPICS.find(t => t.id === x.p.topic);
    h += '<tr><td class="num">' + (x.i + 1) + '</td><td>' + esc(tp ? tp.short : '—') + '</td>' +
      '<td>' + esc(x.p.sub) + '</td><td><span class="tag ' + LEVEL_CLS[x.p.level] + '">' + x.p.level + '</span></td>' +
      '<td>' + mark + '</td><td class="num">' + mmss(x.it.sec) + '</td>' +
      (showSol ? '<td>' + (x.it.revealed ? 'ใช่' : '—') + '</td>' +
        '<td><button class="sm" data-sol="' + x.i + '">ดูโจทย์และวิธีทำ</button></td>' : '') + '</tr>';
  });
  h += '</tbody></table></div></div>';

  // สรุปสะสม
  h += '<div class="card"><h3>สรุปผลการเรียนสะสม<span class="sub">รวม ' + all.n + ' ครั้ง · ' +
    fmt(all.got) + '/' + all.max + ' = ' + Math.round(all.pct) + '%</span></h3>';
  const trend = mine.slice().reverse().map(x => analyze(x).pct);
  if (trend.length >= 2) {
    h += '<div style="margin-bottom:12px"><div class="hint" style="margin-bottom:4px">แนวโน้มคะแนน (ซ้าย = เก่าสุด)</div>' +
      sparkline(trend) + '</div>';
  }
  h += '<div class="row" style="align-items:flex-start;gap:18px">' +
    '<div class="grow" style="min-width:250px"><b>แยกตามเรื่อง</b>' + barRows(all.byTopic, k => esc(topicName(Number(k)))) + '</div>' +
    '<div class="grow" style="min-width:250px"><b>แยกตามระดับ</b>' +
      barRows(all.byLevel, k => '<span class="tag ' + LEVEL_CLS[k] + '">' + k + '</span>') + '</div></div>' +
    '<div style="margin-top:10px"><b>ทักษะที่ควรพัฒนามากที่สุด</b>' +
    (function () {
      const w = Object.keys(all.bySkill).filter(k => all.bySkill[k].max >= 3).sort((x, y) => all.bySkill[x].pct - all.bySkill[y].pct).slice(0, 5);
      if (!w.length) return '<div class="hint">ทำแบบฝึกหัดเพิ่มอีกสักหน่อยเพื่อให้ข้อมูลมากพอสำหรับสรุป</div>';
      const bag = {}; w.forEach(k => bag[k] = all.bySkill[k]);
      return barRows(bag);
    })() + '</div></div>';

  $('#pane-result').innerHTML = h;
  $('#selAt').addEventListener('change', e => { DB.cur.showAttemptId = e.target.value; save(); renderResult(); });
  $('#btnEvid').addEventListener('click', () => { DB.cur.printKind = 'evidence'; save(); setTab('print'); });
  $$('[data-sol]').forEach(b => b.addEventListener('click', () => {
    const x = res.items[Number(b.dataset.sol)];
    if (!x || !x.p) { toast('ข้อนี้เปิดไม่ได้ในโปรแกรมรุ่นนี้', 'bad'); return; }
    const m = openModal({
      title: 'ข้อ ' + (x.i + 1), wide: true,
      bodyHTML: problemHead(x.p) + problemBody(x.p) +
        '<div class="notice ' + (x.score >= 1 ? 'info' : 'bad') + '">คำตอบที่ถูก: ' +
        x.p.finds.map(f => M(f.s + ' = ' + ansTxt(f) + (f.unit ? ' `' + f.unit + '`' : ''))).join(' , ') + '</div>' +
        solutionHTML(x.p, true)
    });
    bindSolutionToggle(m.root);
  }));
}

/** กราฟเส้นเล็ก ๆ แสดงแนวโน้มคะแนน */
function sparkline(pcts) {
  const W = 420, H = 90, ox = 30, oy = 72, w = W - ox - 14, h = 56;
  const n = pcts.length;
  const px = i => ox + (n === 1 ? w / 2 : w * i / (n - 1));
  const py = v => oy - h * (v / 100);
  let s = '';
  [0, 50, 100].forEach(v => {
    s += '<line class="dash" x1="' + ox + '" y1="' + n1(py(v)) + '" x2="' + (ox + w) + '" y2="' + n1(py(v)) + '"/>';
    s += svgTxt(ox - 5, py(v) + 4, v + '%', 'end', true);
  });
  s += '<polyline class="frc" points="' + pcts.map((v, i) => n1(px(i)) + ',' + n1(py(v))).join(' ') + '"/>';
  pcts.forEach((v, i) => { s += '<circle class="arh" cx="' + n1(px(i)) + '" cy="' + n1(py(v)) + '" r="3.5"/>'; });
  return svgWrap(W, H, s);
}

      'ในโหมดครู ให้สลับผู้เรียนที่แถบบนแล้วให้แต่ละคนทำชุดเดียวกัน ระบบจะเปรียบเทียบผลให้อัตโนมัติ</div></div>' +
