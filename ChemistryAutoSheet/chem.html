/* --- 3.2 การจัดรูปสมการ ---------------------------------------------------
   เขียนสมการเป็นข้อความธรรมดา แล้วให้ M() จัดรูปให้:
     ตัวแปรภาษาอังกฤษ → ตัวเอียง   ตัวเลข/ภาษาไทย/หน่วยใน `...` → ตัวตรง
     _1 หรือ _{max} → ตัวห้อย       ^2 หรือ ^{-2} → ตัวยก
   -------------------------------------------------------------------------- */
function M(s) {
  return '<span class="eq">' + mInner(String(s)) + '</span>';
}
/** แปลงข้อความสมการหนึ่งชิ้น (ยังไม่ห่อ .eq) — เรียกซ้อนตัวเองได้ จึงใส่เศษส่วนในรากได้
    เขียนได้ว่า  frac(3,4)  ·  sqrt(2)  ·  sqrt3(27) รากที่สาม  ·  pi
    วิธีทำงาน: แปลงเศษส่วน/รากบนข้อความ "ดิบ" ก่อน แล้วพักผลลัพธ์ HTML ไว้ในกล่อง
    โดยทิ้งโทเคนตัวอักษรพิเศษไว้แทน จากนั้นค่อย esc() และจัดรูปตัวห้อย-ตัวยกตามเดิม
    แล้วเอา HTML ในกล่องแทนกลับตอนท้าย — HTML ที่สร้างไว้จึงไม่ถูก esc() ทำลาย */
function mInner(raw, box) {
  const top = !box;
  box = box || [];
  const stash = html => '\u0001' + String.fromCharCode(0xE000 + (box.push(html) - 1)) + '\u0002';
  // อนุญาตแท็กเน้นข้อความไม่กี่ตัว โดยซ่อนไว้ก่อน esc() แล้วคืนกลับตอนท้าย
  // ทำให้เขียน M('เส้นขนาน ⇒ <b>มุมแย้งเท่ากัน</b>') ได้ โดยแท็กไม่หลุดออกมาเป็นตัวหนังสือ
  let t = String(raw).replace(/<\/?(?:b|i|em|strong|br)\s*\/?>/gi, m => stash(m))
                     .replace(/\bpi\b/g, 'π');
  // แปลงรากและเศษส่วนสลับกันไปเรื่อย ๆ จนไม่มีอะไรเปลี่ยน
  // ทั้งสองแบบรับเฉพาะเนื้อในที่ไม่มีวงเล็บซ้อน การวนแบบนี้จึงแปลงชั้นในสุดก่อนเสมอ
  // ทำให้เขียนซ้อนกันได้ เช่น frac(-b ± sqrt(b^2 - 4ac),2a)
  for (let k = 0; k < 12; k++) {
    const before = t;
    // รากที่ n เช่น sqrt3(27) และรากที่สอง sqrt(2)
    t = t.replace(/sqrt(\d*)\(([^()]*)\)/g, (m, n, a) =>
      stash('<span class="sqrt">' + (n ? '<span class="si">' + n + '</span>' : '') +
            '<span class="sg">√</span><span class="sr">' + mInner(a, box) + '</span></span>'));
    // เศษส่วน frac(เศษ,ส่วน)
    t = t.replace(/frac\(([^(),]*),([^(),]*)\)/g, (m, a, b) =>
      stash('<span class="frac"><span class="fn">' + mInner(a, box) + '</span>' +
            '<span class="fd">' + mInner(b, box) + '</span></span>'));
    if (t === before) break;
  }
  let h = esc(t);
  h = h.replace(/\^\{([^}]*)\}/g, (m, a) => '<sup>' + a + '</sup>')
       .replace(/\^(-?[\w°]+)/g, (m, a) => '<sup>' + a + '</sup>');
  h = h.replace(/_\{([^}]*)\}/g, (m, a) => '<sub>' + a + '</sub>')
       .replace(/_(-?\w)/g, (m, a) => '<sub>' + a + '</sub>');
  h = h.replace(/`([^`]*)`/g, (m, a) => '<span class="u">' + a + '</span>');
  // ข้อความไทยเป็นตัวตรง — รวมคำย่อที่มีจุดคั่นอย่าง ห.ร.ม. และ ค.ร.น. ไว้เป็นก้อนเดียว
  h = h.replace(/([฀-๿]+(?:\.[฀-๿]+)*\.?)/g, '<span class="u">$1</span>');
  // ชื่อฟังก์ชันตรีโกณมิติเขียนด้วยตัวตรงตามหลักสากล ไม่ใช่ตัวเอียงแบบตัวแปร
  h = h.replace(/\b(sin|cos|tan|log|ln)\b/g, '<span class="u">$1</span>');
  // ให้องศาติดไปกับตัวเลข ไม่งั้นจะมีช่องว่างแปลก ๆ คั่น
  h = h.replace(/(\d[\d,]*\.?\d*°?)/g, '<span class="u">$1</span>');
  // เครื่องหมายดำเนินการเขียนตัวตรง — ฟอนต์คณิตตัวเอียงทำให้ + และ = เอียงจนดูเหมือนถูกขีดทับ
  // แยกส่วนที่เป็นแท็กออกก่อน ไม่งั้นจะไปโดน = ใน class="u" ที่ใส่ไว้ข้างบน
  h = h.split(/(<[^>]*>)/).map(function (seg, i) {
    return i % 2 ? seg : seg.replace(/(^|\s)([+\-−×÷=≠≤≥±≈⇒])(?=\s|$)/g,
      '$1<span class="u">$2</span>');
  }).join('');
  // ชั้นในคืน HTML ที่ยังมีโทเคนอยู่ ให้ชั้นนอกสุดเป็นคนแทนกลับทีเดียว
  if (!top) return h;
  for (let k = 0; k < 20 && h.indexOf('\u0001') >= 0; k++)
    h = h.replace(/\u0001([\uE000-\uF8FF])\u0002/g, (m, c) => box[c.charCodeAt(0) - 0xE000]);
  return h;
}
/** บรรทัดสมการแบบบล็อก */
function EQ() {
  return Array.from(arguments).filter(Boolean).map(s => '<div class="eqblk">' + M(s) + '</div>').join('');
}
/** แทนค่าลงในแม่แบบสมการ: S('v = {u} + ({a})({t})', {u:0,a:9.8,t:2.5}) */
function S(tmpl, vals, dp) {
  return String(tmpl).replace(/\{(\w+)\}/g, (m, k) => {
    if (!(k in vals)) return m;
    const v = vals[k];
    return typeof v === 'number' ? fmtq(v, dp == null ? 3 : dp) : String(v);
  });
}
/** แทนค่าแล้วคืนเป็นบรรทัดสมการเลย */
function SEQ(tmpl, vals, dp) { return EQ(S(tmpl, vals, dp)); }

/* --- 3.3 ตัวช่วยวาดรูป SVG ------------------------------------------------ */
function n1(x) { return (Math.round(x * 10) / 10).toString(); }
/** ครอบ SVG ให้ยืดตามความกว้างที่มี แต่ไม่โตเกินจนดูเทอะทะ
    เดิมตรึงไว้ที่ความกว้างพิกเซลของ viewBox ทำให้รูปเล็กเกินไปบนจอกว้าง */
function svgWrap(w, h, inner) {
  // ขยายรูปบนหน้าจอขึ้นอีก 30% จากเดิม (1.55 → 2.0 และเพดาน 640 → 830 พิกเซล)
  // ครูแจ้งว่ารูปเดิมเล็กเกินไปจนดูรายละเอียดยาก
  const maxw = Math.min(Math.round(w * 2.0), 830);
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:' + maxw + 'px" ' +
    'preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img">' + inner + '</svg>';
}
/** ลูกศรแรง จาก (x1,y1) ไป (x2,y2) พร้อมป้ายกำกับ */
function svgArrow(x1, y1, x2, y2, cls, lbl, lox, loy) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 10, W = 4.6;
  const bx = x2 - Math.cos(a) * L, by = y2 - Math.sin(a) * L;
  const px = -Math.sin(a), py = Math.cos(a);
  const c = cls || 'frc', ah = (c === 'frc') ? 'arh' : 'arh2';
  let s = '<line class="' + c + '" x1="' + n1(x1) + '" y1="' + n1(y1) + '" x2="' + n1(bx) + '" y2="' + n1(by) + '"/>' +
    '<polygon class="' + ah + '" points="' + n1(x2) + ',' + n1(y2) + ' ' +
    n1(bx + px * W) + ',' + n1(by + py * W) + ' ' + n1(bx - px * W) + ',' + n1(by - py * W) + '"/>';
  if (lbl) s += '<text x="' + n1(x2 + (lox || 0)) + '" y="' + n1(y2 + (loy || 0)) + '" text-anchor="middle">' + lbl + '</text>';
  return s;
}
function svgTxt(x, y, t, anchor, mut) {
  return '<text x="' + n1(x) + '" y="' + n1(y) + '"' + (anchor ? ' text-anchor="' + anchor + '"' : '') +
    (mut ? ' class="mut"' : '') + '>' + t + '</text>';
}
/** พื้นแบบขีดเฉียง (hatch) ใต้เส้นตรงจาก (x1,y1) ถึง (x2,y2) */
function svgHatch(x1, y1, x2, y2, n, len) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  const L = len || 7; let s = '';
  const N = n || 12;
  for (let i = 0; i <= N; i++) {
    const t = i / N, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    s += '<line class="ln2" x1="' + n1(x) + '" y1="' + n1(y) + '" x2="' + n1(x - Math.cos(a - 0.9) * L) +
      '" y2="' + n1(y - Math.sin(a - 0.9) * L) + '"/>';
  }
  return s;
}

/* --- 3.3ข รูปประกอบโจทย์เคมี ------------------------------------------------
   ทุกฟังก์ชันคืนสตริง SVG ที่ยืดตามความกว้างของกล่องที่ใส่ลงไป
   ใช้สีจากตัวแปรธีม จึงอ่านออกทั้งโหมดสว่างและโหมดมืด

   *** ข้อควรระวังที่เคยทำให้รูปเพี้ยนมาแล้ว ***
   ชื่อคลาสใน SVG ต้องขึ้นต้นด้วย f หรือใช้ชื่อที่มีอยู่แล้ว (ln ln2 frc dash bdy
   fpt fgrd fbar ffil arh arh2 mut) ห้ามตั้งชื่ออย่าง .bar .box .fill เพราะเบราว์เซอร์
   ถือว่า width/height ของ SVG เป็นสมบัติ CSS ด้วย ถ้าไปชนกับคลาสของหน้าเว็บ
   รูปจะถูกบีบจนผิดรูปโดยไม่มี error ให้เห็น
   -------------------------------------------------------------------------- */

/** ความกว้างโดยประมาณของข้อความในรูป ใช้กันไม่ให้ป้ายยาว ๆ ล้นออกนอกกรอบ
    สระบน-ล่างและวรรณยุกต์ไทยไม่กินความกว้าง จึงไม่นับ */
function txtW(t) {
  const s = String(t == null ? '' : t).replace(/<[^>]+>/g, '');
  let w = 0;
  for (const ch of s) {
    if (/[ัิ-ฺ็-๎]/.test(ch)) continue;
    w += /[฀-๿]/.test(ch) ? 9 : /[ .,]/.test(ch) ? 4 : 8;
  }
  return w;
}

/** แผนภูมิแท่ง  o:{ labels:[], values:[], step, unit } */
function figBar(o) {
  const vals = o.values || [], n = vals.length;
  if (!n) return '';
  const W = 360, H = 224, padR = 12, padT = 30, padB = 38;
  const maxV = Math.max.apply(null, vals);
  const step = o.step || Math.max(1, Math.ceil(maxV / 5));
  const top = Math.max(step, Math.ceil(maxV / step) * step);
  // ขอบซ้ายต้องกว้างพอสำหรับตัวเลขบนสเกลและชื่อหน่วย ไม่งั้นข้อความจะล้นออกนอกกรอบ
  // โจทย์เคมีใช้ค่าหลักหมื่น (kJ/mol) ขอบคงที่ 42 จึงไม่พอ
  const padL = Math.max(42, txtW(String(top)) + 12, txtW(o.unit || '') + 10);
  const Y = v => H - padB - (H - padB - padT) * v / top;
  const bw = (W - padL - padR) / n;
  let s = '';
  for (let v = 0; v <= top; v += step) {
    s += '<line class="fgrd" x1="' + padL + '" y1="' + n1(Y(v)) + '" x2="' + (W - padR) + '" y2="' + n1(Y(v)) + '"/>';
    s += svgTxt(padL - 6, Y(v) + 5, String(v), 'end', true);
  }
  vals.forEach((v, i) => {
    const x = padL + i * bw + bw * 0.2, w = bw * 0.6;
    s += '<rect class="fbar" x="' + n1(x) + '" y="' + n1(Y(v)) + '" width="' + n1(w) +
      '" height="' + n1(H - padB - Y(v)) + '"/>';
    s += svgTxt(x + w / 2, H - padB + 18, esc(String((o.labels || [])[i] == null ? i + 1 : o.labels[i])), 'middle', true);
  });
  s += '<line class="ln" x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '"/>';
  s += '<line class="ln" x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (H - padB) + '"/>';
  if (o.unit) s += svgTxt(padL - 6, padT - 14, esc(o.unit), 'end', true);
  return svgWrap(W, H, s);
}

/** อุปกรณ์วัดปริมาตรพร้อมสเกล ใช้กับเรื่องเลขนัยสำคัญและการอ่านค่า
    o:{ cap:ความจุ, minor:ค่าต่อขีดเล็ก, read:ระดับของเหลว, unit, name } */
function figLabGlass(o) {
  const W = 260, H = 300;
  const cap = o.cap, minor = o.minor, read = o.read;
  const x0 = 92, wBody = 76, yTop = 46, yBot = 250;
  const Y = v => yBot - (yBot - yTop) * v / cap;
  let s = '';
  // ตัวกระบอกตวง — วาดเป็นสี่เหลี่ยมเปิดด้านบน มีฐานกว้างกันล้ม
  s += '<line class="ln" x1="' + x0 + '" y1="' + yTop + '" x2="' + x0 + '" y2="' + yBot + '"/>';
  s += '<line class="ln" x1="' + (x0 + wBody) + '" y1="' + yTop + '" x2="' + (x0 + wBody) + '" y2="' + yBot + '"/>';
  s += '<line class="ln" x1="' + x0 + '" y1="' + yBot + '" x2="' + (x0 + wBody) + '" y2="' + yBot + '"/>';
  s += '<line class="ln" x1="' + (x0 - 14) + '" y1="' + (yBot + 16) + '" x2="' + (x0 + wBody + 14) +
    '" y2="' + (yBot + 16) + '"/>';
  s += '<line class="ln2" x1="' + (x0 + 8) + '" y1="' + yBot + '" x2="' + (x0 - 14) + '" y2="' + (yBot + 16) + '"/>';
  s += '<line class="ln2" x1="' + (x0 + wBody - 8) + '" y1="' + yBot + '" x2="' + (x0 + wBody + 14) +
    '" y2="' + (yBot + 16) + '"/>';
  // ของเหลวในกระบอก
  s += '<rect class="ffil" x="' + (x0 + 1) + '" y="' + n1(Y(read)) + '" width="' + (wBody - 2) +
    '" height="' + n1(yBot - Y(read)) + '"/>';
  // ผิวของเหลวโค้งเว้า — จุดที่ต้องอ่านค่าคือ "ก้นโค้ง"
  s += '<path class="frc" d="M' + (x0 + 1) + ' ' + n1(Y(read) - 5) + ' Q ' + (x0 + wBody / 2) + ' ' +
    n1(Y(read) + 7) + ' ' + (x0 + wBody - 1) + ' ' + n1(Y(read) - 5) + '"/>';
  // ขีดสเกล — ขีดใหญ่ทุก 5 ขีดเล็ก พร้อมตัวเลขกำกับ
  const nTick = Math.round(cap / minor);
  for (let i = 0; i <= nTick; i++) {
    const v = i * minor, big = i % 5 === 0;
    s += '<line class="' + (big ? 'ln' : 'ln2') + '" x1="' + x0 + '" y1="' + n1(Y(v)) +
      '" x2="' + (x0 + (big ? 18 : 10)) + '" y2="' + n1(Y(v)) + '"/>';
    if (big) s += svgTxt(x0 - 7, Y(v) + 5, fmt(v), 'end', true);
  }
  s += svgTxt(x0 + wBody / 2, 26, esc(o.name || 'กระบอกตวง'), 'middle');
  s += svgTxt(x0 + wBody + 20, Y(read) + 5, 'อ่านตรงนี้', 'start');
  s += svgTxt(x0 + wBody / 2, yBot + 38, 'ขีดเล็กละ ' + fmt(minor) + ' ' + esc(o.unit || 'mL'), 'middle', true);
  return svgWrap(W, H, s);
}

/** แบบจำลองอะตอมแบบวงโคจร  o:{ sym, p, n, shells:[2,8,1] } */
function figAtomShell(o) {
  const sh = o.shells || [];
  const W = 340, H = 300, cx = 150, cy = 150;
  const rMax = 118, rNuc = 26;
  let s = '';
  // วงอิเล็กตรอนวาดจากวงนอกเข้ามา จะได้ไม่ทับนิวเคลียส
  sh.forEach(function (cnt, i) {
    const r = rNuc + 16 + (rMax - rNuc - 16) * (i + 1) / sh.length;
    s += '<circle class="dash" cx="' + cx + '" cy="' + cy + '" r="' + n1(r) + '" fill="none"/>';
    for (let k = 0; k < cnt; k++) {
      const th = -Math.PI / 2 + 2 * Math.PI * k / cnt;
      s += '<circle class="fpt" cx="' + n1(cx + r * Math.cos(th)) + '" cy="' + n1(cy + r * Math.sin(th)) + '" r="4.6"/>';
    }
    // จำนวนอิเล็กตรอนของวงนั้น เขียนไว้ทางขวาของวง ไม่ทับตัวอิเล็กตรอนที่วางเริ่มจากด้านบน
    s += svgTxt(cx + r + 8, cy + 5, String(cnt), 'start');
  });
  s += '<circle class="bdy" cx="' + cx + '" cy="' + cy + '" r="' + rNuc + '"/>';
  s += svgTxt(cx, cy + 6, esc(o.sym || ''), 'middle');
  // จำนวนอนุภาคในนิวเคลียสเขียนไว้ใต้รูป ไม่ยัดลงในวงกลมซึ่งแคบเกินไปจนตัวอักษรทับกัน
  const nuc = [];
  if (o.p != null) nuc.push('โปรตอน ' + o.p);
  if (o.n != null) nuc.push('นิวตรอน ' + o.n);
  if (nuc.length) s += svgTxt(cx, H - 12, nuc.join(' · '), 'middle', true);
  s += svgTxt(W - 10, 24, 'การจัดเรียงอิเล็กตรอน', 'end', true);
  s += svgTxt(W - 10, 42, sh.join(' , '), 'end');
  return svgWrap(W, H, s);
}

/** ตารางธาตุย่อ 20 ธาตุแรก  o:{ mark:['Na','Cl'], trend:'ขนาดอะตอมเพิ่ม' , arrow:'right'|'down' } */
const PT20 = [
  ['H', 1, 1], ['He', 18, 1],
  ['Li', 1, 2], ['Be', 2, 2], ['B', 13, 2], ['C', 14, 2], ['N', 15, 2], ['O', 16, 2], ['F', 17, 2], ['Ne', 18, 2],
  ['Na', 1, 3], ['Mg', 2, 3], ['Al', 13, 3], ['Si', 14, 3], ['P', 15, 3], ['S', 16, 3], ['Cl', 17, 3], ['Ar', 18, 3],
  ['K', 1, 4], ['Ca', 2, 4]
];
function figPeriodicMini(o) {
  const cw = 21, chh = 22, x0 = 16, y0 = 46;
  // ลูกศรแนวตั้งต้องมีที่ว่างทางขวาสำหรับป้าย ไม่งั้นตัวหนังสือจะพาดทับตารางธาตุ
  const down = o.arrow === 'down' && o.trend;
  const W = x0 * 2 + cw * 18 + (down ? txtW(o.trend) + 44 : 0), H = y0 + chh * 4 + 34;
  const mark = o.mark || [];
  let s = '';
  // หัวหมู่และหมายเลขคาบ ช่วยให้อ่านตำแหน่งธาตุได้โดยไม่ต้องนับช่อง
  [1, 2, 13, 14, 15, 16, 17, 18].forEach(function (g) {
    s += svgTxt(x0 + (g - 1) * cw + cw / 2, y0 - 6, String(g), 'middle', true);
  });
  for (let p = 1; p <= 4; p++) s += svgTxt(x0 - 6, y0 + (p - 1) * chh + chh / 2 + 4, String(p), 'end', true);
  PT20.forEach(function (e) {
    const x = x0 + (e[1] - 1) * cw, y = y0 + (e[2] - 1) * chh;
    const on = mark.indexOf(e[0]) >= 0;
    s += '<rect class="' + (on ? 'ffil' : 'bdy') + '" x="' + x + '" y="' + y + '" width="' + (cw - 2) +
      '" height="' + (chh - 2) + '"/>';
    if (on) s += '<rect class="frc" fill="none" x="' + x + '" y="' + y + '" width="' + (cw - 2) +
      '" height="' + (chh - 2) + '"/>';
    s += svgTxt(x + (cw - 2) / 2, y + chh / 2 + 4, e[0], 'middle');
  });
  s += svgTxt(x0 + cw * 9, 20, 'ตารางธาตุ 20 ธาตุแรก', 'middle', true);
  // ลูกศรบอกทิศของแนวโน้มที่โจทย์พูดถึง
  if (o.trend) {
    const yA = y0 + chh * 4 + 20;
    if (down) {
      const xa = x0 + cw * 18 + 18;
      s += svgArrow(xa, y0 - 2, xa, y0 + chh * 4 - 4, 'frc');
      s += svgTxt(xa + 10, y0 + chh * 2, esc(o.trend), 'start');
    } else {
      s += svgArrow(x0 + 4, yA, x0 + cw * 18 - 8, yA, 'frc');
      s += svgTxt(x0 + cw * 9, yA - 8, esc(o.trend), 'middle');
    }
  }
  return svgWrap(W, H, s);
}

/** โครงสร้างลิวอิสอย่างง่าย — อะตอมกลางหนึ่งตัว ล้อมด้วยอะตอมรอบ ๆ ไม่เกิน 4 ตัว
    o:{ center, lone:จำนวนคู่โดดเดี่ยวของอะตอมกลาง,
        around:[{ sym, order:1|2|3, lone }] , dirs:['up','down','left','right'] } */
function figLewis(o) {
  const W = 320, H = 260, cx = 160, cy = 130, R = 62;
  const dirMap = { right: [1, 0], left: [-1, 0], up: [0, -1], down: [0, 1] };
  const around = o.around || [];
  const dirs = o.dirs || ['right', 'left', 'up', 'down'];
  let s = '';
  around.forEach(function (a, i) {
    const d = dirMap[dirs[i % dirs.length]] || [1, 0];
    const bx = cx + d[0] * R, by = cy + d[1] * R;
    // พันธะเดี่ยว-คู่-สาม วาดเป็นเส้นขนาน 1-3 เส้น เยื้องกันตามแนวตั้งฉาก
    const px = -d[1], py = d[0];
    const k = a.order || 1;
    for (let j = 0; j < k; j++) {
      const off = (j - (k - 1) / 2) * 6;
      s += '<line class="ln" x1="' + n1(cx + d[0] * 20 + px * off) + '" y1="' + n1(cy + d[1] * 20 + py * off) +
        '" x2="' + n1(bx - d[0] * 18 + px * off) + '" y2="' + n1(by - d[1] * 18 + py * off) + '"/>';
    }
    s += svgTxt(bx, by + 6, esc(a.sym), 'middle');
    // คู่โดดเดี่ยวของอะตอมรอบ วางออกไปด้านนอกของอะตอมนั้น
    for (let j = 0; j < (a.lone || 0); j++) {
      const ang = Math.atan2(d[1], d[0]) + (j - ((a.lone || 1) - 1) / 2) * 0.7;
      const ex = bx + 20 * Math.cos(ang), ey = by + 20 * Math.sin(ang);
      s += '<circle class="fpt" cx="' + n1(ex - 3) + '" cy="' + n1(ey) + '" r="2.6"/>';
      s += '<circle class="fpt" cx="' + n1(ex + 3) + '" cy="' + n1(ey) + '" r="2.6"/>';
    }
  });
  s += svgTxt(cx, cy + 6, esc(o.center || ''), 'middle');
  for (let j = 0; j < (o.lone || 0); j++) {
    const ang = -Math.PI / 2 + (j - ((o.lone || 1) - 1) / 2) * 0.8;
    const ex = cx + 26 * Math.cos(ang), ey = cy + 26 * Math.sin(ang);
    s += '<circle class="fpt" cx="' + n1(ex - 3) + '" cy="' + n1(ey) + '" r="2.6"/>';
    s += '<circle class="fpt" cx="' + n1(ex + 3) + '" cy="' + n1(ey) + '" r="2.6"/>';
  }
  if (o.caption) s += svgTxt(W / 2, H - 14, esc(o.caption), 'middle', true);
  return svgWrap(W, H, s);
}

/** รูปร่างโมเลกุลตามทฤษฎี VSEPR
    o:{ shape:'linear'|'bent'|'trigonal'|'pyramid'|'tetra', center, outer, deg, caption } */
const VSEPR_DIR = {
  linear:   [180, 0],
  bent:     [155, 25],
  trigonal: [210, 330, 90],
  pyramid:  [200, 340, 90],
  tetra:    [200, 340, 75, 105]
};
function figShape(o) {
  const W = 320, H = 250, cx = 160, cy = 132, R = 66;
  const angs = VSEPR_DIR[o.shape] || VSEPR_DIR.linear;
  let s = '';
  angs.forEach(function (a) {
    const th = a * Math.PI / 180;
    const bx = cx + R * Math.cos(th), by = cy - R * Math.sin(th);
    s += '<line class="ln" x1="' + n1(cx + 18 * Math.cos(th)) + '" y1="' + n1(cy - 18 * Math.sin(th)) +
      '" x2="' + n1(bx - 16 * Math.cos(th)) + '" y2="' + n1(by + 16 * Math.sin(th)) + '"/>';
    s += '<circle class="bdy" cx="' + n1(bx) + '" cy="' + n1(by) + '" r="16"/>';
    s += svgTxt(bx, by + 5, esc(o.outer || ''), 'middle');
  });
  // คู่โดดเดี่ยวบนอะตอมกลาง วาดเป็นก้อนเมฆด้านบน ทำให้เห็นว่าทำไมมุมถึงหุบ
  if (o.lone) {
    for (let j = 0; j < o.lone; j++) {
      const ex = cx + (j - (o.lone - 1) / 2) * 14, ey = cy - 34;
      s += '<circle class="fpt" cx="' + n1(ex - 4) + '" cy="' + ey + '" r="3"/>';
      s += '<circle class="fpt" cx="' + n1(ex + 4) + '" cy="' + ey + '" r="3"/>';
    }
  }
  s += '<circle class="bdy" cx="' + cx + '" cy="' + cy + '" r="20"/>';
  s += svgTxt(cx, cy + 6, esc(o.center || ''), 'middle');
  if (o.deg != null) {
    // ส่วนโค้งของมุมพันธะ วาดระหว่างสองแขนแรก
    const a1 = angs[0] * Math.PI / 180, a2 = angs[1] * Math.PI / 180;
    const r = 34;
    s += '<path class="frc" fill="none" d="M' + n1(cx + r * Math.cos(a1)) + ' ' + n1(cy - r * Math.sin(a1)) +
      ' A ' + r + ' ' + r + ' 0 0 1 ' + n1(cx + r * Math.cos(a2)) + ' ' + n1(cy - r * Math.sin(a2)) + '"/>';
    const mid = (a1 + a2) / 2;
    s += svgTxt(cx + (r + 16) * Math.cos(mid), cy - (r + 16) * Math.sin(mid) + 5, fmt(o.deg) + '°', 'middle');
  }
  if (o.caption) s += svgTxt(W / 2, H - 14, esc(o.caption), 'middle', true);
  return svgWrap(W, H, s);
}

/** การถ่ายโอนอิเล็กตรอนของพันธะไอออนิก
    o:{ a:{sym, shells}, b:{sym, shells}, moved, ionA, ionB } */
function figIonic(o) {
  const W = 400, H = 230;
  const box = function (x, sym, shells, ion) {
    const cy = 108, rN = 18;
    let g = '';
    (shells || []).forEach(function (cnt, i) {
      const r = rN + 12 + i * 17;
      g += '<circle class="dash" cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="none"/>';
      for (let k = 0; k < cnt; k++) {
        const th = -Math.PI / 2 + 2 * Math.PI * k / cnt;
        g += '<circle class="fpt" cx="' + n1(x + r * Math.cos(th)) + '" cy="' + n1(cy + r * Math.sin(th)) + '" r="3.4"/>';
      }
    });
    g += '<circle class="bdy" cx="' + x + '" cy="' + cy + '" r="' + rN + '"/>';
    g += svgTxt(x, cy + 6, esc(sym), 'middle');
    g += svgTxt(x, 34, esc(ion || sym), 'middle');
    return g;
  };
  let s = box(84, o.a.sym, o.a.shells, o.ionA) + box(316, o.b.sym, o.b.shells, o.ionB);
  s += svgArrow(146, 108, 254, 108, 'frc');
  s += svgTxt(200, 92, 'ให้ ' + fmt(o.moved) + ' e', 'middle');
  s += svgTxt(200, H - 16, esc(o.caption || 'โลหะให้อิเล็กตรอน อโลหะรับอิเล็กตรอน'), 'middle', true);
  return svgWrap(W, H, s);
}
/* --- 3.4 สร้างโจทย์จากแม่แบบ ---------------------------------------------
   ตรวจว่าตัวเลขที่สุ่มออกมา "สวย" พอจะให้นักเรียนคิดได้ ถ้าไม่สวยจะสุ่มใหม่
   -------------------------------------------------------------------------- */
const TPL = [];                 // คลังแม่แบบ เติมในส่วนถัดไป
const TPL_BY_ID = {};

function niceProblem(p) {
  if (!p || !p.finds || !p.finds.length) return false;
  for (const f of p.finds) {
    if (typeof f.value !== 'number' || !isFinite(f.value)) return false;
    if (Math.abs(f.value) > 1e6) return false;
    const kind = f.kind || 'num';
    // เศษส่วน: ตัวส่วนต้องไม่ใหญ่จนนักเรียนอ่านและพิมพ์ไม่ไหว และต้องย่ออย่างต่ำมาแล้ว
    if (kind === 'frac') {
      if (!f.den || f.den < 1 || f.den > 24) return false;
      if (typeof f.num !== 'number' || !isFinite(f.num)) return false;
      const rd = reduceFrac(f.num, f.den);
      if (rd[0] !== f.num || rd[1] !== f.den) return false;
      continue;
    }
    if (kind === 'int') { if (Math.abs(f.value - Math.round(f.value)) > 1e-9) return false; continue; }
    if (kind === 'exact') continue;
    if (f.value !== 0 && Math.abs(f.value) < 0.01) return false;
    if (dpOf(f.value, 4) > 2) return false;
  }
  return true;
}

/** สร้างโจทย์หนึ่งข้อจาก tplId + seed — ผลลัพธ์เหมือนเดิมทุกครั้งที่เรียกด้วยค่าเดิม */
function buildProblem(tplId, seed, cfg) {
  const tpl = TPL_BY_ID[tplId];
  if (!tpl) return null;
  const c = cfg || {};
  const piMode = c.piMode || '3.14';
  const pi = piVal(piMode);
  let last = null;
  // แม่แบบที่เงื่อนไขเลขสวยรัดกุมมาก (เช่น ต้องได้รากที่สองลงตัว) อาจต้องสุ่มหลายรอบ
  // ลูปนี้ออกทันทีที่เจอชุดตัวเลขที่ใช้ได้ จำนวนรอบสูงสุดจึงไม่มีผลกับความเร็วในกรณีปกติ
  for (let k = 0; k < 400; k++) {
    const R = rng((seed >>> 0) + k * 7919);
    let p = null;
    try { p = tpl.gen(R, { pi: pi, piMode: piMode }); } catch (e) { continue; }
    if (!p) continue;
    last = p;
    // โจทย์ทฤษฎีไม่มีคำตอบเป็นตัวเลข จึงข้ามการคัดกรองเลขสวยไปได้เลย
    if (tpl.level === THEORY_LEVEL || niceProblem(p)) { return finishProblem(p, tpl, seed, piMode); }
  }
  // สุ่มจนครบแล้วยังไม่ได้เลขสวย — ยอมรับรอบสุดท้ายแล้วปัดเป็นทศนิยม 2 ตำแหน่ง
  if (last) { last.rough = true; return finishProblem(last, tpl, seed, piMode); }
  return null;
}

function finishProblem(p, tpl, seed, piMode) {
  p.tplId = tpl.id; p.seed = seed; p.topic = tpl.topic; p.level = tpl.level;
  p.sub = tpl.sub; p.skills = tpl.skills || []; p.piMode = piMode;
  if (tpl.level === THEORY_LEVEL) {
    // โจทย์ทฤษฎี: ตัวเลือกเป็นข้อความ แม่แบบสร้างมาให้ครบแล้ว ไม่มีตารางกำหนดให้/สิ่งที่ต้องหา
    p.theory = true; p.given = p.given || []; p.finds = p.finds || [];
    return p;
  }
  // ปัดเศษเฉพาะคำตอบชนิดทศนิยม — เศษส่วนและคำตอบที่ต้องตรงเป๊ะห้ามแตะ
  p.finds.forEach(f => { if (!f.kind || f.kind === 'num') f.value = round2(f.value); });
  // ระดับง่ายตอบแบบปรนัย — สร้างตัวเลือกจากตัวลวงที่แม่แบบให้มา
  if (tpl.level === 'ง่าย' && p.finds.length === 1) {
    p.choices = makeChoices(p, rng(((seed >>> 0) ^ 0x5bf03635) >>> 0));
  }
  return p;
}

/** สร้างตัวเลือก 4 ตัว: คำตอบถูก + ตัวลวงจากความเข้าใจผิด (เติมด้วยตัวลวงทั่วไปถ้าไม่พอ) */
function makeChoices(p, R) {
  if ((p.finds[0].kind || 'num') === 'frac') return makeFracChoices(p, R);
  const ans = round2(p.finds[0].value);
  const pool = [];
  const push = v => {
    if (typeof v !== 'number' || !isFinite(v)) return;
    const r = round2(v);
    if (Math.abs(r - ans) < 0.005) return;                 // ซ้ำกับคำตอบถูก
    if (r < 0 && ans > 0 && p.finds[0].positive) return;   // ค่าที่เป็นไปไม่ได้ในบริบทของโจทย์
    if (pool.some(x => Math.abs(x - r) < 0.005)) return;   // ซ้ำกันเอง
    if (dpOf(r, 4) > 2) return;
    pool.push(r);
  };
  (p.distract || []).forEach(push);
  // แม่แบบที่คำตอบมีค่าได้จำกัด (เช่น จตุภาคที่ 1-4) ตั้ง exactDistract ไว้
  // จะได้ไม่มีตัวลวงอัตโนมัติที่เป็นไปไม่ได้โผล่มา เช่น "จตุภาคที่ 8"
  if (!p.exactDistract) {
    const gen = [ans * 2, ans / 2, ans + Math.max(1, Math.round(Math.abs(ans) * 0.2)),
                 ans - Math.max(1, Math.round(Math.abs(ans) * 0.2)), ans * 1.5, ans / 4, ans * 10];
    for (const v of gen) { if (pool.length >= 6) break; push(v); }
  }
  const picked = R.shuffle(pool).slice(0, 3);
  const all = R.shuffle(picked.concat([ans]));
  return all.map(v => ({ value: v, correct: Math.abs(v - ans) < 0.005 }));
}

/** ตัวเลือกปรนัยที่คำตอบเป็นเศษส่วน — ตัวลวงมาจาก p.distractFrac ซึ่งเป็นคู่ [เศษ, ส่วน]
    เทียบกันด้วยรูปอย่างต่ำ ตัวเลือกจึงไม่มีทางเป็นค่าเดียวกัน เช่น 3/4 กับ 6/8 */
function makeFracChoices(p, R) {
  const f0 = p.finds[0];
  const an = f0.num, ad = f0.den;
  const key = (n, d) => { const r = reduceFrac(n, d); return r[0] + '/' + r[1]; };
  const seen = {};
  seen[key(an, ad)] = 1;
  const pool = [];
  const push = pr => {
    if (!pr || !pr[1] || !isFinite(pr[0]) || !isFinite(pr[1])) return;
    const r = reduceFrac(pr[0], pr[1]);
    if (Math.abs(r[1]) > 40 || seen[key(r[0], r[1])]) return;
    seen[key(r[0], r[1])] = 1;
    pool.push(r);
  };
  (p.distractFrac || []).forEach(push);
  // ตัวลวงสำรอง ใช้ต่อเมื่อของที่แม่แบบตั้งใจใส่มายังไม่พอ 6 ตัว
  // (เรียงตามความพลาดที่พบบ่อย: บวกผิดที่ · กลับเศษกับส่วน · ลืมย่อ)
  for (const pr of [[an + 1, ad], [an, ad + 1], [ad, an], [an * 2, ad], [an, ad * 2], [an - 1, ad]]) {
    if (pool.length >= 6) break;
    if (pr[0] === 0) continue;                       // 0 เป็นตัวลวงที่ตัดทิ้งได้ง่ายเกินไป
    push(pr);
  }
  const picked = R.shuffle(pool).slice(0, 3);
  const all = R.shuffle(picked.concat([[an, ad]]));
  return all.map(pr => ({
    value: pr[0] / pr[1], text: fracTxt(pr[0], pr[1]),
    correct: pr[0] === an && pr[1] === ad
  }));
}

/* --- 3.5 การตรวจคำตอบ -----------------------------------------------------
   คณิตต่างจากฟิสิกส์ตรงที่คำตอบไม่ได้เป็นทศนิยมเสมอไป แม่แบบจึงระบุชนิดคำตอบไว้ที่
   finds[].kind ได้ 4 แบบ
     'num'   (ค่าเริ่มต้น) ทศนิยมทั่วไป ยอมคลาดเคลื่อนตาม tolPct
     'int'   จำนวนเต็ม ต้องตรงเป๊ะ
     'frac'  เศษส่วน ต้องส่ง num/den มาคู่กัน · ถ้า lowest:true ต้องตอบเป็นเศษส่วนอย่างต่ำ
     'exact' ต้องตรงเป๊ะ ไม่ยอมคลาดเคลื่อน
   -------------------------------------------------------------------------- */
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }

/** ย่อเศษส่วนให้อยู่ในรูปอย่างต่ำ ตัวส่วนเป็นบวกเสมอ คืน [เศษ, ส่วน] */
function reduceFrac(n, d) {
  if (!d) return [n, d];
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d);
  return [n / g, d / g];
}

/** เขียนเศษส่วนเป็นข้อความสำหรับส่งให้ M() โดย<b>ย่ออย่างต่ำ</b>ก่อน
    ใช้กับคำตอบและตัวเลือก ซึ่งต้องอยู่ในรูปอย่างต่ำเสมอ */
function fracTxt(n, d) { const r = reduceFrac(n, d); return fracRaw(r[0], r[1]); }
/** เขียนเศษส่วน <b>ตามที่ให้มา</b> ไม่ย่อ — ใช้กับตัวเลขในโจทย์ เพราะบางข้อ
    ตั้งใจให้เห็นรูปที่ยังไม่ย่อ เช่น เทียบ 3/6 กับ 3/12 ที่ตัวเศษเท่ากัน */
function fracRaw(n, d) {
  if (d < 0) { n = -n; d = -d; }
  if (d === 1) return String(n);
  return (n < 0 ? '-' : '') + 'frac(' + Math.abs(n) + ',' + d + ')';
}

/** คำแนะนำเหนือช่องกรอกคำตอบ — เปลี่ยนตามชนิดคำตอบที่แม่แบบกำหนด
    เพราะโจทย์เศษส่วน โจทย์จำนวนเต็ม และโจทย์ทศนิยม มีกติกาการตอบคนละแบบ */
function ansHintHTML(p) {
  const kinds = p.finds.map(f => f.kind || 'num');
  let tip;
  if (kinds.indexOf('frac') >= 0)
    tip = 'พิมพ์เศษส่วนได้เลย เช่น <b>3/4</b> หรือจำนวนคละ <b>1 1/2</b>' +
      (p.finds.some(f => f.lowest) ? ' · ข้อนี้ต้องตอบเป็น<b>เศษส่วนอย่างต่ำ</b>' : '');
  else if (kinds.every(k => k === 'int' || k === 'exact'))
    tip = 'ตอบให้ตรงเป๊ะ ไม่มีการปัดเศษ · ใส่เครื่องหมายลบด้วยถ้าคำตอบเป็นจำนวนลบ';
  else
    tip = 'ไม่ต้องพิมพ์หน่วย · ยอมคลาดเคลื่อนได้ ±' + fmt(DB.settings.tolPct) + '%';
  return '<div style="margin-bottom:9px"><b>กรอกคำตอบ</b> <span class="hint">(' + tip + ')</span></div>';
}

/** ข้อความคำตอบสำหรับแสดงผล — เศษส่วนแสดงเป็นเศษส่วน ไม่ใช่ทศนิยมยาว ๆ */
function ansTxt(f) {
  return (f.kind === 'frac' && f.den) ? fracTxt(f.num, f.den) : fmtq(f.value);
}

/** อ่านคำตอบที่นักเรียนพิมพ์ รองรับ 1,200 · +5 · 2.5x10^3 · 3/4 · -2/5 · 1 1/2
    คืน { v, n, d } โดย n/d มีค่าเฉพาะเมื่อพิมพ์มาเป็นเศษส่วน (ใช้ตรวจว่าย่ออย่างต่ำหรือยัง) */
function parseAns(raw) {
  if (raw == null) return null;
  let s = String(raw).trim().replace(/,/g, '').replace(/^\+/, '');
  if (s === '') return null;
  // จำนวนคละ เช่น 1 1/2 หรือ -2 3/4
  let m = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (m) {
    const w = Number(m[1]), n = Number(m[2]), d = Number(m[3]);
    if (!d) return null;
    const sign = m[1].charAt(0) === '-' ? -1 : 1;
    const num = Math.abs(w) * d + n;
    return { v: sign * num / d, n: sign * num, d: d };
  }
  // เศษส่วนล้วน เช่น 3/4 หรือ -2/5
  m = s.replace(/\s+/g, '').match(/^(-?\d+)\/(-?\d+)$/);
  if (m) {
    const n = Number(m[1]), d = Number(m[2]);
    if (!d) return null;
    return { v: n / d, n: n, d: d };
  }
  s = s.replace(/\s+/g, '').replace(/[×xX]10\^?/, 'e').replace(/E/, 'e');
  if (!/^-?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/.test(s)) return null;
  const v = Number(s);
  return isFinite(v) ? { v: v, n: null, d: null } : null;
}
/** เอาเฉพาะค่าตัวเลข — ใช้ตรวจว่านักเรียนกรอกช่องนี้แล้วหรือยัง */
function parseNum(raw) { const a = parseAns(raw); return a ? a.v : null; }

/** เทียบคำตอบตามชนิดที่แม่แบบกำหนดไว้ใน find */
function checkAns(raw, f, tolPct) {
  const a = parseAns(raw);
  if (!a) return false;
  const kind = (f && f.kind) || 'num';
  const target = f.value;
  if (kind === 'frac') {
    if (Math.abs(a.v - target) > 1e-9) return false;
    if (!f.lowest) return true;
    // โจทย์สั่ง "ตอบเป็นเศษส่วนอย่างต่ำ" — พิมพ์ทศนิยมมาถือว่ายังไม่ตรงรูปที่โจทย์ขอ
    if (a.d == null) return Math.abs(target - Math.round(target)) < 1e-9;
    const r = reduceFrac(a.n, a.d);
    return r[0] === a.n && r[1] === a.d;
  }
  if (kind === 'int' || kind === 'exact') return Math.abs(a.v - target) < 1e-9;
  const pct = (tolPct == null ? DB.settings.tolPct : tolPct) / 100;
  const tol = Math.max(Math.abs(target) * pct, 0.005);
  return Math.abs(a.v - target) <= tol + 1e-9;
}
/** ของเดิม เก็บไว้ให้โค้ดส่วนที่เทียบตัวเลขล้วนยังเรียกได้ */
function checkNum(user, target, tolPct) { return checkAns(user, { value: target, kind: 'num' }, tolPct); }

/* --- 3.6 วาดวิธีทำ 7 ขั้น ------------------------------------------------- */
const STEP_TITLES = ['วิเคราะห์โจทย์', 'สิ่งที่โจทย์กำหนด', 'หลักการและสูตรที่ใช้',
                     'ตั้งสมการและจัดรูป', 'แทนค่า / ดำเนินการ', 'คำนวณ', 'สรุปคำตอบและตรวจสอบ'];

/** ตารางสิ่งที่โจทย์กำหนดให้ + สิ่งที่ต้องหา (สร้างอัตโนมัติจากข้อมูลโจทย์) */
function givenTable(p) {
  let h = '<table class="given"><tbody>';
  p.given.forEach(gv => {
    h += '<tr><td class="s">' + M(gv.s) + '</td><td class="e">=</td>' +
      '<td class="v">' + (typeof gv.v === 'number' ? fmt(gv.v) : gv.v) + '</td>' +
      '<td class="d">' + (gv.unit ? esc(gv.unit) : '') + (gv.d ? ' &nbsp;(' + esc(gv.d) + ')' : '') + '</td></tr>';
  });
  p.finds.forEach(f => {
    h += '<tr><td class="s">' + M(f.s) + '</td><td class="e">=</td>' +
      '<td class="v" style="color:var(--muted)">?</td>' +
      '<td class="d">' + (f.unit ? esc(f.unit) : '') + (f.d ? ' &nbsp;(' + esc(f.d) + ')' : '') + '</td></tr>';
  });
  return h + '</tbody></table>';
}

function stepBodies(p) {
  if (p.theory) return [p.idea, choiceWhyHTML(p), p.why];
  const s = p.sol;
  const eqHtml = (s.eqs || []).map(e =>
    '<div>' + EQ(e.eq) + (e.why ? '<div class="why">' + e.why + '</div>' : '') + '</div>').join('');
  const lines = a => (Array.isArray(a) ? a : [a]).filter(Boolean).join('');
  return [
    s.analyze,
    givenTable(p),
    eqHtml,
    lines(s.solve),
    lines(s.subst),
    lines(s.calc),
    s.conclude
  ];
}

/** กล่องอธิบายของโจทย์ทฤษฎี — แนวคิดหลัก + เหตุผลรายตัวเลือก + ข้อสรุปที่ต้องจำ */
function theorySolutionHTML(p, open) {
  const rows = [
    { n: 1, t: 'แนวคิดที่ใช้ตอบ', b: p.idea },
    { n: 2, t: 'ทำไมข้อนี้ถูก และข้ออื่นผิดตรงไหน', b: choiceWhyHTML(p) },
    { n: 3, t: 'สิ่งที่ต้องจำไปใช้ต่อ', b: p.why }
  ];
  let h = '<div class="sol">';
  rows.forEach(r => {
    h += '<div class="solstep' + (open ? '' : ' closed') + '" data-step="' + (r.n - 1) + '">' +
      '<div class="h"><span class="n">' + r.n + '</span>' + r.t +
      (open ? '' : '<span class="cv">แตะเพื่อดู</span>') + '</div>' +
      '<div class="b">' + (r.b || '<span class="hint">—</span>') + '</div></div>';
  });
  return h + '</div>';
}
/** ไล่อธิบายทีละตัวเลือกว่าถูกหรือผิดเพราะอะไร */
function choiceWhyHTML(p) {
  return '<div class="whylist">' + (p.choices || []).map((c, k) =>
    '<div class="whyrow ' + (c.correct ? 'ok' : 'no') + '">' +
    '<span class="wk">' + 'กขคง'[k] + '.</span>' +
    '<span class="wt">' + c.text + '</span>' +
    '<span class="wm">' + (c.correct ? '✓ ถูก' : '✗ ผิด') + '</span>' +
    (c.why ? '<div class="wd">' + c.why + '</div>' : '') + '</div>').join('') + '</div>';
}

/** โหมด open=true จะกางทุกขั้น (ใช้ตอนพิมพ์) */
function solutionHTML(p, open) {
  if (p.theory) return theorySolutionHTML(p, open);
  const b = stepBodies(p);
  let h = '<div class="sol">';
  for (let i = 0; i < 7; i++) {
    h += '<div class="solstep' + (open ? '' : ' closed') + '" data-step="' + i + '">' +
      '<div class="h"><span class="n">' + (i + 1) + '</span>' + STEP_TITLES[i] +
      (open ? '' : '<span class="cv">แตะเพื่อดู</span>') + '</div>' +
      '<div class="b">' + (b[i] || '<span class="hint">—</span>') + '</div></div>';
  }
  return h + '</div>';
}

/** ผูกให้แตะหัวข้อแล้วพับ/กางได้ */
function bindSolutionToggle(root) {
  $$('.solstep>.h', root).forEach(h => {
    h.addEventListener('click', () => {
      const st = h.parentElement;
      st.classList.toggle('closed');
      const cv = $('.cv', h);
      if (cv) cv.textContent = st.classList.contains('closed') ? 'แตะเพื่อดู' : 'แตะเพื่อซ่อน';
    });
  });
}

/* ============================================================================
   4) คลังแม่แบบโจทย์
   ทุกแม่แบบคืนค่า null ได้ถ้าตัวเลขที่สุ่มมาไม่สวย ระบบจะสุ่มใหม่ให้เอง
   ========================================================================== */
function T(o) { TPL.push(o); TPL_BY_ID[o.id] = o; }

/** ลงทะเบียน "โจทย์ทฤษฎี" — ปรนัย 4 ตัวเลือก เน้นความเข้าใจ ไม่ต้องคำนวณ
    o.gen(R) ต้องคืน { stem, choices, idea, why, figure? }
      choices : [{ text, correct?, why }] ต้องมี 4 ตัว และถูกเพียงตัวเดียว
                why ของแต่ละตัวเลือกคือคำอธิบายว่าถูก/ผิดเพราะอะไร
      idea    : แนวคิดหลักที่ใช้ตัดสิน
      why     : ข้อสรุปที่ต้องจำไปใช้ต่อ
    ระบบสับลำดับตัวเลือกตาม seed ให้เอง นักเรียนจึงจำตำแหน่งข้อถูกไม่ได้ */
function TQ(o) {
  T({
    id: o.id, topic: o.topic, sub: o.sub, level: THEORY_LEVEL, skills: o.skills || [],
    gen(R, c) {
      const q = o.gen(R, c);
      if (!q || !q.choices || q.choices.length !== 4) return null;
      q.choices = R.shuffle(q.choices);
      q.given = []; q.finds = [];
      return q;
    }
  });
}
/** ตัวช่วยเขียนตัวเลือก: ถูก = C('ข้อความ','เพราะ...') ผิด = X('ข้อความ','ที่ผิดคือ...') */
function C(text, why) { return { text: text, correct: true, why: why }; }
function X(text, why) { return { text: text, correct: false, why: why }; }
/** ตัวเลข+หน่วย สำหรับแทรกในเนื้อโจทย์ */
function U(v, u) { return M(fmt(v) + (u ? ' `' + u + '`' : '')); }
/** ตรวจว่าค่าที่จะเอาไปเป็น "สิ่งที่โจทย์กำหนด" สวยพอหรือไม่ */
function ok2(){ for (const v of arguments) { if (!isFinite(v) || dpOf(v, 4) > 2) return false; } return true; }
/** เศษส่วนสำหรับแทรกในเนื้อโจทย์ ตามรูปที่เขียนมา ไม่ย่อ เช่น FR(3,4) */
function FR(n, d) { return M(fracRaw(n, d)); }
/** เศษส่วนอย่างต่ำสำหรับแสดงคำตอบ เช่น FRL(6,8) ได้ 3/4 */
function FRL(n, d) { return M(fracTxt(n, d)); }
/** สร้าง find ของคำตอบชนิดเศษส่วน — ย่อให้อยู่ในรูปอย่างต่ำอัตโนมัติ
    ส่ง lowest = false ถ้าโจทย์ไม่ได้บังคับให้ตอบเป็นเศษส่วนอย่างต่ำ */
function FF(sym, n, d, desc, lowest) {
  const r = reduceFrac(n, d);
  return { s: sym, d: desc, value: r[0] / r[1], kind: 'frac', num: r[0], den: r[1],
           lowest: lowest !== false };
}
/** สุ่มเศษส่วนแท้ที่ย่ออย่างต่ำแล้ว ตัวส่วนอยู่ในช่วง [dmin, dmax] */
function randFrac(R, dmin, dmax) {
  for (let k = 0; k < 80; k++) {
    const d = R.int(dmin, dmax);
    if (d < 2) continue;
    const n = R.int(1, d - 1);
    if (gcd(n, d) === 1) return [n, d];
  }
  return [1, 2];
}



/* ============ คลังแม่แบบโจทย์เคมี ม.4 ============ */

/** นับเลขนัยสำคัญจากสตริงตัวเลขที่เขียนไว้ตามรูป (ไม่ใช่จากค่าตัวเลข)
    ต้องรับเป็นสตริง เพราะ 2.50 กับ 2.5 มีเลขนัยสำคัญไม่เท่ากันแต่ค่าเท่ากัน */
function sigCount(str) {
  let s = String(str).trim().replace(/^[+-]/, '');
  if (/e/i.test(s)) s = s.split(/e/i)[0];
  const dot = s.indexOf('.') >= 0;
  s = s.replace('.', '').replace(/^0+/, '');       // ศูนย์นำหน้าไม่นับเสมอ
  if (!dot) s = s.replace(/0+$/, '');              // ไม่มีจุดทศนิยม ศูนย์ท้ายไม่นับ
  return s.length || 1;
}

/** ปัดให้เหลือเลขนัยสำคัญ n ตัว */
function toSig(v, n) {
  if (v === 0) return 0;
  const d = Math.ceil(Math.log10(Math.abs(v)));
  const p = n - d;
  return Math.round(v * Math.pow(10, p)) / Math.pow(10, p);
}

T({
  id: 'c1-unit', topic: 401, sub: 'หน่วยและการเปลี่ยนหน่วย', level: 'ง่าย',
  skills: ['เปลี่ยนหน่วยด้วยคำอุปสรรค'],
  gen(R) {
    const q = R.pick([
      { from: 'mL', to: 'L', k: 0.001, v: R.pick([250, 500, 125, 75, 40]) },
      { from: 'g', to: 'kg', k: 0.001, v: R.pick([250, 1500, 80, 45, 620]) },
      { from: 'cm', to: 'm', k: 0.01, v: R.pick([250, 45, 180, 92, 7]) },
      { from: 'L', to: 'mL', k: 1000, v: R.pick([0.25, 1.5, 0.08, 2.4]) },
      { from: 'kg', to: 'g', k: 1000, v: R.pick([0.25, 1.5, 0.08, 3.2]) }
    ]);
    const ans = round2(q.v * q.k);
    if (!ok2(ans) || ans === 0) return null;
    return {
      stem: 'จงเปลี่ยนหน่วย ' + U(q.v, q.from) + ' ให้เป็นหน่วย ' + M('`' + q.to + '`'),
      given: [{ s: 'ค่าที่กำหนด', v: q.v, unit: q.from, d: '' },
              { s: 'หน่วยที่ต้องการ', v: q.to, d: '' }],
      finds: [{ s: 'ค่าในหน่วยใหม่', unit: q.to, d: 'หลังเปลี่ยนหน่วย', value: ans, positive: true, kind: 'exact' }],
      distract: [round2(q.v / q.k), round2(q.v * q.k * 10), round2(q.v * q.k / 10)],
      exactDistract: true,
      sol: {
        analyze: 'ใช้ความสัมพันธ์ของ<b>คำอุปสรรค</b><br>' +
          '• ' + M('k = 10^3') + ' · ' + M('c = 10^{-2}') + ' · ' + M('m = 10^{-3}') + '<br>' +
          'ข้อนี้ ' + M('1 `' + q.to + '` = ' + fmt(q.k > 1 ? 1 / q.k : 1 / q.k) + ' `' + q.from + '`') +
          ' หรือมองอีกทางคือ ' + M('1 `' + q.from + '` = ' + fmt(q.k) + ' `' + q.to + '`') + '<br>' +
          '<b>กับดักของข้อนี้:</b> คูณผิดทิศ ได้ ' + fmt(round2(q.v / q.k)) + ' ซึ่ง' +
          (q.k < 1 ? 'ใหญ่' : 'เล็ก') + 'กว่าที่ควรเป็นมาก · ' +
          'ตรวจด้วยสามัญสำนึกก่อนเสมอว่าตัวเลขควรใหญ่ขึ้นหรือเล็กลง',
        eqs: [{ eq: 'หน่วยใหญ่ขึ้น ⇒ ตัวเลขเล็กลง', why: 'ปริมาณเท่าเดิม แต่ใช้หน่วยที่ใหญ่กว่าจึงนับได้จำนวนน้อยกว่า' },
              { eq: 'หน่วยเล็กลง ⇒ ตัวเลขใหญ่ขึ้น', why: 'เหตุผลเดียวกันแต่กลับทาง' }],
        solve: EQ(fmt(q.v) + ' `' + q.from + '` × frac(' + fmt(q.k) + ' `' + q.to + '`,1 `' + q.from + '`)'),
        subst: SEQ('= {a} `' + q.to + '`', { a: ans }),
        calc: EQ(fmt(q.v) + ' `' + q.from + '` = ' + fmt(ans) + ' `' + q.to + '`'),
        conclude: 'ดังนั้น <b>' + U(q.v, q.from) + ' เท่ากับ ' + U(ans, q.to) + '</b><br>' +
          '<span class="hint">เคล็ดลับกันพลาด: เขียนหน่วยกำกับทุกขั้นแล้ว<b>ตัดหน่วยเหมือนตัดเศษส่วน</b> · ' +
          'ถ้าหน่วยที่ตัดแล้วเหลือไม่ตรงกับที่โจทย์ถาม แสดงว่าคูณผิดทิศ</span>'
      }
    };
  }
});

T({
  id: 'c1-read', topic: 401, sub: 'การอ่านค่าจากอุปกรณ์', level: 'ง่าย',

        'จงบันทึกปริมาตรที่อ่านได้ (บันทึกให้มีตำแหน่งที่ประมาณด้วย)',
      figure: figLabGlass({ cap: cap, minor: minor, read: read, unit: 'mL', name: 'กระบอกตวง' }),
      given: [{ s: 'ความจุ', v: cap, unit: 'mL', d: 'ของกระบอกตวง' },
              { s: 'ขีดเล็กละ', v: minor, unit: 'mL', d: 'ความละเอียดของสเกล' }],
      finds: [{ s: 'ปริมาตรที่อ่านได้', unit: 'mL', d: 'รวมตำแหน่งที่ประมาณ',
                value: read, positive: true, kind: 'exact' }],
      distract: [big, round2(big + minor), round2(read + minor)],
      exactDistract: true,
      sol: {
        analyze: 'อ่านสองส่วนแล้วนำมาต่อกัน<br>' +
          '• <b>ส่วนที่แน่นอน</b> — ขีดสุดท้ายที่ของเหลวผ่านมาแล้ว คือ ' + U(big, 'mL') + '<br>' +
          '• <b>ส่วนที่ประมาณ</b> — กะระยะระหว่างขีด ได้อีกราว ' + U(extra, 'mL') + '<br>' +
          'อ่านที่<b>ก้นโค้งเว้า</b> โดยให้ระดับตาเสมอผิวของเหลว<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบ ' + U(big, 'mL') + ' เฉย ๆ โดยไม่ประมาณต่อ · ' +
          'การวัดทุกครั้งต้องมีตัวเลขที่ไม่แน่นอนหนึ่งตำแหน่งเสมอ',
        eqs: [{ eq: 'ค่าที่อ่านได้ = ขีดที่ผ่านมาแล้ว + ส่วนที่ประมาณระหว่างขีด',
                why: 'ตำแหน่งสุดท้ายเป็นตัวที่ไม่แน่นอน ซึ่งยังนับเป็นเลขนัยสำคัญ' },
              { eq: 'อ่านที่ก้นโค้งเว้า ระดับตาเสมอผิวของเหลว', why: 'กันความคลาดเคลื่อนจากมุมมอง' }],
        solve: EQ('ค่าที่อ่านได้ = ' + fmt(big) + ' + ' + fmt(extra)),
        subst: SEQ('= {r} `mL`', { r: read }),
        calc: EQ('ปริมาตร = ' + fmt(read) + ' `mL`'),
        conclude: 'ดังนั้น <b>บันทึกได้ว่า ' + U(read, 'mL') + '</b> ' +
          '(มีเลขนัยสำคัญ ' + U(sigCount(fmt(read)), 'ตัว') + ')<br>' +
          '<span class="hint">ตัวเลขตำแหน่งสุดท้ายคือตัวที่<b>ไม่แน่นอน</b> · ' +
          'ถ้าเพื่อนอ่านได้ ' + fmt(round2(read + 0.1 * minor)) + ' ก็ยังถือว่ายอมรับได้ ' +
          'แต่ถ้าต่างกันเกินหนึ่งขีดเล็กแสดงว่าอ่านผิดวิธี</span>'
      }
    };
  }
});

T({

  gen(R) {

    return {
      stem: 'จงหาผลคูณ ' + M(aS + ' × ' + bS) + ' แล้ว<b>ตอบตามหลักเลขนัยสำคัญ</b>',

      finds: [{ s: 'จำนวนเลขนัยสำคัญของคำตอบ', unit: 'ตัว', d: 'ตัวที่น้อยที่สุด',
                value: n, positive: true, kind: 'int' },
              { s: 'ผลคูณ', d: 'ปัดตามเลขนัยสำคัญแล้ว', value: ans, positive: true, kind: 'exact' }],
      sol: {
        analyze: 'การ<b>คูณหาร</b> ใช้กฎ<b>เลขนัยสำคัญ</b> — ตอบตามตัวที่มีเลขนัยสำคัญ<b>น้อยที่สุด</b><br>' +
          M(aS) + ' มี ' + nA + ' ตัว · ' + M(bS) + ' มี ' + nB + ' ตัว ⇒ คำตอบมีได้ <b>' + n + '</b> ตัว<br>' +
          '<b>สำคัญ:</b> คูณให้เสร็จก่อน แล้วค่อยปัดครั้งเดียวตอนท้าย<br>' +
          '<b>กับดักของข้อนี้:</b> ปัดตัวตั้งก่อนคูณ ทำให้ความคลาดเคลื่อนสะสม · ' +
          'หรือใช้กฎทศนิยมของการบวกลบมาปนกัน',
        eqs: [{ eq: 'คูณ-หาร ⇒ เลขนัยสำคัญของคำตอบ = ตัวที่น้อยที่สุดในโจทย์',
                why: 'คำตอบแม่นได้ไม่เกินข้อมูลที่หยาบที่สุดที่ใช้คำนวณ' },
              { eq: 'ปัดครั้งเดียวตอนท้าย', why: 'ปัดระหว่างทางทำให้ความคลาดเคลื่อนทบกันไปเรื่อย ๆ' }],
        solve: EQ(aS + ' × ' + bS + ' = ' + fmt(round2(raw), 4)),
        subst: SEQ('ปัดให้เหลือ {n} ตัว', { n: n }),
        calc: EQ('ผลคูณ = ' + fmt(ans)),
        conclude: 'ดังนั้น <b>คำตอบมีเลขนัยสำคัญ ' + U(n, 'ตัว') + ' คือ ' + M(fmt(ans)) + '</b><br>' +

          'ถ้าตอบเต็มทุกหลักจะเป็นการอ้างความละเอียดเกินกว่าที่เครื่องมือให้มา</span>'
      }
    };
  }
});

function shellsOf(z) {
  const cap = [2, 8, 8, 2], out = [];
  let left = z;
  for (let i = 0; i < cap.length && left > 0; i++) {
    const put = Math.min(left, cap[i]);
    out.push(put); left -= put;
  }
  return out;
}

          'เพราะอิเล็กตรอนคือประจุลบ เอาลบออกจึงเหลือบวก',

T({

      sol: {

          '• <b>โปรตอน</b> = เลขอะตอม = ' + e[2] + ' — ค่านี้ไม่เปลี่ยนแม้เป็นไอออน<br>' +
          '• <b>นิวตรอน</b> = ' + M('A - Z') + ' — ประจุไม่เกี่ยวกับนิวตรอนเลย<br>' +
          '• <b>อิเล็กตรอน</b> = โปรตอน − ประจุ — ตัวเดียวที่ประจุมีผล<br>' +
          '<b>กับดักของข้อนี้:</b> เอาประจุไปลบออกจาก<b>นิวตรอน</b>ด้วย · ' +
          'การเกิดไอออนเกิดที่อิเล็กตรอนวงนอกเท่านั้น นิวเคลียสไม่ถูกแตะต้อง',
        eqs: [{ eq: 'โปรตอน = Z', why: 'เป็นตัวระบุชนิดธาตุ ปฏิกิริยาเคมีไม่เปลี่ยนค่านี้' },
              { eq: 'นิวตรอน = A - Z', why: 'เลขมวลนับเฉพาะอนุภาคในนิวเคลียส' },
              { eq: 'อิเล็กตรอน = Z - ประจุ', why: 'ไอออนบวกเสียอิเล็กตรอน ไอออนลบรับอิเล็กตรอน' }],
        solve: EQ('โปรตอน = ' + e[2], 'นิวตรอน = ' + e[3] + ' - ' + e[2],

        calc: EQ('โปรตอน = ' + e[2] + ' `ตัว`', 'นิวตรอน = ' + n + ' `ตัว`', 'อิเล็กตรอน = ' + el + ' `ตัว`'),
        conclude: 'ดังนั้น <b>โปรตอน ' + U(e[2], 'ตัว') + ' · นิวตรอน ' + U(n, 'ตัว') + ' · อิเล็กตรอน ' +
          U(el, 'ตัว') + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ประจุรวม = โปรตอน − อิเล็กตรอน = ' + e[2] + ' − ' + el +
          ' = ' + (q > 0 ? '+' : '') + q + ' ✓ ตรงกับที่โจทย์ให้มา</span>'
      }
    };
  }
});

        eqs: [{ eq: 'มวลอะตอมเฉลี่ย = frac(Σ (มวลไอโซโทป × ร้อยละ),100)',
                why: 'ถ่วงน้ำหนักตามปริมาณที่พบในธรรมชาติ' },
              { eq: 'ผลรวมของร้อยละต้องเป็น 100', why: 'ใช้ตรวจว่าอ่านโจทย์ครบทุกไอโซโทปแล้ว' }],
        solve: EQ('มวลเฉลี่ย = frac((' + a1 + ' × ' + p1 + ') + (' + a2 + ' × ' + p2 + '),100)'),
        subst: SEQ('= frac({s},100)', { s: a1 * p1 + a2 * p2 }),
        calc: EQ('มวลอะตอมเฉลี่ย = ' + fmt(avg)),
        conclude: 'ดังนั้น <b>มวลอะตอมเฉลี่ยเท่ากับ ' + M(fmt(avg)) + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผล: ค่าเฉลี่ยต้องอยู่<b>ระหว่าง</b> ' + a1 + ' กับ ' + a2 +

      }
    };
  }
});

T({

      given: [{ s: 'EN ของ ' + a[0], v: ea, d: '' }, { s: 'EN ของ ' + b[0], v: eb, d: '' }],
      finds: [{ s: 'ผลต่าง EN', d: 'ค่าสัมบูรณ์ของผลต่าง', value: diff, positive: true, kind: 'exact' }],

      sol: {
        analyze: 'ผลต่าง EN ใช้<b>ค่าสัมบูรณ์</b> เพราะสนใจแค่ว่าต่างกันมากน้อย ไม่สนว่าใครมากกว่า<br>' +

          '<b>กับดักของข้อนี้:</b> เอามาบวกกันได้ ' + fmt(round2(ea + eb)) +
          ' · โจทย์ถามผล<b>ต่าง</b> ไม่ใช่ผลรวม',
        eqs: [{ eq: 'ผลต่าง EN = |EN_1 - EN_2|', why: 'ใช้ค่าสัมบูรณ์เพราะสนใจขนาดของความต่าง' },
              { eq: 'ผลต่างมาก ⇒ ไอออนิก · น้อย ⇒ โคเวเลนต์', why: 'ใช้ทำนายชนิดพันธะได้ทันที' }],
        solve: EQ('ผลต่าง = |' + fmt(ea) + ' - ' + fmt(eb) + '|'),
        subst: SEQ('= {d}', { d: diff }),
        calc: EQ('ผลต่าง EN = ' + fmt(diff)),
        conclude: 'ดังนั้น <b>ผลต่าง EN เท่ากับ ' + M(fmt(diff)) + '</b><br>' +
          '<span class="hint">แปลผล: ผลต่าง ' + fmt(diff) + ' ' +
          (diff >= 1.7 ? 'ค่อนข้าง<b>มาก</b> จึงมีแนวโน้มเป็นพันธะ<b>ไอออนิก</b>'
            : diff >= 0.4 ? 'อยู่ระดับ<b>ปานกลาง</b> จึงเป็นพันธะ<b>โคเวเลนต์มีขั้ว</b>'

T({
  id: 'c3-iejump', topic: 403, sub: 'พลังงานไอออไนเซชัน', level: 'ง่าย',
  skills: ['อ่านเลขหมู่จากค่ากระโดดของพลังงานไอออไนเซชัน'],
  gen(R) {
    // g ในแม่แบบนี้คือ "จำนวนเวเลนซ์อิเล็กตรอน" ไม่ใช่เลขหมู่ · ค่ากระโดดจึงอยู่ที่ลำดับที่ g+1
    const g = R.pick([1, 2, 3]);
    const grp = g === 3 ? 13 : g;
    const ie = [];
    let v = R.int(400, 800);
    for (let i = 0; i < 5; i++) { ie.push(v); v = Math.round(v * (i + 1 === g ? 4.5 : 1.8)); }
    return {
      stem: 'ธาตุ X มีค่าพลังงานไอออไนเซชันลำดับที่ 1 ถึง 5 ดังกราฟ<br><b>' + ie.join(' , ') +
        '</b> kJ/mol<br>จงหาว่าธาตุ X มี<b>เวเลนซ์อิเล็กตรอน</b>กี่ตัว',
      figure: figBar({ labels: ['IE₁', 'IE₂', 'IE₃', 'IE₄', 'IE₅'], values: ie, unit: 'kJ/mol' }),
      given: [{ s: 'ค่า IE ทั้งห้าลำดับ', v: ie.join(' , '), unit: 'kJ/mol', d: '' },
              { s: 'ตำแหน่งที่กระโดด', v: 'IE' + (g + 1), d: 'สูงขึ้นผิดปกติ' }],
      finds: [{ s: 'เวเลนซ์อิเล็กตรอน', unit: 'ตัว', d: 'เท่ากับเลขหมู่', value: g, positive: true, kind: 'int' }],
      distract: [g + 1, g + 2, g + 3, g + 4, 8 - g],
      exactDistract: true,
      sol: {
        analyze: 'ค่า IE เพิ่มขึ้นทุกลำดับอยู่แล้ว เพราะดึงอิเล็กตรอนออกจากไอออนที่บวกมากขึ้นเรื่อย ๆ<br>' +
          'สิ่งที่ต้องมองคือจุดที่<b>กระโดดสูงผิดปกติ</b> ซึ่งดูจากอัตราส่วนระหว่างค่าที่ติดกัน<br>' +
          '• ' + M('frac(IE_' + (g + 1) + ',IE_' + g + ') = frac(' + ie[g] + ',' + ie[g - 1] + ') ≈ ' +
          fmt(round2(ie[g] / ie[g - 1])) + ' `เท่า`') + ' ⇒ กระโดดชัดเจน<br>' +
          'จำนวนอิเล็กตรอนที่ดึงออกได้<b>ก่อน</b>จุดกระโดด คือ<b>เวเลนซ์อิเล็กตรอน</b> = ' + g + ' ตัว<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบ ' + (g + 1) + ' โดยนับรวมลำดับที่กระโดดเข้าไปด้วย · ' +
          'ตัวที่กระโดดคือตัวที่<b>เริ่มดึงจากชั้นใน</b>แล้ว ไม่ใช่เวเลนซ์',
        eqs: [{ eq: 'IE เพิ่มขึ้นทุกลำดับเสมอ', why: 'ไอออนที่เหลือมีประจุบวกมากขึ้น ดึงอิเล็กตรอนไว้แน่นขึ้น' },
              { eq: 'ค่ากระโดดสูงผิดปกติ ⇒ เริ่มดึงอิเล็กตรอนจากชั้นในถัดไป',
                why: 'ชั้นในอยู่ใกล้นิวเคลียสมาก ต้องใช้พลังงานหลายเท่าตัว' },
              { eq: 'เวเลนซ์อิเล็กตรอน = จำนวนลำดับก่อนจุดกระโดด', why: 'คืออิเล็กตรอนที่อยู่ชั้นนอกสุดทั้งหมด' }],
        solve: '<div>เทียบอัตราส่วนของค่าที่ติดกัน</div>' +
          EQ(ie.map(function (v, i) { return i ? 'frac(IE_' + (i + 1) + ',IE_' + i + ') ≈ ' +
              fmt(round2(ie[i] / ie[i - 1])) : ''; }).filter(Boolean).join('  ·  ')),
        subst: SEQ('กระโดดที่ลำดับที่ {k}', { k: g + 1 }),
        calc: EQ('เวเลนซ์อิเล็กตรอน = ' + g + ' `ตัว`'),
        conclude: 'ดังนั้น <b>ธาตุ X มีเวเลนซ์อิเล็กตรอน ' + U(g, 'ตัว') + '</b> จึงอยู่<b>หมู่ ' +
          M(String(grp)) + '</b><br>' +
          '<span class="hint">ข้อสังเกต: วิธีนี้บอกหมู่ได้โดย<b>ไม่ต้องรู้เลขอะตอม</b>เลย · ' +
          'เป็นคำถามยอดนิยมของข้อสอบเพราะทดสอบความเข้าใจโครงสร้างอิเล็กตรอนโดยตรง</span>'
      }
    };
  }
});

T({

                value: pick[2][2], positive: true, kind: 'int' }],
      sol: {
        analyze: 'ทั้งสามธาตุอยู่<b>คาบเดียวกัน</b> จึงมีจำนวนระดับพลังงาน<b>เท่ากัน</b> คือ ' + p + ' ระดับ<br>' +
          'เมื่อชั้นเท่ากัน ตัวตัดสินขนาดคือ<b>จำนวนโปรตอน</b> — ยิ่งมาก ยิ่งดึงอิเล็กตรอนเข้าแน่น ยิ่งเล็ก<br>' +
          'เรียงจากเลขอะตอมน้อยไปมาก: ' + pick.map(function (e) { return e[0] + '(' + e[2] + ')'; }).join(' → ') +

          'ในคาบเดียวกันอิเล็กตรอนที่เพิ่มเข้าไปอยู่<b>ชั้นเดิม</b> ไม่ได้ทำให้กว้างขึ้น',
        eqs: [{ eq: 'คาบเดียวกัน ⇒ จำนวนระดับพลังงานเท่ากัน', why: 'ตัวแปรนี้ถูกล็อกไว้แล้ว จึงตัดออกจากการเปรียบเทียบ' },
              { eq: 'โปรตอนมากขึ้น ⇒ แรงดึงมากขึ้น ⇒ อะตอมเล็กลง', why: 'สิ่งเดียวที่ต่างกันในคาบเดียวกัน' }],
        solve: '<div>เรียงตามเลขอะตอม</div>' +
          EQ(pick.map(function (e) { return e[0] + ' (Z = ' + e[2] + ')'; }).join('  <  ')),

        calc: EQ('ใหญ่ที่สุด: ' + pick[0][0] + ' (Z = ' + pick[0][2] + ')',
                 'เล็กที่สุด: ' + pick[2][0] + ' (Z = ' + pick[2][2] + ')'),

          M(pick[2][0]) + ' เล็กที่สุด (Z = ' + pick[2][2] + ')</b><br>' +

          'เล็กที่สุดอยู่<b>มุมบนขวา</b> · โจทย์ที่ให้ธาตุคนละคาบต้องดูจำนวนชั้นก่อนเสมอ</span>'
      }
    };

T({

T({
  id: 'c3-enorder', topic: 403, sub: 'อิเล็กโทรเนกาติวิตี', level: 'ปานกลาง',
  skills: ['เปรียบเทียบ EN ของธาตุหลายตัว', 'ทำนายทิศของขั้ว'],
  gen(R) {
    const pool = elemEN().filter(e => e[2] >= 3);

    if (EN20[sorted[0][0]] === EN20[sorted[1][0]] ||
        EN20[sorted[1][0]] === EN20[sorted[2][0]]) return null;
    const spread = round2(EN20[sorted[0][0]] - EN20[sorted[2][0]]);
    return {
      stem: 'ธาตุ ' + pick.map(function (e) { return M(e[0]) + ' (EN = ' + fmt(EN20[e[0]]) + ')'; }).join(' , ') +
        '<br>จงหา<b>เลขอะตอมของธาตุที่มี EN สูงที่สุด</b> และ<b>ผลต่างระหว่าง EN สูงสุดกับต่ำสุด</b>',
      figure: figPeriodicMini({ mark: pick.map(function (e) { return e[0]; }),
                                trend: 'EN เพิ่มขึ้น', arrow: 'right' }),
      given: pick.map(function (e) { return { s: e[0], v: EN20[e[0]], d: 'หมู่ ' + e[4] }; }),
      finds: [{ s: 'เลขอะตอมของธาตุที่ EN สูงสุด', d: 'ดึงอิเล็กตรอนเก่งที่สุด',
                value: sorted[0][2], positive: true, kind: 'int' },
              { s: 'ผลต่าง EN สูงสุด − ต่ำสุด', d: 'ช่วงกว้างของค่า EN ในกลุ่มนี้', value: spread, positive: true, kind: 'exact' }],
      sol: {
        analyze: 'เรียงค่า EN จากมากไปน้อยก่อน แล้วค่อยตอบทีละข้อ<br>' +
          EQ(sorted.map(function (e) { return e[0] + ' (' + fmt(EN20[e[0]]) + ')'; }).join('  >  ')) +
          'ธาตุที่ EN สูงที่สุดคือ ' + M(sorted[0][0]) + ' ซึ่งอยู่ทาง<b>ขวาบน</b>ของตารางธาตุมากที่สุด<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบเป็น<b>ค่า EN</b> แทนที่จะเป็น<b>เลขอะตอม</b> · ' +
          'อ่านให้ชัดว่าโจทย์ขออะไร',
        eqs: [{ eq: 'EN สูง ⇒ ดึงอิเล็กตรอนคู่ร่วมพันธะได้เก่งกว่า', why: 'อะตอมเล็กและมีโปรตอนมากจะแย่งได้ดีกว่า' },
              { eq: 'ตามคาบเพิ่ม · ตามหมู่ลด · F สูงสุด', why: 'ใช้เดาลำดับได้แม้ไม่มีตัวเลขให้' }],
        solve: '<div>เรียงลำดับค่า EN</div>' +
          EQ(sorted.map(function (e) { return e[0] + ' = ' + fmt(EN20[e[0]]); }).join('  >  ')),
        subst: SEQ('ผลต่าง = {hi} - {lo}',
                   { hi: EN20[sorted[0][0]], lo: EN20[sorted[2][0]] }),
        calc: EQ('EN สูงสุด: ' + sorted[0][0] + ' (Z = ' + sorted[0][2] + ')',
                 'ผลต่าง = ' + fmt(spread)),
        conclude: 'ดังนั้น <b>' + M(sorted[0][0]) + ' มี EN สูงที่สุด (Z = ' + sorted[0][2] +
          ') และผลต่างสูงสุด−ต่ำสุดคือ ' + M(fmt(spread)) + '</b><br>' +
          '<span class="hint">ใช้ต่อได้ทันที: ถ้า ' + M(sorted[0][0]) + ' กับ ' + M(sorted[2][0]) +
          ' เกิดพันธะกัน ผลต่าง EN = ' + fmt(spread) + ' ⇒ เป็นพันธะ' +
          (spread >= 1.7 ? '<b>ไอออนิก</b>' : '<b>โคเวเลนต์มีขั้ว</b>') +
          ' และอิเล็กตรอนเอียงไปทาง ' + M(sorted[0][0]) + '</span>'
      }
    };
  }
});

T({
  id: 'c3-iefull', topic: 403, sub: 'พลังงานไอออไนเซชัน', level: 'ยาก',
  skills: ['วิเคราะห์ค่า IE เพื่อหาตำแหน่งในตารางธาตุ'],
  gen(R) {
    const g = R.pick([2, 3]);      // ใช้หมู่ 2 กับ 13 (g = 3 หมายถึงเวเลนซ์ 3 คือหมู่ 13)
    const grp = g === 3 ? 13 : g;
    const p = R.pick([2, 3]);
    const e = ELEM20.filter(x => x[4] === grp && shellsOf(x[2]).length === p)[0];
    if (!e) return null;
    const ie = [];
    let v = R.int(500, 800);
    for (let i = 0; i < 5; i++) { ie.push(v); v = Math.round(v * (i + 1 === g ? 4.6 : 1.75)); }
    const sh = shellsOf(e[2]);
    return {
      stem: 'ธาตุ Y มีค่าพลังงานไอออไนเซชัน 5 ลำดับแรก (kJ/mol) ดังนี้<br><b>' + ie.join(' , ') + '</b><br>' +
        'และทราบว่าธาตุ Y อยู่<b>คาบที่ ' + U(p) + '</b><br>' +
        'จงหา<b>เวเลนซ์อิเล็กตรอน</b> · <b>เลขหมู่</b> และ<b>เลขอะตอม</b> ของธาตุ Y',
      figure: figBar({ labels: ['IE₁', 'IE₂', 'IE₃', 'IE₄', 'IE₅'], values: ie, unit: 'kJ/mol' }),
      given: [{ s: 'ค่า IE', v: ie.join(' , '), unit: 'kJ/mol', d: 'ลำดับที่ 1 ถึง 5' },
              { s: 'คาบ', v: p, d: 'จำนวนระดับพลังงาน' }],
      finds: [{ s: 'เวเลนซ์อิเล็กตรอน', unit: 'ตัว', d: 'จำนวนลำดับก่อนค่ากระโดด',
                value: g, positive: true, kind: 'int' },
              { s: 'เลขหมู่', d: 'ตามเวเลนซ์อิเล็กตรอน', value: grp, positive: true, kind: 'int' },
              { s: 'เลขอะตอม', d: 'รวมอิเล็กตรอนทุกชั้น', value: e[2], positive: true, kind: 'int' }],
      sol: {
        analyze: 'ข้อนี้ต้องรวมข้อมูลสองแหล่งเข้าด้วยกัน<br>' +
          '<b>ขั้นที่ 1 อ่านหมู่จากค่า IE</b> — หาจุดที่กระโดดสูงผิดปกติ · ' +
          M('frac(IE_' + (g + 1) + ',IE_' + g + ') ≈ ' + fmt(round2(ie[g] / ie[g - 1])) + ' `เท่า`') +
          ' ในขณะที่คู่อื่นเพิ่มราว ' + fmt(round2(ie[1] / ie[0])) + ' เท่า<br>' +
          'ดึงออกง่ายได้ ' + g + ' ตัว ⇒ เวเลนซ์ ' + g + ' ตัว ⇒ <b>หมู่ ' + grp + '</b><br>' +
          '<b>ขั้นที่ 2 ใช้คาบหาเลขอะตอม</b> — คาบ ' + p + ' + เวเลนซ์ ' + g + ' ⇒ ' +
          M(sh.join(' , ')) + ' ⇒ Z = ' + e[2] + '<br>' +
          '<b>กับดักของข้อนี้:</b> ได้หมู่แล้วตอบเลขอะตอมเป็นเลขหมู่ · ' +
          'ค่า IE บอกได้แค่<b>หมู่</b> ต้องมีข้อมูล<b>คาบ</b>เพิ่มจึงจะระบุเลขอะตอมได้',
        eqs: [{ eq: 'จำนวนลำดับก่อนค่ากระโดด = เวเลนซ์อิเล็กตรอน = เลขหมู่',
                why: 'จุดกระโดดคือจุดที่เริ่มดึงอิเล็กตรอนจากชั้นในถัดไป' },
              { eq: 'หมู่ 13 ถึง 18 มีเวเลนซ์ 3 ถึง 8 ตามลำดับ',
                why: 'เลขหมู่แบบใหม่ข้ามช่วงธาตุแทรนซิชันไป 10 ช่อง' },
              { eq: 'คาบ + เวเลนซ์ ⇒ การจัดเรียง ⇒ เลขอะตอม', why: 'ชั้นในเต็มตามความจุ 2 , 8 , 8' }],
        solve: '<div>อัตราส่วนของค่า IE ที่ติดกัน</div>' +
          EQ(ie.map(function (v, i) { return i ? fmt(round2(ie[i] / ie[i - 1])) : ''; })
               .filter(Boolean).join('  ,  ')) +
          '<div>การจัดเรียงอิเล็กตรอน</div>' + EQ(sh.join(' , ')),
        subst: SEQ('เวเลนซ์ = {v}  ⇒  หมู่ {g}  ⇒  Z = {z}', { v: g, g: grp, z: e[2] }),
        calc: EQ('เวเลนซ์อิเล็กตรอน = ' + g + ' `ตัว`', 'เลขหมู่ = ' + grp, 'เลขอะตอม = ' + e[2]),
        conclude: 'ดังนั้น <b>ธาตุ Y คือ ' + e[1] + ' (' + M(e[0]) + ') เวเลนซ์ ' + g +
          ' ตัว หมู่ ' + grp + ' เลขอะตอม ' + e[2] + '</b><br>' +
          '<span class="hint">ตรวจความสมเหตุสมผลของค่า IE: ค่าแรก ' + ie[0] +
          ' kJ/mol อยู่ในช่วงของธาตุ<b>โลหะ</b> ซึ่งสอดคล้องกับหมู่ ' + grp + ' ✓</span>'
      }
    };
  }
});

T({
  id: 'c3-compare3', topic: 403, sub: 'แนวโน้มขนาดอะตอม', level: 'ยาก',
  skills: ['ใช้แนวโน้มสองทิศพร้อมกันเมื่อธาตุอยู่คนละคาบ'],
  gen(R) {
    const g = R.pick([1, 2, 17]);
    const col = ELEM20.filter(e => e[4] === g);
    if (col.length < 2) return null;
    const a = col[0], b = col[col.length - 1];
    const other = R.pick(ELEM20.filter(e => shellsOf(e[2]).length === shellsOf(b[2]).length &&
                                             e[4] !== g && e[4] <= 17));
    if (!other) return null;
    const shA = shellsOf(a[2]), shB = shellsOf(b[2]), shO = shellsOf(other[2]);
    const biggest = shB.length > shA.length ? b : a;
    return {
      stem: 'พิจารณาธาตุ ' + M(a[0]) + ' (Z = ' + U(a[2]) + ') , ' + M(b[0]) + ' (Z = ' + U(b[2]) +
        ') และ ' + M(other[0]) + ' (Z = ' + U(other[2]) + ')<br>' +
        'จงหา<b>จำนวนระดับพลังงานของแต่ละธาตุ</b> แล้วระบุ<b>เลขอะตอมของธาตุที่มีอะตอมใหญ่ที่สุด</b>',
      figure: figPeriodicMini({ mark: [a[0], b[0], other[0]] }),
      given: [{ s: a[0], v: a[2], d: 'หมู่ ' + a[4] }, { s: b[0], v: b[2], d: 'หมู่ ' + b[4] },
              { s: other[0], v: other[2], d: 'หมู่ ' + other[4] }],
      finds: [{ s: 'ระดับพลังงานของ ' + a[0], unit: 'ระดับ', d: 'จำนวนชั้นอิเล็กตรอน', value: shA.length, positive: true, kind: 'int' },
              { s: 'ระดับพลังงานของ ' + b[0], unit: 'ระดับ', d: 'จำนวนชั้นอิเล็กตรอน', value: shB.length, positive: true, kind: 'int' },
              { s: 'เลขอะตอมของธาตุที่ใหญ่ที่สุด', d: 'ชั้นมากที่สุดและอยู่ซ้ายที่สุด',
                value: biggest[2], positive: true, kind: 'int' }],
      sol: {
        analyze: 'ธาตุสามตัวนี้อยู่<b>คนละคาบคนละหมู่</b> ต้องใช้แนวโน้มสองทิศประกอบกัน<br>' +
          'ลำดับความสำคัญคือ <b>ดูจำนวนระดับพลังงานก่อน</b> แล้วค่อยดูตำแหน่งในคาบ<br>' +
          '• ' + a[0] + ' ⇒ ' + M(shA.join(' , ')) + ' (' + shA.length + ' ระดับ)<br>' +
          '• ' + b[0] + ' ⇒ ' + M(shB.join(' , ')) + ' (' + shB.length + ' ระดับ)<br>' +
          '• ' + other[0] + ' ⇒ ' + M(shO.join(' , ')) + ' (' + shO.length + ' ระดับ)<br>' +
          M(b[0]) + ' กับ ' + M(other[0]) + ' อยู่คาบเดียวกัน จึงตัดสินด้วยเลขอะตอม — ตัวที่<b>ซ้ายกว่า</b>ใหญ่กว่า<br>' +
          '<b>กับดักของข้อนี้:</b> เอาเลขอะตอมมาเทียบตรง ๆ ว่ามากแปลว่าใหญ่ · ' +
          'ใช้ได้เฉพาะเมื่ออยู่<b>หมู่เดียวกัน</b>เท่านั้น',
        eqs: [{ eq: 'จำนวนระดับพลังงานมากกว่า ⇒ อะตอมใหญ่กว่า (ตัวตัดสินหลัก)',
                why: 'การเพิ่มชั้นใหม่ทั้งชั้นมีผลมากกว่าการเพิ่มโปรตอนทีละตัว' },
              { eq: 'ชั้นเท่ากัน ⇒ โปรตอนน้อยกว่าย่อมใหญ่กว่า', why: 'แรงดึงจากนิวเคลียสน้อยกว่า' },
              { eq: 'อะตอมใหญ่ที่สุดอยู่มุมล่างซ้ายของตารางธาตุ', why: 'ชั้นมากที่สุดและโปรตอนน้อยที่สุดพร้อมกัน' }],
        solve: '<div>จัดเรียงอิเล็กตรอนทั้งสามธาตุ</div>' +
          EQ(a[0] + ': ' + shA.join(' , '), b[0] + ': ' + shB.join(' , '), other[0] + ': ' + shO.join(' , ')),
        subst: SEQ('{a} , {b} , {c} ระดับ ตามลำดับ',
                   { a: shA.length, b: shB.length, c: shO.length }),
        calc: EQ('ระดับพลังงาน: ' + a[0] + ' = ' + shA.length + '  ·  ' + b[0] + ' = ' + shB.length +
                 '  ·  ' + other[0] + ' = ' + shO.length,
                 'ใหญ่ที่สุด: ' + biggest[0] + ' (Z = ' + biggest[2] + ')'),
        conclude: 'ดังนั้น <b>' + M(biggest[0]) + ' มีอะตอมใหญ่ที่สุด (Z = ' + biggest[2] + ')</b><br>' +
          '<span class="hint">หลักที่ใช้ตัดสินใจ: เทียบ<b>จำนวนชั้นก่อนเสมอ</b> · ' +

          'ถ้าชั้นเท่ากันจึงค่อยเทียบเลขอะตอมโดยที่<b>น้อยกว่าคือใหญ่กว่า</b></span>'
      }
    };
  }
});

T({
  id: 'c4-charge', topic: 404, sub: 'พันธะไอออนิก', level: 'ง่าย',
  skills: ['หาประจุของไอออนจากเลขหมู่'],
  gen(R) {
    const e = R.pick(ELEM20.filter(x => ION_OF[x[4]] != null && x[2] >= 3));
    const q = ION_OF[e[4]];
    const sh = shellsOf(e[2]);
    return {
      stem: 'ธาตุ ' + e[1] + ' (' + M(e[0]) + ') อยู่<b>หมู่ ' + U(e[4]) + '</b><br>' +
        'เมื่อเกิดเป็นไอออนจะมี<b>ประจุ</b>เท่าใด ' +
        '<span class="hint">(ตอบเป็นจำนวนเต็ม เช่น 2 หรือ −2)</span>',
      figure: figAtomShell({ sym: e[0], p: e[2], n: e[3] - e[2], shells: sh }),
      given: [{ s: 'หมู่', v: e[4], d: 'บอกเวเลนซ์อิเล็กตรอน' },
              { s: 'เวเลนซ์อิเล็กตรอน', v: sh[sh.length - 1], unit: 'ตัว', d: '' }],
      finds: [{ s: 'ประจุของไอออน', d: 'จำนวนอิเล็กตรอนที่ให้หรือรับ', value: q, kind: 'int' }],
      distract: [-q, q > 0 ? q + 1 : q - 1, sh[sh.length - 1], 8 - sh[sh.length - 1]],
      exactDistract: true,
      sol: {
        analyze: 'อะตอมพยายามทำให้เวเลนซ์อิเล็กตรอนครบ 8 แบบแก๊สมีสกุล โดยเลือก<b>ทางที่ง่ายกว่า</b><br>' +
          M(e[0]) + ' มีเวเลนซ์ ' + sh[sh.length - 1] + ' ตัว<br>' +
          (q > 0 ? '<b>เสีย</b> ' + q + ' ตัวง่ายกว่า<b>รับ</b> ' + (8 - sh[sh.length - 1]) +
            ' ตัว จึงเกิดเป็น<b>ไอออนบวก</b> ประจุ +' + q
            : '<b>รับ</b> ' + (-q) + ' ตัวง่ายกว่า<b>เสีย</b> ' + sh[sh.length - 1] +
              ' ตัว จึงเกิดเป็น<b>ไอออนลบ</b> ประจุ ' + q) + '<br>' +
          '<b>กับดักของข้อนี้:</b> ใส่เครื่องหมายกลับด้าน · ' +
          'จำว่า<b>เสียอิเล็กตรอน (ประจุลบหายไป) ⇒ เหลือประจุบวก</b>',
        eqs: [{ eq: 'หมู่ 1 , 2 , 13 ⇒ เสียอิเล็กตรอน ⇒ ประจุ +1 , +2 , +3',
                why: 'โลหะมี IE ต่ำ เสียเวเลนซ์ทั้งหมดง่ายกว่ารับให้ครบ 8' },
              { eq: 'หมู่ 15 , 16 , 17 ⇒ รับอิเล็กตรอน ⇒ ประจุ −3 , −2 , −1',
                why: 'อโลหะมี EN สูง รับอีกไม่กี่ตัวก็ครบออกเตต' }],
        solve: EQ('เวเลนซ์ = ' + sh[sh.length - 1] + '  ⇒  ' +
                  (q > 0 ? 'เสีย ' + q + ' ตัว' : 'รับ ' + (-q) + ' ตัว')),
        subst: SEQ('ประจุ = {q}', { q: q }),
        calc: EQ('ประจุของไอออน = ' + (q > 0 ? '+' : '') + q),
        conclude: 'ดังนั้น <b>' + e[1] + ' เกิดเป็นไอออน ' +
          M(e[0] + '^{' + (Math.abs(q) === 1 ? '' : Math.abs(q)) + (q > 0 ? '+' : '-') + '}') + '</b><br>' +
          '<span class="hint">ตรวจคำตอบ: ไอออนนี้มีอิเล็กตรอน ' + (e[2] - q) +
          ' ตัว ซึ่งเท่ากับแก๊สมีสกุลที่ใกล้ที่สุดพอดี ✓ นี่คือเป้าหมายของการเกิดไอออน</span>'
      }
    };
  }
});

T({
  id: 'c4-covbond', topic: 404, sub: 'พันธะโคเวเลนต์', level: 'ง่าย',
  skills: ['หาจำนวนพันธะโคเวเลนต์จากกฎออกเตต'],

                      ['Cl', 'คลอรีน', 7], ['S', 'กำมะถัน', 6], ['P', 'ฟอสฟอรัส', 5]]);
    const b = 8 - e[2];
    return {
      stem: 'อะตอม ' + e[1] + ' (' + M(e[0]) + ') มีเวเลนซ์อิเล็กตรอน ' + U(e[2], 'ตัว') + '<br>' +

      figure: figLewis({ center: e[0], lone: (e[2] - b) / 2,
                         around: Array.from({ length: b }, function () { return { sym: 'H', order: 1, lone: 0 }; }),
                         caption: 'สร้างพันธะกับ H จนครบออกเตต' }),
      given: [{ s: 'เวเลนซ์อิเล็กตรอน', v: e[2], unit: 'ตัว', d: 'ในระดับนอกสุด' },
              { s: 'เป้าหมาย', v: 8, unit: 'ตัว', d: 'ตามกฎออกเตต' }],
      finds: [{ s: 'จำนวนพันธะ', unit: 'พันธะ', d: 'ที่ต้องสร้างจึงครบออกเตต',
                value: b, positive: true, kind: 'int' }],
      distract: [e[2], 8, b + 1, b + 2],

      sol: {
        analyze: 'พันธะโคเวเลนต์หนึ่งพันธะคือการ<b>ใช้อิเล็กตรอนร่วมกันหนึ่งคู่</b> ' +
          'ซึ่งทำให้อะตอมนับได้เพิ่มมาหนึ่งตัว<br>' +
          M(e[0]) + ' มีอยู่แล้ว ' + e[2] + ' ตัว ขาดอีก ' + M('8 - ' + e[2] + ' = ' + b) + ' ตัว<br>' +
          'จึงต้องสร้าง ' + b + ' พันธะ<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบ ' + e[2] + ' ซึ่งเป็น<b>จำนวนเวเลนซ์</b>ที่มีอยู่ ' +
          'ไม่ใช่จำนวนที่<b>ขาด</b>',
        eqs: [{ eq: 'จำนวนพันธะ = 8 - เวเลนซ์อิเล็กตรอน', why: 'แต่ละพันธะเติมอิเล็กตรอนให้นับได้เพิ่มหนึ่งตัว' },
              { eq: 'อิเล็กตรอนที่เหลือจับเป็นคู่โดดเดี่ยว', why: 'ข้อนี้เหลือ ' + ((e[2] - b) / 2) + ' คู่' }],
        solve: EQ('จำนวนพันธะ = 8 - `เวเลนซ์อิเล็กตรอน`'),
        subst: SEQ('= 8 - {v}', { v: e[2] }),
        calc: EQ('จำนวนพันธะ = ' + b + ' `พันธะ`'),
        conclude: 'ดังนั้น <b>' + e[1] + ' สร้างพันธะโคเวเลนต์ได้ ' + U(b, 'พันธะ') + '</b><br>' +
          '<span class="hint">ใช้ทำนายสูตรได้ทันที: ' + M(e[0] + (b === 1 ? 'H' : 'H_' + b)) +
          ' · และอะตอมนี้ยังมีคู่โดดเดี่ยวเหลืออีก ' + U((e[2] - b) / 2, 'คู่') +
          ' ซึ่งจะมีผลต่อรูปร่างโมเลกุลในบทถัดไป</span>'
      }
    };
  }
});

T({
  id: 'c4-formula', topic: 404, sub: 'สูตรและชื่อสารประกอบ', level: 'ง่าย',
  skills: ['เขียนสูตรสารประกอบไอออนิกด้วยการไขว้ประจุ'],
  gen(R) {
    const cat = R.pick(ELEM20.filter(x => [1, 2, 13].indexOf(x[4]) >= 0 && x[2] >= 3));
    const ani = R.pick(ELEM20.filter(x => [16, 17].indexOf(x[4]) >= 0));
    const qa = ION_OF[cat[4]], qb = -ION_OF[ani[4]];
    const g = gcd(qa, qb);
    const nA = qb / g, nB = qa / g;
    const total = nA + nB;
    const f = cat[0] + (nA > 1 ? '_' + nA : '') + ani[0] + (nB > 1 ? '_' + nB : '');
    return {
      stem: 'ธาตุ ' + M(cat[0]) + ' เกิดไอออน ' + M(cat[0] + '^{' + (qa === 1 ? '' : qa) + '+}') +
        ' และธาตุ ' + M(ani[0]) + ' เกิดไอออน ' + M(ani[0] + '^{' + (qb === 1 ? '' : qb) + '-}') + '<br>' +
        'เมื่อรวมกันเป็นสารประกอบไอออนิก จงหา<b>จำนวนอะตอมทั้งหมด</b>ในหนึ่งหน่วยสูตร',
      given: [{ s: 'ประจุของ ' + cat[0], v: '+' + qa, d: 'หมู่ ' + cat[4] },
              { s: 'ประจุของ ' + ani[0], v: '-' + qb, d: 'หมู่ ' + ani[4] }],
      finds: [{ s: 'จำนวนอะตอมทั้งหมด', unit: 'อะตอม', d: 'ในหนึ่งหน่วยสูตร',
                value: total, positive: true, kind: 'int' }],
      distract: [total + 1, total - 1, total + 2, total + 3, qa + qb, nA * nB + 1],
      exactDistract: true,
      sol: {
        analyze: 'สารประกอบไอออนิกต้องเป็น<b>กลางทางไฟฟ้า</b> — ประจุบวกรวมต้องเท่ากับประจุลบรวม<br>' +
          'วิธีลัดคือ<b>ไขว้เลขประจุ</b> แล้วย่อให้เป็นอัตราส่วนอย่างต่ำ<br>' +
          'ไขว้ได้ ' + M(cat[0] + '_' + qb + ani[0] + '_' + qa) +
          (g > 1 ? ' แล้วย่อด้วย ' + g + ' เหลือ ' + M(f) : ' ซึ่งเป็นอย่างต่ำอยู่แล้ว') + '<br>' +
          'นับอะตอมรวม = ' + nA + ' + ' + nB + ' = ' + total + '<br>' +
          '<b>กับดักของข้อนี้:</b> ' + (g > 1 ? 'ลืมย่ออัตราส่วน จะได้ ' + (qb + qa) + ' อะตอม'
            : 'เอาเลขประจุมาบวกกันเป็นคำตอบ ทั้งที่ต้องไขว้ก่อน'),
        eqs: [{ eq: 'ประจุบวกรวม = ประจุลบรวม', why: 'สารประกอบต้องเป็นกลางทางไฟฟ้า' },
              { eq: 'ไขว้เลขประจุแล้วย่อเป็นอัตราส่วนอย่างต่ำ', why: 'วิธีลัดที่ให้ผลตรงกับการดุลประจุเสมอ' }],
        solve: EQ('ไขว้ประจุ: ' + cat[0] + '_' + qb + ani[0] + '_' + qa +
                  (g > 1 ? '  ⇒  ย่อด้วย ' + g + '  ⇒  ' + f : '')),
        subst: SEQ('สูตรคือ ' + f + '   ⇒   {a} + {b}', { a: nA, b: nB }),
        calc: EQ('จำนวนอะตอมทั้งหมด = ' + total + ' `อะตอม`'),
        conclude: 'ดังนั้น <b>สูตรคือ ' + M(f) + ' มีอะตอมรวม ' + U(total, 'อะตอม') + '</b><br>' +
          '<span class="hint">ตรวจความเป็นกลาง: ประจุบวกรวม = ' + nA + ' × (+' + qa + ') = +' +
          (nA * qa) + ' · ประจุลบรวม = ' + nB + ' × (−' + qb + ') = −' + (nB * qb) + ' ✓ หักล้างกันพอดี</span>'
      }
    };
  }
});

T({
  id: 'c4-lonepair', topic: 404, sub: 'พันธะโคเวเลนต์', level: 'ง่าย',
  skills: ['นับคู่โดดเดี่ยวของอะตอมกลาง'],
  gen(R) {
    const m = R.pick([
      { c: 'C', v: 4, b: 4, out: 'H', name: 'มีเทน CH₄' },
      { c: 'N', v: 5, b: 3, out: 'H', name: 'แอมโมเนีย NH₃' },
      { c: 'O', v: 6, b: 2, out: 'H', name: 'น้ำ H₂O' }
    ]);
    const lone = (m.v - m.b) / 2;
    return {
      stem: 'ในโมเลกุล<b>' + m.name + '</b> อะตอมกลาง ' + M(m.c) + ' มีเวเลนซ์อิเล็กตรอน ' +
        U(m.v, 'ตัว') + ' และสร้างพันธะ ' + U(m.b, 'พันธะ') + '<br>' +
        'จงหาจำนวน<b>คู่โดดเดี่ยว</b>บนอะตอมกลาง',
      figure: figLewis({ center: m.c, lone: lone,
                         around: Array.from({ length: m.b }, function () { return { sym: m.out, order: 1, lone: 0 }; }),
                         caption: m.name }),
      given: [{ s: 'เวเลนซ์อิเล็กตรอนของ ' + m.c, v: m.v, unit: 'ตัว', d: '' },
              { s: 'จำนวนพันธะ', v: m.b, unit: 'พันธะ', d: 'ใช้อิเล็กตรอนพันธะละ 1 ตัว' }],
      // คำตอบเป็น 0 ได้จริง (เช่นมีเทน) จึงไม่ตั้ง positive
      finds: [{ s: 'คู่โดดเดี่ยว', unit: 'คู่', d: 'บนอะตอมกลาง', value: lone, kind: 'int' }],
      distract: [m.v - m.b, lone + 1, lone + 2, lone + 3, m.b, m.v],
      exactDistract: true,
      sol: {
        analyze: 'เวเลนซ์อิเล็กตรอนของอะตอมกลางถูกแบ่งเป็นสองพวก<br>' +
          '• ตัวที่<b>ใช้สร้างพันธะ</b> — พันธะละ 1 ตัว รวม ' + m.b + ' ตัว<br>' +
          '• ตัวที่<b>เหลือ</b> — จับกันเป็นคู่โดดเดี่ยว<br>' +
          'เหลือ ' + M(m.v + ' - ' + m.b + ' = ' + (m.v - m.b)) + ' ตัว ⇒ จับได้ ' +
          M('frac(' + (m.v - m.b) + ',2) = ' + lone) + ' คู่<br>' +
          '<b>กับดักของข้อนี้:</b> ตอบ ' + (m.v - m.b) + ' ซึ่งเป็นจำนวน<b>อิเล็กตรอน</b>ที่เหลือ · ' +
          'โจทย์ถามจำนวน<b>คู่</b> ต้องหารสองอีกที',
        eqs: [{ eq: 'อิเล็กตรอนที่ไม่ได้ใช้ = เวเลนซ์ - จำนวนพันธะ', why: 'พันธะเดี่ยวใช้อิเล็กตรอนของอะตอมกลาง 1 ตัว' },
              { eq: 'คู่โดดเดี่ยว = frac(อิเล็กตรอนที่เหลือ,2)', why: 'อิเล็กตรอนที่ไม่ได้เกิดพันธะจะจับกันเป็นคู่' }],
        solve: EQ('อิเล็กตรอนที่เหลือ = ' + m.v + ' - ' + m.b, 'คู่โดดเดี่ยว = frac(อิเล็กตรอนที่เหลือ,2)'),
        subst: SEQ('= frac({r},2)', { r: m.v - m.b }),
        calc: EQ('คู่โดดเดี่ยว = ' + lone + ' `คู่`'),
        conclude: 'ดังนั้น <b>' + M(m.c) + ' มีคู่โดดเดี่ยว ' + U(lone, 'คู่') + '</b><br>' +

T({

      finds: [{ s: 'จำนวนไอออนบวก', unit: 'ไอออน', d: 'ของ ' + cat[0], value: nA, positive: true, kind: 'int' },
              { s: 'จำนวนไอออนลบ', unit: 'ไอออน', d: 'ของ ' + ani[0], value: nB, positive: true, kind: 'int' }],
      sol: {
        analyze: 'เริ่มจากหาประจุของแต่ละไอออนจาก<b>เลขหมู่</b>ก่อน<br>' +
          '• หมู่ ' + cat[4] + ' ⇒ เสีย ' + qa + ' อิเล็กตรอน ⇒ ประจุ ' + M('+' + qa) + '<br>' +
          '• หมู่ ' + ani[4] + ' ⇒ รับ ' + qb + ' อิเล็กตรอน ⇒ ประจุ ' + M('-' + qb) + '<br>' +
          'จากนั้นดุลให้ประจุรวมเป็นศูนย์ ด้วยการ<b>ไขว้เลขประจุ</b><br>' +
          '<b>กับดักของข้อนี้:</b> ' + (g > 1 ? 'ไขว้แล้วลืมย่อ ได้ ' + cat[0] + '_' + qb + ani[0] + '_' + qa +
            ' ทั้งที่ย่อด้วย ' + g + ' ได้' : 'ใส่ตัวเลขสลับข้าง คือเอาประจุของตัวเองไปเป็นตัวห้อยของตัวเอง'),
        eqs: [{ eq: 'เลขหมู่ ⇒ ประจุของไอออน', why: 'หมู่ 1 2 13 เป็น +1 +2 +3 · หมู่ 15 16 17 เป็น −3 −2 −1' },
              { eq: 'จำนวนไอออนบวก × ประจุบวก = จำนวนไอออนลบ × ประจุลบ',
                why: 'เงื่อนไขความเป็นกลางทางไฟฟ้า ซึ่งการไขว้ประจุทำให้เป็นจริงโดยอัตโนมัติ' },

        solve: EQ('ไขว้ประจุ ⇒ ' + cat[0] + '_' + qb + ani[0] + '_' + qa +

T({

    ]);
    const sumB = rx.br.reduce(function (s, x) { return s + BOND_E[x[0]] * x[1]; }, 0);
    const sumF = rx.fm.reduce(function (s, x) { return s + BOND_E[x[0]] * x[1]; }, 0);
    const dH = sumB - sumF;
    return {
      stem: 'พิจารณาปฏิกิริยา ' + M(rx.eq) + '<br>' +
        'พลังงานพันธะ (kJ/mol): ' +

        '<br>จงหา<b>พลังงานที่ใช้สลายพันธะ</b> · <b>พลังงานที่คายจากการสร้างพันธะ</b> และ' +
        '<b>พลังงานของปฏิกิริยา</b>',
      given: rx.br.concat(rx.fm).map(function (x) {
        return { s: x[0].replace('-', '–'), v: BOND_E[x[0]], unit: 'kJ/mol', d: '' + x[1] + ' พันธะ' };
      }),
      finds: [{ s: 'พลังงานสลายพันธะ', unit: 'kJ', d: 'ของสารตั้งต้น', value: sumB, positive: true, kind: 'int' },
              { s: 'พลังงานสร้างพันธะ', unit: 'kJ', d: 'ของผลิตภัณฑ์', value: sumF, positive: true, kind: 'int' },
              { s: 'พลังงานของปฏิกิริยา', unit: 'kJ', d: 'สลาย − สร้าง', value: dH, kind: 'int' }],
      sol: {
        analyze: 'ปฏิกิริยาเคมีคือการ<b>สลายพันธะเดิม</b>แล้ว<b>สร้างพันธะใหม่</b><br>' +
          '• สลายพันธะต้อง<b>ใช้</b>พลังงาน (ค่าบวก)<br>' +
          '• สร้างพันธะจะ<b>คาย</b>พลังงาน (ค่าลบ)<br>' +
          'พลังงานสุทธิ = พลังงานที่ใช้สลาย − พลังงานที่คายจากการสร้าง<br>' +
          '<b>กับดักของข้อนี้:</b> ลืมคูณ<b>จำนวนพันธะ</b> · ' +
          rx.fm[0][1] + ' โมเลกุลของผลิตภัณฑ์ต้องสร้างพันธะ ' + rx.fm[0][1] + ' พันธะ',
        eqs: [{ eq: 'พลังงานปฏิกิริยา = Σ พลังงานพันธะที่สลาย - Σ พลังงานพันธะที่สร้าง',
                why: 'พลังงานสุทธิคือส่วนต่างระหว่างที่ใช้กับที่ได้คืน' },
              { eq: 'ค่าเป็นลบ ⇒ คายความร้อน · ค่าเป็นบวก ⇒ ดูดความร้อน',
                why: 'ลบแปลว่าสร้างพันธะได้พลังงานคืนมามากกว่าที่ลงทุนไป' }],
        solve: EQ('สลาย = ' + rx.br.map(function (x) { return x[1] + '(' + BOND_E[x[0]] + ')'; }).join(' + '),
                  'สร้าง = ' + rx.fm.map(function (x) { return x[1] + '(' + BOND_E[x[0]] + ')'; }).join(' + ')),
        subst: SEQ('สลาย = {a}   ,   สร้าง = {b}', { a: sumB, b: sumF }),
        calc: EQ('พลังงานสลายพันธะ = ' + sumB + ' `kJ`', 'พลังงานสร้างพันธะ = ' + sumF + ' `kJ`',
                 'พลังงานของปฏิกิริยา = ' + sumB + ' - ' + sumF + ' = ' + dH + ' `kJ`'),
        conclude: 'ดังนั้น <b>สลาย ' + U(sumB, 'kJ') + ' · สร้าง ' + U(sumF, 'kJ') + ' · สุทธิ ' +
          U(dH, 'kJ') + '</b><br>' +
          '<span class="hint">แปลผล: ค่าสุทธิเป็น<b>' + (dH < 0 ? 'ลบ' : 'บวก') + '</b> ' +

          (dH < 0 ? 'พันธะใหม่แข็งแรงกว่าพันธะเดิม ระบบจึงปล่อยพลังงานส่วนเกินออกมา'
                  : 'พันธะใหม่อ่อนกว่าพันธะเดิม จึงต้องได้รับพลังงานจากภายนอก') + '</span>'
      }
    };
  }
});

T({

          '<b>กับดักของข้อนี้:</b> ดูแค่ตัวเลขโดยไม่ดูชนิดธาตุ · ' +

          'เรียงจากสูงไปต่ำ: ' +

        eqs: [{ eq: 'พลังงานพันธะสูง ⇒ แข็งแรง ⇒ สลายยาก ⇒ พันธะสั้น',

                why: 'อิเล็กตรอนคู่ร่วมพันธะอยู่ไกลนิวเคลียสมากขึ้น' }],

          'และปฏิกิริยาจะคายความร้อนเมื่อพันธะที่<b>สร้างใหม่แข็งแรงกว่า</b>พันธะที่สลายไป</span>'
      }

T({

/* ============================================================================
   5) แท็บสร้างชุดโจทย์ และแท็บทำแบบฝึกหัด
   ========================================================================== */

function subsOf(topicId) {
  const seen = [];
  TPL.forEach(t => { if (t.topic === topicId && seen.indexOf(t.sub) < 0) seen.push(t.sub); });
  return seen;
}
function poolFor(topics, subs, level) {
  return TPL.filter(t => topics.indexOf(t.topic) >= 0 && t.level === level &&
    (!subs || !subs.length || subs.indexOf(t.sub) >= 0));
}
function mkCfg() {
  if (!DB.settings.make) {
    DB.settings.make = { topics: ALL_TOPIC_IDS.slice(), subs: [], mode: 'mix', n: 10,
                         counts: { 'ทฤษฎี': 2, 'ง่าย': 3, 'ปานกลาง': 3, 'ยาก': 2 } };
  }
  // ถ้ามีการเพิ่ม/ลบบทในโปรแกรมรุ่นใหม่ ให้ตัดเรื่องที่ไม่มีอยู่จริงทิ้ง กันหน้าจอพัง
  const c = DB.settings.make;
  c.topics = (c.topics || []).filter(t => ALL_TOPIC_IDS.indexOf(t) >= 0);
  if (!c.topics.length) c.topics = ALL_TOPIC_IDS.slice();
  return c;
}

/** สร้างชุดโจทย์ใหม่ — เก็บแค่ tplId กับ seed ทำให้สร้างโจทย์เดิมกลับมาได้เสมอ */
function createQuiz(o) {
  const R = rng(o.seed >>> 0);
  const items = [];
  const missing = [];
  LEVELS.forEach(lv => {
    const need = o.counts[lv] || 0;
    if (!need) return;
    const pool = poolFor(o.topics, o.subs, lv);
    if (!pool.length) { missing.push(lv); return; }
    // สับแม่แบบแล้วไล่หยิบวนไป เพื่อให้กระจายทั่วถึงก่อนจะเริ่มซ้ำ
    let bag = R.shuffle(pool);
    for (let k = 0; k < need; k++) {
      if (k % pool.length === 0 && k > 0) bag = R.shuffle(pool);
      const tpl = bag[k % pool.length];
      items.push({ tplId: tpl.id, seed: R.int(1, 2000000000), level: lv, topic: tpl.topic });
    }
  });
  if (missing.length) return { error: 'ไม่มีโจทย์ระดับ ' + missing.join(', ') + ' ในเรื่อง/หัวข้อที่เลือก' };
  // เรียงจากง่ายไปยาก แล้วเรียงตามเรื่อง เพื่อให้ใบงานไล่ระดับอย่างเป็นธรรมชาติ
  items.sort((a, b) => (LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level)) || (chOf(a.topic) - chOf(b.topic)));
  return {
    id: uid(), ts: Date.now(), title: o.title, seed: o.seed,
    topics: o.topics.slice(), subs: (o.subs || []).slice(), counts: Object.assign({}, o.counts),
    kind: o.kind === 'test' ? 'test' : 'practice',
    seedShift: o.kind === 'test' ? (Math.floor(Math.random() * 2000000000) + 1) : 0,
    /* กติกาคุมสอบติดไปกับตัวชุดโจทย์เสมอ ไม่ใช่ให้ไปอ่านค่าตั้งตอนเริ่มทำ
       เพราะรหัสใบงานที่แจกนักเรียนพาไปได้แค่สิ่งที่อยู่ในตัวชุดเท่านั้น */
    limitSec: o.kind === 'test' ? Math.round((DB.settings.examMin || 0) * 60) : 0,
    maxOut: o.kind === 'test' ? Math.round(DB.settings.examMaxOut || 0) : 0,
    maxOutSec: o.kind === 'test' ? Math.round(DB.settings.examMaxOutSec || 0) : 0,
    piMode: DB.settings.piMode || '3.14',
    items: items.map(it => ({ tplId: it.tplId, seed: it.seed }))
  };
}
