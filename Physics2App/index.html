<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ฟิสิกส์ 2 - Interactive Notebook</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css?v=1789222623">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js?v=1789222623"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js?v=1789222623"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css?v=1789222623">
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <i class="ph ph-atom"></i>
      <span>ฟิสิกส์ 2 (สสวท.)</span>
    </div>
    
    <div class="tools">
        <button id="btnTogglePanel" class="secondary" style="padding:8px; border-radius:8px; border:1px solid var(--border); cursor:pointer; background:#fff;" title="ซ่อน/แสดง ทฤษฎี">
          <i class="ph ph-arrows-out-line-horizontal" style="font-size:16px;"></i> ซ่อนเนื้อหา
        </button>
            <select id="topicSelector">
        <optgroup label="บทที่ 5: งานและพลังงาน">
          <option value="work">5.1 งาน (Work)</option>
          <option value="power">5.2 กำลัง (Power)</option>
          <option value="kinetic">5.3 พลังงานจลน์ (Kinetic Energy)</option>
          <option value="potential">5.4 พลังงานศักย์ (Potential Energy)</option>
          <option value="conservation">5.5 การอนุรักษ์พลังงานกล (Conservation)</option>
          <option value="ch5_challenge" style="font-weight:bold; color:blue;">🏆 แบบฝึกหัดท้าทาย บทที่ 5 (40 ข้อ)</option>
        </optgroup>
        <optgroup label="บทที่ 6: โมเมนตัมและการชน">
          <option value="momentum">6.1 โมเมนตัม (Momentum)</option>
          <option value="impulse">6.2 แรงและการดล (Impulse)</option>
          <option value="collision">6.3 การชน (Collisions)</option>
          <option value="ch6_challenge" style="font-weight:bold; color:blue;">🏆 แบบฝึกหัดท้าทาย บทที่ 6 (40 ข้อ)</option>
        </optgroup>
        <optgroup label="บทที่ 7: การเคลื่อนที่แบบต่างๆ">
          <option value="projectile">7.1 โพรเจกไทล์ (Projectile)</option>
          <option value="circular">7.2 แบบวงกลม (Circular Motion)</option>
          <option value="shm">7.3 ฮาร์มอนิกอย่างง่าย (SHM)</option>
          <option value="ch7_challenge" style="font-weight:bold; color:blue;">🏆 แบบฝึกหัดท้าทาย บทที่ 7 (40 ข้อ)</option>
        </optgroup>
      </select>

      <div class="level-switch">
        <span>ระดับ:</span>
        <label class="toggle-btn">
          <input type="radio" name="level" value="beginner" checked>
          <span class="btn-text">พื้นฐาน (มีไกด์)</span>
        </label>
        <label class="toggle-btn">
          <input type="radio" name="level" value="intermediate">
          <span class="btn-text">ปานกลาง (บอกตัวแปร)</span>
        </label>
        <label class="toggle-btn">
          <input type="radio" name="level" value="advanced">
          <span class="btn-text">ขั้นสูง (โจทย์ล้วน)</span>
        </label>
      </div>
    </div>

    <div class="actions">
      <button id="btnCheckAnswers" class="secondary" title="ตรวจคำตอบที่กรอกทั้งหมด"><i class="ph ph-check-circle"></i> ตรวจคำตอบ</button>
      <button id="btnSubmit" class="primary" title="ส่งงานและบันทึกคะแนน"><i class="ph ph-paper-plane-right"></i> ส่งงาน</button>
    </div>
  </header>

  <div class="drawing-toolbar" id="drawingToolbar">
    <div class="drag-handle" title="ลากเพื่อย้าย"><i class="ph ph-dots-six-vertical"></i></div>
    <div class="tool-group">
      <button class="tool-btn active" data-tool="pen" title="ปากกา"><i class="ph ph-pen"></i></button>
      <button class="tool-btn" data-tool="highlight" title="ปากกาเน้นข้อความ"><i class="ph ph-highlighter-circle"></i></button>
      <button class="tool-btn" data-tool="eraser" title="ยางลบ"><i class="ph ph-eraser"></i></button>
    </div>
    <div class="tool-group sizes" title="ขนาดหัวปากกา">
      <button class="size-btn" data-size="1.5" title="เส้นบาง (1.5px)">S</button>
      <button class="size-btn active" data-size="2.5" title="เส้นกลาง (2.5px)">M</button>
      <button class="size-btn" data-size="6" title="เส้นหนา (6px)">L</button>
    </div>
    <div class="tool-group colors">
      <div class="color-swatch active" data-color="#000000" style="background:#000000" title="ดำ"></div>
      <div class="color-swatch" data-color="#2563eb" style="background:#2563eb" title="น้ำเงิน"></div>
      <div class="color-swatch" data-color="#dc2626" style="background:#dc2626" title="แดง"></div>
      <div class="color-swatch" data-color="#16a34a" style="background:#16a34a" title="เขียว"></div>
      <div class="color-swatch" data-color="#eab308" style="background:#eab308" title="เหลือง"></div>
    </div>
    <div class="tool-group history" style="border-left: 1px solid var(--border); padding-left: 8px; display:flex; gap:4px;">
      <button class="tool-btn" id="btnUndo" title="เลิกทำ (Ctrl+Z)"><i class="ph ph-arrow-u-up-left"></i></button>
      <button class="tool-btn" id="btnRedo" title="ทำซ้ำ (Ctrl+Y)"><i class="ph ph-arrow-u-up-right"></i></button>
      <button class="tool-btn danger" id="btnClearDraw" title="ล้างหน้า"><i class="ph ph-trash"></i></button>
    </div>
    <div class="tool-group zoom-group" style="border-left: 1px solid var(--border); padding-left: 8px; display:flex; align-items:center; gap:2px;" title="ย่อ/ขยายเฉพาะหน้ากระดาษทำโจทย์">
      <button class="tool-btn" id="btnZoomOut" title="ย่อหน้ากระดาษ (Zoom Out)"><i class="ph ph-magnifying-glass-minus"></i></button>
      <span id="zoomLevelText" title="คลิกเพื่อรีเซ็ตเป็น 100%" class="zoom-text">100%</span>
      <button class="tool-btn" id="btnZoomIn" title="ขยายหน้ากระดาษ (Zoom In)"><i class="ph ph-magnifying-glass-plus"></i></button>
    </div>
  </div>

  <main class="workspace">
    <section class="content-panel">
      <div class="panel-inner" id="theoryContainer"></div>
    </section>

    <section class="notebook-panel">
      <div class="notebook-wrapper">
        <div class="notebook-paper" id="notebookContainer"></div>
        <canvas id="drawingCanvas"></canvas>
      </div>
    </section>
  </main>

  <!-- Submit & Evaluation Modal -->
  <div id="submitModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(3px);">
    <div class="modal-box" style="background:white; padding:24px 28px; border-radius:16px; max-width:560px; width:92%; max-height:90vh; overflow-y:auto; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #e5e7eb; padding-bottom:12px;">
        <h3 style="margin:0; color:var(--primary); font-size:1.3rem; display:flex; align-items:center; gap:8px;">
          <i class="ph ph-certificate" style="font-size:24px;"></i> ระบบส่งงานและการประเมินผล
        </h3>
        <button id="btnCloseModal" style="background:none; border:none; font-size:20px; cursor:pointer; color:#6b7280;">✕</button>
      </div>

      <!-- Student Profile Card -->
      <div class="submission-card" style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:14px 16px; margin-bottom:16px;">
        <div style="font-weight:600; color:#334155; margin-bottom:8px; font-size:0.95rem;">👤 ข้อมูลผู้ส่งงาน:</div>
        <div style="display:grid; grid-template-columns: 1fr 100px 100px; gap:8px;">
          <div>
            <label style="font-size:0.8rem; color:#64748b;">ชื่อ - นามสกุล</label>
            <input type="text" id="studentNameInput" placeholder="ด.ช./นาย/น.ส. ..." style="width:100%; padding:6px 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.9rem;">
          </div>
          <div>
            <label style="font-size:0.8rem; color:#64748b;">ชั้น/ห้อง</label>
            <input type="text" id="studentRoomInput" placeholder="ม.5/1" style="width:100%; padding:6px 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.9rem;">
          </div>
          <div>
            <label style="font-size:0.8rem; color:#64748b;">เลขที่</label>
            <input type="text" id="studentNoInput" placeholder="1" style="width:100%; padding:6px 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.9rem;">
          </div>
        </div>
      </div>

      <!-- Score & Grade Card -->
      <div id="scoreSummaryCard" style="background:linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); border:1px solid #bfdbfe; border-radius:12px; padding:16px; margin-bottom:16px; text-align:center;">
        <div style="font-size:0.9rem; color:#1e40af; font-weight:500;">สรุปผลการทำแบบฝึกหัด: <span id="summaryTopicTitle" style="font-weight:bold;">-</span></div>
        <div style="font-size:2.2rem; font-weight:800; color:#1e3a8a; margin:8px 0;" id="summaryScoreBig">0 / 10</div>
        <div id="summaryBadge" style="display:inline-block; padding:4px 12px; border-radius:999px; font-weight:600; font-size:0.85rem; background:#3b82f6; color:white;">ตรวจผลคะแนน</div>
        <div style="margin-top:8px; font-size:0.85rem; color:#3b82f6;" id="summaryPercentageText">คิดเป็น 0%</div>
      </div>

      <!-- Breakdown Table (Collapsible) -->
      <details style="margin-bottom:16px; border:1px solid #e5e7eb; border-radius:8px; padding:8px 12px; background:#fff;">
        <summary style="cursor:pointer; font-weight:600; color:#4b5563; font-size:0.9rem;">🔍 ดูรายละเอียดการตรวจคำตอบรายข้อ</summary>
        <div id="questionBreakdownList" style="margin-top:10px; max-height:180px; overflow-y:auto; font-size:0.85rem;"></div>
      </details>

      <!-- Action Buttons -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:16px;">
        <button id="btnPrintWorksheet" class="primary" style="padding:10px 14px; border:none; border-radius:8px; background:#2563eb; color:white; cursor:pointer; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;">
          <i class="ph ph-printer" style="font-size:18px;"></i> พิมพ์ PDF พร้อมลายมือ
        </button>
        <button id="btnSubmitToSheets" class="secondary" style="padding:10px 14px; border:1px solid #16a34a; background:#f0fdf4; color:#15803d; border-radius:8px; cursor:pointer; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;">
          <i class="ph ph-microsoft-excel-logo" style="font-size:18px;"></i> ส่งคะแนนเข้า Sheets
        </button>
      </div>
      <div style="margin-top:8px;">
        <button id="btnCopyReport" style="width:100%; padding:8px 14px; border:1px solid #cbd5e1; background:#f8fafc; color:#475569; border-radius:8px; cursor:pointer; font-size:0.85rem; display:flex; align-items:center; justify-content:center; gap:6px;">
          <i class="ph ph-copy" style="font-size:16px;"></i> คัดลอกข้อความสรุปผล (สำหรับส่งใน LINE / Classroom)
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastNotification" class="toast-notification"></div>

  <script src="data.js?v=1789222623"></script>
    <script src="data_ch6.js?v=1789222623"></script>
    <script src="data_ch7.js?v=1789222623"></script>
    <script src="data_ch5_challenge.js?v=1789222623"></script>
    <script src="data_ch6_challenge.js?v=1789222623"></script>
    <script src="data_ch7_challenge.js?v=1789222623"></script>
  <script src="draw.js?v=1789222623"></script>
  <script src="simulations/sim_core.js?v=1789222623"></script>
  <script src="simulations/sim_ch5.js?v=1789222623"></script>
  <script src="simulations/sim_ch6.js?v=1789222623"></script>
  <script src="simulations/sim_ch7.js?v=1789222623"></script>
  <script src="app.js?v=1789222623"></script>
</body>
</html>
