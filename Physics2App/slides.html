<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สไลด์ฟิสิกส์ 2 · บทที่ 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@200;400;700&family=IBM+Plex+Sans+Thai+Looped:wght@300;400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ── โทเคน ─────────────────────────────────────────── */
:root{
  --paper:#f5f3ee; --paper2:#ebe8e0; --ink:#17181c; --ink2:#55565c; --ink3:#8d8c88;
  --rule:#d9d5cb; --acc:#e4572e; --acc-soft:color-mix(in srgb,var(--acc) 12%,var(--paper));
  --pos:#1f8a4c; --neg:#c93a2b; --zero:#6b6b6b;
  --head:"IBM Plex Sans Thai",sans-serif; --body:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai",sans-serif;
}
:root[data-theme="dark"]{
  --paper:#15161a; --paper2:#1f2026; --ink:#f0eee8; --ink2:#b3b1ab; --ink3:#77766f;
  --rule:#34353b; --pos:#4cc47f; --neg:#ff7a6a; --zero:#9a9a9a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{font-family:var(--body);-webkit-font-smoothing:antialiased}

/* ── เวที 1600×900 ย่อขยายตามจอ ───────────────────── */
#viewport{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--paper)}
.slide{--acc-soft:color-mix(in srgb,var(--acc) 12%,var(--paper));position:absolute;inset:0;padding:64px 104px 72px;font-size:28px;visibility:hidden;opacity:0;display:flex;flex-direction:column}
.slide.active{visibility:visible;opacity:1}
.slide .kicker{font:400 22px/1 var(--head);color:var(--acc);display:flex;gap:14px;align-items:center;margin-bottom:22px}
.slide .kicker b{font-weight:700}
.slide .kicker .dot{width:6px;height:6px;border-radius:99px;background:var(--rule)}
.slide h2{font:700 60px/1.25 var(--head);margin:0 0 36px;text-wrap:balance}
.slide p{font-size:30px;line-height:1.75;margin:0;text-wrap:pretty}
.muted{color:var(--ink2)}
.acc{color:var(--acc)}

/* ── ชิ้นที่ค่อย ๆ เผย ──────────────────────────── */
.f{opacity:0;transform:translateY(16px);filter:blur(6px);transition:opacity .45s ease,transform .5s cubic-bezier(.2,.8,.2,1),filter .45s ease}
.f.on{opacity:1;transform:none;filter:none}
.f.on.now{--mark:var(--acc)}

/* ── ปก ─────────────────────────────────────────── */
.s-cover{justify-content:center;align-items:center;text-align:center;padding-bottom:64px}
.s-cover .sub{font:400 28px/1 var(--head);color:var(--ink2);margin-bottom:36px}
.s-cover h1{font:700 150px/1.1 var(--head);margin:0}
.s-cover h1 span{display:block;font-weight:200}
.s-cover .keys{position:absolute;right:104px;bottom:96px;text-align:right;font-size:20px;line-height:2;color:var(--ink3)}
kbd{font:400 17px var(--head);border:1px solid var(--rule);border-bottom-width:2px;border-radius:6px;padding:1px 8px;color:var(--ink2);background:var(--paper)}

/* ── แผนที่บท ───────────────────────────────────── */
/* ชื่อบทบนหน้าเนื้อหาในบทนี้ — ขีดเส้นใต้หนาสีประจำบท */
.slide h2.chtitle span{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:8px;text-underline-offset:16px;text-decoration-skip-ink:none}
.slide h2.chtitle{margin-bottom:48px}
.road{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.road li{display:grid;grid-template-columns:160px 1fr auto;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--rule)}
.road .n{font:200 64px/1 var(--head);color:var(--c)}
.road .t{font:700 42px/1.3 var(--head)}
.road .t small{font:400 24px var(--head);color:var(--ink3);margin-left:14px}
.road .q{font-size:24px;color:var(--ink2);max-width:560px;text-align:right;line-height:1.6}

/* ── เปิดหัวข้อ ─────────────────────────────────── */
.s-open{justify-content:center}
.s-open .big{font:200 300px/.9 var(--head);color:var(--acc);margin:0 0 0 -14px;font-variant-numeric:tabular-nums}
.s-open h2{font-size:104px;margin:10px 0 44px}
.s-open h2 small{font:200 48px var(--head);color:var(--ink3);margin-left:20px}
.s-open .hook{font:300 38px/1.7 var(--body);max-width:1180px;border-left:4px solid var(--acc);padding-left:32px}
.s-open .hook b{font-weight:700}

/* ── นิยาม ──────────────────────────────────────── */
.defs{border-top:1px solid var(--rule)}
.def{display:grid;grid-template-columns:420px 1fr;gap:48px;padding:26px 0;border-bottom:1px solid var(--rule)}
.def dt{font:700 40px/1.35 var(--head)}
.def dt .sym{display:block;font:400 26px/1.6 var(--body);color:var(--acc);margin-top:6px}
.def dd{margin:0;font-size:28px;line-height:1.75}
.def dd b{color:var(--acc);font-weight:700}

/* ── สมการตั้งต้น ────────────────────────────────── */
.core{display:grid;grid-template-columns:600px minmax(0,1fr);gap:64px;flex:1;min-height:0}
.core .hero{align-self:start;background:var(--acc-soft);border-radius:6px;padding:28px 40px}
.core .hero .lbl{font:400 22px var(--head);color:var(--acc)}
.core .hero .katex{font-size:1.9em}
.core .hero .katex-display{margin:12px 0}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:4px 0 22px 64px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:40px;height:40px;border-radius:99px;border:1.5px solid var(--mark,var(--rule));display:grid;place-items:center;font:700 20px var(--head);color:var(--mark,var(--ink3));transition:border-color .3s,color .3s}
.steps li p{font-size:28px}
.steps li .katex-display{margin:8px 0 0;text-align:left}
.steps li .katex-display>.katex{text-align:left;font-size:1.35em}

/* ── สมการใช้บ่อย ───────────────────────────────── */
.eqgrid{border-top:1px solid var(--rule)}
.eqrow{display:grid;grid-template-columns:380px 1fr;align-items:center;gap:48px;padding:12px 0;border-bottom:1px solid var(--rule);min-height:138px}
.eqrow>div:last-child{min-width:0}
.eqrow .nm{font:700 32px/1.4 var(--head)}
.eqrow .nm small{display:block;font:400 22px/1.5 var(--body);color:var(--ink3);margin-top:4px}
.eqrow .katex-display{margin:0;text-align:left}
.eqrow .katex-display>.katex{text-align:left;font-size:1.6em}

/* ── ชีวิตประจำวัน ──────────────────────────────── */
.life{border-top:1px solid var(--rule)}
.life .row{display:grid;grid-template-columns:120px 400px 1fr;gap:36px;align-items:start;padding:28px 0;border-bottom:1px solid var(--rule)}
.life .ic{width:96px;height:96px;border-radius:99px;border:1.5px solid var(--acc);display:grid;place-items:center;font-size:52px;color:var(--acc)}
.life h3{font:700 36px/1.4 var(--head);margin:10px 0 0}
.life p{font-size:27px;line-height:1.75}
.life p b{color:var(--acc)}

/* ── ชวนคิด ─────────────────────────────────────── */
.s-think{justify-content:center}
.s-think .q{font:700 64px/1.45 var(--head);max-width:1300px;text-wrap:balance;margin:0 0 20px}
.s-think .timer{font:400 24px var(--head);color:var(--ink3);display:flex;align-items:center;gap:10px;margin-bottom:48px}
.s-think .a{border-left:4px solid var(--acc);padding:6px 0 6px 32px;max-width:1250px}
.s-think .a p{font-size:34px}
.s-think .a .lbl{font:700 24px var(--head);color:var(--acc);margin-bottom:6px}

/* ── แบบจำลอง ───────────────────────────────────── */
.sim{display:grid;grid-template-columns:440px 1fr;gap:56px;flex:1;min-height:0}
.sim .side p{font-size:26px;line-height:1.75}
.sim .side .try{margin-top:28px;padding-top:24px;border-top:1px solid var(--rule)}
.sim .side .try b{display:block;font:700 22px var(--head);color:var(--acc);margin-bottom:8px}
.sim .side .try li{font-size:23px;line-height:1.7;color:var(--ink2)}
.sim .side .try ul{margin:0;padding-left:24px}
.sim .panel{display:flex;flex-direction:column;min-height:0}
.sim svg{width:100%;flex:1;min-height:0}
.sim .ctl{display:flex;gap:18px 24px;align-items:center;font:400 24px var(--head);margin-top:12px;flex-wrap:wrap}
.sim .ctl label{display:flex;align-items:center;gap:14px}
.sim input[type=range]{width:300px;accent-color:var(--acc);height:28px}
.btn{font:700 22px var(--head);color:var(--ink);background:none;border:1.5px solid var(--ink);border-radius:99px;padding:10px 26px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.on{background:var(--ink);color:var(--paper)}
.readout{font:400 30px/1.5 var(--head);font-variant-numeric:tabular-nums}
svg text{font-family:var(--head);fill:var(--ink)}
svg .gl{stroke:var(--ink);stroke-width:2;fill:none}
svg .gl2{stroke:var(--rule);stroke-width:2;fill:none}
svg .dsh{stroke:var(--ink3);stroke-width:2;stroke-dasharray:6 7;fill:none}

/* ── โจทย์ ──────────────────────────────────────── */
.s-prob{padding-top:52px}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.ptop .kicker{margin:0}
.chips{display:flex;gap:6px;align-items:center;font:400 18px var(--head);color:var(--ink3)}
.chips button{font:400 18px var(--head);width:38px;height:38px;border-radius:99px;border:1px solid var(--rule);background:none;color:var(--ink2);cursor:pointer}
.chips button.cur{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.pbody{display:grid;grid-template-columns:540px 1fr;gap:64px;flex:1;min-height:0}
.pq{display:flex;flex-direction:column;gap:26px}
.pq .txt{font:400 31px/1.8 var(--body)}
.pq .num{font:200 88px/1 var(--head);color:var(--acc)}
.given{border-top:1px solid var(--rule);padding-top:20px}
.given .lbl,.hintbox .lbl{font:700 20px var(--head);color:var(--ink3);margin-bottom:10px}
.given ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px 12px}
.given li{font-size:25px;padding:4px 16px;border:1px solid var(--rule);border-radius:99px;background:var(--paper)}
.hintbtn{align-self:flex-start;font:400 20px var(--head);background:none;border:1px dashed var(--ink3);color:var(--ink2);border-radius:99px;padding:8px 20px;cursor:pointer}
.hintbox{display:none;font-size:24px;line-height:1.7;color:var(--ink2);border-left:3px dashed var(--acc);padding-left:20px}
.hintbox.show{display:block}
.psol{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--rule);padding-left:56px;--sfs:34px;overflow-y:auto;scrollbar-width:none}
.psol::-webkit-scrollbar{display:none}
.psol.scrolled{-webkit-mask-image:linear-gradient(transparent,#000 56px);mask-image:linear-gradient(transparent,#000 56px)}
.meq{margin-bottom:18px}
.meq .lbl{font:400 20px var(--head);color:var(--acc)}
.meq .katex-display{margin:6px 0 0;text-align:left}
.meq .katex-display>.katex{text-align:left;font-size:1.25em}
.sol{display:grid;grid-template-columns:66px auto auto 1fr;column-gap:0;align-content:start;font-size:var(--sfs);flex:none}
.sol .r{display:contents}
.sol .r>div{padding:9px 0;min-height:1.9em;display:flex;align-items:center;line-height:1.6;transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1),filter .45s}
.sol .r:not(.on)>div{opacity:0;transform:translateY(14px);filter:blur(6px)}
.sol .r.cont>div{padding-top:2px}
.sol .r>div:has(.mfrac){padding-top:12px;padding-bottom:12px}
.sol .nb{justify-content:flex-start}
.sol .nb span{width:40px;height:40px;border-radius:99px;border:1.5px solid var(--rule);display:grid;place-items:center;font:700 19px var(--head);color:var(--ink3);transition:.3s}
.sol .r.now .nb span,.sol .r.grpnow .nb span{border-color:var(--acc);color:var(--acc)}
.sol .r.now>div:not(.nb){background:linear-gradient(var(--acc-soft),var(--acc-soft)) no-repeat;background-size:100% 100%}
.sol .r.now>div:nth-child(2){border-radius:6px 0 0 6px;padding-left:12px;margin-left:-12px}
.sol .r.now>.txt{border-radius:6px}
.sol .r.now>div:last-child{border-radius:0 6px 6px 0;padding-right:12px}
.sol .op{color:var(--ink3);justify-content:center;padding:0 16px !important}
.sol .txt{grid-column:2 / -1}
.ans{display:inline-block;font-weight:700;color:var(--acc);border:2px solid var(--acc);border-radius:8px;padding:0 14px;margin-right:8px;font-family:var(--head)}
.r.final.on .ans{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.pdone{margin-top:auto;padding-top:14px;font:400 20px var(--head);color:var(--ink3);opacity:0;transition:.4s}
.pdone.show{opacity:1}

/* ── สรุป ───────────────────────────────────────── */
.sum{display:grid;grid-template-columns:1fr 1fr;column-gap:72px;border-top:1px solid var(--rule)}
.sum .it{display:grid;grid-template-columns:90px 1fr;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule);min-height:118px}
.sum .it .n{font:200 44px var(--head);color:var(--c)}
.sum .it .nm{font:700 24px var(--head);color:var(--ink2)}
.sum .katex-display{margin:4px 0 0;text-align:left}
.sum .katex-display>.katex{text-align:left;font-size:1.2em}

/* ── ม่านเปลี่ยนหัวข้อ ────────────────────────────── */
.chnav{position:absolute;right:120px;top:80px;display:flex;gap:36px;font:400 20px/1.8 var(--head)}
.chnav a{color:var(--ink3);text-decoration:none;border-bottom:1px solid var(--rule)}
.chnav a:hover{color:var(--ink)}
.chnav b{color:var(--ink);font-weight:700}
.sol .li::before{content:'•';color:var(--ink3);margin-right:12px}
#wipe{position:absolute;inset:0;background:var(--acc);z-index:20;clip-path:inset(0 100% 0 0);pointer-events:none;display:flex;align-items:flex-end;padding:0 104px 96px;color:#fff}
#wipe .n{font:200 220px/.9 var(--head)}
#wipe .t{font:700 72px/1.2 var(--head);margin-left:36px;padding-bottom:14px}

/* ── แถบควบคุม (นอกเวที ไม่ย่อ) ───────────────────── */
#hud{position:fixed;left:0;right:0;bottom:0;padding:10px 18px 12px;display:flex;align-items:center;gap:16px;background:linear-gradient(transparent,color-mix(in srgb,var(--paper) 92%,transparent) 40%);transition:opacity .4s;z-index:50}
#hud.hide{opacity:0}
@media (pointer:coarse){#hud button{width:48px;height:48px}#hud #bCh{height:44px}}
#hud button{background:none;border:0;color:var(--ink2);font-size:24px;width:40px;height:40px;border-radius:99px;cursor:pointer;display:grid;place-items:center}
#hud button:hover{background:var(--paper2)}
#bar{flex:1;display:flex;gap:4px;height:6px}
#bar .seg{flex:var(--n);background:var(--paper2);border-radius:99px;overflow:hidden;position:relative;cursor:pointer}
#bar .seg i{position:absolute;inset:0;right:auto;width:var(--p,0%);background:var(--c);transition:width .4s}
#count{font:400 16px var(--head);color:var(--ink3);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}

/* ── ภาพรวมสไลด์ ─────────────────────────────────── */
#ov{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 96%,transparent);z-index:60;overflow:auto;padding:40px 56px;display:none}
#ov.show{display:block}
#ov h3{font:700 26px var(--head);margin:28px 0 12px;color:var(--c)}
#ov .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
#ov .card{border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:6px;padding:12px 14px;cursor:pointer;background:var(--paper)}
#ov .card.cur{outline:2px solid var(--c)}
#ov .card small{display:block;font:400 14px var(--head);color:var(--ink3)}
#ov .card span{font:400 18px/1.5 var(--body)}
#blank{position:fixed;inset:0;background:#000;z-index:70;display:none}
#toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);max-width:min(560px,90vw);background:var(--ink);color:var(--paper);font:400 16px/1.6 var(--head);padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
#toast.show{opacity:1}
/* ── หน้าล็อก (ไม่ใช่ครู) ─────────────────────────── */
#lock{position:fixed;inset:0;display:none;align-items:center;justify-content:flex-start;padding:48px max(24px,8vw);background:var(--paper);z-index:90}
#lock.show{display:flex}
#lock .in{max-width:640px}
#lock .k{font:400 18px var(--head);color:#e4572e;margin-bottom:18px;display:flex;gap:10px;align-items:center}
#lock h1{font:700 clamp(36px,6vw,64px)/1.2 var(--head);margin:0 0 20px}
#lock p{font:300 clamp(17px,2vw,21px)/1.8 var(--body);color:var(--ink2);margin:0 0 32px;text-wrap:pretty}
#lock .row{display:flex;gap:12px;flex-wrap:wrap}
#lock a{font:700 17px var(--head);text-decoration:none;border-radius:99px;padding:12px 24px;border:1.5px solid var(--ink);color:var(--ink)}
#lock a.pri{background:#e4572e;border-color:#e4572e;color:#fff}
/* ── หน้าเลือกบท (เปิดโดยไม่ระบุ ?ch=) ─────────────────── */
#pick{position:fixed;inset:0;overflow:auto;background:var(--paper);z-index:90;padding:clamp(28px,6vh,64px) max(20px,7vw)}
#pick .k{font:400 18px var(--head);color:var(--ink3);margin-bottom:10px}
#pick h1{font:700 clamp(34px,5vw,60px)/1.2 var(--head);margin:0 0 clamp(20px,4vh,40px)}
#pick h1[lang=en]{letter-spacing:-.02em}
#pick a.ch{display:grid;grid-template-columns:clamp(90px,14vw,190px) 1fr auto;align-items:center;gap:clamp(12px,3vw,40px);padding:clamp(16px,3vh,28px) 0;border-top:1px solid var(--rule);color:var(--ink);text-decoration:none}
#pick a.ch:last-of-type{border-bottom:1px solid var(--rule)}
#pick a.ch:hover .t,#pick a.ch:focus-visible .t{color:var(--c)}
#pick .n{font:200 clamp(56px,10vw,130px)/.9 var(--head);color:var(--c)}
#pick .t{font:700 clamp(22px,3vw,38px)/1.3 var(--head);transition:color .2s}
#pick .s{display:block;font:400 clamp(14px,1.5vw,19px)/1.7 var(--body);color:var(--ink2);margin-top:4px}
#pick .go{font:400 clamp(14px,1.4vw,17px) var(--head);color:var(--ink3);white-space:nowrap}
@media (max-width:640px){#pick a.ch{grid-template-columns:72px 1fr}#pick .go{display:none}}
/* ── ปุ่มเลือกบทในแถบควบคุม ─────────────────────────── */
#hud #bCh{width:auto;padding:0 14px;font:700 15px var(--head);gap:6px;display:flex;border:1px solid var(--rule)}
#chmenu{position:fixed;left:18px;bottom:60px;z-index:55;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:6px;display:none;min-width:280px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
#chmenu.show{display:block}
#chmenu a{display:flex;gap:14px;align-items:baseline;padding:10px 12px;border-radius:6px;color:var(--ink);text-decoration:none;font:400 17px var(--head)}
#chmenu a b{font:200 26px var(--head);color:var(--c);min-width:26px}
#chmenu a:hover{background:var(--paper2)}
#chmenu a.cur{background:var(--paper2);font-weight:700}
#ov .ovch{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font:400 17px var(--head);color:var(--ink3)}
#ov .ovch a{padding:8px 16px;border:1px solid var(--rule);border-radius:99px;color:var(--ink2);text-decoration:none}
#ov .ovch a.cur{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
#blank.show{display:block}
</style>

function portalSession(){ try { return JSON.parse(localStorage.getItem('pcportal.v1') || 'null'); } catch (e) { return null; } }

  document.getElementById('viewport').remove();

    document.getElementById('lockP').textContent = 'การลงชื่อเข้าใช้ของครูหมดอายุแล้ว กรุณาลงชื่อที่หน้าหลักอีกครั้ง แล้วกลับมาเปิดสไลด์';

// data.js ประกาศ const physicsData (ไม่ผูกกับ window) จึงต้องเรียกชื่อตรง ๆ
const TOPICS = ((typeof physicsData !== 'undefined' ? physicsData : window.physicsData) || {}).topics || {};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
// % ในโหมดคณิตของ KaTeX คือคอมเมนต์ ทำให้ "80%" หายเงียบ ๆ
const fixTex = s => String(s).replace(/\$[^$]*\$/g, m => m.replace(/(^|[^\\])%/g, '$1\\%'));
const fmtNum = v => /^-?\d{5,}(\.\d+)?$/.test(v) ? Number(v).toLocaleString('en-US') : v;

function defsOf(key){
  if (!window.definitionsHTML) return [];
  const box = document.createElement('div');
  box.innerHTML = window.definitionsHTML(key);
  return [...box.querySelectorAll('.def')].map(d => ({
    t: d.querySelector('.def-th')?.innerHTML || '',
    s: d.querySelector('.def-sym')?.innerHTML || '',
    th: d.querySelector('.def-text')?.innerHTML || ''
  }));
}

function mainEq(prob, key){
  if (!window.mainEquationHTML) return null;
  const h = window.mainEquationHTML(prob, key);
  const tex = (h.match(/\$\$([\s\S]*?)\$\$/) || [])[1];
  const nm = ((h.match(/me-tag">([^<]*)</) || [])[1] || '').replace(/^สมการหลัก\s*·\s*/, '');
  return tex ? { tex, nm } : null;
}

function splitGiven(html){
  // แยก "m = 5 kg, s = 4 m" ที่จุลภาคนอกโหมดคณิต
  const out = []; let cur = '', inM = false;
  for (let i = 0; i < html.length; i++){
    const c = html[i];
    if (c === '$') inM = !inM;
    if (c === ',' && !inM && html[i+1] === ' '){ out.push(cur.trim()); cur = ''; i++; continue; }
    cur += c;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function ansOf(p){
  const m = (p.intermediateHtml || '').match(/data-answer="([^"]*)"|placeholder="([^"]*)"/);
  return m ? parseFloat(String(m[1] || m[2]).replace(/,/g, '')) : NaN;
}
function givenOf(p){
  const h = p.intermediateHtml || '';
  const m = h.match(/โจทย์กำหนด:<\/b>([\s\S]*?)<\/div>/);
  if (m) return splitGiven(m[1].trim());
  const box = document.createElement('div'); box.innerHTML = h;
  const first = [...box.querySelectorAll('p')].find(x => !x.querySelector('input') && x.textContent.trim());
  return first ? splitGiven(first.innerHTML.trim()) : [];
}

// แยกแถวของ aligned ที่ระดับบนสุด (ไม่ตัดใน {…})
function splitRows(tex){
  const out = []; let d = 0, cur = '';
  for (let i = 0; i < tex.length; i++){
    const c = tex[i];
    if (c === '{') d++; else if (c === '}') d--;
    if (d === 0 && c === '\\' && tex[i+1] === '\\'){ out.push(cur); cur = ''; i++; continue; }
    cur += c;
  }
  if (cur.trim()) out.push(cur);
  return out.map(x => x.trim()).filter(Boolean);
}
function mathRows(tex){
  const al = tex.match(/\\begin\{aligned\}([\s\S]*)\\end\{aligned\}/);
  if (!al) return [{ type:'text', html: '$\\displaystyle ' + tex.trim() + '$' }];
  return splitRows(al[1]).map(row => {
    const at = row.indexOf('&');
    const lhs = at < 0 ? '' : row.slice(0, at).trim();
    let rhs = at < 0 ? row : row.slice(at + 1).trim();
    const rel = rhs.match(/^(=|\\approx|\\ge|\\le|<|>|\\Rightarrow|\\rightarrow)\s*/);
    const op = rel ? rel[1] : '';
    if (rel) rhs = rhs.slice(rel[0].length);
    return { type:'calc', label: lhs ? '$\\displaystyle ' + lhs + '$' : '', op: op ? '$' + op + '$' : '', expr: '$\\displaystyle ' + rhs + '$' };
  });
}
function parseGuideSteps(box, ansVal){
  const rows = []; let n = 0;
  const steps = [...box.children];
  steps.forEach(st => {
    n++; let first = true;
    const add = r => { r.grp = String(n); if (first){ r.n = String(n); first = false; } rows.push(r); };
    const parts = st.classList.contains('step') ? [...st.children] : [st];
    parts.forEach(el => {
      if (el.tagName === 'UL' || el.tagName === 'OL'){ [...el.children].forEach(li => add({ type:'text', html: '<span class="li">' + li.innerHTML.trim() + '</span>' })); return; }
      const h = el.innerHTML.trim();
      // ใช้ textContent — innerHTML จะแปลง & ของ aligned เป็น &amp;
      const dm = !el.children.length && el.textContent.trim().match(/^\$\$([\s\S]*)\$\$$/);
      if (dm){ mathRows(dm[1]).forEach(add); return; }
      add({ type:'text', html: h.replace(/^<strong>ขั้นที่\s*\d+\s*:?<\/strong>\s*/, '') });
    });
  });
  // แถวคำตอบ = แถวล่างสุดที่ตัวเลขท้ายตรงกับคำตอบในแอป (บางข้อบรรทัดสุดท้ายไม่ใช่สิ่งที่โจทย์ถาม)
  const calcs = rows.filter(r => r.type === 'calc').reverse();
  const lastNum = tex => { const m = tex.replace(/\{,\}/g, '').match(/-?\d+(?:\.\d+)?/g); return m ? parseFloat(m[m.length - 1]) : NaN; };
  const hit = isFinite(ansVal) ? calcs.find(r => { const v = lastNum(r.expr); return isFinite(v) && Math.abs(Math.abs(v) - Math.abs(ansVal)) <= Math.max(0.011 * Math.abs(ansVal), 1e-9); }) : null;
  const ansRow = hit || calcs[0];
  if (ansRow){ ansRow.ans = true; ansRow.expr = '<span class="ans">' + ansRow.expr + '</span>'; }
  return rows;
}

function parseGuide(html, ansVal){
  const box = document.createElement('div'); box.innerHTML = fixTex(html);
  if (!box.querySelector('.calc-steps, input')) return parseGuideSteps(box, ansVal);
  const rows = [];
  for (const el of box.children){
    if (el.classList.contains('calc-steps')){
      const c = [...el.children];
      for (let i = 0; i + 2 < c.length; i += 3)
        rows.push({ type:'calc', label:c[i].innerHTML.trim(), op:c[i+1].innerHTML.trim(), expr:c[i+2].innerHTML.trim() });
    } else rows.push({ type:'text', html: el.innerHTML.trim() });
  }
  let n = 0;
  rows.forEach(r => {
    const k = r.type === 'calc' ? 'label' : 'html';
    const m = r[k].match(/^(\d+)\.\s*/);
    if (m){ r.n = m[1]; r[k] = r[k].slice(m[0].length); n = +m[1]; }
    else if (r.type === 'text' || r.label) r.n = String(++n);
    r.grp = r.n || String(n);
    const repl = s => s.replace(/<input[^>]*placeholder="([^"]*)"[^>]*>/, (_, v) => { r.ans = true; return '<span class="ans">' + fmtNum(v) + '</span>'; });
    if (r.type === 'calc') r.expr = repl(r.expr); else r.html = repl(r.html);
  });
  return rows;
}

function probSlide(S, order, pid){
  const list = (TOPICS[S.key] || {}).problems || [];
  const obj = { title:'โจทย์ข้อ ' + order, cls:'s-prob', pid, S, order, list };
  obj.render = function(id){
    const p = list.find(x => x.id === id) || list[0];
    if (!p) return `${kick(S,'โจทย์')}<p>ไม่พบโจทย์ใน data.js</p>`;
    const idx = list.indexOf(p) + 1;
    const g = givenOf(p), me = mainEq(p, S.key), rows = parseGuide(p.guide || '', ansOf(p));
    let prev = null;
    const sol = rows.map((r, i) => {
      const cont = !r.n && prev && prev.grp === r.grp;
      prev = r;
      const nb = `<div class="nb">${r.n ? `<span>${r.n}</span>` : ''}</div>`;
      const cls = `r step${cont && r.type === 'calc' && !r.label ? ' cont' : ''}${r.ans ? ' final' : ''}`;
      return r.type === 'calc'
        ? `<div class="${cls}" data-g="${r.grp}">${nb}<div>${r.label}</div><div class="op">${r.op}</div><div>${r.expr}</div></div>`
        : `<div class="${cls}" data-g="${r.grp}">${nb}<div class="txt">${r.html}</div></div>`;
    }).join('');
    return `
      <div class="ptop">${kick(S,'โจทย์ข้อ ' + order)}
        <div class="chips nointeract">เปลี่ยนข้อ ${list.map((x,i) => `<button data-pid="${x.id}" class="${x.id === p.id ? 'cur' : ''}" title="${esc(x.text.replace(/\$/g,'').slice(0,80))}">${i+1}</button>`).join('')}</div></div>
      <div class="pbody">
        <div class="pq">
          <div class="num">${String(idx).padStart(2,'0')}</div>
          <div class="txt">${fixTex(p.text)}</div>
          ${g.length ? `<div class="given f"><div class="lbl">โจทย์กำหนด</div><ul>${g.map(x => `<li>${fixTex(x)}</li>`).join('')}</ul></div>` : ''}
          ${p.hints ? `<button class="hintbtn nointeract"><i class="ph ph-lightbulb"></i> คำใบ้</button><div class="hintbox"><div class="lbl">คำใบ้</div>${fixTex([].concat(p.hints).join('<br>'))}</div>` : ''}
        </div>
        <div class="psol">
          ${me ? `<div class="meq f"><div class="lbl">สมการหลัก · ${me.nm}</div>$$${me.tex}$$</div>` : ''}
          <div class="sol">${sol}</div>
          <div class="pdone">คลิกต่อเพื่อไปสไลด์ถัดไป · หรือกดเลขด้านบนเพื่อลองข้ออื่น</div>
        </div>
      </div>`;
  };
  obj.html = obj.render(pid);
  obj.init = el => bindProb(el, obj);
  obj.enter = el => fitSol(el);
  return obj;
}
function bindProb(el, obj){
  el.querySelectorAll('.chips button').forEach(b => b.onclick = e => {
    e.stopPropagation();
    obj.pid = b.dataset.pid;
    el.innerHTML = obj.render(obj.pid);

    frag[cur] = 0; applyFrags(el, 0); fitSol(el);

  const ps = el.querySelector('.psol');
  if (ps) ps.onscroll = () => ps.classList.toggle('scrolled', ps.scrollTop > 4);
  const hb = el.querySelector('.hintbtn');

}
function fitSol(el){
  const ps = el.querySelector('.psol'); if (!ps) return;
  let fs = 34; ps.style.setProperty('--sfs', fs + 'px');
  while (ps.scrollHeight > ps.clientHeight + 2 && fs > 26){ fs -= 1; ps.style.setProperty('--sfs', fs + 'px'); }
}

},

conservation: {
  html: `<svg viewBox="0 0 900 470">

  init(el){
    const $ = s => el.querySelector(s), m = 50, g = 10, H = 5;
    const X0 = 60, X1 = 560, Ytop = 50, Ybot = 330, half = (X1 - X0) / 2, mid = X0 + half;
    const yOf = u => Ybot - (Ybot - Ytop) * u * u; // u ∈ [-1,1]
    let d = `M${X0} ${Ytop}`; for (let i = -1; i <= 1.0001; i += 0.02) d += ` L${mid + i * half} ${yOf(i)}`;

    $('#cBars').innerHTML = names.map((n, i) => `<text x="${622 + i * 80}" y="455" text-anchor="middle" font-size="20">${n[0]}</text><rect id="cb${i}" x="${598 + i * 80}" width="48" fill="${n[1]}"/><text id="cv${i}" x="${622 + i * 80}" text-anchor="middle" font-size="18" fill="var(--ink2)"></text>`).join('') +
      `<line x1="585" x2="895" y1="425" y2="425" class="gl"/>`;
    const E0 = m * g * H, BH = 330; // 2,500 J = 330 px
    let t = 0, last = 0, run = true, fr = false, A = 1, raf = 0, active = false;
    const draw = () => {
      const u = A * Math.cos(t * 1.6), h = H * u * u, Ep = m * g * h, Emech = m * g * H * A * A, Ek = Math.max(Emech - Ep, 0);
      $('#cBall').setAttribute('cx', mid + u * half); $('#cBall').setAttribute('cy', yOf(u) - 20);
      [Ek, Ep, E0 - Emech, E0].forEach((v, i) => {

    };
    const loop = now => {
      if (!active) return;
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (run){ t += dt; if (fr) A = Math.max(A * Math.exp(-0.12 * dt), 0); }
      draw(); raf = requestAnimationFrame(loop);
    };
    el._cStart = () => { active = true; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); };

    draw();
  },

function renderMath(root){
  if (!window.renderMathInElement) return;
  renderMathInElement(root, { delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}], throwOnError:false });
  fitX(root);
}
// สมการยาวเกินช่อง → ย่อเฉพาะสมการนั้นจนพอดี (ไม่ตัดขอบ)
function fitX(root){
  root.querySelectorAll('.katex-display').forEach(kd => {
    let box = kd.parentElement; const k = kd.firstElementChild;
    while (box && getComputedStyle(box).display === 'inline') box = box.parentElement; // auto-render ห่อด้วย span
    if (!box || !k) return;
    const cs = getComputedStyle(box), room = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    let z = 1; kd.style.fontSize = '';
    // วัดจากกล่องของตัวอักษรจริง (ลูกศรเวกเตอร์ของ KaTeX เป็น svg กว้าง 400em ที่ถูกตัดขอบ วัดตรง ๆ ไม่ได้)
    const need = () => {
      let L = Infinity, Rt = -Infinity;
      k.querySelectorAll('.katex-html .mord, .katex-html .mbin, .katex-html .mrel, .katex-html .mop, .katex-html .mopen, .katex-html .mclose, .katex-html .mpunct').forEach(e => {
        const r = e.getBoundingClientRect(); if (!r.width || r.width > 4000) return;
        L = Math.min(L, r.left); Rt = Math.max(Rt, r.right);
      });
      return Rt > L ? (Rt - L) / scaleNow() : 0;
    };
    while (need() > room + 1 && z > 0.55){ z -= 0.05; kd.style.fontSize = z + 'em'; }
  });
}

/* ════════════════════════════════════════════════════════════════
   การเลื่อนสไลด์ + การเผยทีละบรรทัด
   ════════════════════════════════════════════════════════════════ */
let cur = 0; const frag = slides.map(() => 0);
const SHOW_ALL = /[?&]all(&|$)/.test(location.search); // ?all = เผยทุกบรรทัดทันที (ไว้พิมพ์/ตรวจ)
const fragsOf = el => [...el.querySelectorAll('.f, .sol .r')];

function applyFrags(el, n){
  const fs = fragsOf(el);
  fs.forEach((f, i) => { f.classList.toggle('on', i < n); f.classList.remove('now', 'grpnow'); });
  const last = fs[n - 1];
  if (last){
    last.classList.add('now');
    if (last.dataset.g) fs.forEach((f, i) => { if (i < n && f.dataset.g === last.dataset.g) f.classList.add('grpnow'); });
  }
  const done = el.querySelector('.pdone'); if (done) done.classList.toggle('show', n >= fs.length && fs.length > 0);
  followLine(el, last, n);
}

// ใช้ scrollTop ของช่องวิธีทำเอง (scrollIntoView จะเลื่อนเวทีทั้งแผ่นไปด้วย)
function followLine(el, last, n){
  const ps = el.querySelector('.psol'); if (!ps) return;
  if (!n || !last){ ps.scrollTop = 0; return; }
  const cell = last.classList.contains('r') ? last.lastElementChild : last;
  const sc = stage.getBoundingClientRect().width / 1600 || 1;
  const pr = ps.getBoundingClientRect(), cr = cell.getBoundingClientRect();
  const below = (cr.bottom - pr.bottom) / sc + 28, above = (pr.top - cr.top) / sc + 28;
  if (below > 28) ps.scrollTo({ top: ps.scrollTop + below, behavior: 'smooth' });
  else if (above > 28) ps.scrollTo({ top: ps.scrollTop - above, behavior: 'smooth' });
}
const wipe = document.getElementById('wipe');
let pending = null; // การสลับสไลด์ที่รออยู่หลังม่าน
function show(i, dir, opts = {}){
  if (pending) pending();
  i = Math.max(0, Math.min(slides.length - 1, i));
  const from = slides[cur], to = slides[i];
  if (i === cur && !opts.force) return;
  frag[i] = (opts.allFrags || SHOW_ALL) ? fragsOf(to.el).length : 0;
  applyFrags(to.el, frag[i]);
  const secChange = to.S && (!from.S || from.S.key !== to.S.key) && to.el.classList.contains('s-open');
  const swap = () => {
    if (from !== to){ from.leave && from.leave(from.el); from.el.classList.remove('active'); }
    to.el.classList.add('active');
    to.enter && to.enter(to.el);
    cur = i; updHud();
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
  };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || opts.instant){ swap(); return; }
  if (secChange && dir > 0){
    wipe.style.background = to.S.color;
    wipe.querySelector('.n').textContent = to.S.num; wipe.querySelector('.t').textContent = to.S.title;
    const a = wipe.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}], {duration:420, easing:'cubic-bezier(.7,0,.3,1)', fill:'forwards'});
    // สลับสไลด์ด้วยตัวจับเวลา ไม่รอ onfinish — แท็บเบื้องหลังหยุดแอนิเมชัน ถ้ารอจะค้างอยู่หลังม่าน
    // และถ้ากดต่อระหว่างม่านปิด next()/prev() จะเรียก pending ให้ข้ามไปทันที
    const done = () => {
      if (pending !== done) return; pending = null; clearTimeout(tm);
      swap(); a.cancel();
      wipe.animate([{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 0 100%)'}], {duration:520, delay:260, easing:'cubic-bezier(.7,0,.3,1)', fill:'both'});
      to.el.animate([{opacity:0, transform:'translateX(60px)'},{opacity:1, transform:'none'}], {duration:700, delay:420, easing:'cubic-bezier(.2,.8,.2,1)', fill:'backwards'});
    };
    pending = done; const tm = setTimeout(done, 430);
    return;
  }
  const dx = dir >= 0 ? 1 : -1;
  if (from !== to) from.el.animate([{opacity:1, transform:'none', filter:'none'},{opacity:0, transform:`translateX(${-70 * dx}px) scale(.98)`, filter:'blur(6px)'}], {duration:380, easing:'cubic-bezier(.4,0,.2,1)'});
  swap();
  to.el.animate([{opacity:0, transform:`translateX(${90 * dx}px)`, filter:'blur(8px)'},{opacity:1, transform:'none', filter:'none'}], {duration:560, easing:'cubic-bezier(.2,.8,.2,1)'});
}

function next(){
  if (pending){ pending(); return; }
  const s = slides[cur], n = fragsOf(s.el).length;
  if (frag[cur] < n){ frag[cur]++; applyFrags(s.el, frag[cur]); keepVisible(s.el); }
  else if (cur < slides.length - 1) show(cur + 1, 1);
}
function prev(){
  if (pending){ pending(); return; }
  const s = slides[cur];
  if (frag[cur] > 0){ frag[cur]--; applyFrags(s.el, frag[cur]); }
  else if (cur > 0) show(cur - 1, -1, { allFrags: true });
}
function keepVisible(el){ /* เนื้อหาถูกออกแบบให้พอดีเวที — ปรับขนาดวิธีทำอีกครั้งเผื่อสูตรยาว */ if (el.querySelector('.psol')) fitSol(el); }

/* ── ย่อขยายเวที ── */
const scaleNow = () => stage.getBoundingClientRect().width / 1600 || 1;
function fit(){
  const s = Math.min(vw() / 1600, vh() / 900);
  const W = vw(), H = vh();
  stage.style.transform = `translate(${(W - 1600 * s) / 2}px, ${(H - 900 * s) / 2}px) scale(${s})`;
}
// ขนาดที่เห็นจริง — Safari บน iPad ย่อ/ขยายแถบที่อยู่ ทำให้ innerHeight เปลี่ยนภายหลัง
const vw = () => document.documentElement.clientWidth || innerWidth;
const vh = () => document.documentElement.clientHeight || innerHeight;
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe(document.documentElement); // กันกรณีเบราว์เซอร์ไม่ยิง resize
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => setTimeout(fit, 60)));

/* ── แถบควบคุม ── */
const hud = document.getElementById('hud'), bar = document.getElementById('bar');
const groups = [{ key:'_', color:'var(--ink3)', idx:[] }];
slides.forEach((s, i) => {
  const k = s.S ? s.S.key : (i < 2 ? '_' : '_end');
  let g = groups.find(x => x.key === k);
  if (!g){ g = { key:k, color: s.S ? s.S.color : 'var(--ink3)', idx:[] }; groups.push(g); }
  g.idx.push(i);
});
bar.innerHTML = groups.map(g => `<div class="seg" style="--n:${g.idx.length};--c:${g.color}" data-first="${g.idx[0]}" title="${g.key === '_' ? 'เริ่มบท' : g.key === '_end' ? 'สรุป' : SECTIONS.find(S => S.key === g.key).num + ' ' + SECTIONS.find(S => S.key === g.key).title}"><i></i></div>`).join('');
bar.querySelectorAll('.seg').forEach(s => s.onclick = () => show(+s.dataset.first, +s.dataset.first >= cur ? 1 : -1));
function updHud(){
  groups.forEach((g, gi) => {
    const a = g.idx[0], b = g.idx[g.idx.length - 1];
    const p = cur > b ? 100 : cur < a ? 0 : (cur - a + 1) / g.idx.length * 100;
    bar.children[gi].style.setProperty('--p', p + '%');
  });
  document.getElementById('count').textContent = `${cur + 1} / ${slides.length}`;
}
let idle; const wake = () => { hud.classList.remove('hide'); clearTimeout(idle); idle = setTimeout(() => hud.classList.add('hide'), 2600); };
addEventListener('mousemove', wake); addEventListener('touchstart', wake, { passive: true }); wake();
document.getElementById('bPrev').onclick = prev;
document.getElementById('bNext').onclick = next;
document.getElementById('bFull').onclick = toggleFull;
document.getElementById('bTheme').onclick = toggleTheme;
document.getElementById('bOv').onclick = toggleOv;
const chmenu = document.getElementById('chmenu');
document.getElementById('bChT').textContent = 'บทที่ ' + CH_NO;
chmenu.innerHTML = Object.values(CHAPTERS).map(c => '<a role="menuitem" href="' + chHref(c.no) + '" class="' + (c.no === CH_NO ? 'cur' : '') + '" style="--c:' + c.color + '"><b>' + c.no + '</b>' + c.title + '</a>').join('') +
  '<a role="menuitem" href="?"><b>·</b>หน้าเลือกบท</a>';
document.getElementById('bCh').onclick = e => { e.stopPropagation(); chmenu.classList.toggle('show'); };
addEventListener('click', e => { if (!e.target.closest('#chmenu, #bCh')) chmenu.classList.remove('show'); });
function goChapter(n){ if (CHAPTERS[n] && +n !== CH_NO) location.href = chHref(n); }

function toggleFull(){
  const d = document, el = d.documentElement;
  const on = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (on) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen) el.requestFullscreen().catch(noFull);
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else noFull();
  } catch (e) { noFull(); }
}
function noFull(){
  const t = document.getElementById('toast');
  t.textContent = 'อุปกรณ์นี้ไม่รองรับโหมดเต็มจอจากหน้าเว็บ — ลองหมุนจอเป็นแนวนอน หรือซ่อนแถบของเบราว์เซอร์แทน';
  t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 4200);
}
function toggleTheme(){
  const r = document.documentElement, d = r.dataset.theme === 'dark';
  r.dataset.theme = d ? 'light' : 'dark';
  try { localStorage.setItem('p2slides.theme', r.dataset.theme); } catch (e) {}
}
try { const t = localStorage.getItem('p2slides.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

/* ── ภาพรวม ── */
const ov = document.getElementById('ov');
function toggleOv(){
  if (ov.classList.toggle('show')){
    ov.innerHTML = '<div class="ovch">บท ' + Object.values(CHAPTERS).map(c => '<a href="' + chHref(c.no) + '" class="' + (c.no === CH_NO ? 'cur' : '') + '">บทที่ ' + c.no + ' ' + c.title + '</a>').join('') + '</div>' + groups.map(g => {
      const S = SECTIONS.find(x => x.key === g.key);
      const head = S ? `${S.num} ${S.title}` : g.key === '_' ? 'เริ่มบท' : 'สรุป';
      return `<h3 style="--c:${g.color}">${head}</h3><div class="g">${g.idx.map(i => `<div class="card ${i === cur ? 'cur' : ''}" style="--c:${g.color}" data-i="${i}"><small>${i + 1}</small><span>${slides[i].title}</span></div>`).join('')}</div>`;
    }).join('');
    ov.querySelectorAll('.card').forEach(c => c.onclick = () => { ov.classList.remove('show'); show(+c.dataset.i, +c.dataset.i >= cur ? 1 : -1, { instant: true }); });
  }
}

/* ── อินพุต ── */
const isCtl = t => t.closest && t.closest('button, input, select, a, .nointeract, label');
stage.addEventListener('click', e => { if (!isCtl(e.target)) next(); });
stage.addEventListener('contextmenu', e => { e.preventDefault(); prev(); });
addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input[type=range]') && /Arrow/.test(e.key)) return;
  if (ov.classList.contains('show') && e.key !== 'o' && e.key !== 'O' && e.key !== 'Escape') return;
  const k = e.key;
  if (['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(k)){ e.preventDefault(); next(); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); prev(); }
  else if (k === 'Home') show(0, -1);
  else if (/^[5-7]$/.test(k)) goChapter(k);
  else if (k === 'Escape' && chmenu.classList.contains('show')) chmenu.classList.remove('show');
  else if (k === 'End') show(slides.length - 1, 1);
  else if (k === 'o' || k === 'O' || (k === 'Escape' && ov.classList.contains('show'))) toggleOv();
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'd' || k === 'D') toggleTheme();
  else if (k === 'b' || k === 'B' || k === '.') document.getElementById('blank').classList.toggle('show');
  else if (k === 'h' || k === 'H'){ const hb = slides[cur].el.querySelector('.hintbox'); if (hb) hb.classList.toggle('show'); }
});
document.getElementById('blank').onclick = e => e.currentTarget.classList.remove('show');
let tx = null;
stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
stage.addEventListener('touchend', e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60){ dx < 0 ? next() : prev(); }
});

/* ── เริ่ม ── */
function boot(){
  renderMath(deck);
  slides.forEach(s => s.init && s.init(s.el));
  fit();
  if (document.fonts) document.fonts.ready.then(() => fitX(deck));
  const h = parseInt(location.hash.slice(1), 10);
  cur = 0; slides[0].el.classList.add('active');
  show(h > 1 ? h - 1 : 0, 1, { force: true, instant: true });
  updHud();
}
// ไว้ตรวจสไลด์จากคอนโซล: slidesDeck.go(10) = ไปสไลด์ที่ 11 แบบเผยครบทุกบรรทัด
window.slidesDeck = { go: i => show(i, 1, { allFrags: true, instant: true, force: true }), get count(){ return slides.length; } };
if (document.readyState === 'complete') boot(); else addEventListener('load', boot);
})();
</script>
</body>
