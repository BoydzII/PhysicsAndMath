<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics 1D Motion App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    
    :root {
      --font-thai: 'Sarabun', sans-serif;
      --font-math: 'Cambria Math', 'Cambria', 'Times New Roman', serif;
    }

    body {
      font-family: var(--font-thai);
      background-color: #fdfbf7;
      color: #4a4a4a;
    }

    .math-text {
      font-family: var(--font-math);
      font-style: italic;
    }

    .math-num {
      font-family: var(--font-math);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #d4a5a5; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #c38b8b; }

    .hide-scroll-bar::-webkit-scrollbar {
      display: none;
    }
    .hide-scroll-bar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes flipIn {
      from { transform: rotateY(90deg); opacity: 0; }
      to { transform: rotateY(0deg); opacity: 1; }
    }
    .flip-anim { animation: flipIn 0.3s ease-out forwards; }
    
    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Icon System ---
    const Icon = ({ name, size = 20, className = "" }) => (
      <i className={`fa-solid ${name} ${className}`} style={{ fontSize: size }}></i>
    );

    const icons = {
      Play: "fa-play",
      RotateCcw: "fa-rotate-left",
      BookOpen: "fa-book-open",
      PenTool: "fa-pen",
      ArrowLeft: "fa-arrow-left",
      CheckCircle: "fa-circle-check",
      XCircle: "fa-circle-xmark",
      ChevronRight: "fa-chevron-right",
      ChevronLeft: "fa-chevron-left",
      Home: "fa-house",
      Settings: "fa-gear",
      FlipHorizontal: "fa-arrows-rotate",
      Stopwatch: "fa-stopwatch",
      Weight: "fa-weight-hanging",
      ChartLine: "fa-chart-line",
      Eye: "fa-eye",
      EyeSlash: "fa-eye-slash"
    };

    // --- UI Helper Components ---
    const Vec = ({ char }) => (
      <span className="inline-flex flex-col items-center justify-end leading-[0.8] align-bottom math-text mx-1 font-bold text-indigo-600">
        <span className="text-[0.6em] mb-[-0.3em] font-normal" style={{ fontStyle: 'normal', fontFamily: 'sans-serif' }}>→</span>
        <span>{char}</span>
      </span>
    );

    const Scalar = ({ char }) => (
      <span className="math-text mx-1 font-bold text-rose-500">{char}</span>
    );

    const MathNum = ({ num }) => (
      <span className="math-num mx-1 font-semibold">{num}</span>
    );

    const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    // --- Flashcard Data ---
    const flashcardsData = [
      {
        id: 1,
        front: <div className="flex flex-col items-center"><span className="text-4xl mb-2"><Vec char="u"/></span><span>ความเร็วต้น</span></div>,
        backTitle: "ความเร็วต้น (Initial Velocity)",
        backDesc: <span>ความเร็วของวัตถุ ณ จุดเริ่มต้นของการสังเกต มีทิศทาง (เวกเตอร์)</span>,
        unit: "m/s",
        condition: <span>🔑 คีย์เวิร์ด: หากโจทย์บอกว่า 'เริ่มจากจุดหยุดนิ่ง' หรือ 'ปล่อยวัตถุตก' ให้รู้ทันทีว่า <Vec char="u"/> = 0</span>
      },
      {
        id: 2,
        front: <div className="flex flex-col items-center"><span className="text-4xl mb-2"><Vec char="v"/></span><span>ความเร็วปลาย</span></div>,
        backTitle: "ความเร็วปลาย (Final Velocity)",
        backDesc: <span>ความเร็วของวัตถุ ณ จุดสิ้นสุดของการสังเกตที่สนใจ มีทิศทาง (เวกเตอร์)</span>,
        unit: "m/s",
        condition: <span>🔑 คีย์เวิร์ด: หากโจทย์บอกว่า 'เบรกจนรถหยุด' หรือ 'เคลื่อนที่จนหยุดนิ่ง' ให้รู้ทันทีว่า <Vec char="v"/> = 0</span>
      },
      {
        id: 3,
        front: <div className="flex flex-col items-center"><div className="flex items-center space-x-4 mb-2"><span className="text-4xl"><Scalar char="s"/></span> <span className="text-xl">vs</span> <span className="text-4xl"><Vec char="s"/></span></div><span>ระยะทาง vs การกระจัด</span></div>,
        backTitle: "ระยะทาง (Scalar) vs การกระจัด (Vector)",
        backDesc: <span>ระยะทาง (<Scalar char="s"/>) คือความยาวตามเส้นทางจริงทั้งหมดที่เดินได้ ส่วนการกระจัด (<Vec char="s"/>) คือเส้นตรงที่ลากจากจุดเริ่มต้นไปยังจุดสุดท้ายเสมอ</span>,
        unit: "m",
        condition: <span>💡 ทริคสำคัญ: ถ้ารถเคลื่อนที่เป็นเส้นตรงไปข้างหน้า 'โดยไม่มีการเลี้ยวกลับ' ขนาดของการกระจัดจะเท่ากับระยะทางพอดีเป๊ะ (|<Vec char="s"/>| = <Scalar char="s"/>)</span>
      },
      {
        id: 4,
        front: <div className="flex flex-col items-center"><span className="text-4xl mb-2"><Vec char="a"/></span><span>ความเร่ง</span></div>,
        backTitle: "ความเร่ง (Acceleration)",
        backDesc: <span>ความเร็วที่เปลี่ยนแปลงไปใน 1 วินาที (เวกเตอร์)</span>,
        unit: "m/s²",
        condition: <span>🔑 ทริค: ความเร่งทิศเดียวกับความเร็วรถจะ 'เร็วขึ้น', แต่ถ้าความเร่งทิศตรงข้าม (หรือเรียกว่า 'ความหน่วง') รถจะ 'ช้าลง'</span>
      },
      {
        id: 5,
        front: <div className="flex flex-col items-center"><span className="text-4xl mb-2"><Scalar char="v"/></span><span>อัตราเร็ว vs ความเร็ว</span></div>,
        backTitle: "อัตราเร็ว (Speed) vs ความเร็ว (Velocity)",
        backDesc: <span>อัตราเร็วคำนวณจาก ระยะทาง/เวลา (สเกลาร์) ส่วนความเร็วคำนวณจาก การกระจัด/เวลา (เวกเตอร์)</span>,
        unit: "m/s",
        condition: <span>💡 ทริค: รถวิ่งเป็นวงกลมกลับมาจุดเดิม อัตราเร็วเฉลี่ย &gt; 0 แต่ความเร็วเฉลี่ย = 0 (เพราะการกระจัดเป็น 0)</span>
      },
      {
        id: 6,
        front: <div className="flex flex-col items-center"><span className="text-4xl mb-2"><Scalar char="t"/></span><span>เวลา</span></div>,
        backTitle: "เวลา (Time)",
        backDesc: <span>ช่วงเวลาที่ใช้ในการเคลื่อนที่หรือการสังเกต เป็นปริมาณสเกลาร์ที่บอกเพียงขนาดเท่านั้น</span>,
        unit: "s",
        condition: <span>💡 ทริค: เวลาเดินหน้าเสมอ ไม่มีทิศทาง และไม่มีค่าติดลบ (<Scalar char="t"/> ≥ 0 เสมอ)</span>
      }
    ];

    // --- Equation Cards Data ---
    const equationCardsData = [
      {
        id: 1,
        type: "a = 0 (ความเร่งเป็นศูนย์ / ความเร็วคงที่)",
        color: "emerald",
        formula: <span className="math-text text-5xl">s = vt</span>,
        missing: "a (ความเร่ง)",
        desc: "ใช้เมื่อโจทย์ระบุว่า วัตถุเคลื่อนที่ด้วย 'ความเร็วคงที่' หรือ 'อัตราเร็วสม่ำเสมอ' (ไม่มีความเร่งเกิดขึ้น)"
      },
      {
        id: 2,
        type: "a คงที่ (ความเร่งสม่ำเสมอ)",
        color: "indigo",
        formula: <span className="math-text text-5xl">v = u + at</span>,
        missing: "s (การกระจัด)",
        desc: "ใช้เมื่อโจทย์ ไม่ได้บอกระยะทางหรือการกระจัด (s) มาให้ และ ไม่ได้ถามหา"
      },
      {
        id: 3,
        type: "a คงที่ (ความเร่งสม่ำเสมอ)",
        color: "indigo",
        formula: (
          <div className="flex items-center text-5xl math-text">
            <span>s = </span>
            <div className="flex flex-col items-center mx-3 leading-none">
              <span className="border-b-[3px] border-current px-3 pb-1 mb-1">u + v</span>
              <span className="text-3xl">2</span>
            </div>
            <span>t</span>
          </div>
        ),
        missing: "a (ความเร่ง)",
        desc: "ใช้เมื่อโจทย์ ไม่ได้บอกความเร่ง (a) มาให้ และ ไม่ได้ถามหา"
      },
      {
        id: 4,
        type: "a คงที่ (ความเร่งสม่ำเสมอ)",
        color: "indigo",
        formula: <span className="math-text text-5xl">s = ut + <span className="text-4xl">½</span>at²</span>,
        missing: "v (ความเร็วปลาย)",
        desc: "ใช้เมื่อโจทย์ ไม่ได้บอกความเร็วปลายตอนสุดท้าย (v) มาให้ และ ไม่ได้ถามหา"
      },
      {
        id: 5,
        type: "a คงที่ (ความเร่งสม่ำเสมอ)",
        color: "indigo",
        formula: <span className="math-text text-5xl">v² = u² + 2as</span>,
        missing: "t (เวลา)",
        desc: "ใช้เมื่อโจทย์ ไม่ได้บอกเวลา (t) ในการเคลื่อนที่มาให้ และ ไม่ได้ถามหา"
      }
    ];

    // --- Question Bank (80 Unique Templates) ---
    // แต่ละฟังก์ชันสร้างโจทย์ที่ไม่ซ้ำกัน พร้อมสุ่มตัวเลขใหม่ทุกครั้ง
    const questionBank = {
      easy: [
        () => ({ question: "ปริมาณใดต่อไปนี้เป็น 'ปริมาณสเกลาร์' ทั้งหมด?", options: ["ระยะทาง, อัตราเร็ว, เวลา", "การกระจัด, ความเร็ว", "เวลา, ความเร่ง, อัตราเร็ว", "น้ำหนัก, ระยะทาง"], answer: 0, explanation: "สเกลาร์คือปริมาณที่บอกแค่ 'ขนาด' (ไม่มีทิศทาง) เช่น ระยะทาง อัตราเร็ว และเวลา" }),
        () => ({ question: "ปริมาณใดต่อไปนี้เป็น 'ปริมาณเวกเตอร์' ทั้งหมด?", options: ["มวล, ระยะทาง", "อัตราเร็ว, เวลา", "การกระจัด, ความเร็ว, ความเร่ง", "น้ำหนัก, อัตราเร็ว"], answer: 2, explanation: "เวกเตอร์ต้องบอกทั้ง 'ขนาด' และ 'ทิศทาง' เช่น การกระจัด ความเร็ว ความเร่ง" }),
        () => ({ question: "หน่วยของ 'ความเร่ง' ในระบบ SI คือข้อใด?", options: ["m/s", "m/s²", "km/h", "m²"], answer: 1, explanation: "ความเร่งคือความเร็วที่เปลี่ยนไปต่อหนึ่งหน่วยเวลา (m/s) / s = m/s²" }),
        () => ({ question: "ในการตกแบบเสรี (Free Fall) ความเร่งของวัตถุมีทิศทางอย่างไร?", options: ["ทิศขึ้นเสมอ", "ทิศลงสู่ศูนย์กลางโลกเสมอ", "ทิศทางเดียวกับการเคลื่อนที่", "ไม่มีความเร่ง"], answer: 1, explanation: "การตกแบบเสรีวัตถุจะถูกแรงโน้มถ่วงดึงดูด ทำให้มีความเร่ง g ทิศลงเสมอ" }),
        () => ({ question: "โยนก้อนหินขึ้นไปในแนวดิ่ง ที่จุด 'สูงสุด' ของการเคลื่อนที่ ปริมาณใดมีค่าเป็นศูนย์?", options: ["ความเร่ง", "เวลา", "ความเร็ว", "การกระจัด"], answer: 2, explanation: "ที่จุดสูงสุด วัตถุจะหยุดนิ่งชั่วขณะก่อนตกลงมา ทำให้ความเร็ว (v) เป็น 0 m/s" }),
        () => ({ question: "หากโจทย์ระบุว่ารถ 'เริ่มเคลื่อนที่จากจุดหยุดนิ่ง' หมายความว่าอย่างไร?", options: ["v = 0", "u = 0", "a = 0", "s = 0"], answer: 1, explanation: "เริ่มต้นจากหยุดนิ่ง แปลว่า ความเร็วต้น (u) เป็นศูนย์" }),
        () => ({ question: "หากโจทย์ระบุว่ารถ 'เบรกจนกระทั่งหยุดสนิท' หมายความว่าอย่างไร?", options: ["v = 0", "u = 0", "a = 0", "t = 0"], answer: 0, explanation: "เบรกจนหยุด แปลว่า ความเร็วปลายตอนสุดท้าย (v) เป็นศูนย์" }),
        () => ({ question: "รถยนต์วิ่งวนรอบสนามรูปวงกลม 1 รอบจนกลับมาที่จุดเดิม ข้อใดกล่าวถูกต้อง?", options: ["การกระจัด = 0", "ระยะทาง = 0", "อัตราเร็วเฉลี่ย = 0", "ถูกทั้ง ก. และ ค."], answer: 0, explanation: "จุดเริ่มต้นและจุดสุดท้ายคือจุดเดียวกัน ทำให้การกระจัดเป็น 0 (แต่ระยะทางไม่เป็น 0)" }),
        () => { let s = rnd(10, 50)*10, t = rnd(2, 10); return { question: <span>รถวิ่งระยะทาง <MathNum num={s}/> เมตร ในเวลา <MathNum num={t}/> วินาที รถมีอัตราเร็วเฉลี่ยเท่าใด?</span>, options: [`${s/t} m/s`, `${s*t} m/s`, `${(s/t)*2} m/s`, `${s-t} m/s`], answer: 0, explanation: <span>v = s/t = {s} / {t} = {s/t} m/s</span> }},
        () => { let v = rnd(10, 30), t = rnd(2, 10); return { question: <span>ม้าวิ่งด้วยอัตราเร็วคงที่ <MathNum num={v}/> m/s เป็นเวลา <MathNum num={t}/> วินาที ม้าจะวิ่งได้ระยะทางเท่าใด?</span>, options: [`${v/t} m`, `${v*t} m`, `${v+t} m`, `${v*t*2} m`], answer: 1, explanation: <span>s = vt = {v} × {t} = {v*t} m</span> }},
        () => { let s = rnd(5, 20)*10, v = rnd(5, 20); return { question: <span>คนเดินด้วยอัตราเร็ว <MathNum num={v}/> m/s ต้องการเดินทาง <MathNum num={s}/> เมตร จะต้องใช้เวลากี่วินาที?</span>, options: [`${s*v} s`, `${s/v} s`, `${(s/v)+5} s`, `${s/v/2} s`], answer: 1, explanation: <span>t = s/v = {s} / {v} = {s/v} s</span> }},
        () => { let g = 10, t = rnd(2, 5); return { question: <span>ปล่อยลูกบอลตกจากตึกสูงแบบเสรี (g = {g} m/s²) เมื่อเวลาผ่านไป <MathNum num={t}/> วินาที ลูกบอลจะมีความเร็วเท่าใด?</span>, options: [`${g*t} m/s`, `${g*t/2} m/s`, `${g+t} m/s`, `${(g*t)*2} m/s`], answer: 0, explanation: <span>ปล่อยแปลว่า u=0; จาก v = u + gt = 0 + ({g})({t}) = {g*t} m/s</span> }},
        () => { let v = rnd(10, 50); return { question: <span>โยนวัตถุขึ้นฟ้าด้วยความเร็ว <MathNum num={v}/> m/s จะใช้เวลากี่วินาทีวัตถุจึงจะขึ้นไปถึงจุดสูงสุด? (g = 10 m/s²)</span>, options: [`${v/10} s`, `${v*10} s`, `${v/5} s`, `${v} s`], answer: 0, explanation: <span>จุดสูงสุด v=0; จาก v = u - gt -> 0 = {v} - 10t -> t = {v}/10 = {v/10} s</span> }},
        () => { let d = rnd(3, 8); return { question: <span>เดินไปทางทิศตะวันออก <MathNum num={d}/> เมตร แล้วเดินต่อไปทางทิศตะวันออกอีก <MathNum num={d*2}/> เมตร การกระจัดลัพธ์เป็นเท่าใด?</span>, options: [`${d*3} เมตร ทางตะวันออก`, `${d} เมตร ทางตะวันตก`, `${d*3} เมตร ทางตะวันตก`, `0 เมตร`], answer: 0, explanation: "ทิศเดียวกันนำขนาดมาบวกกัน และทิศเดิม" }},

                      <div className="bg-slate-900/60 p-4 rounded-xl border border-rose-900/50">
                         <div className="text-rose-400 text-sm font-bold mb-3 flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-rose-500 mr-2"></span>ช่วงที่ 2</div>
                         <div className="flex justify-between items-center mb-2">
                           <span className="text-slate-300 text-xs">ความเร็วเฉลี่ย (v₂)</span>
                           <span className="font-bold text-sm math-num text-rose-200">{v2.toFixed(2)} m/s</span>
                         </div>
                         <div className="flex justify-between items-center">
                           <span className="text-slate-300 text-xs">ความเร่ง (a₂)</span>
                           <span className="font-bold text-sm math-num text-emerald-300 flex items-center">
                             0.00 m/s² <span className="text-[10px] text-slate-500 font-normal ml-2 bg-slate-800 px-1.5 py-0.5 rounded">(v คงที่)</span>
                           </span>
                         </div>
                      </div>
                    </div>

                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      const FreeFallSimulation = () => {
        const [mode, setMode] = useState('drop'); // 'drop', 'throw_up', 'throw_down'
        const [u, setU] = useState(20); 
        const [h, setH] = useState(50);
        const [g, setG] = useState(10); 
        
        const [simState, setSimState] = useState('idle'); // 'idle', 'running', 'paused', 'finished'
        const [t, setT] = useState(0); 
        const [y, setY] = useState(50); 
        const [v, setV] = useState(0); 
        
        const [showSummary, setShowSummary] = useState(false);

        const animRef = useRef(null);
        const tRef = useRef(0);
        
        // เก็บค่า t ล่าสุดไว้ใช้เมื่อกดเล่นต่อ (Resume)
        useEffect(() => { tRef.current = t; }, [t]);

        // คำนวณความเร็วต้นจริงตามทิศทาง (ให้ทิศขึ้นเป็นบวก ทิศลงเป็นลบ)
        const actualU = mode === 'drop' ? 0 : (mode === 'throw_up' ? Math.abs(u) : -Math.abs(u));
        const safeH = Math.max(0, h);
        const safeG = Math.max(0.1, g);
        
        const totalTime = (actualU + Math.sqrt(actualU * actualU + 2 * safeG * safeH)) / safeG;
        const maxHeight = actualU > 0 ? safeH + (actualU * actualU) / (2 * safeG) : safeH;
        const finalVelocity = actualU - safeG * totalTime; 

        const displayMaxHeight = Math.max(10, maxHeight * 1.15); 
        const getPercent = (val) => Math.max(0, Math.min(100, (val / displayMaxHeight) * 100));

        useEffect(() => {
          if (simState === 'idle') {
            setY(safeH);
            setT(0);
            setV(actualU);
            setShowSummary(false); // ซ่อนผลสรุปเมื่อรีเซ็ต
          }
        }, [simState, safeH, actualU]);

        useEffect(() => {
          if (simState === 'running') {
            let startRealTime = performance.now();
            let initialT = tRef.current >= totalTime ? 0 : tRef.current;
            
            const animate = (currentTime) => {
              const elapsedTime = initialT + (currentTime - startRealTime) / 1000; 
              if (elapsedTime >= totalTime) {
                setT(totalTime);
                setY(0);
                setV(finalVelocity);
                setSimState('finished');
              } else {
                setT(elapsedTime);
                setY(Math.max(0, safeH + actualU * elapsedTime - 0.5 * safeG * elapsedTime * elapsedTime));
                setV(actualU - safeG * elapsedTime);
                animRef.current = requestAnimationFrame(animate);
              }
            };
            animRef.current = requestAnimationFrame(animate);
          }
          return () => cancelAnimationFrame(animRef.current);
        }, [simState, safeH, actualU, safeG, totalTime, finalVelocity]);

        const handlePlay = () => { 
           if (t >= totalTime) { setT(0); setY(safeH); setV(actualU); }
           setSimState('running'); 
           setShowSummary(false); 
        };
        const handlePause = () => setSimState('paused');
        const handleReset = () => { cancelAnimationFrame(animRef.current); setSimState('idle'); };

        // ฟังก์ชันลากแถบเวลา (Seek bar)
        const handleSeek = (e) => {
          const newT = Number(e.target.value);
          cancelAnimationFrame(animRef.current);
          setSimState('paused'); 
          setT(newT);
          setY(Math.max(0, safeH + actualU * newT - 0.5 * safeG * newT * newT));
          setV(actualU - safeG * newT);
          setShowSummary(false);
        };

        return (
          <div className="bg-white p-4 sm:p-6 rounded-3xl shadow-sm border border-indigo-50 mb-6">
            <div className="flex justify-between items-center mb-4 border-b pb-3">
              <h3 className="text-lg sm:text-xl font-bold text-indigo-800 flex items-center">
                <Icon name={icons.Play} className="text-indigo-500 mr-2" size={18}/> การตกแบบเสรี (แนวดิ่ง)
              </h3>
            </div>

            {/* คอนเทนเนอร์หลัก แบ่งครึ่ง ซ้าย(ภาพ) / ขวา(ตั้งค่า) */}
            <div className="flex flex-row gap-3 sm:gap-6 h-[480px] sm:h-[550px]">
              
              {/* Left Col: Visualizer (แคบและสูง) */}
              <div className="relative w-2/5 sm:w-1/3 max-w-[160px] sm:max-w-[200px] h-full bg-gradient-to-b from-sky-50 to-blue-100 rounded-2xl overflow-hidden border-2 border-slate-200 flex flex-col shadow-inner shrink-0">
                <div className="relative flex-1 w-full">
                   {/* Height markers */}
                   <div className="absolute left-6 sm:left-8 top-4 bottom-0 border-l-2 border-dashed border-slate-400 opacity-50"></div>
                   
                   <div className="absolute left-8 sm:left-10 text-[10px] sm:text-xs text-slate-600 font-bold math-num bg-white/70 px-1.5 py-0.5 rounded-full" style={{ bottom: `${getPercent(safeH)}%`, transform: 'translateY(50%)' }}>h={safeH}m</div>
                   {maxHeight > safeH && (
                      <div className="absolute left-8 sm:left-10 text-[10px] sm:text-xs text-rose-600 font-bold math-num bg-rose-50/80 px-1.5 py-0.5 rounded-full border border-rose-100" style={{ bottom: `${getPercent(maxHeight)}%`, transform: 'translateY(50%)' }}>H_max={maxHeight.toFixed(1)}</div>
                   )}
                   
                   {/* Object */}
                   <div 
                      className="absolute left-1/2 transition-transform duration-75 text-4xl sm:text-5xl filter drop-shadow-md z-10 -ml-5 sm:-ml-6"
                      style={{ bottom: `${getPercent(y)}%` }}
                    >
                      🍎
                    </div>
                </div>

                {/* Ground */}
                <div className="h-10 sm:h-12 w-full bg-emerald-500 flex items-center justify-center text-emerald-50 text-xs sm:text-base font-bold z-20 shadow-[0_-4px_10px_rgba(0,0,0,0.15)] relative">
                   <div className="absolute top-0 w-full h-1 bg-emerald-400"></div>
                   พื้น (y=0)
                </div>
              </div>

              {/* Right Col: Controls (กว้างและเลื่อนได้) */}
              <div className="w-3/5 sm:flex-1 flex flex-col h-full overflow-y-auto hide-scroll-bar pr-1 sm:pr-2">
                <div className="bg-sky-50/50 p-3 sm:p-5 rounded-2xl border border-sky-100 mb-4 shrink-0">
                  <h4 className="font-bold text-sky-800 mb-3 text-sm sm:text-lg">ตั้งค่าและควบคุม</h4>
                  
                  {/* Mode Selector */}
                  <div className="grid grid-cols-1 xl:grid-cols-3 gap-2 mb-4">
                     <button onClick={() => {setMode('drop'); setSimState('idle');}} className={`py-2 px-1 rounded-lg border text-[10px] sm:text-sm font-bold transition-all shadow-sm ${mode === 'drop' ? 'bg-sky-500 text-white border-sky-600' : 'bg-white text-gray-500 hover:bg-gray-50'}`}>ปล่อยตก</button>
                     <button onClick={() => {setMode('throw_up'); setSimState('idle');}} className={`py-2 px-1 rounded-lg border text-[10px] sm:text-sm font-bold transition-all shadow-sm ${mode === 'throw_up' ? 'bg-indigo-500 text-white border-indigo-600' : 'bg-white text-gray-500 hover:bg-gray-50'}`}>โยนขึ้น</button>
                     <button onClick={() => {setMode('throw_down'); setSimState('idle');}} className={`py-2 px-1 rounded-lg border text-[10px] sm:text-sm font-bold transition-all shadow-sm ${mode === 'throw_down' ? 'bg-rose-500 text-white border-rose-600' : 'bg-white text-gray-500 hover:bg-gray-50'}`}>ขว้างลง</button>
                  </div>
                  
                  {/* Inputs */}
                  <div className="grid grid-cols-1 xl:grid-cols-2 gap-2 sm:gap-3 mb-3">
                    <div>
                      <label className="text-[10px] sm:text-xs text-gray-600 font-semibold mb-1 block">ความสูง h (m)</label>
                      <input type="number" min="0" value={h} onChange={e => {setH(Number(e.target.value)); setSimState('idle');}} disabled={simState === 'running'} className="w-full p-2 rounded-xl border-2 border-gray-200 text-center font-bold math-num focus:border-sky-400 focus:outline-none" />
                    </div>
                    <div>
                      <label className="text-[10px] sm:text-xs text-gray-600 font-semibold mb-1 block">ความเร่ง g (m/s²)</label>
                      <input type="number" min="0.1" step="0.1" value={g} onChange={e => {setG(Number(e.target.value)); setSimState('idle');}} disabled={simState === 'running'} className="w-full p-2 rounded-xl border-2 border-gray-200 text-center font-bold math-num focus:border-sky-400 focus:outline-none" />
                    </div>
                  </div>
                  
                  <div className={`transition-all overflow-hidden ${mode !== 'drop' ? 'max-h-24 opacity-100 mb-4' : 'max-h-0 opacity-0 mb-0'}`}>
                     <label className="text-[10px] sm:text-xs text-gray-600 font-semibold mb-1 block">
                       ความเร็วต้น u (m/s)
                     </label>
                     <input type="number" min="0" value={u} onChange={e => {setU(Math.abs(Number(e.target.value))); setSimState('idle');}} disabled={simState === 'running'} className="w-full p-2 rounded-xl border-2 border-gray-200 text-center font-bold math-num focus:border-sky-400 focus:outline-none" />
                  </div>

                  {/* Time Frame Slider (Seek Bar) */}
                  <div className="mb-4 bg-white p-3 rounded-xl border border-sky-100 shadow-sm">
                     <label className="text-[10px] sm:text-xs text-sky-800 font-bold mb-2 flex justify-between">
                       <span><i className="fa-solid fa-clock mr-1"></i> เลื่อนดูเวลา</span>
                       <span className="text-sky-600 math-num">{t.toFixed(2)} / {totalTime.toFixed(2)}s</span>
                     </label>
                     <input
                       type="range"
                       min="0"
                       max={totalTime || 0}
                       step="0.01"
                       value={t}
                       onChange={handleSeek}
                       className="w-full h-2 bg-sky-200 rounded-lg appearance-none cursor-pointer accent-sky-500"
                     />
                  </div>

                  {/* Buttons */}
                  <div className="flex flex-col xl:flex-row justify-center gap-2 mb-4">
                    <button onClick={simState === 'running' ? handlePause : handlePlay} className="flex-1 py-2 sm:py-3 bg-emerald-500 text-white rounded-xl font-bold text-xs sm:text-sm hover:bg-emerald-600 flex justify-center items-center shadow-sm">
                      <i className={`fa-solid ${simState === 'running' ? 'fa-pause' : 'fa-play'} mr-2`}></i> 
                      {simState === 'running' ? 'พัก (Pause)' : (t > 0 && t < totalTime ? 'เล่นต่อ' : 'เริ่ม (Play)')}
                    </button>
                    <button onClick={handleReset} className="px-4 py-2 sm:py-3 bg-slate-200 text-slate-700 rounded-xl font-bold text-xs sm:text-sm hover:bg-slate-300 flex justify-center items-center shadow-sm">
                      <Icon name={icons.RotateCcw} size={14} className="xl:mr-0 mr-2" /> <span className="xl:hidden">รีเซ็ต</span>
                    </button>
                  </div>
                  
                  {/* Live Stats */}
                  <div className="grid grid-cols-2 gap-2 text-center">
                    <div className="bg-indigo-50/80 p-2 sm:p-3 rounded-xl border border-indigo-100">
                      <div className="text-[10px] sm:text-xs text-indigo-600 font-bold mb-1">ความเร็ว (v)</div>
                      <div className="font-bold text-indigo-700 math-num text-sm sm:text-lg">{v.toFixed(2)}</div>
                    </div>
                    <div className="bg-rose-50/80 p-2 sm:p-3 rounded-xl border border-rose-100">
                      <div className="text-[10px] sm:text-xs text-rose-600 font-bold mb-1">ความสูง (y)</div>
                      <div className="font-bold text-rose-700 math-num text-sm sm:text-lg">{y.toFixed(2)}</div>
                    </div>
                  </div>
                </div>

                {/* Summary Section */}
                <div className="pb-2">
                  <button 
                     onClick={() => setShowSummary(!showSummary)}
                     className={`w-full flex items-center justify-center px-4 py-3 rounded-xl font-bold text-[10px] sm:text-sm transition-all shadow-sm ${showSummary ? 'bg-slate-700 text-white' : 'bg-sky-100 text-sky-700 hover:bg-sky-200'}`}
                  >
                     <Icon name={showSummary ? "fa-eye-slash" : "fa-eye"} size={14} className="mr-2" /> 
                     {showSummary ? 'ซ่อนวิเคราะห์' : 'แสดงผลวิเคราะห์'}
                  </button>

                  {showSummary && (
                    <div className="bg-slate-800 text-white p-3 sm:p-5 rounded-xl animate-fade-in-up mt-3 shadow-lg border border-slate-700">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">
                        <div className="bg-slate-900/50 p-2 sm:p-3 rounded-lg">
                          <div className="text-slate-400 text-[10px] mb-1">เวลาในอากาศ (t)</div>
                          <div className="font-bold text-sm sm:text-lg math-num text-amber-400">{totalTime.toFixed(2)} s</div>
                        </div>
                        <div className="bg-slate-900/50 p-2 sm:p-3 rounded-lg">
                          <div className="text-slate-400 text-[10px] mb-1">v ตอนกระทบพื้น</div>
                          <div className="font-bold text-sm sm:text-lg math-num text-indigo-400">{finalVelocity.toFixed(2)} m/s</div>
                        </div>
                        <div className="bg-slate-900/50 p-2 sm:p-3 rounded-lg">
                          <div className="text-slate-400 text-[10px] mb-1">การกระจัดลัพธ์</div>
                          <div className="font-bold text-sm sm:text-lg math-num text-cyan-400">{-safeH} m</div>
                        </div>
                        <div className="bg-slate-900/50 p-2 sm:p-3 rounded-lg">
                          <div className="text-slate-400 text-[10px] mb-1">ความสูงสูงสุด</div>
                          <div className="font-bold text-sm sm:text-lg math-num text-rose-400">{maxHeight.toFixed(2)} m</div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const TickerTapeSimulation = () => {
        const [bags, setBags] = useState(1);
        const [simState, setSimState] = useState('idle'); // idle, running, finished
        const [dotsVisible, setDotsVisible] = useState(0);
        const [ans, setAns] = useState({ sAC: '', vB: '', vD: '', a: '' });
        const [isSubmitted, setIsSubmitted] = useState(false);
        const animTimer = useRef(null);

        // คำนวณตำแหน่งจุด (เพื่อให้ตัวเลขสวยงาม จะกำหนดให้ a = 200*n cm/s^2)
        // ตำแหน่ง s = 0.5 * a * t^2 = 0.5 * (200n) * (0.01 * i^2) = n * i^2 cm.
        const positions = [
          0,                // A (t=0)
          bags * 1,         // B (t=0.1)
          bags * 4,         // C (t=0.2)
          bags * 9,         // D (t=0.3)
          bags * 16         // E (t=0.4)
        ];
        
        // คำตอบที่ถูกต้อง
        const correctAns = {
          sAC: bags * 4,
          vB: bags * 20,
          vD: bags * 60,
          a: bags * 200
        };

        const handlePlay = () => {
          setSimState('running');
          setDotsVisible(0);
          setIsSubmitted(false);
          setAns({ sAC: '', vB: '', vD: '', a: '' });
          
          let tick = 0;
          animTimer.current = setInterval(() => {
            setDotsVisible(tick);
            tick++;
            if (tick > 5) {
              clearInterval(animTimer.current);
              setSimState('finished');
            }
          }, 400); // พิมพ์จุดทุกๆ 0.4 วินาที (เพื่อให้เด็กเห็นภาพชัดเจน)
        };

        const handleReset = () => {
          clearInterval(animTimer.current);
          setSimState('idle');
          setDotsVisible(0);
          setIsSubmitted(false);
          setAns({ sAC: '', vB: '', vD: '', a: '' });
        };

        const handleBagChange = (n) => {
          setBags(n);
          handleReset();
        };

        const checkValue = (input, correct) => {
          return parseFloat(input) === correct;
        };

        return (
          <div className="bg-white p-6 rounded-3xl shadow-sm border border-indigo-50 mb-6">
            <div className="flex justify-between items-center mb-4 border-b pb-4">
              <h3 className="text-xl font-bold text-gray-800 flex items-center">
                <Icon name={icons.Stopwatch} className="text-purple-500 mr-2" size={20}/> 
                การทดลอง: เครื่องเคาะสัญญาณเวลา
              </h3>
            </div>

            <div className="bg-purple-50 p-4 rounded-xl border border-purple-100 mb-6">
              <h4 className="font-bold text-purple-800 mb-3 flex items-center">
                <Icon name={icons.Weight} size={16} className="mr-2"/> กำหนดจำนวนถุงทราย (ถุงละ 500 กรัม)
              </h4>
              <div className="flex space-x-2 mb-4">
                {[1, 2, 3, 4].map(n => (
                  <button 
                    key={n} 
                    onClick={() => handleBagChange(n)}
                    disabled={simState === 'running'}
                    className={`flex-1 py-3 rounded-lg border font-bold transition-all shadow-sm flex flex-col items-center
                      ${bags === n ? 'bg-purple-600 text-white border-purple-700 ring-2 ring-purple-300' : 'bg-white text-gray-600 hover:bg-gray-50'}`}
                  >
                    <span className="text-lg math-num">{n} ถุง</span>
                    <span className="text-xs opacity-80">({n*500}g)</span>
                  </button>
                ))}
              </div>

              <div className="flex justify-center space-x-4">
                <button onClick={handlePlay} disabled={simState === 'running'} className="px-8 py-3 bg-emerald-500 text-white rounded-full font-bold hover:bg-emerald-600 disabled:opacity-50 flex items-center transition-colors shadow-md">
                  <Icon name={icons.Play} size={18} className="mr-2" /> ดึงแถบกระดาษ
                </button>
                <button onClick={handleReset} className="px-6 py-3 bg-gray-200 text-gray-700 rounded-full font-bold hover:bg-gray-300 flex items-center transition-colors shadow-sm">
                  <Icon name={icons.RotateCcw} size={18} className="mr-2" /> รีเซ็ต
                </button>
              </div>
            </div>

            {/* Tape Visualizer */}
            <div className="relative w-full h-40 bg-gray-100 rounded-lg overflow-hidden border-2 border-gray-300 mb-6 shadow-inner flex flex-col justify-center px-4">
              {/* Paper Tape */}
              <div className="relative w-full h-12 bg-white/90 shadow-sm border border-gray-200 flex items-center overflow-visible">
                {['A', 'B', 'C', 'D', 'E'].map((label, idx) => {
                  const isVisible = simState === 'finished' || idx < dotsVisible;
                  const posPercent = (positions[idx] / 70) * 100; // max possible is 4*16 = 64, map to 70
                  return (
                    <div 
                      key={label}
                      className={`absolute flex flex-col items-center transition-opacity duration-300 ${isVisible ? 'opacity-100' : 'opacity-0'}`}
                      style={{ left: `${posPercent}%`, transform: 'translateX(-50%)' }}
                    >
                      <div className="w-2.5 h-2.5 bg-gray-800 rounded-full shadow-sm mb-1"></div>
                      {simState === 'finished' && (
                        <div className="absolute top-4 flex flex-col items-center">
                           <span className="text-sm font-bold text-purple-700">{label}</span>
                           <span className="text-xs font-semibold text-gray-500 math-num mt-1">{positions[idx]} cm</span>
                           <div className="w-[1px] h-3 bg-gray-400 mt-1"></div>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <div className="absolute top-4 left-4 text-xs font-bold text-gray-400 flex items-center">
                <Icon name={icons.Settings} size={12} className="mr-1 animate-spin-slow"/> เครื่องเคาะ 50Hz
              </div>
              {simState === 'finished' && (
                <div className="absolute bottom-2 left-0 w-full text-center text-sm font-bold text-indigo-600 animate-fade-in-up">
                  * เวลาระหว่างจุดแต่ละตัวอักษร (เช่น A ไป B) คือ <span className="math-num text-rose-600">0.1 s</span> (5 ช่วงจุด) *
                </div>
              )}
            </div>

            {/* Input Form */}
            {simState === 'finished' && (
              <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 animate-fade-in-up">
                <h4 className="font-bold text-slate-800 mb-4 flex items-center">
                  <Icon name={icons.PenTool} size={16} className="mr-2 text-rose-500"/> วิเคราะห์ผลการทดลอง
                </h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">1. ระยะกระจัด A ถึง C (<span className="math-text">s_AC</span>)</label>
                    <div className="relative">
                      <input 
                        type="number" value={ans.sAC} onChange={e => setAns({...ans, sAC: e.target.value})} disabled={isSubmitted}
                        className={`w-full p-3 rounded-xl border-2 font-bold math-num pr-12 focus:ring-2 focus:ring-purple-200 focus:outline-none transition-colors
                          ${isSubmitted ? (checkValue(ans.sAC, correctAns.sAC) ? 'border-emerald-400 bg-emerald-50' : 'border-rose-400 bg-rose-50') : 'border-gray-200 hover:border-purple-300'}`}
                        placeholder="ตอบเป็นตัวเลข..."
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-bold">cm</span>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">2. ความเร็วที่จุด B (<span className="math-text">v_B</span>)</label>
                    <div className="relative">
                      <input 
                        type="number" value={ans.vB} onChange={e => setAns({...ans, vB: e.target.value})} disabled={isSubmitted}
                        className={`w-full p-3 rounded-xl border-2 font-bold math-num pr-14 focus:ring-2 focus:ring-purple-200 focus:outline-none transition-colors
                          ${isSubmitted ? (checkValue(ans.vB, correctAns.vB) ? 'border-emerald-400 bg-emerald-50' : 'border-rose-400 bg-rose-50') : 'border-gray-200 hover:border-purple-300'}`}
                        placeholder="ตอบเป็นตัวเลข..."
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-bold">cm/s</span>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">3. ความเร็วที่จุด D (<span className="math-text">v_D</span>)</label>
                    <div className="relative">
                      <input 
                        type="number" value={ans.vD} onChange={e => setAns({...ans, vD: e.target.value})} disabled={isSubmitted}
                        className={`w-full p-3 rounded-xl border-2 font-bold math-num pr-14 focus:ring-2 focus:ring-purple-200 focus:outline-none transition-colors
                          ${isSubmitted ? (checkValue(ans.vD, correctAns.vD) ? 'border-emerald-400 bg-emerald-50' : 'border-rose-400 bg-rose-50') : 'border-gray-200 hover:border-purple-300'}`}
                        placeholder="ตอบเป็นตัวเลข..."
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-bold">cm/s</span>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">4. ความเร่งเฉลี่ย (<span className="math-text">a</span>)</label>
                    <div className="relative">
                      <input 
                        type="number" value={ans.a} onChange={e => setAns({...ans, a: e.target.value})} disabled={isSubmitted}
                        className={`w-full p-3 rounded-xl border-2 font-bold math-num pr-16 focus:ring-2 focus:ring-purple-200 focus:outline-none transition-colors
                          ${isSubmitted ? (checkValue(ans.a, correctAns.a) ? 'border-emerald-400 bg-emerald-50' : 'border-rose-400 bg-rose-50') : 'border-gray-200 hover:border-purple-300'}`}
                        placeholder="ตอบเป็นตัวเลข..."
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-bold">cm/s²</span>
                    </div>
                  </div>
                </div>

                {!isSubmitted ? (
                  <button onClick={() => setIsSubmitted(true)} className="w-full py-4 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold text-lg shadow-md transition-colors">
                    ส่งข้อมูล & ดูเฉลย
                  </button>
                ) : (
                  <div className="mt-6 bg-white p-6 rounded-xl border border-gray-200 shadow-sm animate-fade-in-up">
                    <h5 className="font-bold text-lg text-emerald-600 mb-4 border-b pb-2">เฉลยวิธีทำ (Solution)</h5>
                    <div className="space-y-4 text-sm md:text-base text-gray-700">
                      <p>
                        <span className="font-bold text-indigo-600">1. ระยะกระจัด A ถึง C:</span> <br/>
                        <span className="math-text bg-gray-50 px-2 rounded">s_AC = ตำแหน่ง C - ตำแหน่ง A = {positions[2]} - 0 = <span className="font-bold text-rose-600">{correctAns.sAC}</span> cm</span>
                      </p>
                      <p>
                        <span className="font-bold text-indigo-600">2. ความเร็วที่จุด B (จุดกึ่งกลางระหว่าง A และ C):</span> <br/>
                        ใช้สูตร <span className="math-text">v = s / t</span> โดยใช้ระยะคร่อมจุด B (คือ A ถึง C) <br/>
                        <span className="math-text bg-gray-50 px-2 rounded">v_B = s_AC / 0.2s = {correctAns.sAC} / 0.2 = <span className="font-bold text-rose-600">{correctAns.vB}</span> cm/s</span>
                      </p>
                      <p>
                        <span className="font-bold text-indigo-600">3. ความเร็วที่จุด D (จุดกึ่งกลางระหว่าง C และ E):</span> <br/>
                        ใช้ระยะคร่อมจุด D (คือ C ถึง E) ระยะกระจัด C ถึง E = {positions[4]} - {positions[2]} = {positions[4]-positions[2]} cm <br/>
                        <span className="math-text bg-gray-50 px-2 rounded">v_D = s_CE / 0.2s = {positions[4]-positions[2]} / 0.2 = <span className="font-bold text-rose-600">{correctAns.vD}</span> cm/s</span>
                      </p>
                      <p>
                        <span className="font-bold text-indigo-600">4. ความเร่งเฉลี่ย (a):</span> <br/>
                        หาจากความเร็วที่เปลี่ยนไปต่อช่วงเวลา จากจุด B ถึง D ใช้เวลา = 0.2 s (2 ช่วงจุดใหญ่) <br/>
                        <span className="math-text bg-gray-50 px-2 rounded">a = (v_D - v_B) / t = ({correctAns.vD} - {correctAns.vB}) / 0.2 = <span className="font-bold text-rose-600">{correctAns.a}</span> cm/s²</span>
                      </p>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      // --- New Graph Simulation Component ---
      const GraphSimulation = () => {
        const [graphType, setGraphType] = useState('st'); // st, vt, at
        const [maxTime, setMaxTime] = useState(12); // 6, 12, 18, 24
        const [dataCount, setDataCount] = useState(6); // 1 to 6 intervals
        const [yVals, setYVals] = useState(Array(7).fill('0')); // t=0 to t=6 (7 points)
        
        const [userAnsArea, setUserAnsArea] = useState('');
        const [userAnsSlope, setUserAnsSlope] = useState('');
        const [isSubmitted, setIsSubmitted] = useState(false);
        
        // Slope & Selection State
        const [showBestFit, setShowBestFit] = useState(true);
        const [selectedPts, setSelectedPts] = useState([]); // Up to 2 points for original data
        const [selectedSlopePts, setSelectedSlopePts] = useState([]); // Points on slope line
        const [draggingIdx, setDraggingIdx] = useState(null);
        const [dragHasMoved, setDragHasMoved] = useState(false);
        
        const svgRef = useRef(null);

        const dt = maxTime / 6;
        const pts = yVals.map(v => {
          let num = parseFloat(v);
          if (isNaN(num)) return 0;
          return Math.max(-10, Math.min(30, num)); // จำกัดช่วง -10 ถึง 30
        });

        // คำนวณคำตอบเป้าหมาย (Area แบบสี่เหลี่ยมคางหมู และ Slope แบบเส้นแนวโน้มผ่าน 0,0)
        const targetValues = useMemo(() => {
          let trapzArea = 0;
          let sumXY = 0;
          let sumXX = 0;
          
          for (let i = 0; i <= dataCount; i++) {
            const x = i * dt;
            const y = pts[i];
            sumXY += x * y;
            sumXX += x * x;
            if (i > 0) {
              trapzArea += 0.5 * (pts[i-1] + pts[i]) * dt;
            }
          }
          const bestFitSlope = sumXX === 0 ? 0 : sumXY / sumXX;
          
          return { area: trapzArea, slope: bestFitSlope, sumXY, sumXX };
        }, [pts, dataCount, dt]);

        const handleTypeChange = (type) => {
          setGraphType(type);
          setYVals(Array(7).fill('0'));
          setIsSubmitted(false);
          setUserAnsArea('');
          setUserAnsSlope('');
          setSelectedPts([]);
          setSelectedSlopePts([]);
          setShowBestFit(type === 'st' || type === 'vt');
        };

        const handleTimeChange = (t) => {
          setMaxTime(t);
          setIsSubmitted(false);
          setUserAnsArea('');
          setUserAnsSlope('');
          setSelectedSlopePts([]);
        };

        const handleDataCountChange = (val) => {
          setDataCount(val);
          setIsSubmitted(false);
          setUserAnsArea('');
          setUserAnsSlope('');
          setSelectedPts(prev => prev.filter(i => i <= val));
          setSelectedSlopePts(prev => prev.filter(i => i <= val));
        };

        const handleYChange = (idx, val) => {
          let newVals = [...yVals];
          newVals[idx] = val;
          setYVals(newVals);
          setIsSubmitted(false);
          setUserAnsArea('');
          setUserAnsSlope('');
        };

        const handleYBlur = (idx) => {
          let newVals = [...yVals];
          let num = parseFloat(newVals[idx]);
          if (isNaN(num)) num = 0;
          num = Math.max(-10, Math.min(30, num));
          newVals[idx] = num.toString();
          setYVals(newVals);
        };

        // Pointer Events สำหรับแยกแยะระหว่างการแตะ (Tap) กับการลาก (Drag) ของข้อมูลหลัก
        const handlePointerDown = (e, idx) => {
          if (idx > dataCount) return;
          setDraggingIdx(idx);
          setDragHasMoved(false);
          e.target.setPointerCapture(e.pointerId);
        };

        const handlePointerMove = (e) => {
          if (draggingIdx === null) return;
          setDragHasMoved(true);
          const svg = svgRef.current;
          if (!svg) return;
          const pt = svg.createSVGPoint();
          pt.x = e.clientX || (e.touches && e.touches[0].clientX);
          pt.y = e.clientY || (e.touches && e.touches[0].clientY);
          const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
          
          // แปลงพิกัด Y กลับเป็นค่า 30 ถึง -10 (Total range 40)
          const percent = ((svgH - padY) - svgP.y) / (svgH - 2 * padY);
          let val = -10 + percent * 40; 
          val = Math.max(-10, Math.min(30, Math.round(val)));
          
          if (yVals[draggingIdx] !== val.toString()) {
            let newVals = [...yVals];
            newVals[draggingIdx] = val.toString();
            setYVals(newVals);
            setIsSubmitted(false);
            setUserAnsArea('');
            setUserAnsSlope('');
          }
        };

        const handlePointerUp = (e, idx) => {
          if (draggingIdx !== null) {
            e.target.releasePointerCapture(e.pointerId);
            if (!dragHasMoved) {
              // นับเป็นการแตะ (Tap) เพื่อเลือกจุดแสดงพิกัดบนเส้นกราฟหลัก
              setSelectedPts(prev => {
                if (prev.includes(idx)) return prev.filter(i => i !== idx);
                if (prev.length >= 2) return [prev[1], idx]; 
                return [...prev, idx];
              });
            }
            setDraggingIdx(null);
          }
        };

        const handleSlopePtClick = (idx) => {
          setSelectedSlopePts(prev => {
            if (prev.includes(idx)) return prev.filter(i => i !== idx);
            if (prev.length >= 2) return [prev[1], idx];
            return [...prev, idx];
          });
        };

        // --- Component ย่อยสำหรับจัดเรียงสมการเศษส่วน ---
        const MathFraction = ({ top, bottom }) => (
          <span className="inline-flex flex-col items-center justify-center align-middle mx-2 text-[1.1em] font-bold">
            <span className="border-b-2 border-current px-2 pb-[2px] mb-[2px] leading-none text-center min-w-[30px]">{top}</span>
            <span className="px-2 leading-none pt-[2px] text-center min-w-[30px]">{bottom}</span>
          </span>
        );

        // --- SVG Drawing Logic ---
        const svgW = 600;
        const svgH = 300;
        const padX = 40;
        const padY = 30;
        const mapX = (i) => padX + (i / 6) * (svgW - 2 * padX);
        const mapY = (val) => {
          const percent = (val - (-10)) / 40; // Min -10, Max 30
          return (svgH - padY) - percent * (svgH - 2 * padY);
        };
        
        // ลากเส้นกราฟเฉพาะถึง dataCount ที่เปิดใช้
        const pathD = pts.slice(0, dataCount + 1).map((val, i) => `${i === 0 ? 'M' : 'L'} ${mapX(i)} ${mapY(val)}`).join(' ');

        let themeColors = { bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', stroke: '#10b981', fill: '#f59e0b', unitY: 'm' };
        if (graphType === 'vt') themeColors = { bg: 'bg-indigo-50', border: 'border-indigo-200', text: 'text-indigo-700', stroke: '#6366f1', fill: '#f59e0b', unitY: 'm/s' };
        if (graphType === 'at') themeColors = { bg: 'bg-rose-50', border: 'border-rose-200', text: 'text-rose-700', stroke: '#f43f5e', fill: '#f59e0b', unitY: 'm/s²' };

        const yLabels = [30, 25, 20, 15, 10, 5, 0, -5, -10];

        return (
          <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-6">
            <div className="flex justify-between items-center mb-4 border-b pb-4">
              <h3 className="text-xl font-bold text-gray-800 flex items-center">
                <Icon name={icons.ChartLine} className={`${themeColors.text} mr-2`} size={20}/> 
                การทดลอง: วิเคราะห์กราฟการเคลื่อนที่
              </h3>
            </div>

            <div className={`p-4 sm:p-5 rounded-xl border ${themeColors.border} ${themeColors.bg} mb-6 transition-colors duration-300`}>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                  <h4 className="font-bold text-gray-700 mb-3 text-sm">1. เลือกชนิดของกราฟ</h4>
                  <div className="flex space-x-2">
                    <button onClick={() => handleTypeChange('st')} className={`flex-1 py-2 rounded-lg font-bold border transition-colors text-sm ${graphType === 'st' ? 'bg-emerald-500 text-white border-emerald-600 shadow-sm' : 'bg-white text-gray-500 hover:bg-gray-50'}`}>s-t</button>
                    <button onClick={() => handleTypeChange('vt')} className={`flex-1 py-2 rounded-lg font-bold border transition-colors text-sm ${graphType === 'vt' ? 'bg-indigo-500 text-white border-indigo-600 shadow-sm' : 'bg-white text-gray-500 hover:bg-gray-50'}`}>v-t</button>
                    <button onClick={() => handleTypeChange('at')} className={`flex-1 py-2 rounded-lg font-bold border transition-colors text-sm ${graphType === 'at' ? 'bg-rose-500 text-white border-rose-600 shadow-sm' : 'bg-white text-gray-500 hover:bg-gray-50'}`}>a-t</button>
                  </div>
                </div>
                <div>
                  <h4 className="font-bold text-gray-700 mb-3 text-sm">2. เวลา t (s) สูงสุดในกราฟ</h4>
                  <div className="flex space-x-2">
                    {[6, 12, 18, 24].map(t => (
                      <button key={t} onClick={() => handleTimeChange(t)} className={`flex-1 py-2 rounded-lg font-bold border math-num transition-colors text-sm ${maxTime === t ? 'bg-slate-700 text-white border-slate-800 shadow-sm' : 'bg-white text-gray-500 hover:bg-gray-50'}`}>
                        {t}
                      </button>
                    ))}
                  </div>
                </div>
                <div>
                  <h4 className="font-bold text-gray-700 mb-3 text-sm">3. เปิดข้อมูลกี่ช่วง? (ตัดจุดที่เกิน)</h4>
                  <div className="flex items-center space-x-3 bg-white p-1 rounded-lg border border-gray-200 w-max">
                     <button onClick={() => handleDataCountChange(Math.max(1, dataCount - 1))} className="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded text-gray-700 font-bold transition-colors">-</button>
                     <span className="font-bold text-lg math-num min-w-[20px] text-center text-indigo-700">{dataCount}</span>
                     <button onClick={() => handleDataCountChange(Math.min(6, dataCount + 1))} className="w-8 h-8 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded text-gray-700 font-bold transition-colors">+</button>
                  </div>
                </div>
              </div>
              
              {(graphType === 'st' || graphType === 'vt') && (
                <div className="mt-5 flex flex-wrap items-center gap-3">
                  <label className="flex items-center space-x-2 cursor-pointer w-max bg-white/60 px-3 py-1.5 rounded-lg border border-white shadow-sm hover:bg-white transition-colors">
                    <input type="checkbox" checked={showBestFit} onChange={e => {
                        setShowBestFit(e.target.checked);
                        if(!e.target.checked) setSelectedSlopePts([]);
                    }} className="w-5 h-5 rounded text-rose-500 focus:ring-rose-500"/>
                    <span className="text-sm font-bold text-gray-700">แสดงเส้นความชัน (ตัดจุด 0,0)</span>
                  </label>
                  <span className="text-xs text-rose-500 font-semibold bg-white/60 px-3 py-1.5 rounded-lg shadow-sm">
                    <Icon name="fa-hand-pointer" size={12} className="mr-1"/> แตะจุด <strong className="text-rose-600">สีแดง</strong> บนเส้นประความชันเพื่อดูพิกัด 
                  </span>
                </div>
              )}
            </div>

            <div className="mb-6">
              <div className="grid grid-cols-4 md:grid-cols-7 gap-2">
                {[0, 1, 2, 3, 4, 5, 6].map(i => {
                  const isActive = i <= dataCount;
                  return (
                    <div key={i} className={`p-2 rounded-lg border text-center shadow-sm transition-all ${isActive ? 'bg-slate-50 border-slate-200 opacity-100' : 'bg-gray-100 border-gray-200 opacity-40 grayscale pointer-events-none'}`}>
                      <div className="text-xs text-gray-500 mb-1 font-bold">t = {i * dt}</div>
                      <input 
                        type="number" max="30" min="-10" 
                        value={yVals[i]} 
                        onChange={e => handleYChange(i, e.target.value)}
                        onBlur={() => handleYBlur(i)}
                        disabled={!isActive}
                        className="w-full text-center border-b-2 border-gray-300 focus:border-blue-500 bg-transparent font-bold math-num outline-none transition-colors"
                      />
                    </div>
                  )
                })}
              </div>
            </div>

            {/* SVG Graph rendering */}
            <div className="w-full bg-white border-2 border-slate-100 rounded-xl overflow-hidden mb-6 shadow-sm relative touch-none select-none">
              <svg viewBox="0 0 600 300" className="w-full h-auto drop-shadow-sm" ref={svgRef}>
                {/* Horizontal Grid lines (yLabels = 30 to -10 step 5) */}
                {yLabels.map(y => (
                  <line 
                    key={`hy-${y}`} 
                    x1={padX} y1={mapY(y)} 
                    x2={svgW - padX} y2={mapY(y)} 
                    stroke={y === 0 ? "#64748b" : (y % 10 === 0 ? "#cbd5e1" : "#f1f5f9")} 
                    strokeWidth={y === 0 ? "2" : "1"} 
                    strokeDasharray={y === 0 ? "none" : (y % 10 === 0 ? "4 4" : "2 4")} 
                  />
                ))}
                
                {/* Vertical Grid lines */}
                {[0, 1, 2, 3, 4, 5, 6].map(i => (
                  <line key={`vx-${i}`} x1={mapX(i)} y1={padY} x2={mapX(i)} y2={svgH - padY} stroke="#e2e8f0" strokeWidth="1" strokeDasharray="4 4" />
                ))}

                {/* Y-axis Labels */}
                {yLabels.map(y => (
                  <text key={`ty-${y}`} x={padX - 8} y={mapY(y)} fontSize="10" fill={y === 0 ? "#334155" : "#64748b"} textAnchor="end" alignmentBaseline="middle" className="math-num font-bold">{y}</text>
                ))}
                <text x={padX - 8} y={padY - 10} fontSize="12" fill="#334155" textAnchor="end" className="font-bold">{themeColors.unitY}</text>

                {/* X-axis Labels */}
                {[0, 1, 2, 3, 4, 5, 6].map(i => (
                  <text key={`tx-${i}`} x={mapX(i)} y={svgH - padY + 20} fontSize="12" fill="#64748b" textAnchor="middle" className="math-num font-bold">{i*dt}</text>
                ))}
                <text x={svgW - padX + 20} y={svgH / 2 - 10} fontSize="12" fill="#334155" textAnchor="start" className="font-bold">t(s)</text>

                {/* Coordinate Highlighters for Selected Data Points */}
                {selectedPts.map(idx => {
                  if (idx > dataCount) return null;
                  const px = mapX(idx);
                  const py = mapY(pts[idx]);
                  const originY = mapY(0);
                  const originX = mapX(0);
                  return (
                    <g key={`coord-${idx}`}>
                      <line x1={px} y1={py} x2={px} y2={originY} stroke="#f43f5e" strokeWidth="1.5" strokeDasharray="4 2" opacity="0.6"/>
                      <line x1={px} y1={py} x2={originX} y2={py} stroke="#f43f5e" strokeWidth="1.5" strokeDasharray="4 2" opacity="0.6"/>
                      <rect x={px - 25} y={py - 26} width="50" height="16" fill="white" stroke="#f43f5e" strokeWidth="1" rx="4" />
                      <text x={px} y={py - 14} fontSize="10" fill="#e11d48" textAnchor="middle" className="math-num font-bold">({idx * dt}, {pts[idx]})</text>
                    </g>
                  );
                })}

                {/* Main Graph Path */}
                <path d={pathD} fill="none" stroke={themeColors.stroke} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />

                {/* Draggable Data Points */}
                {pts.map((p, i) => {
                  if (i > dataCount) return null;
                  const isSelected = selectedPts.includes(i);
                  return (
                    <circle 
                      key={`pt-${i}`} 
                      cx={mapX(i)} cy={mapY(p)} 
                      r={isSelected ? "6" : "4.5"} 
                      fill={themeColors.fill} 
                      stroke={isSelected ? "#ef4444" : "#ffffff"} 
                      strokeWidth={isSelected ? "2.5" : "2"}
                      className={`transition-all hover:r-6 cursor-pointer`}
                      onPointerDown={(e) => handlePointerDown(e, i)}
                      onPointerMove={handlePointerMove}
                      onPointerUp={(e) => handlePointerUp(e, i)}
                      onPointerLeave={(e) => handlePointerUp(e, i)}
                      onTouchStart={(e) => handlePointerDown(e, i)}
                      onTouchMove={handlePointerMove}
                      onTouchEnd={(e) => handlePointerUp(e, i)}
                    />
                  )
                })}

                {/* Slope Line & Interactive Points (Rendered on top for easier clicking) */}
                {showBestFit && (graphType === 'st' || graphType === 'vt') && dataCount > 0 && (
                  <g>
                    {/* Slope Red Dashed Line */}
                    <line 
                      x1={mapX(0)} y1={mapY(0)}
                      x2={mapX(dataCount)} y2={mapY(targetValues.slope * dataCount * dt)}
                      stroke="#ef4444" strokeWidth="2.5" strokeDasharray="6 4" opacity="0.8"
                      className="pointer-events-none"
                    />
                    
                    {/* Interactive points on the slope line */}
                    {Array.from({length: dataCount + 1}).map((_, i) => {
                      const ptX = mapX(i);
                      const valY = targetValues.slope * i * dt;
                      const ptY = mapY(valY);
                      const isSelected = selectedSlopePts.includes(i);
                      return (
                        <g key={`slope-pt-group-${i}`}>
                          {isSelected && (
                            <g>
                              <line x1={ptX} y1={ptY} x2={ptX} y2={mapY(0)} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4 2" opacity="0.8"/>

                        <span className="text-lg math-num">{opt}</span>
                        {isAnswered && idx === q.answer && <Icon name={icons.CheckCircle} size={20} className="text-emerald-500" />}
                        {isAnswered && idx === selectedAnswer && idx !== q.answer && <Icon name={icons.XCircle} size={20} className="text-rose-500" />}
                      </div>
                    </button>
                  );
                })}
              </div>

              {isAnswered && (
                <div className="mt-8 animate-fade-in-up">
                  <div className="bg-indigo-50/80 p-5 rounded-2xl border border-indigo-100 mb-6 text-indigo-900">
                    <span className="font-bold flex items-center mb-2"><Icon name={icons.BookOpen} size={18} className="mr-2"/> คำอธิบาย:</span>
                    <div className="text-sm sm:text-base opacity-90 leading-relaxed">{q.explanation}</div>
                  </div>

                  <button onClick={nextQuestion} className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-lg shadow-md flex justify-center items-center transition-colors">
                    {currentQuestionIdx + 1 < testData.length ? 'ข้อถัดไป' : 'ดูผลคะแนน'} <Icon name={icons.ChevronRight} size={20} className="ml-2" />
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      };

      const renderResult = () => {
        const percentage = (score / testData.length) * 100;
        let message = ""; let colorClass = "";
        if (percentage >= 80) { message = "ยอดเยี่ยมมาก! อนาคตนักฟิสิกส์"; colorClass = "text-emerald-500"; }
        else if (percentage >= 50) { message = "ทำได้ดี! ฝึกอีกนิดจะเก่งขึ้นแน่นอน"; colorClass = "text-amber-500"; }
        else { message = "พยายามเข้านะ! ทบทวนบทเรียนอีกรอบ"; colorClass = "text-rose-500"; }

        return (
          <div className="min-h-screen bg-slate-50 p-6 flex flex-col items-center justify-center">
            <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl text-center">
              <div className="w-32 h-32 mx-auto bg-gray-50 rounded-full flex items-center justify-center border-4 border-dashed border-gray-200 mb-6 relative">
                 <div className="absolute inset-0 rounded-full border-4 border-indigo-500" style={{ clipPath: `polygon(0 0, 100% 0, 100% ${percentage}%, 0 ${percentage}%)`, opacity: 0.2 }}></div>
                 <div className={`text-4xl font-bold math-num ${colorClass}`}>{score}<span className="text-xl text-gray-400">/{testData.length}</span></div>
              </div>
              
              <h2 className={`text-2xl font-bold mb-2 ${colorClass}`}>{message}</h2>
              <p className="text-gray-500 mb-8">ระดับ: <span className="font-semibold uppercase">{testConfig.difficulty}</span></p>

              <div className="space-y-3">
                <button onClick={startTest} className="w-full py-4 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-2xl font-bold transition-colors flex justify-center items-center">
                  <Icon name={icons.RotateCcw} size={20} className="mr-2" /> ลองทำใหม่อีกครั้ง
                </button>
                <button onClick={() => setCurrentScreen('home')} className="w-full py-4 bg-indigo-600 text-white hover:bg-indigo-700 rounded-2xl font-bold shadow-md transition-colors flex justify-center items-center">
                  <Icon name={icons.Home} size={20} className="mr-2" /> กลับหน้าหลัก
                </button>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="antialiased font-thai selection:bg-indigo-200 selection:text-indigo-900">
          {currentScreen === 'home' && renderHome()}
          {currentScreen === 'learn' && renderLearn()}
          {currentScreen === 'setupTest' && renderTestSetup()}
          {currentScreen === 'testing' && renderTesting()}
          {currentScreen === 'result' && renderResult()}
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
